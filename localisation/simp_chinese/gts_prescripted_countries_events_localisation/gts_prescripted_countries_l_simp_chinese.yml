  gts_prescripted_countries.2.name:"穴中殖民"
  gts_prescripted_countries.2.desc:"天外少女悦耳的声音响起，众多殖民舰舰首纷纷亮起一盏巨大的红色警示灯，在人群的注视中舰队轰鸣着启航径直冲向苍穹上愈发粉嫩的裂隙。与此同时，两根巨大的指柱从天外分别降临在裂隙的两侧。随着指柱缓缓用力，裂隙稳稳地被撑开，露出宛若宇宙空洞般的深渊以及深渊四周如波涛般有节奏涌动红色世界。一股浓郁的少女气息笼罩着整个舰队，每个人都如受天恩般嗅着在未来人生中无时无刻都能闻到的气味。 "这里可是人家最宝贵的地方哦，还没有给人寄生过呢~”少女的语气中带有一丝炫耀的意味，看着白色桌台上一缕缕闪着红光的粉尘飘向自己粉嫩柔软的私处，可爱娇美的面庞上爬满了红晕。待红色粉尘全部没入穴内，少女轻轻松开撑住阴户的两根手指，两次外翻的嫩肉顷刻间收缩于内。 上百艘殖民舰于星系尺寸般肉色环穴中呈网状部署，舰载ai通过扫描褶皱山脉走向为每一艘舰船分析出安全的预定点位。伴随着飞船的不断降落，穴内世界的空气中逐渐变得湿润。少女感受着下体中越来越明显的脉络不禁微微湿润，她知道这是那些小家伙开始建立城市的信号。但对于殖民者而言这还远远不够，旗舰深入穴内直抵宫颈上空。"
  gts_prescripted_countries.2.a:"真是浓郁的雌香啊"
  gts_prescripted_countries.2.b:"在女神的圣域里，我们意识到自身的微小"
  gts_prescripted_countries.2.c:"那些安全点位也不一定安全（）"
  gts_prescripted_countries.2.d:""
  gts_prescripted_countries.2.a.custom_tooltip:"少女的气息"
  gts_prescripted_countries.2.b.custom_tooltip:"巨大的褶皱是安全的庇护所"
  gts_prescripted_countries.2.c.custom_tooltip:"快速建造的传统有助于使我们更快在巨娘体内扎根"
