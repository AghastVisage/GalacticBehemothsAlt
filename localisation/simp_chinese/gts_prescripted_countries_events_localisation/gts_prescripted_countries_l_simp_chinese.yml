  gts_prescripted_countries.3.name:"溢爱仪式"
  gts_prescripted_countries.3.desc:"根据两国之间的协议：护理契约国为对方个体提供第一次高潮的刺激，这代表着个体的成年；对方个体为契约国提供温暖适宜的部位进行居住繁衍。 这是自远古的契约，也是契约国的起源。 当舰首无数激光亮起，旗舰展开对宫颈口的轰炸。渗出爱液微微抽动的宫颈口上绽放出一朵朵微不足道的蘑菇云，随着轰炸的继续宫颈抽动的频率逐渐提高，似乎有恐怖的力量在其中积蓄。少女双腿微微夹紧正细细感受着肉壁上一层层微弱的脉动，最深处的花蕊突然发出密集的刺激信号。一股突如其来的快感瞬间激活穴内全部软肉，那种直通神经的舒爽快感令她沉迷，忍不住狠狠将肉穴收缩。此时她发现即使完全收缩依旧能感受到小人城市的脉络，对于小人而言褶皱边收缩后的空隙依旧十分的宽阔广袤，十分安全。不经意间一枚鱼雷从宫颈口投入进子宫，少女便再也忍不住了。宫颈瞬间绷直，粘稠清澈的爱液浩荡天洪一般喷涌而出，将一些选址并不可靠的星舰城市冲起混杂其中搅碎，涤荡肉穴后从阴户冲出在打湿少女的大腿后溅射到光洁的地板上。待到宫颈安定下来，旗舰稳稳落在其上，以保证在不断的刺激下爱液如江河般潺潺不绝，流向世间万邦。"
  gts_prescripted_countries.3.a:"由此可见，女神的每一次高潮都会使我们迎来人口爆发式的增长"
  gts_prescripted_countries.3.b:"用女神的爱液进行水培种植收成一定不错！"
  gts_prescripted_countries.3.c:"至少在未来的一段时间内我们不会再为巨娘体液发愁了...."
  gts_prescripted_countries.3.d:""
  gts_prescripted_countries.3.a.custom_tooltip:"人们在爱液的洗礼中沦为寻求性爱的野兽..."
  gts_prescripted_countries.3.b.custom_tooltip:"真是片柔嫩肥沃的大地。"
  gts_prescripted_countries.3.c.custom_tooltip:"一天三餐都有饮品了！"
