  gts_prescripted_countries_modifier_3_c:""

  gts_prescripted_countries.4.name:"满载而归"
  gts_prescripted_countries.4.desc:"少女扶着一旁洁白的桌台单手轻柔抚摸着熙熙攘攘的小腹，灵动的目光中多出一丝妩媚。在经历过第一次高潮，在种族传统中意味着正式成年。“小家伙们要在里面好好生活辛勤劳作哦~”感受着穴中不间断的舒爽，忍不住用柔嫩的穴肉摩擦吮吸着其中的城市。少女红着面颊将腿上充满新鲜雌香的液体擦拭干净，带着腔室内归属于她的上亿子民迈着盈盈步伐款款离开。 这空旷的房间，等待着下一个签订契约的少女。"
  gts_prescripted_countries.4.a:"挤压摩擦吮吸城市的软肉无时无刻提醒我们认清自己的地位"
  gts_prescripted_countries.4.b:"从宫颈中持续不断溢出的爱液使水利发电和以巨娘爱液作为燃料驱动的机械得到了长足发展。"
  gts_prescripted_countries.4.c:"如此巨大的生物因我们的存在而感到高潮，真令人自豪！"
  gts_prescripted_countries.4.d:""
  gts_prescripted_countries.4.a.custom_tooltip:"除了侍奉女神的圣穴一切别无意义"
  gts_prescripted_countries.4.b.custom_tooltip:"你随时可以在自己的阳台上看到粘腻的丝线"
  gts_prescripted_countries.4.c.custom_tooltip:"看着鼓动的穴道，一切付出都有意义"
