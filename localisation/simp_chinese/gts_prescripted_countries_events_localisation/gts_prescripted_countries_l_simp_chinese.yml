  gts_prescripted_countries.1.name:"契约签订"
  gts_prescripted_countries.1.desc:"无尽苍茫的白色平原上，数百艘巨大的殖民舰整装待发，密密麻麻的人群登上星舰即将踏上前往新世界的旅程。 “高贵的女神，根据两国间的协议，契约已经生效。感谢您的包容与恩赐往后无尽的岁月中我国国民将世世代代居住在您圣洁温润的穴道世界之中并无时无刻清洁护理您美丽的圣域。” “请不要再说这么让人难为情的话了......”轻灵悦耳的童音自苍穹传荡，殖民舰中的人们纷纷透过舷窗眺望天际，那被被云雾遮挡的天外世界透出一丝细腻的红润，隐约间可以看出玉柱般的轮廓以及更高处遮盖了大半个天穹的粉嫩裂隙。 空旷的房间内，略显幼态的少女赤裸身体站在不足大腿高的洁白桌台前，映射着一份契约的全息投影在面前烁灭，光洁如玉的脚趾在地面上不安的搓动着。尽管略显害羞与局促，但是少女明白这是族群中每个成熟个体都要完成的成年礼。环抱在胸前的双臂缓缓垂下，双手的食指不约而同的探向身下。 ”小人先生们，可以进来了哦~“"
  gts_prescripted_countries.1.a:"我们别无选择"
  gts_prescripted_countries.1.b:"真是宏伟美丽的温柔女神啊"
  gts_prescripted_countries.1.c:"小人与巨娘和平共处！"
  gts_prescripted_countries.1.d:""
  gts_prescripted_countries.1.a.custom_tooltip:"我们无法违背契约"
  gts_prescripted_countries.1.b.custom_tooltip:"巨大的幸运"
  gts_prescripted_countries.1.c.custom_tooltip:"愿上天祝福我们世世代代和睦共处"
