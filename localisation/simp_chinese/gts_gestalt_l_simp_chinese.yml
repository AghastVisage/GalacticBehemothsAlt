l_simp_chinese:
 civic_gts_gestalt_giantess: "巨构意识"
 civic_gts_gestalt_giantess_desc: "同一个意志在庞大的躯体之间流动。无论依靠神经网络还是机械中枢，巨型子个体都能将微观世界纳入整体的生产体系。"
 civic_gts_gestalt_giantess_effects: "主体物种以§Y巨娘体型§!开局。\n使用适合蜂巢或机械智能的子个体岗位，生产缩小人口、微型城市和微型星球。\n与§Y微观意识§!互斥。"
 civic_gts_gestalt_tiny: "微观意识"
 civic_gts_gestalt_tiny_desc: "无数微小的个体共同感知一个辽阔的世界。意识网络将散布各处的采集、研究和生产活动组织起来，建立跨越体型差距的文明。"
 civic_gts_gestalt_tiny_effects: "主体物种以§Y小人体型§!开局。\n使用适合蜂巢或机械智能的子个体岗位，开发小人帝国的三类特殊资源。\n与§Y巨构意识§!互斥。"
