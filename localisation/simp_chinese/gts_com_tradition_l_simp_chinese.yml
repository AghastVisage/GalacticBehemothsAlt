l_simp_chinese:

  ################################################################################
  #####################                通用传统                #####################
  ################################################################################

  tradition_gts_shrink: "缩小"
  tradition_gts_shrink_desc: "成为巨娘的入门课"
  tr_gts_shrink_adopt: "缩小传统"
  tr_gts_shrink_adopt_desc: "解锁一系列巨娘资源的生产与使用科技"
  tr_gts_shrink_finish: "完成缩小传统"
  tr_gts_shrink_finish_desc: ""
  tr_gts_shrink_1: "推广缩小产品"
  tr_gts_shrink_1_desc: "小人产品已经彻底融入了我们的日常生活。无论是繁华的都市中心还是偏远的乡村小镇，到处都能看到贩卖各种各样小人商品的店铺。超市的货架上摆满了装在透明盒子里的小人零食，街角的自动贩卖机里塞满了可以随手购买的小人城市。这些微小的生命被当作日用品一样流通着，它们的存在提醒着整个银河系谁才是真正的统治者。当外交使节看到我们帝国中连最普通的家庭主妇都能随意玩弄着小人城市时，立刻就明白了与我们为敌的后果。\n\n§G外交权重+5%\n每月$trade$+10%§!"
  tr_gts_shrink_2: "沉迷小人"
  tr_gts_shrink_2_desc: "我们的社会已经彻底爱上了这些微小的活体玩具，甚至到了茶不思饭不想的地步。巨娘们每天最期待的事情，就是回家后打开一盒新鲜的小人，把它们倒在身上享受那微弱的骚痒感，或是随手抓起一把当作下午茶点心。从星球跳蛋到趾缝清洁小人，这些微小生命渗透到了生活的方方面面。如果有一天失去了小人供应，整座城市的巨娘都会感到无精打采，我们的社会经济早已与这些小小的生命紧紧绑定在一起，无法分离。\n\n§G外交权重+5%\n每月$trade$+10%§!"
  tr_gts_shrink_3: "小人管理"
  tr_gts_shrink_3_desc: "对小人的使用训练必须从娃娃抓起。在幼儿园里，老师们会亲手发给每个巨娘小朋友一盒活生生的小人，教导她们如何用手指轻轻捏起这些脆弱的小家伙，以及如何在踩踏时控制力道，避免一不小心就把心爱的玩具踩成稀烂的肉泥。孩子们在游戏中学会了支配与蹂躏的基础技巧，这不仅能培养她们身为庞大种族的自信心，也让她们从小就明白，这些微小的生命只不过是供自己取乐与使用的附庸罢了，无需任何负罪感。\n\n§G每月$gts_micro$+20%§!\n\n§Y获得相关科技的研发选项§!"
  tr_gts_shrink_4: "城市管理"
  tr_gts_shrink_4_desc: "到了中学阶段，《小人城市管理》成为了所有巨娘学生的必修课程。学校会为每个人发放一座装满小人的微缩城市，学生们需要透过亲手掌管这座城市来锻炼领导能力。你可以选择温和地给予奖励，也可以选择在心情不好时一脚把整个商业区踩成平地，看看小人们在绝望中挣扎求生的模样。这种近乎神明一般的掌控体验，能极大地锻炼巨娘们的性格与果断作风，为未来管理真正的国家与星系打下坚实基础。\n\n§G每月$gts_micro_city$+20%§!\n\n§Y获得相关科技的研发选项§!"
  tr_gts_shrink_5: "星球管理"
  tr_gts_shrink_5_desc: "进入大学后，课程的尺度被提升到了整颗星球。不论学习什么专业，巨娘学生们都必须掌握《小人星球管理》这门终极学问。每位学生都会分到一颗捧在手心里的微型星球，上面栖息着数十亿微小的生命。学生们可以随意把它们当作跳蛋塞进小穴，或是用舌头舔舐地表的大陆。在极致的体型差距面前，如何随心所欲地玩弄一整座文明而不将其彻底毁灭，成为了检验一位巨娘是否真正成熟并具备高等统治力的关键标准。\n\n§G每月$gts_micro_planet$+20%§!\n\n§Y获得相关科技的研发选项§!"
  tradition_gts_survive: "求生"
  tradition_gts_survive_desc: "成为小人的入门课"
  tr_gts_survive_adopt: "求生传统"
  tr_gts_survive_adopt_desc: "解锁一系列小人资源的生产与使用科技"
  tr_gts_survive_finish: "完成求生传统"
  tr_gts_survive_finish_desc: ""
  tr_gts_survive_1: "推广巨娘产品"
  tr_gts_survive_1_desc: "对于渺小的人类与小人种族来说，巨娘随意流下的一滴体液就是无尽的宝藏。巨娘汗水、唾液与爱液中所蕴含的能量与养分，远远超越了常规的自然资源。仅仅是一滴巨娘足汗，经过精炼后就足以供应一座庞大小人城市运行数年。透过大力推广与开发各类巨娘体液衍生产品，小人社会建立起了独特而高效的资源体系。\n\n§G外交权重+5%\n每月$trade$+10%§!"
  tr_gts_survive_2: "巨娘崇拜"
  tr_gts_survive_2_desc: "当天空被巨娘庞大的身躯遮蔽，当她的每一次落脚都能引发毁灭性的大地震时，恐惧最终转化为了无比虔诚的崇拜。小人们开始将这些遮天蔽日的庞然大物奉为活生生的神明。我们为她们建立神庙，膜拜她们踩下的巨大足印，甚至将能够被她们的鞋底踩碎视为一种至高无上的恩赐。这种崇拜深入到了文化的核心，让我们学会了在神明脚下谦卑地生存，并在绝望的体型差距中找到了属于小人的心灵寄托与生存之道。\n\n§G外交权重+5%\n主流思潮吸引力+25%§!"
  tr_gts_survive_3: "体液入门"
  tr_gts_survive_3_desc: "在这个危机四伏的世界里，辨识并处理巨娘的分泌物是每个小人必须掌握的生存基本功。课堂上会详细教授各种体液的气味、粘性与危险程度。从汗水到爱液，再到致命的尿液洪水，小人们必须清楚知道何时该迅速躲避，何时可以上前开采。掌握这些知识不仅能让你在天降体液洪流时及时逃生，还能让你从这些浓烈的液体中获取宝贵的生存物资，大大增加了在巨娘世界中的存活概率。\n\n§G每月$gts_giantess_fluid$+20%§!\n\n§Y获得相关科技的研发选项§!"
  tr_gts_survive_4: "巨娘衣物寄居"
  tr_gts_survive_4_desc: "巨娘随手脱下并丢弃的鞋子、袜子与内裤，对于渺小的我们而言就是天然的山脉与庇护所。这些衣物的庞大纤维交织成错综复杂的迷宫，内部积聚着丰富的足垢与盐分结晶。小人们发明了专门的建筑与开采技术，直接在袜底的毛球深处或是鞋垫的盆地中建立城镇。虽然这里充满了令人窒息的浓烈气味与随时被巨足重新穿上压扁的风险，但只要掌握了寄居的技巧，这里就是最肥沃且物资充沛的避难天堂，让文明得以延续。\n\n§G每月$gts_giantess_underwear$+20%§!\n\n§Y获得相关科技的研发选项§!"
  tr_gts_survive_5: "与她们交流"
  tr_gts_survive_5_desc: "尽管在巨娘眼中我们可能比灰尘还要微不足道，但如果能成功与她们建立起交流，结果将会完全不同。小人们开发出了专门的大功率扩音设备与信号器，尝试向天空中那巨大的双耳传递我们的声音。幸运的话，当巨娘注意到脚下这群会说话的可爱小东西时，她可能会停下准备踩下的巨足，甚至把你当作珍贵的宠物捡起来放在掌心呵护。\n\n§G每月$gts_giantess_human$+20%§!\n\n§Y获得相关科技的研发选项§!"

  tradition_gts_godkeeper: "化龙"
  tradition_gts_godkeeper_desc: "死亡与毁灭并不悲哀，旧世界的废墟上会生出新芽。真正的悲哀是困顿无变，看着世界在无止境的内耗中沉默消亡。"
  tr_gts_godkeeper_adopt: "化龙传统"
  tr_gts_godkeeper_adopt_desc: "解锁一系列与犽戎有关的行星决议与特质，略微增加产出\n\n§G领袖维护费-10%§!\n\n§Y在完成传统后将会解锁十二作福音构赦免苦弱”§!"
  tr_gts_godkeeper_adopt_fail_customtootip: "需要§P犽戎§!的好感度达到§G40§!以上并解锁§G4§!个飞升天赋之后才可选择该传统"
  tr_gts_godkeeper_finish: "完成化龙传统"
  tr_gts_godkeeper_finish_desc: ""
  tr_gts_godkeeper_1: "视龙为神"
  tr_gts_godkeeper_1_desc: "我以我的骨血献给伟大的神主，她是我族的母亲与救世主\n\n§Y解锁前超光速文明外交决议“视龙为神”§!"
  tr_gts_godkeeper_2: "龙化改造"
  tr_gts_godkeeper_2_desc: "我们将拆解自己的躯体，沥干自己的血液，重塑与我们的神主直到一致……虽然这不过是卑劣的伪造n\n§G§!获得2点生物基因点\n\n§Y解锁种族高级特质§!"
  tr_gts_godkeeper_3: "望龙恩赐"
  tr_gts_godkeeper_3_desc: "神主从不介意降下她的恩赐，无论是以母亲还是神明的身份。\n\n§Y解锁行星决议"吞噬星球","龙血奔涌","净化异端"§!"
  tr_gts_godkeeper_4: "亵渎研究"
  tr_gts_godkeeper_4_desc: "即便是神主与皇帝的认可，这样的行为依旧亵渎……但这样的幼龙，是最接近神主的存在.\n\n§Y解锁恒星基地建筑［巨龙复制仓］,解锁太空生物养殖［痴愚金龙］§!"
  tr_gts_godkeeper_5: "体内殖民"
  tr_gts_godkeeper_5_desc: "这是神主的恩赐，亦是她的考验，我们将与神主拥有负距离的接触，拥抱无上的荣耀，拥抱无上的神主。\n\n§G殖民地建造速度+100%，殖民地初始人口+3§!\n\n§Y开启事件链：体内殖民,\nPS：可以在母星旁进入犽戎圣躯§!"

  tradition_gts_toy_planets:"玩具殖民地适应"
  tradition_gts_toy_planets_desc:"那些被极巨化总督们玩弄的星球对我们而言也是一种特殊的资源，合理利用这些资源也许会对我们的事业产生意想不到的帮助。"
  tradition_gts_toy_planets_adopt: ""
  tradition_gts_toy_planets_adopt_desc: "岗位产出的凝聚力+10%"
  tradition_gts_toy_planets_adopt_fail_customtootip: ""
  tradition_gts_toy_planets_finish: ""
  tradition_gts_toy_planets_finish_desc: ""
  tradition_gts_toy_planets_1: "玩法扩展"
  tradition_gts_toy_planets_1_delayed: "在将殖民地玩具化改造后，我们不得不重新审视这些玩具殖民地的地位并对上面的资源加以利用。"
  tradition_gts_toy_planets_2: ""
  tradition_gts_toy_planets_2_delayed: ""
  tradition_gts_toy_planets_2_1:"玩具星球净化"
  tradition_gts_toy_planets_2_1_desc:"§G获取所有玩具星球的研究选项§!"
  tradition_gts_toy_planets_2_1_delayed:"让科学官们工作起来，重新利用这些玩具星球的工作需要他们的付出。"
  tradition_gts_toy_planets_2_2:"气候适应"
  tradition_gts_toy_planets_2_2_desc:"§G人口维护费 -10%§!"
  tradition_gts_toy_planets_2_2_delayed:"玩具星球的资源所能够提供的能量比我们想象的大，这能让我们节约出更多的资源，我们不必再为种族的延续而烦恼了！"
  tradition_gts_toy_planets_3: "玩具星球的 3"
  tradition_gts_toy_planets_3_desc: ""
  tradition_gts_toy_planets_3_1:"催情气体利用"
  tradition_gts_toy_planets_3_1_desc:"§G人口增长速度+5%§!\n§G每月有机人口增长系数+5%§!"
  tradition_gts_toy_planets_3_1_delayed:"玩具星球上的大气中含有大量的催情成分，这有利于我们的人口增长。"
  tradition_gts_toy_planets_3_2:"玩具星球威慑"
  tradition_gts_toy_planets_3_2_desc:"§G每月影响力 +2§!"
  tradition_gts_toy_planets_3_2_delayed:"将星球当做玩具所带来的影响与其他巨娘玩乐行为完全不同，我们应该利用这点来扩大我们在星间的影响力"
  tradition_gts_toy_planets_4: "地貌改造"
  tradition_gts_toy_planets_4_delayed: "极巨化总督们对星球的玩弄所造成的破坏并没有想象中的大，原本难以开发的土地反倒是变得更利于我们的开发。"
  tradition_gts_toy_planets_5: "实验性研究"
  tradition_gts_toy_planets_5_delayed: "玩具星球上的环境比常规星球更独特，在这样的环境下我们能够开展许多平时无法开展的社会实验，比如……大型的体型游戏。"

  council_agenda_tradition_gts_toy_planets_agenda_name:"改造玩具星球"
  council_agenda_tradition_gts_toy_planets_agenda_desc:"我们不能只是适应玩具星球的环境，我们要借用自己的力量将玩具星球的环境改造成适合我们生存的环境。"


