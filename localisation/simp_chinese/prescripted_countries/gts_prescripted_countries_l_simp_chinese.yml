 gts_prescripted_countries_5_custom_biography:"契约国大总管，行事迅捷干练的她实际操控并指示着各个巨娘私处内殖民地的工作事务。同时处理由新的护理契约带来的人力分配问题。"
 gts_prescripted_countries_5_species_bio:"无尽苍茫的白色平原上，数百艘巨大的殖民舰整装待发，密密麻麻的人群登上星舰即将踏上前往新世界的旅程。\n“高贵的女神，根据两国间的协议，契约已经生效。感谢您的包容与恩赐往后无尽的岁月中我国国民将世世代代居住在您圣洁温润的穴道世界之中并无时无刻清洁护理您美丽的圣域。”"
