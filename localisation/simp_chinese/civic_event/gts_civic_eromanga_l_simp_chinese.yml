l_simp_chinese:

  gts_eromanga_modifier:"金鸽子奖作品"

  gts_eromanga.name:"年度最佳gts作品"
  gts_eromanga.1.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《天青车道》§!的模拟经营游戏夺得头筹。\n在这部作品中，玩家将作为一名海军指挥官指挥数千米的巨大舰娘与同样巨大的塞壬舰娘作战，通过巧妙地在消耗舰娘精力和取得战斗胜利中取得平衡，从而在舰娘和塞壬手中保护港区和自己的安全。\n有观点认为，这部作品直接影响了帝国海军部关于太空舰娘的指挥训练理论。"
  gts_eromanga.1.a:""
  gts_eromanga.2.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《方舟骑士》§!的游戏夺得头筹。\n这部RPG作品创造了一个奇妙的世界，玩家将作为一名因穿梭机事故而迫降在土著世界的观测站科研员，凭借自己的体内诊疗技能结识并攻略本土不同种族的巨大兽娘干员，在将她们纳入麾下后四处征战，直到让整个星球臣服在她们巨足的统治之下。\n这部作品因其美术风格和多结局设计而倍受好评，并吸引了很多人前往故事原型——泰拉星进行圣地巡礼，不过那里远不像故事里那么生机勃勃，它现在只是帝国的一处稀有水晶矿产区而已。"
  gts_eromanga.2.a:""
  gts_eromanga.3.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《优骏德比》§!的游戏夺得头筹。\n在这款休闲养成游戏里，玩家将扮演新人训练师管理一群性格各异的巨大马娘，在训练她们各项能力的同时平衡好与每个马娘间的关系，最终让她们在银河系最知名的「有马纪念」理想城破坏竞速赛上取得胜利。\n火爆的销售额使得游戏开发商宣布将很快开始续作的开发，届时，玩家将可以使用意识拟真设备直接扮演巨大马娘体验久负盛名的理想城破坏竞速赛，或扮演理想城里的小人努力在马娘的巨靴下求生。"
  gts_eromanga.3.a:""
  gts_eromanga.4.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《扶她/冠位指定》§!的动作游戏夺得头筹。\n这部作品假设在遥远的第二十个千年，银河系遭遇河外星系虫群的入侵，为了抵抗这一终末危机，星海共同体成立的秘密灵能机构——迦勒底，任命由玩家扮演的御主召唤来自不同文明不同时间段的巨娘英灵与虫群作战。\n本作最大胆的设计便是英灵被虫群大破后不但会爆衣，还会长出极度敏感的巨根，不仅会影响闪避和技能释放，还会吸引怪物攻击，只有在退场后及时将玩家塞进尿道并与其他英灵做爱才能康复。这一亮点也让它迅速出圈，成为今年的年度游戏。有专业人士分析，本作或将成为§Y《扶她》§!系列有史以来最强有力的摇钱树。"
  gts_eromanga.4.a:""
  gts_eromanga.5.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《人偶前线》§!的即时战略作品夺得头筹。\n这部作品的时间线稍早于前作，此时还是太空佣兵团“格里芬”一名普通士官的主角将被派驻到一个陷入混战的遗迹星球—维吉卢斯上，玩家将指挥一群使用早期热兵器的巨大机娘在危机四伏的废土中完成雇主发布的各种任务，歼灭敌对部队，搜索有价值的物资，在一次次的战斗中强化自己的智械巨娘队伍，建设并扩张自己的基地，并最终找到办法逃离这片是非之地。"
  gts_eromanga.5.a:""
  gts_eromanga.6.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《风雪禁区》§!的文字恋爱模拟游戏夺得头筹。\n本作里，玩家将作为巨型企业世界树的安全总监，指挥一群得到神力而巨大化的天启者少女清理污染区内的变异生物，并在拯救世界的冒险中与这些天启者增进关系、缔结良缘。\n这部游戏的制作组是一向被认为是烂作制造机的安卡西娅工作室，但这部作品却意外的用心，除了游戏极易走向某位银发贫乳巨娘的个人线外的槽点外，本作几乎没什么明显缺点。游戏路线多样而全面，并对传统GALGAME机制做出创新：在达成单一角色的好结局后，玩家可以直接继续游戏，继续攻略其他对玩家抱有好感的角色，直到达成与所有天启者结婚的真结局。此外本作还为每一位可攻略角色都制作了多个拟真互动情景，如海滩度假、情趣play、洞房花烛夜等等，通过接入意识，玩家可以亲历与这些巨娘的甜蜜时刻。"
  gts_eromanga.6.a:""
  gts_eromanga.7.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《蓝色档案》§!的RTS游戏夺得头筹。\n故事发生在一座高度发达的学园都市—基沃托斯，玩家作为新上任的夏莱社团老师，将指挥游戏领域大神才羽绿、种族骑士才羽桃以及其他不同学校的巨娘学生解决大大小小的危机事件，与她们亲密互动增进好感，并逐步发掘出这个纷乱城市下的阴谋。击败吞噬学生金钱的恶龙早濑优香和大魔王调月莉音，以及那位策划了一切黑恶事件，试图将自己巨大化统治基沃托斯，从而独占所有佩洛洛玩偶的幕后黑手——阿慈谷日富美。\n这部作品因其成熟的RTS指挥机制和内容丰富的巨娘学生好感剧情而备受好评，尽管该游戏因涉及敏感内容和不适当的人身攻击而被千禧学院学生会审查封禁，开发团队“游戏开发部”也因此下落不明，但不影响它成为今年最为流行的游戏作品。"
  gts_eromanga.7.a:""
  gts_eromanga.8.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《少女与战车：巨娘O道梦幻大作战》§!的载具射击游戏夺得头筹。\n这部作品延续了主线剧情，因为赢得上一届全国高校战车道大赛而获得巨大化能力的西住美穗车组在本部作品将以她们的身体为赛场，邀请各个高校在她们的体内打一场友谊赛。\n玩家将操作原作诸多高校中的一支坦克车组，在少女体表与体内的多张地图战胜其他车组，并与其他四支成功晋级的车组一起挑战上次战车道大赛的总冠军——超巨大西住美穗和她的四位乘员。\n作为一部粉丝向游戏，这部作品却能凭借高度还原的体表/体内环境模拟和踩踏触感成功出圈，取得了意外的商业成功。除了系列传统的剧情模式和对战模式之外，本作还首次添加了创意工坊，玩家可以将最终boss改为其他角色，亦或者挑战驾驶战车在少女O道内速滑等等，极高的自由度也是它取得良好口碑的重要原因。"
  gts_eromanga.8.a:""
  gts_eromanga.9.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《欧罗巴风云四-威力加强导演剪辑最终决定版》§!的历史策略游戏夺得头筹。\n这部作品以sol3星文艺复兴时代的历史为蓝本进行了爆改。它虚构了一颗流星在1444年1月1日环绕地球飞行了六圈，在摧毁所有国家的稳定并让全世界陷入混乱后，坠落君堡。陨石里的巨娘能量泄露出来被几名来自不同国家的美少女吸收，迅速成长为了几千米高的“天选者”，并轻松取得了对自己国家的统治权。玩家将扮演其中一位巨娘，带领自己的国家四处征服扩张，击败其他天选者巨娘，扣扣使其娇羞，攻略纳入后宫，带领巨娘继续征服，最后把全世界都搞成乱七八糟的样子。\n尽管这部作品因其过于直球、毫不避讳的剧情和海量的黄色CG而被认为是作者精虫上脑搞出的拔作，但自发布后火爆的市场销量和经久不衰的实时在线人数足以压倒一切质疑。"
  gts_eromanga.9.a:""
  gts_eromanga.10.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《冰霜朋克》§!的养成游戏夺得头筹。\n本作时代设定在工业革命后期，两位天体级巨娘的打闹将帝国母星被撞离公转轨道，两人有说有笑地离开了星系，而幸存者们却不得不在世界范围的暴风雪中挣扎求生。\n玩家将作为临危受命的皇家科学学会专员，率领“新伦敦号”——一位消耗煤炭能源进行供暖的早期智械巨娘，和她身上栖居的数千难民，前往帝国北疆。一路上收集资源、升级设备并培养好“新伦敦号”尚不成熟的人格核心，最终为帝国子民找到一个适合居住的新家。\n这部游戏因其独特的美术风格和内容丰富的养女儿体验而颇受好评，在后续DLC中，制作组还加入了其他智械巨娘及剧本：沉着知性、背负着帝国政府最后任务的“方舟号”机娘、开朗热情，亲近小人的“加尔文号”机娘、身虚体弱却还饱受欺凌的“冬日之家号”机娘、从零开始建设，前途未定的“新利物浦号”机娘等等，仿照设定的人工智能周边也将随之发售。"
  gts_eromanga.10.a:""
  gts_eromanga.11.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《麻美尖塔》§!的卡牌对战游戏夺得头筹。\n本作是经典游戏§Y《麻美塔》§!的精神续作，玩家因未知魔法被缩小到巴麻美学姐的家中，为了找到恢复原状的办法，玩家将从她足尖丝袜的破洞进入，先后沿着裤袜层、双穴层与巨乳层一路向上攀登，使用卡牌与巴麻美身上的各种敌人战斗，收集钥匙碎片，最终进入学姐凹陷的乳首决战，引起她的注意。此外，本游戏还开放了无限模式，玩家将会进一步缩小至微生物，并在更加漫长的攀爬麻美塔之旅中与新的敌人战斗，并实时感受麻美小姐的生活作息对体表世界的巨大影响。"
  gts_eromanga.11.a:""
  gts_eromanga.12.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《艾雅法拉环》§!的动作冒险游戏夺得头筹。\n天体级领袖艾雅法拉将自己脚上的趾环殖民地摘下，准备久违地泡个澡，全然不知自己趾环内的世界因逐渐失去自己体温与足汗的滋养而陷入无止境的混乱中。殖民地的人们认为他们的女神已弃他们而去，从而掀起暴乱，趾环统一政府轰然倒塌，一众得到灵能启示的豪杰开始争夺残存的女神体液。而在这纷乱之世，玩家将作为褪色者踏上征途，穿越汗雾海，统一趾环交界地，成为艾雅法拉环之王。"
  gts_eromanga.12.a:""
  gts_eromanga.13.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《浮幽2》§!的模拟经营游戏夺得头筹。\n本作继承了前作结局，玩家扮演的巨娘指挥官在顺利攻占强大的小人土著文明“哈宾特统一世界”后，在本作将继续负责对该星球的占领与重建工作。在白天清理不服管教的小人聚居区，收集前政府的科学技术，完成星区总督的生产指标的同时，还要小心那些掌握先进武装的小人抵抗军对你的办公室、浴室和卧室的渗透入侵。合理调度你麾下的巨娘护卫和小人干员保护你的房间，突袭小人据点，竭力降低房间渗透度，以避免自己被调教成小人叛军的星怒。\n在新资料片§Y《天启者之战》§!中，敌人和我方干员的类型更加多样化，抵抗小人渗透的战场也进一步延伸，玩家可以在巨娘指挥官的鞋袜、内衣乃至体内指挥你忠诚的小人干员与入侵的敌军做殊死搏斗。"
  gts_eromanga.13.a:""
  gts_eromanga.14.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《巨娘信条：黑旗》§!的RPG游戏夺得头筹。\n本作以曾经制霸星海帝国边境星域的传奇巨娘海盗爱洛·肯威的人生经历为蓝本。玩家将扮演这位巨娘体验25世纪的星际海盗生活。\n籍籍无名的年轻海员爱洛·肯威意外得知了银河遗珍—誊录仪的存在，而在寻找的过程中因发现了帝国研究以太相位引擎的秘密而被逮捕。逃离监禁后，爱洛与同伴夺得一艘驱逐舰，并将之命名为“寒鸦”。随后与其他同时代的知名巨娘海盗们相识，开始了劫掠帝国运宝船、猎杀银河巨兽的冒险生涯，并最终帝国皇家海军对巨娘海盗们的围剿战中杀出重围，在银河系边缘建立一个不受帝国管治的自由星区。"
  gts_eromanga.14.a:""
  gts_eromanga.15.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《至暗地牢》§!的回合制策略游戏夺得头筹。主角的先祖通过邪恶法术理解了这个世界的可怖真相——整个星球都不过是某位沉睡的天体级巨娘身上的浮土。先祖受到了致命诅咒，整个家族也随之没落。玩家则遵循先祖遗命，回到故乡挽救家族产业。\n玩家需要招募雇佣兵，通过祖产遗迹附近的传送门进入到那位巨大少女的身体各处，探索路线、收集宝藏、与各类受到巨娘荷尔蒙改造的诡异生物作战。漫长而艰苦的的战斗、令人不安的环境和对真相的隐约察觉，会让佣兵们压力不断提升，最终精神崩溃，选择成为这体内地牢的一部分。而在无数牺牲与死亡后，玩家将带队迎战癫狂的先祖，终结她的邪恶计划，让地下那位巨娘的睡梦继续延续下去。"
  gts_eromanga.15.a:""
  gts_eromanga.16.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《小叶公司》§!的作品夺得头筹。\n这部历史模拟经营游戏很好地还原了小人文明刚开始发现并利用巨娘体液时的艰辛历程。玩家扮演的小人主管将在人工智能安洁莉娜等人的帮助下，接收并饲养总部送来的异族巨娘，调动员工用交流沟通、亲密接触、维护清理乃至威胁恐吓等方式刺激巨娘分泌体液。在完成生产指标的同时稳定好被收容巨娘的情绪，防止巨娘失控出逃，造成不可预料的灾难。"
  gts_eromanga.16.a:""
  gts_eromanga.17.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《黑皮猫:普露》§!的动作游戏夺得头筹。\n这部作品虚构了天堂之战的另一个结局：传奇猫娘战士艾普露带队击败两大觉醒帝国后本想退隐，在一个普通的小人土著星球度过余生，却惨遭第四天灾背刺，自己养的小人被其他巨娘领袖掠为玩具，艾普露也被自己曾经的伙伴雁栖雷普至死。而玩家将扮演数百年后横空出世的键帽意志继承者——哈基人，为了探寻艾普露被超市之谜的真相，与不同大小的巨娘领袖战斗，并最终实现自己成为最强残忍系巨娘的天命。"
  gts_eromanga.17.a:""
  gts_eromanga.18.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《田野战争1》§!的FPS游戏夺得头筹。\n本作以第一次地球联合国内战为背景，让玩家亲历协约国与同盟国两个霸权集团在地球上广阔战线的一系列冲突与战役。为了模拟那个军事科技爆炸式进步，巨型机娘从尖端工业奇迹变成量产战争机器的年代，本作创造性地引入了“战争巨娘”机制，当一方陷入劣势时，会有一位战争巨娘前来支援，这些数百米高的巨娘会轻易改变战争天平：“齐柏林”能一脚踩塌格拉巴山隧道，一次平地摔便能将大半个宴厅磨碎在双乳下；“无畏”能撞开法欧堡的百年要塞，也能在粉碎泽布吕赫港的海防；“夏尔”瞭望着苏瓦松的高地，而黑化后也会一脚将坚不可摧的法乌克斯要塞夷为平地；“奥丁”与“扎穆列茨”则在中东的沙海与东欧的雪原横冲直撞。然而这个时代的智械巨娘并非无敌，另一方的士兵可以使用各式爆炸物与火炮，努力让其爆衣，最终迫使其羞涩难堪昏倒在地。\n第一次地球联合国内战以“齐柏林”娘攻入巴黎，英国有条件投降为结局，同盟国（即后来的帝国公约）迎得了三十年的和平，而在三十年后，帝国公约将于西方的工团国际和东方的露西亚联盟进行第二次决战。"
  gts_eromanga.18.a:""
  gts_eromanga.19.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《星辉谷物语》§!的休闲游戏夺得头筹。\n玩家被巨型企业Joja解职后，回到老家温科沃特星，一个被园艺智械精心改造的盖亚星球，去投奔自己做农场主的巨娘姐姐。除了在姐姐为你准备的盆景花园里耕作畜牧外，玩家还将在这个满是巨娘的星球发挥自己身为小人的优势，进入巨娘镇民无法钻入的矿洞探险，收集各种远古遗珍，帮助镇民抵抗巨型企业的经济渗透，在四时轮替中与各种巨娘镇民互动，最终建立友谊甚至婚姻关系。\n这部作品在游戏机制、音乐、环境氛围上的努力很好的满足了小人玩家对于和巨娘们和谐共处、田园牧歌生活的想象，为经常遭到巨娘玩弄的小人创造了一个充满温情与探索乐趣的虚拟避世所。"
  gts_eromanga.19.a:""
  gts_eromanga.20.desc:"帝国最受关注的文娱奖项——金鸽子奖的评选结果已经出炉，一部名为§Y《命令与征服：心灵欧米茄》§!的即时策略游戏夺得头筹。\n本作是对前作§Y《命令与征服：yuri的复仇》§!的剧情扩展，玩家将通过指挥三个阵营的一系列战役，从不同角度经历一条与原作截然不同的世界线：第一次苏萌战争后，由萌军扶植的新苏联在百合巨娘控尤里的帮助下韬光养晦，通过突然袭击重创了萌军，第二次苏萌大战爆发。而随着战争进行，尤里试图渔翁得利，制造百合巨娘统治世界的阴谋浮出水面，迫使苏联、萌军暂时合作，共同围剿尤里的厄普西隆军团。\n虽然苏萌联军成功收复了被厄普西隆军团占领的大部分领土，但在南极战役中没能阻止尤里培育的超性能巨娘天秤启动心灵控制塔。最终，天秤控制了所有人类的思想，成长为了万米级巨娘，地球文明迎来了新的时代。\n唯一结束这场灾难的希望落在了新生的焚风阵营，通过逆向研究同样成长为万米巨娘的云茹率领各国流亡部队在阿拉斯加希望角建立了隔离屏障，等待着反抗天秤的时机。"
  gts_eromanga.20.a:""





