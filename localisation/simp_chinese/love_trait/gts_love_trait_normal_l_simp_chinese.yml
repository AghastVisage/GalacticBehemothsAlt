 trait_leader_gts_love_lv1_desc:"$gts_love_lv1$    ([this.gts_love_logs] / [this.gts_love_level2])\n[this.GetName]与我们还十分生疏，难以真正地敞开心扉.但相信即便是巨娘的心之壁也能被我们逐渐消融。"
 trait_leader_gts_love_lv2_desc:"$gts_love_lv2$    ([this.gts_love_logs] / [this.gts_love_level3])\n[this.GetName]的感情逐渐升温，似乎逐渐成为了[Owner.GetName]的一份子"
 trait_leader_gts_love_lv3_desc:"$gts_love_lv3$    ([this.gts_love_logs] / [this.gts_love_level4])\n长时间的合作也让我们与[this.GetName]积累了信任，她如今已经成为了我们可靠的伙伴"
 trait_leader_gts_love_lv4_desc:"$gts_love_lv4$    ([this.gts_love_logs] / [this.gts_love_level5])\n我们如今与[this.GetName]拥有了深厚的情谊，即使再大的体型差距也难以阻碍这份关系\n$leader_trait_love_picture$"
 trait_leader_gts_love_lv5_desc:"$gts_love_lv4_max$    ([this.gts_love_logs] / [this.gts_love_level5])\n无论[Owner.GetName]剑指何方，[this.GetName]始终都将陪在我们身旁\n\n$leader_trait_love_picture$$gts_max_love_tooltip$"
 trait_leader_gts_love_lv6_desc:"$gts_love_lv5$    ([this.gts_love_logs]) \n[this.GetName]与我们已然超越了言语的描述，即使星河俱灭，她也会追随我们直至宇宙尽头。$leader_trait_love_picture$"
