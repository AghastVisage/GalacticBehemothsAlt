 illya.3000.b:0 "切换灵基"
 illya.3000.c:0 "战斗结束了，请回来吧"
 illya.3000.d:0 "没事"
 illya.3001.name:0 "伊莉雅"
 illya.3001.desc:0 "§S这是……必要的战斗吧？嗯，我们上吧，红宝石！\n好好放手一干吧～！§R"
 illya.3001.a:0 "使用第一阶段灵基"
 illya.3001.b:0 "使用第二阶段灵基"
 illya.3001.c:0 "让我们谈点其他的"
 illya.3001.d:0 "还是算了"
