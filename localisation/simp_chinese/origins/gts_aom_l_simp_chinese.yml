 tr_aom_panlon_adopt:"帝国"
 tr_aom_panlon_adopt_desc:0 " §Y领袖§!的§Y招募花费和维护费§!减少§G20%§!\n§Y人口§!的§Y维护费§!减少§G20%§!。"

 tr_aom_panlon_finish:0 "帝国传统已完成"
 tr_aom_panlon_finish_desc:0 "飞升天赋已解锁§G+1§!。所有£job£ §Y人口岗位§!的§Y维护费§!减少§G10%§!。"
 tr_aom_panlon_finish_delayed:0 "人皇所佑，帝国荣光永存。"

 tr_aom_panlon_1:0 "人主吾母"
 tr_aom_panlon_1_desc:6 "§Y建筑§!和§Y区划§!的§Y建筑花费§!减少§G20%§!§Y维护费§!减少§G20%§!，并且§Y建造速度§!增加§G+25%§!"
 tr_aom_panlon_1_delayed:0 "我们的母亲，人类之主，她的智慧和力量始终指引着我们，同时保护我们的文明免受外星巨娘的侵害。"

 tr_aom_panlon_2:0 "人皇赐福"
 tr_aom_panlon_2_desc:6 "有机体特质点§G+6§!有机体可选特质数§G+2§!"
 tr_aom_panlon_2_delayed:0 "人皇会为她的子嗣降下恩赐，每一样都是不可思议的奇迹。"

 tr_aom_panlon_3:0 "皇家商业集团"
 tr_aom_panlon_3_desc:6 "允许设立§Y皇家企业分部§!\n"
 tr_aom_panlon_3_delayed:0 "母亲大人授权我们以她的名义开设民营产业，现在我们可以用她使用过的私人物品开发新的服务项目，比如鞋袜，帽子，书包等等，这些东西对小人文明有着莫大吸引力。"

 tr_aom_panlon_4:0 "圣灵教会"
 tr_aom_panlon_4_desc:6 "§Y$mod_station_researchers_produces_mult$§!增加§G30%§!。\n§Y$starbase_constructions_research_produces$§!增加§G30%§!。"
 tr_aom_panlon_4_delayed:0 "原初时代八位圣灵分别执掌世界权柄，根据母亲所说，他们此时就在名为八大界域的遥远世界。建立圣灵教会与其沟通，这将成为强大的助力。"

 tr_aom_panlon_5:0 "神魂一体"
 tr_aom_panlon_5_desc:6 "来自人口的帝国规模减少§G20%§!"
 tr_aom_panlon_5_delayed:0 "我将我的身体，心灵还有灵魂全部献给我主，我们的母亲和守护者，我们将以最虔诚的信仰回报她永恒的守护，并成为她力量的一部分。"

 trait_aom_Belief:0 "人皇信仰"
 trait_aom_Belief_desc:0 "这个种族是一位神秘存在的造物，他们虔诚的信仰着自己的造物主，从而达成某些超乎寻常的奇迹。"
 TRAIT_AOM_BELIEF_EFFECT:0 "岗位效率：§G+20%§!\n每$pop_group_unit$作为奴隶或更高工作标准的£pop£§H人口§!每月生产0.01£gts_aom_Belief£§Y。"
 #区划
 zone_adaptive_city:0 "破坏自适应城区"
 zone_adaptive_city_desc:0 "为了在不影响星球正常运转以及巨娘和小人和谐相处的前提下，满足巨娘的发泄需求，以及部分小人的特殊爱好，而专门规划的特殊区域，整个区域被大范围的时间回溯魔法阵笼罩，巨娘所造成的任何破坏都会在一定时间后自动复原，相应的在这个区域死亡的小人也会在之后由牧师进行复活，确保不会造成实质性的破坏。"
 #科技
 tech_aom_time_rewind_1:0 "时间回溯"
 tech_aom_time_rewind_1_desc:0 "拥有了时间回溯魔法，我们可以将各种事故扼杀在摇篮中，极大的降低了事故的发生概率，从而提高工作效率。"

 tech_aom_resurrection:0 "起死回生"
 tech_aom_resurrection_desc:0 "复活魔法是一种不可思议的力量，这也使得我们拥有了挽救各种意外事故造成的伤亡，比如被巨娘踩死什么的？哈哈，说笑的。"

 tech_aom_time_rewind_2:0 "大型时间回溯魔法"
 tech_aom_time_rewind_2_desc:0 "随着我们对光明魔法的进一步掌握，我们已经可以布置大范围的时间回溯魔法阵，对一整座城市，乃至星球进行回溯。\n\n解锁特殊区划§H破坏自适应城区§!"

 #仪式
 aom_magical_ritual_1_0:0 "仪式冷却中"
 aom_magical_ritual_1_0_desc:0 "再不久前我们已经进行过一次大型时间魔法仪式，需要等待魔法之风再度充盈才能施展"
 aom_magical_ritual_1_1:0 "加速生长"
 aom_magical_ritual_1_1_desc:0 "农作物的时间流速被加快，导致成长迅速，产量大大提高"
 aom_magical_ritual_1_2:0 "奇异波动"
 aom_magical_ritual_1_2_desc:0 "某种奇异的魔力波动，千奇百怪的效果对研究十分有帮助"
 aom_magical_ritual_1_3:0 "超频运转"
 aom_magical_ritual_1_3_desc:0 "我们的设备进入超频运转状态，从而提高了产量"
 aom_magical_ritual_1_4:0 "矿脉恢复"
 aom_magical_ritual_1_4_desc:0 "原先枯竭的矿脉被逆转，回到了开采前的状态，许多矿场因此得以重新开业。"
 aom_magical_ritual_1_5:0 "快节奏生活"
 aom_magical_ritual_1_5_desc:0 "整个星球的时间都被加快了，所有的居民无论做什么事情都像被开了倍数一样，一切都变得如此迅捷，但是也带来了一些不良影响，快节奏的生活让人民喘不过气，幸福感显著下降。"
 aom_magical_ritual_1_6:0 "能源障碍"
 aom_magical_ritual_1_6_desc:0 "能源系统受到阻碍，导致一部分能源无法被输送产生严重浪费，"
 aom_magical_ritual_1_7:0 "植被枯萎"
 aom_magical_ritual_1_7_desc:0 "农作物被过度加快，大面积枯死，星球面临粮食减产的威胁"

 aom_ritual.2.name:0 "加速生长"
 aom_ritual.2.desc:0 "仪式成功了，现在我们的农场被一片特殊的立场笼罩，这对其他生物并无影响，却能加快农作物的生长速度，这让我们的粮食产出大大提高。"
 aom_ritual.2.a:0 "我们的粮食会迎来大丰收"
 aom_ritual.3.name:0 "奇异波动"
 aom_ritual.3.desc:0 "仪式制造了一片奇异的魔力波动，具有很高的研究价值。"
 aom_ritual.3.a:0 "真是有趣的情况"
 aom_ritual.4.name:0 "超频运转"
 aom_ritual.4.desc:0 "对工厂使用时间魔法，这让我们的设备进入了超频状态，工作效率大大提高。"
 aom_ritual.4.a:0 "很好，加快效率"
 aom_ritual.5.name:0 "矿脉恢复"
 aom_ritual.5.desc:0 "有一大片已经枯竭的矿脉在时间倒流下又恢复到了未开采状态，这意味着我们可以重新开采。"
 aom_ritual.5.a:0 "源源不断，真不错"
 aom_ritual.6.name:0 "快节奏生活"
 aom_ritual.6.desc:0 "非常不可思议，整个星球的时间都被大幅度加快，这导致我们的人民无论做什么都变得非常迅速，但是这样快节奏的生活也造成了一些不良影响，对精神是一种负担。"
 aom_ritual.6.a:0 "我们需要一些时间来适应这种变化"
 aom_ritual.7.name:0 "能源障碍"
 aom_ritual.7.desc:0 "仪式失败了，魔法的残留波动阻碍了我们的能源传输网络，导致一部分能源被无意义的浪费掉了。"
 aom_ritual.7.a:0 "可恶"
 aom_ritual.8.name:0 "植被枯萎"
 aom_ritual.8.desc:0 "该死，仪式出现了意外，我们的农田被过度加快了时间，大量枯萎吗，导致大面积的粮食减产。"
 aom_ritual.8.a:0 "太糟了"
 aom_ritual.9.name:0 "城区老化"
 aom_ritual.9.desc:0 "仪式失控了，我们的一个城区的时间被大幅度跳跃，仿佛常年无人维护，严重老化，已经无法居住。所幸我们及时撤离出了原先的居民，并没有造成伤亡。"
 aom_ritual.9.a:0 "糟糕，赶快救治伤员"
 #领袖CG事件
 aom_leader_cg.2.name:0 "要被吃掉了？"
 aom_leader_cg.2.desc:0 "在§Y[From.Planet.GetName]§!的居民们已经开始庆祝一年一度的愚人节活动，各种各样的玩笑话，恶作剧，不断刷新着人们的想象力。\n但是所有人都没有想到的是，伊莉雅丝菲尔小姐也想加入这场欢乐盛况，而星球表面的人还浑然不知，只有远处航行的星际飞船，和空间站观测到了这一幕。\n她巨大的身躯就这样毫无征兆地出现在了星球旁。\n“呀？大家看上去很开心呢，不介意让我也加入吧？” \n少女活泼的声音，通过魔力传递到每个人耳中。也许没有人知道她接下来想要做什么。\n“不给糖就捣蛋，啊对了，今天好像不是万圣节呢？那是不是……”\n像是假装想起来了，伊莉雅沉默了片刻，又露出一个笑容。\n“嘛，总之快点把糖果交出来哦” \n“糖果，我们上哪去找糖果？” \n众人皆是无语。\n“哎？没有吗？那就把大家当成糖果吃掉好啦” \n略带失望的表情，但是随即伊莉雅坏笑地张开嘴，指尖搭在星球上，当然也没有忘记使用魔法保护，避免星球被自己碰碎掉。\n“啊啊啊！” \n一阵惊恐的声音，所有人开始拼了命地逃窜，各种交通工具都在星球表面全速奔驰，只为了找到最近的星舰，从而逃亡，但很显然这么短的时间完全不够。\n“大家都要被伊莉雅吃掉啦，感觉有点羞耻呢” \n伴随着那活泼的声音，在绝望的目光中，白皙的手指将星球推入口中，似乎马上就要落在舌头上面。\n当然我们的飞船从太空视角可以看到，也许是因为口中含着无数生命的奇妙感觉，让伊莉雅小姐不由地面色通红，露出一个带着些许恶作剧意味的笑容。搭着地球的手也微微颤抖。\n“嘻嘻，吓到大家了吗？伊莉雅才不会做这种事情呢，那样就变成坏孩子啦。” \n但是少女的动作就在最后一步戛然而止，预想中恐怖的画面没有发生，巨大的手指突然改变了方向，将星球又从嘴里推了出来。\n“星球上的的大家，愚人节快乐呦！” \n露出恶作剧得逞的笑容，伊莉雅用调皮的声音向着星球招手。\n嗯，这或许会成为这个星球历史上最大的恶作剧。"
 aom_leader_cg.2.a:0 "真刺激"
 aom_leader_cg.4.name:0 "废弃城市清除"
 aom_leader_cg.4.desc:0 "由于此前的仪式发生意外，§Y[From.Planet.GetName]§!的一片城区被加速时间导致严重老化，已经无法居住，必须进行重建，而在此之前，清理这么大规模的建筑群的开销依然是一个天文数字，需要耗费大量的人力物力，于是我们委托了骑士王阿尔托莉雅小姐来帮助我们完成清理工作。\n “就是这里吗？” \n在我们的观测中，阿尔托莉雅抵达星球表面，她站稳身形，高耸入云的身躯环顾四周，蹲下触摸地面。破败的城市被指尖轻易搅动，留下一条深深地沟壑。\n“被时间侵蚀的建筑残骸，看上去很严重呢，你们也真是不小心。” \n“所以才需要您来协助清理。” \n“嗯，好的，那我接下来该怎么做？” \n“想怎么做就怎么做，将这一片都夷为平地就好，对您来说应该不是难事，然后我们就可以开始准备重建工作，这片城区已经被废弃，没有人居住，可以放心施展。怎么做开心就好。” \n“这样啊……那就先用这个吧” \n听到我们的通讯，阿尔托莉雅轻轻抬起一只脚，精准的力道踏向一栋较高的大楼上，本就摇摇欲坠的大楼轰然倒塌。而这仅仅是一个开始，少女的鞋底不断落在破败的城市上面，第一次，第二次。很快就覆盖上了坑坑洼洼的鞋印。\n“阿尔托莉雅小姐，之前有其他从者反馈过，脱掉鞋子踩在上面好像挺舒服的，您想要试试吗？” \n“这、这种建议太失礼了！” \n阿尔托莉雅头上的呆毛猛地竖起，表情看上去十分严肃，隐约藏着一点害羞，眼神却不自觉地飘向了脚下的城市。\n“您也可以尝试一下，不要有太多拘束，而且我们的人民很乐意欣赏你们这样巨大又可爱的女孩子做这些事情时的样子，非常好看，毕竟也没有什么损失。还能产出一些周边，带动经济效应，当然我们会给您分红的。” \n“分红什么的……”听到这个提议，她看上去脸更红了，小声嘀咕着，犹豫了一会，还是小心地脱下一只鞋子，用黑色过膝袜包裹着的脚掌轻轻踩了上去。也许冰凉的触感就像沙子一样，十分细腻。\n“唔……确实……挺舒服，不对……”感觉到脚底那奇异的触感，阿尔托莉雅忍不住脱掉了另一只脚的鞋子，试探性地踩了踩，头上的呆毛愉快地晃动起来。又好像突然意识到什么，迅速板起脸。\n“但、但这只是为了更好地清理！” \n似乎是为了缓解尴尬，连步伐都加快了不少，认真地踩踏着脚下密集的建筑群，似乎还在小声嘀咕着什么。\n“既然是为了工作……偶尔放松一下应该也不是不可以，不对，我在想什么呢，还是赶快全部解决掉吧” \n说到一半，又晃了晃头，想让自己清醒一点。\n“这样子好像还是太慢了，还是动用一点魔力好了，只要注意小心一点，不要波及到其他地方” \n嗯，打定注意，阿尔托莉雅开始控制自己的力量，§Y[From.Planet.GetName]§!上的任何一位法师都能清晰的感觉到那强烈的魔力波动。\n“这样……应该就可以了” \n魔力汇聚形成气流就像一阵狂风席卷而过，将所有的建筑吹的粉碎。看着逐渐平整的地面，阿尔托莉雅露出满意的表情。 \n“嗯？看样子还剩下一些不起眼的小角落” \n低头看去，阿尔托莉雅发现原来不远处还有一小片城区侥幸留存了下来，于是快步走了过去。\n“其他地方也要仔细检查一下” \n抬起那美丽的脚掌，轻巧地踩了上去。\n“呼，终于结束了哦。” \n最后又花了一些时间对残余部分进行扫荡，整个废弃的城区被彻底夷为平地，阿尔托莉雅也轻轻呼出一口气，坐在地上休息。\n“辛苦您了，我们准备了一些茶点……感谢您的帮助” \n我们的法师使用传送魔法将提前准备好的一盘巨型甜点还有饮品送到她身边。\n“那我就不客气了……唔，真好吃” \n看着突然出现在身边的甜点，阿尔托莉雅开心地拿起了一块蛋糕放入口中,露出幸福的表情。相信这段有趣的影像很快会登上全国的社交媒体，广泛传播。\n当然也不要忘了，也许我们的重建工作该提上日程了？"
 aom_leader_cg.4.a:0 "这下重建就方便多了"
 aom_leader_cg.7.name:0 "平静的野餐"
 aom_leader_cg.7.desc:0 "在完成先期工作，各个部门都已经做好了迎接准备，希洛小姐来到了§Y[From.Planet.GetName]§!享受她的休闲时光，这也是所有人翘首以盼的事情。\n“那个，大家好啊，真是不好意思，让你们费这么多心思。” \n略带歉意的摸着后脑勺说，少女提着一个篮子出现在广阔的平原上。大量的飞艇在周围盘旋，大量警力被部署在周围维持秩序，并提前拉起了上百公里的警戒线，行星防卫部队也抽调了两个军团前来协助。而这些并不能阻碍居民们热情地欢呼声，为了让她能够看到，许多人打出了超大型礼花，或者使用投影设备，当然还有飞行表演喷射出显眼的彩色烟雾组成欢迎的字样。\n“哇，这是给我准备的吗？谢谢，大家都好热情啊” \n看着半空中的文字，希洛开心地说。\n“是个很漂亮的地方，看样子可以好好休息一会了” \n环顾四周，寻找了一块看上去比较整洁的地面，少女放下篮子，从里面取出了提前准备好的野餐垫，盖在了地面上，足以覆盖数百平方公里。\n“如果你们不介意的话…….我想把鞋子脱下来” \n少女带着羞涩说，应该没有人会拒绝这样的请求吧？答案已经很明显了。于是，很自然地，我们得到了欣赏少女足部的机会。\n“呼，感觉这样好像轻快了一些。阳光也很舒服，真是和平啊” \n将脱下来的皮鞋放到一边，被白丝包裹的脚掌轻盈地落在野餐垫上，然后坐了下来，双腿自然伸展，悠闲地仰望着蔚蓝的天空，从篮子里拿出一个三明治，小口品尝起来。许多的记者乘坐专用飞行器从不同角度记录下了这祥和的景象。\n“哎！你们在往哪里看呢？” \n像是某种直觉，希洛小姐低下头，随后便注意到那几艘靠在她脚边的飞艇。似乎还有摄影师为了拍摄完美的足部特写不顾劝阻想要靠近，好在我们的飞行单位及时拦下了他们。\n“感觉好难理解哦，你们就这么喜欢我的脚吗？” \n娇嫩地呵斥声，她的脸颊变得羞红，看着就像是在发烫一般，双脚不由自主地摆动起来，却又无可奈何。 \n“不行，不能给大家添麻烦，唔，还是好好尝尝有没有可以改进的地方。” \n于是，希洛小姐只把那些记者当成不存在，用食物转移注意力，但是脸上那某红色始终没有消失。\n“感觉一个人吃有点无聊，明明身边有这么多人…….” \n又咬了几口，少女表情有些枯燥，忽然眼前一亮，温和的笑容，向着民众发出邀请。\n“就这样让你们在旁边看着，也有点过意不去，大家陪我一起吃好啦” \n人群之中随即发出欢呼声，甚至发生了一些混乱，人潮开始冲击起了警戒线。\n“希洛小姐，请不要这样做，很危险的” \n“唔，抱歉哦，但是一个人真的很无趣哦，还是大家一起吃更开心一点” \n“好吧，但是请务必小心，不要造成更大的混乱” \n迫于她那真挚的眼神，我们只好下令缩紧封锁线，让民众可以与她更近距离接触，但依然要确保一定的安全距离，避免引发事故。\n由于野餐垫实在是太高了，就像一座城墙一般，一些有条件的人已经使用飞行手段快速接近，还有些人在边缘架起了足够车辆通行的斜坡，毕竟从边缘到达她所在的位置，依然有着数公里的距离，想要徒步完成并不是一件容易的事情。\n“料理还是要一起分享才更好吃，大家都来尝尝吧，是我亲手做的哦” \n甜美的声音，希洛小姐打开篮子向身旁的民众分享自己带来的美食，已经有运输队伍搬来的大量的桌椅，就仿佛是在举行一场盛大的庆典。食物的香气，甚至连临近的城市都弥漫着浓郁的香味，整个活动一直持续到午后。\n“居然还剩这么多？看样子之前做太多了。” \n目光扫过自己的篮子，里面还剩下相当可观数量的巨型料理。\n“就这样浪费了也不好，但是我自己也不好处理呢，嗯，那就都送给你们好了。” \n思索了片刻，少女决定将剩余的食物留给我们。\n“嗯，刚好有一点灵感，那最后在送你们一件礼物…..” \n仿佛突然有了新的想法，她的心念一动，一柄华丽的剑凭空出现在手中。\n“作为练习作品的话，应该还可以。” \n随意地挥舞了几下，希洛满意地点头，四处张望了一下，最后将目光落在一座山峰上，迈着轻快地步伐走了过去。\n“记得阿尔托莉雅不是有一把石中剑吗？嗯，这座山看上去就不错，那就放在这里好了” \n巍峨的山峰，在她身前，也不过是一块大一点的石头。她双手握住剑，高高举起。\n“嘿呀！”\n伴随着一声娇喝，那把巨大的剑就这样从山巅插了进去，深深地嵌入大地。\n“也许应该叫它山中剑？好像还挺有趣的，不过这里应该没有人能拔出来，希望你们会喜欢” \n于是希洛小姐在临走前还留下了大量的食物，以及一把非常巨大的剑，也许它可以成为§Y[From.Planet.GetName]§!上的一个新的地标。"
 aom_leader_cg.7.a:0 "让我们继续庆祝"
 aom_leader_cg.9.name:0 "魔力小行星迫近"
 aom_leader_cg.9.desc:0 "我们的法师在进行魔法实验时发生重大意外——导致一颗巨大的小行星被召唤出来，并且正在向§Y[From.Planet.GetName]§!飞来！如果任由它撞击表面的话，将会造成灾难性的后果。必须尽早消灭这颗小行星！"
 aom_leader_cg.9.a:0 "这些疯子又惹麻烦了"
 aom_leader_cg.10.name:0 "魔力小行星已被摧毁"
 aom_leader_cg.10.desc:0 "向[Root.GetName]飞来的小行星已经被摧毁了！§Y[From.Planet.GetName]§!九死一生的平民们都在街上庆祝。经过探查，我们发现这颗小行星的是由高浓度的魔力结晶构成，哪怕是一些边角料都可以作为优秀的能源供应。我们已尽可能将这些优质资源回收。"
 aom_leader_cg.10.a:0 "太棒了"
 aom_leader_cg.11.name:0 "紫色魔法少女"
 aom_leader_cg.11.desc:0 "魔力小行星即将命中§Y[From.Planet.GetName]§!但我们的武器尚未准备就绪，危机时刻，我们突然检测到一个高能反应，一个巨大的紫色物体在以更快的速度靠近，就像一艘巨型战舰，拖着明亮的轨迹。\n“记得应该是在这附近有一颗星球的，在哪里呢？唔，该不会迷路了吧” \n夹杂着一丝慌乱的声音，刚好停在了星球和小行星中间，是一位身穿紫色法袍的天体级少女。原来是加拉哈德小姐。她在太空中左顾右盼，寻找着目标。但她似乎没有发现，此时§Y[From.Planet.GetName]§!就在她旁边，甚至与她法袍飘动的下摆擦肩而过。\n幸运的是这预想中可怕的事情并没有发生。否则这可能会演变成一场更大的灾难，此时§Y[From.Planet.GetName]§!的居民只能看到少女那被深紫色过膝袜包裹的大腿，甚至还有一小部分，藏在紫色裙底下的奇妙风光。\n“呀？这是……小石头？” \n刚好抬起头，少女注意到了面前的小行星，带着疑惑的表情将脸凑近，仔细打量了一番，然后又好奇地伸出手掌，蓝色的小行星在她手中就像一颗弹珠一样小巧，被轻易捏住。\n“好像有很强烈的能量波动，并不像是天然的呢？” \n“非常感谢，加拉哈德小姐，如果让这颗小行星撞上我们的星球……那就危险了” \n“到底是怎么回事呢？” \n“是这样……有个法师的实验出了意外……”\n经过一番简单的解释，加拉哈德小姐了解了原因。\n“哎，是这样吗？那我帮你们解决掉好啦，你们也真是的，做实验居然差点把自己的星球毁了” \n看着指尖的小行星，加拉哈德嘟囔着最，手指微微用力，就将其捏碎，变成了大量更加微小的碎屑。\n“话说，你们的星球到底在哪呢？我怎么没看到” \n“那个，这么说可能有点失礼，请您把头低下，我们在您下面” \n“呜哇！？原来你们在这里呀……因为太小了刚刚没发现” \n低头望去，加拉哈德小姐终于发现了在她身下的小小星球。害羞地涨红了脸，下意识伸手去遮，而这也导致她的衣裙更加剧烈的晃动起来，好像随时可能撞到星球上。\n“啊啊啊！请您小心一点，我们的小星球可经不住您的力量” \n§Y[From.Planet.GetName]§!刚刚劫后余生的居民，还未来得及开始庆祝，就再次迎来更大的危险。\n“哇，对不起，对不起啦！” \n通讯传来的尖叫让加拉哈德连忙道歉。拉开距离，控制着自己的身体将那张可爱的面庞对准星球，表情认真却又带着惊慌，语速不受控制的加快。\n“总之你们下次也小心一点，不要再做这么危险的实验啦，那个……我先走啦，再见” \n留下最后一句提醒，这位天体级少女仓皇而逃，离开了这个星系。§Y[From.Planet.GetName]§!终于恢复了往日的和平，居民们举行了盛大的庆祝活动。也许这次事件应该会让那些疯狂的法师得到教训，少做一些危险的实验。\n经过探查，我们发现这颗小行星的是由高浓度的魔力结晶构成，哪怕是一些边角料都可以作为优秀的能源供应。我们已尽可能将这些优质资源回收。"
 aom_leader_cg.11.a:0 "这是好险"

