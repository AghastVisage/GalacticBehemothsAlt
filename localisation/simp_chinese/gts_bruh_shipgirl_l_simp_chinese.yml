    # 武器
    tech_gts_bruh_shipgirl_torpedo_1: "饱和雷击战术"
    tech_gts_bruh_shipgirl_torpedo_1_desc: "§M(Bruh系列科技)§!\n精准度？不需要那种东西。只要将这片星域填满巨大的金属圆柱体，敌人便无处可逃。这项科技解锁了挂载于舰娘大腿外侧的超巨型鱼雷发射管"

    tech_gts_bruh_shipgirl_kinetic_artillery_1: "舰娘手持火炮训练"
    tech_gts_bruh_shipgirl_kinetic_artillery_1_desc: "§M(Bruh系列科技)§!\n虽然主炮的威力令人著迷，但我们不能忽视近距离的缠斗。通过训练舰娘如何同时操作舰装上的多门中小口径火炮，或者在主炮装填间隙使用手持副武器进行射击，填补火力空白，§Y以及不把弹壳砸在友军的船舰上！§!"
    tech_gts_bruh_shipgirl_kinetic_artillery_2: "驱逐舰娘专用火控"
    tech_gts_bruh_shipgirl_kinetic_artillery_2_desc: "§M(Bruh系列科技)§!\n$gts_bruh_shipgirl_ship_sizes_1$以灵活著称，她们的武器也应如此。我们改变了传统的大口径主炮思路，转而研发了一种轻量化、牺牲射程的动能红炮系统"
    tech_gts_bruh_shipgirl_kinetic_artillery_3: "超大口径铸造工艺"
    tech_gts_bruh_shipgirl_kinetic_artillery_3_desc: "§M(Bruh系列科技)§!\n不管是什么问题，只要炮管够粗、口径够大就能解决。如果一发§Y460000000mm§!的实体炮弹不能解决问题，那就再来一发。这项科技致力于制造出与无畏舰娘那宏伟的身躯相称的巨炮"

    tech_gts_bruh_shipgirl_kinetic_sword_1: "近身格斗CQC"
    tech_gts_bruh_shipgirl_kinetic_sword_1_desc: "§M(Bruh系列科技)§!\n在星际时代用冷兵器听起来很蠢？那是因为妳的刀不够大。当火炮过热、弹药耗尽，或者单纯只是想体验切开金属的手感时，一把由高密度合金锻造的、长达数万公里的实体长刀就是最好的伙伴。直接用一块几万公里长的合金砍在敌方舰群上，比什么雷射都管用"

    tech_gts_bruh_shipgirl_point_defence_1: "动态视力强化"
    tech_gts_bruh_shipgirl_point_defence_1_desc: "§M(Bruh系列科技)§!\n那些苍蝇般的导弹和战机太烦人了。通过特殊的眼球运动训练，舰娘现在可以看清高速飞行的微小目标，并指挥近防炮将其击落，就像拍死蚊子一样简单。"
    tech_gts_bruh_shipgirl_flak_battery_1: "弹幕覆盖理论"
    tech_gts_bruh_shipgirl_flak_battery_1_desc: "§M(Bruh系列科技)§!\n与其瞄准单个目标，不如把那一片区域全部填满弹片。教会舰娘使用霰弹原理，向敌方机群方向喷射金属风暴，确保没有任何东西能穿过这道墙"

    tech_gts_bruh_shipgirl_strike_craft_1: "航空战术理论"
    tech_gts_bruh_shipgirl_strike_craft_1_desc: "§M(Bruh系列科技)§!\n舰载机会从舰娘手中的飞行甲板(有时是一把弓)起飞，舰娘们能够操控那些围绕她们飞行的小家伙，无论是通过意念连结还是简单的无线电指挥。对于舰娘来说，它们是可爱的玩具，但对于敌人来说，这些携带了重型航弹和机炮的机群是致命的蜂群"

    # 反应炉
    tech_gts_bruh_shipgirl_reactor_1: "基础代谢法"
    tech_gts_bruh_shipgirl_reactor_2: "饥饿适应术"
    tech_gts_bruh_shipgirl_reactor_3: "暴食消化法"
    tech_gts_bruh_shipgirl_reactor_4: "星体吞噬术"
    tech_gts_bruh_shipgirl_reactor_1_desc: "§M(Bruh系列科技)§!\n透过规律的饮食训练与营养管理，让舰娘的身体学会更有效率地转化食物为能量。这是所有巨型生物兵器的基础训练课程"
    tech_gts_bruh_shipgirl_reactor_2_desc: "§M(Bruh系列科技)§!\n透过周期性的断食训练，强化舰娘在缺乏补给时的持久作战能力。她们的身体会学习储存并缓慢释放能量"
    tech_gts_bruh_shipgirl_reactor_3_desc: "§M(Bruh系列科技)§!\n极端的饥饿与饱食交替训练，迫使舰娘的消化系统突破生理极限。她们现在能够快速分解并吸收各种物质"
    tech_gts_bruh_shipgirl_reactor_4_desc: "§M(Bruh系列科技)§!\n舰娘现在将恒星和行星视为零食，没有什么是她不能消化的"
    tech_gts_bruh_shipgirl_reactor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$船体值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$船体值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$船体值：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_hull_mult: "$gts_bruh_shipgirl_ship_sizes_1$船体值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_hull_mult: "$gts_bruh_shipgirl_ship_sizes_1$船体值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_hull_mult: "$gts_bruh_shipgirl_ship_sizes_1$船体值"

    # 跃迁引擎
    tech_gts_bruh_shipgirl_drive_1: "基础跳跃术"
    tech_gts_bruh_shipgirl_drive_2: "蹬踏爆发术"
    tech_gts_bruh_shipgirl_drive_3: "星海跃进术"
    tech_gts_bruh_shipgirl_drive_4: "瞬息千里术"
    tech_gts_bruh_shipgirl_drive_2_desc: "§M(Bruh系列科技)§!\n训练舰娘的腿部肌肉与协调性，让她们能够在星际空间中进行基础的长距离跳跃"
    tech_gts_bruh_shipgirl_drive_3_desc: "§M(Bruh系列科技)§!\n强化训练让舰娘掌握爆发性的蹬踏技巧，能够以天体为踏板进行更远距离的跃进"
    tech_gts_bruh_shipgirl_drive_1_desc: "§M(Bruh系列科技)§!\n精密的动作训练让舰娘能够精准控制落点，并在连续跳跃中保持方向"
    tech_gts_bruh_shipgirl_drive_4_desc: "§M(Bruh系列科技)§!\n最高阶的身体训练让舰娘的一步跨越变得如同瞬移，光年距离不过弹指之间"
    tech_gts_bruh_shipgirl_drive_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$跃迁引擎冷却：§G-5%§!\n$gts_bruh_shipgirl_ship_sizes_2$跃迁引擎冷却：§G-5%§!\n$gts_bruh_shipgirl_ship_sizes_3$跃迁引擎冷却：§G-5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_jumpdrive_cooldown_mult: "$gts_bruh_shipgirl_ship_sizes_1$跃迁引擎冷却"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_jumpdrive_cooldown_mult: "$gts_bruh_shipgirl_ship_sizes_1$跃迁引擎冷却"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_jumpdrive_cooldown_mult: "$gts_bruh_shipgirl_ship_sizes_1$跃迁引擎冷却"

    # 推进器
    tech_gts_bruh_shipgirl_thruster_1: "裸足"
    tech_gts_bruh_shipgirl_thruster_2: "袜子"
    tech_gts_bruh_shipgirl_thruster_3: "步鞋"
    tech_gts_bruh_shipgirl_thruster_4: "靴子"
    tech_gts_bruh_shipgirl_thruster_1_desc: "§M(Bruh系列科技)§!\n训练舰娘适应赤足在各种表面行走，强化足底的感知与耐受度"
    tech_gts_bruh_shipgirl_thruster_2_desc: "§M(Bruh系列科技)§!\n教导舰娘穿著轻薄袜物进行战斗，在保护足部的同时维持灵活性"
    tech_gts_bruh_shipgirl_thruster_3_desc: "§M(Bruh系列科技)§!\n训练舰娘习惯轻量化鞋具的重量与限制，提升移动效率"
    tech_gts_bruh_shipgirl_thruster_4_desc: "§M(Bruh系列科技)§!\n让舰娘适应厚重军靴的负重，将鞋具转化为额外的攻击手段"
    tech_gts_bruh_shipgirl_thruster_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$亚光速航速：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$亚光速航速：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$亚光速航速：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_speed_mult: "$gts_bruh_shipgirl_ship_sizes_1$亚光速航速"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_speed_mult: "$gts_bruh_shipgirl_ship_sizes_1$亚光速航速"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_speed_mult: "$gts_bruh_shipgirl_ship_sizes_1$亚光速航速"

    # 感测器
    tech_gts_bruh_shipgirl_sensor_1: "视力强化术"
    tech_gts_bruh_shipgirl_sensor_2: "听觉训练"
    tech_gts_bruh_shipgirl_sensor_3: "嗅觉追踪"
    tech_gts_bruh_shipgirl_sensor_4: "本能感知"
    tech_gts_bruh_shipgirl_sensor_1_desc: "§M(Bruh系列科技)§!\n透过专门的视力训练，让舰娘能够辨识遥远星系中的细微异常"
    tech_gts_bruh_shipgirl_sensor_2_desc: "§M(Bruh系列科技)§!\n在绝对寂静中训练听觉，让舰娘能捕捉星际介质中传递的震波"
    tech_gts_bruh_shipgirl_sensor_3_desc: "§M(Bruh系列科技)§!\n训练舰娘辨识不同文明飞船独特的气味特征"
    tech_gts_bruh_shipgirl_sensor_4_desc: "§M(Bruh系列科技)§!\n玄学，但有效。透过冥想与实战训练，强化舰娘对危险的直觉预感能力"
    tech_gts_bruh_shipgirl_sensor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$追踪：§G+5§!\n$gts_bruh_shipgirl_ship_sizes_2$追踪：§G+5§!\n$gts_bruh_shipgirl_ship_sizes_3$追踪：§G+5§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$追踪"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$追踪"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$追踪"

    # 装甲
    tech_gts_bruh_shipgirl_armor_1: "流体动力学泳衣"
    tech_gts_bruh_shipgirl_armor_2: "青春气息激励学"
    tech_gts_bruh_shipgirl_armor_3: "制服心理学"
    tech_gts_bruh_shipgirl_armor_4: "仪式感设计"
    tech_gts_bruh_shipgirl_armor_1_desc: "§M(Bruh系列科技)§!\n经过无数次的风洞与流体实验，我们发现最适合巨娘在星海中高速穿梭的并非厚重的板甲，而是紧致贴身的高弹性布料。这种设计能最大程度减少与星际尘埃的摩擦，同时展现出舰娘完美的身体曲线"
    tech_gts_bruh_shipgirl_armor_2_desc: "§M(Bruh系列科技)§!\n经过社会学家的研究，让舰娘穿著象征青春活力的服饰，能有效降低敌人的戒心，同时大幅提升我方观测人员(以及舰娘本人)的士气"
    tech_gts_bruh_shipgirl_armor_3_desc: "§M(Bruh系列科技)§!\n研究表明，特定的服装款式不仅能提供防护，还能极大提升舰娘的自信心，并对敌方小人造成巨大的心理压力。谁能在几万公里的女仆裙摆下保持冷静呢？"
    tech_gts_bruh_shipgirl_armor_4_desc: "§M(Bruh系列科技)§!\n真正的强者只需要站在那里就能让敌人胆寒。笔挺的军官礼服和厚重的披风能最大程度地衬托出舰娘如神明般的威严"
    tech_gts_bruh_shipgirl_armor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$装甲值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$装甲值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$装甲值：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$装甲值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$装甲值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$装甲值"

    # 护盾
    tech_gts_bruh_shipgirl_shield_1: "基础棉纺织工艺"
    tech_gts_bruh_shipgirl_shield_2: "视线诱导迷彩"
    tech_gts_bruh_shipgirl_shield_3: "极限布料张力学"
    tech_gts_bruh_shipgirl_shield_4: "极限防御理论"
    tech_gts_bruh_shipgirl_shield_1_desc: "§M(Bruh系列科技)§!\n透过特种合成纤维，我们终于能够编织出足以覆盖舰娘庞大身躯的基础布料。这标志著我们的舰娘终于不用在太空中裸奔了(虽然有些人对此表示遗憾)\n最柔软、最透气的纯棉材质能最大程度减少舰娘在太空中长时间作战的摩擦不适感，保护最私密的区域"
    tech_gts_bruh_shipgirl_shield_2_desc: "§M(Bruh系列科技)§!\n透过特定的色彩排列，可以强制吸引观测者的注意力，造成视觉残留与精神恍惚。这是一种心理学上的隐形迷彩，敌人会盯著看而忘记开火"
    tech_gts_bruh_shipgirl_shield_3_desc: "§M(Bruh系列科技)§!\n为了实现最大胆的穿著风格，我们必须研发出一种依靠极少接触面积就能固定在舰娘光滑肌肤上的材料"
    tech_gts_bruh_shipgirl_shield_4_desc: "§M(Bruh系列科技)§!\n防御的最高境界就是「几乎没有防御」。透过极致的削减覆盖面积，以此羞耻感转化为肾上腺素与极致的闪避本能。这需要舰娘拥有极高的自信"
    tech_gts_bruh_shipgirl_shield_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$护盾承受值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$护盾承受值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$护盾承受值：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$护盾承受值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$护盾承受值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$护盾承受值"

    # 辅助配件
    tech_gts_bruh_shipgirl_aux_1: "表皮维护协议"
    tech_gts_bruh_shipgirl_aux_2: "光能捕获阵列"
    tech_gts_bruh_shipgirl_aux_3: "巨体流体力学"
    tech_gts_bruh_shipgirl_aux_4: "卫生管理条例"
    tech_gts_bruh_shipgirl_aux_5: "资源开采许可"
    tech_gts_bruh_shipgirl_aux_1_desc: "§M(Bruh系列科技)§!\n与其让小人军队在星球上无所事事，不如让它们搬到舰娘的身上居住。我们训练了一批专业的工程师与清洁工，在舰娘的毛孔与衣物纤维间建立微型殖民地"
    tech_gts_bruh_shipgirl_aux_2_desc: "§M(Bruh系列科技)§!\n既然舰娘总是喜欢躺在恒星附近「晒日光浴」，我们为什么不利用这一点呢？通过在她受光面积最大的背部与肩部太阳能板，我们能为她身上的小人设施提供源源不断的清洁能源，甚至能反向为舰娘的护盾充能"
    tech_gts_bruh_shipgirl_aux_3_desc: "§M(Bruh系列科技)§!\n舰娘在激战中分泌的汗液对我们来说无异于一场突发的特大洪水。为了防止重要的维护设施被带有费洛蒙的盐水冲毁，我们必须在她汗腺密集的区域，特别是足底和腋下，建立复杂的排水与循环系统"
    tech_gts_bruh_shipgirl_aux_4_desc: "§M(Bruh系列科技)§!\n在舰娘最私密、最潮湿的深谷中，沉积著大量的新陈代谢产物。如果不加理会，这些沉积物会影响舰娘的健康与心情。我们需要一支视死如归的清洁部队，深入这片高温高湿的禁区"
    tech_gts_bruh_shipgirl_aux_5_desc: "§M(Bruh系列科技)§!\n在获得了舰娘本人的羞涩点头(以及签署了无数份一旦因过度刺激导致误伤则后果自负的免责声明)后，我们终于可以在那粉色的高原边缘建立自动化站点，采集那些干涸的乳垢和皮屑矿物"

    ############################################################################################################################################
    ##################################################                  武器                  ##################################################
    ############################################################################################################################################

    # 鱼雷
    gts_bruh_shipgirl_torpedo_component_set_1: "舰娘鱼雷"
    gts_bruh_shipgirl_torpedo_component_set_1_DESC: "§M(Bruh系列武器)§!\n体积相当于小人战列舰的巨型鱼雷。虽然缺乏精密电子元件，但内部装填了极不稳定的高能炸药。它们依靠舰娘的投掷力道或原始推进器飞向目标，一旦命中，其当量足以在敌方主宰上制造出一个可以停泊战列舰的洞"
    gts_bruh_shipgirl_torpedo_1_S: "小型舰娘鱼雷"
    gts_bruh_shipgirl_torpedo_1_M: "中型舰娘鱼雷"
    gts_bruh_shipgirl_torpedo_1_L: "大型舰娘鱼雷"

    # 动能
    gts_bruh_shipgirl_kinetic_artillery_component_set_1: "舰娘动能副炮"
    gts_bruh_shipgirl_kinetic_artillery_component_set_2: "驱逐舰娘动能主炮"
    gts_bruh_shipgirl_kinetic_artillery_component_set_3: "舰娘动能主炮"
    gts_bruh_shipgirl_kinetic_artillery_component_set_1_DESC: "§M(Bruh系列武器)§!\n装备在舰娘舾装两侧或手持的中口径实弹火炮。虽然被称为"副炮"，但射出的每一发炮弹都相当于一座摩天大楼。依靠化学能推进的弹头虽然原始，但凭借单纯的质量与动能，足以将任何胆敢靠近的小人舰船砸成废铁。这些副炮能提供稳定而持续的火力输出"
    gts_bruh_shipgirl_kinetic_artillery_component_set_2_DESC: "这是一门为「贴脸输出」而生的截短型动能主炮，专为$gts_bruh_shipgirl_ship_sizes_1$订制。虽然口径惊人，但为了适应$gts_bruh_shipgirl_ship_sizes_1$的作战风格，我们锯短了砲管并移除了部分稳定器。这使得该武器在远距离散布感人，但在贴脸狗斗的距离上，它能以惊人的射速将砲弹直接塞进敌人的舰桥里。\n§Y"为了这一发，我可是冲到了能看清小人惊恐表情的距离啊！"§!"
    gts_bruh_shipgirl_kinetic_artillery_component_set_3_DESC: "§M(Bruh系列武器)§!\n这在舰娘军火库中不仅仅是一门炮，更是一种威慑。每一次开火产生的后座力都能将周围的小行星推开，出膛的超重型穿甲弹携带的动能足以贯穿星球的地壳。这是纯粹物理法则的暴力美学，没有任何花俏，只有毁灭"
    gts_bruh_shipgirl_kinetic_artillery_1_S: "小型舰娘动能副炮"
    gts_bruh_shipgirl_kinetic_artillery_1_M: "中型舰娘动能副炮"
    gts_bruh_shipgirl_kinetic_artillery_1_L: "大型舰娘动能副炮"
    gts_bruh_shipgirl_kinetic_artillery_2_L: "驱逐舰娘动能主炮"
    gts_bruh_shipgirl_kinetic_artillery_1_X: "巨型舰娘动能主炮"

    # 斩舰刀
    gts_bruh_shipgirl_kinetic_sword_component_set_1: "舰娘斩舰刀"
    gts_bruh_shipgirl_kinetic_sword_component_set_1_DESC: "§M(Bruh系列武器)§!\n一把朴实无华、长度惊人的实体巨剑。没有任何能量力场，也不需要充能。它唯一的优点就是硬和重。当舰娘挥舞它时，仅仅是剑身带动的引力波就能扯碎周围的小型战机，而被锋刃直接命中的主力舰，会像切蛋糕一样被物理截断"
    gts_bruh_shipgirl_kinetic_sword_1_T: "舰娘斩舰刀"

    # 防空
    gts_bruh_shipgirl_point_defence_component_set_1: "三连装点防御"
    gts_bruh_shipgirl_point_defence_component_set_1_DESC: "§M(Bruh系列武器)§!\n安装在舰娘舾装的小型自动火炮系统。拥有极高的射速和灵活的转向能力。虽然对大船伤害有限，但用来在其形成的弹幕网中粉碎敌方的导弹和舰载机绰绰有余"
    gts_bruh_shipgirl_point_defence_S: "小型三连装点防御"
    gts_bruh_shipgirl_point_defence_M: "中型三连装点防御"
    gts_bruh_shipgirl_point_defence_L: "大型三连装点防御"

    gts_bruh_shipgirl_flak_battery_component_set_1: "三连装高射炮"
    gts_bruh_shipgirl_flak_battery_component_set_1_DESC: "§M(Bruh系列武器)§!\n专门发射定时引信榴霰弹的火炮。炮弹在预定距离炸裂，释放出数以万计的高速钢珠。对于脆弱的攻击机群来说，这就是一场无法躲避的金属暴雨，能瞬间清空一片空域"
    gts_bruh_shipgirl_flak_battery_S: "小型三连装高射炮"
    gts_bruh_shipgirl_flak_battery_M: "中型三连装高射炮"
    gts_bruh_shipgirl_flak_battery_L: "大型三连装高射炮"

    # 舰载机
    gts_bruh_shipgirl_strike_craft_hangar_component_set_1: "海火"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_2: "地狱猫"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_3: "Pe-8"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_1_DESC: "一种轻盈优雅的战斗机，从舰娘的具装中如飞鸟般掠出。虽然挂载能力有限，但它们速度极快，能像烦人的蚊子一样围绕敌舰旋转，诱使敌方防空火力浪费弹药，或者精准点杀敌方来袭的轰炸机，保护舰娘不被弄脏衣服"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_2_DESC: "皮实耐造的通用型战机，机身结构坚固到甚至能替舰娘挡下一发流弹。它们既能挂载炸弹对敌舰进行拆迁，也能在空战中咬碎敌人的机翼"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_3_DESC: ""§Y它飞行缓慢，机动性几乎为零，就像一只笨拙的鹅§!。"\n这架轰炸机笨重得就像一块会飞的砖头，它几乎没有任何空战能力，唯一的用途就是运送那枚FAB-5000巨型高爆航弹。但只要有一架成功飞抵敌舰，那枚炸弹产生的纯粹物理冲击波就足以震碎周围脆弱的护盾结构，将任何护卫舰级别的目标直接气化"
    gts_bruh_shipgirl_strike_craft_hangar_1: "海火"
    gts_bruh_shipgirl_strike_craft_hangar_2: "地狱猫"
    gts_bruh_shipgirl_strike_craft_hangar_3: "Pe-8"

    ############################################################################################################################################
    ####################################################                配件                ####################################################
    ############################################################################################################################################

    gts_bruh_shipgirl_ftl_components: "舰娘超光速部件"
    gts_bruh_shipgirl_ftl_components_DESC: "舰娘超光速部件"
    gts_bruh_shipgirl_sensor_components: "舰娘感测器"
    gts_bruh_shipgirl_sensor_components_DESC: "舰娘感测器"

    # 反应炉
    gts_bruh_shipgirl_reactor_component_template_1: "基础代谢"
    gts_bruh_shipgirl_reactor_component_template_2: "饥饿适应"
    gts_bruh_shipgirl_reactor_component_template_3: "暴食消化"
    gts_bruh_shipgirl_reactor_component_template_4: "星体吞噬"
    gts_bruh_shipgirl_reactor_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n透过基础的饮食训练，舰娘能够有效维持庞大身躯的日常活动所需"
    gts_bruh_shipgirl_reactor_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n饥饿训练让舰娘学会在长时间缺乏补给的情况下仍能保持战斗力"
    gts_bruh_shipgirl_reactor_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n极限训练后的舰娘消化系统能够快速分解各种物质并转化为能量"
    gts_bruh_shipgirl_reactor_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n经过最终训练的舰娘能将天体直接作为食物消化吸收"

    # 跃迁引擎
    gts_bruh_shipgirl_drive_component_template_1: "基础跳跃"
    gts_bruh_shipgirl_drive_component_template_2: "蹬踏爆发"
    gts_bruh_shipgirl_drive_component_template_3: "星海跃进"
    gts_bruh_shipgirl_drive_component_template_4: "瞬息千里"
    gts_bruh_shipgirl_drive_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n舰娘透过基础训练掌握的跳跃能力，能够进行星系间的移动"
    gts_bruh_shipgirl_drive_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n强化后的腿部爆发力让舰娘能以天体为踏板进行更远的跳跃"
    gts_bruh_shipgirl_drive_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n精密训练后的舰娘能够精确控制跳跃方向与落点"
    gts_bruh_shipgirl_drive_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n最高阶训练让舰娘的移动速度达到近乎瞬移的境界"

    # 推进器
    gts_bruh_shipgirl_thruster_component_template_1: "娇嫩裸足"
    gts_bruh_shipgirl_thruster_component_template_2: "防滑棉袜"
    gts_bruh_shipgirl_thruster_component_template_3: "运动跑鞋"
    gts_bruh_shipgirl_thruster_component_template_4: "厚重军靴"
    gts_bruh_shipgirl_thruster_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n舰娘赤裸的双足能够直接感知星体表面，灵活但缺乏防护"
    gts_bruh_shipgirl_thruster_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n薄袜提供基本防护同时保持足部灵敏度"
    gts_bruh_shipgirl_thruster_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n轻便鞋具让舰娘能够全力奔跑而不受伤"
    gts_bruh_shipgirl_thruster_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n厚重军靴让舰娘的每一步都带有毁灭性的冲击"

    # 感测器
    gts_bruh_shipgirl_sensor_component_template_1: "视力强化"
    gts_bruh_shipgirl_sensor_component_template_2: "听觉训练"
    gts_bruh_shipgirl_sensor_component_template_3: "嗅觉追踪"
    gts_bruh_shipgirl_sensor_component_template_4: "本能感知"
    gts_bruh_shipgirl_sensor_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n强化后的视力让舰娘能够看清光年外的目标"
    gts_bruh_shipgirl_sensor_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n舰娘竖起耳朵(或者转动兽耳)，捕捉太空中不自然的波动。"
    gts_bruh_shipgirl_sensor_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n敏锐的嗅觉能追踪敌舰残留的气味轨迹"
    gts_bruh_shipgirl_sensor_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n"我觉得那边有人"舰娘指著一片空旷的黑暗说道。事实证明，她总是对的。本能般的感知让舰娘能预判敌人的位置"

    # 辅助配件
    gts_bruh_shipgirl_aux_component_set_1: "体表损管小队"
    gts_bruh_shipgirl_aux_component_set_2: "真的太阳能板"
    gts_bruh_shipgirl_aux_component_set_3: "足汗循环系统"
    gts_bruh_shipgirl_aux_component_set_4: "阴垢清理部门"
    gts_bruh_shipgirl_aux_component_set_5: "乳晕采集平台"
    gts_bruh_shipgirl_aux_component_set_1_DESC: "§M(Bruh系列辅助配件)§!\n一支居住在舰娘身上的微型工程舰队。它们平日负责清理舰娘身上的战斗残骸、缝补破损的衣物。一旦舰娘受伤，它们就会驾驶著相对于舰娘来说如螨虫般大小的维修车，在她广阔的皮肤大地上飞驰，进行快速焊接和医疗喷涂作业。\n§R"主要风险是被舰娘无意识地拍死"§!"
    gts_bruh_shipgirl_aux_component_set_2_DESC: "§M(Bruh系列辅助配件)§!\n这不是比喻。这是一块物理意义上、面积相当于一片大陆的巨大太阳能板。\n§Y"不是那种小人屋顶上的那种玩具......"§!"
    gts_bruh_shipgirl_aux_component_set_3_DESC: "§M(Bruh系列辅助配件)§!\n专为长时间穿著鞋袜的舰娘设计，建立在舰娘足弓与趾缝间的复杂水利工程会拦截那毁灭性的汗液洪流。经过过滤的足汗被注入冷却管道，带走武器过热的温度，或者被储存起来作为生活用水。当然，工作环境的气味是一大挑战。\n§Y"这能让舰娘在激烈的运动战中保持足部......相对的干爽"§!"
    gts_bruh_shipgirl_aux_component_set_4_DESC: "§M(Bruh系列辅助配件)§!\n一些建立在两片宏伟肉唇之间的附著式建筑群。这里的居民终日生活在湿润、温暖且气味独特的环境中。专职负责清理这条巨大峡谷中的所有沉积物。这里也是著名的旅游胜地，尽管常因舰娘的生理反应而发生洪水。\n§Y"清洁工们每日驾驶机甲进入少女私处深处，挖掘并清理那些积累已久的白色垢状物，只是有时一些人也不幸成为了其中一部分"§!"
    gts_bruh_shipgirl_aux_component_set_5_DESC: "§M(Bruh系列辅助配件)§!\n锚定在乳晕褶皱上的采集站。这里的钻头经过特殊软化处理，以免刺激到舰娘。工人们日以继夜地刮取沉积的乳垢和收集微量渗出的乳汁。\n§R"要是舰娘感到搔痒而进行抓挠，整个平台都会面临灭顶之灾"§!"
    gts_bruh_shipgirl_aux_component_template_1: "体表损管小队"
    gts_bruh_shipgirl_aux_component_template_2: "真的太阳能板"
    gts_bruh_shipgirl_aux_component_template_3: "足汗循环系统"
    gts_bruh_shipgirl_aux_component_template_4: "阴垢清理都市"
    gts_bruh_shipgirl_aux_component_template_5: "乳晕采集平台"

    # 作战电脑
    gts_bruh_shipgirl_combat_computer_1: "重樱海军教育"
    gts_bruh_shipgirl_combat_computer_1_DESC: "§M(Bruh系列武器)§!\n我们的舰娘在海军学校重点学习战斗精神。在战斗中，她们一旦发现敌人就会拔出斩舰刀，高呼著第四天灾板载，向敌方发起突击"
    gts_bruh_shipgirl_combat_computer_2: "铁血海军教育"
    gts_bruh_shipgirl_combat_computer_2_DESC: "§M(Bruh系列武器)§!\n我们的舰娘在海军学校重点学习实战战术。在战斗中，她们会如幽灵般摸到敌人近处再如群狼般进行袭击以干扰敌舰指挥，阻滞敌军前进"
    gts_bruh_shipgirl_combat_computer_3: "皇家海军教育"
    gts_bruh_shipgirl_combat_computer_3_DESC: "§M(Bruh系列武器)§!\n我们的舰娘在海军学校重点学习战斗艺术。在战斗中，充分的教养会使得她们与敌方舰队在适中的距离下冷静地进行堂堂正正的战斗"
    gts_bruh_shipgirl_combat_computer_4: "北联海军教育"
    gts_bruh_shipgirl_combat_computer_4_DESC: "§M(Bruh系列武器)§!\n我们的舰娘在海军学校重点学习武器操作。在战斗中，深知大就是好、多就是美的舰娘们会在安全距离向敌人大量倾泻弹药"
    gts_bruh_shipgirl_combat_computer_5: "白鹰海军教育"
    gts_bruh_shipgirl_combat_computer_5_DESC: "§M(Bruh系列武器)§!\n我们的舰娘在海军学校重点学习理论革新，在战斗中，她们会在超远距将实验得出的版本之子直接呼到敌人脸上"

    gts_bruh_shipgirl_arua_1: "贪婪之口"
    gts_bruh_shipgirl_arua_1_DESC: "§M(Bruh系列光环部件)§!\n舰娘那张足以吞噬卫星的樱桃巨口，此刻对于敌方舰队而言就是通往地狱的大门。当她微微张开双唇，那如山脉般洁白整齐的牙齿便展露无遗，嘴角拉丝的黏稠唾液如同几万公里长的轨道电梯缆绳般在太空中飘荡。随著她那湿热且带有浓郁甜腥味的口气呼出，含有高浓度消化酶的水雾瞬间覆盖了敌舰的感测器。这种即将被作为食物咀嚼、吞咽并在胃酸中悲惨消化的原始生物恐惧，直接击穿了敌方船员的心理防线。在这种被捕食者盯上的极度恐慌中，敌军炮手颤抖不已，导致火控系统的命中率大幅下降，因为没有人能在即将滑入食道的绝望中保持冷静瞄准"
    gts_bruh_shipgirl_arua_2: "淫靡之穴"
    gts_bruh_shipgirl_arua_2_DESC: "§M(Bruh系列光环部件)§!\n舰娘刻意将她湿润的阴唇对准敌方舰队方向，那道粉嫩的缝隙散发著强烈的雌性气息和温热的水气。敌舰的船员会不由自主地将视线锁定在那个禁忌的部位。这种视觉冲击完全破坏了敌方的战术纪律，许多舰船的舰长会发现自己无法下达撤退命令，因为他们的理智已被那个湿润的深谷所吸引。更有甚者，部分敌舰会不受控制地向舰娘靠近，仿佛被一种原始的渴望驱使著飞蛾扑火。这种异常行为让敌方舰队的撤退效率极度低下，许多本该逃脱的战舰因为犹豫或偏航而暴露在火力范围内，最终被我方舰队或舰娘本人轻易歼灭"
    gts_bruh_shipgirl_arua_3: "吸引之乳"
    gts_bruh_shipgirl_arua_3_DESC: "§M(Bruh系列光环部件)§!\n这对悬浮在星海之中的巨大乳房，以其惊人的质量成为了战场上最无法忽视的存在。随著舰娘在战斗中的每一个动作，这两团柔软的半球体都会产生剧烈的乳摇。那白皙细腻的肌肤在星光的反射下熠熠生辉，而顶端那如同粉色平原般巨大的乳晕和挺立的乳首更是吸引了敌方所有的注意力。敌方炮手在瞄准时，视线会不由自主地被这充满弹性的双乳所捕获，大脑中充满了对其手感与温度的性幻想，从而忘记了装填弹药或扣动扳机。这种源自生物本能的强烈分心效应，使得敌方舰队的整体射击频率出现断崖式下跌，无人能将目光从这宏伟的景观上移开"
    gts_bruh_shipgirl_arua_4: "刺激之语"
    gts_bruh_shipgirl_arua_4_DESC: "§M(Bruh系列光环部件)§!\n当舰娘用她那足以震动整个星系的嗓音发出战斗号令时，我方舰队的每一个成员都能清晰地听到那充满力量的声音在通讯频道中回响。她的话语简洁而有力，直接命中每个战士心中对胜利的渴望和对荣誉的追求。更重要的是，舰娘的声音能够消除战斗中的疲劳和恐惧，让每个船员都保持在最佳的精神状态下操作武器系统，从而实现持续的高效火力输出"
    gts_bruh_shipgirl_arua_5: "引导之目"
    gts_bruh_shipgirl_arua_5_DESC: "§M(Bruh系列光环部件)§!\n舰娘那双能够清晰看穿星云的巨大眼睛成为了我方舰载机最可靠的指挥中枢。她的视线能够覆盖整个战场，精确捕捉每一架敌机的动向和每一艘敌舰的弱点。当她的目光扫过我方的机群时，飞行员们会立即接收到最优的攻击路线和目标优先度指令。这种视觉指挥让我方舰载机的战术配合达到了近乎完美的程度。飞行员们在舰娘注视下会感到一种强烈的使命感和自信心，他们的反应速度和判断能力都会得到显著提升，即使面对数倍于己的敌机也能保持冷静并执行高难度的机动动作，最终取得压倒性的空战优势"
    gts_bruh_shipgirl_arua_6: "秽臭之菊"
    gts_bruh_shipgirl_arua_6_DESC: "§M(Bruh系列光环部件)§!\n当舰娘将她紧闭的肛门对准敌方机群方向时，即使没有实际排泄物释放，那个褐色的褶皱洞口本身就散发著一种令人作呕的视觉压迫感。敌方舰载机的飞行员会因为看到那个巨大的排泄口而产生强烈的恶心反应，许多人会在驾驶舱内干呕甚至直接呕吐，导致操控精度大幅下降。更糟糕的是，这种心理阴影会持续存在，许多飞行员在目睹舰娘的肛门后会产生创伤后应激反应，在之后的战斗中只要看到类似的圆形结构就会不由自主地回想起那个恐怖的画面，从而导致敌方舰载机部队的整体战斗力持续衰减"

