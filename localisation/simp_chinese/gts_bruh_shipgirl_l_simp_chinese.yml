    gts_bruh_shipgirl_ship_sizes_1_projects_DESC: "在[event_target:gts_bruh_random_spawn_system_1.GetName]的边缘，我们发现了一片散落著巨大金属圆筒的区域，看起来像是未爆的超巨型鱼雷"
    gts_bruh_shipgirl_ship_sizes_2_projects_DESC: "在[event_target:gts_bruh_random_spawn_system_2.GetName]星系内漂浮著数以万计的巨大黄铜圆筒，那是比我们最大的太空站还要巨大的弹壳。扫描还发现了一些损毁的舰载机残骸，被整块撕裂的小行星。这毫无疑问是一位拥有重火力的战舰留下的靶场"
    gts_bruh_shipgirl_ship_sizes_3_projects_DESC: "在[event_target:gts_bruh_random_spawn_system_3.GetName]星系内的一颗行星被某种难以想像的利器物理切开，断面光滑如镜。更令人恐惧的是，星系中央残留著大量成分不明的黏稠液体，这些液体包裹著无数被挤压变形的星球"

    gts_bruh_shipgirl_planet_killer_panties_chain_title: "获取Bruh舰娘实验数据"
