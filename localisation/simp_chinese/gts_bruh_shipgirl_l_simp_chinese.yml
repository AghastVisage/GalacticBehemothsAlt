    GTS_HIBIKI_DESTROYER_STERN: "響防空組件"

    # 戰列艦娘
    gts_bruh_shipgirl_ship_sizes_2: "Bruh戰列艦娘"
    gts_bruh_shipgirl_ship_sizes_2_plural: "$gts_bruh_shipgirl_ship_sizes_2$"
    gts_bruh_shipgirl_ship_sizes_2_cap: "$gts_bruh_shipgirl_ship_sizes_2$"
    gts_bruh_shipgirl_ship_sizes_2_short: "戰列艦娘"
    SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_2_DESC: "§M(Bruh系列艦娘)§!\n艦隊的中堅力量，兼具毀滅性的火力與厚實的防禦。這些巨娘通常裝備著能輕易洞穿地殼的超大口徑主炮，或者是作為移動的航空基地，釋放無數如同蜂群般的艦載機。她們不需要頻繁移動，只需優雅地站在戰場後方，調整巨大的舾裝，對著遠處的坐標進行覆蓋式打擊"
    
