    # 敵方星球
    gts_event_bruh_shipgirl.0002.name: "徒勞的反抗"
    gts_event_bruh_shipgirl.0002.desc: "§Y[From.GetName]§!的防禦控制中心內，警報聲早已響徹天際。\n\n這顆擁有數百億人口的星球，此刻正面臨著誕生以來最為可怕的毀滅危機。\n\n大氣層外，$gts_bruh_shipgirl_ship_sizes_3_short$那綿延數百萬公里的龐大軀體靜靜地佇立著，將§Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!的光芒遮擋得一乾二淨，整個§Y[From.GetName]§!都籠罩在她宏偉軀體投下的陰影之中。\n\n§Y[From.GetName]§!政府在極度恐懼下下達了總攻擊命令，數以萬計的軌道炮、要塞巨炮以及行星級粒子束同時開火，漫天交織的死光與動能彈頭如同一場逆流而上的光雨，狠狠地砸在$gts_bruh_shipgirl_ship_sizes_3_short$那修長潔白的大腿與下腹肌膚上。\n\n然而，這足以蒸發整片艦隊的恐怖火力，作用在她那嬌嫩如脂的皮膚上，僅僅只能帶來如微風吹拂般的微弱癢意。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$雙臉泛著誘人的緋紅，雙眼含著害羞的淚光，她有些侷促地夾了夾圓潤的雙腿，感到萬分羞恥。\n\n然而，接收到指揮部發送的指令後，她不得不執行這殘酷的命令。\n\n§M"對...對不起...指揮部的命令是絕對的...我必須把你們這顆星球...塞進去...請你們不要再進行這種無謂的反抗了好不..."§!\n\n她用通訊器傳發出極其害羞且蚊細軟語般的聲線，聲音雖然溫柔，卻帶著無可抗拒的壓迫感。\n\n在她帶著歉意的低語中，她抬起修長的手指，輕柔地褪下胯下那條早已被愛液浸濕的純白胖次，露出了那處散發著濃郁女性芬芳的粉紅花穴。\n\n在敵方星球無數居民絕望的注視下，兩根如同擎天巨柱般的粉嫩指尖從天而降，輕易地捏住了整顆星球。\n\n指尖與地表接觸的瞬間，高山被揉成平地，數個工業大洲直接在指紋的碾壓下化為粉碎。\n\n§M"要...要放進去了喔..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$羞恥得幾乎要哭出來，她將捏住的敵星緩緩對準了自己的穴口，隨後腰肢輕輕往前一送，將整顆直徑上萬公里的行星硬生生推進了狹窄緊緻的陰道深處！\n\n§R"咕啾...咕啾..."§!\n\n無邊無際的濕潤軟肉瞬間擠壓過來，敵星表面引以為傲的護盾在接觸到肉褶的瞬間就像脆弱的蛋殼般§R"啪嚓"§!一聲碎裂成渣。\n\n龐大無匹的膣壓從小穴四面八方而來，將地殼層層壓碎，岩漿爆發卻又立刻被穴內湧出的濃稠愛液澆滅。\n\n§V"不要啊！是肉壁！我們整個世界被推進巨大的小穴裡了！"§!\n\n星球廣播裡傳來數百億生靈最後的慘叫與嚎哭，但這些聲音很快就被擠壓產生的濕潤聲響所吞沒。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$緊緊閉上雙腿，嬌軀微微顫抖，雙手撫摸著小腹，感受著§Y[From.GetName]§!在自己小穴內被肉壁壓碎的劇烈快感。\n\n§M"咕唧...啪唧...咕嚕嚕..."§!\n\n§Y[From.GetName]§!的板塊、金屬地核與數百億生命，在短短數分鐘內被徹底碾成微小的陰垢，消失在她高溫濃稠的愛液之中。"
    gts_event_bruh_shipgirl.0002.a: "螳臂當車"
    gts_event_bruh_shipgirl.0003.name: "無法回應的求和"
    gts_event_bruh_shipgirl.0003.desc: "全頻段通訊頻道中充斥著來自§Y[From.GetName]§!政府崩潰般的哭喊與哀求。\n\n§V"偉大的艦娘大人！我們願意無條件投降！我們願意獻出所有的資源與技術，成為您最卑微的奴隸！求求您接受談判，停止這種可怕的舉動吧！"§!\n\n§Y[From.GetName]§!上的數十億居民透過天文望遠鏡，看著懸浮在大氣層外的那位比星球還要龐大無數倍的艦娘，無數人跪在地表上痛哭祈禱。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$聽著耳機裡傳來的淒慘求救聲，嬌嫩的臉蛋上布滿了愧疚與害羞的紅暈。\n\n她的性格可沒那麼大膽，但來自最高指揮部的命令已經鎖定了她的腦域，命令她必須以最徹底的方式將該星球消滅。\n\n§M"嗚...對不起...我也好想接受你們的降服...我也很不想要這樣做..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$害羞地低下了頭，聲音中帶著濃濃的委屈與歉意。\n\n§M"但是...指揮部剛剛下達了命令...如果我不執行...我就會被懲罰...對不起...對不起...請你們原諒我..."§!\n\n她話說完，雙手抖抖索索地解開了軍裝裙襬，將那條緊繃的內褲拉至大腿根部，暴露出了那處正因緊張與害羞而大量分泌著愛液的狹窄粉穴。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$伸出那巨大而溫柔的手掌，將這顆不斷發出求和訊號的星球捏起。\n\n§Y[From.GetName]§!上的居民絕望地看著天空被一隻潔白的巨手完全覆蓋，隨後整顆星球被不可抗拒的力量帶向了那片瀰漫著濃烈腥香的粉紅深淵。\n\n§M"咕啾...咕唧..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$閉上雙眼，帶著極度的羞恥，將§Y[From.GetName]§!貼上了自己的穴口，然後小心翼翼地向內推入。\n\n狹窄的穴壁順著星球的弧度被撐開，滾燙濕滑的軟肉將§Y[From.GetName]§!嚴絲合縫地包覆起來。\n\n§V"啊啊啊！求求您！住手啊啊啊！...咕嚕咕嚕...."§!\n\n§Y[From.GetName]§!的領袖聲戛然而止，因為整顆星球已經完全滑入了她的陰道深處，再也接收不到任何訊息了。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$發出一聲甜膩的哼聲，害羞地將雙腿交叉疊在一起。\n\n§M"對不起...但我會努力讓你們快點結束的..."§!\n\n她輕聲說道，隨後控制著小穴進行劇烈的收縮與蠕動。\n\n幾百億噸的膣壓將肉壁間的每一道褶皺都變成了粉碎星球的磨盤。\n\n§M"啪嚓...啪唧..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$感受著私處傳來的異物感，羞得將臉埋進了雙手之中。\n\n幾分鐘後，那顆承載著數十億求和生靈的星球，已經在她的小穴深處被徹底碾碎溶化，變成了純粹的愛液與陰垢，再也找不到半點存在過的痕跡。"
    gts_event_bruh_shipgirl.0003.a: "..."
    gts_event_bruh_shipgirl.0004.name: "無意的碾碎"
    gts_event_bruh_shipgirl.0004.desc: "三天前，§Y[From.GetName]§!被$gts_bruh_shipgirl_ship_sizes_3_short$按照命令硬生生塞入了陰道深處。\n\n然而，§Y[From.GetName]§!的地底藏有擁有極其罕見的上古防護罩技術，在被塞入小穴的瞬間，它們開啟了覆蓋全星的終極防禦壁，竟然在緊緻肉壁的包夾下，硬生生撐開了一個微小的生存空間。\n\n§Y[From.GetName]§!的科學家們狂喜萬分，以為憑藉這層護盾就能在巨娘的穴內苟延殘喘，甚至等待拯救。\n\n然而，它們完全低估了體型差距帶來的絕望現實。\n\n對於$gts_bruh_shipgirl_ship_sizes_3_short$來說，這顆帶著護盾的星球實在是太過微小了，小到就像是卡在她小穴褶皺深處的一粒微不足道的細沙。\n\n雖然它讓$gts_bruh_shipgirl_ship_sizes_3_short$這幾天總覺得有點微妙的異物感，但她甚至根本沒感覺到那層防護罩的存在。\n\n這天，另一位執行巡邏任務的$gts_bruh_shipgirl_ship_sizes_1_short$途經此星系，兩位巨大的少女便在星空中停下腳步，愉快地交談起來。\n\n§B"哎呀，今天怎麼看妳姿態怪怪的？雙腿一直蹭來蹭去，胯下夾了什麼好玩的嗎？"§!\n\n$gts_bruh_shipgirl_ship_sizes_1_short$看著她那泛紅的臉頰，打趣地問道。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$臉頰瞬間燙得像要冒煙，雙手慌亂地擺動著，害羞地低語道。\n\n§M"沒...沒有啦！只是...前幾天照命令把敵人的星球推進小穴裡了...好像叫什麼...什麼...§Y[From.GetName]§!之類的"§!\n\n$gts_bruh_shipgirl_ship_sizes_1_short$聞言哈哈大笑，大大咧咧地伸出手，拍了拍$gts_bruh_shipgirl_ship_sizes_3_short$的屁股。\n\n§B"哈哈！那種小蟲子一樣的星球，妳居然還特意去記著它？看我的！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$被$gts_bruh_shipgirl_ship_sizes_1_short$突然拍打屁股，嬌軀猛地一震，害羞得驚呼出聲。\n\n§M"嗚啊！不要亂摸啦！"§!\n\n在這一瞬間的驚嚇與害羞下，$gts_bruh_shipgirl_ship_sizes_3_short$的雙腿不自覺地猛烈夾緊，陰道肌肉也隨之發生了一次尋常的本能痙攣與劇烈收縮。\n\n§R"啪嚓！"§!\n\n陰道深處，§Y[From.GetName]§!人引以為傲、苦苦支撐了三天的終極護盾，在巨娘小穴這無意識的夾緊下，就像一片薄脆的洋芋片般瞬間碎成了漫天光屑！\n\n緊接著，幾萬公里厚的粉紅軟肉帶著億萬噸的恐怖肉壓轟然合攏。\n\n§R"咕唧...啪唧...咕啾..."§!\n\n§Y[From.GetName]§!連同上面幾百億還在慶幸倖存的居民，在一微秒內就被碾成了陰垢！\n\n愛液如海嘯般滾滾而過，將它們存在過的痕跡沖刷得乾乾淨淨。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$捂著臉，完全不知道自己剛才隨口的打鬧已經將一個星球徹底抹去。\n\n她只是覺得穴中那股微弱的異物感瞬間消失了，取而代之的是一股極其舒爽的濕潤感。\n\n§M"討厭啦...剛才一下子用力過頭...好像直接把它壓碎了..."§!\n\n她羞澀地說道。\n\n$gts_bruh_shipgirl_ship_sizes_1_short$不在意地揮了揮手。\n\n§B"碎了就碎了嘛，反正本來就是上級要求銷毀的垃圾。走吧，去吃點行星當零食！"§!\n\n兩位巨大少女笑著結伴遠去，而在$gts_bruh_shipgirl_ship_sizes_3_short$那深邃濕熱的花穴深處，那顆星球連同它的護盾，早已化為了無法分清的愛液痕跡。"
    gts_event_bruh_shipgirl.0004.a: "連一點波瀾都沒有留下"

    # 友方星球
    gts_event_bruh_shipgirl.0005.name: "最高機密滅絕令"
    gts_event_bruh_shipgirl.0005.desc: "$gts_bruh_shipgirl_ship_sizes_3_short$的龐大身姿降臨在§Y[From.GetName]§!的軌道旁。\n\n這顆繁榮的殖民地星球上，數十億公民正舉城歡呼，慶祝著帝國守護者的到來。\n\n全球通訊頻道裡充斥著熱情的廣播。\n\n§V"歡迎我們的守護者！感謝您為帝國巡航，祝您武運昌隆！"§!\n\n然而，站在宇宙深處的$gts_bruh_shipgirl_ship_sizes_3_short$並沒有回應這份熱情。\n\n她面容嚴肅，整潔的軍裝在星光下顯得無比挺拔，雙眼凝視著艦隊指揮部剛剛發來的最高加密指令。\n\n§Y[From.GetName]已被判定為潛在不穩定目標，立即執行清除作業。"§!\n\n這是一道荒謬而殘酷的軍令，但作為最恪盡職守的戰士，她的字典裡沒有服從以外的選項。\n\n§M"軍令如山...抱歉了，希望你們的靈魂能獲得安息。"§!\n\n她低聲自語，神情冰冷而莊嚴。\n\n她緩緩解開軍裝下擺，將自身那綿延數萬公里的宏偉下體裸露於太空之中。\n\n對於地面上的微小生靈而言，天空突然被無邊無際的肉色天幕所遮蔽，潔白而細膩的肌膚取代了恆星的光芒。\n\n§V"看啊！天空出現了守護者的英姿！這是軍方的防禦演習嗎？"§!\n\n人們興奮地聚集在廣場上，完全未曾意識到末日的降臨。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$伸出兩根如天柱般龐大的手指，輕柔卻不可抗拒地捏住了整顆行星。\n\n指尖壓在地表上，瞬間將幾座數百萬人口的大都市壓成齏粉，指紋的溝壑成為了地表無法逾越的天坑，地殼因指尖的擠壓而發出沉悶的崩裂聲。\n\n隨後，她面無表情地將這顆載滿忠誠公民的星球，對準了自己的穴口，堅決地推了進去。\n\n§R"咕啾..."§!\n\n輕微的濕潤聲響在真空間迴盪。\n\n無邊無際的緊緻軟肉從四面八方包覆而來，幾萬公里厚的軟肉褶皺發出恐怖的擠壓。\n\n星球的地殼在第一秒就全面碎裂，地幔噴湧，卻立刻被穴內大量的愛液淹沒。\n\n居民們的歡呼聲在瞬間化作了絕望的尖叫。\n\n世界末日不是伴隨著火海，而是伴隨著無邊無際的粉色軟肉！\n\n§V"發生了什麼事？！天塌下來了！救命啊！"§!\n\n人們在街道上絕望地奔跑，卻只能眼睜睜看著無邊無際的肉牆從天降下，億萬生靈在絕望與無法理解中化為穴壁上的陰垢，徹底溶入那無盡的愛液海洋之中。\n\n艦娘雙腿緊閉，身體保持著筆直的站姿，用小穴深處的肉褶反覆碾壓著這顆崩解的星球。\n\n§R"噗唧..."§!\n\n隨著最後一次有力的收縮，星球上所有的訊號徹底歸於寂靜。\n\n十五分鐘後，$gts_bruh_shipgirl_ship_sizes_3_short$再次將手指深入穴內，將那已經徹底被碾平、裹滿濃稠愛液的殘核掏出，重新放回軌道。\n\n原本繁華的[From.GetName]如今只剩下一塊散發著體溫與腥香的愛液球，上面再無任何生靈。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$嚴謹地整理好衣著，向指揮部回傳了報告。\n\n§M"特別清算任務完成，目標已抹除。"§!"
    gts_event_bruh_shipgirl.0005.a: "軍令如山，無可奈何"
    gts_event_bruh_shipgirl.0006.name: "偽裝的重構"
    gts_event_bruh_shipgirl.0006.desc: "$gts_bruh_shipgirl_ship_sizes_3_short$停泊在§Y[From.GetName]§!一旁，龐大的身軀將§Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!的光芒遮擋得一乾二淨。\n\n最高指揮部對這顆星球下達了完全滅絕的指令，然而給予當地政府與居民的公文卻聲稱這是一場局部環境優化的技術改造。\n\n作為嚴謹執行軍令的艦娘，$gts_bruh_shipgirl_ship_sizes_3_short$嚴格按照上級給予的劇本開展工作，哪怕她深知這是一場殘酷的欺騙。\n\n通訊器中傳來星球領袖歡欣鼓舞的聲音。\n\n§M"尊敬的無畏大人！感謝指揮部為我們提供這次環境改造的機會！全體居民已在室內集合，靜候您的偉力！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$居高臨下地看著那顆湛藍色的星球，臉上沒有任何表情，有的只是如鋼鐵般冰冷的執行力。\n\n她打開全星球廣播，聲音嚴肅而沉穩。\n\n§M"現在開始執行『環境深度重構協議』，請所有居民保持鎮定，留在建築物內。"\n\n"重構過程中產生的劇烈震動與環境變化皆為預定現象。"§!\n\n話音剛落，$gts_bruh_shipgirl_ship_sizes_3_short$伸手解開了自己的下身軍裝，將那一處散發著濃郁女性氣息的粉色花穴完全暴露在大氣層外。\n\n星球上的觀測站與民眾透過窗戶，驚恐地發現原本湛藍的天空被一片無邊無際的粉紅軟肉所覆蓋，空氣中開始瀰漫著一種黏稠的雌性氣味。\n\n§V"等等...這不是氣候調節裝置！那是...那是艦娘的...！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$伸出兩根遮天蔽日的巨指，像拿捏一顆彈珠般捏住了§Y[From.GetName]§!，隨後毫不留情地將整顆星球向著自己早已濕透的穴口塞去。\n\n§R"咕啾...！"§!\n\n當星球的北半球接觸到穴口的肉褶時，大氣層在瞬間被撕裂並消失。\n\n§V"不！這根本不是改造！這是屠殺！指揮部騙了我們！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$冷酷地閉上雙眼，腰肢用力向前一挺，將整顆星球完整地吞入了陰道深處。\n\n§M"這是最高指揮部的決策，你們的犧牲是帝國發展的代價。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$在全頻段中發出最後的宣告，雖然它們應該也接收不到了。\n\n在她狹窄而無比緊緻的穴壁擠壓下，星球的地殼像蛋殼般粉碎，海洋與內陸在幾秒鐘內被強行混合，億萬生靈連同它們的文明遺跡，在肉壁劇烈的蠕動與收縮中被徹底碾成陰垢，並與大量的愛液融為一體。\n\n§R"啪嗒..."§!\n\n幾十分鐘後，$gts_bruh_shipgirl_ship_sizes_3_short$將已經徹底變為一顆光滑愛液球體的星球摳了出來。\n\n那顆星球上再無任何建築與生命，只剩下無邊的半透明愛液與濃郁的雌性氣息。"
    gts_event_bruh_shipgirl.0006.a: "但是值得嗎?"
    gts_event_bruh_shipgirl.0007.name: "故土的葬禮"
    gts_event_bruh_shipgirl.0007.desc: "眼前這顆名為§Y[From.GetName]§!的星球，對$gts_bruh_shipgirl_ship_sizes_3_short$而言有著截然不同的意義，這裡曾是她的誕生地，在她被改造為這具宏偉的艦娘軀體之前，她曾作為一個微小的個體生活在這片土地上。\n\n然而，最高指揮部認定該星球存在潛在的叛亂風險，簽發了最高等級的抹殺令。星球上的防衛軍顯然提前接到了風聲，當$gts_bruh_shipgirl_ship_sizes_3_short$那巨大無朋的身影籠罩整個星系時，數以萬計的行星防禦飛彈與軌道炮發射出耀眼的光芒，如同一群憤怒的飛蟲般向她襲來。\n\n§Y"警告，發現本土防禦網開火。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$冷靜地聽著腦域中的系統提示。\n\n那些足以摧毀常規艦隊的火力打在她光潔的肌膚上，僅僅帶來了如同微風拂過般的極輕微感覺，連讓她眨一下眼都做不到。\n\n她伸出巨大的右手，將這顆記錄著她所有童年記憶的母星抓在手掌心。\n\n在她的視線裡，母星的大小不過與一顆圓潤的紫色果實無異。\n\n通訊頻道中傳來了昔日同胞們絕望而憤怒的嘶吼。\n\n§V"妳忘記了自己的出身嗎？！這裡生妳養妳！妳這個冷血的兵器！"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$的眼神沉靜如水，沒有憤怒，也沒有動搖，只有一種執行軍令的肅穆。\n\n§M"我沒有忘記。"§!\n\n她的聲音透過震波傳遍整顆星球。\n\n§M"但作為軍人，服從命令是我的唯一天職。由我親手來為你們終結，是本艦能給予的最高敬意。"§!\n\n話音落下，她單手解開了軍裝裙擺，將手伸入裙底，將那條印有舊式軍徽的棉質胖次撥到一旁。那片充滿母性與毀滅交織的狹窄深淵暴露在星空中。\n\n她沒有絲毫遲疑，將掌心中那顆微小的母星§Y[From.GetName]§!，順著自己柔軟的陰唇，深深地推入了窄小的縫隙之中。\n\n§R"咕唧...！"§!\n\n狹窄的肉壁瞬間將母星死死包裹。\n\n曾經養育她的廣袤大陸被軟肉碾成爛泥，覆蓋極地的茫茫冰冠被體溫所溶解，崩解的行星露出了它熾熱的熔岩內核，隨後又被無邊無盡的愛液徹底澆熄。\n\n§R"咕啾...咕啾..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$雙腿微微交疊，挺直了腰板，感受著昔日的家園在自己的小穴內被慢慢碾碎、消化、融合的過程。\n\n她的姿態平穩而自然，卻給予了那顆星球最徹底的死亡。\n\n幾分鐘後，動靜完全平息，母星已徹底成為愛液的一部分。"
    gts_event_bruh_shipgirl.0007.a: "再見了，我的過去"

    # 其他星球
    gts_event_bruh_shipgirl.0008.name: "曙光前的永夜"
    gts_event_bruh_shipgirl.0008.desc: "$gts_bruh_shipgirl_ship_sizes_3_short$慵懶地漂浮在星空之中。\n\n在她那無比宏偉的優雅身姿面前，整顆充滿原始海洋與生命萌芽潛力的星球，只不過是一顆微不足道的泥球。\n\n她那帶著深邃魅力的美眸居高臨下地俯瞰著，嘴角勾起一抹玩味的調侃，成熟而優雅的聲音在真空之中震盪開來。\n\n§M"嗯...多麼新鮮又純淨的小傢伙啊，這上面似乎正在醞釀著某種小小的希望呢...不過，遇到阿姨我，你的命運可就要改變了呢...比起漫長地等待你們孕育出微小的小蟲子，不如現在就來填補阿姨胯下的空虛吧..."§!\n\n說罷，她伸出兩根修長而圓潤的巨大手指，像捏起一顆小小的珍珠般，輕柔地將§Y[From.GetName]§!從軌道上捏了起來。\n\n在那龐大的體型差距下，她僅僅是稍微夾緊手指，指甲便輕易地刺穿了地殼，引發了全球性的地貌坍塌與地殼崩解，無數原始養分在指尖的微小擠壓下化為粉碎。\n\n她優雅地張開雙腿，撩起胖次，將自己完美豐滿的女體徹底呈現在星海之中。\n\n濃郁而迷人的女性氣息伴隨著熱氣散發開來，茂密的黑色陰毛間，那呈現著深粉色的陰唇正微微張開，露出濕潤的陰縫。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$微笑着，將那顆早已地貌碎裂的星球擠壓在自己腫脹抖動的陰蒂上，開始緩緩地旋轉摩擦。\n\n§R"咕啾...咕啾..."§!\n\n粘稠而溫熱的愛液瞬間從肉縫中湧出，像狂暴的粉色洪流般將整顆星球徹底淹沒。\n\n粗糙的地殼在陰蒂與敏感肌膚的摩擦下不斷磨損，行星表面的大氣與海洋在頃刻間就蒸發殆盡。\n\n§M"啊嗯...好涼爽又有點硬硬的感覺呢...小東西，進到阿姨最深的地方去吧..."§!\n\n她發出一聲滿足的呻吟，隨即用手指將那顆裹滿愛液的行星狠狠推入了小穴之中，一眨眼便將其沒入了狹窄熱燙的膣穴深處。\n\n那一瞬間，膣穴內部無比緊緻的肉壁與層層疊疊的軟肉開始劇烈收縮，高溫與絕對的擠壓力量從四面八方襲來。\n\n整顆行星在軟肉的蠕動與肉壁的瘋狂碾壓下，連一秒都沒能堅持住，便§R"咔嚓"§!一聲徹底碎裂開來。\n\n地核與岩石在軟肉的重壓下被細細磨碎，與源源不絕的愛液混合在一起，化為了附著在肉褶深處的陰垢。\n\n這顆懷揣著生命潛力的星球，就這樣在$gts_bruh_shipgirl_ship_sizes_3_short$的花穴深處被徹底抹去。\n\n§M"哈啊...真舒服...小穴裡熱乎乎的...真是一個稱職的跳蛋呢..."§!"
    gts_event_bruh_shipgirl.0008.a: "永遠成為了小穴裡的陰垢"
    gts_event_bruh_shipgirl.0009.name: "末代黃昏"
    gts_event_bruh_shipgirl.0009.desc: "§M"哦？這顆星球上居然有會動的小蟲子。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$饒有興趣地盯著手中那顆藍色的星球，透過感測器，她能看見§Y[From.GetName]§!表面那些如同塵埃般大小的原始部落。\n\n這些土著正在舉行某種宗教儀式，它們圍繞著篝火跳舞，完全不知道自己的世界已經被一隻巨大的手掌托起。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將星球湊近眼前，仔細觀察著那些微小的生命。\n\n她能看見那些土著驚恐地四散奔逃，它們的村莊在星球的震動中坍塌，篝火被撲滅。\n\n一些土著跪倒在地，朝著天空中那隻遮天蔽日的巨眼磕頭祈禱。\n\n但$gts_bruh_shipgirl_ship_sizes_3_short$只是輕笑一聲。\n\n§M"跪拜也沒用哦，你們馬上就要成為小穴的零食了~~" §!\n\n她的另一隻手已經伸向了裙底，熟練地勾住內褲的邊緣往下拉。\n\n濕潤的布料與肌膚分離時發出"啾"的黏膩聲響，可以看見內褲的襠部已經被愛液浸透，拉出一條條晶瑩的絲線。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將內褲褪到膝蓋處，然後微微張開雙腿，露出了那片已經濕透的秘裂。\n\n粉嫩的陰唇微微翕動著，一滴滴透明的愛液從縫隙中滲出。\n\n陰毛叢中還掛著幾滴之前高潮時留下的愛液，在星光的照耀下閃爍著淫靡的光澤。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$用手指撥開陰唇，露出裡面粉紅色的小穴入口，那裡正一張一合地蠕動著，似乎在期待著什麼。\n\n§M"來吧，讓我看看你們能在裡面堅持多久。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將星球對準了自己的小穴，然後緩緩推進。\n\n土著們抬頭看向天空，只能看見一片肉色的絕壁正在逼近。\n\n§M"啊...進來了..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$發出滿足的呻吟，小穴的入口被星球撐開，一圈圈的肉壁緊緊包裹住星球表面。\n\n那些土著部落首先遭殃，它們連反應的時間都沒有，就被從天而降的肉壁壓成肉泥。\n\n整個村莊在瞬間被碾平，篝火、圖騰、茅草屋，一切都消失在$gts_bruh_shipgirl_ship_sizes_3_short$的愛液之中。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$夾緊雙腿，小穴有節奏地收縮。\n\n每一次收縮，都會讓星球表面的地殼造成毀滅性的浩劫。\n\n大陸板塊在壓力下碎裂，山脈被削平。\n\n那些倖存的土著絕望地看著自己的世界在崩潰，它們跪地祈禱，但沒有任何神明會回應他們。\n\n穴壁分泌出了更多的愛液，這些黏稠的液體如同洪水般淹沒了星球表面。\n\n土著們在愛液的海洋中掙扎，它們試圖游泳，但黏稠的液體讓他們無法移動。\n\n最終，他們一個個沉入愛液之中，被溶解成有機物，成為$gts_bruh_shipgirl_ship_sizes_3_short$愛液的一部分。\n\n§M"啊啊...要去了..."§!\n\n星球在小穴內被擠壓得越來越扁，地殼完全碎裂，岩漿噴湧而出，但很快就被周圍的愛液澆熄。\n\n整顆星球在高潮中徹底粉碎，化為無數微小的顆粒，混合在噴湧而出的愛液之中。\n\n§M"呼...感覺真不錯。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$滿足地說道。"
    gts_event_bruh_shipgirl.0009.a: "..."
    gts_event_bruh_shipgirl.0010.name: "冬天的終焉"
    gts_event_bruh_shipgirl.0010.desc: "§M"咦?這顆星球怎麼灰濛濛的？"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$好奇地打量著手中這顆被厚重雲層覆蓋的星球。\n\n透過感測器的分析，她得知§Y[From.GetName]§!是一顆經歷過核戰爭的廢土世界，地表溫度極低，到處都是輻射塵埃。\n\n§M"原來是自己把自己玩壞了啊，那我就不客氣地回收利用了。"§!\n\n她能看見星球表面那些殘存的廢墟城市，高樓大廈只剩下扭曲的鋼筋骨架，街道上堆滿了白骨和瓦礫。\n\n少數倖存者躲在地下掩體中，靠著僅存的罐頭食品苟延殘喘。\n\n它們已經在這個冰冷的地獄中掙扎了數十年，等待著一個永遠不會到來的春天。\n\n§M"不過，與其在那裡慢慢等死，不如讓我給你們一個痛快的結局吧。"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$一邊說著，一邊將手伸向了自己的下體。\n\n她今天穿的是一條黑色蕾絲內褲，鏤空的花紋若隱若現地展示著裡面的肌膚。\n\n她慢慢將內褲往下拉，濕潤的襠部與陰唇分離時發出"嗤啦"的聲響。\n\n內褲被完全脫下後，可以看見上面沾滿了乾涸的愛液和一些白色的陰垢。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$隨手將內褲丟向一旁，然後張開雙腿，露出了那片已經濕潤的秘裂。\n\n陰唇微微腫脹，陰蒂也已經勃起，可以清楚地看見那顆敏感的肉芽從包皮中探出頭來。\n\n§M"來吧，讓我的小穴溫暖你們這些可憐的小蟲子。"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$將星球對準了自己濕潤的陰唇縫隙，然後毫不猶豫地塞了進去。\n\n§M"嗯啊..."§!\n\n她發出一聲舒服的呻吟，小穴的入口被星球撐開，大量的愛液被擠壓出來，順著陰唇流下。\n\n星球表面的輻射塵埃首先接觸到了濕熱的穴壁，那些懸浮在空氣中的放射性粒子被愛液吸附，然後隨著穴壁的蠕動被帶入更深處。\n\n地下掩體中的倖存者感受到了劇烈的震動，它們驚恐地發現，掩體的天花板竟開始滲水。\n\n但那不是水，而是$gts_bruh_shipgirl_ship_sizes_3_short$的愛液，帶著濃烈的腥味，從裂縫中滲透進來。\n\n§M"啊...好冰啊..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$皺了皺眉，星球表面的低溫讓她的小穴感到一陣寒意。\n\n但很快，小穴內部的溫度就開始融化星球表面的冰層。\n\n核冬天的冰雪在融化，化為水蒸氣，充滿了整個大氣層。\n\n§M"嗯...暖和多了..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$滿意地說道，她開始有節奏地收縮小穴。\n\n每一次收縮，都會讓星球表面產生毀滅性的地震。\n\n那些本就搖搖欲墜的廢墟建築徹底倒塌，掩體的混凝土牆壁龜裂，倖存者們的最後庇護所也被摧毀。\n\n小穴分泌出更多的愛液，這些黏稠的液體滲透進星球地殼的每一條裂縫。\n\n那些藏在地下深處的倖存者發現，它們的掩體正在被一種黏稠的液體淹沒。\n\n它們試圖逃跑，但門已經被堵死。\n\n愛液不斷湧入，很快就淹沒了它們的腳踝、腰部、胸口，最後是頭頂。它們的結局便是在黏稠的愛液中窒息而死。\n\n§M"啊啊...這種冰冰涼涼又慢慢變暖的感覺真好..."§!\n\n輻射塵埃、核廢料、變異生物，全都在軟肉的輾壓下被粉碎、融化，成為$gts_bruh_shipgirl_ship_sizes_3_short$愛液的一部分。\n\n整顆星球的核心終於承受不住壓力，在一聲巨響中爆炸，但這聲響被厚實的肉壁完全吸收，一點也沒傳出小穴。\n\n§M"唔...好刺激..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$能感覺到星球核心爆炸時產生的震動，那種快感讓她忍不住夾緊雙腿，更用力地收縮小穴。\n\n§M"呼...總算處理掉了一個垃圾星球。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$滿足地喘息著，她伸手撫摸著自己的小腹，似乎還能感覺到裡面殘留的餘溫。\n\n§M"不過這輻射...應該不會讓我生病吧？"§!\n\n她有些擔心地想著，但很快就搖了搖頭。\n\n§M"算了，反正我的身體這麼強壯，一點輻射不算什麼。"§!\n\n她撿起剛才丟在一旁的內褲，抖了抖上面的衛星殘骸，然後重新穿上。\n\n濕潤的襠部緊貼著陰唇，讓她發出一聲舒服的嘆息。\n\n§M"好了，下一個目標是哪裡呢？"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$一邊整理著裙子，一邊查看著星圖，尋找著下一個可以用來自慰的星球。"
    gts_event_bruh_shipgirl.0010.a: "至少...他們的痛苦結束了"
    gts_event_bruh_shipgirl.0011.name: "荒蕪星球的終結"
    gts_event_bruh_shipgirl.0011.desc: "通訊頻道中傳來$gts_bruh_shipgirl_ship_sizes_3_short$慵懶的聲音。\n\n§M"指揮部，我在§Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!星系發現了一顆毫無價值的荒蕪星球。"\n\n"表面連微生物都沒有，就是一團死寂的石頭......"§!\n\n她頓了頓，語氣中帶著玩味。\n\n§M"這種廣闊無垠的宇宙荒地，不拿來利用一下實在太浪費了呢。"§!\n\n§Y[From.GetName]§!靜靜地懸浮在黑暗的太空中，表面布滿了隕石坑與風化的岩層，死寂得如同一具冰冷的屍體。\n\n然而當一隻修長白皙的巨手從畫面邊緣伸入時，這顆直徑數千公里的星球在那五根纖細手指面前，竟顯得如此渺小。\n\n那些在地質學家眼中高聳入雲的山脈，此刻不過是她指紋紋路間的微小顆粒。\n\n§M"完全感覺不到任何生命的氣息，就像一顆冰冷的彈珠......"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$修長的手指收攏，將整顆星球握在掌心，她微微用力，測試著這顆岩石星球的硬度。\n\n§M"硬度還不錯嘛......至少不會一捏就碎掉。"§!\n\n她輕笑著說道，聲音中透著某種令人不安的期待。\n\n§M"指揮部應該不介意我......稍微測試一下它的耐久度吧？"§!\n\n她眨了眨眼，沒有等待回覆，另一隻手已經開始解開制服下擺的鈕扣。\n\n§M"畢竟......這種毫無用處的荒蕪星球，拿來做這種事情應該沒人會心疼吧？"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$舔了舔嘴唇，裙襬被掀起，露出黑色的蕾絲內褲，那片神秘的三角地帶散發著微微的熱氣，在真空的宇宙中形成一片霧氣繚繞的禁區。\n\n她的手指勾住內褲邊緣，將這層最後的遮蔽物緩緩褪下。\n\n當那對飽滿豐潤的陰唇完全暴露在真空中時，一股濃郁的雌性氣息瞬間擴散開來，兩片肉唇微微張開，露出內裡粉嫩濕潤的軟肉，以及那個深不見底、足以吞噬一切的黑暗入口。\n\n§M"來吧......讓我看看你能在裡面堅持多久。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將手中的星球對準了那個濕潤的洞口，然後緩緩地、一點一點地將其推送進去。\n\n兩片柔軟的肉瓣包裹住了這顆冰冷的星球，將它一寸一寸地吞入。\n\n那些堅硬的岩層在肉壁擠壓下，發出"咔嚓咔嚓"的碎裂聲，地殼開始龜裂，巨大的裂縫如同傷口般在星球表面蔓延開來，從中噴湧出熾熱的岩漿。\n\n§M"啊......真舒服......"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$的呼吸變得急促起來，臉頰泛起誘人的紅暈，她沒有停下動作，繼續將星球往更深處推送。\n\n穴壁的蠕動變得更加劇烈，一波接一波的收縮如同海浪般拍打在星球表面，每一次都會帶走大片的岩石碎屑，星球正在以肉眼可見的速度縮小，那些曾經高聳的山脈被碾平，深邃的峽谷被填滿，整個地表都在這股無法抗拒的力量下重塑著形狀。\n\n當星球的最後一部分完全沒入那個粉紅色的洞穴時，她的身體劇烈地顫抖起來，一股濃稠的愛液從小穴深處噴湧而出，如同洪水般澆灌在星球表面，徹底淹沒了那顆已經四分五裂的星球。\n\n§M"哈啊......!"§!\n\n伴隨著$gts_bruh_shipgirl_ship_sizes_3_short$高亢的嬌吟，膣壁開始了最後的絞殺。\n\n那些已經布滿裂縫的岩層在這股究極的壓力下徹底崩潰，整顆星球在小穴深處爆裂開來，化作無數細小的碎片，與愛液混合成一團黏稠的漿液。\n\n良久，$gts_bruh_shipgirl_ship_sizes_3_short$才從高潮的餘韻中恢復過來。\n\n她伸手撫摸著微微隆起的小腹，滿足地嘆了口氣。\n\n§M"嗯......果然，即使是毫無價值的荒蕪星球，也能帶來不錯的快感呢......"§!"
    gts_event_bruh_shipgirl.0011.a: "反正是顆沒用的星球，就這樣吧"

    gts_event_bruh_shipgirl.0021.name: "藍白色的末日天幕"
    gts_event_bruh_shipgirl.0021.desc: "無畏艦娘收到了新的指令。她並沒有像往常那樣直接動手摧毀§Y[From.GetName]§!，而是帶著一絲羞澀與興奮，緩紓解開了腰間的繫帶。對於§Y[From.GetName]§!上的居民來說，這是一場香艷而絕望的災難。天空被巨大的陰影遮蔽，那不是烏雲，而是帶著藍白條紋的巨大織物。隨著艦娘將那條還帶著體溫的胖次褪下，濃烈的雌性氣息瞬間衝垮了大氣循環。她雙手撐開那條足以容納世界的內褲，像捕捉螢火蟲一樣，將整顆星球溫柔而堅定地兜了進去。星球表面的通訊在那一刻被徹底切斷，最後傳回的畫面只有白色的棉質穹頂和艦娘那因為羞恥而微微泛紅的巨臉。"
    gts_event_bruh_shipgirl.0021.a: "經典款式的經典毀滅"
    gts_event_bruh_shipgirl.0022.name: "條紋天空的審判"
    gts_event_bruh_shipgirl.0022.desc: "§Y[From.GetName]§!的居民們驚恐地看著天空變成了藍白相間的顏色。那不是雲層，而是無畏艦娘剛剛從胯下褪去的貼身衣物。她將那條還散發著騰騰熱氣的藍白條紋胖次撐開，無情地套在了這顆星球上。隨著鬆緊帶在星球赤道附近猛烈回彈，巨大的勒緊力量粉碎了赤道周圍的所有山脈。緊接著，胖次襠部那吸滿了液體的部分沉重地壓在了星球的北半球。對於地面上的小人來說，世界末日是黏稠且腥甜的。巨量的愛液與汗水從巨大的棉質織物縫隙中被擠壓出來，形成了高達數千公尺的黃白色海嘯。城市在瞬間被這股液體沖垮，所有建築與生命都在這股源自少女私處的洪流中淹沒、窒息。"
    gts_event_bruh_shipgirl.0022.a: "這是神明的恩賜...雖然有點臭"
    gts_event_bruh_shipgirl.0023.name: "狂熱粉絲的末路"
    gts_event_bruh_shipgirl.0023.desc: "§Y[From.GetName]§!上的居民曾是艦娘最狂熱的粉絲群體，它們日夜祈禱能得到女神的「恩賜」。於是，無畏艦娘回應了他們，她將剛脫下的藍白條紋胖次作為「獎勵」，直接丟在了行星上空。居民們最初還在為天空中降下的巨大聖物而歡呼，直到那沉重的布料真的砸在頭頂。數公里厚的棉層瞬間壓垮了城市護盾，而胖次襠部積累的巨量愛液像決堤的江河一樣傾瀉而下。狂熱的歡呼聲瞬間變成了絕望的氣泡聲，這座繁華的都市連同上面的所有粉絲，都被那過於沉重且濕潤的「愛意」徹底淹沒，化作了織物紋理間的一抹紅斑。"
    gts_event_bruh_shipgirl.0023.a: "求仁得仁...大概？"
    gts_event_bruh_shipgirl.0024.name: "無處安放的衣物"
    gts_event_bruh_shipgirl.0024.desc: "一場災難性的「誤操作」！無畏艦娘在我們的殖民地§Y[From.GetName]§!附近進行換裝時，隨手將剛脫下的藍白條紋胖次丟向了這顆星球。這條巨大的內褲依然保持著她身體的溫度，不偏不倚地將整顆星球罩住。對於上面的殖民者來說，天空突然塌陷了，隨之而來的是一場帶有強烈少女體味的風暴。整個殖民地在幾分鐘內就被淹沒在黏稠的液體中。通訊中最後傳來的聲音是人們在齊腰深的愛液中絕望的呼救，以及對那遮蔽天空的藍白條紋的恐懼。當艦娘意識到這一點時，星球上的文明火種已經熄滅了。"
    gts_event_bruh_shipgirl.0024.a: "下次請看清楚再扔"
    gts_event_bruh_shipgirl.0025.name: "土著的聖物"
    gts_event_bruh_shipgirl.0025.desc: "這顆原始星球上的土著曾以為神蹟降臨。當無畏艦娘將她那條穿了很久、吸滿了愛液的藍白條紋胖次賜予這顆星球時，土著們對著那遮天蔽日的藍白條紋跪拜。然而，神蹟很快變成了天災。隨著胖次完全覆蓋地表，其中心部位積累的黏稠液體開始在重力的作用下大量滲出。這不是滋潤萬物的雨露，而是毀滅性的洪水。原始的森林被愛液沖垮，簡陋的部落被淹沒在帶有甜腥味的浪潮中。數以億計的原始生物被困在濕潤的棉布與地表之間，最終全部溺死在艦娘的愛液裡。這顆星球現在看起來就像是一個包著藍白條紋包裝紙的濕潤泥球。"
    gts_event_bruh_shipgirl.0025.a: "有些禮物太過沉重了"

    gts_event_bruh_shipgirl.0101.name: "意外的「加餐」"
    gts_event_bruh_shipgirl.0101.desc: "一場可怕的悲劇！艦娘§H[[event_target:gts_bruh_get_event_shipgirl.GetName]§!在享用小行星帶的礦石零食時，不小心將§Y[event_target:gts_bruh_get_event_target.GetName]§!一併抓了起來。儘管§Y[event_target:gts_bruh_get_event_target.GetName]§!發出了全頻段的求救信號，但在她看來那不過是食物上的一點雜質。§Y[event_target:gts_bruh_get_event_target.GetName]§!被拋入了那濕潤、溫熱的粉色深淵中。巨大的舌頭像紅色的海嘯一樣翻湧，將§Y[event_target:gts_bruh_get_event_target.GetName]§!卷向了潔白的臼齒山脈。工作人員在被嚼碎前，最後看到的景象是那緩緩烙下的白色天花板......"
    gts_event_bruh_shipgirl.0101.a: "至少...它們成為了她的一部分"
    gts_event_bruh_shipgirl.0101.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName]被嚼碎了§!"

    gts_event_bruh_shipgirl.0102.name: "晨間的洪水"
    gts_event_bruh_shipgirl.0102.desc: "這是一個糟糕的早晨。剛睡醒的艦娘§H[event_target:gts_bruh_get_event_shipgirl.GetName]§!顯然處於迷糊狀態，她似乎把我們美麗的海洋行星[Root.GetName]當成了她的私人馬桶。當巨大的陰影籠罩天空，兩瓣潔白的巨臀像天蓋一樣遮住了恆星時，全球的警報都響了。沒有任何商量的餘地，伴隨著令人絕望的瀑布聲，滾燙的黃色洪流從天而降。這股帶有強烈氨氣味和巨娘體溫的液體瞬間擊穿了大氣層，引發了全球性的海嘯。原本蔚藍的海洋在幾分鐘內就被染成了渾濁的淡黃色，海平面上升了數公里。"
    gts_event_bruh_shipgirl.0102.a: ""這顆星球的海洋現在由90%的巨娘晨尿構成，散發著獨特的氣味""

    gts_event_bruh_shipgirl.0103.name: "航道上的零食"
    gts_event_bruh_shipgirl.0103.desc: "我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!失聯了。最後傳回的影像顯示，巨大的艦娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!正在該星系進行補給，具體來說，她正在抓取小行星往嘴裡塞。很不幸，我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!當時正隱蔽在那片小行星帶中執行任務。艦娘顯然沒有注意到混在「爆米花」裡的幾粒「灰塵」。通訊記錄的最後是巨大的潔白牙齒合攏的畫面，以及隨後陷入黑暗的潮濕咀嚼聲。我們探測到她滿足地嚥下去了，而現在§Y[event_target:gts_bruh_get_event_target.GetName]§!正在她的胃酸海洋中隨波逐流。"
    gts_event_bruh_shipgirl.0103.a: "願它們能在被胃酸消化前發回一些生物學數據"
    gts_event_bruh_shipgirl.0103.b: "發送信號讓她催吐！快！"
    gts_event_bruh_shipgirl.0103.c: "幸好她的消化系統沒那麼強......"
    gts_event_bruh_shipgirl.0103.a.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName]將會被消化§!"
    gts_event_bruh_shipgirl.0103.b.custom_tooltip: "§Y25%的機率[event_target:gts_bruh_get_event_target.GetName]能夠倖存§!"
    gts_event_bruh_shipgirl.0103.c.custom_tooltip: "§G[event_target:gts_bruh_get_event_target.GetName]倖存下來了......§!"

    gts_event_bruh_shipgirl.0104.name: "貼身收藏"
    gts_event_bruh_shipgirl.0104.desc: "我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!在執行掃描任務時，被艦娘§H[event_target:gts_bruh_get_event_shipgirl.GetName]§!發現了。這位好奇的艦娘並沒有摧毀飛船，而是將其視為一個精緻的會發光的小玩具。"好可愛的小東西，還在動呢！"通訊頻道裡傳來她驚喜的聲音。隨後，她不顧船員們的尖叫，將整艘科研船塞進了她那深邃、溫暖且充滿乳香的乳溝深處，以此作為貼身的裝飾品。目前§Y[event_target:gts_bruh_get_event_target.GetName]§!雖然結構完好，但被兩座巨大的肉山死死夾住，船體外殼溫度急劇升高，且感測器被乳汗和皮膚完全遮蔽，除了白花花的一片什麼也看不到。"
    gts_event_bruh_shipgirl.0104.a: "立刻請求她歸還飛船！"
    gts_event_bruh_shipgirl.0104.b: "就讓它們在那待著吧"
    gts_event_bruh_shipgirl.0104.a.custom_tooltip: "§R有機率導致§R[event_target:gts_bruh_get_event_target.GetName]§!被捏碎§!"
    gts_event_bruh_shipgirl.0104.b.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName]將永遠困在乳溝之間§!"

    gts_event_bruh_shipgirl.0105.name: "夾縫求生"
    gts_event_bruh_shipgirl.0105.desc: "一支隸屬於海盜的艦隊試圖從我們的§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!前溜過去，它們天真地以為飛到胸口前就能躲避她的視線。然而它們低估了那兩座宏偉山峰的危險性。當§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!雙臂併攏擠壓胸部時，那道深邃的乳溝瞬間變成了死亡陷阱。兩側柔軟卻充滿韌性的乳肉向中間合攏，空間被極速壓縮。無數戰艦被擠壓在兩團巨大的脂肪之間，就像夾心餅乾裡的餡料一樣動彈不得。這些戰艦在混合著汗水與乳香的熱浪中慢慢變形、粉碎。"
    gts_event_bruh_shipgirl.0105.a: "多麼幸福的死法......"
    gts_event_bruh_shipgirl.0105.b: "記得提醒她洗澡時清理一下"

    gts_event_bruh_shipgirl.0106.name: "巨大的好奇心"
    gts_event_bruh_shipgirl.0106.desc: "§Y[event_target:gts_bruh_get_event_target.GetName]§!上的居民最近陷入了集體恐慌。因為在今天早些時候，整個天空突然變成了美麗的翠綠色，那其實路過的艦娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!將她那巨大的眼球貼近了大氣層外緣，想要仔細觀察這些「小蟲子」的生活。她並沒有惡意，但她那遮天蔽日的虹膜遮擋了恆星的光芒，導致全球氣溫驟降，潮汐引力也因為她的靠近而發生了紊亂。居民們紛紛跪地膜拜這隻「天空之眼」，並開始獻祭各種奇怪的東西試圖取悅她。"
    gts_event_bruh_shipgirl.0106.a: "讓她趕緊離開"
    gts_event_bruh_shipgirl.0106.b: "這是一個教化它們的好機會，建立艦娘神教！"
    gts_event_bruh_shipgirl.0106.b.custom_tooltip: "§G10%人口獲得唯心主義思潮§!"

    gts_event_bruh_shipgirl.0107.name: "腳底的異物感"
    gts_event_bruh_shipgirl.0107.desc: "艦娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!抱怨她在巡邏時感覺鞋子裡進了沙子，弄得她腳底不舒服。在經過她的允許後，工程隊進入了那隻如同大陸般巨大的鞋子內部進行檢查。我們驚恐地發現，所謂的「沙子」其實是一個被我們遺忘的研究站，連同周圍的小行星碎片一起被卡在了她的腳趾縫和大拇指指紋之間。觀測站雖然已被壓扁，但裡面的人員奇蹟般地倖存了下來，只不過它們現在精神狀態極不穩定，嘴裡一直念叨著「粉色的天穹」和「酸臭的風暴」。"
    gts_event_bruh_shipgirl.0107.a: "把它們救出來，並清理鞋子"
    gts_event_bruh_shipgirl.0107.b: "既然已經壓扁了，就留在裡面當緩衝墊吧"
    gts_event_bruh_shipgirl.0107.c: "回收觀測站的數據，這可是珍貴的第一手資料"

    gts_event_bruh_shipgirl.0200.name: "實驗目標:荒蕪星球"
    gts_event_bruh_shipgirl.0200.desc: "無畏艦娘§H[From.GetName]§!抵達了實驗目標§Y[FromFrom.GetName]§!的軌道上空。這是一顆毫無生機的荒蕪星球，地表布滿了隕石坑和碎石。\n\n§R"第一個實驗品嗎？看起來挺硬的"§!\n\n艦娘饒有興趣地打量著這顆灰褐色的星球，隨後她開始寬衣解帶。當她的手指勾住內褲邊緣時，整個星球都籠罩在了她巨大身軀投下的陰影之中。她將這顆荒蕪星球緩緩推入了小穴深處。堅硬的岩石地表剛一接觸到濕潤的肉壁就開始劇烈摩擦。無畏艦娘皺起了眉頭。\n\n§R"好粗糙...刮得有點疼"§!\n\n她的小穴開始分泌大量愛液試圖潤滑這顆粗糙的星球。黏稠的液體滲入每一道裂縫，將乾燥的荒漠完全浸透。星球表面的碎石在肉壁的擠壓下開始剝落，混合著愛液變成了泥漿般的物質。艦娘夾緊雙腿，用力收縮。"喀嚓"的碎裂聲甚至都傳不出小穴中，整顆星球的外殼就像雞蛋殼一樣裂開了，露出內部熾熱的地幔。滾燙的岩漿湧出，與冰涼的愛液接觸後瞬間凝固。\n\n§R"唔...這種感覺還挺特別的"§!\n\n無畏艦娘滿意地撫摸著小腹，星球已經被完全碾碎。\n\n§M(鵝將軍記錄數據:荒蕪星球因表面過於粗糙，會對艦娘造成輕微不適，但其堅硬的結構能提供強烈的刺激)§!"
    gts_event_bruh_shipgirl.0200.a: "實驗數據獲得"
    gts_event_bruh_shipgirl.0201.name: "實驗目標:冰封星球"
    gts_event_bruh_shipgirl.0201.desc: "§Y[FromFrom.GetName]§!是一顆完全被冰層覆蓋的星球，表面溫度低至零下兩百度。當無畏艦娘§H[From.GetName]§!將它抓在手中時，甚至能感受到一絲寒意。\n\n§R"好冷...不過正好可以降降溫"§!\n\n她剛剛經歷了一場激烈的戰鬥，甚至身上都還殘留著汗液。她毫不猶豫地將這顆冰球塞進了自己濕熱的小穴。冰與火的碰撞在瞬間爆發。零下兩百度的冰層接觸到體溫高達四十度的肉壁，立刻開始劇烈融化。大量的冰水混合著艦娘本就豐沛的愛液，從穴口湧出，在太空中凝結成晶瑩的冰珠四散飛濺。\n\n§R"嘶...好冰！"§!\n\n無畏艦娘倒吸一口涼氣，雙腿本能地夾緊。冰封星球在她穴內快速升溫，表面的冰殼層層剝落，露出下方同樣冰冷的岩石核心。但這種冰涼的刺激反而讓艦娘更加興奮，她開始主動扭動腰肢，用體溫融化這顆冰球。十分鐘後，整顆星球已經完全融化，變成了一團混雜著愛液的冰水。艦娘鬆開雙腿，液體嘩啦啦地流出，在太空中形成了一條晶瑩的冰帶。\n\n§R"啊...爽快！就像喝了冰可樂一樣"§!\n\n§M(鵝將軍記錄數據:冰封星球能為艦娘提供清涼的刺激感，且融化後的冰水可以作為天然潤滑劑)§!"
    gts_event_bruh_shipgirl.0202.name: "實驗目標:劇毒星球"
    gts_event_bruh_shipgirl.0202.desc: "§Y[FromFrom.GetName]§!是一顆充滿劇毒的死亡星球。它的大氣層由硫酸雲和氯氣組成，地表則覆蓋著腐蝕性極強的化學物質。當無畏艦娘§H[From.GetName]§!抓起這顆星球時，她的手掌立刻感受到了一陣刺痛。\n\n§R"這東西是不是有毒？"§!\n\n她好奇地嗅了嗅，刺鼻的氣味讓她皺起了眉頭。但實驗必須繼續，她深吸一口氣，將這顆劇毒星球推入了小穴。劇烈的化學反應瞬間爆發。星球表面的毒液與艦娘的愛液接觸後開始冒出大量白色泡沫，發出"嗞嗞"的腐蝕聲。無畏艦娘的臉色一變。\n\n§R"好燙！不對...是在燒！"§!\n\n劇毒物質正在腐蝕她敏感的穴壁，那種又燙又麻的刺激感讓她忍不住叫出聲來。她本能地想要將星球排出，但小穴已經因為刺激而痙攣收縮，反而把星球夾得更緊。\n\n§R"該死...出不來了！"§!\n\n艦娘咬緊牙關，開始分泌更多的愛液試圖稀釋毒素。十五分鐘的痛苦掙扎後，劇毒星球終於被她的愛液中和，變成了一團無害的泥漿被排出體外。無畏艦娘癱軟地漂浮在太空中，雙腿還在微微顫抖。\n\n§R"這個...太刺激了。下次能不能換個溫和點的？"§!\n\n§M(鵝將軍記錄數據:劇毒星球會對艦娘造成嚴重不適，但刺激性極強，可能會引發意外的快感。建議僅在特殊情況下使用)§!"
    gts_event_bruh_shipgirl.0203.name: "實驗目標:熔融星球"
    gts_event_bruh_shipgirl.0203.desc: "§Y[FromFrom.GetName]§!是一顆靠近恆星的熔融星球，表面溫度高達一千度以上，整顆星球都在緩緩流淌著熔岩。當無畏艦娘§H[From.GetName]§!接近時，她能清楚地感受到那股灼人的熱浪。\n\n§R"這個看起來很危險啊..."§!\n\n她猶豫了一下，但想到這是實驗，還是決定嘗試。她小心翼翼地將這顆火球捧在手中，熔岩在她掌心流淌，留下一道道燙紅的痕跡。深呼吸，她將熔融星球推入了小穴。\n\n§R"啊啊啊——草！！！"§!\n\n無畏艦娘發出一聲尖叫。一千度的熔岩接觸到她的穴壁，那種灼燒感比任何武器都要強烈。她的愛液瞬間被蒸發，發出"嘶嘶"的聲音，大量的水蒸氣從穴口噴湧而出。\n\n§R"太燙了太燙了！快拿出來！"§!\n\n就在她快要承受不住時，大量的愛液突然噴湧而出，像消防水帶一樣衝向熔融星球。在巨量液體的冷卻下，岩漿開始凝固，溫度逐漸下降。五分鐘後，整顆星球已經冷卻成一塊粗糙的黑色岩石，裹著愛液被艦娘艱難地排出體外。她癱軟地漂浮著，下體還在冒著白煙。\n\n§R"這個...絕對不要再來第二次"§!\n\n§M(鵝將軍記錄數據:熔融星球溫度過高，會對艦娘造成嚴重傷害，但冷卻後的岩石質地極佳)§!"
    gts_event_bruh_shipgirl.0204.name: "實驗目標:沙漠星球"
    gts_event_bruh_shipgirl.0204.desc: "§Y[FromFrom.GetName]§!是一顆完全被沙漠覆蓋的星球，地表是無盡的金色沙丘。\n\n§R"沙子做的星球？摸起來挺舒服的"§!\n\n她用手掌揉搓著星球表面，享受那種細膩的觸感。隨後她將這顆沙球塞進了小穴。與之前的實驗不同，沙漠星球進入時異常順滑。細膩的沙粒在愛液的浸潤下變得更加柔軟，像按摩珠一樣在她體內滾動。無畏艦娘舒服地嘆了口氣。\n\n§R"啊...這個感覺真好"§!\n\n沙粒溫柔地刮擦著每一寸穴壁，帶來一種細膩的快感。星球在肉壁的擠壓下不斷變換形狀，最後溶解在了愛液之中，有些沙粒甚至滲入了更深的褶皺之中。但問題很快出現了。越來越多的沙粒在她穴內四處流竄。有些鑽進了子宮頸，有些卡在了肉壁的縫隙裡，帶來一種難以言喻的異物感。\n\n§R"唔...有點癢..."§!\n\n無畏艦娘試圖將星球排出，但那些散落的沙粒卻不那麼容易清理。她自慰了整整一個小時，分泌了大量愛液才把這些頑固的沙子沖洗乾淨。\n\n§R"舒服是挺舒服的，但善後太麻煩了"§!\n\n§M(鵝將軍記錄數據:沙漠星球質地柔軟，摩擦感極佳，但容易殘留顆粒。需要大量船員冒險清理§!"
    gts_event_bruh_shipgirl.0205.name: "實驗目標:海洋星球"
    gts_event_bruh_shipgirl.0205.desc: "§Y[FromFrom.GetName]§!是一顆被深藍色海洋完全覆蓋的星球，表面沒有任何陸地，只有無盡的水域。海洋深處生活著各種巨型海洋生物，但沒有智慧文明。無畏艦娘§H[From.GetName]§!將這顆水球捧在手中，能清楚地看到透過大氣層的波光粼粼。\n\n§R"全是水的星球？這個會有感覺嗎？"§!\n\n她好奇地用手指戳了戳星球表面，掀起了一場覆蓋半個星球的超級海嘯。隨後她張開雙腿，將這顆濕潤的水球對準了自己同樣濕潤的小穴。海洋星球幾乎是毫無阻力地滑入了她的體內。大量的海水在撞擊下從星球表面噴湧而出，與艦娘本就豐沛的愛液混合在一起，形成了一股洶湧的液體洪流從穴口湧出。\n\n§R"哇...好多水..."§!\n\n無畏艦娘低頭看著自己胯下那道液體流，它們在太空中凝結成無數晶瑩的水珠四散飛濺。她開始輕輕收縮小穴，感受著這顆液體在體內的觸感。那些生活在深海中的巨型生物此刻正經歷著前所未有的災難。它們被洋流捲起，在狂亂的水流中四處衝撞，最後重重地撞擊在肉壁上。有些體型較大的生物甚至能讓艦娘感受到它們的掙扎。\n\n§R"咦？裡面好像有什麼東西在動..."§!\n\n她好奇地加大了收縮力度。巨大的膛壓瞬間壓扁了所有海洋生物，它們的屍體瞬間消失在了愛液中，連一點痕跡都沒留下。隨著時間推移，海洋星球在她體內逐漸縮小。大量的海水被擠壓排出，最後只剩下一個小小的岩石核心還在穴內滾動。艦娘輕輕用力，將這顆小石頭便也消失。\n\n§R"這個感覺還不錯，很滑，就是水太多了，弄得到處都是"§!\n\n§M(鵝將軍記錄數據:海洋星球因含水量極高，滑入過程極其順暢，幾乎不會造成任何不適。但缺乏硬質結構，摩擦感較弱，刺激度中等。建議作為潤滑劑使用"
    gts_event_bruh_shipgirl.0206.name: "實驗目標:蓋亞星球"
    gts_event_bruh_shipgirl.0206.desc: "§Y[FromFrom.GetName]§!是一顆充滿原始生命的蓋亞星球。茂密的叢林覆蓋著大陸，清澈的河流縱橫交錯，各種動物在其中自由生活。但這顆星球上沒有任何智慧文明，只有最原始的生態系統。無畏艦娘§H[From.GetName]§!幾乎都能聞到青草和泥土的芬芳了。\n\n§R"好漂亮的星球...可惜了"§!\n\n她嘆了口氣，但實驗必須繼續。她張開雙腿，將這顆充滿生機的星球對準了自己的小穴。蓋亞星球緩緩被推入體內。溫暖濕潤的氣候讓它與艦娘的體溫完美契合，幾乎感覺不到溫差，而星球表面的森林在接觸到肉壁的瞬間就被碾碎了。\n\n§R"嗯...溫度剛好，感覺很舒服"§!\n\n無畏艦娘滿意地點點頭，開始輕柔地收縮小穴。星球表面的生態系統在她的擠壓下快速崩潰。那些在森林中奔跑的動物們突然發現天空變成了粉紅色，緊接著大地開始劇烈搖晃。板塊在肉壁的推擠下開始移動、相互碰撞，引發了無數場地震。火山噴發出熔岩，但這些熔岩還沒來得及流淌就被艦娘的愛液冷卻凝固。動物們在這場災難中四處逃竄。有些被滑坡掩埋，有些被洪水淹沒，還有些直接被從天而降的肉壁壓成肉餅。§H[From.GetName]§!閉上眼睛，專注地感受著穴內星球的變化。森林被壓成泥漿，山脈被碾平，海洋被愛液取代。整個星球在她的小穴中崩潰，重組，最後徹底混合成一團泥漿。十五分鐘後，蓋亞星球已經失去了原本的形狀。它變成了一個覆蓋著愛液的軟泥球，在她體內緩慢滾動。艦娘最後用力一夾，這團軟泥被徹底碾碎，化為愛液的一部分。當她鬆開雙腿時，流出的只有一些混濁的液體。\n\n§R"這個...比有智慧文明的那個舒服一些"§!\n\n無畏艦娘滿足地撫摸著平坦的小腹，臉上還帶著餘韻未消的潮紅。\n\n§M(鵝將軍記錄數據:蓋亞星球生態豐富，能提供多層次的觸感刺激。溫度適宜，質地柔軟。綜合評價為優秀實驗對象"
