    ############################################################################################################################################

    gts_event_bruh_shipgirl.0002.name: "征服宣告"
    gts_event_bruh_shipgirl.0002.desc: "敌人的舰队已经灰飞烟灭，剩下的只有这颗赤裸裸暴露在无畏舰娘面前的§Y[From.GetName]§!。面对地面上那些绝望发射的、如同灰尘般的防御导弹，无畏舰娘只觉得一阵好笑，那种程度的爆炸，连给她除毛都嫌力道不足。她轻笑著，无视了通讯频道里敌人撕心裂肺的求饶，将这颗敌人的家园像塞入一颗情趣跳蛋般，强行推入了她那湿滑的深渊。对于星球上的敌军来说，这是超越了所有噩梦的场景。它们引以为傲的要塞、繁华的都市，在接触到粉色肉壁的瞬间便被粉碎。紧接著，爱液如海啸般灌入大陆的每一个裂缝。无畏舰娘刻意控制著力道，没有立刻夹碎它，而是利用阴道的褶皱反复套弄、研磨，将星球表面的所有文明痕迹「舔舐」干净。当这颗星球再次重见天日时，它已经变成了一颗晶莹剔透的湿润球体。原本的仇恨与抵抗都已被溶化在浓稠的爱液中，在星空中无声地诉说著无畏舰娘的恐怖。"
    gts_event_bruh_shipgirl.0002.a: "旧的不去，新的不来"
    gts_event_bruh_shipgirl.0003.name: "毁灭打击"
    gts_event_bruh_shipgirl.0003.desc: "这是一场处刑，也是一场狂欢。无畏舰娘早已对这群顽固的小虫子失去了耐心。她抓起§Y[From.GetName]§!，就像抓起一颗准备捏爆的葡萄。敌人的反击打在她娇嫩的肌肤上，只引起了一阵轻微的搔痒，反而更加激发了她的暴虐欲望。「去死吧，小虫子们。」伴随著这句轻描淡写的判词，她将整颗星球粗暴地捅进了小穴。星球在她的体内燃烧，她兴奋地夹紧双腿，阴道的亿万吨肌肉同时发力。在星球核心承受不住压力而爆炸的前一秒，地表上的所有生命都已在绝望中被压成了肉泥。紧接著，一场星系级的剧烈高潮席卷了无畏全身。她发出一声娇喘，穴内的星球在这股毁灭性的收缩下彻底崩解。当一切平息，她意犹未尽地用手指从穴内抠出几块大陆板块的碎片，随手弹向深空。§Y[From.GetName]§!已经不复存在。"
    gts_event_bruh_shipgirl.0003.a: "只要她玩得开心就好"
    gts_event_bruh_shipgirl.0004.name: "环境改造"
    gts_event_bruh_shipgirl.0004.desc: "接到指挥部关于"§R重塑[From.GetName]§!"的指令后，无畏舰娘缓缓移向了这颗属于帝国的星球。在她那足以遮蔽恒星光芒的宏伟身躯面前，这颗居住了数十亿人口的行星，不过是一颗色泽稍微黯淡的跳蛋罢了。她伸出玉指，轻巧地将这颗星球从轨道上摘下，无视了大气层内传来的、对她而言连蚊呐都不如的通讯请求。随后，她将内裤拉开了一角，露出了湿润而贪婪的秘境。伴随著一声轻柔的叹息，这颗星球被她缓缓推入了温暖的小穴之中。对于星球上的居民而言，世界末日是粉红色的。天空被柔软的肉壁取代，紧接著是无穷无尽的爱液洪流。瞬间摧毁了地表所有的城市与建筑，将文明的痕迹抹除殆尽。无畏舰娘并没有急著粉碎它，而是轻柔地「按摩」著这颗小球，让它在充满费洛蒙的爱液中浸泡、腌制。数小时后，伴随著一声满足的呻吟，这颗星球被「排出」体外。此时的它已不再是那颗岩石行星，原本的地壳结构已被渗透的爱液彻底改变，地表覆盖著厚厚的、散发著甜腻香气的粘液海洋。虽然原本的居民已全部溺毙，但对于帝国而言，这是一颗新生的、充满资源的爱液星球。"
    gts_event_bruh_shipgirl.0004.a: "虽然有些残忍，但产能提升了...大概？"
    gts_event_bruh_shipgirl.0005.name: "废弃处分"
    gts_event_bruh_shipgirl.0005.desc: "指挥部的命令是§R废弃处分§!。对于无畏舰娘来说，这意味著她可以毫无顾忌地处理掉这颗碍眼的「过期糖果」。§Y[From.GetName]§!在她的掌心中显得如此脆弱，她甚至懒得去听星球总督最后的哀嚎，便将这颗直径数万公里的行星塞进了她早已渴望填满的阴道深处。不同于温柔的爱抚，这一次，她渴望的是更为暴力的刺激。刚一进入，紧致的肉壁便如同液压钳般从四面八方挤压而来。星球的地壳在瞬间崩裂，岩浆从地底喷涌而出，却又立刻被更加滚烫的爱液浇熄。无畏舰娘微微仰头，双腿在虚空中无意识地抽搐著，她享受著这颗粗糙的「弹珠」摩擦过的快感。随著快感的堆叠，「喀嚓」虽然在太空中听不到声音，但那种崩碎的触感清晰地传递到了。这颗星球在她的高潮中被硬生生夹碎成了齑粉。当她最终松开肌肉，随著一股浊白的洪流喷涌而出的，只有无数细碎的小行星残骸。这颗星球彻底成为了历史，以及她一次高潮的祭品。"
    gts_event_bruh_shipgirl.0005.a: "反正这颗星球也没什么用了"
    gts_event_bruh_shipgirl.0006.name: "旅途消遣"
    gts_event_bruh_shipgirl.0006.desc: "这是一颗未经开发的原始星球，但在无畏舰娘眼中，这不过是一颗质地不错的「玩具球」。指挥部发来了许可讯号，允许她将这颗星球作为娱乐。无畏舰娘带著一丝好奇，用指尖轻轻拨弄了一下这颗蓝绿相间的「弹珠」，引发了地表上的超级地震。随后，她不再犹豫，为了纾解旅途的空虚，她将这颗星球缓缓纳入小穴。对于星球上的原始生物来说，这是神罚，也是神迹。天空被巨大的肉色穹顶遮蔽，温暖而黏稠的「圣水」从天而降，淹没了森林与山脉。无畏舰娘闭著眼睛，感受著这颗小球在敏感点附近的滚动，原本粗糙的地表在爱液的浸泡下逐渐变得光滑。她并没有打算毁掉它，只是想把它「腌制」得更有风味。经过长时间的浸泡，星球原本的生态系统被彻底置换。当她玩腻了将其排出时，这颗星球已经变成了一个被爱液包裹的星球，原本的原始文明已化作养分，成为了行星海洋的一部分。"
    gts_event_bruh_shipgirl.0006.a: "看起来腌制得很入味"
    gts_event_bruh_shipgirl.0007.name: "脆弱玩具"
    gts_event_bruh_shipgirl.0007.desc: ""只是一颗无关紧要的石头罢了"无畏舰娘在收到指挥部「自由处置」的命令后，百无聊赖地打量著这颗行星。长期的航行让她感到些许无聊，而这颗星球的大小刚好适合用来解闷。她没有任何前戏，直接将这颗星球当作免洗用品塞入了体内。也许是因为这颗星球的地质结构太过脆弱，又或者是无畏舰娘今天的兴致太过高昂，意外发生得很快。当她试图用肉壁去感受星球表面的纹理时，仅仅是一次无意识的收缩测试，这颗脆弱的「弹珠」就在她体内发出了不堪重负的悲鸣。地壳像蛋壳一样破碎，地核的热量在她体内扩散，带来一阵酥麻的暖意"啊...坏掉了？"无畏舰娘困惑地眨了眨眼，她感觉到体内的那个硬物已经变成了一堆碎渣。随著她失望地叹气，无数的岩石碎片混合著爱液被排入太空。这颗星球的命运就这样在她的无心之失中画上了句号，连同上面可能存在的生命一起，变成了一堆无意义的宇宙垃圾。"
    gts_event_bruh_shipgirl.0007.a: "下次记得找个结实点的...如果有的话"

    gts_event_bruh_shipgirl.0021.name: "蓝白色的末日天幕"
    gts_event_bruh_shipgirl.0021.desc: "无畏舰娘收到了新的指令。她并没有像往常那样直接动手摧毁§Y[From.GetName]§!，而是带著一丝羞涩与兴奋，缓纾解开了腰间的系带。对于§Y[From.GetName]§!上的居民来说，这是一场香艳而绝望的灾难。天空被巨大的阴影遮蔽，那不是乌云，而是带著蓝白条纹的巨大织物。随著舰娘将那条还带著体温的胖次褪下，浓烈的雌性气息瞬间冲垮了大气循环。她双手撑开那条足以容纳世界的内裤，像捕捉萤火虫一样，将整颗星球温柔而坚定地兜了进去。星球表面的通讯在那一刻被彻底切断，最后传回的画面只有白色的棉质穹顶和舰娘那因为羞耻而微微泛红的巨脸。"
    gts_event_bruh_shipgirl.0021.a: "经典款式的经典毁灭"
    gts_event_bruh_shipgirl.0022.name: "条纹天空的审判"
    gts_event_bruh_shipgirl.0022.desc: "§Y[From.GetName]§!的居民们惊恐地看著天空变成了蓝白相间的颜色。那不是云层，而是无畏舰娘刚刚从胯下褪去的贴身衣物。她将那条还散发著腾腾热气的蓝白条纹胖次撑开，无情地套在了这颗星球上。随著松紧带在星球赤道附近猛烈回弹，巨大的勒紧力量粉碎了赤道周围的所有山脉。紧接著，胖次裆部那吸满了液体的部分沉重地压在了星球的北半球。对于地面上的小人来说，世界末日是黏稠且腥甜的。巨量的爱液与汗水从巨大的棉质织物缝隙中被挤压出来，形成了高达数千公尺的黄白色海啸。城市在瞬间被这股液体冲垮，所有建筑与生命都在这股源自少女私处的洪流中淹没、窒息。"
    gts_event_bruh_shipgirl.0022.a: "这是神明的恩赐...虽然有点臭"
    gts_event_bruh_shipgirl.0023.name: "狂热粉丝的末路"
    gts_event_bruh_shipgirl.0023.desc: "§Y[From.GetName]§!上的居民曾是舰娘最狂热的粉丝群体，它们日夜祈祷能得到女神的「恩赐」。于是，无畏舰娘回应了他们，她将刚脱下的蓝白条纹胖次作为「奖励」，直接丢在了行星上空。居民们最初还在为天空中降下的巨大圣物而欢呼，直到那沉重的布料真的砸在头顶。数公里厚的棉层瞬间压垮了城市护盾，而胖次裆部积累的巨量爱液像决堤的江河一样倾泻而下。狂热的欢呼声瞬间变成了绝望的气泡声，这座繁华的都市连同上面的所有粉丝，都被那过于沉重且湿润的「爱意」彻底淹没，化作了织物纹理间的一抹红斑。"
    gts_event_bruh_shipgirl.0023.a: "求仁得仁...大概？"
    gts_event_bruh_shipgirl.0024.name: "无处安放的衣物"
    gts_event_bruh_shipgirl.0024.desc: "一场灾难性的「误操作」！无畏舰娘在我们的殖民地§Y[From.GetName]§!附近进行换装时，随手将刚脱下的蓝白条纹胖次丢向了这颗星球。这条巨大的内裤依然保持著她身体的温度，不偏不倚地将整颗星球罩住。对于上面的殖民者来说，天空突然塌陷了，随之而来的是一场带有强烈少女体味的风暴。整个殖民地在几分钟内就被淹没在黏稠的液体中。通讯中最后传来的声音是人们在齐腰深的爱液中绝望的呼救，以及对那遮蔽天空的蓝白条纹的恐惧。当舰娘意识到这一点时，星球上的文明火种已经熄灭了。"
    gts_event_bruh_shipgirl.0024.a: "下次请看清楚再扔"
    gts_event_bruh_shipgirl.0025.name: "土著的圣物"
    gts_event_bruh_shipgirl.0025.desc: "这颗原始星球上的土著曾以为神迹降临。当无畏舰娘将她那条穿了很久、吸满了爱液的蓝白条纹胖次赐予这颗星球时，土著们对著那遮天蔽日的蓝白条纹跪拜。然而，神迹很快变成了天灾。随著胖次完全覆盖地表，其中心部位积累的黏稠液体开始在重力的作用下大量渗出。这不是滋润万物的雨露，而是毁灭性的洪水。原始的森林被爱液冲垮，简陋的部落被淹没在带有甜腥味的浪潮中。数以亿计的原始生物被困在湿润的棉布与地表之间，最终全部溺死在舰娘的爱液里。这颗星球现在看起来就像是一个包著蓝白条纹包装纸的湿润泥球。"
    gts_event_bruh_shipgirl.0025.a: "有些礼物太过沉重了"

    gts_event_bruh_shipgirl.0101.name: "意外的「加餐」"
    gts_event_bruh_shipgirl.0101.desc: "一场可怕的悲剧！舰娘§H[[event_target:gts_bruh_get_event_shipgirl.GetName]§!在享用小行星带的矿石零食时，不小心将§Y[event_target:gts_bruh_get_event_target.GetName]§!一并抓了起来。尽管§Y[event_target:gts_bruh_get_event_target.GetName]§!发出了全频段的求救信号，但在她看来那不过是食物上的一点杂质。§Y[event_target:gts_bruh_get_event_target.GetName]§!被抛入了那湿润、温热的粉色深渊中。巨大的舌头像红色的海啸一样翻涌，将§Y[event_target:gts_bruh_get_event_target.GetName]§!卷向了洁白的臼齿山脉。工作人员在被嚼碎前，最后看到的景象是那缓缓烙下的白色天花板......"
    gts_event_bruh_shipgirl.0101.a: "至少...它们成为了她的一部分"
    gts_event_bruh_shipgirl.0101.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName]被嚼碎了§!"

    gts_event_bruh_shipgirl.0102.name: "晨间的洪水"
    gts_event_bruh_shipgirl.0102.desc: "这是一个糟糕的早晨。刚睡醒的舰娘§H[event_target:gts_bruh_get_event_shipgirl.GetName]§!显然处于迷糊状态，她似乎把我们美丽的海洋行星[Root.GetName]当成了她的私人马桶。当巨大的阴影笼罩天空，两瓣洁白的巨臀像天盖一样遮住了恒星时，全球的警报都响了。没有任何商量的余地，伴随著令人绝望的瀑布声，滚烫的黄色洪流从天而降。这股带有强烈氨气味和巨娘体温的液体瞬间击穿了大气层，引发了全球性的海啸。原本蔚蓝的海洋在几分钟内就被染成了浑浊的淡黄色，海平面上升了数公里。"
    gts_event_bruh_shipgirl.0102.a: ""这颗星球的海洋现在由90%的巨娘晨尿构成，散发著独特的气味""

    gts_event_bruh_shipgirl.0103.name: "航道上的零食"
    gts_event_bruh_shipgirl.0103.desc: "我们的§Y[event_target:gts_bruh_get_event_target.GetName]§!失联了。最后传回的影像显示，巨大的舰娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!正在该星系进行补给，具体来说，她正在抓取小行星往嘴里塞。很不幸，我们的§Y[event_target:gts_bruh_get_event_target.GetName]§!当时正隐蔽在那片小行星带中执行任务。舰娘显然没有注意到混在「爆米花」里的几粒「灰尘」。通讯记录的最后是巨大的洁白牙齿合拢的画面，以及随后陷入黑暗的潮湿咀嚼声。我们探测到她满足地咽下去了，而现在§Y[event_target:gts_bruh_get_event_target.GetName]§!正在她的胃酸海洋中随波逐流。"
    gts_event_bruh_shipgirl.0103.a: "愿它们能在被胃酸消化前发回一些生物学数据"
    gts_event_bruh_shipgirl.0103.b: "发送信号让她催吐！快！"
    gts_event_bruh_shipgirl.0103.c: "幸好她的消化系统没那么强......"
    gts_event_bruh_shipgirl.0103.a.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName]将会被消化§!"
    gts_event_bruh_shipgirl.0103.b.custom_tooltip: "§Y25%的机率[event_target:gts_bruh_get_event_target.GetName]能够幸存§!"
    gts_event_bruh_shipgirl.0103.c.custom_tooltip: "§G[event_target:gts_bruh_get_event_target.GetName]幸存下来了......§!"

    gts_event_bruh_shipgirl.0104.name: "贴身收藏"
    gts_event_bruh_shipgirl.0104.desc: "我们的§Y[event_target:gts_bruh_get_event_target.GetName]§!在执行扫描任务时，被舰娘§H[event_target:gts_bruh_get_event_shipgirl.GetName]§!发现了。这位好奇的舰娘并没有摧毁飞船，而是将其视为一个精致的会发光的小玩具。"好可爱的小东西，还在动呢！"通讯频道里传来她惊喜的声音。随后，她不顾船员们的尖叫，将整艘科研船塞进了她那深邃、温暖且充满乳香的乳沟深处，以此作为贴身的装饰品。目前§Y[event_target:gts_bruh_get_event_target.GetName]§!虽然结构完好，但被两座巨大的肉山死死夹住，船体外壳温度急剧升高，且感测器被乳汗和皮肤完全遮蔽，除了白花花的一片什么也看不到。"
    gts_event_bruh_shipgirl.0104.a: "立刻请求她归还飞船！"
    gts_event_bruh_shipgirl.0104.b: "就让它们在那待著吧"
    gts_event_bruh_shipgirl.0104.a.custom_tooltip: "§R有机率导致§R[event_target:gts_bruh_get_event_target.GetName]§!被捏碎§!"
    gts_event_bruh_shipgirl.0104.b.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName]将永远困在乳沟之间§!"

    gts_event_bruh_shipgirl.0105.name: "夹缝求生"
    gts_event_bruh_shipgirl.0105.desc: "一支隶属于海盗的舰队试图从我们的§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!前溜过去，它们天真地以为飞到胸口前就能躲避她的视线。然而它们低估了那两座宏伟山峰的危险性。当§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!双臂并拢挤压胸部时，那道深邃的乳沟瞬间变成了死亡陷阱。两侧柔软却充满韧性的乳肉向中间合拢，空间被极速压缩。无数战舰被挤压在两团巨大的脂肪之间，就像夹心饼干里的馅料一样动弹不得。这些战舰在混合著汗水与乳香的热浪中慢慢变形、粉碎。"
    gts_event_bruh_shipgirl.0105.a: "多么幸福的死法......"
    gts_event_bruh_shipgirl.0105.b: "记得提醒她洗澡时清理一下"

    gts_event_bruh_shipgirl.0106.name: "巨大的好奇心"
    gts_event_bruh_shipgirl.0106.desc: "§Y[event_target:gts_bruh_get_event_target.GetName]§!上的居民最近陷入了集体恐慌。因为在今天早些时候，整个天空突然变成了美丽的翠绿色，那其实路过的舰娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!将她那巨大的眼球贴近了大气层外缘，想要仔细观察这些「小虫子」的生活。她并没有恶意，但她那遮天蔽日的虹膜遮挡了恒星的光芒，导致全球气温骤降，潮汐引力也因为她的靠近而发生了紊乱。居民们纷纷跪地膜拜这只「天空之眼」，并开始献祭各种奇怪的东西试图取悦她。"
    gts_event_bruh_shipgirl.0106.a: "让她赶紧离开"
    gts_event_bruh_shipgirl.0106.b: "这是一个教化它们的好机会，建立舰娘神教！"
    gts_event_bruh_shipgirl.0106.b.custom_tooltip: "§G10%人口获得唯心主义思潮§!"

    gts_event_bruh_shipgirl.0107.name: "脚底的异物感"
    gts_event_bruh_shipgirl.0107.desc: "舰娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!抱怨她在巡逻时感觉鞋子里进了沙子，弄得她脚底不舒服。在经过她的允许后，工程队进入了那只如同大陆般巨大的鞋子内部进行检查。我们惊恐地发现，所谓的「沙子」其实是一个被我们遗忘的研究站，连同周围的小行星碎片一起被卡在了她的脚趾缝和大拇指指纹之间。观测站虽然已被压扁，但里面的人员奇迹般地幸存了下来，只不过它们现在精神状态极不稳定，嘴里一直念叨著「粉色的天穹」和「酸臭的风暴」。"
    gts_event_bruh_shipgirl.0107.a: "把它们救出来，并清理鞋子"
    gts_event_bruh_shipgirl.0107.b: "既然已经压扁了，就留在里面当缓冲垫吧"
    gts_event_bruh_shipgirl.0107.c: "回收观测站的数据，这可是珍贵的第一手资料"

    gts_event_bruh_shipgirl.0200.name: "实验目标:荒芜星球"
    gts_event_bruh_shipgirl.0200.desc: "无畏舰娘§H[From.GetName]§!抵达了实验目标§Y[FromFrom.GetName]§!的轨道上空。这是一颗毫无生机的荒芜星球，地表布满了陨石坑和碎石。\n\n§R"第一个实验品吗？看起来挺硬的"§!\n\n舰娘饶有兴趣地打量著这颗灰褐色的星球，随后她开始宽衣解带。当她的手指勾住内裤边缘时，整个星球都笼罩在了她巨大身躯投下的阴影之中。她将这颗荒芜星球缓缓推入了小穴深处。坚硬的岩石地表刚一接触到湿润的肉壁就开始剧烈摩擦。无畏舰娘皱起了眉头。\n\n§R"好粗糙...刮得有点疼"§!\n\n她的小穴开始分泌大量爱液试图润滑这颗粗糙的星球。黏稠的液体渗入每一道裂缝，将干燥的荒漠完全浸透。星球表面的碎石在肉壁的挤压下开始剥落，混合著爱液变成了泥浆般的物质。舰娘夹紧双腿，用力收缩。"喀嚓"的碎裂声甚至都传不出小穴中，整颗星球的外壳就像鸡蛋壳一样裂开了，露出内部炽热的地幔。滚烫的岩浆涌出，与冰凉的爱液接触后瞬间凝固。\n\n§R"唔...这种感觉还挺特别的"§!\n\n无畏舰娘满意地抚摸著小腹，星球已经被完全碾碎。\n\n§M(鹅将军记录数据:荒芜星球因表面过于粗糙，会对舰娘造成轻微不适，但其坚硬的结构能提供强烈的刺激)§!"
    gts_event_bruh_shipgirl.0200.a: "实验数据获得"
    gts_event_bruh_shipgirl.0201.name: "实验目标:冰封星球"
    gts_event_bruh_shipgirl.0201.desc: "§Y[FromFrom.GetName]§!是一颗完全被冰层覆盖的星球，表面温度低至零下两百度。当无畏舰娘§H[From.GetName]§!将它抓在手中时，甚至能感受到一丝寒意。\n\n§R"好冷...不过正好可以降降温"§!\n\n她刚刚经历了一场激烈的战斗，甚至身上都还残留著汗液。她毫不犹豫地将这颗冰球塞进了自己湿热的小穴。冰与火的碰撞在瞬间爆发。零下两百度的冰层接触到体温高达四十度的肉壁，立刻开始剧烈融化。大量的冰水混合著舰娘本就丰沛的爱液，从穴口涌出，在太空中凝结成晶莹的冰珠四散飞溅。\n\n§R"嘶...好冰！"§!\n\n无畏舰娘倒吸一口凉气，双腿本能地夹紧。冰封星球在她穴内快速升温，表面的冰壳层层剥落，露出下方同样冰冷的岩石核心。但这种冰凉的刺激反而让舰娘更加兴奋，她开始主动扭动腰肢，用体温融化这颗冰球。十分钟后，整颗星球已经完全融化，变成了一团混杂著爱液的冰水。舰娘松开双腿，液体哗啦啦地流出，在太空中形成了一条晶莹的冰带。\n\n§R"啊...爽快！就像喝了冰可乐一样"§!\n\n§M(鹅将军记录数据:冰封星球能为舰娘提供清凉的刺激感，且融化后的冰水可以作为天然润滑剂)§!"
    gts_event_bruh_shipgirl.0202.name: "实验目标:剧毒星球"
    gts_event_bruh_shipgirl.0202.desc: "§Y[FromFrom.GetName]§!是一颗充满剧毒的死亡星球。它的大气层由硫酸云和氯气组成，地表则覆盖著腐蚀性极强的化学物质。当无畏舰娘§H[From.GetName]§!抓起这颗星球时，她的手掌立刻感受到了一阵刺痛。\n\n§R"这东西是不是有毒？"§!\n\n她好奇地嗅了嗅，刺鼻的气味让她皱起了眉头。但实验必须继续，她深吸一口气，将这颗剧毒星球推入了小穴。剧烈的化学反应瞬间爆发。星球表面的毒液与舰娘的爱液接触后开始冒出大量白色泡沫，发出"嗞嗞"的腐蚀声。无畏舰娘的脸色一变。\n\n§R"好烫！不对...是在烧！"§!\n\n剧毒物质正在腐蚀她敏感的穴壁，那种又烫又麻的刺激感让她忍不住叫出声来。她本能地想要将星球排出，但小穴已经因为刺激而痉挛收缩，反而把星球夹得更紧。\n\n§R"该死...出不来了！"§!\n\n舰娘咬紧牙关，开始分泌更多的爱液试图稀释毒素。十五分钟的痛苦挣扎后，剧毒星球终于被她的爱液中和，变成了一团无害的泥浆被排出体外。无畏舰娘瘫软地漂浮在太空中，双腿还在微微颤抖。\n\n§R"这个...太刺激了。下次能不能换个温和点的？"§!\n\n§M(鹅将军记录数据:剧毒星球会对舰娘造成严重不适，但刺激性极强，可能会引发意外的快感。建议仅在特殊情况下使用)§!"
    gts_event_bruh_shipgirl.0203.name: "实验目标:熔融星球"
    gts_event_bruh_shipgirl.0203.desc: "§Y[FromFrom.GetName]§!是一颗靠近恒星的熔融星球，表面温度高达一千度以上，整颗星球都在缓缓流淌著熔岩。当无畏舰娘§H[From.GetName]§!接近时，她能清楚地感受到那股灼人的热浪。\n\n§R"这个看起来很危险啊..."§!\n\n她犹豫了一下，但想到这是实验，还是决定尝试。她小心翼翼地将这颗火球捧在手中，熔岩在她掌心流淌，留下一道道烫红的痕迹。深呼吸，她将熔融星球推入了小穴。\n\n§R"啊啊啊——草！！！"§!\n\n无畏舰娘发出一声尖叫。一千度的熔岩接触到她的穴壁，那种灼烧感比任何武器都要强烈。她的爱液瞬间被蒸发，发出"嘶嘶"的声音，大量的水蒸气从穴口喷涌而出。\n\n§R"太烫了太烫了！快拿出来！"§!\n\n就在她快要承受不住时，大量的爱液突然喷涌而出，像消防水带一样冲向熔融星球。在巨量液体的冷却下，岩浆开始凝固，温度逐渐下降。五分钟后，整颗星球已经冷却成一块粗糙的黑色岩石，裹著爱液被舰娘艰难地排出体外。她瘫软地漂浮著，下体还在冒著白烟。\n\n§R"这个...绝对不要再来第二次"§!\n\n§M(鹅将军记录数据:熔融星球温度过高，会对舰娘造成严重伤害，但冷却后的岩石质地极佳)§!"
    gts_event_bruh_shipgirl.0204.name: "实验目标:沙漠星球"
    gts_event_bruh_shipgirl.0204.desc: "§Y[FromFrom.GetName]§!是一颗完全被沙漠覆盖的星球，地表是无尽的金色沙丘。\n\n§R"沙子做的星球？摸起来挺舒服的"§!\n\n她用手掌揉搓著星球表面，享受那种细腻的触感。随后她将这颗沙球塞进了小穴。与之前的实验不同，沙漠星球进入时异常顺滑。细腻的沙粒在爱液的浸润下变得更加柔软，像按摩珠一样在她体内滚动。无畏舰娘舒服地叹了口气。\n\n§R"啊...这个感觉真好"§!\n\n沙粒温柔地刮擦著每一寸穴壁，带来一种细腻的快感。星球在肉壁的挤压下不断变换形状，最后溶解在了爱液之中，有些沙粒甚至渗入了更深的褶皱之中。但问题很快出现了。越来越多的沙粒在她穴内四处流窜。有些钻进了子宫颈，有些卡在了肉壁的缝隙里，带来一种难以言喻的异物感。\n\n§R"唔...有点痒..."§!\n\n无畏舰娘试图将星球排出，但那些散落的沙粒却不那么容易清理。她自慰了整整一个小时，分泌了大量爱液才把这些顽固的沙子冲洗干净。\n\n§R"舒服是挺舒服的，但善后太麻烦了"§!\n\n§M(鹅将军记录数据:沙漠星球质地柔软，摩擦感极佳，但容易残留颗粒。需要大量船员冒险清理§!"
    gts_event_bruh_shipgirl.0205.name: "实验目标:海洋星球"
    gts_event_bruh_shipgirl.0205.desc: "§Y[FromFrom.GetName]§!是一颗被深蓝色海洋完全覆盖的星球，表面没有任何陆地，只有无尽的水域。海洋深处生活著各种巨型海洋生物，但没有智慧文明。无畏舰娘§H[From.GetName]§!将这颗水球捧在手中，能清楚地看到透过大气层的波光粼粼。\n\n§R"全是水的星球？这个会有感觉吗？"§!\n\n她好奇地用手指戳了戳星球表面，掀起了一场覆盖半个星球的超级海啸。随后她张开双腿，将这颗湿润的水球对准了自己同样湿润的小穴。海洋星球几乎是毫无阻力地滑入了她的体内。大量的海水在撞击下从星球表面喷涌而出，与舰娘本就丰沛的爱液混合在一起，形成了一股汹涌的液体洪流从穴口涌出。\n\n§R"哇...好多水..."§!\n\n无畏舰娘低头看著自己胯下那道液体流，它们在太空中凝结成无数晶莹的水珠四散飞溅。她开始轻轻收缩小穴，感受著这颗液体在体内的触感。那些生活在深海中的巨型生物此刻正经历著前所未有的灾难。它们被洋流卷起，在狂乱的水流中四处冲撞，最后重重地撞击在肉壁上。有些体型较大的生物甚至能让舰娘感受到它们的挣扎。\n\n§R"咦？里面好像有什么东西在动..."§!\n\n她好奇地加大了收缩力度。巨大的膛压瞬间压扁了所有海洋生物，它们的尸体瞬间消失在了爱液中，连一点痕迹都没留下。随著时间推移，海洋星球在她体内逐渐缩小。大量的海水被挤压排出，最后只剩下一个小小的岩石核心还在穴内滚动。舰娘轻轻用力，将这颗小石头便也消失。\n\n§R"这个感觉还不错，很滑，就是水太多了，弄得到处都是"§!\n\n§M(鹅将军记录数据:海洋星球因含水量极高，滑入过程极其顺畅，几乎不会造成任何不适。但缺乏硬质结构，摩擦感较弱，刺激度中等。建议作为润滑剂使用"
    gts_event_bruh_shipgirl.0206.name: "实验目标:盖亚星球"
    gts_event_bruh_shipgirl.0206.desc: "§Y[FromFrom.GetName]§!是一颗充满原始生命的盖亚星球。茂密的丛林覆盖著大陆，清澈的河流纵横交错，各种动物在其中自由生活。但这颗星球上没有任何智慧文明，只有最原始的生态系统。无畏舰娘§H[From.GetName]§!几乎都能闻到青草和泥土的芬芳了。\n\n§R"好漂亮的星球...可惜了"§!\n\n她叹了口气，但实验必须继续。她张开双腿，将这颗充满生机的星球对准了自己的小穴。盖亚星球缓缓被推入体内。温暖湿润的气候让它与舰娘的体温完美契合，几乎感觉不到温差，而星球表面的森林在接触到肉壁的瞬间就被碾碎了。\n\n§R"嗯...温度刚好，感觉很舒服"§!\n\n无畏舰娘满意地点点头，开始轻柔地收缩小穴。星球表面的生态系统在她的挤压下快速崩溃。那些在森林中奔跑的动物们突然发现天空变成了粉红色，紧接著大地开始剧烈摇晃。板块在肉壁的推挤下开始移动、相互碰撞，引发了无数场地震。火山喷发出熔岩，但这些熔岩还没来得及流淌就被舰娘的爱液冷却凝固。动物们在这场灾难中四处逃窜。有些被滑坡掩埋，有些被洪水淹没，还有些直接被从天而降的肉壁压成肉饼。§H[From.GetName]§!闭上眼睛，专注地感受著穴内星球的变化。森林被压成泥浆，山脉被碾平，海洋被爱液取代。整个星球在她的小穴中崩溃，重组，最后彻底混合成一团泥浆。十五分钟后，盖亚星球已经失去了原本的形状。它变成了一个覆盖著爱液的软泥球，在她体内缓慢滚动。舰娘最后用力一夹，这团软泥被彻底碾碎，化为爱液的一部分。当她松开双腿时，流出的只有一些混浊的液体。\n\n§R"这个...比有智慧文明的那个舒服一些"§!\n\n无畏舰娘满足地抚摸著平坦的小腹，脸上还带著余韵未消的潮红。\n\n§M(鹅将军记录数据:盖亚星球生态丰富，能提供多层次的触感刺激。温度适宜，质地柔软。综合评价为优秀实验对象"
