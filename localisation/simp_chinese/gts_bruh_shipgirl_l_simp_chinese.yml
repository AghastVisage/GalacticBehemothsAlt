    gts_bruh_shipgirl_ship_sizes_3: "Bruh無畏艦娘"
    gts_bruh_shipgirl_ship_sizes_3_plural: "$gts_bruh_shipgirl_ship_sizes_3$"
    gts_bruh_shipgirl_ship_sizes_3_cap: "$gts_bruh_shipgirl_ship_sizes_3$"
    gts_bruh_shipgirl_ship_sizes_3_short: "無畏艦娘"
    SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_3_DESC: "§M(Bruh系列艦娘)§!\n真正的星海霸主，體型之大以至於恆星在她們身旁都顯得黯淡，普通的恆星在她面前都如同暖手寶一般。她們是唯一擁有足夠蠻力揮舞那把數萬公里長"斬艦刀"的存在。她們的存在本身就是一種天災，不僅能用物理手段切開敵人的主力艦隊，更擁有處理行星的恐怖能力。當無畏艦娘出現在雷達上時，撤退往往已經太遲了"
    
