    gts_bruh_shipgirl_ship_sizes_1_projects_DESC: "在[event_target:gts_bruh_random_spawn_system_1.GetName]的邊緣，我們發現了一片散落著巨大金屬圓筒的區域，看起來像是未爆的超巨型魚雷"
    gts_bruh_shipgirl_ship_sizes_2_projects_DESC: "在[event_target:gts_bruh_random_spawn_system_2.GetName]星系內漂浮著數以萬計的巨大黃銅圓筒，那是比我們最大的太空站還要巨大的彈殼。掃描還發現了一些損毀的艦載機殘骸，被整塊撕裂的小行星。這毫無疑問是一位擁有重火力的戰艦留下的靶場"
    gts_bruh_shipgirl_ship_sizes_3_projects_DESC: "在[event_target:gts_bruh_random_spawn_system_3.GetName]星系內的一顆行星被某種難以想像的利器物理切開，斷面光滑如鏡。更令人恐懼的是，星系中央殘留著大量成分不明的黏稠液體，這些液體包裹著無數被擠壓變形的星球"

    gts_bruh_shipgirl_planet_killer_panties_chain_title: "獲取Bruh艦娘實驗數據"
    gts_bruh_shipgirl_planet_killer_panties_chain_desc: "§M鵝§!發來請求，它想請求幫助獲取實驗數據，以研發新的殲星武器。"
    gts_bruh_shipgirl_planet_killer_panties_data_collected: "已獲取的實驗數據"
