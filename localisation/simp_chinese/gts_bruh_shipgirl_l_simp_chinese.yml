    # 武器
    tech_gts_bruh_shipgirl_torpedo_1: "飽和雷擊戰術"
    tech_gts_bruh_shipgirl_torpedo_1_desc: "§M(Bruh系列科技)§!\n精準度？不需要那種東西。只要將這片星域填滿巨大的金屬圓柱體，敵人便無處可逃。這項科技解鎖了掛載於艦娘大腿外側的超巨型魚雷發射管"

    tech_gts_bruh_shipgirl_kinetic_artillery_1: "艦娘手持火炮訓練"
    tech_gts_bruh_shipgirl_kinetic_artillery_1_desc: "§M(Bruh系列科技)§!\n雖然主炮的威力令人著迷，但我們不能忽視近距離的纏鬥。通過訓練艦娘如何同時操作艦裝上的多門中小口徑火炮，或者在主炮裝填間隙使用手持副武器進行射擊，填補火力空白，§Y以及不把彈殼砸在友軍的船艦上！§!"
    tech_gts_bruh_shipgirl_kinetic_artillery_2: "驅逐艦娘專用火控"
    tech_gts_bruh_shipgirl_kinetic_artillery_2_desc: "§M(Bruh系列科技)§!\n$gts_bruh_shipgirl_ship_sizes_1$以靈活著稱，她們的武器也應如此。我們改變了傳統的大口徑主炮思路，轉而研發了一種輕量化、犧牲射程的動能紅炮系統"
    tech_gts_bruh_shipgirl_kinetic_artillery_3: "超大口徑鑄造工藝"
    tech_gts_bruh_shipgirl_kinetic_artillery_3_desc: "§M(Bruh系列科技)§!\n不管是什麼問題，只要炮管夠粗、口徑夠大就能解決。如果一發§Y460000000mm§!的實體炮彈不能解決問題，那就再來一發。這項科技致力於製造出與無畏艦娘那宏偉的身軀相稱的巨炮"

    tech_gts_bruh_shipgirl_kinetic_sword_1: "近身格鬥CQC"
    tech_gts_bruh_shipgirl_kinetic_sword_1_desc: "§M(Bruh系列科技)§!\n在星際時代用冷兵器聽起來很蠢？那是因為妳的刀不夠大。當火炮過熱、彈藥耗盡，或者單純只是想體驗切開金屬的手感時，一把由高密度合金鍛造的、長達數萬公里的實體長刀就是最好的伙伴。直接用一塊幾萬公里長的合金砍在敵方艦群上，比什麼雷射都管用"

    tech_gts_bruh_shipgirl_point_defence_1: "動態視力強化"
    tech_gts_bruh_shipgirl_point_defence_1_desc: "§M(Bruh系列科技)§!\n那些蒼蠅般的導彈和戰機太煩人了。通過特殊的眼球運動訓練，艦娘現在可以看清高速飛行的微小目標，並指揮近防炮將其擊落，就像拍死蚊子一樣簡單。"
    tech_gts_bruh_shipgirl_flak_battery_1: "彈幕覆蓋理論"
    tech_gts_bruh_shipgirl_flak_battery_1_desc: "§M(Bruh系列科技)§!\n與其瞄準單個目標，不如把那一片區域全部填滿彈片。教會艦娘使用霰彈原理，向敵方機群方向噴射金屬風暴，確保沒有任何東西能穿過這道牆"

    tech_gts_bruh_shipgirl_strike_craft_1: "航空戰術理論"
    tech_gts_bruh_shipgirl_strike_craft_1_desc: "§M(Bruh系列科技)§!\n艦載機會從艦娘手中的飛行甲板(有時是一把弓)起飛，艦娘們能夠操控那些圍繞她們飛行的小傢伙，無論是通過意念連結還是簡單的無線電指揮。對於艦娘來說，它們是可愛的玩具，但對於敵人來說，這些攜帶了重型航彈和機炮的機群是致命的蜂群"

    # 反應爐
    tech_gts_bruh_shipgirl_reactor_1: "基礎代謝法"
    tech_gts_bruh_shipgirl_reactor_2: "飢餓適應術"
    tech_gts_bruh_shipgirl_reactor_3: "暴食消化法"
    tech_gts_bruh_shipgirl_reactor_4: "星體吞噬術"
    tech_gts_bruh_shipgirl_reactor_1_desc: "§M(Bruh系列科技)§!\n透過規律的飲食訓練與營養管理，讓艦娘的身體學會更有效率地轉化食物為能量。這是所有巨型生物兵器的基礎訓練課程"
    tech_gts_bruh_shipgirl_reactor_2_desc: "§M(Bruh系列科技)§!\n透過週期性的斷食訓練，強化艦娘在缺乏補給時的持久作戰能力。她們的身體會學習儲存並緩慢釋放能量"
    tech_gts_bruh_shipgirl_reactor_3_desc: "§M(Bruh系列科技)§!\n極端的飢餓與飽食交替訓練，迫使艦娘的消化系統突破生理極限。她們現在能夠快速分解並吸收各種物質"
    tech_gts_bruh_shipgirl_reactor_4_desc: "§M(Bruh系列科技)§!\n艦娘現在將恆星和行星視為零食，沒有什麼是她不能消化的"
    tech_gts_bruh_shipgirl_reactor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$船體值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$船體值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$船體值：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_hull_mult: "$gts_bruh_shipgirl_ship_sizes_1$船體值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_hull_mult: "$gts_bruh_shipgirl_ship_sizes_1$船體值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_hull_mult: "$gts_bruh_shipgirl_ship_sizes_1$船體值"

    # 躍遷引擎
    tech_gts_bruh_shipgirl_drive_1: "基礎跳躍術"
    tech_gts_bruh_shipgirl_drive_2: "蹬踏爆發術"
    tech_gts_bruh_shipgirl_drive_3: "星海躍進術"
    tech_gts_bruh_shipgirl_drive_4: "瞬息千里術"
    tech_gts_bruh_shipgirl_drive_2_desc: "§M(Bruh系列科技)§!\n訓練艦娘的腿部肌肉與協調性，讓她們能夠在星際空間中進行基礎的長距離跳躍"
    tech_gts_bruh_shipgirl_drive_3_desc: "§M(Bruh系列科技)§!\n強化訓練讓艦娘掌握爆發性的蹬踏技巧，能夠以天體為踏板進行更遠距離的躍進"
    tech_gts_bruh_shipgirl_drive_1_desc: "§M(Bruh系列科技)§!\n精密的動作訓練讓艦娘能夠精準控制落點，並在連續跳躍中保持方向"
    tech_gts_bruh_shipgirl_drive_4_desc: "§M(Bruh系列科技)§!\n最高階的身體訓練讓艦娘的一步跨越變得如同瞬移，光年距離不過彈指之間"
    tech_gts_bruh_shipgirl_drive_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$躍遷引擎冷卻：§G-5%§!\n$gts_bruh_shipgirl_ship_sizes_2$躍遷引擎冷卻：§G-5%§!\n$gts_bruh_shipgirl_ship_sizes_3$躍遷引擎冷卻：§G-5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_jumpdrive_cooldown_mult: "$gts_bruh_shipgirl_ship_sizes_1$躍遷引擎冷卻"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_jumpdrive_cooldown_mult: "$gts_bruh_shipgirl_ship_sizes_1$躍遷引擎冷卻"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_jumpdrive_cooldown_mult: "$gts_bruh_shipgirl_ship_sizes_1$躍遷引擎冷卻"

    # 推進器
    tech_gts_bruh_shipgirl_thruster_1: "裸足"
    tech_gts_bruh_shipgirl_thruster_2: "襪子"
    tech_gts_bruh_shipgirl_thruster_3: "步鞋"
    tech_gts_bruh_shipgirl_thruster_4: "靴子"
    tech_gts_bruh_shipgirl_thruster_1_desc: "§M(Bruh系列科技)§!\n訓練艦娘適應赤足在各種表面行走，強化足底的感知與耐受度"
    tech_gts_bruh_shipgirl_thruster_2_desc: "§M(Bruh系列科技)§!\n教導艦娘穿著輕薄襪物進行戰鬥，在保護足部的同時維持靈活性"
    tech_gts_bruh_shipgirl_thruster_3_desc: "§M(Bruh系列科技)§!\n訓練艦娘習慣輕量化鞋具的重量與限制，提升移動效率"
    tech_gts_bruh_shipgirl_thruster_4_desc: "§M(Bruh系列科技)§!\n讓艦娘適應厚重軍靴的負重，將鞋具轉化為額外的攻擊手段"
    tech_gts_bruh_shipgirl_thruster_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$亞光速航速：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$亞光速航速：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$亞光速航速：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_speed_mult: "$gts_bruh_shipgirl_ship_sizes_1$亞光速航速"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_speed_mult: "$gts_bruh_shipgirl_ship_sizes_1$亞光速航速"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_speed_mult: "$gts_bruh_shipgirl_ship_sizes_1$亞光速航速"

    # 感測器
    tech_gts_bruh_shipgirl_sensor_1: "視力強化術"
    tech_gts_bruh_shipgirl_sensor_2: "聽覺訓練"
    tech_gts_bruh_shipgirl_sensor_3: "嗅覺追蹤"
    tech_gts_bruh_shipgirl_sensor_4: "本能感知"
    tech_gts_bruh_shipgirl_sensor_1_desc: "§M(Bruh系列科技)§!\n透過專門的視力訓練，讓艦娘能夠辨識遙遠星系中的細微異常"
    tech_gts_bruh_shipgirl_sensor_2_desc: "§M(Bruh系列科技)§!\n在絕對寂靜中訓練聽覺，讓艦娘能捕捉星際介質中傳遞的震波"
    tech_gts_bruh_shipgirl_sensor_3_desc: "§M(Bruh系列科技)§!\n訓練艦娘辨識不同文明飛船獨特的氣味特徵"
    tech_gts_bruh_shipgirl_sensor_4_desc: "§M(Bruh系列科技)§!\n玄學，但有效。透過冥想與實戰訓練，強化艦娘對危險的直覺預感能力"
    tech_gts_bruh_shipgirl_sensor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$追蹤：§G+5§!\n$gts_bruh_shipgirl_ship_sizes_2$追蹤：§G+5§!\n$gts_bruh_shipgirl_ship_sizes_3$追蹤：§G+5§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$追蹤"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$追蹤"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$追蹤"

    # 裝甲
    tech_gts_bruh_shipgirl_armor_1: "流體動力學泳衣"
    tech_gts_bruh_shipgirl_armor_2: "青春氣息激勵學"
    tech_gts_bruh_shipgirl_armor_3: "制服心理學"
    tech_gts_bruh_shipgirl_armor_4: "儀式感設計"
    tech_gts_bruh_shipgirl_armor_1_desc: "§M(Bruh系列科技)§!\n經過無數次的風洞與流體實驗，我們發現最適合巨娘在星海中高速穿梭的並非厚重的板甲，而是緊緻貼身的高彈性布料。這種設計能最大程度減少與星際塵埃的摩擦，同時展現出艦娘完美的身體曲線"
    tech_gts_bruh_shipgirl_armor_2_desc: "§M(Bruh系列科技)§!\n經過社會學家的研究，讓艦娘穿著象徵青春活力的服飾，能有效降低敵人的戒心，同時大幅提升我方觀測人員(以及艦娘本人)的士氣"
    tech_gts_bruh_shipgirl_armor_3_desc: "§M(Bruh系列科技)§!\n研究表明，特定的服裝款式不僅能提供防護，還能極大提升艦娘的自信心，並對敵方小人造成巨大的心理壓力。誰能在幾萬公里的女僕裙襬下保持冷靜呢？"
    tech_gts_bruh_shipgirl_armor_4_desc: "§M(Bruh系列科技)§!\n真正的強者只需要站在那裡就能讓敵人膽寒。筆挺的軍官禮服和厚重的披風能最大程度地襯托出艦娘如神明般的威嚴"
    tech_gts_bruh_shipgirl_armor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$裝甲值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$裝甲值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$裝甲值：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$裝甲值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$裝甲值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$裝甲值"

    # 護盾
    tech_gts_bruh_shipgirl_shield_1: "基礎棉紡織工藝"
    tech_gts_bruh_shipgirl_shield_2: "視線誘導迷彩"
    tech_gts_bruh_shipgirl_shield_3: "極限布料張力學"
    tech_gts_bruh_shipgirl_shield_4: "極限防禦理論"
    tech_gts_bruh_shipgirl_shield_1_desc: "§M(Bruh系列科技)§!\n透過特種合成纖維，我們終於能夠編織出足以覆蓋艦娘龐大身軀的基礎布料。這標誌著我們的艦娘終於不用在太空中裸奔了(雖然有些人對此表示遺憾)\n最柔軟、最透氣的純棉材質能最大程度減少艦娘在太空中長時間作戰的摩擦不適感，保護最私密的區域"
    tech_gts_bruh_shipgirl_shield_2_desc: "§M(Bruh系列科技)§!\n透過特定的色彩排列，可以強制吸引觀測者的注意力，造成視覺殘留與精神恍惚。這是一種心理學上的隱形迷彩，敵人會盯著看而忘記開火"
    tech_gts_bruh_shipgirl_shield_3_desc: "§M(Bruh系列科技)§!\n為了實現最大膽的穿著風格，我們必須研發出一種依靠極少接觸面積就能固定在艦娘光滑肌膚上的材料"
    tech_gts_bruh_shipgirl_shield_4_desc: "§M(Bruh系列科技)§!\n防禦的最高境界就是「幾乎沒有防禦」。透過極致的削減覆蓋面積，以此羞恥感轉化為腎上腺素與極致的閃避本能。這需要艦娘擁有極高的自信"
    tech_gts_bruh_shipgirl_shield_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$護盾承受值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$護盾承受值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$護盾承受值：§G+5%§!"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$護盾承受值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$護盾承受值"
    mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$護盾承受值"

    # 輔助配件
    tech_gts_bruh_shipgirl_aux_1: "表皮維護協議"
    tech_gts_bruh_shipgirl_aux_2: "光能捕獲陣列"
    tech_gts_bruh_shipgirl_aux_3: "巨體流體力學"
    tech_gts_bruh_shipgirl_aux_4: "衛生管理條例"
    tech_gts_bruh_shipgirl_aux_5: "資源開採許可"
    tech_gts_bruh_shipgirl_aux_1_desc: "§M(Bruh系列科技)§!\n與其讓小人軍隊在星球上無所事事，不如讓它們搬到艦娘的身上居住。我們訓練了一批專業的工程師與清潔工，在艦娘的毛孔與衣物纖維間建立微型殖民地"
    tech_gts_bruh_shipgirl_aux_2_desc: "§M(Bruh系列科技)§!\n既然艦娘總是喜歡躺在恆星附近「曬日光浴」，我們為什麼不利用這一點呢？通過在她受光面積最大的背部與肩部太陽能板，我們能為她身上的小人設施提供源源不斷的清潔能源，甚至能反向為艦娘的護盾充能"
    tech_gts_bruh_shipgirl_aux_3_desc: "§M(Bruh系列科技)§!\n艦娘在激戰中分泌的汗液對我們來說無異於一場突發的特大洪水。為了防止重要的維護設施被帶有費洛蒙的鹽水沖毀，我們必須在她汗腺密集的區域，特別是足底和腋下，建立複雜的排水與循環系統"
    tech_gts_bruh_shipgirl_aux_4_desc: "§M(Bruh系列科技)§!\n在艦娘最私密、最潮濕的深谷中，沉積著大量的新陳代謝產物。如果不加理會，這些沉積物會影響艦娘的健康與心情。我們需要一支視死如歸的清潔部隊，深入這片高溫高濕的禁區"
    tech_gts_bruh_shipgirl_aux_5_desc: "§M(Bruh系列科技)§!\n在獲得了艦娘本人的羞澀點頭(以及簽署了無數份一旦因過度刺激導致誤傷則後果自負的免責聲明)後，我們終於可以在那粉色的高原邊緣建立自動化站點，採集那些乾涸的乳垢和皮屑礦物"

    ############################################################################################################################################
    ##################################################                  武器                  ##################################################
    ############################################################################################################################################

    # 魚雷
    gts_bruh_shipgirl_torpedo_component_set_1: "艦娘魚雷"
    gts_bruh_shipgirl_torpedo_component_set_1_DESC: "§M(Bruh系列武器)§!\n體積相當於小人戰列艦的巨型魚雷。雖然缺乏精密電子元件，但內部裝填了極不穩定的高能炸藥。它們依靠艦娘的投擲力道或原始推進器飛向目標，一旦命中，其當量足以在敵方主宰上製造出一個可以停泊戰列艦的洞"
    gts_bruh_shipgirl_torpedo_1_S: "小型艦娘魚雷"
    gts_bruh_shipgirl_torpedo_1_M: "中型艦娘魚雷"
    gts_bruh_shipgirl_torpedo_1_L: "大型艦娘魚雷"

    # 動能
    gts_bruh_shipgirl_kinetic_artillery_component_set_1: "艦娘動能副炮"
    gts_bruh_shipgirl_kinetic_artillery_component_set_2: "驅逐艦娘動能主炮"
    gts_bruh_shipgirl_kinetic_artillery_component_set_3: "艦娘動能主炮"
    gts_bruh_shipgirl_kinetic_artillery_component_set_1_DESC: "§M(Bruh系列武器)§!\n裝備在艦娘舾裝兩側或手持的中口徑實彈火炮。雖然被稱為"副炮"，但射出的每一發炮彈都相當於一座摩天大樓。依靠化學能推進的彈頭雖然原始，但憑藉單純的質量與動能，足以將任何膽敢靠近的小人艦船砸成廢鐵。這些副炮能提供穩定而持續的火力輸出"
    gts_bruh_shipgirl_kinetic_artillery_component_set_2_DESC: "這是一門為「貼臉輸出」而生的截短型動能主炮，專為$gts_bruh_shipgirl_ship_sizes_1$訂製。雖然口徑驚人，但為了適應$gts_bruh_shipgirl_ship_sizes_1$的作戰風格，我們鋸短了砲管並移除了部分穩定器。這使得該武器在遠距離散布感人，但在貼臉狗斗的距離上，它能以驚人的射速將砲彈直接塞進敵人的艦橋裡。\n§Y"為了這一發，我可是衝到了能看清小人驚恐表情的距離啊！"§!"
    gts_bruh_shipgirl_kinetic_artillery_component_set_3_DESC: "§M(Bruh系列武器)§!\n這在艦娘軍火庫中不僅僅是一門炮，更是一種威懾。每一次開火產生的後座力都能將周圍的小行星推開，出膛的超重型穿甲彈攜帶的動能足以貫穿星球的地殼。這是純粹物理法則的暴力美學，沒有任何花俏，只有毀滅"
    gts_bruh_shipgirl_kinetic_artillery_1_S: "小型艦娘動能副炮"
    gts_bruh_shipgirl_kinetic_artillery_1_M: "中型艦娘動能副炮"
    gts_bruh_shipgirl_kinetic_artillery_1_L: "大型艦娘動能副炮"
    gts_bruh_shipgirl_kinetic_artillery_2_L: "驅逐艦娘動能主炮"
    gts_bruh_shipgirl_kinetic_artillery_1_X: "巨型艦娘動能主炮"

    # 斬艦刀
    gts_bruh_shipgirl_kinetic_sword_component_set_1: "艦娘斬艦刀"
    gts_bruh_shipgirl_kinetic_sword_component_set_1_DESC: "§M(Bruh系列武器)§!\n一把樸實無華、長度驚人的實體巨劍。沒有任何能量力場，也不需要充能。它唯一的優點就是硬和重。當艦娘揮舞它時，僅僅是劍身帶動的引力波就能扯碎周圍的小型戰機，而被鋒刃直接命中的主力艦，會像切蛋糕一樣被物理截斷"
    gts_bruh_shipgirl_kinetic_sword_1_T: "艦娘斬艦刀"

    # 防空
    gts_bruh_shipgirl_point_defence_component_set_1: "三連裝點防禦"
    gts_bruh_shipgirl_point_defence_component_set_1_DESC: "§M(Bruh系列武器)§!\n安裝在艦娘舾裝的小型自動火炮系統。擁有極高的射速和靈活的轉向能力。雖然對大船傷害有限，但用來在其形成的彈幕網中粉碎敵方的導彈和艦載機綽綽有餘"
    gts_bruh_shipgirl_point_defence_S: "小型三連裝點防禦"
    gts_bruh_shipgirl_point_defence_M: "中型三連裝點防禦"
    gts_bruh_shipgirl_point_defence_L: "大型三連裝點防禦"

    gts_bruh_shipgirl_flak_battery_component_set_1: "三連裝高射炮"
    gts_bruh_shipgirl_flak_battery_component_set_1_DESC: "§M(Bruh系列武器)§!\n專門發射定時引信榴霰彈的火炮。炮彈在預定距離炸裂，釋放出數以萬計的高速鋼珠。對於脆弱的攻擊機群來說，這就是一場無法躲避的金屬暴雨，能瞬間清空一片空域"
    gts_bruh_shipgirl_flak_battery_S: "小型三連裝高射炮"
    gts_bruh_shipgirl_flak_battery_M: "中型三連裝高射炮"
    gts_bruh_shipgirl_flak_battery_L: "大型三連裝高射炮"

    # 艦載機
    gts_bruh_shipgirl_strike_craft_hangar_component_set_1: "海火"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_2: "地獄貓"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_3: "Pe-8"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_1_DESC: "一種輕盈優雅的戰鬥機，從艦娘的具裝中如飛鳥般掠出。雖然掛載能力有限，但它們速度極快，能像煩人的蚊子一樣圍繞敵艦旋轉，誘使敵方防空火力浪費彈藥，或者精準點殺敵方來襲的轟炸機，保護艦娘不被弄髒衣服"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_2_DESC: "皮實耐造的通用型戰機，機身結構堅固到甚至能替艦娘擋下一發流彈。它們既能掛載炸彈對敵艦進行拆遷，也能在空戰中咬碎敵人的機翼"
    gts_bruh_shipgirl_strike_craft_hangar_component_set_3_DESC: ""§Y它飛行緩慢，機動性幾乎為零，就像一隻笨拙的鵝§!。"\n這架轟炸機笨重得就像一塊會飛的磚頭，它幾乎沒有任何空戰能力，唯一的用途就是運送那枚FAB-5000巨型高爆航彈。但只要有一架成功飛抵敵艦，那枚炸彈產生的純粹物理衝擊波就足以震碎周圍脆弱的護盾結構，將任何護衛艦級別的目標直接氣化"
    gts_bruh_shipgirl_strike_craft_hangar_1: "海火"
    gts_bruh_shipgirl_strike_craft_hangar_2: "地獄貓"
    gts_bruh_shipgirl_strike_craft_hangar_3: "Pe-8"

