    gts_bruh_shipgirl_planet_killer_ub: "塞入小穴"
    gts_bruh_shipgirl_planet_killer_ub_component_set_1: "塞入小穴"

    gts_bruh_shipgirl_planet_killer_ub_ACTION: "塞入"
    gts_bruh_shipgirl_planet_killer_ub_DESC: "将目标星球塞入小穴§R(将会摧毁殖民地)§!"
    FLEETORDER_DESTROY_PLANET_WITH_gts_bruh_shipgirl_planet_killer_ub: "正在准备塞入$PLANET|Y$"
    MESSAGE_DESC_FOR_gts_bruh_shipgirl_planet_killer_ub: "§W使上面的一切都消失在了舰娘的小穴之中§!"

    tech_gts_bruh_shipgirl_planet_killer_panties: "原味胖次包覆"
    tech_gts_bruh_shipgirl_planet_killer_panties_desc: "§M(Bruh系列科技)§!\n鹅将军的疯狂计划终于实现了。经过对七种不同星球环境的详细数据分析，我们终于掌握了将舰娘贴身衣物武器化的技术。这些刚从少女胯下褪去、还残留著体温与气味的巨大胖次，能轻易包覆行星，其上的爱液与阴垢也将永久改变星球生态。\n§R"虽然有点羞耻，但看著敌人在我的胖次下挣扎...还挺有成就感的"§!"
    gts_bruh_shipgirl_planet_killer_panties: "套上胖次"
    gts_bruh_shipgirl_planet_killer_panties_component_set_1: "套上胖次"
    gts_bruh_shipgirl_planet_killer_panties_component_set_1_DESC: "§M(Bruh系列武器)§!\n这条刚刚从舰娘身上脱下的、甚至还拉丝著爱液的胖次，其纤维空隙间填满了干燥的皮屑、浓缩的尿酸结晶以及黏稠的爱液。对于星球上的居民来说，世界末日是伴随著令人窒息的少女体味降临的，而幸存者只能在少女私处的浓烈气味中绝望度日。"
    gts_bruh_shipgirl_planet_killer_panties_ACTION: "脱下并包覆"
    gts_bruh_shipgirl_planet_killer_panties_DESC: "命令无畏舰娘当场脱下她穿著已久的胖次，并将其覆盖在目标星球上。星球将被改变为「被胖次覆盖的星球」§R(将会摧毁殖民地)§!"
    FLEETORDER_DESTROY_PLANET_WITH_gts_bruh_shipgirl_planet_killer_panties: "正在准备脱下胖次覆盖$PLANET|Y$"
    MESSAGE_DESC_FOR_gts_bruh_shipgirl_planet_killer_panties: ""

