    ############################################################################################################################################

    # 装甲
    gts_bruh_shipgirl_armor_component_set_1: "经典死库水"
    gts_bruh_shipgirl_armor_component_set_2: "传统水手服"
    gts_bruh_shipgirl_armor_component_set_3: "战斗女仆装"
    gts_bruh_shipgirl_armor_component_set_4: "帝国军礼服"
    gts_bruh_shipgirl_armor_component_set_1_DESC: "§M(Bruh系列装甲)§!\n经典的深蓝色连身泳衣。紧绷的布料完美勾勒出舰娘的身材，不仅大幅提升了转向时的灵活性，那写著名字的白布条更是对敌人的一种羞辱。\n§R"你们是被一名在游泳课上的学生给毁灭的"§!"
    gts_bruh_shipgirl_armor_component_set_2_DESC: "§M(Bruh系列装甲)§!\n标志性的翻领与百褶裙，是青春与活力的象征。飘扬在星风中的领巾代表著大海的召唤。这套服装防御力平平，但绝对能让敌人死得「心动」。"
    gts_bruh_shipgirl_armor_component_set_3_DESC: "§M(Bruh系列装甲)§!\n精致的头饰与层层叠叠的裙摆，带有大量荷叶边与蕾丝装饰的黑白配色女仆装，让这位巨大的侍者在战场上显得优雅而残酷。穿上它，清理敌方舰队就变成了一种家务劳动。"
    gts_bruh_shipgirl_armor_component_set_4_DESC: "§M(Bruh系列装甲)§!\n笔挺的白色军官制服，配有饰绪与金色的钮扣。这套服装牺牲了部分灵活性，换来了极致的防御力与威压感，穿上它的舰娘仅仅是双手抱胸站立在恒星前，就能展现出统御银河的霸气。"
    gts_bruh_shipgirl_armor_component_template_1_S: "小号死库水"
    gts_bruh_shipgirl_armor_component_template_1_M: "中号死库水"
    gts_bruh_shipgirl_armor_component_template_1_L: "大号死库水"
    gts_bruh_shipgirl_armor_component_template_2_S: "小号水手服"
    gts_bruh_shipgirl_armor_component_template_2_M: "中号水手服"
    gts_bruh_shipgirl_armor_component_template_2_L: "大号水手服"
    gts_bruh_shipgirl_armor_component_template_3_S: "小号女仆装"
    gts_bruh_shipgirl_armor_component_template_3_M: "中号女仆装"
    gts_bruh_shipgirl_armor_component_template_3_L: "大号女仆装"
    gts_bruh_shipgirl_armor_component_template_4_S: "小号军礼服"
    gts_bruh_shipgirl_armor_component_template_4_M: "中号军礼服"
    gts_bruh_shipgirl_armor_component_template_4_L: "大号军礼服"

    # 护盾
    gts_bruh_shipgirl_shield_component_set_1: "纯白棉质胖次"
    gts_bruh_shipgirl_shield_component_set_2: "蓝白条纹胖次"
    gts_bruh_shipgirl_shield_component_set_3: "黑色蕾丝内裤"
    gts_bruh_shipgirl_shield_component_set_4: "极薄的OK绷"
    gts_bruh_shipgirl_shield_component_set_1_DESC: "§M(Bruh系列护盾)§!\n柔软的棉质紧贴肌肤，虽然没有花俏的装饰，简约、朴素，却有著令人安心的厚度。这份朴实的厚度能有效缓冲来自下方的常规冲击。"
    gts_bruh_shipgirl_shield_component_set_2_DESC: "§M(Bruh系列护盾)§!\n传说中的「胖次」。蓝白相间的条纹在宇宙中旋转时会产生一种奇妙的催眠效果。敌人的雷达与火控员往往会不由自主地锁定这个区域，从而忽略了舰娘其他的致命攻击。"
    gts_bruh_shipgirl_shield_component_set_3_DESC: "§M(Bruh系列护盾)§!\n成熟舰娘的大胆选择。大面积的镂空与精致的蕾丝花边构成了一种危险的诱惑。它几乎不提供物理上的遮蔽，而是透过激发观测者的遐想来构建一道心理防线，宣示著穿著者对自身魅力的绝对自信。"
    gts_bruh_shipgirl_shield_component_set_4_DESC: "§M(Bruh系列护盾)§!\n防御的极致就是没有防御...或者看起来没有。这真的能算内裤吗？仅仅是一条细得几乎看不见的胶带，勉强遮盖住了最关键的一点。穿戴它的舰娘显然放弃了羞耻心，转而追求极致的轻量化与灵活度。\n§Y"防御力？那是什么？只要不被击中就好了！"§!"
    gts_bruh_shipgirl_shield_component_template_1_S: "小号棉质胖次"
    gts_bruh_shipgirl_shield_component_template_1_M: "中号棉质胖次"
    gts_bruh_shipgirl_shield_component_template_1_L: "大号棉质胖次"
    gts_bruh_shipgirl_shield_component_template_2_S: "小号条纹胖次"
    gts_bruh_shipgirl_shield_component_template_2_M: "中号条纹胖次"
    gts_bruh_shipgirl_shield_component_template_2_L: "大号条纹胖次"
    gts_bruh_shipgirl_shield_component_template_3_S: "小号黑色蕾丝"
    gts_bruh_shipgirl_shield_component_template_3_M: "中号黑色蕾丝"
    gts_bruh_shipgirl_shield_component_template_3_L: "大号黑色蕾丝"
    gts_bruh_shipgirl_shield_component_template_4_S: "小号OK绷"
    gts_bruh_shipgirl_shield_component_template_4_M: "中号OK绷"
    gts_bruh_shipgirl_shield_component_template_4_L: "大号OK绷"

