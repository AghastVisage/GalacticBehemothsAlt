    # 驅逐艦娘
    gts_bruh_shipgirl_ship_sizes_1: "Bruh驅逐艦娘"
    gts_bruh_shipgirl_ship_sizes_1_plural: "$gts_bruh_shipgirl_ship_sizes_1$"
    gts_bruh_shipgirl_ship_sizes_1_cap: "$gts_bruh_shipgirl_ship_sizes_1$"
    gts_bruh_shipgirl_ship_sizes_1_short: "驅逐艦娘"
    SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_1_DESC: "§M(Bruh系列艦娘)§!\n這些嬌小的巨人(相對而言)是艦隊的前鋒。雖然被稱為"驅逐"，但她們的體型依然足以讓任何常規戰艦相形見絀。她們不依賴厚重的裝甲，而是憑藉驚人的爆發力和靈活的步伐在星海中穿梭。她們擅長快速貼近敵方艦隊，用綁在大腿上的發射管傾瀉魚雷，或者直接用手中的速射火炮將敵艦的艦橋轟成蜂窩"
    
