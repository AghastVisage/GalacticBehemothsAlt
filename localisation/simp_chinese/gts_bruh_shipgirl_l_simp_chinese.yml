    ############################################################################################################################################

    # 驱逐舰娘
    gts_bruh_shipgirl_ship_sizes_1: "Bruh驱逐舰娘"
    gts_bruh_shipgirl_ship_sizes_1_plural: "$gts_bruh_shipgirl_ship_sizes_1$"
    gts_bruh_shipgirl_ship_sizes_1_cap: "$gts_bruh_shipgirl_ship_sizes_1$"
    SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_1_DESC: "§M(Bruh系列舰娘)§!\n这些娇小的巨人(相对而言)是舰队的前锋。虽然被称为"驱逐"，但她们的体型依然足以让任何常规战舰相形见绌。她们不依赖厚重的装甲，而是凭借惊人的爆发力和灵活的步伐在星海中穿梭。她们擅长快速贴近敌方舰队，用绑在大腿上的发射管倾泻鱼雷，或者直接用手中的速射火炮将敌舰的舰桥轰成蜂窝"
    
    GTS_AKATSUKI_DESTROYER_BOW: "晓"
    GTS_HIBIKI_DESTROYER_BOW: "响"
    GTS_AKATSUKI_DESTROYER_STERN: "晓防空组件"
    GTS_HIBIKI_DESTROYER_STERN: "响防空组件"

    # 战列舰娘
    gts_bruh_shipgirl_ship_sizes_2: "Bruh战列舰娘"
    gts_bruh_shipgirl_ship_sizes_2_plural: "$gts_bruh_shipgirl_ship_sizes_2$"
    gts_bruh_shipgirl_ship_sizes_2_cap: "$gts_bruh_shipgirl_ship_sizes_2$"
    SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_2_DESC: "§M(Bruh系列舰娘)§!\n舰队的中坚力量，兼具毁灭性的火力与厚实的防御。这些巨娘通常装备著能轻易洞穿地壳的超大口径主炮，或者是作为移动的航空基地，释放无数如同蜂群般的舰载机。她们不需要频繁移动，只需优雅地站在战场后方，调整巨大的舾装，对著远处的坐标进行覆盖式打击"
    
    GTS_BELFAST_BATTLESHIP_MID: "贝尔法斯特"
    GTS_YAMASHIRO_BATTLESHIP_MID: "山城"
    
    GTS_BELFAST_BATTLESHIP_BOW: "贝尔法斯特炮击组件"
    GTS_BELFAST_BATTLESHIP_STERN: "贝尔法斯特防空组件"
    
    GTS_YAMASHIRO_BATTLESHIP_BOW: "山城航母组件"
    GTS_YAMASHIRO_BATTLESHIP_STERN: "山城防空组件"

    # 无畏舰娘
    gts_bruh_shipgirl_ship_sizes_3: "Bruh无畏舰娘"
    gts_bruh_shipgirl_ship_sizes_3_plural: "$gts_bruh_shipgirl_ship_sizes_3$"
    gts_bruh_shipgirl_ship_sizes_3_cap: "$gts_bruh_shipgirl_ship_sizes_3$"
    SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_3_DESC: "§M(Bruh系列舰娘)§!\n真正的星海霸主，体型之大以至于恒星在她们身旁都显得黯淡，普通的恒星在她面前都如同暖手宝一般。她们是唯一拥有足够蛮力挥舞那把数万公里长"斩舰刀"的存在。她们的存在本身就是一种天灾，不仅能用物理手段切开敌人的主力舰队，更拥有处理行星的恐怖能力。当无畏舰娘出现在雷达上时，撤退往往已经太迟了"
    
    GTS_BISMARCK_TITAN_MID: "俾斯麦"
    GTS_HOOD_TITAN_MID: "胡德"
