    ############################################################################################################################################

    gts_bruh_shipgirl_ftl_components: "艦娘超光速部件"
    gts_bruh_shipgirl_ftl_components_DESC: "艦娘超光速部件"
    gts_bruh_shipgirl_sensor_components: "艦娘感測器"
    gts_bruh_shipgirl_sensor_components_DESC: "艦娘感測器"

    # 反應爐
    gts_bruh_shipgirl_reactor_component_template_1: "基礎代謝"
    gts_bruh_shipgirl_reactor_component_template_2: "飢餓適應"
    gts_bruh_shipgirl_reactor_component_template_3: "暴食消化"
    gts_bruh_shipgirl_reactor_component_template_4: "星體吞噬"
    gts_bruh_shipgirl_reactor_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n透過基礎的飲食訓練，艦娘能夠有效維持龐大身軀的日常活動所需"
    gts_bruh_shipgirl_reactor_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n飢餓訓練讓艦娘學會在長時間缺乏補給的情況下仍能保持戰鬥力"
    gts_bruh_shipgirl_reactor_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n極限訓練後的艦娘消化系統能夠快速分解各種物質並轉化為能量"
    gts_bruh_shipgirl_reactor_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n經過最終訓練的艦娘能將天體直接作為食物消化吸收"

    # 躍遷引擎
    gts_bruh_shipgirl_drive_component_template_1: "基礎跳躍"
    gts_bruh_shipgirl_drive_component_template_2: "蹬踏爆發"
    gts_bruh_shipgirl_drive_component_template_3: "星海躍進"
    gts_bruh_shipgirl_drive_component_template_4: "瞬息千里"
    gts_bruh_shipgirl_drive_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n艦娘透過基礎訓練掌握的跳躍能力，能夠進行星系間的移動"
    gts_bruh_shipgirl_drive_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n強化後的腿部爆發力讓艦娘能以天體為踏板進行更遠的跳躍"
    gts_bruh_shipgirl_drive_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n精密訓練後的艦娘能夠精確控制跳躍方向與落點"
    gts_bruh_shipgirl_drive_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n最高階訓練讓艦娘的移動速度達到近乎瞬移的境界"

    # 推進器
    gts_bruh_shipgirl_thruster_component_template_1: "嬌嫩裸足"
    gts_bruh_shipgirl_thruster_component_template_2: "防滑棉襪"
    gts_bruh_shipgirl_thruster_component_template_3: "運動跑鞋"
    gts_bruh_shipgirl_thruster_component_template_4: "厚重軍靴"
    gts_bruh_shipgirl_thruster_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n艦娘赤裸的雙足能夠直接感知星體表面，靈活但缺乏防護"
    gts_bruh_shipgirl_thruster_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n薄襪提供基本防護同時保持足部靈敏度"
    gts_bruh_shipgirl_thruster_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n輕便鞋具讓艦娘能夠全力奔跑而不受傷"
    gts_bruh_shipgirl_thruster_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n厚重軍靴讓艦娘的每一步都帶有毀滅性的衝擊"

    # 感測器
    gts_bruh_shipgirl_sensor_component_template_1: "視力強化"
    gts_bruh_shipgirl_sensor_component_template_2: "聽覺訓練"
    gts_bruh_shipgirl_sensor_component_template_3: "嗅覺追蹤"
    gts_bruh_shipgirl_sensor_component_template_4: "本能感知"
    gts_bruh_shipgirl_sensor_component_template_1_DESC: "§M(Bruh系列核心元件)§!\n強化後的視力讓艦娘能夠看清光年外的目標"
    gts_bruh_shipgirl_sensor_component_template_2_DESC: "§M(Bruh系列核心元件)§!\n艦娘豎起耳朵(或者轉動獸耳)，捕捉太空中不自然的波動。"
    gts_bruh_shipgirl_sensor_component_template_3_DESC: "§M(Bruh系列核心元件)§!\n敏銳的嗅覺能追蹤敵艦殘留的氣味軌跡"
    gts_bruh_shipgirl_sensor_component_template_4_DESC: "§M(Bruh系列核心元件)§!\n"我覺得那邊有人"艦娘指著一片空曠的黑暗說道。事實證明，她總是對的。本能般的感知讓艦娘能預判敵人的位置"

    # 輔助配件
    gts_bruh_shipgirl_aux_component_set_1: "體表損管小隊"
    gts_bruh_shipgirl_aux_component_set_2: "真的太陽能板"
    gts_bruh_shipgirl_aux_component_set_3: "足汗循環系統"
    gts_bruh_shipgirl_aux_component_set_4: "陰垢清理部門"
    gts_bruh_shipgirl_aux_component_set_5: "乳暈採集平台"
    gts_bruh_shipgirl_aux_component_set_1_DESC: "§M(Bruh系列輔助配件)§!\n一支居住在艦娘身上的微型工程艦隊。它們平日負責清理艦娘身上的戰鬥殘骸、縫補破損的衣物。一旦艦娘受傷，它們就會駕駛著相對於艦娘來說如蟎蟲般大小的維修車，在她廣闊的皮膚大地上飛馳，進行快速焊接和醫療噴塗作業。\n§R"主要風險是被艦娘無意識地拍死"§!"
    gts_bruh_shipgirl_aux_component_set_2_DESC: "§M(Bruh系列輔助配件)§!\n這不是比喻。這是一塊物理意義上、面積相當於一片大陸的巨大太陽能板。\n§Y"不是那種小人屋頂上的那種玩具......"§!"
    gts_bruh_shipgirl_aux_component_set_3_DESC: "§M(Bruh系列輔助配件)§!\n專為長時間穿著鞋襪的艦娘設計，建立在艦娘足弓與趾縫間的複雜水利工程會攔截那毀滅性的汗液洪流。經過過濾的足汗被注入冷卻管道，帶走武器過熱的溫度，或者被儲存起來作為生活用水。當然，工作環境的氣味是一大挑戰。\n§Y"這能讓艦娘在激烈的運動戰中保持足部......相對的乾爽"§!"
    gts_bruh_shipgirl_aux_component_set_4_DESC: "§M(Bruh系列輔助配件)§!\n一些建立在兩片宏偉肉唇之間的附著式建築群。這裡的居民終日生活在濕潤、溫暖且氣味獨特的環境中。專職負責清理這條巨大峽谷中的所有沉積物。這裡也是著名的旅遊勝地，儘管常因艦娘的生理反應而發生洪水。\n§Y"清潔工們每日駕駛機甲進入少女私處深處，挖掘並清理那些積累已久的白色垢狀物，只是有時一些人也不幸成為了其中一部分"§!"
    gts_bruh_shipgirl_aux_component_set_5_DESC: "§M(Bruh系列輔助配件)§!\n錨定在乳暈褶皺上的採集站。這裡的鑽頭經過特殊軟化處理，以免刺激到艦娘。工人們日以繼夜地刮取沉積的乳垢和收集微量滲出的乳汁。\n§R"要是艦娘感到搔癢而進行抓撓，整個平台都會面臨滅頂之災"§!"
    gts_bruh_shipgirl_aux_component_template_1: "體表損管小隊"
    gts_bruh_shipgirl_aux_component_template_2: "真的太陽能板"
    gts_bruh_shipgirl_aux_component_template_3: "足汗循環系統"
    gts_bruh_shipgirl_aux_component_template_4: "陰垢清理都市"
    gts_bruh_shipgirl_aux_component_template_5: "乳暈採集平台"

    # 作戰電腦
    gts_bruh_shipgirl_combat_computer_1: "重櫻海軍教育"
    gts_bruh_shipgirl_combat_computer_1_DESC: "§M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習戰鬥精神。在戰鬥中，她們一旦發現敵人就會拔出斬艦刀，高呼著第四天災板載，向敵方發起突擊"
    gts_bruh_shipgirl_combat_computer_2: "鐵血海軍教育"
    gts_bruh_shipgirl_combat_computer_2_DESC: "§M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習實戰戰術。在戰鬥中，她們會如幽靈般摸到敵人近處再如群狼般進行襲擊以干擾敵艦指揮，阻滯敵軍前進"
    gts_bruh_shipgirl_combat_computer_3: "皇家海軍教育"
    gts_bruh_shipgirl_combat_computer_3_DESC: "§M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習戰鬥藝術。在戰鬥中，充分的教養會使得她們與敵方艦隊在適中的距離下冷靜地進行堂堂正正的戰鬥"
    gts_bruh_shipgirl_combat_computer_4: "北聯海軍教育"
    gts_bruh_shipgirl_combat_computer_4_DESC: "§M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習武器操作。在戰鬥中，深知大就是好、多就是美的艦娘們會在安全距離向敵人大量傾瀉彈藥"
    gts_bruh_shipgirl_combat_computer_5: "白鷹海軍教育"
    gts_bruh_shipgirl_combat_computer_5_DESC: "§M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習理論革新，在戰鬥中，她們會在超遠距將實驗得出的版本之子直接呼到敵人臉上"

    gts_bruh_shipgirl_arua_1: "貪婪之口"
    gts_bruh_shipgirl_arua_1_DESC: "§M(Bruh系列光環部件)§!\n艦娘那張足以吞噬衛星的櫻桃巨口，此刻對於敵方艦隊而言就是通往地獄的大門。當她微微張開雙唇，那如山脈般潔白整齊的牙齒便展露無遺，嘴角拉絲的黏稠唾液如同幾萬公里長的軌道電梯纜繩般在太空中飄蕩。隨著她那濕熱且帶有濃郁甜腥味的口氣呼出，含有高濃度消化酶的水霧瞬間覆蓋了敵艦的感測器。這種即將被作為食物咀嚼、吞嚥並在胃酸中悲慘消化的原始生物恐懼，直接擊穿了敵方船員的心理防線。在這種被捕食者盯上的極度恐慌中，敵軍炮手顫抖不已，導致火控系統的命中率大幅下降，因為沒有人能在即將滑入食道的絕望中保持冷靜瞄準"
    gts_bruh_shipgirl_arua_2: "淫靡之穴"
    gts_bruh_shipgirl_arua_2_DESC: "§M(Bruh系列光環部件)§!\n艦娘刻意將她濕潤的陰唇對準敵方艦隊方向，那道粉嫩的縫隙散發著強烈的雌性氣息和溫熱的水氣。敵艦的船員會不由自主地將視線鎖定在那個禁忌的部位。這種視覺衝擊完全破壞了敵方的戰術紀律，許多艦船的艦長會發現自己無法下達撤退命令，因為他們的理智已被那個濕潤的深谷所吸引。更有甚者，部分敵艦會不受控制地向艦娘靠近，彷彿被一種原始的渴望驅使著飛蛾撲火。這種異常行為讓敵方艦隊的撤退效率極度低下，許多本該逃脫的戰艦因為猶豫或偏航而暴露在火力範圍內，最終被我方艦隊或艦娘本人輕易殲滅"
    gts_bruh_shipgirl_arua_3: "吸引之乳"
    gts_bruh_shipgirl_arua_3_DESC: "§M(Bruh系列光環部件)§!\n這對懸浮在星海之中的巨大乳房，以其驚人的質量成為了戰場上最無法忽視的存在。隨著艦娘在戰鬥中的每一個動作，這兩團柔軟的半球體都會產生劇烈的乳搖。那白皙細膩的肌膚在星光的反射下熠熠生輝，而頂端那如同粉色平原般巨大的乳暈和挺立的乳首更是吸引了敵方所有的注意力。敵方炮手在瞄準時，視線會不由自主地被這充滿彈性的雙乳所捕獲，大腦中充滿了對其手感與溫度的性幻想，從而忘記了裝填彈藥或扣動扳機。這種源自生物本能的強烈分心效應，使得敵方艦隊的整體射擊頻率出現斷崖式下跌，無人能將目光從這宏偉的景觀上移開"
    gts_bruh_shipgirl_arua_4: "刺激之語"
    gts_bruh_shipgirl_arua_4_DESC: "§M(Bruh系列光環部件)§!\n當艦娘用她那足以震動整個星系的嗓音發出戰鬥號令時，我方艦隊的每一個成員都能清晰地聽到那充滿力量的聲音在通訊頻道中迴響。她的話語簡潔而有力，直接命中每個戰士心中對勝利的渴望和對榮譽的追求。更重要的是，艦娘的聲音能夠消除戰鬥中的疲勞和恐懼，讓每個船員都保持在最佳的精神狀態下操作武器系統，從而實現持續的高效火力輸出"
    gts_bruh_shipgirl_arua_5: "引導之目"
    gts_bruh_shipgirl_arua_5_DESC: "§M(Bruh系列光環部件)§!\n艦娘那雙能夠清晰看穿星雲的巨大眼睛成為了我方艦載機最可靠的指揮中樞。她的視線能夠覆蓋整個戰場，精確捕捉每一架敵機的動向和每一艘敵艦的弱點。當她的目光掃過我方的機群時，飛行員們會立即接收到最優的攻擊路線和目標優先度指令。這種視覺指揮讓我方艦載機的戰術配合達到了近乎完美的程度。飛行員們在艦娘注視下會感到一種強烈的使命感和自信心，他們的反應速度和判斷能力都會得到顯著提升，即使面對數倍於己的敵機也能保持冷靜並執行高難度的機動動作，最終取得壓倒性的空戰優勢"
    gts_bruh_shipgirl_arua_6: "穢臭之菊"
    gts_bruh_shipgirl_arua_6_DESC: "§M(Bruh系列光環部件)§!\n當艦娘將她緊閉的肛門對準敵方機群方向時，即使沒有實際排泄物釋放，那個褐色的褶皺洞口本身就散發著一種令人作嘔的視覺壓迫感。敵方艦載機的飛行員會因為看到那個巨大的排泄口而產生強烈的噁心反應，許多人會在駕駛艙內乾嘔甚至直接嘔吐，導致操控精度大幅下降。更糟糕的是，這種心理陰影會持續存在，許多飛行員在目睹艦娘的肛門後會產生創傷後應激反應，在之後的戰鬥中只要看到類似的圓形結構就會不由自主地回想起那個恐怖的畫面，從而導致敵方艦載機部隊的整體戰鬥力持續衰減"

