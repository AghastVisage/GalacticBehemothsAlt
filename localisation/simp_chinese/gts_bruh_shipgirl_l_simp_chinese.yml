    # 裝甲
    gts_bruh_shipgirl_armor_component_set_1: "經典死庫水"
    gts_bruh_shipgirl_armor_component_set_2: "傳統水手服"
    gts_bruh_shipgirl_armor_component_set_3: "戰鬥女僕裝"
    gts_bruh_shipgirl_armor_component_set_4: "帝國軍禮服"
    gts_bruh_shipgirl_armor_component_set_1_DESC: "§M(Bruh系列裝甲)§!\n經典的深藍色連身泳衣。緊繃的布料完美勾勒出艦娘的身材，不僅大幅提升了轉向時的靈活性，那寫著名字的白布條更是對敵人的一種羞辱。\n§R"你們是被一名在游泳課上的學生給毀滅的"§!"
    gts_bruh_shipgirl_armor_component_set_2_DESC: "§M(Bruh系列裝甲)§!\n標誌性的翻領與百褶裙，是青春與活力的象徵。飄揚在星風中的領巾代表著大海的召喚。這套服裝防禦力平平，但絕對能讓敵人死得「心動」。"
    gts_bruh_shipgirl_armor_component_set_3_DESC: "§M(Bruh系列裝甲)§!\n精緻的頭飾與層層疊疊的裙襬，帶有大量荷葉邊與蕾絲裝飾的黑白配色女僕裝，讓這位巨大的侍者在戰場上顯得優雅而殘酷。穿上它，清理敵方艦隊就變成了一種家務勞動。"
    gts_bruh_shipgirl_armor_component_set_4_DESC: "§M(Bruh系列裝甲)§!\n筆挺的白色軍官制服，配有飾緒與金色的鈕扣。這套服裝犧牲了部分靈活性，換來了極致的防禦力與威壓感，穿上它的艦娘僅僅是雙手抱胸站立在恆星前，就能展現出統御銀河的霸氣。"
    gts_bruh_shipgirl_armor_component_template_1_S: "小號死庫水"
    gts_bruh_shipgirl_armor_component_template_1_M: "中號死庫水"
    gts_bruh_shipgirl_armor_component_template_1_L: "大號死庫水"
    gts_bruh_shipgirl_armor_component_template_2_S: "小號水手服"
    gts_bruh_shipgirl_armor_component_template_2_M: "中號水手服"
    gts_bruh_shipgirl_armor_component_template_2_L: "大號水手服"
    gts_bruh_shipgirl_armor_component_template_3_S: "小號女僕裝"
    gts_bruh_shipgirl_armor_component_template_3_M: "中號女僕裝"
    gts_bruh_shipgirl_armor_component_template_3_L: "大號女僕裝"
    gts_bruh_shipgirl_armor_component_template_4_S: "小號軍禮服"
    gts_bruh_shipgirl_armor_component_template_4_M: "中號軍禮服"
    gts_bruh_shipgirl_armor_component_template_4_L: "大號軍禮服"

    # 護盾
    gts_bruh_shipgirl_shield_component_set_1: "純白棉質胖次"
    gts_bruh_shipgirl_shield_component_set_2: "藍白條紋胖次"
    gts_bruh_shipgirl_shield_component_set_3: "黑色蕾絲內褲"
    gts_bruh_shipgirl_shield_component_set_4: "極薄的OK繃"
    gts_bruh_shipgirl_shield_component_set_1_DESC: "§M(Bruh系列護盾)§!\n柔軟的棉質緊貼肌膚，雖然沒有花俏的裝飾，簡約、樸素，卻有著令人安心的厚度。這份樸實的厚度能有效緩衝來自下方的常規衝擊。"
    gts_bruh_shipgirl_shield_component_set_2_DESC: "§M(Bruh系列護盾)§!\n傳說中的「胖次」。藍白相間的條紋在宇宙中旋轉時會產生一種奇妙的催眠效果。敵人的雷達與火控員往往會不由自主地鎖定這個區域，從而忽略了艦娘其他的致命攻擊。"
    gts_bruh_shipgirl_shield_component_set_3_DESC: "§M(Bruh系列護盾)§!\n成熟艦娘的大膽選擇。大面積的鏤空與精緻的蕾絲花邊構成了一種危險的誘惑。它幾乎不提供物理上的遮蔽，而是透過激發觀測者的遐想來構建一道心理防線，宣示著穿著者對自身魅力的絕對自信。"
    gts_bruh_shipgirl_shield_component_set_4_DESC: "§M(Bruh系列護盾)§!\n防禦的極致就是沒有防禦...或者看起來沒有。這真的能算內褲嗎？僅僅是一條細得幾乎看不見的膠帶，勉強遮蓋住了最關鍵的一點。穿戴它的艦娘顯然放棄了羞恥心，轉而追求極致的輕量化與靈活度。\n§Y"防禦力？那是什麼？只要不被擊中就好了！"§!"
    gts_bruh_shipgirl_shield_component_template_1_S: "小號棉質胖次"
    gts_bruh_shipgirl_shield_component_template_1_M: "中號棉質胖次"
    gts_bruh_shipgirl_shield_component_template_1_L: "大號棉質胖次"
    gts_bruh_shipgirl_shield_component_template_2_S: "小號條紋胖次"
    gts_bruh_shipgirl_shield_component_template_2_M: "中號條紋胖次"
    gts_bruh_shipgirl_shield_component_template_2_L: "大號條紋胖次"
    gts_bruh_shipgirl_shield_component_template_3_S: "小號黑色蕾絲"
    gts_bruh_shipgirl_shield_component_template_3_M: "中號黑色蕾絲"
    gts_bruh_shipgirl_shield_component_template_3_L: "大號黑色蕾絲"
    gts_bruh_shipgirl_shield_component_template_4_S: "小號OK繃"
    gts_bruh_shipgirl_shield_component_template_4_M: "中號OK繃"
    gts_bruh_shipgirl_shield_component_template_4_L: "大號OK繃"

    ############################################################################################################################################
    ##################################################                殲星相關                ##################################################
    ############################################################################################################################################

    gts_bruh_shipgirl_planet_killer_ub: "塞入小穴"
    gts_bruh_shipgirl_planet_killer_ub_component_set_1: "塞入小穴"

    gts_bruh_shipgirl_planet_killer_ub_ACTION: "塞入"
    gts_bruh_shipgirl_planet_killer_ub_DESC: "將目標星球塞入小穴§R(將會摧毀殖民地)§!"
    FLEETORDER_DESTROY_PLANET_WITH_gts_bruh_shipgirl_planet_killer_ub: "正在準備塞入$PLANET|Y$"
    MESSAGE_DESC_FOR_gts_bruh_shipgirl_planet_killer_ub: "§W使上面的一切都消失在了艦娘的小穴之中§!"

    tech_gts_bruh_shipgirl_planet_killer_panties: "原味胖次包覆"
    tech_gts_bruh_shipgirl_planet_killer_panties_desc: "§M(Bruh系列科技)§!\n鵝將軍的瘋狂計劃終於實現了。經過對七種不同星球環境的詳細數據分析，我們終於掌握了將艦娘貼身衣物武器化的技術。這些剛從少女胯下褪去、還殘留著體溫與氣味的巨大胖次，能輕易包覆行星，其上的愛液與陰垢也將永久改變星球生態。\n§R"雖然有點羞恥，但看著敵人在我的胖次下掙扎...還挺有成就感的"§!"
    gts_bruh_shipgirl_planet_killer_panties: "套上胖次"
    gts_bruh_shipgirl_planet_killer_panties_component_set_1: "套上胖次"
    gts_bruh_shipgirl_planet_killer_panties_component_set_1_DESC: "§M(Bruh系列武器)§!\n這條剛剛從艦娘身上脫下的、甚至還拉絲著愛液的胖次，其纖維空隙間填滿了乾燥的皮屑、濃縮的尿酸結晶以及黏稠的愛液。對於星球上的居民來說，世界末日是伴隨著令人窒息的少女體味降臨的，而倖存者只能在少女私處的濃烈氣味中絕望度日。"
    gts_bruh_shipgirl_planet_killer_panties_ACTION: "脫下並包覆"
    gts_bruh_shipgirl_planet_killer_panties_DESC: "命令無畏艦娘當場脫下她穿著已久的胖次，並將其覆蓋在目標星球上。星球將被改變為「被胖次覆蓋的星球」§R(將會摧毀殖民地)§!"
