 gts_event_storyline.1.name:"起始"
 gts_event_storyline.1.desc:"我们的帝国已迈入星辰大海，但仍有许多事物无法解析。一个奇异的通讯器在昨晚以离奇的方式出现在了统治者的身旁，科研部门经过了通宵的研究之后无功而返，他们的任何仪器和设备都无法有效作用于这个奇怪的通讯器之上，仿佛是完全不属于这个世界的造物。对于这个奇怪设备的处置权最终交还到了统治者的手上。"
 # gts_event_storyline.1.desc:"“啪！”\n一声脆响，伴随着头顶传来的钝痛，硬物坠地的声音打断了你的思绪。你循声望去，只见一块银白色的平板静静躺在地面上，金属外壳在昏暗中泛着冷光。\n"
 gts_event_storyline.1.option.1:"翻看平板"
 gts_event_storyline.1.option.2:"先放置几日吧"
 gts_event_storyline.1.option.3:"跳过开局事件"
 gts_event_storyline.1.option.4:"关闭主线事件"
 gts_event_storyline.1.option.4.tooltips:"选择该选项后，主线事件§R无法再次开启§!，请注意"

 gts_event_storyline.2.name:"起始"
 gts_event_storyline.2.desc:"你看着桌子上摆放着的明显不是帝国科技所制造的仪器，不禁皱起眉头，就是这个略有厚实的平板在昨晚凭空出现在头部的上方，并狠狠痛击了你的脑袋。这个来历不明的设备充满了各种疑点，但某种直觉却告诉你，这背后或许隐藏着意想不到的机遇。\n\n你拿起平板，入手是种特殊的磨砂金属质感，冰凉触感透过指尖传来。屏幕和外壳的材质都前所未见，你仔细翻看设备细节，发现某些模块设计竟与帝国的全息通讯器有几分相似之处，也许两者有着类似的功能？\n\n思索间，手指摸索到了一个明显的突起按钮。"
 gts_event_storyline.2.option.1:"按下"

 gts_event_storyline.3.name:"起始"
 gts_event_storyline.3.desc:"“咔嗒”\n\n你不知道设计者为什么要把开机键设计成古早的机械按压式结构，但这种声音确实格外的令人解压。\n\nLOADING……§r█ 10%§!\nLOADING……§r███ 30%§!\n......\nLOADING……§r██████████ 100%§!\n\n屏幕亮起荧光的瞬间，一个奇异的LOGO一闪而过，刹那间，你忽然有种感受，自己现实的躯体、虚境的灵能本质，甚至是在命运长河中那缕不可捉摸的丝线，都与某个不可名状的庞然大物产生了微妙的联系。某种恍然涌上心头——此后，将有万千巨大生灵命运轨迹，与你和你的帝国产生交织。"
 gts_event_storyline.3.option.1:"刚才.....那是巨娘吗？"

 gts_event_storyline.4.name:"通讯"
 gts_event_storyline.4.desc.1:"那阵令人心悸的感受尚未完全平复，已启动的设备屏幕就开始自顾自的跳动，冰冷的金属外壳开始略微发热，通讯界面自行跳出，接通了一个来源未知的通讯。\n\n你眼睁睁看着仪器前端的淡蓝色辉光开始蔓延，于空地上勾勒出了一道逐渐清晰的轮廓。\n\n人影尚未完全凝聚，欢快的声音却先抵达了你的耳畔。\n\n“§r哎嘿~协议签订成功，你已经是【缩小人】啦~”§!"
 gts_event_storyline.4.desc.2:"那阵令人心悸的感受尚未完全平复，已启动的设备屏幕就开始自顾自的跳动，冰冷的金属外壳开始略微发热，通讯界面自行跳出，接通了一个来源未知的通讯。\n\n你眼睁睁看着仪器前端的淡蓝色辉光开始蔓延，于空地上勾勒出了一道逐渐清晰的轮廓。\n\n人影尚未完全凝聚，欢快的声音却先抵达了你的耳畔。\n\n“§r哎嘿~协议签订成功，你已经是【魔法少女】啦~§!”"
 gts_event_storyline.4.desc.3:"那阵令人心悸的感受尚未完全平复，已启动的设备屏幕就开始自顾自的跳动，冰冷的金属外壳开始略微发热，通讯界面自行跳出，接通了一个来源未知的通讯。\n\n你眼睁睁看着仪器前端的淡蓝色辉光开始蔓延，于空地上勾勒出了一道逐渐清晰的轮廓。\n\n人影尚未完全凝聚，欢快的声音却先抵达了你的耳畔。\n\n“§r哎嘿~协议签订成功，你已经是【龙娘】啦~§!”"
 gts_event_storyline.4.option.1:"？？？"

 gts_event_storyline.5.name:"通讯"
 gts_event_storyline.5.desc:"“§r嘿嘿，但其实只是开玩笑的呢~§!”\n\n紫发少女的全息投影在蓝光中彻底成形，你看清了她的面庞，少女非人的竖瞳中带着促狭的笑意，极美的脸蛋上挂着的却是有些惋惜的神情。\n\n“§r真可惜呢，小小的统治者~§!”"
 gts_event_storyline.5.option.1:"你是谁？"


 gts_event_storyline.6.name:"通讯"
 gts_event_storyline.6.desc:"“§r叫我千海就好~请不要在后面加上什么奇怪的称呼哦。§!”少女笑盈盈地回复着你的问题。"
 gts_event_storyline.6.option.1:"开机的时候究竟发生了什么？"
 gts_event_storyline.6.option.1.response:"§r嗯——简单来说，就是我将你与许多巨大少女的命运连接在了一起§!"\n\n面前的少女顿了一顿似乎在斟酌词句：“§r就像月老牵扯姻缘红线，丘比特射出爱情之箭，命运当然也是可以被修改的。当然，即便是联系也带着力量，为了防止你被她们无意识的一瞥直接碾成小人酱，我还帮你做了些许小小的缓冲~§!”\n\n千海微微前倾身体，在你的面前比了个指尖宇宙的手势。"
 gts_event_storyline.6.option.2:"那么，代价是什么呢？"
 gts_event_storyline.6.option.2.response:"“§r代价？嗯，大概是没有代价吧。§!”\n\n千海莲步轻移，在不知不觉中已经与你近在咫尺，你甚至可以感受到少女呼出的淡淡紫罗兰花香。\n\n“§r虽然确实呢，你的灵能本质，还有你的来历都是相当的有趣.....哎，我突然有些动心了，要不你就当我的小人玩具算了？”§!"
 gts_event_storyline.6.option.3:"敬谢不敏"
 gts_event_storyline.6.option.3.response:""§r哼哼，我想也是呢~§!”\n\n千海微微退后几步，拉开了与你的距离。\n\n“§r说正事吧，这个银白通讯器除了最基础的通讯功能外，还可以帮你联系一些你当前已经能够接触到的巨娘，至少可以保证你不在一开始就被她们吃·干·抹·净。§!""
 gts_event_storyline.6.option.4:"联络巨娘？"
 gts_event_storyline.6.option.4.response:"“§r是的，也许是其他时间线，也许是某个平行宇宙，一些具有特别特质的巨娘总有着格外独特的力量。§!”\n\n千海在你身边缓慢踱步，讲解着很多超越你理解的事物：“§r当你招募到她们时，她们的力量能为你的帝国带来奇迹，当然有些代价可能比她们的体型还要巨大，毕竟可不是所有巨娘都像我这么好说话的。§!”"
 gts_event_storyline.6.option.5:"那我现在就可以？"
 gts_event_storyline.6.option.5.response:"“§r当然~另外还有，通讯器中预留了我的联系方式，有什么问题的时候可以找我尽情咨询哦~那么，下次见？§!“已经悄然绕到了你身侧的千海，趁你略微失神的间隙，用手指轻轻触及了平板上的挂断按键。在你凝重的目光中，少女那靓丽的身影于光屑中消失不见。\n\n§HPS：在发现界面选择通讯器，进入巨娘通讯界面。§!\n§HPS：在通讯中选择千海的通讯，进入千海的通讯界面。§!"
 gts_event_storyline.6.option.6:"......"