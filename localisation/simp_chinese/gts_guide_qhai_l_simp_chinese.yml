l_simp_chinese:
 NAME_qhai_communicate:"千海的通讯"
 MESSAGE_GTS_QHAI:"千海的通讯方式已添加"
 MESSAGE_GTS_QHAI_DESC:"千海的通讯方式已添加"
 gts_guide_qhai.0.name:"千海的通讯"
 gts_guide_qhai.0.desc:"[GetQhaiFirstMeetText]"
 gts_guide_qhai.0.desc.1:"通讯正常接通了：\n§r"小小统治者，你来啦，这应该是与你的第二次通讯？总之，在我这儿，我可以为给你提供一些也许有用的帮助~希望可以为你接下来的工作提供便利哦。“§!"
 gts_guide_qhai.0.desc.2:"通讯正常接通了：\n§r"小小....没那么小的统治者你来啦，这应该是与你的第二次通讯？总之，在我这儿，我可以为给你提供一些也许有用的帮助~希望可以为你接下来的工作提供便利哦。“§!"
 gts_guide_qhai.0.desc.3:"通讯正常接通了：\n§r"你是龙...爹，也好，很高兴能再次见到你~总之，在我这儿，我可以为给你提供一些也许有用的帮助~希望可以为你接下来的工作提供便利哦。“§!"
 gts_guide_qhai.0.desc.4:"尝试呼唤了千海：\n§r"令人震撼，居然等到现在你才与我联系。"§!"
 gts_guide_qhai.0.option:"了解了"

 gts_guide_qhai.1.name:"千海的通讯"
 gts_guide_qhai.1.desc:"[GetQhaiMeetText]"
 gts_guide_qhai.1.desc.1:"通讯正常接通了：\n§r"你好呀，这里是千海，小小的统治者，今天有什么需要吗？“§!"
 gts_guide_qhai.1.desc.2:"通讯正常接通了：\n§r"贵安，时间正巧，刚好我现在有空，有什么特别的事情想问吗。"§!"
 gts_guide_qhai.1.desc.3:"通讯正常接通了：\n§r"哎呀，最近真的很忙呢，但还是为你专门抽出了时间呢，感谢我吧，哼哼。”§!"
 gts_guide_qhai.1.desc.4:"通讯接通失败了：\n“滴——滴——”联络器传来了一阵忙音，一段时间后播放了自动语音：\n§r"哈—啊—就算是魅魔偶尔也需要休息，功能权限已经为你开通了，请自便哦。"§!"
 gts_guide_qhai.1.desc.5:"通讯正常接通了：\n有少女的惊呼从通讯器中传来\n§r"唔呀！怎么专找这个时候。咳咳，你好小小的统治者，请忽略我刚刚的失态~"§!"
 gts_guide_qhai.1.desc.6:"通讯正常接通了：\n有少女的自言自语从通讯器中传来\n§r"最近子宫总是胀胀的，还是有点不习惯呢。啊，有什么需要的吗，统治者桑~"§!"
 gts_guide_qhai.1.desc.7:"通讯正常接通了：\n有少女的疑惑声从通讯器中传来\n§r"咦，真奇怪，最近你是不是经常和我通话，难道是我的错觉？§!"
 gts_guide_qhai.1.desc.8:"尝试呼唤了千海：\n某种巨大的阴影忽然将你覆盖，连忙抬头看去，某个黑色的巨大平面正铺天盖地向你袭来，躲避已是徒劳。\n\n你下意识的闭眼，却被剧烈的狂风吹得站不稳身体。你揉了揉被巨响振得有些发疼的的耳朵，耳边传来了千海略带棒读的声音。\n\n§r"呀，没看清，真是对不起，下次一定注意~”§!"
 gts_guide_qhai.1.desc.9:"尝试呼唤了千海：\n§r"呼~"§!\n\n某种吐息从身后你全身覆盖，你下意识的后退两步，脚下却陷入了柔软的地面:"\n\n§r嘿嘿，小小的统治者，我的掌心感觉怎么样，放心吧，不会让你掉下去的。"§!"
 gts_guide_qhai.1.desc.10:"尝试呼唤了千海：\n等了许久，千海都没有来。你正打算重新呼唤坏心眼的魅魔少女，一阵银铃般的笑声从外部传来。\n\n§r"嘿嘿，我已经到啦，哎？你的小盒子做的可正精致。”§!\n\n你四处寻找声音来源，最后赫然发现，指挥中心的舷窗被千海那巨大的竖瞳占据了整个视野，正略带笑意地盯着你的动作"
 gts_guide_qhai.1.desc.11:"§r"咦，好像出了意外的状况。"§!"

 gts_guide_qhai.1.option.1:"开启通讯器"
 gts_guide_qhai.1.option.1.tooltips:"§r温馨提示，可以通过主要操作界面的左侧发现选项，点进遗珍子菜单找到巨娘通讯器哦。§!"
 gts_guide_qhai.1.option.2:"关闭关键提示"
 gts_guide_qhai.1.option.2.tooltips:"§r如果这么做的话，一些关键事件之前你就得不到我的建议了哦，当然我也乐得清闲~§!"
 gts_guide_qhai.1.option.3:"开启关键提示"
 gts_guide_qhai.1.option.3.tooltips:"§r我才放假没多久，干活那种事情补药啊。§!"
 gts_guide_qhai.1.option.4:"§r与千海聊天§!"
 gts_guide_qhai.1.option.4.tooltips:"§r可以和我聊聊天哦，也许会有一些你不知道的秘辛§!"
 gts_guide_qhai.1.option.5:"转接联系人"
 gts_guide_qhai.1.option.5.tooltips:"§r只有在记录了对应的联系人的联系方式时，才能帮你转接哦。§!"
 gts_guide_qhai.1.option.6:"切换至[event_target:gts_qhai_daughter.GetName]视角"
 gts_guide_qhai.1.option.7:"查看成就"
 gts_guide_qhai.1.option.8:"科技解锁"
 gts_guide_qhai.1.option.quit:"没别的事了"
 gts_guide_qhai.1.option.false.tooltips:"§r正在施工中，非常抱歉~§!"



 gts_guide_qhai.2.name:"千海的转接"
 gts_guide_qhai.2.desc.1:"§r咳咳，客服千海为您服务，请问你要转接到哪位联系......咦，您还没有人可以联系呢§!"
 gts_guide_qhai.2.desc.2:"§r咳咳，客服千海为您服务，请问你要转接到哪位联系人呢§!"
 gts_guide_qhai.2.option.1:"转接到劳尔斯"
 gts_guide_qhai.2.option.1.tooltips:"§r为您转接到劳大吗，好的没问题~§!"
 gts_guide_qhai.2.option.2:"转接到犽戎"
 gts_guide_qhai.2.option.2.tooltips:"§r为您转接到小龙吗，当前只有帮她换衣服的功能哦§!"
 gts_guide_qhai.2.option.3:"转接到林凤"
 gts_guide_qhai.2.option.3.tooltips:"§r为您转接到涩狐狸吗，当前只有帮她换衣服的功能哦§!"
 gts_guide_qhai.2.option.4:"转接到洛蒂"
 gts_guide_qhai.2.option.4.tooltips:"§r为您转接到洛蒂吗，对她的某些要求需要累积时间呢。§!"
 gts_guide_qhai.2.option.5:"转接到无声铃鹿"
 gts_guide_qhai.2.option.5.tooltips:"§r为您转接到铃鹿吗，没问题哦§!"
 gts_guide_qhai.2.option.6:"转接到特波利卡"
 gts_guide_qhai.2.option.6.tooltips:"§r为您转接到小死神吗，哪个星球又要遭殃了呢§!"
 gts_guide_qhai.2.option.7:"转接到花田"
 gts_guide_qhai.2.option.7.tooltips:"§r为您转接到小花田吗，可爱的美少女谁不喜欢呢§!"
 gts_guide_qhai.2.option.8:"转接到希诺"
 gts_guide_qhai.2.option.8.tooltips:"§r为您转接到希诺吗，她似乎有着格外沉重的使命呢§!"
 gts_guide_qhai.2.option.9:"转接到斯卡蒂"
 gts_guide_qhai.2.option.9.tooltips:"§r为您转接到斯卡蒂吗，她对“博士”格外的依恋呢§!"
 gts_guide_qhai.2.option.back:"返回"
 gts_guide_qhai.2.option.quit:"没事了"

 gts_guide_qhai.3.name:"千海的闲聊"
 gts_guide_qhai.3.desc.1:"§r只是想和我闲聊吗，呼呼，也不错呢，你想聊些什么？§!"
 gts_guide_qhai.3.desc.2:"§r作为统治者你也有这样的闲心逸致吗，好哦，千海我也奉陪！§!"
 gts_guide_qhai.3.desc.3:"§r可不要和我聊邻居家的巨娘今天踩扁了几个行星这样的话题哦，哼哼，后果你不会想知道的~§!"
 # gts_guide_qhai.3.desc.2:"§r咳咳，客服千海为您服务，请问你要转接到哪位联系人呢§!"
 gts_guide_qhai.3.option.1:"通讯器的来历"
 gts_guide_qhai.3.option.2:"你为什么要帮助我"
 gts_guide_qhai.3.option.3:"平时的工作"

 gts_guide_qhai.4.name:"通讯器的来历"
 gts_guide_qhai.4.desc:""
 gts_guide_qhai.7.name:"成就列表"
 gts_guide_qhai.7.desc.1:"§r成就的完成难度有难也有易，有些隐藏成就连我都不知道怎么触发呢~§!"
 gts_guide_qhai.7.desc.2:"§r你慢慢看吧，如果要兑换奖励的话也请到我这边来哦。§!"
 gts_guide_qhai.7.desc.3:"§r真好呢，年轻人就是有干劲，嗯嗯。§!"
 gts_guide_qhai.7.desc.4:"§r你说成就里很多梗看不懂，那我也没办法啦，解释梗的话也太奇怪了。§!"
 gts_guide_qhai.7.store:"成就商店"
 gts_guide_qhai.7.achiv.1:"§Y作弊§!"
 gts_guide_qhai.7.achiv.1.1:"$gts_achiev.cheat.short$\n$gts_achiev.cheat.long$"



 gts_guide_qhai.100.name:"关于成就"
 gts_guide_qhai.100.desc:"刚点下领取按钮，千海便毫无预兆地从你面前的空地出现，比你略微矮上一些的恶魔少女，脚步轻快地小跳到你的面前站定，少女精致的美貌和蹦跳的活跃感让你精神不由得一阵恍惚。\n§r“咳咳，为了仪式感，第一次的奖杯就由我亲自给你送啦。”§!\n千海嘿嘿地笑着，一个金灿灿的奖杯自少女的双手之间浮现，奖杯的顶端做成了星球的造型，一圈蓝色的星环环绕着，在灯光下泛着亮晶晶的色彩，看上去颇为梦幻。\n少女将奖杯举到你面前，收起了嬉笑的神色反而带上了几分少见的郑重，你不由得也站直了身，将奖杯稳稳捧过。"
 gts_guide_qhai.100.option:"这是？"

 gts_guide_qhai.101.name:"关于成就"
 gts_guide_qhai.101.desc:"§r"当然是奖杯，你在最近做出了相当有意思的事情，于情于理都要给予鼓励~”§!\n千海愉悦的甩动着她的黑色长尾。""
 gts_guide_qhai.101.option.1:"什么是有意思的事情？"
 gts_guide_qhai.101.response.1:"§r“这个嘛，由于成就制定者并非我一个人，所以标准各不相同。有§R重大事件§!，有§R图鉴收集§!，有§R历程达标§!，甚至是§R意外遭遇§!。”§!\n千海左右踱步，掰着手指数着。\n§r“总之，试着让这个文明变得更好吧，努力总有回报的~”§!"
 gts_guide_qhai.101.option.2:"奖励是谁提供的？"
 gts_guide_qhai.101.response.2:"§r“嗯，大部分是我,但还有一些是其他巨娘自·愿·提·供的哦~”§!\n千海笑眯眯地将最后几个字念得格外的重。\n§r“噢，差点忘了，还有§R成就点数§!一同发送了，你可以在终端的成就商店里选购哦~”§! "
 gts_guide_qhai.101.option.quit:"了解了"

 gts_guide_qhai.102.name:"关于成就"
 gts_guide_qhai.102.desc:"刚点下领取按钮，千海便毫无预兆地从你面前的空地出现，少女的犄角居然能够堪堪顶到了天花板。高大的少女一步便从门口跨到了你的面前，铺面而来的狂乱大风将你和你的办公桌吹得一团糟。\n§r“……你知道我为什么要变这么大过来吗。”§!\n千海表情看起来相当的幽怨，数十个金灿灿的奖杯自少女的双手之间浮现，在少女的手掌上堆成了山。\n§r“堆了这么多成就才第一次来找我，你要死啦。”§!\n千海气鼓鼓地蹲下了身，带来的风压将你彻底掀翻在地，你眼睁睁地看着少女的手掌在头顶上缓缓倾覆，哗啦啦，视野完全被金灿灿的小山所覆盖，只是片刻，你便感觉全身都被沉甸甸的奖杯山压得喘不过气来。千海看着你的惨状，最终还是叹了口气。\n§r“哈，算了，事已至此，流程还是要过的。”§!\n少女带着温热的尾巴缠上你的腰肢，将你解救了出来。"
 gts_guide_qhai.102.option:"这是？"

 gts_guide_qhai.103.name:"那个，能不能把我放下来"
 gts_guide_qhai.103.desc:""§r“不行——你就在上面听着我说吧”§!\n你的身体被千海的黑色长尾卷着不断左右摆动，你有种隔夜饭都要吐出来的错觉，少女此刻还在讲解：“奖杯是奖励你做出的杰出贡献，可以是§R重大事件§!，也可以是§R图鉴收集§!，也可以是某次§R意外收获§!，总之标准各不相同。”"
 gts_guide_qhai.103.option.1:"（唔唔唔）"
 gts_guide_qhai.103.response.1:"§r“......除了奖杯以外，还有§R成就点数§!一同发送到你的终端。好了，下去吧，可别吐我尾巴上了。”§!\n千海终于将你从数米高的半空放了下来，你第一次后悔将办公室修的那么高大，可以让少女能够用这么大的体型进来肆虐。"
 gts_guide_qhai.103.option.2:"奖励是谁提供的？"
 gts_guide_qhai.103.response.2:"§r“嗯，大部分是我,但还有一些是其他巨娘自·愿·提·供的哦~”§!\n千海笑眯眯地将最后几个字念得格外的重。"
 gts_guide_qhai.103.option.quit:"了解了"
