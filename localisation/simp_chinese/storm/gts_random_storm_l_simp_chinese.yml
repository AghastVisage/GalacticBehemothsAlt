 gts_random_storm.72.name:"风暴源调查成功"
 gts_random_storm.72.desc:"对爱液潮来源的调查成功了！\n我们的科学家在风暴中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的爱液风暴的由来。换句话说，那些正在被爱液潮席卷的星系，此刻也栖居在某位女性的阴道里。\n然而穿过空间裂隙，科研船发现定位信号显示它们正在我们帝国的母星，准确的说是母星的巨娘领袖宅邸里。\n进一步确认的结果是...[event_target:gts_random_storm_leader_target.GetName]，波及数个星系的风暴正是源自她下体里的残留爱液。\n这位巨大女神此刻正悠哉悠哉地伸着懒腰，倚在沙发上浏览文件。而在内裤遮掩下，阴道深处的一切则记录着她昨夜狂暴自慰释放性压抑的痕迹，昏暗的肉色隧道里附着着厚厚的一层爱液沼泽，满是雌臭的催情气体四散飘逸着，爱液里还浸泡着从市面热门的微缩城市残骸到巨娘领袖特供的拟真缩小星球碎片，靠淫能驱动的巨大跳蛋也在G点上微弱嗡鸣着。[event_target:gts_random_storm_leader_target.GetName]起身坐下时下体本能的抽动都会给阴道里的小世界制造一次地震，肉壁的舒张和紧缩驱使无数爱液裹挟着破碎的建筑和星体，流进了空间裂隙，在宇宙空间将她的小小隐私泄露出来。我们实在不敢确定这究竟只是一场意外，还是她利用自己的神力戏弄人间的新点子。幸好我们现在足够小，她还没发现我们。\n回到主世界，我们旁敲侧击地向[event_target:gts_random_storm_leader_target.GetName]提及了此事，她看起来颇为惊讶，大概是自己也没想到还能以这种方式摧毁银河，让无数生灵雌伏在她身体的分泌物下，希望这次经历不要让她觉醒一些不妙的爱好。\n至少她还算配合工作，行政部将派遣大量人员机械进入她的阴道里仔细清理肉壁上残留的爱液，并建设引流网避免爱液流入空间裂隙。她也会在这段时间内减少外出活动，安静地等待自己制造的这场风暴结束。宣传部门也会进行新闻管制，避免诸如“[event_target:gts_random_storm_leader_target.GetName]大人靠自慰熄灭恒星”之类虽然事实如此但会损害其个人形象的言论传播。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。"
