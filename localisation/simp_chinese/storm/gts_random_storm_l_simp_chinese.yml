 gts_random_storm.65.desc:"排泄！\n对屁穴风暴来源的调查成功了！\n我们的科学家在风暴眼发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小，这就解释了这汹涌的风暴潮的由来。我们的科学家预测这种裂隙的存在并不稳定，会在数月到数年内彻底关闭。\n做足准备后，我们的科研船趁着风暴稍有缓和的机会穿过了空间裂隙。但我们视野中只有一片昏暗，附近的空间倒是满溢着带着女性体汗的暖湿味道，像是许久没有通风一样。\n“呃啊啊啊累死我了——”\n“今天真是累啊。”\n“小拔老师搞那么多活是要干什么啊！”\n整个空间猛的震动起来，看起来这个空间的主人正和其他人在更衣间换衣服。随着她们脱下衣服，视野开阔起来，我们也通过坐标定位确认了我们的位置，我们正在我国一颗殖民星上的高中女生体表，而空间裂隙则悬浮在这位少女臀部的不远处。脱光衣服后，她们简单冲了个澡，期间我们不得不将飞船开进少女的肛门深处以躲避这场洪水。\n“芜——好爽啊。”\n“奶茶奶茶——”\n“我说柠檬同学你饿不饿啊？”\n“当然饿啊。”\n“那么那么，我们晚上去吃拉面怎么样？我之前看到学校附近有很棒的面条摊子呢！”\n“诶？那有点想去诶...”\n“那今天晚上就去吧！”\n其他两位女生兴致勃勃的交流着，我们栖居的这位少女倒是坐在一边，安静地看着杂志。\n“哦对了，喂，小鞠！刚刚我们在洗澡的时候，你有在偷看吧。”\n“哇啊？！我...我没有看啊。”\n尽管远不至于被她的同学听见，但我们清楚的听到了这位少女因惊吓而放了个屁，虽然很快就消融在空气中，但若是在平时，这些气体或许会被内裤拦截最后涌入空间裂隙里。\n“你这骗子绝对在偷看吧。”\n“我...我有什么偷看的必...必要吗？”\n“我说那个小鞠啊，刚才我们在冲洗胸部的时候，叫你都没有反应呢。”\n“sodayo”\n“诶...诶...那个...”\n“这么想看就让你看个够吧~”\n“哇啊！你，你们不要仗着乃子大就为所欲为！哇啊啊啊啊啊————”\n在这之后，这位姑娘在惊慌与挣扎中连着放了数个屁。看起来，因为这位少女的紧张兮兮和营养不良，她的肛门总是会不经意的喷出些许臭气，而这些气体在内裤里聚集后就会通过空间裂隙，演变成横扫数个星系的屁穴风暴。\n我们最终派出了一支精英医疗小队常驻在她的肠道内进行护理，并以全校心理健康教育的名义帮这位女生疏导心理压力，希望能在数月内控制住她的小习惯。然而无论如何，她的这一无意识行为对银河系的环境影响还是会持续上数年。"
 gts_random_storm.65.a:""
 gts_random_storm.65.b:""
 gts_random_storm.66.name:"调查失败"
 gts_random_storm.66.desc:"对屁穴风暴来源的调查最终无功而返，我方科学家的几次抵近考察都没能发现什么引人注意的异常现象，当然，这场隐星蔽日的屁穴风暴本就是一团巨大的异常现象了。\n我们只能接受这样一个结论，或许确实是某位遥远的巨娘无意间释放的臭气通过漫长移动抵达我们这片星系附近，其散发的气味造成了这次太空风暴。\n只是按这规模推算，这世上总不能真的有银河般巨大的少女存在吧？"
 gts_random_storm.66.a:"还是做好行星防护吧"
