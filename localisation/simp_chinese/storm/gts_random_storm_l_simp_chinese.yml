 gts_random_storm.44.name:"风暴源调查成功"
 gts_random_storm.44.desc:"对乳汁潮来源的调查成功了！\n我们的科学家在乳汁潮中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的乳汁潮的由来。换句话说，那些正在被乳汁风暴席卷的星系，此刻也栖居在某位女性的乳腺里。\n然而穿过空间裂隙，科研船发现定位信号显示它们正在我们帝国的母星，准确的说是母星的巨娘领袖宅邸里。\n进一步确认的结果是...[event_target:gts_random_storm_leader_target.GetName]，波及数个星系的风暴正是源自她柔软乳房里的乳汁。\n这位巨大女神此刻正悠哉悠哉地伸着懒腰，倚在沙发上浏览文件。她所不知道的是，她的每一次呼吸，或者胸部轻微的摇动，都会让乳腺内平静的乳海瞬间变得山呼海啸，一次新的乳汁潮便从空间裂隙涌出，向四周的星系涌去。我们隔着数万公里厚如地壳的脂肪层和她的胸罩与衬衣，安静地听着[event_target:gts_random_storm_leader_target.GetName]温柔的轻语，若不是里面汹涌的乳汁随时会将科研船吞没，我们简直希望把这里当做迎接末日时完美的避难所。我们实在不敢确定这究竟只是一场意外，还是她利用自己的神力戏弄人间的新点子。幸好我们现在足够小，她还没发现我们。\n回到主世界，我们旁敲侧击地向[event_target:gts_random_storm_leader_target.GetName]提及了此事，她看起来颇为惊讶，大概是自己也没想到还能以这种方式摧毁银河，让无数生灵雌伏在她身体的分泌物下，希望这次经历不要让她觉醒一些不妙的爱好。\n至少她还算配合工作，行政部将派遣大量人员机械进入她的乳腺内建立水位监测和分储装置，以阻止更多乳汁无序地涌入银河。她也会在这段时间内减少外出活动，安静地等待自己制造的这场风暴结束。宣传部门也会进行新闻管制，避免诸如“[event_target:gts_random_storm_leader_target.GetName]大人用喷乳熄灭恒星”之类虽然事实如此但会损害其个人形象的言论传播。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。"
