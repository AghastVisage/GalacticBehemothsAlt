 gts_random_storm.70.name:"侦测到爱液潮！"
 gts_random_storm.70.desc:"扫描仪探测到一场裹挟着海量巨娘爱液的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n满溢着巨娘荷尔蒙的爱液潮对我们来说极为危险，除了训练有素的灵能使，巨娘爱液会让每个接触到的人瞬间发情，这将显著降低我们殖民地的稳定度。但对于普遍列装了防水涂层的军舰来说，爱液覆膜反而有助于提高我们舰队的战斗力，唯一需要防备的只有这飘忽不定的风暴本身了。\n一些科学家无法相信巨娘的潮吹能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。"
 gts_random_storm.70.a:"好的"
 gts_random_storm.70.b:"去查查风暴的来源"
