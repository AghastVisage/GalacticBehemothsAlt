 gts_hitomi.506.title:"直播"
 gts_hitomi.506.desc:"最近，作为林凤主人的贴心小猫娘，看到主人时常面对昂贵的账单和空空如也的冰箱叹气。 这一声叹息，被听力敏锐的希瞳捕捉到了。 “危机！主人的经济状况出现赤字！这样下去主人会饿瘦的！”\n希瞳有些疲惫地坐在地上。普通的打工根本不要她\n“难道希瞳是个无用的女仆吗……”\n看了看主人的照片，希瞳下定决心！\n为了守护主人的胃和钱包，全能女仆希瞳决定——出道成为虚拟主播（VTuber）赚钱！"
 gts_hitomi.506.a:"直播？！"
 gts_hitomi.507.title:"直播"
 gts_hitomi.507.desc:"开播半小时，希瞳尝试了唱歌和跳宅舞。直播间气氛一度十分尴尬。弹幕开始刷屏：说主播没活了。\n希瞳那双粉色的眼睛迅速扫描了这些弹幕。脑海里想到了一个好的想法。\n她伸出手，动作极其潇洒地从裙底掏出了一个塑料的一元防风打火机。“咔哒”一声，蓝色的火苗窜起，照亮了她那张冷艳的脸庞。为了表现出足够的游刃有余，她甚至嘴里还极其嚣张地叼着另一个备用的打火机，对着镜头挑了挑眉，来了一个充满挑衅意味的Wink。她拿下嘴里的打火机，对着镜头晃了晃手里燃烧的打火机。\n“看好，兄弟们”\n咔嚓——轰！！！\n【系统提示：直播间因“不良行为”已被封禁72小时】 【账户余额增加：0元】"
 gts_hitomi.507.a:"Fw瞳"
 gts_hitomi.508.title:"直播"
 gts_hitomi.508.desc:"“大家晚上好～这里是希瞳！” “为了感谢大家的支持，今天希瞳要挑战一下在小人的星球跳‘宅舞’哦！”\n希瞳正低头看着自己脚下的“舞台”。那是该星球最大的沿海都市群，但在她眼中，不过是一块稍微平整一点的混凝土色地毯。\n「那么，Music Start！一、二、三～♪」\n随着轻快的音乐响起，希瞳开始隨著節拍律动。 第一个动作是简单的原地踏步。在那轻盈的旋律中，希瞳的右脚后跟毫无慈悲地落在了该星球的中央金融区。数百座引以为傲的摩天大楼在接触到她鞋底的瞬间，连弯曲的过程都被省略，直接被垂直的重力压成了平面的二维废渣。数百万还来不及撤离的精英阶层，甚至连惨叫都发不出来，就和他们昂贵的办公楼一起，变成了希瞳鞋底花纹中一抹微不足道的红色污渍。\n她并没有停下，而是顺势以后跟为轴，做了一个可爱的转身动作。巨大的鞋底在地面上摩擦、旋转。这看似轻盈的转身，对于地面来说却是毁灭性的动作。 整个城市的地下管网、避难所、以及躲在里面瑟瑟发抖的人群，被这股恐怖的摩擦力像磨盘一样碾碎。混凝土、钢铁和有机体被混合在一起，变成了一种难以名状的灰红色糊状物，均匀地涂抹在希瞳的脚下。\n直播进入高潮。希瞳随着音乐，准备进行一个活泼的单脚跳跃。 她选定的落点，是该星球集结了所有剩余兵力的最后防线——一座由超合金打造的军事要塞山脉。无数导弹和光束炮打在希瞳那光滑细腻大白腿上，连一点痕迹都没有留下。\n「要跳咯～耶！」\n她巨大的身躯腾空而起，然后重重落下。希瞳左脚的足弓精准地压在了那座要塞山脉上。 所谓的“超合金防线”，在她那数千万吨的动能面前，就像是塑料泡沫一样脆弱。整座山脉被她一脚踩进了地壳深处。她刻意地抬起脚，看了一眼鞋底。 在那深褐色的鞋底花纹中，嵌着几个已经被压成薄片的战舰残骸。\n「脏死了……」\n她嫌弃地皱了皱眉，随后就在旁边的一片森林上蹭了蹭脚底。 这随意的“蹭一蹭”，让数千公里的原始森林像被推土机推过一样，瞬间变成了光秃秃的泥地。她抬起巨大的右脚，将那仅仅沾着“一点点”森林残渣的鞋底凑近无人机镜头，做了一个可爱的展示动作。\n「大家看！变回干净的样子了哦～♡ 这样回家就不会被主人说不讲卫生了！」\n「呼……跳完舞稍微有点累了呢。」\n希瞳并没有在意弹幕里那些奇怪的惊叹。她转过身，看向身后那片被晚霞染红的大陆——那里有一条风景优美的海岸山脉，连绵起伏的山峰看起来就像是一张不错的长椅。\n「那今天的舞就先跳到这里，希瞳要稍微休息一下～」\n她转过身，背对着镜头，巨大的裙摆像垂天之云般缓缓降下。 接着，她毫无顾忌地坐了下去。当她那柔软而丰满的臀部接触到地面的瞬间，那条横贯大陆、存在了数万年的宏伟山脉发出了一声不堪重负的悲鸣。岩层断裂，地壳塌陷。 原本高耸入云的山峰，在她数千万吨的体重压迫下，瞬间像脆皮饼干一样崩塌、粉碎。，原本崎岖的山地被她硬生生地“坐”成了一个光滑的盆地。\n「诶诶诶？红SC哎！想看希瞳的脚趾？！」\n「真是的，你们这些色色的粉丝～好吧，既然是榜一大哥的要求……」\n「不过穿着鞋子可没法给你们看呢。正好刚才跳舞出了好多汗，里面现在湿湿热热的，我也想透透气啦。」\n说着，她微微侧过身，优雅地抬起了那条巨大的右腿，双手伸向脚踝。\n她解开了深褐色女仆鞋上的搭扣。希瞳捏住鞋后跟，轻轻一褪。\n「嘿咻……鞋子，脱掉～」\n她随手将那只脱下来的、长达数公里的厚底皮鞋丢在了一边，重重地砸在了刚才那片内海的沿岸平原上。一座拥有数百万人口的沿海工业城市，连同周边的卫星城，瞬间被这只巨大的鞋子压得粉碎。\n「呼……这就轻松多啦。接下来是袜子……」\n失去了鞋子的束缚，那包裹着白色过膝袜的修长玉足在空气中舒展开来。因为刚才剧烈的运动，白色的棉质面料微微透出一丝肉色，散发着的热气。\n希瞳伸出两根手指，捏住大腿处袜圈的边缘，开始慢慢向下拉扯。当袜子完全脱离脚尖的那一刻，希瞳随手一甩。\n那只巨大的、还带着体温和湿气的白色长袜，轻飘飘地落在了几百公里外的一片群岛海域上。 那片群岛上的几个国家，连同周围的海域和舰队，瞬间被这只袜子温柔地“吞没”了。将所有的小人都捂死在了那带着奶香味的白色地狱里。\n「啊～光着脚果然最舒服了！」\n她看着自己那只终于重见天日的裸足，满意地晃了晃脚踝。白皙的皮肤在阳光下仿佛在发光，足弓勾勒出完美的弧线，足底因为刚运动完而呈现出诱人的粉红色。\n她俏皮地眨了眨眼，双手抱住右腿的膝盖，将那只巨大的脚丫稍微翘起来一点，对准了镜头。 她在那片废墟之上，轻轻地活动了一下脚趾。\n「看清楚了吗？希瞳的脚可是很香的哦～（笑）」\n「好啦，时间不早了。主人还在家里等着我做晚饭呢，要是回去晚了，主人会不高兴的哦。」\n她双手撑在身后的废墟上，将脸凑近镜头，巨大的阴影彻底吞没了摄像头下方的一座孤岛。\n「那么，最后给大家一个充满爱意的晚安吻吧～」\n「mua～♡」\n她对着麦克风，用力地送出了一个飞吻。\n「嘻嘻，这下大家都安静地睡着了呢。」\n她满意地看着眼前这片“干净”的大地，站起身，拍了拍裙子上的尘土。\n「大家晚安～记得点点关注哦，下播啦！」"
 gts_hitomi.508.a:"关注双月希瞳谢谢喵"
 
 

