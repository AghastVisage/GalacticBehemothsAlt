 gts_hitomi.11.name:"希瞳"
 gts_hitomi.11.desc:"我是希瞳，作为女仆兼舰长，我愿一直陪伴你左右"
 gts_hitomi.11.a.name:"你怎么会在这里？"
 gts_hitomi.11.a.desc:"趴在前甲板上的希瞳透过舰桥指挥室的玻璃饶有兴趣的看着小小的科学官们\n“哈~舒服了，既然帮我完成了复仇，那我可以仔细来谈谈怎么报答你们了。”\n“比如，我会带你去到星河的彼端~”\n“嗯哼？当真啦？” "
 gts_hitomi.12.a.name:"你说的舰长是什么意思，你可以指挥舰队吗？"
 gts_hitomi.12.a.desc:"“那是当然！需要舰队指挥官吗，我是希瞳，我在我在~”\n“虽然舰队指挥有些费神，但小瞳还是会细心指挥，谁让我是你的贴心女仆呢。” "
 gts_hitomi.13.a.name:"你怎么变小了？"
 gts_hitomi.13.a.desc:"看着眼前没有形象瘫坐在舰船甲板上的女仆猫猫，不禁发出来了提问，刚才的天体级形象还是留下来过于深刻的印象\n“那个呀，是因为我的能力被压制了太久一下子全释放出来导致的，现在释放完了就恢复正常的大小了”\n“嗯？失望啦？” "

 
 
 gts_hitomi.101.title:"1微弱的求救信号"
 gts_hitomi.101.a.desc:"　　经过科研船外围的研究，我们确认了这是一个还没有研发出FTL科技，加入群星大家庭的颇为原始的文明。虽然已经发展出了类似我们早期的科技，却并没有怎么涉及星空。\n通过对于这颗星球的外围观察，我们并没有发现这颗星球上有什么异于其他文明的东西。但是，随着我们的接近，以及我们的文明翻译器不断地捕获这颗星球所发射的电磁波，那个出现在我们脑海之中的少女正变的越来越清晰，很快，我们也便明白了她那模糊话语的本意。\n“救救我。”"
 gts_hitomi.next:"下一页"
 gts_hitomi.file.a:"离开"
 gts_hitomi.102.title:"2逐步清晰的面貌"
 gts_hitomi.102.a.desc:"随着我们的逐步靠近，我们为了避免被土著发现真实意图，伪装成了一颗彗星，不断地尝试接近这颗孕育着不同生命的蓝色星球。虽然从我们截获的情报来看，我们应该不过是被视作了一个有些奇特的天体，我们依然谨慎地不断借着这个星系其他星球的掩护，慢慢靠近着这颗有着一位不断地在梦境当中，尝试和我们联系的少女。\n“请......你们救救我。”\n随着科研船渐渐的靠近，我们也终于有了和少女直接在意识之中对话的能力。我们大致了解过这种灵能感应的手段，却没曾想过能在这个土著星系真正用上过。\n“我是......双月希瞳，你们可以叫我希瞳。”\n“我曾经是这个星球存在的另一个种族，却因为我作为巨娘的身份被这个星球可恶的小人种族利用，把我产生的能够巨大化的能量全部利用起来......”\n“这个地方，好小，好无聊。”\n“你们，能够帮助我，让我能够脱身出来吗？”"
 gts_hitomi.103.title:"3贸然的营救行动"
 gts_hitomi.103.a.desc:"我们的飞船如同流星一般，划过了土著星球的天际，却装作被捕获的样子，进入了环绕他的轨道。\n在土著们还在争论我们是外星人还是自然现象之时，为了将这只栗色的女仆猫娘从原住民的魔爪下拯救出来，我们打算冒险一试。\n我们的科学家带领着小队，直接传送到了那城市之下的基地之中。属于这个星球的科学家……惊奇的看着我们的出现，然后，便被我们逼迫着，交出了得以解救少女的钥匙。\n望着熟睡在培养皿中，被束缚着掠夺着能量的猫耳少女，我们不禁惋惜起来。但，就在这时，整个基地的警报都响了起来，看来……\n是时候了"
 gts_hitomi.104.title:"4破茧而出"
 gts_hitomi.104.a.desc:"巨大的少女破茧而出，吓得那些赶来围追堵截的士兵呆若母鸡。\n“真的......很感谢你们。”\n淡红色的眼瞳打量着被一同包围的科学家，但她的眼神当中却没有畏惧，相反，能读出的则是满溢的恨。\n后续赶来的士兵如同潮水一般一波波的涌来，巨大的女仆少女则尝试着翻过身来，用自己庞大的身体挡住士兵们的视线。\n“虽然还没怎么了解你们的国家......但是我会记得你们的，不过，在此之前，我还有仇要报呢......”\n在我们的注视下，那位自称希瞳的猫娘少女逐步站起身来，将自己比常人大十倍的身躯压向了那些曾欺压着她的科学家和士兵们。\n“至于救出我的你们，就请......先不要打断我的复仇吧。”\n我们传送回了探测器上，少女则开始了自己的复仇。\n已然狭小的走廊，架在半空的管道和电线被少女轻易的扯断。\n胆敢拦在少女身前的小人，被比自己更为庞大的皮鞋碾作血污。\n失去了从自己身上汲取的能量，这座庞大的基地，同城市一同暗淡了下去。\n重新掌握了力量的少女，则思考着，这个背叛了自己的文明的处决方式。"
 gts_hitomi.105.title:"5背叛自己的ta？"
 gts_hitomi.105.a.desc:"“就你，一个了吗？”\n身为女仆的她，在击退了几乎所有的，胆敢阻挡他的士兵们后，将那自己曾熟识的，曾经的“挚友”，但却出卖了自己，成为这个小人科学院院长的他，逼到了墙角之中。\n“我不是故意的！我......真的只是......”\n“真的不是故意的？就凭你能活到今天这个显而易见的事实，还打算继续蒙骗你的女仆吗？”\n穿着洛丽塔鞋的右脚轻轻地抬起，还沾着那些士兵被碾碎骨骼和血肉的鞋底，还在不断地向下滴着暗红色的鲜血。伴随着少女的威逼，她鞋底的棕色哑光厚底正顶着自己面前的这个叛徒。\n尽管那人正不断地求饶着，但是希瞳被关押了千年的恨意却并未消散一点。\n伴随着她收起的脚尖如同摆锤一般飞速落下，毫无抵抗之力的血肉之躯如同一节被碾碎的香肠一般爆裂开来。像是一颗鲜血的爆弹那般，同墙壁一起炸裂在了自己的鞋尖。\n“怯，还以为千年来你能有什么长进的，原来只有这点能耐吗？”\n少女左右晃动了自己的脚尖，将自己的脚同鞋子一同拔了出来。\n看着残留在自己鞋尖上的鲜血和骨骼，希瞳不由得嘟噜着。\n“十倍，对于彻底毁灭这个文明而言，还是太小了。”\n有些怨念的希瞳，用脚尖刮擦着一边的墙壁，将这小人的印记完全擦除。\n“解决了仇敌，那么也得把这个决议背叛自己的文明，一同扫除了才行。”\n没有了维生舱的束缚，希瞳的身躯，终于可以随心所欲的将能量完全用在巨大化之上，她的身躯将薄弱的楼板撑裂，将承重柱如同木棍一般折断撑裂，将自己的巨大化化作毁坏的力量，享受着那些愚蠢的科学家们，在躲避自己不断膨胀身躯时的不知所措，以及，最终连污损自己皮肤都做不到，也毫无反抗之法的——\n无力感。\n她的身体撑破了华美得穹顶，阴影逐步遮盖了大地。\n而展现在她面前的，则是自己还未曾享受过，却已经陷入混乱的现代化都市。"
 gts_hitomi.106.title:"6重拾力量的她"
 gts_hitomi.106.a.desc:"没有了自己身体所创造的能量，这些小人现在正在自己的面前，如同蝼蚁一般逃窜着。\n希瞳的双脚，重重的踩在广场之上。巨大的体重，瞬间就让看上去坚实的大地踩出了洛丽塔的鞋底印记。\n“既然不知道发生了什么的话，那我就再替各位蝼蚁们回忆回忆吧。”\n高跟踏击在小人的大街上，车流混着人流混乱地在希瞳的脚下逃窜着。穿着女仆装的猫娘希瞳，则像是猎手巡视猎场一般，踩踏着小人们的街道，践踏着那些被遗弃的车辆向前走去。\n“怎么？千年来依靠我的力量才发展到今天，你们难道毫无察觉吗？”\n“仔细想想也是，毕竟，能愚笨到被我追上呢......”\n少女的言语之间，满是对小人的不屑。\n车流堵塞成团，人群蜂拥向前。明明是自己的同类，却宁愿弃之不顾......\n希瞳的阴影，逐步笼罩在了逃跑的人群上方。\n本来宽阔的道路，在她的身后只留下了冒着黑烟的残骸，以及一个又一个脚印，和被踩成铁皮的罐头。\n“看来，里面还有不少人呢？”\n希瞳轻轻的用脚跟压住了车流之中的一辆巴士，满载小人的公交车此刻被困在停滞的车流之中动弹不能。就连是车门，也被其他混乱的车辆所堵塞，车内满载着的乘客，只能眼睁睁的看着自己头顶的天花板一点点的被撕开，露出希瞳那只厚重的棕色洛丽塔的鞋跟。\n“切，就这样送你们这些蝼蚁上路吧。”\n少女忽然间重重的踩下，将满载的公交车化作了一个爆炸的番茄罐头，一旁的车辆之上，以及街旁的建筑，全部沾染上了那些半秒之前仍在挣扎，现在却变成各种红的黑的白的东西，就算是在这血肉地狱之中得以在少女的鞋尖和鞋跟之间存活的小人，下一秒则被少女更恶趣味的动作所完全碾碎——那辆已经不成样子的，混合着血肉的公交车残骸，连同后面积压着的几辆公交车一起被她后踢向空中，留下了喷洒着鲜血的轨迹，再重重的落在自己留下的脚印之间。完全不成样子的巴士残骸，还在姗姗的向外流出着人类遗骸的混合物。"
 gts_hitomi.107.title:"7重拾力量的她"
 gts_hitomi.107.a.desc:"看着面前逃难的人群，本来还在后面不紧不慢的虐杀着的希瞳，突然感受到了几下不明缘由的刺痛。定睛一看才发现，是本该维持着秩序的特警，正开着装甲车坚守在路口，用自己的那些毫无作用的烧火棍攻击着自己。\n“你们真的觉得这会有用吗？”\n少女抛弃了那一丝对猎物的矜持，本在驱赶着“猎物”的她，将逃跑中的人群的当作地毯向前跨去。每一步，都有几十个生命化作鲜红的血花，在她厚重的洛丽塔鞋下绽开着。而伴随着那黑影越来越大，她的面貌越来越清晰，站在这些抵抗着面前的希瞳，自然是对这些所谓英雄般的行动有所想法的。\n“怎么样啊，混蛋们？看看我的脚底，你们还要再反抗吗？”\n看着面前这些还没有自己脚趾高的小人儿，希瞳恶趣味的抬起了脚底，将一片地狱般的猩红，毫无保留的展示在这些抵抗者们的面前。\n“呕——”\n看着这番地狱的场景，纵使是经历过专业的训练，也有不少队员陷入了干呕之中，对此，希瞳小姐的处罚是......\n脚底重踏，将他们中间的，厚重的装甲车，如同易拉罐一般“咔擦”一下压扁。再如清扫一般，以鞋底为工具左右摆动。\n那些挥舞着烧火棍和护盾的士兵们，被少女比钢铁还要坚固的鞋面瞬间撞成了细小的血雾。仅仅是脚底在街道上左右摆动，就将这些恼人的蚂蚁，全部变成了自己鞋上的猩红印记。\n“真是的......幸好~你们丑陋的鲜血还没脏到本女仆的白丝呢......”"
 gts_hitomi.108.title:"8清洁脚底"
 gts_hitomi.108.a.desc:"“可你们的血肉粘在我的双脚上，总感觉很恶心呢......”\n有了些厌恶的残忍女仆希瞳酱，继续朝着城市的一头走去。\n“有了......？”\n看着身旁那些十几层的，有自己小腿高的建筑，走到了一处公园之中的她，忽然之间想起了什么。\n“既然都是些无趣的小人建筑......用来擦拭鞋底的话？”\n她单脚着地，向后抬起了自己猩红的足底。鞋底的纹路几乎充满了逃难者的尸骸，还在滴落着血污的鞋子，此刻甚至还粘着几个拍扁到看不出原先样貌的小人车子。伴随着少女的脚底压在建筑的外立面上，如同猫咪磨爪那般，希瞳用着自己的鞋底，开始刮擦着那看似坚实的楼房。只可惜，小人的造物丝毫没有想过她的力量。仅仅是用自己的单脚擦拭几下，大楼便已经塌掉了半截，留下了从她鞋底刮下的大量血污，以及塌陷下来的破碎建筑残骸。\n“哼......我还是太高估你们了吗？”\n感到不解气的少女用脚尖轻重重地踢向楼房的一层，将她脚底刮落下来的，曾是几百条鲜活生命的人类原浆，和楼房一起垮塌埋没。\n“至于另一只脚吗，反正还有其他楼房呢？”\n少女恶趣味的将脚旁的大楼，当作了地毯，将自己的鞋底擦拭干净。末了，看到了脚边的池塘，下意识用小人的河塘洗脚的她，便穿着洛丽塔鞋轻踩了进去。\n“哗——哗——”\n伴随着她的脚底在池塘里轻轻的滑动，本来风景宜人的湖泊，瞬间便化作了脏黑的污水。\n其实也没想太多的希瞳，轮换着洗完了自己的双脚。棕色的皮鞋，终于少去了不少建筑的尘土，和那些垃圾一般的小人尸体。\n“这样才算弄干净吗~吗，还有很多小人没死干净呢？”\n这样想着的希瞳，继续追赶起了附近那些还在慌乱之中逃窜的小人。"
 gts_hitomi.109.title:"9绝佳视角"
 gts_hitomi.109.a.desc:"这里的房子就高了不少呢？一看就是你们这些小家伙的新聚居地吧？”\n希瞳站在小人的大街之上，周遭的大楼都繁华了不少。不少透明的玻璃覆盖其上，失去了能量的彩灯并未将街区最美的一面展露给我们的女仆，但对于目标是全歼这个星球生命的她来说，这些建筑物不过是他接下来选择的猎物罢了。\n嗯哼？看来你们的楼宇已经比欺骗我那会高上不少了呢......\n希瞳挑逗的走到了面前的楼宇前。刚好比她膝盖低一小节的大楼看上去还没收到什么警告。稍稍弯下腰去，便看见了里面还不知道外面究竟发生了什么，还在忙碌着的小家伙们。忽然之间又来了恶趣味的少女，将双脚踩在了楼宇的两旁。\n作为女仆的她，轻柔的蹲坐在了商场的上方。白丝的胖次轻松的就压溃了楼房顶端的各种设备，天线在她的骆驼趾上慢慢的弯曲折断，令希瞳感觉到了一丝瘙痒感。她收紧了大腿，将上半部分的商场一点点挤压在自己微胖紧实的大腿之下。伴随着身下那若有若无的悲鸣，满足着的少女正一点点的挤压着那些不幸着的生存空间。\n“既然不想逃的话，那就是自愿喽？”\n内倾的双脚，让自己的圆鞋头推碎了大门，将堵在门口的人群吓的连连后退。伴随着大楼四处发出悲鸣之声，原本华丽的玻璃幕墙在少女自上而下的挤压中逐渐架不住压力，一扇接一扇的碎裂开来。伴随着楼板一层层的垮塌，繁忙的商场终究还是受不住少女的压力，塌落了两三层。\n“真是的，连当椅子的能力都没有吗？废物~”\n希瞳厌恶的说着，将白丝包裹的双腿逐渐的夹拢。虽然有小人正在从低楼层一个个往下跳着，但毫不在意的她依然还是用自己的臀部和双腿，处决掉了被困在她身下的三百余名小人。\n在小人们的惊呼之中，大楼终究还是敌不过巨大女仆的力量，在她的小腿之间如同被孩童拆毁得沙堡一般塌落成了废墟。\n“本还以为你们能逃出来会聪明点的，没想到还是和那些蠢货一样直直的往前逃呢？”\n看着那逃出的几十个幸存者，嘴上说着自己毫不在意的希瞳仅仅是两步就追上了奔逃的人群。本还宽阔的大街，一下子便被她重踏所扬起的尘土所笼罩。\n“逃？逃的掉吗？”\n眼前一同逃跑的同伴消失不见，视野里只剩下了她冰冷的鞋底。\n末了，也不过是被她随意的一脚抹去，仅仅是比那些被双腿和臀部挤碎的小人多活了两三分钟。\n“真是的......才刚刚有感觉呢？”\n希瞳抬起脚来，看了看自己再度沾染上小人的鞋底，厌恶的又用身旁的建筑将脚底的血腥擦掉。"
 gts_hitomi.110.title:"10绝佳视角"
 gts_hitomi.110.a.desc:"“嗯？看起来你们居然还能有比我高的楼呢？不错哦？”\n踏平了繁华商业街的她，发现了身旁的，有着150米的大楼。作为百倍大小的少女，她则刚好比这栋可以称得上是地标性的建筑高出了整整一个头。\n“虽然还是没我高，不过看起来比那些十几层的小楼有意思不少呢？”\n这样说着的少女蹲了下来，用手指轻轻的沿着外墙滑动着。本该忙于工作的小人们被惊动，却被少女巨大的几乎是占满一层楼高度的淡红色眼瞳，以及她那对微微摇晃的，和大楼比还要宽上不少的乳房所惊吓到。\n“真是的，现在才察觉到自己的命运吗？不过，在死之前，你们可一定要满足我啊~”\n这样说着的希瞳，踮起了自己的脚跟，将自己的巨乳完全靠在了大楼之上。\n温热的双乳，顺着大厦流线型的外表微微滑动，散发着一股少女独特的气味。伴随着少女的上下晃动，整个大楼也被希瞳拥抱着，伴随着她的动作不断地震动着。周遭的大地出现裂纹，坚固的窗户虽比之前的商场要牢靠上不少，却依然有不少布上了裂纹。\n“嗯呐~努力反抗我吧~”\n大楼的顶端完全破碎，变成了她胸口的形状。包裹着南半球的衣服早已脱落，露出了她那圆润柔软的双乳。但在如此巨大的重量和大小之下，就算是能够养育生命的乳头，也几乎是如同一个坚硬的岩石一般，不断地在被破坏的越来越严重的建筑上留下深深的刻痕。\n“呼......冰冰凉凉的大楼粉碎在我的巨乳上......还挺舒服的，不过这些乳汁......要留给更多的小人呢？"
 gts_hitomi.111.title:"11解压零食"
 gts_hitomi.111.a.desc:"空气中弥漫着一股乳香味。已经喷出一些的白色乳汁在建筑的残骸之中缓缓流动着，散发着蒸汽。而此刻的少女，则再次蹲了下来。透过满是裂纹的窗户，只能看到那些逃不出的所谓“精英”，正蜗居在大楼的中间，畏畏缩缩的看着注视自己的巨大女仆。\n“各位，想要死的更有价值一些吗？”\n希瞳轻启双唇，慢慢的哈出了湿热的空气。水汽逐步的遮蔽了玻璃幕墙，让小家伙们得以忽略掉巨大的淡红色眼瞳，以及那堆裸露在风中的丰硕乳房。但仿佛是抽奖一般，少女端详着，伸出手来，一下就击碎了大楼的某处。\n“恭喜你们，成为我今天的第一口小零食！”\n惊恐的上班族们想要逃跑，却只能眼睁睁的看着自己的同事被手指夹着，拉出了已经是巨大破洞的窗外。\n“我......我还不想死，救命......啊！”\n连话都没说几句，倒霉的白领就被希瞳丢入口中。伴随着他的惨叫声，他如同一块生肉那般，被巨大的牙齿所碾碎。只有1/100的他，甚至比希瞳的牙齿还要小一些。在她本能的咀嚼之下，骨骼咯啦咯啦的被碾碎，体内的一切都被挤出，然后再被唾液混合，被舌头推挤到了一边。\n“怎么样？死的很干脆吧？”\n希瞳再次张大嘴巴，让各位得以看清那倒霉蛋的死法。在大家被这番画面震惊到说不出话的时候，她的另一只手也深入大楼之中，将一个又一个的幸存者拉了出来，丢到了自己的手心之中。\n“嗯......不错？光是吃掉一只小家伙的话还是不够解馋呢？”\n希瞳这样说着，将手掌斜向了自己张大的巨口。在不断地惊呼之中，小人们想要朝着手掌的另一侧攀爬着，却抵挡不过地球的重力，滑落到了她的嘴中，如同跳跳糖一般在她的舌头之上蹦跳了几下。\n几十只本该有着美满生活的小虫子......就这样化作了女仆的解压零食。\n在旁人的围观之下，那双雪白的皓齿逐步落下，将想要挣扎着逃出生天的小人拦腰斩断。伴随着少女不清的咀嚼声，口中的求救和挣扎几乎瞬间断绝。就算是得以逃到牙齿下方，得以不被几下斩断粉碎的小人，也被那巨龙一般灵活的舌头推挤着，成为了上下牙齿之间的亡魂。\n“嗯~嗯~”\n伴随着鲜活的生命成为了自己的食糜，少女发出了满意的轻哼。咕咚一声，便将这些人类化成的看不清样貌的血肉，混合着口水一同咽下。\n“真是美妙呢，没想到这么久过去你们的味道已经变好了许多呢？”\n少女对着楼内的幸存者微微笑着，但大家却只能注意到她洁白的牙齿，已经沾满了同类遗留下的，可怕至极的暗红色血肉。\n“但是你们剩下的小人，可就没那么幸运了呢~”"
 gts_hitomi.112.title:"12绝赞一击"
 gts_hitomi.112.a.desc:"伴随着希瞳的轻哼声，她转过身弯下腰来，将自己圆润的屁股对准了这座还在勉强支撑着的大楼。\n“既然你们得以有幸存活到现在的话，那么......”\n少女的巨大臀部，轻轻的在风中晃动着。洁白的胖次，也因为刚刚的玩弄湿润了一小片。肉肉的大腿，肉肉的屁股，在外人看来是极具诱惑力的情色，对于残留的小人，却怎么也想不到自己竟会惨死在这番美景之下。在那巨大臀部一次又一次的撞击之下，本还顽强地保持直立着的大楼，在少女一次又一次的撞击之下逐渐弯曲变形，最终，被可恶的女仆的肥硕屁股一下撞断，将整个建筑化作了尘烟。\n“呼......你们想的比我坚强不少吗？不过，就这点本事了吗？”\n少女的脚底抵着残余的半截大楼，用力一踢，将大楼本事连根拔起击倒在地。再度转过身来的她，也没有刚刚的那番挑逗，仅仅是来自鞋底的两脚重踏，便彻底的将自己刚刚还在玩弄的这“玩具”，化作了残破街区之中的两只巨大的脚印。\n“呼......接下来又是什么呢？好期待啊，发展了千年的小小人们，能怎么反抗我这个巨大化的女仆呢......”"
 gts_hitomi.113.title:"13"
 gts_hitomi.113.a.desc:"一千七百多米的希瞳可爱的坐在城市之中，无聊的寻找着自己的下一个目标。\n“你们真是太弱了~抵抗也抵抗不了，逃，又能逃到哪里去呢？”\n希瞳轻轻晃动着自己的双脚，像是碾碎蚁群一般，不断地用自己的脚跟砸入小人的街道之中。人群如同无头苍蝇一般在她巨大的身躯之下四处奔逃着，而希瞳不过是用脚跟轻轻砸下，就能将几十个人的人群连同周围的大楼，一起用自己那厚实的长鞋跟碾作尘土。\n“完全没意思呢......没办法，只能让你们提前感受一下了呢？”\n这样说着的少女，无趣的用指尖勾上了自己的鞋跟。伴随着一股浓郁的气味笼罩大地，希瞳那有些发黄的白丝从那双洛丽塔皮鞋之中被抽了出来。伴随着一股浓郁的气味，那些躲藏在楼宇和地下的小人都不由得的捂住口鼻。\n“嗯哼？你们难道不觉得这股臭味很美妙吗？”\n用手指捏住自己的鞋帮，希瞳稍加思索，便将自己巨大的鞋子看似随意的丢出。在轰鸣之中，那巨大的鞋子重重的倒在城市之中，滚动翻转的鞋身将逃命的小人，连同繁华的街区一同压扁。只留下了那高墙一般的，还粘着各种建筑小人以及汽车残骸的脏污鞋底。\n“呵呵？就这点本事吗，那，另一只鞋子也请你们保管好哦？”\n巨大的鞋子，即使看起来只是朴实无华的高跟洛丽塔鞋，但在千倍的大小下，依然有着毁天灭地的重量。重重落地的鞋子，竟然勉强维持了自己的直立。屹立在城市之中的鞋子，即使与这个城市最为高耸的建筑物比起来都颇为庞大。而那些曾经能让希瞳好好玩弄的商场和居民楼，如今也不过是她脚趾大的无趣建筑物罢了。\n更为巨大化的她，此刻需要更为有趣的建筑来好好发泄一通。\n“嗯？居然全部逃到这里了吗？是等着我把你们一块扫除掉吗？”\n左右扫视着的希瞳，忽然在一片无趣的灰色建筑物里发现了什么。"
 gts_hitomi.114.title:"14"
 gts_hitomi.114.a.desc:"“真是......有不少呢？”\n少女转过身来，巨大的双腿横跨了数个街区，一左一右的砸在体育场的旁边。场内残存的上万人......还以为自己已经躲过了少女的视线，再度抬头，迎接他们的却是少女的坏笑，以及她正在轻轻晃动着的，那一双大臭脚。\n“呕......”\n此时的体育场对希瞳，究竟是什么呢？这么个建筑物，看起来也确实能让希瞳踩上几脚，但是玩心大发的希瞳，却不想这么轻松的让面前的小人儿轻易死去。\n“既然你们有幸被我挑中了，那么，可是要好好的来仰望你们归来的......”\n希瞳轻摇着嘴唇，说出了她一直都想说出的那句话。\n“'女神'哦。”\n坐在地上曲着腿的少女，轻轻的抬起了自己的左足。那被束缚了千年的足部，此刻正毫无遮掩的展示在所有人的面前。千年的积怨如同这脚臭一般，泛黄的脚底，以及勾动着丝袜的巨大脚趾，都彰显着这位女仆曾经统治着这个星球的过往。\n“不错哦，你们居然还能逃到这里呢？真不错呢~看看你们的同伴，就没那么幸运了呢？”\n希瞳微微弯腰，用自己的手指指着那些不幸被碾碎并被粘在脚底上的垃圾。\n“小家伙们的城市，还挺多姿多彩的吗？”\n希瞳用手指指着那些粘在自己足底的残骸，一个接一个的吐槽着。\n“看起来你们这些人真是慌不择路呢，不过也方便被我一脚踩扁了耶。”\n有些挑衅的她，一边说着，一边将粘在脚底的各种被碾作铁片的小车揭下，丢在了体育场的一旁。一边耻笑着那些不自量力的，被自己脚跟一脚击碎的人群，一边感受着那胯下上万人对于自己的恐惧和钦慕。\n“嗯？我有说你们可以走吗？”\n忽然间，希瞳看到了什么。那是正在自己足下奔逃着的上百人。就算是被她抬起的左脚阴影所笼罩，却依然侥幸的觉得巨大的女仆根本注意不到自己的存在。只可惜，这样的蚂蚁逃窜，已经杀死了数十万人的希瞳自然是已经习惯了呢。\n伴随着巨大的脚跟在一瞬间砸在人群之中，大笑着的希瞳，将自己的脚跟当作的碾碎东西的杵一般，在那人群之中重重地旋转碾碎着。看着那所剩无几的小人们四散奔逃，杀戮成瘾的她几乎是用自己庞大的力量，将她脚边胆敢逃跑的每一只小人，都用自己的脚跟碾碎成了不分你我的细碎血肉。\n“怎么样？胆敢逃跑的下场......就是这样哦？各位愚蠢的虫子~”\n再次抬起脚的希瞳，她的脚跟正滴落着那人类的混合物。这番残忍血腥的场景，令场内避难的小人们不由得连连后退。"
 gts_hitomi.115.title:"15"
 gts_hitomi.115.a.desc:"看着小人们在自己脚下屁滚尿流的场面，希瞳更是张狂的用脚底抵住了面前巨蛋般的体育馆，用自己的双脚不断地拍动着本就脆弱的避难所。\n“呵呵~你们真是弱小啊？哪里也去不了，反抗又做不了，只能把自己最为不堪的一面暴露给你们的毁灭神来看呢？”\n伴随着希瞳的双脚平铺在场馆的巨大穹顶上，仅剩的不到万人......正体验着身为希瞳脚底的足垫虫一般的待遇。每一口的呼吸，都是将希瞳积累了许久的脚臭吸入肺中的，浓郁到说不出话的臭味。索性，身为巨大女仆的希瞳也还没可怕到光光能用脚臭就能夺走人性命的程度。但在这番黑暗潮湿的足臭折磨之下，纵使是再有生命里的小人，也不得不在希瞳的足下败下阵来。\n“不过，反正你们也已经没啥用处了呢......”\n玩弄尽兴了的希瞳，终于想起来了自己灭杀人类的人物。伴随着盘腿的少女将双脚一左一右的夹在体育场的两旁，就连最为宽广的大街，此刻对于她的小腿来说都过于窄小。而在足心当中的体育场，此时已无人再敢逃跑，宁愿直面被面前这巨大女仆碾碎的命运。\n“哗啦——”\n在双脚闭合的一瞬间，巨蛋一般乳白色外壳的体育馆......便在她的足下彻底的被碾碎。意犹未尽的她，再搓动了几下双脚，直到再也感受不到双脚之间的生命气息才作罢。\n“果然只是一群愚笨的虫子呢？甚至是看到我白丝包裹着的巨大足底，都会害怕呢？”\n完全用双脚灭杀了这“避难所”里的一万小人的她，满意的抬起了自己的一只脚。穹顶和座椅的残骸从她的脚底像碎屑一般抖落，只留下了那些被鲜血浸透了的帐篷，以及成片成片的，曾是小人的红点。\n“没想到你们这些小人这么小呢？还没那些逃跑的家伙有意思呢......”"
 gts_hitomi.116.title:"16"
 gts_hitomi.116.a.desc:"此时的少女，正悠闲的走在城市之中，用释放出来的双足感受着这片许久未见的大地。几乎每一步都能让上千人死去的她，尽情得享受着这座作为女神一般高高在上的快感。那双有些泛黄的袜底，现在已经沾满了小人的尸骸，和建筑的残渣混合再一起，让女仆本该洁白的白丝足底变的脏脏的。\n“怎么样各位~知道希瞳的厉害了吧？”\n纵使是小人们的河流，不过也只是她一步便能跨过的存在。看着满是逃难者的桥梁，本该继续破坏的希瞳，突然转过身来。\n“你们说，既然怎么都是死，那要不试试看这招呢？”\n少女屹立在大桥两边，调皮的抬起了一只脚，用脚趾搭在这没有自己脚底宽的小小桥梁之上。\n“看起来你们真够小的啊？甚至可以是被我一只脚就抓起来的存在呢？”\n话刚说完，少女的五根脚趾便刷的并拢，将小人和桥梁本身都一同抓住碾碎。\n“只是......稍稍的有了些感觉呢？各位？我对你们的反抗不是很满意呢？”\n希瞳不屑的抬起脚来，放开了自己的五根脚趾，任由那些得以在她趾弓之间得以存活的幸存者，和那已经四分五裂的桥梁一同坠下。\n“怎么样？震撼不震撼？你们拍摄我的样子，还没有得到我的许可呢？”\n看着勉强飞到自己身旁，拍摄自己当作新闻报道的直升机，这可爱的女仆也忽然之间正经了那么一下。稍稍地弯下腰去，仔细的用自己红色的眼瞳打量着这架小小的直升机。已经感觉到了危险的直升机正打算飞离，却被少女意外可爱的打了个招呼。\n“你们这群小虫子，居然能做出这座东西吗？真是了不起呢......”\n轻轻摆手的少女卷起的风，就让直升机在自己面前左摇右摆了起来。再度露出自己险恶一面的希瞳，也伸出了自己的五指。\n“啪——”\n本来还在空中勉强维持着姿态的小小直升机，在少女的手中变成了一朵不起眼的火光。\n“呼，果然假正经的日常，只适合主人呢。”\n轻松的解决掉了恼人的小飞虫，希瞳继续散步在城市之中，寻找着自己的下一个猎物。"
 gts_hitomi.117.title:"17"
 gts_hitomi.117.a.desc:"此刻在已经成为废墟的体育场旁，希瞳那巨大的鞋子，还正屹立在已经不剩下几个幸存者的街区之上。小人们终于得以挣扎着，在巨大的鞋垫之上再度挣扎着站起来。被巨量足臭冲晕过去的人们，还在思索着自己究竟是为何会出现在如此宽广，却又如此刺鼻的一片空间之内。作为希瞳被囚禁了千年都未曾脱下的高跟洛丽塔鞋子，棕色哑光的平淡外表之下，却是一片巨大的，留下了希瞳淡灰色脚汗印记的巨大白色盆地。\n“这是......什么地方啊！”\n被困在足臭之中的小人们抬头仰视作为天空的鞋内，却发现自己熟悉的街区早已成为了自己身旁散落着的废墟。忽然之间，脑内便想起了昏迷前自己所听到的，来自女巨人的最后一句话。\n“你们只不过是要被打扫的害虫而已，就这样苟活在我的足垫上吧”\n“——如果你们还能够活下去的话”\n忽然之间，他们记起了自己是如何出现在这里的。\n巨大的希瞳，那时正刚刚将满是幸存者的体育场，化作自己白丝之上的一抹脏污。\n“至于你们，剩下的小家伙，还得有人来好好服侍我这个女仆吧？”\n“千年来一直都是我在帮助你们，你们可要想办法回报我啊。”\n这么说着的希瞳，蹲到了自己的洛丽塔鞋旁边。双脚下意识的掂在城市之中，一边说着，一边找寻着自己的目标。\n“各位小虫子的建筑，都还没我的鞋子高呢？”\n少女一边坏笑着，一边将自己的手伸向了那些在自己身旁的，误以为少女已经忽视了自己从而停下脚步的幸存者。幸存着们还想要奔逃，却被从脚下传来的巨大震荡所击倒，目睹着少女的手掌插入地底，将自己连同街区一同挖起。看着面前打量着这片小人街区的希瞳，小人们慌张的趴在已经布满裂纹的街道上看着面前的巨大猫娘。\n“不如这样，既然你们住的这么差，不如就宜居到我暖和的鞋垫上来吧？”\n希瞳微微的笑着，便将小人的街区，如同一捧沙子那般倒入了自己的鞋中。\n建筑在空中逐步碎散，如同沙尘暴一半击打着留下了她巨大足印的鞋垫。但幸存者们却被这温热柔软的鞋垫所接住，如同蹦床一般在这本该洁白的大地之上蹦跳几下。\n然后，便被少女那温热的足臭包裹，失去了自己的意识。"
 gts_hitomi.118.title:"18"
 gts_hitomi.118.a.desc:"“嗯？明明是这么无趣的城市，居然还有这么细长的东西存在吗？”\n从刚刚的幻想之中脱身，漫步在城市之中的她忽然之间发现了什么有趣的东西。那是一列满载着小人的电车，正穿行在自己脚下的城市之中。\n“嗯哼？这样就以为自己能逃脱了吗？”\n巨大的希瞳挑衅的说着。在列车内乘客们不断感受着传来的巨大震动和轰鸣越来越近之时，突然，随着一声惊呼，列车后方的大楼，猛地被希瞳的脚趾所戳破。来时的铁道变成了希瞳那脏污的白丝脚掌，小人们勉强的挤在窗边望向天空，却只能看到希瞳那逐渐落下的，灰暗无比的脏脚底。\n“轰隆！”\n伴随着少女的脚尖挑逗性的砸到城市之中，本在大楼间疾驰的电车，如同一条蚯蚓般被希瞳轻松地踩住。银色的车头，在少女的脚下也如同那些不幸粘在她足底的汽车一般，成为了少女眼中的又一个垃圾。不过，我们的希瞳小姐，却想出了别样的羞辱方式，她慢慢的蹲下来，仔细打量着那互相撞在一起的，脱出轨道的列车。\n“如果......是这么小的列车的话......或许可以？”\n想到接下来将会发生什么的希瞳，忽然脸颊泛红了起来。虽然说出来颇为不堪，但一想到小人们接下来将要体会的事情，她就不由得窃喜了起来。\n“是......非常符合你们命运的事情呢......嘿嘿”\n小人的列车被从她的脚底捏起，双目扫视着那些勉强挂在车厢之中，紧紧的抱着立柱和扶手的小家伙们。\n“希瞳......接下来可是要带大家去一个地方呢？可不要被吓的屁滚尿流哦？”\n巨大的女仆猫娘顺势趴在城市当中，半趴着的上半身，将小人的列车夹在半空之中晃悠。\n“各位，可要像女仆一样，尽责地清扫我的身体哦~呵呵~”\n伴随着裙摆的掀起，少女的内裤一览无遗。已经湿了一片的白色胖次，被她的另一只手轻轻褪去。将天国和地狱，一同展现在了这些不幸的上班族面前。毫无毛发遮掩的胯下，肥厚的臀部之中，展现在小人面前的正是少女的性器和便器，正散发着甜腥和臭味混合着的神奇气味。\n“你觉得，你们配得上怎样的死法呢？”\n“是就这样进入我的阴道之中，还是变成我排泄物的一部分呢？”\n这样挑逗着的少女，将满是小人的电车在自己的两个洞口之上轻轻的晃动着。感受着他们的无能为力，以及那若有若无的，支撑不住的小人坠亡在自己圆润臀部上的感觉。\n其实已经想好了小人们耻辱结局的她，还是将列车缓缓的伸向了自己的便所，那个如同菊花一般微微张闭着的肛门。\n“不行，得忍住......”\n冰冷的列车轻轻搭上温热的肛门，便让少女不由得冷的一抖。扭动着的身体，下意识的又将身旁那些街区卷入其中。少女恼怒地强扭过身来，将自己的一瓣肥臀慢慢的掰开。\n“不行，说让你们怎么死你们就得怎么死，哪能便宜了你们......”\n收到刺激的菊穴再度张开，留出了那只有千分之一大小的玩具可以进入的通道。伴随着希瞳体内伸出那散发着的臭味沁入车厢，纵使已经是在生命的最后关头，不少人也顾不得体面，尝试逃出这死亡的地狱。\n“不行啊你们，只是闻到了一丝气味就完全忍受不住了吗？这样的废物小人......”\n长长的列车被如同细线一般，吞入暗无天日的恶臭地狱之中。再伴随着那巨大少女的本能，被下意识的夹断挤压，每次都将吞入的上百人，化作自己日后排泄物的一部分，吞入自己的直肠之中。\n“可惜了，早知道趁自己还没那么大就好好享用享用你们的......”\n这样想着的希瞳，悠闲的将自己手上残留的最后几节列车，一同让肛门夹碎。\n“只可惜，你们小人所制造出来的玩具，还是有点不够我玩呢？”\n抱怨着的希瞳再度站起，将身上的尘土全数扫净。\n“千倍的玩弄快腻了，也是时候来点刺激的呢？小家伙们，做好准备了吗？”"
 gts_hitomi.119.title:"19"
 gts_hitomi.119.a.desc:"稍微走了几步路，希瞳便到了自己的目的地——\n这座城市最为繁华的街区，那些曾经比百倍的她还要高上不少的建筑物——此刻，正在她的双足之下，颤抖在她脚步的震动之中。其实希瞳最想要好好欺负的，是正屹立在这些摩天大楼之中的，五百米高傲立群雄的巨大高塔。当然，就像猫咪一开始并不会直接对猎物一击毙命那般，她正决定将千年苏醒来的第一次自慰尝试，赐予这片依靠榨取自己能量才得以如此繁荣的街区。\n“怎么？到现在都没有逃完吗？是正期待着，能够将自己的生命当作我快感的燃料吗？这样的话，感谢大家等女仆等的这么久了呢......嗯?”\n巨大的希瞳忽然之间伸出手来，仔细的打量着这些高楼。\n“不错嘛，你们人类称呼这个叫什么?摩天轮吗？”\n巨大的希瞳挑衅的抬起脚来，用自己灰黑的脚底对着小家伙们打起了招呼。\n“本来想着直接消灭你们的，不过，果然还是品尝你们的绝望最有意思吧？”\n这样说着的希瞳，玩弄的在小人们的面前，毫无保留的展示着自己的战绩。\n“大概有近一百万人惨死在我的足底了呢……既然你们修建这种东西就是为了观光，那么就不如参观参观我的脚底吧？”\n轻晃着的双脚，正散发着难闻的气味——少女的脚臭，城市的污泥，小人的尸骸，混合在一起，形成了令人作呕的腐臭气味。那些被困在摩天轮之上的小人们，被这股气味所侵袭，纷纷绝望着拍打起了门窗，想要逃离这希瞳的足底地狱。\n“没关系的，希瞳作为各位的好女仆，很快就会帮各位解脱的啦~”\n邪恶的巨大希瞳，将脚趾轻轻的搭上了有着她小半只脚高度的摩天轮。那一个接一个的轿厢，便在金属框架的呻吟垮塌之下，被希瞳的脚底轻易的拍碎，在好好的欣赏完了系统脚底那被拍扁的城市遗迹之后，也一同被希瞳的脚底所消灭掉了。"
 gts_hitomi.120.title:"20喷水女仆"
 gts_hitomi.120.a.desc:"“所以，剩下来的各位小家伙们，可不要像这些笨蛋一样无知呢……希瞳~会心怀感激收下各位卑微生命的~”\n伴随着希瞳的宣言，巨大的希瞳，屹立在这座城市残存的天际线上，从湿透了的胖次上滴落下来的爱液，已经如同暴雨一般先行一步，给那些困在大楼里的小人们一点小小的巨娘震撼。\n“既然大家都逃不掉的话，那我可要好好得评鉴一下各位的生命，究竟可以承受多少来自希瞳的爱呢？”\n巨大的希瞳，轻轻的将臀部坐在城市之上。伴随着那一丝胖次被少女揭下，少女端详着，滴落着爱液的白色系带胖次。\n“总感觉光是我的胖次的话，就能把你们全歼了呢~不过，既然各位都自愿被我用掉的话，作为各位的巨大女仆，可不能就这样让各位这么无趣的死去呢......”\n正说着话的巨大希瞳，却被突如其来的蚊虫们所骚扰。匆匆赶到的小人机群，如同撒粉一般将各式炸药丢下，试图从希瞳的邪恶猫爪之下拯救自己的子民。\n“不错吗？居然没有想着玩谋略，而是希望正面击败我吗？有点意思喵？”\n刚好找到了自己目标的希瞳，紧接着就将自己手中的胖次甩了出去。\n“希望你们喜欢女仆的胖次哦？只希望你们的先进武器不要就这样被我全歼了呢......”\n铺天盖地如同蝗虫一般的机群，被更为巨大的少女胖次，轻而易举的捕获。纵使是千余架飞机组成的庞大波次，也终究不敌一位千倍少女正滴着爱液的内裤。伴随着飞机的残骸和胖次一同落地，干净利落的消灭了反抗军的希瞳，终于能将自己的玩弄欲望，尽数发挥在双腿之间的繁华街区上。\n“你们的大楼现在真的挺小啊~，要多少才能填满我的阴道呢~”\n希瞳坏笑着，另一只磨蹭着小“鲍鱼”的手，将已经等候多时的阴唇，展现在小人们的面前。被拿起的大楼布满了裂纹，被爱液蒸汽所晕染着，感受着那些小人从挣扎再到彻底绝望的过程，希瞳舔了舔嘴角，便将各位受害者们，送入了自己的外阴之中。伴随着阴唇逐渐的合拢，再张开，上百人的生命所能带来的，不过是那些建筑被自己本能所挤压破碎的酥麻感而已。\n“还不够......一点都不够呢？”\n伴随着越来越多的建筑物和人类被送入她的阴道之中，不断分泌出的爱液逐步将那些在建筑残骸之间得以幸存的小人们，化为一滴又一滴巨大而又粘稠的琥珀。本该晶莹剔透的爱液，此时却因为混杂了小人的浮肿尸体，和各种建筑的残骸变的浑浊不堪。\n“该说，虽然是千年以来第一次，但是你们的抵抗......还是有点不能让女仆满意呢......”\n明明是该完全靠击杀敌人的爽快感来达成高潮的希瞳，此时却自顾自的扣了起来。城市当中被当作纪念品售卖的，闪耀着金属光辉和各种网状结构的高塔，被少女轻而易举的连根拔起。\n“不错吗……居然不是一拿就差点碎掉了吗~果然我的眼光还不错呢？”\n希瞳满意的看着手中的高塔。虽然有了点变形，却依然比自己的手掌和脚掌都更为细长。虽然自己已经如此巨大，但是小人们的建筑技艺，显然比他预估的还要更为强大了不少。\n“这么个高塔……就让我看看效果如何吧？”\n作为地标性建筑的巨塔，化作了少女的假阳具，被送入了双指撑开的小穴之中。银白色的天线，在少女那柔嫩的宫颈口上折断。伴随着少女的娇喘，本该优雅华丽的塔身，正被少女的阴道壁所扭曲重塑。伴随着冰凉的塔身在自己的下体之中一抽一插，欲望高涨的她，几乎是用所能触及到的一切小人之物，来满足着自己的欲望。\n性情大发的希瞳，甚至是直接挖起了身旁那些小巧了不少的街区，一同倒入自己下体的“血盆大口”之中。就算是驶过的电车，也被少女一捏抓起搓揉成团，然后，粉碎在了自己的阴蒂之上。如同熟透的果实一般爆开在自己阴蒂上的小人列车，那对少女来说冰凉了不少的列车和鲜血，令希瞳不由得忍不住自己想要喷射出什么的欲望。\n“你们好小……好脆弱……就这样给我献出一切吧！”\n伴随着少女响彻天际的娇喘，终于得以享受这番快感的她却没有好好的管好自己的身体，伴随着巨大的她喷射出的尿液，身体也无法在这番愉悦下控制自己的巨大化能量，原本繁华的街区，被自己不断膨胀着的巨大身体所推平。温热的尿液，则一次又一次的涌出，洗刷着身下本该是城市的造物。\n“如此......失态......”\n伴随着希瞳不受控制的放尿，这座为了控制她而建立起来的城市——彻底的在少女的巨大潮吹之中华为冒着热气的沼泽。恼怒的少女虽然失去了大半意识，却还保留着自己千年以来的愤怒。\n“都是你们！要不是你们囚禁我的话......”\n变化到常人万倍大的她，将所有的过错都归咎于这帮作为敌人的小人文明之上。伴随着巨大的她重新站起，原本应该繁华的城市，现在也只配当她巨足践踏下的小小苔藓。\n“居然能让我如此失态......看我不把你们的国家踩个稀巴烂！”\n如此说着的少女，正开始了自己针对小人文明的猎杀，却被快感所冲晕了过去。"
 gts_hitomi.121.title:"21万倍女仆的坏与好"
 gts_hitomi.121.a.desc:"“果然还是......得让你们好好的满足我呢......”\n从高潮之中逐渐缓过神来的她，正以万倍的身躯躺在这片城市之中。\n她所逃出的研究所，如今刚好已经消失——就在她变大的足跟之下，被她翘起又落下的万倍足跟，一下便砸成了巨大的陨石坑。\n“好久......没这么舒服了......呼......”\n刚从高潮昏厥后反应过来的希瞳，挣扎着坐了起来，然后她便被自己的这番邋遢样所吓到——双腿之间的，还保留着一丝温热的湖泊，明明就是自己的尿液。橙黄的少女尿液，在自己双腿之中的城市之中，产生了一片可以算得上是前二十的城市景观湖。但少女的心思，却不在这场从天而降的尿液海啸究竟消灭了多少万小人，而在......自己双腿的过膝袜上。\n“噫！都怪你们......我的袜子都被弄湿了！”\n抱怨着的希瞳，恼怒的又挖起了一片城市，塞入了意犹未尽的下体之中。\n“就让你们这些变态虫子，才让本女仆变的如此不堪......”\n感受着下体的城市如同沙砾一般慢慢融化在自己的爱液之中，平复了些心情的希瞳抬起了双腿，将自己脚上的丝袜连根脱下，将自己的那一对裸足公之于众。随后，她便站了起来，拍了拍围裙之上因为自己意外巨大化而沾染上的各种城市残骸。\n“那就随你们愿吧~好好的感受一下，希瞳的美妙裸足哦？”\n像是挑衅一般......希瞳用自己的裸足，遮蔽了小人们的天空。\n“听说你们的肉泥包养脚底也是很不错的护肤品呢......算了，你们没那么值得。”\n这样说着的希瞳，拎着自己的一双丝袜，下意识的向着附近的“小池塘”走去，不过，她却突然发现了更有意思的东西——一座机场，并且，还是挤满了人的机场。\n“看起来还挺大的呢......不过，也就是两脚的事情吧？”\n因希瞳的高潮而产生的大量水汽，此刻正凝结成朵朵乌云，降下骚味的雨水。而现在，这阻碍着飞机起飞的小雨，则被“灾害”本人所驱走了。\n“本来还想用你们的水库好好的洗一下自己的袜子的，不过，既然你们刚好想要逃跑的话......”\n希瞳的脚底笼罩在了小人机场的上方，也剥夺了小人们最后一丝求生的可能。伴随着她脚底的晃动，砸下来的大块残渣便如同天上降下了陨石雨一般，袭扰着足底忙乱的机场。似乎只是为了好好的体会下这些所谓“求生者”想要活下去的欲望，希瞳的脚底，没有给那些小人一个死亡的爽快，反而是在寻找着什么。\n一架飞机，一架正在滑跑的小人飞机。\n“哦？是想要逃跑的小人先生吗？不错哦，能在希瞳的脚下存活这么久......现在，还是再给各位一次逃跑的机会吧？只要能逃出我的脚底的话......”\n发动机卷起着水雾，在发动机的前面形成了水雾，巨大的轰鸣响彻足底，努力的将这架飞机推离代表着死亡的少女足底。伴随着阴影一点一点逼近，无论是飞机上的乘客——还是机场里趴在窗户上观察着女仆足底的求生者们——都默不作声的，期待着那家飞机真能做到奇迹。\n本该巨大的飞机，现在却如同濒死的猎物一般，奔逃在她的足趾之下。\n伴随着那带一抹红色的飞机，优雅的抬起机头，或是那代表着神明的女仆忽然间发了一丝善心，抑或是各位小人的祈祷终于见效，在一片寂静之中，那架满载的客机，竟然真的从少女的脚底腾空而起，逃离了少女追赶着的五趾。\n“吗，既然你们这架还没我脚趾大的飞机如此努力，那作为女仆，就暂时放过你们吧？”\n正当航站楼里的大家为这架死里逃生的飞机欢呼雀跃的时候，少女的足跟却忽然之间落下，将刚刚滑到跑到之上，以及等待中的数架飞机，全部用足跟所压溃。\n“怯，你们是不是以为作为垃圾，意外跑掉一个就以为都能像他一样幸存了？”\n“反正你们都要被女仆所‘清理’掉的，不如就在我的足下乖乖就范吧？”\n伴随着希瞳的又一个宣言，那在少女眼中还没有自己指甲长的航站楼，便被少女的脚底如同推土机一般慢慢夷平。或许是少女的恶趣味，就算是分布在机场四处，那些放在露天的飞机和机库，也都没有幸免，被可爱的少女用脚趾，一个接一个的，拍碎在她圆润无暇的指纹之上。\n“本来还以为你们的城市确实没什么意思的，没想到到最后还能让我多发泄几下呢？”\n这样说着的希瞳，满意的抬起了自己的脚底，测过身来观摩着自己脚底之下的惨状。\n“看起来......万倍的我真厉害啊，光是用脚底随便踩踩就消灭了......二十几架飞机呢？比飞虫还要小的你们，真是可悲呢......”\n希瞳满意的放下了自己的脚底，朝着刚刚还看到的水库走去。"
 gts_hitomi.122.title:"22巨大白丝和水库?"
 gts_hitomi.122.a.desc:"心满意足的近乎全歼了那些妄想逃跑的小人之后，希瞳的一脚已经踏在了水库旁，另一只脚则好奇着的，轻轻的探入这片湖泊之中。试探着的少女将湖上无知的小船一起挤扁，令已经是一长串的击杀数字又多了几个无关轻重的小人。\n“总感觉你们的这个东西真是不像样呢？连没过我的脚尖都做不到吗？”\n看着脚下这片虽然勉强能够塞得下自己两只脚，却不过只能打湿自己脚底的水库，希瞳不由得有点小小的生气。不过吗，看着手中的丝袜，希瞳不由得又耍起了猫娘的小聪明。\n“既然足底放不下的话，那就......”\n“给各位小人们，做一杯你们从未见过的，世界上最大的丝袜奶茶吧？”\n伴随着少女的脚底脱离水面，那被少女脚底污染的已经有点浑浊不堪的水库，此刻又要面对着少女那更为庞大的丝袜陨落。\n在丝袜落地的海啸之中，建成了几十年，护佑了一方祥和安宁的水库，被少女的一只脏白丝，轻松的击溃了。巨量的湖水冲过了化为碎屑的水库，朝着下游那当地小有名气的沙滩冲去。巨量的散发着少女脚底恶臭，混合着那些从她脚底脱落残骸的湖水，席卷着那些曾经是一道风景线的游船码头，将原本游人不少的沙漠埋没其下，顺便将旁边那些依靠这不错风景当作卖点的小镇，一同变成了一片散发着少女脚臭的......沼泽。\n她不过只是把自己的丝袜，卷成了一团丢在脚下这小小的“水塘”之中，就顺便毁灭了一处旅游圣地，以及靠此为生的近两万人。\n“不过，只是用丝袜就造成这么大破坏的话......”\n觉得不够折磨小人的希瞳，寻找着自己的下一个猎物。"
 gts_hitomi.123.title:"23巨大女仆和学校"
 gts_hitomi.123.a.desc:"“哼哼~看起来居然都没那么害怕希瞳吗？明明都看到了如此巨大的女仆，居然还不愿意逃跑吗？”\n如此巨大的希瞳站在大学的旁边，即使是可以容纳十万学生的学校，此刻对于万倍希瞳的脚底也未免太小了一些。想着用脚底好好玩弄的她，却发现此时的自己仅仅只是抬起脚来，就发现自己光光是用一只裸足，就足以扫清还滞留在大学里的数万小人。\n“这么小的学校，光是只用一脚踩死你们的话，总感觉太对不起你们的学识了呢？”\n希瞳蹲下身来，仔细打量着脚趾之前的这些“聪明人”们。\n“这么晚才意识到自己的命运吗？果然是读书读傻了呢......”\n端详着那些在校园之中四处奔逃的学生，希瞳用手指，一栋又一栋的戳碎着其中的建筑物。明明是如此优雅的红砖房，可在希瞳那撼天动地的手指之下，却如同沙琪玛一般易碎。有时，希瞳忽然恶趣味一些，便等着其中的小人逃出半数以上，再用自己的手指戳爆他们所在的建筑——当小人们正窃喜于自己的幸存时，再用自己的指尖——一下抹去他们的生命。\n“看起来得好好折磨你们呢......嗯？”\n看着那些尝试躲入体育馆之中的学生们，眼尖的希瞳忽然之间想到了什么。\n“体育馆有什么好躲的~来女仆暖和的袜子里吧？”\n邪恶的希瞳向前挪了挪身体，把自己那只脱下的丝袜展现在了小人们的面前。还冒着少女气息的丝袜，在小人的学校上空微微的晃动着，将少女积累已久的味道散发到大地之上。浓郁的臭味席卷了整座学校，在场的所有人的不禁咳嗽起来。\n“要不，就到我的丝袜里来研学吧？”\n希瞳用手指勾开了自己的白丝袜口，笼罩在满是师生的体育馆上面。想着在丝袜的闷臭之中逐渐招架不住倒在地上的小人们，希瞳的内心便是一阵窃喜。\n“各位看来连自己爬进女孩子丝袜的能力都没有呢……还得女仆亲自接各位进来吗？”\n巨大的手掌挖入地底，将比自己手指稍大一点的体育馆和其他几个建筑都纳入其中。\n“嗯……居然还有图书馆吗？”\n“也罢，你们既然都不了解我的话，那么就到希瞳的丝袜里亲自体验下吧?”\n希瞳轻笑着，将手中的校园倒入自己的丝袜之中。体育馆还是图书馆，都在希瞳的丝袜内壁之上摔散开来。伴随着学生和图书漫天飞舞，其中躲藏的近万人，便都随着重力落到了少女丝袜的底部。在希瞳浓郁的臭味之中了，努力的在有些发黄的丝袜内壁之上挣扎着，但当幸存者抬头仰望之时，一股绝望便映入眼帘——少女正微笑着看着丝袜之中的他们，而这双有着上千米长的袜口，却是自己倾尽所能都无法逃出的囚笼。\n“就这样在我的丝袜里呆下去吧~愚笨的小人们~”\n一边说着，一边看着那些还在四散奔逃的小人们，希瞳便直接用手中的丝袜当作高墙，将大学的校园围在其中。\n“你们还是太笨了——逃到其他地方也会被我碾碎的，不如就在我的足臭之中好好反省吧？”\n巨大的她不屑的抬起脚来，一片又一片的将大学周围所能看到的小人聚居区全部扫平。本来还以为逃到这里就能躲避被希瞳碾碎命运的人们，在希瞳报复一般的双脚扫荡之中，彻底的消逝在了她的足弓之下。\n“果然变大之后，你们这些小人就更经不住玩了呢？”\n已经如此巨大的希瞳，终于是能将城市当作草坪一般践踏的存在。"
