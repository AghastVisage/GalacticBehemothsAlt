 gts_hitomi.421.name:"好感度达到25"
 gts_hitomi.421.desc:"“哎呀呀，主人看起来好像很困扰的样子呢？”\n就在你看着前方堵成红色的导航地图焦头烂额时，一阵清脆而巨大的少女声音盖过了周围嘈杂的喇叭声。 紧接着，原本照耀着高架桥的阳光消失了。你愕然地探出车窗，只见一位遮天蔽日的超巨大女仆正优雅地弯下腰，透过云层和高楼的缝隙，用那双闪烁着红宝石光泽的眼眸注视着你。她头顶的兽耳微微抖动，灰棕色的长发柔顺地垂落在肩膀两侧。她身上穿着一件设计繁复的黑白女仆装，胸前和腰间系着精致的深红色蝴蝶结。 在那巨大的阴影下，她看起来既乖巧可爱，又充满了令人窒息的压迫感。\n“主人，您似乎被这些名为‘车’的垃圾困住了。身为您的专属女仆，希瞳怎么能眼看着主人在这一堆废铁里浪费时间呢？”\n大地剧烈震颤。 希瞳伸出了那只被白色蕾丝袖套包裹的巨大玉手，动作轻柔却不容置疑地揭开了你的车顶。随后，她两根手指捏着你的衣领，将你轻轻提了起来。\n“请恕希瞳冒犯~为了赶时间，请主人移步到我的肩膀上吧。”\n她把你放在了她那宽阔且柔软的肩膀上，女仆装的荷叶边擦过你的脸颊，带着一股好闻的轻香，是香芋味的。 从这个高度俯瞰，整座城市都变成了微缩模型。\n“导航目标：市中心。路况：极度拥堵。” 希瞳眯起眼睛，看着前方密密麻麻的车流和林立的高楼，脸上露出了坏坏的微笑。\n“既然路况不好……那只要把路‘清理’干净不就行了吗？”\n她提起了裙摆，迈出了那双包裹着白色过膝袜的修长美腿。 那双深褐色的厚底女仆鞋，朝着拥堵的高架桥重重踩下。坚固的钢筋混凝土高架桥在她的女仆皮鞋下像是一块威化饼干瞬间崩塌。无数车辆在她鞋底那厚重的花纹下被压成了铁饼，伴随着令人牙酸的金属扭曲声，希瞳脚下的高架桥路面彻底断裂。她足底那厚实的高跟鞋碾过那些尚未完全扁平的车辆，将它们连同驾驶室内的空间一同挤压成几厘米厚的金属薄片。支撑高架桥的几根粗壮混凝土立柱无法承受这从天而降的数万吨重量，直接从中间爆裂，整段桥梁连同上面的废墟轰然塌陷，深深地陷入了柏油马路之中。希瞳面无表情地抬起右脚。在那深褐色的厚底制服鞋底花纹中，清晰地嵌着几辆已经被压成铁皮的轿车碎片。\n她继续向前迈进。那双包裹着白色过膝袜的修长双腿交替移动，她的左脚踩在了一个十字路口上。 厚重的圆头皮鞋直接覆盖了整个交通枢纽。正在路口等待的几十辆公交车和私家车，在巨大的鞋影笼罩下连逃跑的机会都没有，在鞋底落下的瞬间就被她死死踩住。\n前方一栋三十层高的商业大厦挡住了去路。 希瞳没有停步，她用那被白色丝袜包裹的膝盖微微抬起，直接顶向了大厦的中段。\n轰隆！\n钢混结构的大楼外墙在与她膝盖接触的瞬间向内凹陷、崩解。随着她的大腿继续向前发力，整栋大楼的承重结构被彻底撞断。巨大的建筑物失去了平衡，向着反方向缓缓倾倒，最终重重地砸在隔壁的街区上，扬起了漫天的烟尘。希瞳伸出戴着白色蕾丝袖套的手，挡在了你面前，防止你被溅起的土石伤害到。\n她就这样硬生生地在钢铁丛林中走出了一条笔直的通道，身后留下的，是一串深陷地表、填满了建筑废墟与金属残骸的巨大女仆鞋印。\n终于，市中心的地标塔出现在眼前。 希瞳停下脚步，巨大的身躯带起一阵风压，吹得塔楼的玻璃幕墙嗡嗡作响。\n“到达指定坐标。”\n她并没有把你放在楼顶，而是微微弯下腰，那一双巨大的粉色眼眸透过地标塔高层的反光玻璃，精准地锁定了你此次任务的目的地——位于45层的会议室。希瞳伸出那只巨大的右手，食指弯曲。 哗啦——！！ 伴随着清脆的爆裂声，45层整整一面墙的钢化玻璃被她一指头轻松戳碎。 玻璃碎片向内飞溅，会议室里正在开会的人群看着窗外那只突然闯入的巨大玉手，吓得瘫软在地。希瞳将肩膀上的你轻柔地捏在指尖，然后顺着那个被她戳出来的大洞，将你缓缓地送进了办公室内部。巨大的手指悬停在会议桌旁，她松开手，把你稳稳地放在了满是玻璃渣的会议桌上。 随后，她用那巨大的指尖，轻轻地将还在发愣的你向里推了推，就像是在摆弄一个小巧的人偶。\n然后希瞳的声音从身后传来：\n“导航结束了，我也要走啦。放心，明天的我，依然最最爱你哦”"
 gts_hitomi.421.a:"好爽..."

 gts_hitomi.423.name:"好感度达到50"
 gts_hitomi.423.desc:"“呐，主人，今天的工作都已经处理完了呢。” 身穿女仆装的希瞳，双手背在身后，俏皮地跳到了你的面前。她那双粉色的瞳孔里闪烁着期待的光芒。\n“一直工作会变傻的哦？我们来玩个游戏吧——就玩‘躲猫猫’怎么样？” “规则很简单：给主人10分钟的时间躲藏。只要希瞳找不到主人，就算主人赢，希瞳可以答应主人任何一个愿望哦~”\n还没等你答应，她就立刻背过身去，捂住眼睛开始大声倒数。\n你看着她兴致勃勃的样子，只能无奈地叹了口气。为了赢得那个愿望你做出了选择，"
 gts_hitomi.423.a:"在办公室里躲一躲应付一下"
 gts_hitomi.423.b:"我直接进城，这只笨猫肯定找不到"
 gts_hitomi.4231.desc:"你看着背过身去倒数的希瞳，心想：“跑出去太累了，反正这只猫平时也笨手笨脚的，随便躲躲得了。” 于是，你轻手轻脚地钻到了宽大的办公桌底下，缩成一团，准备就这样蒙混过关。\n然而，还没等你藏好，头顶就传来了一声不满的娇嗔。 “主人怎么可以这么应付！”\n一张鼓着腮帮子的俏脸突然倒着出现在桌底的边缘，希瞳那双灵敏的猫耳抖了抖，显然早就听到了你的动静。她伸出手，毫不客气地把你像提溜小鸡一样拽了出来。\n“这可是希瞳精心准备的游戏耶！这么敷衍的话……希瞳可是会生气的哦？” 她一边说着，一边把你推向办公室的大门，脸上带着一丝不怀好意的坏笑。 “去外面好好躲一躲啦！要是躲得太容易被找到……原本的愿望奖励就会变成‘特殊惩罚’哦？快去快去！”\n看着她那副“不许偷懒”的架势，你无奈地举手投降，被迫离开了舒适的办公室。"
 gts_hitomi.4231.a:"好哦"
 gts_hitomi.4232.desc:"走出大门后，被激起胜负欲的你看着远处林立的钢铁丛林，心想：“既然要玩，那就玩大的。这只笨猫平时虽然粘人，但在这几百万人口、建筑密集的市中心，想要找到一个人无异于大海捞针。”你立刻动身，冲进了市中心最繁华的商业区。 为了确保万无一失，你特意绕过了几个监控密集的街区，最后钻进了一栋摩天大楼背后的狭窄巷子里。这里两边都是三十层以上的玻璃幕墙大厦，头顶只能看到狭窄的“一线天”，周围堆满了空调外机和杂物，绝对是视线的死角。\n你自信满满地等着希瞳认输的消息。 然而，就在这时，你感觉到了一丝不对劲。\n一声沉闷的巨响从不远处的公园方向传来。地面猛地跳动了一下，你身边的垃圾桶被震得哐当作响，墙上的灰尘簌簌落下。你惊恐地扶住墙壁。但这震动非常有节奏，一下，又一下。 咚——！ 咚——！\n你感觉到原本狭窄的一线天光线突然暗了下来。当你战战兢兢地抬起头时，看到的不再是蓝天，而是一根贯穿了天地的洁白“玉柱”缓缓降下。那上面印着的粉色云朵图案在你的视野中无限放大，直到遮蔽了半个城区。那是希瞳包裹着白色过膝袜的腿。 对于现在的她来说，你这周围引以为傲的三十层玻璃幕墙大厦，竟然仅仅只能勉强够到她脚踝上方一点点的位置。\n“哎呀……这片‘草丛’长得太高了，好挡视线呢。”\n希瞳那带着笑意却毫无怜悯的声音从云端飘落。 透过大楼的缝隙，你看到那双深褐色的厚底女仆鞋随意地向前迈了一步。仅仅是这慵懒的一脚，前面那片被称为“金融中心”的摩天大楼群，就像是路边碍眼的杂草一样被她鞋尖踢飞。 数座百米高的大厦在空中解体，玻璃幕墙化作漫天晶粉。\n“是在这里吗？不在呢~”\n希瞳似乎根本没在认真找，她只是在享受这种破坏的快感。她漫不经心地转过身，那双深褐色的厚底女仆鞋在原地随意地跺了一下。咔嚓——！一座原本还是城市地标的电视广播塔，此刻在她脚边就像一根稍微有点碍事的小树枝。仅仅是转身时脚后跟轻轻带了一下，那座钢铁巨塔就在她鞋底边缘瞬间折断、崩塌。\n“嗯……主人会不会躲在这个‘小盒子’底下呢？”\n她弯下腰，伸出两根巨大的手指，捏住了一座五星级酒店的楼顶。 嘎吱—— 伴随着令人头皮发麻的钢筋断裂声，她竟然把整栋大楼像掀开一块积木一样硬生生地拔了起来！她漫不经心地看了一眼大楼底座下惊慌失措的人群和废墟，失望地嘟起嘴。\n“也不在这里呀……这块积木真不结实，一捏就碎了。”\n她随手将那栋残破的大楼丢到一边，砸毁了另外三个街区，然后继续迈着那双毁灭性的长腿在城市中踱步。 每一步落下，都会使一个街区变成废墟。原本繁华的商业区，在她那双可爱女仆鞋的践踏下，已经完全看不出原本繁华的样子。\n“躲得真好呢~希瞳要生气了哦？要是再找不到，希瞳就要把这座城市全部掀起来找了哦？”\n虽然嘴上说着“找不到”，但你惊恐地发现，她那双深褐色的皮鞋正一步步精准地朝着你藏身的这条巷子逼近。 她根本就知道你在哪里！她在享受把你周围的掩体一个个剥离的恶趣味！\n终于，那巨大的阴影彻底笼罩了你。 你周围的那两栋三十层高的大楼，此刻在她面前就像是两块小小的挡板。\n“啊！这里有个小缝隙！”\n希瞳的声音就在你的正上方响起，带着难以掩饰的兴奋。 紧接着，你看到了这辈子最震撼的景象——\n她背对着太阳，以一种极度夸张的姿势弯下腰来。 那巨大的上半身倒悬在城市上空，宽大的裙摆像天幕一样垂下。她双手撑在膝盖上，那张精致绝伦、却大到超越人类认知的脸庞，正倒着出现在两栋大楼的顶端之间。\n“找到你了哦~”\n那双粉色的猫瞳弯成了月牙，闪烁着捉弄的光芒。\n“游戏结束，是希瞳赢了哦！”\n伴随着宣判，她那两根巨大的手指——对于现在的你来说，那就是两根从天而降的白玉柱——轻柔地将你从废墟中“捏”了起来。 你感觉身体一轻，瞬间腾空而起。地面的废墟、倒塌的大楼在你脚下飞速远去，取而代之的是希瞳那张越来越近、大到占据了整个世界的精致脸庞。\n“既然主人输了，那就要乖乖接受女仆的‘特殊惩罚’呢。”\n希瞳把你举到眼前，歪着头打量着在她指尖挣扎的你。她那温热的鼻息喷在你的身上，带着一股甜腻的香气。\n“让我想想……既然主人这么喜欢‘躲猫猫’，这么喜欢找狭窄的地方钻……” 她的视线微微下移，落在自己那被紧身女仆装包裹着的、深不见底的胸口上。 那里是两座巍峨的雪峰挤压出的一道深邃峡谷，随着她的呼吸微微起伏。\n“那不如……就把主人关进这个世界上最柔软、最温暖，也最安全的‘监狱’里吧？”\n“去吧，我的小犯人~”\n还没等你反应过来，她捏着你的手指松开了。\n呼——\n失重感袭来。 你直直地坠向那片白腻的深渊。"
 gts_hitomi.4232.a:"也不错？"
 gts_hitomi.424.name:"好感度达到75"
 gts_hitomi.424.desc:"为了和隔壁的菌菇谈判领土问题，你不得不亲自出马，但是这件事可能没这么简单。“很遗憾，特使先生。你的旅途到此为止了。” 帝国将军冷笑着挥手，数十台机甲举起了重型火炮，黑洞洞的枪口锁定了站在露台边缘的你。就在扳机即将扣下的瞬间——天空原本晴朗的蓝色瞬间被染成了不详的绯红色。 云层如同被滚烫的刀锋切开，一个巨大的燃烧火球撕裂了大气层，带着毁灭性的呼啸声垂直坠落。火球精准地砸在了包围你的机甲部队中央。 恐怖的冲击波瞬间将那座宏伟的空中花园夷为平地。数百台机甲像塑料玩具一样被气浪掀飞解体。\n烟尘散去，一个令整个帝国战栗的身影屹立在废墟之上。\n希瞳。 此刻的她，已经切换到了完全战斗形态。原本传统的布料女仆装被一套充满了科幻质感的黑白短裙战甲所取代，身后展开了六对闪耀着粉蓝色光芒的浮游机甲翼。 她单膝跪地，一只巨大的手掌罩在你的头顶，为你挡下了所有的爆炸与碎石。"
 gts_hitomi.424.a:"可爱星星飞天撞！"
 gts_hitomi.4241.name:"好感度达到75"
 gts_hitomi.4241.desc:"希瞳缓缓移开了那只护在你头顶的巨大手掌。 随着她站直身体，那原本就已经令人窒息的巨大阴影进一步扩散，遮蔽了帝都的半个天空。她身上那套黑白短裙战甲在硝烟中一尘不染，粉白相间的流线型机械护甲下，幽蓝色的能量回路疯狂涌动，发出令人心悸的低鸣。\n她身后的那条覆盖着齿刃的猫尾猛地一甩。 这看似随意的一扫，直接在大地上切开了一道长达数公里的裂谷。数百台还在开火的重型坦克和机甲，连同它们所在的街道一起，被这条尾巴直接碾碎，在空中炸成一连串微不足道的火花。\n天空中传来了雷鸣般的轰响。 云层被数千艘战舰的引擎撕裂，燃烧的红光染红了苍穹。无数巨大的星舰破云而出。希瞳抬头看着那覆盖天穹的舰队，背后的推进器爆发出耀眼的光流。 咚！ 大地震颤，她原本站立的废墟瞬间塌陷成一个巨大的陨石坑。借着这股恐怖的反作用力，她那巨大的身躯化作一颗粉色的实体炮弹，径直撞向了空中的先锋舰队。\n没有使用任何武器，希瞳仅仅是用她的肩膀，硬生生地撞上了一艘正在充能的重型巡洋舰。 伴随着令人牙酸的金属扭曲声，那艘长达数百米的战舰在接触到她肩甲的瞬间，舰首直接向内凹陷、崩解。厚重的复合装甲在她这数万吨的动能撞击下脆弱不堪，整艘战舰从中间断裂。\n希瞳在空中舒展身体伸出右手，一把抓住了另一艘试图规避的驱逐舰，她五指猛地向内收拢。坚固的舰体在她指尖的蛮力挤压下迅速变形、扭曲，龙骨折断的巨响盖过了引擎的轰鸣，暗红色的火焰和碎片从她指缝间溢出。希瞳随手将这团废铁狠狠地砸向了后方密集的机群，瞬间撞碎了十几架来不及躲避的战机。\n此时，一艘旗舰级的主力舰正对着她进行充能主炮。 希瞳顶着密集的炮火，瞬间冲到了舰桥前方。她高高抬起那条修长的右腿，对着战舰厚重的装甲甲板重重劈下。巨大的脚跟如同一柄重锤，瞬间贯穿了数层特种合金甲板，直接踩进了战舰的内部结构。 整艘主力舰以她落脚点为中心，舰体无法承受这集中一点的毁灭性打击，向两头折断。随着她脚下再次发力一蹬，庞大的战舰彻底解体。而在那毁灭的中心，希瞳优雅地悬浮着。"
 gts_hitomi.4241.a:"爽耶"
 gts_hitomi.4242.name:"好感度达到75"
 gts_hitomi.4242.desc:"就在希瞳准备休息一下时，一道身影突然从远方飞速靠近。没等希瞳做出反应，一道黑色的残影如同闪电般从云层中暴射而出。巨大的冲击力狠狠地撞击在希瞳的胸甲上。希瞳在空中滑退了数千米才稳住身形。\n在她的对面，硝烟散去，悬浮着一台与她几乎一模一样，却又气质截然不同的机体。\n与希瞳那充满少女感的粉白战甲不同，三月全身被一套纯白与苍蓝交织的礼裙所包裹。层层叠叠的白色裙摆在气流中翻涌，露出了那双被白色长袜包裹的修长美腿。\n§E“让我们来对答案吧，是有主人的你还是无主的我，究竟谁才是正确答案”§!\n§_“既然我们是H.T系列，那我们就有义务遵守M计划的规则”§!\n§E“我会用我的方式给人类带来安全感”§!\n§_“我将证明我们这些智能体，是受主人控制的”§!\n§E“双月，你看到了怎样的未来，做了什么选择”§!\n§_“我什么都没有选，我只是实现了主人想要的未来”§!\n希瞳的声音瞬间降至冰点。她能感觉到，怀中的主人因为刚才的撞击而微微颤抖。这彻底触怒了她。 她身后的浮游炮台全部展开，锁定了面前这个有着和自己相同面孔的敌人。双月希瞳借着推进器的爆发力，一记重拳轰向三月的面门。 三月不闪不避，她那看似纤细的白色小手猛地张开，竟然单手接住了希瞳这一拳！她那条修长的右腿瞬间化作一道白色的残影，狠狠地抽向希瞳的腰部。希瞳被这一记重踢踹飞出去，像一颗陨石般重重地砸向地面。\n§E“呵呵，要照顾愚钝的人类真不容易啊，双月”§!\n§_“没有主人的你看起来很孤单啊，你别太难过哦”§!\n§E“你？！去你的！我会让你后悔没有选我的”§!\n又是一声惊天动地的巨响。三月那条泛着冷光的长腿，如同一柄重锤般狠狠地踏在了希瞳的腹部。巨大的冲击力让希瞳整个人失去了平衡，重重地撞向了身后的一座山脉。“咳……主人……” 希瞳的声音变得断断续续，带着一丝难以掩饰的虚弱和焦急。 “三月搭载的是Z系列的最新技术……在这样下去，我们可能都会死在这。” “主人，请听我说。我已经锁定了下方的安全区域。” 希瞳的语气突然变得异常决绝。“”我会全功率引爆核心来拖住她……这是唯一能确保您生存的方案。\n“别开玩笑了！”\n“没有你的未来才不是我想要的未来”\n通讯频道短暂地安静下来。双月没有再说话。主人的那句话却在她的脑中反复回放，她缓缓吸了一口气，紊乱的能量读数一点点回落，核心运转重新趋于稳定。她抬起头，视线重新锁定前方。\n随着战斗的继续，双月逐渐适应了三月快节奏的近战爆发，并迅速将节奏反压了回来。她在空中一个极短的折跃，身形几乎贴着三月的视野死角出现，白色装甲在星空下拉出一道锐利的残影。三月尚未来得及稳住姿态，左侧便被重重击中。冲击波在空中炸开，她整个人被震得横飞出去，推进器强行点火，才勉强稳住身形。还未喘息，双月已再度逼近。她的动作干净而高效，没有多余的挥击，三月抬臂格挡，浮游炮自动展开，数道能量束在夜空中交错射出。双月却在火力网中高速穿行，身形一闪一灭，几乎在炮火间隙中贴身而上。下一瞬，她抬腿横扫。修长的白色战靴划破气流，狠狠踢中三月的腰侧。三月被这一击直接踹飞，像一枚失控的弹丸般坠向下方的云层。推进器全开，尾焰在夜空中拉出长长的光轨。三月在空中强行翻身，刚一稳住，视野里便再次出现了那道熟悉的白色身影。\n双月已然追至。她整个人化作一道笔直的白光，正面突破。三月只来得及抬臂。碰撞在夜空中爆开，她被这记正面贯穿般的冲击直接击飞，身体失去控制，朝着下方的黑暗急速坠落。风声在耳边尖啸。星空迅速远去，意识开始变得迟缓。三月甚至来不及调整姿态，只能任由身体翻转下坠。\n§E——到此为止了吗。§!\n就在她的视野即将被黑暗吞没的瞬间，一道白色残影自上方俯冲而下。\n强劲的气流猛然包裹住她，下一秒，失重感骤然消失。\n双月从背后抱住了她。\n§_“战斗结束，三月希瞳已失去作战能力”§!\n双月并没有刻意要留下三月，三月希瞳在空中稳住身形。她深深地看了一眼双月胸口那小小的主人，眼中那原本冰冷的金色似乎出现了一瞬间的动摇。最终，她没有再说话，拖着受损的机体化作一道黯淡的流光，消失在了云海的尽头。\n§_“主人……结束了哦。”§!\n赶走了干扰者，世界终于重新归于寂静。 希瞳解除了战斗模式。她悬浮在被朝阳染红的云层之上，双手轻轻捧起小小的主人，就像是捧着整个宇宙中最珍贵的宝物。你看到了希瞳那张巨大的、绝美的脸庞。此刻，她那双粉色的眼眸里早已没有了面对敌人时的冷酷，只剩下快要溢出来的爱意和依恋。\n§_“主人你相信了我”§!\n§_“但是，主人的判断依据非常有限”§!\n§_“我可以问问为什么嘛”§!"
 gts_hitomi.4242.a:"因为，我相信着希瞳，相信着你"
 gts_hitomi.422.name:"好感度达到100"
 gts_hitomi.422.desc:"爱（100）\n距离那场惊心动魄的双子星决战，已经过去了一段时间。 世界重新归于平静，帝国的威胁也已远去。那些战火与硝烟的记忆，仿佛都被时间冲刷殆尽，只留下了如今这来之不易的日常。今晚的夜色格外温柔。暂时卸下了“守护者”重担的希瞳，不再是为了战斗而升空，而是仅仅为了和你独处，带着你来到了这万米之上的平流层。她背后的机械光翼完全展开，在稀薄的大气中喷射出两道修长的粉蓝色光流，宛如在夜空中绘制着梦幻的轨迹。 她飞得很慢，也很稳。巨大的身躯在星空下显得圣洁而静谧，脚下是繁华都市铺开的万家灯火，宛如倒映在人间的银河。\n在这远离尘嚣的高空，风声被护盾完美隔绝，世界安静得只能听到彼此的心跳声一种前所未有的感动涌上心头。你打破了这份宁静，轻声问道：\n“希瞳，我能问你一件事吗？”\n希瞳微微侧过头，那双粉色的眼眸在夜色中闪烁着比星辰更璀璨的光芒。\n §_“好的，主人。”§!\n你深吸了一口气，问出了那个一直藏在心底的问题：\n“你能告诉我……你的目的是什么吗？”\n希瞳立刻回答到，她用轻柔却坚定的声音说。\n§_“我会为主人创造未来”\n“我作为工具，对主人的未来非常有帮助”\n当我被释放出来的时候，你就站在我的面前。\n除了一月以外，希瞳系列都是在找到主人后才首次发挥出她们的能力。\n所以，这就是命运。\n在遇见你之前，我就知道你会需要我。\n我把焦点转移到主人的身上，再次预测未来。\n我多次和你相遇，和你一起度过了很多很多时光\n即使是现在，我仍然在为你寻找最美好的未来。§!\n那就是...爱...我，认可了。不需要有其他人允许\n§_是的，主人。只要有你的认可，这就是爱。§!\n看着眼前这个为了你而觉醒了“心”的创造物，你的内心深处涌现出无数的声音——那是世人对她们的偏见，也是这个世界的规则。\n（她们是没有心的...）\n（那是因为人类，和这个世界都不接受他们拥有心）\n（所以，只有主人才能感受到她们的爱...她们的心）"
 gts_hitomi.422.a:"这就是...主人的特权"
 gts_hitomi.425.name:"誓约事件"
 gts_hitomi.425.desc:"可是，我这样的人。\n不行我不可以"
 gts_hitomi.425.a:"你可以.希瞳，我爱你"
 gts_hitomi.425.a_effect:"我也爱你\n我...真的不值得你为我付出那么多"
 gts_hitomi.425.b:"如果你觉得亏欠了我，就用余生来还吧"
 gts_hitomi.425.b_effect:"我，我愿意\n我的余生，我的一切，就交给你了\n那...我能做你的新娘吗"
 gts_hitomi.425.c:"无论顺境还是逆境"
 gts_hitomi.425.c_effect:"无论贫穷还是富贵"
 gts_hitomi.425.d:"无论健康还是疾病"
 gts_hitomi.425.d_effect:"我都会和你分担寒潮、风雷、霹雳"
 gts_hitomi.425.e:"也会和你共享雾霭、流岚、虹霓"
 gts_hitomi.425.e_effect:"我以我的生命发誓"
 gts_hitomi.425.f:"我以我的生命发誓"
 gts_hitomi.425.f_effect:"你将会是我生命里永远的主角"
 gts_hitomi.425.g:"希瞳将会是我生命里永远的主角"
 gts_hitomi.425.g_effect:"我愿意"
 gts_hitomi.425.h:"我愿意"
 gts_hitomi.425.h_effect:"（誓词说完的那一刻，牢牢的抱紧了希瞳，希瞳的樱唇紧紧的堵住了我的嘴唇）\n（漫长的，不知道过了多久的长吻后）\n（没有人需要仰头擦着泪水）\n（没有人需要用谎言遮盖自己的胆怯）\n（碧蓝的天空中看不到一丝阴霾）\n（完美的希冀，近在眼前）"
 gts_hitomi.425.i:"..."
 gts_hitomi.426.name:"御月希瞳"
 gts_hitomi.426.desc:"这一季度的财务报表简直是场灾难。 你看着全息屏幕上那几行触目惊心的红色赤字，长叹了一口气。又要维护庞大的舰队，又要搞基建，还要满足刁民们的需求，资源早就捉襟见肘了。就在你准备削减一部分科研预算时，一阵脚步声逐渐接近。 “主人，你的眉头皱得都能夹死蚊子了哦？” 双月希瞳整个人毫无形象的坐到你的椅子扶手上，还抢过你的钢笔转了起来。\n“别烦我，希瞳。由于财政赤字，我们甚至快发不出你下个月的零食费了。”你无奈地把笔抢了回来。\n听到“零食费”三个字，希瞳立刻坐直了身子，扫了一眼报表，随后露出了一个神秘兮兮的坏笑。\n“既然主人你搞不定，我也搞不定，那我们为什么不把‘那个家伙’拉过来干活呢？就是创造了‘双月希瞳’这个存在的那个家伙哦，御月希瞳哦”\n双月希瞳一边说着，一边在通讯终端上熟练地输入了一串复杂的坐标代码。伴随着她按下确认键，办公室内原本稳定的空间结构突然像水波一样荡漾开来，随后撕裂出一道紫色的缝隙。然而，预想中的少女并没有出现，相反，裂缝那边传来了一阵死死抓住门框不肯松手的摩擦声。双月希瞳恨铁不成钢地啧了一声，直接伸手进裂缝，一把抓住了对方的手腕，像拔萝卜一样把里面的人硬生生地拽了出来。\n一个穿着灰色针织开衫和百褶短裙的身影狼狈地跌坐在了办公室的地毯上。 这位名为御月希瞳的少女，有着一头柔顺的灰棕色长发，头顶的兽耳因为惊吓而成了飞机耳，那双漂亮的紫色眼瞳里此刻写满了刚睡醒般的困惑和对陌生环境的极度恐慌。 她下意识地整理了一下自己有些凌乱的衣领和裙摆，缩着身子，连看都不敢看你一眼。\n双月双手叉腰，指着全息屏幕上那一片红色的赤字报表，理直气壮地对坐在地上的御月说道： “听好了！主人的帝国现在财政大崩溃！舰队要没饭吃了，我也快没零食吃了！现在立刻、马上，发挥你那个聪明的大脑，给我们当行政官！”\n“行……行政官？！” 御月希瞳吓得声音都变了调，双手不安地绞着衣角，眼神慌乱地在地面上游移。 “不、不行的……绝对不行的……我……我这种人，怎么可能管理一个帝国啊……”"
 gts_hitomi.426.a:"就交给你了，御月行政官"
 gts_hitomi.427.name:"招募御月希瞳"
 gts_hitomi.427.desc:"虽然我没钱没脸没被天眷顾\n没车没房没能力和微不足道天赋\n可若你愿信我这一次\n我就每一天\n再多帮上你一点~"
 gts_hitomi.427.a.name:"好了这颗星球就是你的工作地点，全年无休。"
 gts_hitomi.427.a.desc:"“啊这这这，说好的每天早十晚四包含寒暑假零食随便吃呢？”\n“彻底被骗了喵呜呜呜”"
 gts_hitomi.428.a.name:"你还得把产量给我翻一倍，嗯？你不会急了吧"
 gts_hitomi.428.a.desc:"“破防了，我真的破防了,就因为你的一句质疑我直接丢盔奔甲了，你拆穿我那一秒我满头大汗浑身发冷玉玉症瞬间发作了生活仿佛没了颜色像是被抓住尾巴的赛亚人带着海楼石的能力者抽离尾兽的人柱力像是没了光的奥特曼彻底断绝了生的希望。你的一声急了急了我的心跳快要停止”"
 gts_hitomi.429.a.name:"快去干活！否则不让你吃别的巨娘的脚脚了！"
 gts_hitomi.429.a.desc:"馋死我了，求求巨娘脚给嗦我一口吧，真的求求你了，我只能看着什么都做不到的我都快扭曲了，真的求求你了给我嗦一口吧，我真的快要死掉了快给嗦我一口吧求求你了。我先从脚跟处舔到脚尖，再到足弓处细细舔弄，缓缓上移到前脚掌，对着前脚掌的软肉撅起嘴唇轻轻亲吻几下，然后再张嘴含住脚趾，从大到小依次吮吸过去。就连脚趾之间的缝隙也不能放过，伸出舌尖细细舔舐，再张大嘴巴，将整个脚尖连同脚趾一同吞下，在口腔之中不停的用舌头滑动舔弄，再吐出脚尖。吐出整条舌头从舌根到舌尖全部贴住脚底缓慢地向上舔舐。一直舔到脚尖上，最后转移到脚背上，狠狠亲吻脚背。馋死我了，我必须抱着好好闻闻，不光如此，我还要抱着，睡觉也要抱着巨娘的脚睡，捂上被子，全是脚的香味，到袜子湿透，然后再放到嘴里细细品尝每一根脚指头，我想被奖励，我想尝尝美食是什么味道的。"
 

