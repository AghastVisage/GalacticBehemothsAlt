 gts_hitomi.214.title:"嘻嘻，反杀失败"
 gts_hitomi.214.desc:"希瞳哼着不成调的小曲，迈着轻快的步伐回到了自己的办公室。她并没有急着脱鞋，反而甚至有点享受那种脚趾缝里空荡荡的感觉—— 嗯？空荡荡？\n希瞳愣了一下，下意识地隔着鞋面蹭了蹭脚趾。 刚才那种夹着软绵绵物体的充实感……什么时候消失了？ 那只粉毛狐狸呢？难道被被踩化了？ 希瞳心大地耸了耸肩，舒服地伸了个懒腰，正准备好好休息的时候\n“你觉得……很爽是吗？”\n一个冰冷刺骨的声音，毫无征兆地从办公椅的高耸椅背后面传来。 那声音离得极近，湿热的吐息甚至直接吹拂到了希瞳敏感的猫耳绒毛上。\n希瞳的身体瞬间僵硬，全身的寒毛在一秒钟内全部炸起。 她机械地、一点一点地转过头。 视野中，林凤正趴在椅背上，那双粉色的桃花眼弯成了一个极其危险的弧度，嘴角挂着让人毛骨悚然的微笑。她身上别说伤痕了，连一滴汗水都没沾上，整个人干爽、整洁，散发着一股淡淡的清香。\n“我问你话呢，小猫咪。” 林凤伸出手指，轻轻划过希瞳惨白的脸颊。 “把我塞进臭烘烘的鞋子里踩着玩……很爽，是吗？”\n希瞳本能地结巴着回答： “是……是……是的吧……”\n空气凝固了半秒。 林凤嘴角的笑意瞬间扩大。\n“那——你就一直爽去吧。”\n伴随着这句判决，林凤猛地抬起手，掌心凝聚起粉色的魔力光辉，试图将眼前这个不知死活的猫娘直接缩小成微尘。 然而—— 一秒钟过去了。 两秒钟过去了。希瞳原本紧绷的身体放松了下来。她慢慢地扭过头，看着趴在椅背上、保持着施法动作却一脸懵逼的林凤。希瞳的嘴角逐渐上扬，露出了一个不怀好意的笑容。\n“你的法术不奏效了？怎么回事呢？”\n“哈哈哈，在我的地盘上还想使用魔法？” 希瞳凑近林凤那张沾满自己汗水的小脸，戏谑地说道： “那也太小看我这个科学侧的巅峰之作了吧？”\n“什……你放开我！这算作弊！” 林凤惊恐地挣扎着，但下一秒，她只觉得身体一轻，一道蓝色的光束扫过，曾经吞噬星空的粉色狐娘，此刻毫无还手之力地被缩小到了十厘米的大小。希瞳用两根手指轻轻捏住这只迷你的小狐狸，将她放在了自己柔软的掌心。\n“可爱的主人，接下来就让女仆希瞳好好的服侍你吧～”\n她将林凤托在掌心，另一只手缓缓拉开了蓝白运动装胸口的拉链。 随着布料滑落，那被束缚已久的傲人巨乳猛地弹跳而出，白皙细腻的肌肤在灯光下泛着诱人的光泽。\n“现在是午饭时间哦。” 希瞳低下头，看着掌心里瑟瑟发抖的林凤，眼中闪烁着恶作剧的光芒。 “主人准备好接受希瞳的喂食了吗？”\n说完，她用手指轻轻夹住那颗粉嫩挺立的乳头，微微刺激了一下。随后，她将拼命摇头的林凤直接按向了自己的胸口。\n“你……你这个以下犯上的……你怎么敢——呜？！！”\n林凤抗议的话还没说完，整张脸就被埋进了那柔软得令人窒息的乳肉之中。紧接着，一股温热、浓郁、带着甜腥味的白色乳汁如同高压水枪一般，直接灌满了她的嘴巴。\n林凤被迫大口大口地吞咽着，此刻被这铺天盖地的浓郁奶香味彻底冲刷、覆盖。她小小的身体在希瞳的巨乳上无助地挥舞着四肢，但很快就在这过量的“幸福”中迷失了神智。\n几分钟后。\n希瞳将怀里的小东西轻轻放在了办公桌上。 此时的林凤，肚子鼓得圆滚滚的，嘴角还挂着白色的奶渍。她在希瞳这番“悉心呵护”下，彻底失去了战斗力，发出了满足且安详的呼噜声，沉沉地睡去了。\n她趴在桌子上，伸出手指，轻轻戳了戳林凤，眼神中流露出一丝不易察觉的、笨拙的关切。\n“唉……当星球总督还是太累了啊。”\n希瞳轻声呢喃着，手指从戳改为轻抚，拨弄了一下林凤那迷你的狐狸耳朵。\n“看把你累的，也是该让你好好休息一下了。”\n“晚安，主人。”"
 gts_hitomi.214.a:""
 gts_hitomi.216.title:"陨石流星"
 gts_hitomi.216.desc:"巨大的阴影无声地滑过星系边缘。希瞳那早已超越恒星尺度的庞大身躯，静静地悬浮在目标行星轨道上方。她缓缓弯下腰，伸出那只能轻易覆盖整片大陆的右手，向着那颗蔚蓝色的行星抓去。\n巨大的手掌合拢。当她的手指接触到行星大气层的瞬间，云层被粗暴地撕裂，紧接着是地壳，坚硬的岩石圈在她的掌心如同脆弱的蛋壳般发出不堪重负的碎裂声，山脉崩塌，整颗星球被她稳稳地捏在了掌心里。\n希瞳直起腰，将这颗行星像拿一颗棒球般随意地在手中掂了掂。随后，她做了一个标准的投掷动作。伴随着手腕看似轻松的一抖，那颗行星脱手飞出。行星在脱手瞬间被加速到近光速。它的大气层和地表物质在极速摩擦中瞬间熔化，整颗星球化作了一颗燃烧着熊熊烈焰的超级陨石，在漆黑的太空中拖出了一条长达数光分的耀眼轨迹。这颗人造的“流星”笔直地划过星系，最终一头撞入了该星系的中央恒星。\n完成了这次投掷的希瞳，甚至没有看一眼那壮观的爆炸。随意地拍了拍手掌上残留的星尘，便转身向着下一个星系飘去。"
