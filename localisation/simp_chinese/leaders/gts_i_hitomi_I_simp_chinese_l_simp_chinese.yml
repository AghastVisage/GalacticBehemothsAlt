 gts_mitsuki_hitomi_system:"时空狭缝"
 gts_mitsuki_hitomi_star:"你好世界"

 gts_hitomi_anomaly:"未知的求救信号"
 gts_hitomi_anomaly_desc:"“广阔无垠的大宇宙，被寂静环绕的世界之中，既有正走向终结的星球，亦有方才诞生的星球。在这片庞大的星海之中，存在着众多我们还没发现研究的文明......”"
 gts_mitsuki_hitomi_special_project:"追踪三月希瞳的信号"
 gts_mitsuki_hitomi_special_project_DESC:"三月希瞳的 Q 版手办”中隐藏的应急子程序，向我方发送了一处未知星系的坐标。\n一封邀请函，或者说，一份判决书。\n如果我们想要再次见到三月希瞳，就必须抵达那里，并通过她所设下的检测"


 gts_hitomi.1.name:"猫猫的求救信号"
 gts_hitomi.1.desc:"我们正在探索【希冀】时，忽然有人在打盹时，见到了这样一段微弱且模糊的视频影像。本以为只不过是某人的幻觉，没想到在商量之后，却都是几乎同样的画面。画面的中心，是一只栗色的猫娘，正在说着我们听不懂的话语。我们，应该尝试破解这个谜团吗？"
 gts_hitomi.1.a:"去试着破解吧"

 gts_hitomi_digsite:"没有窗户的大楼"
 gts_hitomi_digsite_desc:"经过科研船外围的研究，我们确认了这是一个还没有研发出FTL科技，加入群星大家庭的颇为原始的文明。虽然已经发展出了类似我们早期的科技，却并没有怎么涉及星空。通过对于这颗星球的外围观察，我们并没有发现这颗星球上有什么异于其他文明的东西。但是，随着我们的接近，以及我们的文明翻译器不断地捕获这颗星球所发射的电磁波，那个出现在我们脑海之中的少女正变的越来越清晰，很快，我们也便明白了她那模糊话语的本意。\n救救我。"

 gts_hitomi.2.name:"逐步清晰的面貌"
 gts_hitomi.2.desc:"随着我们的逐步靠近，我们为了避免被土著发现真实意图，伪装成了一颗彗星，不断地尝试接近这颗孕育着不同生命的蓝色星球。虽然从我们截获的情报来看，我们应该不过是被视作了一个有些奇特的天体，我们依然谨慎地不断借着这个星系其他星球的掩护，慢慢靠近着这颗有着一位不断地在梦境当中，尝试和我们联系的少女。\n“请......你们救救我。”\n随着科研船渐渐的靠近，我们也终于有了和少女直接在意识之中对话的能力。我们大致了解过这种灵能感应的手段，却没曾想过能在这个土著星系真正用上过。\n“我是......双月希瞳，你们可以叫我希瞳。”\n“我曾经是这个星球前文明的创造物，现在却被这个星球现文明可恶的小人种族利用，把我产生的能够巨大化的能量全部利用起来......”\n“这个地方，好小，好无聊。”\n“你们，能够帮助我，让我能够脱身出来吗？”"
 gts_hitomi.2.a:"嗯"
 gts_hitomi.3.name:"贸然的营救行动"
 gts_hitomi.3.desc:"我们的飞船如同流星一般，划过了土著星球的天际，却装作被捕获的样子，进入了环绕他的轨道。\n在土著们还在争论我们是外星人还是自然现象之时，为了将这只栗色的女仆猫娘从原住民的魔爪下拯救出来，我们打算冒险一试。\n我们的科学家带领着小队，直接传送到了那城市之下的基地之中。属于这个星球的科学家……惊奇的看着我们的出现，然后，便被我们逼迫着，交出了得以解救少女的钥匙。\n望着熟睡在培养皿中，被束缚着掠夺着能量的猫耳少女，我们不禁惋惜起来。但，就在这时，整个基地的警报都响了起来，看来……"
 gts_hitomi.3.a:"是时候了"
 gts_hitomi.4.name:"破茧而出"
 gts_hitomi.4.desc:"巨大的少女破茧而出，吓得那些赶来围追堵截的士兵呆若母鸡。\n“真的......很感谢你们。”\n淡红色的眼瞳打量着被一同包围的科学家，但她的眼神当中却没有畏惧，相反，能读出的则是满溢的恨。\n后续赶来的士兵如同潮水一般一波波的涌来，巨大的女仆少女则尝试着翻过身来，用自己庞大的身体挡住士兵们的视线。\n“虽然还没怎么了解你们的国家......但是我会记得你们的，不过，在此之前，我还有仇要报呢......”\n在我们的注视下，那位自称希瞳的猫娘少女逐步站起身来，将自己比常人大十倍的身躯压向了那些曾欺压着她的科学家和士兵们。\n“至于救出我的你们，就请......先不要打断我的复仇吧。”\n我们传送回了探测器上，少女则开始了自己的复仇。\n已然狭小的走廊，架在半空的管道和电线被少女轻易的扯断。\n胆敢拦在少女身前的小人，被比自己更为庞大的皮鞋碾作血污。\n失去了从自己身上汲取的能量，这座庞大的基地，同城市一同暗淡了下去。\n重新掌握了力量的少女，则思考着，这个背叛了自己的文明的处决方式。"
 gts_hitomi.4.a:"继续观察"
 gts_hitomi.5.name:"背叛自己的ta？"
 gts_hitomi.5.desc:" “就你，一个了吗？”\n身为女仆的她，在击退了几乎所有的，胆敢阻挡他的士兵们后，将那自己曾熟识的，曾经的“挚友”，但却出卖了自己，成为这个小人科学院院长的他，逼到了墙角之中。\n“我不是故意的！我......真的只是......”\n“真的不是故意的？就凭你能活到今天这个显而易见的事实，还打算继续蒙骗你的女仆吗？”\n穿着洛丽塔鞋的右脚轻轻地抬起，还沾着那些士兵被碾碎骨骼和血肉的鞋底，还在不断地向下滴着暗红色的鲜血。伴随着少女的威逼，她鞋底的棕色哑光厚底正顶着自己面前的这个叛徒。尽管那人正不断地求饶着，但是希瞳被关押了千年的恨意却并未消散一点。伴随着她收起的脚尖如同摆锤一般飞速落下，毫无抵抗之力的血肉之躯如同一节被碾碎的香肠一般爆裂开来。像是一颗鲜血的爆弹那般，同墙壁一起炸裂在了自己的鞋尖。\n“怯，还以为千年来你能有什么长进的，原来只有这点能耐吗？”\n少女左右晃动了自己的脚尖，将自己的脚同鞋子一同拔了出来。看着残留在自己鞋尖上的鲜血和骨骼，希瞳不由得嘟噜着。\n“十倍，对于彻底毁灭这个文明而言，还是太小了。”\n有些怨念的希瞳，用脚尖刮擦着一边的墙壁，将这小人的印记完全擦除。\n“解决了仇敌，那么也得把这个决议背叛自己的文明，一同扫除了才行。”\n没有了维生舱的束缚，希瞳的身躯，终于可以随心所欲的将能量完全用在巨大化之上，她的身躯将薄弱的楼板撑裂，将承重柱如同木棍一般折断撑裂， 将自己的巨大化化作毁坏的力量，享受着那些愚蠢的科学家们，在躲避自己不断膨胀身躯时的不知所措，以及，最终连污损自己皮肤都做不到，也毫无反抗之法的——无力感。她的身体撑破了华美得穹顶，阴影逐步遮盖了大地。而展现在她面前的，则是自己还未曾享受过，却已经陷入混乱的现代化都市。"
 gts_hitomi.5.a:"继续观察"
 gts_hitomi.6.name:"重拾力量的她"
 gts_hitomi.6.desc:"没有了自己身体所创造的能量，这些小人现在正在自己的面前，如同蝼蚁一般逃窜着。\n希瞳的双脚，重重的踩在广场之上。巨大的体重，瞬间就让看上去坚实的大地踩出了洛丽塔的鞋底印记。\n“既然不知道发生了什么的话，那我就再替各位蝼蚁们回忆回忆吧。”\n高跟踏击在小人的大街上，车流混着人流混乱地在希瞳的脚下逃窜着。穿着女仆装的猫娘希瞳，则像是猎手巡视猎场一般，踩踏着小人们的街道，践踏着那些被遗弃的车辆向前走去。\n“怎么？千年来依靠我的力量才发展到今天，你们难道毫无察觉吗？”“仔细想想也是，毕竟，能愚笨到被我追上呢......”\n少女的言语之间，满是对小人的不屑。\n车流堵塞成团，人群蜂拥向前。明明是自己的同类，却宁愿弃之不顾......\n希瞳的阴影，逐步笼罩在了逃跑的人群上方。\n本来宽阔的道路，在她的身后只留下了冒着黑烟的残骸，以及一个又一个脚印，和被踩成铁皮的罐头。\n“看来，里面还有不少人呢？”\n希瞳轻轻的用脚跟压住了车流之中的一辆巴士，满载小人的公交车此刻被困在停滞的车流之中动弹不能。就连是车门，也被其他混乱的车辆所堵塞，车内满载着的乘客，只能眼睁睁的看着自己头顶的天花板一点点的被撕开，露出希瞳那只厚重的棕色洛丽塔的鞋跟。\n“切，就这样送你们这些蝼蚁上路吧。”\n少女忽然间重重的踩下，将满载的公交车化作了一个爆炸的番茄罐头，一旁的车辆之上，以及街旁的建筑，全部沾染上了那些半秒之前仍在挣扎，现在却变成各种红的黑的白的东西，就算是在这血肉地狱之中得以在少女的鞋尖和鞋跟之间存活的小人，下一秒则被少女更恶趣味的动作所完全碾碎——那辆已经不成样子的，混合着血肉的公交车残骸，连同后面积压着的几辆公交车一起被她后踢向空中，留下了喷洒着鲜血的轨迹，再重重的落在自己留下的脚印之间。完全不成样子的巴士残骸，还在姗姗的向外流出着人类遗骸的混合物。看着面前逃难的人群，本来还在后面不紧不慢的虐杀着的希瞳，突然感受到了几下不明缘由的刺痛。定睛一看才发现，是本该维持着秩序的特警，正开着装甲车坚守在路口，用自己的那些毫无作用的烧火棍攻击着自己。\n“你们真的觉得这会有用吗？”\n少女抛弃了那一丝对猎物的矜持，本在驱赶着“猎物”的她，将逃跑中的人群的当作地毯向前跨去。每一步，都有几十个生命化作鲜红的血花，在她厚重的洛丽塔鞋下绽开着。而伴随着那黑影越来越大，她的面貌越来越清晰，站在这些抵抗着面前的希瞳，自然是对这些所谓英雄般的行动有所想法的。\n“怎么样啊，混蛋们？看看我的脚底，你们还要再反抗吗？”看着面前这些还没有自己脚趾高的小人儿，希瞳恶趣味的抬起了脚底，将一片地狱般的猩红，毫无保留的展示在这些抵抗者们的面前。\n“呕——”\n看着这番地狱的场景，纵使是经历过专业的训练，也有不少队员陷入了干呕之中，对此，希瞳小姐的处罚是......\n脚底重踏，将他们中间的，厚重的装甲车，如同易拉罐一般“咔擦”一下压扁。再如清扫一般，以鞋底为工具左右摆动。那些挥舞着烧火棍和护盾的士兵们，被少女比钢铁还要坚固的鞋面瞬间撞成了细小的血雾。仅仅是脚底在街道上左右摆动，就将这些恼人的蚂蚁，全部变成了自己鞋上的猩红印记。\n“真是的......幸好~你们丑陋的鲜血还没脏到本女仆的白丝呢......”"
 gts_hitomi.6.a:"继续观察"
 gts_hitomi.7.name:"绝佳视角"
 gts_hitomi.7.desc:"“这里的房子就高了不少呢？一看就是你们这些小家伙的新聚居地吧？”\n希瞳站在小人的大街之上，周遭的大楼都繁华了不少。不少透明的玻璃覆盖其上，失去了能量的彩灯并未将街区最美的一面展露给我们的女仆，但对于目标是全歼这个星球生命的她来说，这些建筑物不过是他接下来选择的猎物罢了。嗯哼？看来你们的楼宇已经比欺骗我那会高上不少了呢......\n希瞳挑逗的走到了面前的楼宇前。刚好比她膝盖低一小节的大楼看上去还没收到什么警告。稍稍弯下腰去，便看见了里面还不知道外面究竟发生了什么，还在忙碌着的小家伙们。忽然之间又来了恶趣味的少女，将双脚踩在了楼宇的两旁。作为女仆的她，轻柔的蹲坐在了商场的上方。白丝的胖次轻松的就压溃了楼房顶端的各种设备，天线在她的骆驼趾上慢慢的弯曲折断，令希瞳感觉到了一丝瘙痒感。她收紧了大腿，将上半部分的商场一点点挤压在自己微胖紧实的大腿之下。伴随着身下那若有若无的悲鸣，满足着的少女正一点点的挤压着那些不幸着的生存空间。\n“既然不想逃的话，那就是自愿喽？”\n内倾的双脚，让自己的圆鞋头推碎了大门，将堵在门口的人群吓的连连后退。伴随着大楼四处发出悲鸣之声，原本华丽的玻璃幕墙在少女自上而下的挤压中逐渐架不住压力，一扇接一扇的碎裂开来。伴随着楼板一层层的垮塌，繁忙的商场终究还是受不住少女的压力，塌落了两三层。\n“真是的，连当椅子的能力都没有吗？废物~”\n希瞳厌恶的说着，将白丝包裹的双腿逐渐的夹拢。虽然有小人正在从低楼层一个个往下跳着，但毫不在意的她依然还是用自己的臀部和双腿，处决掉了被困在她身下的三百余名小人。\n在小人们的惊呼之中，大楼终究还是敌不过巨大女仆的力量，在她的小腿之间如同被孩童拆毁得沙堡一般塌落成了废墟。\n“本还以为你们能逃出来会聪明点的，没想到还是和那些蠢货一样直直的往前逃呢？”\n看着那逃出的几十个幸存者，嘴上说着自己毫不在意的希瞳仅仅是两步就追上了奔逃的人群。本还宽阔的大街，一下子便被她重踏所扬起的尘土所笼罩。\n“逃？逃的掉吗？”\n眼前一同逃跑的同伴消失不见，视野里只剩下了她冰冷的鞋底。末了，也不过是被她随意的一脚抹去，仅仅是比那些被双腿和臀部挤碎的小人多活了两三分钟。\n“真是的......才刚刚有感觉呢？”\n希瞳抬起脚来，看了看自己再度沾染上小人的鞋底，厌恶的又用身旁的建筑将脚底的血腥擦掉。\n“嗯？看起来你们居然还能有比我高的楼呢？不错哦？”\n踏平了繁华商业街的她，发现了身旁的，有着150米的大楼。作为百倍大小的少女，她则刚好比这栋可以称得上是地标性的建筑高出了整整一个头。\n“虽然还是没我高，不过看起来比那些十几层的小楼有意思不少呢？”\n这样说着的少女蹲了下来，用手指轻轻的沿着外墙滑动着。本该忙于工作的小人们被惊动，却被少女巨大的几乎是占满一层楼高度的淡红色眼瞳，以及她那对微微摇晃的，和大楼比还要宽上不少的乳房所惊吓到。\n“真是的，现在才察觉到自己的命运吗？不过，在死之前，你们可一定要满足我啊~”\n这样说着的希瞳，踮起了自己的脚跟，将自己的巨乳完全靠在了大楼之上。\n温热的双乳，顺着大厦流线型的外表微微滑动，散发着一股少女独特的气味。伴随着少女的上下晃动，整个大楼也被希瞳拥抱着，伴随着她的动作不断地震动着。周遭的大地出现裂纹，坚固的窗户虽比之前的商场要牢靠上不少，却依然有不少布上了裂纹。\n“嗯呐~努力反抗我吧~”\n大楼的顶端完全破碎，变成了她胸口的形状。包裹着南半球的衣服早已脱落，露出了她那圆润柔软的双乳。但在如此巨大的重量和大小之下，就算是能够养育生命的乳头，也几乎是如同一个坚硬的岩石一般，不断地在被破坏的越来越严重的建筑上留下深深的刻痕。\n“呼......冰冰凉凉的大楼粉碎在我的巨乳上......还挺舒服的，不过这些乳汁......要留给更多的小人呢？”\n空气中弥漫着一股乳香味。已经喷出一些的白色乳汁在建筑的残骸之中缓缓流动着，散发着蒸汽。而此刻的少女，则再次蹲了下来。透过满是裂纹的窗户，只能看到那些逃不出的所谓“精英”，正蜗居在大楼的中间，畏畏缩缩的看着注视自己的巨大女仆。\n“各位，想要死的更有价值一些吗？”\n希瞳轻启双唇，慢慢的哈出了湿热的空气。水汽逐步的遮蔽了玻璃幕墙，让小家伙们得以忽略掉巨大的淡红色眼瞳，以及那堆裸露在风中的丰硕乳房。但仿佛是抽奖一般，少女端详着，伸出手来，一下就击碎了大楼的某处。\n“恭喜你们，成为我今天的第一口小零食！”\n惊恐的上班族们想要逃跑，却只能眼睁睁的看着自己的同事被手指夹着，拉出了已经是巨大破洞的窗外。\n“我......我还不想死，救命......啊！”\n连话都没说几句，倒霉的白领就被希瞳丢入口中。伴随着他的惨叫声，他如同一块生肉那般，被巨大的牙齿所碾碎。只有1/100的他，甚至比希瞳的牙齿还要小一些。在她本能的咀嚼之下，骨骼咯啦咯啦的被碾碎，体内的一切都被挤出，然后再被唾液混合，被舌头推挤到了一边。\n“怎么样？死的很干脆吧？”\n希瞳再次张大嘴巴，让各位得以看清那倒霉蛋的死法。在大家被这番画面震惊到说不出话的时候，她的另一只手也深入大楼之中，将一个又一个的幸存者拉了出来，丢到了自己的手心之中。\n“嗯......不错？光是吃掉一只小家伙的话还是不够解馋呢？”\n希瞳这样说着，将手掌斜向了自己张大的巨口。在不断地惊呼之中，小人们想要朝着手掌的另一侧攀爬着，却抵挡不过地球的重力，滑落到了她的嘴中，如同跳跳糖一般在她的舌头之上蹦跳了几下。几十只本该有着美满生活的小虫子......就这样化作了女仆的解压零食。在旁人的围观之下，那双雪白的皓齿逐步落下，将想要挣扎着逃出生天的小人拦腰斩断。伴随着少女不清的咀嚼声，口中的求救和挣扎几乎瞬间断绝。就算是得以逃到牙齿下方，得以不被几下斩断粉碎的小人，也被那巨龙一般灵活的舌头推挤着，成为了上下牙齿之间的亡魂。\n“嗯~嗯~”\n伴随着鲜活的生命成为了自己的食糜，少女发出了满意的轻哼。咕咚一声，便将这些人类化成的看不清样貌的血肉，混合着口水一同咽下。\n“真是美妙呢，没想到这么久过去你们的味道已经变好了许多呢？”\n少女对着楼内的幸存者微微笑着，但大家却只能注意到她洁白的牙齿，已经沾满了同类遗留下的，可怕至极的暗红色血肉。\n“但是你们剩下的小人，可就没那么幸运了呢~”\n伴随着希瞳的轻哼声，她转过身弯下腰来，将自己圆润的屁股对准了这座还在勉强支撑着的大楼。\n“既然你们得以有幸存活到现在的话，那么......”\n少女的巨大臀部，轻轻的在风中晃动着。洁白的胖次，也因为刚刚的玩弄湿润了一小片。肉肉的大腿，肉肉的屁股，在外人看来是极具诱惑力的情色，对于残留的小人，却怎么也想不到自己竟会惨死在这番美景之下。在那巨大臀部一次又一次的撞击之下，本还顽强地保持直立着的大楼，在少女一次又一次的撞击之下逐渐弯曲变形，最终，被可恶的女仆的肥硕屁股一下撞断，将整个建筑化作了尘烟。\n“呼......你们想的比我坚强不少吗？不过，就这点本事了吗？”\n少女的脚底抵着残余的半截大楼，用力一踢，将大楼本事连根拔起击倒在地。再度转过身来的她，也没有刚刚的那番挑逗，仅仅是来自鞋底的两脚重踏，便彻底的将自己刚刚还在玩弄的这“玩具”，化作了残破街区之中的两只巨大的脚印。\n“呼......接下来又是什么呢？好期待啊，发展了千年的小小人们，能怎么反抗我这个巨大化的女仆呢......”"
 gts_hitomi.7.a:"继续观察"
 gts_hitomi.8.name:"覆灭"
 gts_hitomi.8.desc:"一千七百多米的希瞳可爱的坐在城市之中，无聊的寻找着自己的下一个目标。\n“你们真是太弱了~抵抗也抵抗不了，逃，又能逃到哪里去呢？”\n希瞳轻轻晃动着自己的双脚，像是碾碎蚁群一般，不断地用自己的脚跟砸入小人的街道之中。人群如同无头苍蝇一般在她巨大的身躯之下四处奔逃着，而希瞳不过是用脚跟轻轻砸下，就能将几十个人的人群连同周围的大楼，一起用自己那厚实的长鞋跟碾作尘土。\n“完全没意思呢......没办法，只能让你们提前感受一下了呢？”\n这样说着的少女，无趣的用指尖勾上了自己的鞋跟。伴随着一股浓郁的气味笼罩大地，希瞳那有些发黄的白丝从那双洛丽塔皮鞋之中被抽了出来。伴随着一股浓郁的气味，那些躲藏在楼宇和地下的小人都不由得的捂住口鼻。\n“嗯哼？你们难道不觉得这股臭味很美妙吗？”\n用手指捏住自己的鞋帮，希瞳稍加思索，便将自己巨大的鞋子看似随意的丢出。在轰鸣之中，那巨大的鞋子重重的倒在城市之中，滚动翻转的鞋身将逃命的小人，连同繁华的街区一同压扁。只留下了那高墙一般的，还粘着各种建筑小人以及汽车残骸的脏污鞋底。\n“呵呵？就这点本事吗，那，另一只鞋子也请你们保管好哦？”\n巨大的鞋子，即使看起来只是朴实无华的高跟洛丽塔鞋，但在千倍的大小下，依然有着毁天灭地的重量。重重落地的鞋子，竟然勉强维持了自己的直立。屹立在城市之中的鞋子，即使与这个城市最为高耸的建筑物比起来都颇为庞大。而那些曾经能让希瞳好好玩弄的商场和居民楼，如今也不过是她脚趾大的无趣建筑物罢了。更为巨大化的她，此刻需要更为有趣的建筑来好好发泄一通。\n“嗯？居然全部逃到这里了吗？是等着我把你们一块扫除掉吗？”\n左右扫视着的希瞳，忽然在一片无趣的灰色建筑物里发现了什么。\n“真是......有不少呢？”\n少女转过身来，巨大的双腿横跨了数个街区，一左一右的砸在体育场的旁边。场内残存的上万人......还以为自己已经躲过了少女的视线，再度抬头，迎接他们的却是少女的坏笑，以及她正在轻轻晃动着的，那一双大臭脚。\n“呕......”\n此时的体育场对希瞳，究竟是什么呢？这么个建筑物，看起来也确实能让希瞳踩上几脚，但是玩心大发的希瞳，却不想这么轻松的让面前的小人儿轻易死去。\n“既然你们有幸被我挑中了，那么，可是要好好的来仰望你们归来的......”\n希瞳轻摇着嘴唇，说出了她一直都想说出的那句话。\n“'女神'哦。”\n坐在地上曲着腿的少女，轻轻的抬起了自己的左足。那被束缚了千年的足部，此刻正毫无遮掩的展示在所有人的面前。千年的积怨如同这脚臭一般，泛黄的脚底，以及勾动着丝袜的巨大脚趾，都彰显着这位女仆曾经统治着这个星球的过往。\n“不错哦，你们居然还能逃到这里呢？真不错呢~看看你们的同伴，就没那么幸运了呢？”\n希瞳微微弯腰，用自己的手指指着那些不幸被碾碎并被粘在脚底上的垃圾。\n“小家伙们的城市，还挺多姿多彩的吗？”\n希瞳用手指指着那些粘在自己足底的残骸，一个接一个的吐槽着。\n“看起来你们这些人真是慌不择路呢，不过也方便被我一脚踩扁了耶。”\n有些挑衅的她，一边说着，一边将粘在脚底的各种被碾作铁片的小车揭下，丢在了体育场的一旁。一边耻笑着那些不自量力的，被自己脚跟一脚击碎的人群，一边感受着那胯下上万人对于自己的恐惧和钦慕。\n“嗯？我有说你们可以走吗？”\n忽然间，希瞳看到了什么。那是正在自己足下奔逃着的上百人。就算是被她抬起的左脚阴影所笼罩，却依然侥幸的觉得巨大的女仆根本注意不到自己的存在。只可惜，这样的蚂蚁逃窜，已经杀死了数十万人的希瞳自然是已经习惯了呢。伴随着巨大的脚跟在一瞬间砸在人群之中，大笑着的希瞳，将自己的脚跟当作的碾碎东西的杵一般，在那人群之中重重地旋转碾碎着。看着那所剩无几的小人们四散奔逃，杀戮成瘾的她几乎是用自己庞大的力量，将她脚边胆敢逃跑的每一只小人，都用自己的脚跟碾碎成了不分你我的细碎血肉。\n“怎么样？胆敢逃跑的下场......就是这样哦？各位愚蠢的虫子~”\n再次抬起脚的希瞳，她的脚跟正滴落着那人类的混合物。这番残忍血腥的场景，令场内避难的小人们不由得连连后退。看着小人们在自己脚下屁滚尿流的场面，希瞳更是张狂的用脚底抵住了面前巨蛋般的体育馆，用自己的双脚不断地拍动着本就脆弱的避难所。\n“呵呵~你们真是弱小啊？哪里也去不了，反抗又做不了，只能把自己最为不堪的一面暴露给你们的毁灭神来看呢？”\n伴随着希瞳的双脚平铺在场馆的巨大穹顶上，仅剩的不到万人......正体验着身为希瞳脚底的足垫虫一般的待遇。每一口的呼吸，都是将希瞳积累了许久的脚臭吸入肺中的，浓郁到说不出话的臭味。索性，身为巨大女仆的希瞳也还没可怕到光光能用脚臭就能夺走人性命的程度。但在这番黑暗潮湿的足臭折磨之下，纵使是再有生命里的小人，也不得不在希瞳的足下败下阵来。\n“不过，反正你们也已经没啥用处了呢......”\n玩弄尽兴了的希瞳，终于想起来了自己灭杀人类的人物。伴随着盘腿的少女将双脚一左一右的夹在体育场的两旁，就连最为宽广的大街，此刻对于她的小腿来说都过于窄小。而在足心当中的体育场，此时已无人再敢逃跑，宁愿直面被面前这巨大女仆碾碎的命运。\n“哗啦——”\n在双脚闭合的一瞬间，巨蛋一般乳白色外壳的体育馆......便在她的足下彻底的被碾碎。意犹未尽的她，再搓动了几下双脚，直到再也感受不到双脚之间的生命气息才作罢。\n“果然只是一群愚笨的虫子呢？甚至是看到我白丝包裹着的巨大足底，都会害怕呢？”\n完全用双脚灭杀了这“避难所”里的一万小人的她，满意的抬起了自己的一只脚。穹顶和座椅的残骸从她的脚底像碎屑一般抖落，只留下了那些被鲜血浸透了的帐篷，以及成片成片的，曾是小人的红点。\n“没想到你们这些小人这么小呢？还没那些逃跑的家伙有意思呢......”"
 gts_hitomi.8.a:"继续观察"
 gts_hitomi.9.name:"尾声"
 gts_hitomi.9.desc:"“看来，你们的星球，已经几乎没什么能刺激到我的东西了呢……”\n巨大的希瞳，正以和星球一般高大的身躯，飘在地球之外的宇宙之中。宛若一只面对着好玩球体的猫猫，正端详着各个已经残破不堪的大陆。\n“真是……难以置信呢？明明都这么破坏了，没想到你们这些被称作‘人类’的小家伙，居然还存活下这么多呢？”\n棕发的希瞳猫猫，缓缓的挪动着自己的身躯。已经比任何大陆都要巨大的她，变成一片笼罩在人类文明上空的巨大而不可测的危险。\n“都变的这么大了~那么，希瞳对各位微生物们，就什么都可以做了吧？”\n这样说着的希瞳，缓缓的挪到了这颗星球的一头，面对着那个被茫茫冰雪所覆盖的大陆。\n“看起来就像很好吃的雪顶呢?稍稍舔一口的话，你们这些小家伙也不会立刻死掉吧。”\n希瞳轻轻地微调了自己的身子，粉嫩的舌头如同巨蛇一般，从她微张的双唇之间缓缓伸出。万年不化的冰雪，在希瞳口中微微吐出的热气之下逐渐融化。\n“也许，你们的星球，尝起来会很像好吃的。”\n这样想着的希瞳，伸出了巨大的舌头，缓缓的扑向眼前的皑皑雪原。巨大的她趴在这颗星球上，散发着热气的舌头，凿入了覆盖着冰雪的大陆之下。\n“轰隆隆隆隆——”\n比任何山脉还要巨大的舌头，缓缓的探入大陆之下的岩浆海之中。微热的感觉，令希瞳不由得兴奋不已。有着千米山川的大地，缓缓的被希瞳的舌头所托起，像是蛋糕上的奶油装饰一般，被勺子般的巨大舌头挖起，缓缓的被送入她的口中。\n“星球雪顶咖啡……其实也就一般吧。”\n炽热的岩浆，在她的舌尖上迅速和唾液混合凝固。冰冷的冰雪，被她口中的热气席卷迅速的化开，在她的舌头上缓缓的滑落进了更深处的黑暗之中。\n“呼……极地的味道就这样吗，那么，你们的国家，又是什么味道呢?”\n在众人绝望的注视之下，希瞳的巨大身体，再次挪动了起来。如此巨大，如此可怕的她，几乎是飘到哪个大陆上空，哪个大陆的人类就陷入被她阴影所笼罩的恐慌之中。\n或许是出于恶意，亦或是这巨大猫娘对背叛自己文明的嘲弄，总之，她的眼瞳——直接撇向了那个攻击自己最为猛烈的大陆。可悲的人类纵使是用尽全力，也不过是能让已经成神的希瞳注视一撇。\n“看来，你们攻击的很开心呢？吃起来的话，也会很不错吧。”\n坏坏一笑的希瞳，缓缓的将双唇靠近着面前大陆上最为繁华的城市。望着地上朝着自己飞来的上百颗弹道导弹，颇为无趣的希瞳邪魅一笑。\n“居然还觉得可以打退我吗？你们最先进的导弹，可是飞到现在都没办法接触到我的身体呢？罢了，也帮你们处理掉吧。”\n希瞳说着，再次伸出了自己的巨舌。小人的导弹需要飞行数十分钟的距离，在她的巨大身形下也不过是一瞬。火光在她吐出的舌头上接连爆炸，却无法阻挡那舌头一丝一毫，眼看着那粉嫩的舌尖将要和自己的城市来个亲密接触，不少士兵面对此情此景，下意识的落荒而逃。巨舌的舌尖，却仿佛是有了那么一丝怜悯一般，在小人们的城市顶上停了下来。那巨大的、湿漉漉的粉嫩舌尖，悬停在那座繁华都市的摩天大楼顶端，相距不过几百米。 地面上的幸存者们屏住了呼吸，有人跪地祈祷，有人瘫软在地，以为这位伟大的神明终究动了恻隐之心。然而，希瞳只是微微皱了皱那挺翘的小鼻子，粉红色的双眼闪过一丝嫌弃。\n“嗅嗅……好冲的味道。” 她收回了舌头，有些失望地嘟囔着。 “这种东西舔进嘴里，绝对会拉肚子的吧？”\n在人类从天堂跌回地狱的绝望目光中，希瞳直起了身子，伸出了那只能轻易覆盖大洋的白皙手掌，像是剥橘子皮一样，五指深深地扣入了那块反抗最激烈的大陆板块边缘。地壳发出了凄厉的悲鸣。希瞳的手腕发力，那块承载着数个强国、拥有数亿人口的大陆，就这样硬生生地被她从地幔上剥离了下来。希瞳张开樱桃小口，将这块巨大的“土饼”随手丢进了嘴里。随着上下颚的闭合，数千年的文明史在她的齿间化为粉末。高楼大厦是咯嘣脆的配料，山脉是稍微硬一点的骨头。 希瞳鼓着腮帮子咀嚼了两下，随即眉头紧锁。\n因为味道实在太干涩乏味，希瞳下意识地侧过头，朝着虚空狠狠地吐了一口唾沫。\n“啧，难吃死了。” 希瞳有些烦躁地甩了甩那条巨大的栗色长尾巴。她低头看着这颗已经被啃得坑坑洼洼的星球，似乎在寻找最后一点乐子。\n“也许……应该换一种‘吃’法？”\n她那双灵动的猫眼忽然亮了起来，尾巴灵活地卷起，末端的绒毛轻柔地扫过大洋，将一块相对完整的、岛屿众多的破碎板块卷了起来。 希瞳脸颊微红，带着一丝恶作剧般的羞涩，那双巨大的手缓缓撩起了蓝白运动短裙的下摆，露出了那包裹着纯白棉布的神秘三角区。\n“稍微……借用一下哦～”\n在星球上幸存者无法理解的、超越认知的恐怖画面中，那块巨大的陆地被她的尾巴送到了身下。 希瞳轻轻拨开布料，那道湿热、深邃的“蜜穴”缓缓张开。她腰肢轻摆，将那块岛屿陆地作为某种大号的玩具，缓缓地吞了进去。\n“嗯……凉凉的，有点粗糙……” 希瞳眯起眼睛，发出了一声甜腻的呻吟。对于人类来说是灭顶之灾的挤压，对她来说不过是稍微有点异物感的刺激。 几秒钟后，她便兴致缺缺地将那块已经沾满了爱液、被挤压得变形的陆地排了出来，任由它坠入茫茫星海。\n“也没什么意思呢。”\n希瞳叹了口气，那种名为“无聊”的情绪彻底占据了上风。 她抬起腿，坐在了虚空之中，开始脱脚上那只巨大的高跟女仆皮鞋。\n“既然不好吃，也不好玩，那就结束吧。”\n她赤着一只脚，那包裹着白色丝袜的玉足在星光下散发着微热的气息。希瞳恶趣味地将脚掌悬停在地球仅存的最后一块完整大陆上空，脚趾灵活地动了动。\n“比比看？你们引以为傲的疆域，甚至还没有我的脚心大呢。” 那巨大的袜底纹路，如同遮天蔽日的白色苍穹，让所有仰视的人类深刻体会到了何为渺小。\n“最后——彻底再见吧。”希瞳那巨大的大拇趾和二趾猛地张开，像是一个巨大的肉色钳子，精准地夹住了这颗已经濒临解体的残破星球。 板块在她的脚趾缝间崩裂，大气层被脚汗浸透。随后那夹住星球的两根脚趾——大拇趾与二趾，毫不留情地开始向中间并拢、错动。没有任何悬念，那颗行星在希瞳两根脚趾那毁天灭地的夹击力下，发出了最后的悲鸣。希瞳脚趾猛地一用力。伴随着一声沉闷且湿润的爆裂音，这颗行星终于承受不住这星球级的握力。曾经繁荣的城市、巍峨的高山、深邃的海洋，在这一瞬间统统被挤压成了无数燃烧的碎块和尘埃。那些星球的残骸混合着希瞳脚趾间的汗液，化作了一团黏腻的暗红色泥浆，顺着她白皙的脚背滑落，消散在冰冷的宇宙真空中。"
