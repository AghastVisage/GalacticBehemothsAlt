 gts_hitomi.403.name:"才不是玩手游玩的呢"
 gts_hitomi.403.desc:"资源结算完成后，一笔数额为 648 的经费被迅速划出。监控显示，希瞳在确认到账后短暂地停留在个人终端前，屏幕亮度被调低，操作显得异常熟练。几分钟后，账户余额发生变化，而当被问及用途时，她只是平静地关闭界面，淡淡回应“只是合理使用经费，概率提升了”。之后几天希瞳经常念叨着什么怎么又歪了什么听不懂的话。"
 gts_hitomi.403.a:"阿这"
 gts_hitomi.404.name:"缩小城市就是最好的脚垫！"
 gts_hitomi.404.desc:"作为休息时的消遣，一组经过等比缩小的微型城市并配备了相当数量的小人被送入了希瞳的办公室。希瞳不顾运送城市的工作人员还没有离开便一脚踏了进去，那些还没有她脚踝高的高楼在她的运动鞋的重踏下被踩成了粉末和扭曲的金属残骸。\n希瞳微微抬起脚，鞋底脱离地面时带起一阵碎屑雨。那些曾经是摩天大楼的残骸像灰尘一样从鞋纹里簌簌掉落，落在下方尚未被波及的街区，砸出了一个个巨大的坑洞。\n她低头看了一眼脚下那片狼藉，嘴角勾起一点无聊的笑意。鞋底中央黏着一截扭曲的钢梁，末端还挂着几辆被压成薄片的汽车，像廉价饰品一样晃荡。她随意地用脚尖碾了碾，金属发出一声短促的哀鸣，便彻底断了。\n“才刚开始就碎成这样啊。”希瞳的声音在办公室里回荡，对微型城市而言却如同雷霆。她弯下腰，指尖轻轻拨开脚边残存的几栋低矮建筑，像拨开积木一样轻松。指腹掠过之处，屋顶掀飞，墙体倾倒，里面密密麻麻的小人尖叫着四散奔逃，无处可躲。\n她站直身体，运动鞋再次抬起，这一次悬在城市中央那片最繁华的区域上方。阳光被她的身影完全遮蔽，投下一片巨大的阴影。小人们抬头，看见那只鞋底缓缓压下，鞋纹里的碎屑还在往下掉，砸死了不少小人。\n希瞳没有立刻踩下去。她喜欢这种悬着的感觉——那种无数目光同时聚焦在自己脚底、带着绝望和祈求的感觉。她轻轻晃了晃脚踝，让阴影微微摇晃，底下立刻爆发出一阵更剧烈的骚乱。有人跪地，有人抱头，有人还在徒劳地开车逃窜。\n“跑啊，继续跑。”她低声说，声音里带着一点倦怠的兴味。\n然后，她慢慢地、带着近乎慵懒的从容，把脚放了下去。这一次，没有剧烈的冲击，只有一种沉闷的碾压感。鞋底触碰到建筑群的瞬间，整片街区像被无形的手掌缓缓按进了地面。高楼一层层塌陷，街道龟裂，车辆和人群一起被压进鞋纹深处。希瞳甚至能感觉到脚底传来细微的、像气泡破裂一样的触感——那是无数脆弱生命在同一时刻被抹平的反馈。\n她轻轻扭了扭脚踝，像碾灭烟头一样，把最后一点抵抗磨成虚无。抬起脚时，原本繁华的市中心已经变成了一片平整的凹痕，边缘散落着零星的残砖碎瓦。希瞳看着自己的杰作，轻轻呼出一口气。\n“还有一半呢。”她自言自语，目光转向办公室另一侧尚未被触及的那片微型城市，“慢慢玩吧，反正午休还有四十分钟。”"
 gts_hitomi.404.a:"然后呢"
 gts_hitomi.4042.name:"缩小城市就是最好的脚垫！"
 gts_hitomi.4042.desc:"希瞳懒洋洋地靠回椅背，翘起二郎腿，目光落在脚下那片已经被彻底夷平的废墟上。鞋底的纹路里嵌满了细碎的建筑物残渣和被压成薄片的车辆，偶尔还有几点暗红色的痕迹——那是来不及逃走的小人留下的。她轻轻晃了晃脚，碎屑簌簌落下，像一场灰色的雪。\n“穿鞋玩有点不过瘾。”她喃喃自语，嘴角勾起一丝坏笑。\n她弯下腰，一手抓住右脚的鞋跟，轻松地把运动鞋脱了下来。鞋子被随手扔到一旁，重重落地时震得整个办公室的地板都微微一颤。脱鞋的瞬间，一股混合着皮革、汗水和淡淡脚香的热气从鞋口涌出，迅速笼罩了下方残存的城市区域。小人们本来就已经被恐惧压得喘不过气，现在又被这股浓烈的气味包围，许多人直接咳嗽着倒下，像是被无形的毒雾吞没。希瞳把脱下的鞋子倒扣在城市边缘，像盖下一座巨大的黑洞穹顶。鞋口正对着尚未被触及的那片城区，里面的热气不断涌出，带着潮湿的温度，把街道上的小人熏得头晕目眩，有人甚至直接昏厥过去。\n接着，她慢条斯理地卷起裤脚，伸手去脱袜子。白色的棉袜已经被一上午的行走闷得微微发潮，她捏着袜口，缓缓往下拉。袜子脱离脚跟时发出轻微的“啵”一声，露出了她光洁的脚底——皮肤白皙，足弓优雅地弯曲，脚趾修长而灵活，趾缝间还残留着一点点湿润的汗迹。她把脱下的袜子捏在指尖，轻轻抖了抖，然后像扔纸团一样，把它扔向了城市另一侧。袜子在空中展开，像一张巨大的白色网铺天盖地落下，精准地罩住了几条主干道。布料重重砸下，直接把成片的小人和车辆压进地面，挣扎的人只来得及发出几声闷哼，就被柔软却沉重的棉织物彻底闷死在下面。袜子里残留的温度和气味迅速扩散开来，像一层无形的毯子覆盖了整片街区。现在，两只脚都赤裸着。希瞳满意地动了动脚趾，感受空气拂过皮肤的凉意。她把右脚缓缓抬起，悬在剩下那片完好的微型城市上方。脚底的阴影投下，比鞋底时更加清晰、更加致命——小人们能清楚看见她足弓的曲线、脚趾的纹路，甚至趾缝间细微的汗珠在阳光下闪着光。\n“这样应该更有感觉吧。”她轻声说，声音里带着一丝慵懒的期待。脚底慢慢下降，没有鞋子的阻隔，这一次的接触更加直接，更加残酷。脚掌触碰到高层建筑的瞬间，整片城区像被一张温热的肉垫轻轻覆盖。建筑物在她的脚底下层层塌陷，钢筋混凝土在皮肤的压力下像饼干一样碎裂，发出细微的“咔嚓”声。无数小人被直接压进她脚底的纹路里，挣扎的动作像微弱的瘙痒，让希瞳舒服地眯起了眼睛。她轻轻碾动脚掌，像在柔软的地毯上蹭痒痒一样。脚趾随意张开又合拢，每一次动作都夹碎数十栋建筑，趾缝间掉落下细小的碎屑和被碾平的残渣。她甚至能感觉到脚底下那些微弱的、像气泡一样破裂的触感——那是生命在她的皮肤下成片成片地消失。\n抬起脚时，原本繁华的城区已经彻底变成了一个巨大的脚印形状凹陷，边缘还沾着她脚底的淡淡汗渍。希瞳看着自己的脚底，那上面嵌满了细碎的建筑物残片和被压扁的小人，像一层灰色的污垢。她笑了笑，把脚伸向最后残存的那一小片城区，脚趾轻轻点下，像在玩弄最后几颗棋子。\n“午休还有半小时呢……慢慢来。”"
 gts_hitomi.4042.a:"希瞳该洗脚了"
 gts_hitomi.4043.name:"缩小城市就是最好的脚垫！"
 gts_hitomi.4043.desc:"希瞳的脚趾在最后一片残存城区上方轻轻逗留，像猫玩弄垂死的老鼠。她大脚趾随意一点，一栋尚未倒塌的购物中心屋顶便被压塌，里面惊慌逃窜的小人像蚂蚁一样四散。她的脚底还残留着之前碾压的碎屑，灰尘和细小的金属片黏在汗湿的皮肤上，偶尔掉落几粒，砸在下方街道上，激起更多尖叫。\n忽然，她的目光微微一顿，落在了城市边缘那几个相对“高大”的身影上——那是最初运送微型城市进来的工作人员。他们比城市里的普通小人略大一些，大概有她脚趾长度的两三倍高，本该在放置好城市后立刻撤离，却因为希瞳的突然行动而被困在原地。现在，他们惊魂未定地挤在残存的运输平台旁，拼命挥手试图吸引她的注意，或者……求饶。\n“哦？还有你们啊。”希瞳的声音带着一丝玩味的惊讶。她早就注意到他们了，只是之前懒得理会。那些工作人员穿着统一的灰色制服，在她眼中不过是大一点的虫子，比城市里的小人醒目些，却依旧渺小得可笑。他们一开始就站在城市旁边，监督放置过程，结果她一脚踩下来时，有几个直接被鞋底的边缘波及，压成了脚印里的暗红污渍。剩下的这些，显然是运气好点，躲在了尚未被触及的角落。\n一个工作人员——看起来像是领队的，戴着小小的头盔——正拼命对着她大喊着什么，声音细如蚊鸣，希瞳根本听不清。她眯起眼睛，脚趾微微张开，像钳子一样缓缓向下探去。\n“你们……不是应该早点跑吗？”她轻笑一声，声音如雷霆般轰鸣在他们耳边。那领队的小人吓得腿一软，直接跪倒在地，其他几个也抱成一团，瑟瑟发抖。希瞳的大脚趾和二脚趾轻轻夹住了领队的身影。他在趾缝间疯狂挣扎，双手推着她温热的皮肤，却像在推一堵肉墙。趾缝里残留的汗渍和之前碾碎的碎屑立刻沾满了他的制服，那股浓烈的脚香混合着尘土味，让他几乎窒息。希瞳感觉到那微弱的挠痒感，舒服地哼了一声，脚趾稍稍用力一合——“咔”的一声轻响，那小人便被挤压得变形，制服爆裂，鲜血从趾缝间渗出，像一点红色的润滑剂。\n她把脚趾抬起，抖了抖，残渣和那滩模糊的肉泥掉落在他的同伴们头上。剩下的工作人员彻底崩溃了，有人尖叫着往运输平台下钻，有人徒劳地往外跑，却被她另一只脚的阴影瞬间笼罩。\n“运东西的工具人，也敢留下来看戏？”希瞳懒洋洋地说，脚掌缓缓压下，这次直接对准了他们聚集的地方。脚底触碰到的瞬间，那些比普通小人略大的身体发出了更清晰的“噗嗤”声——骨骼碎裂，血肉被压进她脚底的纹路里，比城市小人更有“嚼劲”。她轻轻碾动脚跟，像在踩死几只顽强的虫子，感受着他们最后的挣扎渐渐归于平静。抬起脚时，运输平台已经彻底扁平，工作人员的残骸混在金属碎片中，黏在她脚底形成几点稍大的污渍。希瞳低头看了看自己的脚掌，伸出脚掌随意抹了抹，把那些残渣蹭掉，甩到办公室的地板上。\n“清理干净了。”她满意地叹了口气，把双脚并拢，轻轻在残存的最后一点城区上蹭了蹭，像在擦拭脚底的灰尘。那片城区瞬间被抹平，只剩下一个模糊的双脚印痕迹。午休时间结束了。希瞳靠回椅子，赤裸的双脚随意搭在桌沿上，脚趾懒散地动了动，俯视着脚下那片彻底化为废墟的“玩具”。\n“下次……要不要让他们多准备点工作人员呢？感觉踩起来更带劲。”她自言自语，嘴角又勾起那熟悉的坏笑。"
 gts_hitomi.4043.a:"系统记录显示，她的情绪参数上升了。"

 gts_hitomi_fleet_love_exercise:"和希瞳一起演习！"
 gts_hitomi_fleet_love_exercise_DESC:"真的是演习嘛"
 gts_hitomi.405.name:"真的是演习对吧？"
 gts_hitomi.405.desc:""
 gts_hitomi.405.a:""
 gts_hitomi.4052.name:"真的是演习对吧？"
 gts_hitomi.4052.desc:"首都星域边缘，第一联合舰队早已严阵以待。数万艘战舰构成的钢铁长城在恒星的光辉下熠熠生辉，这是帝国最锋利的剑，足以征服任何叛乱的星系。 然而，当那个身影从亚空间跃迁而出的瞬间，所有人类引以为傲的武力都在刹那间变成了笑话。\n希瞳静静地悬浮在虚空中，巨大的身躯遮蔽了半个星空。对于她而言，身后那颗蔚蓝色的首都行星就像是一个大小适中的瑜伽球，而眼前这支集结了人类最高科技的庞大舰队，不过是一堆漂浮在空中的、精致却脆弱的塑料玩具。 她微微低下头，棕色的长发在真空中无风自动。那双深红色的眼眸毫无波澜，像两面巨大的红色镜子，冷漠地倒映着眼前这些渺小的“小玩意儿”。 在希瞳的视野里，这艘长达数公里的泰坦级旗舰，大概也就相当于她手掌中一根稍微粗点的黄瓜，或者一个十几厘米长的精美手办。至于周围那些护卫舰，简直就像是洒在桌布上的芝麻粒。\n指挥官几乎失去了理智，下一瞬，整支舰队同时开火。无数粒子光束、高能激光与反物质导弹如暴雨般倾泻而出，足以蒸发小行星的火力瞬间将希瞳彻底淹没。然而攻击落在她白皙的肌肤上，却连一丝涟漪都未能掀起。“有点痒。” 希瞳淡淡地评价道。她伸出右手，五根修长的玉指如同五根擎天巨柱，带着令人绝望的压迫感向舰队阵列的左翼压来。她优雅地曲起中指，对着那片密集的“芝麻粒”轻轻一弹。数十艘驱逐舰在接触到她指甲盖的瞬间就直接解体，变成了绚烂的金属火花。还有指尖带起的冲击波，直接将后方数百艘战舰像吹蒲公英一样吹得七零八落，有的战舰在翻滚中相互碰撞，变成了一团团在希瞳看来微不足道的小火苗。“啊……碎得好快。” 希瞳歪了歪头，兽耳轻轻抖动了一下。她看着那些在太空中炸开的微小光点，嘴角终于勾起了一丝微不可察的弧度。 “那么，该轮到那个稍微大一点的了。” 她的目光越过混乱的残骸，精准地落在了那艘十几厘米长的旗舰上。"
 gts_hitomi.4052.a:"希瞳用两根手指捏起了旗舰"
 gts_hitomi.4053.name:"真的是演习对吧？"
 gts_hitomi.4053.desc:"旗舰还在试图通过超载引擎逃离这片绝望的空域。但在希瞳眼中，这不过是一只飞得稍快、叫声稍大一点的蚊虫罢了。她漫不经心地抬起右手，巨大到遮蔽星光的阴影瞬间笼罩了旗舰。两根如同擎天玉柱般的玉指在虚空中轻盈一合，便精准地捏住了这艘长达数公里的钢铁巨兽的中段。那不可一世的旗舰在她指间剧烈震颤，引擎全功率运转的轰鸣传递到她指尖，只剩下微弱如手机震动般的酥麻感。希瞳并没有急着处理它，而是将手腕一翻，把这个还在喷射着蓝色尾焰、拼命挣扎的“小玩具”提到了眼前。透过舰桥巨大的防爆舷窗，指挥官和幸存的舰员们绝望地看到了那张占据了全部视野的、精致却冷漠的巨脸。那双深红色的眸子，毫无感情地注视着玻璃罩子里渺小的他们，仿佛在观察培养皿里的细菌。“好吵的小东西。” 希瞳的声音直接在他们脑海中炸响，带着一丝被打扰的不耐烦。她似乎对小人的吵闹感到厌烦了。她伸出另一只手的食指，用圆润修长的指尖，对准了战舰最脆弱、也是最突出的舰桥部位——也就是指挥官正站着绝望仰望的地方。\n“咚！” 一声闷响。对于希瞳来说只是轻轻一点，但对于舰桥来说就是灭顶之灾。\n特种合金制成的防护罩瞬间过载破碎，坚固的防爆玻璃如同脆弱的糖片一样炸裂开来。巨大的指尖带着不可阻挡的威势挤压进来，空间瞬间被填满。指挥官甚至来不及发出一声惨叫，就和整个指挥台、以及周围的参谋人员一起，被那白皙柔软、带有微微温热感的指腹瞬间碾成了一滩无法辨认的血肉模糊，黏在了她的指纹里。\n“安静了。” 希瞳收回食指，随意地在拇指上搓了搓，把那点红色的污渍蹭掉。处理掉了那个让她觉得有点烦的“核心区”，希瞳重新捏好战舰，将它送到了唇边。少女微微张开樱桃小口，露出里面洁白如玉、却仿佛能粉碎星辰的牙齿。口腔深处散发着甜腻而温热的香气。\n“啊——” 她像吃掉一根巧克力棒一样，将残破的旗舰送入口中，优雅地合上了牙齿。\n“咔嚓” 一声令人毛骨悚然的脆响。 坚不可摧的超合金装甲在她齿间瞬间崩碎，舰体内的反物质反应堆殉爆产生的恐怖能量，在她嘴里仅仅像是一颗爆浆糖果般炸开了一团温热的“甜味”和微微的刺痛感。她鼓着腮帮子随意咀嚼了几下，感受着坚硬的舰体碎片在舌尖被碾成粉末的粗糙触感。随后她脖颈微微仰起，喉咙发出清晰的“咕嘟”一声，将帝国第一联合舰队的骄傲彻底咽了下去。希瞳伸出鲜红的舌尖，意犹未尽地舔了舔嘴角，脸上依旧是一副平淡无波的表情，仿佛只是吃掉了一块口感稍硬的饼干。"
 gts_hitomi.4053.a:"希瞳看向剩下的舰队"
 gts_hitomi.4054.name:"真的是演习对吧？"
 gts_hitomi.4054.desc:"希瞳咽下了嘴里的“零食”，目光扫过剩下那些瑟瑟发抖的舰队。 “既然是演习，”她慢条斯理地整理了一下领口的耳机，声音平淡得像是在读说明书，“那我也得活动活动筋骨了。”\n希瞳微微后撤半步，穿着蓝白配色厚底运动鞋的右脚向后抬起，做出了一个标准的踢球姿势。 处于方阵中的舰员们看着那只巨大的运动鞋在视野中极速放大。鞋底复杂的防滑纹路像是一座座倒悬的山脉，鞋底正中央那个可爱的猫咪图案，成了他们生命中看见的最后景象。\n“嘭！”\n这一脚踢得结结实实。但在绝对的质量差距面前，数千艘覆盖着重装甲的战舰，在触碰到希瞳鞋底的瞬间，直接当场爆碎， 随着希瞳的鞋尖划过虚空，那原本整齐的方阵瞬间炸成了一堆金属粉末。\n此时，整个第一联合舰队已经折损过半。残存的战舰终于崩溃了，它们不再顾及阵型，引擎的光芒在黑暗中划出无数道慌乱的轨迹。\n“乱跑什么，还没结束呢。” 希瞳看着那些四散奔逃的小光点，眼中闪过一丝不耐烦。\n她缓缓抬起双手，在胸前张开，巨大的手掌笼罩了剩下的所有空域。 然后，合拢。\n“啪。”\n一声清脆的拍手声。两只手掌合拢产生的瞬间超高压，直接将掌心范围内的所有空间“压实”了。那些正在跃迁、正在加速的战舰，在那一瞬间被两堵肉墙无情地夹在了中间。 没有任何挣扎的余地，甚至连火光都被闷在了手掌里。希瞳保持着合掌的姿势停顿了一秒，然后慢慢松开双手。 一大团被压得扁平、混杂着金属碎片和不明液体的“渣滓”，像灰尘一样从她掌心簌簌落下，飘散在冰冷的太空中。曾经不可一世的帝国第一联合舰队，此刻只剩下了她掌纹里残留的一点点黑灰。希瞳低头看了看自己的掌心，随意地在腰间的短裙上擦了擦手，仿佛只是擦掉了一些脏东西。“胜过我，再谈未来”“演习结束。” 她转过身，背对着那片充满了死亡气息的虚空，在这片死寂的宇宙中，只留下一个巨大的、透着几分惬意与满足的背影。"
 gts_hitomi.4054.a:"至少希瞳高兴了"
 gts_hitomi.406.name:"降低好感度"
