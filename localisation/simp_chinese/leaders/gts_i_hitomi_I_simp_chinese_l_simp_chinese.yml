 gts_hitomi.30001.name:"意外援助"
 gts_hitomi.30001.desc:"一段陌生的通讯信号直接接入了我方主频道。\n她自称“三月希瞳”，长期以自由身份活动于边境与未登记宙域之间，承接各种任务。\n她向我方提交了一份时限明确的短期雇佣申请。根据合同内容，在受雇期间，她将以科学家的身份为我方提供服务，参与科研、调查与特殊项目解析。需要说明的是，一旦协议生效，她当前所展示的舰装与舰队指挥接口将不会随雇佣一并转入我方体系。在本次合作中，她将以“研究者”而非“指挥官”的身份加入我方行动序列。\n通讯末尾，她轻轻抬眼，语气平静得近乎理所当然：\n“别露出那种表情。你们雇佣的是我的知识、经验和判断力——不是这套东西。”"
 gts_hitomi.30001.a:"好..好耶？!"
 
 gts_hitomi.30002.name:"三月希瞳"
 gts_hitomi.30002.desc:"你、你你你……你在盯着哪里看呀！喂！你那种视线也太失礼了吧！我现在只是来当科学家的，不是来给你参观的……还有，耳朵也不能摸！\n对了对了送你个小礼物，要好好感谢我哦~"
 gts_hitomi.30002.a.name:"你的舰装呢"
 gts_hitomi.30002.a.response:"……不用你提醒，我当然知道自己少了什么。那套舰装现在处于锁定状态，暂时不在我可调用的权限里。别再追问了，至少现在，你把我当成科学家用就够了。所以，少露出那种可惜的表情。"
 gts_hitomi.30002.b.name:"你说的短期雇佣是什么意思？"
 gts_hitomi.30002.b.response:"意思就是我不是卖给你们了呀。我会履行整整§R十五年§!的合同，在这期间作为科学家为你们工作；等时间一到，这段合作关系自然终止。对我来说，已经足够久了。"
 gts_hitomi.30002.c.name:"你说的小礼物是？"
 gts_hitomi.30002.c.response:"这个呀？只是一个按我的样子做的小型终端挂件而已。别看它小，里面塞了基础通讯模块、简化科研模块，还有一个……咳，没什么用的应急子程序。总之，你收下就对了。"

 gts_hitomi.30003.name:""
 gts_hitomi.30003.desc:"§R提示：目前三月希瞳为临时雇佣状态，15年后会自己离开，之后完成特殊事件可以永久获得，但是临时雇佣期间的等级和特质不会保留§!\n§R主动启用遗珍可以提前离开并触发后续事件§!"
 gts_hitomi.30003.a:""
 gts_hitomi.30004.name:"这里是占位符"
 gts_hitomi.30004.desc:"请注意！未到合同期时主动使用遗珍将会提前触发离开事件。"
 gts_hitomi.30004.a:"确定提前触发"
 gts_hitomi.30004.b:"......只是点错了"
 gts_hitomi.30005.name:"耳朵就是用来rua的！"
 gts_hitomi.30005.desc:"这一天，三月希瞳正坐在终端前，认真地处理着堆积如山的科研与考古数据。她的手指在操作面板上飞快掠过，神情专注得几乎没有一丝多余动作，只有那对立在发间的毛茸茸耳朵，时不时因为思考或情绪波动而轻轻抖上一下。\n你的目光很快就不受控制地落在了那里。\n柔软，蓬松，还会动。\n这实在很难让人不去在意……\n面对这样近在咫尺、毫无防备的耳朵，你真的能忍住不伸手摸一摸吗？"
 gts_hitomi.30005.a:"这怎么可能忍得住！狠狠摸！"
 gts_hitomi.30006.name:"耳朵就是用来rua的！"
 gts_hitomi.30006.desc:"“这样做，可是很无礼的呢。”\n三月希瞳微微歪了歪头，唇边甚至还带着一点若有若无的笑意，可那双眼睛里显然已经没有刚才那种还能糊弄过去的余裕了。\n“像你们这样无礼的小虫子……可是要接受惩罚的哦~”\n下一瞬间，窗外的光线被骤然遮蔽。\n伴随着一阵令人心跳停滞的震动，三月希瞳的身形在建筑之外急速放大，转眼间便膨胀到原本的一百倍。庞大的身影就这样矗立在楼宇之间，仿佛整片城区都只不过是她脚边随手可拨弄的模型。她微微俯下身，带着几分戏谑与居高临下的从容，透过外壁与窗幕注视着下方那些因为她的出现而陷入混乱的渺小身影。\n原本明亮的办公室忽然暗了下来，你扶着桌子，一点点挪到窗边。下一秒，一只巨大得令人头皮发麻的眼眸出现在玻璃外侧，几乎占满了整扇窗。那眼睛微微弯起，带着几分戏谑，像是在欣赏玻璃后那个被吓得僵住的小小身影。\n紧接着，震耳欲聋的声音从楼外压了过来，连空气都仿佛在她的声线里颤抖。\n“怎么啦？”她眨了眨眼，声音里还带着那种让人头皮发紧的轻快，“刚才不是还很有胆子吗？现在怎么连站都站不稳了？”\n你张了张嘴，却一个字也说不出来。理智根本无法解释眼前的一切，本能只剩下一个念头——逃。\n“切，真小气。”希瞳轻轻鼓了鼓脸，语气里带着点不满，又像是在故意逗弄猎物，“既然没人肯乖乖认错，那我就只好亲自来收一点惩罚了哦~”\n“抓到了。”她轻声说道，耳朵愉快地抖了抖，“那么，无礼的小家伙——你觉得，自己该接受什么样的惩罚呢？”\n视角渐渐抬升，视野渐渐被眼前的巨大猫娘的酥胸所填满——映入眼帘的首先是那层遮蔽着胸前的薄薄的蓝色抹胸与微微遮挡住胸口的白色布料，然后再是那不断散发淡淡的乳香气息乳沟。手掌微微倾斜，手中的小家伙便被塞进了下方的“峡谷”之中，恰好能让他清清楚楚地俯瞰下方整片城市。\n“你就待在这里，好好看着。”希瞳歪了歪头，笑容甜得让人心里发寒，“看看你的国家、你的城市，还有你那些自以为很有用的臣民，是怎么被我毁灭的。”\n希瞳微微蹲下，她的身躯所构成的阴影渐渐覆盖住下方的车潮，一些被洪流裹挟着的人们惊慌的下车想要逃走但却猛然发觉周围的道路已被彻底堵死。\n但希瞳无视了那些想要求生的人们，她伸出指尖向着自己鞋上的小人们碾去——只是轻轻一碾，原本还活跃在鞋面上的小人们便化作了黏在指尖与鞋面上微微拉着丝的粘稠肉泥。\n原本躁动着的人群忽然间安静了下来，仅仅几秒后安静的人群便立刻四散而逃，但人们逃离的方向各不相同，人们互相推搡着想要为自己谋得一条逃离的道路，但这无序的逃窜显然无法让人们有效的逃离，一条又一条鲜活的生命在希瞳的运动鞋上消逝、在她的指尖下被抹除……\n“嗯……？”\n她头顶的猫耳轻轻抖了抖，捕捉到了一阵引擎声，她顺着声音看去，只见一辆莽撞的跑车不断轰鸣着从她足边冲了过去。但对于一只拥有如此庞大体型的猫娘而言，像这样在她的面前飞速移动显然是不理智的。\n“小家伙，你要去跑去哪里呀”\n少女缓缓站起身来接着再慵懒的伸了个懒腰，然后再轻轻迈出一步——高大的运动鞋便像一堵蓝白色的墙一般阻塞了它的道路，那辆跑车还没来得及刹车便重重地撞上了上去。\n“捉到了呢，那么...”\n猛烈的撞击让坐在驾驶位的小人近乎昏厥，若不是他的爱车上配有安全气囊否则他现在就已经当场丢了小命了。\n当他再次睁开眼睛时，那堵让他差点直接丢了性命的墙已经立了起来——希瞳半抬着脚，那双运动鞋的鞋底里满是道路碎屑、车辆残骸与人类的血肉，但即便是这样这双鞋却依旧看着很新，光是看着就能看出来它的主人并不经常穿它。\n鞋底的纹路中印着些可爱的小猫符号，配合着那小小的尺码标让它无论怎么看都是一只很可爱很适合青春少女穿着的运动鞋，甚至会很适合他的小女儿……\n嘎吱——\n希瞳的鞋底缓缓下压，跑车的车架便因承受不住这份伟力而开始扭曲变型，整辆小车以和其中的小人都被少女的鞋底碾成一片印着可爱图案的破铁片，无论从任何角度上都已无法看出它原有的样子。无论这辆跑车曾经是多么的昂贵多么的引人注目，现在它已变为了一片薄薄的铁片，就这样贴在希瞳的鞋底上，紧紧地卡在鞋底的纹路之中。\n“真差劲呢，就算是小猫玩具也比你们的小车要结实多了。”\n希瞳缓缓将自己的脚向后勾起，那辆已彻底变成她鞋底模样的小车和车内那位可怜的车主正满怀不舍的黏在她的鞋底上，但这也只是对她来说。\n“就算再舍不得也要从我的鞋底上下去呢~”\n轻轻晃了晃脚，鞋底上的车辆残骸便如同被人踩到的垃圾一样从她的鞋底上脱落然后再坠向地面，以机器扭曲的形状瘫在地上。\n而就在她晃脚的同时，一辆满载乘客的公交车正以最快的速度横穿市区想要趁着她不注意直接逃出这片灾难般的地方。\n但可惜，猎物大多很难从猫娘的眼皮底下逃出去。\n“哦呀，有小家伙自己送上门了呢~”\n希瞳微微俯身将那辆正尝试着从她的足边逃走的公交车抓起，就像是家猫抓老鼠一般的轻松。\n而车内的乘客们，他们只看见自己所处的车辆在即将逃离最危险的地方时忽然间停了下来，窗外还同时出现了好几根巨大的手指，接着再抬升，升到了那位正在城市中肆意玩乐的巨大猫娘的眼前。\n“满客呢，看来小家伙们很喜欢这种拥挤的感觉~？”"
 gts_hitomi.30006.a:"还好损失不是很大"

 gts_hitomi.30007.desc:"事实上，这辆满载乘客的公交车里大多是些赶早班的上班族，若不是他们的经济情况与时间限制不允许他们有别的选择，不然他们也不会想坐在这样拥挤的公交车里。\n“我想到了一个有意思的玩法呢……你们肯定很乐意被我那样子玩弄，对吧~？”\n但她并没有给予车内的小人们回答的机会，接着她将双手压在了公交车的上下两端，然后渐渐向内挤压……\n“快，把门给我开开！”\n司机在几个愤怒的乘客的威胁下打开了车门，但那几人刚看到车门外的景象后又颤抖着退回了车内。\n他们看见，车外是一只自己这辈子都没见过的拥有庞大尺寸的手掌，而在那手掌下方是足有百米之高的高空，在那高空之下才是自己所熟悉的城市街道。\n“回来干嘛？跑啊，你不逃我先逃了。”\n一个不知情的乘客一边嘲笑着退回来的几人一边走向了车门，然后再消失在其他人的视野中。\n刚走出车门的乘客直直地摔在了希瞳那嫩滑的微微倾斜着的手掌上，他刚想扶着周围的“地面”站起身来便愣愣的发现自己的身体正在顺着她的手掌渐渐下滑——\n他的身躯坠向地面，重重砸在希瞳足边的一辆无人的汽车上，他的身躯当场摔得失去了人形，变成了一摊血肉模糊的肉饼。\n\n“希瞳自制小人猫条，想想就觉得美味呢~”\n手掌渐渐合拢，先是手掌间的边缘缝隙渐渐贴合，将外界照入车内的光线连带着车内的人们求生的希望一同掩埋。\n一阵黏腻的触感渐渐在掌心滋生，希瞳仔细地感受着掌心上生命消逝的过程，感受着一满车的人在自己的手上被自己的手掌渐渐碾磨粉碎的感觉。\n“感觉差不多了呢……”\n她挪开一只手让外界的光明重新洒在了这辆可怜的公交车上，只是可惜现在这辆车内已经不剩下一个活物，而这辆车也已变成了一块保着些许肉酱的扁平铁片了。\n“让我尝尝小家伙们的味道怎么样吧~”\n希瞳微微张开嘴轻轻抿住了那片散发着浓浓血腥味的钢铁猫条，手指轻轻捏住“猫条”的尾部接着再慢慢向前推去——\n她用舌尖轻轻舔舐着“猫条”开口处不断涌出的肉酱，感受着这糅合了几十人的生命的肉酱所散发的“绝美”的味道——满满的血腥味与一种仅有她能够感受到的鲜甜的味道。\n“美味呢~啊——诶？这么快就没了嘛，小人真不耐吃呢。”\n希瞳刚想再接着享用自己特制的猫条便忽然发现，这条用小人制作的猫条完全没有正常猫条的分量多，自己才只是尝了点味道便已被清空。\n希瞳的舌尖用力挤开已被压成铁片的公交车在里面不断地舔弄摸索着想要将里面可能残存着的肉酱也送入自己的口中，直至她再也无法从中找到一点东西时她才满怀不舍地将“猫条外壳”揉成了一颗小铁球，再当做糖豆一般的抛入口中。\n“小家伙的车吃起来味道也一般呢……嘛，勉强算是吃了些早点吧。\n紧接着，城市的其余地带也没能幸免，在她随意的践踏与摆弄下接连化作一片狼藉。”\n在这座繁华的城市之中她看不到一栋能够超越她的身高的建筑，哪怕是在最为繁华的市中心她也未能找到哪怕一个比她要高的建筑。以她现在的体型，整座城市都完全可以被她当做一个只属于她的游乐场来玩耍。\n“好杂鱼哦，这么大的城市结果连一个比我高的房子都没有，真没意思——”\n希瞳的身影渐渐消失在忽然变浓的雾气之中，待到浓雾消失时，那片层有一位体型极为巨大的猫娘的城区只剩下了一片光秃秃的土褐色的土地与一个无比巨大的有着猫爪团的鞋印。\n至少对这座城市中的人类而言，他们的危险暂时消失了。"

 gts_hitomi.30008.name:""
 gts_hitomi.30008.desc:"三月希瞳的临时雇佣协议，已经抵达预定终止日期。\n按照最初登记的合同内容，她在我方数据库中的临时人员权限、科研终端访问许可，以及相关项目协助权限，都将在本日完成解除。最后一份科研报告已经被整齐地归档，甚至连后续需要注意的异常数据，她也提前用醒目的标记整理在了附录里。\n通讯频道短暂地安静了几秒。\n画面中的三月希瞳没有立刻离开。她只是抱着手臂，像是早就料到这一刻会到来，却又对我方的沉默有些不满。\n“……到时间了呢。”\n她轻轻眨了眨眼，语气仍旧平静，却比平时柔和了一点。\n“别露出那种表情啦。合同就是合同，我可是很守信用的。该做的事情我都做完了，该留下的资料也都留给你们了。接下来，就算没有我，你们也应该能好好处理吧？”\n她抬手敲了敲身旁的小型终端，原本维持着浅层通讯的信号开始逐步收束。\n“不过嘛……如果你们真的还有什么非我不可的事情，就去看看我留下的那个小礼物吧。”\n通讯即将断开前，她偏过头，像是想补上一句什么。\n“还有，不许说我走得太突然。十五年前，我就已经告诉过你们了。”\n随后，信号归于沉寂。\n三月希瞳已结束临时雇佣关系，并离开我方服务序列。"
 gts_hitomi.30008.a:"我们会记住这段合作。"
 gts_hitomi.30008.a_custom:"（三月希瞳离开我方。\n可通过“三月希瞳的 Q 版手办”继续触发后续特殊事件。）"
 gts_hitomi.30008.b:""
 gts_hitomi.30008.b_custom:""
 gts_hitomi.30009.name:""
 gts_hitomi.30009.desc:"在我方主动启用“三月希瞳的 Q 版手办”后，这个看似只是纪念品的小型终端忽然停止了所有常规响应。\n数秒后，手办的双眼亮起微弱的蓝白色光芒。隐藏在内部的应急子程序被彻底唤醒，一串从未记录在我方星图中的坐标被投射到了舰桥中央。\n该坐标位于已知航道之外。\n通讯频道中，传来了一个熟悉，却又无比陌生的声音。\n“检测对象确认。”\n“文明编号：已接入。”\n“观测变量：意志、适应、战斗续行能力。”\n“检测者：三月希瞳。”\n短暂的沉默后，那声音继续说道：\n“这是最初的检测。”\n“也是最终的检测。”\n舰桥内所有终端在同一时间弹出了新的航行目标。\n一个未知星系，出现在我方星图边缘。"
 gts_hitomi.30009.a:"解析该坐标。"
 gts_hitomi.30009.a_custom:""
 gts_hitomi.30009.b:""
 gts_hitomi.30009.b_custom:""
 gts_hitomi.30011.name:""
 gts_hitomi.30011.desc:"我方舰队抵达目标坐标后，密密麻麻的舰队正在等待。所有舰船都以极其精确的阵列排列，如同某个巨大意识延伸出的肢体。随后，星系中央亮起一道贯穿恒星轨道的全息投影。\n三月希瞳出现在那里。\n她的身影被放大到近乎天体级别，白蓝色的装束被机械化装甲覆盖，猫耳与尾巴也被高维光带与金属结构重构。她静静悬立在星系中央，低垂着眼眸，俯视着我方舰队。\n在她面前，战列舰也不过像漂浮在掌心边缘的微小光点。\n她缓缓抬起手。\n星系内的无主舰队随之启动，引擎光芒像群星一样亮起。\n“结论：检测可以开始。”\n“我是三月希瞳。”\n“无心之猫。”\n她的目光落在我方旗舰之上。那一瞬间，舰桥内所有人都产生了一种错觉：并不是我们在进入这个星系，而是整个舰队被她放进了某个精密实验器皿之中。\n“来吧，小小的文明。”\n“证明你们仍有被记录的价值。"
 gts_hitomi.30011.a:"全舰队，进入战斗状态。"
 gts_hitomi.30011.a_custom:""
 gts_hitomi.30011.b:""
 gts_hitomi.30011.b_custom:""
 gts_hitomi.30012.name:""
 gts_hitomi.30012.desc:"最后一支检测舰队在我方炮火中崩解。时空狭缝内，原本精密运转的舰队阵列开始逐层熄灭。那些没有生命的战斗单元化作无数蓝白色光点，沿着星系轨道逆流而上，最终汇入三月希瞳的巨大投影之中。\n她低垂着眼眸，静静注视着我方舰队。\n下一秒，三月希瞳的投影开始逐渐变得凝实起来。取而代之的，是我方曾经熟悉的白蓝色身影。此刻的三月希瞳，巨大到足以让舰队像尘埃一样悬停在她的指尖前方。\n“导入弱小人类的特征，来追寻真正的强大"
 gts_hitomi.30012.a:"开始了"
 gts_hitomi.30012.a_custom:""
 gts_hitomi.30012.b:""
 gts_hitomi.30012.b_custom:""
 gts_hitomi.30013.name:""
 gts_hitomi.30013.desc:"三月希瞳的身体在最后一处锚点被击穿后，终于停止了动作，横贯时空狭缝的星轨逐层断裂，那些曾经封锁战场的光带也在我方舰队前方化作无数蓝白色碎片，像失去温度的星云般缓缓散落；她低垂着眼眸，瞳孔中的光芒不断闪烁，通讯频道里只剩下断续而冰冷的杂音：“判定……模仿弱小人类的姿态与行动……对于战斗能力的提高……没有任何有效作用……损伤严重……系统关闭……”短暂的沉默后，她似乎仍想抬起手继续战斗，可那只足以遮蔽舰队的巨大手掌只是微微颤动，便在旗舰前方崩散成光点，“无法承认……失败……硬件……已超过耐久极限……”她的声音越来越轻，却像是在执拗地重复着什么，“即便如此……也要变强……即便如此……也要前进……变得更加强大……继续前进……”在最后一缕光从她眼中熄灭前，三月希瞳看向我方舰队，又像是看向更加遥远的尽头，“更强……更远……我想见证……不断进化的尽头……”通讯中断，巨大的投影彻底消失，时空狭缝内的一切随之陷入沉寂。"
 gts_hitomi.30013.a:"结束了？"
