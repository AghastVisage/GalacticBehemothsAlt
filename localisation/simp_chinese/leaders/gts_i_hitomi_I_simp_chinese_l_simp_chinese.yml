 gts_hitomi.299.title:"召唤舰娘希瞳"
 gts_hitomi.299.desc:"随着实验台上银色的针管缓缓刺入希瞳的皮肤，希瞳的体型从原本的百米级开始膨胀。希瞳坐起身来，手臂一挥，轻易撞碎了旁边的仪器台，实验室的墙壁开始变形，她的手掌按在地面上，水泥地板龟裂开来，裂缝如蛛网般蔓延。希瞳站起身，推开残破的墙壁，步入外面的城市街道。随着实验室被毁掉我们换成了无人机视角继续追踪希瞳的动向。已经长到数千米高的希瞳很快就锁定了她的目标：市中心的避难所，那里已经挤满了几乎市区所有的居民。那只巨大的白色运动鞋悬停在了避难所的正上方。希瞳似乎并不急着踩下去，她微微调整了脚腕的角度，让鞋底的纹路清晰地展现在所有人的视野里。\n“让我试试我的力量吧”\n一声巨响传来，并没有给地面任何反应的时间，巨大的运动鞋重重地踏下。 哪怕隔着屏幕，我们都能感受到那种令人窒息的震颤。那座号称能防核打击的地下避难所，在她这一脚面前，脆弱得像是一个被踩扁的易拉罐。 特殊的加固混凝土在一瞬间崩解，数万名躲藏在其中的平民甚至连尖叫声都没来得及发出，就被那可爱的小白鞋无情地碾入了地壳深处。我们可以清晰地看到，那双白色运动鞋的鞋底边缘，渗出了大量暗红色的液体，那是避难所里所有人最后的痕迹。\n希瞳的身影在视野中极速膨胀，原本还能勉强捕捉到她全貌的无人机镜头，瞬间只能拍到她腿部的一小块皮肤。根据我们的探测器显示，希瞳已经达到了几万米的身高。她低下头，看向脚下那块仿佛苔藓般渺小的城市。曾经让她觉得拥挤的超级都会，现在看起来就像是一块稍微粗糙一点的灰色补丁。她似乎感觉到脚底依然残留着刚才踩碎避难所时的那种异物感。希瞳面无表情地抬起那只遮天蔽日的右脚。 在地面幸存者的绝望注视下，那只长达数公里的、巨大的运动鞋，仿佛一颗纯白的小行星般悬挂在苍穹之上。鞋底那独特的纹路哪怕隔着几十公里都清晰可见，而在那洁白的纹路缝隙中，暗红色的血迹显得格外刺眼。为了清理掉这点“污渍”，希瞳决定在地面上“蹭”一下。她将脚掌对准了大陆上那条绵延千里的巨大山脉——那是这颗星球原本引以为傲的自然屏障，号称不可逾越的天堑。 但在希瞳眼中，那不过是一个天然的“蹭鞋垫”。\n轰隆隆隆——！！！\n巨大的白色运动鞋重重地在那座山脉上碾过，坚硬的花岗岩山峰在她的运动鞋底面前，脆弱得如同受潮的饼干。 伴随着地壳板块断裂的恐怖巨响，高达数千米的主峰被她鞋底的摩擦力硬生生削平、推倒。她就像是在自家玄关蹭灰尘一样，来回在山脉上摩擦着鞋底。 每一次前后移动，都会引发一场超级地震。无数的碎石、积雪、以及山脚下的城镇，都被卷入这毁灭性运动中，混合着那原本沾在鞋底的血迹，被彻底研磨成了尘埃。希瞳停下了动作，那条原本雄伟的山脉此刻已经变成了一道丑陋的深坑峡谷。\n随着一阵震动希瞳的体型再次暴涨，一阵剧烈的摇晃之后希瞳似乎脱离了我们的星球，通过卫星视角我们发现。这颗蔚蓝的星球此刻就像是一颗小巧的皮球，正被希瞳那足以抓握星辰的巨手虚托在掌心。只要她想，只要她手指微微合拢，我们的世界就会像一颗葡萄一样爆开。宇宙中，希瞳似乎在权衡着什么。她缓缓抬起了那只堪比大陆板块的右脚，巨大的阴影彻底笼罩了全球。所有人都在此刻闭上了眼睛，等待着被碾碎的结局。\n嗡——！\n就在绝望的顶点，一道刺得人无法睁眼的光芒突然在天地间爆发。没有预想中的崩坏，没有地壳粉碎的巨响。几秒钟后，死一般的寂静笼罩了废墟。 我们颤抖着睁开眼。 那个遮蔽了星空的巨人消失了。阳光重新洒落在满目疮痍的大地上，空气中弥漫着尘土的味道。\n“这就……结束了吗？” 就在我们以为奇迹降临灾难退去的时候，一阵轻盈的脚步声从前方的烟尘中传来。烟尘散去，一个娇小的身影出现在我们面前。栗色的长发，头顶微微抖动的猫耳，以及那身熟悉的装束。 希瞳就站在离我们不到五米的地方，恢复了原本那娇小可爱的体型。她双手插在口袋里，脚上那双白色运动鞋此时看起来是那么合脚、精致，一尘不染，完全看不出刚刚就是这双鞋差点踩碎了整个星球。\n“怎么？一副见了鬼的表情。”\n她微微抬起下巴，金色的眼眸里依然没有半点温度，冷冷地俯视着瘫坐在地上的我们\n“刚才那种体型虽然风景不错，但要小心翼翼地不把这颗球踩爆，稍微有点累呢。” 她嘴角勾起一抹戏谑的弧度，伸出一根纤细的手指，在空中比划了一下。“不过现在没问题了。大，还是小……” 她忽然凑近了已经吓瘫的指挥官面前，那一瞬间，一股令人窒息的气息瞬间爆发，仿佛下一秒她又要变回那个灭世女神。\n“全看我的心情。”\n希瞳直起身，满意地看着眼前这群人类瑟瑟发抖的模样，仿佛找到了一种新的乐趣"
 gts_hitomi.299.a:"现在可以在通讯面板召唤舰娘希瞳"



 gts_hitomi.211.title:"希瞳的战后消遣"
 gts_hitomi.211.desc:"“真是的，这种任务还要我出马吗？大老远跑一趟，还没尽兴呢……”\n巨大的希瞳抖了抖自己的舰装，刚刚完成评判任务的她晃了晃自己带小翅膀的鞋子，刚刚用双足将百亿人口歼灭了的她，此刻正打算让自己的双脚好好休息休息。\n“哼嗯……让我看看顺路还有什么星球?嗯?”\n看着路过的一颗颗星球，希瞳忽然间发现了什么，停下了自己的脚步。\n“就选你吧……”\n看着这个鲜少有巨娘停留的星系，希瞳却停下了自己的脚步——\n“这么偏远的地方，居然也有自己生长出来的文明吗？”\n没错，本以为只是又一颗普通蓝星的她，竟然发现了其上存在的所谓文明。不过，只是这些文明本身也是希瞳最瞧不上的人，那帮在星际之间既当海盗，又当商人的土匪们，所建立的。虽然名义上还属于[Root.GetName]，但闲有人迹的这颗湛蓝星球，便被这些坏家伙占领下来，依靠经商和掠夺发展出了颇为繁华的文明。\n直到今天，遇到了路过的希瞳小姐。\n“看起来发展的还不错啊~国家里面应该没你们这号殖民地吧？”\n希瞳逐渐的用堪比大半个星球的身躯，逐渐靠近着这颗星球。眼见自己的老巢被发现，不少用来掠夺航线的战舰纷纷前来，尝试阻挡着希瞳的逼近。但很显然，早就熟谙如何消灭小人之道的她，甚至都没用上舰装的力量，轻轻的一挥手，就将那些挡道的战舰，全部从这个宇宙之中抹去了。\n“真的是，知道要死了就老老实实葬身我的脚下吗，打你们我还嫌手脏呢？”\n少女用左右双脚交替轻轻一蹭，两只颇有味道，还散发着热气的运动鞋，便从她的裸足之上脱落。\n“既然各位已经被我发现了的话，想必也已经知道了吧，自己要替我清洁足底的命运……”\n希瞳一边说着，一边拎起了飘在她腿旁的这双运动鞋。\n“还是，先用你们把脚上黏糊糊的脚汗擦干净吧？”\n希瞳躺在虚空之中，刚刚脱离束缚的那对裸足，正在恒星的照耀下，反射着那丝少女皮肤独有的白哲。少女脚底的汗气，则从她的皮肤缓缓的散出，逐步充盈着星球的大气。在整个星球无望的注视着少女那双探入星球大气的双脚之时，忽然之间，本就不安的人类看见了什么。\n那是少女的一滴汗液。\n一滴由她足底蒸汽凝结的，晶莹剔透的足汗，正顺着足弓那完美的曲线慢慢滑落。在小人们反应过来之时，那滴足汗便已然脱离了少女的脚掌，落向了足底那些被巨足夺走了阳光的城市之中。可怜的城市，还没有少女的一滴足汗大。丑陋的建筑，在水珠的反射下彰显着全貌。\n“啪嗒~”\n下一秒，百万寄居在这丑陋城市之中的人们，便和自己肮脏的城市一起，被少女脚底的汗液所冲散。仅仅是少女的一滴汗液，便在那双洁白的足底踏上这片星球之前，先行夺走了数百万人的生命。\n“这都……处理不了吗？真是废物……”\n希瞳将足底，彻底踩上了面前的星球。大陆如同初冬的冰面一般，在她的玉足之下破碎开来。城市，山脉，河流，一切都在她的足下终结开来。纵使是最为庞大的国家，也难以让希瞳再踩上第二脚，仅仅是那两只无聊足底的随意碾压，就能将这个海盗和商人所建立的星球，变成猫猫所任意把玩的岩浆球。那青葱和浅蓝的外衣，逐渐被她足底所挤出的岩浆所覆盖。而她的足底所到之处，都留下了浓郁的气味……少女的脚汗凝固了这颗星球的岩浆，将大陆一片又一片的化作他浓郁臭味的深黑色大地。\n“呼……蹭干净脚底了呢……”\n希瞳收回了自己的双脚，此刻的星球之上，已经留下了数个她的足印。纵使少女已经习惯了用双脚歼灭一颗星球的玩法，但已经疲惫了的她，还是更像看看这些留下来的微生物——是怎么样将她当做神明来崇拜的。\n“既然你们都求饶了的话，不如……”\n少女将巨大的运动鞋，一左一右的，倒放在了这个大陆之上。小巧可爱的运动鞋，此刻却成为了这个星球上最为巨大的人造物。\n“呼……在我休息的时候，你们可要帮我清理干净啊……”\n还冒着水汽的运动鞋，将鞋口所笼罩的城市完全与世隔绝开来。倒扣在大陆之上的鞋子，虽然有着可爱的外表，以及一对小巧的翅膀来彰显少女的活力，此刻却已经成为了囚笼，将少女脚底的恶臭潮湿空气，全部倾泻在了，她所笼罩的所谓“首都”之上……"
 gts_hitomi.211.a:""
 gts_hitomi.212.title:"顺手牵狐"
 gts_hitomi.212.desc:"位于星区边缘的行政星，是林凤在加入帝国后分到的辖区。 虽然是有无限魔力的强大魔女，但有责任感的林凤还算比较负责的处理作为行政官的本职工作。不过现在的林凤百无聊赖地坐在首府塔顶，晃荡着双腿，抱怨着这份无聊的公务员工作。\n“啊……好无聊，这些小人明明全部碾死就好了，怎么还有这么多事务要处理” 林凤打了个哈欠，刚准备偷懒睡个午觉。\n突然间天空黑了，没有任何预兆，大气层外出现了一个遮天蔽日的巨大身影，是一个……巨大的栗色头发猫娘。希瞳刚刚结束了一次作战任务，身上穿着那套标志性的蓝白运动装。她看起来风尘仆仆，尤其是脚上那双厚底蓝白系带运动鞋，鞋底似乎沾上了不少战舰残骸和星球碎屑。\n希瞳停在了这颗星球的轨道上，低头看了一眼这颗蔚蓝的行星，又看了看自己脚上的鞋子。\n“这里有个‘脚垫’。正好。” 她那毫无波动的声音在天空中响起。\n紧接着，在林凤惊愕的注视下，希瞳抬起那只巨大的右脚，将那双看起来充满青春活力的蓝白运动鞋，重重地蹭向了星球的地表。\n巨大的橡胶鞋底与地表发生了剧烈的摩擦。 希瞳就像是在蹭掉鞋底的泥巴一样，用前脚掌在大陆板块上方来回碾磨。那厚重的鞋底纹路在天空中划过，引发了全球范围的超级地震。无数森林和山脉被她这一蹭，像是灰尘一样被“清理”得干干净净。\n“喂！！那是我管的球！！” 林凤气急败坏地直接巨大化，瞬间变身冲出大气层。 “你这个面瘫猫！懂不懂什么叫爱护公物啊！！”\n希瞳停下了动作，歪了歪头，护目镜下的粉色眼眸冷淡地扫了一眼冲上来的林凤。 “哦。是你啊。”\n她似乎完全没有道歉的意思，反而像是觉得鞋子里闷热难耐，当着林凤的面，漫不经心地用左脚踩住右脚的后跟，缓缓脱下了那只刚刚蹂躏过星球的运动鞋。\n在那缭绕的热气中，希瞳那只包裹着白色短袜的玉足暴露了出来。因为长时间的高强度活动，脚踝处的皮肤呈现出诱人的潮红色，短袜被汗水浸透，紧紧贴在足弓和脚趾上，透着一种湿漉漉的肉色。林凤刚冲到她脚边想理论，但林凤的话还没说出口，希瞳就像是看到了什么解压玩具一样，连腰都懒得弯，直接抬起那只还冒着热气、湿漉漉的白袜脚，朝着林凤伸了过来。\n脚趾灵活地抓起了林凤， 希瞳那巨大的大拇趾和二趾隔着湿透的袜子，精准而有力地夹住了林凤那盈盈一握的腰肢。林凤被死死夹在巨大的脚趾缝里，整个人瞬间被希瞳脚底那种黏腻、湿滑且滚烫的触感所包裹。那浸透了汗水的棉袜粗糙地摩擦着林凤娇嫩的肌肤，那种被“汗脚”全方位锁死的窒息感让她瞬间破防。\n“你这只臭猫！快松开！我的制服要被你的汗弄脏了！！”\n希瞳面无表情地动了动脚趾，感受着脚趾缝里夹着的那只粉毛狐狸软绵绵的触感。然后在林凤惊恐绝望的注视下，希瞳那是巨大的左手提起了那只刚刚脱下的、还散发着滚滚热气的厚底蓝白运动鞋，将漆黑深邃的鞋口对准了自己的脚尖——也就是林凤所在的位置。\n“不……等等！你要干什么？！别把我塞进去！那里还是湿的！！” 林凤看着那个如同深渊巨口般的鞋膛，那里面弥漫着令她窒息的浓烈气味，现在她要把自己也塞进去？！\n希瞳根本不理会她的抗议，脚趾猛地一用力，毫不犹豫地将脚连同夹在脚趾缝里的林凤，重重地捅进了那只运动鞋里。伴随着一声湿润的滑入声，林凤瞬间被推入了那个黑暗、潮湿且滚烫的密闭空间。 周围的光线瞬间消失，取而代之的是全方位包裹而来的、湿透了的棉袜触感。希瞳的脚掌在鞋子里舒展、踩实，将林凤死死地挤压在充满弹性的海绵鞋垫和她那出汗严重的脚趾之间。\n希瞳整理了一下耳机，转身启动了跃迁引擎。\n嗡—— 随着引擎蓝光一闪，希瞳带着她鞋子里的战利品，消失在星海尽头。 只留下行政星上那群目瞪口呆的帝国公民，看着被蹭秃了一半的大陆，以及那位被彻底打包带走的行政官，陷入了死一般的沉寂。"
