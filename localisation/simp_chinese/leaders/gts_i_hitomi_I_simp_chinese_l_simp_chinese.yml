 gts_hitomi.30017.name:"三月希瞳"
 gts_hitomi.30017.desc:"这、这次我可不是临时来的了……你们拼尽全力的样子让我看到了新的可能性，所以我会正式加入你们，继续学习这个世界、记录这个世界，顺便把那些麻烦的科研项目都处理掉——但、但是不要以为这样就能随便盯着我看，耳朵也还是不能摸！"
 gts_hitomi.30017.a.name:"你就没有点更厉害的能力嘛"
 gts_hitomi.30017.a.response:"这个嘛确实可以，只不过不是现在哦~敬请期待三月希瞳绝境战！（coming soon）"
