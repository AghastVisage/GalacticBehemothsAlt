 gts_hitomi.213.title:"呜，被反杀了"
 gts_hitomi.213.desc:"希瞳哼着不成调的小曲，迈着轻快的步伐回到了自己的办公室。她并没有急着脱鞋，反而甚至有点享受那种脚趾缝里空荡荡的感觉—— 嗯？空荡荡？\n希瞳愣了一下，下意识地隔着鞋面蹭了蹭脚趾。 刚才那种夹着软绵绵物体的充实感……什么时候消失了？ 那只粉毛狐狸呢？难道被被踩化了？ 希瞳心大地耸了耸肩，舒服地伸了个懒腰，正准备好好休息的时候\n“你觉得……很爽是吗？”\n一个冰冷刺骨的声音，毫无征兆地从办公椅的高耸椅背后面传来。 那声音离得极近，湿热的吐息甚至直接吹拂到了希瞳敏感的猫耳绒毛上。\n希瞳的身体瞬间僵硬，全身的寒毛在一秒钟内全部炸起。 她机械地、一点一点地转过头。 视野中，林凤正趴在椅背上，那双粉色的桃花眼弯成了一个极其危险的弧度，嘴角挂着让人毛骨悚然的微笑。她身上别说伤痕了，连一滴汗水都没沾上，整个人干爽、整洁，散发着一股淡淡的清香。\n“我问你话呢，小猫咪。” 林凤伸出手指，轻轻划过希瞳惨白的脸颊。 “把我塞进臭烘烘的鞋子里踩着玩……很爽，是吗？”\n希瞳本能地结巴着回答： “是……是……是的吧……”\n空气凝固了半秒。 林凤嘴角的笑意瞬间扩大。\n“那——你就一直爽去吧。”\n话音未落，办公室的空间瞬间扭曲。 林凤的身形并没有变大，但在希瞳的感知中，发现是她自己……变小了。希瞳惊恐地发现，自己被林凤单手提了起来，而林凤的另一只手，正缓缓撩起那短得可怜的行政官制服裙摆，以及那条粉色的内裤。\n出现在希瞳眼前的，是一道散发着温热潮湿的……深渊，是林凤最为私密、也最为恐怖的蜜穴。\n“既然你这么喜欢把人塞进这种又湿、又热、又紧的地方……” 林凤的声音如同恶魔的低语，回荡在希瞳耳边。 “那就用你的身体，亲自进去体验一下吧——在这个地方，永远地侍奉我。”\n没有任何求饶的机会。 林凤的手指无情地发力，将只有巴掌大小的希瞳，对准了那处早已渴望吞噬的入口，重重地按了进去。 在这个绝对的肉体囚笼面前，希瞳的挣扎显得那么无力。她甚至来不及发出最后一声尖叫，整个人就被那温暖湿滑的肉壁彻底吞没、包裹、吸入。\n随着一声轻微的水声，一切归于平静。\n不知过了多久，办公室的门被自动清洁机器人推开。 宽大的办公椅上空无一人，只留下了微微凹陷的坐垫，似乎刚才还有人坐在这里。 而在椅子的把手上，静静地躺着几根晶莹剔透的粉色狐毛。"
