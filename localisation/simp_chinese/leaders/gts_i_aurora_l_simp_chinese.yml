  gts_aurora.1080.b.tooltip: "§r$NAME_gts_arlo$§!：\n体型增加了§G[event_target:gts_nutrition_planet.gts_bruh_get_planet_size_change_count]§!\n获得了§G[event_target:gts_nutrition_planet.gts_bruh_get_experience_count]§!点经验值\n已经§Y$gts_vore_kills_logs$§!增加了§R[event_target:gts_nutrition_planet.gts_bruh_get_planet_killed_pop_count]§!人\n已经§Y$gts_city_kills_logs$§!增加了§R[event_target:gts_nutrition_planet.gts_bruh_get_planet_destroyed_city_count]§!座\n已经§Y$gts_planet_kills_logs$§!增加了§R1§!颗"
  gts_aurora.1091.desc: "§H这就是欧若拉大人的嘴唇上嘛，真的好柔软啊。§!\n\n一群加在一起对于欧若拉大人来说，连灰尘都不如的人，因为好奇与另一个羞耻的原因聚集在此。\n\n§H是呀是呀!§!\n\n§H连空气间都充斥满欧若拉大人齿涎的香甜气息。§!\n\n§H是呀是呀！§!\n\n这群难以被察觉的小人匍匐在地面，亲吻舔舐起甘甜柔软的唇瓣，丝毫不知有一股恐怖的能量正在汇聚。\n\n地面晃动，恐怖的吸力卷来，有许多人被气流卷起投入到嘴唇间开合的峡谷裂隙中，粘在了牙齿，舌面，甚至被吸到了更深的地方。\n\n§r啊湫§!\n\n欧若拉忍耐着鼻腔的瘙痒，直到发现忍耐不下来，才控制自己小小地打了一个喷嚏。\n\n难以想象的空气喷射而出，强劲的气流撕碎了不请自来的无礼之徒，就算有命大的幸存者。却也被一同送往了星系深处开启了一场难以遗忘的星系之旅。\n\n§r应该没人看见吧？§!\n\n欧若拉天真的希望无人能注意到她失礼的打了一个喷嚏，完全忽略了自己巨大的体型是多么的显眼。"
  gts_aurora.1092.desc: "在欧若拉的后庭处，被称作星系之眼的菊穴如同星系间最盛大的花朵一样，一收一展地绽放着。\n\n尽管这对于巨娘来说只是最微小、无意识的身体自然蠕动，但相对于居住在巨娘上的居民来说，依旧是壮观的奇景。\n\n一对穿戴整齐的小人正站在不断蠕动的深渊边缘，不断的拍照摆姿势。\n\n§H怎么样，这个探险地点选的不错吧？记得把我拍的英勇一点。§!\n\n他们把自己的行为当做一次大胆的鬼屋探险，这里当做了景区名地，不断的拍照纪念。\n\n但也许是小人的行为造成了影响，也许只是菊穴的收缩无意识的稍微大了一点，小人所站的位置正在舒展，向内凹陷，他们因此无法控制的向中间的深渊滑落。\n\n不过工具的齐全让小人正好停留在菊穴的入口部分。不至于掉入充斥气味的肠道中。\n\n§H哈，人类的智慧，有备无患不是…§!\n\n菊穴舒展又收缩，收紧的括约肌推着他们向那一侧汇合，两堵肉墙死死贴合在一起，小人连同人类的智慧一起被紧致的菊穴碾碎了。\n\n§r感觉好痒。§!\n\n欧若拉左手按上还不够挺翘的臀部，回首观察异常的位置，不过身体的构造阻止了她，尝试无果后她放弃了。\n\n§r不过，似乎还挺舒服的。§!"
  gts_aurora.1093.desc: "尽管欧若拉巨大的身躯始终赤裸着，但在她体内积蓄的、星球般的能量，已就为她提供了不低的热量，这也导致了她的腋下偶尔会继续起薄薄的汗液。\n\n而这充满风险又不规律、不富足的巨娘体液，自然没有被政府雇员所盯上，反而成了另一部分私人开采客的天堂，尽管这并不安全，他们也愿意付出一时的风险，来赌接下来几年无拘无束的生活。\n\n他们日常来到距离腋窝较远的地方观察是否有体液产出，他们也得偿所愿的，得到了想要的结果。\n\n欧若拉腋下已经沁出了薄薄的汗液，那一颗颗晶莹剔透的汁液，如同勾魂锁魄的糖水一般，勾引着他们的身体、精神。\n\n他们奔跑着来到了欧若拉的腋窝，甜腻浓郁的气息入侵了他们的思想，可口美味的体液摧毁了他们的意志，闷热的环境蒸腾了他们的心神。\n\n那些满眼财富的逐财客，转眼就成臣服在女孩身体主动降温时，生产的副产物下，他们跪地齐齐允吸着一颗最微小，最不起眼的一颗汗珠，并进行了最原始的色情崇拜行为。\n\n尽管这颗非常微不足道、渺小的的汗珠，也如同高山般远比这些小人巨大的很多，其中只有稀少个别的人抵抗住了诱惑，采取到了自己满足的分量，匆匆离开了此地。\n\n§r唔，好痒。§!\n\n闷热的腋下让女孩感到了瘙痒，而这就是让政府国委员不想在此建设的主要原因。\n\n无法看到边际的的手指遮到了头顶，这些完全丧失了理智的小人意识不到发生了什么，就被指头连同汗液摩擦碾碎，被指甲剐蹭到指甲缝中，混合融入到杂质中化作了污垢，等待被下一次的身体清理部队打扫清理出去。\n\n欧若拉收回了手，完全没有注意到手指间发生了什么，这对她而言仅是一次普通的抓痒，毕竟有谁能注意到比灰尘还要渺小的存在呢？"
  gts_aurora.1094.desc: "欧若拉大人的小穴内，阴道内肉壁上布满不断蠕动、参差不齐的圆型凸起，那些凸起与彼此之间互相接触、摩擦、挤压，仅是两处凸起互相挤压时的力量就足矣毁灭行星，互相碰撞时的表面震颤起的地震，就能毁灭绝大部分想在此扎根的建筑。\n\n对于小人来说这里拥有要比恒星更宏大，比黑洞更恐怖的伟力，不过他们还是克服了这些困难，整个星球一半的体液开采工厂零散的分布在此。\n\n工厂内那些能与山岳比肩的铁锤缓缓爬升又坠下，一下下敲着软肉上，造成未比虫子强多少的微小触觉，刺激欧若拉娇柔的小穴，充满女孩味道的爱液在凸起间的裂隙中缓缓渗出，积蓄出一片爱液湖泊，专门的工作人员拿着工具收集着这些体液。\n\n炙热的肉壁蒸腾着爱液，在广阔的小穴内具有催情效果的爱液不断挥发，构造出令人血脉喷张浑身发烫的甜蜜潮湿的小穴桑拿房。\n\n一分一秒过去，尽管这些小人们有着减少影响的防护服，也有点吃不消，快要抵抗不住那种诱惑，想要全身投入到那一片爱液中。\n\n§H交班，交班。§!\n\n小人们沿着搭建好的安全道路离开，其中一位小人突然停下步伐，佝偻腰背以手抚胸，喃喃自语。\n\n§H好浓郁的味道，欧若拉大人的小穴，欧若拉大人的爱液，好想要…不想要离开这里，不想要离开欧若拉大人的爱液。§!\n\n那个小人脱下防护服，喘着粗气像发情的野兽般呼吸着空中雌性味道。\n\n§H呼…呼…好棒，还想要更多。§!\n\n小人一只手探到身下不断摆动，一边翻越安全通道投入到外面爱液软肉的淫靡中。\n\n小人投身粘稠的爱液中，让整个身体被淹没，大口吸入的爱液填满了小人的肺腔，手指不断地在下体运动，不过短短几分钟小人就已高潮数次。\n\n肉壁蠕动，两堵肉墙把小人掩埋，周围的人就这么看着对方被包裹、吞噬，他们对此已经见怪不怪，反倒有点羡慕。\n\n小人就这样窒息消逝在软肉间化作小穴里的阴垢，没有带给欧若拉哪怕一丝一毫的快感。\n\n§r唔，好舒服，小穴里的大家今天也很努力。§!\n\n欧若拉轻抚小腹，感受着体内工厂的运转，露出一个满意的微笑。"
  gts_aurora.1095.desc: "\n\n§H报告，这是到目前为止所有的失踪损失人口，包括不限于被欧若拉大人的喷嚏吹飞，自制力不行迷失在小穴深处，藏入食物中被吃掉，在城区再也没回来的……§!\n\n§H到目前为止我们一共损失了上百万[Root.Owner.GetSpeciesName]，需要和欧若拉沟通协调一下吗？。§!\n\n手套的主人按揉起紧皱的眉头，望向窗外瞪大眼睛兴致勃勃观察人们工作的女孩。\n\n§H不，不用。在教育安排上新增对全民科普巨娘身体生存课程，在危险区域设立告示牌，如果还有这种情况，就当优化物种了。§!\n\n不久后法令颁布，此类现象大部分减少，但依旧有狂热的爱好者消失在不知何处。"
  gts_aurora.1095.tooltip: "§Y后续欧若拉星球随机人口减少事件惩罚由 §G1000§!£pops£ 降低至 §G500§!£pops£§!"
  gts_aurora.1191.desc: "§H欧若拉大人，食物已经备好，请用。§!\n\n母舰拉着行星大小的圆碗飘浮在欧若拉面前，里面堆叠起许多与这个碗大小不符的小份食物，还没有培育出巨型蔬果的小人，只能先以这种方式为欧若拉大人提供主食菜品，但在奶油蛋糕之类的面点甜品就没有这方面的烦恼。\n\n表面香气四溢的菜肴遮蔽下，狂热崇拜着欧若拉大人的小人混入碗里的菜叶之中，渴望着能进入精神圣土:欧若拉大人的嘴里，因此这些小人清洗净身体为求不玷污欧若拉大人的嘴，并在制作运输的过程里潜入食物中。\n\n纵使现在防备他们这种人的流程愈加苛刻，但始终做不到完全阻止这种现象。\n\n§r谢谢你们，我要开吃了。§!\n\n舰船切断了连接，欧若拉捧起小碗仰头倒入口中，小人也随着稀碎的食物扎入口中。\n\n一小碗的分量很快就全部落入口中，欧若拉合上嘴开始咀嚼，口腔内陷入了黑暗，比城市还宽广的牙齿砸了下来。\n\n落在牙齿上的小人一个个爆开，与菜肴一起被牙齿切割碾碎，血液的铁腥味与香甜的唾液、美味的菜糜混在一起，为这份菜肴增添了一丝鲜甜，接着香舌翻动，将另一片没被咀嚼过的菜肴连同小人送到牙面上。\n\n不断的咀嚼让口腔内的唾液逐渐积蓄，欧若拉合眼饕足地咽下食糜，感受着美食进入咽喉，划过温暖的食道，落入不断蠕动，渴求食物的胃中。\n\n口腔内最后仅在齿根处幸存下几位没有被舌头和牙齿波及的小人，这些小人亲吻牙床赞美着欧若拉大人的仁慈，吞咽起齿缝间的唾液，清理着藏匿在这食物残渣。\n\n具有催情效果的唾液被小人咽入腹中，发酵过有些酸甜的味道侵蚀着小人理智，渐渐的小人们发现自己越来越离不开欧若拉大人的唾液。\n\n可以预见，尽管没有变成食物的小人，也会在这里渐渐失去生为人的尊严，在欧若拉大人的口腔内变成离不开唾液，清理口腔食物残渣的食渣虫。"
  gts_aurora.1192.desc: "最近巨娘狂热崇拜者中，兴起了一场从后庭进入、穿过直肠，在肠道中被消化吸收，变成欧若拉大人身体营养的潮流。\n\n表面上他们宣称，这样可以成为欧若拉大人身体一部分，与欧若拉大人的意念契合，但实际这只是为了满足他们的性欲。\n\n后庭处，欧若拉大人不断开合的菊穴边，这些小人兴奋的聚集到此，他们彼此之间不断讨论着待会的路程，完全没有对最后会死的恐惧。\n\n趁着菊穴收缩又放松的时候，他们一批一批的跃入，扎入到直肠中，等到适应了眼前昏暗的光线小人们看向四周。\n\n周围的环境宽广暗红如同进入到一处新的天地，肠道的肉壁上爬满扭曲横向的褶皱，不断的来回挤压蠕动着，在肉壁的表面一层晶莹的粘液，踩在上面如同行走在发生小幅地震的冰面上，必须匍匐才能较为从容的前进。\n\n小人们感叹还好直肠中没有食物残渣的堆积，不然还未成为欧若拉大人的营养，就被直肠的蠕动抹入排泄物的表面，一起被排出体外。\n\n小人们匍匐着穿过悠长的直肠，翻越过一节节盛有发酵食糜的圆状结肠，在工具的帮助下勉强穿过回盲瓣。\n\n在漫长的时间后小人们到达了此行的终点小肠，这里的肉壁上布满比他们更高大的绒毛，空气中也没有了淡淡的臭味，取而代之的是带有奶油蛋糕的酸味。\n\n§H欧若拉大人今天的甜点原来是奶油蛋糕呀。§!\n\n小人们褪下防护服，赤身裸体的走入绒毛丛中，柔软绒毛刮过皮肤，小人们很快就发现自己的皮肤开始有灼烧感，却又如同梦一般消失不见。\n\n绒毛不断的揉蹭着身体，蠕动的小肠化作来回摇摆温暖的摇篮，小人们感觉眼皮沉重，在这里沉沉睡去失去对外界的感知，做起一个永远不会醒来的美梦。\n\n接着肠液分泌将他们覆盖，毫无知觉的被分解，在美好的梦境中，化作欧罗拉大人的营养。"
  gts_aurora.1193.desc: "自从星球决案颁布之后，欧若拉大人常活动的部位被划上了禁区，而不去这些地方成了居住在身体上人们的共识。\n\n但这也让部分年轻的小人情侣，将去往这些地方视作他们发挥叛逆精神、彻底独立的彰显，同时在这幽会时，那种违背社会规则在生命边缘试探的刺激也让他们欲罢不能。\n\n为了追寻这种刺激，这对小人情侣为此来到了此处。在胸膛砰砰直跳的兴奋中这对小人结束了拥吻，眼神迷离的对视着皆有些意犹未尽，她们已经是第三次来到这里，但之前她们并未前往深处，只敢在外围，只敢在脚背上做。但这样的刺激感现在已经满足不了她们了，她们看向后方，看向如白玉般的脚背前端，五个软糯圆润的脚趾缝间的广阔空间。\n\n女孩子可爱的脚趾缝间看上去就已经很色了，如果在那里做爱只是想想就已经让这对小人面红耳赤头顶冒起蒸汽，在对视的眼神之后，她们明白了对方的意图动身前往了趾缝之间。没用太长时间她们便来到两座有小行星规模的大拇趾与第二趾的缝隙中，来到对他们而言如同乳白的大海上，这里的海面上弥散着一层令人浑身燥热，头脑冲动的淡泊足臭，而且越闻越令人上瘾，恨不得将头埋入趾窝里舔舐汗液，品尝美味的趾肉。\n\n其中一个小人遵循着内心的意愿直接扑倒了对方，用舌头蛮横的敲开对方的口腔蛮横的索取起对方的口津，另一只手也伸到了对方身下开始猛烈的抽插。他们彼此拥抱地翻滚向趾窝深处，她们并不是很担心可能的危险，毕竟前两次做的时候足趾就毫无动静。不断的翻滚中她们身上被涂抹了令人发情的足汗，涂抹上彼此的体液，头脑的昏沉让她们失去对外界的感知，只是狠狠拥抱着，恨不得与彼此融为一体。仅仅又过了一会。意外陡生，两座小行星般的肉墙向着彼此靠拢，而失去理智的小人情侣丝毫不关注彼此之外的动静，依旧机械地用手指在对方下体摆动。\n\n噗叽—— 肉墙贴合在一起，这对小人也愈发紧密地贴合在一起，最终她们如愿的与彼此融为一体，随着足趾的前后揉搓摆动，被均匀的涂平抹开。\n\n§r唔姆——§!\n\n刚刚睡醒的欧若拉，丝毫没有注意到有两个微小的存在，在小脚丫无意识的揉搓下销声匿迹。"
  gts_aurora.1194.desc: "欧若拉大人的小穴口，另一条不属于工厂的偏僻小道，小人们穿行过粗壮的阴毛树林，站在粉嫩的幼小阴唇上，穴口处的阴唇表面沾满黏哒哒的爱液。\n\n崇拜着欧若拉大人的小人，在这里退下了衣物以最坦诚的姿态跃入暗红的深渊甬道中，他们掉落在阴道内侧、富有弹性的软肉丘陵上，肉丘如同弹床接住了小人，又将其高高弹起。\n\n等到全部人聚集齐，他们向着小穴的深处前进，一路上总有人被阴道壁的沟壑捕获，陷入到软绵绵的阴肉沉入沟壑底部再也无法离去，尽管他们因此醉心梦死甘愿化作清理阴道的小虫，直到被爱液吞没窒息而死。\n\n不知过了多久，肉壁的蠕动幅度减弱，最后仅剩的一小部分小人湿漉漉的站在如同空间站的子宫颈前。\n\n在小人眼中中心凹陷，外圈圆润的子宫颈，高大巍峨得难以用言语表达，而那子宫颈中间凹陷的洞窟所连接的子宫，便是这些小人来到这的目的。\n\n这些小人们渴望能进入欧若拉大人的子宫，进入那片圣所，哪怕那会让小人真真正正再也无法逃离欧若拉大人的阴道，最后在子宫的爱液里丧失理智，成为清理子宫的阴虫。\n\n那子宫口与阴道底部之间有着难以企及的距离，且子宫颈饱满的外圈有着一层粘滑的爱液，就如同被涂抹了洗洁精难以着力，小人们仅向上攀爬两步就坠落下来。\n\n不知道过去了多久年月后，这些小人始终没有攀登上去，而没有食物的小人只能从爱液中汲取营养，化作了对爱液越来越上瘾的卑微虫子，散布各处的阴道沟壑里。"

