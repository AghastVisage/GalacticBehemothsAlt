  gts_qinwen.16.name:""
  gts_qinwen.16.desc:"海柠被两根手指捏着，悬在半空。她低头看了一眼——秦雯的手指白皙纤细，指甲修剪得整齐干净，指尖上泛映着淡淡的粉色。每一道指纹都是一道峡谷，甚至，还夹带着几颗星球残渣\n秦雯看着她，像看着什么有趣的小东西。\n小柠好可爱。”\n海柠愣住了。\n“平时那么温柔，那么小心翼翼的，原来心里藏着这种东西呀。”秦雯笑着，笑容里带着宠溺，“释放欲望什么的……有当女神的潜质呢。”\n“雯雯…坏...突然变的这么大\n声音小得像蚊子哼哼。\n秦雯愣了一下，随后，便捂着嘴唇，噗嗤一下，笑了出来\n她笑得眉眼弯弯，笑得那两只巨大的玉足都轻轻晃了晃——那个动作，让她足掌间的地球都微微崩裂，若不是海柠被她捏了起来，要不然，海柠也会被碾成渣吧\n“我本来就很大呀。”秦雯笑着说，语气里带着点得意，“只是小柠一直没发现而已。”\n“刚才，自己在宇宙外面，找呀找，找呀找，发现，原来你在这颗小星球里，然后自己就变小了啦~”\n“你...为什么会变大...”\n“你说的，这是梦呀，等梦过去了再说吧”\n“那现在～”\n她轻轻笑着，声音里满是宠溺和玩味\n“轮到我玩啦~”\n说罢，秦雯把手心上的小海柠拖到了唇边，巨大的双唇在海柠眼里也与星体无异，止不过，在海柠眼里却无半点压迫感，更多的是温暖与悸动了\n“小柠~可爱呢...”\n秦雯愣了一下。\n随后，她捂着嘴唇，“噗嗤”一下笑了出来。\n那笑声轻柔得像风铃摇曳，却让整片宇宙都跟着轻轻颤动。她笑得眉眼弯弯，笑得那两只巨大的玉足都微微晃了晃——那个动作，让她足掌间的地球都轻轻滚动了一下，地表崩裂出几道细纹，岩浆从裂缝中渗出，又很快被宇宙的低温凝固。\n若是海柠没有被捏在掌心，恐怕也会像那些城市一样，被碾成细碎的尘埃吧。\n但此刻的她只是被温柔地托着，悬在那双淡粉色眸子前，小小的，红着脸\n\n她把海柠又举近了些，近到鼻尖几乎要碰在一起。那双淡粉色的眸子弯成两轮新月，倒映着海柠手足无措的样子。\n“刚才呀，自己在宇宙外面，找呀找，找呀找——”秦雯拖长了尾音，像在讲睡前故事，“发现原来你在这颗小星球里，然后就变小了，下来找你啦。”\n“变、变小...？”\n海柠愣住了。\n她低头看了看秦雯捏着自己的手指——那根手指比银河还粗，指纹比峡谷还深，指缝间还夹着几颗星球的残渣。\n“这叫变小？吗”\n秦雯似乎看出了她的疑惑，轻轻笑了一声。\n“对你来说还是很大，对吧~？”她歪了歪头，这个动作让整片星空都跟着倾斜，“可是对我来说，已经很小很小啦~为了不让小柠害怕，我可是很努力才缩成这么大的呢~”\n她说得轻描淡写，语气里却带着点撒娇的意味，像是在求表扬。\n海柠张了张嘴，想说什么，却什么都说不出来。\n“你……为什么会变大……”\n她终于挤出一句。\n秦雯眨了眨眼。\n那双淡粉色的眸子里闪过一丝狡黠的光\n\n“等梦过去了，再告诉你吧。”秦雯把她托到面前，用鼻尖轻轻蹭了蹭她——那个动作像小猫蹭蹭一样温柔，但对于海柠来说，却像是整座山峦压下来又抬起，只不过，只有温柔罢了，温热的气息拂过全身，痒痒的，暖暖的。\n“那现在——”\n秦雯拖长了尾音，眸子里盛满了笑意和宠溺。\n“轮到我玩啦。”\n说罢，她把掌心的小海柠轻轻托到唇边。\n如星球般巨大的双唇缓缓靠近。\n在海柠眼里，那唇与星体无异——柔软、温润、泛着淡淡的粉红色，每一次呼吸都带起温热的潮汐，轻轻拂过她的身体\n但奇怪的是。\n明明那么巨大，明明那么压迫，海柠却感受不到任何恐惧\n只有独属于“依靠”的温暖~\n只有女女羞涩的悸动~\n只有心跳加速时涌上脸颊的滚烫~"
  gts_qinwen.16.a:""
  gts_qinwen.16.a_custom:""
  gts_qinwen.16.b:""
  gts_qinwen.16.b_custom:""
  gts_qinwen.17.name:""
  gts_qinwen.17.desc:"“小柠~”\n秦雯轻声唤她，甜美的声音从唇间溢出\n“可爱呢……”\n然后，她轻轻吻了下去，那个吻住了海柠的整个身体\n轻柔得像一片花瓣飘落\n但对于海柠来说，却像是被整片天空亲吻，温热的触感从额头蔓延到全身，带着淡淡的、属于秦雯的香气，让人晕乎乎的，软绵绵的，像泡在温水中一样\n她下意识闭上眼睛，光芒更甚，海柠的身体也缓缓变大，几万千米的尺度，能让秦雯的亲吻更加甜蜜了\n秦雯的唇停在那里，很久很久，才缓缓离开\n等海柠再睁开眼睛时，映入眼帘的是那双含笑淡粉色眸子，近在咫尺，盛满了温柔。\n“脸好红呀~害羞了呢”\n秦雯轻声说，语气里带着点促狭，但更多的是宠溺\n海柠张了张嘴，想反驳，却发现自己的脸确实烫得吓人。\n“才、才没有……”\n声音小得像蚊子哼哼。\n秦雯轻笑着，用指尖轻轻蹭了蹭海柠的脸颊——那个动作温柔极了，像在抚摸什么稀世珍宝\n“小柠。”\n“嗯……？”\n“刚才踩星球的时候，那么大胆呢”\n秦雯歪着头看她。\n“怎么现在，被我亲一下，就变成这样啦？”\n海柠的脸更红了。\n她想说“那不一样”，想说“你突然变得这么大”，想说“我还没准备好”——但所有的话都堵在喉咙里，最后只能化作一句：\n“……坏蛋...坏”\n说完，海柠鼓起勇气，猛的一个大跳，对着如星球般的巨唇吻了上去\n声音又软又糯，带着点撒娇的意味。\n秦雯愣了一下，随后，使坏笑着，伸出那偌大的红舌，与海柠的小粉舌交织，香津溅了小海柠一脸\n然后她笑得更开心了\n那笑声在宇宙中回荡，温柔而明亮。她把海柠轻轻捧到胸前，用脸颊蹭了蹭她，像小猫蹭主人那样\n“小柠~坏蛋~”\n她轻声说，语气里满是依恋。\n“只属于我的坏蛋呀~”\n海柠被她蹭得晕乎乎的，整个人蜷缩在温热的掌心里，脸红得像熟透的番茄\n她想说什么，却发现自己好像……\n一点都不讨厌这样\n甚至有点喜欢\n喜欢被她这样捧着\n喜欢被她这样蹭着\n喜欢听她叫自己“小柠”，用那种温柔到让人想哭的声音\n\n就算体型的差距如鸿沟一样，对她们来说，也只是甜甜的贴贴罢了呢\n\n秦雯看着掌心那个小小的人儿，脸红红的，眼睛湿漉漉的，身上还沾满了属于自己的香津\n她心里软成一片\n“小柠~”\n她轻声唤道\n“嗯……？”\n海柠抬起头，对上那双似星球般含笑的淡粉色眸子\n然后她看见那张巨大的脸越来越近，越来越近，温热的呼吸拂过全身——那唇再次靠近，不过，这一次，却没有停下\n“诶……？”\n海柠还没来得及反应，整个世界忽然暗了下来，只剩温软的触感与无处不在的少女体香\n她被含住了\n秦雯的玉唇轻轻合拢，将她整个身体包裹进那片温热柔软之中。没有用力，只是轻轻地含着\n\n四周是温热的、柔软的、带着淡淡香气的壁——那是秦雯的口腔内侧。光线透过唇瓣的缝隙渗进来，染成暧昧的粉红色...她能感觉到秦雯的呼吸，一下一下，温热的潮汐拂过全身\n“唔……”\n她想说什么，但声音闷在喉咙里，传不出去\n然后——\n有什么东西轻轻碰了碰她。\n柔软、温热、湿漉漉的\n从脚底划过，顺着小腿，慢慢向上，把她足袜上的所有城市残骸都一下一下的舔舐干净\n那舌头对她来说太大了——像一条温热的河流，缓缓流淌过她的身体。舌尖轻轻卷起她的裙摆，又很快放开，像调皮的孩子在试探什么。然后舌面贴上来，将她整个身体托起，轻轻翻了个个儿\n海柠趴在那片温热的柔软上，大脑一片空白。\n她甚至能感觉到舌面上细小的味蕾，每一次舔舐都，痒痒的，暖暖的，让人浑身发软。"
  gts_qinwen.17.a:""
