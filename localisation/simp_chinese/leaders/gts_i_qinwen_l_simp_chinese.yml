  gts_qinwen.101.name:"冰寒中的干戈声"
  gts_qinwen.101.desc:"“指挥官阁下，鄙人还有一事相求，在寒岭有一冰窟，冰窟中时常有些叮叮终咚的声音，神似刀枪剑戟的碰撞声，阁下如果有时间，可以帮我前去探索一下吗，感激不尽，我这书还没看完”"
  gts_qinwen.101.a:"“好的，没问题”"
  gts_qinwen.101.a_custom:""
  gts_qinwen.101.b:"“看书算什么理由啊”"
  gts_qinwen.101.b_custom:"“求求你了求求你了~帮帮鸟音吧~好不好嘛好不好嘛~”"
  gts_qinwen.102.name:""
  gts_qinwen.102.desc:"从探测器传回的报告来看，冰窟内部比想像中更加壮观\n\n入口处是一道被寒冰包裹的天然拱门，冰层厚重如璃，在探照灯的照射下折射出冷冽的蓝白色光芒。沿着一条倾斜的冰道向下深入约几十米，空间豁然开朗，那是一处被冰封的古代战场遗迹。\n而遗迹中心，有一所类似于古墓的建筑"
  gts_qinwen.102.a:"“把情况报告给秦雯”"
  gts_qinwen.102.a_custom:""
  gts_qinwen.102.b:""
  gts_qinwen.102.b_custom:""
  gts_qinwen.103.name:""
  gts_qinwen.103.desc:"通讯器那头沉默了片刻。\n她没有立刻回应，只是静静地看着屏幕上逐帧回传的冰窟影像\n勘探员小心翼翼地清理掉入口处的冰层，露出门楣上镌刻的一行古老文字时，秦雯的目光却骤然凝住了\n那是一行用极古老的金文写成的短句，翻译过来，大意是\n“此剑不染血，此身不称功。唯愿河山无恙，万民长安。”\n刚才还在撒娇的天体极少女轻声念出这句话，语气中那些平日里的慵懒被一种罕见的沉静所取代\n勘探队继续深入，打开了那扇被封冻的墓门。墓室内部并不奢华，只有一具保存完好的遗骸，身披素甲，手握一尊巨盾，安安静静地躺在石台之上，墓室四壁刻满了密密麻麻的铭文，记录着这位将军的一生\n他曾在古国最混乱的纷争年代，统兵镇守边疆。彼时，敌国屡次犯境，边境百姓饱受战火之苦。然而他却在连战连胜、兵锋正盛之际，主动向敌国递出了求和书信，许以互市、通婚、共修水利之利。敌方统帅大为震动，回信询问其意。他只在信上写了一行字：\n“吾所求者，非战功也。吾所求者，春耕时无人惊扰，秋收时无人焚粮，孩童不必在废墟中拾取箭镞。此即吾之战争。”\n最终，双方罢兵休战，边境安宁五十余年。而他，却在一个寻常的冬夜，在戍边的营帐中静静地闭上了眼睛\n他死得平静，轻于鸿毛，连学富五车的秦雯甚至都不知道他的故事\n秦雯久久没有说话\n最后，她轻轻摘下那副圆框眼镜，用衣角拭了拭镜片，又重新戴上。她抬起头，那双粉色的眼眸中只剩下一种清澈而深沉的敬意。她开口时，语气是那样郑重，那种带着古韵的、文绉绉的语调缓缓而口\n“吾尝以为，战争者，乃文明之痼疾，不可避也。然观此将军生平，始知些许，战争之终，非在于杀戮之尽，而在于生民得安。其所求者，非胜也，乃民之安矣”\n“此君以一己之罢兵，换得二十载河清海晏，吾辈生于星辰之间，动辄裂地摧城，却未必有此君之胸怀。诚惶诚恐，自愧不如”\n她沉默了片刻，又轻轻笑了几声\n“唉……这书，我今日怕是看不进去了。鄙人须亲往寒岭，祭拜此君，帝国的事务，还是放下为好”"
  gts_qinwen.103.a:"“嗯，去吧”"
  gts_qinwen.103.a_custom:""
  gts_qinwen.103.b:""
  gts_qinwen.103.b_custom:""
  gts_qinwen.104.name:""
  gts_qinwen.104.desc:"她当真来了，还是少有的正常体型\n她沿着那条倾斜的冰道缓步而下，脚步声在空旷的冰窟中轻轻回荡。勘探队早已退出，将这片寂静完整地留给了她。当她站在那座墓室前，看着门楣上那行铭文时，突然停住了脚步，在那具素甲遗骸前站了很久。她没有开口，只是静静地看着那张安详的面容\n“吾尝以为，战争者，不过是某些人的利益使然。吾以星海为盘，众生为子，胜者执棋，败者覆灭。然观此君遗骨，方知吾之所执，乃何等轻狂。”\n“他从未以杀伐为荣。他所求的，不过是春耕时无人惊扰，秋收时无人焚粮，这六个字，便是他毕生之役。而吾辈……动辄以文明之名，行毁天灭地之事，却未曾想过，那双双被碾碎于足下的蝼蚁，所求的，也不过如此罢了”\n她站起身，退后一步，再次整理衣襟，郑重地拱手一礼。\n“吾秦雯，以鸟音山水为号，乃一介嗜酒贪书之徒，平生所好，不过是诗文一卷。然今日得见此君遗风，始觉自身浅薄。此后，当以此为鉴——战而慎之，杀而愧之”\n少女直起身，转身向外走去，走到墓室门口时，又微微顿住，侧过头，轻声补了一句\n“多谢赐教。”\n那声音散入寒冰之中，被刺骨的冷风卷走\n而秦雯的心中，一个小小的火种竞成燎原之势，彻底改变了她的想法\n“这一次，我会保护所有人”\n同时，我们收到了秦雯的通讯请求"
  gts_qinwen.104.a:"立即接入通讯！"
  gts_qinwen.104.a_custom:""
  gts_qinwen.104.b:""
  gts_qinwen.104.b_custom:""
  gts_qinwen.105.name:"以钢之躯，护千万家之安宁"
  gts_qinwen.105.desc:"通讯请求接通的那一刻，屏幕上出现的是一片浩瀚的星空，在那片星光之间，一道庞大到令人窒息的轮廓正缓缓舒展开来\n秦雯她已经恢复了那副天体级的傲人巨躯\n她的一根手指正轻轻捏着一颗荒芜星球的两极，指尖微微陷入地壳之中，那颗星球在她指间发出不堪重负的呻吟，表面开始崩裂出蛛网般的纹路\n少女歪过头，那张占据了小半个通讯屏幕的脸庞上，浮现出一抹熟悉的、带着几分戏谑的笑容。那双粉色的眼眸微微眯起，语气轻飘飘的，仿佛刚才那段庄重的感悟从未发生过一般\n“啊哈~指挥官阁下，别那么紧张嘛~这颗星球反正也是荒芜的，我捏着玩一玩又不会怎么样啦~”\n她说着，又轻轻捏了捏那星球的两极，地壳发出一阵清脆的碎裂声\n“刚才说的那句话，我可是认真的哦~‘这一次，我会保护所有人’”\n她顿了顿，指尖轻轻一旋，那颗星球在她指间缓慢转动\n“所以——指挥官阁下，我想成为你们的舰娘”\n“怎么样？收留一位爱喝酒、爱看书、偶尔喜欢捏碎一两颗星球来解闷的‘舰娘’……不算太亏吧~？”\n她的指尖微微一用力——那颗荒芜星球终于在她指间彻底碎裂，化作一片尘埃，而她那巨大的、笼罩星辰的身影，正等待着我们的答复\n娘对帝国来说是十足珍贵的资源，我们费劲巴力制造的各种舰队，在这天体级少女的玉指之下，也撑不过一秒，而秦雯所拥有的力量，如果为我们所用，那对我们来说将是如虎添翼，毕竟，她只需要吹几口气，踩下几脚，就能对整个星糸造成重创，更何况，她还拥有巨大化的能力"
  gts_qinwen.105.a:"呃...我们现在有点缺钱，等一下吧"
  gts_qinwen.105.a_custom:""
  gts_qinwen.105.b:""
  gts_qinwen.105.b_custom:""
  gts_qinwen.106.name:"装甲铺设"
  gts_qinwen.106.desc:"帝国最顶尖的工程团队已经在轨道上等待了整整半个小时。当秦雯那庞大的身影从星空中缓缓降临时，所有工作人员都不由自主地屏住了呼吸\n尽管他们已经看过无数次她的影像，但亲眼目睹一位天体级的少女躯体横亘在母星上方时，那种压迫感依然是任何言语都无法传达的。\n她悬浮在船坞中央，双臂微微张开，在配合工作人员进行测量。白暂的玉腿自然下垂，那双巨大的粉的色运动鞋几乎要触碰到母星，而如果真的让她触碰到的话，那对整个帝国来说都是一次灭顶之灾\n总工程师站在指挥塔上，仰头望着那道几乎遮蔽了半个星港穹顶的身影\n厚重的合金装甲板在巨型起重机的牵引下缓缓升空。那些装甲板每一块都足有半座城市的大小，厚度足以抵御旗舰级的主炮轰击。然而当它们被吊装到秦雯身前时，在她的身躯映衬下，那些装甲板却微不足道了\n秦雯微微侧过头，看了一眼那块即将被固定在她肩胛骨上的装甲板，眨了眨眼，带着一丝好奇的语气轻声道\n“唔…这个穿上去会不会有点重？”\n“请放心，秦雯小姐，”总工程师的声音从通讯器中传来，带着几分紧张的恭敬，“装甲经过轻量化处理，不会对您的行动造成负担。”\n“那就好~”"
  gts_qinwen.106.a:"继续努力！资金永远充裕"
  gts_qinwen.106.a_custom:"科研船 鸟音山水，将获得升级"
  gts_qinwen.106.b:""
  gts_qinwen.106.b_custom:""
  gts_qinwen.107.name:"舰炮安装"
  gts_qinwen.107.desc:"随着作业的推进，越来越多的装甲板被安装到她的躯干与四肢上。那件白色的外套逐渐被银灰色的装甲所覆盖，她的双臂、胸口、腰侧、膝盖，乃至脚踝，都覆上了一层层精密而坚固的合金护甲。虽然装甲的厚度和重量足以压垮一支军队，但在她那宏伟的天体级身躯之上，那些装甲看起来却不过是她新添的一件漂亮外衣了\n接下来是火炮的安装\n两门巨型轨道炮在巨型机械臂的牵引下缓缓升空。那两门主炮的炮管每一根都足以容纳一艘驱逐舰在其中穿行，炮口的直径甚至超过了帝国最宏伟的议会穹顶，但，在天体级巨大少女眼里，只是两杖戒指\n“唔…”秦雯看着那两杖“戒指”，微微眯起那双粉色的眼眸，语气中带着一丝毫不掩饰的嫌弃，“这东西……是不是有点华而不实啊？”\n我们的总工程师一愣：“秦雯小姐，这是我们帝国最新型的轨道速射炮，威力足以一炮摧毁一整支舰队——”\n“我知道我知道。”秦雯摆了摆手，那动作带起的风压让整座船坞的照明灯都剧烈晃动，她低下头，那双巨大的粉瞳凑近指挥塔，带着几分慵懒的笑意轻声道：“但是啊——指挥官阁下，您觉得我捏碎一颗星球需要用几秒钟呢~？”\n秦雯抬起一只手，纤细修长的手指在星空中缓缓屈伸，瞬间，一颗无辜的小行星就成了少女指间的尘埃“与其装上这么多笨重的火炮，不如让我用这根手指，轻轻弹一下——效果不比您的炮差喔~。”\n总工程师的额头渗出一层冷汗，但依然坚持道：“秦雯小姐，这是帝国舰娘的标准装配流程，请您配合——”\n“好啦好啦，装就装吧~”秦雯叹了口气，语气中带着几分宠溺的无奈，“就当是戴个戒指啦~”"
  gts_qinwen.107.a:""
  gts_qinwen.107.a_custom:"科研船 鸟音山水，将获得升级"
  gts_qinwen.107.b:""
  gts_qinwen.107.b_custom:""
  gts_qinwen.108.name:"完工"
  gts_qinwen.108.desc:"在我们不辞辛劳的营建后，对天体级文学少女的改造终于成攻，而她，现在正在母星前，接受人民的检阅\n她轻轻活动了一下那两枚“戒指”——那两门足以摧毁整支舰队的巨型轨道炮在她的指间微微转动，炮门正对着母星，引起了一阵恐慌\n她听到那些从地面传来的、穿过大气层、微弱却热烈的呼唤声\n“嗯…被这么多人看着，感觉有点害羞~好像吓到小家伙们了”\n她说着，却并没有躲避那些目光，反而微微侧过头，将自己的脸庞正对着母星的方向。那张巨大的、精致的面容庞在星光与星港灯光的映照下泛着光芒，如同神明一般\n她缓缓抬起纤手，指尖轻触唇边，做了一个飞吻的动作，而她没注意的是，有几滴飞沫砸向了星球\n“嗨~小家伙们~”\n她的声音透过通讯器，被转播到母星各地的公共频道中。那声音轻柔而带着一丝俏皮，像是一位邻家姐姐在窗台边朝着楼下的孩子们招手\n地面上，爆发出一阵更加热烈的欢呼声，少女的几滴飞沫化作了最大的湖泊，让干旱地区几十年不愁水\n她甚至低下头，将那张巨大的脸庞稍微压低了一些，让那些地面上的人们能够更清晰地看到她的面容\n“好啦好啦，别一直盯着人家看啦~”她带着几分故作娇嗔的语气轻声道，“不过嘛……如果你们愿意的话，以后每次我执行完任务回来，都可以在星港这边跟大家打个招呼呀~”\n秦雯开朗的笑容传入了每一个人的心尖，有这样温柔且强大的舰娘领袖，帝国定会如虎添翼"
  gts_qinwen.108.a:""
  gts_qinwen.108.a_custom:"科研船 鸟音山水，将获得升级"
  gts_qinwen.108.b:""
  gts_qinwen.108.b_custom:""

  gts_qinwen.111.name:""
  gts_qinwen.111.desc:"在全境冰封的宁古塔星系中，仍存有几颗宜居的行星。 在我们不辞辛劳的建设下，数颗星球被相继改造，安置了大量人口，极大缓解了其它星系的人口危机。而秦雯——那位巨大的文学少女，此刻正真真切切地坐在这颗星球的商场顶层，悠然地享受着午后的惬意\n平日里天体级大小的秦雯如今却只有几十米的身高\n“酒，乃文明之源啊。” 她举起那只宛如山丘般的巨大酒杯，琥珀色的液体在耀眼的阳光中泛着金灿灿的光泽“没有酒，又哪来如此美妙的文明”\n她那微醺粉眸的微微眯起，带着三分陶醉与慵懒，垂眸望向脚下的街道。那双粉白交织的巨大运动鞋，恰好悬停在商场底层的广场上方，双腿随着呼吸晃动，而厚实洁净的鞋底——对于底下那些如同蝼蚁般渺小的文明子民而言，就是一整片遮天蔽日的穹顶\n秦雯忽然有些玩心大起\n她嘴角勾起一抹淡笑，轻轻晃了晃腿，巨大的鞋底在低空中掠过，气流将下方广场上的灰尘与落叶卷得四散飞舞。小人们惊慌失措地尖叫着四散奔逃，却被那宽阔的橡胶鞋底投下的阴影尽数笼罩\n“哎呀呀，小家伙们跑到挺快~”她带着几分醉意喃喃自语，缓缓将那只包裹着白袜的脚踝向下探去——用鞋沿，轻轻在广场边缘的砖地上擦了一下\n只是这么一个极其微不足道的逗弄动作，对底下的小人而言却是一场遮天盖地的惊涛骇浪。巨大的摩擦带动着一阵强风，几名跑得慢的小人直接被鞋侧刮起的气流掀倒在地，连滚带爬地翻出了好几米远\n秦雯却仿佛浑然不觉，只是露出一个少女般天真又略带顽劣的笑容。她重新将巨足悬高，将那带有柔软粉色纹路的鞋底轻轻踮了踮，让底下的小人在她鞋底阴影的笼罩下惊惧不安地抬头仰望\n“居高临下地看着文明在脚底繁荣、尖叫、四处逃窜…似乎比书本上的故事更加下酒呢~” 她惬意地灌下一大口麦酒，甘甜的液体顺着她白皙的下巴洒落在商场楼顶，将几只小人淹在了酒液中"
  gts_qinwen.111.a:"快，趁着她没喝醉，赶紧转移所有人"
  gts_qinwen.111.a_custom:""
  gts_qinwen.111.b:""
  gts_qinwen.111.b_custom:""
  gts_qinwen.112.name:""
  gts_qinwen.112.desc:"舰船的引擎轰鸣声在稀薄的大气中渐渐远去，最后一批运输船拖着长长的尾焰刺入云层。那座曾经熙熙攘攘的星球此刻彻底陷入了死寂\n她粉色的眼眸半眯着，带着酒精浸润后的迷离与慵懒。她俯视着下方那空无一人的城市，轻巧地、带着一丝玩味地笑了一声~\n“哎呀~真是迫不及待呢，这么快就把所有人都转移了呀~”\n少女缓缓抬起一只手，将那白皙如玉指尖轻轻搭在城市边缘的地面上，指尖陷进泥土和钢筋混凝土之中，发出沉闷的咔嚓声。她歪了歪头，轻声道\n“那阁下是打算给我创造一个游乐园吗~？” 她的声音变得轻快起来“那鄙人就恭敬不如从命了呢~”\n话音刚落——伴随着一声低沉的的轰鸣，她又开始再次巨大化\n是的，明明已经是巨大的存在，她仍毫不客气地继续膨胀。她的手指变得更加宏伟，身躯在群山间展开，原本被她的体重压垮的城市变成了山峦，她的小腿和脚踝在云层中不断延伸，那粉蓝相间的运动鞋如今已经大得足以让整条河流从鞋底绕道而行了呢\n少女俯身将脸颊贴近地面，那双迷醉的粉瞳几乎贴上了其中一座摩天大楼的塔尖\n“唔…这个世界一下子变得好小好小，像是我书桌上那座精致的微缩模型一样呢。”\n伸出舌尖轻轻舔了舔嘴角残留的麦酒香气，随即把那根犹如巍峨山脉般的手指~轻轻~缓缓地按在了一座街区上\n“那……我可要好好地、慢慢地玩一玩这座游乐园了呢~”\n她将身体缓缓撑起，巨大的身躯在星球的地平线上投下了一道几乎横跨半球的阴影。山峦在她身下变成了起伏的丘陵，而她那一双巨大而厚重的运动鞋鞋底，正悬停在原本是最繁华城市核心区的上空\n而，酒过三巡，秦雯脸上的红晕更甚"
  gts_qinwen.112.a:"还好我们行动够快，真是触目惊心"
  gts_qinwen.112.a_custom:""
  gts_qinwen.112.b:""
  gts_qinwen.112.b_custom:""
  gts_qinwen.113.name:""
  gts_qinwen.113.desc:"“啊~应该是没人了吧~”\n她慵懒地打了个酒嗝，那带着浓郁麦芽香气的气息拂过星球表面，将原本漂浮在低空的一层云吹得干干净净，露出下方更加清晰的城市废墟\n“唔…这个姿势感觉还挺不错的~”\n秦雯眯着那双半醉的紫瞳，轻轻撑起身子，就让自己那对惊人柔软的胸膛，缓缓地膨胀，成长，使原来贫瘠的胸部变得傲人、又带着几分戏谑的力道，压在了原本是星球最繁华的一片大陆上\n那双巨大的、饱满的乳肉，在一片城市群上缓缓下压。动作优雅，令人气血上涌，甚至带着一种少女般漫不经心的轻巧——然而当她那柔软的胸腹触碰到地表时，数百平方公里的钢铁丛林使无声无息地陷入、碎裂、化作齑粉，接着被那层白皙的皮肤和衣料彻底掩埋\n她低头看了一眼自己身下那片被压扁的“小方块”，流露出一种支配般的纯粹愉悦~\n“这一片全被压平了呢~”\n而她丝毫没有要起身的意思，反而用那双撑着地面的手臂微微移动了一下重心，让那对柔软如绵云般的胸脯在废墟上轻轻揉了揉\n原本还有几座残留的摩天大楼尖顶，在那阵“轻柔的揉搓”中彻底被碾进了地壳里。而在她的乳晕与地表贴合的区域边缘，由于巨大的重量和挤压，地面像波浪般向四周隆起，形成了一圈足以延伸到地平线外的环形山脉\n“好像~那边还没被姐姐恩泽过呀~”\n她用那双撑着地面的手臂微微用力，将巨大的身子在星球表面挪动了几十公里——那动作对她只是慵懒地在翻了个身，但对这颗星球而言，却是大陆板块间一场毁灭性的剧变了。\n柔软的双乳在地面上碾过，将原本便已破碎的城市废墟彻底碾成了一道光滑的、略带弧度的凹痕，余波将地壳深处的地下水挤压出来，淹没一切\n她又翻过身来，以一个半躺半坐的姿势，将自己那对巨大的胸部再次悬停在那片沿海平原上方，然后，带着一种极其天真的，玩闹般的轻快揉捏着巨大的乳首...\n“嘿咻~”\n她发出一个带着醉意的、软绵绵的语气词，而她胸前那两颗挺立的乳首也沂出了几滴乳汁\n这次她仅仅是借着酒精带来的松弛感，将身体的重量自然而然地沉降下去。然而那足以承载她庞大身躯的柔韧胸部，却以一种温柔得近乎残忍的方式，将整片沿海平原上的高楼大厦全都淹没\n那些曾经精密的高塔和工业设施，在她胸口的压迫下，将一切轻轻抹平，只留下了一层浅浅的、带着她体温和衣料纹理的白色深坑\n她似乎对这个结果十分满意，甚至轻轻扭了扭腰肢，用那已经被压扁得几乎可以反射阳光的大地作为支撑，调整了一个更舒服的姿势——那双巨大的运动鞋在空中晃荡着，又被她晃下来，将远处几座尚未倒塌的孤峰碾得粉碎，碎屑洒落在她身下那片早已面目全非的大地上...\n“唉…果然不能喝太多呢~，一不小心就会做出点…嗯~…稍微~有点过分的事情呢~”\n“大家好不容易建的东西都被姐姐我压坏了...那就给这颗小星球…一个温柔的~巨大的抱抱当补偿吧~”\n\n\n话音刚落——她的身形便再次开始膨胀。\n那是如此优雅而无声的成长，原来支配大陆的玉体这一次遮蔽着星球"
  gts_qinwen.113.a:""
  gts_qinwen.113.a_custom:""
  gts_qinwen.113.b:""
  gts_qinwen.113.b_custom:""
  gts_qinwen.114.name:""
  gts_qinwen.114.desc:"她缓缓地将那颗蓝色的星球捏握在掌心\n她低头看着自己那越来越巨大的手掌，看着那颗在掌心中逐渐变得渺小的星球，嘴角缓缓上扬，露出一个既温柔又令人心悸的笑容\n她将那星球轻轻举到自己面前，然后——像是要履行刚才那句抱抱的诺言一般——缓缓的、带着无尽的温柔，将那颗星球向自己柔软的胸前贴近、轻轻地贴了上去，将那整颗曾经承载无数生命的星球，拥入了自己的怀抱...\n“咔嚓”\n一声极轻极脆的声响，从她胸前那层层衣料和被压扁的星球之间传来\n秦雯的动作微微一顿，她低头看了一眼——那颗蓝色的星球，在她那已经膨胀到足以与恒星比肩的柔软胸脯的轻压之下，已经出现了一道道清晰的裂纹。裂痕从地表蔓延到地幔，从海洋延伸到云层，整个球体的结构正在她胸前那个漫不经心的拥抱中，悄然崩溃\n她轻轻一笑，带着更多的戏谑。她缓缓松开怀抱，看着那颗早已支离破碎的行星从她胸前滑落，碎片如流星般散落在她越来越宽广的膝弯与裙摆之间。她的手指轻轻一捏——那颗曾经完整的星球，在她指尖彻底化作了一捧细碎的尘埃，从她的指缝间簌簌洒落，融入了她身下那片无尽幽暗的星空之中\n天体级的少女微微抬起头，那对粉色的眼眸在星海中闪烁。她的玉体依旧在无声地成长，将整片星域的恒星一颗颗纳入她身影的笼罩之下\n“嗯…抱歉啦~下次……我会再温柔一点点~”."
  gts_qinwen.114.a:"“以她酒液的残骸为星球基底，重塑该星球”"
  gts_qinwen.114.a_custom:""
  gts_qinwen.114.b:"“我的星球啊！等着，我有招治你！”"
  gts_qinwen.114.b_custom:""

  gts_qinwen.120.name:"造物初尝试"
  gts_qinwen.120.desc:"距离秦雯上次捏碎宁古塔星系中那颗行星的事情，已经过去几个月有余。而我们上次拿命拍摄的、记录了秦雯如何将那颗星球用胸部彻底毁灭的录像，想必足够让这位平日里优雅好面的文学少女，含羞带怯好一阵子了吧\n通讯接通的那一刻，屏幕上浮现出那张熟悉的面孔\n“啊哈哈……指挥官阁下，有什么事吗？”\n那白发的少女挠着头，眼神躲闪，嘴角挂着一抹尴尬而不失礼貌的笑容\n她一定是知道我们为何找上她\n然而，我们都心知肚明：秦雯的酒量好到恐怖。仅凭那个量级的啤酒，定不能让她酩酊大醉。所以，她那天所展现出的那副被酒精浸泡过的迷离，究竟是装出来的，还是她真的、发自内心地、享受那颗星球在她指尖碎裂的感觉，还有待查证\n我们将那份高清录像投屏到通讯界面中。画面一开始，便是秦雯那两团巨大的乳肉，双乳将一切压至平整，然后碎裂\n秦雯的脸“唰”地一下红了。她那双红色的眼眸睁得圆溜溜的\n“这、这个…这个是…” 她支支吾吾地，声音越来越小，“这个.那个…我当时喝多了嘛…”\n她的耳尖红得像要滴血，整个人坐在那里，手足无措地低下头\n“你们…你们怎么还拍下来了啊……好丢人啊…”\n“鸟音山水小姐，这一份录像，我们已经备份，如果你下次在管辖星系内再做出类似的酒后失态，那这份录像，可能会作为帝国安全档案，在全星系范围内进行公开展示哦”\n她猛地抬起头，那双粉瞳中的羞怯瞬间被一丝惊慌取代\n“诶？！公、公开？！不行不行不行！！！那、那多丢人啊！！！我堂堂一个作家，怎么能让大家看到我…我…我那个样子…”\n少女又急又羞，连说话都开始结巴起来，整个人在通讯屏幕前手忙脚乱地挥手\n“当然，我们也不是不讲道理的人。如果你愿意配合我们做一些事情...，并且保证不再出现...嗯——‘主动破坏已改造宜居行星’的情况，这份档案可以永久封存”\n“那…那你要我做什么事啊？先说好，太累人的我可不做哦”\n“放心，不是什么难事——阁下的乳汁貌似可以作为新星球的基底...”\n秦雯愣了一下，随即整张脸再度爆红，她抓起手边的书本猛地砸向通讯器的摄像头方向，气鼓鼓地喊道\n“你们这群坏蛋！”\n“哎呀~那阁下愿意吗”\n“好..好吧”\n选项：拿捏！\n那茫茫星海里，秦雯恢复了天体级的大小，双手揉捏着她傲人的双乳，而我们时不时对她采用火炮的攻击，加剧了她的快感，就这样经过一段时间后，我们从她的脸颊上看出，这个星系中有一颗新的行星要诞生了\n她轻轻捏起挺立的双峰，纤手的挤压伴随着我们火炮的攻击，不一会，她胸前就漫出了乳白色的几滴，那几滴乳液对秦雯来说微不足道，但对我们来说，已经算是星球的太小，仅需加以时日，使可弥补那颗星球的损失，而她彻底泛红的脸颊上也浮现出一丝“创造世界”的快感..."
  gts_qinwen.120.a:""
  gts_qinwen.120.a_custom:""
  gts_qinwen.120.b:""
  gts_qinwen.120.b_custom:""
  gts_qinwen.121.name:""
  gts_qinwen.121.desc:"在我们的不懈努力后，终于将鸟音的几滴乳液改造成了可居住的星球.\n星球自带的乳汁海洋可以供公民饮用许久，之前那颗星球的损失已经挽回，而那位天体级的少女则是满脸绯色的盯着那颗星球，似乎有一丝丝快感...无论如何，这对帝国来说都是大有脾益的"
  gts_qinwen.121.a:"太好了"
