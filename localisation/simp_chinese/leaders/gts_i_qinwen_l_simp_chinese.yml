  NAME_gts_qinwen_system:"宁古塔"
  NAME_gts_qinwen_star:"宁古塔"
  NAME_gts_qinwen_planet:"寒岭"
  gts_qinwen_anomaly:"极冰之地"
  gts_qinwen_anomaly_desc:"这是一颗被冰封的星球，荒无人烟"


  gts_qinwen.1.name:""
  gts_qinwen.1.desc:"和我们的构想一样，这是一颗极冰的星球，覆盖星球的冰寒并不能遮蔽住文明的痕迹，拿铲子轻轻一挖，积雪下方的建筑残骸就显露了出来，如果有文明残骸的话就证明覆盖整个星球的大雪是在文明建设后突然降落下来的，往远处看去，一座山庄突兀的屹立于积雪之上，在这片荒无人烟的寂静中显得格外引人注目"
  gts_qinwen.1.a:"前去调查那栋建筑"
  gts_qinwen.1.a_custom:"咕咕嘎嘎"
  gts_qinwen.1.b:""
  gts_qinwen.1.b_custom:""
  gts_qinwen.2.name:"霜庭雪榭游增记"
  gts_qinwen.2.desc:"然而，就在他们距离山庄大门还剩不到两百米时，一阵阴影猛然覆盖了整片天空\n那是一片巨大到令人窒息的少女身影，从他们的头顶缓缓掠过。原本湛蓝的天穹瞬间被遮蔽，阳光被彻底吞没，整片冰原陷入了一片昏暗的阴影之中。先遣队的通讯器里瞬间炸开了信号干扰的杂音，所有人的心跳都在那一瞬间停滞\n在那片阴影的轮廓中，通过通讯，我们看见了一双大到难以形容的、粉色眼眸，正隔着云层，带着几分好奇，俯瞰着这片冰封的大地与地面上那如尘埃般的研究员们\n“哎呀——”\n“这颗小星球上居然还有活着的小家伙在到处乱跑呢啊~”那道巨大的身影缓缓下降。冰原上的积雪被那股从天而降的气流卷起，形成一圈圈白气浪向四周扩散\n当那双粉色的眼眸终于从云层中完整地显现出来时，所有人都不由自主地屏住了呼吸\n一位大得能一手攥住整片天空的少女。\n她的面容精致而柔和，白色的短发在冰冷的空气中缓缓飘散，整个人看起来就像是从某本童话书中走出来的文学少女——如果忽略她那如山脉般横亘于天际的庞大身躯的话"
  gts_qinwen.2.a:"示意研究员对少女挥手表示友好"
  gts_qinwen.2.a_custom:""
  gts_qinwen.2.b:""
  gts_qinwen.2.b_custom:""
  gts_qinwen.3.name:"鸟音山水"
  gts_qinwen.3.desc:"对于眼前的少女来说，你的存在能使她放下书，正眼对淮你，便是对你和帝国的尊重，庆幸的是，她对你保持友好，并没有把你当成某种珍惜的泡酒料\n“那么，客自何方来？又将适何处？今临此地，其意何为乎”"
  gts_qinwen.3.a.name:"“我是帝国的人，来此地堪察，敢问阁下贵姓，同时在如此严寒之地，阁下是怎么生活下来的”"
  gts_qinwen.3.a.desc:"眼前的少女正对着你，脸上绽起一道微笑，像是在赞赏你跨体型的勇气\n“阁下好胆量！临危不乱，乃大丈夫乎！小女子秦雯，自号‘鸟音山水’，一位普通的收藏家，自从上次冰结期开始之后，此地的严寒就开始扩散，我念不下这一柜子的收藏，就留守在此处了，不过关于这里的异变，我也不知道什么内容，大冰期不是爆发，而是逐渐的缓慢的气温的降低，我的一位顾客兼挚友给了我一枚玉佩，应该就是它促使了我在这严寒下还能活下来吧”"
  gts_qinwen.3.b.name:"你的故事..."
  gts_qinwen.3.b.desc:"“故事？我可没有什么轰轰烈烈的故事，自从继承了家父的古董店和这一屋子收藏之后，我就一直在这小山庄中，直到寒岭的雪越下越大，就连夏天都是白雪皑皑，过了几年，甚至寒岭之外都下起了大雪，人自然是都离开了，只有我不惧这严寒，相反，还习得了这变大的法术，有一次，我变得很大很大，和整个星系差不多大，整个星系都变成了一片白色，所有星球都成了冰河绝境，于是，我就把这个星系都命名为宁古塔了”"
  gts_qinwen.3.c.name:"可以同行吗"
  gts_qinwen.3.c.desc:"“求之不得，偶尔出去以文会友，见些世面，无害而大有脾益，只不过，你们的飞船撑不住这万里的严寒，鄙人闲时打造过一艘小船，回去就用这艘吧，鸟音山水，听侯阁下差遣”"
  gts_qinwen.fail:"先完成对话吧"

  gts_qinwen.5.a.name:"最近过的怎么样"
  gts_qinwen.5.a.desc:"“谢谢阁下关心，蛮不错的，这里是少有的能让小女子感受到归属感的地方了”"
  gts_qinwen.5.b.name:"“想看看你写的书”"
  gts_qinwen.5.b.desc:"“雕虫小技，本不足存。蒙君谬赏，实汗颜无地。若为消遣，幸甚至哉，这是我近期所作，是鄙人与吾友的故事，阁下喜欢就拿去吧”（拿出一个天体级的铁盒）"
  gts_qinwen.5.c.name:"“播放凑企鹅叫声”"
  gts_qinwen.5.c.desc:"“诶？这是你们这里的企鹅叫声吗？到是...有一种...让人忍不住学舌的冲动...”"
  gts_qinwen.5.d.name:"和其她的领袖相处的怎么样"
  gts_qinwen.5.d.desc:"§R并非并非施工中§!"
  gts_qinwen.5.e.name:"没有什么事了"
  gts_qinwen.6.name:"咕咕嘎嘎"
  gts_qinwen.6.desc:"“诶？这是你们这里的企鹅叫声吗？到是...有一种...让人忍不住学舌的冲动...”"
  gts_qinwen.6.a:"咕咕嘎嘎！"
  gts_qinwen.6.a_custom:""
  gts_qinwen.6.b:""
  gts_qinwen.6.b_custom:""
  gts_qinwen.7.name:"咕咕嘎嘎"
  gts_qinwen.7.desc:"“咕咕嘎嘎！啊...失态了，不过，这声企鹅叫竞有如此魔力，若是我学会了，应该可以与企鹅沟通吧”"
  gts_qinwen.7.a:""
  gts_qinwen.7.a_custom:""
  gts_qinwen.7.b:""
  gts_qinwen.7.b_custom:""
  gts_qinwen.8.name:"《冬日下，独属于她的超巨大温暖》"
  gts_qinwen.8.desc:"寒岭，一座藏于山中的小镇，顾名思义，每到冬季便迎来刺骨透心的严寒。那些在南边大都市被人们视为奇迹的“泼水成冰”，在这里不过是稀松平常的景象。\n寒字如此，岭字亦如其名。小镇被群山环抱，交通不便，信号也差——按常理推断，这里本该是人烟稀少、信息闭塞的贫穷之地。\n然而，现实有时与常理背道而驰。\n寒岭，竟是整个宁古塔地区交通最便利、外来人口最多的地方。虽不敢说每天，但每周都有不少来自南方富庶地区的豪商，开着加长车或私人飞机抵达此地。而他们唯一的目的地，便是山脚下的那座小山庄。\n山庄规模不大，说是山庄，其实不过一座四合院的大小。但它风景秀丽，气温宜人，景观更是超脱现实。\n倘若向池塘望去，只见碧波荡漾，莲叶成片。要知道，此时正值隆冬，又是在天寒地冻的宁古塔地区，能让池塘不结冰、植物仍然绿意盎然，近乎天方夜谭。可这座小山庄偏偏做到了。初来乍到的人只能暗自诧异，但与后面的景象相比，这点奇事便只能归为“特殊的保温科技”了。\n顺着人流望向山庄主屋，满目皆是古色古香。这家店，正是一家古董店——只不过，是举世闻名的古董店。\n“老板，今天有没有啥好东西啊？”\n“有的，这位客人。”\n循着交谈声向店内望去，只见一位白发少女坐在前台，看模样不过十八有余。然而，她从容应对着台前数不清的富商，身上看不出半分稚嫩之气；她对文物的熟悉程度，也不像一位少女，倒像是在这一行摸爬滚打多年的老手。\n她手拿一尊精美的时钟，通底为金石所制，又有花鸟点缀，而表盘上又有着美轮美奂的假山，青金石所制的瀑布更是巧夺天工。此物一出，门外令人诧异的诸多景象，便只能沦为背景板了。\n正当那些富商准备争抢之时，少女的一句话，却引得他们悻悻而去。\n“好了，各位来客，天色已晚，小店要打烊了。大家快些回去吧。”\n听到少女的话后，虽有人低声抱怨，却都识趣地离开了。尽管此刻不过下午，却没人敢闹事。即便心有不甘的人，也只是畏惧地瞥一眼面前的少女——那神情不像是敬畏，更像是害怕。"
  gts_qinwen.8.a:"继续"
  gts_qinwen.8.a_custom:""
  gts_qinwen.8.b:"关闭"
  gts_qinwen.8.b_custom:""
  gts_qinwen.9.name:""
  gts_qinwen.9.desc:"“咚咚咚。”\n“雯雯，我来啦。”\n轻柔的敲门声过后，一声温柔的呼唤传来。而这声音的主人，便是那少女为何下午就打烊的主要原因了。\n门开的瞬间，秦雯还没来得及说话，就被一把抱住了。\n“哎呀，想死你了！”\n海柠整个人挂在她身上，像只小猫般蹭着她的颈窝。夕阳从身后斜斜照进来，给那头雪白的长发镀上一层暖融融的金边，连带着整个门厅都明亮了几分。\n秦雯微微一僵——她总是这样，无论被抱多少次，第一反应都是不知所措。但她没有躲，只是轻轻拍了拍海柠的背，小声说：“回来了就好。”然后，她踮起脚，娇羞地在海柠脸颊上落下一个吻。\n“就这？”海柠松开她，佯装不满地鼓起脸，“我跑了一整天，你就亲一下？”\n秦雯抬眼看着她。海柠今天穿了一件米白色的棉袄，衬得本就出众的五官愈发柔和，眉眼间全是明媚的笑意——她天生就是这样的人，走到哪里都是焦点，随便一站就能让整条街亮起来。\n而自己呢？\n秦雯下意识往后挪了挪。她知道自己是什么样的人——白发在寒岭不算稀罕，但她这头白发总是被人忽略，连同她这个人一起。从小到大，她习惯了坐在教室角落不被点名，习惯了分组时最后一个被想起，习惯了明明站在人群中央，却像透明的一样。\n但海柠不一样。\n海柠是那种一进门就会被所有人注视的人。她的光芒不是刻意张扬，而是自然而然地流淌出来，让人忍不住想靠近。当初她转学到寒岭时，全班都轰动了，男生女生争着跟她做朋友。而秦雯只是远远地看着，心想：这样的人，跟自己不会有任何交集。\n可海柠偏偏走向了她。\n“嗨，”海柠伸手在她眼前晃了晃，“又发呆。在想什么？”"
  gts_qinwen.9.a:"继续"
  gts_qinwen.9.a_custom:""
  gts_qinwen.9.b:"关闭"
  gts_qinwen.9.b_custom:""
  gts_qinwen.10.name:""
  gts_qinwen.10.desc:"秦雯回过神，脸微微发烫：“没、没什么。”\n“骗人。”海柠凑近看她，忽然笑了，“你每次发呆都是在想‘我这种人怎么会有人理’，对不对？”\n秦雯被说中了心事，垂下眼不说话。\n海柠轻笑一声，伸手捧起她的脸，让她看着自己：“怎么会没人理呢？我理呀。\n秦雯张了张嘴，什么都说不出来。\n海柠的拇指轻轻摩挲着她的脸颊，像揉面团似的搓了搓，把秦雯的小脸搓得跟番茄一样红。\n秦雯眼眶有些发酸。她想说“谢谢”，可那几个字堵在喉咙里，怎么也说不出口。\n“好啦好啦，”海柠捏捏她的鼻尖，“你有人在意的好不好？我不是人吗？这辈子当你同桌，下辈子还当你同桌，够不够？”\n秦雯被她逗笑了，用力眨了眨眼，把感动的泪意憋回去：“哪有人自己说自己不是人的。”\n海柠理直气壮：“为了你，不是人就不是人。”\n秦雯看着她，忽然觉得心底那片总也填不满的空洞，被什么东西一点点暖热了。\n其实海柠不知道——在海柠眼里，秦雯是那个唯一不会被她光芒灼伤的人。从南方城市辗转来到寒岭那年，她见过太多冲着她笑脸凑上来的人。只有秦雯，安安静静地坐在角落，既不刻意靠近，也不刻意疏远。她递过去半块橡皮，秦雯接过来，小声说“谢谢”，然后认真地在卷子上改起了错题。\n那一刻她就知道，这个存在感极低的女孩，是唯一能让她放下所有防备的人。\n“那……”秦雯红着脸，小声说，“那就再亲你一口。”\n她凑过去，对准海柠的脸蛋，像小鸡啄米似的，轻轻啄了一下，又一下。\n海柠的脸被亲得又红又热，却笑得比谁都开心。她伸手把秦雯揽进怀里，下巴抵在她发顶，声音软得像化开的糖：“这才像话嘛。”\n“小柠，走吧，回房间”\n“好！”\n在秦雯的房间里，二人又玩了很长一段时间才沉沉睡去，睡觉的时候，仍是抱在一起的呢\n在这个世界上，这二人的故事已告一段落，不过，在一个未知的地方，以这二人为主角的史诗才刚刚开始，还是以一整个世界为舞台的状烈史诗"
  gts_qinwen.10.a:"继续"
  gts_qinwen.10.a_custom:""
  gts_qinwen.10.b:"关闭"
  gts_qinwen.10.b_custom:""
  gts_qinwen.11.name:""
  gts_qinwen.11.desc:"“呼呼  啊~哈”\n伴随着一声少女的哈欠，海柠缓缓睁开双眼，湖绿色的眸子一闪一闪，在寻找着秦雯的踪迹，不过，秦雯没找到，她脚边的丝丝骚痒感就让海柠忍无可忍，于是便低下头一看...\n那是一整个小小的街区，古代的小茅草屋，远处的亭台楼阁，还有几个虫子大小手持农具，朝着海柠穿着白袜的小脚奋力挥砍的农民，看着样式，像是秦雯所为，不过，秦雯大体是没有这种能力的，所以海柠也——\n“呼，这一定是个梦吧...”\n“如果是梦的话...那...可以踩着玩了吧...”\n温柔的声音所伴随着的是那50多米高的白袜嫩足微微移动，那些渺小的农人也是毫无悬念的成为了海柠脚下绽放的血色花朵了\n“唔...这么一下...就”\n“我杀人了...不对，这是梦里...呼”\n“如果是梦里的话，那那些建筑...”\n就像是验证她的想法一样，本来侧身躺下的海柠瞬势站了起来，不站还好，她站立之时，那300米的身体就使得那些小人全部跪了下去，毕竟，300高的尺度对于古代来说，已经是不可能达到的尺度，没有飞机，没有高楼大厦，海柠此时的身高也与神明无异了\n“呼，都好小啊，不仔细找跟本看不清呢...先试着走两步吧”海柠小心翼翼地挪动了一下脚。\n那动作在她自己看来，不过是轻轻地把脚往前探了探，甚至连脚踝都没完全抬起。但对于脚下那片世界而言，却像是一整片天空忽然压低了下来，白袜包裹着的脚尖从云雾般的高度缓缓落下。\n“轰——”\n一声沉闷的巨响在街区间炸开，海柠愣了一下，她低头看去，只见刚才还整齐排列的茅草屋已经完全塌成了一片碎木与泥土，白袜脚尖下则陷出一个浅浅的坑\n而那些方才还在挥着农具的小人也已经完全看不见了\n只剩下一些细碎的红点，在袜底与地面之间慢慢漫开。\n“呜……”\n她本能地把脚抬起来一点，\n袜底黏着一点点细小的东西，看起来像是被踩碎的浆果。\n她看了一会儿，脸忽然有点红，\n“真的……踩死了。”\n她小声嘀咕着，声音轻得像怕被谁听见一样，不过，200倍扩大的声音...却是让所有人都听的见呢"
  gts_qinwen.11.a:"继续"
  gts_qinwen.11.a_custom:""
  gts_qinwen.11.b:"关闭"
  gts_qinwen.11.b_custom:""
  gts_qinwen.12.name:""
  gts_qinwen.12.desc:"不过很快，她又自己摇了摇头\n“梦而已……梦而已……”\n“在梦里应该没关系吧……”\n说完这句话，她又低头看向脚下的世界，\n刚才那一脚踩塌的地方，只占整条街的一小块。更远处还有很多小屋、田地、河流，还有密密麻麻像蚂蚁一样奔跑的小人。\n他们显然已经看见了她。\n很多人正朝着远处逃跑，也有一些人跪在地上，不停地磕头。\n“他们……是在拜我吗？”\n她蹲下来一点点，注视着下方的城市\n光是这个动作，就让整个大地发出一阵沉重的震动，\n“轰隆——”\n地面裂开细细的缝隙，几座本就摇摇欲坠的房屋直接倒塌，海柠又僵住了。\n“啊……对不起对不起……”\n她连忙小声道歉，不过说完她又愣了一下\n“等等……”\n“我为什么要跟梦里的人道歉啊……”\n她歪着头想了想，确实\n如果这是梦的话，那不就像游戏一样吗~？\n想到这里，她忽然有点好奇。\n“那……再试一下~？”\n她轻轻把脚抬起来，这一次，她看得很清楚\n白袜包裹的小脚从天空一样的高度抬起，影子慢慢笼罩住一整片村落，那些小人似乎意识到了什么，他们开始疯狂四散奔逃。\n海柠看着这一幕，心里忽然有点开心\n“呃……不会太过分吧……”\n她犹豫了一下。\n然后——\n脚落了下去。\n“轰！！”\n这一脚比刚才重得多。\n大片房屋直接被压平，屋顶和墙壁像纸一样折断。尘土像雾一样升起来，顺着她的小腿缓缓散开。\n海柠忍不住吸了一口气。\n“哇……”\n她低头看着脚下。\n刚才那条街已经完全消失了。\n只剩下一个巨大的脚印，她慢慢抬起脚，白袜底部沾着一点点深色的痕迹。\n海柠盯着那痕迹看了好一会儿。\n而后，她忽然轻轻笑了一下。\n“真的像踩沙子一样呢……”\n她的声音里多了一丝愉悦，最开始那种紧张和不安，好像慢慢淡了\n远处的山丘，在她那300米的身高眼里不过像小土包一样，\n河流像细细的线，而那些小人……已经小得几乎看不见了\n少女轻轻抬起一只脚，在空中晃了晃\n“这么小……难怪刚才没注意到。”\n低声说着，轻轻向前迈了一步\n“轰隆——”\n大地再次剧烈震动\n她这一脚直接跨过了半个村子\n脚跟落在田地里，整片田垄被完完全全压扁，而脚尖则踩在另一条街上，房屋像被橡皮擦抹掉一样整排消失\n“诶……”\n“我只是走了一步呀~”\n她忽然忍不住笑出来。\n“原来会变成这样吗~”\n她又迈了一步\n“轰——”\n这一次她故意慢了一点。\n白袜玉足缓缓落下\n她甚至能看见脚影一点点盖住地面，小人像黑点一样四散奔逃\n“嗯……”\n海柠眯着眼看了一会儿。\n然后脚轻轻一压。\n“啪。”\n她脚底微微碾了一下。\n地面就像软泥一样塌陷。\n“……有点奇怪。”\n她小声说到，但她并没有停下，反而又慢慢转了一圈。\n裙摆在空中轻轻晃动，几座高一点的塔楼直接被吹倒了\n海柠低头看着，\n脸上渐渐露出一点点忍不住的笑\n“原来……我这么大啊~要是秦雯在就好了”\n“她肯定会说我又在胡闹。”\n想到这里，她忽然有点不好意思，于是便对着那些注视着她的小人们落下了玉足\n“轰！！”\n她轻轻晃了晃脚。\n“反正只是梦嘛。”\n这一次她没有再小心。\n三百米高的身体在古代城市中慢慢移动。"
