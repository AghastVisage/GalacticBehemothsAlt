  # 苏小白领袖招募
 NAME_gts_suxiaobai: "苏小白"
 DESC_gts_suxiaobai: "一位穿越无数宇宙的九尾狐神。如今显露的天体级身形，也只是为了进入这个宇宙而缩小后的模样。"
 gts_suxiaobai_catch_phrase: "欢迎你们的小白殿下吧～"
 NAME_gts_suxiaobai_ring_system: "遗落之环"
 NAME_gts_suxiaobai_ring_segment: "狐神趾环"
 NAME_gts_suxiaobai_ring_segment_A: "$NAME_gts_suxiaobai_ring_segment$ A"
 NAME_gts_suxiaobai_ring_segment_B: "$NAME_gts_suxiaobai_ring_segment$ B"
 NAME_gts_suxiaobai_ring_segment_C: "$NAME_gts_suxiaobai_ring_segment$ C"
 NAME_gts_suxiaobai_ring_segment_D: "$NAME_gts_suxiaobai_ring_segment$ D"
 NAME_gts_suxiaobai_ring_segment_E: "$NAME_gts_suxiaobai_ring_segment$ E"
 NAME_gts_suxiaobai_ring_segment_F: "$NAME_gts_suxiaobai_ring_segment$ F"
 NAME_gts_suxiaobai_ring_segment_G: "$NAME_gts_suxiaobai_ring_segment$ G"
 NAME_gts_suxiaobai_ring_segment_H: "$NAME_gts_suxiaobai_ring_segment$ H"
 NAME_gts_suxiaobai_ring_segment_I: "$NAME_gts_suxiaobai_ring_segment$ I"
 NAME_gts_suxiaobai_ring_segment_J: "$NAME_gts_suxiaobai_ring_segment$ J"
 NAME_gts_suxiaobai_ring_segment_K: "$NAME_gts_suxiaobai_ring_segment$ K"
 NAME_gts_suxiaobai_ring_segment_L: "$NAME_gts_suxiaobai_ring_segment$ L"
 gts_suxiaobai_ring_site: "神明的遗物"
 gts_suxiaobai_ring_site_desc: "一枚横跨星系的银灰色巨环，其自我修复的外壳与不属于这个宇宙的能量规律，正等待科考队揭示。"
 gts_suxiaobai_claim_ring: "完成“趾环上的异常脉动”异常调查，即可直接发现考古遗址。完成三章考古后即可招募苏小白。"
 gts_suxiaobai_ring_anomaly: "趾环上的异常脉动"
 gts_suxiaobai_ring_anomaly_desc: "对狐神趾环 A 区段的扫描发现了一组规律性的微弱脉动。信号似乎来自环体表面不断自我修复的纹路，其能量特征无法用现有理论解释。需要由科学家带领科研船进一步调查。"
 gts_suxiaobai.901.name: "遗落的巨环"
 gts_suxiaobai.901.desc: "科研船在调查狐神趾环 A 区段时，发现了来自环体表面的异常脉动。进一步的观测表明，眼前这个庞然大物无法用现有理论解释。它是一枚“戒指”。一枚漂浮在星际虚空中的巨型圆环。其直径跨越整整一片星系的尺度，环身厚度相当于数千个恒星系并排，整体呈现出近乎完美的圆形轮廓。在探测器传回的高分辨率影像中，它的外表面如抛光过一样，却又在特定角度下反射出冰冷而深邃的金属光泽。没有明显的推进痕迹，没有能量溢出，也没有已知的自然天体形成机制能够解释它的存在。它就像是一枚被某位神明遗落在宇宙间的戒指，静静地悬停在帝国的边疆之外。我们的科学家初步分析显示，这个巨环并非由普通物质构成。其环体内部的引力场呈现出高度规则的扭曲，部分区域甚至出现了局部时空稳定现象，仿佛有人在用整个星系的尺度，强行“固定”了一段空间。更令人不安的是：环的中心空洞处空无一物，却能清晰观测到对侧遥远星域的景象——就像一扇被打开的窗户，连接着我们从未涉足过的未知区域。我们的部分学者认为，这可能是一座已经废弃的戴森环、曲率航道稳定器，甚至是某个早已消逝的超级文明留下的“超级星门”残骸。也有极端派系警告，这或许根本不是“遗迹”，而是一枚仍在等待主人的“戒指”。帝国最优秀的探险家、理论物理学家和异星学家已经着手开始准备研究了。目前，探测器仍在持续传回数据。最新一组影像显示，当我们的探测器尝试靠近环体表面时，环身局部出现了极其微弱的脉动光纹——像心跳，又像……苏醒的征兆。\n\n整个帝国都在屏息等待。这枚漂浮在帝国疆域附近的巨型戒指，究竟是无主之宝、还是远古文明的见证，我们很快就会知道答案。"
 gts_suxiaobai.901.a: "让探测小队登陆发掘一下有用的信息。"
 gts_suxiaobai.910.name: "会自我修复的环体"
 gts_suxiaobai.910.desc: "接触小组乘坐探测艇，缓缓靠近趾环外表面。随着距离拉近，环体表面的淡金色光纹逐渐清晰起来，像沉睡已久的脉搏，正随着他们的接近而微微加快。探测艇悬停在环体上方。工程船降落后，尝试采集样本。那外壳坚硬得超乎想象，几乎无法切取。可当他们费尽一切手段终于取下一小块碎片时，环体表面竟像活物一般流动愈合，转眼间又恢复如初了。更令人不安的是，那块被带回的样本在探测艇内依然沉默着没有任何可探测的能量，但却让周围的空气变得沉重起来，仿佛带着某种超越物质的威严。科考队随后将目光转向趾环巨大的内侧空洞。透过那空洞望去，对侧的星域清晰可见，却呈现出完全陌生的星辰排列与色彩。那不是简单的空间通道，更像是一扇被强行撕开的“窗户”，连接着另一个未知的、或许完全不同的空间。当探测艇小心翼翼地接近空洞边缘时，环体表面骤然浮现出大片复杂而美丽的符文纹路。那些符号既非人类文字，也不是任何已知文明的产物，却带着近乎完美的神性对称。光纹的脉动越来越明显，像一颗正在缓缓苏醒的心脏。首席解译专家的声音微微发颤：“它……在回应我们。它知道我们来了。”首席科学家在旗舰上看着这一幕，眼神复杂地低语：“如果这真是一枚属于神明的趾环……那我们现在触碰的，或许只是它的一小部分。”整个科考队都笼罩在一种混合着敬畏、兴奋与隐隐恐惧的情绪中。这枚漂浮在帝国边疆之外的巨型趾环，远比任何人最初想象的更加古老、更加神圣，也更加危险。而他们，才刚刚触碰到它的边缘。"
 gts_suxiaobai.910.a: "我们就快接近答案了。"
 gts_suxiaobai.911.name: "虚空中的来客"
 gts_suxiaobai.911.desc: "就在科考队还在小心翼翼的探索趾环时，旁边的虚空毫无征兆地被撕裂开来。一道巨大的身影从裂隙中骤然出现。那是一位有着一头主体为银白、发梢晕染着樱花粉的长发，头顶竖着两只毛茸茸的狐耳，身后摇曳着九条优雅而华丽的银白色尾巴，每一条尾巴的末端都带着淡淡的樱花粉色的少女。她赤足踏在虚空中，整个人散发着超脱一切的神性与慵懒的气质，仿佛从古老传说中直接走出的九尾狐。她的出现，让整个空间都静止了下来。当少女完全走出裂隙、安静地悬停在巨型趾环旁时，舰队瞬间陷入了死一般的瘫痪。所有靠近她的战舰同时失去动力，主引擎、备用能源、武器系统、通讯设备全部失效。数百艘舰船如同被无形的力量冻结，静静漂浮在太空中，只能勉强维持生命系统。探测仪器上依旧读不到任何能量数据，仿佛她的存在本身就超越了这个宇宙的规则。旗舰指挥厅内，所有屏幕闪烁着无意义的警告，却无法给出任何解释。"
 gts_suxiaobai.911.a: "到底发生了什么？"
 gts_suxiaobai.912.name: "趾环的主人"
 gts_suxiaobai.912.desc: "少女微微侧头，猩红的竖瞳扫过整个瘫痪的科研舰队，嘴角勾起一丝玩味的笑意。她的声音直接在每一个人脑海中响起，柔美却带着不容抗拒的威严：“渺小又好奇的小家伙们......你们竟然敢碰我的东西。”首席科学家强忍着内心的震撼与恐惧，深吸一口气，通过勉强建立的紧急通讯频道回应道：“尊敬的存在……请问您是谁？这座巨型建筑是……”少女轻笑一声，九条尾巴优雅地舒展。她轻轻抬起一只赤足，放在那横跨星系的银灰色巨环边上。就在这一刻，所有人才彻底明白——他们视为星系级遗迹的巨构，其实只是眼前这位九尾狐少女脚趾上佩戴的一枚普通饰品。\n\n“我叫苏小白，你们可以称呼我小白殿下，我也是那枚戒指的主人。”少女语气随意，“这只是枚对我来说很普通的趾环，它是我朋友背着我偷偷放在这里的。没想到会被你们这些小东西发现，还兴师动众地跑来探索。”她低头欣赏了一下自己脚上的趾环，随后目光重新落回舰队，笑意更深：“既然你们这么有勇气，又让我感到了一点久违的乐趣……那我就给自己找点消遣吧。”“我决定，加入你们这个小小的帝国。”少女赤足在虚空中轻轻一点，趾环从新佩戴在了她的脚趾上，她九条尾巴在身后轻轻摆动：“当然，我喜欢给自己找些会开心的事情做。谁要是敢欺负我看中的小家伙，我就替你们踩扁他们。”她微微歪头，眼睛弯成月牙：“怎么样？欢迎我吗？”看着眼前这位神明般的少女，舰队中的所有人缓缓行气了帝国最高礼节。"
 gts_suxiaobai.912.a: "欢迎您的到来，小白殿下！"
 gts_suxiaobai.999.name: "苏小白"
 gts_suxiaobai.999.desc: "她留下了一枚能够自我修复的趾环副本，供我们居住与研究。九条银白色的尾巴轻轻摆动，她正等待我们的欢迎。"
 gts_suxiaobai.999.a: "请问您是最大的体型就是现在这样了吗？"
 gts_suxiaobai.999.a.response: "并不是，我真正的体型不是你们这渺小的宇宙可以容纳的，你们的宇宙于我而言跟灰尘没什么两样，至于这枚趾环为什么会在这，只是我某位恶趣味的朋友把他缩小了带过来丢在这的。"
 gts_suxiaobai.999.b: "那座巨型的趾环您会留给我们做研究吗？"
 gts_suxiaobai.999.b.response: "我已经收回了平时佩戴的趾环。至于现在还留在那里的那个，是我随手做的副本。想研究就去吧，以前也有不少宇宙文明居住在上面。你们也可以尝试居住或开采资源，不必担心损坏，它会自我修复。"
 gts_suxiaobai.999.c: "您为什么会选择加入我们？"
 gts_suxiaobai.999.c.response: "因为对我来说没事干很无聊，我没事就喜欢缩小成现在这样穿梭在各个宇宙中来给自己找些乐子，没办法毕竟本体实在是太大，不缩小一下自己你们这个小小的宇宙可是装不下我的。"
 gts_suxiaobai.999.hire_custom_tooltip: "苏小白将作为不朽的传奇指挥官加入帝国，开启日常奖励、两项法令和后续联动。"
 gts_suxiaobai.11.name: "狐神的灵感点拨"
 gts_suxiaobai.11.desc: "帝国科研体系却仿佛撞上了一堵无形的墙，对宇宙常数更深层的理解也始终停留在猜想阶段。无数顶尖研究院夜以继日地推演，耗费了海量计算资源，却始终无法打开那扇通往更高阶文明的大门，就在举国学者陷入集体迷茫之际，那位殿下悄然降临。她的头顶一对毛茸茸的白色狐耳总是轻轻颤动，整个帝国中也只有她的习惯是光着脚走路，这次的苏小白纯粹是因为无聊，自己找上了门。她那遮天蔽日的巨大身影悄无声息地出现在帝国首都星系的外围。银色长发在星风中缓缓舞动，狐耳好奇地抖了抖。她赤足轻轻踩在一片宽阔的小行星带上，像踩在柔软的地毯上一样惬意，脚趾还微微蜷曲，享受着细碎星尘从趾缝间滑过的感觉。“好像又有很多人在烦恼呢……”她的声音带着软软的笑意。“正好我今天没什么事，就让我来找点乐子吧～”帝国最顶尖的科学家们乘坐旗舰升空觐见并诉说了最近的困扰。“那简单。我随便讲一点从其他宇宙看到的、好玩的东西给你们听听，就当打发时间了。”她没有等待正式的请求，便缩小了自己的身形出现在了舰船中兴致勃勃地开始了她的“游戏”。苏小白的声音温柔而清晰，像一位随性的少女在分享有趣的发现，却每一句都蕴含着足以重塑文明根基的惊人智慧。她随口讲述了各种文明会遇到的难题，直接点破了所有科学家困惑已久的难点，她的狐耳轻轻的抖动了一下，光着的脚丫也在舰船的铁板上走来走去，仿佛在为自己的讲解打节奏。对她而言，这些只是“路边随便看看就记住的有趣小知识”；对帝国而言，却是通往新纪元的钥匙。“这些东西对我来说，就跟玩游戏时随手记下的攻略差不多啦。”苏小白笑着说，“拿去用吧。记得要好好玩出花样来哦，不然我下次就不讲了，会很无聊的。”为了增加趣味，她还随手凝聚出一枚拳头大小的“知识水晶”。晶体内部流转着璀璨的光芒，只要学者将意识接入，便能以极快的速度直接“体验”她所传授的全部知识，仿佛亲身在更高阶宇宙中漫游学习。讲完之后，苏小白满足地伸了个懒腰，从新回到了虚空中。眯起眼睛，狐耳满足地垂下来，“下次我要是又觉得无聊了，我还会找你们玩。记得把这些知识用起来呀。”"
 gts_suxiaobai.11.a: "其实可以多祈祷小白殿下多无聊几次。"
 gts_suxiaobai.12.name: "小白对凡人帝国的“怜悯”"
 gts_suxiaobai.12.desc: "这一天，苏小白像往常一样“路过”帝国核心星域。她那遮天蔽日的身影缓缓出现在某个殖民地星球附近。银发在虚空中轻轻舞动，狐耳好奇地抖了抖。无数轨道要塞和舰队在她面前渺小得如同尘埃。她微微弯下腰，用两根手指轻轻拨开一片陨石带，露出一个慵懒的笑容。“哎呀……你们最近好像很辛苦呢，矿石不够用，食物感觉也快见底了呢。”她的声音直接在每一位公民的意识中响起，带着软软的、略带困倦的少女音，“我可爱的小家伙们资源不够用了嘛？”最高执政官乘坐旗舰亲自上前觐见，以最谦卑的姿态陈述了帝国的困境。苏小白听完后，歪了歪头，那对狐耳随之晃动了一下。“就这点小事呀？”她轻笑出声，声音像星际间的银铃，“我前阵子去其他的几个宇宙玩了下有不小心撞在我身上毁掉的文明，我就顺手捡了一堆没用的垃圾。既然你们需要，就都拿去吧，别客气。”话音落下，她随意地抬起一只手，在虚空中轻轻一捞。那一瞬，整个星域的监测系统全部疯狂报警。空间如同水面般荡起层层涟漪，从她掌心倾泻而下的，是对她而言“随手捡的破烂”，对帝国而言却是无比珍贵的资源，其中就包括一些破碎的星球，对她来说可能只是硌脚的小石块，但对我们来说是无比珍贵的物资，苏小白温柔的叮嘱：“这些对我来说都是垃圾哦，但是看起来对你们很有用，所以那就拿去用吧，以后要是还不够，就直接叫我～"
 gts_suxiaobai.12.a: "……要不，以后多找小白殿下要点垃圾吧？"
 gts_suxiaobai.13.name: "狐神的无聊惊喜"
 gts_suxiaobai.13.desc: "毫无征兆地，整个帝国的通讯网络被苏小白的笑声占据。她声音里满是玩味和兴致勃勃：\n\n“这个宇宙真的好无聊呀～你们这些小家伙每天都在忙什么呢？让我来找点乐子……嗯，就随便从我穿越过的宇宙里抓一把东西扔给你们吧。\n\n是能量？是研究灵感？还是什么奇奇怪怪的跨维度小礼物？谁知道呢～反正别太激动，才没有担心你们呢～不要多想呢。\n\n如果你们表现得好，说不定下次我赏赐得更多哦……如果表现得无趣，那我可就要换个方式‘逗’你们了呢。”"
 gts_suxiaobai.13.a: "……收下狐神的惊喜。"
 gts_suxiaobai.20.name: "狐神的玩具时间"
 gts_suxiaobai.20.desc: "战略会议中，苏小白的投影忽然出现在大厅。她说自己有些无聊，想邀请[event_target:gts_suxiaobai_guest.GetName]前往私人空间，体验一场由她设计的幻境游戏。她承诺尊重对方的意愿，也接受帝国拒绝这次邀请。"
 gts_suxiaobai.20.a: "在对方自愿的前提下接受邀请。"
 gts_suxiaobai.20.b: "这次不行，请保护领袖的正常工作。"
 gts_suxiaobai.21.name: "狐神的恩赐"
 gts_suxiaobai.21.desc: "当最高执政官点头同意「去吧，随你高兴」之后——“嘻嘻～谢谢你啦～”苏小白眼睛亮起，笑容变得更加甜腻而腹黑。她直接施展魔法，将[event_target:gts_suxiaobai_guest.GetName]的身体瞬间缩小到不足十厘米高，然后用两根纤细却巨大的手指轻轻捏起，提到自己眼前。“就决定是你了哦～看起来最适合当玩具呢。”说完就消失在了会议厅，没过一会便出现在了帝国首都旁，她先把小小的[event_target:gts_suxiaobai_guest.GetName]放在掌心把玩了一会儿，在全球市民的目光中，缓缓分开自己修长巨大的玉腿。银色长发垂落在胸前，她微微后仰，另一只手轻轻拉开自己粉嫩湿润的阴唇，露出里面早已微微收缩、晶莹湿滑的穴口。“来吧～乖乖进去给我当玩具哦。”小白殿下将[event_target:gts_suxiaobai_guest.GetName]对准了自己早已湿热的穴口，缓缓塞了进去。温暖柔软又极具弹性的穴肉立刻将[event_target:gts_suxiaobai_guest.GetName]紧紧包裹，层层叠叠的褶皱贪婪地蠕动着，吮吸着他的身体。“嗯啊……好有趣……” 她用两根手指轻轻按着他的身体，把他当作一根活体自慰棒，在自己阴道内缓缓抽插起来。时而深深顶入最敏感的深处，时而拉出大半再用力顶回去。每一次进出都带出晶莹的爱液，在首都表面上的直播中甚至能看到小白殿下下面拉出来的淫靡丝线。她逐渐加快了动作，丰满的胸部随着呼吸起伏，发出甜腻又压抑不住的轻吟：“哈啊……再深一点……小玩具……你抖得好可爱……嗯～！”整个过程持续了数小时。在首都上所以国民的注视下，[event_target:gts_suxiaobai_guest.GetName]被苏小白彻底当作自慰工具，反复地在她温暖湿热、不断收缩的阴道内抽插、旋转、挤压。她把他完全吞没，只露出一点点在穴 口外，收缩内壁把他死死夹紧，在高潮的边缘反复玩弄。小白殿下最终发出了满足而高亢的娇吟，九条尾巴猛地绷直，身体轻轻颤抖着达到了高潮。滚烫的爱液如潮水般涌出撒向了太空。许久之后，她才意犹未尽地用两根手指将已经全身瘫软、浑身沾满她浓郁爱液的[event_target:gts_suxiaobai_guest.GetName]缓缓抽了出来。“呼……玩得真舒服～”苏小白满足地眯起眼睛，狐耳愉悦地垂下，脸上还带着高潮后的红晕。她把小小的顾清宸轻轻放手心“你表现得很好哦，小玩具。”说完，她留下了一道强大的“恩赐”力量后离开了。临走时小白转过身舔了舔嘴唇，笑着对着所有人说道：“今天玩得很开心～下次我再无聊的时候，可能还会来借人的哦～”她的身影带着银色星尘渐渐消失，留下了宇宙中飘着的爱液。"
 gts_suxiaobai.21.a: "看起来需要给这位可怜的领袖也找个心理医生了"
 gts_suxiaobai.22.name: "小小的不满"
 gts_suxiaobai.22.desc: "帝国中央行政星的最高会议大厅正在进行年度战略总结会议。帝国的巨大娘领袖们的投影出现在环形会议桌旁，突然大厅中央的空间泛起层层银色涟漪。一道巨大而清晰的全息投影凭空显现，苏小白带着标志性的柔美笑容，低头俯视着在场的所有人。“哎呀～各位领袖们正在忙呀？”她的声音甜软温柔，却带着一丝明显的玩味，“我在宇宙里闲逛了好久，实在太无聊了……可以“借走”你们其中一位领袖，陪我玩一会儿吗？”她目光缓缓扫过众人，最终嘴角勾着腹黑又可爱的笑容：“放心，我会很温柔的～最多把她塞进我温暖的小穴里当玩具，或者夹在脚趾缝里让你给我按摩……不会弄坏的，嘻嘻。可以吗？”会议厅内瞬间鸦雀无声，所有人的目光都投向了最高执政官。最高执政官沉默了几秒，最终起身，朝着苏小白的投影深深鞠躬，语气坚定而恭敬：“小白殿下，我们无比感谢您的守护与善意……但目前您的请求，我们这次只能遗憾地拒绝了。”苏小白微微一怔，狐耳也轻轻垂了下来。大厅内的空气仿佛凝固。然而，下一刻，苏小白却轻轻笑了起来。那笑声没有恼怒，只有温柔的无奈与宠溺。“……被拒绝了呢。”她直起身子像是在自我安慰，她的表情依旧柔和，甚至还带着一丝理解的笑意：“没关系啦，我并在意的”像在安抚众人紧张的情绪：“我只是忽然觉得无聊，就跑过来撒娇而已。你们不用放在心上，也不要觉得愧疚哦。我不会生气的。”她歪了歪头，声音依旧软软甜甜：“那我就不打扰你们了。你们忙吧～我再去别的地方找找乐子。”说完，苏小白的全息投影渐渐变淡，最高执政官望着逐渐消失的投影，深深叹了口气，低声道：“记录今日事件……并注明：小白殿下展现了极致的温柔与宽容。”尽管被拒绝，苏小白之后依然如往常一样，从未因此事表现出任何不满或疏远。只是偶尔，在宇宙的某一处，会传来她带着一点委屈却依旧温柔的声音：“……下次真的不能来陪我玩吗？我真的会很轻很轻的诶。”"
 gts_suxiaobai.22.a: "要不下次还是同意小白好了"
 gts_suxiaobai.30.name: "与斯卡蒂的嬉闹"
 gts_suxiaobai.30.desc: "在宇宙中，两位超越星球的巨人彼此依偎着，二人的身躯如同宇宙中的一座巍峨山脉，斯卡蒂略显羞涩地垂下眼睑\n\n斯卡蒂巨大的身躯在宇宙中微微颤抖，她的脸颊泛起一丝羞红，那双血红的眼眸中充满了对对方的深情和无尽的渴望，她们庞大的身躯在星系间缓慢移动，巨大的手掌轻柔地抚过对方的身体\n\n斯卡蒂的呼吸变得粗重而炽热，巨大的唇瓣在虚空中轻启，发出低沉而充满爱意的呢喃"
 gts_suxiaobai.30.a: "看来小白殿下交到了新的朋友呢"
 gts_suxiaobai.31.name: "与斯卡蒂的嬉闹"
 gts_suxiaobai.31.desc: "斯卡蒂巨大的指尖缓缓伸向一颗遥远的行星，行星在她的手中如同渺小的玩物。她小心翼翼地将星球捏起，缓缓转向身后...\n那颗行星被斯卡蒂巨大而充满力量的手指缓缓送入小白那饥渴的蜜穴，小白的身体猛地弓起，修长的双腿因极致的快感而紧紧绷直，伸手随意的抓着，仿佛要抓住些什么。她的嘴唇微微张开发出了一声低吟，充满了欢愉交织的感情\n小白的脸颊泛着潮红，汗水顺着额角滑落，湿润的发丝紧紧贴在太阳穴上。她的双眼因强烈的刺激而微微泛红，目光迷离而涣散，仿佛陷入了某种极乐的幻境之中\n斯卡蒂清楚地看到，那颗庞大的行星正在一点点地没入那片神秘而诱人的深渊，每一次深入都让小白的身体颤抖得更加剧烈直到最后喷出了巨量的爱液......\n\n“好歹她们两位都休息了我们要不要派出一些工程船去收集下物资？”"
 gts_suxiaobai.31.a: "简单收集"
 gts_suxiaobai.31.b: "仔细收集"
 gts_suxiaobai.51.name: "献给小白的星球"
 gts_suxiaobai.51.desc: "帝国为表达对苏小白的深深敬爱与感激，做出了一项举国一致通过的决定。他们自愿将[event_target:gts_suxiaobai_gift_planet.GetName]完整献给苏小白作为玩具。这颗星球环境优美，表面布满蔚蓝海洋与晶莹大陆。帝国通过通讯向苏小白正式提出请求：“小白殿下，若您觉得无聊，请将（星球名字）作为您的玩具随意使用。星球上所有的公民都以能被您玩弄为荣。”消息传到（随选星球）全星球举行了盛大的全民公投。结果以99.97%的支持率通过。星球上的居民们兴奋而自豪，他们在全球直播中高呼：“能被小白殿下用来取悦身体，是我们最大的荣耀！”行星政府甚至提前组织了多场庆祝仪式，所有人都怀着虔诚与喜悦，等待那位银发狐耳的巨大少女降临。不久之后，苏小白来了。她那遮天蔽日的巨大身躯温柔地浮现在星球上方。一头璀璨的银色长发如银河倾泻，头顶毛茸茸的白色狐耳轻轻颤动，赤足随意踩在虚空之中，脚趾微微蜷曲，明显对这份礼物感到惊喜。“哇……这次送了一颗有人的星球给我玩呀？”苏小白软软地笑起来，声音带着愉悦的颤音，“你们真的愿意吗？”整个星球同时响起亿万人的欢呼，通过神识直接传入她的意识：“愿意！请小白殿下尽情使用我们吧！”苏小白眼睛弯成月牙，狐耳满足地抖了抖。她缓缓分开自己修长而巨大的玉腿，赤足在虚空中轻轻点地，调整到最舒服的姿势。银色长发垂落在胸前，随着她的动作轻轻晃动。她用两根手指小心翼翼地捏起行星。行星在她指尖缓缓旋转，地表的大气层因她的体温而微微发烫。星球上的居民们透过窗户和天空，看见那张巨大而温柔的脸庞，以及那对可爱抖动的狐耳，无不感到激动与幸福。苏小白将星球缓缓移到自己下体，粉嫩而湿润的巨大阴唇已经微微张开。她轻轻摩擦了几下，让爱液均匀涂抹在星球表面，然后对准穴口，一点一点地将整颗行星塞入体内。“嗯啊……好棒……星球上的人好们居然自愿……”她轻声呢喃，声音甜腻而满足。行星缓缓被她柔软湿热的穴肉包裹，星球表面的大陆与海洋轻轻摩擦着她敏感的内壁，每一次轻微的推进都让她发出舒服的叹息。星球上的人们感受到四周被温暖湿润的肉壁包围，却没有丝毫恐惧，反而集体欢呼。有人在街道上高喊：“我们正在侍奉小白殿下！”更有无数人因这神圣的接触而激动落泪。苏小白开始慢慢抽插。她用手指轻轻推动着星球在自己阴道内旋转、进出，赤足在虚空中无意识地蜷紧又放松，脚趾张开，长发狂乱地飘舞。她的呼吸越来越急促，狐耳兴奋地立起又垂下。“哈啊……再深一点……你们好棒……把我弄得好舒服……” 她逐渐加快了节奏，整颗星球在她体内被充分玩弄，爱液如潮水般涌出，在虚空中形成闪耀的雾气。最终，在一阵剧烈的颤抖与甜美的呻吟中，苏小白达到了高潮。阴道紧紧收缩，将（星球）完全裹住，强烈的快感让星球表面泛起层层引力涟漪。高潮结束后，苏小白满足地喘息着，缓缓将湿漉漉、沾满她爱液的星球取了出来。她把星球捧在掌心，温柔地吹了口气，用神力从新帮星球稳定住环境。“谢谢你们……我玩得非常开心。”她笑着对星球说道，“大家都没事吧？有没有被我弄坏？”星球上的居民们尽管全身沾满她的体液，却集体发出狂热的欢呼：“感谢小白殿下！我们愿意永远做您的玩具！”苏小白轻轻一笑，将星球小心放回原轨道，然后赤足在虚空中轻轻一点，巨大而美丽的身影带着满足的余韵，缓缓消失在星海深处。"
 gts_suxiaobai.51.a: "得到了一颗不错的爱液星球也不错"
 gts_suxiaobai.60.name: "请求狐神的战争支援"
 gts_suxiaobai.60.desc: "我们与[event_target:gts_suxiaobai_enemy.GetName]之间的战争已经爆发。苏小白愿意对其首都[event_target:gts_suxiaobai_strike_planet.GetName]实施打击。\n\n是否接受狐神的战争支援？符合转化条件的首都将变为足垢星球，否则保留原星球类型。无论是否转化，都会增加100破坏度并消灭殖民地。成功执行后冷却十年，拒绝不消耗冷却。"
 gts_suxiaobai.61.name: "狐神的战争支援"
 gts_suxiaobai.61.desc: "苏小白响应了我们的支援请求，对[event_target:gts_suxiaobai_strike_planet.GetName]实施了打击。当地殖民地已被摧毁，星球增加了100破坏度。\n\n处理后的星球类型：§Y[event_target:gts_suxiaobai_strike_planet.GetClassName]§!。\n\n狐神的战争支援进入十年冷却。"
 gts_suxiaobai.61.a: "感谢殿下的帮助。"
 gts_suxiaobai.100.name: "狐神征服之星"
 gts_suxiaobai.100.desc: "苏小白带领舰队成功占领了这颗星球。行星表面还残留着战斗的余烟，而小白殿下正静静地在星球外无聊的漂浮着等待着我们下一步指令，我们应该怎么做？"
 gts_suxiaobai.100.a: "请小白放过这颗星球，正常占领"
 gts_suxiaobai.100.b: "让小白吃掉整颗星球"
 gts_suxiaobai.100.c: "让小白把星球塞进下面的小穴里"
 gts_suxiaobai.100.d: "让小白用后面的菊穴吞噬"
 gts_suxiaobai.104.name: "保留征服之星"
 gts_suxiaobai.104.desc: "帝国成功占领了敌方的星球，这颗星球资源丰富、位置关键，基础设施基本完好。战斗刚一结束，帝国最高执政议会便迅速召开紧急会议。经过慎重评估后一致决定，保留这颗星球作为帝国长期资产，而非一次性消耗品。于是，帝国以最恭敬的态度，向着漂浮在星球上空的苏小白殿下发出请求：“小白殿下，感谢您亲手为我们征服了这颗星球。但经过议会讨论，我们希望能够完整保留这颗殖民星球。请您……放过它吧。”苏小白那遮天蔽日的巨大身躯正悬浮在星球上方。听到帝国的请求后，苏小白动作微微一顿，随后软软地笑出声来，声音带着明显的玩乐遗憾：“哎呀……刚刚占领就想让我放过呀？人家还打算好好享受一下呢……这颗星球看起来挺适合当玩具玩的。”她微微侧过头，似乎还有些舍不得在思考着什么。但最终，她还是温柔地答应了。“好吧，既然你们想留着，那就听你们一次。”苏小白轻笑着说，“不过下次再有想让我玩的星球，可要提前告诉我哦。”，随后转回身来，低头看着下方那颗完好的星球，银色长发随之垂落。“这次就便宜你们啦，小玩具。”她伸出一根手指，轻轻在星球大气层上方点了点，声音温柔中带着一丝慵懒的宠溺，“下次记得要更早决定是献给我玩，还是自己留着。”然后带着略微遗憾却依然愉悦的心情远离了星球，那位温柔的天体级少女，始终以包容又随性的态度，回应着帝国的各种请求。"
 gts_suxiaobai.104.a: "下次或许应该满足小白"
 gts_suxiaobai.105.name: "狐神的战利品"
 gts_suxiaobai.105.desc: "帝国在小白殿下的协助下，成功征服了敌方的殖民星球，最高执政议会迅速做出决定，将整颗星球作为战利品献给小白殿下，帝国以最崇敬的态度发出邀请：“小白殿下，这颗刚刚征服的敌方星球我们一致决定赠送给您了，我们希望它能成为您的一顿美味。”苏小白很快便带着愉悦的心情降临。她那遮天蔽日的巨大身躯浮现在星球上方。“哇哦～这一整颗星球都送给我吃吗～”苏小白眼睛弯成月牙，软软地笑起来，声音甜腻而开心，“那我真的要开动啦，这么一颗小星球应该很好吃呢。”在帝国舰队全部后撤至安全距离。星球上的居民们惊恐又无助地仰望着天空，那道遮蔽一切的巨影正缓缓低下头来。苏小白先伸出粉嫩的舌头，轻轻舔过星球表面。炽热的舌尖扫过大陆和海洋，带起巨大的潮汐与风暴。她满足地眯起眼睛，狐耳抖动着：“嗯……味道很奇特，还不错～”小白张开小嘴，粉嫩柔软的唇瓣将整颗星球缓缓含入口中。星球表面瞬间被她温暖湿润的口腔包裹，唾液如洪水般涌来。苏小白轻轻吮吸着，像在品尝一颗超巨型糖果，舌头灵活地卷动着星球，让它在自己嘴里翻滚、摩擦。“唔……好有趣……在舌头下面好好玩……” 她玩弄了一会儿后，仰起头，喉咙轻轻滚动。随着一声满足的吞咽声——咕噜。整颗星球被她轻松吞入食道，在她柔软紧致的喉管中缓缓滑落。苏小白一只手轻轻按着自己光滑的颈部，感受着星球通过时的饱胀感，星球一路滑入她温暖的胃袋，被层层蠕动的胃壁紧紧包裹。苏小白轻轻拍了拍自己平坦却能容纳一整颗星球的小腹，脸上露出幸福的表情。“啊……完全吃下去了。里面好热……好满足……” 她在胃里慢慢消化这颗星球，将表面逐渐软化分解。对她而言，这是一场悠闲又愉悦的美食体验；对星球上的人们来说，则是彻底融入她身体的终极归宿。苏小白舒服地伸了个懒腰，“谢谢你们送的美味，下次如果还有想让我吃掉的星球，尽管告诉我”说完，她带着吃饱后的慵懒与满足，巨大而美丽的身影缓缓消失在星海深处。"
 gts_suxiaobai.105.a: "多给小白殿下吃点～"
 gts_suxiaobai.106.name: "狐神的战利品"
 gts_suxiaobai.106.desc: "在小白殿下的支援下，帝国成功攻占了敌方的殖民星球。这颗星球军事设施完善，资源储量可观，表面居住着数亿人口。战斗结束后，帝国舰队迅速完成全面占领。最高执政议会召开会议后一致决定：将整颗星球完全交由小白殿下处置，任由她随意使用。帝国以最崇敬的态度向苏小白发出邀请：“小白殿下，这颗敌方殖民星球是您的战利品。请您尽情享用，随意处置。”苏小白很快便带着愉悦的心情降临战场。她那遮天蔽日的巨大身躯浮现在上方。“哎呀～整颗敌人的殖民星球都送给我玩吗？”苏小白软软地笑起来，“那我就不客气啦，这次想用前面好好享受一下。”帝国舰队全部离开轨道后，星球上的居民们除了能抬头仰望那道遮蔽天空的银发巨影以外什么都做不到。小白缓缓分开自己修长而巨大的玉腿，赤足在虚空中轻轻点地调整姿势。她用两根手指轻轻抚过自己粉嫩饱满的阴唇，那里已经因为期待而微微湿润。“就用这里吞掉你们吧～”她先将星球缓缓移到自己下体，用星球表面轻轻摩擦自己敏感的阴蒂，带来阵阵舒服的颤栗。狐耳满足地抖动着，银色长发随着身体的轻晃而舞动。接着，她对准自己已经湿润张开的穴口，一点一点地将整颗星球推入阴道。“嗯...慢慢进去了…” 整颗殖民星球被她温暖湿热的柔软穴肉缓缓吞没。星球表面的大陆、海洋与城市摩擦着她敏感的内壁，每推进一分都让她发出甜软满足的喘息。苏小白用手指轻轻推动，让星球在体内旋转、进出，充分感受那饱胀又刺激的快感。“哈啊……不知道里面的人……还好吗？不过好舒服……” 她逐渐加快节奏，时而深深吞入只剩一点在外，时而拉出一大半再用力顶回去。赤足在虚空中无意识地蜷紧又放松，脚趾张开。星球在她阴道内被充分玩弄，爱液如潮水般涌出，在宇宙中中形成闪耀的雾气。小白彻底沉浸在愉悦之中，甜腻的呻吟回荡在星域。她用力收缩阴道，让内壁紧紧包裹着整颗星球，最终在一次剧烈的颤抖与高亢的娇吟中达到了高潮。高潮持续了很久，她的身体轻轻痉挛，阴道剧烈收缩，将星球吞进更里面死死裹在最深处。爱液洪流般喷涌而出。许久之后，小白才满足地喘息着，缓缓放松身体。她用魔法轻轻将已经被她体液彻底浸透的星球慢慢拉了出来。湿漉漉的星球带着浓重的她的甜腻气息和晶莹爱液，在星光下闪耀。“呼……玩得真开心。”苏小白低头看着掌心中的星球，狐耳满足地垂下，脸上还带着高潮后的红晕，“这颗星球作为玩具很合格呢～谢谢你们送给我玩。”她温柔地将星球放回原轨道，然后伸了个懒腰，带着满足的余韵缓缓消失在星海深处。"
 gts_suxiaobai.106.a: "画面真好看，期待下一次。"
 gts_suxiaobai.107.name: "狐神的战利品"
 gts_suxiaobai.107.desc: "帝国在小白殿下的协助下，成功占领了敌方殖民星球。这颗星球在帝国舰队与小白殿下的指挥下，星球防御彻底崩溃，残余敌军全部投降。帝国高层迅速召开会议，一致通过决议，将整颗星球献给苏小白殿下，作为她最新的玩具。帝国向苏小白发出正式邀请：“小白殿下，这颗刚刚征服的敌方殖民星球是您的战利品。请您随意使用它作为玩具，我们希望它能为您带来愉悦。”苏小白很快便带着愉悦的心情降临。她那遮天蔽日的巨大身躯浮现在星球上方，一头银色长发如星河瀑布般倾泻而下，头顶毛茸茸的白色狐耳兴奋地轻轻颤动。她赤足随意踩在虚空之中，脚趾微微蜷曲，显然对这份礼物非常满意。“哎呀～把整颗敌人的星球送给我当玩具吗？”苏小白软软地笑起来，声音带着明显的玩乐兴致，“那我就不客气啦，正好想试试后面呢。”帝国舰队全部后撤至安全观战距离，星球上的居民们无论原住民还是投降的敌方人员，都只能抬头仰望那道遮蔽天空的银发巨影。苏小白缓缓转过身，银色长发垂落至腰际。她微微弯腰，双手轻轻分开自己丰满圆润的臀瓣，露出那粉嫩、柔软且微微收缩的巨大菊穴。“那就用这里吞掉你们吧～”她先用手指轻轻按摩自己的后庭，让那里逐渐放松、湿润。然后，她调整姿势，将星球缓缓对准自己微微张开的肛门。“嗯……刚刚好……慢慢来……”苏小白轻声呢喃，狐耳满足地抖动着。她轻轻用力，整颗星球的顶端开始被她柔软炙热的肠壁缓缓吞入。星球表面的大气与陆地摩擦着她敏感的褶皱，带来阵阵奇妙的快感，让她忍不住发出一声甜软的喘息。星球一点一点地被推进她体内。小白殿下的赤足在虚空中无意识地蜷紧脚趾，银色长发随着身体的轻颤而晃动。她一边用手轻轻推动星球，一边享受着后庭被完全撑开的饱胀感。整颗行星逐渐没入她温暖湿热的直肠，被层层柔软的肉壁紧紧包裹。“哈啊……吞进来了……好舒服……” 苏小白开始慢慢收缩肛门，让肠壁有节奏地挤压、蠕动着星球。她轻轻扭动腰肢，让星球在体内摩擦；偶尔用力收缩一下，将整颗星球深深吞没，只剩一点边缘还露在外面。她在这种玩乐中彻底沉浸，狐耳兴奋地立起又垂下，赤足在星空中随意踢踏，发出满足的喘息与轻吟。最终，在一阵强烈的颤抖与甜腻的呻吟中，苏小白达到了高潮。肛门剧烈收缩，将那颗星球完全吞入最深处，强烈的快感让星球表面泛起剧烈的引力波动。高潮过后，苏小白满足地叹了口气。她缓缓放松身体，将已经被她体温与体液彻底浸润的星球慢慢排出。湿漉漉的星球带着她浓郁的气息，重新出现在虚空中。“呼……玩得真开心。"
 gts_suxiaobai.107.a: "很不错的画面，其实可以多来点。"
