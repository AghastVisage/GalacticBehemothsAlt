 gts_suxiaobai.1000.3: "换上白色卫衣。"
 gts_suxiaobai.1000.3a: "这件穿起来很舒服呢。"
 gts_suxiaobai.1000.4: "换上黑红外套。"
 gts_suxiaobai.1000.4a: "换好了，准备出发吧。"
 gts_suxiaobai.1000.5: "换上夏日白裙。"
 gts_suxiaobai.1000.5a: "偶尔也想感受一下夏天的气息呢。"
