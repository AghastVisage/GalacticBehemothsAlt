  councilor_gts_ora:"巨娘形象大使"
  councilor_gts_ora_desc:"虽然大家都认为橘子长承担这样的名号是理所应当的，但是对于她本人来说……橘子长只是一句“你们随意吧”，将所有慕名而来的小人用鞋子轻轻推了出去。"

  gts_ora.1001.name:"“抱歉……但，我可能要离开了”"
  gts_ora.1001.desc:"随着橘子长加入了帝国后，她极为出色的管理能力和亲和力很快将整个帝国治理的井井有条。虽然作为天体级的大小，她的身体有时能够做到横贯整个天体甚至星系。折让所有人在她的管理下变得不再敢肆无忌惮。但是，橘子长的生活所投入的预算甚至不如一些普通大小的巨娘，除去她可以自由改变的体型外，或许平时清心寡欲的生活方式也是一个原因。\n是的，你不敢想象在这片茫茫星海中，能够找到一个如此理想化，甚至很少对小人痛下杀手的巨娘。但是，比起那些动不动就能毁掉一整个星球的巨娘相比，即使作为天体级的橘子长，也仅仅只是在执行惩罚的时候“吃”掉一些小人。不过……虽然那些被她吃掉的小人再也没能从橘子长的身体里出来，不过作为可能从橘子长的胃里出来的唯一的一批人，你知道里面有多么可怕。\n虽然橘子长只是一介文官，并没有像其她巨娘一样拥有着十分强大的武备，但是她的身体却弥补了这一部分——我们应当庆幸在执法预算中省下了一大笔经费用于投入其她巨娘的日常开销。毕竟……在橘子长治理的星球下，任何犯罪分子恐怕都被落入橘子长的胃里了吧。\n只是……这样的情况并没有持续太久，五年后，你看着已经到期的合同，也收到了属于她的通讯，你知道，她是时候要离开了。\n“抱歉……但，我可能要离开了。”\n城府的条框未必能束缚住这只飞鸟，但她要飞向的目标，却是慢慢长夜。少女将离职信交给你后，你很清楚一点：你看不到她的笑容，也看不到她以往的轻松。你刚想问什么，手指却被少女的食指抵住，示意你不要再说，又或者……示意你说些什么。"
  gts_ora.1001.a:"“离开之前……再抱一次这里吧。”"
  gts_ora.1001.a.custom:"§H别担心，离别的目的是为了更好的重逢。希望那个时候……你会见到更加‘成熟’的我吧~”§!"
  gts_ora.1001.b:"……我不接受你的辞职申请。”"
  gts_ora.1001.b.custom:"橘子长将会继续留在帝国内\n（等待后续版本内容）"
  gts_ora.1002.name:""
  gts_ora.1002.desc:"好哦，那请靠紧一些。”\n整个星球被橘子长包裹在了身体中间，少女轻轻托举着这个脆弱的生命，这颗星球美丽，却易碎。\n你不知道橘子长要做些什么，你也不知道橘子长离开后要去哪里。你更加不知道橘子长是否还能再回来，你什么时候还能再次见到她。无论如何，少女打点好了自己的行装，离开了此地，却留下了一些东西：\n一个星球，所谓的“孤星监狱”，她将这片恒星系交给了你。或许……这 意味着她还回来？\n而你回到办公室后，却看到，一个精致的手账本留在了你的桌子上。你认得这本，是橘子长一直带在身上的东西，而如今这样的大小放在桌子上，想必，也是她留给你的东西吧。而当你准备翻开第一页的时候，却在封面处看到了这样一句话，一句贴上去的便条：\n“别担心，我们终有一日重逢。”"
  gts_ora.1002.a:"..."
  gts_ora.1002.a.custom:""
  gts_ora.1002.b:""
  gts_ora.1002.b.custom:""
  gts_ora.1003.name:""
  gts_ora.1003.desc:"“嗯？这样吗？”\n你能看到少女的眼中闪过一丝惊讶，可转瞬之间，却又再次回到了往日乐呵呵的样子。\n“唉，等我什么时候把你包括但不限于雇佣童工克扣工钱外加强制打工等等罪行全部挤在这个小本子里……但是在此之前，我可要好好盯着你哦。”\n好吧，无论如何，你还是将这位天体级的行政官留在了帝国内。但是……你却无意间误入了一件无法回头的事情。不过还好，至少退一步讲，能在一个天体级巨娘的庇护下……甚至还有可能和她走的更近，怎么看，都不像是一件坏事吧。"
  gts_ora.1003.a:""
  gts_ora.1003.a.custom:""
  gts_ora.1003.b:""
  gts_ora.1003.b.custom:""
  gts_ora.1004.name:""
  gts_ora.1004.desc:"“别着急，我仍然在时间的尽头等你。”"
  gts_ora.1004.a:""
  gts_ora.1004.a.custom:""
  gts_ora.1004.b:""
  gts_ora.1004.b.custom:""
  gts_ora.1005.name:"漫海孤星"
  gts_ora.1005.desc:"时光飞逝，似乎抓不住她的尾巴，转眼间，你的帝国似乎步入了下一个阶段。\n在此期间，你经历了许多，也失去了许多，所幸得到的东西总是沉甸甸的，只是……在一个平静如常的一天，当你把堆积成山的文件扛到办公桌的时候——\n“她……要是她在的话……”\n你的脑海中总是浮现出一个身影，一个浅橘色麻花辫的模糊身影，一边笑着，将那些对你而言如小山一般的文件踹到兜里——随后你趴在她的手掌中，像个毛绒玩具一样被她放在她的书桌前，看着她把本应该是你的工作一点点完成。\n“完事……出去吃点？还是说……吃你呢？”\n似乎还能听到她一边打趣，一边带着你来到最近给巨娘供应的夜市中。所有巨娘都对你的身份避之不及，唯独她一边笑着，却早已将你的衣服串在了手里的烧烤竹签上。\n\n“她……应该是我比较重要的人吧。”\n你幡然醒悟一般，打开了被你珍藏在抽屉里的手账本——橘色的封皮，带着俏皮的贴纸，你翻开书页，里面的内容却是……空？怎么回事？你开始焦虑起来，翻着书页，却只在扉页找到了这样的一句话：\n“试着找到’自我”，追逐着自己的‘明天’。"
  gts_ora.1005.a:"..."
  gts_ora.1005.a.custom:"“似乎她交给你的东西有了新的变化，打开看看吧”"
  gts_ora.1005.b:""
  gts_ora.1005.b.custom:""

  gts_ora.1007.name:"寻找“她”的过去"
  gts_ora.1007.desc:"她的过去成谜，想找到一个天体级巨娘的过去谈何容易？因此你决定：在宇宙间寻找有关“橘子长”的各种内容，而她却如人间蒸发一般了无音讯，\n30年过去了，她到底变成了什么样？她是否还存在？你一无所知，可就在你觉得束手无策的时候，有一日，你闲来无事，翻开了那本手账，却突然找到了这样一句话，像是……一则日记的开头，或者说，日期？\n“2021年……孤星……”\n\n（你是否准备好了解“她”的过去？）"
  gts_ora.1007.a:"是"
  gts_ora.1007.a.custom:"（触发考古，且过去不可重新触发）"
  gts_ora.1007.b:"要不再等会吧"
  gts_ora.1007.b.custom:"（退出，无效果）"
  gts_ora.1008.name:"孤星"
  gts_ora.1008.desc:"”2021……孤星……”\n你知道这个星球，通天的巨大吸管插在整个星球上，原有的城市区划在她本人的治理下，使得你并没有为花费操太多的心思。只是……你仍然记得，有那么一处区域，却不在她的建设规划中。\n“这里嘛……就当是给咱一点点私人空间嘛……”\n一个天体级巨娘，拥有一块不到500平方公里的区域显然不违反任何规定。只是……她显然在瞒着你，当你来到这片区域后，却发现——\n那只是一片城市，确切的说……是一座第三次工业革命后期的城市群。"
  gts_ora.1008.a:"..."
  gts_ora.1008.a.custom:""
  gts_ora.1008.b:""
  gts_ora.1008.b.custom:""
  gts_ora.1009.name:"无能"
  gts_ora.1009.desc:"2021年4月 日\n在自己的第18岁的第一天，我遭遇了一场重大车祸。所幸命大，但是却还是对高考产生了影响。\n我已经不后悔了，被车撞飞的一瞬间，我想了很多，我似乎看到了，城市在崩坏，交通在瘫痪，似乎整个城市都在一个女孩的脚下变得如此卑微。不过……又如何呢？我这一世，什么时候低下那一直仰望的头颅？\n但是……是不是……如果自己就是那个女孩子的话……\n2024年12月5日\n近期发生的事情很多，也很累。\n倒霉的事情频频发生，我也总算在艰难维生中买了一块属于自己的pad——500块钱，却足以实现自己的梦想了吧。\n那个梦中不断浮现的景象……一个麻花辫的少女，整个城市都在她的脚边，显得如此渺小。似乎她抬起脚，就足以让一个城市，一个国家，甚至整个星球都为之胆寒……\n鞋底稍微厚一点吧……最好再穿个堆堆袜，这样任何人都别想爬到她的腿上……外套样式……是半搭着还是系在腰间？看看哪个更好画吧……\n2025年3月16日\n我无时无刻都在想着，当自己成为这个人，或者说，能够用自己的双手将其创造出来的时候。\n现在，时候到了，虽然粗糙了点，但时间能慢慢打磨她。\n至于名字……■■■吧。性别女，年龄17……今天就这些吧\n2028年3月25日\n大家好！今天是■■■的第一场首播哦~让我来看看有多少观众呢……\n15个，首播就有这样的成绩，已经算不错了。再接再厉吧。\n2028年4月……\n这本日记的主人恐怕难以再写下去了，就由我来继续写下去吧。\n就在今天，在虚拟主播■■■正式出道的15天后，我亲眼见到她在直播间里，随后突然停下了她那富有激情的演出，直到三十分钟后……我们才能够在直播间里听到微弱的救护车的声音。\n她为什么不求救？我不知道，我不知道这个问题究竟是谁能够问出来。就在刚刚，她被诊断出，为急性心脏衰竭，抢救无效死亡——确切的说，是放弃抢救吧，想必她也无力承担这笔医药费就是了。\n她留下的画作已成废纸，她写下的文章也被互联网冲进了垃圾堆。她的存在，她的死亡都变得那么无人在意，宛如被随意践踏的臭虫一般……\n那她为什么还要追求这么虚幻的东西？\n……\n“我恐怕……看不到你……在群星间璀璨的一日了……”\n\n这是你在一处旧居民房中找到的一本日记本，以及一份尚未出版的报导。这……是她吗？如果她的过去就是死亡的话……那你看到的那个天体级巨娘是——\n你不敢想，却突然听到了这样一个声音——"
  gts_ora.1009.a:"我来了，交给我吧"
  gts_ora.1009.a.custom:""
  gts_ora.1009.b:""
  gts_ora.1009.b.custom:""
  gts_ora.1010.name:"虚幻"
  gts_ora.1010.desc:"“好久不见，大家好哦”\n“停更已久的■■■，现在，化身为‘巨大娘’归来了哦~”\n浅橘色的双麻花辩，却因为某个渺小的信仰，在整个星球上空浮现。整个天空宛如一块全息屏幕，而这次她的观众，则有惊人的90亿。\n“好了好了，不要害怕，也不要用任何武器……咱是不会伤害大家的……”少女简单的进行了自我介绍后，消失在了群星中。而她也在寻找着一个答案，一个世间的第一问：\n“我是谁？”\n\n“我是‘收获’，是那个人所追逐的明天……”\n如今，人已然不在，少女踏在了城市群中，一切都在那个人的想象中，却再也没见到其身影。\n有点……讽刺。\n她循着仍然存在的记忆，来到了一处旧居民楼，早已收敛些许大小的身体，却仍然有十层楼那般高，不过还好，足够了，至少能蹲下来看一下，房间里都有些什么样的存在了。\n“我循着过去，但过去的相片不属于我……”\n“她拒绝了我。那我是谁？”\n\n“老板……这个手账本多少钱？”\n“五块……啊怪物啊！！”\n少女堵住了整个街道，只是一家文具店，在她眼中和一个烟盒差不多大小。老板惊恐的眼神中，看着被少女那加厚的鞋底堵住的门口，堵住了唯一能够逃跑的希望。\n“抱歉啦……咱最小也就这样大了……钱给你……小人的收款码有点难扫……”\n接过了和指甲盖大小的手账本后，却突然因为少女的力量，变得适合少女使用的大小。少女拿起了事先准备好的笔，坐在一处荒废的大楼上，看着远处的城市发呆。\n“我的故事……我自己写下来吧。”\n\n你拾起找到的残页，将一切都抄在了这个手账本中。你不知道这样做的意义为何，只是冥冥中有一种感觉……"
  gts_ora.1010.a:"她的前生……开始有点明晰了。"
  gts_ora.1010.a.custom:""
