  gts_trait_mora1:"旧梦萦绕之绊"
  gts_trait_mora1_desc:"$gts_trait_mora1_picture$“我做到了，在未来的某一天。”"
  gts_trait_orangez1:"至高之力"
  gts_trait_orangez1_desc:"$gts_trait_orangez1_picture$“不必害怕我，也不必害怕这颗眼睛。我以群星之名起誓。我的剑，将为你斩灭星海诸恶，我的枪，将为你开拓繁天诸星。”"
  gts_trait_orangez2:"至死不休"
  gts_trait_orangez2_desc:"“你为何不避？”\n“因为我的身后再无退路，唯有以身为薪，战至最后一刻（）。”\n（不会自刎归天的，放心）"
  gts_trait_orangez3:"沉重的负担"
  gts_trait_orangez3_desc:"告别了往日，如今的橘子长要承受的负担恐怕要比以往要多得多。不过这是她的选择，她也成功做到了这些。这份胸口上沉甸甸的分量，以及这比常规人类还要伟岸的身体恐怕也成为了她必须要承受的“代价”。"
  gts_trait_orangez4:"概念装甲模块"
  gts_trait_orangez4_desc:"她仍然是你记忆中比较熟悉的那个橘子长，虽然你知道现在的她也只是过去的某个书页，但是和本尊不一样的是，那份你十分熟悉的“坦荡”胸怀，却能在战斗中意外的拦下了很多常规舰炮的攻击。"

