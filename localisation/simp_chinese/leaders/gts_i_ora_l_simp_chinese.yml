  gts_ora_big_breasts_decision:"巨乳万岁"
  gts_ora_big_breasts_decision_desc:"“乳不巨何以聚人心？如此伟岸的山峰正是给予了小人在此定居的可能。只是这样做对橘子长而言……”"

