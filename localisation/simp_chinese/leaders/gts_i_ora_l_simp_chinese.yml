  gts_ora.3001.name:"巨娘财务报单"
  gts_ora.3001.desc:"一天的时间悄然结束……你嚼着嘴里的口香糖，看着桌子上的巨娘报销单。\n\n“今早八点某巨娘因被小人指责踩坏汽车导致踩踏，致使半个城市惨遭足底毁灭……”“中午10点因为巨娘太饿闯入小吃街导致整个小吃街被碾碎在巨娘的舌苔下……夜间因为巨娘绊倒高压输电线致使大半个城区停电……”\n\n将所有物种纳入同一个星球里生活是谁的决议来着？你不记得了。只是在这一大堆领袖天体级别的报销单中……你却发现了一个特别特殊的存在……\n\n为何橘子长的报销单上写着一个1？"
  gts_ora.3001.a:"找橘子长问明白"
  gts_ora.3001.a.custom:"发起特殊项目：§Y找橘子长问清情况§!。派遣任意舰船前往§Y孤星监狱§!轨道，调查需要§Y15天§!。"

  gts_ora.3001.b:"这家伙……偷税了？"
  gts_ora.3011.name:"你的“1”，只划给我的范围内。"
  gts_ora.3011.desc:"“你来了呢……”\n\n见一个天体级巨娘的画面你想了很多次，直到你来到了她管理的星球内。却偶然像是明白了什么似的，走到了橘子长所在的办公室内。\n\n偌大的办公室只是对自己这样的体型而言。只是对于她而言，一张足够容得下公文的桌子，一把椅子，一张床，一处洗漱台， 此外，就只剩下一冰箱的饮料。或许这些东西可以养活不少小人……甚至拉高一整个城市的GDP都不在话下。但唯独是对她而言，或者说，对于那些动辄消耗以星球为单位的巨娘面前：\n\n节约，却井井有条。恐怕是对这个巨娘的真实写照。\n\n“那个……你这个财务报单……这个1是？”\n\n一旁的小人下属将热茶送在了你的手中，却更加让你感到诧异几分：这个小人……体型和你相近的小人。是不是一年前你安排在橘子长手里的那个？那也就意味着……想比那些都能称之为消耗品的存在，橘子长却从来没有换过。难道说？\n\n你不敢相信星海里会有一个从来不对小人做什么的天体级巨娘。除非这个1是？\n\n“这个啊……这个1这不是来了嘛……”\n\n在橘子长示意让下属离开后，你的身体被她捏了起来。果不其然，在你来到这里的时候你就已经在想这种事情的可能性。只是，却没想到被少女捏起来的触感却是如此的复杂。\n\n一边是带有温度的细腻肉体，一边是勒住绷紧的致密的尼龙手套纹路。一边白，一边黑，就这么被夹在食指和中指之间，顺应着手的移动而将你抬起，直到逐渐靠近橘子长的脸。你试图挪开视线，可下意识低头的瞬间，却看到下方没有任何缓冲的高空，如果，我是说如果，自己一定要被一个巨娘这样捏着玩弄的话……你希望对方的罩杯能大一些，最好是能接住自己的程度。只是现在，这些也只能是想想而已。而就在你闭上眼，在想自己究竟要被一个巨娘作何玩弄时——一股湿润而又温暖的感觉却席卷了你的全身，或者说是正面。\n\n湿润，柔软，像是陷在了柔软的床铺上——不对，或者说一辆裹满了棉花的大运在轻轻的接触着你，却仿佛经过里连绵的阴雨天一般，身体湿漉漉的，裹满了粘稠的液体，让你不禁怀疑雨伞的用处。但就算如此，从温暖中飘出的淡淡柑橘香却让你萌生出了想睁开眼的想法，而睁开眼的一刹那，却看到了一片粉色。\n\n正是橘子长那柔软的舌苔。\n\n“现在……这个1就算报销了哦。”"
  gts_ora.3011.a:"算了，舔就舔吧。"
  gts_ora.3011.b:"别一时兴起给我吞了就行……"
  gts_ora.3011.c:"完了衣服记得赔（）"
  gts_ora_financial_report_project:"找橘子长问清情况"
  gts_ora_financial_report_project_DESC:"橘子长的财务报单上只有一个“1”，这与其他巨娘的巨额报销形成了鲜明对比。派遣任意舰船前往孤星监狱轨道，向她问清情况。调查需要15天。"
  gts_ora_financial_report_project_requirement:"孤星监狱轨道内的任意舰队：$COUNT$/$REQUIRED$。"

  gts_ora_qhai_gift_project:"为千海做惊喜大礼"
  gts_ora_qhai_gift_project_DESC:"为千海制作一份惊喜礼物。项目需要2000社会学研究，必须在18个月内完成，完成后消耗5000巨娘之力。"
  gts_ora_qhai_gift_project_requirement:"至少拥有 £gts_giantess_human£ 5000 巨娘之力。"

  gts_ora_qhai_stream_project:"构建宇宙的帷幕"
  gts_ora_qhai_stream_project_DESC:"或许让一个宇宙化身的存在临幸此处绝对不是一个明智的选择……但无论如何，作为帝国中的一份子，即使这份情感属于自己的一厢情愿，即使自己的力量在这片星海中过于渺小……既然这样的愿望可以实现，那就做下去吧。"


  gts_ora.3002.name:"裙底儿童乐园"
  gts_ora.3002.desc:"近日，突然有一则报导传到了你的手中。\n某星球的极限体验点被突然改造成了儿童乐园，专门对身高不足1.2厘米的小人买票游玩，且家属大多数都保持放心的态度甚至自己都有想变成儿童进去玩的想法……\n这样的想法，却令你不安。因为这个地点发生在任何地方都不会太奇怪，非法的极限体验园中或许真的有那些为非作歹的巨娘，会选择专门对小孩子动手……但好死不死的就是，这个事情发生的地方——\n却是橘子长目前所管辖的星球中。"
  gts_ora.3002.a:"我看看怎么个事？"
  gts_ora.3002.a.custom:""
  gts_ora.3012.name:"裙底儿童乐园"
  gts_ora.3012.desc:"你来到了橘子长所在的星球……也看到了这个所谓的儿童乐园到底为何物。同时你也验证了你的心中所想：你的担心不是多余的。\n天体级别的行政官，此刻却只是屈膝跪地，那双特制的厚底运动鞋此刻已不再是能拦住小人的巨大天堑。小孩子爬到了堪比大楼一般高大的腿上，在裙底的荫蔽下自由玩闹……有的小人在尝试往上爬，但你也清楚，这样的高度，哪怕是成年人都爬不到这高耸如云的裙底。有的小孩子甚至尝试将手伸进开了裆的裤子里……想尝试未到年龄的功能，不过很可惜，现在还不是时候。\n“你来了呢……是要买票吗？”\n很显然，即使橘子长的年龄怎么看都不像是比你年长的样子……可是就算不论年龄，你的体型在对方的眼里或许确实像是一个“小”孩子。‘\n“好了，咱开个玩笑……1.2厘米的小人免票哦……\n虽然你很想澄清自己的身高……但是橘子长下一刻手里拿起的超大尺寸卷尺又打消了你要验牌的冲动。毕竟按照橘子长这个计量标准来看，她在这里纯粹只是想让小人往自己的腿上爬。当然有句话也说的正是道理：“来都来了…”\n你趴在少女的小腿上，似乎在一堆小孩的簇拥中，你还能感觉到少女身体中所散发出来的一丝温度。渐渐地，刚刚诞生出的危机感也在一点点的烟消云散。你不知道那些小孩子是怎么想的，你也不知道橘子长的用意究竟是如何，才会让这样未经世事的小孩子如此接近自己。渐渐地，你也开始往上爬了起来，少女皮肤的柔软似乎找不到合适的发力点，因此你无论如何努力，却也只是向上爬了十几米的高度就滑落下来。果然，像电视里看到的那种景象还是骗人的。巨娘高耸入云的双腿虽然如此诱人……却对这样慕名而来的你拉开了应该有的距离。\n“你知道一个故事吗？曾经有一个很温柔的巨娘，她每天都会收留无数个小人并且很热情的把那些小人养在自己的身边……她自以为可以把小人的一生都保护好，直到被巨娘保护的小人想出去看看外面的世界……”\n橘子长顿了两秒，语气间却变了一个调。转而变成了一种较为沉重的语气：\n“只见过那一个巨娘的小人，却天真的以为所有的巨娘都是这个样子的，而这样的小人开始天真的找那些以摧毁小人为乐的家伙寻求保护的时候……”\n“所以嘛……要先让小人知道这些地方有多么可怕，让这些小家伙知道这么大的鞋子应该离的远远的……懂我的意思了吧。”"
  gts_ora.3012.a:"这就普及小人义务教育！"

  gts_ora.3003.name:"加班时刻的休憩"
  gts_ora.3003.desc:"加班的时间会让一切都变得好久……在你决定在孤星监狱休息一晚的时候却发现……\n\n似乎此时却是小人的禁足期。\n\n你确实很少在别的地方见过这种情况，在巨娘大致要放学和下班的时间段内，小人只能躲在建筑物内，以免被一些巨娘无意识的踩踏。这样的情况一般只出现在巨娘和小人合理共存的城市内。虽然这样做对小人来说确实有些许的不公平……但是在一些更好的办法出现之前，还是尚且如此吧。\n\n孤星监狱的建筑尚且处于未翻新的范围内，很多城市依然保留着旧时代的建筑。不过细心的你却发现了，似乎远处还能看到一些塔吊的灯光和一些泰坦级巨娘的叫喊声，看上去应该是在施工些什么吧。\n\n既然出不去，不如看一下橘子长吧，正好在同一个楼。\n\n你如此想着，随着台阶来到了橘子长的位置却发现：她还在，此刻却是在闭眼休憩。那本她一直留在她身边的手账本摊开，上面似乎还画着类似建筑图纸一般的内容。只是对比手账本上那偏儿童画一般的画风相比，桌子上正在画的蓝图就有点工整许多……\n\n“体型共存建筑”，你很难想象到橘子长还会整这些，但是这个建筑的结构……你并不是这个领域的专家，但是你看到橘子长最近贴着创可贴的手，和周围乱七八糟的模型还有美工刀的时候，你才后知后觉起来：这家伙已经好几天没合眼了。\n\n你很想给她盖个被子，或者抱着她抱到床上，很可惜你现在的体型，即使橘子长的大小和一般巨娘差不多，这也是无论如何都办不到的事情。你尝试了许久，这才堪堪的将橘子长手上的铅笔取了下来，却感觉在抬一根粗大的圆木一般费力。算了，至少你这样小小的举动能够让她放下工作一会吧……在你把这根粗大的铅笔藏起来之后。"
  gts_ora.3003.a:"就让她休息一会吧。"
  gts_ora.3003.a.custom:""

  gts_ora.3004.name:"不速之客的到达"
  gts_ora.3004.desc:"近日，你收到了一则消息：有少量的太空海盗正集结于 群星 的外围，意图对你的帝国发动攻击。这些家伙看上去十分凶残，身躯却有着接近于泰坦级的大小，且各个配备着十分精良的装备。看来……贸然派遣一般舰队只会吃些苦头。\n\n那么……天体级的舰娘如何？你有了想让天体级的舰娘去解决此事，可到了部署的时候却突然发现：似乎这一刻，你所有的天体级舰娘，包括天体级指挥官全部被派遣至边缘星系执行任务。看来，远水解不了近渴，但是手头却并没有十分强大的舰队可以和对方抗衡，而就在这个时候……\n\n“报告，事情已经解决了亲。”\n\n平板内突然响起了这样一则通讯，然而通讯中声称解决了这件事的人并不是指挥官也不是科学官，而是……一个普普通通的天体级的行政官。"
  gts_ora.3004.a:"我看看怎么个事？"
  gts_ora.3004.a.custom:""

  gts_ora.3014.name:"$gts_ora.3004.name$"
  gts_ora.3014.desc:"泰坦级别的海盗已经抵达了孤星监狱的轨道，已经有小股部队已经登陆星球，然而，就在人们认为对方要大肆进攻的时候……几乎只有小人陆军的星球内，敌方目标却在一瞬间发生了溃逃的动作。这是怎么个事？\n\n“怎么了？帝国的长枪大炮不怕……反倒怕我这样一个手无寸铁的女孩子吗……”\n\n橘子长却出现在孤星监狱的轨道外，手上捏着的却是太空海盗的首领。擒贼先擒王，在橘子长挟天子以令诸侯的操作下，刚刚还在入侵星球的巨娘却在一瞬间停止了动作。\n\n毕竟这些巨娘要面对的，是一个身躯跨越整个天体的女孩子。\n\n“为了防止我的耐心消耗殆尽，我会给你们十三次心跳的时间，至于要怎么做……”\n\n有的话不必完全讲清，哪怕未开智的生物都有趋利避害的可能，一瞬间，所有的巨娘全部撤出星球的轨道，只剩下橘子长手里捏着的这一只。\n\n“忘了说了……在你们还在星系之外，我就已经联系了一个家伙来……我确实放过了她们，但是当她们走出这个星系的时候，就会——”\n\n橘子长的手指轻轻张开，做出了一个爆炸的动作，却令手中的巨娘吓得哆嗦，似乎有透明的液体从对方的下体渗出，堂堂泰坦级巨娘，却被一个普普通通的女孩子吓得全身发抖，或许这样的笑话，也只能在这样荒诞的场景下才会出现吧。\n\n“不过不用担心……毕竟比起我的话，我认为你一会儿会更愿意落入那个杀伐果断的家伙手里……”橘子长从兜里掏出了一小捆细线——任何人都没见过她这幅景象，也不知她的兜里为什么会有这捆堪比星界丝缕一般的细线——不过从外套上的补丁来看，或许这些都不重要。橘子长微微笑着，将巨娘绑成个很羞耻的样子。随后略带狡黠的说了两句：\n\n“落在别人手里的小人，一般都会求着别死，不过可以理解，又有谁会想不开嘛。”\n\n“但是落到了橘子长的手里……恐怕你会认为死掉是一件多么轻松的事情……但是吧，世界上哪里又有那么些轻松的事情呢~”"
  gts_ora.3014.a:"你说你惹她干嘛……"
  gts_ora.3014.b:"还好键盘侠已经绳之以法了……"

  gts_ora.3020.name:"接近"
  gts_ora.3020.desc:"你可以承认，橘子长在帝国的能力确实令人惊叹，但是你不能理解的一个事情是：\n\n为什么会有人会没经过自己允许的情况下查抄橘子长的屋子？\n\n当你感到现场时，橘子长的屋子和办公室已经被各种体型的巨娘围个水泄不通。而得到的理由却也是极为荒唐：\n\n“橘子长有着天体级的俸禄却只有高大巨娘差不多的花销……一定有问题！”\n\n在你认为这样的事情比较扯淡的时候，橘子长却对你伸出手，使了个眼神。你心领神会，爬上了橘子长的手。就这样被她带到了一边。\n\n“查吧……趁这个机会，咱们去别的地方玩玩。”\n\n橘子长并无愠色，只是带着你离开了此处，可走了几步，回过头，对着搜着自己屋子正起劲的巨娘说了句不轻不重的话：\n\n“不过要是我回来后发现屋子被弄乱了……想必你们不会想知道弄乱女孩子的屋子是什么后果吧。”\n\n你被橘子长带着，来到了一处公园。公园内，一群小人在巨娘的腿上玩滑滑梯，却比你想象中要和谐许多。橘子长来到了一处长椅坐下，也好，正好也能休息一下吧。只是有一件事情让你依旧不明白：\n\n星球总督，这个基本上可以算得上是整个星球最大的官职，却被那么几个蝇头大的小检查员，用这样一个扯淡的理由逼到这种程度。这一点你并不理解，甚至觉得橘子长的行为有点……憋屈。这不就是白白受欺负了嘛。\n\n“想知道为什么咱不生气吗……”\n\n就在这时，你的思绪却被橘子长打断。\n\n“算了……闲着也是闲着，想听故事吗？我倒是可以给你讲讲，关于自己的一点小事……”"
  gts_ora.3020.a:"听"
  gts_ora.3020.b:"（装睡）"

  gts_ora.3021.name:"$gts_ora.3020.name$"
  gts_ora.3021.desc:"“一个女孩子的故事要从哪里讲起呢？还是从小时候开始吧。在察觉到自己并不是什么人类的时候……”\n\n“自己苏醒后并没有什么家人，以及任何和我相关的人物。有的只有这片荒芜的旧城区……以及在图书馆里面翻到的一些乱七八糟的纸质书。”\n\n其实……还好吧。在那个纸质载体尚未淘汰的年代，一杯奶茶坐在桌子上看着书的时间总会引起无数的遐想。只是当时的条件吧……并没有奶茶可买，桌子也有点破破烂烂，但至少让我接触到了几乎无限的可能性。\n\n曾幻想自己是个面对风车的骑士，或者是什么给人们带来火种的存在……但是吧，直到看到了那个所谓的西西弗斯，却再也没能平静下来。得偿所愿是每个人的愿望，可生活在这个世界上的小人，却被和巨石还要沉重的足底压着……\n\n“但是……”你很想问些什么，毕竟你似乎猜到了些什么。从来到帝国后，以这样一个普通巨娘的大小开始，你就已经猜到了些什么。\n\n“你，并不是生来的天体，对吧。”\n\n“谁知道呢？毕竟，再渺小的孤星，也还有可以向着千万光年外的世界，展示自己的璀璨不是吗？”\n\n橘子长说完后，伸了个懒腰。或许，这是她难得放松下来的时段，你也明白，自从她来到这里之后，你担心的内容却和别的天体级行政官相悖：绝对不能让她再继续这样没日没夜下去。\n\n“即使这样的星星要等待很久，久到足够一个银河的时长……不过咱要是这样说的话……你会陪着我走过这么长的时间吗？”\n\n“愿意。”你很想这样说，只是碍于心底里的不好意思，决定换一种问法：“话说……橘子长有没有什么很想要的东西吗……上次那个报单除外！”\n\n“这个啊……咱确实有一些，不过时间也不早了，总不能让那些家伙翻那么久不是吗？”"
  gts_ora.3021.a:"嗯嗯"

  gts_ora.3022.name:"$gts_ora.3020.name$"
  gts_ora.3022.desc:"天体级行政官的查抄工作已经接近尾声，很显然，除了冰箱里的两瓶橘子汽水以外，并没有搜到任何东西。只是这样的行为实在有些愧对于橘子长，毕竟……这样一个尽职尽责的天体级行政官属实有些求而不得了。\n\n“走吧走吧……咱没这样的雅兴。如果不想变成吊在纪念碑上的那个巨娘的话……还是尽早离开我的视线吧。”\n\n你感到自己的距离正在逐渐被她拉近，随后……橘子长打开抽屉，将一个手账本给予了你。\n\n“至于你说的我想做的……短时间的话……算是都写在这里了吧。”"
  gts_ora.3022.a:"（接下手账本）"
  gts_ora.3022.a.custom:"为孤星监狱添加永久修正“橘子汽水的夏天”：住房 +100%、岗位效率 +10%、犯罪度 -100%。"

  gts_ora.4001.name:"异界缔结契约"
  gts_ora.4001.desc:"（尘封的记事本却翻不开任何书页，却无缘无故的划伤了你的手指……你能够感觉到这样的内容有着难以理解的封印……但是这样的封印或许是对你的保护，还是避免让你堕入更强大的未知？）"
  gts_ora.4001.a:"“唔……我的手！”"
  gts_ora.4002.name:"异界缔结契约"
  gts_ora.4002.desc:"「啦啦啦…….」\n\n轻快的哼唱声，少女坐在书桌边，眺望着远方阳光照射下的沙滩与海洋，身体跟着歌声摇晃着，红色的长发在海风地抚摸下微微摆动。\n\n「咔哒」\n\n房间的门被推开了。听到身后的声音，她从椅子上跳下来。\n\n「呀？欢迎，你来啦，橘子姐姐」\n\n门外，是一头橙发的异色瞳少女，略微年长几岁的样子。看到来人，红发少女欢快地扑了上去。\n\n「法拉，我来啦，到底是什么事情需要帮忙，这么神秘」\n\n抱住扑过来的少女，橘子长的手抚摸着她的头部。\n\n「嘻嘻，其实，就是这个……」\n\n调皮地吐了下粉嫩的舌头，法拉指了下身后的桌子，只见一个拳头大小造型古怪的透明球体被安置在一个矩形的基座上，散发着微光，隐约可以看到里面似乎装着什么东西。\n\n「这是什么？好奇怪的玻璃球」\n\n「可不要小看它哦，这是微缩宇宙，里面可是装着一个世界呢」\n\n「哎？世界！」\n\n「嗯，没错哦，这里面有一个新世界，是我创造的哦……很厉害吧」\n\n「什么意思？」\n\n「嘛，具体就说来话长了，这得从我之前收到的『宇宙创生』组合包说起……」\n\n「哦，居然有这么神奇的东西」\n\n「嗯，总之我先带你进去看看吧」\n\n在基座上按了一下某个机关，在面前投射出一道光门。穿过那扇门，眼前的景象豁然变化，蔚蓝的天空，广袤的平原，以及……城镇。\n\n「好多小房子，就像玩具一样」"
  gts_ora.4002.a:"契约，缔结！"

  gts_ora.4101.name:"来历不明的通讯器"
  gts_ora.4101.desc:"这个通讯器……橘子长看到你曾使用过。似乎只要有了§r她§!，就可以在繁天诸星中获得无尽的力量，以及数不清的人脉。\n\n这个通讯器后的神秘人物，橘子长却对此人一无所知。而这份无知所带来的，恐怕就是深深的猜测和“恐慌”：§r她§!究竟是怎么找到自己的存在？以及探测到这片从未有任何巨娘涉足过的孤星？\n\n越是恐惧，越应该对此发生好奇，仿佛伊甸园的果子一般。而这样的心理也促使着橘子长，在一次你休憩的时刻，端详起了这块和周围的一切格格不入的平板。\n\n橘子长拿起平板，入手是种特殊的磨砂金属质感，冰凉触感透过指尖传来。虽然这样的机械按压结构，相比如今早已成为古董店中的常客。但是吧，和直到如今都在用纸质书籍的自己相比，这样说会不会有种“五十步笑百步”的嫌疑呢？\n\n§rLOADING……█ 10%§!\n\n§rLOADING……███ 30%......§!\n\n§rLOADING……██████████ 100%§!\n\n你曾经操作这个平板的一切她都无比熟悉，而紫色的进度条也在一点一点的上涨……只是那个熟悉的紫发少女却并没有你想象中那般出现。取而代之的是……一片空白？黑屏？难道被自己玩坏了？就在橘子长疑惑的时候，却只是一眨眼的时间失去了自己的呼吸。"
  gts_ora.4101.a:"？！"

  gts_ora.4102.name:"误入神秘恶魔谷"
  gts_ora.4102.desc:"所幸时间并没有持续太久，而当橘子长睁开眼睛之后却看到：这里并非此前的熟悉宇宙，而是一片广阔到不可思议的封闭空间。自身正处在两片的延伸到视线尽头的粉色山脉之间，两侧的高山有节奏的舒缓的进行摇摆。沿着末端的粉色墙壁向上看去。洞窟的穹顶高到不可企及，以肉眼已经难望极限。仔细观察被山脉遮挡了视野的顶部，整个洞窟似乎都在进行有规律的收缩和扩张。连带着自己脚下的粉色大地一同进行运动。\n\n【扑通，扑通】\n\n沉闷的声音有节奏的充当着背景音乐不断敲击着自己的鼓膜，自己身下本就如同活物一般上下慢慢起伏的地面也随之轻微的震动。仔细感知之下，似乎还能听到液体奔流的声音。\n\n“感觉好像在生物的体内一样。”\n\n你很想这样说，但却总觉得这样的场景在哪里见过……最近帝国内发生的事情虽然很多，自己却都有所耳闻，那显然得知那个紫色的家伙……以及荧幕中这个令人毛骨悚然的恐怖景象和那个看上去很渺小却实则有天体一般的科学官。难道说环境的温度逐渐升高，带着一丝只有在巨娘下体处才能闻到的浓郁芬芳，却令人头晕恶心。橘子长将伞立在地面，强撑着勉强维持身形，却从没有边界的环境中感受到前所未有的绝望。而就在橘子长认为这样的惩罚下，是自己擅自玩弄那个未知平板的时候，耳边却传来了这样的声音：\n\n§r“当然在开玩笑啦~”§!"
  gts_ora.4102.a:"我就知道。"

  gts_ora.4103.name:"玩笑与记忆"
  gts_ora.4103.desc:"身体骤然回归，意识也因为清新空气的供给而逐渐变得明晰。熟悉的实木桌板，哪怕自己此刻只有对方一个指节的大小……而当那颗紫水晶一般，大小却犹如星体的尾巴掠过空中的一刹那，橘子长也终于明白了。\n\n在“橘子长”这个概念尚未诞生的那一刻起，这个名字就早已跟随着一场无端的梦，刻下了这个看似古老的平板中。\n\n2026年，3月。\n\n巨娘尚未在这颗孤星中临幸，而自己却也只是一个再普通不过的普通人。而就在这样最平凡不过的一天中，却不代表巨娘永远都不可能在这个世界中出现。\n\n那一刻，人们终于回想起了，被一只黑色的猫娘所支配的恐惧。\n\n绿幽幽的竖瞳凝视着这片无人所光顾的孤星，人们却对此并无在意，即使这样的猫猫会轻轻松松的就可以将整个星球如同毛线球一般造成毁灭，而原因只不过是她一时的新意。\n\n§r“你也看到了这个，对吧。”§!\n\n一个紫发的少女，却在不经意的时间点出现在自己身边，而她的模样，却有着一张不属于这个次元的脸。\n\n§r“想改变这些吗……那么……跟我走吧。”§!\n\n不知为什么，你却突然被紫发的少女拉着走，紧接着，在一通电梯后……你却看到了一处被爆改成电竞房的地下室内。\n\n“到了。”\n\n眼前的电脑中有着各种各样的内容，桌子上的平板上显示着各个少女的头像……却总感觉像是在哪里见过一样。而此刻，却只有一个黑色的猫猫亮起。而那个猫猫或许我曾经见过，或者说，刚刚就见过一次。\n\n正是对着这颗孤星虎视眈眈的家伙。\n\n§r“    对  od的内容造成了不小的破坏……导致现在已经没有人能够达到和她一个级别的力量了……我们这颗星球看似几十亿人……却在那些巨娘眼中连分子都算不上……”§!\n\n少女的言语中似乎近乎恳求，毕竟在这样的一个没有任何巨娘光顾的孤星下，这样的话语似乎和做梦没什么区别。但很可惜……或者说很巧，橘子长却正是这样一个“虚幻”的存在。"
  gts_ora.4103.a:"需要我做什么？"

  gts_ora.4104.name:"被按在键盘下的键帽"
  gts_ora.4104.desc:"自此，名为“橘子长”的存在加入了这个平板内。即使那个时候的自己并不是如今的这副模样。而那场梦的后续……却记不清，或许是被闹钟打断了后续吧。\n\n“所以……那时刻发生的那一切……都是真的？”\n\n纤细的双手将自己捏起，带到了电脑的键盘前，即使这每一个键帽对我而言，都如同广场上那大块的地砖一样。即使自己如今的大小，即使用尽全力，也按不下青轴触发的60克的阈值。\n\n§r“就连你的出现都是出现于某一个普通人的幻想……又有什么事情是假的呢？”§!\n\n手指轻轻触摸在键盘上，却因为视野盲区的原因，还是单纯少女心的玩弄，正好压在了自己所处的“ctrl”的位置上。轻柔的小指瞬间将整个人完全压住，随着轴体的段落感逐渐下降——\n\n“等等等等一下——”\n\n脸上还能感觉到少女手指产生的芳香，却在一点一点地剥夺这自己的呼吸，理智，以及可以自主思考的能力。当然，这其中也包括着反抗的想法，仿佛可以直接将身体化身为键帽中的一个装饰一般，可以心甘情愿的被少女的手指蹂躏……被碾在柔软的指腹下。\n\n“除去了大小以外……和普通人没有什么差异呢。不过，在这个神魔乱舞的各种设定的集合中……有几个人类也不错，不是吗？”\n\n随着压着自己的手指轻轻松开，带着恶魔的角的少女将自己再次捏了起来。只是这次并不是再次戏弄，而是将自己变回了原来的大小——确切说，是看上去原来的大小。\n\n“回去吧，在   还没有醒来前。”"
  gts_ora.4104.a:"（回去）"

  gts_ora.4105.name:"返程后的思索"
  gts_ora.4105.desc:"在回到帝国内后，橘子长却仍然在思考中。她思考的不是别的，而是压在自己身上的时候，千海所按下的按键：\n\nCtrl+S，她保存的那个，却是一套衣着华丽的和服。而穿着这身华装的，自己却记得很清楚。是一个当时爆火的流量明星，一个虚拟主播。\n\n难道说？来到那个地方之前，自己所看到过这个房间的外设。即使大小仍然只是一个键帽的高度，在孤星监狱内的情况也让自己早已习惯已这样的视角去看待这个世界。耳机，录音棚级别的麦克风。屏幕中的声卡驱动……以及那个引人注目的粉色live……难道说？"
  gts_ora.4105.a:"（鬼点子生成中……）\n可以执行特殊项目"

  gts_ora.4106.name:"收礼岁言"
  gts_ora.4106.desc:"制作好的衣装虽然推迟了几天，却也在帝国新年的时刻送到了千海家的大门。而在此之后的第二天，你收到了来自千海的留言：\n\n“不错不错，感谢感谢。”\n\n能得到这样的赞誉，橘子长放下了手中的画笔，随后将手中的平板立在了桌子上——在尚未拥有这副身躯之前，自己就一直靠着这份微薄的技艺谋生。只是如今，在幻想化作这副身躯之后，这样的能力却只比往日精湛不少。\n\n“还有，给还在帝国的那个小家伙也准备一份吧。”\n\n橘子长拿起平板，刚准备继续做些什么的时候，却突然看到live中出现了一个全新的身影——\n\n“出道通知？”\n\n当千海要出道的消息传遍整个帝国之后，大家都很惊讶，同时也在好奇这个宇宙级别的存在，这个在帝国内的那个科学官的本体究竟是何方神圣。"
  gts_ora.4106.a:"“看来她要成为这片宇宙的偶像了。”\n可以执行特殊项目"

  gts_ora.4107.name:"首播开始"
  gts_ora.4107.desc:"“咳咳。”\n\n一声清脆的咳嗽，划破了原本星海间的寂静。即使打破了宇宙间的物理法则都无人会去怀疑，紫发的少女坐在电竞椅上，似乎指边就能触及银河，又或者……在互联网的拉近下，这个“似乎”也许成为了多余的存在。\n\n“声音没问题呢……大家好哦，亲爱的……【缩小人】们？”\n\n一如她往日一般开玩笑的口吻，只是在如今的体型下，任何人都不敢怀疑这份玩笑的分量究竟如何。只不过……你似乎忘记了互联网的环境，又是如此的鱼龙混杂，且娱乐至上的氛围又有谁会觉得，她真的会在弹指之间毁灭掉一座星系呢？\n\n“好了……作为日理万机的宇宙之母……我们的千海阿...母亲，大家有什么想问的可以发sc哦~”\n\n我们的导播大人……在直播间并未露出真容的家伙似乎是被一只无形的大手按了下去。只是在这样的后缀下，评论区的大家一开始都很拘谨，只是在问一些比较日常的问题。例如……平时干什么……管理宇宙……现在是否单身……胖次什么颜色（？）这样的问题。 直到一个性压抑的家伙在sc中大喊了一声“妈”后，却再也不受控制一般的听取妈声一片……\n\n“大家不要给什么奇怪的后缀哦……不过礼物最高的星系可以接受千海的特~殊~对~待~哦~”\n\n屏幕内浮现出了星系的大致轮廓，千海仅仅只是将手指伸出，略微接近屏幕的程度，却早已将整个星系的光芒笼罩。星系在千海的指尖上，虽说还有个几万光年的距离，而大小却如同指尖上的玻璃珠一般，却比此易碎的多。\n\n而直播间的人们，却只是无脑的将自己的存款，转而到对这个星系内的投入中。或许大家都明白，作为虚拟主播的千海是完全有能力，甚至有可以将这个星系毁灭掉的动机。甚至都不需要找任何借口，毕竟这一切都是直播间的观众所进行的决议。然而投票数最高的那个星系的所有人……又有谁会在意这些的死活？或许……这就是互联网所能见到的景象吧。"
  gts_ora.4107.a:"（我也来跟一票）\n可以在恒星执行决议"

  gts_ora.4108.name:"娱乐至死的覆灭"
  gts_ora.4108.desc:"选票逐渐拉高，被选中票数最高的星系也在瑟瑟发抖中。\n\n或许人们无论如何都不可能相信这一天：没有战争，没有宣称。甚至没有什么敌对国家的敌对。甚至关闭边境都变成了无用之举。因为如今整个星系，包括星系内的一切殖民地，行星，甚至这些全部加起来，此刻都不及千海的一根指头。\n\n随着直播的继续进行，对这个星系的讨伐也成为了开始：随着距离的逐渐逼近，所经过的途径划过了周边几千万光年外的星云。行星只是刚刚到了手指的引力范围，就被无情的力量撕个粉碎。人们开始恐慌，大家却已经看到已经有陆陆续续的移民船开始从星球内迁出，可是随着指尖逐渐逼近，人们却看到了更深的绝望：\n\n即使有超光速跃迁引擎，却也只能勉强越过少女半个指纹的距离。然而更加绝望的是，刚刚驶出星球的殖民船，却突然感到有一股无形的引力，令引擎瞬间失效，就连星球的磁场都开始发生改变——\n\n毁灭，在此刻已然迫近。\n\n千海关闭了直播间，去洗手间洗了洗手，不多时，将一片气态微尘小心的放进了一处生态球内。很显然，直播间所看到的星系毁灭只是个障眼法。真正的星系早已被千海小心封存。毕竟……自己也不是什么恶魔不是吗？不对，自己好像真是恶魔……\n\n小人们所提供的打赏虽然在巨娘的眼中，算是微乎其微。但在多个宇宙中进行同平台直播所带来的收益仍然超出了千海的想象。或许……就这个打赏程度，哪怕把现有工作辞掉也能有一个不错的生活……不过直播的同时也和玩乐没什么区别。所以……\n千海打开了通讯器,向你发送了一条通讯:\n"如果有机会的话,找时间再播一次吧""
  gts_ora.4108.a:"那我到时候必须打call！"

  gts_ora.4201.name:"令人熟悉的花海。"
  gts_ora.4201.desc:"我曾梦见过这样的一个画面\n\n满屏幕的花海，似乎没有边界一般，淡蓝色的小花带着清香，却似乎要将自己永远留在这里一样。没有风，空气也略微有点潮湿，宛如少女的蜜穴一般，却无想象中那种刺鼻的气味，取而代之的只有花朵诞生的芬芳。\n\n就好比有人将你刻意关在里面一样，却不是囚禁，而是保护着你，不让你去接触那是非祸福的门扉一般。\n\n“既然你不来……咱可是要找你咯~”\n\n我，橘子长，现在只不过是写了几篇文章的小人罢了。而我自认为最得意的两部作品，如今也不属于自己了。有那么一瞬间，我认为我已经没有努力下去的意义了，毕竟，现在的我，不说能不能拿得动笔，键盘也敲不下来了吧。可就在我这么想的时候，却发现……\n\n“一、二、三、三点五……五、六？”\n\n怎么会有七本书？刚刚将书从书架上推下来时好像不小心多了一本。算了，既然都推下来了，不看就有点太对不起作者了吧。我吃力地翻开书，这本书的封面还挺重，似乎被精心包装过吧。\n\n“几朵纤细的雪花自天空中坠落而下，像是云朵般轻盈的乳白色冰晶轻轻地撞在了我的身体上面，流下了几滴清澈的雪水。这即使是在过去也相当少见的“阳光雪”已经覆盖了大半片城区，一片片雪花反射着阳光的光辉，映照着远处已经跑远了的、在街角处向我挥着手的希。\n\n“哈啊……”\n\n“明天、就快要到春天了吧？”\n\n悄声地自语着的我不再犹豫，伸出了双臂奔向了远处的那团湛蓝。”\n\n6.5w字，看了确实有那么一会了，以至于听到门开的声音都不禁有一点恍惚。诶？门是不是开了！完了，此刻的自己，在这巨娘所处的图书馆中，宛如在厨房里偷米的老鼠，即将要被来到此处的厨师发现一般。毕竟，要是让图书管理员看到这里的情况的话……看着撒落一地的书本，这被看到已经不是哈气那么简单了。\n\n我立刻吃力地将封面翻了下来，躲在了书页里。“看不见我看不见我……”我紧张地祈祷着，听着逐渐逼近加快的脚步声，此刻，空气仿佛要凝固一样，每一次呼吸都十分小心。而过了不知许久，似乎脚步声也逐渐停止，逐渐加速的心跳也在此刻开始缓速，却诞生了自己是否安全的错觉。我蹑手捏脚的挤出去，正想看一眼外面的情况时，却突然一愣——\n\n只见书页夹成的缝隙中，多出了一对蓝宝石一般的瞳孔。\n\n“可算找到你了，小~橘~子~长~”"
  gts_ora.4201.a:"“！！！”"

  gts_ora.4202.name:""
  gts_ora.4202.desc:"蓝色的长发，戴着一个紫色小花的发卡，白色的水手服和水蓝色的短裙不失一个少女应该有的活泼感。而相对应地，披在身上的浅棕色大衣却在给予了少女适当成熟的同时，还不显得古板和老气。不知为何，眼前浮现出了这样的一个女孩子。\n\n顿时，梦醒，我看了一眼桌台，墨水瓶差点被打翻。我看了一眼手中的书，还好，口水没有沾在上面。而沉思许久的我看了一眼书的扉页，顿时，心中许多谜团都得到了答案：\n\n《在希望和黎明之前》而署名则是——花田柳叶。\n\n我很难想象我到底是何等的运气，才能在旧城区的图书馆里翻到了这本已经是2025年的书籍。而当时…这本书好像得过奖来着…想到这里，自己翻了翻自己的书架，却找到了另外一本书。\n\n这本书并没有出版社，也没有署名和发表时间，甚至连一个像样的封面都没有。只有一块瓦楞纸板包裹着，上面用记号笔潦草的写下了一行，应该是标题吧：《众星尽头的救赎》。\n\n自己当时…是什么心态写下的这本呢？如今我已经无从得知。而就在这时平板则响起一则消息：\n\n“天体级科学官 小花田，将在15天后，于星系“群星”进行文化考察工作…”\n\n我看了一眼平板，却对领袖的模样和名字感到万分惊讶——\n\n现在的她……已经变成了帝国内的天体级科学官了吗？"
  gts_ora.4202.a:"总之，先聊聊吧。\n(可以执行特殊项目)"

  gts_ora.4203.name:""
  gts_ora.4203.desc:"通讯接通后，我的思绪如同一团乱麻。因为我身体带给我的反应来看，橘子长，或者说，是创造出橘子长的那个人……对延期的这个天体级科学官有着很复杂的情绪。有崇拜、甚至到了以对方为目标的地步，但又因为这个目标太过遥远，却让这份因自己无能的情绪，逐渐扭曲为“恐慌”：仿佛自身正是一个货真价实的小人，无论怎么抬头看，都看不到对方那绵延至云端的白丝之上到底是什么存在。\n\n“大~家~好~呐~”\n\n恍惚间，眼前的景象再次发生变化，在我记忆中那湛蓝的天空，略微带点刺眼的阳光，此刻却消失不见，取而代之的是另外的一种光线，没那么刺眼，却没有那种温暖的感觉。周围的蓝色天空却呈现出了一丝接近于白色的浅蓝。而更让人意外的是，似乎天空与城市之间，有着一道看不见的帷幕将整个城市罩在其中，或许这就是为什么会产生压抑感了吧。“这……这不对吧……”看了一眼周围的人群，像是有着什么共同目的一样，都在往一个方向走去。不会……是自己还没有出来，这里还是监狱？而就在我思考的时候，却听到，天空中貌似出现了一声巨响，像是雷声，但又没那么沉闷，如果排除掉距离和振幅带来的影响的话，反倒像是……少女轻轻的咳嗽？\n\n“咳咳——”\n\n一时间，人们开始惊慌起来，似乎都在为刚刚那个响彻整个上空的声音吓得全身发颤。而这个时候，我也意识到了一件事情，这……这里仍然是监狱……确切的说，仍然是“她”所模拟出来的，为自己而设下的监牢。而结合到之前的“主人”以及花田的粉丝见面会，那么这个少女的身份，想必只有一个了吧。\n\n“咱很欢迎小人们来这里捧场的呢……让我看看……”\n\n那熟悉的蓝色长发垂落在远处，少女如欧泊般的眼眸在这个高度下，似乎自己的一举一动都在她的注视之下。一时间，双手双脚像是被捆住一样，动作也开始僵硬起来。而在场的小人们，或许是从来没见过这种场景一样，有的吓得瘫软在地，仔细一看，似乎裤腿间还有些湿润。有的被吓得面色惨白，只会躲在楼层下，仿佛刚刚降生一般地懵懂。而也有些胆子大涩心也大的，反倒往花田那悬空在城市上空的白皙如玉的食指下，在不停地趴下然后站起来……在角落里的一个家伙甚至当着花田的方向解开了裤腰带，对着远处那宛如神明般的少女跪了下去，难道他要……\n\n“轰——”只是一个愣神的工夫，下一秒，花田的手指落在自己身旁，那近百米来高的大楼在少女纤细的食指下竟如此脆弱不堪，当然我在意的并不是这个，而是刚刚那想要图谋不轨的小人，此时此刻却只能在少女的指甲缝中，伴随着一堆建筑废墟中结束了自己的罪孽了吧。我顿时吓得后背都有点发凉。而做完这一切后，可以明显的看得出来，刚刚还在那趴下站起来的小人全都被吓得魂都差点飞了，就差跪地求饶了，不过这些小人也没做错些什么就是了。\n\n“只是戳了一下……小人们就已经这么害怕啦。”"
  gts_ora.4203.a:"“害怕”"

  gts_ora.4204.name:""
  gts_ora.4204.desc:"随着手指抬起，刚刚那一大片楼房几乎全都化为了废墟，而刚刚那个小人的身影也是彻底消失在了这里。此时此刻，我很想和花田说些什么，只是……这样的情况下，自己这样的大小下，再怎么说自己也有点数：恐怕自己这个样子站出来，说什么对方都不会在意吧。而且，在她的粉丝见面会上说这个，怎么看都不合适，还是等一切结束之后再说吧。少女的眼神中看不出什么表情，似乎看不出她对刚刚那个小人的下头行为有什么不满，只是，我怎么隐隐约约中，感觉到她好像是……瞟了自己一眼呢？\n\n“嗯嗯……小人们不要紧张哦，咱们既然来了，想必都是进来玩的……那么……”\n\n“接下来，就是咱给粉丝们的‘福利’哦。”\n\n沙沙……沙沙……宛如白沙滩上的风滚草，十分遥远，却也如此贴近。在这惺忪中睁开眼，少女手中的棉球棒，在城市的高楼上摩挲着，蓝宝石般的眼眸微微眯起，就像是看着里面精心收养的小虫子般。时不时，棉球棒轻轻地接触到了几个幸运观众身上，虽然不会受伤，却也像是陷进了云朵中一般，顿时，整个身体被少女手中的小玩意儿当场俘获，而当那甜腻腻的感觉离开身体后，还停留到刚刚的那种放弃挣扎的感觉。有种恋恋不舍般地四处望去，直到抬头看到少女的脸才对刚刚所做的事情羞愧的无地自容。不过……就现在为止，这个大小下，还是暂且放过这种所谓的羞耻心，来全身心地接受这份来之不易的“奖励”吧。\n\n“小家伙们很听话嘛，没有辜负了咱从世界的各个地方捡到的呢，那么现在躺好——”\n\n“啪嗒。”清脆的声响伴随着地底的轻微颤动，再次抬头时，天空中的少女早已和自己之间，隔了一块绵延无际的亚克力板，顿时，整个城市的高度瞬间被压缩，将里面的所有小人限制在了那几百米的高度。透明的平板虽看不出什么端倪，但仍然能感觉到空气被压缩的压迫感。少女那如碧海蓝天般的长发垂落在城市上空，却又在一定的高度，被透明的亚克力板接住，可望而不可及。只是……细心的你还是发现了，少女那白皙的脸颊正在一点一点地靠近，出于本能反应，你的双腿顿时软了下来，只能就这么躺在了地面上，看着这个少女接下来的动作——\n\n“哈啊——”"
  gts_ora.4204.a:""

  gts_ora.4205.name:""
  gts_ora.4205.desc:"原本透明的上空，却凭空生成了一团云雾，只是仍然能够从模糊的前后，看到花田张开的口腔，这个时候，哪怕只凭想象，都能想象出那种氤氲着少女气息的芬芳。“如果……如果没有这块板子的话……是不是就直接和花田老师零距离接触了吧。”我这么想着，可是，这种危险的想法也只能这么想想，毕竟现在自己的大小，也只能承受这样的保护下一享眼福了。\n\n不过多时，城市的上空早已蒙上了一片阴霾，而在这层阴霾之上，无人知道这位凌驾于整个城市之上的蓝发少女要对咱们做些什么。而很快，也只是人们遐想的时间里。“扑通！咚，咚……”如雾霾一般的天空突来传来一声声沉闷的声响。像是食指的指节轻轻地敲着桌面。我百思不得其解地抬头，却被接下来的场景震慑到说不出话来。一只粉色的，看不出是什么东西的巨兽，此时竟伏在整个城市上空，宛如鲸鱼搁浅一般，但看上去却随心所欲的多，而这样的巨大生物，在这起了雾气的亚克力板上划过一道水痕，却凭空飞了起来，最后回到了……回到了少女张开的口中。原来是舌头啊，意识到这一点的自己刚放下了紧张的心绪，而下一刻，少女再次伸出舌头，在众人向上仰视的目光中，轻轻地在这城市上空掠过，舌尖于平面接触，隔着一层亚克力板，却仍然能想象到那粘腻的感觉舔舐到自己身上的感觉。一时间，总感觉全身麻麻的，像是被巨大的史莱姆压在身上不断蠕动一样。而在这种粘腻的感觉结束后，少女拿走了平板，失去了这唯一的遮拦，这意味着……"
  gts_ora.4205.a:"（要被吃掉了吗……）"

  gts_ora.4206.name:""
  gts_ora.4206.desc:"哪怕花田没有指明，小人们都知道，少女手指所指向的嘴巴正是接下来要去的地方。只是……刚刚在整个城市上空不断巡视着的巨大舌尖，这样的大小，不要说被吞到胃里，就是在口腔中，自己的大小能否被对方感受得到都成为了未知数。一时间，人们开始犹豫了起来。害怕这个明知道有生命危险却还是想要往前走的想法。“那个……我？”我颤颤巍巍地走到最中间的广场，感觉双腿都在不断打颤，呼吸也在这种紧张感而变得急促起来。而少女听到这不仔细听甚至都听不到的声音后，微微眯起的眼神中似乎带着一丝微笑，看来……她或许是对自己向前的做法表示满意吧。\n\n“小家伙很勇敢呢，那么……自己爬上来吧~”\n\n轻轻伸过来的指尖，在整个城市中央。虽然少女十分小心，可就是手指所带动的气流却还是让一些建筑物没能幸免于难。不过还好，在手指伸出来的时候，周围的小人早已四散逃开，和少女的手指保持了一定的距离，看着我一个人站在广场中，一点一点地爬上这堪称为通往天堂的阶梯。我手脚并用，爬到了指甲盖上，趴在了对方的指尖上，等待着手指一点一点地向上抬升。扑面而来的气流压在我的身上，将自己挤在空气和手指中间。我费力地抬起头，却被风吹得什么都看不清。直到自己被丢在了一个我也不知道是什么的东西上，我才迷迷糊糊地爬起来，却感觉手和脚的触感有一些不对，有一种说不出来的粘腻感，仔细将手伸到嘴里一吮……“巧克力？”在尝到是什么东西的我后之后觉地抬起头，看到的却是花田已经张开的嘴巴。扑面而来的热气使我不得不趴在这一块巧克力上，我承认，我现在有点后悔自己刚刚的选择了，但是更不可否认的是，我现在感觉到的，除了心跳剧烈加速外，更多的是一种……像是被她完全支配的感觉，那种明知自己怎么挣扎都没有什么作用却还是忍不住想继续挣扎的感觉。“emmmmm，感觉被花田老师吃掉……也挺爽的不是吗？”察觉到这种想法的我脸突然一红，索性将脸埋了起来，要是让她知道咱有这种很奇奇怪怪的想法的话……\n\n“哈啊————”\n\n还沉浸在那被吃掉的幻想中，浑然不知巧克力正因为呼出的热气和身体的温度开始一点点地化开，而当我意识到不对后却为时已晚，整个人都被陷进了这甜蜜的监牢中。而看着花田捂着嘴偷笑的表情才发现，原来自己的想法，她都知道吗……“好了，这个小家伙先在这里待一会哦，要是被咱发现你跑出来的话……”虽然没有说明会发生什么，但是这种未知的后果才更加让人不敢尝试，不过……我显然不认同这一点，既然被困住了，不想方设法跑出去那还能是自己吗？而且……自己是真的不喜欢这种全身像琥珀一样被封住的感觉。那既然如此，就只能……就只能舔了。"
  gts_ora.4206.a:"（尝试逃跑ing）"

  gts_ora.4207.name:""
  gts_ora.4207.desc:"“一个没注意，竟然让咱最‘特殊对待’的小人跑掉了呢……”\n\n或许自己的动作太过明显，还是如今如此渺小的我都没能躲过花田的视线，看着对方一点点向自己逼近，在桌角处的我立刻挣脱开巧克力的束缚，我抬头看着桌子的边缘，正好到了花田那海蓝的裙摆处，那白皙的双腿此时虽然只能看到绝对领域的位置，可就这高度，却已经是自己高不可攀的程度了。而顺着裙摆向上看，白色衬衣勾勒着自己无法理解的弧线，而在这上面，花田那冒着蓝光的瞳孔中，似乎……如果自己不跑的话，想必此时的自己太小以至于没有让她看出自己是谁吧。就在我看着周围一望无际没有一丝躲藏点的桌面不知如何是好时——\n\n“你说人生能不能放过我这一次~”\n\n大运？为什么这里会突然出现一辆大运，但是无论如何——跑吧。我飞身上车，没有想那么多，只是一脚地板油，随后只听到“轰”的一声，那巨大的手指宛如两根擎天巨柱一般，在后面引发了剧烈的震动。不行！这样下去，就算这是大运，可在花田这几乎碾压的大小下，恐怕自己也只有当成虫子被碾碎的命……“往城市开！”看到不远处的城市，我心一横，猛打方向盘。“那对不起了，有什么事跟花田说去吧！”\n\n“轰！”\n\n就算是在国道上把人当减速带的大运，在这堪比定海神针的食指面前也只能乖乖截停。而伴随着一阵剧烈的失重感后，看到的却是花田老师那微微扬起的嘴角，以及那蓝色欧泊一般的眼眸。“完了，要开罐即食啦！”我闭上眼睛，能听到对方将后面货箱捏扁的动静，以及车门被突然掀开所吹过来的气流，都已经在表明了自己的结局。只是就在我闭上眼，认为一切都要完蛋的时候——\n\n“橘子长？橘子——长——”\n\n意识突然回到清醒中，我睁开眼，却发现小花田已经来到了城市中，并且不知为何，自己已经顺着游离的意识，宛如逃命一般逃到了街区里。\n\n“是昨晚上没睡好吗……咱刚刚看到橘子长直接……都开始梦游了……”"
  gts_ora.4207.a:"没…没什么。"

  gts_ora.4208.name:""
  gts_ora.4208.desc:"“那就好……这是给你的伴手礼…好像这个星球的习俗是这样的，如果我还记得的话。”\n\n花田手中，出现了一份包装精美的小人城市模型。似乎是用整个城市一比一缩小的，可以让一些体型不大的巨娘过一把破坏城市的瘾。“那个……那已经是很久以前了……而且这颗星球的原住民…都不知道飞到哪里去了。”\n\n橘子长还能记得那一天所诞生的景象，在自己离开这颗孤星的十几年后，这颗无人在意的孤星却还是没能逃过巨娘的视界。然而，即使是再普通不过的高大巨娘，这颗星球的存在却如分子生物一般渺小……甚至连反抗的余地都做不到……\n\n橘子长还记得，就在公元历2049年，这颗上面插了半根吸管的星球，做出了最后且最悲壮的决定："
  gts_ora.4208.a:"“火种”"

  gts_ora.4209.name:""
  gts_ora.4209.desc:"“火种计划”，将这颗星球所有还留存希望的人类聚集起来，作为“火种”，以这根巨娘留下的吸管作为发射架，将人类的希望发射至几千万光年后的世界。然而，能选择成为“火种”的小人有限，船体的容量也难以让所有的人类逃离这个早已成为巨娘玩具的星球。\n\n而剩下的人……则要和这个星球一起，伴随着这个孤星的最后一颗钴弹，从这个世界抹除。\n\n“其实吧……可能大家都认为，能成为“火种”是很幸运的存在，只是……完全知道真相的人从不会这么想……因为这压根不是存活，而是延续——因为这个星球直到毁灭都做不到长时间的星际航行，所以那些“火种”只能焚尽此身，所剩的只有所谓的一个数据——一小段象征着执念所在的DNA片段，只为了能在未来的某一天……能凭借着自身的执念化作信仰中的模样……”\n\n我平静的说完这些，仿佛这些事情都是自己亲身经历过一般，虽然……自己早在此之前就离开过这个星球，但是在听到如此悲壮的消息后，自身还是没能平静下去。然而小花田在听到这样的讯息后，眼角却是噙满了泪水。似乎……感同身受。\n\n“要是……要是咱们能早点发现你们这颗星球就好了……”小花田的声音几乎哽咽。“虽然……我们的星球就算加在一起都不能说明什么……但至少，我们无论如何都不会让你们做出这么绝望的决定……”\n\n没错，小花田的故土也曾遭受过巨娘的袭击，并且连反抗的能力都不存在。孤注一掷的选择总有些共同的呐喊，但是如今，在自己已经站在这个星球之上，这个早已沦为“孤星监狱”的星球中时……也早已对这些释然。"
  gts_ora.4209.a:"“你知道……橘子花的花语吗？”"

  gts_ora.4210.name:"“橘子花的花语”"
  gts_ora.4210.desc:"“诶？”\n\n在听到这样的话语后，小花田显然楞了一秒。很显然，说起橘子……人们只在乎其果实，还从未有什么人真正在乎过在结出果实之前，那朵白粉色的小花究竟会做些什么。\n\n“我或许……就是这样的存在吧，平平无奇，破绽百出。”橘子长闭上眼，却看到了那虚拟的牢笼内，一个少女在一处角落用一只断掉的笔头写着什么。对啊，或许这样的人，这样什么都做不到的一个存在，就算将生命付之一炬，都走不出巨娘手指从这头划到这头的距离……\n\n“就算自己所做的任何事情，在最后结出‘果实’之前都不会被任何人看见……”"
  gts_ora.4210.a:"那就想办法，将信仰去交给“时间”吧。"

  gts_ora.4211.name:"文物考察"
  gts_ora.4211.desc:"此后的文化考察工作……也算是比较顺利。毕竟同为天体级……小花田对待星球内小人的态度也是比较温柔的。\n\n“妈妈，妈妈！那个蓝色的大姐姐让咱们往她的那个地方钻了……就是裙子底下的那个地方！”\n“还有那里！还让咱们在她的胸部上跳来跳去了！和蹦床一样！橘子长从来都没让咱们做过这些……”\n\n虽然计划十分轰轰烈烈，但那颗未引爆的钴弹终究还是让小花田排除了隐患。“看来……就连孤注一掷的选择都没有啊……”小花田的脸上虽然惋惜，但还是对橘子长的身体表示好奇，毕竟……\n\n“这根吸管的最下面……竟然插着这颗钴弹的附近……难怪辐射量已经趋近为0了……难道说？”\n\n难怪能在星球里尝到一点点奇怪的味道……而花田将那颗象征着人类最后希望的钴弹搬走之后，却看到下面压着的，一辆老旧的集装箱内，装着一封……信？\n\n纸质的信封，即使深埋地底，却仍然因风化而导致的破破烂烂。而这封信的内容……却埋下了一刻颗很惊人的种子：\n\n“致：后来能看到这封信的人们：\n\n我们曾一度抗拒这些我们认为的现实不存在的东西……但如果还有一次机会的话……我们仍会相信，那个天外诞生的橘色巨娘，是指引这颗星球命运的长灯……”"
  gts_ora.4211.a:"（把小人城市放在这里）"

  gts_ora.4301.name:"众星尽头的救赎"
  gts_ora.4301.desc:"你曾经做过这样的一个梦：\n\n“那么，这个小人就交给你了。”\n\n“嗯嗯。”而在对讲机的另一边，一个白色短发的少女看了看窗外，将眼镜摘了下来放在了桌子上。随后看了一眼桌子上的信纸，而信纸的下面，垫了一本书，正是她所写的《掌握“色彩”的少女》。\n\n“橘子长……吗？到时候可要好好‘品尝’一下呢。”\n\n你入狱了。此刻却被一个看上去十分友善的家伙抓住。原因很简单：此刻的自己，在越狱。却没想到，身体此时变得如此渺小的自己……在被如此庞大的巨娘发现后会有多么的无力。\n\n“哈？小东西竟然睡着了，是姐姐看上去不吓人吗？”\n\n“嗯？”\n\n迷迷糊糊地爬起来，加上身体隐隐传来的疼痛和挤压。这么长时间的高强度被各种玩弄，显然让我这个小人的身体来到了极限。我揉了揉眼，看着那镜片后的那双粉色眼眸。一时间竟感觉不出究竟是自己睡断片了，还是自己被眼下这只捏着自己的大手“物理”意义上的哄睡着了。\n\n“姐姐这么可爱……哪里会有吓人的说……”我一时不知是脑子反抽，还是实话实说，就当是实话实说吧。毕竟人在足够害怕的时候，哪怕撒谎都显得如此自然且张嘴就来。但是就论结果来看，这句话的作用似乎有些明显。\n\n“能说出这种话的……除了你以外，就只剩下那个蓝色的小家伙了呢。”\n\n主动权不在自己身上，眼下只能先拿语言周旋一下然后就……跑！趁着对方一个愣神取下眼镜的空档，我立刻向手掌外逃跑去，而下一秒，“砰！”自己像是遇到玻璃门的猫猫一样，被空气撞倒在地——并不是空气，而是鸟音刚刚取下的眼镜。“好痛！”我揉了揉脑袋，却看到对方的笑意却又多了几分。是啊，不会挣扎的小人是不会有意思的啊，而橘子长，却是无论机会有多么渺茫，也要赌上一切的小人啊。然而，即使如此，自己的努力只不过是在给对方平添几分情绪价值，让我想起了餐盘上那条还在呼吸的小龙虾，在即将被食客吃掉前，还要尽自己最后的力气，用自己的螯钳在餐盘上比一个小小的心。"
  gts_ora.4301.a:"“想喊救命……”"

  gts_ora.4302.name:"众星尽头的救赎"
  gts_ora.4302.desc:"随着镜片拿了起来，宛如高空中的玻璃栈道，一时间，腿却突然瘫软了下来。我闭上眼睛，努力不让自己去看下面。而看到自己浑身颤抖的样子，少女却故意将镜片朝一侧倾斜，重心突如其来的变化使得自己不得不睁开了眼睛，拼命地扒着镜片，拼命地向上爬着。因为我看到了，在这透明的镜片下，少女张开的嘴巴显得格外显眼。\n\n“哈——”\n\n热气从少女口中哈出，在垂直的镜面上泛起了一层白雾，似乎是在为镜片另一端的我，遮挡了少女那张开的深渊巨口。而我双手抓着镜片的一边，不知不觉间，却感觉自己如那待宰的羔羊般。假如自己的动作再慢一点，那结局不是被摔扁，就是落到她那足以装下几千个自己的口中了吧。\n\n“让姐姐看看……小橘子长的求生欲望有多么旺盛呢。”\n\n手指停在自己脚下，似乎是让自己爬上去。于是我松开双手，趴在对方的手指上，不知道要对自己做什么。而接下来，自己却被放在了地板上，随后……却看到的，只是她那双白运动鞋。这个大小下，凑近过去，甚至鞋底的高度都超过了自己头顶。“尝试爬上来吧。在咱还没有想踩下去的想法前。”轻柔的话语带来的却是令自己头皮发麻，算了，别耽搁了，我尝试爬上去，而这个高度……自己的大小甚至还爬不到对方的鞋面上。自己花了不少时间，结果却只能在对方的鞋底上打滑，爬上去，滑下来。而对方似乎也是换了一丝想法，下一秒，自己怎么也爬不上去的鞋子却突然抬了起来，将好不容易抱在鞋底上的我掀飞了好几米，随后摔倒在地面上。但是，并没有给自己机会，下一秒，那和小山坡大小一般的白色运动鞋如今就压在了自己的身上。\n\n嘶……自己没有被踩扁，这算大难不死了吧。看着压在自己身上的白色运动鞋，距离将自己的身体完全成为番茄酱就差了那么一点点。而这也能够看出来，鸟音并不想直接踩扁自己，而这也就意味着，她还有更多的玩法，而这正是我不想看到的。\n\n果然，那压得自己快要窒息的白色运动鞋还是抬了起来，只见鸟音蹲下来，看着躺在地板上，和地板上那鞋印融为一体的奄奄一息的我，不由得笑出了声。而看着对方蹲下来俯视着自己的样子，我看着周围一眼望不到头的鞋印子，很难想象，刚刚的那一脚对方要是真踩下去了……正发楞呢，而接下来，突如其来的水球却将自己整个人都差点淹没。“咕噜噜噜——”怎么回事，哪里来的水？不对，这个水怎么是温的？难道说……我不敢相信，但是自己却像是被丢到胶水里一样，难以挣脱。而当自己终于摆脱掉向上抬头看的时候，却发现——\n\n鸟音的嘴巴微微张开，伸出的舌尖下，唾液随着一道长长的拉丝向下坠落，不偏不倚砸到了自己身上。而就是这简简单单的一滴，却能让自己花了将近十分钟才勉强挣脱开。“看你身上脏脏的，现在洗干净咯。”看到那突然砸到自己身上的水球，竟是少女口中的佳酿时，一时间，我却是感觉内心有什么东西彻底碎掉了。"
  gts_ora.4302.a:"“好……好黏……”"

  gts_ora.4303.name:"梦醒，寒岭之行"
  gts_ora.4303.desc:"突然一个寒颤，却将自己带离了那段记忆中的监狱，而睁开眼，此刻已然来到了此地，名为极寒之地的存在——\n\n好冷……即使自己此时的大小已经接近四五千米，树木和山峦构成的地毯，甚至都无法触及到自己鞋底的高度。只是有句老话说道：“高处不胜寒”，风雪夹杂着低温还是让自己不由得裹紧衣服。\n\n“外勤任务……协助领袖：鸟音山水 对寒岭的某星球的气候复苏工作。”\n\n按理来说，鸟音大概三个小时前就来到这里了。只是面前的大雪，即使此刻的自己已经不再是一个小人，能见度却仍不及几千米。不过有一点可以确认……是我来早了。"
  gts_ora.4303.a:"既然如此，再等一会吧。\n(可以执行特殊项目)"

  gts_ora.4304.name:"冻北女同"
  gts_ora.4304.desc:"“久等了啊——”\n\n已经不知道等了多久，再次醒来后，却发现鸟音正提着一壶热水蹲在自己面前，而自己的大小……却已经和正常人类的大小无异，却在她的脚下如同虫子一般。\n\n这是怎么一回事呢？我不是很清楚，只是在等待的过程中，遇到了一座城市，似乎……和曾经所在的风格有点像，一如之前的21世纪的城市建筑群。只是……为什么公告上写着不让舔栏杆？难道这里是？\n\n“听说冻北的铁栏杆是甜的……啊我的舌头——”\n\n天体级的行政官却被一个小小的铁栏杆硬控在原地，这一点是自己没想到的，但是事实就是如此，却限制了自己行动的同时，铁栏杆就如同镶嵌在原地，和舌头见肉生根一般，哪怕变幻体型都无济于事。似乎…….事情就是这个样子的。\n\n“这里的铁栏杆是不可以舔的……以前还有巨娘用这个来抓好奇的外地小人来着……那么橘子长做好‘入乡随俗’的准备了吗……”\n\n“等等等等一下！”\n\n柔软的手指压在没有单薄衣物遮蔽的身体上，温热的感觉却带着一丝窒息感，在如此严寒的环境中，这一丝温度却在手指接触的瞬间，将人的软弱放大，让人很难使得上力气。而看着鸟音脸上的表情，似乎她就是欣赏着小人在她指尖挣扎的样子吗，我不知道，我只知道我无论如何都挣脱不开。这种情况下，想要尝试挣脱开的话，或许只有一种办法了，那就是——\n\n“小橘子长在搞什么啊，这么痒可不会让咱把手指松开哦。”我索性转变想法，开始用双手双腿在不停地挠着对方的手指。而就在对方感觉到痒痒的同时，身体却在一点一点地往外面蹭。“那个……只是给姐姐的手指按摩而已，姐姐喜欢的话，不妨闭上眼睛享受一下捏。放心，我是绝对不会逃跑的。”\n\n“可以啊。”见鸟音闭上了眼，我立刻加快了进度，而当我终于从对方的手指下挣脱出来的瞬间，却被对方一把捏住。不会吧，不会对方说话不算数吧。\n\n“咱说话是算数的，咱会放过你的，不过小人说话也会算数的，对吧。”\n\n啊这……就多余说这一句。不过既然不会玩弄的话，待在一个巨娘身边到也不是什么很可怕的事情了。“啊这……我也没说我要跑啊，哈哈。”我苦笑了一下，今天估计要和她一起度过了。\n\n“开玩笑的，好了，这里的气候复苏工作还需要你的帮助呢，来吧”"
  gts_ora.4304.a:"（跟上鸟音山水）"
  gts_ora.4304.a.custom:"开启气候复苏工作\n§H（似乎橘子长的手账本有了新的变化）§!\n完成坏境改造后,或手动在该星系内非极地星球选择决议触发后续"

  gts_ora.4306.name:"澪度，终会在明天消融"
  gts_ora.4306.desc:"环境改造工作十分顺利，只不过由于寒岭特殊的气候环境，导致整颗星球早已成为了冰雪包围的世界。只不过……在两位天体级巨娘的帮助下。改变整个星球的环境倒也不是什么很困难的事情。\n\n行走在刚刚雨过天晴后的郊区，虽然气候已经回暖，但是常规的季节变化却仍然存在—— 这是星球为了人类生存而做出的妥协。而在这过程中，鸟音却向自己透露了这样的一个消息：\n\n“你说，这个世界上有没有，完全相同但就是不能相见的人？”\n\n少女向前走出一步，却早已得知，这是一个风口，是一个需要自己做出抉择的关键点。但是，她也十分清楚，与这样的存在接触，自身必然会牺牲掉什么，或许……只是让社团不再废社也好。\n\n“代价嘛……是\n\n声音散去，少女醒来。却看了一下周围，却只是校园的一处走廊罢了。\n\n“要做些……啥子？”\n\n少女往活动室走去，却从无意间往窗户上的一瞥，看到了自己如今的模样。\n\n浅紫色的长发已然褪色，化为了一片银白，却显得身上这半身修女服有些格格不入。是啊，此时此刻，这样的身份早已不再属于自己，于是少女摘下了帽子，来到医务室顺走了一件白大褂，随后找到了那个记忆中仍然清晰的教室。\n\n“你是……”\n\n屋内的少女早已认不清她的模样，但她不在意，即使几个月前的她们还是最为亲密的“家人”，但此刻，少女只是将这些藏于心底，只是用着尽可能让她们熟悉的声音说出：\n\n“我叫‘秦雯’（鸟音山水），但这个不重要……刚刚学生会的通知，你们社团已经被学校允许，可以一直开下去了哦~”\n\n听完鸟音的话后，我陷入了沉思，手中的笔却不知去向，而这时，只是想验证什么似的，身边突然哼唱起了往日的一段旋律——\n\n“大冻北是额滴家乡——”\n\n声音回响在遥远的北方，虽然记忆中砖瓦房的炊烟已不再升起，门口也不再挂着什么大玉米和大辣椒，也没有什么从热炕头醒来的酸菜和粉条……\n\n又有什么关系呢？"
  gts_ora.4306.a:"（跟唱）“醉了月亮暖了俺心肠——”"
  gts_ora.4306.a.custom:"$gts_ora_book_qinwen_detail_buff_tooltip$"

  gts_ora.4401.name:"造物主"
  gts_ora.4401.desc:"当女仆形态的舰娘从星球外飞过时，橘子长陷入了一丝恍惚。\n\n不知道为什么，眼前的猫猫女仆虽然她并不熟悉，却总觉得有点眼熟。她翻开手账本，想找到对方的联系方式。可翻了一会之后却又意识到了什么似的合上书。\n\n也对，这里面的联系方式，早就在二百年前就没法用了嘛，毕竟现在是什么时代……橘子长正想着，却看到天空中的猫娘却越来越大，仿佛即将超越远处的天体……不对，这是在向这个星球迫降——\n\n“咚——”\n\n身载各种武器的女仆猫猫在星球表面上砸出了重重的大坑。不过还好，这片旧城区的居民早已搬迁，因而没有造成什么人员伤亡。只是见此情景。“啥　猫”俩字已经先比脑子进一步的浮现于自己的嘴边，却出于礼仪并没有出口。只是当距离一接近，对方的模样却终于让橘子长认识到了，眼前的舰娘为什么会让自己如此熟悉——\n\n或许……这些事，和自己的“造物主”有关吧。橘子长合上书本，刚想看一下这只摔在旧城区的啥猫有没有受伤，而手指转动门把手的那一刻，眼前却浮现出了另一幅熟悉的景象。\n\n她很清楚，那是她还没来到这个世界前，作为“橘子长”这个名字诞生的那一天。"
  gts_ora.4401.a:"（翻开书页）"

  gts_ora.4402.name:"降生之日"
  gts_ora.4402.desc:"２０２６年　４月的第９个日出，那是这副模样诞生的时刻。\n\n而自己的造物主，一副屏幕微微泛起裂纹的二手平板，一直拼少少几块钱一支的触屏笔，最低的成本，也是最卑微的那段时间。直到平板中的那副三视图彻底完工之后，昏暗房间中，和日出一起在属于自己的世界多了一抹橘色。\n\n而这抹橘色带来的，是一只棕色的猫娘。\n\n“橘子看看。”\n\n刚刚下楼，想去便利店买瓶水，连着熬了四天，身体也有点难顶。手机中的消息虽然响起，但却没什么视野，只是敷衍的回了半句：“等我花两分钟过一下马路……”\n\n“注意安全喵，别变成橘子饼了……”\n\n……\n\n回到家后，摆在桌子上的蛋糕，刻意拉起的窗帘，虽然天边已经泛起了鱼肚白，却还是看不清周围的环境。我刚想打开灯，却突然失去了意识，像是被人用麻袋套住带走了一样……\n\n“生日快乐喵！”\n\n手机的消息是请帖，桌子上的蛋糕是奖励，头上的小帽子我暂时没搞懂是什么用意。但总之，虽然小小的房间内只有两个人，但此刻却是我诞生以来都难以忘记的降生。\n\n刚刚结束学业的自己却恰逢失业，手中这副平板和笔就成了自己勉强维生的手段，只是一切只是刚刚起步，能买账的人也少的可怜……我接受，也理解。毕竟活在这个世界上所需的不只是信仰那么简单……确信。\n\n直到希瞳的出现，让那段最痛苦的时间得以接济。\n\n话说……之后的事情怎么样了？我似乎忘记了，只记得眼前这个女仆猫猫应该是双月，而她的造物主……就是那个戴着猫猫耳却是人类之身的存在……则是凭借着双月希瞳的名字，比自己早几年出道：\n\n【双月希瞳喵喵……超超超可爱的女仆猫猫是也……因为稍微有一点懒所以一直还没正式出道喵……不过还是在慢慢准备中的未来Ｖｔｕｂｅｒ！】\n\n或许……这也是自己的造物主也想做虚拟主播的原因吧……而自己甚至都不知道自己的造物主到底是什么样的……\n\n对了，事已至此，问一下吧。"
  gts_ora.4402.a:"（出门）"

  gts_ora.4403.name:"梦界核"
  gts_ora.4403.desc:"摔在旧城区的猫猫并没受什么伤。毕竟作为帝国出身的正规舰娘，估计星球碎掉了猫猫都不可能会碎吧……只是作为舰娘的猫猫刚醒来，见到橘子长后，却突然两个瞬移带一个闪现来到橘子长面前，随后——\n\n只感觉到一股上升气流的诞生，却让整个星球都不禁屏住了呼吸。毕竟……作为别处而来的巨娘，竟然当众掀开一星球总督的裙子……只是不知为什么，橘子长只是一愣，随后则僵在原地，似乎表现出一副比较顺从的样子。\n\n“喵喵喵？”\n\n女仆形态的猫猫掀开裙子之后，仿佛更加确认了橘子长的存在，似乎她的诞生……从希瞳的角度来看，怎么看都像是个奇迹一般。\n\n“是活的喵……奇怪了喵……橘子长不是在ｘｘｘｘ年就……”\n\n希瞳所说的话并没有错，自己的造物主在自己诞生之前……在作为“橘子长”出道首播的十五天后，因心脏衰竭离开了……显然，自己很清楚一点……前造物主的执念，却在死后的十几年里，得到了自己的“收获”。\n\n“那个……御月……现在还活着吗？”\n\n我很想问出这个问题，毕竟自己也心知肚明。你我同处于这一颗孤星之上，哪怕差距再大，时间上的永恒总会带走一个人的生命……然而猫猫只是想了想，得到的回答却不是“否”，而是……\n\n“不知道喵……但是一定还活着喵……我能感觉到她的存在喵。不过等咱得到了她的消息后……会和你说的喵，先执行任务去了，先走了喵！”"
  gts_ora.4403.a:"“有消息一定要回来喵！”\n(可以执行特殊项目)"

  gts_ora.4404.name:"通讯接入请求"
  gts_ora.4404.desc:"在双月希瞳离开后，她迫降所在的区域已经被清理完毕，并改造成了一处公园。毕竟……对于这个占地５００公顷的大坑来说，大家也想知道这个来自别的星球的巨大猫猫到底是何方神圣不是吗？\n\n“妈妈，快看啊，这个这么大的猫猫竟然是国家派来打大坏蛋的舰娘哦！”\n\n只是时间过了许久，有关造物主的消息却是了无音讯。就在橘子长决定要放弃的时候，通讯却突然响了起来，橘子长接过电话，等到的却不是双月希瞳的声音。不如说，是相似。\n\n“是你喵……”\n\n眼前浮现的棕色猫娘，虽然和双月希瞳长的一模一样，但是和之前看到的女仆装相比，身着常服的希瞳反倒多添了一分成熟的气息……好吧，算是聊胜于无。只是和前世记忆的那副模样想比，最大的区别就是：\n\n此时此刻的对方，早已不再是那个孤星中的普通人，而是成为了在星海间有着天体一般傲人身躯的巨娘。"
  gts_ora.4404.a:"接入通讯"

  gts_ora.4405.name:"通讯接入"
  gts_ora.4405.desc:"咱记得你喵……没想到那个家伙真的把你做出来了，要是她还活着的话我都想看看她到底是什么兴奋的表情喵……不过找咱的话到底要做什么喵……"
  gts_ora.4405.a:"我的造物主……"
  gts_ora.4405.a.response:"你说那个家伙啊…那个时候的她除了一腔孤勇外，什么都没有。我还记得我当时想帮一下……不过最后还是找她给自己画了一些。\n\n在她出事后，咱第一时间去她的房间，却发现，房间的一切都被烧毁。就像网上流传的消息一样……是自杀。咱很担心，害怕真的如此，不过找了许久之后……总算找到了这个。\n\n希瞳说完后，交给你一个老旧的平板，上面还带着一丝裂纹。"
  gts_ora.4405.b:"（接过平板）"
  gts_ora.4405.b.requirement:"先询问“我的造物主……”。"

  gts_ora.4406.name:"设计图"
  gts_ora.4406.desc:"房间内唯一完好无损的好像就只有这个了喵……可惜咱不知道密码是什么喵。不过既然都是“橘子长”的话，想必你应该知道密码是什么吧。\n\n陈旧的平板，还尚未出现人脸和指纹的解锁功能。不过就算有，沧海桑田间，哪怕是我也好，橘子长也罢，早已换了一副模样。而四位数的密码，却在那个一切巨娘的消息都严密封锁的年代，成为了唯一的锁，将一切流言蜚语挡在外面。\n\n“只有一次机会哦，输入错误的话……平板会爆炸喵（）”\n\n写在平板上的这句话，不知道在当时骗过了多少人，但即使无人愿意相信，至少也能带一点心理安慰。“ＸＸＸＸ”，随着四位密码的输入，平板打开，除了一个如今早已停服的音游后，就只剩下一个绘画软件｡\n\n“是传位于十四月希瞳……”\n\n一年只有１２个月，而一个时钟也只存在１２个小时。画板中所呈现的，却单独存在一个文件夹，里面摆放着的，却是自己的原型机。从一个简简单单的浅橘色麻花辫少女，到如今自己完整的模样。２０２４年开始，２０２８年结束。也是她离开世界的那一天。\n\n然而，再次翻找别的内容的时候，却找到了别的东西：\n\n里面存放着的，是和希瞳有关的，希瞳所有型号的立绘。以及，设计出的特殊模块。"
  gts_ora.4406.a:"这些……希瞳知道吗？"

  gts_ora.4407.name:"猫猫狐"
  gts_ora.4407.desc:"诶？咱不知道还有这些东西喵。\n\n很显然，这些内容是自己的造物主背着希瞳偷偷画出来的。从双月希瞳开始……到后续的各种形态，每个希瞳似乎都照着原版再次画了一遍。\n\n“那个，既然这些内容是橘子长要给希瞳的话，那我还是做出来吧，只是……要做哪个合适呢？”\n\n很显然，内容十分庞大，想要把所有的模块全部创造出来这根本不现实。不过哪怕只有一个，对于给希瞳的感谢来说也算是足够看吧，只是希瞳并不会这么想。\n\n“诶？我给了你这——么宝贵的东西，到头来连橘子长的裙子都得不到喵，咱伤熏了喵，喵喵喵……”\n\n“诶？”\n\n橘子长先是一愣，随后立刻反驳道：\n\n“哒咩！你的造物已经掀过咱一次裙子了不要啊啊啊啊啊——”\n\n即使如此，橘子长还是没能逃掉，毕竟希瞳如今早就想着要去对橘子长做着些这样那样的事情了……当裙底被掀开的那一刻，橘子长的脸瞬间红的难以招架起来。\n\n“至于模块，咱不感兴趣喵……现在的咱更想要每天上班四个小时然后舒舒服服的躺在床上玩着游戏甚至还有小鱼干的生活喵……如果橘子长可以做到的话……”"
  gts_ora.4407.a:"“我去找帝国报备一下吧。”"

  gts_ora.4408.name:"财务报备"
  gts_ora.4408.desc:"橘子长的消息已经发送到帝国内，大家都对这宛如前文明的造物感到十分惊讶。毕竟……有时候和橘子长相关的事情总是有点“俺寻思之力”的意思。至于御月希瞳所说的……这样的生活在如今的财务报表里虽然不低，但所幸有橘子长和希瞳这样的天体级行政官的存在，现在的帝国完全承担的起。\n\n所以……是时候该考虑一下了。"
  gts_ora.4408.a:"这是我的卡，刷卡。"
  gts_ora.4408.a.custom:"御月希瞳获得特质：['concept_gts_ora_hitomi_black_card']"
  gts_ora.4408.b:"刷橘子长的工资卡吧……"
  gts_ora.4408.b.custom:"御月希瞳获得特质：['concept_gts_ora_hitomi_salary_card']"
  gts_ora.4408.c:"是时候提升双月希瞳的性能了。"
  gts_ora.4408.c.custom:"双月希瞳的节能模式与爆发模式升级：['concept_gts_ora_hitomi_dual_mode']"
  gts_ora.4408.d:"该让三月希瞳更新模块了。"
  gts_ora.4408.d.custom:"三月希瞳的工作好手模块升级，并可在双月希瞳通讯中切换探索模式：['concept_gts_ora_hitomi_exploration_mode']"

  gts_ora.4409.name:"橘与造物主"
  gts_ora.4409.desc:"新的设备已经递交，随之一起的是御月希瞳一年的工资卡——虽然她这一年来除了摸鱼睡觉尾巴扫坏城市加上随意掀橘子长的裙子，工资表上本应该是惨不忍睹的样子。不过，比起别的天体级行政官来说，最起码…只要有零食有玩具就不会叛变的性格来看，还是不要扣除比较好吧。\n\n然而……平日里和一座大楼那般大的希瞳，此刻却没有这么想，她躺在一颗星球上，手指摩挲大陆海岸的浪花，而此时的她却一改往日，换上了一身礼服的同时，体型却覆盖整片大陆：\n\n是的，这颗星球已不再是往日所在的地方， 却也足够能看的出来，还原的不错。\n\n“你来了啊……”\n\n见到自己所在的星球有如此不速之客，橘子长应该会做出一些回应——而此刻，却如按下了什么开关一样，一向举止大方的天体级巨娘，此刻却向对方匍匐了起来。身体也缩成了一团，靠近了对方的手指。\n\n“首播结束了喵……你说我……能赶得上前辈喵？”\n\n少女的声音已然十分虚弱，却还在尽可能的隐藏着自己的哽咽。希瞳不语，随处扔下的高跟鞋却立在海面上，却没有任何船只接近。确切的说——\n\n似乎整个孤星，就只剩下了两个人。\n\n“没事的，咱们可是要把椰汁成烧成灰的嘛……橘子长？”\n\n而对方却僵住，没有了一点动静，希瞳放下头显，耳朵贴近耳机，对面却寂静的可怕。预”感到不妙的希瞳立刻穿上衣服下楼，来到了之前庆祝生日的地方，可推开门却看到——\n\n“她睡着了，怀里抱着的还是这个平板……得到这样答案的橘子长，在想什么？”\n\n放下头显后，橘子长思索了片刻。如今自己的存在，却是在如此渺小的仓库间中，靠着最简陋的东西来做出自己的梦想。这样的自己……低贱吗？或许吧。\n\n橘子长思索片刻后，却打开了平板，打开了绘画软件。"
  gts_ora.4409.a:"那就……把第十五个画出来吧。"

  gts_ora_hitomi_wait_project:"等待双月希瞳的消息"
  gts_ora_hitomi_wait_project_DESC:"从双月希瞳那里得到了她的造物主还活着的消息……或许等找到了传说中的御月希瞳之后……就可以知道自己的造物主究竟做了什么吧。"

  decision_gts_ora_qinwen_climate:"气候复苏完成"
  decision_gts_ora_qinwen_climate_desc:"好了，积雪消融了，虽然过程嘛……\n\n在宁古塔星系内属于我们的非极地殖民地上，确认气候复苏工作的成果。"
  decision_gts_ora_qinwen_climate_effect:"继续鸟音山水与橘子长的联动剧情。"

  gts_ora_book_qinwen_detail_buff_tooltip:"鸟音山水新增特质：“['concept_gts_ora_qinwen_ora_link']”"
  concept_gts_ora_qinwen_ora_link:"§I$gts_trait_qinwen_ora_link$§!"
  concept_gts_ora_qinwen_ora_link_desc:"§Y科研船效果§!\n装甲硬化：§G+25%§!\n§Y这位领袖§!\n领袖维护费：§G-500%§!\n§Y内阁生效§!\n力量投射产生的最大£influence£ $influence$：§G+2§!\n每月£unity£ $unity$：§G+10%§!\n岗位产出的£gts_giantess_fluid£ $gts_giantess_fluid$：§G+25%§!\n每月£influence£ $influence$：§G+1§!\n£minor_artifacts£ $minor_artifacts$产出：§R-10%§!"

  gts_ora_qinwen_wait_project:"等待鸟音山水"
  gts_ora_qinwen_wait_project_DESC:"橘子长已抵达寒岭，等待鸟音山水一同开展气候复苏工作。派遣一艘搭载具有“偏才”特质的科学官的科研船，前往宁古塔恒星轨道执行项目。研究需要两个月，无需投入额外科研点。"

  gts_ora_huatian_contact_project:"拨通通讯"
  gts_ora_huatian_contact_project_DESC:"小花田即将在“群星”展开文化考察。让搭载她的舰船前往当地，拨通通讯，安排与橘子长的会面。"

  specimen_gts_ora_huatian_miniature_city:"微缩版小人城市"
  specimen_gts_ora_huatian_miniature_city_desc_short:""
  specimen_gts_ora_huatian_miniature_city_desc_details:"$specimen_gts_ora_huatian_miniature_city_desc$"
  specimen_gts_ora_huatian_miniature_city_desc:"只是小花田送出的限量版微缩小人城市……据说是用一整个城市缩小得来的，十分珍贵……橘子长将其买下，目的是为了纪念曾经在这颗孤星的原住民。\n\n§H“我会做到的，成为这颗星球命运的长灯。”§!"

  gts_ora_book_huatian_detail_buff_tooltip:"获得藏品：['concept_gts_ora_huatian_miniature_city']\n小花田新增特质：“['concept_gts_ora_huatian_orange_blossom']”"
  concept_gts_ora_huatian_miniature_city:"§I$specimen_gts_ora_huatian_miniature_city$§!"
  concept_gts_ora_huatian_miniature_city_desc:"§Y展出效果§!\n\n每月基础产出：\n£society_research£ $society_research$：§G+15§!\n£gts_giantess_human£ $gts_giantess_human$：§R-3§!"
  concept_gts_ora_huatian_orange_blossom:"§I$gts_trait_leader_huatian_orange_blossom$§!"
  concept_gts_ora_huatian_orange_blossom_desc:"§Y舰船效果§!\n\n舰船航速：§G+100%§!\n考古发掘速度：§G+100%§!\n调查速度：§G+100%§!\n\n§Y内阁生效§!\n\n担任内阁成员时提供以下帝国效果：\n每月£physics_research£ $physics_research$：§G+100§!\n每月£engineering_research£ $engineering_research$：§G+100§!\n清除障碍速度：§G+50%§!\n行星基础设施建造速度：§G+40%§!"

  decision_gts_ora_qhai_entertainment_vote:"娱乐选票"
  decision_gts_ora_qhai_entertainment_vote_desc:"对这颗恒星所在的星系选上一票，这样千海可能会将这个星系彻底摧毁（大概？）\n\n§Y若提示“你并非其拥有者”，请尝试拆除该恒星的开采站后再使用；若尚未建过开采站，可先建造再拆除。§!\n\n§R警告：这颗恒星所在的星系会遭受到焚天神兵的毁灭性打击，请慎重选择。§!"
  specimen_gts_ora_qhai_miniature_galaxy:"微缩星系"
  specimen_gts_ora_qhai_miniature_galaxy_desc_short:""
  specimen_gts_ora_qhai_miniature_galaxy_desc_details:"$specimen_gts_ora_qhai_miniature_galaxy_desc$"
  specimen_gts_ora_qhai_miniature_galaxy_desc:"她将这片微缩后的星系给予了你……虽然说是微缩……可是这个星系的大小却足足有真正的恒星系那么大，却被一个夸张的罩子罩住……这算哪门子微缩了？"

  gts_ora_book_qhai_detail_buff_tooltip:"获得藏品：['concept_gts_ora_qhai_miniature_galaxy']\n千海新增特质：“['concept_gts_ora_qhai_virtual_idol']”\n帝国政府新增一个职位：['concept_gts_ora_qhai_virtual_streamer']"
  concept_gts_ora_qhai_miniature_galaxy:"§I$specimen_gts_ora_qhai_miniature_galaxy$§!"
  concept_gts_ora_qhai_miniature_galaxy_desc:"§Y展出效果§!\n\n每月基础产出：\n£gts_micro£ $gts_micro$：§G+1§!\n£gts_micro_city£ $gts_micro_city$：§G+1§!\n£minerals£ $minerals$：§G+1§!\n£food£ $food$：§G+1§!\n£energy£ $energy$：§G+1§!\n\n所有藏品资源产出：§G+10%§!"
  concept_gts_ora_qhai_virtual_idol:"§I$gts_trait_qhai_virtual_idol$§!"
  concept_gts_ora_qhai_virtual_idol_desc:"§Y内阁生效§!\n\n携带该特质的领袖担任内阁成员时，帝国下列岗位的基础产出增加：\n$job_redlight_worker$：£energy£ $energy$ §G+3§!、£trade£ $trade$ §G+3§!\n$job_micro_food_worker$：£food£ $food$ §G+3§!\n$job_micro_miner$：£minerals£ $minerals$ §G+3§!\n$job_transmutation_worker$：£consumer_goods£ $consumer_goods$ §G+3§!\n$job_microcity_foundry_worker$：£alloys£ $alloys$ §G+3§!"
  concept_gts_ora_qhai_virtual_streamer:"§I$councilor_gts_qhai_virtual_streamer$§!"
  concept_gts_ora_qhai_virtual_streamer_desc:"§Y任职要求§!：科学官，拥有['concept_gts_ora_qhai_virtual_idol']。\n\n§Y每级内阁有效等级提供§!：\n$job_gts_writer$的£physics_research£ $physics_research$、£society_research£ $society_research$、£engineering_research£ $engineering_research$基础产出：各§G+0.1§!\n公民幸福度：§G+3%§!\n物理学家、生物学家、工程师及对应研究子个体的£gts_giantess_fluid£ $gts_giantess_fluid$基础产出：§G+0.1§!"

  gts_ora_orange_soda_summer:"橘子汽水的夏天"
  gts_ora_orange_soda_summer_desc:"小人们应该很幸运，幸运到能够碰到橘子长这样的巨娘来管理这颗星球。"















