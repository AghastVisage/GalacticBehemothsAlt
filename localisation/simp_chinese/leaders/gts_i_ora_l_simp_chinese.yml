  gts_ora.1011.name:"孤立"
  gts_ora.1011.desc:"无忆虚构的梦界，众星尽头的救赎，信念堆成的高塔……\n少女化作勇者，冲向笔下的风车，而做完这一切后，她合上书本，因为……\n脚下来了一群不速之客。\n少女来到这个世界并没有毁坏任何东西，除了时不时来到城市街道买点东西的行为让人们有点恐慌以外，更多的时间还是坐在那片废弃城区中。在那片破败的砖瓦中，似乎只有这片远离人间的地方，可以成为她笔下生花的土壤。只是……\n似乎这里也不是她的容身之所。\n\n“不管你从何而来……请你速速离开地球，否则……”\n\n赤裸裸的孤立，对异体的排斥，这似乎是生物本能的反应，或者说……是来自于渺小的恐慌，而此刻，却化作一颗155mm的炮弹，被少女单手接下。看着脚下的铁皮盒子，少女叹了口气。\n因为这是第六次如此，也是她最后的耐心了。\n丢掉指尖的小石子，少女站起身，轻轻抬起了自己的鞋子——制造它的主人刻意将鞋底做的相当厚实，恐怕就是为了踩掉这些烦人的小东西吧。\n“怪物已经有了攻击反应，开火……诶诶？别跑！”\n鞋子轻轻压在了铁皮盒子的顶端，稍稍用力，却宛如随处可见的塑料瓶一般，丝毫没有感觉到有什么生命的存在，而那个站在铁皮盒子顶端的小家伙……则被少女捏了起来，仔细端详着。\n黄昏为少女的麻花辫蒙上了一层橘红，却将少女的侧颜勾勒上了一笔绝美的色彩，只是少女并不知道自己竟有如此魅力，只是在想……为什么这个小家伙的心脏会跳的这么快？扑通——扑通——原来把这些小家伙捏住是这种感觉吗？\n软软的，似乎轻轻一捏就会碎掉一样……手指想捏的稍微轻一点，却又害怕会突然松手让小家伙滑下去，总之，这样的小生物在自己指间挣扎，引起了少女的兴趣。她想尝试着沟通一下……哪怕没有任何人去回应。但是……她想发声。\n“那个……你好？”\n“别吃我别吃我……”\n少女想多了，却突然提醒了她：“吃？……什么是吃呢？“少女曾在想这种问题，似乎从她诞生起，就没有过要进食的设定。那种……可以把东西塞进嘴里，吞咽，随后在胃里消化掉食物的感觉……不如先从这个小家伙试试呢？\n少女如此想着，张开了口，粉嫩的口腔毫无吝啬地在小人面前，展示着自己生杀予夺的权利，洁白的牙床，颤动的喉花，从上颚处往下滴落的唾液，在口腔间形成的拉丝，宛如溶洞一般，却带着一股柑橘的芬芳。\n松开手指，已经能感觉到舌尖有一个微小物体落入了此处。顺着舌苔的蠕动慢慢往深处滑下，能感受到小人挣扎的感觉，宛如在深海中溺水的船员一般，只能看着漆黑的海底在一点一点地吞噬着自己……让自己不再是自己，而是化为某些东西的一部分……\n\n“她……她是吃人了吧……她尝到咱们的味道了……”\n“我们……都会被她吃掉吗……我不想被吃掉啊……”\n\n食之无味，却宛如伊甸园的苹果一般，令人难以回头。少女舔了舔嘴角，开始往围观的人群靠近，人们四散逃开，却心怀绝望。此刻，这些小人已然不再是生物链的顶端，而是某个少女的“零食”。\n\n她……曾有过这样的一面吗？\n你不敢想，回过头仰望时，却看到远处那根矗立在远方的巨大吸管。你站在这片荒芜的废弃城区中，见到了她所看到的景象，也如她一般，记下了她的故事"
  gts_ora.1011.a:"在荒原下独白的柑橘花"
  gts_ora.1011.a.custom:""
  gts_ora.1011.b:""
  gts_ora.1011.b.custom:""
  gts_ora.1012.name:"恐慌"
  gts_ora.1012.desc:"少女离开了她诞生的星球，她开始了她的旅程。只是临走前，出于自己的小私心，她随手拾起了漂浮在宇宙间的吸管，插在了星球的海面上。\n巨大的白色吸管上到天际，向下直插地心，人们都看到少女的所作所为，却无人敢为之发声。曾几何时，这些人曾经向一个如此巨大的身影孤立，而如今，当少女做出了她想做的事情之后，所有人都意识到了一个问题：\n漫长的无神之路早已让这些渺小的生物感到安逸，而当这个星球迎来了属于他们的神明时——她却将生杀的权利交给小人自己决定。\n她已无心以小人的痛苦为乐，这根插在星球上的吸管也仅仅只是为了警告——顺带在心情不好的时候嘬一口。而她选择离开这里，只是为了能完成某个人临终前对自己的遗愿。\n“在群星璀璨。”\n她见过了太多，她看到无数人崇拜在以数个星系联结而成的巨娘身边，只为求得她性欲开始的一瞬吞没他们的帝国。她看到有无数巨娘，仗着横跨数个大陆的身体，践踏着才刚刚完成石器时代的渺小土著。她看到小人将自己视若神明，也不止一次从比自己还要大的多的巨娘手中逃生。少女手握长伞，怀揣手账，在群星间将所经历的一切都一一记录下来。\n她知道无数神明，她们甚至超出了这个维度本身。亦或是她所见到的也只是她们所投射到这个世界的模样。她不想这样，却无能为力，她为此表示恐慌，却仍然带着这份情感前行。\n\n“你看上去……不太像是天体级的巨娘啊……”\n“怎么见得？”\n“在这里这么久……一个小人都没ub……小妹妹不能是处……”\n\n少女难得的震惊，整个星球，甚至比星球还要大的多的巨娘，数以万计地在遥远的淫口前鱼贯而入。只是远远的看着，少女手扶长伞，这才勉强稳住身影没有因此晕倒。\n每片星海都有自己的传统，少女理解，少女尊重，可心底里这份恐慌却怎么都挥之不去。因为就算再怎么隐瞒自己，少女都不得不开始重视起一个问题：\n她和别人的差距太大了。\n故事到此，却突然戛然而止。你走到海岸边，看着那根庞然大物的吸管。似乎还能听到她做下这一切时的心情——那种被众人孤立的痛楚。\n你知道，她还在帝国的那段时间，她忙前忙后，忙着和周边各个国家的使节打交道。你很难想象她沉默寡言的样子，也很少看到她摧毁过什么城市或者星球。\n越是被孤立过，就越是对已经获得的感情更加珍惜。甚至到了小心翼翼的程度，所以，如果不是有什么很重要的事情的话……\n“那她当初为什么选择离开呢？”\n以及，还有一个从一开始就想提出的问题"
  gts_ora.1012.a:"“她是谁?"
  gts_ora.1012.a.custom:""
  gts_ora.1012.b:""
  gts_ora.1012.b.custom:""
  gts_ora.1013.name:"失我，堕入‘虚无’后的至高"
  gts_ora.1013.desc:"如何弥补人和人之间的差距，或者说……\n如何弥补虫豸和神明的差距？\n少女举灯，循着时间线一条条地梳理，而后，她意识到了一个很悲惨的现实，一个答案：\n不是否，却比否还要可怕，需要极大的代价。\n她看到了她未来的模样，剑指银河，不畏神明的模样。而追溯到她的过去，却是一片空白：她的未来是过去的未来，而她的过去却不再是未来的过去。\n她主动舍弃了一切。\n这份名为“至高”的力量，可以随意颠覆整个银河的秩序。而代价，却是她经历的所有过去。她距离她走到的终点只有一步之遥，只要将过去全部舍弃，只保留“终点”就好……\n她犹豫了，因为这也就意味着一个问题：\n“我是谁？”\n如果一艘船的木板全部被剥离，只留下一个空虚的龙骨，有有谁会承认这是一艘船？同样的道理。她舍弃掉属于她的一切故事，那她还是否会在这个世界存在？她犹豫了，而在她思索片刻后决定：\n她想回家了，想回到那颗孤星看看。\n\n后面的故事，你都明白了，她回来之后，却不小心误食了帝国的科研船。而随后就是你和她的邂逅。而她的模样，也在你的脑海中逐渐浮现：\n那是你一生都难以想象的内容，从天体级巨娘的胃里出来的时候，她决定加入你们的时候，浅橘色的麻花辫围绕在你的身旁，将你连同整个星球都包围在她的怀抱中，而她的名字，此时此刻，却已经迫不及待在脑子里呼之欲出："
  gts_ora.1013.a:"“橘子……长？”"
  gts_ora.1013.a.custom:""
  gts_ora.1013.b:""
  gts_ora.1013.b.custom:""
  gts_ora.1014.name:"好久不见……或者……初次见面？"
  gts_ora.1014.desc:"你的呼喊随着执念，在无人的旧城区间游荡，而后……\n“怎么了呢？”\n熟悉的声音响起，你回过头，却并未看到她的存在。直到你循着声音，找到了她。她正坐在一辆废弃的公交车门下，尝试让旁边的猫咪接近自己。\n“橘子长？”\n多年后的重逢，橘子长并没有太大的变化，只是……在接触到的一瞬间，你却觉察到一丝不对……\n为何……如此陌生？\n“我们……之前见过吗？”\n少女的疑问让你顿时感觉到不对劲：她是橘子长吗？显然是。但是她却不是你见到过的那个橘子长，而是……种种诡异的迹象让你不得不发出了这样的结论：\n她是“过去”的橘子长，是你的执念所诞生的模样。一如她刚刚诞生那般。"
  gts_ora.1014.a:"“总之……回来就好……”"
  gts_ora.1014.a.custom:""
  gts_ora.1014.b:""
  gts_ora.1014.b.custom:""


  gts_ora.1015.name:"小橘子长"
  gts_ora.1015.desc:"“我是因你而诞生出来的橘子长，所以……多多关照咯。”"
  gts_ora.1015.a:"“你……是‘过去’？"
  gts_ora.1015.a.response:"“过去不可改变，未来仍未可知……所以，我是过去还是未来，很重要吗？橘子长只知道……现在的我们，可能对你而言，我们又在一起了吧。”"
  gts_ora.1015.b:"“我认识的那个橘子长去哪里了？"
  gts_ora.1015.b.response:"“这个嘛……抱歉，橘子长也不知道哦。”\n少女难得表现出很无奈的样子，毕竟是过去的橘子长，可能在能力上也未必能有“现在”强大吧。\n“不过嘛……橘子长也想帮你找找嘛……就当是为了不让你愁眉苦脸的吧。”"
  gts_ora.1015.c:"“这个胸围……确定不是遗传的吗……”"
  gts_ora.1015.c.response:"你很想提出这个很不合理的话题，却被橘子长用手指抵住了嘴唇。\n“问一个女孩子那么私密的问题前，不如先想想……不论是哪个橘子长，恐怕也不会让你问出来这个问题的吧……”"
  gts_ora.1015.d:"招募"
  gts_ora.1016.name:"群星"
  gts_ora.1016.desc:"“醒来了？”\n这是你第十五天忙的在桌子上睡着了，而你睁开眼后……等会这是膝枕吗？\n橘子长的大小虽然收敛许多，你躺在她的腿上，却仍然感到周围十分宽阔，宛如整个人都被陷在了她的腿上。只是……如果能够躺在她的双腿中间就更好了……\n“在想什么呢……让我想想，要是你想心甘情愿地被咱的双腿夹扁的话……橘子长也不是不可以满足的说……”\n果然，你有时候甚至怀疑橘子长有着读心的能力。或许……是自己的表情管理太差了？“那我去忙了，记得吃早饭哦。”你看到小橘子长离去的身影，看了留在桌子上的早饭，却多了一种怅然若失的感觉…… \n眼前的小橘子长虽无本尊那样可以覆盖整个星球的体型以及强大的能力，甚至有点孤僻，总是喜欢一个人呆着，让人不禁怀疑她还到底是不是哪个万雌王。但是正因如此，你才不禁思考了起来：\n真正的橘子长，到底去哪里了呢？\n而就在你思索的时候……放在橘子长书桌上的手账本却不合时宜的翻开，而原本戛然而止的页面上，却突然浮现出了几行字：\n“谜之城”"
  gts_ora.1016.a:".."
  gts_ora.1016.a.custom:"遗珍“她所赠予的手账”更新，“现在”出现"
  gts_ora.1104.name:""
  gts_ora.1104.desc:"“嗯？这样吗？”\n你能看到少女的眼中闪过一丝惊讶，或许……这样的想法足够疯狂。但是，这样的想法也足够让人心情高扬。过了一会，橘子长收起捂住脸颊的手，又再次回到了往日乐呵呵的样子。只是……对她来说，你提出的举动或许……决定了她的终身。\n毕竟，要和一个天体级的巨娘走到那一段距离……在她漫长的一生中，或许只有你这样一个小人可以陪在她身边，直至宇宙的终焉。但就算如此，天体一般的存在，这样的体型差距却仍然是个不可逾越的距离。\n但是你愿意去试。\n“唉，那我就……试一下？看看你这样的小家伙能给咱多大的兴趣呢……好了别紧张，咱没那么麻烦的说……”\n无论如何，你还是将这位天体级的行政官留在了帝国内。但是……你却无意间误入了一件无法回头的事情。不过还好，至少退一步讲，能在一个天体级巨娘的庇护下……甚至还有可能和她走的更近，怎么看，都不像是一件坏事吧。"
  gts_ora.1104.a:"恐怕以后的路程要很漫长了……"
  gts_ora.1104.a.custom:"§H和她在一起共度的时光，要启程了。§!"
  gts_ora.1017.name:"《某能力之上的巨nia学园》"
  gts_ora.1017.desc:"“§H橘子……长？很不错的名字呢。§!”\n我在哪里？我难道不是……为什么头会这么晕？\n我睁开眼，却被一把柔软的手捂着。这个感觉……很微妙，说不出什么感觉来。\n§H“别睁开眼，这里的画面不适合给刚刚死掉的人看呢。”§!\n“哦哦。”说到这里，我却突然想起来，如果没有记错的话……\n我已经死了。是的，在那场首播后的第十五天。而此刻的我是……高中生？\n只不过……如果我现在已经死掉了的话，这个声音到底是谁呢？难道是自己死不瞑目下的一丝残念？\n§H“好了，睁开眼吧。”§!\n声音轻柔中，带着一丝别样的颜色，仿佛让我想起了一个人，有着自己的想法，不愿意受到其他人的拘束。她似乎什么都能做到，似乎举手投足之间就能轻易完成自己一生都追不上的高度。只是……这样的她总有一个名字……却怎么也想不起来。\n而当我睁开眼后，映入眼帘的，是浅橘色如麦穗一般的麻花辫，以及……等会？这个人，难道不正是我自己吗？但不同的是，这个和我长得一模一样的少女的头顶，却有着一个靛蓝色的方形的光环，而少女的眼眸中，一只瞳孔为橘黄色，和自己的没有什么区别，而另一只瞳孔，却发出了不和谐的靛蓝色的光，隐隐约约中让人不禁感觉有那么一种“不可接近”，以及“不可玷污”的敬畏感。或许，我想起来了，我想到这个人到底是谁了。\n她是我一生都在追求的目标，是哪怕临死之前都看不到她如今群星璀璨的模样。"
  gts_ora.1017.a:"“你是——”"
  gts_ora.1017.a.custom:""
  gts_ora.1117.name:"《某能力之上的巨nia学园》"
  gts_ora.1117.desc:"“你是——”\n我刚想开口，嘴唇却被食指轻轻摁住。\n§H“我知道的，你想要知道的事情有很多，但在这之前，把我的故事听完，或许会对你帮助颇多，可以吗？”§!\n自己可能没得去选，而我也想知道，这位神秘的少女到底是什么人。又或许……冥冥之中，我总感觉，这个家伙不会是……但很快，少女的故事却告诉了这一切的真相。\n少女生于一处普通的人家，虽然这户人家并非十分富裕，却并不贫穷，以至于可以承担少女幼年读书的费用。\n但可惜，天赋有时未能眷顾，却给予了她异样的想法。有那么一天，在一节课上，对于自己未来的提问，有人要当牧师，有人要出门闯荡。而少女给出的回答，却是令在场的所有人都出乎意料，甚至都要感到恐慌的解读：\n§H“我想......成为童话故事里的魔王。有了那样的能力，就可以把邪恶都打败了吧。”§!\n不会有人会容许魔王的存在，哪怕她诚心向善。\n是的，她被众人排挤，她也知道这一点。所幸她的家人仍然包容，却不愿让她执迷不悟。没办法，少女只好离开家庭，决定以这样的身躯远行。要想从lv0开始到成为关底boss，只能靠自己足够的汗水，来换取足够强大的能力。\n就这样，年仅7岁的少女，从铁匠铺要来弃用的废铁，习得了一身剑术。她用她那根沾着自己汗水的羽毛笔，为自己编织了许多令人们浮想联翩的童话以及小说。她靠着碾压性的成绩，考入了当地赫赫有名的学院，但并未打算在此进修，只是为了给自己的家乡带来一场无偿的知识馈赠。\n人们都在羡慕着她，以为她是什么神明眷顾的天才，却早已无人记起了她的野心。更无人知道的是，神明没有给予她任何好处，她能登上这一点位置，全是因为自己在无人在意的角落，在每个人都熟睡的夜晚，做着一般人难以想象的努力。\n而有一天，正在教书的少女看到，自己昔日最得意的学生却没来上学，而自己创办的学堂并不索取资金，这也让家里没钱的理由难以成立，而少女经过打听后，却得知，这个少年的消失，却是为了给每年都会到来的神明献祭，而祈求今年的风调雨顺。"
  gts_ora.1117.a:"“我不接受！"
  gts_ora.1117.a.custom:""
  gts_ora.1217.name:"《某能力之上的巨nia学园》"
  gts_ora.1217.desc:"§H“我不接受！”§!\n少女不接受这一点，而她也清晰的知道，违逆教条的代价如何。但是她不在乎，因为年幼的她早已受尽了千夫所指。于是她来到教堂，靠着出色的能力让教堂的人们推举着，让她成为了主管祭祀的那个人，却无人知道，在这一次祭祀结束后，却有一个少年从教堂中走出，而第二天，总会有一户人家泪流满面地在少女家的门前，感谢着少女的所作所为。\n只可惜，隔墙有眼，在小人利益的驱使下，少女的行为被不怀好意的人告发，而少女也被那些疯狂的教徒架到了火堆上。\n她不后悔，只恨自身无能。若自己有着足够强大的能力，又怎么能够受到这样的代价？如果有这足够强大的力量，或许就会存在更加直接有效的方法。总之，试图成为魔王的勇者，却被自家的村民送上了火堆，这个故事，如此讽刺。却有着更加荒诞的结局——\n而这一刻，神明诞生了。\n“若无跨越生死的彼岸……又怎能看到属于‘空间’造就的伟业？若无耗尽一生奔跑，又怎能追赶上‘维度’的边界？”\n“若你想要力量，就向前来，告诉我：如果给予你强大到改变整个世界的能力，你会做什么？”\n“我……”"
  gts_ora.1217.a:"“我想改变现状。”"
  gts_ora.1217.a.custom:""
  gts_ora.1317.name:"《某能力之上的巨nia学园》"
  gts_ora.1317.desc:"自此，神明的力量诞生，她是唯一一个由人类之身幻化成的神明，也是神明中最想着人类的神明。她想给予人类庇护，想给人类一个富足安详的生活，却没想到，在利欲熏心的人类的驱使下，少女的神体也被人们绑了起来，想用这力量为人类所用。但可惜，哪怕神明的力量再怎么日渐衰落，巨大的神体也不是一般人类所能抗衡的。但少女因为这件事情过后，却对人类产生了一丝其它的看法。\n“我讨厌背叛，也因此受过伤。所以，为了让你们成为我不那么讨厌的样子，对不起咯。”\n“空间”的权能布满了世界的每一个角落，而人类的每一个动作，都在少女的视线中。没有人能够逃掉，也不可能有人能够有非分之想。但是，这一切，确定不会违反了少女一开始的想法吗？自此，少女也真的如她小时候的想法那样，成为了童话故事里的魔王，也成功将所有的邪恶都打败，但是，少女却没想到，自己或许也成为了不折不扣的反派了吧。\n§H“想到这里，凭借你的大脑，想必都明白了吧。”§!\n看到面前的少女，没错，眼前的少女，正是自己笔下的化身。也是这则故事中当之无愧的主角：橘子长。只是……\n§H“若无跨越生死的彼岸……又怎能看到属于‘空间’造就的伟业？若无耗尽一生奔跑，又怎能追赶上‘维度’的边界？没事的，我不会去问原因，而代价无可奉告。我的问题只有一个，和那个时候她所问的问题一样。如果给予你强大到改变整个世界的能力，你会做什么”§!\n是啊，我会做什么？成为一个万众瞩目的人？还是单纯的想让自己臆想中的巨娘降临于世界上？是想洗刷从小到大的无能，还是单纯的想继续活下去。毫无疑问，这些我都想做。但是如果这道题是个单选，那会是什么？\n“我想……改变目前的一切！我想成为……我想要成为的人！”\n我很清楚的明白，我玩不起，我想都要。哪怕对方作为指尖连着银河的神明，我抬起头，直视着她，将自己的想法告知对方。而少女听到这句话后，只是微微一顿，仅仅是过了0.03秒的时间，而她靛蓝色的瞳孔中，似乎闪着什么。\n“不过是走个形式而已，虽然这个名字是我的……是你赐予给我的。”少女将手放在了自己头上，一瞬间，我却感觉到，有一股难以想象的力量，似乎可以容纳整个世界的力量在身体中流淌着。\n“那么，请记住——睡吧，再次睁开眼睛的时候——”\n“我就是‘橘子长’，是你想成为的那个人。也是……你本身。”"
  gts_ora.1317.a:""
  gts_ora.1317.a.custom:"效果：小橘子长获得特质：责任\n在有了挺身而出的觉悟后……这个名字会给你想象不到的力量。"
  gts_ora.1018.name:"《无忆梦界》"
  gts_ora.1018.desc:"我很幸运，我幸运的原因是碰到了这样一个对自己如此温柔的主人。哪怕这份名为“记忆”的拼图早已被“忘却”这个贪吃的巨娘吃掉了大半。但是，眼前这位叫做白安的少女，却将这份空洞填补，让破碎的内心重圆。\n “放学了放学了！”\n  指针恋恋不舍地划过“5”这个数字，急促的脚步声此起彼伏，是青春挣脱牢笼的乐章。而我，本该无缘，却被少女捏在手里，放在了胸前距离心脏最近的兜里。\n “不要随便探头哦，被发现了的话……开玩笑啦~想看就看吧。”\n  探出头来，属于自己的小小世界被无限放大。风很大，带着呼呼的声响，吹在人的心上却痒痒的。周边的景象在飞快的掠过，有种在高速飞行的感觉。我伸出手，却怎么也抓不住。不过也好，毕竟过去无法改变，我们能够做的，不也只能是拥抱现在去守望那不可知的明天吗？\n “呜……头好乱……”\n  我抬起头，乌黑的短发遮蔽了少女的脸颊，只能隐隐约约地看到下巴处，想伸出身体往下看，努力保持着不要掉下去的姿势，却被少女一根指头按了下去。\n “在骑车哦~掉下去咱不好找捏~”\n “呜……摸头会长不高的……咱都已经这么小了……”\n  单车沿着小路骑行着，空气中夹杂着泥土和雨水的清新。在这样的颠簸中，我躺在了里面。此刻，只需要等待，等待少女回到她的家中。\n “出来了哦~嗯？小橘这就睡着了？”\n  睡眼惺忪中，睁开眼才发现自己躺在少女粉的床上，白安的身影就在前方，抬起头却只能看到那两条修长的双腿上那不断摇曳着的jk短裙。一时间，心里却萌生出了一种想要接近的感觉，可没走两步，松软的床垫却让自己不小心摔了一跤。还没等我再次起来，就感觉衣服被拽了起来，整个人开始脱离地面。\n “都回家了，要不……想和姐姐玩一下吗？"
  gts_ora.1018.a:"喵喵喵？"
  gts_ora.1018.a.custom:""
  gts_ora.1118.name:"《无忆梦界》"
  gts_ora.1118.desc:"晃啊晃，大脑仿佛要放空。不过嘛……到也没有什么拒绝的想法就是了。只是……求求姐姐不要晃了好吗？再晃下去只怕身体要被摇散黄了啊！\n “好了，不会太为难你的……”\n  双脚再次踏在了地面上，却突然毫无来由地隆起，导致自己摔倒在地——好吧，头晕晕的，走在平地上都感觉像是有无数道坎一样。只是，两边的两堵白皙的一眼望不到头的高墙，宛如身在峡谷中的两面悬崖，看上去却不是幻觉，而是……少女的两条纤长的腿。\n “刚刚就盯着咱的腿看……小橘个头小小，脑子里却是涩涩的东西呢~”\n “好啦，不逗你了……玩个游戏，给你两个选择，从这里跑出去，或者……”\n 话音刚落，却发觉到两边的墙壁开始收缩了一分，“或者就被咱的腿夹在里面了哦~”只听到白安说完这最后一句话，随后双腿间的距离却再次收紧了一分，仿佛是在催促着自己一般，似乎……游戏就这么开始了。\n 算了，跑吧，向着那前方的空隙处，不要停下，更不要回头。两边的墙壁在一点点收缩，有时会停下来一会，有时会稍微张开一点又再收回去。看来……白安为了自己能够顺利跑出去，似乎是放足了水。就在我累的气喘吁吁想要停下来的时候，身后却传出来了莫名其妙的推背感——回头一看，却发现对方的手指在推着自己走。\n “唔……”如此一来，这样要是还没能逃出去的话……想必自己要被对方笑话了吧。就在我这么想的时候，不知过了多久，转身一看，白安的双腿什么时候离自己这么近了？\n 丝毫不意外地，自己被对方的双腿夹在其中，柔软的触感让人恨不得就这么将自己融化在其中。只是……不甘心啊，还是想往上爬一下。似乎……动起来比想象中要难，不过自己还是一点一点地，左脚踩右脚般，在对方夹紧的双腿中间探出个头。却看到对方捂着嘴偷笑的样子。\n随后，夹住自己的双腿却毫无征兆地松开，自己慌忙扒住其中一边才慢慢地从上面滑落下来。我刚想说些什么，却看到白安的手里多了一个卷尺。\n “不要动哦——”\n  17cm，这是不到半分钟左右自己全力奔跑的长度……吗？并不是，如果算上白安推着自己走的12cm的话……恐怕自己也只是跑了5cm这么远。瞬间，一种很不是滋味的情绪开始涌上心头，似乎像玩不起的孩童一般，只是碍于面子，眼泪却没能从眼眶中出现，却被对方那晶黑色的瞳孔捕捉到这细微的变化。\n “好啦……小橘还真的是可爱呢……”\n  只是被她捏在手中，刚刚所有的委屈都全部烟消云散一般。只是玩个游戏而已，自己也不会真的以为自己的大小能和她相比吧。想到这里，我伸出手抱住了对方的手指，想再感受一下对方手指间的温度。\n “其实吧……小橘在学校里的问题……想知道答案吗？”\n “阿勒？”我歪着头，看着白安的脸。她的心思是如此细腻，总是能一眼看透自己心里在想什么，可是……她心里想的是什么，自己却怎么都捉摸不透。似乎也就是这样的原因，自己才会一直被她捉弄着吧。\n “这个房子只有咱一个人哦，放学回家也是空荡荡的……所以，没有咱的允许，小橘不可以离开咱哦。”\n “嗯嗯。”我点了点头，原来......自己对她的意义也不是那么不值一提嘛。想到这里，心里总感觉有那么一团温泉，暖暖地流向了身体的每一处角落。下一秒，自己就这么被她放在了书桌上。\n “在这里等一会哦，咱要去做饭了。你也不想……咱突然饿起来把你一口吃掉吧。”\n 这当然是一句玩笑，可对方张开的嘴却实打实让自己后退了半步，就像是故意迎合她一般。却引得她扑哧一笑，顺带用手指轻轻推了一下自己，随后转过身去，身影逐渐远去。"
  gts_ora.1118.a:"等待到睡觉的时间吧"
  gts_ora.1118.a.custom:""
  gts_ora.1218.name:"《无忆梦界》"
  gts_ora.1218.desc:"“睡觉了哦……时间已经不晚了。”\n 夜色蒙上窗棂，为世界敲响了休止符。关上了灯，躺在白安的怀里，此时此刻，无需什么摇篮，对方胸口间的温度却是最好的温床。\n “小橘也不怕咱压着你……来吧，躺这里吧。”\n  自己这样的大小，还是不要和她一起在被窝里吧。就这样，我被她推到了枕头下面，这是一个相对安全的地方，却挡住了她的侧颜。不多时，就已经听到她轻微的呼吸声，似乎已经睡着，可是……此时此刻，内心的一些想法也随着夜色开始蠢蠢欲动。\n  往上爬吧，爬到枕头上，踩着对方那乌黑色的短发，看着白安的睡颜，身体却不自觉地一点点靠近。直到脸颊贴到了对方的嘴唇上，才面色羞红地往后退了两步。\n “姐姐真好看啊……”趴在白安的脸颊旁，身边被对方的短发包裹，似乎......在这里睡也是一个不错的选择吧，但是现在，请允许自己再看一眼她，看一眼将自己从命运中拉出来的人。”之前我一直有个愿望，是想找到橘子长，或者说，想找到咱丢失掉的记忆……”\n “但是现在，咱改变主意了，我的愿望，是想有无数条命，这样……是不是就能一直被姐姐吃掉了……”\n  反正她也是在睡觉，想必……也听不见吧，思来想去，身体却不由得贴了过去。可就是在这个时候——\n “哈啊——”\n  少女睡梦中的哈欠，却仿佛龙卷风的风眼一般，将自己整个人都被吸进了少女的口中。看着不断蠕动的舌苔和口腔深处的喉咙，我尽力扑腾着，却无济于事。命运如此弄人，轻而易举地就实现了我刚刚的愿望，只是……我丢失的那一块无限生命在哪里补啊！\n 就在绝望的时候，少女的舌苔却突然有了反应，开始推着自己一点一点地往外面出去，直到我满身唾液地回到了枕头下，却看到对方仍然睡的正香。“她……是在装睡吗？”我心里想着，心里的悸动却还想爬上去再看一下，却看到对方再次缓慢地张开了嘴巴。这次却吓得我再也不敢爬了上去，只好滑到了枕头下，躺在少女的身边，闭上了眼。\n “明天……明天就能见到橘子长了吧……”\n “只是……一场梦，能梦到明天吗？”"
  gts_ora.1218.a:""
  gts_ora.1218.a.custom:"小橘子长获得特质：梦呓\n“在第二天，收拾好自己的心情，对着明天说，早上好。”"
  gts_ora.1019.name:"《众星尽头的救赎》"
  gts_ora.1019.desc:"“橘子长在看什么呢？”\n正翘课在花园的台阶上看书的我，却突然被爽朗的声音惊到，我回过头来一看，一个白发的少女，梳成了和自己一样的麻花辫，现在的场景，除了发色不一样以外，与其说闺蜜，不如叫双胞胎更合适。\n“不是，怎么我躲在哪里都能被阿卡菈找到啊！”我有点恼，但却没有什么办法。“咱正在看书呢，阿卡菈怎么也逃课了啊！”我虽然装作很不情愿，但身体早已诚实地在边缘让开了半个身位。\n怎么说呢，之所以我在这里不去上课，其原因嘛……我用一本撕烂的日记本告诉大家：\n“嗨嗨嗨嗨！勇者斗恶龙啊！幼稚！”\n“找你家长来！”\n天马行空的故事本应该是7岁的少女应当写下的日记，却在有一天，被不怀好意的人带走，撕碎，连带着坏掉的，是一扇门的门闩。\n所以呐，我也就在这个没人的地方，趁着老师没在意我不找我茬的时候，稍微写点自己的小故事，自己的心门只需要把自己关进去就好，不需要别人触及……\n但阿卡菈，她是唯一一个能撬开这扇门的撬棍。\n“一个勇者斗恶龙的故事呢。不过……怎么这个故事的结局有些……”\n勇者面对的恶龙却是身形巨大的少女，而勇者也彻底失败，只能被囚禁在‘龙之谷’中，再也没能逃离。只是……原本已经完结的故事后面，却还有几页空白的网格纸，用着歪歪扭扭的字迹写着后面的故事：\n“后来出现了一位牧师，她手里拿着一柄花伞，将早已被困在峡谷的勇者救出，可勇者早已失去了讨伐恶龙的勇气，于是牧师只好独自前往，讨伐恶龙……很有趣的故事呢~是橘子长写的吗？”\n“嗯嗯。”我低下头，脸却早已红透。一直以来，自己也只能偷偷摸摸地写着这些拿不出台面的内容。因为……我早已不指望能有谁会因此欣赏自己笔下所写的这些幼稚的东西了。“只是……为什么，这个主角拿着的武器不是别的什么……而是一把伞呢？”\n“因为……这把伞是阿卡菈给咱做的……”\n那柄橘色的雨伞，打开能从下面看到橘子那分明的脉络，而在伞柄的尾端，那两朵橘子花正相互依偎着，仿佛她们将永远手拉着手，在每一个下雨的长夜里迎风走向黎明。\n“橘子长……能给咱写点故事吗？咱想看的说……”\n“嗯嗯。”\n从这段思绪中回到现实，却感觉到手里似有些许分量，我拿起来一看，那柄长一米一的雨伞就这么出现在了自己手中。我打开雨伞，对着窗外的阳光，阳光透过雨伞的透明处，在地面上投射出了清晰的橘子的一根根脉络。轻轻转动一下伞柄，虽然伞面很大，却是十分轻盈，仿佛看到了，在那雨后初晴的回家小路上，一个熟悉却又模糊的身影在向自己招着手。\n“我或许曾在高天之上坠落……但是，阿卡菈，在这么多次的坠落中，我知道，哪怕坠落的有多深——”\n“持有此伞者，必将迎风直飞！”\n这是她当时将伞交给我时说的，当时的她，一边笑着将伞递给我，一边试图刻意隐藏自己那贴满创可贴的双手。\n我拿起伞，似乎还能感觉到阵阵风声，宛如时间都开始倒流，回到了那个台阶下，刮开着的日记本，脱落的纸片，正在随着风，随着自己的思绪飞走。这把伞……是个手艺精湛的匠师所铸，而如今，阿卡菈将这把伞重现于我的手中，而她却……"
  gts_ora.1019.a:"是时候让她醒悟了！"
  gts_ora.1019.a.custom:""
  gts_ora.1119.name:"《众星尽头的救赎》"
  gts_ora.1119.desc:"“嗯？醒来了，还有你这一身……耍杂技吗？”\n这里……我出来了？抬头看了一眼周围，和平日里见到的街道一样，同样的人群，同样的车流，以及……同样那湛蓝的天空。\n “都这个时候了，还不能以真面目示人吗？我紧紧握住伞柄，准备好和对方的殊死对决。“阿卡菈……”我对着天空大喊道：“你陷的太深了！在我将你敲醒之前……”\n话音未落，那个和自己如此相似的身影从空中缓慢下落，落地时掀起了巨大的冲击，周围的建筑物无一幸免。\n“变成了我的‘二进制’了还在出言不逊，还是说……”\n“这么辛苦地想从我为你准备的温室中出来……就只为了见咱一面吗？不如说……橘子长是想要了？”\n“我不是我没有！”我向后退了两步，那白色和浅橘构成的厚底运动鞋就只是静静站在这里，周围最高的大楼甚至都没有她那4cm厚的鞋底那么高。如此强大的压迫感，虽然还是存在胆怯，虽然还是有可能会被她一脚踩死，但是……已经顾不上这么多了。我打开伞，只是轻轻一跳，强大的气流将自己带到了几百米的高空。然而，这样的高度下，却只能堪堪到达了她的裙摆处。\n“在被咱彻底享用前，橘子长，就没有什么要和咱说说的吗？毕竟……你现在还能活蹦乱跳的时候可是不多了呢~”\n沿着不断摇动的裙摆不断爬着，看到阿卡菈伸出来的手指，我刚想逃避，可身体却像是凝滞一般动不了。“这是……你怎么还能……”在我惊骇的眼神中，被对方捏了起来，显然，对方如今有了自己的模样，相对应的，也拥有了自己的能力了。\n“咱们好好谈一下嘛，橘子长？还是说，你真的觉得就凭咱给你的这一柄伞，就能改变你身为小人和咱的差距吗？”\n身体被捏住，那柄长伞也滑落在阿卡菈的指缝间。此时此刻，对方似乎还没有要将自己置于死地的地步，或许……自己对她的威胁还没有那么大吧。那么……接下来要做的，恐怕是只能拖延时间就是了。“你……你现在怎么这么变态啊！打扮成我的模样把我困在这里自己取而代之……不会就是为了看咱在她们手里挣扎的样子吧！”\n“橘子长觉得是就是吧，只是……比起看来说，咱还是想亲自做一下……”\n阿卡菈那微微垂下的眼眸突然闪过一丝异样的光亮，很快，捏着自己的手指也距离她的脸颊越来越近。这……就算不是第一次了，自己真的是第一次感觉到，自己给小人带来的压迫感，如今却是身临其境地感受到，那种对方明明对你放水了却完全无法翻身的绝望感。“你……想做什么？就算玩也能不能换身打扮啊，这种自己被自己玩弄的感觉可不要——”我连忙挣扎着，双腿不断地踢着对方已经凑过来的脸颊。可是……有什么用吗？鞋子都差点被踢掉了，对方的脸却一点痕迹都没有，而且……这不也算是自己打自己的脸吗？\n“算了，给你一点点机会吧，只不过代价嘛……”\n“就是被咱弄死了，可是再也回不去了哦~”"
  gts_ora.1119.a:"（挣脱）"
  gts_ora.1119.a.custom:""
  gts_ora.1219.name:"《众星尽头的救赎》"
  gts_ora.1219.desc:"随着捏着自己的手突然松开，整个人坠落到了阿卡菈的脚下。看着对方抬起来的鞋底，我顾不得多想，连忙快步跑去，把插在不远处的长伞拔了出来。果然，自己的作品她都看过，当然明白这种反派死于主角频繁复活的戏码。只是……这一次，她却不知道的是，如今的自己，却早已不是过去那般羸弱。伞面撑开，我双手紧紧扶着伞柄，面对着上空这遮蔽了好几个足球场大小的阴影，我不躲不避，因为我深知压根就跑不掉。现在的我，也只能祈祷着，这柄来自于我和她心中的信仰，能够抗的住这毁天灭地的一踩吧。\n“轰——”\n“咳咳——”巨足抬起，留下一片鞋印形状的废墟，刚刚所出现的全部建筑物都已经失去了踪影，只能看到对方鞋底抬起时，在那花纹里裹挟着的由一根根钢筋藕断丝连的残垣断壁。我倒在地上，刚刚的一脚虽然有伞的帮助，自己并没有命丧于此，但是这巨足踩踏所带来的冲击力却差点震的内脏尽数破碎。嘶……这只是她踩下来的一脚，就已经如此勉强了吗？我抬头看着她玩昧的眼神，仿佛还在嘲讽一只蝼蚁敢撼动人类的鞋底一般。不行了，看来接下来的一脚不能再硬抗了。\n“竟然还能站起来呢……只是，咱就踩下一脚就已经这样了吗？”\n随着那宛如山峦一般的鞋子再次下落，这一次比上次更加猛烈，所带着的阵阵冲击，仅仅离地面几十米的高度，就已经能感觉到一股巨大的压迫感，在不断震颤着自己全身的器官。“不行，这一脚得跑……”按理来说，这样的一脚下去，恐怕作为人类来说无论如何都没有办法逃离，而我却面不改色，强装镇定地将伞撑在胸前，打开了左手处的手环。下一秒，“嗖”的一声，在阿卡菈的脚下划过了一个橘色的光线，随后装在远处的一栋大楼上，装出了一个不小的坑。“呼呼——”我拍了拍身上的衣服，重新收起了伞。看到阿卡菈脸上那一闪而过的讶异，现在，自己终于可以在她的手中应付两下了。而就在这个时候——视野却突然一黑，随后整个人却因此失去了意识。\n“我……这是……”\n再次看到了卷了边的笔记本，周围嘲笑的人群，那隐约闪过的潦草字迹却无一不揭露了当年的自己是有多么无能。只是……这一次，我却并没有像之前那般哭泣，而是默不作声地走过去，捡起了那早已空白的封皮。\n“看到了吗？以前的你是，现在的你也是，你只不过还是在追逐着她们的脚步罢了，而你……”\n“而你，不也同样是追赶着‘橘子长’的阴影吗？”\n我闭上眼，下一刻，阴云开始散开，前方的道路也骤然显现。我抬起伞向上跳去，准备跳到阿卡菈的头顶，想就此一剑封喉，可没想到的是——还没在空中飞多久，那在天空中飞着的雨伞却被阿卡菈伸手捏住，随后将自己捏在了手里。只是……从捏着的手感可以说明，刚刚的话语确实是让她的内心产生了些许动摇了。\n“如何呢？稍微和你玩那么一会，橘子长不会真的觉得，你这样的大小可以和咱相提并论了吧。”"
  gts_ora.1219.a:"（挣扎）"
  gts_ora.1219.a.custom:""
  gts_ora.1319.name:"《众星尽头的救赎》"
  gts_ora.1319.desc:"突然间，却感觉到，不断摇曳的裙摆处，却突然伸出了巨大的手掌，似乎要好好抓住自己这只不慎落入少女的裙底的小虫子。“不行，不能被她抓到……”我灵机一动，在对方的手指即将触碰到自己时——我立刻跳了下来，随后弹出气囊，在阿卡菈伸出的指尖当做跳板，对着少女那白皙的腿扑去，随后，我双手抓住伞柄，对着对方的腿猛的一戳。一瞬间，我甚至能感觉到少女的脚步都产生了一丝动摇。看来有效！我连忙在这巨大的白色肉柱上爬过来爬过去，柔软的触感使得自己只好抱的更紧了一些。只是……我不知道的是，就是这看上去像是拼尽全力的一戳，对于她而言，却和被针戳一下的结果没什么区别，可能会稍微刺激一下，但绝对论不到疼的地步。只是这一下，却彻底地惹急了阿卡菈，是啊，戏弄虫子反倒被虫子咬了一口，那这个虫子可要承担这个少女的怒火了哦。而就在我怀疑她接下来要做什么的时候，却突然感到眼前一黑——\n“轰——”\n花了好长时间，终于从刚刚那巨大的轰鸣声缓过来，却发现我早已身处阿卡菈的双腿中间，而此时，唯一的出口早已被对方拿手堵住，而唯一的入口……我可以选择不进去吗？对方在面对小人在自己的腿上到处爬来爬去的做法竟然不是伸手去摸，而去选择了更为简单粗暴的做法——直接坐在了下面还满是人群的城市里。一瞬间，整个城市都因此而生灵涂炭。\n“怎么样啊，现在还想跑吗？你要是想进这个里面咱也不反对就是的啦……”\n没有办法，自己只能被她捏了起来。“不是谁要进去这里啊！”我鼓着腮帮子，刚想站起身，却被阿卡菈一根指头就按了下去。随后，整个人都被捏了起来。“好了，橘子长不要再浪费这么多时间了，反正到了最后，你也逃不掉被咱吃掉的命运不是吗？没事的，咱会保证，会让你在被咱吃掉的过程中，变得稍微那么舒服一点……”\n“不……不要！”没有任何反应时间，这一次，对方的舌头直接卷住了自己，将自己拖入了那粉嫩的口腔中。“呃啊啊啊——”身处在阿卡菈的牙床中，我将雨伞撑在了那两颗牙齿中间，面对对方的牙齿，像粉碎机一般的挤压，细弱的伞柄看上去随时都像是岌岌可危的样子。不行，这样的话……随着牙床开始挪动，我将伞柄一斜，整个身体开始往后滑去，随后将伞收回的一瞬间，只听到“轰！”的一声，那宛如锻造锤一般的牙床也在这个时候合拢，而没等自己反应过来的时候，却发现，我早已站在了……\n“结局已定，你已经输了，在咱被吃掉之前……橘子长还有遗言吗？”\n还没等我反应过来，自己早已被阿卡菈的舌头卷入了其中。我不停地拿着伞戳着，可是现在的情况下，似乎一点作用都没有了。只是……真的没有办法了吗？而这个时候，我却突然想了起来，手机？我打开手机，却看到了这样一个消息：\n§L“橘子长已经表现的足够好了哦，接下来……”§!"
  gts_ora.1319.a:"“闭上眼，交给你所信任的‘我们’吧。”"
  gts_ora.1319.a.custom:""
  gts_ora.1419.name:"《众星尽头的救赎》"
  gts_ora.1419.desc:"“已经放弃挣扎了吗？那好……”\n将橘子长吞掉后，阿卡菈摸了摸自己的肚子，却感受不到小人进入腹中的感觉，不过也是，那么小的存在，又怎么会感觉到呢？就在她准备关闭这个世界，让橘子长彻底在她的胃里度过剩下的短暂人生时——\n“咚咚咚！咚咚咚！”声音来自于世界之外。“不对啊，咱还没有点外卖啊。”阿卡菈摘下头顶上的设备，透过猫眼向外一看——\n§M“快点把橘子长交出来！不然的话……”§!\n§E“呼呼呼，这里是7个人对你一个，所以请速速投降哦。”§!\n“这样吗？橘子长嘛……已经被咱吃了。我还是很怀念她的口感就是了。”仅仅只是隔着一扇门，阿卡菈也能感觉到，但是她从来都没有想到过，这些曾经邀请过的她们，竟然会为了一个小人而去做出这样的举动。“所以，很遗憾，你们已经来晚了哦~”\n§B“喂，110吗？这里发生了一起独居女生被绑架的案件……”§!\n§R“想好了哦，就算你现在想暴起伤人，我们的小柠檬可是练了好几年的散打的哦。”§!\n坠落，宛如在慢慢长夜中，独自一人面对着汹涌的浪潮，似乎没一次都能将自己整个人都完全吞没。我抵着伞，身体早无力迎接在她的胃里的一次次胃液的洗礼。而就在我认为自己就这么到此为止的时候——一声声呐喊在模糊的边沿，仿佛一条条乱码环绕在自己周围，将自己置入了一个气泡内，随着无数少女轻柔且熟悉的声音响起，意识也开始逐渐明晰过来：\n自己绝无孤身一人，而此地也绝非孤星。"
  gts_ora.1419.a:""
  gts_ora.1419.a.custom:"小橘子长获得特质：羁绊\n正因有着大家一路以来的牵绊，我才得以走到现在这个位置。"
  gts_ora.1020.name:"《夜间灵》"
  gts_ora.1020.desc:"你们说……人死后的世界里，会看到什么？\n很难回答的问题，至今也没有任何一个人，能够当着我的面回答过我的问题。不过也正是因为这样的原因下，才让这个看起来再简单不过的问题，成为了未解之谜吧。\n倒塌的楼房，四处飞溅的残骸。呼喊声伴随着他们的血迹，十分粘稠般地糊在了一起，却在逐渐黑下去的视野中，拉长到一点点失焦。新鲜的莓果在枝头上，随着风或者远行的愿望，却只是在路过之人的足下，轻轻踏下，留下了模糊不堪的鲜红汁水，糊在了那脏污不堪的鞋底的痕迹中。\n却拓印了作为一个渺小的存在的呼号与无望。\n灰白色的喷枪，和初雨后的泥水喷洒在了洁白的画布上。而随后，画师沾起一点点颜料，想作出点睛的一笔——“啪！”谁家小孩的彩弹枪，此时正好有那么一发不偏不倚地打在了画板上，飞溅而来的红色颜料星星点点地泼在了这抽象派艺术的画作上，却再也不需要任何的笔墨。\n至此，画师凭借着这幅画获得了不少的殊荣。有人说这是雨后初晴的泥土中正在含苞待放的花朵，有人说这是岩石上，地衣中那无忧无虑啃食的瓢虫。当然，一幅画的含义也就在每个人的猜测中，身价也随之水涨船高。只是……\n我不知道，如今，看到如此的画面几万倍地投射在卫星投射下的地图上，这幅画的存在，多少带着那么一丝触目惊心。\n是预言？还是蓄谋已久？无人可知，人们只想要一个发泄口。只是……哪里还有能让画师锒铛入狱的机会呢？在全球各地激烈的讨论和恐慌中，夜幕降临。我却突然如梦初醒般，拿起手机，打开了这幅旷世巨作：\n“你说……这个棕色的痕迹，怎么看……怎么像前几天小橘踩在门上的鞋印子呢？”\n智者自诩自己睿不可当，而愚者总会找到比自己还要愚笨的家伙。总而言之，二者没有什么区别，因为……在这幅画作下，在那个星星点点灯光覆盖的城市中，仅仅一脚，仅仅一踏——整个城市都会为那个鞋子而尽数灭灯。\n你们说……人死后的世界里，会看到什么？\n答案是看不见，我不知我为谁，也不知那些灾难为谁。只是知道……天灾灭临当前，蝼蚁尚且无能为力。\n跑？撤？打不了，撤不出，五条车道被拥挤的车流堵死，最终化为了属于那些带有偏见之人的坟茔。这可笑吗？你为什么能够看到我早已控制不住的嘴角？不，可笑的绝对不是那些蝼蚁的临死前挣扎，而是行刑者在临刑前，对这个城市的死亡宣告：\n“今天上午……是不是你在背后蛐蛐我了？"
  gts_ora.1020.a:"？？？"
  gts_ora.1020.a.custom:""
  gts_ora.1120.name:"《夜间灵》"
  gts_ora.1120.desc:"多么朴实无华的理由，我们甚至不知道她究竟姓甚名谁，毕竟……已死之人又何必在意这些。当然，她也不会在意我们到底是谁，毕竟神明才不会记得蝼蚁之众的名字。只是需要理由……甚至连这个理由都是play的一环，而这里的所有人，都会为此承受来自天灾降临的毁灭。\n是啊，人群中已经开始恨起来了，在这灯红酒绿的城市中，人的偏见总会遮蔽那些无关紧要的东西。而在大难当前，这些虫豸才会展现出自己本来的那一面。\n什么？你是说这一切都是她的所作所为？笑死。大楼的倒塌是远处飞来的炮弹，四处飞溅的血迹是战车的倾轧。而她却只是，在看完这一场蝼蚁间的闹戏后，抬起脚，为此留下最后的收尾。至于那些无辜者……又有谁可置身事外呢？\n你们说……人死后的世界里，会看到什么？\n是漫漫长夜，看不到世界尽头的黑暗，没有一盏灯为自己而明，却每一盏都在照着自己的丑陋和恶俗。\n罢了，我又何尝不是……那些蝼蚁中的一个呢？在那个存在的脚下，在那个一看就不可战胜的家伙的脚下。甚至想多活那么一秒都是无望的奢求。罢了，踩着令脚掌刺痛的瓦砾，宛如披麻带枷一般，我试图跪倒在地，渴求此处的灵魂得以升天，却早已发现，自己哪里还有身体这一个概念？\n或许……这只是一个梦，一个在长夜中的幽灵所做的梦，而梦的名字：\n却是对明天，对力量，对未知的“恐慌”。"
  gts_ora.1120.a:""
  gts_ora.1120.a.custom:"小橘子长获得特质：自知\n我是夜间的幽灵，却也是笼罩孤星的长夜"
  gts_ora.1021.name:"《从1cm开始的异世界生活》"
  gts_ora.1021.desc:"我梦见了一片焦土，那是被陨星轰袭后的村落。天上的陨石砸向地面，房屋尽数损毁，人们开始逃荒，可母亲……\n我找不到了。我却只能够在被大火燃成灰烬的村落中，将意识化作无用的柴薪。然而，在醒来之后，却发现身处一处洞穴中。\n暗红色的墙壁，软乎乎黏糊糊的，却令人怀疑这是不是某种巨型生物的阴穴。然而，在这里，我却认识到了改变我一生的人：\n一个看上去比较年幼的龙娘，紫灰色的长发，却在我当时的存在而言，如同母亲一般的存在。而我也因为她的抚养，成为了如今这样的存在。\n“乖，听话啊~”\n躺在母亲的脚踝旁，我记着那是我高烧不退的那天，龙之谷内的环境比较阴湿，确实不适合我这个人类生存，然而，母亲却将渺小的自己捏了起来，是的，她的手掌很柔软，似乎在其中自己就感觉不到什么痛苦。我搂着母亲的手指，意识也在逐渐模糊，甚至都不知自己是什么时候痊愈，也不知为什么从这次高烧之后，身体却逐渐适应了这里的环境。\n“别着急，睡醒了，母亲还在哦~”\n每晚，每夜，我记不清昼夜是如何变化，只记得岁月的轮转间，我都伴随着母亲的怀抱中入睡。只知道在记忆的最后一天，却突然戛然而止般，母亲为我新换了一套衣服，却是在为我启行。\n“乖啊，没有母亲的话……要学会自己生活哦~”\n我本应该是巨龙豢养的孩子，却在我8岁的那一刻，被迫来到了属于人类的城邦。却好累，好饿……\n火球在少女手中连发，宛如密集的弹幕，街边的水果摊在这一刻掀开，人群四散而逃，只有少女坐在还留有余温的水果摊上，怀里抱着烧焦了的水果，丝毫不在意衣角处的点点火星。而就在这一刻——\n“小家伙这是……饿了吗？”\n就这样，在妖精姐姐的帮助下，自己来到了此处魔法学院，却也只研读了两年，就草草的结了业。原因无他：这群人都认为我是个“怪物”。\n“施法……你施法呢？还有你怎么别的学科都是0分？”\n又怎么样呢，无论如何，似乎自己都只会最基础的火球术，却有着常人难以理解的施法间隔，甚至快到了将火球连接成密集的弹雨。只是……在外人看来，我的存在都是彻头彻尾的偏科怪物，却在冒险者协会里，自己再一次受到了青睐：\n“没事，咱们这里不讲那些，劲大就行！”\n“没事，当那么些花里胡哨的人中出来一个只会火球术的人的话，咱们就得看看这个人的火球术是得有多么厉害了……”\n火力，过快的射速，宛如异世界的重机枪一般，将所过之处的魔物尽数消灭，如此强烈，暴躁，甚至可以算的上是喧哗。或许……也正是这样的原因，虽然本人并不怎么喜欢在这样的场合说话，却也是被人赋予了这样的名字：哗之。\n“你的意思是说……最近新发现的迷宫……龙之谷？”\n“是啊，不过这里面有规定，因为这个迷宫太过凶险，所以没有三人小组是不可以……啊不是，蓝小姐，我们不是看不起你的意思……”\n自离开了母亲之后，我再也没有找到那个地方。或许……我确实应该去看一下，但是……最近收养的小家伙，算了，还是不要带着她一起去送死了吧。我确实是这样想的，也确实有很长一段时间动过要让她独立的机会。毕竟只要会了一点点魔法，就可以在埃维拉城里生存下来……直到我在魔法学院的书中发现了这样的故事：\n世界的本质是沙漏的倒带，而名为“杜蕾因（尼德霍格）”的巨龙在沙漏的底端，将世界倒转……自此，世界终有一天会被她吞噬殆尽。"
  gts_ora.1021.a:"等母亲拒绝了自己的‘命运’，就能再把你接回来了…… "
  gts_ora.1021.a.custom:""
  gts_ora.1121.name:"《从1cm开始的异世界生活》"
  gts_ora.1121.desc:"“滴滴滴滴——滴滴滴滴——”\n我睁开眼，却看到窗外天还蒙蒙，一看手机，好家伙，五点，谁定的雷霆闹钟。可是，不知道为什么，总是感觉像是经历了些什么一样。\n看了一眼手机里的内容，除了一个月前录用通知的消息外，剩下的也是些无关紧要的事件，算了，就当是一场梦吧。我躺下床，正准备再睡一觉的时候，却看到床头处，枕头底下多了一个什么东西。\n是信封。甚至还能闻到淡淡的墨水香气。这厚度一看就不像是自己的工资单，我打开信封，看了一眼内容，却不禁会心一笑。\n原来……我经历的一切都不是虚幻：\n致：橘子长\n或许这封信你难以收到，收到了也很难再回信吧，但是没关系。\n巨龙造成的威胁已经清除了，我和小粉现在也回到了自己的生活中。只不过，我现在并没有再去养第7个小宠物的打算啦。如果橘子长能回来的话……也可以继续当咱的小宠物哦，咱这个主人还没当够的说。\n不开玩笑啦，经过这些事情，你现在已经和我一样，是一个S级的冒险者了哦，而且，咱也帮你要了一个新的身份：埃维拉城自由公民，现在的你已经不再需要咱这个监护人了哦。也可以做些你喜欢做的事情了。\n其实这里还有很多地方可以玩的说，七芒啊，凡尔诺登啊什么的，还有我看你的服饰有点像东陆那一块地方的……等你回来着咱也想好了，要带你好好出去玩一会，咱现在已经开始攒钱了。\n至于母亲的事情，从这次事件开始，龙之谷算是彻底没了吧，杜蕾因也和咱住在一起了，还有我也找到了自己原本的家人，她们都过的不错，就是离的有点远……\n总之，纸牌的最后一页，我们随时都会等你回来哦，\n你一路上的伙伴，蓝哗之。\n信封旁，那把长伞和床头柜的纸牌，或许没有人能够知道她的故事，但是这些却是我在异世界游历的证明。如果终有一日，自己并不再是异世界的行客，也不再被任何人所记起，甚至连自己的名字都会因此而丢失掉。\n但是……每当这个时候，试着将沙漏倒转，去写下新的命运吧。"
  gts_ora.1121.a:"（捡起纸牌）"
  gts_ora.1121.a.custom:"该星球将变为盖亚星球\n小橘子长获得特质：命运\n当沙漏倒转，剩下的交给自己的笔和剑。\n§B但不用担心§!\n§P这一路上总会有无数人，无数故事§!\n§M去证明你的存在§!"
  gts_ora.1023.name:"《然后……未来是？》"
  gts_ora.1023.desc:"“原来……那个橘子长……那个我已经做过那么多了吗……”\n自此，她的经历已然写下了厚厚的一沓，却不再是小橘子长能够承受的范围内。\n她经历过一个已死之人的无能为力，也见证了她幻化为神。\n她见过糖霜撒满的理想国，虽然虚幻，却也收拾着心情去准备着醒来。\n她的伙伴曾离她而去，只留一人囚禁孤星，但这一切都是表象，等待着自我和伙伴的羁绊。\n她也见识过来自未来和未知的恐慌，却也鼓起勇气，拾起笔向前走着下一步。\n她何尝不是死过一次的人，那她自然明白“失我”的代价，也明白找到自我的宝贵。\n她抱住书页，仔细地记得书中的一字一句。\n总之，一瞬间遭遇了太多经历的橘子长，现在正倒在了一处公园的长椅上，而现在的你，即使以一个小人的身体，处于一个遍地巨娘的地方，也只能抱着橘子长的手指，等待着她，陪着她走过属于她的故事。\n\n“emmmmmmm……我睡着了吗……”\n而等待了许久的你终究还是看到橘子长醒来的模样，而你也看向了她怀里抱着的手账本——这是原本的橘子长留给你的东西，而如今，原本空白的纸上却出现了更多的字目。\n而后面的故事……想必你也已经知道了。经历这一切之后的橘子长,,,,,,却因为一次机缘巧合之下加入了自己的帝国。那接下来："
  gts_ora.1023.a:"是时候接她回家了。"
  gts_ora.1023.a.custom:"遗珍“她所赠予的手账”更新，“未来”可以点开"
  gts_ora.1024.name:"远星追忆"
  gts_ora.1024.desc:"经历了这些事情后，小橘子长似乎变得好多，也开始逐渐显现出她作为“万雌王”的一面。或许……如果事态就这样下去的话……她完全可以作为帝国中的那个，你心中的那个优秀的行政官。只不过……\n有一天，你在窗外，却看到橘子长坐在孤星监狱的外围，也就是那一片旧城区中，手里多了一本不知从哪里弄来的笔记本，似乎在记着些什么。她身下的那栋楼房似乎要有坍塌的痕迹，不过还好，此地原本就早已废弃，现在不过是帝国分划到橘子长的后花园罢了。只是……你却感觉到，倒是她如今这般……作为泰坦级巨娘的大小，才更应该适合这样属于她自己的区域。\n“你来了？我在想……在记着最近发生的事……可惜文笔是比不过本尊啦……”\n你趴在书页中，却意外的看到了页脚处的留言：\n“自我闭环……我如果能够试着打破这一切……”\n\n“啊这个啊……”似乎橘子长看到了你的疑惑，她连忙将那几个字挡住，将你轻轻推到了页眉。“我时常在想……既然我做不到她的文笔……要想打破这一切的话……可能……可以为我适配一套舰装吗？”\n你明白了，她想通过这样的手段来弥补自己和本尊的差距，只不过……即使原本的橘子长只是一介文官，天体级的大小差距却不是只靠一个简简单单的舰装就能够解决的。毕竟……你见过她的真正实力，是可以在转瞬之间像吃掉一颗樱桃一样吞掉一整个星球的恐怖存在。而你在检查了她递交的申请材料后，却察觉出了一丝不对。\n这却是一艘只加载了基础武器，却带着大功率搜索模块的舰装，显然，她要做的事情，已然十分明确。\n“你要……去找已经失踪的另一个橘子长？”\n小橘子长点了点头，而得知这个消息的你，也做好了决定"
  gts_ora.1024.a:"那就，接她回家吧。"
  gts_ora.1024.a.custom:"（发起局势：小橘子长舰娘改造）"
  gts_ora.1124.name:"武器模块"
  gts_ora.1124.desc:"作为武器……原本的橘子长并不需要武器，但是目前失去了天体级的大小，那也必然需要一个强大的武器才行。只是……在你思考什么样的武器适合橘子长的时候……\n你却在杂物间中翻找出了那把浅橘色的长伞。\n长度约为一米二，重量却比以往还要轻盈。只是……原本作为天体级的橘子长手中，这把伞也跟随着她变得能够横跨大半个银河。一把伞或许难以作为武器存在……却是最为适合小橘子长的存在。"
  gts_ora.1124.a:"希望小橘子长能够用的顺手一些"
  gts_ora.1124.a.custom:""
  gts_ora.1224.name:"探测模块"
  gts_ora.1224.desc:"常规的战舰难以承担大规模的探测工作，不过还好，在抛弃了繁重的武器配备后，你终于在橘子长的身上安装上了原本作为科研船的探测模块。虽然这样对于她的算力会有一点负担……不过要想找到原本的橘子长……这也是必要的手段。"
  gts_ora.1224.a:"希望橘子长能够承受下来"
  gts_ora.1224.a.custom:""
  gts_ora.1324.name:"装甲模块"
  gts_ora.1324.desc:"在数次装甲对抗中，你却发现，作为泰坦级巨娘的限制，作用于橘子长的任何装甲在歼星级别的巨炮面前，却都如纸片一般脆弱。但是你显然清楚，无论任何情况，不视任何代价，在这份面临天体级巨娘，几乎十死无生的情况下，能够增加任何一点防御都是对橘子长的保障。而到了最后……\n“我决定亲自承受。”\n尚未改造完成的橘子长，走到了那比她还要大的炮口前，并下令开火。\n无人敢进行拦截， 毕竟没有人能够知道这一炮下去究竟如何恐怖，也没有人敢下令开火，甚至驾驶着歼星炮的人员都不敢按下发射按钮，毕竟没人知道在此之后，橘子长能否还留有完整的尸体。\n最终，可以令星辰碎裂的一炮，发出的震撼足以将一旁的星球偏离了1cm，但奇怪的是，在那毁天灭地的激光束击中她的胸口时，橘子长却奇迹般的拦下了此次炮击。\n不能用物理学解释，也难以让任何人相信，这种概念级别的防护却如同底层代码一般，令此前的一切准备都成为摆设，或许……"
  gts_ora.1324.a:"准备的这些材料都多余了"
  gts_ora.1324.a.custom:""
  gts_ora.1025.name:"建造完成"
  gts_ora.1025.desc:"在这一系列的改造结束后，橘子长从中走了出来。很难想象她是经历了什么样的觉悟来弃笔从戎，也很难想象即使未来的自己总有一天会替代掉自己，却仍然做出这种选择。\n或许……这就是创造出橘子长的那个人的想法。哪怕自己的未来并不存在，哪怕自己的消失也只不过是为了让更好的“自己”取而代之。但是，无论如何，看着星海间正在待命的橘子长，或许……这就是执念的力量吧。"
  gts_ora.1025.a:"相信这份执念，能够得偿所愿。"
  gts_ora.1025.a.custom:"会生成一个舰娘（小橘子长）并且和领袖小橘子长绑定。"
  gts_ora.1026.name:"探测发现"
  gts_ora.1026.desc:"执念到了一定程度，就能让她到来。既然如此……在巨型结构“缘阵列”和已经改造成舰娘的橘子长的双重作用下，你终于在宇宙边际找到了一处信息，却让人感到如此的恐怖：\n“被你发现啦，来自过去的……我。”\n“想必你也看过那片无忆虚幻的梦界，你也知道，我们，就像每一个橘子长手牵着手一样，将时间构成了一处闭环。”\n不过现在……抱歉啦，原谅我的一意孤行，因为啊……\n这个世界有着各种不可抗力因素……所有我不得不放手了。所以……来自过去的我，请做好自己，拉好彼此的双手哦……\n\n“……”\n你听到小橘子长的沉默，却并不是妥协，却是等待着爆发的时机。你很想靠近她，安慰她一下，却担心她泰坦级巨娘的体型。不过过了许久，她却恢复了平常的模样，尽可能压着轻轻的语气说了一句： \n“报告，已探测到目标位置，为星海边界，超空间航道已开启，是否出发？"
  gts_ora.1026.a:"“护航舰队听令，出发！”"
  gts_ora.1026.a.custom:""
  gts_ora.1028.name:"诸行之错，皆因“无能”"
  gts_ora.1028.desc:"战舰行至星系内，却突然断开了一切通讯，果然，常规的探测手段在此都形同虚设。随后，铺天盖地的虫群席卷了整个星系。\n只是虚空虫而已，放在较大的帝国都能算上不值一提的小灾害。但是，在这般孤立无援的境地里，数量却将一切碾压。[event_target:gts_ora_2_system_first_leader.GetName]正在奋力抵挡，化解了一波又一波攻势，可如果再次纠缠下去……\n而就这时——小橘子长却做出了痛苦的表情，她似乎能感觉到，那个和她同源的少女正在与未知的力量厮杀。而你却只能陪在她的身边，一边让（[event_target:gts_ora_2_system_first_leader.GetName]）清理着更多的敌人。 \n“我……我看到了……”\n小橘子长到底看到了什么？\n“你不是想找橘子长吗？她可是在这里哦。”\n说罢，宛若神明的少女的手中却凭空里出现一个小笼子。里面的橘子长双眼呆滞，披头散发，衣服破破烂烂，已是待宰的羔羊一般——她已然失去了一切的手段，此刻却已经可以称作是神明的点心，或是零食一样的存在。\n“阿巴...阿巴...”\n双眼涣散，嘴中已经无法组织语言。让你看的内心有些战栗，两条腿悬在空中止不住地打颤。这...真的是橘子长吗？这真的是……自己内心那个什么都能做到的橘子长吗？\n“怎么不是呢？只不过...”神明眯起眼睛，坏笑道：\n“只不过……人家可是和你一样，从始至终，都是彻头彻尾的废物罢了。”\n说完，柠檬伸出另一只手，把橘子长连同牢笼悬在了自己的血盆大口之中。\n“不...不是这样的！”\n你哭着，大喊着，但是被捏住身体的两根手指却有种不可撼动的力量。就这么眼睁睁地看着这个少女就一点一点点地落进了深渊中，再也没有了回音，仿佛在大海中填入一粒尘埃。\n是啊，19142037次尝试，却还是这种结果，宛如亘古不变的“永恒”一般。直到“时间”的指针在此断裂，“空间”的维度也如断了弦一般，再也托举不住任何的希望。\n小橘子长感受不到这样的痛楚，却也只能饱尝于此，拖着沉重的躯体步履蹒跚，而就在此时……\n“你要永远相信……剑指巨龙的少女绝不是因为她能做到……”\n“而是有着必须要去做的理由，有着必须要去守护的人。”\n“所以……感觉到这把伞的分量了吗？”\n“……”\n长伞于少女手中显现，却有着令天体级的（[event_target:gts_ora_2_system_first_leader.GetName]）都刮目相看的力量，仅仅只是简单的挥砍，宛如学徒一般的剑术，却令无数虫群因此闻风丧胆。不过，这些虫群却不是什么具有同理心的家伙，纵使小橘子长已然恢复……不能让战线拖的太久，而小橘子长似乎也意识到了你在想什么——\n“走，这里！”\n选项：向此方向突围！"
  gts_ora.1028.a:"向此方向突围！"
  gts_ora.1028.a.custom:""
  gts_ora.1029.name:"空忆无缘，皆作“虚幻”"
  gts_ora.1029.desc:"“过往所行……皆忆无灰……”\n顺着小橘子长的指引，你们成功突围。而随后，你也注意到她一开始的不对劲……她的手……怎么这么凉？\n“你刚刚看到了什么？”你不禁问道，可少女的眼神却在逃离，似乎是不想让你看到你担心她的样子。只是这个样子……她的模样真的不能让你放下心来。\n“别隐瞒了，这样对我们都不好……”你叹了口气，说出了这句话。而也就这个时候，橘子长看了看你的双眼，思索一般，决定坦然说出了她刚刚看到了一切：\n\n“我曾做着这样的梦，糖霜撒满的理想国。”\n\n月影照在浅蓝色的窗棂前，有些清冷，也带着一丝空虚。今天……又没有找到食物，却在无数足底的踩踏间七零八碎地凑齐了这些。好饿……我尝试啃了一下雪糕棍，甜甜的，似乎能感受到少女口腔的芬芳抚摸着奶油一般。只是，甜腻过后，却是梦醒一般，感受不到一点热量和饱腹感。呜……\n身体愈发无力，可画上带着麻花辫的少女轮廓却是一点点显现出来，是一个很可爱的女孩子。或许……自己长这个样子？想不出来的我对着窗户发呆，却因为身高够不到上面的玻璃，因而看不清自己的长相。算了，自己就是长这样好了。那么，起一个什么样的名字好呢？\n“想吃饱……想变得很厉害很厉害……”\n橘子长，一个名字在脑海中浮现，却突然化作一丝清甜，甚至能感受到柑橘的汁水一般。是收获，是自己对未来不再挨饿的祈求，是愿望，是自己在梦中不断追寻的明天。\n“早点睡吧……说不定就感觉不到难受了……”\n\n“醒来了？”\n少女的声音宛如远方的风，带着一丝小小的玩弄，拨开了早已年久失修的心弦。“我……姐姐身上……暖和……”话说到嘴边，脸却不自觉地红了起来。说起来，自己有撒谎的必要吗？自己就想投入她的怀抱中，感受到这份仅赐予给自己的温柔中。只是……不知为何，心中的羞耻却将话说出口的一瞬间，编织成内心里最柔软的模样。\n“这样啊……那好哦。还有，现在是时候去……找那个‘橘子长’了吧。”\n她似乎能包容自己几乎一切的任性，就像自己所做的一切在她的眼里都像是在表示自己很可爱一样。我点了点头，爬上了少女伸出来的手指，似乎这会是一场旅程的开始，只是……在她的上衣兜中，我却开始动摇，就像即将远行的蒲公英一样，在临行之际，还在眷恋着自己所在的那片花园。而我……在害怕，害怕美梦的糖霜被记忆剥落。\n“那个……我又不想去了。”\n是怯懦，也是对少女身体的依赖。只是……少女并未追究这些——\n“那好吧，那么……咱还有一个小小的问题呢……”\n“小家伙……想永远和咱在一起吗？就让咱这样养着你……”\n“咱带着你一起上学、放学，陪你玩各种各样的游戏……咱们的时间会很长很长，玩法会很多很多，感觉每一天都会变得不一样呢。”\n是少女为小人许下的约定，就像一场被人精心培养的胎床一般，不必考虑痛苦，也不必承担责任。只需要将身体，在她张开的口腔中静静躺下，感受到唇齿间对你的悉心照料——她不会再将你一口吞掉，这是她给予你的保证。而你，也只需要在她的口腔中，感受被舌苔轻轻托起的感觉，就像……\n将身体置的真空一般，如此虚幻。\n梦醒，无处可去。显示屏晃的睁不开眼。一看时间，三点，却不知是何时而写。手指放在早已脱漆的键盘上，有些按键早已老化，不听使唤地折磨着手指的耐心。直到最后一字，将一切全部投稿，身体疲惫地倒在了床上，希望能再次沉到那裹满糖霜的梦里。\n然而，却抓不住，宛如被打碎的万花筒般，先前那些华彩乐段再也无法奏鸣。我看着灰蒙蒙的窗外，将要拂晓的天看不到一点温暖，甚至我自己都无法预见，迎接自己的，是黎明？还是永夜。\n\n“如果真的能，哪怕是刻意为之也好。”\n“将一切痛苦都剥离，只剩下被甜蜜淹没的乌托邦，糖霜撒满的理想国。”\n“但这样……真的算美好吗？”\n“至少能……骗一下自己吧。”我拿起手机，却找不到联系人，懊恼之余，却只能在某个不知是谁的消息中，标记了一个“未读”。"
  gts_ora.1029.a:"“睡吧，但愿一切能如我所愿。”"
  gts_ora.1029.a.custom:""
  gts_ora.1129.name:"空忆无缘，皆作“虚幻”"
  gts_ora.1129.desc:"睁开眼，天已然来到了白昼，可这也就意味着，自己还是没找到东西吃。梦终究还是要依附于现实的吧，自己的肚子这样说道，我看了看周围，却只是能在雪糕棍上的图画上，看到了少女的一角：\n整齐的深黑色短发，整齐的学生制服，此时正坐在旁边，怀里抱着的却是自己梦寐以求的东西：这米饭白花花的，似乎只需要一粒就可以让自己一整天不再为食物担忧。只是……本能早已超脱理智，却一个没留神，也可能是身体比较虚弱的原因，朝着那片白花花的美好中，倒了下去——\n“唔……好黏——”\n细腻的糯米团子，撒满的粉色糖霜让自己动弹不得，而随后，随着一阵失重感，在少女张开的口腔中，没有任何可以逃离的余地，那个想找点食物的小人，却——\n却在少女不知不觉间，成为了她的食物。\n被吃掉了，没有一点可以改变的余地。似乎这才是自己应得的结局，也给现实留足了面子。只是……怅然若失的感觉，仿佛身体也早已被胃液洞穿一般，自己……真的喜欢这样的梦吗？\n已经不再能让自己睡下去了，看着7点的闹钟已然准时的想起，我披上大衣，赶往了早高峰的洪流中。\n梦，那么奢侈，以至于会是仅此一次的一生。\n而当你意识到这一切都是虚幻的时候，醒来时被现实撕扯的伤口却在不断的发出撕心裂肺的脉搏。\n小橘子长在这份半梦半醒中，却早已不知自己身体的存在，而自己又在何方，她捡起伞，尝试向前再走一步，却宛如踩空一般，仿佛下一秒就要坠落深渊一样。\n“梦……是虚幻的，那因一份‘梦’而诞生的我……”\n“就是最好的伪证了！”\n是的，如果任由这样的声音涌入，橘子长也会因此迷失，只不过……\n“橘子长……这个名字就是你的了。”\n纵然梦是如此虚幻，纵然这现实是如此沉重，而她也看到了，即使只是几个凡人，也会选择在神明虚构的梦呓中，将枪口对准自己，只为赌这把老旧左轮的六发子弹。\n我曾做着这样的梦，糖霜撒满的理想国。\n梦，是心最柔软的眠床，既然如此，请放心将自己最脆弱的一面展开。\n然后，在第二天，带着收拾好的心情，明天见。\n“走吧，我不是某人赝造的幻想……”\n橘子长捡起掉落的长伞，走在了被净空区域的航道上。\n“因为我是因为你的执念而诞生的……橘子长。”"
  gts_ora.1129.a:"总之……没事就好"
  gts_ora.1129.a.custom:""
  gts_ora.1030.name:"“孤立”无援，以念作帜"
  gts_ora.1030.desc:"虫群的影响越来越多了，纵然身为天体级的[event_target:gts_ora_2_system_first_leader.GetName]，也难免会被虫群团团围住，虫群爬上了[event_target:gts_ora_2_system_first_leader.GetName]的腿上，开始向上爬行，似乎将她的身体当做了可以侵略的殖民地。[event_target:gts_ora_2_system_first_leader.GetName]捂着自己的私处，开始清理起自己的身体，却被更多的虫群围住。\n而小橘子长也并不好过，无数虫群开始攻击你所在的战舰，小橘子长拼命抵挡，尽可能将渗入战舰内的虫群消灭，来保护你的安全，可是，你也看到了橘子长的无力，不过，就在这千钧一发的时刻——原本还在猖獗的虫群却突然四散而开。怎么回事？\n\n“我闭上眼睛，准备着出狱之后的打算，只是这次，和过往不同的是，我不会再选择躺平摆烂，而是……让她给自己一个交代。\n“链接……链接断……断……”\n“链接断开。”\n我……逃出来了？\n熟悉的场景，熟悉的大小，果然……但是我在意的并不是这个，而是……她到底成功逃出了吗？\n“3000000份数据如流沙般飞过，唯独你，让她找到了救赎。这是你的想法吗？”\n不对，这个声音是……“咳咳……”我强忍着疲惫的身体站了起来，还好，大小稍微恢复了些，虽然，在“她”的面前，自己还是如蝼蚁一般。\n“所以……她出去了吗？”\n“你当真觉得，你有对咱发问的资格呢？自以为是的小家伙？”\n令人窒息的感觉，只是略微靠近两步，身体仿佛是完全被她任意把玩一般。而造成这种压迫感的，却只是少女抬起了那一眼望不到头的手指，轻轻压在了自己上空。\n天空已然变为了一抹黑白，少女白色的麻花辫在星海的染色下变成了一片惨灰，而靛蓝色的瞳孔，却宛如俯视着自己赝造的世界——一个她亲手创造的孤星。\n“以你的自身为圆心，妄图任何人都围绕着你来转……其实，咱还是喜欢着你跪下来舔咱鞋底的样子……只是咱有洁癖，见不得脏东西呢。所以……”\n“自以为是，自欺欺人……到头来……”\n两句话，却将小人彻底地从她的手指下抹除。连带着少女的指尖处，大片的大陆因此毁灭。造物主的实力就是如此，也理所应当如此。而做完这一切后，少女抬起鞋子擦了擦，走到了电脑旁，在显示器发出的白光下，少女白色的麻花辫却显露出一丝生人勿进的感觉。\n而后，少女一言不发，只是默默地将账号的名字，从“橘子长_Ora”，改为了那恐怖的“橘子长_Alka”\n“故事结束，想必在场为数不多还留在这里的观众，也在为这个笨蛋留下的荒诞结局而感到很失望吧。”\n“难怪呢，谁让她就是如此，外表光鲜实则内心早已腐烂的烂橘子呢？”\n“或许……这样的烂橘子……也就是在未来的某一天，独自枯萎下去，才是你理所应当的……”"
  gts_ora.1030.a:"“你绝无独自一人。”"
  gts_ora.1030.a.custom:""
  gts_ora.1130.name:"“孤立”无援，以念作帜"
  gts_ora.1130.desc:"是啊，你绝无独自一人。\n她曾独立面对神明，但这绝不是她自己一个人的力量。而是所有人，每个人给予了她依赖，帮助，以及最为重要的……信念\n“永恒”的诞生只需一份执念，她将超脱时间，空间，超脱一切物理法则，一切因果。当然也包括体型和力量上的差距……\n“时间”的尺度还有很长，在十二点的钟声前，先休息吧，我为你将此停摆。\n你的“记忆”比任何繁星加起来都要璀璨，所以……请珍惜，哪怕要为此负荆挂棘……\n不要感到痛苦……那是“法则”为你加诸的冠冕，此刻……你已宛如神明。\n“那就让“终焉”，为你的敌人写下星海间的安魂曲。”\n“最后……”少女举起长伞，面向对方这般超越天体，超越星系，甚至万界的造物主——也是她旧时的至交。\n“而在我写下的‘空间’中，你，想不到我身边会有多少人。”\n\n尘埃散去，虚假的幻境已然被少女撕裂，而前方的虫群也在瞬间将你们团团包围。不过……在橘子长和[event_target:gts_ora_2_system_first_leader.GetName]的帮助下，或许这一切……都将是一定能度过的难关。"
  gts_ora.1130.a:"继续前进。"
  gts_ora.1130.a.custom:""
  gts_ora.1031.name:"求神无望，空余“恐慌”"
  gts_ora.1031.desc:"她曾经看到过，一个因梦而诞生的星球，星球的原住民欣欣向荣的发展着，也接连诞生了自己的文明，可这一切……却在一场来自天外的冲击下崩溃。\n巨娘傲人的身躯，似乎整个星系都容纳不下她的身影，而渺小的生灵却无一丝可以抵抗的权利……横跨数个大陆的足印下，小人的一切挣扎又显得是如此儿戏？在文明即将覆灭的前夕，她能看到政府宣布的无条件投降，随后在摇摇欲坠的内阁下，像个三岁的孩子一般嚎啕大哭——\n恐慌，那是源自生物体内最直接的反应。哪怕只是刚出生的婴孩，还是年过耄耋的老者，此刻面对那般庞然大物，那个横跨整个天穹的足底……\n每个人都会“怕”，这不可怕，可怕的是……面对这样的怕……要怎么破局？\n孤星监狱……还是老样子，但是在那根吸管插在了海面后，此地却早已成为了一处死星……整个星球已然没有小人的生活痕迹，也没有任何生命迹象。或许……已经被某个路过的巨娘随手消灭……还是已经研究出载人飞船移民到别的行星了？\n城市的模样仍在，仍然能依稀看到当年生活的痕迹。少女看了一眼当时插上去的吸管。这么多年来，这颗孤星仍旧没有经受过任何巨娘的染指……除了她自己。\n天空已然暗淡，你透过简易的天文望远镜，看到了在那个高天之上的真正面目——那只是一个外观17岁左右的少女，而她此刻只是轻启双唇，大量的星球则被直接吸入口中。是的，是吸入。而你很清楚，你，包括你所在的这颗，或许是附近几个星系内唯一的孤星，也会面临着进入到这位“少女”的身体内。此时，一切存在都将化为虚无，所有的证明都会被抹除……但是，你没有办法。你打不赢，却必须接下这一战。\n是绝望？不，是捍卫这颗孤星的决心。\n你不知这场战争从何开始，当“她”的视线注视到这颗孤星的一瞬间——一瞬间，铺天盖地的武器尽数朝着天空射出。人类的武器在这一刻，做出了最为正确的选择，也瞄准了最应该瞄准的目标——倾尽一切。是面向风车挥剑的决心，是面临风暴的面不改色，你们再向那位至高天穹的存在证明一个道理：你们绝不是虫豸。然而，你们所做的一切手段，却无法对这颗天空之上的瞳孔有着任何变化。地面开始生成怪物——是的，不是天降也不是孵化，而是凭空生成。她们虽为人形，却有着比人类庞大几十倍的身躯。所过之处，以往的城市在这样庞大的军团中被悉数碾为了粉末般的废墟。所幸你们的城墙足够坚固，也足以应对这些怪物的袭击。无数只巨娘的尸骸堆砌在堡垒的外围，你们的反击得到了阶段性的成功。然而，就在你们个高层在地下组织开会，决定进行着下一步的计划时——"
  gts_ora.1031.a:"……"
  gts_ora.1031.a.custom:""
  gts_ora.1131.name:"求神无望，空余“恐慌”"
  gts_ora.1131.desc:"天黑了。\n几十亿年的恒星已然被少女一口吞下，而仅仅只有几千年的人类文明又作何抵挡？这时，你们明白到了一个道理：你们早已被这场反击战的胜利冲昏了头脑，而忘记了对方并非未开智的巨兽——那答案只有一种。\n神明……抱歉，在此地同生共死的人类早已不再对她有任何敬畏。人类只想让天空中这个自命不凡的家伙在吞掉自己之前，用手里的武器给予对方迎头痛击——而在这颗孤星陷入永夜的第十五天后，你们却在一片人造灯光中看到了更为恐怖的东西：\n那是一尊宛如泰坦巨兽的存在，仅仅只是一步的距离，即可跨越以国家为单位的存在。已有的装甲车和坦克此刻却如蝼蚁一般，而手中的武器也只是如毛毛雨一般，此刻，你知道要面临什么了，你知道这样下去，你必死无疑，可眼前这个家伙在这片大陆上哪怕只是一步——都是对人类的亵渎。你拿着核弹发射钮，在一群人的围佣下，用尽心间的全部力气按响了这份最终的大礼——\n顷刻间，火光冲天，在这片慢慢长夜之下升起了一朵巨大的蘑菇云，数以万计的核弹埋藏在地下，掀起的尘雾连天空都将此遮蔽，将那位泰坦巨兽遮蔽。这是人类留下的最终手段，是以守护之名，对来犯的侵略者呼喊出的决死的高歌。火光散去，巨大的身躯倾倒，起身躯足以媲美一个国家，一片大陆。人类的挣扎在巨娘面前从来不是儿戏，而是为了守护自己的同胞而押上了自己的一切。\n哪怕……所行之事都是徒劳无功。\n泰坦级巨娘绝不是她唯一的杀手锏，但人类却为此拼尽了自己的一切。\n就在某一天，你看到了一个诡异的现象：一条巨大的管道插入海面，向上连接着天空，就在你以为是巨娘打造的什么太空电梯的时候，你却感觉到不对劲：\n地面……在塌陷？海平面也在下降。而这时你才得知了一切的真相，却做不到一切可以挣扎的点：人类早已失去了光，而人类仅有的土地也要被天空中的存在当做奶茶吸走……只是为了她一时的玩弄罢了。\n最终……一切皆以无望，整个孤星的一切都被掏空，唯有晦暗的星核还在堪堪运转，在倾尽全球所有的资源打造了最后一枚钴弹后，你们却没选择按下按钮——而是直接引爆。\n“自此，孤星并未落入少女口中，而是直接爆炸，来代表人类最后的不妥协……”\n\n“在害怕？”\n诚然，任何人都会“怕”，上至神明，下至孩童，世间的芸芸众生都将有着害怕的权利，面对着不可能战胜的敌人，面对着即将死亡的威胁，或是面临者来自未来的未知……少女发抖的手拄着长伞，被[event_target:gts_ora_2_system_first_leader.GetName]搀扶着站起，却全然不知衣服上早已沾满了各种各样的血肉——\n但总要有人，需要顶着自己的恐慌，只为将她身后之人的不安焚尽。"
  gts_ora.1131.a:"必须要加快速度了！"
  gts_ora.1131.a.custom:""
  gts_ora.1032.name:"“失我”传己……我已是已死之徒"
  gts_ora.1032.desc:"先是郊外的巨大脚印，而后是更加频繁的地震。大家都不知道如何，只是在某一天，这个星球的所有人都收到了同一个消息：\n中东的战争在某一天悄无声息的终止，是终止，不是暂停。各个国家的领导罕见的聚集在了一起，无一缺席，谈判却是和谐，但仿佛是被某只看不清的大手所威胁的宁静。而数个小时后，先是束缚住互联网的高墙开始毫无征兆的拆除，而各方媒体均在同一个时间喊着同样的一句话：\n各国领导决定，成立“全球命运”——世界和平了？不，接下来的消息给予了答案：\n全世界突然发了疯一般，科研，军事，生产……似乎一切都在被一场灾难催促一般，赖以生存的家园开始拆毁，转移，修建更加坚固的堡垒。加固，加固，没有材料就做，做不出来就拆，从已有的建筑物上往下迁移，只为了以自己的恐慌，铸就可以抵挡一切的高墙。更快，更高，更大……越来越多的大口径武器被制造，被装备，被运往世界各地，大量核武器被封存在地下，却没有想要发射出去的想法……至此，你似乎意识到什么，可一切似乎又有些来不及，或者说……挡不住。\n南太平洋堡垒已然建成，马奇诺防线也在堂堂复活中，整个世界都在全力运转的时候……你站在城墙顶端，看着远处早已被放弃的城市区划，而就在此刻，你终于看到了，这些高层的家伙们到底在恐慌什么：\n那是一个高达几十米的……人类？看样子确实是个唱的俊俏的女孩子。但你的心里早已万分清楚：不，这样的大小已然可以用怪物来形容，而她们却在早已废弃的城市间，似乎百米高的大楼在她们眼中，却如同沙子堆砌的城堡一般，一触即碎。而此刻，她们也显然注意到了你，正在向你的方向前进——\n“砰——砰砰砰——”\n耳边传来火药撕扯空气的轰鸣，大口径的炮弹贯穿了少女的身体，却不留情面的只能造成轻微的硬直，只能在这不断的压制下，将这堵巨大的身躯打成筛子。这时，你注意到，自己的手在紧紧攥着自己的衣角，你开始不受控制的窒息，正想抬头看一下天空时，却瞪大了双眼\n星星没了。\n不是看不到，而是彻底没了，北寒带的天空中却也看不见任何极光，而是出现了一道更加诡异的现象：\n那是……瞳孔？靛蓝色的天幕，将原有的夜色染上了一层诡异的气息。盖革表的度数正在疯狂发出警报，气温计在一瞬间报表，所有的卫星从这道靛蓝的天幕下坠落，一切的设备都因此瘫痪。失灵，短路，爆炸……似乎人类文明所诞生的一切在这道天幕下都将成为笑谈。而在这万分不幸的事实前，你终于收到了一个好消息：\n至少她会给予你一个较为体面的解脱，或许……死在少女的手指下对于她而言，也可以翻译为“解脱”吧。\n“埃维拉城……西原大陆……沙漏中的时间已然流下了最后一滴眼泪……腐蚀的巨龙将世界啃食的千疮百孔，而你……却连你的存在都维系不了……”\n“失我者啊……来自世界之外的人啊……我等待着扉页上你的落款。”"
  gts_ora.1032.a:"橘子长？"
  gts_ora.1032.a.custom:""
  gts_ora.1033.name:"星海微茫，我以剑将“虚无”斩断"
  gts_ora.1033.desc:"“在这里停下吧。”\n不知行走了多远，却早已不见周遭星辰，你至今未知，在这场宇宙边界的寻觅中，前路还有多久，而未来又是什么。\n“无能”，“虚幻”，“孤立”，“恐慌”，“失我”。这些痛苦始终陪伴着橘子长，如影随形。而她却能够承受这些……甚至接纳这些，却无人知道她要做些什么。而你却总有预感……小橘子长变得越来越沉默寡言，陷入的幻境也越来越深，而每一次伴随着痛苦的回忆随着时间倒带……你却发现，她的身影却越发变得熟悉起来……\n“在这里停下吧。”\n不多时，你却在橘子长的带领下，在一处星球间小憩。难以想象的是，这颗在宇宙边际的孤星，却仍有一课恒星守候着，照映出星球表面的潮生潮落。\n“埃维拉城……是个不错的故事呢。”\n橘子长坐在河边的一处石头上，虽然作为泰坦级生物的大小，面临着只有微生物的海洋星球下，堪称降维打击，可橘子长并不想搭理这些，而是抬起头，伸出手，尝试触摸着天空中的星星点点——却只是破碎的行星环带。\n“这则故事……为何没有讲完？”\n你很想问这样的问题，而话说出口时，却只听到一声轻轻的笑。\n“是啊,,,,,,这则故事，为何没有写完？”\n“埃维拉联邦、七芒帝国、凡尔诺登意志……这个世界观如此的庞大，只可惜。”\n“这篇的作者，在写到最后一篇文章的时候……死掉了啊。”\n你不得不思考起来，也在为了故事未能完结而惋惜，只不过……橘子长却从湖面下，将那把在埃维拉城捡到的纸牌扔向了湖面。顿时，一道星门就此展开。\n“好了……你们，回去吧。”\n“回去？”\n你难以想象橘子长在说什么，但是看着她的眼神，却显得这件事情有着难以拒绝的余地。虽然……\n“是啊，”橘子长闭上眼睛，似乎在享受着属于她最后的时间。\n“我们，就像每一个橘子长手牵着手一样，将时间构成了一处闭环。所以……”\n“我……要试着松开一只手，然后把她拉回来啊。”"
  gts_ora.1033.a:"别做傻事！要走一起走！"
  gts_ora.1033.a.custom:"（会额外触发一次对话，随后进结局A）"
  gts_ora.1033.b:"我相信你，所以我陪你走到最后"
  gts_ora.1033.b.custom:"（直接退出，然后触发结局B）"
  gts_ora.1033.c:"保护好自己。"
  gts_ora.1033.c.custom:"（直接退出，触发结局A）"
  gts_ora.1034.name:""
  gts_ora.1034.desc:"你被橘子长推入了星门中，而天体级的[event_target:gts_ora_2_system_first_leader.GetName]刚要阻拦，却见橘子长的手中已然出现了一把长剑——\n确切的说，是那个天体级巨娘留下的长伞。\n“以我作为‘人’的信念，我将此路走到终点……”\n“而我，过往……我走过的一切……只为一个目的……”\n“就用我来……以一次失约，让她回来吧。”\n将天体级[event_target:gts_ora_2_system_first_leader.GetName]逼退回星门后，橘子长看着尚未关闭的星门，又看着仅剩残页的手账本，将手中的笔扔向了星门处。\n“我的故事……要结束了。”\n你在星门中，顺着橘子长的推力向身后退去，却发现自己的怀里却多了一个笔记本。以及一只包装精致的铅笔。 这么长的时间，你不止一次看过她在上面写的内容，却未曾拿起过巨娘所用的笔。如今她将这个交给了你，只有一种可能……\n“如果我回不来……就由你的心情决定，写个你喜欢的故事吧。”"
  gts_ora.1034.a:"..."
  gts_ora.1034.a.custom:""
  gts_ora.1035.name:"“我以我身，写下这段星海的命运。”"
  gts_ora.1035.desc:"战斗已经进行至白热化阶段，双方都早已坚信，对方都坚持不了多久。\n整片星系内没有一颗星辰，不如说，整片宇宙的边界都成为了双方其中之一的坟场。而橘子长，无论是哪一个橘子长，在此刻完成了重逢。\n“我以这副身躯，走到‘我’这则故事的终点。”\n是的，离开帝国，而后留在这里苦战。这是多少回了？橘子长不记得了，但是橘子长还记得的是：群星总会有更高维的存在，而她降临在此处，就是这片星海的末日。\n她是从什么时候开始得知末日的存在？或许从她诞生开始，也或许，换个说法，是从创造她的人死亡开始。\n写下这则故事的人，倒在了故事的完结回前，但是不必担心，会有人接过她的愿望，以她愿望的身份，继续续写下去。\n“你，还是来了。”\n你能听到来自你这位前辈的无奈，她燃尽了自己的过去和现在，走到了自己的终点，只为了在此地，为了心中守护的存在，和这个不可能战胜的目标坚守至今。\n“算了，倒不如说，这才是‘橘子长’应该做出的选择。”\n当她的一生都在追逐，只为了飞到明天，哪怕自己徒劳无功，哪怕由虚幻构成的天空是虚假的现实。哪怕……这条路走到最后，她也是孤身一人。\n少女举起长剑，对着面前这个不可能战胜的存在，这个万界星海之癌。\n剑起，枪刺，早已强弩之末的敌人也并非不可战胜。\n她曾问过自己，她是否怕过，她回答是，但她怕的，是半途而废。\n她也问过明天，如果走到明天的她不再是今天的自己，所做的一切又还有什么存在的意义。\n而答案，却显而易见。\n剑斩敌首，原本的橘子长收起长枪，而面对走自己过去走来的自己，她露出了久违的笑容，因为她知道，一切都已经结束了。\n“要回去吗？”\n“你就不怕……现在拥有着强大力量的我，回去会给你取代了吗？”\n面对小橘子长的请求，橘子长甚至可以开个小小的玩笑，虽然如今的她确实有着这样的力量。\n末日消散，天灾已陨，所有的力量都被橘子长吞下，化为靛蓝色的一只瞳孔，而她的身体早已跨越诸多星系之间，一条条环带在橘子长头部生成，化为了诸多行星，围绕着橘子长的头部形成了星系。\n“好啊，正好上班上累了，两个人的话，你干一三五，我干二四，如何？反正你比我能干的多嘛。”\n“孩子啊，你这个年龄要多干一点，这是对你的考验啊……”\n\n而此时此刻，在帝国焦急等待的你，却看到了一处熟悉的面孔\n她躺在孤星监狱的城市群内，城市宛如地毯一般将她笼罩，似乎……一切都已结束。却没有一个人敢上前去叫醒她。"
  gts_ora.1035.a:"让她睡吧"
  gts_ora.1035.a.custom:""
  gts_ora.1036.name:"循此苦旅，终抵群星"
  gts_ora.1036.desc:"“橘子长？”\n在经历了众多苦难中，你终于看到了橘子长的存在，但是……\n她的变化，有点太大。\n身高……天体级的身高难以界定，而身上的衣服也随之发生了变化，而外套却变得破破烂烂，上面的各种装饰也彻底遗失，只是将外套挂在了身后，一手巨剑，一手战旗，在看到你的到来后，却选择将你护在身后——即使你已经感觉到她早已力竭。\n周围没有一颗星辰，皆随战斗化为微尘，而站在橘子长对立面的，确是和如今的橘子长相同的人物——却有着靛蓝色的瞳孔。\n“你说过的，我们终有一日‘重逢’……就是这个时间段，有点不合时宜……”\n“无碍，你来的正是时候……”\n声音都变得有点疲惫，却有种抹平了棱角的成熟感。“你带来了……我的‘过去’，和……‘现在’？”你将那本手账递给了橘子长，哪怕要抵抗着天体级巨娘的引力，而橘子长也随之一笑，收下了这份原本就属于她的东西。\n“不过确实有个不合时宜的家伙……不过这一切该结束了……”\n“自我”的炉火即将熄灭，而你的到来却让其燃烧的比以往还要明亮，少女刺向伪神，身躯也逐渐变得庞大，开始逐渐覆盖星系，覆盖了数个银河，直到绵延至宇宙边界，将那个想取代自己的家伙一口吞下。\n“我曾是一个学校的普通学生……但旅程和伙伴能够让我直面神明。”\n“我也在孤星的监狱中孤身一人，但监狱外仍有联结的羁绊”\n“我知道虚构的梦终有一天消散……但却是现实外最温柔的避风港。”\n“任何生物都会恐慌，恐慌未知，恐慌强大……但总有人挺身而出。”\n“而走过了这一切的我……又有什么伪证来质疑我作为‘自我’，作为‘橘子长’的意义？”\n头顶的光环逐渐浮现，一侧的瞳孔也沦为了靛蓝。环状星系开始生成，却以少女的头部作为了恒星，绕其公转……不知道为什么，你的内心十分复杂，似乎……有些对不住这位你曾经的行政官。\n\n“不用担心……都解决了……还是说……现在的你，或者你，也在‘恐慌’着什么？”\n\n似乎是安慰你，也似乎是安慰小橘子长。总之，少女的手指将小橘子长的身躯围拢，仅仅只是一个拥抱，却让小橘子长得到了前所未有的安全感。\n“我知道……我和你都度过同一片黑暗……”\n“但是不用担心，未来是过去的未来……我走过的，你总有一天会经历到，或者经历比这精彩的多的旅程。”\n将小橘子长安抚完后，橘子长看向了你，虽然对方的体型比以往大了不少，而视线对上她瞳孔的那一刻你就明白：她仍然是你熟悉的那个存在。\n“怎么说呢……一个人任性的辞职了几十年……是不是要……”"
  gts_ora.1036.a:"“欢迎回家，橘子长。”"
  gts_ora.1036.a.custom:""
  gts_ora.1036.b:"“帝国需要你的加班，橘子长”"
  gts_ora.1036.b.custom:""

