  gts_ora.1015.name:"小橘子长"
  gts_ora.1015.desc:"“我是因你而诞生出来的橘子长，所以……多多关照咯。”"
  gts_ora.1015.a:"“你……是‘过去’？"
  gts_ora.1015.a.response:"“过去不可改变，未来仍未可知……所以，我是过去还是未来，很重要吗？橘子长只知道……现在的我们，可能对你而言，我们又在一起了吧。”"
  gts_ora.1015.b:"“我认识的那个橘子长去哪里了？"
  gts_ora.1015.b.response:"“这个嘛……抱歉，橘子长也不知道哦。”\n少女难得表现出很无奈的样子，毕竟是过去的橘子长，可能在能力上也未必能有“现在”强大吧。\n“不过嘛……橘子长也想帮你找找嘛……就当是为了不让你愁眉苦脸的吧。”"
  gts_ora.1015.c:"“这个胸围……确定不是遗传的吗……”"
  gts_ora.1015.c.response:"你很想提出这个很不合理的话题，却被橘子长用手指抵住了嘴唇。\n“问一个女孩子那么私密的问题前，不如先想想……不论是哪个橘子长，恐怕也不会让你问出来这个问题的吧……”"
  gts_ora.1015.d:"招募"


  
  
  gts_ora.10000.name:"并非并非施工中"
  gts_ora.10000.desc:"致歉,由于代码工作量较大无空闲时间,暂无法完成后续重新招募内容.领袖的获取将在本事件触发后35年自动获取"
  gts_ora.10000.a:"..."
  gts_ora.10000.a.custom:"再次致歉"
  gts_ora.10000.b:""
  gts_ora.10000.b.custom:""
  gts_ora.10001.name:""
  gts_ora.10001.desc:"“橘子长？”\n在经历了众多苦难中，你终于看到了橘子长的存在，但是……\n她的变化，有点太大。\n身高……天体级的身高难以界定，而身上的衣服也随之发生了变化，而外套却变得破破烂烂，上面的各种装饰也彻底遗失，只是将外套挂在了身后，一手巨剑，一手战旗，在看到你的到来后，却选择将你护在身后——即使你已经感觉到她早已力竭。\n周围没有一颗星辰，皆随战斗化为微尘，而站在橘子长对立面的，确是和如今的橘子长相同的人物——却有着靛蓝色的瞳孔。\n“你说过的，我们终有一日‘重逢’……就是这个时间段，有点不合时宜……”\n“无碍，你来的正是时候……”\n声音都变得有点疲惫，却有种抹平了棱角的成熟感。“你带来了……我的‘过去’，和……‘现在’？”你将那本手账递给了橘子长，哪怕要抵抗着天体级巨娘的引力，而橘子长也随之一笑，收下了这份原本就属于她的东西。\n“不过确实有个不合时宜的家伙……不过这一切该结束了……”\n“自我”的炉火即将熄灭，而你的到来却让其燃烧的比以往还要明亮，少女刺向伪神，身躯也逐渐变得庞大，开始逐渐覆盖星系，覆盖了数个银河，直到绵延至宇宙边界，将那个想取代自己的家伙一口吞下。\n“我曾是一个学校的普通学生……但旅程和伙伴能够让我直面神明。”\n“我也在孤星的监狱中孤身一人，但监狱外仍有联结的羁绊”\n“我知道虚构的梦终有一天消散……但却是现实外最温柔的避风港。”\n“任何生物都会恐慌，恐慌未知，恐慌强大……但总有人挺身而出。”\n“而走过了这一切的我……又有什么伪证来质疑我作为‘自我’，作为‘橘子长’的意义？”\n头顶的光环逐渐浮现，一侧的瞳孔也沦为了靛蓝。环状星系开始生成，却以少女的头部作为了恒星，绕其公转……不知道为什么，你的内心十分复杂，似乎……有些对不住这位你曾经的行政官。\n“不用担心……都解决了……还是说……现在的你，或者你，也在‘恐慌’着什么？”\n似乎是安慰你，也似乎是安慰小橘子长。总之，少女的手指将小橘子长的身躯围拢，仅仅只是一个拥抱，却让小橘子长得到了前所未有的安全感。\n“我知道……我和你都度过同一片黑暗……”\n“但是不用担心，未来是过去的未来……我走过的，你总有一天会经历到，或者经历比这精彩的多的旅程。”\n将小橘子长安抚完后，橘子长看向了你，虽然对方的体型比以往大了不少，而视线对上她瞳孔的那一刻你就明白：她仍然是你熟悉的那个存在。\n“怎么说呢……一个人任性的辞职了几十年……是不是要……”"
  gts_ora.10001.a:"“欢迎回家，橘子长。”"
  gts_ora.10001.a.response:""
  gts_ora.10001.b:"帝国需要你的加班，橘子长"
  gts_ora.10001.b.response:""
