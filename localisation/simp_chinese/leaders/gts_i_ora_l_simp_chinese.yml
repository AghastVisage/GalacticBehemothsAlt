  NAME_gts_orangez:"橘子长"
  gts_orangez_desc:"“她履行了她的约定……在属于她时间的尽头再次成为你的利刃。“\n只是这一次……拥有了更强大力量的她，或许能做到更多。"
  gts_orangez_catch_phrase:"别担心，我还是我，而这个名字，将继续随你而战。"
  NAME_gts_mora:"小橘子长"
  gts_mora_desc:"§H“我是因你而诞生的橘子长……虽然还没有本尊那么强大的力量和体型，但是我仍会全力以赴。”§!"
  gts_mora_catch_phrase:""


  gts_trait_mora1:"旧梦萦绕之绊"
  gts_trait_mora1_desc:"$gts_trait_mora1_picture$“我做到了，在未来的某一天。”"
  gts_trait_mora2:"责任"
  gts_trait_mora2_desc:"在有了挺身而出的觉悟后……这个名字会给你想象不到的力量。"
  gts_trait_mora3:"梦呓"
  gts_trait_mora3_desc:"“在第二天，收拾好自己的心情，对着明天说，早上好。”"
  gts_trait_mora4:"羁绊"
  gts_trait_mora4_desc:"正因有着大家一路以来的牵绊，我才得以走到现在这个位置。"
  gts_trait_mora5:"自知"
  gts_trait_mora5_desc:"我是夜间的幽灵，却也是笼罩孤星的长夜。"
  gts_trait_mora6:"命运"
  gts_trait_mora6_desc:"当沙漏倒转，剩下的交给自己的笔和剑。\n§B但不用担心§!\n§P这一路上总会有无数人，无数故事§!\n§M去证明你的存在§!"



  gts_trait_orangez1:"至高之力"
  gts_trait_orangez1_desc:"$gts_trait_orangez1_picture$“不必害怕我，也不必害怕这颗眼睛。我以群星之名起誓。我的剑，将为你斩灭星海诸恶，我的枪，将为你开拓繁天诸星。”"
  gts_trait_orangez2:"至死不休"
  gts_trait_orangez2_desc:"“你为何不避？”\n“因为我的身后再无退路，唯有以身为薪，战至最后一刻（）。”\n（不会自刎归天的，放心）"
  gts_trait_orangez3:"沉重的负担"
  gts_trait_orangez3_desc:"告别了往日，如今的橘子长要承受的负担恐怕要比以往要多得多。不过这是她的选择，她也成功做到了这些。这份胸口上沉甸甸的分量，以及这比常规人类还要伟岸的身体恐怕也成为了她必须要承受的“代价”。"
  gts_trait_orangez4:"概念装甲模块"
  gts_trait_orangez4_desc:"她仍然是你记忆中比较熟悉的那个橘子长，虽然你知道现在的她也只是过去的某个书页，但是和本尊不一样的是，那份你十分熟悉的“坦荡”胸怀，却能在战斗中意外的拦下了很多常规舰炮的攻击。"

