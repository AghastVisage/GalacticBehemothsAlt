  gts_ora_digsite:"孤星"
  gts_ora_digsite_desc:"”2021……孤星……”\n你知道这个星球，通天的巨大吸管插在整个星球上，原有的城市区划在她本人的治理下，使得你并没有为花费操太多的心思。只是……你仍然记得，有那么一处区域，却不在她的建设规划中。\n“这里嘛……就当是给咱一点点私人空间嘛……”\n一个天体级巨娘，拥有一块不到500平方公里的区域显然不违反任何规定。只是……她显然在瞒着你，当你来到这片区域后，却发现——\n那只是一片城市，确切的说……是一座第三次工业革命后期的城市群。"



