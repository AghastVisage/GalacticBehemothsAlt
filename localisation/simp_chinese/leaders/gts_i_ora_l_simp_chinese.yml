  gts_trait_ora1:"万雌王"
  gts_trait_ora1_desc:"行至诸多故事的橘子长总是能和任何巨娘打成一片……或许小人也可以？"
  gts_trait_ora2:"平等共存理念"
  gts_trait_ora2_desc:"$gts_trait_ora2_picture$各物种，各个罩杯的大小理所应当遵循着“求同存异，平等发展”的理念。这也是橘子长想看到的。因此，可不要在她的面前挑起物种对立了……哪怕想象一下那个剁手哥在橘子长的胃里的景象。"
  gts_trait_ora2_picture: "\n\n\n\n£gts_trait_ora2_picture£ \n\n\n\n\n"
  gts_trait_ora3:"少女的清心寡欲"
  gts_trait_ora3_desc:"$gts_trait_ora3_picture$作为天体级巨娘……橘子长消耗的资源要显著低于其她巨娘……甚至达到了普通巨娘的水准。“够用”，这是她唯一的解释。不过吧，这样确实为帝国捉襟见肘的资源提供了很大的帮助。"
  gts_trait_ora3_picture: "\n\n\n\n£gts_trait_ora3_picture£ \n\n\n\n\n"
  gts_trait_ora4:"失忆症"
  gts_trait_ora4_desc:"“$gts_trait_ora4_picture$过往的记忆逐渐崩落，开始变得不再属于自己。橘子长只好不断将过去记下，以此逃脱“虚无”，维持自己的存在。”"
  gts_trait_ora4_picture: "\n\n\n\n£gts_trait_ora4_picture£ \n\n\n\n\n"
  gts_trait_ora5:"哈气"
  gts_trait_ora5_desc:"橘子长只想用这种方式来发表自己的小小不满……放心她不会因为这个吃掉你的……大概。"

