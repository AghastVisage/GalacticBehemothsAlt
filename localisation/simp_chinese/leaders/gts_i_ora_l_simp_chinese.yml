  gts_ora.1.a:""
  gts_ora.2.name:"不明柱状物体"
  gts_ora.2.desc:"“太壮观了……或许我应当拍照纪念一下……”\n从探测器取回来的图像可以看出，整个海域最令人显眼的地方，被一根直插天际的白色圆筒占领，令人惊叹至于，也在怀疑这根天外来物的用意：毕竟……哪怕不需要想象，从整个星球的样貌就可以看出——是一整根白色吸管，插进了整个星球中。\n“筒壁的材质为聚合物，凭借现有技术很容易就能钻探出被埋藏在里面的大量矿产资源。只不过……我们仍在怀疑，这个怎么看都在将星球当做饮品的家伙……她的大小恐怕……”\n话语尚未说完，却被恐惧强制阻断了通讯。至于这根看上去像是吸管的东西究竟是何人所为，恐怕还需要进一步的调查。"
  gts_ora.2.a:"立刻进行开采作业！"
  gts_ora.3.name:"吸入"
  gts_ora.3.desc:"整根吸管宛如一个天然的开采站般，在开采资源进行的如火如荼的时候——却突然出现了强烈的失重感。\n“引力在一瞬间反转，仪表全部失灵，前方的光芒晦暗，身后却是阵阵蠕动的漆黑……我突然意识到一个很严重的问题，可心里的恐慌在不断的催促着自己否决这已经既定的事实。但是没有用，毕竟在打开这个潘多拉的盒子之前，我们都应该清楚一件事——\n这根“吸管”的主人，她存在，且如今，自己早已被她连同整个星球的资源一起被她……\n所有仪表全部失灵，周围一片暗红，却总感觉能够听到轻微的蠕动声，等同宇宙间频率的共鸣。我们不知道能坚持多久，却早已知道自己已然不可能获救——所以我们尝试启动一下最大的通讯频率，试图将这里的一切向你汇报。\n如果这则通讯能够发到你的手里的话，请帮我转达一下我的家人，咱不能照护她们了……”\n时间紧迫，现在的当务之急就是尽可能向开采站的人取得联系。或者……跟那位神秘的巨大少女取得联系？"
  gts_ora.3.a:"出发救援，最高优先级"
  gts_ora.4.name:"相遇"
  gts_ora.4.desc:"星海漫漫，没有对应的位置坐标，搜寻的工作如大海捞针，就在诸位准备放弃之时——却突然出现了一个神秘的少女。\n浅橘色的双麻花辫，却就像是突然出现在此处一般，而对方的体型却令在场的所有人胆寒——而对于我们这些在她眼中如同微尘一般的搜寻舰队，对方并没有过多的在意，只是自顾自来到了那颗被我们调查过的，那颗插着“吸管”的星球——只见她轻启双唇，含住了吸管的那段，仿佛整个星球在她眼中，和如今桌子上的这盒牛奶一般。\n不多时，整个星球仿佛被抽干一般，能看到殷红的熔岩从星球的地核中抽出，宛如熔岩巧克力糖浆一般，逆转引力被少女吸入口中——从她轻车熟路的动作可以看出，这颗星球早已被她当作了一个能让她随时“补充能量”的东西，至少我们是这样认为的。那么，失踪的舰队想必……\n知道了答案比茫然更加令人胆寒——所有人都知道，这是所剩无几的机会，但却没有任何一个人敢接近这个宛若神明的存在——她会怎么样对我们？想必她如果要对我们做些什么的话，恐怕逃到哪里都无济于事吧。抱着这样的想法，我打开了通讯，尝试发送一些什么消息的时候，抬起头，却发现对方的橘黄色瞳孔突然瞥了自己一眼——曾几何时，她已然注意到了我们！\n“决定先让女孩子开启话茬吗？这可不是‘提升好感度’的选项吧。”\n短暂压制住的恐慌却被少女轻佻的话语击溃。“那个……我们无意冒犯，但是我们的人曾经在这里失踪……可能是被您……”\n“吃掉了”。最后三个字在内心的挣扎下还是没能说出口，我按在自己狂跳的心脏，想遏制住内心的恐慌，却逃不过少女橘黄色的瞳孔。\n“这样啊……那你们要自己进来找吗？还是说……”\n远远地看着少女轻启的双唇，吐出来的字眼却一个比一个恐怖。且不说少女有没有恶意，就如今这个情况，哪怕接近她都十分困难，更何况……要进入一个少女的身体里。\n见我迟迟没有反应，少女不言，却早已微微张开口腔——那是我不敢想象的尺寸，仿佛片刻间就能够将自己连同整个舰队一起被吞噬掉的恐怖大小，以及不断失控的引力，还有……不知道为何内心里感觉到的威压似乎被一种更加扭曲的情绪占据着，却像是人为地控制着，让你不必担心坠入意识的深海中。\n胃中的环境一片漆黑，已经找不到出去的路，探测器却突然起了反应——一个早已模糊的坐标，和一个早已坠毁在肉壁的研究船。\n“在她体内的环境仿佛度日如年。”对方说道，“我们早已做好了准备——成为她体内的一部分，就像周围游离的生物一样。”说罢，指了指周围宛如鬼魂一般的存在。\n“这些家伙……没有生命，没有意识，甚至连身体都没有，只有终日重复着做着同一件事情——宛如死亡回放一般。看着他们挣扎着淹没在如同潮汐一般的胃液中时，我们突然释怀了：我们没有义务去逃离一个不可能逃离的东西，宛如西西弗斯的巨石一般。”话音未落，却突然感到一阵头晕目眩——\n“西西弗斯的故事吗？挺有意思。”\n距离如此之近，却能看到少女眼中所带的一丝神性。“不小心吃掉了你们的舰船真是抱歉，所以……开个我能力允许范围的小小玩笑，希望你们喜欢在我身体里的戏份捏。”而看到少女露出牙齿的微笑之后，却突然感觉浑身发麻——这家伙，这么令人捉摸不透的吗？"
  gts_ora.4.a:"总之，谢谢您了！"
  gts_ora.5.name:""
  gts_ora.5.desc:"对于眼前的少女来说，你的出现或许能在她的笔下留下几个字符。只不过……在这样捉摸不透的少女面前，每一个字眼似乎都有可能引起她对文明的存护……亦或是覆灭。\n她在等你，在等你做出你想要做出的回应……你们的时间有很多，她也愿意在此停留一刻——在她的旅程中留下一个双方都会感到愉悦的“记忆”。"
  gts_ora.5.a:"“抱歉……到现在还不知道你叫什么名字……” "
  gts_ora.5.a.response:"“名字吗？”\n你难得见到少女做出了短暂的沉思。\n“名字只能作为一个符号，如果你想的话，可以用‘橘子长’来称呼……在紧张吗？不用担心，毕竟比起这些……我还是比较中意你们刚刚强装镇定的样子呢。毕竟……”\n少女微微一笑。“毕竟人类在面对如此巨大的存在，不选择徒劳的逃跑，而是选择靠近以寻求一线生机……这样的故事还挺适合在我的笔下诞生的说。”"
  gts_ora.5.b:"“你的故事……”"
  gts_ora.5.b.response:"少女微微一笑，示意让你稍稍近些，丝毫不会在意因为体型上悬殊的差异会给你们带来什么样的压迫感。不过从她的举手投足间，似乎能依稀的感受到对方带来的善意——难得的能让气氛变得缓和的机会。\n“故事只是维系我的存在，每一段经历都会被我一一记下，包括你，”少女说完这些，却有意将笔抵在下巴上，似乎向你示意着什么，难道说……是要让你，让你们所处的文明，成为她笔下的一部分吗？"
  gts_ora.5.c:"“可以一起同行吗？”"
  gts_ora.5.c.response:"“可以啊。”\n似乎是毫不迟疑的回答，让你们所有人感到欣喜的同时，又在质疑其真实性。谈判如同交易，而自己的砝码也仅仅只是她的一面之词，这样简单的答应下来是否会有猫腻，这也是你在考虑的点。\n“只不过……可能会有离开的一天……不过会很久就是了。在这之前，‘橘子长’这样的存在，就听从您的调遣了。”\n少女庄重的行了个礼，作为她“短暂”加入的象征。"
  gts_ora.5.d:"招募"
  gts_ora_catch_phrase:"“橘子长”，加入，任您随意调遣。"
  gts_ora_desc:"“追逐明天的拾星者”"
  NAME_gts_ora:"橘子长"
  gts_ora.6.name:"罩杯热议"
  gts_ora.6.desc:"近日，我们在各种社交平台均出现了有关橘子长的表情包：似乎在刻意强调她那比较“坦荡”的胸怀，以及她本人十分不情愿的表情。\n只不过，由于这条被称之为“橘子板”的表情包太过魔性，以至于早已在整个互联网上流传开来。却因为某些别有用心的家伙，江湖人称“键盘侠”，在网上挑起对立，引发了有关“巨乳万岁”以及“贫乳万岁的争议。”\n或许……不能让这些破坏团结的事情发生……"
  gts_ora.6.a:"推举“巨乳万岁”"
  gts_ora.6.a_custom_tooltip:"“乳不巨何以聚人心？如此伟岸的山峰正是给予了小人在此定居的可能。只是这样做对橘子长而言会不会是一种排挤……”"
  gts_ora.6.b:"推举“贫乳万岁”"
  gts_ora.6.c:"把找事的键盘侠给我逮起来！"
  gts_ora.7.name:""
  gts_ora.7.desc:"“乳不巨何以聚人心？”这样的呼声在你的政策推动下开始逐渐高涨。一时间，竟压的一些“贫乳派”有些抬不起头——当然，那些生来就有这份缺陷的巨娘们并不满意这样的看法，于是她们找到了在这一领域当中最有权威的一个存在——橘子长。\n“大雷万岁，应该把所有的小雷信徒全部归为邪教处理！”就在所有人都在互联网上欢呼雀跃时，天空却突然毫无征兆的变暗了几秒——只有几秒。而恐慌的人们抬起头，看到的画面却差点连手机都难以抓稳：那是一颗橘黄色的星体，宛如瞳孔一般注视着地表上的苍生，仿佛是看到了我们得“神明”的亵渎。\n“你们……似乎挺喜欢这个嘛……”\n招惹一个天体级的巨娘会有什么样的后果，想必不必赘述，而她却只是稍稍地将自己与这个早已被吓成筛子的星球的距离拉远了一些，随后——\n“哈！”曾经在各大平台火爆全网的黄皮恶毒猫猫的惯用伎俩，名为“哈气”，此时此刻在这位浅橘色麻花辫的少女身上学到了一些精髓——只不过……如果她认真起来的话，可能会将整颗星球偏离轨道吧。但是这看上去只是玩笑一般的轻轻一哈气，却令天空都变得晦暗下来：空气中凝结出了凝重的阴云， 呼啸的风连同建筑物连根拔起，伴随着柑橘的气息。却无人敢沉浸于此，只敢躲在防空洞内，或者随着风飘向远处。\n“只是一点点小小的惩罚罢了。作为乱用咱表情包的惩罚。”\n橘子长只是留下了这一句话，就离开了此处。难道说……这是傲娇吗？不会吧，她刚刚一定是生气了对吧！"
  gts_ora.7.a:""
  gts_ora.8.name:""
  gts_ora.8.desc:"“胸不平何以平人心！”这是贫乳派所推崇的。抛弃身上这又重又累的负担，拥抱坦荡和轻量化的胸怀。在这样的政策推动下，似乎各样消费品的消耗都有了不同程度的降低，人们也终于不用担心和巨娘贴贴时会被那恐怖的巨大球体挤扁了。\n只是……少了群峰林立的感觉，人们想要崇拜大雷的dna却不会因此衰退。直到这条政策推动的第十五天后，橘子长突然找到了你。\n“这样……是为何呢。”\n这是她为数不多收敛起她的大小，仅仅以一个星球中标准巨娘的身高进入为她而准备的会议中。在我们滔滔不绝地向她谈论了三个小时“关于推举贫乳万岁的优点”之后却发现——她早已睡着了。哈喇子滴在桌子上，差点把一旁西装革履的小人官员浇的透湿。\n“嗯……？啊抱歉……咱开会是容易睡着啦。既然你们觉得这样可以的话……其实也不用专门为自己去把那些家伙一棒打死的好嘛……就这样，我可以走了吗？”说完后的橘子长刚想离开，却突然一个趔趄从桌子旁摔在了地上。\n“呜……睡的有点久……腿有点麻了……等会是谁在咱腿上爬啊！”"
  gts_ora.8.a:""
  gts_ora.9.name:""
  gts_ora.9.desc:"捕风捉影，我们最后终于拿下了犯罪嫌疑人：“键盘侠”江湖人称“剁手哥”。以下为“剁手哥”的供词：\n“橘子长……我已经在2028年就认识她了，她当时是整个圈子里最火的画师，是写出最打动人心文章的作者。更是一个最让人难以忘记的vtb！说真的我从2028年就关注她了，直到最后她失踪了……却在近期再次出现了，你们知道这意味着什么吗？”\n“如果我的人生是一场彻头彻尾的黑暗的话，那橘子长的出现就是我人生中的一束光啊！她是我的神明啊你们怎么能这样对待她啊！我无时无刻都在想着，想扒着窗外往天上看着，到底我的神明能不能回应我这个小小存在……哪怕她面带微笑的把我捏起来，一脸笑意地说着‘不要怕，一切都结束了’一边把自己心安理得地放到她的口中，让自己就这样没有任何愧疚的被她吃掉……”\n剁手哥，39岁，男，种族为缩小人，曾涉嫌在网上造谣以及多次对橘子长造成大量不良语言影响，现已决定：交给橘子长处理。以下是橘子长的处理结果：\n“你说那个开到我这里来的移民船吗……是那个小家伙啊……既然他这么想这样的话，橘子长就只好如他所愿咯……诶你们这是什么表情啊，放心，一般情况下……我还没有吃掉你们这些小家伙的打算呢。”"
  gts_ora.9.a:""

  gts_ora_a:"巨乳万岁"
  gts_ora_a_desc:""

  gts_ora.100.title:"橘子长"
  gts_ora.100.a.desc:"日安吗……不用这么拘谨，我们彼此间的称呼倒可以更近些……"
  gts_ora.10.a:"想听听你的故事"
  gts_ora.101.desc:"“故事吗……乐意效劳呢。”\n少女翻开书页。\n“都在这里了，想听什么呢？”"
  gts_ora.10.a.custom:"可以通过之后的三个选项，通过消耗帝国人口来换取基础资源。"
  gts_ora.101.a:"《无忆虚幻的梦界》"
  gts_ora.101.a.custom:"消耗人口获得能量币"
  gts_ora.101.a.response:"“少女做过一个梦，糖霜撒满的理想国。而梦里的她遇到了最温柔的少女，似乎是最好的玩伴，也可以是永远的家人，她们的距离十分相近，即使被吃掉也心甘情愿，似乎这也是这份温柔的一部分，让不合时宜的记忆都为之消散。”\n“未来是过去的未来，过去却是未来早已抛弃的存在，少女在梦界中，将自己的过去与未来闭合，因为只有在梦里才可以展现自己最脆弱的一面。”\n睡吧，愿你的梦里，能遇到白安那般温柔的巨娘，我保证。\n\n故事在少女的口中完结，但是在得到故事的同时，少女决定用一些小小的资源，向你换取一点点……“零食”？\n（你使用人口向橘子长兑换了2500能量币）"
  gts_ora.101.b:"《众星尽头的救赎》"
  gts_ora.101.b.custom:"消耗人口获得矿物"
  gts_ora.101.b.response:"小人曾陷入这般自证的境地，她在地砖缝中，追逐着巨娘的脚步，却究其一生，也无法走出巨娘的一步之遥。\n她曾失去希望，她曾深陷泥潭，她曾不信命运，也被别有用心之人推入深渊。她并没有别的故事里那般，有着花里胡哨的能力。而这样的她妄图染指神明，绝无可能。\n所幸她并非燃尽的孤星，她有一路上相陪的伙伴，才能让她再次拥有了与神明对垒的权利。小人手持长伞，宛如勇者的剑，相信的心成为了唯一的魔法。\n不过话说回来，你也并非孤星不是吗？有着一路上认识的巨娘……还有我。\n\n故事在少女的口中完结，但是在得到故事的同时，少女决定用一些小小的资源，向你换取一点点……“零食”？\n（你使用人口向橘子长兑换了2500矿物）"
  gts_ora.101.c:"《璇星塔下的选择》"
  gts_ora.101.c.custom:"消耗人口获得食物"
  gts_ora.101.c.response:"“妥协”还是“反抗”，这是一直以来的命题。\n星总是认为，自己不应当依靠璇这个推倒高塔的“罪魁祸首”。他讨厌塔，讨厌的是小人社会这般堪比斩杀线的“吃人”处境。而这份明面上对璇这个巨娘的反抗，却是对如今生活的“妥协”。\n璇所接受的教育却认为，应该给小人选择的权利，却不是因为别的，而是出于自己的一种“心安理得”——把小人带回去的理由。那是一种“温柔”，却是对小人的“妥协”。\n至于小塔，他妥协了太多，高塔的崩塌让他一度陷入了被“斩杀”的处境。而他十分明白一个道理：星的“反抗”无法持续太久。既然跟着璇可以得到生存的机会，而自己却早已是个小人社会认定的“死人”。目的就是让星放下那些生活上的重压，投身于巨娘的怀抱。\n不过呢，故事的最后，巨娘推倒了偏见的高塔，也总是个大家都想看到的结局，至于你的话，放心，有我在，我们不会对未来选择“妥协”的，不是吗？\n\n故事在少女的口中完结，但是在得到故事的同时，少女决定用一些小小的资源，向你换取一点点……“零食”？\n（你使用人口向橘子长兑换了2500食物）"
  gts_ora.10.b:"快用你的万雌王体质想想办法啊！"
  gts_ora.10.b.custom:"需要在有国家对你结为宿敌后使用，交互后会直接消除宿敌影响且将好感度恢复至友善，冷却时间5年（如果有多个国家对你结为宿敌就随机选择一个）"
  gts_ora.10.b.response:"“嗯嗯……又在外面惹麻烦了呢……好的，先在这里坐会吧，我想办法摆平一下。”"
  gts_ora.101.e:"这样的故事在哪里可以看捏。"
  gts_ora.101.e.custom:""
  gts_ora.101.e.response:"你想看更多吗……这样吧，我试着整理一下，发到你们所知的论坛里吧，好像叫什么……gwaltz是吗？（恰饭时间）\n（想看的话可以去gw论坛搜“橘子长_Ora”哦·~）"



