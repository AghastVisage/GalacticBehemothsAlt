  gts_ora_book_botton_now_available:"“她的过去被你唤醒，但是她写过的故事却仍然成谜。”"

  gts_ora_book_botton_after_available:"“是时候直视她的未来了……即使充满代价。”"

  gts_ora_book_ending_meteor_1_tooltip:"§H以念铸身，终别“无能”§!\n\n大橘子长获得每日船体再生+5%，小橘子长获得+50免伤。"
  gts_ora_book_ending_meteor_2_tooltip:"§H此心为终，祓除“虚幻”§!\n\n为大橘子长增加巨像模块：战略倾轧。\n使用超规格的鞋子进行踩踏，自身作为天体级巨娘散发出的威压会使该星球内的任何生物无差别死亡，或者是投降。\n（对星球释放，直接占领该星球并破坏所有建筑，CD为60）"
  gts_ora_book_ending_meteor_3_tooltip:"§H苦刑将尽，接纳“孤立”§!\n\n大橘子长的跃迁冷却时间-80%，小橘子长的跃迁冷却时间-50%。\n大橘子长的跃迁范围+50%。"
  gts_ora_book_ending_meteor_4_tooltip:"§H以念化剑，斩灭“恐慌”§!\n\n大橘子长获得一个光环（配件），使敌方舰船获得：\n护盾无效化+1000%\n装甲无效化+1000%"
  gts_ora_book_ending_meteor_5_tooltip:"§H“失我”为码，以持“至高”§!\n\n小橘子长获得特质：“至高之力”。\n大橘子长获得特质：“概念装甲模块”。"
  gts_ora_book_ending_meteor_6_tooltip:"§H循此苦旅，终抵群星§!\n\n大橘子长将获得特殊舰载武器，且可以通过舰船按钮切换形态。"



