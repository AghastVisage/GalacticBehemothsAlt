  gts_linfeng.305.name: "林凤「战斗特化型分身」"
  gts_linfeng.305.desc: "“主人您好~我是林凤大人的女仆分身，从今往后就由我来负责您的饮食起居以及行程安排，您的帝国的作战相关事务林凤大人也已嘱托我替您处理了。您只需要安心坐在这里，看着我以及那个小家伙一起蹂躏您的敌人就好咯~”"
  gts_linfeng.305.a:"*什么叫……分身？"
  gts_linfeng.305.a.response:"“您难道不知道么？林凤大人可以随心所欲的制造各种各样的分身，分身的长相身材能力以及拥有多强的力量完全由林凤大人决定。至于我嘛，我恰好是林凤大人的高阶分身之一，在此之前一直作为贴身女仆为林凤大人服务呢。”"
  gts_linfeng.305.b:"*你和林凤……不会有矛盾吗？"
  gts_linfeng.305.b.response:"“分身的存在完全依附于林凤大人呢，就算某个分身的力量已经强大到了能够击败林凤大人的地步，只要她一个念头分身和分身的力量就会被直接回收到林凤大人的身体里哦。和她起矛盾，我们可不会有这样的念头。”"
  gts_linfeng.305.c:"*分身的用途……"
  gts_linfeng.305.c.response:"“用途……其实分身并没有什么特定的用途，每个分身用来做什么也只是林凤大人一句话一个念头的事情而已。我嘛……在女仆身份之外，我还是林凤大人的……情趣用具。”"
  gts_linfeng.306.name: "林凤（分身）的星球改造"
  gts_linfeng.306.desc: "“哈……忍不了了呢……”\n林凤满脸兴奋的用手挑逗着她胯下的肉棒，几艘属于敌国的舰船被她缓缓塞入了马眼之中，她感受着马眼中传来的快感随即发出了一声充斥着催情魔力的淫叫声，那声音通过她身体的魔力回荡在星间，让我们与敌人的舰队上的船员们都遭受到了不同程度的影响，一些船员们在这声音的影响下开始自发地在一些较为宽敞的舱室里进行了极为淫乱的性活动……\n即便这只是林凤的一个小小的分身也能够发挥出这种轻易影响大片生物的能力……难以想象如果是她本人的话这片星域里会发生些什么。\n指挥官满脸愁容的看着她的行为，因船员的性活动所造成的损失已超出了舰队能够承受的非战斗损耗了，在这种情况下也只能准许她用敌人的星球来泄欲了。\n“请求批准……收敛点，星球我们还要的。”\n“我就等着你这句话呢~♡”\n在得到准许后，林凤毫不犹豫的将她胯下的那头巨龙对准了[from.GetName]，然后将她的手轻轻放在了肉棒上开始迅速撸动起来。\n“孩子们已经等不及要和你们这些小贱虫见见面了呢~♡”\n她撸动的速度渐渐加快，在撸动的过程中还时不时地伸出手来将周围仍在试图将她驱离的敌国舰船丢到她的肉棒之上，任其在肉棒产生的引力下坠向肉棒或是在撸动的过程中被当场微不足道的颗粒感粉碎。\n“嗯哼哼~要来咯，小虫子们可要接好了哦，不要在这个时候全都死掉了呢~♡”\n接着她一挺腰肢，随即便是一阵足以让近地轨道被完全吞没的浓精从马眼之中喷发出来。\n那一阵阵的浓精先是将敌国星球周围的卫星与空间站尽数吞没溶解，再裹着太空中的陨石一片片地坠向地表。\n敌国星球上的人们绝望的看着天空中坠向他们的精液雨，数不清的生灵与城市被淹没在精液之中再被其中的精子当做食物一般的直接吞食，被转化为了更小些的“小蝌蚪”。\n浓稠黏腻的精液如天灾般的将整颗星球完全覆盖，无论是山川大陆还是深海汪洋都在这天灾般的精液暴雨下被无情的吞没，只留下了一颗已被精液完全覆盖改造的残破星球与在避难所中苟且偷生的幸存者们。\n“爽了呢~要是这个时候感官连着的话……我都不敢想本体会有多爽呢~♡”\n她兴奋地摇了摇尾巴，缓缓远离了那颗被她当做泄欲对象的小小星球。至于这片星域中的敌方舰队，在她的马眼之中或许还能找到些许残骸。"
  gts_linfeng.306.a: "*其实futa巨娘还挺涩的……"

  edict_gts_linfeng_shoes_give:"向林凤请求殖民援助"
