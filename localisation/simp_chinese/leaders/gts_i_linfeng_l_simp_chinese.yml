  gts_linfeng.302.name: "林凤的舰娘“改造”"
  gts_linfeng.302.desc: "“你果然还是用了它呢，就像我预测的那样~”\n林凤的声音率先到达了这颗星球上，但好在你已经先一步到了星系的空间站上，地表的灾难现在已与你没有任何关系了。\n她的身躯缓缓从传送门中飘出，这一次她展现给你看的身躯要比之前你所见过的体型还要巨大，那颗星球现在在她的面前如同小玻璃珠一般大，只要她稍不注意就会将整颗星球连带着你所在的空间站一起粉碎在她的身躯上。\n“不用太担心这些小家伙呢，他们不会因此而丢了性命呢，最多也只是从此变成虫子而已。”\n她将手指缓缓放在星球的上方，她的指肚上缓缓飘出一环银白色的魔力，那环魔力缓缓降下围在了星球的周围，接着她轻轻挥动手指将整颗星球都囚禁在了那渐渐拥有实体的魔力之中。\n现在的星球从空间站上看就像是一个内部造型独特的有两环可以翻转的银环的吊坠，而林凤也确确实实的将它当做吊坠一样扣在了她的腰间。\n“不过是制作一个饰品而已啦，放轻松。”\n接着，她的目光看向了空间站。她将手指缓缓伸了过来，又在即将触碰到空间站时停下了她指尖的动作将其收了回去。\n“逗你玩玩而已。接下来该说正事了，你有两个选择——”\n“是想要正常造型的舰娘呢，还有想要futa型的舰娘呢~？”"
  gts_linfeng.302.a: "*还是正常造型的吧……另一个……我不能接受。"
  gts_linfeng.302.b: "*口瓜，我现在就要看futa美少女！"
  gts_linfeng.303.name: ""
  gts_linfeng.303.desc: "“选什么我倒是无所谓~不过嘛，你就别奢望用我的本体来为你服务咯，给你两个分身，自己拿去玩吧~”\n话音刚落，林凤的身影便在这片星空中消失的无影无踪，在原本她漂浮的位置上站着一个体型小了许多的粉色头发的天体级狐娘，按照她所说的话，这应该就是她留下的分身了，但……为什么长相并不一样呢？\n但没等你思考这是为什么，那分身便缓缓靠近了你所在的空间站。\n“小小的呢……叫人忍不住想……”\n她缓缓揭开她身穿的旗袍的下摆，露出了旗袍之下被遮蔽着的胖……她根本没给她的分身穿！\n她缓缓伸出手来用手指轻轻捏住了空间站，与她的手指相比整个空间站是如此的渺小，恐怕将空间站完全塞入她的身体里都无法让她有多少感觉。\n“够了够了，主人可没让你对他做这样的事情。”\n一个你无比熟悉的声音传来，你看见眼前的分身松开了手，她的身躯随后便像是被人拎住了一样缓缓上浮。\n“切……扫兴……你是上级，听你的咯。”\n接着，你便看见了一双白里透红的被白色丝袜包裹着的玉腿，那双美腿的主人的身躯缓缓下潜，让你得以看见她的容貌——身着女仆装的林凤，但她身上所散发的气质却并没有林凤的味道。\n“主人您好~我是林凤大人的分身，从今往后就由我来负责您的饮食起居，以及……指挥这个小家伙处理一些麻烦的家伙。”\n她手上拎着的分身无奈的晃了晃脑袋。\n“当然，我的体型不会像现在这样巨大，常态也只是保持在天体级中最小的水平而已。”"
