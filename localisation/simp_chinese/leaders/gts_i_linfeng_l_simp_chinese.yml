  gts_linfeng.304.name: ""
  gts_linfeng.304.desc: "“选什么我倒是无所谓~不过嘛，你就别奢望用我的本体来为你服务咯，给你两个分身，自己拿去玩吧~”\n话音刚落，林凤的身影便在这片星空中消失的无影无踪，在原本她漂浮的位置上站着一个体型小了许多的粉色头发的天体级狐娘，而且……她下面还挺立着一根让人看了就面红耳赤的已经勃起的巨大性器……\n按照她所说的话，这应该就是她留下的分身了，但……为什么长相并不一样呢？\n但没等你思考这是为什么，那分身便缓缓靠近了你所在的空间站。\n“小小的呢……叫人忍不住想……”\n她将手缓缓放在了她胯下的那根巨物上慢慢前后移动，她的面容也随之变得微微红润了起来。\n她缓缓伸出手来用手指轻轻捏住了空间站，与她的手指相比整个空间站是如此的渺小，恐怕将空间站当做马眼棒塞进去都无法让她有多少感觉。\n“够了够了，主人可没让你对他做这样的事情。”\n一个你无比熟悉的声音传来，你看见眼前的分身松开了手，她的身躯随后便像是被人拎住了一样缓缓上浮，你甚至可以看见她胯下的那根肉棒正在因身体的移动而上下跳动着。\n“切……扫兴……你是上级，听你的咯。”\n接着，你便看见了一双白里透红的被白色丝袜包裹着的玉腿，那双美腿的主人的身躯缓缓下潜，让你得以看见她的容貌——身着女仆装的林凤，但她身上所散发的气质却并没有林凤的味道。\n“主人您好~我是林凤大人的分身，从今往后就由我来负责您的饮食起居，以及……指挥这个小家伙处理一些麻烦的家伙。”\n她手上拎着的分身无奈的晃了晃脑袋，她身下的巨物也随之一同左右摆动着。\n“当然，我的体型不会像现在这样巨大，常态也只是保持在天体级中最小的水平而已。顺带一提，她可以为您提供一些特殊的攻击方式，比方说……用下面来轰炸敌人的星球。”"
