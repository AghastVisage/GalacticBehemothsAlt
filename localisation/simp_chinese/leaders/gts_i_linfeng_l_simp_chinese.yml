  gts_linfeng.211.desc: "“还没有啦！”\n林凤从失神的状态恢复之后，立马马不停蹄地来到了正在整理自身易容的魅魔少女身边，狐娘轻轻抱起少女的手臂，整个身子贴了上去，娇嗔道：“哎呀，千海姐姐，再让咱满足一次吧，求求你了，咱什么都会做的”\n千海嫌弃地推开了贴上来的林凤，拨弄开缠上了手臂的狐尾，顺便将她湿淋淋的黑色尾巴在柔软的狐狸毛上擦了一擦\n“你说的哦，最后一次……这次之后你可别再来烦我了，色狐狸”\n“嗯哼，说吧，想要我怎么满足你？”\n“谢谢姐姐~刚刚咱的小穴和胸部还有尾巴都已经爽翻啦，但是…..后庭还有点欲求不满呢——，千海姐姐~能不能往咱里面塞满天体级的巨娘哦~？”\n林凤转过身子，撩开了身后蓬松的尾巴，向千海大方地亮出了她的臀瓣，漂亮的花穴之上狐娘紧致的后庭仍在不止疲倦的开合，仿佛想要将什么东西吞食殆尽\n真是不知廉耻的色狐狸，还是说，巨娘都这样？千海心里想着，手上轻打响指\n数个天体级巨娘忽然出现在了千海的摊开的手掌之上，在少女的胸前按照大小从左到右俏生生的站立了一排，其中站在最右边的巨娘有着毛绒绒的淡棕色猫耳和黑白相间女仆装，似乎是一位职业女仆？她们都很清楚接下来会发生什么，眼神对不远处林凤那正在煽动的菊穴充满了渴望\n“好吧，色狐狸就保持这个姿势，开始了哦，先是第一只巨娘”\n“好~”\n千海握住第一只巨娘的腿部，将头部对准了林凤的菊穴，看着面前煽动着深渊，千海知道这对这些巨娘是一趟有去无回的旅程，心中略有不忍，但当她看到手上巨娘那期待的神色时，千海立马便狠狠地将巨娘捅入了林凤的后庭之中\n“哈啊！”\n林凤身体猛地向前挺直，随即舒爽地呻吟出声，少女的菊穴犹如久旱逢甘霖般，不需要千海的推波助澜，仅仅是少女身体的一次颤动，便将刚刚捅入林凤身体一半的巨娘彻底吞入其中消失了踪影，千海疑惑地用手掰开菊穴探视这其中的情况，粉红蠕动的隧道中甚至连巨娘的脚都看不到，直到魅魔少女轻轻用手抚摸林凤的小腹上的突起才能确认那个巨娘已经被推到了狐娘肠道的最深处\n“千海姐姐也想进来咱的里面吗？还不够啦”\n林凤向后探过头来，狐尾扫过千海的脸部，带着爱心的眼神似乎在催促着千海继续手上的动作\n“那就二号巨娘和三号巨娘一起来吧”\n“好，咱来者不拒哦~”\n这次的插入也许会困难许多，紫发的魅魔少女小心地将手上巨娘的脚尖探入眼前喷吐着热气的肉穴，由于两只巨娘环抱在一起，林凤的菊穴吞入的速度一下子慢了不少，狐娘对于这样的进度显然很不满意\n“哈啊好大~，嗯~”\n林凤用力地收紧了括约肌，伴随着身后千海的一并用力，两只巨娘在咕噜一声中便消失在了外界，这次魅魔少女能够清晰地看清巨娘被周围肉壁运入深处的全过程，千海甚至能清晰地看到其中一位巨娘直到最后一刻才迸发出惊恐的神色\n叶公好龙不可取啊，这可不能怪她，千海摇摇头\n林凤抚摸着她的腹部，薄薄的肌肤层与肠壁将这些天体级巨娘与自由的世界永远的隔绝了开来，她能感受到她们在里面还是相当的‘活泼’，但蠕动的肠胃和若有若无的空虚感告诉她，她还没有满足\n“嗯，还有吗，姐姐”\n“只有最后一只了”\n“哎，这就是最后了吗，尽管来吧！”\n千海抓起了最后一只巨娘，这只巨娘显然要大上了一个尺寸，见轮到了自己，棕色的女仆猫娘眼中爆发出了极度欣喜的炫光\n“噫，谁家猫娘”\n林凤感觉到身后千海的接近，更加撅起了丰润的臀部，巨大尾巴此时张牙舞爪似乎像是某种可怕的捕食动物，千海仿佛是送走脏东西一般，用力地将猫娘腿朝下地地插入林凤已经扩张开来的菊穴之中\n“噫，哈啊哈啊，好大，但没关系，这都难不倒咱！”\n林凤的全身都在一起使劲，少女纤细的腰肢浮出了密密的细汗，菊穴已经被扩张到了碗口大小的程度，随着括约肌不断的收缩，猫娘的身体肉眼可见地开始沉入狐娘的身体之中，但流畅的进度在吞没到猫娘巨大的胸部时戛然而止，卡在其上的猫娘似乎很心急，但小小的身躯带起的动作并不能起到什么作用\n“唔，别小看我，哈啊！”\n林凤眼中的爱心已然达到了顶峰，她的菊穴犹如蟒蛇将其扩展到了极限\n“啵”\n在胸部被吞入的一瞬间，好像是物极必反，猫娘在强大的吸力作用下，在转瞬间便被汹涌的肠道推到了极深处，望不见了痕迹\n“~！”\n随着猫娘被吸入，异物滑过肠道时带来的强烈快感，和四个巨娘为她带来的极度的充实感让林凤不由得挺直了腰肢，失神地向前伸出了舌头，花穴在刺激下再次喷出了强烈的喷流，“哈啊，哈啊，爽死啦”\n提前躲到一边躲过了林凤的洪流激射的魅魔少女，缓缓飘到了狐娘的身边，用尾巴将林凤由于高潮全身瘫软的身体拉起，千海观察到林凤原本平坦的小腹明显鼓起了一个大大的幅度，并且还在不断的颤动，\n“嘿嘿，没关系的啦，不用一会就消下去了~”\n“嗯，我只是想问你这下应该满足了吧”\n“还没有哦，千海姐姐，再来一次吧”\n“滚啦——”"
  gts_linfeng.211.a: "太棒了！"
  gts_linfeng.211.a.tooltip: "请救救猫娘！"

  gts_linfeng.220.name: "未知的粉色威胁"
  gts_linfeng.220.desc: "刺耳的红色信号瞬间席卷全星区，侦查部门紧急回传影像——在边境空域之外，一个巨大的粉色狐娘生命体正在逼近。其体量远超常规天体尺度，轮廓几乎覆盖整颗星球，航迹扭曲了周围的引力读数。目前尚未观测到明确武装反应，但她的航向与我方核心星球高度重合，速度稳定，却毫无减速迹象。随着距离缩短，天文观测数据开始紊乱，整颗星球的警戒系统进入最高响应等级。已经被判定为最高级别未知威胁。\n舰队指挥官同时向我们请求命令——\n是否派出舰队进行拦截？"
  gts_linfeng.220.a: "派出最近的警备舰队拦截"
  gts_linfeng.221.name: "未知的粉色威胁"
  gts_linfeng.221.desc: "“警备舰队已接敌！全炮门开启！开火！全火力覆盖！”\n随着指挥官歇斯底里的咆哮，数千道足以贯穿小行星的高能激光束与反物质导弹，拖着耀眼的尾焰刺向那片占据了整个雷达屏幕的“粉毛狐娘”。然而，当硝烟散去，传回的画面让舰桥上的每一个人都感到了骨髓里的冰冷。\n足以毁灭一支常规舰队的火力齐射，打在那巨大的身躯上，竟然连一点痕迹都没有留下。那些爆炸产生的火光，在她那如同粉色绸缎般的发丝映衬下，渺小得就像是夏天夜晚偶尔闪烁的几只萤火虫。林凤甚至连眨眼都没眨一下。她依然保持着那个慵懒的姿势，在真空中缓缓漂浮前行。\n“啊啦？刚才是有什么东西在叮我不成？”\n她的声音直接通过精神波动震荡着每一艘战舰的船壳，有一种刚刚睡醒般的困倦和好奇。\n对于她来说，这支全副武装的警备舰队，不过是一群挡在路上的浮游生物。她根本没有减速，甚至懒得挥手去拍打，只是任由那庞大的身躯顺着惯性向前“飘”去。\n砰、砰、砰……\n绝望的碰撞开始了。位于前锋的数百艘护卫舰和驱逐舰，像是撞上了无形墙壁的飞鸟。它们引以为傲的合金装甲，在触碰到林凤那看似柔软的粉色尾巴尖端，或者是衣角飘带的瞬间，便像鸡蛋碰石头一样被挤压、扭曲、引爆。她只是简单的飘过，就将整支舰队像灰尘一样撞得支离破碎。\n“喔？这个看起来……稍微精致一点呢。”\n突然，林凤像是发现了什么有趣的小玩具，巨大的狐耳微微抖动。正在疯狂后撤的旗舰，突然被一片巨大的阴影笼罩。还没等舰长下达规避指令，一只遮天蔽日的玉手已经破开虚空，两根手指如同捏起一颗微尘般，精准而优雅地捏住了这艘长达数公里的泰坦级旗舰。剧烈的震动让舰桥内一片狼藉，重力系统彻底失效。舰长惊恐地抬头，透过全景视窗，他看到的不再是星空，而是林凤那张被放大了无数倍的、带着戏谑笑意的俏脸。\n“小指挥官，只有你……是被允许留下的哦～♡”\n林凤那双媚意横生的紫色眼眸微微弯起，随后，她做出了一个让所有人都意想不到的动作。\n她并没有捏碎旗舰，而是用另一只手轻轻拉开了胸前那巨大的衣领。那是两座仿佛由洁白玉石雕琢而成的、绵延万里的柔软山峦。深不见底的乳沟散发着惊人的热量与香气，对于旗舰上的人来说，那是最温柔也是最恐怖的监狱。\n“去吧，乖乖待在里面，别乱动哦。”\n随着她手指的松开，旗舰“荣耀号”在引力的牵引下，径直坠入了那深邃的乳沟之中。舰体与那两团硕大无比的乳肉发生了接触。\n“唔……稍微有点凉凉的，还挺舒服。”\n林凤满足地哼了一声，双手在胸侧用力向内一挤。 那两座巨大的乳峰瞬间合拢，将旗舰死死地夹在了中间。恐怖的挤压力让旗舰的龙骨发出了悲鸣，但又恰到好处地没有立刻被压扁。在这一刻，这艘代表着文明最高科技结晶的旗舰，彻底沦为了这只巨大狐娘胸口的一枚别针。 "
  gts_linfeng.221.a: "怎么会这样，我的舰队，那个凑粉毛怎么敢！派出我们的舰娘希瞳去给她点教训"
  gts_linfeng.222.name: "未知的粉色威胁"
  gts_linfeng.222.desc: "收到命令后，希瞳不耐烦地咋了一下舌。她手中正把玩着的一颗土著星球，被她像丢垃圾一样随手甩向了深空——那颗倒霉的星球在飞行过程中撞上了一片小行星带，瞬间炸成了一朵绚烂的烟花，但希瞳连看都懒得看一眼。\n“真麻烦……明明刚找到一点感觉。”\n虽然嘴上抱怨，但作为帝国舰娘的服从性还是让她动了起来。空间折跃的光芒一闪，下一秒，希瞳的身影便出现在了边境星域。\n当她看到远处那个粉色的巨大身影时，金色的瞳孔微微收缩了一下。（没有帝国识别码，没有能量回路反应……只是一个体积大一点的野生生物吗？）\n“作为野生巨娘来说，长得倒是不错。正好抓回去当个宠物。”\n希瞳冷笑一声，甚至没有完全展开战斗姿态。希瞳漫不经心地抬起手，掌心瞬间凝聚起数枚幽蓝色的反物质能量弹。这可是足以瞬间蒸发一支联合舰队的火力，她觉得用来打“招呼”已经足够给面子了。\n能量弹拖着长长的尾焰，精准地轰向了林凤的面门。 然而，预想中的爆炸和惨叫并没有出现。希瞳愣住了。 那几枚足以贯穿地壳的能量弹，在距离林凤鼻尖还有几千公里的地方，像是撞上了一堵看不见的墙壁连涟漪都没有泛起，就这样无声无息地……消失了。\n林凤那双一直半眯着的紫色眼眸，缓缓睁开了一条缝。她甚至没有改变原本慵懒漂浮的姿势，只是微微侧过头，看向了这边飘在空中的希瞳。\n“哎呀……没想到呢。”\n“小人的文明也会豢养比他们还要强大不知道多少倍的存在么？“明明拥有能够将星间万物都当做玩物的身躯，却依旧自甘堕落戴上项圈充当虫子的看家犬……可真是委屈你了呢。”“但既然你已经攻击我了，可就别怪我还手咯～”\n林凤嘴角的笑意加深了，那是猎人看着落入陷阱的猎物时特有的温柔。\n希瞳还没来得及反驳，就看到林凤轻轻抬起了一根手指，只是简单的指尖轻点。刹那间，原本漆黑冰冷的宇宙真空，被染成了刺眼的赤红色。 火球。 最基础的、毫无花哨的火球，但是是那种数量完全无法计算。\n“这种东西——！” 希瞳下意识地撑起护盾，试图嘲笑这种原始的攻击手段。但下一秒，她的脸色变了。 第一颗火球撞上护盾时，她感觉像被一颗恒星正面撞击。 紧接着是第二颗、第三颗、第一万颗……希瞳的视野瞬间被无尽的烈焰吞没。她引以为傲的绝对防御在这一波火球术面前，脆弱得像是一层保鲜膜，仅仅坚持了不到三秒就宣告破碎。\n不知过了多久，攻击的频率慢慢降了下来。她在刻意控制节奏——就像是把猎物玩弄到半死之后的悠闲。林凤一边漫不经心地用几颗巨型火球将希瞳死死压制在原地，一边优雅地飘近，居高临下地看着狼狈不堪的希瞳。\n“虽然说我并不介意让你给这些小虫子们陪葬，但我还是挺乐意饶你一命的。毕竟，同类很难得嘛～”\n林凤伸出巨大的手指，轻轻挑起希瞳那已经满是灰尘和伤痕的下巴，强迫她抬起头。\n“只要你愿意求饶～怎么样？很划算的交易吧？”\n希瞳剧烈地喘息着，金色的竖瞳因为剧痛和屈辱而颤抖，但依然死死地盯着眼前这个恐怖的狐娘。\n“哈？……我对这些虫子们自我介绍的时候……你没听见么？咳咳……” 希瞳咬着牙，嘴角溢出一丝鲜血，试图维持最后的尊严，“我可是……御月家的希瞳……”\n“啧啧……看来还没听懂呢。”\n林凤遗憾地摇了摇头，手指微微用力，指尖燃起一缕更加纯粹的金色火焰，以此作为警告。\n“那就重新自我介绍一下吧——”\n在这无尽的星空背景下，林凤的声音如同宣判命运的神谕：\n“林凤。来自异界的旅者。” “以及——你往后余生都要用你的生命、用你的一切去侍奉的……主人。”"
  gts_linfeng.222.a: "她怎么向着首都星球过来了？！"
  gts_linfeng.223.name: "未知的粉色威胁"
  gts_linfeng.223.desc: "战斗结束得比任何人想象的都要快。 曾经不可一世的希瞳，此刻像是一个坏掉的玩偶，四肢被几道紫色的魔力锁链死死缠绕。她只能眼睁睁看着那个粉色的恶魔——林凤，用一种近乎散步的悠闲姿态，拖着她向那个她发誓要守护的母星飘去。\n随着距离的拉近，庞大的粉色阴影彻底笼罩了首都星。 大气层在林凤那恐怖的质量面前瑟瑟发抖，引发了全球范围的强对流风暴。地面上的人们绝望地抬头，看到的不再是天空，而是林凤那巨大的裙摆。\n“啊……走了这么多维度的路，脚稍微有点闷呢。”\n林凤停在了首都星的平流层之上，声音慵懒而妩媚。她无视了下方无数防空警报的凄厉尖叫，自顾自地抬起了那条修长的右腿，巨大的手掌搭上了高跟短靴边缘。\n伴随着皮革摩擦的声响，那只比整座首府城市还要巨大的黑色短靴被缓缓褪下。 一股肉眼可见的热气瞬间从靴筒中涌出，这股对于常人来说足以致死的“毒气”，直接在大气层中扩散开来。在那令人窒息的热浪中，一只包裹着黑色丝袜的玉足暴露在了空气中。 因为长时间的包裹，黑丝紧紧地贴合在她的肌肤上，勾勒出脚掌完美的肉感弧度。甚至能看到丝袜足底部分因为汗水浸透而呈现出更深的黑色。\n“希瞳酱，你说……这只脚要是踩下去，那个像积木一样的宫殿，会变成什么样呢？”\n林凤回过头，屑屑地笑着。还没等希瞳回答，她手指一勾，魔力锁链猛地收紧，将希瞳强行拖到了自己的脚下。\n“唔！你……你想干什么……” 希瞳惊恐地挣扎着，但她的脸颊已经被林凤那只散发着浓烈气味的黑丝玉足死死抵住。\n“嘘。别说话，好好看着，好好闻着。”\n林凤猛地发力，那只巨大的黑丝脚踩着希瞳的后脑勺，像是在踩一块垫脚石一样，带着希瞳的头颅狠狠地向下方那个象征着最高权力的总统府压去。希瞳发出了撕心裂肺的惨叫，但无济于事。 她的脸被迫紧紧贴着地面，视野里是惊恐逃窜的同胞。 而在她头顶，是那只正在无情施压的巨大黑丝脚掌。没有什么奇迹发生。 希瞳那张精致的脸庞，在林凤脚掌的巨力下，狠狠的贴到了地上。她亲眼看着自己的脸颊挤碎了总统府的穹顶，亲身体验着数百万人瞬间化为肉泥的触感。整座首府城市，就这样被林凤踩着希瞳的头，硬生生地碾成了一个巨大的凹陷深坑。\n林凤满意地看着脚下这幅“杰作”，脚趾隔着黑丝，在希瞳的头顶轻轻磨蹭了两下，像是在擦掉脚底沾染的灰尘。”"
  gts_linfeng.223.a: "这下完了"
  gts_linfeng.225.name:"未知的粉色威胁"
  gts_linfeng.225.desc:"“呜……呜呜……我愿意……我什么都愿意……” 废墟中，传来了希瞳破碎的哭腔，“求求你……放过他们……用我……用我来换……”\n“用自己来换取你的国家的安全么？倒也很有意思呢，但是呢——\n我为什么不把你和你的国家都变成我的囊中之物呢？”\n“不会真信了吧～？逗你玩的呢，成为了我的女仆，可就要永生永世全心全意的为我服务哦，倘若你有一丝异心……我会让你死的很难看哦。”\n“哦……差点忘了呢，你的国家。看在你的态度还不错的份上，勉为其难的陪你们玩玩过家家游戏吧。"
  gts_linfeng.225.a:"..."


  gts_linfeng.224.name: "给凑粉毛一拳"
  gts_linfeng.224.desc: "一切发生得都很突然，也很……儿戏。\n也许是长期被当作玩物积攒的怨气，也许只是单纯的脑回路短路。在那个普通的午后，维持着常人大小的希瞳，面无表情地看着眼前正凑过来想要调戏她的林凤，鬼使神差地挥出了拳头。\n“砰！”\n一声清脆又略带空洞的闷响。 仿佛敲在了一个熟透的好瓜上。\n空气凝固了三秒。\n林凤愣住了。她两只手立刻捂住脑袋顶上被敲的地方，整个人缩了一下。头顶那对粉色的狐狸耳朵瞬间变成了“飞机耳”，死死地向后压去。 她抬起头，那双桃花眼里泛起了一层薄薄的水雾，脸颊气鼓鼓地成了包子，看起来竟然……意外地有点可爱？\n“你敲我头……” 林凤的声音里带着一丝不可置信，还有显而易见的委屈。 “很痛的哎！而且会长不高的你知不知道！”\n希瞳收回手，依然板着那张三无扑克脸，冷冷地说道：“手滑。谁让你凑过来的。”\n“唔……气死我了！气死我了！” 林凤像个被抢了糖果的小女孩一样在原地跺了跺脚，她恶狠狠地瞪了希瞳一眼。\n“我要还手！我现在就要敲回来！”\n话音未落，林凤的身影凭空消失。 还没等希瞳反应过来，天空……变色了。\n原本湛蓝的天空瞬间被一片漫无边际的粉色取代——那是林凤瞬间巨大化后的皮肤。希瞳僵硬地抬起头，看到了一幕让她后悔刚才那随手一敲的景象。在大气层之外，那张刚刚还因为委屈而气鼓鼓的脸庞，此刻已经变得比月球还要巨大。林凤依然鼓着脸颊，一只手捂着刚才被敲的头顶，另一只手却握成了足以覆盖半个大洲的巨拳。 她带着一副“我很生气、后果很严重”的表情，控制着那只巨拳，从外太空向着地表——也就是希瞳所在的位置，狠狠砸来。\n“这叫——礼、尚、往、来！”\n那个粉色的巨拳摩擦着大气层燃起了熊熊烈火，像是一颗灭世的陨石，带着毁灭一切的气势落下。\n“等……你管这叫‘敲回来’？！” 希瞳那万年不变的冰山脸终于崩不住了，眼角疯狂抽搐。\n轰隆————！！！\n没有给她吐槽的时间，巨拳落下。 地壳像是被重锤砸中的饼干一样瞬间崩碎，冲击波横扫了整个半球，海洋被瞬间蒸发，山脉被夷为平地。整颗星球都在这一拳的威力下发出了痛苦的呻吟，彻底偏离了原本的公转轨道。\n尘埃落定。 原本繁华的大陆板块中心，出现了一个深不见底的、巨大的拳印深坑。\n在那深坑的最中心，灰头土脸、衣衫褴褛的希瞳狼狈地躺在坑底。而肇事者——那个巨大的粉毛狐娘，正蹲在大气层外，用手指戳着这个深坑，脸上带着大仇得报的满足笑容\n“哼！扯平了！”"
  gts_linfeng.224.a: ""





  gts_linfeng.301.name: "林凤的舰娘改造？"
  gts_linfeng.301.desc: "“你的意思是说……想要我为你的帝国提供一艘舰船，而那艘舰船就是我的身体，对么？”\n你抬起头来仰望着林凤的面容，而她则是满脸不悦的俯视着那艘你所在的帝国目前为止最为巨大的太空战舰——她正因你打扰了她用星球爱抚自己身体的行为感到不悦。\n“是的……帝国财政与目前的工业能力无法在短期内组织起一支足够防御外敌的舰队，而我们现在还有许多的威胁要应对……”\n你的话还没有说完，林凤便对着你的方向翻了个白眼，接着再将她手中的那颗无人星球握成了一片片围绕着她的拳头公转的行星碎片。\n“不用说那么多的原因呢，我只需要知道你需要我就行了。我当然不需要花费你的帝国的那么多的资源，不过——这并不代表你不需要让你的帝国付出些代价。”\n你听着她的话语咽了口口水，几滴冷汗顺着你的额头缓缓滑落，你不清楚她会让帝国付出何种代价，但可以预见的是，她索要的代价绝对会让你的帝国现状雪上加霜——\n“不用那么紧张呢，你的帝国当然支付得起~”\n听着她的话，你渐渐放松了你的身体。有她这句话做保证，她肯定不会提出什么过于恐怖的要求了……\n“一颗星球，我可不要那种无人星球呢，我要的是有人居住的宜居星球。”\n你愣愣的看着她，这种代价对帝国而言说不上沉重，但也并不廉价。\n“瞧你那表情……我当然不会在你的疆域内随机挑选幸运儿呢，这一次，牺牲‘谁’由你来决定哦~”\n说着，你的面前出现了一块漂浮着的暗紫色的水晶，那块水晶发着微弱的紫光，上面还印着一个淡紫色的六芒星，不仔细看的话都很难看出形状来。\n“想好了的话就把它放在那颗星球的总督府上，我会亲自来‘验收’~‘验收’完成后，我就会把你想要的舰娘交给你。”\n说完这话，林凤的身影便消失在了她召唤出的传送门当中，只留下了一片胡乱飘荡的行星碎片、一块破碎的星系与你所在的舰船。\n*做好决定吧，要牺牲一整个星球……"
  gts_linfeng.301.a: "解锁一次性行星决议：在总督府安放水晶"

