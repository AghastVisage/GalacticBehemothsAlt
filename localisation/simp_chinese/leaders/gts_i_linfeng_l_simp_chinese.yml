  edict_gts_linfeng_shoes_give_description:"向林凤请求殖民援助"

  gts_linfeng.307.name:"殖民援助"
  gts_linfeng.307.desc:"“想要用我的鞋子来当殖民地？你们这种生物也真是从不挑食呢，居然能想出在鞋子上建立殖民地……”\n林凤的言语通过灵能传递到了你与内阁成员们的耳中，尽管你们已身处帝国最强大的旗舰上，但你们却依然无法看清林凤那过分庞大的身躯的全貌，可以确定的是，这次她现身的体型要远比初见她时的体型巨大不知多少倍。\n你们唯一能确定的是，你们所处的这片星域大概率正处于林凤的趾缝间，毕竟就在旗舰之外，你的国民已因四处弥漫着的过于浓厚的足部清香而陷入了几乎无止境的性爱狂欢中。\n你试着借用林凤身上散发出的灵能来查看林凤现在的体型究竟有多大，然后你便猛然发现光是这些从她身上自然逸散出的魔力就能够轻易的将你压碎，想要借用她的魔力恐怕至少也得达到她千分之一的体型……\n“是的……帝国发展并不顺利，我们探索了许多星域都未能找到适合我们的种族生存的星球，恳请您能够大发慈悲，将您的鞋子赐予我们……”\n国务卿如此说着，你并不将希望寄托于用言语来让林凤听话，你很清楚想让林凤给予好处就必须为她献上相应的代价。\n“倘若——我说不呢？你们的帝国发展是很不顺呢，但这与我有什么关系呢~？我现在完全可以把你们的帝国变成我足趾间的玩物，让你们和你们那卑微的种族一起永生永世为我的一根小小的脚趾服务，让你们永远居住在一点比微生物还要小的足垢上呢~”\n“我们可以为此付出些……”\n国务卿的话还未说完便被一场意外所打断，旗舰所处的星域毫无征兆的爆发了一场宇宙风暴，对此毫无准备的舰队在风暴中不断摇摆飘荡着……\n“付出代价？哪怕你们真的愿意用整个帝国作为代价也完全不如的我一双鞋呢，你们真觉得……你们的帝国在我眼中很重要么？而且——”\n宇宙风暴在一瞬间便平静了下来，周围混乱的星空在一秒不到的时间内迅速恢复了正常。\n“我动动脚趾就能处理掉的风暴却能要了你们的命，你们的种族未免有些太脆弱了吧~？”\n一丝寒意由你的心间扩散至全身，你很确信她正在用某种方式观察着你的反应。她不在乎你的帝国，但她在乎你。\n“不过——我倒是可以恩赐给你们一点呢。但是，你——我要拿去玩上几天。不容拒绝~♡”"
  gts_linfeng.307.a:"*为了帝国，哪怕是让我被这狐狸当成玩具玩我也乐意啊！"

  gts_linfeng.308.name:"殖民援助"
  gts_linfeng.308.desc:"“别……别这样……不是说好只是玩一下吗……”\n你抬起头来看着林凤，她正满脸宠溺的看着桌上对她而言和灰尘没什么区别的你，只是……她身上仅仅只披了一件薄薄的外套，而且她并没有将外套拉上，她将自己的酥胸几乎完全暴露在了你的面前。\n“是玩一下哦，玩一下‘过家家游戏’而已~”\n她将自己的双乳完全压在了你所在的桌上，你看着眼前如同山岳般巨大的乳球，完全不知道在这种体型差距下到底要怎样才会和她玩她所说的“过家家游戏”。\n“乖宝宝，张嘴~啊——”\n“不不不……不要这种过家家啊！我是成年人，不是那种幼儿，你别……给我留点面子……别——”\n林凤完全无视了你的话语，你的身躯被她的魔力托举着缓缓升起飘在了她的乳首前，你看着眼前那比你的身躯还要巨大的乳首，很难想象林凤居然会相用这样恐怖尺寸的东西给自己喂奶……\n林凤一只手轻轻按揉着你眼前的那团乳球，她的手指时不时地轻轻揉捏着乳首，不时地从中挤出些许散发着淡淡乳香的乳汁，就像是在诱惑着你一样，引诱着你主动向她发出一个乖宝宝的请求。\n那淡淡的乳香缓缓飘入你的鼻腔中，那清新的乳香让你感到异常的舒适，舒适到原本不能接受的事情现在似乎也不是不能被接受……\n“妈……妈妈——”\n“真棒~乖宝宝，张嘴~”\n你顺应着她的话语缓缓张开了自己的嘴，一股温热的热流缓缓涌入你的口中，没有想象中的激烈，就像是一位母亲在哺育自己的孩子一般，温柔、让人安心，让人忍不住的想要在这个时候把眼睛闭上，依偎在她温暖的怀抱中沉沉睡去……\n当你再次醒来时你已回到了旗舰上，而林凤现在正以天体级的大小悬浮在旗舰前，在她的面前有三块不同颜色的水晶，她眯眼看着旗舰缓缓开口。\n“好啦，忙活完了呢，接下来就该让你们做选择题咯~想要这双高跟呢，还是这双靴子呢，还是说……你们想要这双凉鞋~？”"
  gts_linfeng.308.a:"*高跟什么的最棒了口牙！"
  gts_linfeng.308.a.custom_tooltip:"“嗯~很不错哦，我也很喜欢高跟呢。这双就送你们啦~记得自己签收~”\n林凤将她的一双高跟鞋丢在了一片我们未曾探索过的星系中，现在我们可以前往那片星系殖民她的鞋子了。"
  gts_linfeng.308.b:"*开什么玩笑，肯定是要小凉鞋，美味！"
  gts_linfeng.308.b.custom_tooltip:"“凉鞋么？那好吧~就放在这里好咯，自己去签收吧~”\n林凤的身躯渐渐虚化直至我们完全无法观测到她。\n一片我们未曾发现的星系突然出现在了我们的星域图上，那片星系里还有一双极为巨大的凉鞋，那大概就是林凤要赐给我们的殖民地了。"
  gts_linfeng.308.c:"*靴子，一定要靴子！味大，无需多言！"
  gts_linfeng.308.c.custom_tooltip:"“诶呀~？还是气味控小虫子呢~不过嘛，我也很喜欢靴子就是咯~那……这双短靴就给你们好咯。”\n林凤挥了挥手，然后消失在了星空之中。\n我们探测到了一片我们未曾发现过的星系，那片星系中还有一双短靴，看样子应该就是林凤赐予我们的短靴了。"
  gts_linfeng.308.d:"*小孩子才做选择，我全都要！"
  gts_linfeng.308.d.custom_tooltip:"“贪心的孩子。看在我心情还不错的份上，都给你们咯。不过嘛，你们的几个领袖我要接受玩一玩w”\n我们探测到了新的星系，三个，探测到了足足三个星系！帝国有救了，我们不用再担心生存空间的问题了！"

  pc_gts_linfeng_shoes1_planet:"高跟鞋"
  pc_gts_linfeng_shoes1_planet_desc:"林凤脱下的高跟鞋，做工相当精湛。"
  pc_gts_linfeng_shoes2_planet:"凉鞋"
  pc_gts_linfeng_shoes2_planet_desc:"林凤脱下的凉鞋，似乎有一段时间没穿过了。"
  pc_gts_linfeng_shoes3_planet:"短靴"
  pc_gts_linfeng_shoes3_planet_desc:"林凤脱下的短靴，做工精湛且味大。"

  d_linfeng_shoes_1:"星球遗迹"
  d_linfeng_shoes_1_desc:"我们在鞋垫上发现了大量的星球碎片与遗迹，这下就能解释为什么我们的天文学家在观测星海时总会发现有星球突然消失了。"
  d_linfeng_shoes_2:"文明遗迹"
  d_linfeng_shoes_2_desc:"不知源于何处的文明，现在我们只能看见它们在林凤的鞋垫上留下的遗迹，以及那些被“小帮手”们堆叠起来的等待清理的遗骸山峰。"

  gts_linfeng_shoes_1:"小帮手"
  gts_linfeng_shoes_1_desc:"林凤的高跟鞋内有一种奇怪的机械生物存在，在外面来之前它们似乎是一种鞋内清洁工。林凤将鞋子赐予我们后，它们转而开始为我们服务。"
  gts_linfeng_shoes_2:"足香大气"
  gts_linfeng_shoes_2_desc:"高跟鞋内到处都弥漫着林凤身上特有的清香，这股清醒里还有少量的催情物质与低浓度的气态魔力。"
  gts_linfeng_shoes_3:"浓烈足臭"
  gts_linfeng_shoes_3_desc:"短靴内的足臭远比我们想象的还要浓烈，但也多亏了这足臭是来自林凤，毕竟她身上的散发出的各种气体基本都有催情成分。"
  gts_linfeng_shoes_4:"汗渍海洋"
  gts_linfeng_shoes_4_desc:"凉鞋上有大片大片的由林凤留下的汗液构成的海洋，在这些海洋周围布满了林凤留下的汗渍，它们的气味可比别的巨娘的闻着要舒服多了，而且里面还有完整的海洋生态系统！"
  NAME_gts_linfeng_fleet:"林凤"
  gts_linfeng_changed_semen_planets:"泄欲星球"


