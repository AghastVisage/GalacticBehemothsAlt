  gts_azure_waters.2.name:"初次进入"
  gts_azure_waters.2.desc:"这处裂隙被破坏后，我们的世界便与量子之海连接了起来，在探清风险之前，最好先跟随希儿她们一同进入。"
  gts_azure_waters.2.a:"跟随§B希儿§!进入"
  gts_azure_waters.2.a_custom:""
  gts_azure_waters.2.b:"跟随§R「希儿」§!进入"
  gts_azure_waters.2.b_custom:""
  gts_azure_waters.2.c:"离开"
  gts_azure_waters.2.c_custom:"这里多变的坏境与大量未知生物对我们还是太危险了...让更熟悉的人来领队吧"
  gts_azure_waters.3.name:"探索"
  gts_azure_waters.3.desc:"§B希儿§!顺着记忆来到了记忆中的那片区域。自跌入量子之海后，周围逸散的能量便一点点进入了她的身体，似乎她天生便与这里有着某些特殊的亲和。跟随着的科学官尝试接触周边漂浮着的世界泡，但随着距离越来越近，她的体型也不断地变小，漆黑的世界泡仿佛无边无际般扩展开来。注意到这一情况的§B希儿§!无奈地伸出手，将她靠在指尖从世界泡的边缘离开。“想要进入世界泡的话，就会受到它本身规则的影响，所以自己也会被改变。”“诶？你问§B希儿§!为什么没有被影响？大概是因为§B希儿§!和量子之海融为一体？”\n随着体型的不断增大与感知能力逐步提高，在原先世界泡的不远处§B希儿§!感受到了某些熟悉的气息。她激动的情愫已经溢于言表，已经没有什么能够阻拦她们的重逢。"
  gts_azure_waters.3.a:"给布洛妮娅一个惊喜?"
  gts_azure_waters.3.a_custom:""
  gts_azure_waters.3.b:""
  gts_azure_waters.3.b_custom:""
  gts_azure_waters.4.name:"探索"
  gts_azure_waters.4.desc:"“先说好，你们乱跑要是出了什么事情，我可不会浪费时间去救你们。”刚刚进入量子之海，§R§R「希儿」§!§!便警告打算为科研献身而跟随进来的科学官们。“我对这里的适应性没有希儿那么强，如果你们出了什么事情，回去我也不好交代…”\n§R「希儿」§!的警告不无道理,我们如今对量子之海的知识过于贫乏,如果贸然行动很有可能造成不必要的损失,处于安全与效率考虑,我们还是跟随着她探索即可"
  gts_azure_waters.4.a:"......"
  gts_azure_waters.4.a_custom:""
  gts_azure_waters.4.b:""
  gts_azure_waters.4.b_custom:""
  gts_azure_waters.5.name:"惊喜"
  gts_azure_waters.5.desc:"§B希儿§!将自己的体型压缩到了与感知中布洛妮娅一致的水平，虽然接近极限的缩小带来了些许的不适，但为了给布洛妮娅姐姐一个惊喜，§B希儿§!还是维持这样的体型向她悄悄靠近。\n与此同时，布洛妮娅成为理之律者后也经历了相似的变化，近十万倍的身躯几乎可以无视任何阻拦的生物，游荡在虚无中的量子之影常常在布洛妮娅无意的移动中被粉碎。经过了许久漫无目的的漫游，布洛妮娅突然感到身后出险什么威胁，但转身后却没有发现异常，只是一片照旧的虚无与一些漂浮着的世界泡。还未等布洛妮娅放松警惕，她的眼睛便突然被两只纤细的小手蒙住，感到身后的柔软紧紧贴住自己，便打消了摆脱的念头。\n“姐姐猜猜我是谁。”§B希儿§!悄悄捂住了布洛妮娅的眼睛，身体紧紧贴住她，静静地等待姐姐的回答。“希…§B希儿§!。”听到久违的声音，布洛妮娅不敢相信，难以抑制心中激动。“§B希儿§!终于找到你了，布洛妮娅姐姐。现在，让§B希儿§!带姐姐离开这里吧。”"
  gts_azure_waters.5.a:"好欸"
  gts_azure_waters.5.a_custom:""
  gts_azure_waters.5.b:""
  gts_azure_waters.5.b_custom:""
  gts_azure_waters.6.name:"白希 招募板鸭2  暂时废弃"
  gts_azure_waters.6.desc:""
  gts_azure_waters.6.a:""
  gts_azure_waters.6.a_custom:""
  gts_azure_waters.6.b:""
  gts_azure_waters.6.b_custom:""
  gts_azure_waters.7.name:"意外"
  gts_azure_waters.7.desc:"经过不知多久的探索，我们得到了许多许多珍贵的数据，但寻找§C布洛妮娅§!依然没有任何进展。在她们打算返回时，「希儿」突然感到了危险的气息，迅速构造出了镰刀准备应对。经过探测，我们也发现了让「希儿」警戒的源头，但认清远处的人影是谁后，她却放松了警惕。\n“姐姐大人，好久不见。”「希儿」将镰刀收起，朝着§C布洛妮娅§!飘去。但§C布洛妮娅§!出乎意料地突然对她发起了攻击，浮游炮的烟尘散去后，「希儿」愤怒地站在那里。“你们先走，我待会就把§C布洛妮娅§!姐～姐～一起带出去。”「希儿」恶狠狠地威胁，我们见状便立即准备撤离……\n在裂隙外联系到希儿后，我们又等待了许久。终于看到「希儿」与§C布洛妮娅§!一同从裂隙中离开，虽然我们没有见到后续，但看到得意洋洋的「希儿」和有些愧疚的§C布洛妮娅§!，我们大概也能猜到发生了什么…"
  gts_azure_waters.7.a:"huh"
  gts_azure_waters.7.a_custom:"欢..迎?"
  gts_azure_waters.7.b:""
  gts_azure_waters.7.b_custom:""
  gts_azure_waters.8.name:"§C布洛妮娅§!"
  gts_azure_waters.8.desc:"从量子之海中离开,§C布洛妮娅§!终于找到§B希儿§!.如今她们在这个宇宙中安定下来"
  gts_azure_waters.8.c.name:"与§R希儿§!的关系"
  gts_azure_waters.8.c.desc:"她作为§B希儿§!的另一个人格,§C布洛妮娅§!相信她一定不会做危害§B希儿§!的事.我们会一起保护好§B希儿§!的"
  gts_azure_waters.8.d.name:"接下来的打算"
  gts_azure_waters.8.d.desc:"§C布洛妮娅§!会和§B希儿§!呆在这里很长时间,直到找到原本的世界...有什么需要的话就尽管向§C布洛妮娅§!提吧"
  gts_azure_waters.8.e.name:"你可以做什么"
  gts_azure_waters.8.e.desc:"§C布洛妮娅§!可以担任许多职位,这就看你的需要了"

