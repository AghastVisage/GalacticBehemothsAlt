l_simp_chinese:
  gts_seele_li.1.name:"起始"
  gts_seele_li.1.desc:"[event_target:gts_azure_waters_system.GetName]中的哨站检测到了一阵奇异的能量波动，经验证与星界裂隙产生时具有极高相似性。我们同时也在这里观测到了裂隙的产生，但它明显极不稳定，一些奇怪的东西从中不断涌出，但又立即消散在虚空中。间歇性的能量涌动毫无疑问地告诉我们有什么庞大的东西正在接近，无论是新的星神兽或是巨娘，我们必须先考虑好自己的安全……"
  gts_seele_li.1.a:"帮“她”摆脱"
  gts_seele_li.1.a_custom:"探索裂隙为后续内容,需要招募§R希儿§!或§B希儿§!后才可推进"
  gts_seele_li.1.b:"封死这里"
  gts_seele_li.1.b_custom:"将获得大量物理学与星界丝缕和暗物质。§R但将结束绀海组事件链!§!"
  gts_seele_li.2.name:"撕裂"
  gts_seele_li.2.desc:"经过几次尝试，我们成功将裂隙的“出口”扩大了不少，越来越多的物质从中显现，更多的物体能够在彻底消散前稳定下来，同时派遣进入的科研船得以排除这些物质的遮挡，进一步进入这片“全新？”的空间，至于成果…我们很快便会知道了"
  gts_seele_li.2.a:"保持警惕"
  gts_seele_li.2.a_custom:""
  gts_seele_li.2.b:"先进行收集"
  gts_seele_li.2.b_custom:""
  gts_seele_li.3.name:"关闭"
  gts_seele_li.3.desc:"长期溢出的物质将裂隙的入口减少了不少，我们越来越难观测到其中的动向，先前的能量涌动也更难追踪，如果我们想要继续探索的话，必须尝试让裂隙重新开放。"
  gts_seele_li.3.a:"试试吧"
  gts_seele_li.3.a_custom:""
  gts_seele_li.3.b:"就让它关上吧"
  gts_seele_li.3.b_custom:"§R这将结束绀海组事件链!§!"
  gts_seele_li.4.name:""
  gts_seele_li.4.desc:"我们成功找到了能量波动的源头-一位昏迷的少女，她的眼睛禁闭，红色的头发十分凌乱，身上还有许多伤口，似乎连“存在”也十分不稳定？经过估算，她的体型大致处于我们认定的泰坦级，为了保证她的安全，随行的科研船决定先将她一并带回，这一决定无异减慢了裂隙中探索的进程，相信是值得的。\n这位红发少女被安置到了一处荒无人烟的星球上，随行的只有医疗团队与科学官，相信更详细的检查报告很快便可以送达……"
  gts_seele_li.4.a:"研究她的状态"
  gts_seele_li.4.a_custom:""
  gts_seele_li.4.b:"继续探索裂隙"
  gts_seele_li.4.b_custom:""
  gts_seele_li.4.c:"收集资源"
  gts_seele_li.4.c_custom:""
  gts_seele_li.5.name:"苏醒"
  gts_seele_li.5.desc:"尽管这位少女10w倍的体型给诊断带来了些许麻烦，但真正阻碍医疗的是她让科研团队也无从下手的身体状态。犹如虚空孳孽一样虚体化的量子态，不时落入虚无的身体变化都为研究提供了新的素材，排除这些影响，她甚至十分“健康”？\n但更离奇的是她在离开裂隙后体型便不断增大，仅仅一个月便从仅有10w倍增大到30w倍，而且随着身体的状况趋于稳定还在不断加快，负责人员经历数次场地迁移后索性直接将设备搬运到她的身上。\n从最近得到的数据来看，她也许很快便会苏醒……也许这个月？或是明天…？就是现在！驻守人员被剧烈震动惊醒，快速乘着运输船离开了地表，从空中望去，她的身体停止了增长，静止在了大致50w倍的体型。如今正坐在这片陆地上，警惕地盯着运输船。"
  gts_seele_li.5.a:"接通通讯"
  gts_seele_li.5.a_custom:""
  gts_seele_li.5.b:""
  gts_seele_li.5.b_custom:""
  gts_seele_li.6.name:"§R「希儿？」§!"
  gts_seele_li.6.desc:"从昏迷中苏醒，她像是丢失了珍视的东西，对周围陌生而熟悉的一切十分警惕"
  gts_seele_li.6.a.name:"你是？总不能连句自我介绍都没有吧？"
  gts_seele_li.6.a.desc:" 短暂的沉默后，这位少女可能觉得有些不妥，还是说出了自己的名字。“§R「希儿」§!”"
  gts_seele_li.6.b.name:"你为什么会在裂隙里？"
  gts_seele_li.6.b.desc:"一段更长的沉默后，我们没有等到回答而是一个新的问题“你们对我做了什么？希儿现在怎么样了？！”"
  gts_seele_li.6.c.name:"我们没有对你做任何事情"
  gts_seele_li.6.c.desc:"那我又是怎么脱离她独立存在的……你们什么都不知道？"
  gts_seele_li.6.d.name:"没有见到其他人，你的状况?"
  gts_seele_li.6.d.desc:"影子怎么奢望脱离本体存在呢…既然你们也没什么头绪，能不能帮我回到量子之海？或者说带我去“裂隙”？"
  gts_seele_li.6.e.name:"“§B希儿§!”到底是？"
  gts_seele_li.6.e.desc:"是个总想要逞能还要我保护的大笨蛋！可以了吧(哼)"
  gts_seele_li.6.f.name:"倒是可以带你去，但再进入可能有点困难"
  gts_seele_li.6.f.desc:"“什么？”§R「希儿」§!罕见地漏出惊讶的表情"
  gts_seele_li.hire_custom_tooltip:"§R「希儿」§!将加入我们"
  gts_seele_li.7.name:"尝试"
  gts_seele_li.7.desc:"我们带着§R「希儿」§!重新来到了裂隙,但她的身体经过这段时间的适应与成长已经无法进入,我们没有什么方法帮助她继续.一阵迟疑后,§R「希儿」§!向我们提出了一个新的请求"直接爆破裂隙,将其中的能量释放出来使周围短暂进入量子之海."她则会进行搜寻,让这里在跌入的过程中来到§B希儿§!周围.无论怎样,这应该值得一试?"
  gts_seele_li.7.a:"那就试试吧"
  gts_seele_li.7.a_custom:""
  gts_seele_li.7.b:""
  gts_seele_li.7.b_custom:""
  gts_seele_li.9.name:"futa内容"
  gts_seele_li.9.desc:""
  gts_seele_li.9.a:""
  gts_seele_li.9.a_custom:""
  gts_seele_li.9.b:""
  gts_seele_li.9.b_custom:""
  gts_seele_li.10.name:"亲嘴"
  gts_seele_li.10.desc:"我们在裂隙处成功引爆，大量能量不受控制地涌出，星系中的一切快速发生着变化，仿佛被这股洪流吞噬。等到周围归于平静，星系内似乎都没入了量子之海中。\n而不远处正是§R「希儿」§!挂念的§B希儿§!，她有些惊讶地看着突然出现的§R「希儿」§!，一时不知所措。“另一个我？是你吗？”\n“嗯，不要怕。§B希儿§!，我来带你离开这里了。”§R「希儿」§!一边靠近，轻声安慰着希儿。“现在闭上眼睛，剩下的交给我吧。”\n看着希儿放心地闭上眼睛，身体靠在自己怀里，§R「希儿」§!端详了一小会，便轻轻吻了上去。§B希儿§!刚开始有些慌乱地抗拒，似乎觉得另一个自己在戏弄她，但熟悉的安心感与信任还是让她相信§R「希儿」§!。\n随着§R「希儿」§!有意的引导，周围越来越多的能量汇聚到§B希儿§!身上，星系中量子之海的影响也在不断减少，隐约可以看到原貌。§R「希儿」§!终于恋恋不舍地放开了§B希儿§!，成功将她从量子之海中带了出来。看着眼前熟悉的§B希儿§!，§R「希儿」§!还是难忍激动再次紧紧抱住了她。\n不过由于先前对裂隙的爆破，恐怕这处疤痕彻底无法愈合了。以及…相比预期，她们是不是太大了点？"
  gts_seele_li.10.a:"至少结果是好的"
  gts_seele_li.10.a_custom:""
  gts_seele_li.10.b:""
  gts_seele_li.10.b_custom:""
  gts_seele_li.11.name:"清理完成"
  gts_seele_li.11.desc:"我们清理了裂隙处积攒的许多物质,现在可以再次尝试扩大它.但行动必须尽快,不断溢出的能量很快便会再次封闭"
  gts_seele_li.11.a:"快些吧"
  gts_seele_li.11.a_custom:""
  gts_seele_li.11.b:""
  gts_seele_li.11.b_custom:""
  gts_seele_li.12.name:"§B希儿§!"
  gts_seele_li.12.desc:"从量子之海中脱身,现在与§R「希儿」§!一同加入了你"
  gts_seele_li.12.a.name:"欢迎"
  gts_seele_li.12.a.desc:"大家这么热情,§B希儿§!都有点不适应呢..."
  gts_seele_li.12.b.name:"§B希儿§!可以做什么呢"
  gts_seele_li.12.b.desc:"只要是§B希儿§!可以做到的,§B希儿§!一定会尽力的"
  gts_seele_li.12.c.name:"关于量子之海..."
  gts_seele_li.12.c.desc:"如果可以的话,§B希儿§!还想再去找§C布洛妮娅§!姐姐..."
  gts_seele_li.12.d.name:"是否适应这里"
  gts_seele_li.12.d.desc:"嗯,§B希儿§!的身体会慢慢稳定下来,很快就会适应的"


  gts_seele_li_special_project:"扩张裂隙"
  gts_seele_li_special_project_DESC:"将裂隙周围阻塞的物质清除,使科研船能够正常进入探索"
  gts_seele_li_anomaly_1:"再次打开"
  gts_seele_li_anomaly_1_desc:"清理裂隙周边积攒的许多物质,使得这里再次打开一丝缝隙"
  gts_seele_li_anomaly_2:"爆破裂隙"
  gts_seele_li_anomaly_2_desc:"利用最简单的方法对裂隙进行扩张,直接爆破激发其内部的物质,使周围短暂进入量子之海..."

