  gts_oversystem.6.title:"探索"
  gts_oversystem.6.desc:"我们终于进入了这个鞋子,出乎意料的是我们在鞋子中探测到了许多恒星系,其中的诸多星球已在长久的浓郁足臭熏染中无法居住,鞋垫上更是散布着无数的星球乃至恒星的残骸,这里的环境堪称恶劣,与以往见到的任何星系都无法相提并论,但我们还是得以找到了能够落脚的地方.得以建立据点对这里进行研究\n也许我们能够从中找到更多关于巨大化的科技,或许可以找到某些幸存者?(虽然希望存疑..."
