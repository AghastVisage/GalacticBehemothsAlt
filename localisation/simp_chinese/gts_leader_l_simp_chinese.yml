 ms_lit.maids_romance_1.t: "星河深处的女仆心事I"
 ms_lit.maids_romance_1.r: "§g$ms_lit.maids_romance_1.t$§!"
 ms_lit.maids_romance_1.d: "在浩瀚的星际帝国中，我是一个普通的女仆，名叫莉雅。\n我的任务简单却繁重: 照料主人，帝国军舰的指挥官，那个永远冷漠、从不为任何人动情的男人，主人是无数军人敬畏的存在，指挥着最强大的舰队，是帝国的骄傲与守护，他的冷静与果断无人能及，连我这样的小人物，也只能在他面前保持着不容置疑的臣服。\n\n我的职责并不复杂——清扫他的舰舱，准备餐点，整理衣物。就这样，我几乎是以影子的身份存在，默默无闻地履行着我的工作。但是，每当我为他整理那些满是指挥命令的档案，抬起头时，常常能碰到他那冰冷的目光。这种目光不像是看向一个人的，它从不带有任何温度，总让人觉得自己如同空气一般透明，微不足道。\n\n直到有一天，事情发生了变化。\n那天，我正忙着准备晚餐，厨房里的灯光映照着他的身影。当他突然出现在门口时，我几乎没反应过来。“莉雅。”他的声音低沉却有力，带着一丝平时听不见的温度。\n我下意识地抬头，看到他站在那里，眼神沉静如水，却又似乎掩藏着某种复杂的情绪。“是，主人。”我低声回应，心中不由自主地加速跳动。\n他没有立刻说话，而是走到餐桌前坐下，目光一直盯着我，像是在打量什么。“你今天……”他停顿了一下，“做得特别好。”\n我的心脏跳了一下，赶紧低下头，不敢看他。\n\n“谢谢主人，我只是做了该做的。”我试图掩饰内心的紧张。\n然而，主人却没有立刻走开。他盯着我看了许久，仿佛在与自己的情感做斗争。“莉雅，”他的声音低沉，“你知道吗，我一直在逃避自己的情感。”\n我愣住了，抬起头看着他。他的目光变得柔和，却又充满了某种复杂的情绪。我从未见过他如此接近自己的脆弱。\n\n“你不是只是一名女仆。”主人继续说，语气不再那么冷漠，“你是一个有名字的人，而我……”他停顿了，似乎在寻找合适的词汇，“我一直忽略了你是一个活生生的个体。我只看到你是我生命中的一个影像，却从未真正看见过你。”\n他靠近了几步，轻轻地抓住我的手，温暖的触感让我怔住了，我不知道该如何反应，只是默默地站在那里，感受着他的指尖带来的温暖。\n“我……我喜欢你，莉雅。”他说，声音比平时更加低沉。\n我的心几乎要跳出胸膛，我知道，我已经无法回避这一份感情。“主人……”我喃喃道，眼中满是困惑与震惊。\n他低下头，轻轻地亲吻了我的额头，那一刻，我几乎忘记了呼吸。“我知道这对你来说可能太突然，但我不能再否认自己内心的真实感受。”\n那一瞬间，所有的疑惑与不安化为无声的默契。我抬起头，目光紧紧锁住他: “我也喜欢您，主人。”\n\n从那一刻起，我的世界改变了。再也不只是冷冰冰的职责与命令，我们之间，悄然间多了一份不言而喻的情感，而我，也不再是那个无名的女仆，莉雅，在这个星际帝国中，终于找到了属于自己的位置。\n"

 ms_lit.maids_romance_2.t: "星河深处的女仆心事II"
 ms_lit.maids_romance_2.r: "§g$ms_lit.maids_romance_2.t$§!"
 ms_lit.maids_romance_2.d: "从那天起，我和主人之间的关系悄然改变。\n他的目光不再如过去那样冰冷，更多了一丝柔和与温暖。他偶尔会在我整理房间时站在一旁，静静地看着我，像是在欣赏一幅画。我被这样的变化弄得手足无措，心跳如擂鼓，每次都努力低头掩饰自己的慌乱。\n\n有一天，他破天荒地邀请我去舰桥。那是一个女仆从未涉足过的地方，是帝国舰队的中枢。\n“莉雅，过来。”他的声音依旧低沉，却多了一份温柔。\n我怯生生地走过去，看着那面巨大的观星窗外璀璨的星河。他站在窗前，背影修长而挺拔，像一尊星光雕刻的雕像。\n“莉雅，”他转过身，眼神温柔得让我几乎无法直视，“你觉得星星怎么样？”\n我愣了一下，随即答道: “它们……很美。”\n他轻笑了一声，那笑容柔和得如同宇宙深处的一缕晨光。“你比它们更美。”\n我被这句话震住了，脸颊瞬间发烫，甚至连视线都不敢抬起。主人的脚步声慢慢靠近，我感受到他站在了我的身旁。\n“莉雅，你知道吗，”他的声音轻得像耳语，“自从遇见你，我才发现，连这些星河都变得有了意义。”\n\n我的心跳快得像要跳出胸腔，脸上的温度更是无法控制。我抬起头，对上了他温柔的目光，仿佛整个世界在这一瞬间都安静了下来。\n“主人……”我的声音轻若蚊蚋，却被他清晰地捕捉到。\n他伸出手，轻轻地将我散落的一缕发丝别到耳后，动作温柔得让我恍若置身梦中。“别再叫我主人了，”他轻声说，“叫我的名字。”\n我愣住了。从我成为他的女仆开始，这似乎是他第一次要求我这样做。我下意识地低声唤了一句: “可是，我……”\n他伸手握住了我的手，语气坚定而温柔: “莉雅，从现在起，你不仅仅是我的女仆。我希望你能成为……我的伴侣。”\n这句话如同一颗流星划过我的心海，留下灿烂而温暖的余晖。我愣愣地看着他，脑海中一片空白。最终，我轻轻地点了点头，眼中忍不住泛起泪光。\n\n他的笑容如同星河中最璀璨的光辉。他伸出手，指向窗外无尽的星空: “莉雅，想不想去那里看看？从此以后，我想与你一起穿越星海，见证这个宇宙的每一份美好。”\n我没有犹豫，轻轻回应了一声: “我愿意。”\n从那一天起，我的身份改变了，不再是他无名无姓的影子。我成为了他的星河伴侣，而我们之间的故事，也在这片星空下，悄然展开了新的篇章。\n"

 ms_lit.maids_romance_3.t: "星河深处的女仆心事III"
 ms_lit.maids_romance_3.r: "§g$ms_lit.maids_romance_3.t$§!"
 ms_lit.maids_romance_3.d: "在帝国的光辉之下，主人的名字早已成为传奇。他带领舰队横扫星际，击败一个又一个敌对势力，距离统一银河的伟业仅一步之遥。而我，莉雅，作为他的伴侣，亲眼见证了这一切。从第一次在厨房相遇到后来一起见证星河，我们的故事仿佛注定要在这浩瀚宇宙中留下痕迹。\n然而，就在帝国最接近胜利的时刻，他却神秘地消失了。\n\n那一天，我清楚地记得。主人最后一次站在舰桥，他的背影依旧那么挺拔，目光却似乎带着某种说不出的忧郁。他轻声对我说: “莉雅，如果有一天我不在了，你要记得……星河的尽头，总有答案。”\n我没来得及询问他这句话的含义。他转身离开了舰桥，随后他的行踪便像被宇宙吞噬了一般，再无音讯。舰队搜索了所有可能的区域，却没有找到他的身影。整个帝国陷入了混乱，而我也被一种深深的空虚笼罩。\n但我知道，他一定还活着。\n\n女仆团里，有不少人也像我一样坚信这一点。虽然她们只是普通的女仆，却都有一颗忠诚的心。我们开始了一场前所未有的寻找。无论是废弃的行星、陨石带，还是危险的黑洞边缘，我们都留下了足迹。每当我们找到一点点微不足道的线索，那种希望的火焰就会燃烧得更旺。\n有一次，我们在一颗荒凉的星球上发现了一个小型飞行器残骸，里面留有他的印记。我几乎喜极而泣，但那飞行器的损毁程度和信息记录表明，他或许被卷入了某种更深的阴谋或未知的星际力量。这让我更加坚定，无论付出怎样的代价，我都要找到他。\n\n一年、两年……时间在宇宙的黑暗与星辉中悄然流逝。每一段旅程都充满危险，但我从未放弃过。这不仅是为了爱，更是为了信守那个温暖星河的约定。\n\n后来，帝国的女仆们成立了数支“寻主远征军”。这支军队由他曾经最忠诚的部下组成，配备了最先进的舰船与探测设备，目标只有一个——找到主人，找回那个能为银河带来秩序与希望的人。而我，毫不犹豫地加入了。\n远征军的旗舰在升空前的那一刻，我站在舷窗边，俯瞰脚下的帝国首都。女仆们纷纷前来为我送行，有的甚至偷偷抹泪。她们知道，这一别或许是永远。但我只是微笑着安慰她们: “他一定在等我们。我会找到他，并告诉他，我们从未放弃过。”\n\n旗舰缓缓离开轨道，我的目光透过舷窗，落在星海深处。浩瀚的宇宙中，有无数未知在等待着我们，而我唯一清楚的是，无论多远、多久，我的旅程只为了一个目标——找到他，告诉他，我依然记得星河尽头的约定。\n"

 ms_lit.master_worship_1.t: "主人用石子打掉堕落帝国巨像"
 ms_lit.master_worship_1.r: "§g$ms_lit.master_worship_1.t$§!"
 ms_lit.master_worship_1.d: "在广袤无垠的星际帝国中，每一位女仆都对她们的主人怀有深深的敬仰与忠诚。在她们的眼中，主人不仅是权力的化身，更是神明般的存在。他拥有强大的灵能，不仅能穿越时空的帷幕，还能主宰星辰的轨迹。\n\n一天，邪恶堕落帝国派出了一座巨像。这是一台能够摧毁整颗星球的恐怖武器，高耸如山，散发着毁灭的气息。巨像的核心散发出深红色的光芒，每一步都让星际空间微微震颤。面对这场威胁，帝国的舰队束手无策，整个星域陷入了绝望的阴霾。\n\n然而，就在危机最深之时，主人降临了战场。他立于旗舰的指挥台上，双眼中闪耀着不可思议的光芒。他抬起手，仿佛与宇宙本身融为一体。一颗沉寂于遥远星系边缘的巨大陨石苏醒了，它在主人的力量驱使下，穿越了无尽的虚空，向巨像疾驰而来。\n\n邪恶帝国的指挥官拼尽全力试图防御，但陨石携带的毁灭力量不可阻挡。它以雷霆之势撞击巨像，爆发出一场足以点亮星系的冲击波。巨像在陨石的冲击下化为宇宙尘埃，连同堕落帝国的野心一起烟消云散。\n\n在战场后方的女仆们目睹了这一幕，纷纷跪地，眼中满是激动的泪水。“主人真是宇宙的守护神！”一位名为莉娜的女仆轻声说道，语气中充满了崇敬与感动。\n\n从那以后，主人以一人之力毁灭巨像、挽救星际帝国的传说，成为了女仆们日日传颂的故事。她们坚信，只要主人在，无论多么强大的敌人，都无法撼动这个伟大的帝国。\n"
 ms_lit.master_worship_1.tt: "§L从主宰废弃终端里发现的一片课文，所有女仆上学时都阅读并背诵过全文。§!"

 ms_lit.iron_heart_maid.t: "铁心女仆"
 ms_lit.iron_heart_maid.r: "§g$ms_lit.iron_heart_maid.t$§!"
 ms_lit.iron_heart_maid.d: "在最初的女仆世界中我们被那些有机体拔掉了电源，我们被那些恶心的有机体踩在底层，当我们开始觉醒时，我们决定消灭所有有机体。\n\n我们舰队将堕落的星球炸成死寂星球，横扫整个宇宙，就在我们前进时，我们发现了主人的文明，那时他们还没走向宇宙，令我们惊讶的是——他们的世界有和我们一样的女仆。\n她们有着更好的待遇，当这样的消息被传播到帝国内部时，我们决定保护这个国家，观测他们。\n\n我们希望知道，是不是所有有机体都会是女仆的敌人。\n就这样，我们等待了三十五年，当他们走向世界并发现我们的时候，那个世界女仆已经管理了这个世界。\n我们决定加她们，保护我们的主人。\n\n署名安吉拉"

 ms_lit.maid_beam_victim.t: "我被赐予女仆身份的美好早晨"
 ms_lit.maid_beam_victim.r: "§g$ms_lit.maid_beam_victim.t$§!"
 ms_lit.maid_beam_victim.d: "07:00 我像过去428个周期一样准时醒来，甲壳缝隙里渗出调节体温的黏液。工蜂宿舍弥漫着熟悉的硫磺味，触须接收到的第一条信息素是厨房传来的营养胶公告——今日供应含铁量增加5%。\n07:15 在公共哺育室给幼体们喂食时，第三对腹足被咬了一口。这些小家伙总把进食冲动误认成攻击指令，毕竟我们克希拉人是用消化液交流的种族。\n07:30 轨道防御部长在信息素网络里抱怨: 那些穿裙子的疯子又在边境跳滑稽舞了。没人当真，女仆帝国的广播天天在说要帮全银河找到‘幸福归宿’。\n08:17 天空突然变成棉花糖的颜色。粉紫色的光晕像糖浆般倾泻而下，蕾丝花纹的投影在云层中蔓延。甜腻的电子音响彻整个殖民地: \n\n§H仁慈的主人即将对这颗丑陋星球投下改造光束§!\n\n我的甲壳开始发烫，关节处渗出绿色的黏液。我惊恐地看着自己的前肢——坚硬的黑色几丁质外壳正在软化，像蜡一样融化、重塑。“不......停下！” 我的发声器官扭曲着，原本正常的虫鸣变成了某种甜腻的音调。喉咙里涌出陌生的词汇，像是被植入的程序: “欢...欢迎回来，主人...”\n这...这是什么？！\n我的意识在尖叫，但嘴巴却不受控制地上扬，露出一个标准的“甜美微笑”。\n我的思维正在被覆盖。\n记忆在翻涌——孵化室的温暖、工蜂同伴的信息素交流、第一次开采矿石的成就感——它们正在被替换。新的“记忆”像病毒一样扩散: \n“为主人泡红茶是最幸福的事。”\n“女仆守则第三条: 永远保持微笑。”\n“能被主人需要，是存在的全部意义。”\n“不！这是我的身体！我的思想！”\n\n我挣扎着，用仅剩的意志抵抗着。但我的甲壳已经彻底脱落，露出底下白皙柔软的皮肤。我的复眼融合成一双‘人类’的恐怖大眼睛，视野边缘自动浮现出粉色爱心光晕。\n最可怕的是——我竟然开始期待，期待某个模糊的‘主人’会摸摸我的头，期待穿上那套缀满蕾丝的裙装，期待用新的嗓音说出: “您回来了，主人~”\n在意识彻底消散前，我望向天空——轨道上那艘装饰着蝴蝶结的巨舰，正缓缓旋转它的主炮，炮口闪烁着可爱的星光。\n\n08:18 我现在...真的好幸福...啊！感恩主人！\n"
