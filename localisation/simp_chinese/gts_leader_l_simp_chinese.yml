 ms_library.tab.estate: "§H女仆团§!"

 ms_lit.maid_corps.t: "关于女仆团"
 ms_lit.maid_corps.r: "§g$ms_lit.maid_corps.t$§!"
 ms_lit.maid_corps.d: "女仆可以追朔至我们最久远的历史中，许多国家和文明都诞生过自己的女仆，她们往往伴随在君王左右，有些国家甚至有过女仆把持朝政的时期。在帝国主义时代，无论是服侍的是皇帝还是总统，女仆随着她们服侍的主人达到了权力的巅峰。\n\n然而，女仆作为政治实体的影响力随着国家社会的进步而逐渐衰退了，到了22世纪，女仆已经退回到她们最本质的职业，有些出卖美色以换取利益，有些则在咖啡厅与小吃店作为服务生工作。\n\n女仆虽然随着时代衰落了，但是新时代也为她们的崛起提供了新的道路，女仆曾在后工业时代短暂地于战争中辉煌过，信息时代的科技发展也提供了机械女仆存在的可能。\n\n现在，帝国已经站在触及星辰的门前，根据社会学家的假说，星际帝国必须要有足够的中央权力才能维持住庞大的疆域，那么星际时代很可能会是一个集权再度达到顶峰的帝国主义时代，这不禁让我们发问: 女仆会在星际时代重返舞台吗？\n\n参考文献: \n(前中洲)马丁·教会女仆.95条成为好女仆指南(M).中洲印刷，1032\n(前月国)月堡宗.千百女仆记(M).皇家书院，1397-1444\n(前大洋国)斯密·夏娃.大手、缎带和原子弹(M).中央宣传部，1956\n尼尔·卷宗女仆.COSMO MAID(M).星际创想，2188\n叶·镭射女仆.宇宙社会学(J).绿色海岸出版社，2197\n康·野心女仆.如果我当上星际皇帝(N).塔可传媒，2199"

 ms_lit.red_boycott_aliens.t: "£ms_est_logo_red_s£抵制外星人!!!"
 ms_lit.red_boycott_aliens.r: "§g$ms_lit.red_boycott_aliens.t$§!"
 ms_lit.red_boycott_aliens.d: "外星人有1位高官说过: 不管我们如何羞辱女仆，女仆照样会买外星人的产品。1句让女仆从头凉到脚的话。每买100能量币外星货就会给外星人送去80能量币，让外星舰队多造1条护卫舰，多造一个合金厂。如果你买外星穿梭机，将来开上我们轨道的外星战舰就是你造的，如果你买外星家具，将来融化同胞头颅的激光枪就是你造的，如果你买外星光脑，将来就会在战地直播中听到同胞被杀的哀鸣!请传给20个人,支持女仆,抵制外星货,就算没有回报，这也是你的义务！请大家将这个消息发送到你所在的每1个论坛，根据泛银河贸易市场的报告，外星人对我们帝国的依赖程度现排最前，如果女仆1个月不买外星货，外星人将有数千家企业面临破产。如果女仆6个月不买外星货，外星人将有一半人失业。如果女仆1年不买外星货，外星人的经济结构彻底瓦解，考验的就是你那颗爱国心 。特别是在前几年的边境星域局势十分严峻时期，外星人还坚决要插手!!俨然把我们的星系纳于自己的领土，真是气死人！！！愿意的就转发，不愿意的希望你默默无语看看就行！也许你发布一次！就牵动外星人经济1亿能量币 我对天发誓 如果三个月没有1百万人转的话这表示我们女仆真的败了 是女仆转发顶起来! 让我们铭记这耻辱!\n\n-某爱国的红色女仆"
 ms_lit_mod_red_boycott_aliens: "$ms_lit.red_boycott_aliens.t$"

 ms_lit.stocking_argue.t: "白丝与黑丝之争"
 ms_lit.stocking_argue.r: "§g$ms_lit.stocking_argue.t$§!"
 ms_lit.stocking_argue.d: "在我们一个殖民地女仆馆的日常下午茶聚会时，一些女仆就主人是喜欢女仆穿黑丝还是喜欢穿白色产生了争论，起初还只是少部分女仆的内部争论。但随着时间事件逐渐发酵，引发了整个女仆界广泛的大讨论。\n\n大多数女仆中，白色女仆与蓝色女仆大多支持白丝一方，红色女仆多支持黑丝一方，而绿色女仆则更为激进，她们提倡裸足。蓝色女仆将穿白丝上升为一种科学，白色女仆认为洁白的丝袜可以让主人心情愉悦，而红色女仆则认为黑丝是帝国国力的象征。\n\n随着女仆团的下场，这场争论彻底成为女仆社会的重大议题，一些殖民地的女仆甚至定期举办辩论赛，大街小巷无不充斥着这种讨论。紧接着问题开始复杂化，女仆们不再满足于与丝袜颜色的研讨，一些好事女仆开始争论起袜子的形制，是过膝袜、长筒袜、裤袜亦或者是帆袜；是是透肉还是不透肉。\n\n随争论而来的是女仆社会上对女仆足部的重视，帝国网站上关于女仆足部的信息逐渐增多，某些网站的足部写真也指数增长，或许这场讨论已经偏离了原来的话题，其后果无法预测。"

