    pc_gts_juice_uncolonizable: "爱液星球"
    pc_gts_juice_uncolonizable_desc: "被巨娘塞进爱巢的可怜星球，汹涌的浪涛不断冲刷着其上的文明\n其大气中充满了催情气体，一切生活在其中的生物都处于24小时发情的状态。"

    pc_gts_bruh_white_hole: "白洞"
    pc_gts_bruh_white_hole_desc: "据说如果能穿过白洞就能到达§R巨娘居住的世界§!，但直到现在似乎也没有人能做到完整地进入白洞。因为§Y$NAME_gts_eyjafjalla$§!瞬间注入的巨量乳汁，使得白洞的质量大增，发出的引力波比一般黑洞还强，更加干扰超光速引擎的工作，使战舰难以紧急脱离战斗。"

    sc_gts_bruh_white_hole_star_classes: "白洞"
    sc_gts_bruh_white_hole_star_classes_desc: "据说如果能穿过白洞就能到达§R巨娘居住的世界§!，但直到现在似乎也没有人能做到完整地进入白洞。因为§Y$NAME_gts_eyjafjalla$§!瞬间注入的巨量乳汁，使得白洞的质量大增，发出的引力波比一般黑洞还强，更加干扰超光速引擎的工作，使战舰难以紧急脱离战斗。"

    sc_gts_bruh_aurora_star_classes: "欧若拉"
    sc_gts_bruh_aurora_star_classes_desc: ""

    # 胖次星球
    pc_gts_bruh_panties_planet_01: "胖次星球"
    pc_gts_bruh_panties_planet_01_adj: "胖次星球"
    pc_gts_bruh_panties_planet_01_desc: "这颗星球被完全包裹在一条从无畏舰娘身上脱下的巨大蓝白条纹内裤之中。原本的天空已被厚达数公里的棉质织物所取代，抬头望去，只能看见无边无际的白色与蓝色纤维交织而成的「天空」。地表常年处于湿热、阴暗的状态，空气中弥漫着令人窒息的氨味、汗味与女性下体特有的浓烈麝香味。自然降水已不复存在，取而代之的是当上方的织物吸饱了体液后，滴落下来的粘稠爱液雨与变质的汗水。海洋已变成了浑浊的黄白色混合液体。"
    district_gts_bruh_panties_planet_01: "裤带城市"
    mod_pc_gts_bruh_panties_planet_01_habitability: "胖次星球宜居性"
    trait_pc_gts_bruh_panties_planet_01_preference: "胖次星球偏好"
    trait_pc_gts_bruh_panties_planet_01_preference_desc: "§L气候偏好由基因决定的，通过长期进化或人工操纵形成。§!"
    col_gts_bruh_panties:"胖次世界"
    col_gts_bruh_panties_desc:"一个被从舰娘身上脱下的巨大内裤覆盖的星球。"
    col_gts_bruh_panties_tt:"原本的天空已被厚达数公里的织物取代，地表常年处于湿热阴暗的状态，殖民者在织物纤维间建立城市，开采尿渍结晶作为能源，在爱液沼泽中打捞各种残骸\n空气中混杂着汗味、氨味与女性特有的浓烈气息"
    district_gts_bruh_panties_planet_01_plural: "裤带城市"
    district_gts_bruh_panties_planet_01_desc: "位于高空的巨大环形山脉，实则是勒紧星球的松紧带结构。这里远离了底部的潮湿与异味，空气相对清新且干燥。巨大的纤维如同天然的地基，为建筑提供了稳固的依托。"
    district_gts_bruh_panties_planet_02: "尿渍结晶发电区"
    district_gts_bruh_panties_planet_02_plural: "尿渍结晶发电区"
    district_gts_bruh_panties_planet_02_desc: "位于胖次前段的区域，通常是对应舰娘尿道口的位置。织物呈现出淡淡的黄色并已经硬化。这些「黄渍」中蕴含着巨娘排泄的高能化合物晶体。虽然开采过程伴随着令人窒息的氨气味，但燃烧这些晶体能提供惊人的能量，每一块晶体都浓缩了舰娘膀胱内的高能代谢废物。"
    district_gts_bruh_panties_planet_03: "爱液沼泽区"
    district_gts_bruh_panties_planet_03_plural: "爱液沼泽区"
    district_gts_bruh_panties_planet_03_desc: "位于胖次核心的区域，这里的织物常年湿润，形成了一片由爱液构成的沼泽。开采这里需要重型机械进行打捞，每一铲下去都能挖出各种残骸，那是无数个被舰娘塞入小穴内的星球残渣或船舰与爱液混合的产物。"
    district_gts_bruh_panties_planet_04: "棉线纤维矿区"
    district_gts_bruh_panties_planet_04_plural: "棉线纤维矿区"
    district_gts_bruh_panties_planet_04_desc: "这些如同通天巨塔般的棉质纤维是极佳的建筑材料。工人们攀爬在直径数公里的丝线上，开采这些坚韧的物质。当然，要小心别掉进纤维交织的深渊里，那里往往堆积着令人作呕的污垢。"

    d_gts_bruh_panties_planet_01_deposits: "尿酸黄晶矿床"
    d_gts_bruh_panties_planet_02_deposits: "拉丝爱液深潭"
    d_gts_bruh_panties_planet_03_deposits: "织物起球山脉"
    d_gts_bruh_panties_planet_04_deposits: "巨大的蝴蝶结"
    d_gts_bruh_panties_planet_05_deposits: "卷曲阴毛丛林"
    d_gts_bruh_panties_planet_06_deposits: "巨大洗涤标签"
    d_gts_bruh_panties_planet_07_deposits: "织物舰船残骸"
    d_gts_bruh_panties_planet_01_deposits_desc: "对应舰娘尿道口的织物区域呈现出硬化的深黄色。无数次排尿后残留的尿液在这里反复干燥、结晶，形成了坚硬的琥珀色矿脉。这些晶体散发着浓烈的氨气味道，只需轻轻敲击就能粉碎，从中提取出高纯度的化学原料，那是舰娘体内代谢出的精华。"
    d_gts_bruh_panties_planet_02_deposits_desc: "位于胖次正中央最湿润的凹陷处。这里是舰娘阴户直接接触的地方，积累了巨量的透明爱液。这些液体即使暴露在真空中也没有干涸，而是形成了一片粘稠拉丝的湖泊，不断释放出令人头晕目眩的浓烈费洛蒙，任何掉进去的物体都会被死死黏住，最终沉入底部。"
    d_gts_bruh_panties_planet_03_deposits_desc: "由于舰娘大腿根部的频繁摩擦，这片区域的棉布纤维断裂并纠缠在一起，形成了高达数千米的巨型毛球。这些毛球内部结构松散，如同迷宫一般，同时吸附了大量的汗水和微小的污垢颗粒，是开采纺织原料的绝佳场所。"
    d_gts_bruh_panties_planet_04_deposits_desc: "位于胖次正前方的装饰性蝴蝶结，如今成为了一座宏伟的纪念碑，吸引着无数游客"
    d_gts_bruh_panties_planet_05_deposits_desc: "几根从舰娘私处脱落的黑色阴毛掉落在这里，对于小人来说，它们是横亘在地表上、粗达数公里且坚硬无比的卷曲黑色山脉。这些巨型阴毛阻断了交通，且难以切断"
    d_gts_bruh_panties_planet_06_deposits_desc: "胖次上的巨大洗涤标签，如同一座光滑的白色方尖碑耸立在大地上。上面印着「100%棉」的字样"
    d_gts_bruh_panties_planet_07_deposits_desc: "一些倒霉的舰队在胖次落下时没能逃脱，被硬生生压进了棉布的纤维里。这些镶嵌在天空(布料)中的战舰残骸成为了独特的矿藏"

    mod_district_gts_bruh_panties_planet_02_max_add: "最大$district_gts_bruh_panties_planet_02$"
    mod_district_gts_bruh_panties_planet_03_max_add: "最大$district_gts_bruh_panties_planet_03$"
    mod_district_gts_bruh_panties_planet_04_max_add: "最大$district_gts_bruh_panties_planet_04$"

    job_gts_bruh_panties_planet_01_worker: "尿晶矿工"
    job_gts_bruh_panties_planet_01_worker_with_icon: "£job_miner£$job_gts_bruh_panties_planet_01_worker$"
    job_gts_bruh_panties_planet_01_worker_plural: "$job_gts_bruh_panties_planet_01_worker$"
    job_gts_bruh_panties_planet_01_worker_plural_with_icon: "£job_miner£$job_gts_bruh_panties_planet_01_worker$"
    job_gts_bruh_panties_planet_01_worker_desc: "专门负责在黄渍区域开采硬化的尿液结晶。这些工人配备密封面罩以过滤空气中的氨气，使用震动镐敲碎琥珀色的晶体层，将其送往炼制设施转化为能源"
    job_gts_bruh_panties_planet_01_worker_effect_desc: "提供$energy$及$volatile_motes$产出"
    mod_job_gts_bruh_panties_planet_01_worker_add: "$job_gts_bruh_panties_planet_01_worker$岗位"
    mod_job_gts_bruh_panties_planet_01_worker_per_pop: "每$VALUE$人口§G+1§!$job_gts_bruh_panties_planet_01_worker$岗位"
    mod_job_gts_bruh_panties_planet_01_worker_per_pop_short: "\n每$VAUE$£pop£§G+1§!$mod_job_gts_bruh_panties_planet_01_worker_add$"
    job_gts_bruh_panties_planet_02_worker: "爱液打捞工"
    job_gts_bruh_panties_planet_02_worker_with_icon: "£job_pearl_diver£$job_gts_bruh_panties_planet_02_worker$"
    job_gts_bruh_panties_planet_02_worker_plural: "$job_gts_bruh_panties_planet_02_worker$"
    job_gts_bruh_panties_planet_02_worker_plural_with_icon: "£job_pearl_diver£$job_gts_bruh_panties_planet_02_worker$"
    job_gts_bruh_panties_planet_02_worker_desc: "操作重型机械在爱液沼泽中打捞残骸与爱液。这些工人需要极强的心理素质，因为每一铲挖出的都是粘稠拉丝的透明爱液，其中混杂着被碾碎的船舰碎片与星球残渣。打捞出的物质经过分离后可提取出资源"
    job_gts_bruh_panties_planet_02_worker_effect_desc: "提供$alloys$及$gts_giantess_fluid$产出"
    mod_job_gts_bruh_panties_planet_02_worker_add: "$job_gts_bruh_panties_planet_02_worker$岗位"
    mod_job_gts_bruh_panties_planet_02_worker_per_pop: "每$VALUE$人口§G+1§!$job_gts_bruh_panties_planet_02_worker$岗位"
    mod_job_gts_bruh_panties_planet_02_worker_per_pop_short: "\n每$VAUE$£pop£§G+1§!$mod_job_gts_bruh_panties_planet_02_worker_add$"
    job_gts_bruh_panties_planet_03_worker: "纤维采集工"
    job_gts_bruh_panties_planet_03_worker_with_icon: "£job_gts_giantess_underwear_worker£$job_gts_bruh_panties_planet_03_worker$"
    job_gts_bruh_panties_planet_03_worker_plural: "$job_gts_bruh_panties_planet_03_worker$"
    job_gts_bruh_panties_planet_03_worker_plural_with_icon: "£job_gts_giantess_underwear_worker£$job_gts_bruh_panties_planet_03_worker$"
    job_gts_bruh_panties_planet_03_worker_desc: "这些工人攀爬在直径数公里的棉质纤维上，使用特制的切割工具收割这些坚韧的材料。每日的工作都是在悬空数千米的高度进行的"
    job_gts_bruh_panties_planet_03_worker_effect_desc: "提供$gts_giantess_underwear$产出"
    mod_job_gts_bruh_panties_planet_03_worker_add: "$job_gts_bruh_panties_planet_03_worker$岗位"
    mod_job_gts_bruh_panties_planet_03_worker_per_pop: "每$VALUE$人口§G+1§!$job_gts_bruh_panties_planet_03_worker$岗位"
    mod_job_gts_bruh_panties_planet_03_worker_per_pop_short: "\n每$VAUE$£pop£§G+1§!$mod_job_gts_bruh_panties_planet_03_worker_add$"

