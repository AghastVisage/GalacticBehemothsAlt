    # 政策
    policy_gts_bruh_insurance_rate: "保险费率"
    policy_gts_bruh_insurance_rate_desc: "根据本公司与微观客户签署的§Y《天体级生物安全保障协定》§!，每隔十年，公司将启动资产回收程序进行保费结算。鉴于双方在体型与经济体系上的维度差异，常规货币已失去流通意义，因此协议规定以该文明的「生物人口」作为唯一认可的等价交换物。董事会可需根据当前的库存需求与外交战略，调整本周期的保费征收费率。此项决策将直接决定流入公司加工厂与宠物市场的货源数量，同时也会对客户文明的社会结构造成不同程度的物理性削减，进而影响其对公司的外交态度。\n\n§Y(只会向人口超过5000的星球收费)§!"
    gts_bruh_insurance_rate_1: "设定5%保费"
    gts_bruh_insurance_rate_2: "设定4%保费"
    gts_bruh_insurance_rate_3: "设定2%保费"
    gts_bruh_insurance_rate_4: "设定1%保费"
    gts_bruh_insurance_rate_5: "设定0%保费"
    gts_bruh_insurance_rate_1_name: "$gts_bruh_insurance_rate_1$"
    gts_bruh_insurance_rate_2_name: "$gts_bruh_insurance_rate_2$"
    gts_bruh_insurance_rate_3_name: "$gts_bruh_insurance_rate_3$"
    gts_bruh_insurance_rate_4_name: "$gts_bruh_insurance_rate_4$"
    gts_bruh_insurance_rate_5_name: "$gts_bruh_insurance_rate_5$"
    gts_bruh_insurance_rate_1_desc: "执行最高规格的保费方案。获准对客户星球启动广域地表刮削作业，强制征收该星球总人口的5%。这一比例对于任何微观文明而言皆属灾难性的社会创伤，将导致其劳动力断层与经济崩溃，并极大降低客户的外交态度。然而，这将为公司带来极其丰厚的「小人资源」，满足内部对微缩生物的高涨需求。"
    gts_bruh_insurance_rate_2_desc: "执行标准偏高的保费方案，将保险费率上调至4%\n这一比例虽略低于极限压榨，但对于微观文明而言，短时间内失去大量人口仍是沉重的负担。预期客户社会内部会产生强烈的恐慌与不满情绪，外交评估报告指出，长期维持此费率将持续侵蚀双方信任基础。虽然能确保大量资源流入，但需警惕潜在的违约行为，建议加强对该星球的武力威慑以确保合约履行。"
    gts_bruh_insurance_rate_3_desc: "维持标准的保费方案，将保险费率设定为2%\n这是一个精算后的折衷商业选择，既能维持公司的基础资源运作与巨娘员工的日常消耗需求，又不至于在短时间内彻底破坏客户的社会再生产能力。客户对此虽然怀有恐惧，但在绝对体型威慑下尚能维持基本的服从与运作。"
    gts_bruh_insurance_rate_4_desc: "采取象征性的保费方案，仅征收1%的人口作为象征性保费。对于坐拥庞大人口基数的微观文明而言，这一损失比例极低，甚至低于其自身因自然灾害或疾病造成的自然伤亡率。这种相对宽松的策略极大缓解了客户的生存压力与恐慌感，有助于维持较高的信任度与良好的外交态度。虽然公司本周期获得的实体生物资源减少，但稳定的客户关系有利于长期的渗透与其他高附加值服务的推广，符合长远利益最大化模型。"
    gts_bruh_insurance_rate_5_desc: "暂停本周期的实物保费征收。公司将以「市场推广」、「特别恩典」或「人道主义关怀」的名义，全额豁免该星球的保费。这一反常的仁慈举动将极大程度地消除其对巨娘企业的敌意。虽然本周期公司将无法从该客户处获得任何小人资源，且需自行承担运营成本，但这将最大限度地提升外交态度。\n\n§Y(不会触发保费缴交事件)§!"

