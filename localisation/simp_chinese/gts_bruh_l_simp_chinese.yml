    gts_intel_avatar_bruh: "是否交换有关§M鹅§!的情报？"
    gts_intel_avatar_bruh.tooltip: "一个未知来历的生物"
    gts_ui.134.desc: "我们的情报部门在我国的境内发现了一个奇怪的讯号\n\n似乎一段时间后，这个东西自己会找上门？"
    gts_bruh_ship_leader_desc: "如你所见，这是一只§M鹅§!。"

    gts_leader_bruh.0002.desc: "你可以在这里购买Bruh舰娘的坐标\n\n§Y"提醒您，虽然§M鹅§!总是会把影响力还你，但每次使用通讯面板所花费的影响力还是会增加§!\n\n§R所以别没事打扰§M鹅§!§!"
    gts_leader_bruh.0002.a: "Bruh舰娘 - 驱逐"
    gts_leader_bruh.0002.b: "Bruh舰娘 - 战列"
    gts_leader_bruh.0002.c: "Bruh舰娘 - 无畏"
    #gts_leader_bruh.0002.d: "玩到后期游戏速度慢怎么办？"
    gts_leader_bruh.0002.e: "开启舰娘随机事件"
    gts_leader_bruh.0002.e.custom_tooltip: "§M鹅:这些事件通常会摧毁一些东西，毕竟舰娘也没那么受控的......§!\n\n§R"自己斟酌要不要开吧(大多数事件要开这个才会触发)"§!"
    gts_leader_bruh.0002.f: "关闭舰娘随机事件"
    gts_leader_bruh.0002.g: "购买关于舰娘的弱点资讯"
    gts_leader_bruh.0002.g.custom_tooltip: "§M鹅:如果真的打不赢的话......§!"
    gts_leader_bruh.0002.h: "给点建议"
    gts_leader_bruh.0002.h.custom_tooltip: "§M鹅:我建议使用小型船只去打，舰娘的单发火力强大，小船的数量、高闪避、低造价都能很好的消除掉舰娘的攻击§!"
    gts_leader_bruh.0002.hire: "关闭通讯"
    gts_leader_bruh.0002.close: "关闭通讯"

    gts_leader_bruh.0003.name: "神秘讯号"
    gts_leader_bruh.0003.desc: "在支付了款项后，地图上显示了一个星系，附近一个未连接到任何超空间通道，名为§Y[event_target:gts_bruh_random_spawn_system_1.GetName]§!的脉冲星被标记了出来。\n\n§S查询情报日志§!以追踪位置"
    gts_leader_bruh.0003.a: "确定"
    gts_leader_bruh.0004.desc: "在支付了款项后，地图上显示了一个星系，附近一个未连接到任何超空间通道，名为§Y[event_target:gts_bruh_random_spawn_system_2.GetName]§!的脉冲星被标记了出来。\n\n查询§S情报日志§!以追踪位置"
    gts_leader_bruh.0005.desc: "在支付了款项后，地图上显示了一个星系，附近一个未连接到任何超空间通道，名为§Y[event_target:gts_bruh_random_spawn_system_3.GetName]§!的脉冲星被标记了出来。\n\n查询§S情报日志§!以追踪位置"

    gts_leader_bruh.0006.name: "击败驱逐舰娘"
    gts_leader_bruh.0006.desc: "战斗结束了。那位曾在星海中灵活穿梭的驱逐舰娘终于倒在了我们舰队的集火之下。她那娇小(相对而言)的身躯上布满了灼烧的痕迹，破损的舾装还在不断漏出冷却液，毫无生气地漂浮在太空中，我们的工程师迫不及待地登上了她的残骸。在那已经失去光泽的舾装中，我们找到了大量技术资料，关于如何在巨大的身躯上维持惊人的机动性，如何用动能武器发挥出毁灭性的威力，以及那些绑在她大腿上的鱼雷发射管的设计蓝图。\n\n§G解锁随机一种§MBruh驱逐舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!"
    gts_leader_bruh.0006.a: "确定"
    gts_leader_bruh.0007.name: "击败战列舰娘"
    gts_leader_bruh.0007.desc: "这是一场艰苦的战斗。那位战列舰娘直到最后一刻还在开火，她肩上的主炮在熄灭前轰出了最后一发炮弹，将我们三艘主力舰送进了历史。但最终她还是倒下了。在她那已经冷却的身躯中，我们还找到了一本笔记。里面记录着她对每一场战斗的感想，对每一次开火的校正数据，以及...对家乡的思念。原来她也曾是某个文明培养出的守护者。\n\n§G解锁随机一种§MBruh战列舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!"
    gts_leader_bruh.0008.name: "击败无畏舰娘"
    gts_leader_bruh.0008.desc: "我们做到了。付出了惨痛的代价后，我们击败了那位曾让整个星区为之颤抖的无畏舰娘。当她那比恒星还要巨大的身躯终于停止挣扎时，整个战场陷入了诡异的寂静。没有人敢第一个靠近她。那些曾经吞噬过星球的唇瓣，那双能够徒手捏碎战舰的玉手，那柄削铁如泥的斩舰刀...即使在死亡面前，她依然散发着令人窒息的威压。花了整整一个月，我们才完成对她尸体的初步勘探。我们发现了她的记忆数据。原来在变成这样的存在之前，她也曾是个普通的少女，是某种我们无法理解的技术将她改造成了这样的「武器」。在记忆的最后，一个想法闪过了她的脑海中。"我已经记不清自己的名字了，但我还记得...我曾经也想要被温柔对待......"\n§V(研究团队陷入了长久的沉默)§!\n\n§G解锁随机一种§MBruh无畏舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!"
    #gts_leader_bruh.0009.desc: "我这有两个能提升速度的选项§R(想好了再用，非必要别用)§!\n\n§R摧毁所有普通帝国大部分的军用船只，不包含民用船只§Y(小幅提升游戏速度)§!§!\n\n§R摧毁所有普通帝国几乎所有的船只，包含开采站及星港§Y(大幅提升游戏速度，但会失去除了殖民地以外的星系)§!§!"
    #gts_leader_bruh.0009.a: "§R摧毁所有普通帝国大部分的军用船只，不包含民用船只"
    #gts_leader_bruh.0009.b: "§R摧毁所有普通帝国几乎所有的船只，包含开采站及星港"
    gts_leader_bruh.0009.hire: "回到上一页"
    gts_leader_bruh.0009.close: "还是算了"

    gts_leader_bruh.0021.name: "鹅将军的奇妙提案"
    gts_leader_bruh.0021.desc: "通讯屏幕上出现了鹅将军那张标志性的脸庞。这只总是发出奇怪叫声的生物最近一直盯着舰娘们换洗下来的衣物发呆，那些面积媲美大陆、散发着浓烈气味的巨大胖次堆积如山。它突然灵光一闪，那颗聪明的脑袋里诞生了一个疯狂的想法。\n\n§M"光是把星球塞进小穴内还不够！"§!\n\n§Y(它拍着桌子大喊)§!\n\n§M"我们需要一种能让敌人世世代代都活在巨娘胯下阴影之中的手段!一种能够羞辱它们、封锁它们、让它们的后代只能呼吸少女私处气味的终极武器！"§!\n\n鹅将军说明了它的计划，画面上显示着一条巨大的舰娘胖次完整包裹住整颗星球的示意图。它需要收集不同类型星球被塞入舰娘小穴后的详细数据，以便计算出最合适的胖次材料强度、弹性系数，以及能够完美保存舰娘体味的织物配方。\n\n§M"我需要七种不同环境的星球数据"§!\n\n§Y(鹅将军兴奋地说)§!\n\n§M"荒芜的、冰冻的、有毒的、炽热的、干燥的、寒冷的，还有那种生机勃勃的！把它们全都塞进去，然后记录下舰娘小穴内壁的每一次收缩、爱液的分泌量、以及星球表面被碾压的具体数据！"§!\n\n它指着屏幕上标记出的七个目标星球。\n\n§M"完成这些实验，我就能制造出一种特殊的巨像武器。它能把舰娘刚脱下的、还沾满爱液和阴垢的胖次完整地套在敌人的母星上！让那颗星球永远沾着少女私处的气息！"§!\n\n§Y任务目标：使用舰娘的【塞入小穴】巨像武器处理掉7个指定星球(查询情报日志以追踪位置)§!"
    gts_leader_bruh.0021.a: "这个计划...居然有些道理？"
    gts_leader_bruh.0021.b: "忽略这个奇怪的生物"

    gts_leader_bruh.0022.name: "究极的原味兵器"
    gts_leader_bruh.0022.desc: "通讯屏幕上，鹅将军兴奋地挥舞着翅膀，它身后的实验室里堆满了各种数据图表和材料样本。\n\n§M"成功了！我成功了！"§!\n\n§Y(它激动地大喊)§!\n\n§M"经过对七种不同星球的详细数据分析，我终于研发出了完美的胖次包覆武器！"§!\n\n§M"套上去的过程非常简单"\n\n"舰娘只需要像平时脱胖次一样，把它从身上褪下来，然后对准目标星球一套就行。胖次的松紧带会自动收缩，紧紧勒在星球的赤道上，确保没有任何缝隙"§!\n\n屏幕切换到实战示范画面。一条巨大的蓝白条纹胖次被无畏舰娘脱下，她将胖次撑开，对准了一颗行星。画面中，那条胖次完整地套在了星球上。星球的赤道位置被松紧带勒出一道深深的凹痕。整颗星球被蓝白条纹的布料严密包裹。\n\n§M"这就是我设计的歼星武器！"§!\n\n§Y(鹅将军张开翅膀)§!\n\n§M"它不会立刻杀死敌人，而是让他们在漫长的时间里慢慢绝望。让他们明白，自己的文明、自己的母星、自己呼吸的每一口空气，都被一个巨大少女的小穴气味所污染，而且永远无法摆脱！"§!\n\n它顿了顿，补充道:\n\n§M"只有一个问题。脱下胖次的舰娘可能会感到不适。建议在执行任务时携带备用内裤，或者干脆真空作战。反正以舰娘的体型，大家本来就能看到她们的裙底风光了"§!\n\n通讯即将结束时，鹅将军认真地说:\n\n§M"感谢您对这个项目的支持。正是七次实验提供的宝贵数据，才让这个武器得以诞生。现在，原味胖次包覆武器已经可以正式投入生产了"\n\n§Y获得新巨像武器：$tech_gts_bruh_shipgirl_planet_killer_panties$§!"
    gts_leader_bruh.0022.a: "伟大的发明...大概吧..."
    gts_leader_bruh.0022.b: "有点同情那些被套住的星球了"

    gts_leader_bruh.0023.name: "不明日期与地点的日志"
    gts_leader_bruh.0023.desc: "无畏舰娘刚刚结束了一场长达两周的巡逻任务，身上的衣物早已被汗水浸透。一支舰队小心翼翼地接近正在休息的舰娘。她此刻正漂浮在恒星基地附近，双腿微微张开，让恒星过被汗水浸湿的胯部。那条蓝白条纹的胖次已经完全变了颜色，原本鲜艳的蓝色变成了暗沉的灰蓝，而白色部分则呈现出不均匀的黄褐色。\n\n§Y"舰娘小姐，我们需要...呃...收集您的...那个..."§!\n\n舰队指挥官结结巴巴地通过通讯器说道。舰娘睁开眼睛，看着那些漂浮在她胯下，如同飞蚊的的小飞船，脸上露出疑惑的表情。\n\n§R"收集什么？"§!\n\n§Y"您的...内裤..."§!\n\n指挥官硬着头皮说出来，声音小得像蚊子。\n\n§R"啊？！"§!\n\n舰娘的脸瞬间涨红。\n\n§Y"你们要我的胖次？这...这也太羞耻了吧！而且我已经穿了两个星期了，肯定很臭..."§!\n\n§M"正是因为这样才需要！"§!\n\n鹅将军的声音突然插入通讯。\n\n§M"我需要您最原汁原味的胖次！上面的汗液、爱液、尿渍、阴垢，全都是宝贵的研究材料！拜托了，这关系到帝国的未来！"§!\n\n舰娘犹豫了很久，最后还是叹了口气。\n\n§R"好吧...但你们要保证不会拿去做奇怪的事情..."§!\n\n她伸手勾住胖次的边缘，缓缓向下褪去。那条被浸透的内裤与肌肤分离时发出"嗤啦"的粘连声，裆部的布料更是因为干涸的爱液而变得硬邦邦的。当胖次完全脱下时，一股浓烈的气味瞬间扩散开来。当胖次被放入货舱时，舰员们即使隔着密封舱，也能闻到那股混合了汗臭、尿骚和腥味的复合气味。有几个人当场就晕了过去，剩下的人强忍着恶心，用机械臂小心翼翼地将这条巨大的胖次收纳进特制的密封容器中。\n\n§Y"样本采集完成...天啊...我这辈子都不想再闻到这种味道了..."§!\n\n指挥官虚弱地说道。而在基地里，鹅将军已经迫不及待地打开了密封容器。浓烈的气味像实体一样涌出，整个基地瞬间被这股臭味淹没。但鹅将军丝毫不在意，它兴奋地扑向那条有如平原一般的胖次，开始仔细检查每一处污渍。\n\n§M"完美!完美!这裆部的黄渍简直是艺术品！"\n"看这浓度!看这粘稠度!这得有多少爱液和汗水才能累积成这样！"§!\n\n§Y(日志结束)§!"
    gts_leader_bruh.0023.a: "(*´･д･)?"
    gts_leader_bruh.0023.b: "忽略这个奇怪的生物"

    gts_leader_bruh.0101.desc: "Colin很懒，这里什么都没有(如果你有什么文案想法就连络Colin吧)\n\n总之有小人被巨娘UB并被转化成巨娘了"
    gts_leader_bruh.0101.a.desc: "在最近人们私下生活中，个人式提供性服务的行业里出现携带小人一同上门服务的现象，而在这些服务者中，很大一部分巨娘用的是买来一次性使用的奴隶，仅有少量的那么几位是与她们的兄弟，朋友乃至伴侣，提供并不会伤及小人性命的服务，但不知道是因为稀缺还是这样的服务更舒服，后者是要比前者更受欢迎。那些夜晚到家欲求不满的，希望有其他人能狠狠的，充足地填补她们空虚的巨娘，会在灰暗的夜晚，月亮被云雾遮盖时拨打电话可求起这项服务，而要不了多久就会有人敲响她的房门，携带着小人奴隶的妩媚巨娘便与顾客在床上汇合。在清洗过身体之后，屋主会被要求躺在床上叉开双腿用手指剥开阴唇，掰开粉红的小穴，任由妩媚的巨娘将一个个糖果大小的小人用手指塞到深处，接着手指抽开，淫肉将小穴内的小人吞没覆盖，品尝起猛然激烈的感受。而妩媚的巨娘又会在此时像品尝糖果一样含入一个小人，扑倒屋主与其激烈地拥吻起来，品尝分享起滋味。两条如蟒的巨舌纠缠不休，不断地剐蹭，缠绕，紧紧包裹住小人的身体，榨取糖果小人的汁液。而只能维持一段时间，这颗小人糖果便会失去味道，失去汁液，失去反应，失去生命，失去了价值只能被屋主舌尖卷起吞入腹中，再补换上一颗新的糖果。淫靡色情中巨娘的小穴把小人的生命力咀嚼的一干二净，让两位巨娘的身体变得炙热一些，妩媚巨娘又往各自小穴里补充了点小人，抽出一根有着点点凸起粗大的硅胶双头龙，插入下体，将另一端对准屋主小穴猛然收腰顶胯。屋主能感觉到小穴被粗暴撑开，小穴内的小人被紧紧顶到子宫颈口，在妩媚巨娘不断的收腰摆臀，小穴不断吞吐抽插中，一个个在肉壁上被碾碎爆开，成为小穴内源源不断的快感，最终在一个临界点被巨娘的爱液冲洗排除。尽管这些个人式提供的性服务，大多都没有证书，不合法但也的确促进了人口的产生，政府便也对此，睁一只眼闭一只眼了。"
    gts_leader_bruh.0101.b.desc: "为了文明的繁盛人口繁荣，在法案颁布之后，有关ub方面的文化、综艺文学等等皆得到了政府部分的支持，并在人口诞生方面提供了相应的政策，让人们消无了此方面的顾虑。甚至在科学领域里，也宣扬起进行ub时的愉悦放松对人们精神身体方面有着不小的裨益。而拥有ub狂热特质的人们，大多数对于最近这些类似的文化潮流，皆有兴奋赞同的态度，并在这方面的行为举止，思想观念更为开放，愈加没有顾虑的使用小人奴隶用来ub。§Y[root.GetName]§!拥有着合法权益，纯洁爱情的体型差情侣间，发生ub的次数也更为频繁，而这较为亲密的交互开端绝大部分由体型优势的女方提出。当那些疲乏的巨娘到家之后，看到可爱的对象为自己的家付出的小小劳动，大部分只能做到整理一起共枕的床榻，并用一天时间在傍晚提供一份小小巧巧、精致的饭菜。那可爱又柔弱微小的模样，也要为家庭奉献小小力量的态度，足以洗去巨娘的疲乏，勾动她们的性趣，在饭后向小对象索取今日最后一项劳动。在白天收拾整洁的床上，巨娘与小人坦诚相待，而大部分巨娘此时会急不可耐地一把抓住小人丢入湿漉漉的小穴内，感受下体微小的挣扎，而那些意志力较强，可以克制住自己性欲的巨娘，会先玩弄小人对象，让小人进入状态，并让小人掌握进入小穴主动权，而那些被玩弄到兴奋的小人，却始终会无法控制的主动钻进小穴。在黏腻柔软的小穴，在潮湿闷热的腔室，在巨娘有意的轻柔下，小人可以浅层处毫无顾虑的在这为彼此带来欢愉。而越往深处走可以带来的欢愉，危险的程度，怀孕的概率也会越高，当然也不乏就是为了寻求这些刺激的小人，在对象尚未清醒反应过来下，爱液的甜津中有意前往深处，贴在子宫颈上，为彼此带来融化灵魂般的意识空白，这种情况下有75%的概率小人被淹没窒息、肉壁挤压碾碎，被敞开的子宫颈吞入子宫内，将自己有限的生命投入到了光荣的人口繁育中。而大部分有理智想要孩子的情侣，会更安全的使用特殊的自慰棒，把小人对象固定在顶端用公民科普教育的姿势完成安全完成受孕，尽管因此她们又获得了新的xp。"
    gts_leader_bruh.0101.c.desc: ""金钱不会带给你温暖，但小人会"\n门牌上这一段标语缀在小人玩用店的下端，而这种提供小人给巨娘游玩，发泄欲望的店，在资源的天平倾斜下早已开遍了大街小巷，每时每刻都有人走进店内，询问价格和玩法。但玩法通常是在一个私密房间内粉红的大床上，提供体型大小不一的小人玩弄，或者是提供一片超大的缩小城区供多人一起游玩，亦或者提供一间小型健身房，那些健身器材上都带有各种体型的小人，让巨娘做到边锻炼边愉悦。所幸在我们的治理下足以让所有巨娘都闲资，能每天体验一遍里面的所有玩法。在缩小城区内巨娘将憋闷在鞋中一整天的湿润丝足取出，解压的踩踏着那些没有她脚趾高建筑，而那些破坏后的建筑残骸和侥幸存活下来粘在足袜上的小人，会化作不断吸收足汗的除臭颗粒，直到他们无法吸收足汗化作无用的足垢。在发泄完破坏欲后那些巨娘躺倒在城市中，放松地舒展身体，感受着建筑在身体下松软的破裂开，涌起性趣的巨娘会抓起一大把小人与糯米构成的建筑，拨开被淫液打湿的阴唇，对准小穴口倾倒入阴道内，而后另一只手不断揉搓着阴蒂。而那种城市也只不过是小穴的玩物、阴道填满渺小的建筑与小人充实的感觉，让巨娘感到兴奋，敏感的阴道很快收缩起来，紧紧挤压着阴道里的异物，将里面的建筑与小人全部夯实，磨碎浸泡在分泌的爱液中，直到这位巨娘在自慰中到达了高潮。而放松完之后，那些巨娘离开缩小城区到达独属于个人的小型健身房，随便挑选一个车座是圆柱形，棒身带着凸起，在弧形的顶端坐着一个小人的自行车骑上去。随着巨娘踩动脚踏身形晃动，被小穴包裹的圆柱也不断地进进出出，小穴内圆柱上端坐在这的小人也会听话地在阴道深处按摩里面的软肉，等到高潮的临界点或是锻炼到有些疲乏，巨娘便会放松肌肉下沉身体，让圆柱把小人顶到子宫颈口，而被猛烈挤压着的小人会在那敏感处进行激烈的挣扎，产生足以让巨娘达到高潮的快感，之后那些小人会在亵渎巨娘后被高潮的爱液窒息，或是被巨娘体重挤碎在肉壁上。在每天的休息时间里，那些巨娘不厌其烦的在这里放松锻炼，最终睡倒在这里提供的床上，用调教好的、大小不一的小人塞满小穴，感受着下体密密麻麻的舔舐感，轻抚小腹然后满足的沉沉睡去。"
    gts_leader_bruh.0101.d.desc: "近期§Y[root.GetName]§!用小人来ub已经成为了社会上的潮流，与之相对的市场对于小人奴隶的需求也越来越大，以至于目前有了入不敷出的现象。尽管我们很快发现了这个问题进行了小人繁殖，但根据专业人士判断整个市场依旧会有一段时间的小人奴隶稀缺乃至空白期。而这也导致了这段时期的小人价值水涨船高，让某些巨娘有了别样的心思，将手对准了有合法公民权的小人，成为游走于灰暗地带的小人拐卖客。对此我们只能睁一只眼闭一只眼的加派警力，毕竟那些微不足道的小人最终会流往市场上被帝国的中坚力量巨娘使用，填补了这段时期的空白，两相比较下我们只在表面上维持对此类事件相当负责的态度，希望大批量的繁殖能尽早实现。而且在私底下，我们的执法人员也在使用这些小人，在她们下班回到家，吃完饭清洁完身体坐在柔软的大床上，巨娘警官释放压抑一天的性欲，取出她知道是不正当途径的小人奴隶撒到阴唇上，笑眯眯地看着小人颤抖地站不住身体，不断的在阴唇上磕头对着警官求饶解释他们是有公民权的小人，只是不小心被小人贩子抓到，被卖到了市场里。“嗯？有居民权的公民在哪？在化妆台上？还是在我的床头柜上？都没有呀，我只看到我买回来不听话的小人始终不愿意认清自己的地位，侍奉比他们可高贵多的小穴大人。”这些小人颤抖的更厉害了，彻底绝望地趴倒在肥美阴唇上掩面哭泣起来，看着小人可爱的哭容，如果在高潮后活下来，就把他们送回家吧，这么想着巨娘警官用手指按住小人移到小穴一个个捅入阴道深处这本该受她们保护的小人却被用来自慰让警官有了别样的刺激感，让她忍不住夹紧双腿来回摩挲，更加紧致的阴道内一个个爆裂感刺激起她的神经，她又忍不住把手指插了进去抠挖、抽插起来，在一个极致的快感后巨娘警官抵达了高潮。扁平的小人被爱液冲刷出来，暗红的液体也被爱液冲刷出来，小穴内重又变得干净只是在喷出的爱液中并没有小人存活下来，警官叹息着啧了一声，收拾下垫在身下的布子，沉入了梦乡。"
    gts_leader_bruh.0101.e.desc: "§Y等待投稿中§!"
