 gts_rainna_la_grande_arch.09_3_small.a:0 "这怎么会变成这样？"
 gts_rainna_la_grande_arch.09_3_small.b:0 "看来她的确回来了。"
 gts_rainna_la_grande_arch.09_4_giant.a:0 "好相似的求情信……"

 gts_rainna_la_grande_arch.10.name:0 "闭幕，陨落"
 gts_rainna_la_grande_arch.10_1_micro.desc:0 "在处理完前一段反复出现的绝望恳求后，科研团队追踪到了这段极其微弱、几乎被背景噪声完全吞没的最终信号。它像是某个幸存者用尽最后一丝力气，在彻底沉默前留下的最后记录：\n\n“……至此，文明终结……”\n\n信号在此处彻底中断，再无任何后续传输。\n\n科研人员已确认信号已完全消失。"
 gts_rainna_la_grande_arch.10_2_micro.desc:0 "这段信号的解码过程异常艰难。科研团队最终还原出的文本如下：\n\n“……让娜大人给您下达了最终的命令——针对您的罪行，有期徒刑，一百二十亿年……”\n\n信号在此处出现明显的停顿与频率抖动，随后是长时间的、无声的啜泣，像被极力压抑却无法完全消除。\n\n“……请允许我再陪您一段时间。在我们分离前的最后一段时间……”\n\n科研人员在确认译文后，没有人立刻开口。然而，再也没有任何有用的信息。"
 gts_rainna_la_grande_arch.10_2_micro_alter.desc:0 "这段信号的解码过程异常艰难。科研团队最终还原出的文本如下：\n\n“母亲，让娜大人给您下达了最终的命令——针对您的罪行，有期徒刑，一百二十亿年……”\n\n信号在此处出现明显的停顿与频率抖动，随后是长时间的、无声的啜泣，像被极力压抑却无法完全消除。\n\n“母亲……请允许我再陪您一段时间。在我们分离前的最后一段时间……”\n\n科研人员在确认译文后，没有人立刻开口。然而，再也没有任何有用的信息。"
 gts_rainna_la_grande_arch.10_2_micro_alter2.desc:0 "这段信号的解码过程异常艰难。科研团队最终还原出的文本如下：\n\n“主人，让娜大人给您下达了最终的命令——针对您的罪行，有期徒刑，一百二十亿年……”\n\n信号在此处出现明显的停顿与频率抖动，随后是长时间的、无声的啜泣，像被极力压抑却无法完全消除。\n\n“主人……请允许我再陪您一段时间。在我们分离前的最后一段时间……”\n\n科研人员在确认译文后，没有人立刻开口。然而，再也没有任何有用的信息。"
 gts_rainna_la_grande_arch.10_3_small.desc:0 "科研团队找到了一份非常重要的纸质文件，经过多次清洗与语言还原，还原出以下内容：\n\n“尊敬的女神大人，我们的人口所剩无几，并且每时每刻都有人因饥饿死去。也许，我们再也无法满足您的献祭要求了……”\n\n这封信与此前反复出现的恳求一脉相承，但冰冷的文字中敬畏与讨好，彻底转向了近乎麻木的绝望。自此，再也没有任何其他内容。"
 gts_rainna_la_grande_arch.10_4_giant.desc:0 "科研团队找到了两封信件，根据对比和还原，两封信件的内容被还原出来。\n\n“致后来的探险者：\n\n对暴政的屈服是这个文明灭亡的最终原因。当我们奉献出我们的一切，再也没有什么可以奉献的时候，我们的灭亡就已经到来了。当我们选择顺从而非反抗的那一刻，注定了终结的到来。但是，这并非最坏的选择。”\n\n“亲爱的……克里斯塔、希斯耶塔、菲妮亚、枫……\n\n感谢你们的陪伴。但是很遗憾的是，你的……需要因为难以饶恕的罪行接受应有的惩罚。这个宇宙将是我的另一个家，很久很久的家……请不要为我落泪，亲爱的……们。\n\n请你们照顾我的……。\n\n谨启\n您的……，……”\n\n至此，考古结束。"
 gts_rainna_la_grande_arch.10_4_giant_alter.desc:0 "科研团队找到了两封信件，根据对比和还原，两封信件的内容被还原出来。\n\n“致后来的探险者：\n\n对暴政的屈服是这个文明灭亡的最终原因。当我们奉献出我们的一切，再也没有什么可以奉献的时候，我们的灭亡就已经到来了。当我们选择顺从而非反抗的那一刻，注定了终结的到来。但是，这并非最坏的选择。”\n\n“亲爱的女儿克里斯塔、希斯耶塔、菲妮亚、枫……\n\n感谢你们的陪伴。但是很遗憾的是，你的母亲需要因为难以饶恕的罪行接受应有的惩罚。这个宇宙将是我的另一个家，很久很久的家……请不要为我落泪，亲爱的女儿们。\n\n请你们照顾我的母亲。\n\n谨启\n您的母亲，……”\n\n至此，考古结束。"
 gts_rainna_la_grande_arch.10_4_giant_alter2.desc:0 "科研团队找到了两封信件，根据对比和还原，两封信件的内容被还原出来。\n\n“致后来的探险者：\n\n对暴政的屈服是这个文明灭亡的最终原因。当我们奉献出我们的一切，再也没有什么可以奉献的时候，我们的灭亡就已经到来了。当我们选择顺从而非反抗的那一刻，注定了终结的到来。但是，这并非最坏的选择。”\n\n“亲爱的仆人克里斯塔、希斯耶塔、林凤、枫……\n\n感谢你们的陪伴。但是很遗憾的是，你的主人需要因为难以饶恕的罪行接受应有的惩罚。这个宇宙将是我的另一个家，很久很久的家……请不要为我落泪，亲爱的仆人们。\n\n请你们照顾我的主人。\n\n谨启\n您的主人，……”\n\n至此，考古结束。"
 gts_rainna_la_grande_arch.10_1_micro.a:0 "戛然而止。"
 gts_rainna_la_grande_arch.10_2_micro.a:0 "所以最后她被让娜关了起来？"
