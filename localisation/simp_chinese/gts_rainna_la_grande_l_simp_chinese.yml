 gts_rainna_la_grande_first_meeting.21115.a:0 "真是漂亮啊……"
 gts_rainna_la_grande_first_meeting.21990.desc:0 "蕾恩娜在太空中舒展了一下身体，最后看了一眼这颗完好无损的星球，嘴角带着几分真实的愉悦。\n\n“嘛，算了吧。”\n\n她自言自语着，语气轻快而随意。她的目光在星球表面停留了片刻，那双湖泊般的眼眸中难得地透出几分温和的光芒。\n\n"哼哼，你们还不感谢我大发慈悲？"\n\n她慵懒地将身体转向星海深处，长发在无重力中缓缓飘散开来。\n\n她漫不经心地说道，已经不再回头。\n\n"我还会回来的哦~"\n\n她的声音越来越远，最终消散在星海之中。只留下那场细雨，静静地落在完好的城市和街道上，洗去了她到来时留下的尘埃。"
 gts_rainna_la_grande_first_meeting.21990.desc_alter:0 "蕾恩娜最后俯视了一眼这颗星球，歪着头，若有所思地看了片刻。\n\n“嘛……”\n\n她轻轻地应了一声，嘴角勾起一抹温和笑意。\n\n“今天心情不错，所以你们运气也不错~”\n\n她在太空中调整了一下姿势，将身体慵懒地转向了更远处的星海。她的动作舒展而随意，丝毫没有任何依依不舍的意味，但也没有了之前那种冷漠的疏离。\n\n“保重哦~”\n\n她随口丢下这句话，就像是朋友之间最普通的道别。\n\n“我可是还会回来的~”\n\n她的身影在星光中慢慢淡去。星球上的人们仰望着那片重新归于平静的天空，这一次，心中的感受比以往任何一次都要复杂——既有劫后余生的庆幸，又有某种说不清道不明的期待。\n\n也许，下一次她再回来的时候，心情还会这么好吧。\n\n也许。"
 gts_rainna_la_grande_first_meeting.21991.title:0 "初次见面——结束"
 gts_rainna_la_grande_first_meeting.21991.desc:0 "蕾恩娜在太空中懒懒地舒展了一下身体，低头最后看了一眼这颗星球。\n\n那颗星球还在——勉强。两侧大陆已经面目全非，巨大的足印深深嵌入地壳，岩浆从无数条裂缝中缓缓渗出，将残存的地表染成暗红色。但至少，它还是一颗完整的星球。\n\n“嘛……”\n\n她将足底从星球表面缓缓抬起，随意地活动了一下足趾，让附着在足底的碎屑和尘土飘落回地表。那些曾经是城市、森林、海岸线的东西，就这样以另一种形式回到了它们原本的位置。\n\n“留着吧。”\n\n她自言自语着，语气中带着几分漫不经心的慷慨。她将目光从这颗星球上收回，望向了更远处的星海。\n\n“这次玩得还不错……”她喃喃道，声音渐渐飘远，“下次再来的时候，希望你们能更结实一点哦~”\n\n她的身影在星光中缓缓远去。"
 gts_rainna_la_grande_first_meeting.21991.desc_alter:0 "蕾恩娜最后俯视了一眼这颗星球，嘴角带着几分若有所思的弧度。\n\n足印、裂缝、干涸的海床、被碾平的大陆——她的目光从这些痕迹上一一扫过，就像是在欣赏某件自己随手完成的作品，既不特别满意，也不特别遗憾。\n\n“嘛，就这样吧。”\n\n她将身体慵懒地转向星海深处，足底在星光下划过一道柔和的弧线。\n\n“总算是留下点纪念品了~”她轻声自言自语着，声音里带着几分漫不经心的愉悦，“虽然手法有点重……不过嘛，下次注意就是咯。”\n\n她顿了顿，像是忽然想到了什么，回头看了最后一眼。\n\n“好好养伤哦~”\n\n她的声音已经远得几乎听不见了。\n\n星球上，幸存者们仰望着那片重新露出星光的天空，沉默地站在废墟之间。没有人知道该说什么，也没有人知道，那句"好好养伤"，究竟算不算是某种意义上的温柔。"
 gts_rainna_la_grande_first_meeting.21991.a:0 "她还会回来的……"
 gts_rainna_la_grande_first_meeting.21995.desc:0 "蕾恩娜在太空中伸了个懒腰，最后看了一眼这颗星球，嘴角带着几分真实的笑意。\n\n“今天交了一群新朋友。”\n\n她自言自语着，语气轻快而随意。她的目光在星球表面停留了片刻，那双清澈的眼眸中透出几分难得的温和。\n\n"真是开心的一天~"\n\n她慵懒地将身体转向星海深处，声音已经带上了几分飘远的意味。\n\n"我还会回来的哦~"\n\n她漫不经心地丢下这句话，身影开始在星光中消散。那道彩虹在她离去后还维持了片刻，然后缓缓淡去。"
 gts_rainna_la_grande_first_meeting.21995.a:0 "再会，朋友！"
 gts_rainna_la_grande_first_meeting.21996.desc:0 "蕾恩娜缓缓收回了那种神明般的姿态，在太空中静静地悬浮了片刻。\n\n她俯视着这颗星球，眼神中带着一种居高临下的平静，却也隐约透出几分满意。\n\n“嗯。”\n\n她只是轻轻地应了一声。\n\n“安啦安啦~我已经体会到你们的诚意了哦。”\n\n她的声音依然带着之前那份庄重，但语气中多了几分慵懒，那副神明的架势正在悄然松动。她伸出手指，在星球上方轻轻划过，留下一道几乎看不见的光痕。\n\n“你们可要老老实实祈祷，不要偷懒哦~”\n\n她将身体转向了更深的星海，长发在无重力中如星河般展开，遮住了这颗星球最后的视野。\n\n“……我可是还会回来检验你们的虔诚的~”\n\n最后这句话，已经带上了几分她惯常的轻快语气，和之前那副神明的姿态相去甚远。但没有人敢笑，也没有人敢松一口气。\n\n星球上，信众们跪倒在地，齐声诵念着祷词，送别这位降临又离去的"神明"。那些祷词在大气层中回荡，久久不散。"
 gts_rainna_la_grande_first_meeting.21996.a:0 "再见，我的主。"
 gts_rainna_la_grande_first_meeting.22111.title:0 "开恩？"
 gts_rainna_la_grande_first_meeting.22111.desc:0 "“开恩？”\n\n天空中传来一阵轻柔的笑声，那声音如同银铃般清脆，却带着难以言喻的压迫感。笑声在大气层中回荡，清晰地覆盖了这颗星球的每一个角落。\n\n“那么……”她的声音突然变得玩味，“你们想让我如何开恩呢？”\n\n蕾恩娜那湖泊般巨大的蓝色眼眸缓缓眯起，占据整个天空，投下更深的阴影。她似乎在认真思考这个请求，修长的手指优雅地抵在下巴上，做出沉思的姿态。\n\n片刻的寂静让所有人都屏住了呼吸。\n\n“嗯……就这样吧！”\n\n她似乎想到了什么有趣的主意。\n\n一滴晶莹剔透的液滴从天而降。那滴液体在阳光下折射出彩虹般的光芒，美丽而致命。它穿过大气层，在空中划出一道优雅的弧线，如同一颗坠落的流星。\n\n巨大的水珠砸向地表，落在一片城市之上。整座城市在其触地的瞬间被压成碎屑，液体如同海啸般扩散开来，形成一个直径数公里的巨型水坑，迸溅的液体瞬间击碎了附近倒霉的建筑。\n\n“嘛，如何？”\n\n蕾恩娜满意地看着自己的“杰作”，声音中带着有趣的天真。\n\n废墟在液体中迅速分解、融化。钢筋混凝土、玻璃碎片、扭曲的金属，一切都在这滴“恩赐”中化为乌有。液体表面冒着细密的气泡，散发出诡异的雾气。\n\n“嘛~”她俏皮地眨了眨眼，“你们的星球看起来真是顺眼多了。”\n\n巨大的水坑在阳光下泛着微光，如同星球表面的一颗巨大泪珠。"
 gts_rainna_la_grande_first_meeting.22111.desc_alter:0 "“开恩？”\n\n天空中传来一阵轻柔的笑声，那声音如同银铃般清脆，却带着难以言喻的压迫感。笑声在大气层中回荡，清晰地覆盖了这颗星球的每一个角落。\n\n“那么……”她的声音突然变得玩味，“你们想让我如何开恩呢？”\n\n蕾恩娜那湖泊般巨大的蓝色眼眸缓缓眯起，占据整个天空，投下更深的阴影。她似乎在认真思考这个请求，修长的手指优雅地抵在下巴上，做出沉思的姿态。\n\n片刻的寂静让所有人都屏住了呼吸。\n\n“嗯……就这样吧！”\n\n她似乎想到了什么有趣的主意。\n\n一滴晶莹剔透的液滴从天而降。那滴液体在阳光下折射出彩虹般的光芒，美丽而致命。它穿过大气层，在空中划出一道优雅的弧线，如同一颗坠落的流星。\n\n巨大的水珠砸向地表，落在一片城市群之上。整片城市群在其触地的瞬间被压成碎屑，液体如同海啸般扩散开来，形成一个直径数公里的巨型水坑，迸溅的液体瞬间击碎了附近倒霉的城市与乡村。\n\n“嘛，如何？”\n\n蕾恩娜满意地看着自己的“杰作”，声音中带着有趣的天真。\n\n废墟在液体中迅速分解、融化。钢筋混凝土、玻璃碎片、扭曲的金属，一切都在这滴“恩赐”中化为乌有。液体表面冒着细密的气泡，散发出诡异的雾气。\n\n“嘛~”她俏皮地眨了眨眼，“你们的星球看起来真是顺眼多了。”\n\n巨大的水坑在阳光下泛着微光，如同星球表面的一颗巨大泪珠。"
 gts_rainna_la_grande_first_meeting.22111.a:0 "感谢女神的垂怜！"
 gts_rainna_la_grande_first_meeting.22112.desc:0 "“嗯~”\n\n蕾恩娜眯起那双湖泊般的眼睛，银铃般清澈的笑声从天空中传来，在整个大气层中回荡。\n\n她那巨大的面庞凑近星球，仔细打量着这个渺小的世界，似乎在认真考虑这个请求。\n\n片刻的寂静让所有人都屏住了呼吸。街道上的喧嚣停止了，避难所里的哭喊声也消失了。整个世界仿佛被按下了暂停键，所有人都在等待她的裁决。\n\n“嘛，既然你们对此如此渴求……”她的声音突然变得玩味“我也不是那种吝啬的家伙呢。”\n\n蕾恩娜优雅地抬起一根修长的食指，在太空中轻轻一挥。指尖泛起一层微光，随即，一颗巨大的液滴在她指尖凝聚成形。\n\n那液滴晶莹剔透，在蕾恩娜的瞳孔的映射下折射出梦幻般的光彩。它静静地漂浮在大气层外，直径足有数公里，对于地面上的人来说，就像是天空中突然多出来了一个月亮。\n\n蕾恩娜顽皮地舞动着手指,那颗巨大的液滴便跟随着她的动作,在空中华丽地旋转、翻滚。它划出优美的弧线，带起梦幻般的光晕。\n\n突然，那颗巨大的液滴在瞬间破碎，化作无数细小的水珠。这些水滴穿过大气层，在阳光的照射下形成了一道横跨整个天际的绚丽彩虹。\n\n清澈甘甜的雨水从天空中飘洒而下，轻柔地落在这颗的星球上。\n\n雨滴落在污染的土地与废墟之上，冲刷着焦黑的土地，断裂的树木开始重新发芽,破碎的大地上长出新的绿草。\n\n“哎呀，真是焕然一新呢……”\n\n蕾恩娜满意地看着这场由她创造的雨,声音中带着几分自得。她托着下巴,像是欣赏自己的艺术作品。\n\n“嘛，偶尔当一次‘好人’，真是令人心旷神怡。”"
 gts_rainna_la_grande_first_meeting.22113.title:0 "恶魔？"
 gts_rainna_la_grande_first_meeting.22113.desc:0 "“看来你们对我不是很满意呢……”\n\n蕾恩娜的声音突然变得低沉，带着一丝危险的意味。她那巨大的面庞缓缓凑近大气层，长发在真空中飘逸，如同黑暗的帷幕笼罩着整个星球。\n\n她的脸庞越来越近，近到可以看清她眼睫毛的每一根细节。那双湖泊般的蓝色眼眸直视着这颗渺小的星球，眼神中既有好奇，又有一丝不悦。她微弱的喘息都在扰动着脆弱的大气层，掀起一阵又一阵的狂风。\n\n“在你们看来……”\n\n她轻声说着，声音中带着几分委屈，又或许是在嘲讽。\n\n蕾恩娜朝着大气层轻轻吹了一口气。那温热的气息如同飓风般横扫地表，将云层吹得支离破碎，海面掀起滔天巨浪，森林被连根拔起。她那海洋般巨大的双眼眯成了一条细缝，睫毛的阴影在地表投下斑驳的光影。\n\n“我真的……有这么坏吗？”\n\n她嬉笑着，享受着自己带来的恐惧。\n\n说着，她伸出一只修长的手，五指张开，小心翼翼地从下方托起这颗星球。将整个星球轻轻捧起。星球在她掌心中显得如此渺小，就像一颗精致的弹珠。\n\n“其实……”她轻声说道，缓缓将手掌向自己的方向移动，”我觉得我确实很坏哦。”\n\n星球开始向她的身体靠近。从地面望去，那巨大的身躯遮蔽了一切星光，整个宇宙仿佛只剩下她一个存在。她温热的体温透过太空传递而来，让整个星球的温度开始上升。\n\n她慢慢把掌心往自己胸前移。\n\n蕾恩娜现在完全赤裸，肌肤在星光下泛着瓷器般的白，曲线夸张到违反物理法则。那对傲慢的、沉甸甸的乳房随着她的呼吸轻轻起伏，每一次晃动都让空间本身产生扭曲。乳晕是淡淡的粉，乳头已经因为兴奋而挺立，像两颗熟透的樱桃，骄傲地指向宇宙。\n\n她把星球举到两团柔软的巨峰中间，停在那里。\n\n“用你们的星球来……”她低下头，用鼻尖几乎要碰到地表那样凑近，轻声呢喃，“哼，也算是你们的荣幸呢……”\n\n她开始慢慢……慢慢地合拢双臂。两座雪白、温热、充满弹性的肉山缓缓向中间挤压。\n\n\n\n星球的大气层首先崩溃，像被捏破的气球，发出凄厉的啸叫。海洋被挤成一条条细长的水带，喷射到太空，又在她的体温下瞬间汽化。陆地板块像饼干一样裂开，火山口喷发的岩浆还没来得及冷却，就被那柔软却无可抗拒的压力碾成齑粉。\n\n她故意收得极慢，让毁灭的过程拉得无比漫长。\n\n“好舒服啊……”她咬着下唇，声音发颤，带着明显的快感，“你们的城市、军队、还有……都在被我的双峰……一点一点揉碎哦~”\n\n“嘛，我真的是太坏了！”她的乳房已经完全贴合，星球被深深埋进那道幽深的乳沟里，只剩下一小部分蓝色从雪白的边缘露出来，像被吞噬到一半的糖果。\n\n蕾恩娜闭上眼睛，轻轻晃动上身。\n\n左、右、左、右……\n\n每一次摩擦都让地壳发出哀鸣，地幔被挤压得像果酱一样从裂缝里溢出。她的乳头因为兴奋而变得更硬，轻轻刮过已经破碎的大陆，像两把炙热的镰刀，把残存的文明最后一次划成碎片。\n\n“嘛~要不要……再用力一点呢？”\n\n她猛地用力一夹。\n\n——咔嚓\n\n一瞬间，星球在她乳沟深处彻底粉碎。\n\n碎片、熔岩、残骸、亿万生命的最后哀嚎，全都化作炙热的尘埃，被她温热的肌肤和汗水包裹、吸收。\n\n蕾恩娜长长地舒了一口气，脸上泛起满足的潮红。\n\n她低头看了看自己胸前那片细碎的尘土——那是行星最后的遗骸。\n\n“啊啦~好像……玩得有点过火了呢。”"
 gts_rainna_la_grande_first_meeting.22114.title:0 "恩赐？"
 gts_rainna_la_grande_first_meeting.22114.desc:0 "“啊啦~”\n\n蕾恩娜的声音突然变得高昂，她那巨大的眼眸闪烁着兴奋的光芒，由衷的赞美让她看起来相当愉悦。\n\n“嘛……我做了这么多好事，终于有人懂得感恩了呢~”\n\n她优雅地将那根刚刚摧毁了无数城市的手指抬起，在阳光下仔细端详。指尖沾满了建筑的碎屑和尘土，不过在她看来，这些丰功伟绩只是举手之劳。\n\n她将巨大的面庞凑得更近，那双清澈的蓝色眼眸仔细地扫视着星球表面。在她的注视下，每一座城市、每一个角落都无所遁形。\n\n“不过……”\n\n她的声音突然变得玩味起来，眼中闪过一丝狡黠的光芒。\n\n“你们看起来……并不是非常真心呢~”\n\n她歪着头，修长的手指在空中轻轻敲击，每一次敲击都在大气层中激起涟漪。\n\n“嘛~在我看来，你们不过是在虚伪地奉承我。”\n\n她眨眨眼，似乎做出了一个英明的判断。\n\n“不过……”\n\n她俯下身，声音变得温柔又危险。\n\n“你们这些小家伙如此卖力地称赞我，我怎能有负于你们的真诚呢？”\n\n她伸出食指，在星球表面轻轻划过，却没有施加任何压力，只是让巨大的阴影扫过一座又一座城市。\n\n“既然你们这么‘感激’我……那我是不是应该给你们更多值得‘感激’的东西呢？”\n\n她的手指悬停在一片尚未被破坏的繁华地区上方。\n\n“比如说……”\n\n她故意拖长了语调，享受着这种掌控一切的感觉。“让你们见识一下，什么才是真正的‘恩赐’？”\n\n她轻轻弹了弹手指，一些附着在指尖的细小碎屑被弹向星球表面，如同流星雨般坠落，每一块碎片砸下都造成新的破坏。\n\n“怎么样？还要继续‘感谢’我吗？”\n\n她的声音中充满了戏谑，显然很享受这种凌驾于一切之上的优越感。"
 gts_rainna_la_grande_first_meeting.22990.desc:0 "蕾恩娜在太空中慵懒地伸了个懒腰，最后用那双巨大的眼眸扫了一眼这颗完好的星球。\n\n“嘛……”\n\n她托着下巴，若有所思地看了片刻，嘴角带着几分意味深长的笑意。\n\n“看在我今天心情好的份上……”\n\n她将身体转向了星海深处，长发在无重力中缓缓舒展开来。临走前，她伸出指尖，在大气层边缘轻轻一点，带起一阵温和的气流，将四散的云层重新聚拢，在天空中留下一片柔和的光晕。\n\n“就不欺负你们咯。”\n\n她漫不经心地说道，声音已经飘远。\n\n“我可是还会回来的哦~不过下次心情还好不好，那就不一定咯。”\n\n她的笑声在星海中回荡了片刻，然后彻底消散。\n\n星球上的人们仰望着那片重新归于平静的天空，心中说不清是庆幸还是忐忑。那句"下次心情还好不好"，像一根细细的刺，悄悄扎在每个人心里。"
 gts_rainna_la_grande_first_meeting.22990.desc_alter:0 "蕾恩娜最后俯视了一眼这颗星球，歪着头，将它在视野中打量了片刻。\n\n“嘛。”\n\n她轻轻地应了一声，将身体转向了更深的星海，动作舒展而随意。\n\n“今天就到这里吧~”\n\n她的声音带着几分轻快，没有任何威胁，也没有任何特别的温柔，就像是结束了一次普通的散步。\n\n“我下次再来光临吧~”\n\n她随口补充了一句，已经不再回头。\n\n“你们可要好好照顾自己呢……”\n\n这句话轻飘飘地散在星光里，让人捉摸不透她下次回来时会是什么心情，会带来什么。\n\n星球上，没有人欢呼，没有人哭泣。所有人都只是静静地站在原地，望着那道在星光中慢慢消散的身影，等待着这颗星球重新学会如何喘息。"
 gts_rainna_la_grande_first_meeting.22991.desc:0 "蕾恩娜在太空中缓缓收回了手指，低头打量着这颗星球。\n\n那道被手指戳出的巨型天坑还在冒着热气，周围的地壳裂成无数碎块，岩浆从裂缝深处缓缓渗出，将大半个大陆染成了暗红色。手指划过的那道长痕将整片大陆一分为二，两侧的城市群早已荡然无存，只剩下被刮得光滑的地表在星光下泛着冷硬的光泽。\n\n“嘛……”\n\n她歪着头，若有所思地看了片刻。\n\n“手感一般。”\n\n她自言自语着，语气平淡得像是在点评一道普通的菜肴。她将那根惹出了一切麻烦的手指在太空中轻轻弹了弹，让残留在指尖的最后一点碎屑飘落回地表。\n\n“不过……”她的目光从那道长痕上慢慢移开，望向了更远处的星海，声音变得有些飘忽，“留着也好，下次回来再看看它的自愈能力怎么样。”\n\n她的身影开始缓缓远去，长发在无重力中如同星云般舒展开来，逐渐遮住了这颗残破星球的轮廓。\n\n"保重哦~"\n\n她漫不经心地丢下这句话，声音越来越远，最终消散在星海之中。\n\n星球上，幸存者们站在废墟之间，仰望着那道渐渐消失的身影。天空重新露出了久违的星光，但没有人感到轻松。那句"下次回来"，像一块沉甸甸的石头，压在每个人心头。"
 gts_rainna_la_grande_first_meeting.22991_alter.desc:0 "蕾恩娜最后用指尖轻轻拨了拨那道被她划出的巨大沟壑边缘，就像是在把玩某件刚刚完成的手工作品。\n\n岩石碎块在她指尖的触碰下轻轻滚落，坠入沟壑深处，消失在翻涌的岩浆之中。她看了片刻，然后收回手指，在太空中舒展开身体。\n\n“比上次有意思一点。”\n\n她自言自语着，语气随意而漫不经心。这句话不知道是在和谁说，也许只是单纯地说给自己听。\n\n她的目光最后在星球表面扫了一圈——那些深深的坑洞、蜿蜒的裂缝、被刮平的大陆、蒸发殆尽的海洋——然后不置可否地收回了视线。\n\n“嘛……留着吧。”\n\n她转过身，庞大的身影开始向星海深处移动。行星在她离去时产生的微弱气流中轻轻颤动了一下，随即重归寂静。\n\n“我还会回来的哦~”\n\n那句话从越来越远的地方飘来，轻巧得像是一片羽毛，却让每一个听到的人都感到了某种难以言说的重量。\n\n她的身影彻底消失在星光之中。\n\n只剩下那颗残破的星球，带着她留下的每一道痕迹，继续在寂静的宇宙中旋转着。"
 gts_rainna_la_grande_first_meeting.22992.desc:0 "星球的残骸在太空中静静漂浮着。\n\n蕾恩娜低头看了看那些碎块，随意地拨开了一块漂近的残骸，让它向更远处飘去。她的神情平静而漫不经心，就像是不小心打碎了一个不太重要的小东西。\n\n“嘛……”\n\n她自言自语着，声音中带着几分淡淡的遗憾。\n\n“碎了。”\n\n她在太空中慵懒地伸了个懒腰，将视线从这片残骸上移开，望向了更远处的星海。那些遥远的星系在黑暗中静静闪烁，似乎比眼前这堆碎石更值得关注。\n\n“挺爽的……”她喃喃道，声音渐渐飘远，“赶紧再去找一个。”\n\n她的身影开始在星光中缓缓消散。\n\n“嘛，感觉很舒服呢~”\n\n最后这句话轻飘飘地散在星海里，没有任何对象，也不需要任何回应。"
 gts_rainna_la_grande_first_meeting.22995.desc:0 "蕾恩娜在太空中伸了个懒腰，最后看了一眼这颗完好的星球，嘴角带着几分真实的笑意。\n\n“嘛，今天心情可真不错~”\n\n她的目光在星球表面停留了片刻，那双清澈的眼眸中透出几分难得的温和。\n\n她歪着头，若有所思地说道，“毕竟我今天交到了一群新的朋友。”\n\n她将身体转向星海深处，声音已经带上了几分飘远的意味。\n\n“嘿，朋友，下次可要准备好邀请我哦~”\n\n她的身影在星光中缓缓消散。"
 gts_rainna_la_grande_first_meeting.22996.desc:0 "蕾恩娜缓缓收回了那种神明的姿态，在太空中静静悬浮了片刻。\n\n她俯视着这颗星球，眼神中依然保持着那份居高临下的平静。\n\n“嗯。”\n\n她轻轻地应了一声。\n\n“你们还算虔诚。”\n\n她的声音依然带着庄重，却比之前少了几分神圣的距离感。\n\n她将身体转向了更深的星海。\n\n“要好好崇拜我哦~”\n\n她的声音已经飘远，那份神明的架势正在悄然松动，最后这句话里隐约透出几分她惯常的轻快。\n\n“等我下一次降临，可是会给你们带来新的审判的~”\n\n信众们跪倒在地，齐声诵念着祷词，送别这位来去如风的神明。祷词在大气层中回荡，久久不散。\n\n直到天空完全恢复平静，才有人悄悄抬起头，望着那片空旷的星海，心里不知道在想什么。"
 gts_rainna_la_grande_first_meeting.22114.a:0 "不……不了"
 gts_rainna_la_grande_first_meeting.31211.title:0 "能量币"
 gts_rainna_la_grande_first_meeting.31211.desc:0 "一艘飞船缓缓驶向蕾恩娜，将装载着能量币的货舱舱门打开。\n\n对蕾恩娜而言，这艘飞船不过是一粒微尘，货物更是渺小得难以描述。但她还是饶有兴致地伸出手指，将那个微小的包裹轻轻拈起，放在眼前仔细端详。\n\n“唔……”\n\n她的眼眸中闪烁着满意的光芒。指尖与能量币接触的瞬间，那些密集的能量结晶迸发出耀眼的光芒，随即化作一缕柔和的光流，沿着她的指尖蜿蜒流淌，悄然没入掌心之中。\n\n“嘛，这个嘛……”她看着掌心最后一丝光芒消散，满足地眯起眼睛，“确实很不错哦~”\n\n她将手指在掌心轻轻一握。\n\n“能量币这种东西我可从来不会嫌它太多呢~”\n\n她咯咯地笑了起来，双足缓缓从星球两侧移开。\n\n“那么这次，我就大发慈悲，放过你们一次吧。”"
 gts_rainna_la_grande_first_meeting.31211.a_tooltip:0 "每一次都要付出那么多资源，真的值得吗？"
 gts_rainna_la_grande_first_meeting.31221.desc:0 "飞船缓缓驶近，将货舱舱门打开。\n\n蕾恩娜瞥了一眼那个微小的包裹，嘴角微微下撇。\n\n“能量币啊……”\n\n她的声音中带着几分漫不经心的失望，听起来很不满意。\n\n“嘛，不是说能量币不好……”她伸出两根手指，轻描淡写地捏住了那艘飞船，“哼，只不过这次不行哦。”\n\n她的手指微微用力。飞船连同货舱在她指尖之间悄无声息地碎裂，能量币在瞬间化作一团黯淡的微光，随即消散在太空中。\n\n“呐呐呐，谈判破裂。”\n\n她的双足重新向星球靠拢。"
 gts_rainna_la_grande_first_meeting.31212.title:0 "合金"
 gts_rainna_la_grande_first_meeting.31212.desc:0 "飞船将货舱打开，装有大量合金的金属箱缓缓漂浮在太空中。\n\n蕾恩娜伸出两根手指，将整批货物轻轻捏住。金属在她指尖之间发出沉闷的碎裂声，原本坚硬的合金在瞬间被碾成细碎的粉末，在太空中散开，形成一片闪烁的金属云雾。\n\n“唔……”她看着指尖残留的金属粉末，若有所思地点了点头。\n\n“手感不错呢~”\n\n她将手指轻轻搓了搓，金属粉末如星尘般飘散。\n\n“嘛，就当是有诚意了吧，毕竟这应该基本上是你们能拿出来的所有合金了吧？”\n\n她收回手，满意地眯起眼睛，双足缓缓从星球两侧移开。\n\n“哼，原谅你了。”"
 gts_rainna_la_grande_first_meeting.31222.desc:0 "飞船将货舱打开，装有大量合金的金属箱缓缓漂浮在太空中。\n\n蕾恩娜伸出两根手指，漫不经心地将整批货物捏碎。金属粉末在太空中静静飘散。\n\n“嘛，”她轻声说道，语气平静而随意，她甚至没有多看一眼。“不喜欢。”\n\n她的双足重新向星球靠拢。"
 gts_rainna_la_grande_first_meeting.31213.title:0 "贸易品"
 gts_rainna_la_grande_first_meeting.31213.desc:0 "飞船将货舱打开，无数精美的货物被绑在一起漂浮在太空中。在蕾恩娜眼中，这些东西不过是一堆闪闪发光的微小杂物，但她还是饶有兴致地凑近打量。\n\n“哎呀……”\n\n她的眼睛亮了一下。\n\n她用指尖轻轻拨弄着那些漂浮的货物，看着它们在太空中翻滚、碰撞，发出几乎听不见的微小声响。亮晶晶的小东西在星光下折射出五彩的光芒，让她看起来心情颇好。\n\n“嘛，诚意是有的~”\n\n她将那一小堆货物拢在指尖，然后轻轻捏住塞进了长筒丝袜中。那些精美的货物就这样消失在丝袜与她小腿之间，成了一个几乎看不出来的微小鼓包。\n\n“虽然不多，但是应该把你们的库存消耗得差不多了吧？”\n\n“就这样吧~”她满意地拍了拍丝袜，双足从星球两侧移开。"
 gts_rainna_la_grande_first_meeting.31223.desc:0 "飞船将货舱打开，无数精美的货物漂浮在太空中。\n\n蕾恩娜瞥了一眼，神情淡淡的。\n\n“这些啊……”\n\n她伸出两根手指，将那堆亮晶晶的小东西捏成了粉末。\n\n“无聊。”\n\n她的双足重新向星球靠拢。"
 gts_rainna_la_grande_first_meeting.31214.title:0 "矿物"
 gts_rainna_la_grande_first_meeting.31214.desc:0 "飞船将货舱打开，大量矿物晶体漂浮在太空中。\n\n“矿物？”蕾恩娜的声音中带着几分有趣。她伸手将货物拢在掌心，在星光下翻来覆去地看了看。那些矿物晶体在她手中闪烁着各种颜色的光芒。\n\n“嘛……颜色倒是挺好看的。”\n\n她用手指轻轻捻了捻，感受着矿物晶体在指尖碎裂的触感，若有所思地点了点头。\n\n“这玩意对我来说可没什么用。就当是手感不错吧~”她将剩余的碎屑随手一扬，“不过看在对你们造成了不少损失的份上，就算了吧。”"
 gts_rainna_la_grande_first_meeting.31224.desc:0 "飞船将货舱打开，大量矿物漂浮在太空中。\n\n“矿物……”蕾恩娜叹了口气，语气中带着明显的无聊，“有意思吗？你们这颗星球本身就是一块巨大的矿物呢~”\n\n她两根手指随意一捏，矿物粉碎成尘。\n\n“哼，不接受。”\n\n她的双足重新向星球靠拢。"
 gts_rainna_la_grande_first_meeting.31215.title:0 "食物"
 gts_rainna_la_grande_first_meeting.31215.desc:0 "飞船将货舱打开，各式各样的食物漂浮在太空中。\n\n蕾恩娜凑近打量了一眼，嘴角扬起一抹兴味盎然的笑容。\n\n“哦？食物啊~”\n\n她没有多想，直接将那艘飞船连同货物一起捏在手中，随手送入口中。\n\n咀嚼了几下，她歪着头若有所思。\n\n“嘛……味道还不错呢~”她用舌尖舔了舔指尖，“飞船的口感有点硬，不过食物本身还可以~”\n\n她满意地拍了拍手，双足从星球两侧缓缓移开。\n\n“哎呀，这次就算了吧。毕竟想必你们没什么食物了吧？希望你们不会饿死太多人哦。”"
 gts_rainna_la_grande_first_meeting.31225.desc:0 "飞船将货舱打开，各式各样的食物漂浮在太空中。\n\n蕾恩娜瞥了一眼，两根手指不带感情地将飞船连同货物一并捏碎。\n\n“哎呀，食物嘛，没胃口哦。”\n\n她的双足重新向星球靠拢。"
 gts_rainna_la_grande_first_meeting.31226.title:0 "意外情况"
 gts_rainna_la_grande_first_meeting.31226.desc:0 "飞船缓缓驶近，货舱还未来得及打开。\n\n蕾恩娜看着那艘微小的飞船在太空中慢慢靠近，歪着头，手指轻轻敲了敲下巴。\n\n“唔……”\n\n她沉默了片刻，眼神逐渐变得漫不经心。\n\n“嘛，算咯。”她的声音轻描淡写，就像是随口说出的一句话。“我改变主意了呢~”\n\n两根手指毫不犹豫地捏住了那艘飞船。飞船在她指尖之间悄无声息地碎裂，货舱连同其中的一切在还没有展示的机会之前，就这样消失在太空中，化作一团转瞬即逝的微小碎屑。\n\n蕾恩娜看着指尖的残骸随太空气流散去，神情平静而随意，仿佛只是捏碎了一片落叶。\n\n“嘛……”她将手指轻轻一弹，最后一点碎屑飘散开去，“谈判破裂~”\n\n她的双足重新向星球靠拢。"
 gts_rainna_la_grande_first_meeting.31229.title:0 "谈判破裂"
 gts_rainna_la_grande_first_meeting.31229.desc:0 "蕾恩娜的双足从两侧缓缓逼近，那两只被白色长筒丝袜紧紧包裹的足底重新将整颗星球笼罩在无边的阴影之中。\n\n足弓的边缘率先触碰到大气层。那柔软而充满弹性的肌肤透过丝袜轻轻贴上大气层的边缘，带起一阵席卷全球的狂风。云层在这种压力下四散崩解，天空瞬间变得一片灰暗。地面上的人们仰望着那两片越来越近的白色足底，已经没有人再逃跑了。\n\n足底继续下压，开始真正接触地表。\n\n最先承受压力的是星球两端的大陆。白色丝袜的细密纹路压在地面上，将地表上残存的一切压入土地之中。建筑物在这种压力下悄无声息地坍塌，连碎裂的声音都被淹没在整颗星球发出的低沉轰鸣里。\n\n蕾恩娜轻轻蹭动了一下足底。\n\n这个看似随意的动作，让地表上大片区域瞬间化为平地。足底的摩擦带走了地表的一切——城市、山脉、海洋——悉数被卷入丝袜的纤维之间，变成附着在她足底的污渍。岩浆从新生的裂缝中喷涌而出，却在接触到她足底的温度后迅速汽化，化作滚烫的蒸汽从丝袜边缘溢出。\n\n"……嗯。"\n\n她低低地应了一声，语气平静，却带着几分专注的满足，开始有节奏地来回摩擦双足。\n\n每一次向内收紧，星球就会发出新的轰鸣，新的裂缝从地壳深处炸开；每一次向外舒展，那些刚刚暴露出来的滚烫地幔就会被足底的回拉带走一层，再次填入丝袜的纹路之间。整颗星球在这种持续不断的摩擦中急速瓦解，赤道地带被挤压得向外鼓起，如同一个被缓缓捏扁的果冻。\n\n地壳的轰鸣声越来越密集，越来越绝望。\n\n蕾恩娜将双足向内再收紧了一些。\n\n第一道主裂缝从赤道附近炸开，以肉眼可见的速度向两极蔓延。裂缝的宽度在短短数秒内就扩张到足以吞没整座大陆的程度，深度直抵星球内核。炽热的地幔物质从这道巨大的伤口中喷涌而出，将整颗星球的轮廓染成一片暗红。\n\n紧接着是第二道、第三道。\n\n裂缝如蛛网般向四面八方蔓延，将星球的地壳切割成无数碎块。那些碎块在足底的压力下相互挤压、错位，发出一阵接一阵沉闷的碎裂声。\n\n蕾恩娜微微低头，透过双腿的间隙俯视着这颗正在走向终结的星球，眼神平静而专注。\n\n她将双足猛地向内一合。\n\n沉闷的一声巨响。\n\n星球的内核在这最后一击中彻底崩裂，整颗星球从内到外碎裂成数块巨大的残骸，被她的双足死死夹在其间，无法逃散。岩浆与尘埃从每一道裂缝中喷涌而出，在太空中缓缓扩散，形成一圈昏暗的光环。\n\n蕾恩娜缓缓将双足分开。\n\n那几块被严重压扁、布满丝袜纹路印记的残骸在原地无助地漂浮着，勉强还维持着原本的相对位置，却已经再也无法拼回成一颗完整的星球。\n\n她低头看了看足底沾染的那些碎屑与污渍，随意地活动了一下足趾。\n\n"嘛。"\n\n她轻声说了一个字，语气里既没有满足，也没有遗憾，就像是完成了一件普通得不能再普通的小事。\n\n她的身影缓缓在星海中远去。"
 gts_rainna_la_grande_first_meeting.31229_alter.desc:0 "蕾恩娜的双足从两侧缓缓逼近。\n\n没有任何戏谑，没有任何铺垫。那两片被白色长筒丝袜紧紧包裹的足底以一种从容而不可阻挡的姿态向内收拢，就像是某件早已注定的事情，终于走到了它该走到的地方。\n\n巨大的阴影再度笼罩了整颗星球。\n\n足底贴近大气层的瞬间，气流开始剧烈震荡。狂风从两侧同时涌起，横扫整片大陆。海面在这股力量下翻腾咆哮，高达数千米的巨浪扑向沿岸城市。云层被撕裂成碎片，天空在两片足底之间变得越来越窄，越来越暗。\n\n星球上，警报声再度响彻每一个角落。\n\n人们仰望着天空，看着那两片洁白的足底从两侧缓缓压来，将整个视野一点一点地吞噬。有人奔跑，有人祈祷，更多的人只是默默地站在原地，仰着头，看着那不可阻挡的一切慢慢降临。\n\n足弓的边缘率先触及了大气层顶端。\n\n柔软而充满弹性的丝袜肌肤轻轻压入大气层，如同两座从天而降的山脉。接触的瞬间，整颗星球都感受到了来自两侧均匀而持续的压力。地壳发出低沉的轰鸣，第一批裂缝悄然在两极附近延伸开来。\n\n足底继续下压。\n\n两端最大的大陆首当其冲。足弓的弧线完美贴合着星球的曲率，白色丝袜的细密纹路清晰地印在地表之上。连绵的城市群在这片柔软的天幕下悄然消失，高耸的建筑群被压入地壳，如同被熨斗烫过的布料，平整而彻底。岩浆从新生的裂缝中喷涌而出，在足底的压力下四散流淌，随即被更大的压力重新封入地下。\n\n蕾恩娜低头看了一眼，微微调整了一下角度。\n\n足趾开始灵活地活动。\n\n那五根修长的足趾各自找到了落点，在密集的城市群间轻盈地点压、蜷曲。每一次足趾的收拢都将一整片区域碾入地下，每一次张开都带走大量的碎屑，将其扬入大气层，形成翻涌的尘埃云雾。足趾间的缝隙中夹带着大量被压碎的建筑残骸，随着她足趾的每一次活动而剥落，如黑色的雪花般飘向四方。\n\n“嗯……”\n\n蕾恩娜轻轻应了一声，语气中带着几分若有所思的专注。\n\n她开始缓缓施力。\n\n两只足底同时向内收紧，均匀而坚定。星球在这股力量下开始整体变形，赤道地带被挤压得向外鼓起，如同一颗被捏住两端的软球。地幔在难以想象的压力下开始流动，从赤道附近的裂缝中缓缓渗出，在地表形成绵延数千公里的岩浆带。\n\n裂缝越来越多，越来越深。\n\n它们从两极向赤道疯狂蔓延，如同玻璃破裂时的纹路，将整颗星球的地壳切割成无数碎块。山脉沿着裂缝轰然坍塌，海床随着板块的错位急剧下沉，残存的海水涌入地壳深处，接触到岩浆后瞬间汽化，从裂缝中以滚烫的蒸汽柱喷向天空。\n\n蕾恩娜将双足轻轻向内一收。\n\n咔嚓。\n\n一声沉闷而清脆的脆响，从星球最深处传出。\n\n整颗星球在这最后一刻彻底碎裂，从内部炸开，裂成数块巨大的碎片。那些碎片勉强维持着原来的位置，却已经是无可挽回的终结。核心暴露在太空中，炽热的岩浆与金属在真空里迅速冷却，凝固成参差不齐的断面。\n\n蕾恩娜缓缓将双足抬起。\n\n白色丝袜上沾满了大量的灰尘、岩石碎屑与凝固的岩浆，那些曾经是城市、是文明、是无数生命的东西，如今都成了丝袜上一层深色的污渍。她在太空中随意活动了一下足趾，让更多的碎屑从丝袜表面剥落，如同黑色的星尘般飘散开去。\n\n她看了一眼那几块漂浮着的残骸，神情平静。\n\n“嘛。”\n\n她轻声说了一个字，随即收回目光，慵懒地在太空中伸了个懒腰。"
 gts_rainna_la_grande_first_meeting.31229_alter2.desc:0 "两只被白色长筒丝袜紧紧包裹的足底缓缓向星球两侧靠拢，巨大的阴影再度笼罩了整片天空。\n\n没有任何多余的话。\n\n足弓的弧线贴近大气层，丝袜的细密纹路在大气层上投下无数细小的阴影。从地面望去，天空已经完全被那雪白的丝袜占据，阳光被彻底遮蔽，整个星球陷入一片不自然的昏暗之中。\n\n足底继续下压。\n\n大气层在这股压力下开始剧烈涌动，狂风从两侧呼啸而起，横扫过整片大陆。海面掀起数千米高的巨浪，将沿海城市悉数淹没。山脉在震动中簌簌落石，平原上的建筑群如同纸牌屋般在气流中接连倒塌。\n\n白色丝袜与地表的第一次接触，轻得出奇。\n\n足弓的边缘轻柔地贴上了星球两端最大的两片大陆，那种柔软而充满弹性的触感，让整颗星球都感受到了一种奇异的压迫。丝袜的纹路印在地表上，将城市群的轮廓压进土地之中，留下清晰而巨大的拓印。\n\n然后，她开始用力。\n\n足底缓缓向内推进，地壳在这股力量下发出低沉的轰鸣。第一道裂缝从赤道附近悄然出现，随即如蛛网般向四周蔓延。岩浆从裂缝深处涌出，在足底的压迫下被迫向两侧流淌，形成蜿蜒的火焰河流。\n\n蕾恩娜微微蹭动了一下足底。\n\n这个看似漫不经心的动作，带来了毁灭性的后果。足底的摩擦将地表上残存的一切悉数卷走，城市、森林、山脉，都在这柔软的丝袜纤维下化为细碎的粉末，嵌入纤维之间。被挤出的岩浆在足底的温度下迅速汽化，化作滚烫的蒸汽从丝袜边缘喷涌而出，在太空中形成一圈诡异的白雾。\n\n她再度收紧。\n\n整颗星球在两片足底之间开始剧烈变形，赤道地带在巨大的压力下向外鼓起，像是一颗被缓缓捏扁的果冻。大陆板块在这股力量下彻底失去了原有的形状，断裂、错位、重叠，山脉被压入地幔，海床被挤压成新的山峰。\n\n“嗯……”\n\n蕾恩娜低低地应了一声，闭上眼睛，仔细感受着足底传来的触感。她能清楚地分辨出地壳不同层次的质感——坚硬的岩石、柔软的泥土、炽热的岩浆，以及那些越来越微弱的、来自足底下方某处的细微震动。\n\n她将双足向内猛地一合。\n\n一声沉闷而深远的巨响在太空中回荡。星球的内核在这股力量下彻底崩裂，整颗星球从内部开始瓦解。巨大的碎块在足底之间四散迸裂，岩浆与尘埃在太空中肆意飞溅，在蕾恩娜白色的丝袜上留下大片灼热的污渍。\n\n蕾恩娜缓缓将双足分开。\n\n那些破碎的残骸无声地漂散在太空中，有的还在缓缓燃烧，有的已经冷却成漆黑的岩块。丝袜上沾满了大量的碎屑与污渍，白色的纤维间嵌满了曾经是城市、山脉、海洋的粉末。\n\n她低头看了看，随意地活动了一下足趾，让一些较大的碎屑剥落。\n\n“嘛。”\n\n她平静地说了一个字，随即将视线移向远处的星海。"
 gts_rainna_la_grande_first_meeting.31229.a:0 "不，我们可以再谈谈……"
 gts_rainna_la_grande_first_meeting.31231.title:0 "屈辱外交——成功"
 gts_rainna_la_grande_first_meeting.31231.desc:0 "蕾恩娜平静地听完这一段浮夸的表白，她眯着眼睛，露出一抹微笑。\n\n“哼。”她轻轻咬着下唇，看起来有些兴奋。\n\n“你们这群小东西……真是花言巧语不断。”\n\n她优雅地扭动了一下足踝，白丝包裹的足底在星光下划出一道优美的弧线。足底的阴影扫过星球表面，让整片大陆都笼罩在柔软却致命的黑暗里。\n\n蕾恩娜伸出一根手指，轻轻点了点自己的下巴，歪着头打量着这颗在她眼中只有柚子大小的星球。她的眼眸里满是兴致盎然的玩味。\n\n“嘛~既然你们这么有诚意地接受我的羞辱，那我要是还不满足的话，就显得我太不近人情了哦。”\n\n她忽然把身体往前倾了倾，那张巨大的脸庞几乎要贴到大气层上。她的声音变得又软又甜，却带着明显的恶意：\n\n“那么……作为原谅你们的代价，我就稍微‘玩’一下吧~”\n\n话音落下，她缓缓收紧双腿。\n\n两只被白丝包裹的、完美无瑕的足底开始向星球中间缓缓合拢。足弓先是轻轻贴住了大气层，像两片温暖的天幕。接着，足底开始接触地表。\n\n她没有用全力。但即便只是“稍微用力”，对于这颗星球来说也已经是灭顶之灾。\n\n星球两端最大的两片大陆同时发出不堪重负的哀鸣。地壳在足底的压力下大面积塌陷，数座超大型城市在足弓的阴影里瞬间被压扁成薄薄的一层。岩浆从裂缝中喷涌而出，却被她足底的温度瞬间蒸发，化作滚烫的蒸汽。那些曾经灯火通明的都市群，此刻只剩下一片片被丝袜纹路完美印刻出来的、深不见底的巨大足印。\n\n蕾恩娜一边慢慢蹭动着足底，一边发出满足的轻笑。\n\n“嗯……真是舒服~像是在给我做足底按摩一样，还是丝袜色呢……”\n\n她故意把足底在其中一片大陆上来回轻轻摩擦了几下，像是在把上面的“脏东西”抹干净。无数残存的建筑和生命被卷入足底的纹路里，变成新的污垢。\n\n玩够了之后，她才满意地抬起双足。\n\n星球两端已经各被踩出了一个巨大、深邃、边缘还在冒着岩浆的足印。两个足印之间，是勉强幸存的赤道地带。\n\n蕾恩娜歪着头，看着自己杰作，笑得像个得到新玩具的孩子。\n\n“好了~这次就到这里吧。这一次，你们被赦免了哦~”"
 gts_rainna_la_grande_first_meeting.31232.title:0 "屈辱外交——失败"
 gts_rainna_la_grande_first_meeting.31232.desc:0 "蕾恩娜听完之后，脸上的笑容慢慢淡了下去。\n\n她托着下巴，静静地看着这颗星球，湖泊般的蓝色眼眸里闪过一丝明显的无聊。\n\n“……哼。”\n\n一声极轻的冷哼，通过通讯器传遍了整个星球。\n\n“这种话……我听过太多次了。”\n\n她忽然把身体挺直了一些，原本慵懒的姿态变得有些危险。白丝足底在星球两侧微微收紧，足趾不耐烦地蜷曲了一下。\n\n“这些东西……还需要你们告诉我吗？”\n\n她忽然把身体挺直了一些，原本慵懒的姿态变得有些危险。白丝足底在星球两侧微微收紧，足趾不耐烦地蜷曲了一下。\n\n“哼，与其听这些奉承话，还不如拿你们的星球给我玩一下。”\n\n两只被白色长筒丝袜紧紧包裹的、完美无瑕的玉足以远超之前力度的速度向星球中间合拢。足弓先是狠狠撞碎了大气层，像两座从天而降的山脉直接砸在星球两端。整颗星球剧烈震颤，大气层被瞬间撕裂，狂风呼啸着向两极逃窜。\n\n“嗯，真舒服呢……”蕾恩娜发出一声满足的轻叹，声音里带着明显的快感。\n\n足底继续下压。\n\n首先被完全压扁的是星球两端最大的两片大陆。数千公里宽的城市群在足弓的阴影里像纸一样被抹平。高楼大厦、道路、车辆、还有里面无数的生命，在丝袜与地壳接触的瞬间就被挤压成极薄的一层，紧紧粘附在蕾恩娜足底的纹路里。地壳发出不堪重负的轰鸣，数千公里长的巨大裂缝像蛛网一样从两极向赤道疯狂蔓延。\n\n蕾恩娜微微蹭动了一下足底。\n\n这一下，星球表面直接被刮出了一道宽达数百公里的巨大沟壑。无数城市、森林、湖泊被卷入足底的丝袜纤维里，变成新的污垢和碎屑。岩浆从裂缝中喷涌而出，却在她足底的温度下迅速汽化，化作滚烫的蒸汽从丝袜边缘喷出。\n\n两只白丝玉足彻底合拢，把整颗星球死死夹在足弓与足心之间。星球在可怕的压力下剧烈变形，赤道地带被挤压得像被捏扁的果冻一样向外鼓起。地壳彻底崩裂，地幔被挤压着从裂缝中喷涌而出，形成一道道横贯星球的岩浆瀑布。\n\n蕾恩娜闭上眼睛，轻轻咬着下唇，享受着足底传来的触感。\n\n她开始缓慢而坚定地来回摩擦双足。\n\n每一次蹭动都让星球的破坏更加彻底。曾经的超级都市现在只剩下一层薄薄的、被丝袜纹路完美印刻出来的灰黑色污渍。山脉在足弓下被碾成粉末，海洋早已完全蒸发，只剩下干涸龟裂的海床被她足底的温度烤得发红。无数残存的生命在最后被丝袜与地壳的摩擦中彻底抹消，连惨叫都来不及传出。\n\n蕾恩娜的呼吸渐渐变得有些急促。\n\n她将双足轻轻力地一夹。\n\n“——咔嚓。”\n\n星球的内核在足心深处发出沉闷的崩裂声。整颗星球彻底碎裂成数块巨大的碎片，被她足底死死压住，无法逃散。\n\n蕾恩娜睁开眼睛，低头看着自己足底之间那团正在缓慢崩解的残骸，嘴角勾起一抹满足又带着些许无聊的笑容。\n\n“嘛……”\n\n她轻轻活动了一下足趾，让更多碎裂的岩石和建筑残骸从丝袜表面剥落，像黑色的雪花一样飘向太空。\n\n“果然还是直接踩坏比较爽……”\n\n待她把双足缓缓分开时，星球已经不复存在。只剩下几块被严重压扁、布满丝袜纹路印记的巨大碎块，在原地无助地漂浮着。核心已经完全碎裂，岩浆和尘埃在太空中缓缓扩散……"
 gts_rainna_la_grande_first_meeting.31241.title:0 "人口献祭——成功"
 gts_rainna_la_grande_first_meeting.31241.desc:0 "蕾恩娜看着那些密密麻麻的运输飞船缓缓向她靠近，眼神中的好奇逐渐变成了满意的笑意。\n\n她伸出两根修长的手指，优雅地将整支舰队轻轻夹住。那些飞船在她的指尖之间显得如此微小，就像是两根手指间夹着的一把细沙。她将手指凑近眼前，仔细打量着那些在指缝间挣扎的微小光点。\n\n“嘛，还挺有诚意的嘛~”\n\n说着，她的手指微微收紧。\n\n飞船的船体在压力下开始变形，金属外壳发出沉闷的挤压声。那些飞船一艘接着一艘地碎裂，在她指尖之间化作漂散的细小碎屑。蕾恩娜感受着指尖传来的细微触感，满意地眯起眼睛。\n\n“嘛，这次就算了。”\n\n她将手指轻轻一搓，最后的碎屑随之飘散，如同一片转瞬即逝的微小星云，在太空中拖出淡淡的尾迹。\n\n“不过这点人口也太少了吧，真是不够玩的呢……”\n\n她的双足从星球两侧缓缓移开，那两片遮天蔽日的阴影随之消退。\n\n星球上，幸存者们仰望着天空，看着那双巨大的足底缓缓升起、远去。有人瘫倒在地，有人失声痛哭，更多的人只是默默地站在废墟之中，望着那逐渐缩小的巨大身影，说不清心中是劫后余生的庆幸，还是更深处的某种麻木。\n\n城市里的警报声还在回荡，却已经没有多少人在意。街道上满是被遗弃的车辆和散落的物品，那些在强征时仓皇逃散的人群早已不知所踪。空旷的广场上，一个孩子呆坐在台阶上，手里攥着一件不知是谁的外套，仰望着天空中那道渐渐消散的碎屑尾迹。"
 gts_rainna_la_grande_first_meeting.31241.a:0 "太可怕了……"
 gts_rainna_la_grande_first_meeting.31241.a_tooltip:0 "下一次又会是什么时候？"
 gts_rainna_la_grande_first_meeting.31242.title:0 "人口献祭——失败"
 gts_rainna_la_grande_first_meeting.31242.desc:0 "蕾恩娜看着那些密密麻麻的运输飞船缓缓向她靠近，两根手指漫不经心地将整支舰队捏碎，碎屑在太空中静静飘散。\n\n她低头看了看指尖，眉头微微皱起。\n\n“嘛……”\n\n她的声音变得有些冷淡，原本慵懒的姿态悄然变得危险。\n\n“才这么点人，真是不够尽兴呢……”\n\n她没有再说什么，只是将目光重新落在这颗星球上。两只被白色长筒丝袜紧紧包裹的足底从两侧缓缓靠近，足趾若有所思地轻轻蜷曲了一下，巨大的阴影重新笼罩了整颗星球。\n\n“要我看……”她轻声说道，语气平静得像是在陈述一件无关紧要的事，“还不如玩一下你的星球呢。”\n\n两只白丝足底缓缓贴上了星球的两侧，轻轻地、慢慢地将双足向内收拢，就像是在感受某件精致的小东西。足弓的弧线完美地贴合着星球的曲率，丝袜的细密纹路印在大气层上，投下无数细密的阴影。\n\n她微微低头，透过双腿的间隙俯视着被夹在足底之间的星球，眼神中带着几分玩味。\n\n星球表面开始感受到来自两侧均匀而持续的压力。大气层在这种压迫下开始不安地涌动，狂风在两极呼啸而起。海面掀起巨浪，山脉在震动中簌簌落石。城市里的警报声再度响彻天际，人们仰望着天空，看着那两片洁白的足底将整个视野完全占据。\n\n蕾恩娜轻轻晃动了一下足趾。\n\n丝袜的边缘轻柔地蹭过大气层，带起一阵温和的气流，却让沿途的云层支离破碎。她似乎在仔细感受着足底传来的触感，嘴角微微上扬。\n\n“嗯……”\n\n她低低地应了一声，语气中带着几分若有所思的满足。足底继续缓慢地收紧。地壳开始发出低沉的轰鸣，第一道细小的裂缝悄然从赤道附近延伸开来。岩浆从裂缝深处透出微弱的红光，像是星球内部某种绝望的呼吸。\n\n她就这样将星球轻轻夹在双足之间，不紧不慢地感受着足底的触感，像是在把玩一件有趣的小玩意儿。她轻微地蹭动一下，让丝袜的纹路在地表留下新的印记。然后微微收紧，让星球发出新的轰鸣，又松开一些。\n\n“嗯……感谢款待哦~”\n\n蕾恩娜满意地抬起双足，留下满目疮痍的地面。"
 gts_rainna_la_grande_first_meeting.31311.title:0 "皈依——接受"
 gts_rainna_la_grande_first_meeting.31311.desc:0 "“哼~”\n\n蕾恩娜轻哼一声，嘴角带着几分满意的弧度。\n\n“既然你们如此虔诚，那么我决定……”\n\n四周静了下来。星球上的每一个人都屏住了呼吸，等待着那个将决定他们命运的答案。\n\n“接受你们对我虔诚的心吧~”\n\n她的双足缓缓从星球两侧挪开，足趾有些玩味地活动了一下，让最后一片阴影从地表消退。阳光重新洒在那些破碎的大陆上。\n\n“毕竟这个宇宙里面可没有几个人能够认可我的仁慈呢。”\n\n她托着下巴，俯视着这颗劫后余生的星球，眼神中带着几分罕见的平静。\n\n“不过嘛，”\n\n她的声音重新变得轻快，“既然你们要侍奉于我，那就得像样一点哦~”\n\n她伸出一根手指，悬在了这颗星球的上方。\n\n“你们的经典里不是说了吗，我是来审判有罪之人的。”她咯咯地笑了起来，“那就好好想想该用什么方式来表达你们的虔诚吧。”\n\n蕾恩娜有些玩味地双手交叉。\n\n“我可是很期待的呢……”\n\n星球上，宗教领袖们面面相觑，随即跪倒在地，带领着信众们齐声诵念起祷词。那声音越来越大，越来越整齐，穿透大气层向太空中涌去，如同一首献给新神的圣歌。\n\n蕾恩娜听着那此起彼伏的祷告声，满意地眯起眼睛。\n\n“很好。”"
 gts_rainna_la_grande_first_meeting.31311.a:0 "我们的新信仰建立了。"
 gts_rainna_la_grande_first_meeting.31311.a_tooltip:0 "愿女神垂怜。"
 gts_rainna_la_grande_first_meeting.31312.title:0 "皈依——拒绝"
 gts_rainna_la_grande_first_meeting.31312.desc:0 "“哼~”\n\n一声轻哼从宇宙中传出，带着几分不屑。\n\n四周静了下来。星球上的每一个人都屏住了呼吸，等待着那个将决定他们命运的答案。\n\n“你们这群小东西，居然还敢攀附于我。真是可笑。”\n\n蕾恩娜眯起眼睛，将巨大的面庞凑近这颗星球，湖泊般的蓝色眼眸中闪过一丝明显的轻蔑。\n\n“跪在我面前祈求宽恕的文明超过了天空中的星星……”她的声音变得冷淡而危险。“若是几句好听的话就能打发我，那岂不是太简单了？”\n\n她的双足不自觉地向星球两侧压下。巨大的阴影再度笼罩了整片天空，足底接触大气层之前产生的气流就已经将地面上的一切席卷殆尽。建筑物在这阵狂风中轰然倒塌，树木被连根拔起，海面掀起滔天巨浪。\n\n“崇拜我可是需要资格的。”\n\n她的声音轻描淡写，却让人不寒而栗。\n\n“而你们……”\n\n巨大的足底毫无阻碍地压在了地面上，深深陷入地壳之中。整颗星球在这难以想象的压力下剧烈震颤，赤道地带被挤压得向外鼓起，无数条裂缝如蛛网般从两极向中心蔓延，岩浆从深处喷涌而出。\n\n“可不配。”\n\n星球在沉默中碎裂成数块，残骸无声地散入太空。\n\n蕾恩娜看着那些漂散的碎片，随意地活动了一下足趾。\n\n“呀，下辈子吧。”"
 gts_rainna_la_grande_first_meeting.31313.desc:0 "通讯器的另一边沉默了很久，久到星球上的每一个人都以为她已经离开了。\n\n然后她开口了。\n\n“你们……”\n\n她的声音很轻，轻得几乎听不见。但那种轻，不是温柔、不是戏谑，而是某种更危险的东西。\n\n“你们这群两面三刀的家伙还有资格在我面前提‘虔诚’二字？”\n\n她的双足从两侧猛然压下，没有任何预兆，没有任何铺垫。足弓直接砸碎了大气层，巨大的冲击波在接触地面之前就已经将地表上的一切夷为平地。\n\n“我见过无数文明跪在我面前。”她的声音依然很轻，却带着一种令人窒息的冷意。\n\n她停顿了一下。\n\n“无耻。”\n\n足底毫不留情地压进地壳，星球在这股力量下几乎没有任何挣扎，直接从内部开始崩裂。岩浆从裂缝中喷涌而出，大陆板块在瞬间断裂、错位。\n\n蕾恩娜全程没有再说一句话。\n\n星球碎裂成数块，残骸散入太空。\n\n她抬起足底，看了一眼，随即将视线移开，就像看到了什么不值得多费眼神的东西。"
 gts_rainna_la_grande_first_meeting.31312.a:0 "对不起，我们不应亵渎您。"
 # gts_rainna_la_grande_first_meeting.31312.a_tooltip:0 "愿女神垂怜。"
 gts_rainna_la_grande_first_meeting.31321.title:0 "拒绝皈依——宽恕"
 gts_rainna_la_grande_first_meeting.31321.desc:0 "“啧……”\n\n通讯器另一端传来蕾恩娜耐人寻味的声音，整个氛围在这一刻达到了令人窒息的高峰。\n\n星球上的每一个人都屏住了呼吸。\n\n她的足趾在星球两侧轻轻活动了一下，那两片遮天蔽日的足底随时可能压下来。丝袜的纹路在大气层上投下细密的阴影，随着她足趾的每一次蜷曲而微微晃动。\n\n“看在你们这次态度还算诚恳的份上……”\n\n她停顿了一下，似乎在考虑某件有趣的事情。\n\n“我暂且接受吧。”\n\n她的双足缓缓向外移开了一些，压迫感稍稍减轻。星球上不知道多少人同时松了一口气。\n\n然而就在这时，蕾恩娜的双足突然向内一贴，毫无预兆地压在了星球的两侧。足弓的弧线与星球的曲率完美贴合，白色丝袜的细密纹路瞬间印在了地表上，在两片大陆上留下两个巨大而清晰的凹坑。\n\n“不过作为补偿……就让我的足底贴贴吧~”\n\n她开始轻柔地揉搓。\n\n这个动作看似温和，却让整颗星球都感受到了难以承受的摩擦力。白色丝袜的纹路在地表反复摩擦，所经之处的城市群被悉数卷入足底与地面之间，在这柔软而致命的摩擦中化为细碎的粉末，紧紧嵌入丝袜的纤维之间。\n\n她的足底缓缓在地表游走。足弓扫过连绵的山脉，峰顶在这轻柔的触碰下悄然坍塌；足跟压过广袤的平原，千里沃土在瞬间下陷，化作一道深邃的弧形凹槽；足趾则更加灵活，在密集的城市群间轻盈地点动、蜷曲，将一座座繁华的都市如同玩具积木般轻易推倒，碾入土地之中。\n\n“嗯……”\n\n蕾恩娜低低地应了一声，声音中带着若有所思的满足。她微微调整着角度，让足底的每一寸肌肤都能充分感受到地表的触感。丝袜在摩擦中逐渐沾染上了大量灰尘与碎屑，那些曾经是城市、森林、海岸线的东西，如今都成了足底的污渍。\n\n她将足底轻轻向外滑动，带走了地表上最后一层残存的建筑群，将它们扬入大气层，形成一道诡异的尘埃云雾。\n\n然后，她满意地将双足抬起。\n\n星球已经面目全非。两侧各有大半个半球的地表被摩擦得光滑而平整，那些曾经繁华的大陆如今只剩下被丝袜纹路完美拓印下来的巨大痕迹，像是某种奇异的艺术品。岩浆从新生的裂缝中缓缓流淌，填补着那些深邃的凹槽。\n\n“嗯，真舒服呢。”\n\n蕾恩娜看着足底沾染的那些碎屑，满意地眯起眼睛。\n\n“就这样吧。”"
 gts_rainna_la_grande_first_meeting.31322.title:0 "拒绝皈依——惩罚"
 gts_rainna_la_grande_first_meeting.31322.desc:0 "“嗯……”\n\n蕾恩娜温和地应了一声，语气平静得出奇，仿佛这只是一件再寻常不过的小事。\n\n星球上的人们还没来得及庆幸，就看到那两只足底以远超之前的速度向内合拢。\n\n“那么~就接受我的惩罚吧。”\n\n两只足底毫不留情地踏在了星球两侧，将整颗星球死死夹住。白色丝袜与地表接触的瞬间，大气层被瞬间撕裂，狂风呼啸着向四面八方逃窜。\n\n她开始揉搓。\n\n没有任何怜悯，也没有任何克制。足底在地表大幅度来回滑动，每一次摩擦都将地表上的一切扫荡殆尽。城市群在足底的推进下如同沙堆般垮塌，碎屑被卷入丝袜的纤维之间。山脉在足弓下被反复碾压，最终化为平整的粉末。海洋在足底的温度下迅速蒸发，只留下龟裂干涸的海床在高温中扭曲变形。\n\n蕾恩娜的足趾开始不耐烦地蜷曲、张开，每一次动作都在地表留下新的沟壑。她微微加大力道，足底深深陷入地壳之中，岩浆从四处涌出，在丝袜边缘汽化成滚烫的蒸汽。\n\n“哼……”\n\n她轻轻应了一声，语气依然温和，却让人心惊。\n\n她将双足向内猛地一收。\n\n“咔嚓。”\n\n一声沉闷的脆响，从星球内部传出。一道巨大的裂缝从赤道附近炸开，将整颗星球撕裂成几块，勉强还维持着原来的形状，却已经是强弩之末。岩浆从裂缝深处汹涌而出，将那几块残骸染成暗红色。\n\n蕾恩娜缓缓将双足抬起，低头打量着那几块勉强合在一起的残骸，若有所思地歪了歪头。\n\n“嘛……”\n\n她随意地活动了一下足趾，抖落足底沾染的碎屑。\n\n“就这样吧。”"
 gts_rainna_la_grande_first_meeting.31322.a:0 "请您宽恕我们的罪行……"
 gts_rainna_la_grande_first_meeting.31991.desc:0 "蕾恩娜在太空中慵懒地伸了个懒腰。\n\n“嘛……”\n\n她低头看了看这颗已经满目疮痍的星球，眼神中带着几分漫不经心的倦意，就像是一个玩腻了玩具的孩子。那些深深的足印、遍布大陆的裂缝、蒸发殆尽的海洋，在她眼中不过是一幅普通得不能再普通的风景。\n\n“差不多了吧。”\n\n她在太空中翻了个身，将这颗星球甩到了视野边缘，开始漫不经心地整理自己飘散的长发。\n\n“你们这颗星球嘛……”她随口说道，语气平淡得像是在评价一道普通的菜肴，“还算有点意思，不过也就这样了。”\n\n她的目光已经开始游向更远处的星海，那些遥远的星系在她眼中闪烁着隐约的光芒，似乎比眼前这颗残破的星球更能引起她的兴趣。\n\n她就这样静静地漂浮在太空中，看了片刻那片遥远的星海，然后不紧不慢地活动了一下足趾，将附着在白色丝袜上的最后一点碎屑抖落。那些碎屑如同黑色的雪花，无声地飘向星球残破的地表。\n\n“嘛，那就这样吧~”\n\n她的身影开始缓缓移动，庞大的身躯在星光中逐渐远去。没有任何正式的道别，没有任何特别的交代，就像是一个过客离开了一个不值得留恋的地方。\n\n地面上的幸存者们仰望着那个越来越小的身影，不知道该松一口气，还是继续保持恐惧。有人跪坐在废墟上，有人茫然地站在原地，更多的人只是沉默地望着那片逐渐恢复平静的天空。\n\n就在所有人都以为她真的要离开的时候——\n\n“哦，对了。”\n\n她忽然停了下来，头也不回地说道，声音轻描淡写。\n\n“我还会回来的哦~”\n\n她顿了顿，像是在想什么有趣的事情，嘴角不自觉地勾了起来。\n\n“下次嘛……说不定会更有意思呢~”"
 gts_rainna_la_grande_first_meeting.31991.desc_alter:0 "蕾恩娜将视线从这颗星球上收回，在太空中懒懒地舒展了一下身体。\n\n“嘛……”\n\n她打了个哈欠，用手背轻轻遮了遮嘴，神情慵懒而随意。她低头最后看了一眼那颗满目疮痍的星球，就像随手翻完了一本不太有趣的书，随手合上，不打算再翻第二遍。\n\n“玩得差不多了。”\n\n她没有任何留恋地将身体转向了更深处的星海。巨大的身影在移动时带起一阵微弱的气流，让星球的大气层最后颤抖了一次。\n\n“你们这颗星球……”她随口说着，声音已经带上了几分飘远的意味，“倒是挺好玩的。”\n\n她的长发在太空中慢慢舒展开来，如同一片正在消散的星云。她也不再看这颗星球，目光已经落在了更远处某个不知名的方向。\n\n星球上的人们就这样看着她的背影越来越小，越来越模糊，沉默地等待着什么。\n\n“嘛，对了……”\n\n她忽然轻轻地应了一声，语气随意得像是刚刚想起来一件小事。\n\n“我有空再来哦。”\n\n没有回头，没有停顿，那句话就这样漫不经心地飘散在星海里。\n\n然后她真的走了。\n\n星球上重新恢复了久违的寂静。天空中什么都没有了，只剩下稀薄的阳光透过破碎的大气层照下来，落在那片沉默的废墟上。"
 gts_rainna_la_grande_first_meeting.31992.desc:0 "星球的残骸在太空中静静漂浮着，那几块被严重压扁的碎块已经失去了原本的形状，只剩下冷却中的岩浆在表面缓缓流淌。\n\n蕾恩娜低头看了看那些碎片，歪了歪头。\n\n“嘛……”\n\n她随意地将一块较大的残骸用足底轻轻踩住，开始漫不经心地来回搓揉。白色丝袜与岩石表面摩擦，将那块残骸碾得越来越细碎，碎屑如同黑色的粉末般向四周飘散。她的动作悠闲而随意，就像是在无聊时踢散一堆落叶。\n\n“比想象的还脆呢……”\n\n她自言自语着，将足底抬起，看了看丝袜上新添的污渍，不甚在意地活动了一下足趾，让那些细碎的岩石粉末随之飘散。\n\n她又随手拨弄了一下漂浮在旁边的另一块残骸，让它在太空中缓缓旋转，就这样看了片刻，然后失去了兴趣。\n\n“嘛，就这样吧。”\n\n她的身影开始向更深的星海移动，声音越来越远。\n\n“下次找个结实一点的星球好了……”\n\n她喃喃地自言自语着，身影逐渐消失在星海之中。只剩下那些大小不一的碎块，在她曾经驻足的地方静静漂浮着。"
 gts_rainna_la_grande_first_meeting.31992.desc_alter:0 "碎裂的星球残骸在太空中无声地漂散着，那些曾经是大陆、海洋、城市的东西，如今都化作了形状不规则的岩石碎块，在原地缓慢地旋转着。\n\n蕾恩娜看着这片残骸，沉默了片刻。\n\n“嘛……”\n\n她用指尖轻轻拨开一块漂过来的碎片，让它向更远处飘去。\n\n“坏掉了。”\n\n她的语气平静而随意，就像是打碎了一个不太珍贵的小摆件。她在太空中慵懒地伸了个懒腰，将视线从这片残骸上移开，望向了更远处的星海。\n\n“也没什么意思了。”\n\n她转过身，长发在无重力中缓缓飘散，逐渐遮住了那片残骸的轮廓。\n\n“下次嘛……”她漫不经心地自言自语着，声音越来越轻，“找个大一点的，应该更好玩吧……”\n\n她的身影在星光中慢慢淡去。残骸在她离去时带起的微弱气流中轻轻晃动，随即重归寂静，散落在这片曾经有过无数生命的虚空之中。"
 gts_rainna_la_grande_first_meeting.31993.desc:0 "蕾恩娜在太空中满意地舒展了一下身体，低头最后看了一眼这颗星球。\n\n“嘛……”\n\n她的嘴角带着几分漫不经心的满足。\n\n“就这样吧。”\n\n她的语气轻描淡写，仿佛刚才那场险些到来的灾难只是一个微不足道的小插曲。她将身体转向星海深处，白色丝袜在星光下划过一道柔和的弧线。\n\n“不过下次嘛……”她顿了顿，语气变得有些意味深长，“我可就不会这么温柔了。”\n\n“毕竟你们也没把我当朋友……”\n\n她的身影在星光中缓缓消散，只留下那颗在劫后余生中颤抖的星球，静静地悬浮在太空之中。"
 gts_rainna_la_grande_first_meeting.31996.desc:0 "蕾恩娜俯视着这颗刚刚宣誓皈依的星球，眼神中没有任何温柔，只有一种居高临下的冷淡。\n\n“嗯。”\n\n她轻轻地应了一声，就像是在确认一件无关紧要的事情。\n\n“你们现在是我的了。”\n\n这句话说得平静而随意，却让每一个听到的人都感到一阵寒意。不是神明接纳信徒时应有的慈悲，也没有任何庇护的承诺——只是一种近乎冷酷的占有。\n\n“记住这一点。”\n\n她将身体转向星海深处，长发在无重力中缓缓飘散。她没有留下任何印记，没有降下任何恩泽，就这样平静地离去，像是一个将猎物收入囊中的猎手，随手关上了笼子的门。\n\n“我可是会再次降临的。”\n\n这一次，没有语气词，没有轻快的尾音。只是一句陈述，冷静而确定。\n\n星球上，信众们跪在地上，久久没有起身。没有人知道该如何面对这样的神明——她接受了他们的皈依，却没有给予任何回应，没有任何慈悲，没有任何光辉。\n\n只有那句“你们现在是我的了”，在每个人心中沉甸甸地压着。"
 gts_rainna_la_grande_random.01.title:0 "踩踏破坏"
 gts_rainna_la_grande_random.01_1.desc:0 "“哼哼~又见面了呢~”\n\n那个熟悉的声音从通讯器中传来，轻快而随意，仿佛只是在跟老朋友打招呼。太空中，蕾恩娜巨大的身影缓缓显现，她慵懒地漂浮在这颗星球的上方，长发在星光中飘散。\n\n“嘛，还记得我吗？”\n\n她歪着头，那双湖泊般的眼眸俯视着这颗渺小的星球，眼神中带着几分玩味。\n\n“我知道你们肯定记得我的~毕竟我这么难忘嘛~”\n\n她咯咯地笑了几声，随即像是想起了什么，语气变得轻快起来。\n\n“啊，对了。我这次来呢，是因为最近有点无聊。”\n\n她的手指在大气层外轻轻晃动，带起一阵扰动云层的气流。\n\n“你们这颗星球看起来还挺热闹的嘛~所以我就想啊，来找你们玩一玩，应该不介意吧？”\n\n她的声音依然温柔，却让每一个听到的人都感到脊背发凉。"
 gts_rainna_la_grande_random.01_2.desc:0 "太空中，一个庞大的身影逐渐清晰。\n\n“你们好呀~我又回来咯~”\n\n蕾恩娜俏皮的声音在通讯频道中回荡。她将巨大的面庞凑近星球，那双清澈的眼眸里闪烁着好奇的光芒，像是在观察一件久违的玩具。\n\n“我看看啊……嗯，你们这段时间发展得还不错嘛~又建了不少新的小房子呢~”\n\n她满意地点了点头，语气里带着几分类似长辈的欣慰，只是这份"欣慰"透着说不出的诡异。\n\n“不过嘛……”\n\n她的声音突然一转，嘴角勾起一抹意味深长的笑容。\n\n“建得这么漂亮，不踩一踩多可惜呀~”\n\n她慵懒地抬起一只脚，那洁白的足底在星光下泛着柔和的光泽，缓缓移向星球的上方，投下一片遮天蔽日的阴影。\n\n“所以呢，这次就让我好好欣赏一下你们的‘成果’吧~”\n\n“你们可要让我满意哦~”"
 gts_rainna_la_grande_random.01.a:0 "她想做什么？"
 gts_rainna_la_grande_random.02.title:0 "踩踏——城市"
 gts_rainna_la_grande_random.02_1.desc:0 "“嗯……先从哪里开始呢~”\n\n蕾恩娜歪着头，那双巨大的眼眸在星球表面缓缓扫过，最终落在了一片灯火通明的区域——那是这颗星球上最繁华的城市群之一，无数的建筑鳞次栉比，从太空望去像是一片闪烁的光海。\n\n“啊，这里看起来最热闹了……”\n\n她的声音里带着几分愉悦，随即抬起了一只裸足。那洁白的足底在星光下泛着柔和的光泽，缓缓移向那片城市群的上方，遮天蔽日的阴影瞬间笼罩了整片大陆。\n\n地面上，无数人仰望着天空中那片逐渐逼近的白色，警报声响彻每一个角落，却没有任何意义。\n\n“那就……”\n\n她轻轻一踩。\n\n足底触及地表的瞬间，整片大陆都为之震颤。那些密密麻麻的城市、那些高耸的建筑、那些奔逃的生命，在这轻柔的一触之下悉数化为齑粉，被压入地壳深处。当她抬起足底时，原本繁华的城市群已经不复存在，只剩下一个巨大而完美的足印，边缘还在渗出滚烫的岩浆。\n\n“嗯~不错。”"
 gts_rainna_la_grande_random.02_2.desc:0 "蕾恩娜俯视着这颗星球，目光在那些密集的光点之间游移，像是在挑选一件称心的玩具。\n\n“你们的城市建得可真密呀~”\n\n她轻声感叹着，语气里带着几分孩童般的好奇。她伸出手指，虚虚地点向星球表面那片最为繁华的区域，那里聚集着这颗星球上大半的人口与文明成果。\n\n“就是这里了~”\n\n她优雅地抬起一只裸足，饱满的足底缓缓下压。狂暴的气流在足底接触地表之前就已经席卷了整片大陆，摩天大楼在飓风中如积木般崩塌，海面掀起数千米高的巨浪。\n\n然后，足底落下。\n\n那一整片城市群——连同其中数以亿计的生命——在瞬间被彻底抹去。地壳承受不住这难以想象的压力，无数条裂缝如蛛网般蔓延开来，岩浆从深处喷涌而出，将那片曾经繁华的土地染成一片暗红。\n\n蕾恩娜缓缓抬起足底，端详着足底沾染的细碎尘埃，满意地眯起了眼睛。\n\n“消失得干干净净呢~真好~”"
 gts_rainna_la_grande_random.02.a:0 "可恶！"
 gts_rainna_la_grande_random.02.b:0 "可怕……"
 gts_rainna_la_grande_random.03.title:0 "踩踏——发电区"
 gts_rainna_la_grande_random.03.desc:0 "“唔……那边闪闪发光的是什么呀？”\n\n蕾恩娜的目光落在了一片布满发电设施的大陆上。那里矗立着密密麻麻的反应堆与能量塔，无数的能量导管纵横交错，在夜色中泛着幽幽的蓝光，像是一片人造的星海。\n\n“看起来亮晶晶的，应该是太阳能板吧？”\n\n她好奇地抬起裸足，饱满的足底缓缓压向那片区域。当足底触及地表的瞬间，那些精密的发电设施在难以想象的压力下接连崩塌，反应堆的能量核心被压碎，迸发出刺目的强光。\n\n一连串的能量失控在足底之下接连引爆，形成了一片壮观却致命的光海。蕾恩娜似乎被这景象吸引，愉快地眨了眨眼。\n\n“哼，这下小人没有电脑玩咯。”\n\n她抬起足底，那片曾经为整颗星球提供能源的区域，此刻只剩下一个焦黑的巨坑，残余的电流还在坑底断断续续地闪烁着。"
 gts_rainna_la_grande_random.04.title:0 "踩踏——采矿区"
 gts_rainna_la_grande_random.04.desc:0 "蕾恩娜的目光扫过一片满是采矿设施的大陆。巨大的矿井深入地下，纵横的开采轨道和高耸的精炼塔遍布其间，那是这颗星球最重要的资源产地之一。\n\n“这里光秃秃的，应该是采矿区吧~”\n\n她歪着头，饶有兴致地打量着那些深邃的矿井。\n\n“真好奇下面有什么好东西呢~”\n\n她伸出抬起裸足，轻轻挪到向那片矿区的上空，压下。仅仅是足底的轻轻一碾，那些深入地下的矿井便瞬间坍塌，精炼塔如同折断的火柴般纷纷倒下，采矿设备连同其中的一切被碾入地层，深藏地下的矿脉被生生挤压、扭曲。\n\n“嗯……这下里面的小人应该都死光了吧……”\n\n她收回足趾，那片曾经繁忙的矿区已经彻底沦为一片被翻搅过的废土。"
 gts_rainna_la_grande_random.05.title:0 "踩踏——农业区"
 gts_rainna_la_grande_random.05.desc:0 "“那边绿油油的一大片，看起来好舒服呀~”\n\n蕾恩娜的目光落在了一片广袤的农业区上。金黄的麦浪与翠绿的田野交织成一幅绵延千里的画卷，那是这颗星球赖以为生的粮仓。\n\n“感觉踩上去一定很软吧~”\n\n她带着几分期待，将裸足的足底轻轻压向那片田野。饱满的足底陷入柔软的土地，将大片的农田尽数覆盖。庄稼在足底之下被碾成碎屑，肥沃的土壤被压得结结实实，纵横的灌溉渠道悉数崩裂。\n\n她愉快地用足底在田野上蹭了蹭，感受着那份柔软的触感。\n\n“嗯~果然很软呢，踩起来好舒服~”\n\n当她抬起足底时，那片曾经生机盎然的粮仓已经变成了一片贫瘠的荒地，深深的足印中再也长不出任何东西。\n\n“嘛，这下小人肯定没吃的咯。”"
 gts_rainna_la_grande_random.06.title:0 "离开"
 gts_rainna_la_grande_random.06_1.desc:0 "蕾恩娜在太空中伸了个懒腰，低头看了看这颗留下了新足印的星球。\n\n“嘛，今天玩得还挺开心的~”\n\n她随意地活动了一下足趾，将附着的尘埃抖落，那些细碎的残骸如同黑雪般飘向地表。\n\n“你们这颗星球还是老样子嘛，每次来都有点新东西可以玩~”\n\n她慵懒地转过身，长发在星光中缓缓舒展。\n\n“好啦，我先走咯~”\n\n她的声音已经带上了几分飘远的意味。\n\n“记得好好把坑填一填哦~下次我来的时候，可不想看到一片乱糟糟的样子呢~”\n\n她顿了顿，语气里带着几分轻快的威胁。\n\n“嗯，我还会再来的~你们等着我哦~”\n\n她的身影缓缓消失在星海之中，只留下那颗新添了伤痕的星球，在寂静中默默旋转。"
 gts_rainna_la_grande_random.06_2.desc:0 "“呼……差不多该走了呢~”\n\n蕾恩娜满意地打量着自己刚刚"欣赏"过的成果，那双清澈的眼眸里带着几分慵懒的餍足。\n\n“今天的收获还不错嘛~”\n\n她慵懒地在太空中翻了个身，将这颗星球甩到了视野边缘。\n\n“你们也别太难过啦~”她的声音里带着几分漫不经心的安慰，“毕竟能被我临幸……可是你们的荣幸哦~”\n\n她咯咯地笑了几声，随即将目光投向了更远处的星海。\n\n“嘛，那就下次再见咯~”\n\n“在那之前，你们要好好的哦~”她俏皮地眨了眨眼，“多建点漂亮的东西，等我下次回来欣赏~”\n\n她的身影逐渐远去，那句轻飘飘的话语久久回荡在通讯频道中，让每一个听到的人都无法真正松一口气。\n\n因为所有人都清楚——她真的还会回来。"
 gts_rainna_la_grande_random.06.a:0 "她总算走了……"
 gts_rainna_la_grande_random.11.title:0 "碾压破坏"
 gts_rainna_la_grande_random.11_1.desc:0 "“安啦安啦，我又来了哦~”\n\n蕾恩娜俏皮地眨了眨眼，慵懒地在太空中调整着姿势。她将双腿缓缓移向这颗星球的两侧，那两只洁白的裸足从两个方向悄然逼近，饱满的足底泛着柔和的光泽。\n\n“这次的玩法嘛……”\n\n她歪着头，嘴角勾起一抹意味深长的笑容。\n\n“我想试试把你们夹在中间会是什么感觉呢~”\n\n两只足底在星球两侧缓缓合拢，遮天蔽日的阴影从两个方向同时笼罩下来。地面上的人们仰望着天空，看着那两片越来越近的白色，绝望地意识到，这一次已经无处可逃。\n\n“来吧，让我好好‘感受’一下你们~”"
 gts_rainna_la_grande_random.11_2.desc:0 "“嘛，好久不见呢……”\n\n蕾恩娜俯视着这颗渺小的星球，眼神中带着几分玩味的好奇。\n\n“你们这颗小球球，看起来正好呢~”\n\n她慵懒地舒展开身体，将双足缓缓移向星球的两端。那洁白的足底在星光下显得格外柔和，却带着无可抗拒的压迫感，一点一点地向内靠拢。\n\n“就像这样，夹在我的脚中间~”\n\n她的声音里带着几分期待，双足的距离越来越近，星球被夹在两片巨大的足底之间，显得愈发渺小。大气层在这种双向的压迫下开始不安地涌动，狂风在星球两极呼啸而起。\n\n“嗯……让我想想要用多大力气呢~”\n\n她俏皮地晃了晃足趾，那个轻微的动作让整颗星球都为之震颤。\n\n“太轻了没意思，太重了又怕玩坏了……"她咯咯地笑着，"这个分寸，可得好好把握才行呢~”"
 gts_rainna_la_grande_random.12.title:0 "轻柔碾压"
 gts_rainna_la_grande_random.12_1.desc:0 "蕾恩娜的双足轻轻贴在了星球的两侧。\n\n只是这轻柔的一贴，星球两端最大的两片大陆便瞬间承受不住那难以想象的压力。饱满的足底覆盖了整片陆地，那些密集的城市、绵延的山脉、蜿蜒的河流，在足底与地表接触的刹那间被悉数压平，化作紧贴在足底纹路里的一层薄薄的痕迹。\n\n大地发出不堪重负的轰鸣，两片大陆的边缘绽开无数道裂缝，岩浆从深处缓缓渗出。\n\n“嗯……”\n\n蕾恩娜低低地应了一声，感受着足底传来的细微触感，眼中带着几分餍足的笑意。\n\n“这个力度刚刚好呢~”\n\n她没有继续加力，只是让双足轻轻贴着星球，享受着这份微妙的触感。星球在两片足底之间轻轻颤抖着，勉强维持着完整——至少，它还没有碎。"
 gts_rainna_la_grande_random.12_2.desc:0 "两只洁白的足底从两个方向缓缓贴上了星球的表面。\n\n蕾恩娜控制着力度，只是让足底轻轻压在星球两端的大陆上。然而即便是这样"轻柔"的接触，对这颗渺小的星球来说也是一场灭顶之灾。\n\n被足底覆盖的两片大陆瞬间塌陷，摩天大楼、城市、道路，连同其中的一切，都在这轻轻一贴之下被压入地壳深处。地表上那些曾经繁华的痕迹消失得无影无踪，只留下两片与足底完美贴合的凹陷。\n\n“啊……感觉到了呢~”\n\n蕾恩娜愉快地眨了眨眼，能清楚地感受到足底之下那两片大陆的崩塌。\n\n“你们的小房子，在我脚下碎掉的感觉，还挺特别的~”\n\n她轻轻晃动了一下足底，感受着地表传来的细微摩擦，随即停了下来，满意地维持着这个姿势。星球被夹在双足之间，两端的大陆已经面目全非，但整体依然勉强完好。"
 gts_rainna_la_grande_random.13.title:0 "落雨"
 gts_rainna_la_grande_random.13.desc:0 "“嘛，差不多就这样吧~”\n\n蕾恩娜似乎对这份触感已经满足，缓缓将双足从星球两侧抬起。足底离开地表时，带起了大片附着的碎屑，那些曾经是城市与大陆的残骸紧紧粘在她的足底纹路之间。\n\n她在太空中将双足的足底相对合拢，然后轻轻地互相摩擦起来。\n\n足底与足底之间，那些细碎的建筑残骸、岩石碎块和尘埃被缓缓碾磨、剥落，如同一场黑色的细雨，纷纷扬扬地飘落回星球的表面，落在了蕾恩娜特意挑选的未损坏的大陆上，造成了新的一轮破坏。\n\n“呼，下雨咯~”\n\n她一边搓着足底，一边随口说着。那些从她足底落下的碎屑散落在星球的地表上，为这颗已经伤痕累累的星球又添了一层薄薄的尘埃。\n\n“好啦，干净多了~”\n\n她满意地看了看清理干净的足底，随即在太空中舒展开身体，那两片大陆的毁灭对她来说，不过是一次无关紧要的小插曲。"
 gts_rainna_la_grande_random.14.title:0 "摩擦"
 gts_rainna_la_grande_random.14.desc:0 "“嗯……这个触感，好舒服呢~”\n\n蕾恩娜闭上眼睛，轻轻咬着下唇，显然十分享受足底传来的感觉。她没有停下，反而开始缓缓地、有节奏地用双足在星球表面来回摩擦起来。\n\n每一次摩擦，都让破坏进一步扩大。\n\n原本只是被压平的两片大陆，此刻在足底的反复蹭动下彻底崩解。地壳被生生撕开，大块的陆地被足底的摩擦力卷起、揉碎，混入足底的纹路之间。那些原本还残存在大陆边缘的城市，也在这一轮又一轮的摩擦中被彻底抹去。\n\n星球的轮廓在双足的挤压下微微变形，赤道地带被压得向外鼓起。地表上，无数条裂缝从两极向中心蔓延，岩浆从裂缝深处汹涌而出，将大片区域染成暗红色。\n\n“啊……感觉整颗星球都在我脚下颤抖呢~”\n\n蕾恩娜愉快地感叹着，双足摩擦的动作越来越流畅。那些曾经完好的区域，也在这场持续的蹂躏中一点点走向崩溃。\n\n当她终于停下来时，这颗星球早已面目全非——大半个表面都被摩擦得凹凸不平，只剩下星球的内核还在勉强维系着整体的形状。\n\n“嗯~这一次玩得可真尽兴呢~”"
 gts_rainna_la_grande_random.15.title:0 "压碎"
 gts_rainna_la_grande_random.15.desc:0 "“嗯……这种感觉好舒服~”\n\n蕾恩娜显然已经沉浸在这份触感之中。她微微收拢双腿，足底缓缓向内施压，星球在两片足底之间发出令人牙酸的呻吟。\n\n地壳开始崩裂，一道道裂缝从星球表面向内部深处蔓延，岩浆从深处喷涌而出。星球在双足的挤压下逐渐变形，勉强维系着最后的完整。\n\n“啊……快撑不住了呢~”\n\n她愉快地感受着那份阻力，双腿不自觉地又用了几分力。\n\n咔嚓。\n\n一声沉闷的脆响从星球内部传出。\n\n星球的内核终于承受不住那难以想象的压力，整颗星球在双足之间彻底碎裂开来，化作数块巨大的残骸，岩浆与尘埃从每一道裂缝中喷涌而出，在太空中缓缓扩散。\n\n“啊……”\n\n蕾恩娜微微一愣，随即歪着头看着足底之间那团正在崩解的残骸，脸上露出了几分意外的神情。\n\n“哎呀，一不小心用力过头了呢~”\n\n她将双足缓缓分开，那些碎裂的残骸在原地无助地漂浮着，再也无法拼回成一颗完整的星球。\n\n“嘛，玩坏了就玩坏了吧，反正也挺好玩的。”"
 gts_rainna_la_grande_random.16.title:0 "玩笑"
 gts_rainna_la_grande_random.16.desc:0 "蕾恩娜的双足在星球两侧缓缓逼近，遮天蔽日的阴影从两个方向笼罩下来。\n\n就在足底即将贴上地表的那一刻——\n\n“……嗯……”\n\n她忽然停了下来，歪着头看着那颗被夹在双足之间瑟瑟发抖的星球。\n\n“嘛，改主意了。”\n\n她的语气里带着几分意兴阑珊，仿佛忽然对这个游戏失去了兴趣。她将双足重新分开，那逼近的阴影缓缓消退，阳光重新洒回了星球的表面。\n\n“算咯算咯，就当我是开玩笑的~”\n\n她慵懒地在太空中舒展开身体，随口说着，就像是刚刚放下了一件玩到一半却觉得无趣的玩具。"
 gts_rainna_la_grande_random.17.title:0 "离开"
 gts_rainna_la_grande_random.17_1.desc:0 "蕾恩娜在太空中慵懒地舒展了一下身体，低头看了看这颗留下了新痕迹的星球。\n\n“嘛，今天玩得挺尽兴的~”\n\n她随意地活动了一下足趾，将附着的碎屑抖落，那些细碎的残骸如同黑雪般飘向地表。\n\n“你们这颗星球，夹起来的手感还不错嘛~”\n\n她慵懒地转过身，语气里带着几分餍足的满意。\n\n“嘛，再见~”\n\n她俏皮地眨了眨眼，身影缓缓消失在星海之中,只留下那颗伤痕累累的星球在寂静中默默旋转。"
 gts_rainna_la_grande_random.17_2.desc:0 "“呼……差不多该走了呢~”\n\n蕾恩娜满意地打量着自己的成果，那双清澈的眼眸里带着几分慵懒的餍足。\n\n“你们的表现还不错嘛~至少让我玩得挺开心的~”\n\n她慵懒地在太空中翻了个身,将这颗星球甩到了视野边缘。\n\n“下次我来的时候,可要给我准备点新花样哦~”她漫不经心地说着,“毕竟我可不想踩踩过的二手星球嘛。”。\n\n她伸了个懒腰,长发在星光中缓缓舒展。\n\n“嘛,那就下次再见咯~”\n\n“保障哦~”她的声音渐渐飘远,“期待你们把星球建设得满满的哦~”\n\n她的身影逐渐消失在星海深处。"
 gts_rainna_la_grande_random.18.desc:0 "蕾恩娜慵懒地收回了双足,在太空中舒展开身体。\n\n“嗯,今天就先放过你们吧~”\n\n她低头看了看那颗完好无损的星球,眼神里带着几分意兴阑珊的随意。\n\n“今天状态不好……”她漫不经心地说着,“等有欲望了再说。”\n\n她慵懒地转过身,长发在星光中缓缓飘散。\n\n“如果下次我心情要是不好,那就说不准会发生什么了呢~”\n\n她的身影渐渐远去。地面上的人们仰望着那片重新恢复平静的天空,没有人敢真正松一口气——因为他们清楚,这份幸运不会一直持续下去。\n\n“嘛，再见！”"
 gts_rainna_la_grande_random.19.desc:0 "星球的残骸在太空中静静漂浮着,那几块碎裂的陆地在冷却的岩浆中缓缓旋转。\n\n蕾恩娜低头看了看那片残骸,歪了歪头。\n\n“哎呀,一不小心就玩坏了呢~”\n\n她随意地拨弄了一下漂浮在旁边的一块残骸,让它在太空中缓缓打转,语气里没有丝毫的愧疚,倒像是打碎了一个不太重要的小玩意。\n\n“嘿嘿,这颗星球也就这点承受力嘛~夹起来是挺舒服的,可惜太脆了点~”\n\n她自言自语着,将视线从那片残骸上移开,望向了更远处的星海。\n\n“下次找个结实一点的好了~”她漫不经心地说着,“这样才能玩得久一点呢~”\n\n她在太空中慵懒地伸了个懒腰,身影开始缓缓远去。\n\n“嘛,总之也算是玩得挺开心的~”\n\n那句轻飘飘的话语散在星海里,而那颗曾经孕育了无数生命的星球,如今只剩下几块无声的残骸,永远地留在了这片虚空之中。"
 gts_rainna_la_grande_random.21.title:0 "腿夹破坏"
 gts_rainna_la_grande_random.21.desc:0 "“哼哼~又见面了呢~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。在她的视角中，这颗星球对她来说不过是一颗橙子般大小的小球。\n\n“最近过得怎么样呀？有没有想我呀~”\n\n她歪着头，那双湖泊般的眼眸俯视着这颗渺小的星球，眼神里带着几分玩味的笑意。\n\n“嘛，我这次来呢，是想到了一个新玩法哦~”\n\n她俏皮地眨了眨眼。\n\n“肯定能给你们增加不少伤亡呢~”"
 gts_rainna_la_grande_random.22.desc:0 "“嘛，就像这样……”\n\n蕾恩娜将这颗橙子般的星球移到了双膝之间，缓缓地屈起双腿，用两侧的膝盖轻轻将它夹住。\n\n星球被夹在她光滑的膝盖之间,显得愈发渺小。大气层在这轻柔的接触下开始不安地涌动,狂风在星球表面呼啸而起。\n\n“嗯……真是小巧~”\n\n她低头看着夹在膝间的星球,愉快地眨了眨眼。\n\n“这个大小,肯定会很有意思~”\n\n她微微调整着双膝的角度,让星球在膝盖之间轻轻转动,像是在把玩一颗珍贵的弹珠。\n\n“让我看看,要用多大力气才能……”"
 gts_rainna_la_grande_random.23.desc:0 "“嘿嘿……用力咯~”\n\n蕾恩娜双膝微微一收。\n\n星球在两片光滑的膝盖之间发出令人牙酸的呻吟。地壳开始崩裂,一道道裂缝从表面向内部深处蔓延,岩浆从深处喷涌而出。\n\n“嗯，真舒服呢~”\n\n她愉快地感受着那份阻力,双膝又用了几分力。\n\n咔嚓。\n\n一声清脆的脆响。\n\n那颗橙子般的星球在她双膝之间彻底碎裂开来,化作数块细小的残骸,岩浆与尘埃从裂缝中喷涌而出,在膝间缓缓散开。\n\n“啊~碎了呢~”\n\n蕾恩娜低头看着膝盖之间那团崩解的残骸,满意地眯起了眼睛。\n\n“这个手感,还挺解压的嘛~”"
 gts_rainna_la_grande_random.24.desc:0 "蕾恩娜将双腿舒展开来,看着那些从膝间飘散的细碎残骸,慵懒地伸了个懒腰。\n\n“嗯~这个新玩法感觉不错呢~”\n\n她随意地拂去膝盖上残留的碎屑,那些曾经是一整颗星球的东西,如今不过是她膝头的一点尘埃。\n\n“虽然一下就碎了,不过感觉还挺特别的~”\n\n她慵懒地转过身,望向了更远处的星海。\n\n“嘛,不过这个玩法倒还是很特别嘛……”\n\n她漫不经心地说着,身影缓缓消失在星海之中。只留下那片曾经是一颗星球的残骸,静静地漂浮在虚空里。"
 gts_rainna_la_grande_random.31.title:0 "黑丝"
 gts_rainna_la_grande_random.31.desc:0 "“哼哼~你们好呀，我又回来咯~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。她慵懒地漂浮在星球上方，长发在星光中飘散。\n\n只是这一次，她似乎有些不一样。\n\n她那修长的双腿上，包裹着一层乌黑的丝袜，在星光的映照下泛着柔和而神秘的光泽。她似乎对自己今天的装扮相当满意，在太空中轻轻转动着身体，像是在展示什么。\n\n“最近过得怎么样呀~有没有乖乖的呢~”\n\n她将巨大的面庞凑近星球，那双清澈的眼眸里闪烁着几分期待的光芒。\n\n“嘛，你们有没有注意到……”她俏皮地晃了晃修长的腿，“我今天有一点点不一样哦~”"
 gts_rainna_la_grande_random.32.desc:0 "蕾恩娜优雅地抬起一条腿，将那只包裹在黑色丝袜中的足悬在星球的上方，饶有兴致地展示着。\n\n黑色的丝袜紧紧贴合着她修长的腿部曲线，一直延伸到足尖。丝袜的质地细腻而光滑，在星光下泛着幽幽的光泽，透过那层薄薄的黑纱，能隐约看到肌肤的轮廓。那只包裹在黑丝中的巨足投下遮天蔽日的阴影，笼罩了小半个星球。\n\n“呐呐~你们看~”\n\n她的声音里带着几分难得的雀跃，像是一个换了新衣服想要炫耀的少女。\n\n“我新换的黑丝，好看吗？”\n\n她将那只足在星球上方轻轻转动着，让不同的角度展现在这颗渺小的星球面前，足尖调皮地晃动着。\n\n“嗯？快说说看嘛~”\n\n她期待地俯视着这颗星球，那双巨大的眼眸里闪烁着好奇的光芒。这一刻，她看起来不像是一个可怕的毁灭者，倒真的像是一个在等待夸奖的女孩。\n\n只是所有人都清楚，无论回答是什么，那只悬在头顶的巨足，随时都可能落下。"
 gts_rainna_la_grande_random.32.a:0 "好看！"
 gts_rainna_la_grande_random.32.b:0 "不好看！"
 gts_rainna_la_grande_random.33.desc:0 "“嘿嘿~你们的眼光还不错嘛~”\n\n听到这颗星球的赞美，蕾恩娜显然心情大好，那双眼眸弯成了月牙状。\n\n“既然你们这么喜欢我的黑丝……”\n\n她的声音突然变得轻柔而危险。\n\n“那就让你们近距离好好欣赏一下吧~”\n\n她优雅地将那只包裹在黑丝中的巨足缓缓压向星球表面。黑色的丝袜穿过大气层，那细腻的纹理越来越清晰，遮天蔽日的阴影笼罩了整片大陆。\n\n足底落下的瞬间，被黑丝包裹的柔软足底轻轻贴上了地表。那些密集的城市、高耸的建筑，在丝袜与地表接触的刹那间被尽数压平，化作紧贴在黑色丝袜纹理间的一层痕迹。地壳发出沉闷的轰鸣，无数裂缝从足印边缘蔓延开来。\n\n“怎么样~我的黑丝配上你们的城市，是不是别有一番风味呀~”\n\n她愉快地蹭了蹭足底，感受着那些细碎的建筑残骸嵌入丝袜纤维的触感，满意地眯起了眼睛。\n\n“嗯~这个画面，我很喜欢呢~”"
 gts_rainna_la_grande_random.33.a:0 "不要！"
 gts_rainna_la_grande_random.34.desc:0 "“欸——”\n\n蕾恩娜的声音陡然拔高，那双眼眸里满是被冒犯的错愕。\n\n“你们居然说不好看？”\n\n她气鼓鼓地鼓起了脸颊，语气里满是委屈与不满。\n\n“我特意换上的黑丝，你们竟然不懂得欣赏……真是的！”\n\n她的声音突然一转，从委屈变成了危险的甜腻。\n\n“那看来，得让你们好好‘反省’一下审美了呢~”\n\n她将那只包裹在黑丝中的巨足高高抬起，随即毫不留情地压了下来。这一次没有丝毫的温柔，被黑丝包裹的足底重重地砸在星球表面，狂暴的气流在接触地表之前就已经将整片大陆的一切席卷殆尽。\n\n足底落下，整片大陆在瞬间被彻底抹平。摩天大楼、城市、山脉，连同其中的一切，都在这愤怒的一踩之下化为齑粉，被深深压入地壳。地表迸裂开来，岩浆汹涌而出，将那片区域染成一片焦红。\n\n“哼，这就是不懂得欣赏的下场哦~”\n\n她微微撅着嘴，将足底抬起，看着那片被踩得面目全非的大陆，语气里还带着几分没消散的不满。\n\n“下次可要长好眼睛才行呢~”"
 gts_rainna_la_grande_random.35.desc:0 "“嘿嘿~你们的眼光还真不错嘛~”\n\n听到这颗星球的赞美，蕾恩娜显然心情大好，那双眼眸弯成了月牙状。她愉快地收回了悬在星球上方的巨足，在太空中轻轻晃动着修长的双腿，欣赏着自己那身黑丝。\n\n“果然还是有识货的人呢~”\n\n她满意地转了个身，让黑色的丝袜在星光下折射出柔和的光泽。\n\n“看在你们这么懂得欣赏的份上……”她俏皮地眨了眨眼，“今天就不踩你们咯~”\n\n她将双腿慵懒地收起，那遮天蔽日的阴影随之消退，阳光重新洒回了星球的表面。\n\n“能被夸奖的感觉，还挺不错的呢~”\n\n她心情愉悦地哼着某种不成调的曲子，看起来对这次的赞美相当受用。这一刻，那份危险仿佛被暂时收了起来，取而代之的是一种近乎单纯的满足。"
 gts_rainna_la_grande_random.36.desc:0 "蕾恩娜心满意足地打量着足底那身沾了些许尘埃的黑丝，慵懒地在太空中舒展开身体。\n\n“嗯~今天玩得挺开心的~”\n\n她轻轻抖了抖那只包裹在黑丝中的足，将附着的碎屑抖落，那些曾经是城市的残骸如同尘埃般飘向地表。\n\n“我的黑丝配上你们的星球，画面还挺不错的嘛~”\n\n她慵懒地转过身，长发在星光中缓缓飘散。\n\n“好啦，我先走咯~”她俏皮地眨了眨眼，“记得好好养养伤哦~”\n\n“下次我来的时候，说不定又会换上新的丝袜呢~到时候你们可要好好欣赏哦~”\n\n她的身影缓缓消失在星海之中，只留下那颗新添了伤痕的星球，在寂静中默默旋转。"
 gts_rainna_la_grande_random.37.desc:0 "蕾恩娜愉快地欣赏着自己那身完好如新的黑丝，慵懒地在太空中舒展开身体。\n\n“嗯~今天心情不错呢~”\n\n她低头看了看那颗完好无损的星球，眼神里带着几分难得的温和。\n\n“多亏你们这么懂得欣赏，我今天可是高兴得很呢~”\n\n她慵懒地转过身，那身黑丝在星光下泛着柔和的光泽。\n\n“嘛，那我就先走咯~”她漫不经心地说着，“你们运气不错，碰上我心情好的时候~”\n\n“不过嘛……”她俏皮地眨了眨眼，语气里带着几分轻快的威胁，“下次可别指望每次都能这么好运哦~我的心情，可是说变就变的呢~”\n\n她的身影渐渐远去。\n\n“我还会回来的~到时候再让你们欣赏我的新装扮~”\n\n她的声音在星海中缓缓消散。地面上的人们仰望着那片重新恢复平静的天空，既松了一口气，又隐隐感到不安——因为他们知道，她一定还会回来。"
 gts_rainna_la_grande_random.41.title:0 "脚踩袜"
 gts_rainna_la_grande_random.41.desc:0 "“嘿嘿~我又回来咯~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。这颗星球对她来说不过是一颗乒乓球般大小的小球，渺小得几乎可以忽略。\n\n“最近过得怎么样呀~有没有想我呢~”\n\n她慵懒地漂浮着，随即将一只脚缓缓凑近了那颗渺小的星球。那只脚上，包裹着一层乌黑的丝袜，只是这丝袜的样式有些特别——足底的位置是镂空的，只有一条细带绕过足弓，将丝袜固定在脚上。\n\n她将那只脚凑到星球旁边，饶有兴致地打量着这个被她的脚衬托得愈发渺小的世界。\n\n“嘿嘿……我今天换了新袜子哦。”\n\n她俏皮地晃了晃足尖，那双清澈的眼眸里闪烁着期待的光芒。\n\n“你们可要好好欣赏呢~”"
 gts_rainna_la_grande_random.42.desc:0 "“呐呐~你们看~”\n\n蕾恩娜将那只脚抬到星球面前，饶有兴致地展示着。\n\n“这是我最喜欢的脚踩袜哦~”\n\n乌黑的丝袜包裹着她修长的脚，足底镂空的设计将那饱满细腻的足底完整地暴露出来，只有一条黑色的细带优雅地绕过足弓中央。她显然对这身装扮相当得意，在星球面前灵活地活动起了那只脚。\n\n她先是舒展开五根足趾，那些修长的趾头一根根地伸展、张开，随即又缓缓蜷起，露出足底细密的纹路。她轻轻转动着足踝，让镂空的足底从不同的角度展现在这颗渺小的星球面前，那条绕过足弓的细带随着她的动作微微绷紧又放松。\n\n“你们看，这种露出足底的设计，既可以让我的足很玉，还方便我活动足趾。"\n\n她愉快地蜷动着足趾，感受着那份自由，足底饱满的肌肉随着动作微微起伏。\n\n“怎么样怎么样~我的脚踩袜，好看吗？”\n\n她期待地俯视着这颗星球，足尖调皮地晃动着，等待着这颗渺小星球的回答。"
 gts_rainna_la_grande_random.43.desc:0 "“嘿嘿……”\n\n蕾恩娜咯咯地笑了起来，那笑声里带着几分促狭的意味。\n\n“嘛……”\n\n她将脸凑近了星球，那双巨大的眼眸里闪烁着狡黠的光芒。\n\n“你们说好看也好，说不好看也好，其实都没什么关系哦~”\n\n她俏皮地眨了眨眼，伸出一根修长的手指。\n\n“因为不管你们怎么回答，接下来要发生的事情，都是一样的呀~”\n\n她坏笑了一下，就像是计谋得逞了。\n\n她的手指轻轻探向那只脚，勾住了脚踩袜上那条绕过足弓的细带，然后轻轻一勾、一松，细带发出一声轻微的弹响。\n\n“我只是想问问而已嘛~”\n\n她慵懒地笑着，那份天真的语气里透着令人脊背发凉的残酷。\n\n“至于结果嘛……早就已经定好咯~”\n\n她收回手指，重新将目光落在了那颗渺小的星球上，足底镂空的部分正对着它，仿佛一张即将合拢的口袋。"
 gts_rainna_la_grande_random.44.desc:0 "蕾恩娜将那只脚缓缓移向星球，足底镂空的部分正对着这颗渺小的世界。\n\n“嘛~进来吧~”\n\n她轻巧地调整着角度，让星球从镂空的足底陷入，恰好被那条绕过足弓的细带兜住。星球就这样卡在了脚踩袜的底部，一半嵌在细带与足弓之间，一半暴露在外。\n\n然而，仅仅是这轻轻的固定——\n\n咔。\n\n星球的表面就已经绽开了一道细小的裂缝。\n\n那条兜住星球的细带虽然并未刻意收紧，但对这颗乒乓球般大小的星球来说，光是被卡住、被抵住的压力，就已经超过了它所能承受的极限。裂缝从接触点向四周蔓延，星球的边缘微微碎裂，细小的碎片剥落下来，如同尘埃般在她的足底周围飘散。\n\n“哎呀~”\n\n蕾恩娜低头看着那颗刚被兜住就开始碎裂的星球，歪了歪头，眼中带着几分玩味的笑意。\n\n“这么快就裂开了呀？你们也太脆弱了吧~”\n\n她轻轻晃了晃脚，星球在脚踩袜的细带上微微颠簸，又有几片碎屑剥落下来。\n\n“不过……好戏才刚刚开始呢~”"
 gts_rainna_la_grande_random.45.desc:0 "“好啦，那么……面对命运吧~”\n\n蕾恩娜愉快地活动起了那只兜着星球的脚。\n\n她缓缓绷紧足弓，那条绕过足弓的黑色细带随之收紧，一点一点地勒向卡在其中的星球。星球在细带的收束下发出令人牙酸的呻吟，表面的裂缝迅速扩张，岩浆从深处渗出，在细带的挤压下汽化成缕缕青烟。\n\n“嗯……感受到了~”\n\n她愉快地感受着足弓传来的那份阻力，随即开始缓缓蜷起足趾。\n\n那五根修长的足趾一根接着一根地向内蜷曲，连同镂空足底的肌肤一起，将星球从另一个方向紧紧攥住。星球被夹在收紧的细带与蜷起的足趾之间，承受着来自四面八方的、不断增大的压力。\n\n裂缝越来越多，越来越深，从星球表面一直蔓延到内核。\n\n“嘿嘿……快了快了~”\n\n蕾恩娜的足趾又蜷紧了几分。\n\n咔嚓。\n\n一声清脆的脆响。\n\n那颗乒乓球般的星球终于承受不住，在她的足弓与足趾之间彻底碎裂开来，化作无数细小的残骸。岩浆与尘埃从每一道裂缝中迸溅而出，透过镂空的足底，从蜷起的足趾缝隙间簌簌落下。\n\n“啊~碎掉了呢~”\n\n蕾恩娜舒展开足趾，看着那些从脚踩袜镂空处飘散而出的细碎残骸，满意地眯起了眼睛。\n\n“这个脚踩袜，果然很浩文呢，手感也特别好~”\n\n她轻轻抖了抖脚，让卡在细带上的最后一点碎屑剥落下来。\n\n“嘛，开心~”"
 gts_rainna_la_grande_random.46.desc:0 "蕾恩娜将那只脚在太空中舒展开来，端详着脚踩袜上残留的细碎尘埃，慵懒地伸了个懒腰。\n\n“嗯~8分吧。”\n\n她随意地拂去足弓细带上残留的碎屑，那些曾经是一整颗星球的东西，如今不过是她脚踩袜上的一点微尘。\n\n“能想到这个玩法……我也是一个天才~”\n\n她自言自语着，将视线从那片飘散的残骸上移开，望向了更远处的星海。\n\n她在太空中慵懒地转过身，长发在星光中缓缓飘散。\n\n“嘛，再见~”\n\n她的身影缓缓消失在星海之中。那片曾经是一颗星球的残骸，静静地漂浮在原地，在虚空中缓缓扩散，再也无法拼回成原本的模样。\n\n只有那些细小的碎片，还在星光下泛着微弱的、逐渐冷却的红光。"
 gts_rainna_la_grande_random.101.title:0 "神秘药剂"
 gts_rainna_la_grande_random.101.desc:0 "“啊啦啦~你们好呀,我又回来咯~”\n\n太空中,蕾恩娜巨大的身影缓缓显现。她慵懒地漂浮在星球上方,那双清澈的眼眸里闪烁着好奇的光芒。\n\n“最近有没有乖乖的呀~”\n\n她将巨大的面庞凑近星球,饶有兴致地打量着这个渺小的世界。\n\n“嘛,你们猜猜我今天想出了什么新的玩法呢？”\n\n她俏皮地晃了晃手指,嘴角勾起一抹意味深长的笑容。\n\n“你们一定会‘喜欢’的~”"
 gts_rainna_la_grande_random.102.desc:0 "蕾恩娜伸出一只手,悬在星球的上方。\n\n“嘛，看好咯~”\n\n她的指尖泛起一层柔和的光晕,一颗晶莹的水珠在指尖凝聚成形。她轻轻一挥手,那颗水珠便化作漫天的细雨,穿过大气层,缓缓洒落在星球的表面。\n\n“这可是我新研发的好东西哦~”\n\n雨水温柔地飘落,起初,地面上的人们并没有察觉到任何异常。这场雨看起来与普通的降雨没有什么不同,清澈,凉爽,甚至带着几分甘甜。\n\n“嘻嘻……”\n\n蕾恩娜捂着嘴,眼中闪烁着期待的光芒,静静地看着这场雨落满整颗星球。\n\n“接下来就是见证奇迹的时刻咯~”"
 gts_rainna_la_grande_random.102.a:0 "欸，居然是雨。"
 gts_rainna_la_grande_random.103.desc:0 "变化是在雨停之后开始的。\n\n最初,人们只是觉得周围的一切似乎变得“高大”了一些。街道变宽了,建筑变高了,门把手的位置也变得有些够不着了。\n\n然后,他们意识到,不是世界变大了。\n\n是他们变小了。\n\n淋过那场雨的每一个人,都在悄然缩小,一直缩小到原本身高的极小一部分。曾经熟悉的家园此刻变成了一片庞大而危险的迷宫——一颗石子如同巨岩,一洼水坑如同湖泊。恐慌迅速蔓延开来,微小的人们在这个突然变得无比巨大的世界里四处奔逃,却无处可去。\n\n而在这片混乱之上,蕾恩娜的笑声从天空中传来。\n\n“哈哈哈~你们现在的样子,可真是太有趣了呢~”\n\n她俯视着星球,看着那些变得如同尘埃般渺小的生命,愉快地眨了眨眼。\n\n“怎么样，我特制的超级缩小激素效果如何？”\n\n她咯咯地笑着,那笑声在整个星球回荡。\n\n“嘛,这样一来,你们看我的时候,是不是显得我更加‘高大’了呢~”"
 gts_rainna_la_grande_random.104.desc:0 "蕾恩娜心满意足地看着这颗星球上的变化,慵懒地在太空中舒展开身体。\n\n“嗯……就这样吧。”\n\n她愉快地收回了手,眼中带着几分餍足的笑意。\n\n“听说小人都很能繁殖。让我看看……等我下次回来，整个星球是不是得有满满的一星球小人呢？”\n\n她俏皮地眨了眨眼,语气里带着几分捉摸不定的玩味。\n\n“嘛,那我就先走咯~”\n\n她慵懒地转过身,长发在星光中缓缓飘散。\n\n“保重哦~”\n\n她的身影缓缓消失在星海之中,只留下那颗星球上无数变得渺小的生命,在这个突然变得无比巨大的世界里,茫然而无助地面对着未知的命运。"
 gts_rainna_la_grande_random.104.a_tooltip:0 "（提示：不需要想办法恢复生产，Debuff有后续事件消除）"
 gts_rainna_la_grande_random.105.desc:0 "许多年过去了。现在，[Planet.GetName]的聚居地早已不再是当初那些临时搭建的避难所。如今的城市建立在旧世界的缝隙之中，纵横交错，层层叠叠。墙壁的夹层被改造成了居民区，通风管道成了城市之间的主干道，那些曾经无人问津的角落如今灯火通明。\n\n工业重新运转了起来、农业也重新恢复了。通讯网络覆盖了整颗星球。运输体系连通了各个大陆。医疗、教育、司法，所有的社会职能都在新的尺度上重新建立了起来。"
 gts_rainna_la_grande_random.105.a:0 "社会的秩序恢复了。"
 gts_rainna_la_grande_random.111.desc:0 "“哼哼~我又回来咯~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。她慵懒地漂浮在星球上方，长发在星光中飘散，那双清澈的眼眸里闪烁着某种难以捉摸的光芒。\n\n“最近过得怎么样呀~有没有想我呢~”\n\n她将巨大的面庞凑近星球，饶有兴致地打量着这个渺小的世界，目光在那些密集的城市光点之间缓缓游移。\n\n“嘛，今天我又带了个有趣的东西来哦~”\n\n她俏皮地晃了晃手指，嘴角勾起一抹意味深长的笑容。\n\n“放心啦，这次不会弄坏你们的~”"
 gts_rainna_la_grande_random.112.desc:0 "蕾恩娜伸出一只手，悬在星球的上方。\n\n“来~看好咯~”\n\n她的指尖泛起一层柔和的光晕，一颗晶莹剔透的水珠在指尖缓缓凝聚成形，在星光下折射出淡淡的粉色光彩。她轻轻一挥手，那颗水珠便化作漫天细雨，穿过大气层，静静地洒落在星球的表面。\n\n雨水温柔地飘落。\n\n地面上的人们警惕地仰望着天空，防灾系统全面启动，避难所的大门敞开，所有人都在等待着某种可怕的事情发生。\n\n然而什么都没有发生。\n\n雨水清澈甘甜，落在皮肤上带着微微的暖意。检测仪器反复扫描，没有检测到任何有害成分，没有辐射，没有毒素，没有任何已知的危险物质。人们茫然地站在雨中，面面相觑。\n\n半个小时后，雨停了。\n\n天空重新放晴，一切如常。城市完好无损，没有人受伤，没有建筑倒塌，甚至连一片树叶都没有被吹落。\n\n“嘻嘻……”\n\n天空中传来蕾恩娜捂着嘴的轻笑声。\n\n“怎么样，很有趣吧？”"
 gts_rainna_la_grande_random.113.desc:0 "蕾恩娜心满意足地收回了手，在太空中慵懒地舒展开身体。\n\n“嘛~就这样吧。”\n\n她低头看了看那颗完好无损的星球，眼中带着几分难以形容的期待与笑意。\n\n她慵懒地转过身，长发在星光中缓缓飘散。\n\n“那我就先走咯~”\n\n“下次我来的时候，再看看你们变成什么样子好了~”\n\n她的身影缓缓消失在星海之中，只留下那句意味深长的话语在通讯频道中久久回荡。\n\n星球上，人们仰望着重新恢复平静的天空，谁也没有意识到，某些东西已经悄然改变了。"
 gts_rainna_la_grande_random.114.desc:0 "变化是从第二天开始的。\n\n起初，没有人把它和那场雨联系在一起。\n\n人们只是发现，自己似乎比平时更容易……分心。工作时走神，交谈时脸红，那些平日里压根不会多想的念头，此刻变得格外频繁而清晰。医院起初接到零星的咨询，人们含糊其辞地描述着某种说不清道不明的燥热与冲动，医生们最初以为只是个别现象。\n\n然后咨询量开始成倍地增长。\n\n到了第三天，情况已经无法用“个别现象”来形容了。\n\n社会的运转开始出现某种微妙的紊乱。工作效率大幅下滑，许多岗位陷入停摆，人们越来越难以将注意力集中在本职工作上。街道上、办公室里、公共场所中，人与人之间的距离变得前所未有地亲密，那些原本被社会规范小心维系的界限，此刻变得模糊而脆弱。\n\n政府紧急召开了会议，试图查明原因。\n\n检测报告最终指向了那场雨。经过反复分析，研究人员在雨水的残留成分中发现了某种极为特殊的物质——它无色无味，无毒无害，却能够作用于生物体的神经与内分泌系统，显著地……放大某些本能的冲动。\n\n而更麻烦的是，这种物质已经渗入了土壤、水源与食物链。它不会致命，也不会造成任何生理损伤，但它带来的影响正在整个社会层面上迅速发酵。\n\n社会学家们忧心忡忡地提交了一份评估报告。\n\n报告指出，按照目前的趋势，这种影响虽然不会直接威胁生命，但将对社会的正常秩序造成长期而深远的冲击。婚恋关系、家庭结构、公共道德、劳动秩序——几乎每一个社会层面都将受到波及。\n\n而在报告的最后，人口统计部门附上了一份预测：\n\n按照当前的态势，这颗星球的生育率将在未来一年内出现爆炸式的增长，预计新生人口数量将达到往年的数倍之多。医疗系统、教育系统、社会福利系统都必须立刻着手准备，以应对这场即将到来的“婴儿潮”。\n\n政府陷入了两难。\n\n这种物质无法被快速清除，强制手段又收效甚微。最终，官方只能发布了一系列引导性的政策，试图将这场突如其来的社会变动纳入某种可控的轨道，同时紧急扩建医疗与育婴相关的公共设施。"
 gts_rainna_la_grande_random.114.a:0 "这颗星球的人口马上就要爆了。"
 gts_rainna_la_grande_random.201.title:0 "蕾恩娜的礼物"
 gts_rainna_la_grande_random.201_1.desc:0 "[Planet.GetName]的上空出现了一个巨大的不明飞行物，正以极高的速度接近星球，预计将被星球引力逐渐减速。\n\n防御系统尚未来得及做出反应，通讯频道里就传来了一个熟悉的声音。\n\n“嘿，我的朋友~”\n\n是蕾恩娜。她的语气轻快而亲昵，听起来心情不错。\n\n“最近怎么样呀？我路过附近，就顺道来看看你们咯~”\n\n“对了，我给你们带了点小礼物哦~就在那个飞过去的大箱子里，记得查收呀~”\n\n她咯咯地笑了几声。"
 gts_rainna_la_grande_random.201_2.desc:0 "[Planet.GetName]轨道监测站捕捉到一个高速接近的巨型物体，正朝着星球飞来。\n\n正当值班人员紧张地准备预案时，通讯器响了。\n\n“嘿，朋友！又见面咯~”\n\n蕾恩娜的声音里满是愉悦。\n\n“我最近攒了不少好东西，想着放着也是放着，就分你们一些吧~已经给你们送过去了，就在那个大箱子里哦~”\n\n“拿去用吧，别跟我客气~”\n\n她顿了顿，语气轻快。\n\n“谁让我们是朋友呢~下次我要是缺什么了，你们也得帮帮我呀~”"
 gts_rainna_la_grande_random.201_3.desc:0 "[Planet.GetName]的天空中，一个庞大的物体正飞速接近，逐渐被星球的引力捕获、减速。\n\n通讯频道里，传来了那个熟悉的声音。\n\n“嘿，我的朋友~”\n\n蕾恩娜的语气一如既往地亲昵。\n\n“我给你们带了点好东西哦~就在那个箱子里，记得收好呀~”\n\n“毕竟是我从别的地方弄来的，我又用不上，随手塞给你们罢了。”\n\n她咯咯地笑着，仿佛在说一件再平常不过的小事。\n\n“嘛，就这样。”"
 gts_rainna_la_grande_random.201.a:0 "谢谢你，朋友！"
 gts_rainna_la_grande_random.202_1.desc:0 "通讯频道里，传来了那个熟悉的声音。\n\n“嘿，我的朋友~”\n\n蕾恩娜的语气轻快而亲昵。\n\n“嘛，忙什么呢？”\n\n“你们研究的那些玩意儿，我碰巧知道一点点哦~”她的声音里带着几分得意。\n\n“要不要我帮帮你们呀？也不是什么大事啦，就是给你们指点指点方向~”\n\n不等这颗星球回应，她就已经将某些信息传输了过来。\n\n“喏，这些应该能帮上忙~”"
 gts_rainna_la_grande_random.202_2.desc:0 "通讯频道里，传来了蕾恩娜的声音。\n\n“嘿，朋友~”\n\n她的语气一如既往地顽皮。\n\n“我刚才顺便瞧了瞧你们在研究的东西……”\n\n她停顿了一下，随即咯咯地笑了起来。\n\n“哎呀，你们居然还在钻研这种东西呀~这个我可是很久很久以前就玩明白了呢~”\n\n她的语气里带着几分毫不掩饰的优越感，就像是一个大人看着小孩子费力地拼一块简单的拼图。\n\n“看你们研究得这么辛苦，怪可怜的~嘛，我就大发慈悲，帮你们一把吧~”\n\n某些信息随之传输了过来。\n\n“喏，拿去吧~这点小东西对我来说根本不算什么啦~”\n\n“你们呀，还得多努力努力，才能追上我的脚步呢~嘻嘻~”"
 gts_rainna_la_grande_random.301.title:0 "神的降临"
 gts_rainna_la_grande_random.301_1.desc:0 "太空中，蕾恩娜的身影缓缓降临。\n\n这颗星球在她面前不过是一颗苹果般大小的小球，渺小而脆弱。她没有像往常那样嬉笑打闹，而是以一种居高临下的姿态俯视着这个信仰着她的世界，那双湖泊般的眼眸里带着几分神明般的平静。\n\n“我的信徒们，我回来了。”\n\n她的声音庄重而悠远，透过大气层回荡在整个星球的每一个角落。\n\n星球上，无数信众跪倒在地，齐声诵念着祷词，迎接他们神明的降临。那诵念声汇聚成一片虔诚的浪潮，向着天空中那个巨大的身影涌去。\n\n“你们的虔诚，我感受到了。”\n\n她微微颔首，语气里带着几分不易察觉的满意。\n\n“那么，就让我来看看，你们是否值得我的眷顾吧。”"
 gts_rainna_la_grande_random.301_2.desc:0 "太空中，那个庄严的身影再次降临。\n\n蕾恩娜静静地悬浮在这颗苹果般大小的星球上方，长发在无重力中如星河般铺展开来。她没有立刻开口，只是以一种超然的姿态俯视着这个渺小的世界，仿佛在审视着自己的领地。\n\n“我的追随者们。”\n\n她终于开口，声音低沉而威严。\n\n“我听到了你们的祈祷，跨越了整片星海。”\n\n星球上，钟声齐鸣，无数信众涌上街头，跪伏在地，向着天空中那个巨大的身影献上最虔诚的敬意。神殿的穹顶下，祭司们高声诵念着古老的经文，将这一刻视作整个文明最神圣的时刻。\n\n“你们的信仰没有白费哦。”\n\n她微微垂下眼眸，凝视着那些渺小的身影。\n\n“今日，我将亲自降下我的旨意。”"
 gts_rainna_la_grande_random.301.a:0 "伟大的蕾恩娜万福。"
 gts_rainna_la_grande_random.302_1.desc:0 "蕾恩娜缓缓伸出一根修长的手指。\n\n那根手指在星光下泛着柔和的光泽，缓缓向星球靠近。巨大的指影笼罩下来，将小半个星球都笼罩在阴影之中。地面上，信众们仰望着那根逐渐逼近的手指，诵念祷词的声音愈发响亮，愈发虔诚——他们相信，这是神明降下恩泽的时刻。\n\n“来吧，接受我的触碰。”\n\n她的声音庄重而温柔。\n\n“这是我给予你们的……恩典。”\n\n她的指尖轻轻探向星球的表面，那个动作优雅而从容，仿佛真的是某种神圣的仪式。\n\n指尖落下。"
 gts_rainna_la_grande_random.302_2.desc:0 "蕾恩娜抬起一只手，那根修长的食指缓缓伸向星球。\n\n指尖泛着微光，如同一座从天而降的圣柱，庄严而不可抗拒。它缓缓下降，遮天蔽日的阴影一寸寸地覆盖了星球的表面，将大片区域笼罩在神圣而危险的黑暗之中。\n\n“哼……”\n\n她的声音回荡在天地之间。\n\n“小家伙们，抬起头来。”\n\n地面上，信众们非但没有退缩，反而争先恐后地涌向那片阴影笼罩的区域，仿佛能被神明的手指触碰，是一种至高无上的荣耀。他们高举双手，泪流满面，口中呼喊着蕾恩娜的名字。\n\n指尖，缓缓落下。"
 gts_rainna_la_grande_random.303_1.desc:0 "蕾恩娜的指尖轻轻触碰到了星球的表面。\n\n仅仅是这轻柔的一触，星球的地表便瞬间凹陷下去。那根手指陷入地壳，在星球的表面戳出了一个巨大而深邃的坑洞。周围的大陆随着这一戳剧烈震颤，无数的裂缝从坑洞边缘向四周蔓延，岩浆从深处喷涌而出。\n\n被戳中的区域——连同其中无数虔诚的信众——在这一瞬间尽数消失，化作了坑洞底部的一片焦土。\n\n“嗯……”\n\n蕾恩娜收回手指，端详着那个深深的坑洞，语气平静。\n\n“这就是我留给你们的印记。”\n\n她的声音庄重而不容置疑，仿佛刚才那场夺走无数生命的戳击，只是一次神圣的赐福。\n\n“好好珍惜吧。这是你们侍奉我的证明。”\n\n星球上，幸存的信众们非但没有恐惧，反而更加狂热地跪拜起来，将这个夺走了他们同胞的坑洞，视作了神明降临的神迹。"
 gts_rainna_la_grande_random.302.a:0 "吾等充满恩宠。"
 gts_rainna_la_grande_random.303_2.desc:0 "指尖触及地表的刹那，整个世界为之震动。\n\n蕾恩娜的手指深深陷入星球的地壳，在那片信众最为密集的区域，戳出了一个深不见底的巨坑。地表如同薄纸般被撕裂，无数条裂缝以坑洞为中心向四周疯狂蔓延，滚烫的岩浆自地心奔涌而出。\n\n那些曾经簇拥着、呼喊着、渴望被神明触碰的信众，在指尖落下的瞬间，连同他们的祷词一起，永远地消失在了那个坑洞之中。\n\n“很好。”\n\n蕾恩娜缓缓抽回手指，居高临下地注视着那道深邃的伤痕，语气里没有一丝波澜。\n\n“你们用自己的存在，见证了我的伟大。”\n\n她的话语庄严而冷漠。\n\n“这可是你们的荣耀。”\n\n而幸存下来的信众们，在短暂的震撼之后，竟然爆发出了更加狂热的欢呼。他们将那个吞噬了无数生命的坑洞奉为圣地，将这场屠杀称颂为神明降临的奇迹，在废墟之上，唱起了献给蕾恩娜的赞歌。"
 gts_rainna_la_grande_random.303.a:0 "神罚……"
 gts_rainna_la_grande_random.304_1.desc:0 "蕾恩娜的指尖轻轻探向星球。\n\n“来吧，接受我的恩典~”\n\n然而这一次，她似乎没能把握好力道。指尖刚一触及地表，那颗苹果般大小的星球便承受不住这难以想象的压力，从接触点开始，一道道裂缝迅速蔓延至整个球体。\n\n咔嚓。\n\n一声脆响，星球在她的指尖下彻底碎裂开来，化作数块残骸，岩浆与尘埃从每一道裂缝中喷涌而出。\n\n“……哎呀。”\n\n蕾恩娜微微一愣，看着指尖那团骤然崩解的残骸，歪了歪头。\n\n那份庄严的神明姿态出现了一丝裂痕。\n\n“嗯……嘛，就当这是……最后的审判好了~”\n\n她很快重新摆出了那副超然的神情，语气里却藏不住一丝心虚。\n\n“追随者们，你们对我的侍奉……算是合格吧。”\n\n只是这一次，已经没有任何信众能够听到她的话了。"
 gts_rainna_la_grande_random.304_2.desc:0 "蕾恩娜缓缓将指尖压向星球。\n\n“注视着我，追随者们~这是你们的荣耀。”\n\n她的语气庄重而威严，指尖带着神明般的从容缓缓落下。然而这颗星球实在太过渺小、太过脆弱，指尖的力道还未真正施展，仅仅是那轻轻的一抵——\n\n星球就裂开了。\n\n裂缝以惊人的速度爬满了整个球体，紧接着，伴随着一声闷响，整颗星球在她的指尖下四分五裂，化作漫天飞散的碎片。\n\n“欸？”\n\n蕾恩娜眨了眨眼，脸上那副神圣的表情僵了一瞬。\n\n“这就……碎了？”\n\n她看着指尖那团意外崩解的残骸，一时间竟有些不知所措。方才还在虔诚呼喊着她名字的追随者们，此刻已经连同整颗星球一起，消散在了太空之中。\n\n短暂的沉默后，她轻咳了一声，努力重新找回那份神明的威仪。\n\n“……哼，看来你们的信仰，还不足以支撑起承受我恩典的资格呢~”\n\n她将这场意外解释成了追随者们自己的过失，语气里带着几分刻意的高傲。\n\n“下一次可要好好努力才行哦~”"
 gts_rainna_la_grande_random.304.a:0 "不……"
 gts_rainna_la_grande_random.305.desc:0 "蕾恩娜居高临下地俯视着那颗被戳出巨坑、满目疮痍的星球，缓缓收回了手指。\n\n“嗯，今日的旨意，就到这里吧~”\n\n她的语气重新恢复了那份神明般的庄重，只是尾音里那一丝轻快，还是悄悄泄露了她的本性。\n\n“追随者们，继续侍奉我吧。”\n\n“你们的虔诚，我都记着呢~"她微微一顿，"……记着的。”\n\n她慵懒地转过身，长发在星光中缓缓飘散。\n\n“下次，我会再来检验你们的信仰的。”\n\n星球上，幸存的信众们跪伏在那道巨大的伤痕旁，向着离去的神明献上最后的赞歌。而蕾恩娜的身影，已经消失在了茫茫星海之中。"
 gts_rainna_la_grande_random.305.a:0 "……"
 gts_rainna_la_grande_random.306.desc:0 "蕾恩娜看着指尖那片飘散的星球残骸，慵懒地舒展开身体。\n\n“嘛……戳得有点用力了呢~”\n\n她自言自语着，那份神明的庄严早已在星球碎裂的瞬间烟消云散，只剩下几分漫不经心的随意。\n\n“不过嘛，反正他们也是虔诚地……嗯，回归到我的怀抱里了嘛~”\n\n她试图用某种神圣的说辞来给这场意外收尾，却连自己都觉得有些牵强，索性摆了摆手。\n\n“算啦算啦~”\n\n她将视线从那片残骸上移开，望向了更远处的星海。\n\n“下次找颗结实点的星球，再好好当一次神明好了~”\n\n她漫不经心地说着，身影缓缓消失在星海之中。那片曾经信仰着她的星球，如今只剩下几块无声的残骸，永远地漂浮在了虚空里。"
 gts_rainna_la_grande_random.312.title:0 "祭典"
 gts_rainna_la_grande_random.312_1.desc:0 "又是一年一度的祭典之日。\n\n自从蕾恩娜降临以来，对她的崇拜早已深深融入了这个文明的血脉。曾经的恐惧，在漫长的岁月中逐渐演变成了虔诚的信仰；曾经那些夺走无数生命的灾难，如今被追奉为神明降下的神迹。而每一年的这一天，整个星球都会停下一切事务，举行盛大的祭典，向他们伟大的女神献上最崇高的敬意。\n\n神殿的钟声响彻云霄，信众们从四面八方涌向各地的圣坛。神职人员们身着华丽的祭袍，主持着庄严的仪式。\n\n而按照世代相传的传统，在祭典的核心环节，最高祭司将会通过某种古老的仪轨，“聆听”女神的旨意，宣告出蕾恩娜今年所要求的祭品。\n\n“女神的旨意已经降下。”\n\n最高祭司缓缓睁开双眼，声音在寂静的神殿中回荡。\n\n所有人都屏息等待着。\n\n女神要求的祭品，必须如数奉上——这是维系这份"恩宠"的代价，也是整个文明世代恪守的铁律。\n\n那么，今年，又该献上什么呢？"
 gts_rainna_la_grande_random.312_2.desc:0 "祭典之日又一次到来了。\n\n天还未亮，各地的神殿就已经灯火通明。信众们身着节日的盛装，扶老携幼地走出家门，汇成一条条虔诚的长河，涌向那些矗立在城市中心的巨大圣坛。空气中弥漫着焚香的气息，颂唱女神的圣歌声此起彼伏，从清晨一直持续到日暮。\n\n在这一天，没有人工作，没有人争执，整个文明都沉浸在对蕾恩娜的崇拜之中。孩子们从小就被教导，是伟大的女神眷顾着这颗星球，是她的恩宠让他们得以存续至今。\n\n而在祭典的最高潮，主教将登上圣坛的顶端，宣读女神今年的旨意。\n\n万众屏息。所有人都知道，接下来宣告的祭品，关乎着整个文明未来一年的命运。"
 gts_rainna_la_grande_random.312_3.desc:0 "这一天，是献给女神蕾恩娜的日子。\n\n街道上张灯结彩，神殿前人山人海。祭典的队伍绵延数里，人们抬着精心准备的供品，唱着代代相传的赞歌，向着圣坛缓缓前行。孩童们手持点燃的烛火，老人们低声诵念着祷词，每一张面孔上都写满了虔诚。\n\n没有人记得，这份“信仰”最初其实源于恐惧。在漫长的岁月里，那些被女神的脚步碾碎的城市、被她的手指戳穿的大陆，都已经被重新诠释成了神圣的试炼与恩典。如今的人们，是真心实意地爱戴着、敬畏着他们的女神。\n\n祭典的核心环节即将开始。\n\n最高祭司步入圣坛中央，闭目凝神，开始与女神"沟通"。片刻之后，他睁开双眼，神情肃穆。\n\n“女神，已经降下了她的旨意。”\n\n他环视着台下无数双期待的眼睛，缓缓开口。\n\n“今年，我们需要为女神准备……”"
 gts_rainna_la_grande_random.312_4.desc:0 "又到了祭拜女神的时节。\n\n这是整个文明一年之中最重要的节日。从数月之前，各地就开始为这一天做准备——神殿被重新粉刷，圣坛被擦拭得一尘不染，神职人员们斋戒沐浴，信众们倾其所有地筹备供品。对于这个文明来说，没有什么比取悦他们的女神更为重要的事情了。\n\n祭典当日，钟鼓齐鸣，万人空巷。人们跪伏在圣坛之下，将额头贴在冰冷的地面上，用最谦卑的姿态迎接这神圣的时刻。\n\n传说中，女神会在这一天透过最高祭司之口，传达她的意愿。而她所要求的祭品，无论是什么，信众们都会想尽一切办法如数奉上——因为他们坚信，唯有满足女神的心意，才能换来她持续的庇佑。"
