 gts_rainna_la_grande_first_meeting.21112.a:0 "不！不是这个意思……"
 gts_rainna_la_grande_first_meeting.21112.a_tooltip:0 "真是苍白的狡辩……"
 gts_rainna_la_grande_first_meeting.21113.title:0 "你们的城市？"
 gts_rainna_la_grande_first_meeting.21113.desc:0 "“唔……真是不好意思呢……”\n\n蕾恩娜优雅地伸出修长的手指，嘴唇轻轻咬着指尖，做出一副愧疚的样子。\n\n“我还以为这些小房子对你们来说不重要呢……”\n\n她的声音变得柔软而低沉，带着几分做作的歉意。她微微低下头，长发在太空中飘散，遮住了半边脸庞，让人看不清她的表情。\n\n“毕竟……”她顿了顿，声音突然变得轻快起来，“它们那么小，那么脆弱，轻轻一碰就碎了啊。”\n\n她抬起那只沾满废墟的足底，在星光下仔细端详。那些曾经辉煌的建筑碎片、扭曲的钢铁残骸，此刻都成了她足底的点缀。\n\n“不过……”她歪着头，嘴角勾起一抹顽皮的笑容，“你们的这些高楼大厦……触感还挺特别的！”\n\n她晃了晃足趾，让更多的碎片从足底剥落，如流星雨般坠向地表。\n\n“所以嘛，何必如此沮丧呢？毕竟至少它们在最后还为我带来了一点乐趣，不是么？”“啊，对了……”她突然像是想到了什么有趣的主意，眼睛一亮，“既然这只脚感受过了，那另一只脚是不是也应该体验一下呢？”\n\n说着，她缓缓抬起左足。那只尚且洁白无瑕的足底在太空中优雅地舒展。她将它悬停在一片崭新的、尚未被破坏的繁华都市圈上方。\n\n“让我想想，这边好像更热闹一些呢，踩起来一定很不错……”\n\n巨大的阴影笼罩了那片充满生机的城市。街道上的人们惊恐地抬头，看着那个遮天蔽日的足底缓缓降临。\n\n“嘻嘻，这样就对称啦~”她愉快地说着，轻柔地将足底压下。大地在瞬间崩塌，无数的建筑如同积木般倒塌、粉碎。当她满意地抬起足底时，原本繁华的都市已经化作了另一个巨坑。\n\n“嗯这个感觉也不错呢……”她抬起左足，满意地活动着足趾，“两只脚都体验一遍，这样才公平。”"
