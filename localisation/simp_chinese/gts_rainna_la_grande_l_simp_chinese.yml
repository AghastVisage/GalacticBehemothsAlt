 ##事件
 gts_rainna_la_grande.00.title:0 "蕾恩娜"
 gts_rainna_la_grande.00.desc:0 "“打扰了，我是蕾恩娜。我听说你在找我？\n\n也许你从未听说过我的名字——不过没关系，点击‘是’之后，你很快就会对我印象深刻的。”\n\n这是谁留下的奇怪信息？\n\n点击“是”则会在宇宙中生成蕾恩娜相关内容。"
 gts_rainna_la_grande.00.a:0 "是"
 gts_rainna_la_grande.00.a.tooltip:0 "警告：你永远无法预料蕾恩娜的险恶！尽管你不在抖M模式……"
 gts_rainna_la_grande.00.a.tooltip_alter:0 "鉴于你玩的政体不是个东西，建议§R不要§!选此选项。"
 gts_rainna_la_grande.00.a.tooltip_alter_2:0 "鉴于你是游牧政体，由于蕾恩娜相关内容并未兼容游牧政体，大部分内容将会被移除。"
 gts_rainna_la_grande.00.b:0 "否"
 gts_rainna_la_grande.00.c:0 "我只想体验剧情（打开剧情体验模式）"
 gts_rainna_la_grande.00.c.tooltip:0 "将移除大部分蕾恩娜造成的负面后果。"
 gts_rainna_la_grande.01.title:0 "沉睡的远古实体"
 gts_rainna_la_grande.01.desc:0 "科研团队在黑洞的另一侧探查到了一个神秘的实体。\n\n根据初步观测，她的体型远超任何已知的天体生命，却只是静静地漂浮在黑洞边缘，似乎只是陷入了某种深度的沉眠。好奇的科学家们摩拳擦掌，迫不及待地请求前去唤醒她。\n\n然而，你的内心深处有一种隐隐的不安。也许……先处理完手头的其他事情会更稳妥一些。"
 gts_rainna_la_grande.01.a:0 "知道了"
 gts_rainna_la_grande.01.a.tooltip:0 "谨慎一点总是好的。"
 gts_rainna_la_grande.02.title:0 "被唤醒的实体"
 gts_rainna_la_grande.02.desc:0 "不知是何时，黑洞另一侧的那个巨大身影悄然消失了。\n\n观测站的屏幕上只剩下一片平静的虚空，仿佛什么都不曾发生过。科学家们面面相觑，翻遍了所有的观测记录，却找不到任何她离去的痕迹。\n\n也许……这一切只是一场梦？"
 gts_rainna_la_grande.02.a:0 "怎么回事……"
 gts_rainna_la_grande.11.title:0 "警报"
 gts_rainna_la_grande.11_1.desc:0 "[Planet.GetName]的行星防御系统在深夜突然发出了警报。\n\n值班人员被刺耳的警报声惊醒，冲到监控屏幕前。雷达上，一个庞大的物体正从深空缓缓接近，它的体积超出了系统预设的所有分类参数，以至于计算机一度将其误判为一颗小行星。\n\n但小行星不会主动调整轨道。\n\n随着那个物体越来越近，观测数据变得越来越清晰，也越来越令人不安。防御指挥中心陷入了短暂的沉默，所有人都想起了那个流传已久的名字。"
 gts_rainna_la_grande.11_2.desc:0 "[Planet.GetName]轨道监测站记录到了异常。\n\n一个巨大的阴影正在遮蔽远处的星光，缓慢却坚定地朝这颗星球靠近。它没有发出任何标准的通讯信号，也没有回应任何询问，只是静静地、庞大地存在着，像是一片移动的黑暗。\n\n监测站的负责人调出了历史数据，很快，他的脸色变得凝重起来。\n\n这个接近模式，他们并不陌生。"
 gts_rainna_la_grande.11_3.desc:0 "警报响起的时候，[Planet.GetName]的大多数居民还在睡梦之中。\n\n防御系统检测到一个体积异常庞大的物体正在接近大气层，它的规模让所有的拦截预案都失去了意义——没有任何武器系统的设计参数考虑过如此巨大的目标。指挥官盯着屏幕上那个不断放大的轮廓，手指悬在警报按钮上方，却迟迟没有按下。\n\n因为他知道，无论按不按，结果恐怕都不会有什么不同。\n\n那个熟悉的身影，又回来了。"
 gts_rainna_la_grande.11_4.desc:0 "“长官，您得来看看这个。”\n\n[Planet.GetName]防御中心的技术员声音发颤。屏幕上，一个庞大的物体正在穿越外层空间，朝着这颗星球径直而来。它的体积大得不像话，轮廓却意外地……有机。\n\n那不是飞船，不是小行星，也不是任何已知的天体。\n\n指挥官盯着屏幕看了很久，最终缓缓开口，声音里带着一丝难以掩饰的疲惫：\n\n“通知所有人。”\n\n“她来了。”"
 gts_rainna_la_grande.13.title:0 "蕾恩娜币"
 gts_rainna_la_grande.13.desc:0 "您现在拥有[root.rainna_la_grande_coin_value]£rainna_la_grande_coin£蕾恩娜币，它们是蕾恩娜银行发行的货币，旨在防止你的能量币溢出。\n\n“蕾恩娜银行”已添加至外交界面。您现在可以随时联系蕾恩娜将蕾恩娜币兑换为能量币，或者反过来。\n\n您还可以以极低的成本贷款任何资源，这将把你从资源短缺的危机中拉回来。\n\n每月都可以打开一次贷款页面哦，说不定有随机的礼物。\n\n蕾恩娜银行的礼物已经为您准备好了！建议您立刻打开看查。"
 gts_rainna_la_grande.13.a:0 "打开蕾恩娜银行"
 gts_rainna_la_grande.13.b:0 "打开蕾恩娜银行贷款界面领取礼物"
 gts_rainna_la_grande.15.title:0 "蕾恩娜银行"
 gts_rainna_la_grande.15_1.desc:0 "欢迎来到蕾恩娜银行。\n\n本月每£rainna_la_grande_coin£蕾恩娜币可以兑换[root.rainna_la_grande_coin_price_value]£energy£。\n\n您的存款是[root.rainna_la_grande_coin_value]£rainna_la_grande_coin£蕾恩娜币。\n\n您的贷款总额是[root.rainna_la_grande_coin_debt_value]£rainna_la_grande_coin£蕾恩娜币。\n\n提示：随时去贷款界面看看，可能有礼物！"
 gts_rainna_la_grande.15_2.desc:0 "欢迎来到蕾恩娜银行。\n\n本月每£rainna_la_grande_coin£蕾恩娜币可以兑换[root.rainna_la_grande_coin_price_value]£energy£。\n\n您的存款是[root.rainna_la_grande_coin_value]£rainna_la_grande_coin£蕾恩娜币。\n\n您的贷款总额是[root.rainna_la_grande_coin_debt_value]£rainna_la_grande_coin£蕾恩娜币。\n\n您的贷款产生的利息是[root.rainna_la_grande_coin_debt_interest_value]£rainna_la_grande_coin£蕾恩娜币。\n\n您需要还款的金额是[root.rainna_la_grande_coin_debt_payment_required_value]£rainna_la_grande_coin£蕾恩娜币。"
 gts_rainna_la_grande.15.a:0 "存款（购买蕾恩娜币）"
 gts_rainna_la_grande.15.b:0 "取款（出售蕾恩娜币）"
 gts_rainna_la_grande.15.c:0 "贷款"
 gts_rainna_la_grande.15.d:0 "还款"
