 gts_rainna_la_grande_arch.09_3_small.desc:0 "科研团队经过反复清洗与多层语言还原，从这些文件中剥离出以下几段恳求信息：\n\n“尊敬的女神大人，我们已经派出我们的祭品，所有罪犯也已被押入刑场……”\n\n“尊敬的女神大人，我卑微地请求您原谅我们的错误……”\n\n“尊敬的女神大人，我们的人民正在遭遇饥饿的痛苦，现在街道饿殍遍野……您是否愿意施舍一些食物……”\n\n这些信息的时间跨度似乎横跨数年。早期记录中仍残留着敬畏与讨好的语气，后期则明显转向近乎绝望的哀求。科研人员注意到，在这些恳求中，文明自身的苦难被轻描淡写，而对“女神大人”的尊崇却被反复、近乎虔诚地强调。实验室里没有人立刻开口讨论，这份“敬畏”究竟是发自内心，还是已被恐惧彻底扭曲。"
 gts_rainna_la_grande_arch.09_4_giant.desc:0 "科学家找到了两封格式正式却语气绝望的信件，分别指向不同的对象。科研团队最终还原出的文本如下：\n\n“尊敬的女神大人：\n\n请宽恕这颗星球上文明的罪行。作为您钦定的管理者，我们已经亲眼目睹了治下市民的悲惨处境——城市凋敝、民众流离。我不希望他们再遭遇任何进一步的惩罚。\n\n谨启\n您的奴仆，城市管理者奥若拉与艾拉拉。”\n\n“尊敬的让娜大人：\n\n请宽恕您的……蕾恩娜。作为她亲爱的……，我不愿再看到她被折磨到生不如死的样子。因此，我们恳请您宽恕您的……所犯下的罪行。我们作为她的……，向您表达最高的敬意与最深的恐惧。\n\n谨启\n克里斯塔、希耶斯塔、菲妮亚、枫……”\n\n科研人员在确认译文后，实验室陷入了长时间的沉默。"
