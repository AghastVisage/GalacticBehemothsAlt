 gts_rainna_la_grande_first_meeting.21113.a:0 "不！请不要……"
 gts_rainna_la_grande_first_meeting.21113.a_tooltip:0 "如此卑微的请求……"
 gts_rainna_la_grande_first_meeting.21114.desc:0 "“欸，真是没想到……”\n\n蕾恩娜优雅地抬起那只刚刚在星球表面肆虐过的足底。像是在欣赏一件艺术品，她将右足侧过来，仔细端详着足底。\n\n细碎的建筑残骸、扭曲的钢筋混凝土、破碎的山体岩石，连同大量的泥土和尘埃，都紧紧黏附在她原本雪白光滑的足底上。那些曾经是文明象征的摩天大楼，此刻不过是她足底污渍的一部分。洁白的肌肤被这些“杂质”覆盖，变得又黑又脏。\n\n她微微皱了皱眉，似乎对这些脏东西有些不满，但很快又露出了满意的笑容。\n\n与此同时，她的另一只足优雅地悬浮在太空中。那只尚未触碰星球的足底依然洁白无瑕，修长而细嫩，只有几滴晶莹的汗珠点缀在光滑的皮肤上，在星光下闪烁着微光。它投下的巨大阴影笼罩着另一片繁华的城市群，让那里的人们在黑暗中瑟瑟发抖，等待着可能降临的审判。\n\n“一次居然踩了这么多呢~”\n\n蕾恩娜满足地笑了笑，那笑容天真而灿烂，仿佛只是完成了一次愉快的游戏。她轻轻晃动着沾满废墟的足趾，让更多的碎片剥落，如同黑色的雪花般飘向地表。\n\n“嘛，既然都已经踩了这么多了……”\n\n她看了看那只干净的足底，又看了看被阴影笼罩的城市群，似乎在考虑着什么。空气仿佛凝固了，所有幸存者都屏住呼吸，等待着她的下一句话。\n\n“那就……这样吧~”\n\n她轻快地说道，同时优雅地将那只干净的足底移开，让阳光重新洒在那片幸运的城市上。\n\n“毕竟……”她俯视着那颗满目疮痍的星球，语气中带着慵懒的满足，“体验一下就够了嘛~我可不想太脏……”\n\n她在太空中舒展着身体，像是刚刚完成了一场愉快的散步。\n\n“而且嘛……”她歪着头，声音中带着俏皮的威胁，“毕竟我下次还要玩呢……”"
