 gts_rainna_la_grande_first_meeting.312.f_tooltip:0 "通过卓越的语言魅力缓和与蕾恩娜的关系。\n\n将消耗500£influence£影响力……也有可能翻倍。"
 gts_rainna_la_grande_first_meeting.312.g:0 "提出进献给蕾恩娜£pop£人口。"
 gts_rainna_la_grande_first_meeting.312.g_tooltip:0 "消耗一小部分总£pop£人口……或者大部分总£pop£人口。"
 gts_rainna_la_grande_first_meeting.312.h:0 "允许蕾恩娜破坏£planet£星球"
 gts_rainna_la_grande_first_meeting.312.h_tooltip:0 "让蕾恩娜挑一个星球玩弄，也许是繁华的那个……"
 gts_rainna_la_grande_first_meeting.312.i:0 "请求蕾恩娜提出赔偿方案。"
 gts_rainna_la_grande_first_meeting.312.i_tooltip:0 "蕾恩娜将随心所欲地提出她想要的条件。"
 gts_rainna_la_grande_first_meeting.312.j:0 "拒绝赔偿"
 gts_rainna_la_grande_first_meeting.312.j_tooltip:0 "这可能会激怒蕾恩娜。"
 gts_rainna_la_grande_first_meeting.313.title:0 "皈依"
 gts_rainna_la_grande_first_meeting.313.desc:0 "听到这个回答，蕾恩娜突然沉默了。\n\n她缓缓闭上双眼，修长的手指在胸前轻轻相抵。那飘逸的长发在无重力的太空中舒展开来，如同一片梦幻的星云。她的表情变得安详而超然，仿佛真的是某种古老传说中的神祇。\n\n片刻的寂静让整个宇宙都仿佛屏住了呼吸。\n\n当她再次睁开双眼时，那双湖泊般的蓝色眼眸中散发出深邃而神秘的光芒。空旷的太空似乎都因她而变得庄重，隐约间有空灵的回响在星际间流淌。\n\n她的面容不再带有之前的戏谑，取而代之的是一种超然而威严的神圣。她俯视着这颗渺小的星球，声音变得庄重而悠远：\n\n“你们若愿意顺从于我，放弃那些虚妄的信仰……”\n\n她的声音在太空中回荡，带着一种不容置疑的威严。\n\n“便可得到宽恕。”\n\n她保持着这份庄重的姿态，双手依然优雅地相抵在胸前。星光在她身后形成了一圈光晕，让她看起来确实如同降临的神明。\n\n沉默持续了几秒。\n\n然后，她的嘴角微微上扬，露出一丝几乎难以察觉的笑意。\n\n“那么……”她轻声说道，语气中那份庄重已经悄然褪去了几分，“你们的选择呢？”\n\n她歪了歪头，那个动作让刚才营造的神圣氛围瞬间多了几分少女的俏皮。"
 gts_rainna_la_grande_first_meeting.313.a:0 "同意皈依"
 gts_rainna_la_grande_first_meeting.313.b:0 "拒绝皈依"
 gts_rainna_la_grande_first_meeting.314.desc:0 "“哦？”\n\n蕾恩娜的声音中带着明显的玩味。她眯起眼睛，嘴角勾起一抹意味深长的笑容。\n\n“原来——如此。”\n\n她的声音拖得很长，似乎这很有道理。\n\n她用手指轻轻托着下巴，做出认真思考的样子。但那双清澈的眼眸中清楚地透露着她根本不相信这个说法。\n\n“此事也简单。”\n\n她俯下身，巨大的面庞贴近星球。 \n\n“那就让我来简单惩处一下你们，来弥补你们的错误对我造成的损失即可。”\n\n她伸出一根修长的食指，在星球表面轻轻划过，没有施加压力，只是让巨大的阴影扫过一座又一座城市。\n\n“毕竟，犯了错可是要承担责任的嘛。”\n\n悬在星球两侧的足底突然向内收紧了一点点。虽然还没有接触到地表，但那种压迫感瞬间增强了数倍。\n\n“我只是希望你们不要捉弄我，否则嘛……”\n\n她托着下巴，饶有兴致地看着这颗星球，轻轻晃动足趾，让阴影在地表上摇曳。"
 gts_rainna_la_grande_first_meeting.321.title:0 "足趾夹夹"
 gts_rainna_la_grande_first_meeting.321.desc:0 ""
 gts_rainna_la_grande_first_meeting.322.desc:0 ""
 gts_rainna_la_grande_first_meeting.323.desc:0 ""
 gts_rainna_la_grande_first_meeting.324.desc:0 ""
 gts_rainna_la_grande_first_meeting.411.title:0 "股东分红"
 gts_rainna_la_grande_first_meeting.411.desc:0 "久违的信号再一次接入。\n\n“嘿~我回来咯~”\n\n那个熟悉的声音从通讯器中传来，轻快而亲昵，仿佛只是一位许久未见的老朋友。\n\n“好久不见呀，你们最近过得怎么样？”\n\n她絮絮叨叨地寒暄了几句，随即像是想起了正事，语气变得轻快起来。\n\n“啊对了，我这次来呢，是有好事要告诉你们哦~”\n\n“我最近做的那些‘生意’，赚了不小一笔呢~嘛，说实话，你们当初那点投资其实也没帮上什么忙啦……”她咯咯地笑了几声，“不过约定就是约定嘛，说好了有回报的，我蕾恩娜可是很讲信用的哦~”\n\n“所以呢，这是给你们的分红~”\n\n亮闪闪的金币从太空中缓缓飘落。\n\n然而它们并没有砸向地面，而是在抵达大气层之后，如同被一只无形的手托住一般，静静地悬浮在了星球的上空。那些金光璀璨的硬币铺满了整片天穹，像是一层由黄金织就的云彩，将温柔的金色光辉洒向整颗星球。\n\n“拿去吧，别客气~”她的声音里带着几分真诚的愉悦，“嘛，我宣布，你们是优质客户了哦~”"
 gts_rainna_la_grande_first_meeting.411_alter.desc:0 "通讯频道里，传来了那个久违的声音。是蕾恩娜。\n\n“呐~我又来找你们咯：”\n\n蕾恩娜的语气轻快而熟稔，像是在跟相识多年的伙伴打招呼。\n\n“猜猜我这次带了什么好东西来~”\n\n不等回应，她就自顾自地说了下去，声音里满是藏不住的得意。\n\n“我最近可是赚了一大笔呢~虽然吧，你们当初给的那点投资，说真的没起到什么作用啦……”她轻笑了一声，语气里没有丝毫恶意，反倒像是朋友之间的调侃，“不过嘛，答应过要分红给你们的，我可不会赖账哦~”\n\n“喏，这是你们的那一份，收好啦~”\n\n几话音落下，几枚巨大的金币缓缓从太空中飘来。它华丽而贵重，在星光下泛着温润的金色光泽——只是它的体积，几乎和一片大陆一样大。\n\n然而这枚金币并没有落下。\n\n它轻盈地停在了星球的上空，如同一轮巨大的金色明月，静静地悬浮在那里，为整颗星球投下一片柔和的金辉。地面上的人们仰望着这枚悬在天际的巨型金币，惊叹于它的璀璨与贵重。\n\n“嘿嘿，怎么样，跟我混不错吧？”她的声音里带着几分邀功般的雀跃，“跟着我准没错的~以后那就是我的优质股东，有钱一起赚哦~”"
 gts_rainna_la_grande_first_meeting.411_alter2.desc:0 "久违的信号接入了通讯频道。\n\n“呐~我回来咯~”\n\n蕾恩娜的声音里带着几分说不清的意味。\n\n“你们最近过得怎么样呀？嘛，反正也不重要啦~”\n\n她随口敷衍了一句，随即语气一转。\n\n“我这次来呢，是给你们送分红的哦~当初约好了的，我可是很守信用的~”\n\n“喏，接住咯~”\n\n话音落下，几枚闪闪的金币从天而降，如同一场璀璨的金色暴雨，铺天盖地地砸向星球的表面。它们在阳光下折射出耀眼的光芒，看起来价值连城。\n\n然而那些金币的体积……对这颗星球来说，似乎有些太大了。\n\n每一枚坠落的金币都在地表砸出巨大的坑洞，繁华的城市在这场“分红”之下被砸得千疮百孔。\n\n“看着也不怎么多嘛……”蕾恩娜愉快地说着，仿佛完全没有注意到地面上的惨状，“这就是你们当时的投入换来的。”"
 gts_rainna_la_grande_first_meeting.411_alter3.desc:0 "信号再一次接入。\n\n“嘿~好久不见呀~”\n\n蕾恩娜的语气轻飘飘的，听不出太多的热情。\n\n“我最近赚了点钱，想起来还欠你们一份分红呢~嘛，说到做到，这是我的原则嘛~”\n\n“所以呢……这是你们的那一份。”\n\n她轻笑了一声，那笑声里藏着几分难以言喻的意味。\n\n一枚巨大的金币缓缓从太空中飘落，在星光下闪烁着诱人的金色光泽。它看起来无比华丽，无比贵重——只是当它逐渐逼近星球时，人们才惊恐地发现，那枚金币的体积，几乎和一片大陆一样大。\n\n金币重重地砸在星球表面，掀起了遮天蔽日的尘埃，整片大陆在这一击之下彻底沉入了地壳。\n\n“嘻嘻，够意思吧~”\n\n蕾恩娜俏皮地说着，语气里满是恶作剧得逞的愉悦。\n\n“下次赚了钱，我还会再来‘照顾’你们的哦~”"
 gts_rainna_la_grande_first_meeting.411.a:0 "哦，我的钱！"
 gts_rainna_la_grande_first_meeting.411.a_tooltip:0 "可是这钱不流通啊……"
 gts_rainna_la_grande_first_meeting.2110.title:0 "无事发生？"
 gts_rainna_la_grande_first_meeting.2110.desc:0 "“嘛，玩笑罢了~”\n\n蕾恩娜咯咯地笑着，将悬在天空中的巨足缓缓收回。她在太空中调整了一下姿势，将身体侧卧，一手随意地托着脸颊，另一只手的食指在大气层外轻轻划动。\n\n“今天心情不错嘛~所以就不计较了~”\n\n她的手指在云层中漫不经心地画着圈，厚重的云层在她指尖下如同棉花般被随意塑造。转眼是一朵巨大的花，转眼又变成别的什么。她看起来颇为享受这个过程，就像是一个孩子在无聊时随手涂鸦。\n\n“你们也别站在那里发呆嘛~”\n\n她歪着头，用那双湖泊般的眼眸扫了一眼星球表面，语气中带着几分少见的轻快。\n\n“难得我今天高兴，你们也跟着高兴一下嘛~”\n\n她将手指轻轻一弹，云层中那朵刚刚塑造好的巨大花朵瞬间碎散开来，化作漫天的水汽，在阳光下折射出一道横跨天际的彩虹。\n\n“嗯，好看吧~”\n\n她满意地看着那道彩虹，嘴角带着一抹轻松的笑意。这一刻，她看起来不像是一个刚刚将整颗星球玩弄于股掌之间的可怕存在，倒更像是一个心情极好的少女。\n\n“嘛，今天就到这里吧~"她慵懒地伸了个懒腰。"
 gts_rainna_la_grande_first_meeting.2110.desc_alter:0 "“哈哈哈~只不过是和你们开个小玩笑嘛~”\n\n蕾恩娜的笑声爽朗而清脆，她将巨足轻巧地收回，在太空中翻了个身，舒展地侧卧着，看起来心情极好。\n\n“嘛，今天运气不错嘛，刚好碰上我高兴~”\n\n她托着下巴，带着几分好意地俯视着这颗星球。\n\n“你们这群小家伙，反应还挺有意思的~”她的声音中带着真实的愉悦，“跑来跑去的，看着倒是挺热闹。”\n\n她伸出手指，在大气层外轻轻划了一道弧线。云层随着她的动作缓缓翻涌，最终在天空中形成了一个巨大而柔和的漩涡，将四散的云彩重新聚拢，遮住了正午灼热的阳光，给地面带来了一片难得的阴凉。\n\n她的眼眸在星光下弯成了月牙状，带着几分真实的温和。这种温和让人既感到意外，又隐隐觉得不安——因为所有人都知道，她的心情随时可能改变。"
 gts_rainna_la_grande_first_meeting.2110.a:0 "有一种不好的预感……"
 gts_rainna_la_grande_first_meeting.2110.b:0 "多谢女神的怜悯！"
 gts_rainna_la_grande_first_meeting.2110.b_tooltip:0 "你在感谢一个欲降下灾祸者的怜悯吗……"
 gts_rainna_la_grande_first_meeting.2111.title:0 "踏足"
 gts_rainna_la_grande_first_meeting.2111.desc:0 "蕾恩娜对这些微弱的请求充耳不闻，又或许是根本没将这颗星球最高领袖的恳求放在眼里。她那巨大的裸足悬停在一片繁华的大陆上方，如同一片活体天幕般遮蔽了大半个陆地。在她的阴影之下，延绵数千公里的城市群顷刻间陷入黑暗，仿佛被按下了静止键。\n\n她顽皮地晃动着修长的足趾，仿佛在展示艺术品般展示着她完美无瑕的足底。那光洁的皮肤上找不到任何陨石碎屑或宇宙尘埃的痕迹，每一寸肌肤都散发着令人心悸的光泽。饱满的足弓没有丝毫瑕疵，晶莹的汗珠静静地凝结在清晰可见的掌纹之中，如同无数颗即将坠落的微型星球，悬在城市群的上空。\n\n她的足尖轻巧地刺破薄如蝉翼的云层，犹如一位舞者般优雅地触碰大陆的边缘。\n\n这看似轻柔的一触，却让整个世界都为之颤抖。大地如同薄纸般撕裂，破碎的地壳裹挟着无数座城市和喷涌而出的炽热岩浆，如同焰火般洒向太空。这微小的接触所产生的震波席卷了整颗星球，就连远在地球另一端的城市也感受到了这毁灭性的余震。她的巨足陷入这个自己制造的巨坑中，足趾顽劣地蹭动着星球表面，如同孩童玩弄沙堆般，将一座座城市化为齑粉。\n\n当她将巨足抬起，足底已然不再如此一尘不染，而是沾满了大量的泥土、岩石以及建筑物的残骸，而曾经无数城市群已然化作充满滚烫熔岩的巨型陨石坑。"
 gts_rainna_la_grande_first_meeting.2111_alter.desc:0 "蕾恩娜对这些微弱的请求充耳不闻，或是没有意识到这渺小的请求，哪怕它是来自这颗星球的最高领袖。她那巨大的裸足悬停在一片有着巨大的繁华城市的大陆上方，如同一片活体天幕般遮蔽了大半个陆地。在她的阴影之下，这颗星球上最大的城市被黑暗笼罩，顷刻陷入了瘫痪。\n\n她顽皮地晃动着修长的足趾，仿佛在展示艺术品般展示着她完美无瑕的足底。那光洁的皮肤上找不到任何陨石碎屑或宇宙尘埃的痕迹，每一寸肌肤都散发着令人心悸的光泽。饱满的足弓没有丝毫瑕疵，晶莹的汗珠静静地凝结在清晰可见的掌纹之中，如同无数颗即将坠落的微型星球，悬在城市群的上空。\n\n她的足尖轻巧地刺破薄如蝉翼的云层，犹如一位舞者般优雅地触碰大陆的边缘。\n\n这看似轻柔的一触，却让整个世界都为之颤抖。大地如同薄纸般撕裂，破碎的地壳裹挟着无数建筑和喷涌而出的炽热岩浆，如同焰火般洒向太空。这微小的接触所产生的震波席卷了整颗星球，就连远在地球另一端的城市也感受到了这毁灭性的余震。她的巨足陷入这个自己制造的巨坑中，足趾顽劣地蹭动着星球表面，如同孩童玩弄沙堆般，将一座座城市化为齑粉。\n\n当她将巨足抬起，足底已然不再如此一尘不染，而是沾满了大量的泥土、岩石以及建筑物的残骸，而曾经巨大的城市已然被啃食出一个巨大的缺口，化作充满滚烫熔岩的巨型陨石坑，附近的建筑也在强震之下无一幸免，唯有一点点边界的郊区幸存。"
 gts_rainna_la_grande_first_meeting.2111.a:0 "请息怒！"
 gts_rainna_la_grande_first_meeting.2111.a_tooltip:0 "在绝对的力量面前，尊严不过是一文不值的筹码……"
 gts_rainna_la_grande_first_meeting.2111.b:0 "可恶，怎么可以这么坏……"
 gts_rainna_la_grande_first_meeting.2111.b_tooltip:0 "质问施暴者的残忍，往往会换来更大的残忍……"
 gts_rainna_la_grande_first_meeting.2111.c:0 "不……我们的城市……"
 gts_rainna_la_grande_first_meeting.2111.c_tooltip:0 "对她来说，只不过是无关紧要的灰尘罢了……"
 gts_rainna_la_grande_first_meeting.2111.d:0 "好漂亮的玉足"
 gts_rainna_la_grande_first_meeting.2111.d_tooltip:0 "但是很危险……"
 gts_rainna_la_grande_first_meeting.2112.title:0 "点到为止"
 gts_rainna_la_grande_first_meeting.2112.desc:0 "她那巨大的足趾在大气层外优雅地舞动，轻柔地扰动着附着在星球表面的云层。每一次轻微的动作都在云层中激起波澜，如同湖面上的涟漪，只是规模大得难以想象。她光洁的足底在阳光下闪烁着微光，每一个细节都如同山丘与沟壑，映射着星光。她温和地舒展开足趾，露出圆润的足趾缝隙中晶莹的汗渍。\n\n“嗯……踩在哪里好呢？”\n\n她的声音中夹杂些许天真，巨大的足趾轻柔地拨开云层，如同掀开餐盘上的银盖。她的目光在这颗星球表面游移，掠过每一片繁华的城市群，像是在挑选玩具店里最完美的玩具。阴影划过群山与海洋，掠过森林与平原，最终停留在一片灯火通明的城市群上空。\n\n这片繁华的都市群瞬间陷入黑暗。数百万盏灯光在巨大的阴影下显得如此微弱，像是即将熄灭的萤火虫。从太空中看去，这座城市不过是她足尖下的一个微小光点。\n\n“唔，就这里吧。”\n\n带着俏皮的笑意，蕾恩娜的足趾轻盈地点向地面，就像芭蕾舞者的点地动作。但这看似优雅的一点，却让整片城市群在瞬间化为齑粉。钢筋与玻璃、混凝土与沥青，连同其中无数的生命，都在这轻柔的一触之下被碾入地壳。当她抬起足尖，原本车水马龙的商业中心只剩下一个完美的圆形深坑，细密的趾纹精美地刻画在深坑之中，边缘还在冒着袅袅青烟……"
