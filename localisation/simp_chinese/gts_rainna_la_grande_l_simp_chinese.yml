 gts_rainna_la_grande_arch.09_1_micro.a:0 "怎么突然变成这样了？"
 gts_rainna_la_grande_arch.09_1_micro.b:0 "之前的毁灭者回来了？"
 gts_rainna_la_grande_arch.09_2_micro.a:0 "真是丧心病狂啊……"
