 gts_rainna_la_grande_arch.04.name:0 "荒唐、离奇"
 gts_rainna_la_grande_arch.04_1_micro.desc:0 "随着信号源源不断地流出，一个简单的故事逐渐成形。\n\n内容残缺，翻译不完全，但大致的轮廓已经可以辨认：\n\n“勇敢的骑士跨越了大陆，将文明的火种带到了这颗星球的每一个角落。\n\n岁月流转，不知几百个春夏秋冬之后，这颗星球已经归于统一。麦田变成了城市，城市变成了钢铁森林，高楼大厦拔地而起，最高的建筑甚至能够遮蔽正午的太阳。\n\n凯撒勤劳而充满智慧，在他的带领下，文明欣欣向荣，人们安居乐业。\n\n然后，在某一年的某一天，天外传来了友善的信号。\n\n一位自称旅行者的客人发来了礼貌的问候，请求作为尊贵的访客与这里的人们共聚一堂……”\n\n信号在这里停顿了片刻，然后继续向下传递。"
 # gts_rainna_la_grande_arch.04_1_tiny.desc:0 ""
 # gts_rainna_la_grande_arch.04_1_small.desc:0 ""
 # gts_rainna_la_grande_arch.04_1_normal.desc:0 ""
 # gts_rainna_la_grande_arch.04_1_tall.desc:0 ""
 # gts_rainna_la_grande_arch.04_1_giant.desc:0 ""
 gts_rainna_la_grande_arch.04_1_titan.desc:0 "事后，那名在湖边晕倒的科研人员醒来后，发现自己的记忆里凭空多出了一些东西。\n\n那些记忆破碎而混乱，像是从别人的梦里偷来的片段。科研团队花了整整两天，才从她断断续续的描述中拼凑出一个大致完整的故事：\n\n“是骑士……对，是骑士。这颗星球上曾经有很多国家，它们互相对峙，谁也不肯让步。\n\n后来……后来好像是一个叫凯撒的人，把所有人都聚到了一起。麦子长啊长，长成了高楼，高楼又长啊长，长得连太阳都遮住了。大家都很开心。\n\n然后……"\n\n她皱起眉头，努力回忆着。\n\n”然后有一个女孩出现了。看上去像是二十岁左右的女孩。她说她是来参加聚会的……"\n\n她的描述在这里戛然而止，她摇了摇头，说剩下的记忆太模糊，怎么也想不起来了。\n\n科研团队对视了一眼，没有人急着追问。"
 # gts_rainna_la_grande_arch.04_1_ultra.desc:0 ""
 # gts_rainna_la_grande_arch.04_3_tall.desc:0 ""
 # gts_rainna_la_grande_arch.04_3_giant.desc:0 ""
 gts_rainna_la_grande_arch.04_2_micro.desc:0 "信号突然转向，内容变得截然不同。\n\n不再是流水账式的历史记录，而是某种更加私密、更加沉重的东西。翻译残缺，但情绪透过那些断裂的词句清晰地传递出来：\n\n“Domina……\n\nDomina已被套上枷锁，困在永恒的黑暗之中。\n\n没有光，没有声音，没有时间的流动。只有黑暗，以及黑暗中无止尽的等待。她在寂静中哭泣，在悲痛中……\n\nDomina……Domina……”\n\n信号在这里开始变得混乱，像是被某种剧烈的情绪扰动，频率急剧不稳。清晰的内容越来越少，最终只剩下一个词在噪声中反复出现，像是某种无法停止的呼唤，或者祈祷，或者哭泣：\n\n“Domina……Domina……Domina……”\n\n科研人员们静静地听着那个词在解码器中一次又一次地重复，没有人开口说话。\n\n我们尚不知道“Domina”的含义，为了接下来的研究，我们必须假定一个最接近的解释。"
 gts_rainna_la_grande_arch.04_2_tiny.desc:0 "那名晕倒的科研人员在同事们的搀扶下勉强站了起来，却没有恢复正常的神志。\n\n她的眼神空洞而茫然，完全不在意周围发生的一切，只是低着头，用一种近乎喃喃自语的声音，反复念叨着什么。\n\n同事们凑近去听，才勉强辨认出她在说什么：\n\n“Domina……已被枷锁束缚，在永恒之中，完全无法脱身……寂静……黑暗……\n\n没有人来……没有人……\n\nDomina……Domina……”\n\n她的声音里没有任何情绪的起伏，平静得让人发毛。那种平静不是真正的平静，而是某种被恐惧彻底淹没之后的麻木。\n\n团队医生检查了她的生命体征，一切正常，但她始终无法从那种状态中清醒过来，只是不停地重复着那几个词，像是被什么东西困住了。\n\n直到飞船彻底离开那片区域，她才终于缓缓回过神来，对自己刚才说了什么毫无记忆。\n\n我们尚不知道“Domina”的含义，为了接下来的研究，我们必须假定一个最接近的解释。"
