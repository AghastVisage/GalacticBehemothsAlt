 ##行星特征
 d_rainna_la_grande_giga_footprint:0 "蕾恩娜留下的巨型足印"
 d_rainna_la_grande_giga_footprint_desc:0 "这个覆盖了整片大陆的巨型足印是蕾恩娜留下来的。曾经繁华的城市群、连绵的山脉、广袤的平原，都在她轻描淡写的一踩之下化为乌有。足印深处仍在涌动的岩浆让这颗星球不再适合居住，地壳的破碎也让这颗曾经美丽的星球变得不再稳定。然而讽刺的是，这场灾难反而让星球的矿物资源更易开采——仿佛是她留下的某种"恩赐"。"
 d_rainna_la_grande_rubbed_giga_footprint:0 "蕾恩娜碾磨过的巨型足印"
 d_rainna_la_grande_rubbed_giga_footprint_desc:0 "这不仅仅是一个足印。蕾恩娜在踩下之后，还饶有兴致地用足底反复碾磨了几下，将破坏的范围扩大了数倍。原本清晰的足印轮廓被摩擦得模糊不清，取而代之的是一大片被彻底抹平的焦土。城市、山脉、河流，一切的一切都被碾成了紧贴地表的一层薄薄的痕迹，混杂在翻涌的岩浆与碎裂的地壳之间。这颗星球承受的，是远比一次踩踏更为彻底的蹂躏。"
 d_rainna_la_grande_giga_toe_print:0 "蕾恩娜留下的巨型足趾印"
 d_rainna_la_grande_giga_toe_print_desc:0 "一个巨大的圆坑，覆盖了曾经繁华的城市群以及周围连绵的山脉。至少她没有将整个巨足落下，也许，这也算是她的仁慈。"
 d_rainna_la_grande_giga_finger_print:0 "蕾恩娜留下的巨型指印"
 d_rainna_la_grande_giga_finger_print_desc:0 "一个巨大的圆坑，将曾经繁华的城市群、周围的山脉都在一瞬间化为一个深不见底的坑。深处仍在涌动的岩浆让这颗星球不再适合居住，这颗曾经美丽的星球也变得不再稳定。然而，这场灾难反而让星球的矿物资源更易开采，也许这就是她降下的"恩泽"。"
 d_rainna_la_grande_giga_finger_artwork:0 "蕾恩娜的手指留下的峡谷"
 d_rainna_la_grande_giga_finger_artwork_desc:0 "一个由纯粹的暴力美学挖出的巨型峡谷，巨大到甚至破坏了星球的稳定性。这条峡谷所覆盖的一切名胜古迹、城市群、山脉、甚至海洋已然完全被这平整的巨大峡谷替代。然而，一些深埋于地下的资源意外露出表面，这也许是她的恩赐。"
 d_rainna_la_grande_giga_sweat_lake:0 "蕾恩娜的体液湖"
 d_rainna_la_grande_giga_sweat_lake_desc:0 "一片乳白色的、散发着朦胧热气的巨大湖泊，是蕾恩娜停留时无意间留下的痕迹。湖水弥漫着某种令人陶醉却又难以名状的气息，据说靠近它的生物会不由自主地被吸引，直至沉醉其中、失去意识。这片湖泊的成分至今无法被完全解析，但它确实改变了这颗星球的生态，让周围的一切都笼罩在一层暧昧而危险的氤氲之中。"
 d_rainna_la_grande_giga_rainfall:0 "蕾恩娜之雨"
 d_rainna_la_grande_giga_rainfall_desc:0 "蕾恩娜心血来潮时降下的一场甘霖。与她惯常的破坏不同，这场雨带来的是纯粹的恩泽——清澈的雨水滋润了干涸的土地，抚平了创伤，让荒芜的大地重新焕发生机。作物茁壮成长，河流重新奔涌，整颗星球都因这场雨而变得更加富饶。也许，这就是她偶尔流露出的、罕见的温柔。"
 d_rainna_la_grande_rubbed_giga_footprint2:0 "蕾恩娜碾磨过的超巨型足印"
 d_rainna_la_grande_rubbed_giga_footprint2_desc:0 "这是一个大到超乎想象的足印，是蕾恩娜以更加庞大的姿态降临时留下的。仅仅一只足底，就覆盖了这颗星球相当大的一部分。而她并不满足于此，还在踩下之后反复碾磨，让破坏的范围进一步扩大。曾经的大陆、海洋、文明的一切痕迹，都在这难以想象的蹂躏中被彻底抹去，只剩下一片广袤无垠的焦土与翻涌的岩浆。这颗星球的地质结构已经濒临崩溃，能够残存至今，本身就是一个奇迹。"

