 gts_rainna_la_grande_first_meeting.01.title:0 "“高的蕾恩娜”"
 gts_rainna_la_grande_first_meeting.01_random_1.desc:0 "信号输入\n\n“你们好啊，我是‘高的蕾恩娜’。”\n\n信号那头的声音轻快而随意，像是邻居串门一样自然。\n\n“我是一个孤独的旅行者，走了好久好久了呢~请问……你们允许我来到你的星球上歇歇脚，顺便领略一下你们伟大的文化吗？”\n\n她停顿了一下。\n\n“放心，不会有事的……”"
 gts_rainna_la_grande_first_meeting.01_random_2.desc:0 "信号输入\n\n“你们好，我是‘高的蕾恩娜’。”\n\n那是一个年轻少女的声音，带着几分漫不经心的友好。\n\n“我是我是一个远道而来的探险者。不过……现在好像有些迷路了。”\n\n那是一个年轻少女的声音，带着几分漫不经心的友好。\n\n“请问……你是否允许我来到你的星球上落脚，顺便参观你们恢弘的文明？”\n\n短暂的停顿后，她补充道：\n\n“备注：我是好人。”"
 gts_rainna_la_grande_first_meeting.01_random_3.desc:0 "信号输入\n\n“你好，我是来自异世界的旅行者，你们可以叫我‘高的蕾恩娜’。”\n\n声音温和而有礼，像是经过了认真措辞。\n\n“你可能第一次听到我的名字。我现在略有疲乏，请问您是否允许我踏足在你们星球的领土上，好好休息一下？”\n\n“别担心，我没有恶意的。”"
 gts_rainna_la_grande_first_meeting.01_random_4.desc:0 "信号输入\n\n“嘛，你们好……我是‘高的蕾恩娜’。”\n\n那个声音懒洋洋的，带着几分漫不经心。\n\n“我想，你应该是第一次听说我的名字吧。我嘛，算是个来自远方的流浪者——哦，不是那种贫穷的流浪汉啦，别误会~”\n\n她像是在解释一件理所当然的事情。\n\n“我只是想到处走走，降临到不同的星球上看看。你们愿意招待我一下吗？我会感谢你们的。”\n\n“我不会惹事的啦。”"
 gts_rainna_la_grande_first_meeting.01.a:0 "当然可以！"
 gts_rainna_la_grande_first_meeting.01.a_tooltip:0 "这份热情似乎有点过头了……"
 gts_rainna_la_grande_first_meeting.01.b:0 "我拒绝。"
 gts_rainna_la_grande_first_meeting.01.b_tooltip:0 "谨慎是好事，但有时候也会错过机会……"
 gts_rainna_la_grande_first_meeting.01.c:0 "我不欢迎你，别再打扰我了。"
 gts_rainna_la_grande_first_meeting.01.c_tooltip:0 "这么直接真的明智吗……"
 gts_rainna_la_grande_first_meeting.01.d:0 "“高的蕾恩娜”？你到底有多高？"
 gts_rainna_la_grande_first_meeting.01.d_tooltip:0 "有些真相，可能你并不想知道……"
 gts_rainna_la_grande_first_meeting.01.e:0 "原来你就是“高的蕾恩娜”？"
 gts_rainna_la_grande_first_meeting.01.e_tooltip:0 "或许有些秘密，保持神秘会更好……"
 gts_rainna_la_grande_first_meeting.01.f:0 "杀掉她！"
 gts_rainna_la_grande_first_meeting.01.f_tooltip:0 "杀掉她！"
 gts_rainna_la_grande_first_meeting.01.g:0 "也许我们可以谈谈生意。"
 gts_rainna_la_grande_first_meeting.01.g_tooltip:0 "并不是所有人都值得信赖……"
 gts_rainna_la_grande_first_meeting.02.title:0 "巨型阴影"
 gts_rainna_la_grande_first_meeting.02_random_1.desc:0 "首次捕捉到这个反常现象的是我们的科研穿的观测数据，那时，没人把它当回事。远方群星璀璨的夜空中，只是一小片区域略显暗淡，遮蔽了几颗原本清晰可见的恒星。[this.GetName]的天文台很快确认了这一观测结果，但大多数研究人员只是将其归类为一次普通的天文异常现象。\n\n然而，短短数日之间，情况急转直下。那片异常的阴影以惊人的速度扩张，吞噬了越来越多的星光。科学家了解到，这是一个正在向[this.GetName]疾驰而来的神秘天体，它的轨迹飘忽不定，既不符合已知天体的运动规律，也不像是任何文明制造的航行器。\n\n[this.GetName]的科学院紧急召开了专题研讨会。当首席科学家[rainna_la_grande_this_scientist.GetName]走出会议厅时，焦虑与恐惧似乎能将[rainna_la_grande_this_scientist.GetHerHim]压倒。几十年的研究生涯中，[rainna_la_grande_this_scientist.GetHerHim]从未见过如此诡异的现象。就在这时，天空骤然变色，翻涌的云层被一股莫名的力量撕裂，狂风呼啸着掠过地面，卷起落叶和碎屑，像是某种不祥的预兆。\n\n那个庞大的存在终于显露出真容——一张与天际融为一体的巨脸。她的双眸如同两汪深邃的湖水，每一次眨动都伴随着震耳欲聋的雷鸣，掀起足以摧毁一切的飓风。[rainna_la_grande_this_scientist.GetName]的长发在狂风中狂舞，她想要喊些什么，却被呼啸的风声淹没。\n\n “不，等一下！”\n\n话音未落，一根被风暴掀起的粗壮树枝划破长空，重重砸在[rainna_la_grande_this_scientist.GetName]身上。她的身体重重摔在台阶上，还未及爬起，就被狂暴的气流卷入高空……\n\n与此同时，信号接入。"
 gts_rainna_la_grande_first_meeting.02_random_2.desc:0 "最初，那只是夜空中一个微不足道的异常——仅仅是群星璀璨间的一个芝麻大小的暗斑。随后，这个斑点悄然扩大，吞噬了天际角落的几颗星辰。起初，这种变化细微得近乎难以觉察，仿佛只是普通的天文现象。然而短短数日之间，那抹黑暗却如同墨滴入清水，迅速蔓延开来，最终化作一片巨大的黑幕，吞没了大片星河，只留下一片死寂的漆黑。\n\n第二天，紧急会议在[this.GetName]召开，紧张与不安笼罩于在每一个人，那是令人战栗的对未知的恐惧，仿佛下一刻，那吞噬星光的黑暗就会将他们的灵魂也一并吞没。\n\n它已经被确认是一种从未见过的巨大的实体。既不是流星、也不是飞船，它神秘地悄然逼近[this.GetName]，十分迅速，不定的轨迹让在座的每一位学者与科研人员都不敢妄下定论。但是每一个人都十分肯定的是——这个存在，已经离我们太近了。\n\n当首席科学家[rainna_la_grande_this_scientist.GetName]在会后接受采访的时候，每一个人都看到了那被大气笼罩的巨大的朦胧面孔，那张清秀的面部覆盖了几乎整个天空。伴随着突然的狂风与剧烈的震动，她离我们越来越近。深蓝色的眼瞳就像是湖水一般与天空融为一体，每眨一下都会带来湍急的气流与剧烈的震颤，轻易地折断枝干、卷起物品、撕裂云彩，脚下剧烈的震动甚至让房屋产生了一道道蛛网般蔓延的深邃裂隙。伴随着一声震耳欲聋的轰鸣，坚硬的地面裂开一道深不见底的裂缝狂暴的气流毫不留情地将[rainna_la_grande_this_scientist.GetHerHim]推向深渊……\n\n与此同时，信号接入。"
 gts_rainna_la_grande_first_meeting.02_random_3.desc:0 "宛如墨滴浸染宣纸，又似星火坠入深秋枯叶。几日前，观测图像角落里的那个微小黑点原本不值一提，只被当作普通的观测异常。然而短短数日之间，它就如同贪婪的墨渍般扩张蔓延，吞噬着越来越多璀璨的星光，犹如无形的烈火，在寂静的宇宙画布上肆意燃烧。\n\n[this.GetName]的研究团队通过精密观测发现，这是一个正在接近我们的神秘天体。它的行迹诡秘难测，仿佛刻意避开所有探测手段，却又笔直地朝我们的星球疾驰而来。这个神秘的天体的运动轨迹十分奇特，它既不属于任何小行星或者流星，也不属于任何已知的飞行器。一场灾祸正在酝酿。\n第二天，[this.GetName]实验中心陷入一片紧张氛围。紧急会议室内，科研人员们争分夺秒地讨论着各种可能性和应对方案。似乎在认为这是一个可以解决的问题。\n\n在随后的新闻发布会上，首席科学家[rainna_la_grande_this_scientist.GetName]的表情异常凝重。[rainna_la_grande_this_scientist.GetHerHis]小心翼翼地斟酌着每一个字句，试图编织一张由谎言构筑的安全网，生怕真相的锋芒会通过媒体刺痛每个人脆弱的神经。然而，命运早已悄然降临。\n\n最初只是一阵突如其来的强风，撕碎了空中的云层。紧接着，在那湛蓝的天际线上，浮现出一对如深邃湖泊般的巨大瞳孔。清秀的面庞随之显现，覆盖了大半个天穹。她的每一次眨眼都仿佛是两颗巨星的碰撞，震耳欲聋的巨响中迸发出的能量掀起狂暴飓风，让大地剧烈颤抖，轻易地掀翻任何哪怕有一点脆弱的物品……没错，就是那辆停在[rainna_la_grande_this_scientist.GetName]的豪华车。被气流轻轻托起。在这场灾难面前，这精心打造的钢铁造物不过是一片羽毛。当它重重砸下时，[rainna_la_grande_this_scientist.GetName]甚至来不及发出一声惊呼……\n\n与此同时，信号接入。"
 gts_rainna_la_grande_first_meeting.02_random_4.desc:0 "在[this.GetName]的观测站，每一张流传到网络上的星空照片都是一幅璀璨的艺术品。无数闪烁的恒星编织成银河的锦缎，装点着漆黑的夜空。\n直到有一天，一位细心的用户花费了数个小时找到了一个异常的地方，在照片的边角，一颗曾经明亮的恒星不知何时已经消失得无影无踪。起初，这个发现并未引起任何关注。毕竟自[owner.GetName]的先民首次举起望远镜注视星空以来，类似的现象并不罕见。在浩瀚的银河中，偶尔有星辰悄然熄灭，这本是再平常不过的事情。\n\n十几天后，这位执着的用户又发现了另一颗消失的行星。而几天后，一片黄豆大小的明显的没有行星出现的区域醒目地展现在最新的星空图像中，那里原本璀璨的群星竟全数消失。对外发表声明，称这只是一个需要进一步研究的天文异常。但很快，事态就完全脱离了所谓“正常现象”的范畴。\n\n两天后，一个庞大的黑影吞噬了近半幅观测图像。当科研人员们排除了设备故障后，一个可怕的事实浮出水面：根据科研人员的初步推测，这是一个正在接近[this.GetName]的神秘实体。初步计算显示，它体积巨大，行踪诡秘，移动却又惊人地敏捷。更令人不安的是，它既不符合任何已知天体的特征，也不像是任何文明造物的痕迹。而它的目标就是[this.GetName]。\n\n第二天，紧急会议在[this.GetName]的科研基地召开。科学家们的讨论中紧张地推进着，而楼下的记者则堵在广场上，随时准备着采访。平时寂静的会议室中吵闹不堪，似乎每一个人都在为了尝试找出哪怕一点希望而陷入疯狂。\n\n一阵狂风打破了寂静的酷暑。阵诡异的狂风撕裂了闷热的空气。气流来势汹汹，将记者们的器材高高卷起。将每一个人都吹得难以站立。紧接着，剧烈的地震将墙体砸出蛛网状的裂隙向远处蔓延。\n\n顺着风的方向望去，不知什么时候，一张占据着大半天空的巨大脸庞赫然显现，巨大的蓝色双瞳如湖水一般清澈。她那湖水般澄澈的蓝色双瞳正俯视着这个渺小的世界。每一次眨眼，都伴随着震撼天地的巨响。狂暴的气流席卷着沙石、残枝、碎片、在广场上掀起一场死亡风暴。破碎的树木被连根拔起、扭曲变形的汽车被掀起，裹挟着各种被折断的设备，追猎着广场上无辜的人员。科研基地的玻璃在某一瞬间全部崩裂四散，无数锋利的碎片如同致命的箭雨，呼啸着射向高空。\n\n当[rainna_la_grande_this_scientist.GetName]被发现时，一片尖锐的玻璃碎片已然贯穿[rainna_la_grande_this_scientist.GetHerHim]的胸膛。\n\n与此同时，信号接入。"
 gts_rainna_la_grande_first_meeting.02.a:0 "究竟是……"
 gts_rainna_la_grande_first_meeting.02.b:0 "难道是“高的蕾恩娜？”"
 gts_rainna_la_grande_first_meeting.02.b_tooltip:0 "也不是没有可能……"
 gts_rainna_la_grande_first_meeting.02.msg1:0 "经过抢救，[rainna_la_grande_this_scientist.GetName]目前并无大碍，[rainna_la_grande_this_scientist.GetHerHim]很快就可以继续上岗。"
 gts_rainna_la_grande_first_meeting.02.msg2:0 "很遗憾，[rainna_la_grande_this_scientist.GetName]抢救无效，已经死亡。"
 gts_rainna_la_grande_first_meeting.02.msg3:0 "经过抢救，[rainna_la_grande_this_scientist.GetName]目前并无大碍，但[rainna_la_grande_this_scientist.GetHerHim]身心俱疲，决定退休。"
 gts_rainna_la_grande_first_meeting.03.title:0 "交易"
 gts_rainna_la_grande_first_meeting.03_random_1.desc:0 "“啊……原来是巨型企业啊！”\n\n信号那头的声音突然活泼起来，带着几分难以掩饰的惊喜。\n\n“久仰久仰！你们的名字我可是如雷贯耳呢~那么……”\n\n她顿了一下，语气变得有些撒娇。\n\n“你们这么有钱，想必不介意给我这个远道而来的旅行者一点点小小的资助吧？嘿嘿……”\n\n“放心，把钱投在我身上绝对错不了的啦~那么，快把钱拿出来嘛！”"
 gts_rainna_la_grande_first_meeting.03_random_2.desc:0 "“哦……没想到居然是企业家。”\n\n她的声音停顿了一下，像是在考虑什么。\n\n“那我就不得不坦白一件事了……”\n\n又是一阵沉默。\n\n“……我现在手头有点紧。”她终于开口，语气有些不自然，“不过！不过你要是给我一些资金，我不就有钱了吗？嘛，严格来说这叫做‘投资’啦。”\n\n“来来来，快来投资我吧！绝对有回报的！”"
 gts_rainna_la_grande_first_meeting.03_random_3.desc:0 "“哦哦，原来是巨企啊。”\n\n她的语气带着几分真实的惊叹，随即又变得有些不好意思。\n\n“不过金融方面的东西我实在是不太懂呢……毕竟我从来没做过商人。”\n\n她停顿了一下。\n\n“要不然这样——你给我提供一点启动资金怎么样？”\n\n“啊哈，我保证你不会后悔的！”"
 gts_rainna_la_grande_first_meeting.03_random_4.desc:0 "“欸，交易？原来是企业家啊。”\n\n她的声音中带着几分真实的困惑。\n\n“我对经济学实在是一窍不通，你们那一套规则我有点玩不明白……”\n\n她沉默了片刻，像是在认真思考。\n\n“这样吧，我规定我名下1%的股份，定价600能量币£energy£。”\n\n“嘿嘿……要不然买一点点？应该不贵的啦~”"
 gts_rainna_la_grande_first_meeting.03.a:0 "支付£energy£60。"
 gts_rainna_la_grande_first_meeting.03.a1:0 "支付£energy£60（剧情体验模式下不会扣款）。"
 gts_rainna_la_grande_first_meeting.03.a_tooltip:0 "“这是不是有点少了？你还怎么让我在宇宙中散播你们的恩德？”"
 gts_rainna_la_grande_first_meeting.03.a_tooltip1:0 "§R你没有足够的£energy£能量币支付。§!"
 gts_rainna_la_grande_first_meeting.03.b:0 "支付£energy£600。"
 gts_rainna_la_grande_first_meeting.03.b_tooltip:0 "“啊，够我买一些好吃的了，不过你只有这么一点点钱？”"
 gts_rainna_la_grande_first_meeting.03.c:0 "支付£energy£6,000。"
 gts_rainna_la_grande_first_meeting.03.c_tooltip:0 "“嘛，蛮多的嘛。很有眼光哦。”"
 gts_rainna_la_grande_first_meeting.03.d:0 "支付£energy£60,000。"
 gts_rainna_la_grande_first_meeting.03.d_tooltip:0 "“哇哦，这么多~不愧是巨企啊。”"
 gts_rainna_la_grande_first_meeting.03.e:0 "支付£energy£600,000。"
 gts_rainna_la_grande_first_meeting.03.e_tooltip:0 "“这简令人难以想象……”"
 gts_rainna_la_grande_first_meeting.03.f:0 "想要我的能量币？用什么来交换？"
 gts_rainna_la_grande_first_meeting.03.f_tooltip:0 "“嘛，你的投资总是值的嘛，难道我不是你值得投资的吗？不是吗？”"
 gts_rainna_la_grande_first_meeting.04.title:0 "高的蕾恩娜！"
 gts_rainna_la_grande_first_meeting.04_random_1.desc:0 "信号那头沉默了片刻。\n\n“这个嘛……”\n\n她的声音带着几分刻意的含糊，像是在认真思考该怎么回避这个问题。\n\n“嘿嘿，保密~反正你们注意一下就好了。”\n\n她很快将话题带了回来：“所以……你们愿意接待我吗？”"
 gts_rainna_la_grande_first_meeting.04_random_2.desc:0 "“欸，这个嘛……”\n\n她的语气有些不自然，像是被问到了某个不太想回答的问题。\n\n“出门得弯腰的那种程度吧~要不然就顶到门框上了。”\n\n她轻描淡写地说着，仿佛这是一件再普通不过的小事。\n\n“反正……你们到时候就知道了嘛~所以，你们愿意接待我吗？”"
 gts_rainna_la_grande_first_meeting.04_random_3.desc:0 "“这是人家的隐私好不好？”\n\n她的语气带着几分撒娇式的不满。\n\n“再说了，这跟你们愿不愿意接待我有什么关系嘛~”\n\n她停顿了一下，补充道：\n\n“……欸，按照你们的标尺的话，大概有个几米高？反正不高的啦，你们注意一下就是咯。”"
 gts_rainna_la_grande_first_meeting.04_random_4.desc:0 "“我很矮的好不好……”\n\n她理直气壮地说道。\n\n“我才……反正我很矮的，比你们高不了多少。”\n\n她似乎意识到这个回答有些站不住脚，随即转移了话题：\n\n“好啦好啦，这种问题不重要嘛~你们愿不愿意让我来歇脚才是正事~”"
 gts_rainna_la_grande_first_meeting.04_random_5.desc:0 "“我不清楚欸。”\n\n她的语气听起来相当认真，像是在真正思考这个问题。\n\n“按照你们的标尺的话……大概3米？唔，好像比你们的平均身高高了那么一点点呢~”\n\n短暂的停顿。\n\n“……也许吧。反正你们到时候别太惊讶就好。所以，你们愿意接待我吗？”"
 gts_rainna_la_grande_first_meeting.04.a:0 "欢迎你来到我们的星球！"
 gts_rainna_la_grande_first_meeting.04.a_tooltip:0 "她对身高含糊其辞，事情真的有这么简单吗？"
 gts_rainna_la_grande_first_meeting.04.b:0 "还是算了吧，我们实在是不方便……"
 gts_rainna_la_grande_first_meeting.04.b_tooltip:0 "有时候，直觉的警惕是对的……"
 gts_rainna_la_grande_first_meeting.04.c:0 "不行。不行！"
 gts_rainna_la_grande_first_meeting.04.c_tooltip:0 "强硬地拒绝往往会换来更大的麻烦……"
 gts_rainna_la_grande_first_meeting.05.title:0 "疑点"
 gts_rainna_la_grande_first_meeting.05_random_1.desc:0 "“哦……原来你们认识我啊……”"
 gts_rainna_la_grande_first_meeting.05_random_2.desc:0 "“欸……你们从哪里听得我的名讳？”"
 gts_rainna_la_grande_first_meeting.05_random_3.desc:0 "“什么意思？还有另一个人也叫‘高的蕾恩娜’吗？”"
 gts_rainna_la_grande_first_meeting.05_random_4.desc:0 "“原来我的名声如此之大呢……。”"
 gts_rainna_la_grande_first_meeting.05.a:0 "没，没什么。"
 gts_rainna_la_grande_first_meeting.05.a_tooltip:0 "如此拙劣的掩饰令人起疑。"
 gts_rainna_la_grande_first_meeting.05.b:0 "好像在哪里听说过……"
 gts_rainna_la_grande_first_meeting.05.b_tooltip:0 "有时，含糊其辞只是欲盖弥彰。"
 gts_rainna_la_grande_first_meeting.05.c:0 "我们见过你的塑像。"
 gts_rainna_la_grande_first_meeting.05.c_tooltip:0 "祸从口出。"
 gts_rainna_la_grande_first_meeting.05.d:0 "我们考古到的文件中有提及……。"
 gts_rainna_la_grande_first_meeting.05.d_tooltip:0 "有些真相只应该被隐藏在心里。"
 gts_rainna_la_grande_first_meeting.06.title:0 "宣战陌生的少女"
 gts_rainna_la_grande_first_meeting.06_random_1.desc:0 "信号那头沉默了片刻。\n\n“哼……”\n\n“看来你们这是向我宣战了？”\n\n她的声音听起来不像是愤怒，倒更像是某种意外之后的确认。像是在核实一件难以置信的事实。\n\n“好吧，我明白了。”"
 gts_rainna_la_grande_first_meeting.06_random_2.desc:0 "信号那头传来了一声轻哼。\n\n“怎么，想要和我宣战？”\n\n她的语气带着几分不可置信，随即变得有些玩味。\n\n“……好，那就这样吧。”"
 gts_rainna_la_grande_first_meeting.06_random_3.desc:0 "“欸，怎么能这样嘛……”\n\n她的声音中带着几分委屈，但很快又平静了下来。\n\n“好嘛好嘛，我知道了。”\n\n信号就此中断。"
 gts_rainna_la_grande_first_meeting.06_random_4.desc:0 "信号那头什么声音都没有，沉默了很久。\n\n“……哼。”\n\n就这一个字，随即信号中断。\n\n不知为何，那短暂的沉默比任何言语都更令人不安。"
 gts_rainna_la_grande_first_meeting.06.a:0 "宣战！"
 gts_rainna_la_grande_first_meeting.07.title:0 "边检"
 gts_rainna_la_grande_first_meeting.07_random_1.desc:0 "“哦……这样啊……那请问你还愿意让我拜访你们的星球吗？”"
 gts_rainna_la_grande_first_meeting.07_random_2.desc:0 "“啊……那请问我还可以去歇脚吗？”"
 gts_rainna_la_grande_first_meeting.07_random_3.desc:0 "“原来是这样啊。那请问我还可以去你们的星球上踏足吗？”"
 gts_rainna_la_grande_first_meeting.07_random_4.desc:0 "“看来你们对我的身份有些怀疑，不过你们还是会邀请我的对吧？”"
 gts_rainna_la_grande_first_meeting.07_random_5.desc:0 "“原来你还知道这个，那请问我还可以来到你们的星球吗？”"
 gts_rainna_la_grande_first_meeting.07_random_6.desc:0 "“哎呀，人家的秘密暴露了。不过没关系，你们还会欢迎我的对吧？”"
 gts_rainna_la_grande_first_meeting.07_random_7.desc:0 "“唔……这都被你们知道了。所以……你们还允许我来吗？”"
 gts_rainna_la_grande_first_meeting.07.a:0 "当然可以！"
 gts_rainna_la_grande_first_meeting.07.a_tooltip:0 "有时候过分热情的邀请，会换来意想不到的“惊喜”……"
 gts_rainna_la_grande_first_meeting.07.a_tooltip_alter:0 "历史总是在重复，只是每次都会换个方式。"
 gts_rainna_la_grande_first_meeting.07.b:0 "还是……算了吧"
 gts_rainna_la_grande_first_meeting.07.b_tooltip:0 "谨慎点也许能多周旋一会……"
 gts_rainna_la_grande_first_meeting.07.c:0 "我们对你有所怀疑，拒绝你的到来。"
 gts_rainna_la_grande_first_meeting.07.c_tooltip:0 "怀疑是明智的，但直接说出来就不一定了……"
 gts_rainna_la_grande_first_meeting.07.d:0 "你的罪行罄竹难书，我们不会欢迎你的！"
 gts_rainna_la_grande_first_meeting.07.d_tooltip:0 "有些真相，说出来可能会很危险!"
 gts_rainna_la_grande_first_meeting.21.title:0 "初次见面——伟大的蕾恩娜"
 gts_rainna_la_grande_first_meeting.21.desc:0 "“哼哼哼……”\n\n通讯器的另一头传来了一声俏皮的冷笑。\n\n“看来你们这群小虫子真是愚蠢呢，居然就这样上了我的当了哦~”\n\n是“高的蕾恩娜”，只不过没想到她能够如此巨大。\n\n太空中，“高的蕾恩娜”的巨大身躯漂浮在这颗渺小的星球勉强，而这颗星球对她来说，也就只有瑜伽球般大小。她的身躯庞大无比，白皙的皮肤几乎全部暴露在宇宙中，只有一对黑色的胸罩与黑色胖次遮住了最重要的部位。她扭动着苗条的身躯，有些戏谑地说道。\n\n“唔，也许这是我们第一次见面吧。那就有请我来介绍一下我自己吧~哼哼……这可是你们的荣幸呢……”\n\n“我，伟大的蕾恩娜·德·让。我编的理由，什么天外来客、异乡的旅行者什么的都没有问题哦。我的确是来自这个宇宙之外的哦。而我扮演的则你们这个可怜宇宙的入侵者。嘛……其实也可以不这么说啦，也就是来玩一玩，玩够了就离开咯。”\n\n“嘛，所以你们的这颗星球可以用来怎么玩呢？”"
 gts_rainna_la_grande_first_meeting.21.a:0 "您……您好。"
 gts_rainna_la_grande_first_meeting.21.a_tooltip:0 "或许一个简单的问候能换来片刻的怜悯……"
 gts_rainna_la_grande_first_meeting.21.b:0 "不，请不要伤害我们。"
 gts_rainna_la_grande_first_meeting.21.b_tooltip:0 "祈求怜悯，还是在激发施虐欲？"
 gts_rainna_la_grande_first_meeting.21.c:0 "不，求求你……别"
 gts_rainna_la_grande_first_meeting.21.c_tooltip:0 "卑微的恳求往往换不来高贵的怜悯。"
 gts_rainna_la_grande_first_meeting.21.d:0 "请不要低估我们的军事威慑力！"
 gts_rainna_la_grande_first_meeting.21.d_tooltip:0 "有时候，反抗只会让玩耍变得更有趣。"
 gts_rainna_la_grande_first_meeting.21.e:0 "希望您愿意与我们做朋友。"
 gts_rainna_la_grande_first_meeting.21.e_tooltip:0 "友谊，在力量悬殊时是多么可笑的词……"
 gts_rainna_la_grande_first_meeting.21.f:0 "天降的女神，请您指引这些迷失的灵魂。"
 gts_rainna_la_grande_first_meeting.21.f_tooltip:0 "用神明的光环掩饰恶魔的本质，只是你的自我安慰吧。"
 gts_rainna_la_grande_first_meeting.21.g:0 "你不是在这里服刑的吗？"
 gts_rainna_la_grande_first_meeting.21.g_tooltip:0 "你能感受到她并不喜欢这个话题。"
 gts_rainna_la_grande_first_meeting.22.desc:0 "“哼哼……”\n\n一阵冰冷但是略感顽皮的笑声从通讯器的另一头传来。是一个属于少女的声音。\n\n “嘛，我猜你们一定以为我是‘高的蕾恩娜’吧。唔，不对哦……我可是‘伟大的蕾恩娜’哦。” \n\n她隐藏在黑暗中咯咯地笑着，就像是恶作剧得逞了一样。\n\n “嘿嘿，嘛，我也没想到你们就这样被我给欺骗了哦，就这样老老实实公开了你们的坐标，要不然我找你们还得一阵好找呢~真是谢谢你们哦。” \n\n伟大的蕾恩娜靠近了这颗行星。露出了她一丝不挂的巨大身躯。她全身雪白，娇嫩的皮肤看起来吹弹可破，光滑且柔软。就连撞在她的大腿上的小行星也在接触到她的皮肤的一瞬间粉碎。她的双手抓住如这颗星球一样巨大的双乳，有些玩味地扭动着身体。\n\n “嘛，看来我们的第一次见面就让你们如此惊讶呢……那是时候介绍一下我自己咯。我是伟大的蕾恩娜，来自另一个宇宙哦。至于我来的目的嘛……当然是为了玩啦~” \n\n“所以，应该先从那里开始玩呢？”"
 gts_rainna_la_grande_first_meeting.22.a:0 "您……好。"
 gts_rainna_la_grande_first_meeting.22.a_tooltip:0 "在巨大的恐惧面前，这样的礼貌还有意义吗？"
 gts_rainna_la_grande_first_meeting.22.b:0 "请不要伤害我们。"
 gts_rainna_la_grande_first_meeting.22.b_tooltip:0 "示弱只会让猎手更兴奋……"
 gts_rainna_la_grande_first_meeting.22.c:0 "求求你……不要伤害我们……"
 gts_rainna_la_grande_first_meeting.22.c_tooltip:0 "也许骄傲的巨娘会享受这种卑微的哀求。"
 gts_rainna_la_grande_first_meeting.22.d:0 "可恶的入侵者，你以为我们就怕了你吗？！"
 gts_rainna_la_grande_first_meeting.22.d_tooltip:0 "向女神宣战，是勇气还是愚蠢？"
 gts_rainna_la_grande_first_meeting.22.e:0 "您好，可以与我们做朋友吗？"
 gts_rainna_la_grande_first_meeting.22.e_tooltip:0 "谁会和蚂蚁做朋友呢？"
 gts_rainna_la_grande_first_meeting.22.f:0 "伟大的女神，您就是经书中的降临者吗？"
 gts_rainna_la_grande_first_meeting.22.f_tooltip:0 "崇拜她，真的能获得救赎吗？"
 gts_rainna_la_grande_first_meeting.22.g:0 "你不是在这里服刑的吗？"
 gts_rainna_la_grande_first_meeting.22.g_tooltip:0 "提醒困兽它的枷锁，会带来什么后果？"
 gts_rainna_la_grande_first_meeting.31.desc:0 "“啊啦啦~”\n\n通讯器的另一头传来一阵轻快却带着些许不悦的笑声。\n\n“没想到吧，还是找到你们了哦~”\n\n是“高的蕾恩娜”。只不过这次，她的语气中少了之前那份甜美，多了几分玩味的危险。\n\n太空中，“高的蕾恩娜”的巨大身影逐渐显现。她的身躯庞大得难以想象，而这颗星球在她眼中，不过是一颗柚子般大小的玩具。\n\n她身着黑色蕾丝胸罩和黑色蕾丝内裤，勾勒出完美的身体曲线，双腿上还套着一双白丝长筒袜。她慵懒地漂浮在太空中，用一种审视猎物的眼神打量着这颗渺小的星球。她的双腿横过来，洁白如玉的足底挡在了这颗星球的两侧。\n\n“不过呢，我本来是想要来友好访问的。”她歪着头，嘴角勾起一抹危险的笑容。\n\n“不过看来你们可一点都不友好呢……”\n\n她伸出纤细的手指，扰动着着这颗如同柚子般的星球，让它在太空中无助地旋转。\n\n“让我来介绍一下我自己吧~我是伟大的蕾恩娜·德·让。本来是一位热爱和平的旅行者……”\n\n她咯咯地笑着，显然很享受这种奇怪的快感。\n\n“不过你们拒绝我的时候，”她的声音突然变得低沉，“难道没有想过我有多么沮丧吗？”\n\n“所以，和平结束~”\n\n她兴奋地活动的足底，向星球靠拢，足底巨大的阴影很快遮蔽了原有的湛蓝色天空。"
 gts_rainna_la_grande_first_meeting.31.a:0 "我们并不弱小，并不会屈服于你。"
 gts_rainna_la_grande_first_meeting.31.a_tooltip:0 "在她的足底之间，反抗的声音能传达多远？"
 gts_rainna_la_grande_first_meeting.31.b:0 "对不起，我们不应该拒绝您的好意。"
 gts_rainna_la_grande_first_meeting.31.b_tooltip:0 "道歉能让她收起那双危险的玉足吗？"
 gts_rainna_la_grande_first_meeting.31.c:0 "至高无上的女神，请原谅我们的无礼。"
 gts_rainna_la_grande_first_meeting.31.c_tooltip:0 "神明会因为迟来的崇拜而仁慈吗？"
 gts_rainna_la_grande_first_meeting.31.d:0 "之前是我们的外交人员表达有误……"
 gts_rainna_la_grande_first_meeting.31.d_tooltip:0 "如此拙劣的借口真的能令她信服吗？"
 gts_rainna_la_grande_first_meeting.32.desc:0 "“哼~”\n\n通讯器中传来一声充满不满的轻哼。\n\n“本大小姐被怠慢这种事情可是很久都没有发生过了呢……”少女的声音中带着明显的不悦。“尤其是被你们这种渺小的低等生物的怠慢。”\n\n漆黑的太空中，一个庞大到难以理解的身影逐渐显现。\n\n一丝不挂的巨大少女漂浮在宇宙中，她那完美无瑕的雪白肌肤在星光下泛着如玉般的光泽。小行星撞击在她光滑的皮肤上，瞬间粉碎成尘埃，连一丝痕迹都没能留下。\n\n而对她而言，这颗曾经拒绝她的星球，不过是一颗葡萄般大小的小球，甚至比她的趾甲盖还要小。\n\n“不过也没关系的，毕竟你们的拒绝也没有什么用，不是么？”\n\n她的声音突然变得危险起来。她将脸庞凑过来，那双巨大的蓝色眼眸仔细地打量着它，就像在观察一个有趣的玩具。\n\n“自我介绍一下吧，我是伟大的蕾恩娜·德·让。本来是一位热爱和平的旅行者……前提是没有被某些小家伙怠慢。”\n\n她优雅地抬起一只脚，将那完美的足底展现在星球"面前"。雪白的足底光滑细腻，每一道掌纹都如同巨大的峡谷。她灵活地活动着足趾，那修长的趾头在星光下显得格外美丽。她张开脚趾靠近这颗星球，整颗星球悬浮在足趾旁边。\n\n“你们这颗脆弱的小星球如果被我轻轻一夹，大概会像真正的葡萄一样破碎掉吧？”"
 gts_rainna_la_grande_first_meeting.32.a:0 "我们不会屈服你趾间的强大的力量。"
 gts_rainna_la_grande_first_meeting.32.a_tooltip:0 "在她的足趾之间，整个文明不过是一粒尘埃……"
 gts_rainna_la_grande_first_meeting.32.b:0 "我们为对您的怠慢表示抱歉。"
 gts_rainna_la_grande_first_meeting.32.b_tooltip:0 "道歉真的能平息她的不满吗？"
 gts_rainna_la_grande_first_meeting.32.c:0 "至高无上的女神，请宽恕我们的无礼。"
 gts_rainna_la_grande_first_meeting.32.c_tooltip:0 "被足趾轻轻一捏，祈祷还来得及吗？"
 gts_rainna_la_grande_first_meeting.32.d:0 "对不起，是我们的信息传递有误……"
 gts_rainna_la_grande_first_meeting.32.d_tooltip:0 "在她股掌之间，借口还有意义吗？"
 gts_rainna_la_grande_first_meeting.41.title:0 "消失无踪"
 gts_rainna_la_grande_first_meeting.41.desc:0 "“呐呐呐呐呐，我收到钱了哦~”\n\n通讯器的另一头，传来蕾恩娜咯咯的笑声，听起来心情极好。\n\n“嘛，那么……”\n\n她的声音突然变得轻快，带着几分恶作剧得逞的愉悦。\n\n“拜拜咯~”\n\n信号就此中断。\n\n通讯器陷入了沉默。\n\n一秒，两秒，三秒……\n\n没有任何回音。\n\n投资方面的负责人面面相觑，没有人第一个开口说话。窗外的星空一片平静，那个自称旅行者的存在，连同所有的资金，就这样消失在了茫茫宇宙之中。\n\n“……”\n\n“她跑了。”"
 gts_rainna_la_grande_first_meeting.41_alter.desc:0 "“呐呐呐呐呐，我收到钱了哦。”\n\n通讯器的另一头传来蕾恩娜天真的笑声。\n\n“谢谢你们的投资呢~嘻嘻。”\n\n她停顿了一下，像是在享受这一刻。\n\n“那么，回头见，有好处我会分给你的哦~”\n\n“也许吧~”\n\n信号中断。\n\n没有人说话。所有人都盯着那台已经归于沉默的通讯器，等待着某个不会到来的后续。\n\n最终，有人轻声开口：\n\n“‘也许吧’是什么意思……”\n\n没有人回答这个问题。"
 gts_rainna_la_grande_first_meeting.41.a:0 "可恶，我的钱！"
 gts_rainna_la_grande_first_meeting.42.title:0 "计划未得逞"
 gts_rainna_la_grande_first_meeting.42.desc:0 "通讯器那头沉默了片刻。\n\n“用什么来交换……”\n\n蕾恩娜把这几个字重复了一遍，语气里带着几分不可置信。\n\n“欸欸欸——”\n\n她的声音突然拔高了一度，带着明显的委屈，“你们这群人是怎么回事嘛！我这么好的投资机会，你们居然还要讲条件？”\n\n“我就问你们，我值不值得投资？值不值得？”\n\n她停顿了一下，像是在等一个答案，随即又自顾自地说了下去。\n\n“嘛，算了算了，你们不投就算了~”\n\n语气转变得出奇地快，带着几分赌气的意味。\n\n“哼，你们以后会后悔的啦。”"
 gts_rainna_la_grande_first_meeting.42_alter.desc:0 "“……什么？”\n\n蕾恩娜的声音里带着一种被冒犯到的错愕，像是完全没料到会听到这个问题。\n\n“用。什么。来。交换。”\n\n她一个字一个字地重复着，语气越来越不对劲。\n\n“我是那种需要拿东西来换钱的人吗？嘛——”\n\n她发出一声拉得很长的抱怨，活像一个被否定了的孩子。\n\n“你们也太小气了吧！这点小钱都要斤斤计较的，真是的……”\n\n又是一阵沉默，然后她的声音重新响起，依然带着气鼓鼓的尾音：\n\n“哼，那就算了啦。你们这群抠门的家伙。”\n\n“……哼，你等着！”"
 gts_rainna_la_grande_first_meeting.42.a:0 "她不值得投资。"
 gts_rainna_la_grande_first_meeting.42.b:0 "也许她是一个骗子呢……"
 gts_rainna_la_grande_first_meeting.211.title:0 "踩踩踩"
 gts_rainna_la_grande_first_meeting.211.desc:0 "“唔，你们也好啊~嘿嘿嘿……”\n\n信号的另一头，能够听到蕾恩娜天真的笑声。\n\n“就是不知道在你们的星球表面踩一脚，你们还好吗？真的好奇呢……”\n\n于是，蕾恩娜将她的足底对准这颗星球，随时准备找个位置踩下去。\n\n与此同时，地面上的人们可以清晰地看到天空中的蕾恩娜巨大的脸庞上露出可怖的笑容，尽管他们听不清楚蕾恩娜在说什么，紧张的氛围迎上了每一个人的心头。\n\n平时空旷的街道被满载逃命的人的车辆堵塞得水泄不通，每一辆想要远离蕾恩娜的汽车都只得停在原地动弹不得。鸣笛的声音此起彼伏，却没有办法给逃生带来一点希望。\n\n街道上顿时陷入一片混乱。人们仰望着天空中那张巨大的面庞，有的瘫坐在地，有的拼命奔逃，还有的则呆立原地，仿佛被恐惧冻结。警报声划破寂静的天际，但在这样的存在面前，这些声响显得如此苍白无力。\n\n各地的应急系统相继启动。避难警报声在每个街区回荡，紧急避难所的标识不断闪烁。政府大楼前，军队和警察正在紧急部署，却没人知道该如何应对这样的威胁。新闻直播画面中，各个城市的天空都能看到那张俯视众生的巨脸，那双含着笑意的眼睛，仿佛在注视着一群渺小的低等生命。\n\n城市中心，一些虔诚的信徒跪地祈祷，将这当作神明的显现。商业区里，人们抢购物资，争先恐后地囤积必需品。医院和避难所门前排起长队，家长们紧紧抱着自己的孩子。街道上四处都是被遗弃的车辆，它们的报警器此起彼伏地响着，更增添了几分末日般的氛围。\n\n而在这片混乱之中，蕾恩娜的笑声依然通过通讯系统传来，她似乎很享受这场由她导演的混乱。她的巨足依然悬在天空中，就像一片巨大的阴影，笼罩着整个星球，让所有人都在等待着那转瞬即至的毁灭。\n\n“啊啦~你们好像很害怕的样子呢？放心啦，我只是想找个地方站一下而已……”她的声音中带着天真的残酷，“不过，这么多人在逃命的样子，看起来还真有趣呢……”\n\n蕾恩娜陶醉在自己的宏伟之中自言自语……\n\n“唔，看来这颗小星球上面还是有模有样的嘛，究竟踩在哪里好呢？”"
 gts_rainna_la_grande_first_meeting.211.a:0 "等一下！"
 gts_rainna_la_grande_first_meeting.211.a_tooltip:0 "我还不想……"
 gts_rainna_la_grande_first_meeting.211.b:0 "不，也许我们可以谈一谈！"
 gts_rainna_la_grande_first_meeting.211.b_tooltip:0 "也许吧……"
 gts_rainna_la_grande_first_meeting.212.desc:0 "“哼哼……”\n\n信号的另一头传来蕾恩娜抑制不住的轻笑，那声音中既有天真与欢快，又暗含着某种危险的期待。\n\n“嘛……既然你们恭恭敬敬地提出了请求，那……满足我一点小小的要求也是不过分的吧……”\n\n她拖长了语调，声音中充满着顽皮的期待，似乎有什么有趣的点子。\n\n“嘿嘿……那么，我们做一个公平的交易吧~”\n\n黑暗的太空中，蕾恩娜的身影突然显现。银河的星光为她白皙的肌肤镀上一层梦幻的光晕，衬托得她那巨大的身躯更加不真实。\n\n“很简单哦，我只想在你们的星球上留下一个小小的足印而已。作为回报，我保证不会再伤害你们~”\n\n她巨大的足底突然覆盖了天空，即将压下来。\n\n话音未落，她的巨足就悄然移动到了行星上空。那雪白的足底几乎遮蔽了整片天空，让整个大陆陷入了不自然的黑暗。足底的每一道纹路都清晰可见，比城市的街道还要宽阔。\n\n“嘛，这个交易蛮划算的，不是吗？”\n\n在这片可怖的阴影下，地面上的一切都显得如此渺小。人们仰望着天空，看着那个足以轻易毁灭他们的存在，正在用温柔的语气谈论着“公平交易”。\n\n“嘛……真是一项公平的提议呢……”"
 gts_rainna_la_grande_first_meeting.214.desc:0 "“欸——这是要宣战了吗？难不成……”\n\n蕾恩娜优雅地抬起修长的腿，弯曲足弓，将她白皙的足趾展示在这颗星球面前。每一个轻微的动作都让大气层泛起涟漪，那完美的足型投下的阴影足以笼罩一片大陆。\n\n“难不成我想要在这颗小星球上留下标记的计划暴露了？唔！那可真的是太不好了……”\n\n她灵巧地活动着足趾，这看似随意的动作却在大气中掀起一阵温和的飓风，横扫过整片大陆。城市的尖塔在这阵气流中摇摇欲坠，树木纷纷弯折，海面掀起滔天巨浪。\n\n“那……就将计就计吧~”"
 gts_rainna_la_grande_first_meeting.214.a:0 "不！停战、停战！"
 gts_rainna_la_grande_first_meeting.214.a_tooltip:0 "成功激起了她的欲望，真的能停下来吗？"
 gts_rainna_la_grande_first_meeting.214.b:0 "可恶，给我上！"
 gts_rainna_la_grande_first_meeting.214.b_tooltip:0 "蝼蚁般的军队面对如此悬殊的对手无异于飞蛾扑火……"
 gts_rainna_la_grande_first_meeting.215.desc:0 "“啊啦啦~当然可以......”\n\n蕾恩娜咯咯地笑着，那银铃般的笑声在通讯器中回荡。她似乎对刚才自己不经意间将大气搅得一团糟毫无察觉，或者说，她压根就不在意。她那巨大的面庞凑近这颗渺小的行星，湖泊般清澈的蓝色眼眸闪烁着好奇的光芒，将这个星球的每一个细节都尽收眼底。\n\n每当她轻轻眨眼，那如同城市般巨大的睫毛便会扰动大气层，掀起持续不断的狂风。地面上的树木被吹得东倒西歪，海面上巨浪翻涌，但她似乎完全没有意识到自己的存在本身就是一场灾难。\n\n“嘿嘿嘿……”\n\n她优雅地蜷起修长的双腿，用纤细的手指轻柔地抚摸着自己微微攒动的足趾。那雪白的足底在星光下泛着柔和的光泽，每一道纹路都如同山谷般清晰。她看起来心情极好，笑眯眯地歪着脑袋，就像一个得到了新玩具的孩子。\n\n“你们说……”她的声音中带着期待和些许狡黠，“我的足趾漂亮吗？”\n\n她将足底托在双手上，在太空中轻轻地扭动着那十根足趾。每一根足趾的活动都带起微妙的气流变化，让地面上的气象观测站陷入混乱。她似乎在等待着什么出乎意料的回应，那双清澈的眼睛中闪烁着危险的光芒。\n\n“我倒是很好奇……”她俯视着这颗星球，声音突然变得轻柔而危险。“这个星球踩起来会是什么样的感觉呢……”\n\n她的足底缓缓从手中抬起，在大气层外划出一道优美的弧线。那完美的足型投下的阴影如同一片移动的黑暗，扫过一座又一座城市。每当阴影经过，街道上的人们都会惊恐地仰望天空，看着那个随时可能落下的“审判”。\n\n“作为朋友……”她的声音中带着天真的残酷，“你们应该不介意让我试试吧？”\n\n空气中弥漫着令人窒息的紧张感。所有人都意识到，这个看似友善的提议，实际上根本不是一个可以拒绝的选择。"
 gts_rainna_la_grande_first_meeting.215.a:0 "我们可商量……"
 gts_rainna_la_grande_first_meeting.215.a_tooltip:0 "拿出可以谈判的所有筹码，能比得上她的一根足趾吗？"
 gts_rainna_la_grande_first_meeting.215.b:0 "等一下！朋友……"
 gts_rainna_la_grande_first_meeting.215.b_tooltip:0 "怠慢了你的新朋友，她会很生气的……"
 gts_rainna_la_grande_first_meeting.216.desc:0 "听到这个回答，蕾恩娜缓缓闭上了那双明亮的眼眸。她的面容在星光下显得格外柔和，嘴角浮现出一抹优雅而满意的微笑。她那充满灵性的巨大身躯在太空中轻轻舒展，仿佛在用整个存在去感受来自这颗渺小星球上无数生命的气息。\n\n这个出乎意料的回答，显然让她心情愉悦。\n\n片刻后，她睁开双眼，那湖泊般清澈的蓝色瞳孔中闪烁着满足的光芒。她的双臂平静地交叉在胸前，就像是在摆出某种无比神圣的姿态。她平静地凝视着这个微小的世界，声音变得轻柔而庄重。\n\n“看来这个宇宙的一角，居然有对我的崇拜……”\n\n她试图模仿那些古老典籍中记载的神明形象，摆出一副庄严肃穆的姿态。但她声音中那按捺不住的顽皮和兴奋。\n\n“那么，作为你们自古以来……” 她故意停顿了一下，俏皮地眨了眨眼，“不，也许是新晋的至高之神，我欣然接受你们卑微的崇拜。”\n\n她优雅地调整着姿势，长发在无重力的太空中如瀑布般飘散。\n\n“而作为回应……”她的声音突然变得神秘而期待，“身为神明，若不展示一下我的伟大，岂不是有些遗憾呢……”\n\n说着，她屈起修长的左腿，将那如玉般洁白无瑕的足底抬至面前。透过朦胧的大气层，那完美的足型投下了一片遮天蔽日的阴影，笼罩了大半个星球。整个世界瞬间陷入黑暗，仿佛夜幕突然降临。\n\n“让我想想……”她的声音透过通讯器传来，带着几分戏谑，“神明该如何向信徒展示恩泽呢？”\n\n她的足趾在空中轻轻晃动，每一个微小的动作都让地面上的人们心跳加速。那遮蔽天空的足底如同一把悬在头顶的重锤，随时可能落下。"
 gts_rainna_la_grande_first_meeting.216.a:0 "我们愿意接受神明的恩泽……"
 gts_rainna_la_grande_first_meeting.216.a_tooltip:0 "顺从神明的意志，或许能换来些许怜悯……"
 gts_rainna_la_grande_first_meeting.216.b:0 "请女神降下您的神迹吧！"
 gts_rainna_la_grande_first_meeting.216.b_tooltip:0 "神当然愿意降下更多神迹！"
 gts_rainna_la_grande_first_meeting.217.desc:0 ""
 gts_rainna_la_grande_first_meeting.221.title:0 "戳戳"
 gts_rainna_la_grande_first_meeting.221.desc:0 "“嘿嘿嘿……你们也好哦~嘛，你们一定很期待我的到来吧……”\n\n蕾恩娜咯咯地笑着，像是一个顽皮的孩子。她那巨大的身躯在太空中优雅地漂浮，长发在真空中无重力地飘散，如同一片星云般绚丽。\n\n“你们这群渺小的生命，肯定很期待我降下的恩泽吧~”\n\n她白皙修长的手指在行星上空缓缓伸展，如同一座横亘天际的巨塔。指尖的粉色指甲在阳光下闪烁着微光，映照在大气层上，给整片天空都染上了诡异的粉红色调。\n\n“嗯……选择哪里比较好呢？”\n\n她的手指在大气层外轻轻划动，带起一片片云层的扰动。地面上，人们惊恐地望着天空中那巨大的手指投下的阴影。\n\n紧急避难警报的尖啸声划破天际，在每个街区的广播喇叭中回荡。这原本为了应对自然灾害设计的系统，此刻显得如此苍白而无助。街道上的电子显示屏不断闪烁着红色的警告标识，却没人知道该往哪里逃。\n\n城市陷入一片混乱。中央广场上，一群虔诚的信徒跪倒在地，高举双手祈祷，将这当作神明的显现。他们的祷告声与哭泣声交织在一起，却被周围此起彼伏的尖叫声淹没。街道上，人们争相涌向地铁站和地下避难所，推搡中不时传来哭声与怒骂。更多的人则像是被施了定身咒一般呆立在原地，仰望着天空中那不可思议的巨手，瞳孔中倒映着末日般的景象。\n\n“你们看起来很害怕嘛……不过不用担心啦，我只是想稍微……”\n\n“玩一玩而已啦……”"
 gts_rainna_la_grande_first_meeting.221.a:0 "请不要！"
 gts_rainna_la_grande_first_meeting.221.a_tooltip:0 "快停下来……"
 gts_rainna_la_grande_first_meeting.221.b:0 "等一下，我们可以谈谈……"
 gts_rainna_la_grande_first_meeting.221.b_tooltip:0 "真的可以吗……"
 gts_rainna_la_grande_first_meeting.222.desc:0 "“嘛……”\n\n蕾恩娜的声音中带着玩味的笑意。在漆黑的太空中，她那巨大的身影突然显现，如同一座移动的星云般壮丽而可怕。星光在她白皙的肌肤上跳跃，为这个可怖的场景增添了几分诡异的美感。\n\n“哼哼，既然你们不想让我伤害你们……”\n\n她歪着头，在朦胧的云层背后露出一个天真而危险的笑容。\n\n“那想必是有什么厉害的武器藏着没让我看到吧~”\n\n通讯器中传来她轻快的声音，却让每个听到的人都背脊发凉。她的身体优雅地在太空中旋转了一周，像是在水中嬉戏的少女，只是她的每个动作都让整个星球的人心惊胆战。\n\n“哦？你们不会……只会示弱这一招吧？”\n\n她的声音变得危险，故意拖长了语调。\n\n“那我为什么要在意你们的请求呢？”\n\n蕾恩娜伸出一根修长的手指，在大气层外灵巧地画着圈，寻找着落点。每一个动作都优雅得像是在跳舞，却让地面上的军事指挥官们冷汗直流。他们引以为傲的防御系统在她面前，就像是玩具一般可笑。"
 gts_rainna_la_grande_first_meeting.224.desc:0 "“呀呀呀……你们这群小家伙，居然是这样欢迎访客的，服务态度真差！”\n\n蕾恩娜的表情从天真转为顽皮，那变化让人不寒而栗。她俯下身，闭起左眼，将右眼凑近行星表面。那巨大的淡蓝色瞳孔取代了整片天空，如同一颗悬浮在天际的巨大蓝宝石。她每一次眨眼，都让整个大气层剧烈震颤，美丽的云层在这冲击下支离破碎，化作混乱的气流席卷着城市表面。\n\n“欸——我怎么没有看到你们的军队呢？难道是……你们是跟我开玩笑的？”\n\n她伸出一根修长的食指，在那苍白的指影下，整个星球的军队正在集结。装甲车的履带在地面碾出沉重的轰鸣，战机编队划过天际，导弹发射井缓缓开启。但这一切在她指尖的阴影中，显得如此微不足道。\n\n“还是说……你们的军队所在跟我开玩笑呢？”\n\n“嘛，我可不喜欢玩笑~”"
 gts_rainna_la_grande_first_meeting.225.desc:0 "“啊咧啊咧，乱攀关系可不好哦~我蕾恩娜也不是和谁都交朋友的哦……”\n\n蕾恩娜将巨大的脸庞贴近这颗渺小的星球，那双湖泊般清澈的眼眸中闪烁着玩味的光芒。她仔细打量着这个微型世界，就像孩童在观察玻璃球里的微观景致。她的长发在真空中无重力地飘散，如同一片梦幻的星云，每一缕发丝的轻微摆动都在大气层中激起涟漪。\n\n她那如湖面般平静的瞳孔映照出半个世界的景象——密集的城市群、蜿蜒的河流、连绵的山脉，一切都是附着在大陆之上的尘埃。每当她轻轻眨眼，那如同城市般巨大的睫毛便会扰动整个大气层，地面随之剧烈震颤。建筑物在震动中摇摇欲坠，玻璃纷纷碎裂，警报声此起彼伏。\n\n她的每一次呼吸都牵动着整个星球的命运，让所有人都感到一阵窒息般的压迫。那些平铺在星球表面如同苔藓般渺小的细节——城市、道路、港口——都在她的气息下剧烈颤抖，仿佛下一秒海浪就会淹没陆地，摩天大楼就会被连根拔起。\n\n如此悬殊的实力差距让她感到愉悦，嘴角不由自主地上扬。\n\n“嘛，不过……”她的声音突然变得俏皮，“也不是不可以哦~”\n\n她优雅地伸出一根修长的食指，那根指尖在太空中划出优美的弧线。当它悬停在大陆上方时，就像一座从天而降的巨柱，遮天蔽日。指尖投下的阴影足以覆盖半个大陆，让那片原本繁华的首都区瞬间陷入漆黑。\n\n街道上的灯光在这突如其来的黑暗中显得格外微弱，如同萤火虫般闪烁。人们仰望天空，看到的只是那遮蔽一切的巨大指尖。它悬在那里，静静地，却让每个人都感受到了死亡的阴影。\n\n她歪着头，指尖在空中轻轻晃动，声音中带着危险的甜蜜。“突然好像在这颗星球上做一个记号，你们不会太在意吧？”"
 gts_rainna_la_grande_first_meeting.226.desc:0 "听到这个回答，蕾恩娜微微一愣，那双清澈的蓝色眼眸中闪过一丝意外。她半眯起眼睛，饶有兴致地凝视着这颗渺小的星球。\n\n“你们这群小生命崇拜我的多了去了……”她小声嘀咕着，声音中带着些许自得。然而这嘀咕却如同雷鸣般在整个大气层中回荡，震耳欲聋的音波让地面剧烈震颤。“没想到今天还能遇到知道我名号的呢……”\n\n她的声音中带着一丝惊喜，巨大的面庞更加贴近星球，仔细打量着这个微小的世界。在她眼中，密集的城市群不过是一片片细小的光点，而那些高耸的建筑，也不过是地表上微不足道的凸起。\n\n“不过……”她歪着头，长发在太空中优雅地飘动。“这么小的星球，想让我真正降临，恐怕不太现实吧？”\n\n她伸出修长白皙的食指，优雅地轻抵在自己粉嫩的上唇，做出思考的姿态。那个动作如此优美，却让所有目睹这一幕的人心跳骤停——因为那根手指，足以轻易毁灭一切。\n\n“嘛……”她的眼神突然落在那片繁华的大陆上，嘴角勾起一抹顽皮的笑容，“这样吧。”\n\n她的食指从唇边移开，在太空中划出一道优美的弧线。指尖悬停在那片大陆的上方，投下了遮天蔽日的阴影。\n\n“用我的一根手指，稍微打个招呼，应该也算是降临了吧~”\n\n她的声音中充满危险的诱惑。那根食指在大陆上空轻轻晃动，就像是在挑选最完美的落点。每一次微小的移动，都让阴影扫过一座又一座城市,让无数人陷入绝望的等待。\n\n“你们说……”她的眼中闪烁着危险的光芒，“我应该轻轻地碰一下呢，还是稍微用点力呢？”\n\n她的指尖开始缓缓下降，巨大的威压逼近地表。\n\n“作为信徒……”她轻声低语，声音却震动着整个世界，“你们应该很欢迎神明的触碰吧？”"
 gts_rainna_la_grande_first_meeting.227.desc:0 ""
 gts_rainna_la_grande_first_meeting.311.title:0 "足底夹夹"
 gts_rainna_la_grande_first_meeting.311.desc:0 "“嘛——看来是遇到对手了呢~”\n\n蕾恩娜兴奋地屈起足趾，整个身体都激动得微微颤抖。她那双湖泊般的眼眸中闪烁着期待的光芒。\n\n“小家伙们……”\n\n她将巨大的面庞凑近这颗被足底包围的星球，脸上流露出狡黠而愉悦的笑容。她伸出纤细的手指，轻柔地从自己光滑的足底划过，那个挑逗性的触碰让足底被丝袜包裹的肌肤微微颤动，仿佛在期待着即将到来的“游戏”。\n\n“你们可是成功激起了我的兴趣呢~”\n\n与此同时，星球表面已经陷入一片混乱。\n\n全球各地的军事基地同时启动，导弹发射井打开，战机编队呼啸升空，激光武器对准天空。这是[Owner.GetSpeciesName]文明最后的尊严之战——即便敌人是如此不可战胜的存在。\n\n无数的导弹拖着火焰的尾迹冲向天际，在大气层边缘爆炸，试图阻挡两边那逼近的足底。激光束如同光之长矛刺向那雪白的丝袜。战舰齐射的能量炮在足底表面绽放出璀璨的光芒。\n\n但这一切，对蕾恩娜来说……\n\n“嗯……好细腻的攻击，感受到了呢~”\n\n她轻声呢喃着，声音中带着满足的愉悦。那些足以毁灭城市的武器，在她光滑细腻的白丝足底上，不过是温柔的按摩。\n\n“只不过这种小小的瘙痒真是令人舒适呢……”\n\n她咯咯地笑着，微微晃动足趾，让更多的攻击落在足底最敏感的部位。每一次爆炸都像是在挠痒痒，让她忍不住想要更多的“饱和打击”。\n\n“那作为回报……”她的声音突然变得危险，“我可要反击咯~”\n\n两只巨大的足底开始压下。\n\n首先触及星球表面的是足弓的边缘。那丝袜贴合着的柔软而充满弹性的肌肤轻轻贴在大气层上，如同一对温暖的天幕。接触的瞬间，整个星球都感受到了难以承受的压力。\n\n足底继续下沉，开始接触地表。\n\n最先感受到压力的是地球两边最大的大陆。板块在巨大的压力下开始崩裂，发出震耳欲聋的轰鸣。海洋被挤压，掀起前所未有的超级海啸，高达数千米的巨浪横扫其他残余大陆。\n\n“阿啦~看来这颗星球要撑不住了呢……”\n\n蕾恩娜满意地低语。她能清楚地感受到足底下那个微小世界的每一次挣扎。\n\n足底继续加压。\n\n星球表面开始出现第一道裂缝。那条裂缝从赤道附近的海洋中绽放，如同玻璃上的裂纹般迅速蔓延，无数的建筑群伴随着碎裂的土地调入缝隙之中。裂缝的宽度足以吞没整座城市，深度直达地壳深处。炽热的岩浆从裂缝中喷涌而出，在足底的压迫下形成诡异的火焰喷泉。\n\n紧接着是第二道、第三道……\n\n无数条巨大的裂缝如同蛛网般在星球表面蔓延。大陆板块在这难以想象的压力下开始断裂、错位。山脉崩塌，平原下沉，海底隆起。整个星球的地质结构在这温柔且致命的夹击中走向崩溃。\n\n“嘻嘻，这足底被摩擦得痒痒的，真是舒服呢~”\n\n蕾恩娜愉快地说着，轻轻蹭动足底。这个看似温柔的动作，却让星球表面的破坏更加剧烈。足底的摩擦带走了地表的一切——城市、森林、海洋——都在这柔软的肌肤下化为齑粉。\n\n碎片从裂缝中迸溅而出。那些是被挤压出来的地壳碎块、蒸发的海水、以及无数文明的残骸。\n\n蕾恩娜满意地笑着，她的足底继续缓慢而坚定地收紧……"
 gts_rainna_la_grande_first_meeting.311.a:0 "反击，反击！"
 gts_rainna_la_grande_first_meeting.311.a_tooltip:0 "以卵击石，不过是给她提供更多的乐趣……"
 gts_rainna_la_grande_first_meeting.311.b:0 "不，我们投降！"
 gts_rainna_la_grande_first_meeting.311.b_tooltip:0 "此刻的尊严，还值得在意吗……"
 gts_rainna_la_grande_first_meeting.312.title:0 "赔偿事宜"
 gts_rainna_la_grande_first_meeting.312.desc:0 "“嗯……不错哦~”\n\n蕾恩娜的声音突然变得柔和，那双巨大的眼眸眯成了月牙状。她脸上浮现出少女般天真无邪的笑容，那甜美的笑容好似可以化解一切矛盾。\n\n她慵懒地伸了个懒腰，那完美的身体曲线在星光下显得格外诱人。她看起来心情确实好了不少。\n\n“我能看出来你们是真心诚意的哦……”她歪着头，声音中带着几分满意，“这样才对嘛~”\n\n然而，她的双足并没有离开。那两只洁白如玉的白丝足底依然悬浮在星球两侧，缓缓地、不紧不慢地接近着。巨大的阴影笼罩了位于星球两端的整片大陆，让数十亿人依然生活在那片不祥的阴影之下。\n\n白丝覆盖着她的足底，在星光下泛着柔和的光泽，如同两面巨大的墙壁在缓慢合拢。从地面望去，天空已经被那雪白的丝袜占据了大半。\n\n“不过呢……”她的声音中带上了一丝狡黠。\n\n她伸出一根手指，轻轻点了点自己粉嫩的嘴唇。\n\n“既然你们如此诚意地道歉——那么，你们想好怎么补偿我了吗？”\n\n她的足底距离星球表面越来越近了。虽然还没有真正接触，但那种压迫感已经让整个星球的大气层开始不安地躁动。\n\n“嘛，如果你们没有想好的话……”她咯咯地笑着，“我这里可是有很多想法的哦~”\n\n她的足趾灵活地活动着，每一次轻微的动作都让阴影在地表上晃动，提醒着所有人，她随时可以将这双美丽的足底压下来。\n\n“赶快想想哦~”她的声音变得催促起来，带着一丝不耐烦，“我对你们的补偿的期望可等不起呢。而且……”\n\n她俯下身，那张巨大的面庞几乎贴近星球。\n\n“要有诚意哦~如果让我失望的话……”她微微笑着，轻轻晃动了一下足底，“我可能就会忍不住……稍微用一点点力了呢~”\n\n空气仿佛凝固了。\n\n而蕾恩娜，就这样托着下巴，饶有兴致地等待着，像是在等待一场有趣的表演。她的足底依然悬在那里，随时准备着……"
