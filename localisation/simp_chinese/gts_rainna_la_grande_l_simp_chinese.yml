 gts_rainna_la_grande_arch.05.name:0 "狂怒，悲泣"
 gts_rainna_la_grande_arch.05_1_micro.desc:0 "信号在经历了漫长的传递之后，终于来到了最后一段内容。\n\n与之前那些枯燥的历史记录不同，这最后一段文字的语气发生了根本性的转变——不再是史官的笔触，而是某种更古老、更沉重的东西，像是祭文，又像是某种末日预言：\n\n“当她降临之时，光芒尽数熄灭。\n\n当她到来之时，一切皆遭湮灭。\n\n她漫步于星球之上，万物在她的足下颤抖，山河在她的指间破碎。所谓的城市、所谓的文明、所谓的历史，在她眼中不过是脚下一片可以随意踩踏的尘埃。\n\n审判降临，有罪之人在弹指一挥间被灾难裹挟，走向毁灭。\n\n最终，一切归于沉寂。”\n\n信号戛然而止。\n\n解码器的屏幕上只剩下一片空白的噪声，再也没有任何新的内容传出。\n\n科研团队在那片沉默中待了很长时间，没有人开口说话。最终，领队合上了记录本。\n\n这颗星球已经没有什么值得继续探索的了。"
 gts_rainna_la_grande_arch.05_2_micro_1.desc:0 "经过漫长的语言学分析，研究团队最终将那个反复出现的词“Domina”翻译为“母亲”。\n\n随着这个翻译的确立，那些此前无法理解的信号内容开始变得清晰起来。信号的最后一段，是这样的：\n\n“母亲，母亲……请问您还在吗？\n\n我们还可以像从前一样，在您的花园里流连忘返吗？还可以在艳丽的花海之中，为您端上精致的茶点，听您讲述那些遥远星球上的故事吗？\n\n母亲，您在哪里？\n\n那些漫长的岁月，我以为我早已习惯了孤独。可是越到后来，我才越明白，我所习惯的，不过是将思念压进了每一个无人的夜晚，将它们叠起来，放在某个角落，告诉自己这不重要。\n\n母亲……我亲爱的母亲。\n\n我再也不想孤独下去了。”\n\n信号戛然而止。\n\n解码器的屏幕陷入了沉默的噪声，再也没有任何新的内容传出。\n\n科研团队在那片沉默中待了很长时间。没有人动，没有人说话，只是静静地看着屏幕上那片平静的噪声，各自想着什么。\n\n这颗星球已经没有什么值得继续探索的了。"
 gts_rainna_la_grande_arch.05_2_micro_2.desc:0 "经过漫长的语言学分析，研究团队最终将那个反复出现的词“Domina”翻译为“主人”。\n\n随着这个翻译的确立，那些此前无法理解的信号内容开始变得清晰起来。信号的最后一段，是这样的：\n\n“主人，主人……请问您还在吗？\n\n我们还可以像从前一样，在您的花园里流连忘返吗？还可以在艳丽的花海之中，为您端上精致的茶点，听您讲述那些遥远星球上的故事吗？\n\n主人，您在哪里？\n\n那些漫长的岁月，我以为我早已习惯了孤独。可是越到后来，我才越明白，我所习惯的，不过是将思念压进了每一个无人的夜晚，将它们叠起来，放在某个角落，告诉自己这不重要。\n\n主人……我尊敬的主人。\n\n我再也不想孤独下去了。”\n\n信号戛然而止。\n\n解码器的屏幕陷入了沉默的噪声，再也没有任何新的内容传出。\n\n科研团队在那片沉默中待了很长时间。没有人动，没有人说话，只是静静地看着屏幕上那片平静的噪声，各自想着什么。\n\n这颗星球已经没有什么值得继续探索的了。"
 gts_rainna_la_grande_arch.05_1_titan.desc:0 "那名科研人员的描述断断续续，声音越来越轻：\n\n“那个女孩……她很优雅。\n\n她站在这颗星球的上方，俯视着所有人。没有愤怒，没有憎恨，甚至没有任何特别的情绪——她只是站在那里，就像一个人站在蚂蚁窝旁边一样，随意地、漫不经心地，迈出了她的脚步。\n\n城市在她脚下消失了。人们在她脚下消失了。一切都消失了。\n\n而她……她只是继续走着。像是在散步，像是在欣赏什么。\n\n最后……最后已经没有人了。只剩下她一个人，在一颗空旷的星球上，独自……”\n\n她的声音彻底消失了。\n\n同事们转过头，发现她已经沉沉睡去，呼吸平稳而深沉，像是陷入了某种极深的昏睡。\n\n反复呼唤无济于事，医疗检查显示一切正常，她只是睡着了。\n\n当她最终醒来，已经是数小时之后的事了。她坐起身，茫然地环顾四周，对自己曾经说过的一切毫无记忆。\n\n科研团队将记录交给她看，她只是安静地看了很久，然后把那张纸叠起来，放进了口袋里，什么都没有说。\n\n这颗星球已经没有什么值得继续探索的了。"
 gts_rainna_la_grande_arch.05_2_titan_1.desc:0 "经过漫长的语言学分析，研究团队最终将那个遍布整颗星球的词“Domina”翻译为“母亲”。\n\n有了这个翻译作为基础，科研团队重新审视了此前采集的所有文字样本，并从中筛选出了一批相对完整的片段。这些片段分布在星球各处，有的刻在山壁上，有的写在干涸的湖床旁，有的则密密麻麻地覆盖了整片平原，像是某人在漫长的孤独中反复书写同样的话，直到写满了所有可以书写的地方：\n\n“母亲，请问您还在吗？”\n\n“母亲，我们还可以像从前一样去您的花园吗？还记得吗，您最喜欢那片开着蓝色花朵的角落，还总是让我把茶点放在那块大石头上……”\n\n“母亲，您还有什么想要我做的吗？无论什么都好，您只管说。”\n\n“母亲，这里已经没有什么人了。我走遍了每一个角落，都是空的。我一个人在这里，已经很久很久了。”\n\n“尊敬的母亲，我以为孤独是可以习惯的事情。可是我错了。”\n\n“母亲……我再也不想孤独下去了。”\n\n与那些随意涂鸦的图案和潦草的文字相比，这些片段的笔触出奇地工整，像是某人在极度克制之下，一笔一划地将每一个字写得清晰而端正。\n\n也许她知道，有一天会有人读到这些字。\n\n也许她只是需要一个倾诉的地方。\n\n科研团队将所有片段整理成册，在最后一页写下了这次考古任务的结论。\n\n这颗星球已经没有什么值得继续探索的了。"
 gts_rainna_la_grande_arch.05_2_titan_2.desc:0 "经过漫长的语言学分析，研究团队最终将那个遍布整颗星球的词"Domina"翻译为"主人"。\n\n有了这个翻译作为基础，科研团队重新审视了此前采集的所有文字样本，并从中筛选出了一批相对完整的片段。这些片段分布在星球各处，有的刻在山壁上，有的写在干涸的湖床旁，有的则密密麻麻地覆盖了整片平原，像是某人在漫长的孤独中反复书写同样的话，直到写满了所有可以书写的地方：\n\n“主人，请问您还在吗？”\n\n“主人，我们还可以像从前一样去您的花园吗？还记得吗，您最喜欢那片开着蓝色花朵的角落，还总是让我把茶点放在那块大石头上……”\n\n“主人，您还有什么想要我做的吗？无论什么都好，您只管说。”\n\n“主人，这里已经没有什么人了。我走遍了每一个角落，都是空的。我一个人在这里，已经很久很久了。”\n\n“尊敬的主人，我以为孤独是可以习惯的事情。可是我错了。”\n\n“主人……我再也不想孤独下去了。”\n\n与那些随意涂鸦的图案和潦草的文字相比，这些片段的笔触出奇地工整，像是某人在极度克制之下，一笔一划地将每一个字写得清晰而端正。\n\n也许她知道，有一天会有人读到这些字。\n\n也许她只是需要一个倾诉的地方。\n\n科研团队将所有片段整理成册，在最后一页写下了这次考古任务的结论。\n\n这颗星球已经没有什么值得继续探索的了。"
 gts_rainna_la_grande_arch.05_1_micro.a:0 "所以说他们就这样不明不白地被毁灭了吗？"
 gts_rainna_la_grande_arch.05_1_micro.b:0 "难道说他们是被那邪恶的入侵者置于死地？"
 gts_rainna_la_grande_arch.05_1_micro.c:0 "看来那入侵者还真是可怕。"
 gts_rainna_la_grande_arch.05_2_micro.a:0 "这是因母亲早已逝去而悲痛。"
 gts_rainna_la_grande_arch.05_2_micro.b:0 "这是因母亲远在天涯而悲痛。"
 gts_rainna_la_grande_arch.05_2_micro.c:0 "这是因主人早已逝去而悲痛。"
 gts_rainna_la_grande_arch.05_2_micro.d:0 "这是因主人远在天涯而悲痛。"

 gts_rainna_la_grande_arch.06.name:0 "毁灭，逃离"
 gts_rainna_la_grande_arch.06_micro.desc:0 "我们的飞船降落在了这颗庞大得难以想象的星球之上。\n\n这颗星球的规模远超我们任何已知的观测参照系，周围的一切都大到无法用常规手段测量。飞船的仪器在着陆后立刻捕捉到了一种强烈的信号，频率稳定，来源方向清晰，像是某种刻意向外广播的东西。\n\n科研人员开始架设接收器，准备对这个信号进行解码。\n\n然而就在这时，仪器的另一个读数引起了一名科研人员的注意——在那个强烈信号的背后，有一道极为微弱的次级信号，几乎被完全淹没，像是被刻意压制或隐藏在噪声之中。\n\n如果不是有人特意去找，根本不会注意到它的存在。"
 gts_rainna_la_grande_arch.06_micro_alter.desc:0 "这颗星球依然庞大无比，周围的一切同样大到无法观测。\n\n与上一个遗址相似，这里也存在着强烈的信号，来源稳定，频率规律，像是某种刻意向外广播的信息。有了上一次的经验，科研人员在架设接收器的同时，没有忘记对背景噪声进行精细扫描。\n\n果然，在那道强烈信号的阴影之下，隐藏着一道几乎无法察觉的微弱次级信号，像是被人刻意压在最深处，不想让人找到。"
 gts_rainna_la_grande_arch.06_tiny.desc:0 "我们的飞船降落在了这颗庞大的星球之上。\n\n目光所及之处，巨型建筑群的轮廓在地平线上依次排开，规模宏大，工艺精良。与此前见过的废墟不同，这些建筑保存得相当完整，大部分结构依然稳固，外墙几乎没有明显的损毁。然而整片区域却空无一人，死寂得令人不安。\n\n初步的年代测定结果显示，这些建筑来自一个极为古老的文明，其历史甚至早于我们星球上迄今为止考古所能触及的最早记录。\n\n仪器同时检测到了两种截然不同的信号——一种强烈而清晰，像是从整个星球各处同时广播的东西；另一种则极为微弱，像是被刻意藏在那道强烈信号的阴影之下，不想被人发现。"
 gts_rainna_la_grande_arch.06_tiny_alter.desc:0 "我们的飞船降落在了这颗庞大的星球之上。\n\n巨型建筑群延伸到视野的尽头，与我们在该星系探索的上一处遗址相比，这些建筑的风格有着明显的相似之处——相同的结构逻辑，相同的材料选择，相同的城市规划理念。但不同的是，这些建筑保存得更加完整，许多结构几乎完好无损，却同样荒无人烟。\n\n仪器检测到了两种信号，一强一弱，弱的那个似乎在刻意回避被发现。"
 gts_rainna_la_grande_arch.06_small.desc:0 "我们的飞船降落在了这颗星球之上。\n\n高大的建筑群将整片城区填满，规划整齐，布局合理，街道宽阔，广场开阔。大部分建筑保存得相当完整，许多甚至看起来仍然可以直接入住，只是整座城市空荡荡的，荒无人烟。初步测定显示，这些建筑来自一个极为古老的文明，历史远超我们已知的最早考古记录。\n\n科研团队面临两个方向的选择。\n\n一是深入这些保存完好的建筑内部，寻找这个文明留下的直接痕迹；二是架设设备，尝试解码仪器检测到的那道来自远方的强烈信号。\n\n两个方向都有可能带来重要的发现。"
 gts_rainna_la_grande_arch.06_small_alter.desc:0 "我们的飞船降落在了这颗星球之上。\n\n眼前的建筑群与我们在这个星系上一处遗址中见到的风格高度一致，但保存程度远超前者——许多建筑几乎完好无损，外墙干净，结构稳固，甚至隐约可以想象出它们曾经使用时的模样。只是整座城市依然空无一人，安静得像是被按下了暂停键。\n\n科研团队面临同样的两个选择：深入建筑内部，或者解码那道来自远方的信号。"
 gts_rainna_la_grande_arch.06_normal.desc:0 "我们的飞船降落在了城市中央的一片空地上。\n\n这是一座完整的城市——或者说，是一座曾经完整的城市的完整遗骸。街道、建筑、广场、所有的元素都还在，规划得井井有条，布局合理而成熟。建筑的保存状况出乎意料地好，大部分结构依然完好，门窗虽然残破，墙体却几乎没有倒塌。\n\n只是空无一人。一个人都没有。\n\n初步测定显示，这个文明的历史远超我们已知的最早文明记录。科研团队站在空旷的城市广场上，四下张望，仪器的读数显示整个星球范围内都充斥着一道强烈的信号，来源分散，覆盖面广，像是这颗星球本身在向外广播着什么。\n\n这些建筑值得深入研究，而那道信号同样值得关注。"
 gts_rainna_la_grande_arch.06_normal_alter.desc:0 "我们的飞船降落在了城市中央的一片空地上。\n\n与我们在这个星系探索的上一处遗址相比，眼前这座城市的保存状况要好得多，几乎可以说是完好如初。更值得关注的是，从建筑风格、材料选择和城市规划的逻辑来看，这两处遗址显然属于同一文明——同一个文明，在两颗不同的星球上，留下了两座城市。\n\n整座城市空无一人，整个星球都充斥着一道强烈的信号。\n\n这两件事之间是否有什么关联，目前还无从判断。"
 gts_rainna_la_grande_arch.06_tall.desc:0 "我们的飞船降落在了这颗星球的郊外，停在一座大都市的边缘。\n\n俯视地面，城市的规划出乎意料地完整——街道笔直，街区方正，建筑分布均匀，一看便是经过精心设计的产物。只是这些建筑大多只比我们的科研人员稍微高出一些，站在其中，有一种奇异的压迫感，仿佛整座城市都在仰望着我们。没有一个人，所有建筑都已废弃多时，初步测定显示它们的历史远超我们已知的任何文明记录。\n\n然而真正引起所有人注意的，是远处的那个东西。\n\n在矮小的城市建筑群的衬托下，那座建筑如同一座拔地而起的山峰，遮住了一片天空。从外观来看，它像是某种宫殿或神殿，建筑风格与周围那些矮小的城市建筑格格不入——不是同一个尺度，也不是同一种语言，就好像有人把一座属于另一个世界的建筑，随手放在了这座城市的旁边。"
 gts_rainna_la_grande_arch.06_tall_alter.desc:0 "我们的飞船降落在了这颗星球的郊外，停在一座大都市的边缘。\n\n城市规划完整，建筑保存良好，大多只比科研人员稍高，整座城市空无一人。这些建筑的风格与我们在这个星系探索的上一处遗址高度一致——相同的结构逻辑，相似的材料工艺，毫无疑问来自同一个文明。只是那里的人们早已不在了，这里同样如此。\n\n而远处那座如山峰般巨大的建筑，与周围的矮小城区形成了令人困惑的反差。它的风格与这座城市的其他建筑截然不同，像是另一种存在专门为自己建造的东西。"
 gts_rainna_la_grande_arch.06_giant.desc:0 "我们的飞船降落在了这颗星球之上。\n\n俯视地面，那是一座规划极为精良的迷你城市。街道、广场、建筑，一应俱全，布局合理，只是所有的一切都不足我们科研人员的脚踝高。团队在行动时格外谨慎，每一步都经过仔细确认，尽管如此，仍有几处细小的结构在不经意间被踩坏了。\n\n没有任何生命体征，整座城市废弃已久。初步测定显示，这些建筑的历史远超我们已知的任何文明记录。\n\n远处，有一座与周围格格不入的巨大建筑。在这片迷你城市的映衬下，它如同山峰般耸立，从外观判断应该是某种宫殿。它的建筑风格与周围那些小巧的城市建筑完全不同，像是两个截然不同的存在，出于某种原因，被放置在了同一颗星球上。"
 gts_rainna_la_grande_arch.06_giant_alter.desc:0 "我们的飞船降落在了这颗星球之上。\n\n脚下是一座规划精良的迷你城市，建筑高度不足科研人员的脚踝，风格与我们在这个星系上一处遗址探索的文明高度一致。同一个文明，两颗星球，两座城市，却都空无一人，废弃已久。\n\n远处那座宫殿般的巨型建筑同样格格不入，与周围的迷你城市形成了难以理解的反差。"
 gts_rainna_la_grande_arch.06_titan.desc:0 "我们的研究人员降落在了这颗狭小的星球之上。\n\n飞船无法停靠在城区附近——城市实在太小，降落产生的气流就足以将大片建筑吹倒。研究人员们徒步进入城区，每一步都必须格外小心，尽管如此，脚下依然不可避免地压碎了一些细小的结构。\n\n城市规模庞大，规划完整，保存状况参差不齐——大部分区域相对完好，但也有一些地带有着明显的破坏痕迹，地面上留着某种规律性的压痕，像是某个巨大存在曾经在这里行走过。整座城市没有任何生命体征。\n\n城区不远处，有一座宫殿。\n\n它的规模远超研究人员们的预期，大门的高度接近千米，整个建筑的体量与周围那些细小的城市建筑完全不成比例。能够以这个尺度建造宫殿的存在，其体型约摸是我们的百倍有余。"
 gts_rainna_la_grande_arch.06_ultra.desc:0 "我们的研究人员缩小后，降落在了这颗狭小的星球之上。\n\n即便如此，行动依然受到了相当大的限制。脚下的城市群密密麻麻，研究人员们无法在不造成破坏的前提下正常行走，每迈出一步，都不可避免地踩碎了一些建筑。最灵敏的仪器扫描了整个区域，没有检测到任何生命体征——这里早已是一座空城。\n\n城区的不远处，矗立着一座宫殿。\n\n即便是缩小之后的研究人员，站在宫殿的大门前，也不得不仰头才能看到门顶——大门高约百米。这座宫殿是为某个体型约为我们十倍的存在建造的，它的建筑语言与周围那些超迷你城市截然不同，像是两个完全不同的世界被放置在了同一颗星球上。"
