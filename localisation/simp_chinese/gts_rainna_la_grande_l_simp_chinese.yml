 gts_rainna_la_grande_first_meeting.2150.title:0 "朋友"
 gts_rainna_la_grande_first_meeting.2150.desc:0 "“嘛~好啦好啦，我就知道你们不会介意的嘛~”\n\n蕾恩娜咯咯地笑着，将悬在大气层外的足底轻轻收回，在太空中随意地伸了个懒腰。她看起来心情极好，长发在无重力中慵懒地飘散。\n\n“只不过是和你们开个小玩笑嘛~不用这么紧张啦~”\n\n她将身体侧卧，一手托着脸颊，用另一只手的指尖在大气层外轻轻划着圈。云层在她的指尖下被随意塑造成各种形状，转眼是一朵花，转眼又变成什么别的东西。\n\n“嗯……”她歪着头，认真地看了看这颗星球，眼神中带着几分少见的温和，“不过话说回来……”\n\n她的声音变得轻快。\n\n“你们是第一个主动要和我做朋友的小家伙呢~”\n\n她将下巴搁在手背上，若有所思地打量着这颗渺小的星球。\n\n“嘛，那就这样吧~”她俏皮地眨了眨眼，“从今天起，我们可就是朋友咯~”\n\n她顿了顿，嘴角勾起一抹意味深长的笑容。\n\n“不过……朋友归朋友，你们的星球踩起来是什么感觉这件事，我还是很好奇的哦~”\n\n她的声音里带着天真的危险，让人分不清这份"友谊"究竟意味着什么。\n\n“嘿嘿，开玩笑的哦，我可不会主动破坏朋友的星球呢~”\n\n说着，一场酣畅的雨从天而降。\n\n“嘛，这是我给你们的礼物哦，好好享用吧~”"
 gts_rainna_la_grande_first_meeting.2150.a:0 "太好了，我的朋友！"
 gts_rainna_la_grande_first_meeting.2160.title:0 "皈依"
 gts_rainna_la_grande_first_meeting.2160.desc:0 "“嗯……”\n\n蕾恩娜轻轻地应了一声，那双湖泊般的眼眸缓缓闭上。\n\n四周陷入了深沉的寂静。\n\n连太空中漂浮的尘埃都仿佛停止了运动。星球上所有人都感受到了某种无形的压迫，那不是来自她的足底，而是来自她存在本身所散发出的某种难以言说的威压。\n\n良久，她睁开眼睛。\n\n“既然如此……”\n\n她的声音变得低沉而悠远，与之前那种俏皮的语气截然不同。她缓缓将双臂展开，巨大的身躯在星光中显得格外神圣，长发在无重力中如星河般铺展开来，遮蔽了一大片宇宙的光芒。\n\n“那么，作为你们至高无上的神明，我将收回降临之时的审判。”\n\n她的足底从大气层边缘缓缓抬起，阴影一点一点地从地表消退，阳光重新洒落在那片满目疮痍的土地上。\n\n“然而……”\n\n她将双手交叠在胸前，俯视着这颗渺小的星球，眼神中带着一种居高临下的平静。\n\n“身为神明，恩泽从不轻易降下。”\n\n她的声音回荡在整个大气层中，如同古老神殿中的钟鸣，庄严而不可抗拒。\n\n“你们得到了今日的宽恕，这归因于……”\n\n她停顿了片刻。\n\n“我心情不错。”\n\n随即，她的嘴角微微上扬了一丝，那个细微的弧度几乎难以察觉，却让整个庄严的氛围悄然裂开了一道细缝。\n\n她很快收敛回来，重新摆出那副神明的姿态，声音依然庄重。\n\n“那么……从今日起，你们当以虔诚之心侍奉于我，以合适的方式，表达对至高神明应有的敬意。”"
 gts_rainna_la_grande_first_meeting.2160.a:0 "我们的灵魂归于您。"
 gts_rainna_la_grande_first_meeting.2210.title:0 "无事发生？"
 gts_rainna_la_grande_first_meeting.2210.desc:0 "“哼哼……没想到你们这群小东西居然会怕成这样~”\n\n蕾恩娜咯咯地笑着，那清脆的笑声通过通讯器传来，在每个人心中激起阵阵涟漪。她巨大的身躯在太空中优雅地后仰，长发在星光中如瀑布般散开。\n\n“嘛，看你们这么可怜的样子……就这样吧，饶你们一次哦~”\n\n她收回了悬在大气层外的手指，歪着头俯视着这颗渺小的星球。她眨了眨眼，那如城市般巨大的睫毛扰动着高层云彩，在天空中留下一道短暂的彩虹。\n\n“不过嘛……”\n\n她轻轻地用指尖点了点自己的下巴，做出一副思考的样子。清澈的蓝色眼眸中闪过一丝狡黠的光芒，嘴角勾起一抹顽皮的微笑。\n\n她慵懒地在太空中调整了一下姿势，将身体侧卧，一手随意地托着脸颊，另一只手的指尖在大气层外轻轻划着圈。云层在她指尖的拨弄下如同棉花糖般被随意塑造，转眼是一道漩涡，转眼又被抹成一片薄雾。\n\n“这都要归因于……”她的声音变得漫不经心，“今天我心情好哦。”\n\n她的指尖在大气层边缘轻轻一弹，掀起一阵不大不小的气流，让地表上残存的几片云彩四散飘去。\n\n她托着下巴，用那双巨大的眼眸静静地打量着这颗星球，就像是在观察一件有趣的小玩意儿。\n\n“不过如果我下次心情好，还会再来玩的~”\n\n她的声音中带着天真的危险，让人分不清这究竟是宽恕还是另一种形式的威胁。"
 gts_rainna_la_grande_first_meeting.2210.desc_alter:0 "“哼哼……”\n\n蕾恩娜的笑声从通讯器中传来，带着几分难以捉摸的意味。她将悬在大气层外的手指缓缓收回，在太空中随意地舒展开身体，长发在无重力中静静飘散。\n\n“没想到你们这群小家伙，胆子居然这么小~”\n\n她低头俯视着这颗星球，眼神中带着几分漫不经心的怜悯。就像是一个孩子俯视着脚边受惊的小动物，既觉得有趣，又觉得有些无聊。\n\n“嘛……”\n\n她歪着头，若有所思地看了片刻，然后轻轻叹了口气。\n\n“嘛，这样吧，我就饶了你们这次吧。”\n\n她的语气轻描淡写，仿佛这个决定对她来说轻如鸿毛。她将身体慵懒地侧过来，用一只手随意地托着下巴，另一只手的指尖漫无目的地在星球周围划着弧线。\n\n星球上，所有人都在等待着她的下一句话。\n\n“不过呢……”她的声音突然变得悠长。\n\n她将那根闲不住的手指轻轻点在大气层边缘，带起一阵微微的震颤。地面上刚刚站起身来的人们又不由自主地僵在了原地。\n\n“我只是……”她拖长了语调，嘴角勾起一抹意味深长的弧度，“今天心情好罢了。”\n\n她的眼眸在星光下泛着柔和的光芒，却让所有人感到脊背发凉。\n\n“所以嘛，”她轻声说道，语气温柔得像是在跟老朋友道别，“我还会经常来关顾的哦~”"
 gts_rainna_la_grande_first_meeting.2211.title:0 "陨坑"
 gts_rainna_la_grande_first_meeting.2211.desc:0 "“哼哼……看来这个星球上的聚居地还是挺多的嘛，究竟要将我神圣的恩泽降下在哪里好呢？”\n\n蕾恩娜玩味地晃了晃手指，将附着与星球表面的云彩搅散，带起一阵不起眼的气。微风拂过星球的表面，茂密的森林在这阵飓风中不堪一击，参天古木如同草芥般连根拔起。广袤的农田瞬间支离破碎，千百年来[Owner.GetSpeciesName]辛勤耕耘的痕迹被轻易抹去。平静的海面咆哮着掀起滔天巨浪，港口城市在这突如其来的海啸面前显得如此脆弱。\n\n这片大陆上大大小小的城市群在蕾恩娜天空般清澈的巨大的眼眸映照下，密集的聚居地、宏伟的建筑、壮丽的自然奇观以及每一个渺小的生命尽收眼底，却像尘埃般不值一提。\n\n“嗯……就这里了吧。”\n\n她的食指优雅地划过大气层，最终停在这颗星球最繁华的都市圈上方。这片区域是整个文明的心脏，容纳了最先进的科技、最庞大的人口、最重要的决策中枢。数千年的文明在此积淀，亿万人的命运在此交织。\n\n“不知道……按下去会有什么感觉呢……真是期待呢~”\n\n她的指尖触地面。大地在瞬间凹陷，城市群如同被巨锤击中的玻璃般四分五裂。地壳深处的岩浆喷涌而出，与坍塌的建筑融为一体。数千年的文明成就在她的神赐之下化作化为尘埃，只剩下大陆中心刚刚形成的巨大的天坑。\n\n“嘛，这可是我的恩赐哦~”"
