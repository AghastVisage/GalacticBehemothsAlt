 gts_rainna_la_grande_arch.04_2_titan.desc:0 "对那些字迹的深入研究花费了相当长的时间。\n\n最终呈现出来的结论并不复杂，却格外沉重。\n\n那些遍布星球各处的文字，在去掉无法翻译的部分之后，核心词汇出奇地集中：牢笼、囚禁、枷锁、黑暗、永恒、无法逃脱。\n\n以及一个反复出现、却始终无法完整翻译的词——“Domina”。\n\n这个词在所有文字中出现的频率远超其他任何词汇，有时单独出现，有时与"枷锁"或"黑暗"并列，有时则被大量重复，填满了整片区域，像是某种极度绝望之下的呼喊。\n\n研究人员们逐渐意识到，这些文字的性质和此前那些随意的涂鸦截然不同。那些涂鸦是消遣，而这些文字是倾诉。\n\n她在向某个人倾诉。那个被她一遍遍呼唤的“Domina”，是她想要诉说的对象。\n\n至于她想说什么，即便是翻译出来的部分，也已经足够清楚了——\n\n她被关起来了。她很绝望。她不知道自己还要等多久。\n\n我们尚不知道“Domina”的含义，为了接下来的研究，我们必须假定一个最接近的解释。"
