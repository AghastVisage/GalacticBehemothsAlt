 gts_rainna_la_grande_first_meeting.21115.title:0 "玉足？"
 gts_rainna_la_grande_first_meeting.21115.desc:0 "“啊啦~小家伙们，看起来你们也是一群很懂欣赏的呢……”\n\n蕾恩娜的声音中带着惊喜和愉悦。她咯咯地笑着，那清脆的笑声在整个星球回荡。\n\n“这么喜欢我的脚吗？那就让你们好好看看吧~”\n\n她优雅地将修长的腿屈起，在太空中摆出一个展示的姿势。那只尚且洁白无瑕的巨足缓缓抬起，在星光的照耀下，每一寸肌肤都散发着如玉般的光泽。\n\n她的五根足趾修长而匀称，每一根都如同精致的雕塑。她顽皮地伸展、蜷曲着足趾，灵活地活动着。足趾间若隐若现的缝隙深处，残留着些许透明的汗渍，让人既着迷又恐惧。\n\n足底的曲线完美而优雅，饱满的足弓如同精心雕琢的艺术品。细腻的皮肤上，每一道掌纹都清晰可见，如同大地上蜿蜒的河流。几滴晶莹的汗珠点缀其间，在阳光下折射出彩虹般的光芒。\n\n她将巨足悬停在那片繁华都市的上方，足底几乎贴近了大气层的顶端。从地面望去，那完美的足型占据了整个天空，每一个细节都纤毫毕现。足跟圆润饱满，足弓的曲线优美流畅，足趾尖端微微泛着健康的粉色。“既然你们这么喜欢……”她的声音突然变得危险而甜蜜，“那不如……”\n\n她轻轻转动足踝，让那完美的足底在空中划出优雅的弧线。阳光透过足趾的缝隙洒下斑驳的光影，在城市的街道上投射出扭曲的图案。\n\n“再近距离地感受一次我的玉足的‘恩泽’吧~”\n\n她的足底开始缓缓下降，那光洁如玉的皮肤穿透云层，带起阵阵气流。足趾轻轻张开又合拢，仿佛在期待着即将到来的触感。\n\n“让我的脚，好好地‘爱抚’你们的城市吧……”\n\n她低声呢喃着，声音中充满了期待。那只美丽而致命的巨足，如同缓缓降落的天幕，带着无可抗拒的威压，逼近着地表。足底的每一道纹路都变得越来越清晰，仿佛要将整个世界都印刻其中。"
 gts_rainna_la_grande_first_meeting.21115_alter.desc:0 "“啊啦~小家伙们，都这样了还能欣赏我的脚吗？”\n\n蕾恩娜的声音中带着惊讶和愉悦，她似乎没想到在造成如此破坏之后，还能听到这样的赞美。\n\n“那就让你们好好看看吧~毕竟上面还留着你们‘城市的痕迹’呢。”\n\n她优雅地将修长的腿屈起，把那只刚刚肆虐过地表的巨足抬起展示。与另一只洁白的足形成鲜明对比，这只足底已经不再纯净。\n\n大片的建筑碎片、扭曲的钢筋、破碎的玻璃渣紧紧黏附在原本雪白的足底上。黑色的泥土和灰尘涂抹在光滑的皮肤表面，让那完美的足弓看起来有些脏兮兮的。但即便如此，依然能看出足底原本的优美曲线。\n\n“看，城市可都在这里呢~”\n\n她顽皮地活动着足趾，那五根修长的趾头间夹杂着更多的残骸。高楼的碎片夹杂着破碎的山体，不停地抖落在地上，如同坠落的陨石。\n\n足底的掌纹沟壑中填满了细碎的建筑粉末，原本晶莹的汗渍现在混合着尘土，变成了泥泞的污渍。足跟处粘附着一整片被压碎的商业区，那些曾经高耸入云的大楼，此刻不过是她足底的装饰。\n\n“呀，真是不巧……把我的足底弄得怎么脏。”她歪着头，俏皮地笑着，“真是一群坏家伙呢~”\n\n她将巨足悬停在另一片尚未被破坏的繁华都市上方，足底投下的阴影中夹杂着那些废墟碎片的剪影。从地面望去，那沾满文明残骸的足底显得格外可怖——既是毁灭的证明，也是即将到来的威胁。\n\n“既然你们这么喜欢……”她的声音变得危险而甜蜜，“那不如……再踩一次吧~”\n\n她的巨足开始缓缓下压，那沾满废墟的足底穿透云层。那些粘附在足底的碎片开始剥落，像是黑色的雪花般提前坠向地面，每一块砸下都造成新的破坏。\n\n足底越来越近，上面每一块废墟碎片都清晰可见，提醒着人们这只美丽的足刚刚毁灭了什么，以及即将毁灭什么。"
