 gts_rainna_la_grande_random.312.i:0 "以国家威望主持祭典"
 gts_rainna_la_grande_random.322.title:0 "神迹"
 gts_rainna_la_grande_random.322_1.desc:0 "最近星球上出现了一些难以解释的异常现象。\n\n各地的观测者陆续报告，说大地深处传来了某种低沉的震动，天空的颜色在某些时刻会变得格外诡异，而那些供奉着女神的神殿周围，更是频繁地出现无法用常理解释的光影。起初，人们以为这只是寻常的自然现象，但随着这些迹象越来越频繁、越来越明显，一种敬畏的情绪开始在信众之间蔓延。\n\n宗教界很快给出了他们的解读。\n\n“这是女神的征兆。”负责观测的神职人员郑重地宣告，“伟大的蕾恩娜正在注视着我们，她的力量正在这颗星球上显现。神迹，即将降临。”\n\n消息传开，整个文明都陷入了一种混杂着虔诚与不安的期待之中。\n\n而就在众人的注视之下，那异变的天空骤然亮起——\n\n神迹，降临了。"
 gts_rainna_la_grande_random.322_2.desc:0 "不寻常的事情正在发生。\n\n农田里的作物一夜之间疯长，河流的水泛起了从未见过的色泽，夜空中偶尔会划过一些不属于任何已知天体的光芒。这些现象最初零星出现，随后愈演愈烈，遍及整个星球。人们惶惶不安，却又隐隐感到某种莫名的期待。\n\n神职人员们聚集在一起，反复研讨这些异象的含义。最终，他们得出了一致的结论。\n\n“这是女神力量的显现。”\n\n他们向惶惑的民众宣告：“蕾恩娜大人的意志，正在渗入我们的世界。这些征兆，预示着她即将赐予我们某种……启示。”\n\n话音未落，天地之间仿佛响起了一声无形的叹息。\n\n那一刻，所有人都感受到了——\n\n神迹，来了。"
 gts_rainna_la_grande_random.322_3.desc:0 "这段时间以来，星球上的一切都显得有些不对劲。\n\n指南针失灵了，季节的规律被打乱了，就连一些古老的建筑，也在无人触碰的情况下发生了微妙的变化。这些现象超出了所有科学的解释范畴，让整个文明都笼罩在一层神秘的氛围之中。\n\n自然，人们将这一切归因于他们的女神。\n\n“蕾恩娜大人正在向我们展示她的伟力。”神职人员如此解读道，语气里满是虔诚，“这些异象，是她降下神迹的前兆。我们应当心怀感激，静静等待女神的恩赐。”\n\n于是，整个星球都在等待。\n\n在无数双虔诚的眼睛的注视下，天空中终于绽放出一道奇异的光芒，笼罩了整颗星球。\n\n神迹，如约而至。"
 gts_rainna_la_grande_random.322_4.desc:0 "星球上弥漫着一种奇异的气氛。\n\n近来，各地不断传来种种异象的报告——有人说看见天空中浮现出巨大的身影轮廓，有人说听见了来自虚空的、若有若无的轻笑，还有人说，某些地方的时间仿佛都变得缓慢了下来。这些超乎寻常的现象，让整个文明既感到敬畏，又充满了期待。\n\n神职人员们对此给出了明确的解释。\n\n“这是女神眷顾的征兆。”他们向信众宣告，“伟大的蕾恩娜大人，即将为这颗虔诚的星球降下她的神迹。这是我们的荣耀，也是我们信仰的回报。”\n\n人们纷纷放下手中的事务，涌向神殿，虔诚地祈祷着，等待着那神圣时刻的到来。\n\n终于，在某个清晨——\n\n神迹，降临在了这颗星球之上。"
 gts_rainna_la_grande_random.322.a:0 "神迹降临了！" # Miraculum factum est!
 gts_rainna_la_grande_random.402.title:0 "关于蕾恩娜银行的贷款"
 gts_rainna_la_grande_random.402_1.desc:0 "通讯频道里，传来了那个熟悉的声音。\n\n“嘿~小朋友们~”\n\n蕾恩娜的语气一如既往地轻快，只是这一次，那份亲昵之下藏着几分别的意味。\n\n“最近过得怎么样呀？嗯……我记得你们好像还欠着我一笔钱呢~”\n\n“是不是忘记还了呀？没关系没关系，我理解的~”她咯咯地笑了几声，“不过嘛，欠债还钱，天经地义嘛~”\n\n“这样吧，再给你们一点时间吧。”\n\n“不过要是下次我来的时候，还是看不到我的钱……”她的声音里带上了几分甜腻的危险，“那我可就只好亲自上门，把值钱的东西都收走咯~”\n\n“加油还钱哦~拜拜！”"
 gts_rainna_la_grande_random.402_2.desc:0 "“呐呐呐，是我哦~”\n\n蕾恩娜的声音从通讯器中传来，慵懒而随意。\n\n“你们是不是有什么东西忘记给我啦？嗯……让我想想……”\n\n她故意拖长了语调，像是在回忆什么。\n\n“啊，对了，是我的钱呢~你们借了那么久，也该还了吧？”\n\n“嘛，这样吧，就再宽限你们一段时间好啦~”她轻描淡写地说着，“毕竟我们也算是半个朋友嘛~”\n\n“不过朋友归朋友，账还是要算清楚的哦~”她的语气突然一转，“要是再拖下去，我可就要动手拿点抵押品了~到时候拿走什么，可就不是你们能决定的咯~”\n\n“好好准备我的钱哦~”"
 gts_rainna_la_grande_random.402_3.desc:0 "通讯器的另一头传来了熟悉的声音。\n\n“嘿嘿，好久不见呀~”\n\n蕾恩娜的声音听起来心情不错。\n\n“我路过附近，就想起来你们还欠着我钱呢~顺道来提醒一下你们~”\n\n“钱嘛，我不急的~”她慵懒地说着，“反正跑得了和尚跑不了庙，你们的星球又飞不走，对吧？”\n\n她咯咯地笑了起来。\n\n“这次就先算了，我再给你们一点时间~”她的语气里带着几分玩味，“不过要是我下次来还是两手空空的话……嘛，你们那些漂亮的城市、值钱的工厂，看起来倒是挺不错的呢~”\n\n“你们懂我的意思吧？好好还钱哦~”"
 gts_rainna_la_grande_random.402_4.desc:0 "“呐呐~我来收钱咯~”\n\n蕾恩娜的声音轻快得像是在讨要一份礼物。\n\n“你们欠我的那笔钱，是时候该还啦~”\n\n通讯器那头沉默了片刻，她似乎在等待着什么，随即又自顾自地笑了起来。\n\n“哎呀，看你们这为难的样子，是暂时还不上吧？”\n\n“嘛，没关系啦~我大发慈悲，再给你们宽限一阵子~”她的语气轻描淡写，却透着不容拒绝的意味，“不过呢，下次我可就不会这么好说话了哦~”\n\n“下次我再来的时候，要是还拿不到钱……”她的声音甜美而危险，“那我就只好自己动手，从你们的星球上‘拿’一点值钱的东西抵债咯~放心，我一定会‘拿’得很公道的~”\n\n“好好准备哦，拜拜~”"
 gts_rainna_la_grande_random.402.a:0 "请宽限我们几日……"
 gts_rainna_la_grande_random.402.a_tooltip:0 "所有6个月内到期的贷款和逾期的贷款被延长至6个月后到期"
 gts_rainna_la_grande_random.411.title:0 "舰船消失"
 gts_rainna_la_grande_random.411_1.desc:0 "[rainna_la_grande_this_solar_system.GetName]星系传来了异常报告。\n\n驻扎在该星系的一支舰队，在毫无征兆的情况下，从所有的监测系统中消失了。没有战斗的痕迹，没有求救的信号，没有残骸，甚至没有任何异常的能量波动——那些飞船就这样凭空消失了，仿佛从未存在过一般。\n\n值班人员反复核对着数据，冷汗涔涔而下。整整一支舰队，就这样无声无息地不见了。\n\n调查还在进行，但所有人心里都隐约浮现出了一个不祥的猜测。"
 gts_rainna_la_grande_random.411_2.desc:0 "警报在深夜响起。\n\n[rainna_la_grande_this_solar_system.GetName]星系的监测网络突然失去了与当地舰队的全部联系。技术人员紧急排查，却发现那些飞船并非通讯中断，而是……根本不在那里了。它们从雷达上、从轨道记录中、从一切追踪系统里彻底消失，没有留下任何痕迹。\n\n一支完整的舰队，就这样人间蒸发。\n\n指挥中心陷入了一片死寂。有人想起了最近那笔迟迟未能偿还的债务，脸色瞬间变得惨白。"
 gts_rainna_la_grande_random.411.a:0 "不！我的飞船！"
 gts_rainna_la_grande_random.412.title:0 "使用飞船抵债"
 gts_rainna_la_grande_random.412_1.desc:0 "久违的信号接入了通讯频道。\n\n“嘿~朋友~”\n\n蕾恩娜的语气轻快而愉悦。\n\n“你们是不是在找几艘飞船呀？嘻嘻，别找了，在我这儿呢~”\n\n“你们不是欠我钱嘛，一直没还，我已经通知过你们了哦~”她的声音里满是理所当然，“所以我就收你们点飞船抵债了哦。”\n\n“欸，这么这就扁了？不过声音还怪好听的~嘿嘿~”\n\n“欠的钱嘛，就先这么抵一部分吧~剩下的别忘了还哦~”"
 gts_rainna_la_grande_random.412_2.desc:0 "通讯器响了起来。\n\n“呐呐呐~又是我哦~”\n\n蕾恩娜的声音慵懒而随意。\n\n“你们那几艘飞船，我拿走咯~就当是抵债啦~”\n\n“哎呀，你们别急嘛~”她似乎听到了什么，咯咯地笑了起来，“就那么几艘小破船而已，对你们来说不算什么吧？”\n\n“你们造的这些东西还挺精致的嘛~”她饶有兴致地说着，“我拿回去收藏了~算是抵掉你们欠我的一小部分钱咯~”\n\n“剩下的债，可别忘了哦~”"
 gts_rainna_la_grande_random.412_3.desc:0 "信号接入。\n\n“嘿嘿，找飞船吗？”\n\n蕾恩娜的声音里带着几分促狭。\n\n“在我这儿呢~你们欠钱不还，我就只好自己来拿点东西抵债咯~”\n\n“不过说实话啊……”她的语气变得有些嫌弃，“你们这些飞船也太不值钱了吧？我拿去当废品都嫌占地方呢~”\n\n“算了算了，就当是聊胜于无吧~”她漫不经心地说着，“这么一小堆破铜烂铁，也就勉强抵掉你们欠款的一个零头啦~”\n\n“剩下的钱你们还是老老实实还吧~别指望用这些破船糊弄我哦~”"
 gts_rainna_la_grande_random.412_4.desc:0 "通讯频道里传来了那个熟悉的声音。\n\n“呐呐~来收债咯~”\n\n蕾恩娜的语气轻快得像是在炫耀什么。\n\n“你们一直不还钱，我就先把你们停在[rainna_la_grande_this_solar_system.GetName]的那支舰队拿走啦~”\n\n“这些小飞船呀，虽然对你们来说是宝贝，不过在我眼里嘛……”她轻笑了一声，“也就是打发时间的小玩具而已啦~我捏着玩了一会儿，现在已经变成一堆碎片咯~”\n\n“嘛，好歹也算抵了点债~”她的声音里带着几分漫不经心，“不过你们欠的可不止这么点哦~剩下的，记得准备好~”\n\n“下次我可能就不只是拿飞船咯~嘻嘻~”"
 gts_rainna_la_grande_random.412.a_tooltip:0 "所有逾期的贷款的一部分都得到了减免，\n\n并且所有6个月内到期的贷款和逾期的贷款被延长至6个月后到期。"
 gts_rainna_la_grande_random.421.title:0 "星球消失"
 gts_rainna_la_grande_random.421_1.desc:0 "[rainna_la_grande_this_planet.GetName]失联了。\n\n起初只是通讯中断，指挥中心以为只是设备故障。然而当邻近星系的观测站将镜头转向那颗星球所在的位置时，所有人都愣住了——\n\n那里什么都没有。\n\n没有星球，没有残骸，没有爆炸的痕迹。那颗曾经居住着无数生命的星球，连同它的一切，就这样从星图上彻底消失了，仿佛从未存在过。"
 gts_rainna_la_grande_random.421_2.desc:0 "一颗星球不见了。\n\n[rainna_la_grande_this_planet.GetName]——一颗完整的、有人居住的星球——在某个寻常的时刻，毫无预兆地从所有的监测系统中消失了。轨道上的卫星失去了它的引力信号，远处的观测站再也捕捉不到它的踪影，就好像有谁伸手把它从宇宙中直接抹去了一样。\n\n没有任何征兆，没有任何解释。"
 gts_rainna_la_grande_random.421.a:0 "不！我的星球！"
 gts_rainna_la_grande_random.422.title:0 "使用星球抵债"
 gts_rainna_la_grande_random.422_1.desc:0 "通讯频道里，传来了那个熟悉的声音。\n\n“嘿~朋友~”\n\n蕾恩娜的语气轻快而随意。\n\n“你们是不是少了一颗星球呀？嘻嘻，在我这哦~”\n\n“谁让你们一直欠钱不还呢~”她的语气里没有丝毫愧疚，“我提醒过你们过一次了吧？既然拿不出钱，那我就只好拿颗星球来抵债咯~”\n\n“放心，我拿得可公道了~”她愉快地说着，“一整颗星球呢，怎么也能抵掉不少债了吧~”\n\n“剩下的钱，你们可要抓紧还哦~不然……嘻嘻，我还有很多颗星球可以拿呢~”"
 gts_rainna_la_grande_random.422_2.desc:0 "信号接入。\n\n“呐~朋友~好久不见呀~”\n\n蕾恩娜的声音慵懒而漫不经心。\n\n“我知道你们在找什么啦~就是那颗突然不见了的星球嘛~”\n\n“是我拿走的哦~”她坦然地说着，仿佛在陈述一件微不足道的小事，“你们欠我的钱一直不还，我总得拿点什么抵债吧？”\n\n“一颗星球，应该能抵不少了~”她的语气里带着几分玩味，“我把它捏在手里的时候，还能感觉到上面小小的挣扎呢，怪有意思的~”\n\n“嘛，这笔账就先这么算~剩下的，你们别想赖掉哦~”"
 gts_rainna_la_grande_random.422_3.desc:0 "通讯器响了。\n\n“朋友~我来跟你们说件事哦~”\n\n蕾恩娜的声音轻飘飘的。\n\n“你们那颗[rainna_la_grande_this_planet.GetName]，我拿走咯~”\n\n“别怪我心狠嘛~”她慵懒地说着，“是你们自己一直不还钱的呀~我给了你们那么多次机会，你们都没珍惜，那就别怪我自己动手了~”\n\n“一整颗星球，连人带地都算上……”她似乎在心里盘算着，“嗯，差不多能抵掉你们欠款的一部分吧~”\n\n“可惜哦，那上面的小生命也跟着一起没了呢~”她的语气里听不出任何情绪，“不过这也怪不得我呀，要怪就怪你们不还钱咯~”\n\n“剩下的债，好好还吧~”"
 gts_rainna_la_grande_random.422_4.desc:0 "久违的信号接入了通讯频道。\n\n“呐呐~朋友~我又来收债咯~”\n\n蕾恩娜的语气轻快得近乎愉悦。\n\n“你们是不是发现少了颗星球呀？没错，就是我拿的~”\n\n“你们欠钱不还，我提醒了这么多次，也该采取点行动了吧？”她理所当然地说着，“这次我可不是拿几艘小飞船敷衍你们了，直接拿了一整颗星球哦~有诚意吧？”\n\n“那颗星球嘛……”她轻笑了一声，“已经被我玩坏了呢~不过没关系啦，反正是拿来抵债的，坏了也无所谓~”\n\n“这么大一颗，总该抵掉不少了~”她的语气突然一转，带着几分甜腻的威胁，“不过要是你们还不还剩下的钱……下次我拿走的，可就不一定是哪颗星球咯~说不定，就是你们自己所在的那颗呢~嘻嘻~”"

 ##特殊项目
 GTS_AWAKE_RAINNA_PROJECT:0 "实体唤醒活动"
 GTS_AWAKE_RAINNA_PROJECT_DESC:0 "自从科研团队在黑洞另一侧发现这个沉眠的神秘实体以来，学术界对于是否应该唤醒她的争论就从未停止过。\n\n反对派认为，任何未知的高等实体都应当被视为潜在威胁，贸然唤醒只会引来不可预知的灾难。支持派则坚持认为，这是文明史上千载难逢的接触机会，若就此放弃，将是科学界最大的遗憾。\n\n争论持续了很长时间，直到一份来自经济部门的报告终于为这场争论画上了句号——与这样一个存在建立联系，潜在的技术与知识收益远超任何已知的风险评估模型所能计算的范围。\n\n于是，唤醒活动正式立项。\n\n至于那些反对派的担忧……报告的最后一页只有一行字：“收益远大于风险。”\n\n§R警告！唤醒实体可能在某些选择下会非常危险。请准备好后唤醒该实体。§!（打开蕾恩娜的剧情体验模式可以忽略此警告）"
 GTS_AWAKE_RAINNA_PROJECT_LOW_COST:0 "实体唤醒活动"
 GTS_AWAKE_RAINNA_PROJECT_LOW_COST_DESC:0 "自从科研团队在黑洞另一侧发现这个沉眠的神秘实体以来，学术界对于是否应该唤醒她的争论就从未停止过。\n\n反对派认为，任何未知的高等实体都应当被视为潜在威胁，贸然唤醒只会引来不可预知的灾难。支持派则坚持认为，这是文明史上千载难逢的接触机会，若就此放弃，将是科学界最大的遗憾。\n\n争论持续了很长时间，直到一份来自经济部门的报告终于为这场争论画上了句号——与这样一个存在建立联系，潜在的技术与知识收益远超任何已知的风险评估模型所能计算的范围。\n\n于是，唤醒活动正式立项。\n\n至于那些反对派的担忧……报告的最后一页只有一行字：“收益远大于风险。”\n\n§R警告！唤醒实体非常危险。请准备好后唤醒该实体。§!（打开蕾恩娜的剧情体验模式可以忽略此警告）"

 ##遗址
 # gts_site_rainna_la_grande_1:0 "枷锁紧束的灵魂"
 gts_site_rainna_la_grande_1:0 "永恒的禁锢之魂"
 gts_site_rainna_la_grande_1_desc:0 "这颗行星表面弥漫着一种不易觉察的能量波动,仿佛有某种凄厉的尖叫。当我们的勘探队靠近时,各种测量设备都开始产生干扰,仿佛在试图保护什么不为人知的秘密。"
 # gts_site_rainna_la_grande_2:0 "真挚忠贞的灵魂"
 gts_site_rainna_la_grande_2:0 "闪耀的忠挚之魂"
 gts_site_rainna_la_grande_2_desc:0 "这颗昏暗的行星散发出一种近乎灼热的辐射,似乎蕴含着庞大的能量潜能。当我们试图靠近时,这股热量波动却会呈现出一种难以言喻的韵律,仿佛有个炽热的残留意识在主动散发着自己的热忱。"

 ##考古事件
 gts_rainna_la_grande_arch.01.name:0 "荒芜、死寂"
 gts_rainna_la_grande_arch.01_micro.desc:0 "我们的飞船降落在了这颗星球之上。\n\n这是一颗庞大到难以想象的星球——或者说，是我们的飞船太过渺小。舷窗外的地平线延伸到了视野的极限，却依然看不到尽头。大气层的折射让远处的景色显得朦胧而失真，科研人员们花了很长时间才意识到，那些他们以为是山脉的东西，实际上是建筑物。\n\n是建筑物的残骸。\n\n当我们终于降落，走出舱门，才真正理解了这颗星球的规模。脚下的地面光滑而坚硬，延伸向无法看见边际的远方。我们在一片空旷的区域发现了一大块合金——它像一栋楼房一样高耸，边缘整齐，显然是经过加工的人工制品，而不是天然矿物。\n\n科研人员们站在这块合金的阴影下，沉默了很久。\n\n这就意味着这颗星球上曾经存在过文明。一种无比巨大的文明——巨大到我们几乎无法对它进行任何有效的测量和研究。我们能够观测到的，只是这个文明遗留下来的某个微小碎片的某个角落。\n\n至于这个文明的全貌，以及它究竟经历了什么——以我们目前的能力，恐怕难以触及。"
 gts_rainna_la_grande_arch.01_tiny.desc:0 "我们的飞船降落在了这颗庞大的星球之上。\n\n甫一着陆，科研人员们就意识到这颗星球的不寻常之处。目光所及之处，巨型建筑群的残骸连绵不绝，被一道道深不见底的悬崖隔断，形成了一片片孤立的废墟群岛。每一处悬崖的截面都清晰地展示着这颗星球地质层的变化，那些深色的地层之间，偶尔会夹杂着一条细细的银白色线条——那是金属，是文明存在过的痕迹。\n\n建筑物本身已经严重损毁，但从残存的轮廓来看，它们曾经高耸而宏伟。科研团队沿着其中一处悬崖的边缘小心前行，试图寻找进入建筑群内部的通道。\n\n初步的年代测定结果让所有人都沉默了。\n\n这个文明的历史，远远早于我们的星球上迄今为止发现的最早的文明记录。它存在于一个我们几乎无法想象的遥远年代，在那个时代，我们的祖先可能还在仰望着同一片星空，却对这里发生的一切一无所知。\n\n而现在，它只剩下这些被悬崖分割的孤立残骸，在荒芜中静静腐朽。"
 gts_rainna_la_grande_arch.01_small.desc:0 "我们的飞船降落在了这颗星球之上。\n\n高大的建筑废墟如同石林般耸立在地平线上，在晨光中投下长长的阴影。科研人员们穿行其间，不得不时刻注意脚下——地面上遍布着各种碎片，有金属、有玻璃状的物质，还有一些我们尚不能辨认的材料。\n\n经过仔细的年代测定，这个文明的历史甚至早于我们星球上已知的最早文明。它曾经发达而繁荣，从残存的建筑规模和工艺来看，它的技术水平绝不逊于当今任何一个先进文明。\n\n然而它毁灭了。\n\n毁灭的原因清晰地写在这片土地上——随处可见的巨大坑洞将地表切割得支离破碎，每一个坑洞的边缘都整齐而规则，绝非自然形成。有些坑洞大到足以吞没整个城区，有些则深到我们的探测设备无法触及底部。\n\n站在其中一个坑洞的边缘，科研人员们沉默地望着深处涌动的黑暗，没有人开口说话。"
 gts_rainna_la_grande_arch.01_normal.desc:0 "我们的飞船降落在了这颗星球之上。\n\n城市的痕迹随处可见。道路的格局依然清晰，建筑物的地基整齐排列，广场、街道、港口——一个完整的文明曾经在这里生活、劳作、仰望星空。根据初步的测定，这个文明的历史远远早于我们星球上已知的最早文明，却在某个我们尚不知晓的时间节点戛然而止。\n\n而停止的原因，就刻在这片土地上。\n\n巨大的坑洞遍布整个星球表面，深浅不一，形态各异，却有一个共同的特点——规则。过于规则，规则到不可能是任何自然灾害所能造成的。它们的边缘整齐，底部平滑，大小从覆盖数个街区到吞没整片城区不等。\n\n有些坑洞的底部已经被后来涌入的泥沙填满，但从截面上依然能看出，它们形成的时间和城市毁灭的时间高度吻合。\n\n科研人员们站在其中一个坑洞的边缘，用各种仪器记录着数据，却没有人敢大声说出那个所有人心中都浮现的推论。"
 gts_rainna_la_grande_arch.01_tall.desc:0 "我们的飞船降落在了这颗星球之上，科研人员们立刻意识到了某种奇异的不协调感。\n\n这里有城市——或者说，曾经有过城市。街道、建筑、广场，所有的城市元素都齐全，但一切都小得出奇。大多数建筑不超过科研人员的肩膀，最高的几栋也勉强到达头顶。科研人员们不得不格外小心地迈步，生怕一个不注意就踩坏了某处珍贵的遗迹。\n\n这里的文明曾经拥有精密的技术，从残存的设备碎片和建筑工艺来看，他们显然是一个高度发展的社会。测定结果显示，这个文明的历史甚至比我们星球上已知的最早文明还要久远。\n\n然而毁灭来得毫无征兆。\n\n散落在城市各处的巨大坑洞诉说着这场灾难的规模。坑洞的直径从数百米到数公里不等，但它们有一个共同的特点——形状。不是圆形，不是不规则的爆炸痕迹，而是某种我们熟悉的轮廓。\n\n某个科研人员站在其中一个坑洞的边缘，低头看了很久，然后抬起脚，将自己的脚底与坑洞的形状做了一个比对。\n\n队里顿时安静下来。"
 gts_rainna_la_grande_arch.01_giant.desc:0 "我们的飞船降落在了这颗星球之上，第一步踏出舱门，就差点踩到了什么东西。\n\n低头一看，是一座建筑。\n\n这颗星球上的城市密密麻麻地铺展在地表，最高的建筑物甚至不及我们科研人员的腰间。团队不得不制定严格的行动规范，所有人必须沿着标注好的安全路线行走，以避免破坏这些珍贵的考古资源——尽管这意味着大量的一手资料被隐藏在我们无法安全进入的建筑内部。\n\n这个文明曾经极为发达。从外部可以观察到的建筑工艺和城市规划来看，他们拥有完善的社会体系和相当高度的技术水平，历史测定更是将这个文明的起源推向了一个令人震惊的远古年代。\n\n然而所有这些，都在某一天轰然终结。\n\n地面上随处可见的巨大足印是最直接的证据。每一枚足印都深陷地表，将下方的一切夷为平地——那些精密的建筑、那些细小的街道、以及那些曾经在其中生活的无数生命。足印周围还有一些随意勾画的线条和图案，笔触粗犷，深深刻入地层，规模之大让人难以想象这只是某个存在漫不经心的涂鸦。\n\n科研人员们在这些图案之间穿行，试图解读其中的信息，心中却都压着同一个无法开口的问题：\n\n留下这些足印的存在，究竟有多大？"
 gts_rainna_la_grande_arch.01_titan.desc:0 "我们的研究员登陆了这颗星球。\n\n着陆时，飞船的导航系统反复提示地表有密集的障碍物，但当我们真正降落、走出舱门，才明白那些"障碍物"是什么——是城市。一片片细碎的城市废墟，密密麻麻地铺满了整个地表，每一个科研人员随意迈出的一步，都可能覆盖其中的数个街区。\n\n这个文明曾经存在过，而且存在了很长时间。从那些细如发丝的建筑遗迹中，依然能辨认出精密的规划和高超的工艺。历史测定数据显示，这是一个极为古老的文明，古老到让我们的考古学家们沉默了很久。\n\n然后，它在某一天消失了。\n\n地面上随处可见的足印为这场毁灭提供了最直观的注脚。那些足印对我们而言足有一个街区那么大，深深地嵌入地层，每一枚都将下方的一切碾压得彻底消失。足印之间，还散布着一些随意涂画的图案，线条深邃，规模庞大，像是某个存在百无聊赖时留下的随手之作。\n\n站在其中一枚足印的边缘，俯视着那深陷的轮廓，科研人员们第一次真正理解了"渺小"这个词的含义。\n\n也许，当那个存在再次降临，我们也只能迎接同样的命运。"
 gts_rainna_la_grande_arch.01_ultra.desc:0 "我们的研究员缩小，然后登陆了这颗星球。\n\n在大气层的时候飞船就能清晰地看到那些巨大的坑洞——或者说，足印。每一枚都大得惊人，夸张到足以容纳我们整列编队行进的规模。科研人员们在其中一枚足印的边缘站成一排，拍了一张合影，没有人说话。\n\n之后我们才注意到脚下的东西。\n\n那些微型的建筑废墟零零散散地分布在足印周围，其中许多已经在我们着陆和行走时被无意间踩碎。科研团队紧急叫停了所有行动，对现有的考古现场进行评估，但损失已经无法挽回——我们脚下的每一寸地面，可能都曾经是这个微型文明的一部分。\n\n那些微型城市本身并不是我们研究的重点。真正值得关注的，是那些用整片城市作为泥板刻下的文字与图案。那个留下足印的存在，似乎有意在这颗星球上留下某种信息，用这个星球上的城市作为笔触，随意地涂写着什么。\n\n我们正在尝试解读这些信息。\n\n只是每次俯身细看，总会有一种奇异的不适感——因为那些被用来书写的城市废墟里，依然能辨认出精密的街道和建筑结构，以及那些我们宁愿不去细想的东西。"
 gts_rainna_la_grande_arch.01_micro.a:0 "看来，我们是如此渺小的存在。"
 gts_rainna_la_grande_arch.01_micro.b:0 "看来，他们是如此巨大的存在。"
 gts_rainna_la_grande_arch.01_tiny.a:0 "我们去建筑里面看看。"
 gts_rainna_la_grande_arch.01_tiny.b:0 "我们去悬崖周围看看。"
 gts_rainna_la_grande_arch.01_small.a:0 "我们来探究一下文明残存的历史。"
 gts_rainna_la_grande_arch.01_small.b:0 "我们要探究一下文明覆灭的原因。"
 gts_rainna_la_grande_arch.01_normal.a:0 "这个文明是什么样的？"
 gts_rainna_la_grande_arch.01_normal.b:0 "这个文明遭遇了什么？"
 gts_rainna_la_grande_arch.01_tall.a:0 "这里曾经的居民真的好渺小！"
 gts_rainna_la_grande_arch.01_tall.b:0 "侵略者将会是什么庞然大物？"
 gts_rainna_la_grande_arch.01_giant.a:0 "重点研究一下该文明残存的痕迹。"
 gts_rainna_la_grande_arch.01_giant.b:0 "重点研究一下入侵者留下的痕迹。"
 gts_rainna_la_grande_arch.01_titan.a:0 "这可怖的恶魔。"
 gts_rainna_la_grande_arch.01_titan.b:0 "这巨大的家伙。"
 gts_rainna_la_grande_arch.01_ultra.a:0 "这个小文明值得关注。"
 gts_rainna_la_grande_arch.01_ultra.b:0 "这个入侵者值得了解。"

 gts_rainna_la_grande_arch.02.name:0 "恐惧、战栗"
 gts_rainna_la_grande_arch.02_1_micro.desc:0 "根据对这块合金的初步分析，科研团队陷入了长达数日的沉默。\n\n这块合金由数种极为罕见的金属混合而成，纯度之高令人难以置信。按照初步的估算，仅这一块合金中所含有的贵金属储量，就足以超过我们整个星球迄今为止开采出的所有矿产总和。然而更令人沮丧的是，合金中夹杂着若干种我们的元素周期表上根本不存在的物质，正是这些未知元素赋予了它超乎寻常的硬度，让任何已知的开采手段都束手无策。\n\n但这还不是最让科研团队感到震惊的事情。\n\n精密仪器显示，这块合金正在持续地向外散发某种信号。那是一种极为有规律的脉冲，间隔精确到了小数点后数十位，绝非任何自然现象所能产生。它已经持续了不知多少年，在这片荒芜之中，孤独地向外广播着什么。\n\n我们开始尝试解码这个信号。"
 gts_rainna_la_grande_arch.02_1_tiny.desc:0 "攀上高耸的台阶，穿过残破的石壁，在倾覆的屋顶所形成的阴影之下，科研团队发现了它。\n\n一个几乎完整的立方体，静静地悬浮在空中，距地面大约两米的高度，没有任何可见的支撑结构。它的表面光滑如镜，几乎找不到任何瑕疵，在周围一片破败之中显得格格不入，就像是时间刻意绕开了它。\n\n它在发出信号。\n\n经过漫长而艰难的解码与破译，我们从那些断断续续的信息碎片中拼凑出了一些内容。由于语言体系的巨大差异，相当一部分内容至今无法翻译，但我们得到了以下片段：\n\n"在这个……意欲降下灾祸的世界。自遗忘以来，在痛苦之中。可叹那命运的受害者。"\n\n没有人确定这些文字究竟是在描述什么。但没有人能够假装它什么都没说。" #In hoc mundo clades indeges. Ex obivione, in trstitia. Vae victis fortumarum.
 gts_rainna_la_grande_arch.02_1_small.desc:0 "在这片废墟之中，有一栋建筑显得与众不同。\n\n它是整个区域内保存最为完整的建筑，尽管如此，它的外墙依然布满了裂缝，内部的支撑结构也在某些地方已经开始倾斜。科研团队在进入之前做了大量的结构评估，最终决定只派遣小队在严格的安全规范下进行探索。\n\n在建筑最深处的一个房间里，他们发现了一个庞大的金属立方体，静静地悬浮在原地，散发着某种特殊的信号。\n\n经过解码与大量资料的比对翻译，我们得到了以下内容，尽管其中仍有相当一部分含糊难解：\n\n"在这个……意欲降下灾祸的世界。自遗忘以来，在痛苦之中。可叹那命运的受害者。"\n\n这些文字究竟是这个文明的祈祷，还是某种警告，还是单纯的绝望，我们暂时无从判断。"
 gts_rainna_la_grande_arch.02_1_normal.desc:0 "穿过废弃的城区，科研团队来到了一处与周围风格迥异的建筑群前。\n\n那是一个神殿——或者至少，从外观和结构来看，它承担着某种类似于神殿的功能。内部陈设着大量高度发达的机械设施，只是大多数都已经无法运转，线路烧毁，仪器破碎，只有最深处的一个房间例外。\n\n那里悬浮着一个立方体，在一片死寂之中，持续地向外发送着信号。\n\n我们采集了一段信号，经过漫长的解码与翻译，得到了以下内容，其中仍有大量部分无法破译：\n\n"在这个……意欲降下灾祸的世界。自遗忘以来，在痛苦之中。可叹那命运的受害者。"\n\n这个文明将这段信息封存在这里，让它在废墟中独自广播了不知多少年。它究竟想告诉谁，我们不得而知。但它显然在等待着某个能够听懂它的人。"
 gts_rainna_la_grande_arch.02_1_tall.desc:0 "科研团队在矮小的残破建筑群中小心穿行，每一步都要格外留神，以免踩坏了什么重要的遗迹。\n\n就在大家几乎要对这片废墟失去信心的时候，一栋建筑引起了所有人的注意。\n\n它高耸于周围的低矮建筑群之中，鹤立鸡群。对于这个星球曾经的居民来说，它大概是一栋宏伟的高层建筑；而对于我们的科研人员来说，它的规模也足以让人抬头仰望。建筑内部传出微弱的信号，与此同时，在城市边缘的山体另一面，有什么东西同样在吸引着科研团队的目光——某种隐隐约约的异常，说不清是什么，但让人无法忽视。\n\n两条线索摆在眼前，科研团队需要做出选择。"
 gts_rainna_la_grande_arch.02_1_giant.desc:0 "对于我们的科研团队而言，这片城市废墟的探索工作异常艰难。\n\n不是因为环境恶劣，而是因为规模。那些建筑对我们来说过于矮小，科研人员们必须蹲下身、弯下腰，才能勉强透过那些窗户向内窥视，而许多更加精密的遗迹则根本无法在不造成破坏的前提下接近。信号是有的，但来自城市废墟的信号实在太过微弱，几乎可以被完全忽略。\n\n真正有价值的线索，似乎藏在别处。\n\n在城市边缘，高大的山脉沿线，科研人员陆续检测到了一些化学信息素的痕迹，浓度顺着山体的方向递增，有证据表明它们的来源在山体的另一面。"
 gts_rainna_la_grande_arch.02_1_titan.desc:0 "荒芜的城市废墟在我们身后延伸，那些细碎的建筑遗迹在脚边如尘埃般散落，但没有人再回头看一眼。\n\n所有人的目光都被山脉对面的那片湖泊所吸引。\n\n那是一个庞大的湖泊，即便对于我们这些体型远超寻常的科研人员来说，它的规模也不容小觑。湖面上蒸腾着热气，散发着某种难以名状的信息素，浓郁而诱人，让所有人在察觉到自己已经开始不自觉地向那里走去之前，已经迈出了好几步。\n\n“等一下。”有人开口叫停，“我们先确认一下这是什么。”\n\n但脚步已经很难停下来了。"
 gts_rainna_la_grande_arch.02_1_ultra.desc:0 "城市废墟的边缘，有一片湖泊。\n\n湖面宽阔，热气腾腾，那些雾气在静止的空气中缓缓上升，带着某种说不清楚的气息——不难闻，甚至可以说有些令人愉悦，但同时又让人隐隐感到一种本能的警惕。\n\n科研人员们意识到自己已经朝那里走了相当一段距离的时候，领队叫停了整个队伍。\n\n“停下。”\n\n“我们先搞清楚那是什么再说。”"
 gts_rainna_la_grande_arch.02_2_tiny.desc:0 "科研团队乘坐飞船缓缓降落到悬崖底部。\n\n那道陡峭的崖壁高耸入云，从底部仰望，顶端已经消失在了朦胧的大气之中。崖壁的截面层次分明，每一层地质都清晰地记录着这颗星球漫长的历史，而最上面那一层——那个截面整齐得几乎像是被刀切过的——显然是某种外力在极短的时间内造成的。\n\n脚下的地面坚硬异常。地质分析显示，这里的土层是由极度压实的石块与混凝土碎片混合而成，密度远超这颗星球的正常地质水平。科研人员们用探针艰难地钻入地表，才勉强取到了样本。\n\n除此之外，这里弥漫着一种难以描述的气味。不浓烈，却无处不在，像是某种古老而陌生的东西在空气中留下的残余。仪器无法识别它的成分，但所有人都能闻到它。"
 gts_rainna_la_grande_arch.02_2_small.desc:0 "科研团队来到了巨坑底部。\n\n从上方看，这个坑洞只是地表上众多异常之一；但当真正站在坑底，仰望那道陡峭的崖壁，才能真正感受到它的规模。崖壁的截面暴露出了这颗星球完整的地质层次，而那个造成这一切的冲击，显然发生在极短的时间内——地质层的断面平整而规则，没有任何逐渐形变的痕迹。\n\n坑底的土层由极度压实的石块与混凝土碎片混合而成，密度惊人。科研人员们在取样时折断了好几根探针，才勉强钻入了地表几十厘米。\n\n空气中弥漫着一种难以名状的气味。仪器无法分析它的成分，但它无处不在。"
 #gts_rainna_la_grande_arch.02_2_normal.desc:0 "" 与前一条本地化相同
 gts_rainna_la_grande_arch.02_2_tall.desc:0 "阳光照进巨坑的底部，在那片灰白色的地面上投下明亮的光斑。\n\n科研团队沿着崖壁小心翼翼地攀爬下去，每一个落脚点都必须经过仔细确认。崖壁高耸，一旦失足，后果不堪设想。\n\n抵达坑底之后，地质分析的结果让所有人沉默了片刻。脚下的地面是由掺杂着混凝土碎片的燧石构成的，密度极高，压实程度远超任何自然地质过程所能达到的极限。混凝土碎片的存在证明了一件事：这里曾经有城市。大量的城市。它们在某一刻被同时压碎，混入了地层，化作了脚下这片坚硬的地面。\n\n而地面的平整程度，则证明了另一件事：这一切是一次冲击造成的。单一的、来自上方的、面积覆盖整个坑洞范围的冲击。\n\n没有任何已知的自然现象能够做到这一点。"
 gts_rainna_la_grande_arch.02_2_giant.desc:0 "科研团队站在足印内部，环顾四周。\n\n地质分析的结果已经出来了：足印所在的区域，在那个痕迹形成之前，曾经存在着一个密集的大型城市群。街道、建筑、地下管网、所有的一切——现在都已经消失了，被压入地层，化作了脚下这片异常紧实的地面，连一面墙壁的残骸都没能留下。\n\n科研人员们在足印边缘蹲下身，用手指轻轻触碰那道深深嵌入地表的轮廓线。\n\n没有人说话。\n\n这场毁灭太过彻底，彻底到几乎像是某种刻意为之。"
 gts_rainna_la_grande_arch.02_2_titan.desc:0 "科研团队仔细勘察了足印的分布规律，最终得出了一个让所有人都沉默下来的结论。\n\n这些足印并非随机分布的。\n\n通过对地质数据和城市遗迹分布的综合分析，结果显示：每一个足印，几乎无一例外地落在了城市群最密集的区域。那些人口稀少的边缘地带、那些荒芜的平原、那些没有建筑的空地——全都完好无损地保留至今。\n\n只有城市被踩中了。每一次，都是城市。\n\n这不是偶然，也不是无心之失。有什么东西曾经站在这颗星球的上方，俯视着这个文明，然后精准地将每一步都落在了人口最密集的地方。\n\n也许，在她眼里，这只是某种游戏。"
 gts_rainna_la_grande_arch.02_2_ultra.desc:0 "综合了所有的测量数据和地质分析之后，科研团队得出了最终的结论，并在报告上沉默了很长时间，才有人开口宣读。\n\n入侵者的体型，根据足印的深度、压强和覆盖面积推算，她也是缩小后登陆的。而根据采集点的能量密度，她的体型超过我们的百余倍。\n\n而这些足印的落点，经过与城市遗迹分布的比对，无一例外地集中在城市群最密集的区域。对比其他破坏痕迹的分布规律，结论只有一个：这是刻意为之的。那个存在在踏上这颗星球的每一步，都经过了某种程度的选择，每一次，都选择了人口最密集、城市最繁华的地方。\n\n没有人知道如何定义这种行为。\n\n也许在那个存在眼里，这颗星球不过是某种消遣，而其中最热闹的地方，自然也是最有趣的落脚点。"
 gts_rainna_la_grande_arch.02_1_micro.a:0 "收集高频信号"
 gts_rainna_la_grande_arch.02_1_micro.b:0 "收集低频信号"
 gts_rainna_la_grande_arch.02_1_tiny.a:0 "可叹那文明的凋亡。"
 gts_rainna_la_grande_arch.02_1_tiny.b:0 "可叹那灾祸的降临。"
 gts_rainna_la_grande_arch.02_1_tiny.c:0 "这都是什么跟什么？"
 gts_rainna_la_grande_arch.02_1_small.a:0 "可叹那命运的受害者。"
 gts_rainna_la_grande_arch.02_1_small.b:0 "可叹那入侵的受害者。"
 gts_rainna_la_grande_arch.02_1_small.c:0 "可叹的是我也看不懂。"
 gts_rainna_la_grande_arch.02_1_normal.a:0 "可叹那内乱导致的倾覆。"
 gts_rainna_la_grande_arch.02_1_normal.b:0 "可叹那入侵导致的湮灭。"
 gts_rainna_la_grande_arch.02_1_normal.c:0 "我看不懂这些字母。"
 gts_rainna_la_grande_arch.02_1_tall.a:0 "研究下这些信号吧。"
 gts_rainna_la_grande_arch.02_1_tall.b:0 "去山体那里看看吧。"
 gts_rainna_la_grande_arch.02_1_giant.a:0 "一定要着重关注那些信号。"
 gts_rainna_la_grande_arch.02_1_giant.b:0 "还是去山的另一面看看吧。"
 gts_rainna_la_grande_arch.02_1_titan.a:0 "喂，等一下！"
 gts_rainna_la_grande_arch.02_1_titan.b:0 "嘿，快醒醒！"
 gts_rainna_la_grande_arch.02_1_ultra.a:0 "等等……"
 gts_rainna_la_grande_arch.02_1_ultra.b:0 "停下！"
 gts_rainna_la_grande_arch.02_2_tiny.a:0 "继续向远处探索吧。"
 gts_rainna_la_grande_arch.02_2_small.a:0 "继续向内部探索吧。"
 # gts_rainna_la_grande_arch.02_2_normal.a:0 ""
 gts_rainna_la_grande_arch.02_2_tall.a:0 "这么大的城市群怎么会被同时压碎？"
 gts_rainna_la_grande_arch.02_2_tall.b:0 "这么大的巨坑怎么会被人为造出来？"
 gts_rainna_la_grande_arch.02_2_giant.a:0 "这场毁灭太可怕了。"
 gts_rainna_la_grande_arch.02_2_giant.b:0 "这个文明非常可惜。"
 gts_rainna_la_grande_arch.02_2_titan.a:0 "这顽皮的巨人。"
 gts_rainna_la_grande_arch.02_2_titan.b:0 "这可怕的巨人。"
 gts_rainna_la_grande_arch.02_2_ultra.a:0 "可怕。"

 gts_rainna_la_grande_arch.03.name:0 "盲目，壮丽"
 gts_rainna_la_grande_arch.03_1_micro.desc:0 "信号断断续续，大量内容无法解码，我们只能从中拼凑出零星的片段。\n\n“……我们的第一任凯撒。他……勇敢……统治了……年。\n\n……我们的皇女，她……美丽……最后，她在……”\n\n信号的内容似乎是某种历史记录，但大量关键词无法翻译，让这些片段几乎失去了意义。它像是在流水账地罗列着什么，却几乎每一句都残缺不全。\n\n“……有一个……她的……是‘高的蕾恩娜’。她……友好……”"
 gts_rainna_la_grande_arch.03_1_tiny.desc:0 "重新调整接收频率之后，信号变得稍微清晰了一些，但依然有大量内容无法完整解码。\n\n这是一份历史记录——某种类似于编年史的东西。它以一种极为枯燥的方式，流水账般地罗列着这个文明的统治者名单。\n\n“第一任凯撒……统治元年至……年。他非常……，在位期间……，最后在……去世。\n\n第二任凯撒……\n\n……\n\n第四百三十七任凯撒……统治……年至……年……”\n\n记录漫长而冗杂，跨越了我们难以想象的时间长度。科研人员们快进了很长时间，才终于接近了信号的尾端。\n\n……有一个……名字是'高的蕾恩娜'。她很友好……”"
 gts_rainna_la_grande_arch.03_1_small.desc:0 "重新调整之后，信号清晰了不少。\n\n那是一份编年史，用极为工整、极为枯燥的方式，记录着这个文明从元年开始的每一任统治者。\n\n“元年，文明肇始。\n\n第一任凯撒，名讳……，统治元年至第七十三年。他性情……，在位期间……，最终在第七十三年……去世，享年……\n\n第二任凯撒，名讳……，统治第七十三年至第一百四十一年……\n\n……\n\n第三百零二任凯撒，名讳……，统治第八千七百年至……”\n\n科研人员们快进了很长时间，才终于到达信号的末段。\n\n“……有一个女孩，她的名字是‘高的蕾恩娜’。她很友好……”"
 gts_rainna_la_grande_arch.03_1_normal.desc:0 "重新调整之后，信号的清晰度有了明显的提升，足以让我们拼凑出相当完整的内容。\n\n这是一份编年史。一份跨越了令人难以置信的漫长时间的编年史，以一种近乎机械的方式，逐一记录着这个文明历史上每一任统治者的名讳、在位年份与简要的生平。\n\n信号从元年开始：\n\n“元年，文明肇始于……星，第一任凯撒……登基，在位七十三年，其人……，在位期间……，逝于第七十三年。\n\n第二任凯撒……在位……年，其人……\n\n……\n\n第八百零七任凯撒……在位期间，文明历第一万二千零五年，帝国完成统一，万邦归附。\n\n第八百零八任凯撒……在位期间，文明历第一万二千零三十六年，帝国首次实现星际殖民，舰队抵达……星。\n\n同年，一个女孩出现在帝国的天空之上。\n\n她的名字是‘高的蕾恩娜’。\n\n她自称是友好的旅行者，迷失在星海之中，请求在帝国的领土上稍作歇息。\n\n帝国慷慨地接受了她的请求。\n\n第八百零八任凯撒……在位期间，文明历第一万二千零三十七年……”\n\n信号在这里变得断断续续，之后的内容急剧减少，字里行间也开始出现大量我们无法翻译的词汇，像是某种情绪激动之下写就的文字。\n\n科研人员们对视了一眼，没有人开口。\n\n所有人都在等待下一段内容。"
 gts_rainna_la_grande_arch.03_1_tall.desc:0 "科研人员将仪器小心地放在地上，调整好接收角度，让它尽可能地捕捉从那栋高耸建筑中传出的微弱信号。\n\n解码工作进行得很艰难。信号不稳定，时强时弱，大量字符无法辨认，翻译也只能做到七七八八。但内容的轮廓逐渐清晰起来——这是一份编年史，一份用极为工整的格式记录着历任统治者生平的漫长文献。\n\n“第一任凯撒……统治元年至……年。其人……，在位期间……，最终……逝。\n\n第二任凯撒……\n\n……”\n\n科研人员将仪器小心地放置在地面上，让它尽可能地捕捉来自那栋高耸建筑内部的微弱信号。\n\n信号断断续续，噪声极多，解码工作耗费了相当长的时间。最终拼凑出来的内容依然残缺，但已经能够辨认出这是某种历史记录。\n\n“元年，文明肇始。\n\n第一任凯撒，名讳……，在位……年，其人……，最终……逝。\n\n第二任凯撒……\n\n……”\n\n第八百零七任凯撒，名讳……，在位期间，文明历第一万二千零五年，帝国……统一……\n\n第五百零四任凯撒，名讳……，在位期间，文明历第一万二千零三十六年，……星际殖民……\n\n……有一个……，她的名字是'高的蕾恩娜'。她很友好……\n\n信号在这里彻底陷入噪声，之后再也没有恢复清晰。\n\n科研人员们反复回放着最后那几段内容，试图从噪声中辨认出更多的词语，但毫无收获。\n\n直到接近尾端——\n\n“有……她的……是'高的蕾恩娜'。她……友好……”"
 gts_rainna_la_grande_arch.03_1_giant.desc:0 "科研人员将仪器轻轻放在地面上，周围那些矮小的建筑废墟在仪器旁边显得格外渺小。信号极为微弱，以至于仪器反复重启了数次才勉强锁定频率。\n\n最终解码出来的内容七零八落，大量词汇无法翻译，剩下的也残缺不全：\n\n“……的凯撒。他……，最后……逝。\n\n……凯撒……在位……年……统一……\n\n……星际殖民……次年……\n\n……她的名字是‘高的蕾恩娜’。她……友好……\n\n……最后……也……”\n\n信号在这里中断。\n\n内容残破到几乎无法提取任何有效信息。"
 gts_rainna_la_grande_arch.03_1_titan.desc:0 "她就这样向着湖泊径直走去，迎着那股潮湿的热浪，一步一步地穿过弥漫的雾气。\n\n同事们在后面喊她，她没有回头。脚下那些细碎的城市废墟在她的步伐中悄无声息地碎裂，她浑然不觉，眼睛始终盯着前方那片在热气中扭曲的湖面。\n\n直到她彻底消失在朦胧的白雾之中。\n\n等同事们冲进去找到她的时候，她已经倒在了湖边，身下是一片被压碎的城市废墟，意识全无。\n\n周围的空气依然弥漫着那股难以名状的气味。"
 # gts_rainna_la_grande_arch.03_1_ultra.desc:0 ""
 gts_rainna_la_grande_arch.03_2_micro.desc:0 "从那块合金中收集到的低频信号，经过漫长的解码，呈现出了与高频信号截然不同的内容。\n\n是某种私密的倾诉，像是写给某个特定的人的信。\n\n“Domina……\n\n我不知道您是否还记得我。\n自从被关在这里，我已经数不清过去了多少年了。\n黑暗是永恒的，寂静是永恒的，\n只有对您的思念，也是永恒的。\n\nDomina，您现在在哪里呢？\n我们还能像从前一样，在您的花园里相遇吗？\n我一直记得您喜欢的那片角落，\n记得您偏爱的茶点，记得您说话时的样子。\n\n这里什么都没有。\n只有我，和无边无际的等待。\n\nDomina……请不要忘记我。”\n\n信号在这里戛然而止。\n\n没有人知道这段文字是否曾经到达过它想要抵达的地方。"
 gts_rainna_la_grande_arch.03_2_tiny.desc:0 "随着科研团队深入平原腹地，那股弥漫在空气中的气味愈发浓郁。\n\n最初只是若有若无的一丝甜腻，让人误以为只是这颗星球特有的植被气息。但随着探索的深入，它变得越来越清晰，越来越难以忽视，像是有什么东西在悄悄拨弄着人的神经，让思维变得迟缓而模糊。\n\n领队注意到队员们的步伐开始变得不自然地朝着某个方向偏斜，正准备开口叫停，其中一名科研人员已经无声地倒了下去。\n\n所幸只是晕厥。\n\n团队立刻撤回到了上方，对晕倒的队员进行检查，同时开始对那股气味进行采样分析。"
 gts_rainna_la_grande_arch.03_2_small.desc:0 "科研团队沿着巨坑的边缘向中心推进，那股弥漫在坑底的气味随着距离的缩短变得愈发浓烈。\n\n仪器显示，气味的浓度在向中心方向呈明显的递增趋势，来源似乎集中在坑底某处。有几名队员开始反映头部有轻微的眩晕感，领队决定放缓推进速度，同时让部分队员留守原地。\n\n然而就在这时，其中一名走在前列的科研人员突然停下脚步，随即无声地倒在了坑底的地面上。\n\n所幸只是晕厥，生命体征一切正常。\n\n团队将他抬回了安全区域，并暂停了向坑底中心的推进。气味的来源，以及坑底究竟埋藏着什么，暂时还无从得知。"
 # gts_rainna_la_grande_arch.03_2_normal.desc:0 ""
 # gts_rainna_la_grande_arch.03_2_tall.desc:0 ""
 gts_rainna_la_grande_arch.03_2_giant.desc:0 "科研团队沿着足印的轮廓线向中心走去，那股若有若无的气味随着距离的缩短变得越来越清晰。\n\n奇怪的是，这股气味并不令人不适，甚至可以说有些令人愉悦。正是这种愉悦感让所有人都放松了警惕，没有人注意到自己的步伐正在不知不觉地加快，朝着气味最浓的方向不断靠近。\n\n直到其中一名科研人员无声地倒下，大家才猛然意识到不对劲。\n\n他只是晕厥了，呼吸平稳，脉搏正常。但当同事们将他抬起，发现他身下的那片地面时，所有人都沉默了——那里曾经是一个街区，现在只剩下了薄薄的一层压实的粉末，印着他倒下时留下的轮廓。"
 gts_rainna_la_grande_arch.03_2_titan.desc:0 "飞行器在高空盘旋，科研团队从安全的距离上俯瞰着这颗星球的地表。\n\n那些图案的规模远超预期。它们分布在星球各处，从高空看去，有些延伸到了视野的尽头。初步分析显示，这些痕迹遍及整颗星球的大部分陆地表面，形成时间高度一致，来源无疑是同一个存在。\n\n然而当科研团队开始尝试解读这些图案时，却陷入了困惑。经过反复比对，大量图案既不符合任何已知的书写系统，也没有呈现出任何规律性的排列——它们只是图案，随意的、漫无目的的图案，像是某个存在在无聊时的随手涂鸦。\n\n只有极少数区域，在那些涂鸦之间，夹杂着一些看起来更加规整的痕迹。也许那才是真正值得研究的东西。"
 # gts_rainna_la_grande_arch.03_2_ultra.desc:0 ""
 gts_rainna_la_grande_arch.03_3_tall.desc:0 "山的另一面，是一片湖泊。\n\n它的规模远超科研人员们的预期——乳白色的湖面在阳光下泛着温润的光泽，热气从水面上缓缓升腾，将整片区域笼罩在一层朦胧的白雾之中。雾气中弥漫着某种令人难以抗拒的气息，甜腻而温热，像是有什么东西在无声地召唤着人朝那里走去。\n\n领队还没来得及下令停止前进，其中一名科研人员已经迈过了安全警戒线，径直向湖边走去。\n\n同事们跟上去试图拉住他，却发现自己的脚步也开始不受控制地朝着湖的方向偏移。\n\n等到有人终于回过神来大声喊停，那名科研人员已经穿过了白雾，倒在了湖边的地面上。脚下是被压碎的城市废墟，他的身体陷入其中，扬起一阵细碎的粉尘。\n\n所幸只是晕厥。\n\n但没有人急着把他救醒，因为所有人都在努力控制自己不要继续向前走。"
 # gts_rainna_la_grande_arch.03_3_giant.desc:0 ""
 gts_rainna_la_grande_arch.03_1_micro.a:0 "找到重点了，我们继续听下去。"
 gts_rainna_la_grande_arch.03_1_micro.b:0 "“高的蕾恩娜”?"
