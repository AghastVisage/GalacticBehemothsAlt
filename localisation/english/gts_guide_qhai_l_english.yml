l_english:
  #  千海的通讯
  NAME_qhai_communicate: "Qhai's Communication"
  #  千海的通讯方式已添加
  #  §r千海§!的通讯方式已添加
#  §r千海§!的通讯方式已添加
  MESSAGE_GTS_QHAI_DESC: "§rQhai's§! contact information added"
  gts_guide_qhai.1.name: "Qhai's Communication"
  #  通讯正常接通了：\n§r"你好呀，这里是千海，小小的统治者，今天有什么需要吗？“§!
  gts_guide_qhai.1.desc.1: "Connection established:\n§r\"Hello there, this is Qhai. Little Ruler, do you need anything today?\"§!"
  #  通讯正常接通了：\n§r"贵安，时间正巧，刚好我现在有空，有什么特别的事情想问吗。"§!
  gts_guide_qhai.1.desc.2: "Connection established:\n§r\"Good day. Perfect timing, I happen to be free right now. Is there anything in particular you wanted to ask?\"§!"
  #  通讯正常接通了：\n§r"哎呀，最近真的很忙呢，但还是为你专门抽出了时间呢，感谢我吧，哼哼。”§!
  gts_guide_qhai.1.desc.3: "Connection established:\n§r\"Oh my, I've been really busy lately, but I still made time just for you. You should thank me, hehe.\"§!"
  #  通讯接通失败了：\n“滴——滴——”联络器传来了一阵忙音，一段时间后播放了自动语音：\n§r“哈—啊—就算是魅魔偶尔也需要休息，功能权限已经为你开通了，请自便哦。“§!
  #  通讯接通失败了：\n“滴——滴——”联络器传来了一阵忙音，一段时间后播放了自动语音：\n§r"哈—啊—就算是魅魔偶尔也需要休息，功能权限已经为你开通了，请自便哦。"§!
  gts_guide_qhai.1.desc.4: "Connection failed:\\n\"Beep—beep—\" The communicator emits a busy tone. After a while, an automated voice plays:\\n§r\"Yawn—even succubi need rest sometimes. Functional permissions have been opened for you, please help yourself.\"§!"
  #  通讯正常接通了：\n有少女的惊呼从通讯器中传来\n§r"唔呀！怎么专找这个时候。咳咳，你好小小的统治者，请忽略我刚刚的失态~"§!
  gts_guide_qhai.1.desc.5: "Connection established:\\nA girl's gasp comes from the communicator\\n§r\"Whoa! Why pick this exact moment? ...Ahem, hello Little Ruler, please ignore my slip-up just now~\"§!"
  #  通讯正常接通了：\n有少女的自言自语从通讯器中传来\n§r"最近子宫总是胀胀的，还是有点不习惯呢。啊，有什么需要的吗，统治者桑~"§!
  gts_guide_qhai.1.desc.6: "Connection established:\\nA girl's muttering comes from the communicator\\n§r\"My womb has been feeling bloated lately, still a bit unaccustomed to it. Ah, do you need something, Ruler-san~\"§!"
  gts_guide_qhai.1.desc.7: "Connection established:\nA girl's puzzled voice comes from the communicator\n§r\"Eh, how strange. Have you been calling me a lot lately, or is it just my imagination?§!"
  #  尝试呼唤了千海：\n某种巨大的阴影忽然将你覆盖，连忙抬头看去，某个黑色的巨大平面正铺天盖地向你袭来，躲避已是徒劳。\n\n你下意识的闭眼，却被剧烈的狂风吹得站不稳身体。你揉了揉被巨响振得有些发疼的的耳朵，耳边传来了千海略带棒读的声音。\n\n§r“呀，没看清，真是对不起，下次一定注意~”§!
  #  尝试呼唤了千海：\n某种巨大的阴影忽然将你覆盖，连忙抬头看去，某个黑色的巨大平面正铺天盖地向你袭来，躲避已是徒劳。\n\n你下意识的闭眼，却被剧烈的狂风吹得站不稳身体。你揉了揉被巨响振得有些发疼的的耳朵，耳边传来了千海略带棒读的声音。\n\n§r"呀，没看清，真是对不起，下次一定注意~”§!
  gts_guide_qhai.1.desc.8: "Attempted to call Qhai:\\nA massive shadow suddenly covers you. Looking up, you see a gigantic black plane coming at you, covering the sky and earth. Evasion is futile.\\n\\nYou instinctively close your eyes, but are blown unsteady by violent winds. Rubbing your ears which ache from the loud noise, you hear Qhai's voice, sounding slightly monotonous.\\n\\n§r\"Oops, I didn't see clearly. So sorry, I'll be careful next time~\"§!"
  #  尝试呼唤了千海：\n§r"呼~"§!\n\n某种吐息从身后你全身覆盖，你下意识的后退两步，脚下却陷入了柔软的地面:"\n\n§r嘿嘿，小小的统治者，我的掌心感觉怎么样，放心吧，不会让你掉下去的。"§!
  gts_guide_qhai.1.desc.9: "Attempted to call Qhai:\\n§r\"Phew~\"§!\\n\\nA breath covers your entire body from behind. You instinctively take two steps back, but your feet sink into soft ground:\\n\\n§r\"Hehe, Little Ruler, how does my palm feel? Don't worry, I won't let you fall.\"§!"
  #  尝试呼唤了千海：\n等了许久，千海都没有来。你正打算重新呼唤坏心眼的魅魔少女，一阵银铃般的笑声从外部传来。\n\n§r"嘿嘿，我已经到啦，哎？你的小盒子做的可正精致。”§!\n\n你四处寻找声音来源，最后赫然发现，指挥中心的舷窗被千海那巨大的竖瞳占据了整个视野，正略带笑意地盯着你的动作
  gts_guide_qhai.1.desc.10: "Attempted to call Qhai:\\nAfter waiting a long time, Qhai didn't appear. Just as you plan to call the mischievous succubus again, bell-like laughter comes from outside.\\n\\n§r\"Hehe, I'm already here. Eh? Your little box is made quite exquisitely.\"§!\\n\\nYou look around for the source of the voice, finally discovering that the command center's viewports are completely occupied by Qhai's massive vertical pupil, staring at your actions with a hint of a smile."
  #  开启通讯器
  gts_guide_qhai.1.option.1: "Open Communicator"
  gts_guide_qhai.1.option.1.tooltips: "§rFriendly reminder: You can find the Giantess Communicator by going to the 'Discovery' tab on the left side of the main interface and clicking into the 'Relics' submenu.§!"
  #  关闭关键提示
  gts_guide_qhai.1.option.2.1: "Disable Key Hints"
  #  §r如果这么做的话，一些关键事件之前你就得不到我的建议了哦，当然我也乐得清闲~§!
  gts_guide_qhai.1.option.2.1.tooltips: "§rIf you do this, you won't get my advice before some key events. Of course, I'm happy to relax~§!"
  #  开启关键提示
  gts_guide_qhai.1.option.2.2: "Enable Key Hints"
  #  §r我才放假没多久，干活那种事情补药啊。§!
  gts_guide_qhai.1.option.2.2.tooltips: "§rI just started my vacation not long ago, I don't want to work!§!"
  #  和千海聊天
  #  开启关键提示
  gts_guide_qhai.1.option.3: "Enable Key Hints"
  #  §r我才放假没多久，干活那种事情补药啊。§!
  gts_guide_qhai.1.option.3.tooltips: "§rI just went on vacation not long ago, please no working!§!"
  #  §r与千海聊天§!
  gts_guide_qhai.1.option.4: "§rChat with Qhai§!"
  #  §r可以和我聊聊天哦，也许会有一些你不知道的秘辛§!
  gts_guide_qhai.1.option.4.tooltips: "§rYou can chat with me, maybe I'll share some secrets you don't know~§!"
  #  转接联系人
  gts_guide_qhai.1.option.5: "Transfer to Contact"
  #  切换至[event_target:gts_qhai_daughter.GetName]视角
  gts_guide_qhai.1.option.6: "Switch to [event_target:gts_qhai_daughter.GetName]'s Perspective"
  #  查看成就
  gts_guide_qhai.1.option.7: "View Achievements"
  gts_guide_qhai.1.option.quit: "Nothing else"
  #  千海的通讯
  #  千海的转接
  gts_guide_qhai.2.name: "Qhai's Transfer"
  gts_guide_qhai.2.desc.1: "§rAhem, Customer Service Qhai at your service. Who would you like to be transferred to... Eh? You don't have anyone to contact yet.§!"
  #  §r咳咳，客服千海为您服务，请问你要转接到哪位联系人呢§!
  gts_guide_qhai.2.desc.2: "§rAhem, Customer Service Qhai at your service. Who would you like to be transferred to?§!"
  #  转接到劳尔斯
  gts_guide_qhai.2.option.1: "Transfer to Rauls"
  #  §r为您转接到劳大吗，好的没问题~§!
  gts_guide_qhai.2.option.1.tooltips: "§rTransferring you to Big Rauls? Okay, no problem~§!"
  #  转接到犽戎
  gts_guide_qhai.2.option.2: "Transfer to Yarong"
  #  §r为您转接到小龙吗，当前只有帮她换衣服的功能哦§!
  gts_guide_qhai.2.option.2.tooltips: "§rTransferring you to the Little Dragon? Currently, you can only help her change clothes.§!"
  #  转接到林凤
  gts_guide_qhai.2.option.3: "Transfer to Lin Feng"
  #  §r为您转接到涩狐狸吗，当前只有帮她换衣服的功能哦§!
  gts_guide_qhai.2.option.3.tooltips: "§rTransferring you to the Lewd Fox? Currently, you can only help her change clothes.§!"
  #  转接到洛蒂
  gts_guide_qhai.2.option.4: "Transfer to Lottie"
  #  §r为您转接到洛蒂吗，对她的某些要求需要累积时间呢。§!
  gts_guide_qhai.2.option.4.tooltips: "§rTransferring you to Lottie? Some requests for her require accumulated time.§!"
  #  转接到无声铃鹿
  gts_guide_qhai.2.option.5: "Transfer to Silent Suzuka"
  #  §r为您转接到铃鹿吗，没问题哦§!
  gts_guide_qhai.2.option.5.tooltips: "§rTransferring you to Suzuka? No problem.§!"
  #  转接到特波利卡
  gts_guide_qhai.2.option.6: "Transfer to Tlipoca"
  #  §r为您转接到小死神吗，哪个星球又要遭殃了呢§!
  gts_guide_qhai.2.option.6.tooltips: "§rTransferring you to the Little Grim Reaper? Which planet is going to suffer this time?§!"
  #  转接到花田
  gts_guide_qhai.2.option.7: "Transfer to Huatian"
  #  §r为您转接到小花田吗，可爱的美少女谁不喜欢呢§!
  gts_guide_qhai.2.option.7.tooltips: "§rTransferring you to Little Huatian? Who doesn't like a cute beautiful girl?§!"
  #  转接到希诺
  gts_guide_qhai.2.option.8: "Transfer to Xinuo"
  #  §r为您转接到希诺吗，她似乎有着格外沉重的使命呢§!
  gts_guide_qhai.2.option.8.tooltips: "§rTransferring you to Xinuo? She seems to have an exceptionally heavy mission.§!"
  #  返回
  gts_guide_qhai.2.option.back: "Back"
  #  没事了
  gts_guide_qhai.2.option.quit: "Nothing else"
  #  千海的通讯
  #  千海的闲聊
  gts_guide_qhai.3.name: "Qhai's Idle Chat"
  gts_guide_qhai.3.desc.1: "§rJust want to chat with me? Fufu, that's not bad. What do you want to talk about?§!"
  #  §r作为统治者你也有这样的闲心逸致吗，好哦，千海我也奉陪！§!
  gts_guide_qhai.3.desc.2: "§rDo you have such leisure as a ruler? Alright, Qhai will keep you company!§!"
  #  §r可不要和我聊邻居家的巨娘今天踩扁了几个行星这样的话题哦，小心我把你给当做小玩具~§!
  #  §r可不要和我聊邻居家的巨娘今天踩扁了几个行星这样的话题哦，哼哼，后果你不会想知道的~§!
  gts_guide_qhai.3.desc.3: "§rDon't talk to me about topics like how many planets the neighbor's giantess crushed today. Heh-heh, you wouldn't want to know the consequences~§!"
  #  通讯器的来历
  gts_guide_qhai.3.option.1: "Origins of the Communicator"
  gts_guide_qhai.3.option.1.respond: "About the origins of the communicator"
  #  千海的通讯
  gts_guide_qhai.0.name: "Qhai's Communication"
  #  [GetQhaiFirstMeetText]
  gts_guide_qhai.0.desc: "[GetQhaiFirstMeetText]"
  #  通讯正常接通了：\n§r"小小统治者，你来啦，这应该是与你的第二次通讯？总之，在我这儿，我可以为给你提供一些也许有用的帮助~希望可以为你接下来的工作提供便利哦。“§!
  gts_guide_qhai.0.desc.1: "Communication established:\\n§r\"Little ruler, you're here. This should be our second communication? Anyway, I can provide you with some potentially useful help here~ I hope it makes your upcoming work more convenient.\"§!"
  #  通讯正常接通了：\n§r"小小....没那么小的统治者你来啦，这应该是与你的第二次通讯？总之，在我这儿，我可以为给你提供一些也许有用的帮助~希望可以为你接下来的工作提供便利哦。“§!
  gts_guide_qhai.0.desc.2: "Communication established:\\n§r\"Little.... not-so-little ruler, you're here. This should be our second communication? Anyway, I can provide you with some potentially useful help here~ I hope it makes your upcoming work more convenient.\"§!"
  #  通讯正常接通了：\n§r"你是龙...爹，也好，很高兴能再次见到你~总之，在我这儿，我可以为给你提供一些也许有用的帮助~希望可以为你接下来的工作提供便利哦。“§!
  gts_guide_qhai.0.desc.3: "Communication established:\\n§r\"You're Dragon... Dad. Well, it's good to see you again~ Anyway, I can provide you with some potentially useful help here~ I hope it makes your upcoming work more convenient.\"§!"
  #  尝试呼唤了千海：\n§r"令人震撼，居然等到现在你才与我联系。"§!
  gts_guide_qhai.0.desc.4: "Attempted to call Qhai:\\n§r\"Stunning, you've waited until now to contact me.\"§!"
  #  了解了
  gts_guide_qhai.0.option: "Understood"
  #  [GetQhaiMeetText]
  gts_guide_qhai.1.desc: "[GetQhaiMeetText]"
  #  §r"咦，好像出了意外的状况。"§!
  gts_guide_qhai.1.desc.11: "§r\"Huh, it seems something unexpected happened.\"§!"
  #  关闭关键提示
  gts_guide_qhai.1.option.2: "Turn off critical hints"
  #  §r如果这么做的话，一些关键事件之前你就得不到我的建议了哦，当然我也乐得清闲~§!
  gts_guide_qhai.1.option.2.tooltips: "§rIf you do that, you won't get my advice before some critical events, though I'd be happy to have the time off~§!"
  #  §r只有在记录了对应的联系人的联系方式时，才能帮你转接哦。§!
  gts_guide_qhai.1.option.5.tooltips: "§rI can only transfer you if the contact information for the corresponding person has been recorded.§!"
  #  科技解锁
  gts_guide_qhai.1.option.8: "Technology Unlock"
  #  §r正在施工中，非常抱歉~§!
  gts_guide_qhai.1.option.false.tooltips: "§rUnder construction, very sorry~§!"
  #  你为什么要帮助我
  gts_guide_qhai.3.option.2: "Why are you helping me?"
  #  平时的工作
  gts_guide_qhai.3.option.3: "Daily work"
  #  通讯器的来历
  gts_guide_qhai.4.name: "Origin of the communicator"
