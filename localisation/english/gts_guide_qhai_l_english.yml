  gts_guide_qhai.7.achiv.1.1: "$gts_achiev.cheat.short$\\n$gts_achiev.cheat.long$"
#  千海的好感度
  gts_qhai_love: "Qhai's Opinion"
#  转接到斯卡蒂
  gts_guide_qhai.2.option.9: "Transfer to Skadi"
#  §r为您转接到斯卡蒂吗，她对“博士”格外的依恋呢§!
  gts_guide_qhai.2.option.9.tooltips: "§rTransfer you to Skadi? She seems exceptionally attached to the \"Doctor\".§!"
#  成就列表
  gts_guide_qhai.7.name: "Achievement List"
#  §r成就的完成难度有难也有易，有些隐藏成就连我都不知道怎么触发呢~§!
  gts_guide_qhai.7.desc.1: "§rAchievements vary in difficulty—some are easy, some are hard, and there are even hidden ones that not even I know how to trigger~§!"
#  §r你慢慢看吧，如果要兑换奖励的话也请到我这边来哦。§!
  gts_guide_qhai.7.desc.2: "§rTake your time browsing; if you want to redeem rewards, come to me as well~§!"
#  §r真好呢，年轻人就是有干劲，嗯嗯。§!
  gts_guide_qhai.7.desc.3: "§rHow nice, young people are full of drive, mm-hmm.§!"
#  §r你说成就里很多梗看不懂，那我也没办法啦，解释梗的话也太奇怪了。§!
  gts_guide_qhai.7.desc.4: "§rYou say you can't understand many of the memes in the achievements? Well, there's nothing I can do about that—explaining memes would be far too weird!§!"
#  成就商店
  gts_guide_qhai.7.store: "Achievement Store"
#  §Y作弊§!
  gts_guide_qhai.7.achiv.1: "§YCheating§!"
#  关于成就
  gts_guide_qhai.100.name: "About Achievements"
#  刚点下领取按钮，千海便毫无预兆地从你面前的空地出现，比你略微矮上一些的恶魔少女，脚步轻快地小跳到你的面前站定，少女精致的美貌和蹦跳的活跃感让你精神不由得一阵恍惚。\n§r“咳咳，为了仪式感，第一次的奖杯就由我亲自给你送啦。”§!\n千海嘿嘿地笑着，一个金灿灿的奖杯自少女的双手之间浮现，奖杯的顶端做成了星球的造型，一圈蓝色的星环环绕着，在灯光下泛着亮晶晶的色彩，看上去颇为梦幻。\n少女将奖杯举到你面前，收起了嬉笑的神色反而带上了几分少见的郑重，你不由得也站直了身，将奖杯稳稳捧过。
  gts_guide_qhai.100.desc: "The moment you press the claim button, Qhai appears out of thin air in front of you without warning. The demon maiden, slightly shorter than you, hops forward with brisk, light steps and stops right before you. Her exquisite beauty and lively bounce leave you momentarily entranced.\\n§r\"*Ahem*, for the sake of ceremony, I'll deliver your first trophy in person!\"§!\\nQhai giggles playfully as a gleaming golden trophy materializes between her hands. Its pinnacle is crafted in the shape of a celestial body encircled by a blue planetary ring, shimmering brilliantly beneath the lights with an enchanting aura.\\nHolding the trophy up to you, the maiden casts aside her playful smile and adopts a rare expression of solemn dignity. You instinctively straighten your posture and accept the trophy firmly with both hands."
#  这是？
  gts_guide_qhai.100.option: "What is this?"
#  关于成就
  gts_guide_qhai.101.name: "About Achievements"
#  §r"当然是奖杯，你在最近做出了相当有意思的事情，于情于理都要给予鼓励~”§!\n千海愉悦的甩动着她的黑色长尾。"
  gts_guide_qhai.101.desc: "§r\"A trophy, of course! You've done some rather interesting things lately, so it's only right and proper to give you some encouragement~\"§!\\nQhai happily swishes her long black tail."
#  什么是有意思的事情？
  gts_guide_qhai.101.option.1: "What constitutes 'interesting things'?"
#  §r“这个嘛，由于成就制定者并非我一个人，所以标准各不相同。有§R重大事件§!，有§R图鉴收集§!，有§R历程达标§!，甚至是§R意外遭遇§!。”§!\n千海左右踱步，掰着手指数着。\n§r“总之，试着让这个文明变得更好吧，努力总有回报的~”§!
  gts_guide_qhai.101.response.1: "§r\"Well, since I'm not the sole author of these achievements, the criteria vary. There are §RMajor Events§!, §RCompendium Collections§!, §RMilestone Goals§!, and even §RUnexpected Encounters§!.\"§!\\nQhai paces back and forth, counting on her fingers.\\n§r\"In short, strive to make this civilization better; hard work always pays off~\"§!"
#  奖励是谁提供的？
  gts_guide_qhai.101.option.2: "Who provides the rewards?"
#  §r“嗯，大部分是我,但还有一些是其他巨娘自·愿·提·供的哦~”§!\n千海笑眯眯地将最后几个字念得格外的重。\n§r“噢，差点忘了，还有§R成就点数§!一同发送了，你可以在终端的成就商店里选购哦~”§! 
  gts_guide_qhai.101.response.2: "§r\"Mm, mostly me, but quite a few were v-o-l-u-n-t-a-r-i-l-y p-r-o-v-i-d-e-d by other giantesses~\"§!\\nQhai smiles sweetly, placing heavy emphasis on the last few words.\\n§r\"Oh, almost forgot! §RAchievement Points§! have been sent along as well. You can spend them in the Achievement Store on your terminal~\"§!"
#  了解了
  gts_guide_qhai.101.option.quit: "Understood"
#  关于成就
  gts_guide_qhai.102.name: "About Achievements"
#  刚点下领取按钮，千海便毫无预兆地从你面前的空地出现，少女的犄角居然能够堪堪顶到了天花板。高大的少女一步便从门口跨到了你的面前，铺面而来的狂乱大风将你和你的办公桌吹得一团糟。\n§r“……你知道我为什么要变这么大过来吗。”§!\n千海表情看起来相当的幽怨，数十个金灿灿的奖杯自少女的双手之间浮现，在少女的手掌上堆成了山。\n§r“堆了这么多成就才第一次来找我，你要死啦。”§!\n千海气鼓鼓地蹲下了身，带来的风压将你彻底掀翻在地，你眼睁睁地看着少女的手掌在头顶上缓缓倾覆，哗啦啦，视野完全被金灿灿的小山所覆盖，只是片刻，你便感觉全身都被沉甸甸的奖杯山压得喘不过气来。千海看着你的惨状，最终还是叹了口气。\n§r“哈，算了，事已至此，流程还是要过的。”§!\n少女带着温热的尾巴缠上你的腰肢，将你解救了出来。
  gts_guide_qhai.102.desc: "The moment you press the claim button, Qhai materializes without warning in the open space before you, her curved horns barely missing the high ceiling. The towering maiden strides forward, closing the distance in a single step as a wild gust sweeps across the room, scattering documents and turning your desk into total chaos.\\n§r\"...Do you have any idea why I came here at this size?\"§!\\nQhai looks down at you with a thoroughly sullen pout. Dozens of shimmering golden trophies manifest between her hands, piling up like a miniature mountain on her palms.\\n§r\"Hoarding this many achievements before finally coming to see me for the first time? Are you trying to kill me?!\"§!\\nQhai huffs and crouches down, the sudden air displacement knocking you flat onto the floor. You watch helplessly as her palms slowly tilt overhead. *Clatter, crash!* Your entire vision is buried under an avalanche of golden metal. Within moments, you feel completely suffocated under the crushing weight of the trophy pile. Observing your pitiful state, Qhai lets out a resigned sigh.\\n§r\"Haah, fine. Whatever, what's done is done—we still have to follow procedure.\"§!\\nHer warm tail wraps around your waist, pulling you free from the heap."
#  这是？
  gts_guide_qhai.102.option: "What is this?"
#  那个，能不能把我放下来
  gts_guide_qhai.103.name: "Um, could you please put me down?"
#  "§r“不行——你就在上面听着我说吧”§!\n你的身体被千海的黑色长尾卷着不断左右摆动，你有种隔夜饭都要吐出来的错觉，少女此刻还在讲解：“奖杯是奖励你做出的杰出贡献，可以是§R重大事件§!，也可以是§R图鉴收集§!，也可以是某次§R意外收获§!，总之标准各不相同。”
  gts_guide_qhai.103.desc: "§r\"No way—you'll just stay up there and listen to me!\"§!\\nYour body sways back and forth, coiled tightly in Qhai's long black tail, making your stomach churn as if you're about to lose yesterday's dinner. Meanwhile, the girl continues her explanation: \"Trophies reward your outstanding contributions. They could be for §RMajor Events§!, §RCompendium Collections§!, or even an unexpected §RWindfall§!—in short, the criteria vary.\""
#  （唔唔唔）
  gts_guide_qhai.103.option.1: "(Mmph mmph mmph)"
#  §r“......除了奖杯以外，还有§R成就点数§!一同发送到你的终端。好了，下去吧，可别吐我尾巴上了。”§!\n千海终于将你从数米高的半空放了下来，你第一次后悔将办公室修的那么高大，可以让少女能够用这么大的体型进来肆虐。
  gts_guide_qhai.103.response.1: "§r\"...Besides trophies, §RAchievement Points§! have also been sent to your terminal. Alright, down you go—and don't you dare throw up on my tail!\"§!\\nQhai finally lowers you from several meters in the air. For the first time, you regret designing your office with such high ceilings, allowing the girl to barge in and wreak havoc at such a colossal size."
#  奖励是谁提供的？
  gts_guide_qhai.103.option.2: "Who provides the rewards?"
#  §r“嗯，大部分是我,但还有一些是其他巨娘自·愿·提·供的哦~”§!\n千海笑眯眯地将最后几个字念得格外的重。
  gts_guide_qhai.103.response.2: "§r\"Mm, mostly me, but quite a few were v-o-l-u-n-t-a-r-i-l-y p-r-o-v-i-d-e-d by other giantesses~\"§!\\nQhai smiles sweetly, placing heavy emphasis on the last few words."
#  了解了
  gts_guide_qhai.103.option.quit: "Understood"
