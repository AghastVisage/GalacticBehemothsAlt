l_english:
  #  巨构意识
#  巨构意识
  civic_gts_gestalt_giantess: "Macro Consciousness"
#  同一个意志在庞大的躯体之间流动。无论依靠神经网络还是机械中枢，巨型子个体都能将微观世界纳入整体的生产体系。
  civic_gts_gestalt_giantess_desc: "A singular will circulates among colossal physiques. Whether relying on neural networks or central cybernetic hubs, gigantic semi-autonomous drones can seamlessly incorporate the microscopic realm into their overarching production framework."
#  主体物种以§Y巨娘体型§!开局。\n使用适合蜂巢或机械智能的子个体岗位，生产缩小人口、微型城市和微型星球。\n与§Y微观意识§!互斥。
  civic_gts_gestalt_giantess_effects: "Main species starts with §YGiantess Size§!.\\nUtilizes drone jobs tailored for hive minds or machine intelligences to produce shrunken pops, tiny cities, and tiny planets.\\nMutually exclusive with §YMicro Consciousness§!."
#  微观意识
  civic_gts_gestalt_tiny: "Micro Consciousness"
#  无数微小的个体共同感知一个辽阔的世界。意识网络将散布各处的采集、研究和生产活动组织起来，建立跨越体型差距的文明。
  civic_gts_gestalt_tiny_desc: "Countless minute individuals perceive a vast universe in unison. The collective consciousness organizes dispersed gathering, research, and manufacturing activities, forging a civilization capable of transcending disparities in physical scale."
#  主体物种以§Y小人体型§!开局。\n使用适合蜂巢或机械智能的子个体岗位，开发小人帝国的三类特殊资源。\n与§Y巨构意识§!互斥。
  civic_gts_gestalt_tiny_effects: "Main species starts with §YTiny Person Size§!.\\nUtilizes drone jobs tailored for hive minds or machine intelligences to exploit the three unique resources of Tiny empires.\\nMutually exclusive with §YMacro Consciousness§!."
