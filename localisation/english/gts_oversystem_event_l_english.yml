l_english:
#  小皮鞋
  sc_gts_leather_shoes_star: "Leather Shoes"
#  一只比恒星系还要巨大许多的小皮鞋,远远望去便能够看到星云般的雾气,很难想象它的主人到底有多么巨大
  sc_gts_leather_shoes_star_desc: "A pair of leather shoes far larger than a star system. From afar, one can see nebula-like mists; it's hard to imagine how massive their owner must be."
#  好大的小皮鞋
  gts_oversystem.1.title: "Huge Leather Shoes"
#  我们的科研船在调查时扫描到了一个无比庞大的物体,其大小远超想象.经过调查,我们确定这个物体是一只精致的小皮鞋.\n其比诸多恒星系还要巨大的体积阻碍了超空间航道的运行,或者说即使原先存在,也会被其轻易切断,鞋口处隐约能够观察到盈盈的热气构成的星云.科研船上的扫描设备完全无法解析鞋子的材质,尽管是最先进的切割技术也难以在表面留下一丝划痕.出于对巨娘的好奇,我们必须对其进行细致的研究.但首先,我们应当先找到方法进入鞋子...
  gts_oversystem.1.desc: "Our science ship scanned an immensely large object whose size far exceeds imagination. After investigation, we have determined that this object is an exquisite leather shoe.\\nIts volume, larger than many star systems, obstructs hyperlanes—or rather, even if they existed before, they would be easily severed by it. At the opening of the shoe, nebulae composed of lingering heat can be observed. The scanning equipment on the science ship is completely unable to analyze the shoe's material, and even the most advanced cutting techniques can hardly leave a scratch on its surface. Driven by curiosity about the giantess, we must conduct detailed research on it. But first, we must find a way to enter the shoe..."
#  再找找超空间航道吧
  gts_oversystem.1.a: "Let's look for hyperlanes again."
#  准备跃迁
  gts_oversystem.1.b: "Prepare for jump."
#  用量子弹弓试试
  gts_oversystem.1.c: "Try the Quantum Catapult."
#  有没有现成的虫洞?
  gts_oversystem.1.d: "Are there any existing wormholes?"
#  为什么不能自己造一个(被打
  gts_oversystem.1.d_custom: "Why can't we just build one ourselves? (slapped)"
#  我的曲速引擎呢?
  gts_oversystem.1.e: "Where is my Warp Drive?"
#  陛下,大清已经亡了
  gts_oversystem.1.e_custom: "Your Majesty, the old era has long passed."
#  探索
  gts_oversystem.6.title: "Exploration"
#  我们终于进入了这个鞋子,出乎意料的是我们在鞋子中探测到了许多恒星系,其中的诸多星球已在长久的浓郁足臭熏染中无法居住,鞋垫上更是散布着无数的星球乃至恒星的残骸,这里的环境堪称恶劣,与以往见到的任何星系都无法相提并论,但我们还是得以找到了能够落脚的地方.得以建立据点对这里进行研究\n也许我们能够从中找到更多关于巨大化的科技,或许可以找到某些幸存者?(虽然希望存疑...
  gts_oversystem.6.desc: "We have finally entered this shoe. Unexpectedly, we detected many star systems within it. Many planets therein have become uninhabitable after long exposure to thick foot odor. The insole is scattered with the remains of countless planets and even stars. The environment here is harsh, incomparable to any system seen before, yet we have managed to find a place to settle and establish a base for research.\\nPerhaps we can find more technology related to giantification here, or even some survivors? (Though hope is doubtful...)"
#  注意安全
  gts_oversystem.6.a: "Stay safe."
#  带点足垢给我尝尝
  gts_oversystem.6.b: "Bring some foot grime for me to taste."
#  星系级巨娘的足垢一定十分甚至九分的美味啊!(╹ڡ╹ )
  gts_oversystem.6.b_custom: "The foot grime of a galaxy-scale giantess must be very, even extraordinarily delicious! (╹ڡ╹ )"
#  建立超空间航道
  gts_oversystem_project: "Establish Hyperlane"
#  足虫
  NAME_oversystem_leather_shoes_system_country: "Foot Pests"
#  白丝
  sc_gts_white_silk_star: "White Silk"
#  少女刚刚脱下的白丝,能够将数个星系轻而易举地包裹.在其中能够感受到少女尚未完全消散的体温,隐约可以闻到淡淡的体香.
  sc_gts_white_silk_star_desc: "White silk just removed by a girl, capable of easily wrapping several galaxies. Within it, one can feel the girl's lingering body heat and faintly smell a light fragrance."
