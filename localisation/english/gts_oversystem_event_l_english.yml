l_english:
  sc_gts_leather_shoes_star: "Little Leather Shoes"
  sc_gts_leather_shoes_star_desc: "A tiny leather shoe, far larger than a star system—from a distance, it looks like a nebula—makes it hard to imagine just how enormous its owner must be."
  gts_oversystem.1.title: "What a big little pair of shoes!"
  gts_oversystem.1.desc: "During our survey, our research vessel detected an incredibly massive object—one far larger than we could have imagined. Upon investigation, we determined that this object was an exquisitely crafted little leather shoe.\nIts volume, larger than many star systems, obstructs the operation of hyperspace lanes—or rather, even if such lanes had existed, they would have been easily severed by it. A nebula of gentle heat could be faintly observed at the shoe’s opening. The research vessel’s scanning equipment was completely unable to analyze the shoe’s material; even the most advanced cutting technology could not leave so much as a scratch on its surface. Driven by our curiosity about the Giantess, we must conduct a detailed study of it. But first, we must find a way to get inside the shoe..."
  gts_oversystem.1.a: "Let's look for another hyperspace route."
  gts_oversystem.1.b: "Preparing for the Leap"
  gts_oversystem.1.c: "Try using a quantum slingshot"
  gts_oversystem.1.d: "Are there any existing wormholes?"
  gts_oversystem.1.d_custom: "Why can't I just make one myself? (Got hit)"
  gts_oversystem.1.e: "Where's my warp drive?"
  gts_oversystem.1.e_custom: "Your Majesty, the Great Qing has fallen."
  gts_oversystem.6.title: "Explore"
  gts_oversystem.6.desc: "We finally entered this shoe. To our surprise, we detected numerous star systems inside it; many of the planets had become uninhabitable after being exposed to intense foot odor for so long, and the insole was littered with the remains of countless planets and even stars. The environment here is truly harsh—unlike any galaxy we’ve encountered before—but we still managed to find a place to settle down and establish a base to study this area.\nPerhaps we can learn more about the technology behind this gigantic transformation, or maybe even find some survivors? (Though I’m not holding my breath...)"
  gts_oversystem.6.a: "Stay safe"
  gts_oversystem.6.b: "Give me a bit of foot grime to taste."
  gts_oversystem.6.b_custom: "A galaxy-class Giantess’s foot dirt must be incredibly—or at least 9 out of 10—delicious! (╹ڡ╹ )"
  gts_oversystem_project: "Establishing Hyperspace Routes"
  NAME_oversystem_leather_shoes_system_country: "Footworm"
  sc_gts_white_silk_star: "white silk stockings"
  sc_gts_white_silk_star_desc: "The white silk stockings the young girl had just taken off could easily wrap around several galaxies. One could still feel the warmth of her body, which had not yet completely faded, and faintly smell her delicate scent."