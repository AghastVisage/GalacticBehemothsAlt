l_english:
  # 微缩宇宙DEBUG控制台
  gts_debug_event.1.name: "Miniature Universe DEBUG Console"
  # §r好的，权限已验证，现在为您开启DEBUG工作台。§!
  gts_debug_event.1.desc: "§rAlright, permissions verified. Now opening the DEBUG workbench for you.§!"
  # 快速领袖招募
  gts_debug_event.1.option.1: "Quick Leader Recruitment"
  # §r可以快速招募某个领袖§!
  gts_debug_event.1.option.1.tooltips: "§rAllows for quick recruitment of a specific leader.§!"
  # 招募所有领袖
  gts_debug_event.1.option.2: "Recruit All Leaders"
  # §r招募当前尚未拥有的可雇佣领袖及其舰船；尚未开启蕾恩娜内容时，会打开她的事件设置。§!
  gts_debug_event.1.option.2.tooltips: "§rAllows for recruiting all available leaders at once; some Grey Tempest-style leaders must be selected in diplomacy.§!"
  # 领袖好感度控制
  gts_debug_event.1.option.3: "Leader Approval Control"
  # §r统一调整已开启通用好感度系统的领袖。独立事件角色与专用好感度系统不在此列。§!
  gts_debug_event.1.option.3.tooltips: "§rAllows for bulk increasing or decreasing of approval for all leaders.§!"
  # 退出
  gts_debug_event.1.option.quit: "Exit"
  # 返回
  gts_debug_event.1.option.back: "Back"
  # 微缩宇宙特殊领袖招募
  gts_debug_event.2.name: "Miniature Universe Special Leader Recruitment"
  # §r快速招募可雇佣领袖及其舰船。蕾恩娜是独立事件角色，对应入口会打开她的事件设置。批量招募会跳过已拥有的领袖。\n直接招募会跳过正常招募流程，后续剧情仍按各自条件触发。§!
  gts_debug_event.2.desc: "§rYes, here you can quickly recruit any leader and their ships without triggering subsequent event chains.\\nNote that after recruiting a leader here, if you still want to trigger in-game event chains, there is a high possibility of breaking them.§!"
  # 退出
  gts_debug_event.2.option.quit: "Exit"
  # §r已经招募完成，请查收您预定的领袖！§!
  gts_debug_event.2.reponse: "§rRecruitment complete, please check your ordered leader!§!"
  # §r呀，这个领袖还没制作完成！§!
  gts_debug_event.2.reponse.2: "§rAh, this leader hasn't been completed yet!§!"
  # §r这并不是一个可用的领袖呢§!
  gts_debug_event.2.reponse.3: "§rThis isn't a usable leader.§!"
