  # 通用好感度领袖：减少 20
  gts_debug_event.6.option.2: "Decrease approval of all leaders by 20"
  # 微缩宇宙领袖星球创建
  gts_debug_event.7.name: "Miniature Universe Leader Planet Creation"
  # §r"可以在首都的附近星系创建一个指定的星球。"§!
