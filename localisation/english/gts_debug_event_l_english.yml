  # 微缩宇宙领袖好感度控制
  gts_debug_event.6.name: "Miniature Universe Leader Approval Control"
  # §r调整已开启通用好感度系统的领袖；好感度最低为 0，最高不超过该领袖的上限。蕾恩娜的兴趣值及其他专用系统保持独立。§!
