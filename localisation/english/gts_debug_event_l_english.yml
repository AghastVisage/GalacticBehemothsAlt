  # 开启蕾恩娜的专属星系与事件设置。她没有可雇佣的领袖实体，不使用通用复活与好感度系统。
  gts_debug_event.2.rainna.tooltip: ""Enable Leena's exclusive galaxy and event settings. She has no leaders available for recruitment and does not use the standard resurrection or affinity systems.""
