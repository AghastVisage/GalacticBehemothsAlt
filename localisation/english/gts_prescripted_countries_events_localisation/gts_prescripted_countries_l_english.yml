#  无尽苍茫的白色平原上，数百艘巨大的殖民舰整装待发，密密麻麻的人群登上星舰即将踏上前往新世界的旅程。 “高贵的女神，根据两国间的协议，契约已经生效。感谢您的包容与恩赐往后无尽的岁月中我国国民将世世代代居住在您圣洁温润的穴道世界之中并无时无刻清洁护理您美丽的圣域。” “请不要再说这么让人难为情的话了......”轻灵悦耳的童音自苍穹传荡，殖民舰中的人们纷纷透过舷窗眺望天际，那被被云雾遮挡的天外世界透出一丝细腻的红润，隐约间可以看出玉柱般的轮廓以及更高处遮盖了大半个天穹的粉嫩裂隙。 空旷的房间内，略显幼态的少女赤裸身体站在不足大腿高的洁白桌台前，映射着一份契约的全息投影在面前烁灭，光洁如玉的脚趾在地面上不安的搓动着。尽管略显害羞与局促，但是少女明白这是族群中每个成熟个体都要完成的成年礼。环抱在胸前的双臂缓缓垂下，双手的食指不约而同的探向身下。 ”小人先生们，可以进来了哦~“
  gts_prescripted_countries.1.desc: "Upon the endless, vast white plain, hundreds of huge colony ships stood ready to depart, and dense crowds boarded the starships, about to embark on their journey to a new world. \"Noble goddess, according to the agreement between our two nations, the contract has entered into force. Thank you for your tolerance and grace. For endless ages to come, the people of our nation shall live generation after generation within your sacred, warm passage-world, cleaning and caring for your beautiful holy domain at every moment.\" \"Please don't say such embarrassing things anymore...\" A light, melodious youthful voice resounded from the firmament. The people in the colony ships looked out through their portholes toward the sky. In the world beyond the heavens, obscured by clouds and mist, a delicate flush showed through, and one could faintly discern jade-pillar-like contours, as well as a pink slit higher above that covered more than half the sky. In the empty room, a somewhat youthful-looking girl stood naked before a white tabletop that did not even reach her thighs. The holographic projection of a contract flickered before her, and her smooth, jade-like toes rubbed uneasily against the floor. Although she was somewhat shy and awkward, the girl understood that this was the coming-of-age rite every mature individual of her race had to complete. The arms folded before her chest slowly lowered, and the index fingers of both hands reached downward in unison. \"Tiny gentlemen, you may come in now~\""
