  gts_prescripted_countries.2.desc: "The melodious voice of the young woman beyond the sky rang out. Huge red warning lights lit up one after another on the bows of the many colony ships, and under the crowd's gaze the fleet roared into motion, charging straight toward the increasingly pink rift in the heavens. At the same time, two enormous finger-pillars descended from beyond the sky on either side of the rift. As the finger-pillars slowly applied force, the rift was steadily held open, revealing an abyss like a cosmic void and, around it, a red world surging rhythmically like waves. A rich feminine scent enveloped the entire fleet, and everyone breathed in, as if receiving heavenly grace, the smell they would be able to sense at every moment of their future lives. \"This is my most precious place, you know. No one has ever parasitized it before~\" There was a trace of pride in the young woman's tone as she watched strands of red-glowing dust drift from the white tabletop toward her soft pink private place, a blush spreading across her lovely face. Once all the red dust had sunk inside, the young woman gently released the two fingers holding open her vulva, and the twice-everted tender flesh instantly contracted inward. More than a hundred colony ships deployed in a net formation inside the flesh-colored ring-shaped cavity, which was on the scale of a star system. Their shipboard AI scanned the course of the folded mountain ranges to calculate safe predetermined positions for each vessel. As the ships continued to land, the air of the world inside the cavity gradually grew moist. Feeling the increasingly distinct network in her lower body, the young woman could not help growing slightly wet; she knew this was the sign that those little ones had begun building cities. But for the colonists, this was still far from enough. The flagship drove deep into the cavity, straight to the airspace above the cervix."
