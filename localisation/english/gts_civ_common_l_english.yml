  # 小人保护国宣传家是在体验过活体陈设生活后受巨娘委托回到首都进行宣传的专家。
  job_overlord_tinypropagandist_desc: "Small person protectorate propagandists are experts who have returned to the capital for propaganda purposes after experiencing life as living pet display items, commissioned by the giantesses."
  # 小人保护国宣传家是在体验过活体陈设生活后受巨娘委托回到首都进行宣传的专家。
