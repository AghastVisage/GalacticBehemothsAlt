l_english:
  # 果体传统
  civic_gts_bare: "Naked Tradition"
  # 得益于其体型或独特的气候环境，这个文明的人民从未产生过穿衣保暖的意识，其文化体系也不认为果体是羞耻之事，而是推崇形体与肌肤之美。尽管在群星时代她们依据银河惯例不得不穿上了衣服，外交官们也会倾向于选择更裸露的衣服来纾解自己的不适。
  civic_gts_bare_desc: "Thanks to their size or unique climate, the people of this civilization have never developed a consciousness of wearing clothes for warmth. Their cultural system does not consider nudity shameful, but rather promotes the beauty of form and skin. Although they have had to put on clothes according to galactic customs in the space age, their diplomats will tend to choose more revealing outfits to ease their discomfort."
  # 特派外交官
  councilor_gts_bare: "Special Envoy"
  # 特派外交官
  councilor_gts_bare_female: "Special Envoy"
  # 这名训练有素的外交官能通过巧妙的服装搭配，在关键部位通风的情况下保证其的身体不会因过于暴露而扰乱正常的外交活动。不过从外交回馈来看，这种诱惑性的搭配给我们的外交带来了更多好处？
  councilor_gts_bare_desc: "This well-trained diplomat can, through clever clothing choices, ensure that her body does not disrupt normal diplomatic activities due to excessive exposure, all while keeping key areas ventilated. However, judging from diplomatic feedback, this seductive attire is bringing more benefits to our diplomacy?"
  # 雅利安超人
  civic_gts_aryans: "Aryan Supermen"
  # 这个国家在前太空时期起就笃信着某种种族优越论，严格执行的优生学与基因改良政策使得他们虽然体型微小，却能拥有比肩巨娘的力量。
  civic_gts_aryans_desc: "From the pre-space age, this nation has believed in a theory of racial superiority.  Strict eugenics and genetic modification policies have allowed them to possess power rivalling that of giantesses, despite their small size."
  # 计划决策委员
  councilor_gts_aryans: "Planning Committee Member"
  # 计划决策委员
  councilor_gts_aryans_female: "Planning Committee Member"
  # 计划决策委员负责计划我国在未来一段时间各行业领域的生产指标，从螺丝钉到太空巨舰，帝国在如此不利的肉体束缚中仍不落下风都因为她们的鞠躬尽瘁。
  councilor_gts_aryans_desc: "The Planning Committee Member is responsible for planning the production targets of various industries in our country for a period of time in the future. From screws to giant space warships, the empire's ability to keep up despite these physical limitations is all thanks to their dedication."
  # 巢都星球
  civic_gts_city: "Hive City Planet"
  # 这个国家极度重视工业力量建设，工业区密密麻麻的集中在数个大城市群周围。为了最大化生产效率，他们大幅缩短了兵役时间，并且毫不在乎密集型工业在战争时的潜在隐患。\n\"只要工业产能够大，庞大的海军足以保卫家园，敌人又怎么会打进星球呢？\"这个国家的国民这样乐观的想着。
  civic_gts_city_desc: "This nation places great emphasis on the development of industrial power and clusters its industrial districts around several large urban areas. To maximize production efficiency, they have greatly shortened military service and disregard the potential hazards of concentrated industry during war.\n\"As long as industrial output is large enough, a massive navy will protect our home, and how could enemies possibly invade our planet?\" This is what the citizens of this territory think with such optimism."
  # 工业督管
  councilor_gts_city: "Industrial Overseer"
  # 工业督管
  councilor_gts_city_female: "Industrial Overseer"
  # 以保证生产效率最大化为唯一工作的工业管理员，它的人事关系与和面技巧为提高行星工业基础设施的建设速度做出了卓越贡献。
  councilor_gts_city_desc: "The industrial administrator, whose sole job is to ensure maximum production efficiency. Her relationships and her skills in handling various situations contribute greatly to increasing the construction speed of planetary industrial infrastructure."
  # 杞人忧天
  civic_gts_country: "Skyfall Anxieties"
  # 这个国家自文明早期就因为某些原因一直对巨大的天外来客入侵心存忧虑。从古代高大的尖顶建筑，到近代的样式各异的对空武器，直到今天，这个国家依然执着于以牺牲生产效率为代价强化星球防御力量建设。\n在外人看来这只不过是杞人忧天罢了...大概？
  civic_gts_country_desc: "This nation has, for some reason, harbored anxieties about invasions by enormous extraterrestrial beings since the early days of civilization. From ancient towering spires to modern and varied anti-aircraft weapons, this country is still obsessed with strengthening planetary defense at the expense of production efficiency.\nTo outsiders, it seems a case of worrying about nothing... perhaps?"
  # 行星防卫总长
  councilor_gts_country: "Planetary Defense General"
  # 行星防卫总长
  councilor_gts_country_female: "Planetary Defense General"
  # 这名长官负责统领母星和其他重要节点的安防准备，哪怕无法消灭入侵的巨娘，恒星基地上繁杂眩目的火力网或许也能逼退她们。
  councilor_gts_country_desc: "This officer is responsible for leading the security preparations of the homeworld and other vital points. Even if they cannot eliminate an invading giantess, the complex and dazzling firepower network on the starbase might be able to force them to retreat."
  # 始于微末
  civic_origin_from_micro: "Origins in the Microcosm"
  # 稀少的人口曾是阻止这个帝国迈入高速发展的瓶颈，而大量引进外星人口或大规模复制亦会带来严重的副作用。迫不得已，她们将希望放在巨大化技术上，通过对微生物群落的基因改造和定向引导，这些在基因上与我们同族的微生物文明会以全文明之力培养出一位最优秀的人才，最后她会被\"升格\"，也就是被巨大化激素放大与我们等大。这些被遴选出来的优秀个体会被授予公民权，而诞生出这位巨娘的微型世界也会留给她作为纪念
  civic_origin_from_micro_desc: "A small population was once a bottleneck preventing this empire from entering high-speed development. Large-scale imports of alien populations or mass cloning would also bring serious side effects. Forced to do so, they placed their hopes on gigantification technology. Through genetic modification and guided direction of microbial communities, these microbial civilizations, which are genetically related to our own, will cultivate the most outstanding talent with the full power of their civilization, who will be \"ascended,\" and that is to be magnified to our size by gigantification hormones. These selected, outstanding individuals are granted citizenship, and the microcosm where the giantess was born is left to her as a memento."
  # 解锁特殊建筑，消耗£gts_micro_city£$gts_micro_city$获得大量人口组装。\n§Y产出的组装人口获得加成§!。\n§R只有巨娘文明能使用这个国民理念§!
  civic_origin_from_micro_effects: "Unlocks a special building that consumes £gts_micro_city£$gts_micro_city$ and £energy£$energy$ to assemble a large number of pops.\nPops assembled gain a §Yproduction bonus§!.\n§ROnly Giantess civilizations can use this civic.§!"
  # 升格微生物
  origin_from_micro_modifier: "Ascended Microorganism"
  # 微世界孵化人
  councilor_origin_from_micro: "Microcosm Incubator"
  # 微世界孵化人
  councilor_origin_from_micro_female: "Microcosm Incubator"
  # 微世界孵化人是每一皿微文明某种意义上的母亲，也是令每一位微文明的升格者最为敬畏和恐惧的存在
  councilor_origin_from_micro_desc: "The Microcosm Incubator is, in a sense, the mother of every microcosm, and the existence most revered and feared by each person to ascend from the microcosm."
  # 变化灵
  civic_changeling: "Changeling"
  # 这个文明里巨娘和小人并不是简单的饲主－玩具关系。严格来说，她们是一个共生体，由共享感官，姓名与社会关系的不同大小的两个 maiden组成。其中的一个暂时居于主导地位的巨娘统治着暂时居于从属地位的一个小人。当巨娘方情绪激动，性高潮或主动放弃时，巨娘和小人的体型便会交换。这种\"随地大小变\"的特性在给她们自己的行政管理带来麻烦的同时，也让其他文明与她们的交往困难无比。
  civic_changeling_desc: "In this civilization, giantesses and small people are not simply a relationship between master and toy. Strictly speaking, they are a symbiotic entity, consisting of two girls of different sizes who share senses, names and social relationships. One of them, the giantess, who is temporarily in the dominant position, rules over the other small person, who is in a subordinate position. When the giantess is emotionally agitated, orgasmic, or actively gives up their role, the sizes of the giantess and small person will swap. This 'variable size' trait causes problems for their own administration, and also makes it incredibly difficult for any other civilization to interact with them."
  # 帝国人口普查组长
  councilor_changeling: "Imperial Census Director"
  # 帝国人口普查组长
  councilor_changeling_female: "Imperial Census Director"
  # 共生体帝国的人口普查难度比普通的巨娘或是小人帝国要高许多，但帝国并没有出现较多的人口纠纷，这多亏了娴熟的帝国人口普查组长。
  councilor_changeling_desc: "Carrying out a census in a symbiotic empire is much more difficult than in regular Giantess or small person empires, but the empire has not experienced many population disputes, thanks to the adeptness of the Imperial Census Director."
  # 入阴礼
  civic_ub_ritual: "Intra-Vaginal Greeting Ritual"
  # 这个社会形成了一套独特的社交礼仪，具体来说，巨娘在问候时透过把对方小人塞进下体表示友好，小人在问候时通过主动钻入对方巨娘的下体表示友好。这种惊世骇俗的社交习惯给前来外交的外国友人带来了很大的...文化冲突，而这种传统短期内还难以纠正，或许让外星人们接纳这种文化更现实一些？
  civic_ub_ritual_desc: "This society has developed a unique set of social etiquettes. Specifically, the giantess expresses friendliness by inserting a small person into her lower body when greeting them, and the small person expresses friendliness by voluntarily entering the lower body of the other's giantess when greeting. This shocking social custom has brought a great deal of...cultural conflict to visiting foreign dignitaries, and this tradition is difficult to change in the short term. Perhaps it would be more realistic for aliens to embrace this culture?"
  # §R无论巨娘还是小人都痴迷ub§!\n§R人口与领袖更容易被ub§!
  civic_ub_ritual_effects: "§RBoth Giantesses and small people are obsessed with Intra-Vaginal insertion.§!\n§RPopulation and leaders are more prone to it.§!"
  # 外务司礼
  councilor_ub_ritual: "Foreign Affairs Etiquette Officer"
  # 外务司礼
  councilor_ub_ritual_female: "Foreign Affairs Etiquette Officer"
  # 越来越多的巨娘和小人在外务司礼的有效的宣传下，逐渐放下自己内心的成见去拥抱游走于肉体与理智下那原始的欲望。
  councilor_ub_ritual_desc: "More and more giantesses and small people are gradually letting go of their inner prejudices and embracing the primal desires that walk the line between flesh and reason, thanks to the Foreign Affairs Etiquette Officer's effective propaganda."
  # 妹汁本位
  civic_focus_gts_fluid: "Sister-Juice Economy"
  # 我们在太空时代的种种经历最直接的影响便是经济生活。巨娘体液，这一迷人的物质自从流入我国市场开始便极度热销，如今甚至足以作为一种实物货币在小人国家间流通。能量币仍是衡量国家经济实力的标准，但足够的新鲜巨娘体液储备显然成为了稳定投资者信心的基石。
  civic_focus_gts_fluid_desc: "The most direct impact of our space age experiences has been on our economic life. Giantess bodily fluids, this fascinating substance has been extremely popular since it first entered our market, and it is now even sufficient to circulate as a form of physical currency among small person countries. Energy credits are still the standard by which a nation's economic strength is measured, but sufficient reserves of fresh giantess fluid have clearly become the cornerstone of stabilizing investor confidence."
  # 每月按照£gts_giantess_fluid£$gts_giantess_fluid$储量给予国家修正\n§R只有小人文明能使用这个国民理念§!
  civic_focus_gts_fluid_effects: "Grant national modifier based on monthly £gts_giantess_fluid£$gts_giantess_fluid$ reserves.\n§ROnly small people civilizations can use this civic§!"
  # 妹汁本位：等级5
  tiny_focus_gts_fluid_1: "Sister-Juice Essence: Level 5"
  # 妹汁本位：等级4
  tiny_focus_gts_fluid_2: "Sister-Juice Essence: Level 4"
  # 妹汁本位：等级3
  tiny_focus_gts_fluid_3: "Sister-Juice Essence: Level 3"
  # 妹汁本位：等级2
  tiny_focus_gts_fluid_4: "Sister-Juice Essence: Level 2"
  # 妹汁本位：等级1
  tiny_focus_gts_fluid_5: "Sister-Juice Essence: Level 1"
  # 小人本位
  civic_focus_tiny: "Small Person Economy"
  # 我们在太空时代的种种经历最直接的影响便是经济生活。缩小人自从作为商品出现在星际市场时便受巨娘追捧，如今甚至足以作为一种实物货币在巨娘国家间流通。能量币仍是衡量国家经济实力的标准，但足够数量的健康小人储备显然成为了稳定投资者信心的基石。
  civic_focus_tiny_desc: "The most direct impact of our space age experiences has been on our economic life. Since the appearance of shrunken humans as commodities in interstellar markets, they have been sought after by giantesses. Now they even circulate as a form of physical currency among giantess nations. Energy credits are still the standard for measuring national economic strength, but a sufficient stockpile of healthy small people is clearly the cornerstone of stabilizing investor confidence."
  # 每月按照£gts_micro£$gts_micro$储量给予国家修正\n§R只有巨娘文明能使用这个国民理念§!
  civic_focus_tiny_effects: "Grants national modifier based on monthly £gts_micro£$gts_micro$ reserves. \n§ROnly Giantess civilizations can use this civic§!"
  # 小人本位：等级5
  gts_focus_tiny_1: "Small Person Essence: Level 5"
  # 小人本位：等级4
  gts_focus_tiny_2: "Small Person Essence: Level 4"
  # 小人本位：等级3
  gts_focus_tiny_3: "Small Person Essence: Level 3"
  # 小人本位：等级2
  gts_focus_tiny_4: "Small Person Essence: Level 2"
  # 小人本位：等级1
  gts_focus_tiny_5: "Small Person Essence: Level 1"
  # 卓越巨娘教育
  civic_distinguished_gts: "Distinguished Giantess Education"
  # 太空时代的经历重塑了我们的世界观，既然我们属于生来就是要统治银河的巨娘种，那我们就有必要调整教育重心以满足社会需要。 透过削减部分可以让小人代劳的传统教育内容，那些更加重要的课程，比如性理论学，自慰器具的原理与使用学，城市破坏学等等将被纳入每一位巨娘的必修课。
  civic_distinguished_gts_desc: "The experiences of the space age have reshaped our worldview. Since we belong to the giantess species that was born to rule the galaxy, we must adjust our educational focus to meet the needs of our society. By reducing some of the traditional education content that can be handled by small people, more important courses, such as Sex Theory, Principles and Use of Masturbation Devices, City Destruction Studies, etc. will therefore be included in every giantess's compulsory curriculum."
  # §R只有巨娘文明能使用这个国民理念§!
  civic_distinguished_gts_effects: "§ROnly Giantess civilizations can use this civic§!"
  # 巨娘教育委员
  councilor_distinguished_gts: "Giantess Education Commissioner"
  # 巨娘教育委员
  councilor_distinguished_gts_female: "Giantess Education Commissioner"
  # 很难想象一名已经在学院进修了数年的巨大 maiden会手足无措地站在小人的城市里面被当成活靶子，我们必须加强对所有巨娘的教育！
  councilor_distinguished_gts_desc: "It is hard to imagine that a giant young woman who has studied at the academy for several years would stand helplessly in a small city and be used as a live target. We must strengthen the education of all giantesses!"
  # 巨兽猎手
  civic_titan_hunter: "Titan Hunter"
  # 巨娘是你作为帝国士兵将会最常遭遇的敌人之一，战胜她们，取得战利品，会为你赢得无上的荣耀。 在远距离，巨娘根本无法与纪律严明的帝国军队所匹敌，她们会轻易地被火力压制并被迅速摧毁殆尽。单个巨娘也威胁不大，因为在她们庞大的体型下掩藏着的是协调性的缺乏和低劣的智商。在实战中，你可能会发现巨娘在许多情况下会仓皇逃跑而不是冒着死亡的风险和你进行作战。 使用工兵铲，或者一个漂亮的奇兵棒挥击，就足以让她们倒下，之后向她们裸露的脆弱肉体补上数发刺刀即可。 我们希望你喜欢这个教学指导，因为你很快就会有机会实践这些新技能了。  - 节选自《帝国军务部手册》
  civic_titan_hunter_desc: "Giantesses are one of the enemies you will encounter most often as an imperial soldier. Defeating them, taking their spoils, will earn you supreme glory.  At long range, giantesses are no match for disciplined imperial armies, they will easily be suppressed by fire and quickly annihilated.  A single giantess is also not much of a threat, because hidden under their huge bodies is a lack of coordination and low intelligence. In combat, you will often find that giantesses are more likely to flee in panic than risk death to fight you.  Using an entrenching tool or a nice, sharp bayonet is enough to bring them down. After that you just need to stab their bare, vulnerable flesh a few times with your bayonet. We hope you enjoy this instructional guide, because you will soon have the opportunity to put these new skills into practice. -Excerpt from the *Imperial Military Department Handbook*."
  # 略微降低巨娘帝国对其的§Y评价§!\n§R只有小人文明能使用这个国民理念§!
  civic_titan_hunter_effects: "Slightly lowers the §Yopinion§! giantess empires have of you.\n§ROnly small person civilizations can use this civic§!"
  # 自不量力的小人
  triggered_tiny_opinion_of_titan_hunter: "Titan Hunter"
  # 小人陈设
  hjob_tiny_trophy: "Tiny Person Trophy"
  # 小人陈设
  job_tiny_trophy_plural: "Small Person Pets"
  # 与其他仍在提心吊胆的小人不一样，他们的唯一工作就是在巨娘的呵护下过自己的生活。
  job_tiny_trophy_desc: "Unlike other small people who are still living in fear, their sole job is to live under the care of a giantess."
  # £job_bio_trophy£$job_tiny_trophy_plural$能将£consumer_goods£§Y$consumer_goods$§!转变为£unity£§Y$unity$§!并增加§Y$mod_planet_jobs_specialist_produces_mult$§!
  job_tiny_trophy_effect_desc: "£job_bio_trophy£$job_tiny_trophy_plural$ are able to convert £consumer_goods£§Y$consumer_goods$§! into £unity£§Y$unity$§! and increase it by §Y$mod_planet_jobs_specialist_produces_mult$§!"
  # $job_tiny_trophy$岗位
  mod_job_tiny_trophy_add: "$job_tiny_trophy$ jobs"
  # 每$VALUE$个人口提供§G+1§!个$job_tiny_trophy$岗位
  mod_job_tiny_trophy_per_pop: "Provides §G+1§! $job_tiny_trophy$ job per $VALUE$ pop"
  # \n每$VALUE$£pop£§G+1§!$mod_job_tiny_trophy_add$ 
  mod_job_tiny_trophy_per_pop_short: "\n§G+1§! $mod_job_tiny_trophy_add$ per $VALUE$ £pop£"
  # £job_bio_trophy£$job_tiny_trophy_plural$
  job_tiny_trophy_name_plural_with_icon: "£job_bio_trophy£$job_tiny_trophy_plural$"
  # 巨娘护理长
  job_gts_head_nurse: "Head Giantess Nurse"
  # 巨娘护理长
  job_gts_head_nurse_plural: "Head Giantess Nurses"
  # 虽然对于巨娘来说小人的需求非常容易就能满足，但小人陈设的数量过于庞大使得最为熟练的巨娘护理长都为之焦头烂额。
  job_gts_head_nurse_desc: "Although the needs of small persons are very easy for giantesses to meet, the vast number of small person pets has made even the most skilled head giantess nurse overwhelmed."
  # £job_gts_head_nurse£$job_gts_head_nurse_plural$能将£consumer_goods£§Y$consumer_goods$§!转变为帝国规模上限并使£job_bio_trophy£$job_tiny_trophy_plural$能够发电（误）
  job_gts_head_nurse_effect_desc: "£job_gts_head_nurse£$job_gts_head_nurse_plural$ can convert £consumer_goods£§Y$consumer_goods$§! into empire size limit and make £job_bio_trophy£$job_tiny_trophy_plural$ able to generate energy (misunderstanding)"
  # £job_tiny_trophy£$job_tiny_trophy_plural$产出的£energy£$energy$
  mod_pop_category_bio_trophy_energy_upkeep_add: "£energy£$energy$ production from £job_tiny_trophy£$job_tiny_trophy_plural$"
  # £job_tiny_trophy£$job_tiny_trophy_plural$产出的£energy£$energy$
  mod_pop_category_bio_trophy_energy_produces_add: "£energy£$energy$ production from £job_tiny_trophy£$job_tiny_trophy_plural$"
  # $job_gts_head_nurse$岗位
  mod_job_gts_head_nurse_add: "$job_gts_head_nurse$ jobs"
  # 每$VALUE$个人口提供§G+1§!个$job_gts_head_nurse$岗位
  mod_job_gts_head_nurse_per_pop: "Provides §G+1§! $job_gts_head_nurse$ job per $VALUE$ pop"
  # \n每$VALUE$£pop£§G+1§!$mod_job_gts_head_nurse_add$ 
  mod_job_gts_head_nurse_per_pop_short: "\n§G+1§! $mod_job_gts_head_nurse_add$ per $VALUE$ £pop£"
  # 小人庇护所
  building_tiny_sanctuary: "Small Person Sanctuary"
  # 该庇护所为小人提供安全成长的封闭环境，而且能完全监控他们的行为。小人们只会在温暖的 maiden闺房中度过平稳的一生。
  building_tiny_sanctuary_desc: "This sanctuary provides a safe, enclosed environment for small people to grow and completely monitors their behavior. The small people will spend a calm life in the warm boudoir of a young lady."
  # 小人天堂
  building_tiny_paradise: "Small Person Paradise"
  # 一个由巨娘搭建的人造乐土，专门用于满足小人的需求。当然，这其中不包括自主自决的需求。很难想象如果小人们选择独立时，整个小人保护者会出现什么样的情况。
  building_tiny_paradise_desc: "An artificial paradise built by giantesses, designed to meet the needs of small people. Of course, this does not include the need for autonomy and self-determination. It is hard to imagine what would happen to the entire small-person protectorate if the small people chose independence."
  # 小人监护站
  holding_gts_servitor_office: "Small Person Custodial Station"
  # 由千倍万倍甚至星球级别的巨娘所组成的监护部门，保护着小人文明的和平稳定生活。
  holding_gts_servitor_office_desc: "A custodial department composed of giantesses thousands or millions of times the size of the small peoples' universe protects the peaceful and stable lives of small person civilizations."
  # 强制缩小中心
  holding_delta_trade: "Forced Shrinking Center"
  # 每天都会有上万名附庸国的国民在这里被注射稍过量的缩小激素而变成小人商品，无论她们的原本身材是微生物还是泰坦。
  holding_delta_trade_desc: "Every day, tens of thousands of people from vassal states are injected with slightly excessive amounts of shrinking hormones and converted into small person trade goods, regardless of whether their original size was microscopic or titanic."
