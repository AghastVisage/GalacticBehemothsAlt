l_english:
  # 巨娘崇拜
  civic_gts_worship: "Giantess Worship"
  # 这个文明居住的星球自有记录以来就经常遭到巨娘们的拜访，而她们的文明也在最初将巨娘视为恐怖的天灾，但随着她们的科技进步，她们逐渐理解了巨娘的存在并掌握了如何利用巨娘遗留下来的体液，内衣等等发展自己的文明。时至今日，她们已经把巨娘视为对自己的文明发展的巨大助力并准备好踏上旅途去遥远的宇宙中寻找更多巨娘。
  civic_gts_worship_desc: "The planet inhabited by this civilization has been frequently visited by giantesses since records began. Initially, their civilization viewed giantesses as terrifying natural disasters. However, as their technology advanced, they gradually came to understand the existence of giantesses and mastered how to utilize the bodily fluids, underwear, and other remnants left behind by giantesses to develop their own civilization. Today, they regard giantesses as a significant boon to their civilization's development and are ready to embark on a journey to the distant cosmos in search of more giantesses."
  # 殖民地每个§Y地貌§!会提供1个§Y$d_gts_deposit_explorer$§!和§Y$job_gts_deposit_explorer$§!岗位\n与§Y巨娘文明§!第一次接触后会触发额外事件\n招募§Y特殊巨娘领袖§!花费的£influence£§Y$influence$§!§G-25%§!\n§R只有小人文明能使用这个国民理念§!
  civic_gts_worship_effects: "Each §Yterrain§! on a colony provides 1 §Y$d_gts_deposit_explorer$§! and §Y$job_gts_deposit_explorer$§! job.\nTriggers additional events after first contact with a §YGiantess civilization§!.\nRecruiting §Yspecial Giantess leaders§! costs §Y$influence$§! £influence£ §G-25%§!.\n§ROnly Small Person civilizations can use this civic.§!"
  # 巨娘联络员
  councilor_gts_worship: "Giantess Liaison"
  # 巨娘联络员需要与星河中各类巨娘打交道，无论是温柔系还是残忍系都能轻松应付。
  councilor_gts_worship_desc: "The Giantess Liaison needs to deal with all kinds of giantesses in the galaxy, easily handling both gentle and cruel types."
