l_english:
  # 小花田
  NAME_gts_huatian: "Tiny HuaTian"
  # 这位领袖来自于一个远古文明最后的计划，由于过去的经历，她对于星海中的小人种族有着天然的好感，获得批准之后移居在她躯体上的小人个体也为我们提供了可观的岗位与资源
  DESC_gts_huatian: "This leader originates from the final plan of an ancient civilization.  Due to her past experiences, she possesses a natural fondness for the 'tiny' races of the galaxy. The individuals granted permission to reside upon her colossal body also provide us with a considerable number of jobs and resources."
  # 好啦……让我们开始工作吧……
  gts_huatian_catch_phrase: "Alright... Let's get to work, shall we...?"
  # 你们好，小家伙们……\n\n（迷茫地环顾了一下四周）\n\n……我还是，第一次以这样的视角观看宇宙呢……
  gts_huatian.999.desc: "Hello there, little ones...\n\n(Looks around in a daze)\n\n...This is... the first time I've seen the universe from this perspective..."
  # 你的身份是？
  gts_huatian.999.a: "What is your identity?"
  # 我的身份？如果你们读过了刚才那个……遗址里的文字的话，应该就都明白了吧。我就是……那个文明最后的、却永远没有照耀过她们的希望……
  gts_huatian.999.a.response: "My identity?  If you've read the text from that... ruin, you should already understand. I am... the last hope of that civilization, a hope that never shone upon them..."
  # 那些花是什么？
  gts_huatian.999.b: "What are those flowers?"
  # 是曾经那个文明的基因学结晶，也是让我变成如今这个巨大的样子的原因。曾经的那个平凡的我原本也和所有普通人一样渺小，无力，每天活在那些巨娘们脚掌的阴影之下……直到后来，我的文明选中了我作为计划的执行者，她们首先进行了一项庞大的基因工程，把我变大百倍左右之后在我的身体上种下了这些鲜花。它们……它们可以不断地吸收那颗星球深处源源不断的能量，并将其转化为我的体型与能量\n\n后来……星球上的文明消亡了……（眼角逐渐湿润）那些与我共生的花朵就和我一起不断攫取着星球的能量，它们在不断地复制增殖，我也在不断地变大，直到……现在这个样子，这个比起之前的星球都庞大了成千上万倍的样子\n\n……我知道你想问什么。没错，如果这些花儿还在的话，我以后还可以变得更大。至于尽头在哪里……我也不知道。
  gts_huatian.999.b.response: "They are the genetic culmination of that bygone civilization, and the reason I've become so incredibly huge.  The ordinary me of the past was just as small and powerless as any common person, living every day under the shadow of those giantesses' footfalls... Until, one day, my civilization chose me as the executor of their plan.  First, they undertook a massive genetic engineering project, enlarging me a hundredfold, and then they planted these flowers upon my body.  They... they can continuously absorb the boundless energy from deep within that planet, converting it into my size and power.\n\nLater... the civilization on the planet perished... (Eyes begin to glisten) The flowers, symbiotic with me, continued to draw energy from the planet alongside me.  They multiplied and replicated endlessly, and I continued to grow, until... I reached my current state, thousands of times larger than the planet itself.\n\n...I know what you're going to ask.  Yes, if these flowers remain, I can continue to grow even larger.  As for where the limit lies... I have no idea."
  # 你的名字是什么呢？
  gts_huatian.999.c: "What is your name?"
  # 我……？我没有名字……\n\n好吧……如果你们愿意的话，以后就叫我小花田吧。虽然我知道我现在的大小可能称不上\"小\"，但是……我还是不愿意忘记曾经我所经历的一切，以及我作为普通人生活在那颗小小的行星上的记忆……
  gts_huatian.999.c.response: "Me...? I don't have a name...\n\nWell... if you wish, you can call me Tiny HuaTian.  I know my current size might not exactly qualify as \"tiny,\" but... I don't want to forget everything I've experienced, or the memories of my life as an ordinary person on that small planet..."
  # 你以后的目的呢？
  gts_huatian.999.d: "What is your goal for the future?"
  # ………………\n\n……我要复仇\n虽然我不知道曾经毁灭了我的文明的那个帝国身处何方，我不知道她们的文明如何、力量如何，我甚至不知道那个帝国是否仍然存在。但既然我已经有了这样的力量……我就一定会为了我的同胞们复仇。那些依仗几千几万米身高就残忍且无理地虐杀了我的文明的巨娘……我会加倍奉还的
  gts_huatian.999.d.response: "..................\n\n...Vengeance.  Though I don't know where the empire that destroyed my civilization is located, I don't know their culture or their strength, I don't even know if that empire still *exists*.  But since I now possess such power... I *will* avenge my people.  Those giantesses who relied on their thousands, tens of thousands of meters in height to cruelly and senselessly slaughter my civilization... I will repay them many times over."
  # 你愿意加入我们吗？
  gts_huatian.999.e: "Will you join us?"
  # 既然是你们唤醒了我的话……我可以加入你们。我也希望能够在这个帝国里找到一些新的依靠
  gts_huatian.999.e.response: "Since it was you who awakened me... I can join you.  I also hope to find some new support within this empire."
  # 我们的科研人员呢？
  gts_huatian.999.f: "Where are our researchers?"
  # 你是说那些之前在我的小腹上四处乱跑的小家伙们？嗯……我能够感觉到，她们现在还在我的身体上面，只不过好像迷失在了某条肌肤上的纹路里……过一段时间，我就会把她们还给你们的
  gts_huatian.999.f.response: "You mean those little ones who were running around on my lower abdomen earlier?  Hmm... I can feel them, they're still on my body, but they seem to have gotten lost in one of my skin's creases...  In a little while, I'll return them to you."
  # §Y小花田§!作为一名§H领袖§!加入了我们的帝国。
  gts_huatian.999.hire_custom_tooltip: "§YTiny HuaTian§! has joined our empire as a §HLeader§!."
  # 远古遗愿
  gts_trait_leader_huatian_a: "Ancient Legacy"
  # 这位领袖孤身一人跨越了难以想象的岁月，我们无从得知她在这段漫长的时间里经历了什么，但至少她所拥有的知识足以为我们解决大量的难题。此外，她庞大的身躯本身就是非常不错的研究对象，当然……需要先征得她的同意
  gts_trait_leader_huatian_a_desc: "This leader has traversed an unimaginable span of time alone. We cannot know what she experienced during that long period, but at least the knowledge she possesses is sufficient to solve many of our problems. In addition, her immense body itself is a very good research subject, of course... we need to obtain her consent first."
  # 钟爱小人
  gts_trait_leader_huatian_b: "Lover of Tinies"
  # 尽管由于其巨大的体型，每天都有大量偷渡到少女躯体之上的小人被无意识碾碎在小花田的身体各处，但这位领袖仍然尽量体贴地照顾着帝国中的小人个体，并允许那些微生物一般的存在寄居到她的身体上面
  gts_trait_leader_huatian_b_desc: "Despite the fact that, due to her colossal size, countless 'tinies' are unintentionally crushed across HuaTian's body every day, this leader still strives to care for the 'tiny' individuals within the empire and allows those microbe-like beings to reside upon her body."
  # 堕落憎恶者
  gts_trait_leader_huatian_c: "Scourge of the Fallen"
  # 由于小花田过去的经历，这位领袖对于银河系之中存在许久的古老帝国以及打破和平的天灾生物好感甚低。因此，小花田原因用她庞大的体型为我们的舰队提供一点点\"便利\
  gts_trait_leader_huatian_c_desc: "Due to HuaTian's past experiences, this leader holds a very low opinion of the ancient empires that have existed in the galaxy for a long time, as well as the crisis creatures that disrupt the peace. Therefore, HuaTian is willing to use her massive form to provide a little 'convenience' to our fleets."
  # 文明消逝的忧郁
  gts_trait_leader_huatian_d: "Melancholy of a Lost Civilization"
  # 虽然小花田已经几乎全身心地投入了我们的帝国的各项事务之中，但科研人员仍然能够偶尔观测到这位领袖无意识间流露出的忧伤，以及眼角流下的一滴足以蓄满行星的泪水
  gts_trait_leader_huatian_d_desc: "Although HuaTian has almost completely devoted herself to the various affairs of our empire, researchers can still occasionally observe the sadness that this leader unconsciously reveals, and the tears that flow from the corners of her eyes, enough to fill a planet."
  # 镜中光华
  gts_trait_leader_huatian_e: "Mirrored Brilliance"
  # 这位巨娘身上拥有着无穷的可能性，只要借助恰当的手段，我们就可以对这些可能性进行观测并收获无穷多的巨娘研究素材
  gts_trait_leader_huatian_e_desc: "This giantess possesses infinite possibilities. With the right methods, we can observe these possibilities and reap countless research materials on giantesses."
  # 星海与花海
  gts_trait_leader_huatian_f: "Sea of Stars and Flowers"
  # 小花田领袖的蜜穴深处存在着一片自远古遗留而下的“花海”,在我们至今仍未能完全解析的作用下,这些已经随着小花田一同膨胀到巨树般大小的花朵可以吸收四周的一切光能与热能,并将其转化为小花田领袖的体型.虽然由于基因识别的原因、这些花朵目前仅能够对小花田领袖生效,不过我们仍然在那里建立了一座简单的研究所进行不断的研究,并期待着得到答案的那一天.
  gts_trait_leader_huatian_f_desc: "Deep within Leader HuaTian's honey pot lies a 'sea of flowers' left behind from ancient times. Under the influence of mechanisms we have yet to fully understand, these flowers, which have expanded along with HuaTian to the size of giant trees, can absorb all surrounding light and heat energy, converting it into Leader HuaTian's size. Although, due to genetic recognition, these flowers currently only affect Leader HuaTian, we have nevertheless established a simple research institute there to conduct continuous research, and we look forward to the day when we find the answers."
  # 拥抱过去,创造未来
  gts_trait_leader_huatian_g: "Embrace the Past, Create the Future"
  # 在亲自毁灭了曾经笼罩于她头顶的阴霾之后,小花田领袖已经完全投入了我们的帝国与我们的事业.现在对于我们的公民们来说,比起一位天体级巨娘、小花田更像是一位对未来充满了希望的邻家学妹.只不过,这位“学妹”会时不时亲切地笼罩在星球的天空上用无比宏伟的手心对我们打招呼罢了.
  gts_trait_leader_huatian_g_desc: "After personally destroying the shadow that once loomed over her, Leader HuaTian has completely devoted herself to our empire and our cause. Now, for our citizens, rather than a celestial-level giantess, HuaTian is more like a friendly schoolgirl next door who is full of hope for the future. It's just that this 'schoolgirl' will occasionally and affectionately loom over the planet's sky and wave to us with her immeasurably majestic hand."
  # 无垠花海
  gts_trait_leader_huatian_h: "Boundless Flower Sea"
  # 现在,少女蜜穴深处的那片花海已经随着少女的成长与内心世界的开放而扩张了许多.在小花田逐渐娴熟的控制下,我们已经能够借助它们更好地开发少女蜜穴之内近乎无尽的资源了.而那片粉嫩褶皱间富饶温暖的世界,则被越来越多的公民认为是宛如天堂般的美好之地.
  gts_trait_leader_huatian_h_desc: "Now, the sea of flowers deep within the girl's honey pot has expanded considerably along with the girl's growth and the opening of her inner world. With HuaTian's increasingly skilled control, we can already use them to better develop the nearly endless resources within the girl's honey pot. And that fertile and warm world between the pink folds is considered by more and more citizens to be a paradise-like place of beauty."
  # 芬芳四散
  gts_trait_leader_huatian_i: "Fragrance Spreads Far"
  # 这位领袖在小花田领袖的蜜穴中度过了一段难忘的时光.在那里,覆盖在了她的娇躯之上的花瓣不仅塑造了她如今泰坦级的宏伟体型,更使她直到如今仍在散发着阵阵花香,吸引着无数小人或是小型巨娘的爱恋与崇拜.
  gts_trait_leader_huatian_i_desc: "This leader spent an unforgettable time in Leader HuaTian's honey pot. There, the petals that covered her delicate body not only shaped her current titan-level majestic figure but also caused her to emit a constant floral fragrance, attracting the love and worship of countless tinies and small giantesses alike."
  # 科研型舰娘
  gts_trait_leader_huatian_j: "Research-Type Shipgirl"
  # 在我们几近倾尽国库的工程后,小花田领袖已经具备了作为舰娘作战的一切条件.在星系中广袤的战场上,少女那双蹂躏星辰的雪白丝足将会是所有敌人所看到的最后景象.
  gts_trait_leader_huatian_j_desc: "After our engineering efforts, which nearly exhausted the national treasury, Leader HuaTian now possesses all the conditions to fight as a shipgirl. On the vast battlefield of the star system, the girl's snow-white, silk-stockinged feet, which trample the stars, will be the last sight all enemies see."
  # 橘子花的花语
  gts_trait_leader_huatian_orange_blossom: ""The Meaning of Orange Blossoms""
  # \n“就算自己所做的任何事情，在最后结出‘果实’之前都不会被任何人看见……”\n“那就想办法，将信仰去交给“时间”吧。”
  gts_trait_leader_huatian_orange_blossom_desc: ""\\n“Even if nothing you do is ever seen by anyone until it finally bears ‘fruit’…”\\n“Then find a way to entrust your faith to ‘time.’”""
  # 花田
  NAME_gts_huatian_system: "HuaTian"
  # 最后的希望
  gts_huatian_digsite: "The Last Hope"
  # 这颗荒芜星球的下方似乎潜藏着什么秘密
  gts_huatian_digsite_desc: "There seems to be some secret hidden beneath this desolate planet."
  # 巨型废弃建筑
  gts_huatian.1000.name: "Colossal Abandoned Structure"
  # 经过科研小队的登陆检测，我们发现这座建筑物似乎存在着入口，一座古朴的合金大门屹立在了小队面前，一条已经在漫长的岁月中破败了的大型长廊通向了建筑物的深处，这显然是远古文明留下的遗址之一，我们已经在入口处外围建立了考古站点，科研工作也已经就绪
  gts_huatian.1000.desc: "Upon landing and conducting preliminary scans, our research team discovered what appears to be an entrance to this structure. An ancient, alloy gate stands before them, leading into a massive corridor that has decayed over countless years. It is clearly the remnants of an ancient civilization. We've established an archaeological site outside the entrance, and research preparations are underway."
  # 好的
  gts_huatian.1000.a: "Understood."
  # 起源
  gts_huatian.1001.name: "Genesis"
  # 这条长廊的金属墙壁上刻着大量的文字以及供外星生物阅读的象形文字\n显然，建造了这座建筑物的文明已经预料到了自身迫近的灭亡，并为了纪念或是其他的什么意义建立了这座类似于博物馆的建筑，根据考古小队传递而来的信息，我们已经整理出了如下事件：\n\n在未知的岁月之前，这颗星球上的文明曾经十分繁荣昌盛，并且在数次科技革命之后成功研制出了超光速引擎，举国上下为此欢庆不已，星球上的原住民们相信，自己将在这个帝国的领导下迈向银河，得到理想中幸福的生活，然而，就在第一艘安装了超光速引擎的科研船飞出了这个恒星系之后，人们才认识到……\n\n第一部分的内容到此戛然而止，即使是我们也能够从文字中体会到那些先民在留下这些内容时强烈的不甘
  gts_huatian.1001.desc: "The metal walls of this corridor are covered in copious writings and pictograms for alien races to understand.\nClearly, the civilization that built this structure foresaw its impending demise, and built this museum-like building to commemorate or perhaps something else. Based on information transmitted by the archaeological team, we've compiled the following account:\n\nIn ages past, the civilization on this planet was prosperous and flourishing, and after several technological revolutions, successfully developed a hyperdrive engine.  The entire nation celebrated, and the original inhabitants of the planet believed they would advance into the galaxy under the leadership of their empire, and achieve the happy life they envisioned. However, only after the first research ship equipped with the hyperdrive engine left the star system did they realize...\n\nThe first part of the account ends abruptly. Even we can feel the intense frustration of those ancient people as they left these records."
  # 有趣
  gts_huatian.1001.a: "Intriguing."
  # 绝望
  gts_huatian.1002.name: "Despair"
  # 第一艘科研船很快就离奇地消失在了邻近的另一个恒星系，当局政府在稳定了人们的情绪之后很快就发射了另一艘科研船，这一次传来的景象却让所有人陷入了更深的恐慌，科研船首先遇到了一堵横跨了数千千米的白色巨墙，经过检测之后，科学家们惊奇地发现，这堵墙壁的材质竟然是某种强度超乎了现有科技水平的特殊布料，墙壁后方还存在着另一面看不见尽头的肉色有机质巨墙，一阵阵强烈的热量辐射正在从墙壁的内部透出，不甘心的科研船又环绕着这件巨物探测了许久，才发现了这样一个事实：这个庞然大物竟然仅仅只是一位泰坦巨娘的白丝脚掌，而在纠缠着的丝线大陆深处的一小撮残骸则告诉了她们上一艘科研船最后的命运\n\n经过了不断的努力与牺牲了大量人力的付出，这个文明才成功与那位巨娘所属的文明成功建立了联系，通过巨娘帝国传递而来的一点点少得可怜的信息，她们这才得知：自己的种族的体型在相较于宇宙平均水平就已经小了许多，更别提那些平常以杀戮蹂躏小人种族甚至星球为乐的巨娘种族了，更糟糕的是，在那位泰坦少女饱含玩味与怜悯的目光中，她们知道了：自己的文明也将会是同一个下场
  gts_huatian.1002.desc: "The first research ship soon disappeared mysteriously in a neighboring star system. After calming the public, the authorities quickly launched another research ship. This time, the image that came back plunged everyone into even deeper panic. The research ship first encountered a white giant wall spanning thousands of kilometers. After several scans, the scientists were astonished to discover that the material of the wall was a special fabric with a strength that surpassed the current level of technology. There was another huge fleshy, organically textured wall that stretched to the horizon from behind the wall, and intense heat radiation was emanating from the inside of the wall. Unwilling to give up, the scientist decided to circumnavigating this vast object, until they discovered the truth: this behemoth was merely the white silk stocking covered feet of a Titan-class giantess. The wreckage of the last ship was tangled in the fabric."
  # 可怕……
  gts_huatian.1002.a: "Horrifying..."
  # 噩梦
  gts_huatian.1003.name: "Nightmare"
  # 如同那位少女所说，加入了星海共同体之后的这个文明饱受屈辱，她们整个文明拥有的外交权重还比不上一位巨娘领袖所带来的威压，她们的人民乃至于城市都在一次次劫掠般的贸易中被运输向了其他的巨娘文明以供消耗甚至玩乐，甚至她们的舰队在那些舰娘的眼中也如同虫子一般渺小，最令她们无法忍受的是，人们倾尽全国之力建造而出的一艘战列舰刚刚启航，就被路过的一位泰坦巨娘随手捏走当做了玩具，每时每刻，她们都在那些巨娘的足底之下瑟瑟发抖着，而她们甚至没有任何有效的解决方法\n\n直到另一个同样古老的巨娘帝国向她们宣战的那一天，这样的情况始终没有结束，而现在，她们认为：是时候发起复仇了，即使最终的命运可能还是会被碾碎，但至少……她们获得了尊严
  gts_huatian.1003.desc: "As that giantess said, this civilization suffered humiliation after joining the galactic community. The diplomatic weight of their entire civilization was not even comparable to the prestige of a single giantess leader. Their people, even their cities, were transported to other giantess civilizations in repeated raids of trade trade, for consumption or even entertainment. Even their fleets were as small as small insignificant pests in the eyes of those shipgirls. Even more intolerable was the fact that a battleship they'd poured their entire national effort into building was casually snatched away by a passing Titan-class giantess to be used as a toy. Every moment, they trembled under the feet of those giantesses, and they didn't even have any effective solutions.\n\nThis situation didn't change until another equally ancient giantess empire declared war on them. And now, they believe it is time for revenge. Even if the ultimate fate is to be crushed,at least...they gained dignity."
  # 有趣
  gts_huatian.1003.a: "How curious."
  # 终结
  gts_huatian.1004.name: "Termination"
  # 留给这个文明的时间已经不多了，巨娘帝国的陆军舰队正在夜以继日地向着这个小小的恒星系赶来，在万众一心的信念与夜以继日的劳作下，一项基于她们卓越的生物科学的大型工程开始了紧锣密鼓的筹备，为了这项计划，政府甚至几乎耗尽国库改造了这颗星球的地貌，划出了这片大陆作为计划的实行地点，事情进展的很顺利，在人们热切的目光里，那件能够改变一切的\"武器\"即将问世，随之而来的将会是全面且彻底的复仇战争\n\n然而，她们还是晚了一步\n\n巨娘帝国的舰队在进行了一次跃迁航行之后突如其来地降临到了这个恒星系，一位位高达数千米的巨大少女无情地登陆了这个弱小文明的母星，即使她们竭尽全力地组织起了一次次的抗争与伴随而来的数不尽的牺牲，但本就十分渺小的她们在那些巨娘眼中可能还没有自己脚下的微生物显眼，所谓的军队、都市也只不过是稍微宽了一点点的灰色地毯罢了，而当巨娘们戏谑地在城市里肆虐，用巨足踩踏、碾压、屠杀着数以百万计的公民的时候，这个文明仅剩的舰队也被与巨娘陆军一同而来的泰坦舰娘随手拍碎，无尽的绝望彻底笼罩了整个文明，仅剩的一批科学家在孤注一掷地秘密埋藏了那件\"武器\"之后全部投降，只留下一位寿命几乎到了尽头的首席科学官在长廊里写下了我们所看到的这一切，这个文明的命运也就此画上了句点\n\n长廊上的文字至此戛然而止，最后的门扉已经矗立在了我们面前，怀着对那个远古文明的敬畏，我们的科学家轻轻地推开了巨大的大门，然而，本以为会看见各种难以想象的物件与钢铁造物的科研队员们却惊讶地发现：\n\n这里只剩下了一片花海
  gts_huatian.1004.desc: "Time was running out for this civilization. The giantess Empire's land invasion fleet was rushing towards their small star system day and night. With a united belief and tireless work, a large-scale project based on their excellent bioscience began to be prepared intensively. For this plan, the government nearly exhausted the national treasury to transform the planet's topography, and demarcated this continent as the location for the implementation of the plan. Things went smoothly, and in the eager eyes of the people, the \"weapon\" that could change everything began to be completed. What would follow was a full and complete war of revenge.\n\nHowever, they were still one step too slow.\n\nThe giantess Empire's fleet suddenly descended into this star system after a warp jump. Giant girls, each thousands of meters tall, ruthlessly landed on the mother planet of this weak civilization. Even if they tried their best to organize resistance after resistance time after time, and the countless sacrifices that came with it, they has became insignificant in the eyes of those giantesses, maybe because the microorganisms under their feet was more conspicious, and the so-called armies and cities were just slightly wider gray carpets. When the giantesses rampaged through the city jokingly, using giant feet to trample, crush, and slaughter millions of citizens. Even the remaining fleet of this civilization was casually smashed by the Titan shipgirls who came with the giantess army. Endless despair completely enveloped the entire civilization. The last batch of scientists frantically and secretly buried this \"weapon\" at all costs, then surrendered, leaving only a chief scientist with an life at it's end wrote all of this on that corridor. The fate of this civilization came to an end.\n\nThe text on the corridor ends here. The final door now stands before us. With reverence for that ancient civilization, our scientists gently pushed open the huge door. However, the research team, who thought they would see all kinds of unimaginable objects and iron creations, was surprised to discover:\n\nAll that remains here is a sea of flowers."
  # 继续调查！
  gts_huatian.1004.a: "Continue the investigation!"
  # 花海
  gts_huatian.1010.name: "Sea of Flowers"
  # 这片花园的出现出乎了所有人的意料，许多我们难以叫出名字的鲜花此时正盛开在广袤的泥土之中，尽管没有阳光，但这些花朵仍然奇迹般的开放着，显然，我们从太空中探测到的那座巨型建筑就是为了保护这些花朵的，然而，科研人员们仍在好奇，难道那个远古文明留下的最终武器就是这些普通的花朵？即使它们的确像是这颗星球上的独特产物，但那也仍然不能解释这片花园存在的原因，面前的空间还有很多，科学家们已经做好了继续探索这片大陆般大小的花园的准备
  gts_huatian.1010.desc: "The appearance of this garden was unexpected by everyone. Many flowers we can't name are now blooming in the vast soil. Although there is no sunlight, these flowers still bloom miraculously. Obviously, the giant building we detected from space was to protect these flowers. Now, the researchers are still curious, and can even the final weapon left by that ancient civilization be these ordinary flowers? Even if they do seem to be unique products of this planet, that still cannot explain the reason for the existence of this garden. There is still a lot of space in front of us, and scientists are ready to continue exploring this continent-sized garden."
  # 继续调查，追踪到底
  gts_huatian.1010.a: "Continue the investigation, track it to the end."
  # 很快就会有结果的……
  gts_huatian.1010.a.tooltip: "There will be results soon..."
  # 这些花看起来不错，我们也可以种一些
  gts_huatian.1010.b: "These flowers look good, we can plant some too."
  # 美丽的花朵谁不喜欢呢？
  gts_huatian.1010.b.tooltip: "Who doesn't like beautiful flowers?"
  # 把这些花都除掉，不要妨碍我们
  gts_huatian.1010.c: "Remove these flowers, don't get in our way."
  # 真的要这么做吗……
  gts_huatian.1010.c.tooltip: "Are you sure you want to do this..."
  # 繁花似锦
  gts_huatian.1011.name: "Profusion of Flowers"
  # 就在我们的科研小队探索到了花海的中央地带的时候，猛然震动起来的地面以及山崩地裂般的景象都说明了异变的降临，盛开的花朵随着泥土与轰然升起的地面直入云霄，另一片洁白的大地从这颗星球的地幔层缓慢升起，随之而来的是连结着乳白色地面的同样雪白的巨柱，以及不断冲刷着大地的无数根银蓝色的角质丝线，留在地面上的小队很快就在这一巨变中失去了踪影，而仍然在太空中待命的小型科研船则记录下了这里发生的一切\n\n这颗星球的地表在强烈的震动以及地层深处巨物的挤压下支离破碎，露出了始终隐藏于地表之下的真相：一位闭着眼睛，仿佛还在沉睡中的天体级少女，仅仅在几乎一瞬间之后，这颗相比起来显得更加微小的行星就在少女的身体外彻底粉碎，曾经包裹着少女的地层物质也在少女自身的巨大引力下被吸引向了少女庞大的身躯，最终成为了环绕着少女足趾的一圈陨石环，刚刚完成应急避险并且进行了紧急扫描的科研船则证实了，这位天体级少女正是这颗星球上潜藏深处的最终秘密，刚刚的那片花海则处于少女裸露在外的小腹处的位置，科研船在连续躲避了数根席卷而来的巨大发丝之后才来得及测量出，这位少女的体型似乎在刚刚的巨变之后再次发生了膨胀，此时甚至已经远远大于她出现的那颗行星，而就在科研船想要降落在少女的身体上继续探测的时候，又一件意料之外的事情发生了：\n\n那位少女睁开了眼睛，水蓝色的庞大瞳孔在短暂的失神之后直接聚焦到了尘埃一般渺小的科研船上方，而我们现在甚至仍然不知道这位巨娘的态度与信息，就在仅剩的科研人员以为一定会被碾碎了的时候，我们却收到了来自那位少女的通讯
  gts_huatian.1011.desc: "When our research team had explored to the central area of ​​the sea of ​​flowers, the ground suddenly shook violently, and the scene of mountains collapsing and the earth cracking showed the arrival of the abnormality. The blooming flowers rose straight into the sky in with the soil and the roaring ground, and another a piece of white land slowly rose from the earth, followed by equally snow-white giant pillars connecting to the milky-white earth, and countless silver and blue keratinous threads constantly scouring the earth. The team left on the ground was soon lost in this great change, and the small scientific research ship still waiting in space recorded everything that happened here.\n\nThe surface of this planet was shattered by the strong vibration and the squeezing of the huge objects deep in the strata, revealing the truth that had always been hidden beneath the surface: a celestial-level girl with her eyes closed, as if still asleep. In almost an instant, this smaller planet was completely shattered outside the girl's body, and the stratum material that once wrapped the girl was also attracted to the girl's huge body by the girl's own huge gravity, and finally became a ring of meteorites surrounding the girl's toes. The scientific research ship that had just completed emergency avoidance and performed an emergency scan confirmed that this celestial-level girl was the ultimate secret hidden deep in this planet. The sea of flowers that had just appeared was the location of the girl's exposed lower abdomen at. After the scientific research ship managed to avoid several huge strands of hair that swept over, it was able to measure that, but after this great change, the girl's size seems to have expanded again, and now it is even much larger than the planet she appeared on. What's more, The incident happened again: The girl opened her eyes, and after a brief trance, the huge water-blue pupils directly focused on the dust-like scientific research ship, and we still don't even know the attitude and information of this giantess. Just when the remaining scientific researchers thought they would definitely be crushed, we received communication from that girl."
  # 立即接入通讯！
  gts_huatian.1011.a: "Connect the communication immediately!"
  # 但愿……
  gts_huatian.1011.a.tooltip: "Hope..."
  # 繁花落尽
  gts_huatian.1012.name: "Flowers Fall"
  # 就在我们的探索人员正在努力地除去这些碍事的花朵的时候，一阵突如其来的地震席卷了这片花海，科研人员本以为这只不过是这颗星球上正常的地质运动，但是她们错了，在一阵天崩地裂的轰鸣声中，整片大地连带着花海被地层深处的一个巨物粗暴地推向了天空，随之而来的是一片雪白色的大陆，以及周围一同升起的白嫩巨柱，地面上的科研队已经彻底不见了踪影，仍在太空中待命的小型科研船则在勉强躲过了飞溅而出的地层物质以及席卷而来的银蓝色巨型角质丝线之后被迫发动了紧急超光速跃迁，回到了我们最近的一个殖民地轨道上，而科研船最后拍摄下来的影像则证实了：那个巨物正是一位潜藏于地层深处的天体级少女，仍在不断地膨胀中的少女已经完全摧毁了她曾经所处的那颗星球，仅剩的一些物质则被少女的引力捕捉，成为了天体级少女足趾边缘灰尘一般的小行星，更糟糕的是，最后的几份影像已经显示出：那位少女在科研船进行超光速跃迁之前就已经睁开了眼睛，水蓝色的行星级瞳孔已经注视到了微生物一般的科研船之上\n\n紧接着，巨变陡生，一个庞大的身影出现在了现在的科研船旁边，笼罩着轨道下小小的殖民地，那正是那位追杀至此的少女，白嫩的脸庞此时正气鼓鼓地盖住了殖民地的天空，巨大的瞳孔怒视着前方渺小的科研船，直到两根巨指出现在了殖民地星球以及舰船两侧，开始缓缓向着中间碾来的时候，人们才在少女的指纹巨墙所带来的突如其来的绝望中认识到与天体级少女敌对的巨大危险，万幸的是，就在少女的指肚即将超过殖民地的洛希极限的时候，那位少女无声地收回了巨指，随后，在一阵响彻了那个恒星系的抽泣声响起之后，那位少女头也没回地离开了这里，只留下了一片空荡荡的恒星系\n\n然而，在她离开的时候，我们派出的科研小队与科学官同样被淹没在了她的躯体之上，虽然我们已经失去了与科研小队的通讯，但远程的生命体征监测设备表明她们还没有遇难、同时还标记出了那位少女离去的方向，因此，为了救回我们的科学官，我们不得不派出另外一支探险队登录她的身体并寻找失联的科研小队，不过，鉴于天体级巨娘无比庞大的身躯与错综复杂的身体构造和生理反应，这将会是一个十分困难的过程
  gts_huatian.1012.desc: "The girl had followed the ship into the orbit above the colony. It was now at her mercy."
  # 快点想想办法！
  gts_huatian.1012.a: "Hurry, someone think of a solution!"
  # 世界之外
  gts_huatian.1020.name: "Outside the World"
  # 穿越黑洞的小花田来到了一个似乎是卧室的空间，唯一不同的是这个卧室的大小让天体级的花田看起来都像是一个手办\n\"小家伙干得不错嘛\"\n花田回头一看，这个巨大卧室的主人，一只灰毛红眸小萝莉正对着自己微笑，手上似乎还拿着一颗星球…那就是花田曾经的母星§Y地球§!！\n\"想不到小小的宇宙泡里竟然还有这么可爱的小家伙，差点就把你们的宇宙当做下午茶喝掉了呢\"\n此时的§Y地球§!上，无数人看着天上那太阳般闪耀的红色眼瞳，尽管幼女的脸庞看起来十分可爱，但是在如此巨大的体格差下，人们仍然感到恐惧\n\"唔，好想把这颗星球塞进批里啊…\"\n花田怎么会让自己的母星被眼前的灰毛萝莉以如此屈辱的方式毁掉！为了朝夕相处的朋友，为了星球上的生命，小花田只能屈服于小萝莉的淫威之下，放下天体级巨娘的尊严，成为匍匐在她脚下的卑贱宠物\n\"请不要伤害她们！我…我可以当你的小宠物！只要不伤害她们，怎么样对待我都可以！\"\n作为天体级巨娘的花田，从来没有想过有一天自己也会变成卑微渺小的存在，自己的生命乃至星河的命运完全掌握在眼前的萝莉神明手上\n\"唔…既然这颗星球对你这么重要那就交给你保管好了，你叫花田柳叶对吧，真好听的名字，那么从今天开始你就是咱的女仆啦！\"\n巨大的萝莉用手指抚摸着花田的身体，小花田又害怕又兴奋，如果她能让主人满意的话，这颗星球上的生命或许就能保住了吧？\n\"是的…主人\"\n此时的其余的人们惊讶的发现这么大一个§Y地球§!竟然平白无故的失踪了…也许真相永远不会被微缩银河内的人类知道了
  gts_huatian.1020.desc: "Huatian went through black hole... arrived at bedroom... loli holding Earth... Huatian begged... became pet... Earth saved (maybe)..."
  # 无知是福
  gts_huatian.1020.a: "Ignorance is bliss"
  # 还有后续事件！
  gts_huatian.1020.a.tooltip: "There are follow-up events!"
  # 女仆小花田的日常
  gts_huatian.1021.name: "Daily Life of Maid Little Huatian"
  # 今天朝阳正好，是个做蛋糕的好日子\n\n清晨的暖阳透过厨房的格子窗，懒懒的撒在整洁的灶台上，也撒在一个在桌上忙碌着的小小身影上\n\n那是个只比半个巴掌稍大几分的可爱小人，半透的过膝白丝袜，脚踩铮亮小皮鞋，一身标准的黑白女仆装，再往上则是柔顺地伏贴在肩头的水蓝色长发，一双如蓝宝石般澄澈的眸子中闪动着勤劳孩子特有的光——正是黑羽家的小女仆，花田柳叶，小花田\n\n今天是个很特殊的日子，要给主人准备的早餐是美味的蛋糕，不过既然是要给主人的，自然就不会是普通的蛋糕，为此花田早早地就起来调好了蛋糕胚放进烤箱，然后准备趁着烤蛋糕的时间先把配餐的饮品做好\n\n小花田习惯性的踮起脚尖，却是用魔法打开了上方的餐橱取出一只有金色花纹的白瓷茶杯和配套的调羹，然后来到了橱窗下的另一边，看向那两排特殊的调料盒\n\n这可是全世界最奢侈的调料了呢\n\n双手一齐用力打开了其中一个盒子，里面放着的是满满的像黑色水宝宝一样的小球，其中隐隐闪烁着细密的黄色和紫色的光点，即便是用身为小人的花田作为参考，这些小球也只有篮球大小——但这里的每一个小球，都是一个完整的宇宙\n\n没错，大小永远都是相对的，没有人规定，身为巨娘小女仆的小花田，不能同时是可以轻松踩碎小人宇宙的巨娘，对于小花田来说，这已经是相当理所当然的事了\n\n花田小手一挥，大量的宇宙顺着引导飞进了茶杯中，大概填满了四份之三个杯子时才停了下来，随后花田也来到茶杯旁，先是把怀里抱着的用来溶解宇宙壁垒的特制方糖放进茶杯，然后有些费力的把那把调羹从桌子上抱了起来，晃了一个踉跄后才好不容易把调羹高举过头顶再放进茶杯，抽出手抹了把额头上并不存在的香汗，踮起脚来用双手环抱着调羹搅拌了起来，宇宙的壁垒在微不可闻的\"噗\"的轻响中被白色的陶瓷巨柱瞬间击碎，然后溶解于流出的宇宙源质之中\n\n为了让宇宙源质的口感变得更好，花田继续匀速搅动着杯子里略显粘稠的黑色液体，手里的动作也因渐入佳境变得惬意起来，甚至于半眯起了眼睛，哼起了欢快的小调\n\n但是，对于宇宙中的小人来说，又是怎么一副光景呢？\n\n首先要明确的是，在巨大到几乎跨越次元的体型差下，小微生物们是绝无观测到伟大的小花田的，他们所能观测到的极限，也就不过是厚重的宇宙壁垒被一个数亿倍光速移动的白色世界瞬间撞碎，随后势不可挡地闯入宇宙之中蛮横的进行着无法描述的高速运动，无论是星云团还是超星云团，在这片白色的世界面前都微小到连灰尘都远远算不上，只要被其撞上便瞬间破灭，绝大多数生灵甚至到死都不知道宇宙发生了什么，而那些幸运地未被直接卷入的文明在用尽全部的科技成果进行探测后所能得到的，也只能得出上下无限延展的荒谬结果，毕竟有谁能够想到，这毁灭宇宙的夸张天灾，竟然只是一位小人用点力便能使用的普通调羹呢？又有谁能想到，他们的宇宙在别人眼中，只是稍微稀有一点的饮料？\n\n借着魔力的辅助，花田将调羹抬高了不少，看着闪烁着点点光华的宇宙源质的变得顺滑了许多，便满意的点了点头，然后将调羹轻轻放了回去，但即便只是这种再轻不过的动作，又是兆亿个星系在宇宙中彻底熄灭，或是像垃圾一样附在了调羹之上，连成为巨娘食物的荣耀都未达到便先一步毁灭
  gts_huatian.1021.desc: "Today the morning sun is just right, a good day for baking cakes\n\nThe morning sun shines lazily through the kitchen lattice window on the tidy stove, and also on a small figure busy on the table.\n\nThat is a cute tiny person only slightly larger than half a palm. Translucent over-knee white stockings, shiny little leather shoes on feet, a standard black and white maid outfit, and further up is aqua blue long hair obediently lying on the shoulders. A pair of eyes clear as sapphires flashing with the light unique to industrious children - it is none other than the little maid of the Kurohane family, Huatian Liuye, Little Huatian.\n\nToday is a very special day. The breakfast to be prepared for the master is a delicious cake. But since it is for the master, naturally it won't be an ordinary cake. For this, Huatian got up early to prepare the batter and put it in the oven, then preparing to make the accompanying drink while the cake bakes.\n\nLittle Huatian accustomed to tiptoeing, but used magic to open the cupboard above, took out a white porcelain teacup with golden patterns and a matching spoon, then came to the other side under the cupboard window, looking at the two rows of special seasoning boxes.\n\nThis is the most luxurious seasoning in the world.\n\nHands working together to open one of the boxes, inside are full of small balls like black water babies, faintly flickering with fine yellow and purple light spots. Even using the tiny person Huatian as a reference, these small balls are only the size of basketballs - but every small ball here is a complete universe.\n\nThat's right, size is always relative. No one stipulated that the giantess little maid Little Huatian cannot simultaneously be a giantess who can easily crush the tiny universe. For Little Huatian, this is already a quite natural thing.\n\nHuatian waved her small hand, and a large number of universes flew into the teacup following the guide, stopping only when about three-quarters of the cup was filled. Then Huatian also came to the teacup, first putting the special sugar cubes held in her arms for dissolving the universe barriers into the teacup, then struggling to pick up that spoon from the table. After staggering, she finally held the spoon high above her head and put it into the teacup, pulled out a hand to wipe the nonexistent fragrant sweat on her forehead, tiptoed and hugged the spoon with both hands to stir. The barriers of the universes were instantly shattered by the white ceramic giant pillar amidst the inaudible light sound of \"pu\", then dissolved in the flowing universe source essence.\n\nTo make the texture of the universe source essence better, Huatian continued to stir the slightly sticky black liquid in the cup at a constant speed, and the movements in her hands became comfortable as she got better at it, even half-narrowing her eyes and humming a cheerful tune.\n\nBut, for the tiny people in the universe, what kind of scene is it?\n\nFirst of all, what needs to be clear is that under the size difference huge enough to almost cross dimensions, it is absolutely impossible for tiny microorganisms to observe the great Little Huatian. The limit of what they can observe is just the thick universe barrier being instantly shattered by a white world moving at hundreds of millions of times the speed of light, then uncontrollably breaking into the universe and barbarically performing indescribable high-speed movements. Whether it is a nebula cluster or a super nebula cluster, in front of this white world, they are so tiny that they are far from being dust. As long as they are hit, they are instantly destroyed. Most living beings don't even know what happened to the universe until they die. And those lucky civilizations that were not directly involved can only get the absurd result of infinite extension up and down after using all scientific achievements for detection. After all, who could have thought that this exaggerated natural disaster destroying the universe is just an ordinary spoon used by a tiny person with a little force? Who could have thought that their universe is just a slightly rare drink in the eyes of others?\n\nWith the help of magic, Huatian raised the spoon a lot, seeing the universe source essence flickering with dots of brilliance becoming much smoother, she nodded with satisfaction, then gently put the spoon back. But even with such a light movement, trillions of galaxies were completely extinguished in the universe, or attached to the spoon like garbage, destroyed one step ahead without even achieving the honor of becoming giantess food"
  # 女仆小花田的日常
  gts_huatian.1022.name: "Daily Life of Maid Little Huatian"
  # 这边的饮料刚刚准备完，那边的烤箱也恰当好处地\"叮\"地响了一声，而后烤箱门自动打开，盛着蛋糕胚的烤盘随之弹了出来，又有两只看起来就很高级的机械臂从烤箱右侧伸了出来，花田则不慌不忙地踩着优雅的猫步后退一个身位，用魔法从餐橱中拉出一只冰纹玉盘放到身前，正好接住送过来的蛋糕，然后又熟练地身体微微后仰后撤一步，一边从背后的架子上拾起一个看上去没什么特别的玻璃罐，一边为另一只机械臂让出空间，让其上的裱花机为蛋糕涂上奶油\n\n有人或许会觉得，小花田倾注着满满对主人的爱的蛋糕为什么会直接用机器来涂奶油，咱只能说，看了前面的宇宙特调，难道您还觉得这普普通通的奶油会是蛋糕的重点吗，而且，以小花田的身高，要是真让她亲自来完成这次要环节的话，可是要费上不少时间，还未必能做的这样完美，所以，作为三星女仆，花田自然会选择最优的方案\n\n那么，这块蛋糕的真正灵魂，自然就是小人的微型城市，巨娘的特供糖霜\n\n花田手中的玻璃罐装着的不是别的，正是各种颜色的万分之一大小的小人建筑，里面还有着相当数量的小人，这种糖霜其实有着显著的缺点，那就是很难给小人们伪造出正常生活的环境，以致于九成九的小人都在漫长的监禁之中精神崩溃，像没有灵智的低等动物一样缩在自己那一隅小小的房间里，或者像生锈的发条人偶一样在屋顶和墙面间的崎岖缝隙中漫无目的地走着，但好在，不管这些可怜虫多么没有精气神，他们的灵魂依旧可口，是合格的小零食\n\n而且其实这些小人的精神状态还有另外的好处，那就是即便是善良的小花田，也很难对他们生出半分怜悯之心，而只是将他们当做单纯的佐料，甚至如果不是因为主人喜欢，小花田甚至不想把这些家伙当做佐料，如果说其他类型的超微小小人有幸从容器里逃生，花田大概会当做没看到，最多脱下鞋子用丝足逗弄一番，然后便会留他半分希望，任其自生自灭，但若是这个瓶子里的小人出逃，花田也只会无比嫌恶的一脚将其踩死，之后还要好好刷一遍鞋子，以免这种乐色脏了可爱女仆的脚——不过当然，上述两种假设都未曾发生过，灰尘都不如的小人怎么可能在花田的管理下逃出来呢\n\n于是，花田直接拧开了盖子，然后飞到蛋糕上方，将这些小人建筑均匀地铺满蛋糕的表面，只在中间留下一块硬币大小的空白，在下落的期间，难免会有小人从屋子里被甩飞出来，和那些原本就在外面的小人一起跌进奶油的海洋中，七成被直接淹没，剩下三成则要么呆呆地仰视着如同女神般耸立于天穹之外的小花田，要么继续麻木而又漫无目的地在白色的奶油沼泽中蹒跚而行，直至死亡\n\n既然已经有了\"糖霜\"，那么接下来就应该添一点\"果酱\"了\n\n花田向着打开的盒子小手一招，一枚的圆润可爱的小宇宙便飞到了她的手中，与之前不同，这一次花田用的是最简单直接的方式，葱白的玉指在宇宙表面稍稍用力敲了几下，那近十万光年厚的宇宙壁垒便十分脆弱的生出了连纹，再被花田的两只白皙小手轻轻一扒便扩大成裂纹，可怜的微生物穷尽万年亿年都无法突破分毫的屏障，却再一个柔弱小女孩的手中不堪一击，若是被那些高等文明知道这真相，恐怕会直接选择自杀，或者立刻转信花田神教吧，不过伟大的花田女神已经先一步帮他们找好了出路，贴心的加注上保护魔法后，将宇宙源质倒在蛋糕最中心，又用薄片向外分出十字花图案，在阳光的照射下，到真有些像晶莹剔透的深色蓝莓果酱\n\n
  gts_huatian.1022.desc: "Oven dinged... cake came out... mechanical arms... Huatian brought plate... added tiny city sugar frosting... 99% tiny people went mad... sprinkled on cake... added small universe jam..."
  # 女仆小花田的日常
  gts_huatian.1023.name: "Daily Life of Maid Little Huatian"
  # 这样看上去就有模有样了，小花田满意的点了点头，正常的蛋糕到这里就该结束了，不过这次的特制蛋糕还有着最后也最重要的一步，只是到了这一步，花田第一次有些犹豫了，但她还是向着另一边走去，只是动作不自觉地慢了少许\n\n路上顺便把承装宇宙的盒子合上，把曾经装有小人的玻璃罐放回原处，在一排调料盒后面，有着一个显得有些格格不入的饰品盒，里面装着的是一颗被护盾魔法保护着的，无比普通又异常特别的星球——花田的母星，§Y地球§!\n\n小心翼翼的用魔法将只有三亿分之一的§Y地球§!托了起来，然后抱在怀中往回走去，看着那些渺小而又熟悉的大陆板块和城市的痕迹，花田的内心多少有些复杂：曾几何时，她也只是其中的一位普通女孩，而如今却要亲手将故乡毁灭，将无数曾经有着共同爱好一起扯皮的群友和敬仰的前辈们送进主人的嘴中，毕竟当时谁都不可能猜到，一帮每天yy的群友里竟然混进去一个真的\n\n尽管身份和力量已经完全不同，花田对§Y地球§!还是有着很深的归宿感的，对于接下来对于八十多亿人的屠杀也绝不像对其他小人那样毫无感觉，而是怀有愧疚之心的，但在与黑羽相处的一年里，她深深的喜欢上了这位强大但又对她十分温柔的巨娘，因此在成为黑羽女仆的一周年纪念日的今天，再三纠结之后，她终究还是选择用上§Y地球§!来表达自己的爱——这是小花田所能想到的最好的方法\n\n当然，作为主宰者的小花田的心理活动，比起§Y地球§!上的小小人类的反应，自然是完全可以忽略不计的程度了\n\n虚假的天空、日月和星辰在一瞬间崩坏，取而代之的是粗糙模糊的黑色或白色的山脉般巨大的纤维构成的天幕，或是温润如玉的肉色天空，其上的每一条纹路都比喜马拉雅山脉更加宽阔、比马里亚纳海沟更加深邃，只有亚洲部分区域的幸运儿，可以透过稀薄的云层窥见花田女神完美的面容，以及她那因为务必遥远的距离而显出无尽蔑视的居高临下的蓝色眼睛\n\n人类社会一下子炸开了锅，但并不完全是恐惧，更多的是不解和困惑，一个个国家天文台的电话被打爆，那些无法觐见花田面容的人们还在猜测新的天空是什么，各种世界末日和天灾的新闻几秒后被再次冲上热搜，但也有不少人认为这只不过是新型投影，有一位少年认出了这就是自己一生的信仰，人生中第一次虔诚的跪拜下来\n\n但无论是那种反应，即便是有人向花田发动攻击，也不可能对她要做的事产生一丝一毫地改变\n\n托护盾的福，花田可以直接将§Y地球§!放在地上，魔力变为刀刃将§Y地球§!切成四块，然后铺在宇宙源质周围，再把护盾魔法撤掉，让地核炽热的铁溴流被温凉的奶油和冰凉的宇宙源质瞬间冷却\n\n但在人类视角中，事情却远远不是这么简单，虽然各种护盾，§Y地球§!的落地也带来了人类历史上最大的地震，无数建筑化为废墟，也让原本能看到花田面庞的亚洲只能看到花田的白丝小皮鞋，但还不待人们反应过来，认清天灾真的到来，便是一座宽数千公里，长数百万公里的灰银色山脉从天而降，以人类文明无法测量的恐怖速度，摧枯拉朽的击碎大地，激起数千米高的尘暴，瞬间将整个§Y地球§!切成两半，紧接着又是一阵天翻地覆，银灰色的死神再次落下，又一次将大地分割，而后四片§Y地球§!碎片飘飞起来，周围变成一片茫茫的白色，空气中泛起香甜的气息，却无法给任何人以安慰
  gts_huatian.1023.desc: "Huatian satisfied... special cake... added Earth... felt guilty but did it for master... Earth destroyed... cut into four pieces... placed on cake..."
  # 女仆小花田的日常
  gts_huatian.1024.name: "Daily Life of Maid Little Huatian"
  # \n\n自始至终，人类不要说是反抗，就连理解都完全做不到，太阳系唯一育有生命的美丽兴趣在与小女仆花田的战斗中连一秒都没能撑住，而其上终于在一篇废墟中醒悟过来，被恐惧、茫然和绝望完全占据头脑的微生物，就更不配，也没必要被更多提及了，他们只需要知道，他们的同胞和文明的牺牲是有价值的，他们为这枚承载着三重大小的蛋糕臻至完美，而他们也终于可以仰望天空，去看看灭世女仆那完全取代了天空的人畜无害的可爱笑颜，或许还能够向她发起复仇，如果他们在经历了这超出常理的\"人祸\"后还能生起反抗之心的话\n\n结果，也并没有什么奇怪的感觉嘛\n\n看着放在往常巧克力位置的§Y地球§!，花田的脸上露出了满足的笑容，原先的犹豫纠结在餐刀落下的瞬间就完全被主人的笑脸所取代，心情也随之愉悦了起来，脸上重新挂满了微笑，欢快的小调化作滚滚巨雷压碎小人们心中最后稻草\n\n那么现在万事俱备，就只差主人了，花田捏碎了专为送餐而设置的传送符文，把自己连同蛋糕和饮品一起传送到了餐桌上，用小小的身体把纯粹装饰用的餐巾摆好，等待着主人的到来\n\n嗒 嗒 嗒\n\n不多时便传来了轻盈的脚步声，迎面走来的睡眼惺忪的灰毛红眸小萝莉便是小花田的主人千本黑羽\n\n\"早啊花田，今天也辛苦你了\"\n\n坐下身子，黑羽用食指轻轻揉了揉小花田的脑袋，向她道了早安，对方也十分高兴的蹭着她的指肚，兴奋地道了一声\"主人早安\"\n\n说完黑羽也不再客气，端起花田准备的宇宙特调一饮而尽，无数超星云团撞碎在几十倍大的味蕾上，用亿万万的文明为敏感的少女带来无论多少次都不会厌倦的按摩般的细小刺激，伴着冰凉爽口的宇宙源质，比任何咖啡都来得更加提神\n\n而也正在这时，黑羽也突然发现了蛋糕的用料似乎有些问题\n\n\"花田，你这放的是，§Y地球§!？\"\n\n\"嗯嗯，今天是小花田给主人当女仆的一周年，所以我想给主人准备一份特殊的早餐，里面还有小花田对主人满满的爱哦\"\n\n\"这样啊\"黑羽心中一暖，不觉莞尔，\"那我可要好好尝尝了\"\n\n切下一块蛋糕放入嘴中细细咀嚼，虽然对于超宇宙级巨娘黑羽来说，蛋糕的味道并没有什么特别的，但小花田的心意却是最好的增味剂，让她也有些想把藏在心里的话说出来，但现在还不是时候，所以她还是先忍住了，面带笑容地向花田比了个大拇指\n\n\"味道很棒哦，谢谢花田啦\"\n\n\"好耶！\"\n\n花田高兴地几乎快要跳起来，但身为女仆的职业素养让她还是忍住了，只是任谁都能看出她的兴奋，黑羽自然也不例外\n\n趁着花田在一旁傻乐，黑羽又切了一小块蛋糕，然后从§Y地球§!上把花田的祖国挖了过来，递到了花田嘴边，微生物宇宙中的微生物文明还在一无所知的按照原本的轨道运行，万分之一的小人依旧麻木的等待着死亡，§Y地球§!上花田曾经的同胞们则试图在最后进行丑陋无用的挣扎，而这本就有些抽象的组合，正被一个\"普通\"大小的小萝莉投喂给半个巴掌大的小人，小小一间屋子竟同时有着五重大小，倒也算是相当的奇观\n\n\"来，啊——\"\n\n黑羽的声音十分温柔，花田的脸一下子变得有些红，但还是乖巧的张开嘴，将那块蛋糕吃下，其余的一切——无论是文明还是生灵——都随之被少女的香舌揉碎，顺着少女的香唾滑下，只余下一大一小一主一仆那虽未点破，却几乎要拉丝的眼神\n\n
  gts_huatian.1024.desc: "Humanity couldn't resist... Earth destroyed... Huatian smiled... cake made of Earth... fed to master..."
  # 异世花田与小人城市
  gts_huatian.1030.name: "Alternate HuaTian and a 'Tiny' City"
  # 我们必须要感谢，我们伟大的天体级巨娘小花田为§Y[Root.GetName]§!的科研做出的卓越贡献。虽然这位巨娘科学官依旧十分害羞地拒绝了我们关于研究她身体的提案，但她借助她过去文明的遗产为§Y[Root.GetName]§!创造出了名为“玻璃窗”的技术，并帮助我们看到了她在其他平行世界的可能性，以丰富我们的巨娘研究学资料库，下面便是众多资料之一\n\n……\n……\n\n“唔，这里就是小家伙们的城市嘛，还真的是一点都看不清呢。原来前辈们眼中的世界是这样的嘛”\n\n百万分之一的小人城市城市旁，身高一米五六，或者说一千五百六十公里的花田蹲下身子，有些好奇地看着面前勉强有一张A4纸大小的小人城市。借助仪器，花田可以看到这座被自己巨大阴影完全笼罩的城市中那些如同灰尘般渺小的生命，正发了疯似的向着与自己身体相反的方向逃窜。只不过以他们的体型，就算让他们几分钟，又能够逃走多远呢\n\n“只要把这里碾碎掉就可以了吧”回想了一下前辈的话，花田用温柔的声音为这座城市宣判了死刑。“那么，小家伙们，小花田来帮你们解脱吧。”\n\n可爱的小脚从小皮鞋中抽出来，还冒着腾腾的热气，氤氲在城市上空，行成了新的云雾。而白色棉袜包裹的小脚本身则像是一座浮空的大陆一般击碎了原有的虚假天空，带着无穷的压迫感悬在城市的上空\n\n花田自然是刻意没有踩下去的，还故意扭了扭脚趾，引起一阵有如雷鸣的爆响。混着些许皮革气味的浓烈足臭也随之溢满整座城市，将下面变成闷热滂臭的人间炼狱。逃跑中的小家伙们在呼吸的过程中便顿时感觉头晕目眩，想要停下干呕出来，却又在头顶的威胁之下不敢放松半步，进而吸引更多无限接近于毒气的足臭\n\n“三，二，一，拜拜～”\n\n可爱的倒数三声，花田有些调皮的向下面的各位挥了挥手，然后“轻轻”地把小脚落下\n\n轰——\n\n震天的巨响和大地的震颤同时出现，凝聚这几代人智慧的高楼大厦在与花田棉袜接触的瞬间便立刻土崩瓦解，甚至没有能力穿过棉袜纤维间的孔隙，去给花田细嫩的脚心带来一点刺激。而其中奔走的小人就更不不说了，在近千米粗的白色纤维巨龙前，只能破碎成肉泥，变成白袜上微不足道的小红点。只有少数不走运的“幸运儿”躲在棉袜纤维的空洞间涩涩发抖，但他们很快就会发现，自己的鼻腔被浓烈的足臭强硬的灌入，周围也是蒸笼般的闷热，只能在这个纯白的地狱中慢慢口吐白沫，求死不能\n\n仅仅只是一脚，花田就将小半个城区夷为平地，其他未被直接踩到的城市也在冲击之下变成了废墟，但花田本人却只能在心里吐槽一声“这不是没什么感觉嘛”，然后有些无趣的用脚在城市上划拉几下，将那些看上去还好一些的地方再破坏一圈。自始至终，这座城市所能做的唯一反抗，也不过是弄脏这位女孩的白袜罢了\n\n“唔，好像还有小家伙活着？”\n花田扫了一眼脚下的废墟，看着其中完整或是残疾的人们的挣扎，最后还是决定——把那些幸存者多一些的废墟收罗一下，轻轻铺在自己的鞋子里，然后把脚放了回去，任他们在棉袜的缝隙间其中自生自灭\n\n“好啦，任务完成，该回去和前辈们继续玩了～”
  gts_huatian.1030.desc: "We must thank our great celestial giantess, Tiny HuaTian, for her outstanding contributions to §Y[Root.GetName]§!'s research. Although this giantess science officer is still shyly refusing our proposal to study her body, she used her past civilization's legacy to create a technology called 'Looking Glass' for §Y[Root.GetName]§!, and helped us see the possibilities of her in other parallel universes to enrich our giantess research database. The one below is just one of the many entries.\n\n...\n...\n\n'Oh, so this is that what the little ones call a city. It's so difficult to see. So, this is how the world looks from those前辈's eyes.'\n\nNext to a city of millionth-scale people, HuaTian, who is one and a half meters tall, or 1,560 kilometers if you prefer, squats down and looks curiously at the tiny people in front of her, whose city is barely the size of an A4 piece of paper. With the help of instruments, HuaTian can see those dust-like life forms in this city completely covered by her huge shadow, running madly in the opposite direction of her body. However, considering their size, how far can they run even if you give them a few minutes?\n\n'Crushing it should do should solve this,' HuaTian said with a gentle voice as she passed a death sentence on this city. 'Well, little ones, HuaTian has come to help you get liberated already.'"
