  gts_huatian.1030.a: "Close record"
  # 星河之间，花田之旁
  gts_huatian.1031.name: "Among the Stars, Beside HuaTian"
  # 我们必须要感谢，我们伟大的天体级巨娘小花田为§Y[Root.GetName]§!的科研做出的卓越贡献。虽然这位巨娘科学官依旧十分害羞地拒绝了我们关于研究她身体的提案，但她借助她过去文明的遗产为§Y[Root.GetName]§!创造出了名为“玻璃窗”的技术，并帮助我们看到了她在其他平行世界的可能性，以丰富我们的巨娘研究学资料库，下面便是众多资料之一\n\n……\n……\n\n璀璨的宇宙之中，无数星云团本该按着自己的轨迹按照自己的轨迹杂乱而有序地运行，千百年如一日。然而，从很久前开始，这片星域的的星云就已经不能依照自己的意愿来行动，它们的一切，都只能遵从于我们伟大的女神，花田柳叶\n\n在距离上次沉睡不知过了多久之后，花田终于从睡梦中醒来，伸手轻轻揉了揉眼睛，并不在乎自己这个轻微的动作让周围的星空陷入了怎样的动荡，有多少文明连同他们的星系一同撞碎在她衣袖的一根纤维上，又有多少星系在小手挥摆下偏离轨道，甚至撞在一起，引起一阵阵不起眼的爆炸。她只是想揉揉眼睛，仅此而已\n\n事实上，如果愿意的话，花田其实是可以看到那些小家伙的惨状的，但是她在好久之前，就已经不在乎这种事情了\n\n“＊＊？”\n\n花田张了张嘴，却最终也想不起来自己想要喊谁，只能讪讪地重新闭了嘴，无意识地含住几个不走运的星系。香津滴落，无数的恒星在瞬间被一位小女孩的一滴唾液熄灭，固态的行星则是连被唾液完全覆盖的过程都被跳过，之间化作烂泥融化在香津之中。健康的粉舌上同样是星辰的地狱，每一枚舌苔都有着数倍恒星系的大小，几个幸存文明的飞艇围在舌苔周围探索，却怎么得不到绝望之外的第二套参数\n\n花田还记得，很久很久之前，有一位喜欢管她叫主人的温柔前辈获得了向奇迹许愿的特权，在与她交谈之后，许下了让她成为这个世界的女神的愿望，而这个愿望也的确被实现了\n\n花田仰起头，有些无神的双眼努力想要聚焦在一个小小的，发着浅紫色光芒的星系上。柔顺的长发携着其中万千星云一同飘舞，一如那已经有些虚幻的回忆\n\n她记得，当时一阵光华包裹住全身，她的身体登时开始飞快的变大，自己的母星，还有仰视着自己的那位前辈，在十五秒后变成为她鼻尖的碎渣，那颗养育万物的太阳也仅仅多坚持了十秒，就熄灭在了她的白袜之下。但愿望并没有接住，她身高的单位很快变成了光年，紧接着便突破了银河系的束缚，直到超星云团在她面前也微如沙砾，才终于停了下来\n\n她成为了女神，举手投足间天地变色，但她也同时成为了宇宙中最孤独的生灵\n\n第一个半月，她终于从悲痛和迷茫中走了出来，想要适应自己巨大的体型\n第二个半月，她试着去探索宇宙的边境，沿途用那些星系玩耍，细细的感受星辰破碎的微弱刺激，甚至用无数星系红着脸完成了自己的初次自慰，是她最快乐的时光\n再往后，花田便渐渐感觉有些腻了，在一个又一个半月之后，彻底提不起半分兴致。毕竟又怎么有人真的会在意那种，一不小心就会吸进鼻子，甚至在鼻毛上便被撞碎溶解的存在\n\n这次，该干些什么呢？\n\n花田控制着手上的引力，轻轻伸出食指，引得无数小小的光点飘过来，汇集在自己的指尖，然后将手指放到眼前，看着恒星在自己冰凉的指腹上融化。将魔力汇聚在眼上，看着一个个星球上低等或高等的文明一视同仁地因变成肉色的宇宙底色惊慌逃窜，将自己文明最强大的武器发疯似的倾泄而出，却连自己的手指都无法够到。看着那些小小的星球在引力的牵引下飞快的“下沉”，像见到偶像地狂热粉丝一样，前赴后继地带着身上的亿万生灵一起在自己的指腹上撞碎，然后被细嫩的皮肤吸收，化作自己微不足道的保养品\n\n很长时间以来，看着这样的光景发呆，就是花田最常用来打发时间的方法。但果然，这种方法，还是太无聊了些
  gts_huatian.1031.desc: "We have to thank our great celestial giantess Tiny HuaTian for her outstanding contributions to §Y[Root.GetName]§!'s research. Although this giantess science officer still shyly refuses our proposal to study her body, she has used her past civilization's legacy to create a technology called 'Looking Glass' for §Y[Root.GetName]§!, and helped us see the possibilities of her in other parallel universes to enrich our database of giantess research. Below is one of many records.\n\n...\n...\n\nIn the brilliant universe, countless nebulae should have been operating in a disorderly and orderly manner, according to their own trajectories, day after day, year after year. However, a little while ago, the nebulae in this area could no longer act according to their own wishes, and all they could do was obey our great goddess, HuaTian Willowleaf.\n\nAfter sleeping for an unknown amount of time since her last sleep, HuaTian has finally woken up from her dreams, and reached out and lightly rubbed her eyes, not minding how her slight movement has plunged the surrounding starry sky into turmoil, how many civilizations and their galaxies have even been crushed on a fiber of her sleeve, and how many galaxies have been deviated under by a swing of her hand and even collided with each other, causing a series of unremarkable explosions. She just wanted to rub her eyes, and that was it.\n\nIn fact, if she wanted to, HuaTian could have saw the misery of those ones, but she stopped caring about these things a long time ago.\n\n'＊＊ ?'\n\nHuaTian opened her mouth, but eventually didn't remember who she wanted to call, so she dejectedly closed her mouth, and unconsciously held a few unlucky galaxies in her mouth. The aroma of flavor dripped, and countless suns were extinguished in one drop of a young girl's saliva in an instant, and the solid planets even skipped the process of being completely covered by saliva and turned into sludge and melted in the aroma of flavor. The healthy pink tongue is also hell in the night. Each tongue fur is several times the size of a solar system, and several airships of surviving civilizations are exploring around the tongue burrs, but they can't get other than despair parameters.\n\nHuaTian remembered that a long, long time ago, one of her favorite predecessors with a gentle smile who called her Master was granted the privilege to wish for a miracle. After talking with her, she made a wish to make her a goddess in this world, and this wish was indeed granted.\n\nHuaTian raised her head, and her dazed eyes tried hard to focus on a small galaxy with light purple light. Her soft long hair flew with thousands of nebulae, just as the memories that had already become a little illusory.\n\nShe recalled being wrapped in a burst of light at the time. Her body began to grow rapidly. Her mother planet, and the predecessor who was looking up to her, became fragments of the tip of her nose after fifteen seconds. The sun that nurtured all things only persisted for ten seconds before it went out beneath her white socks. But the wish didn't take hold. The unit of her height soon became light-years, then broke through the shackles of the Milky Way until the supercloud group was as small as gravel in front of her. She finally stopped.\n\nShe has became a goddess, and everything changes in the moment, and she has also become the loneliest creature in the universe.\n\nIn the first two weeks, she finally came out of the grief and confusion and wanted to accept get and getting used to her huge size.\n\nDuring the second half of the month, she tried to explore the borders of the universe, to toy with those star systems along the way, to feel the subtle stimulation of stars shattering, and even blushed with countless star systems to completed her first masturbation, which was her happiest time.\n\nLater on, HuaTian gradually felt a little greasy, and after the half-month-month-months, she would lose any interest. After all, how anyone can really care about something that they might accidentally suck into their nose, or even be shattered and dissolved on the hair of nose thing.\n\nWhat should do this time?\n\nHuaTian controlled the gravity in her hand, gently stretched out her index finger, attracting countless small spots of light to fly over to gather at her fingertips, then placed her finger in front of her eyes, watching the suns melting on her cold fingertips. Focusing her magic on her eyes, she watched the civilizations, low-level or high-level on the stars, panic to escape under the face of the universe in the alike meat color, frantically pouring out the most powerful weapons of her civilization, but even they could not reach her fingers. Watching the little stars that was be accelerated,'sunken' accelerated faster under the traction of gravity, like fans and followers with fervor, with billions of it's on the finger to become a trivial part of the skincare."
