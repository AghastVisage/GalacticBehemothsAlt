  # 一批批对少女来说只有灰尘般大小的运输船与工程船正往返于小花田领袖的娇躯之上,完成着一系列设施的建设.
  situation_huatian_positive_approach: "Batches of transport ships and construction ships, which are only dust-like in size to the maiden, are shuttling back and forth on Leader HuaTian's delicate body, completing a series of facility constructions."
  # 加大支援
  situation_huatian_positive_2: "Increase Support"
  # 我们几乎按照对待巨构工程般的热情对待着少女的躯体.无论是帝国中最前沿的建设技术还是技艺最为高超的巨娘工程师们此刻都聚集在了小花田身体上的各个粉嫩褶皱之间,指导着我们的工作.
  situation_huatian_positive_2_approach: "We are treating the maiden's body with almost the same enthusiasm as for megastructure construction. The Empire's most cutting-edge construction technology and the most skilled giantess engineers are now gathered among the pink folds of HuaTian's body, guiding our work."
