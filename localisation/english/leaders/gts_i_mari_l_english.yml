l_english:
  # 特殊接触
  gts_mari_anomaly: "Special Contact"
  # 在一次正常的勘测活动中，你们的先遣队伍注意到了当地存在一个特殊的个体，她因为有着类人的外貌和兽耳显得额外显眼，但真正引起兴趣的，是那名少女过于巨大的身躯以及能用肉眼观察到的光环状物体
  gts_mari_anomaly_desc: "During a routine survey mission, your advance team noted the presence of a unique individual in the area. Her humanoid appearance and animal-like ears made her stand out, but what truly piqued interest was her enormous stature and a halo visible to the naked eye."
  # 特殊接触
  gts_mari.2.name: "Special Contact"
  # 小队继续传回的信息来看，这名特殊的个体似乎有着较强的生理耐受性，不仅表现出了强大的力量，在面对致命武器时表现出异常的抗性，我们的科学家至今仍未理解背后的原理，或许可以将这一个体回收后进行研究
  gts_mari.2.desc: "Information continues to filter in from the team, indicating that this unique individual possesses remarkable physiological resilience. She exhibits incredible strength and shows unusual resistance to lethal weapons. Our scientists have yet to comprehend the underlying principle, but perhaps we could recover this individual for further study."
  # 批准近距离观测行动
  gts_mari.2.a: "Approve Close Observation"
  # 冲突
  gts_mari.3.name: "Conflict"
  # 在寻找该个体的过程中，你了解到当地的土著正在试图针对这一个体进行围剿行为，即便是对方并未做出什么出格之举，那过于可怕的体型也已然成为他们眼中之钉
  gts_mari.3.desc: "In your efforts to locate the individual, you discover that the local natives are attempting to hunt her down. Though she has done nothing out of line, her formidable size alone has made her a target in their eyes."
  # 静观其变
  gts_mari.3.a: "Observe and Wait"
  # 冲突
  gts_mari.4.name: "Conflict"
  # 你很难将这一幕定性为战争，那特殊的个体明明在个体力量上已经呈现出碾压的优势，在面对攻击时却并未采取任何反击措施。就如先前获得的情报那般，武器作用在她身上过后并未造成严重的伤害，这一反常现象的背后或许是某种尚未理解的力量在保护着她\n\n但转接的视频信号来看，这一个体有些眼熟......
  gts_mari.4.desc: "It's difficult to categorize this as a war. The unique individual clearly outmatches them in power, yet she refrains from retaliating against the attacks. As previous intel suggested, weapons leave minimal damage on her, pointing to an uncomprehended force shielding her...\n\nStrangely, she looks familiar in the intercepted video feed..."
  # 立即介入！
  gts_mari.4.a: "Intervene Immediately!"
  # 冲突
  gts_mari.5.name: "Conflict"
  # 你们的小队迅速解决了战争，对个体的回收并未遭遇什么困难，虽说她仍表现出高度的警惕性，但在你尝试着接通通讯过后便选择了配合
  gts_mari.5.desc: "Your team swiftly dismantled the conflict, recovering the individual with little trouble. Although she remained wary, she cooperated once communication was established."
  # 所以为什么会有学生？？？
  gts_mari.5.a: "Why are there students???"
  # 圣三一
  NAME_gts_mari_system: "Holy Trinity"
  # 伊洛玛丽
  NAME_gts_mari: "Ilomari"
  # 从另一个世界到来的修女，正在为了和平与你而祈祷
  DESC_gts_mari: "A nun from another world, praying for peace with you."
  # 今后请多多关照，老师
  gts_mari_catch_phrase: "Please take care of me, Teacher."
  # 伊洛玛丽
  gts_mari.6.name: "Ilomari"
  # 所有的相遇都是命中注定……\n\n虽然好像不太一样，但今后也请您多多关照，老师。玛丽会努力协助您的！
  gts_mari.6.desc: "Every encounter is destined...\n\nThough it may seem different, please take care of me in the future, Teacher. Mary will do her best to assist you!"
  # 关于你自己
  gts_mari.6.a: "Tell me about yourself"
  # 嗯......谢谢您的关心，虽然还是有点不太习惯，但只要能够在您的身边就会感到安心不少呢......呵呵，这也算是命中注定的相遇，对吧？
  gts_mari.6.a.response: "Hmm... Thank you for your concern. Although it's still a bit unfamiliar for me, just being by your side brings comfort... Hehe, isn't this meeting predestined?"
  # 关于体型
  gts_mari.6.b: "About your size"
  # 确实吓到了，大家居然都变得这么小......诶？是我太大了么？啊哈哈，一时间没有反应过来呢。您吃过饭了么？要不要一，一起？
  gts_mari.6.b.response: "Indeed, I was startled. Everyone seems so tiny... Eh? Is it me who's too big? Ahaha, it didn't sink in right away. Have you eaten? Would you like to join me?"
  # 关于基沃托斯
  gts_mari.6.c: "About Kivotos"
  # 说起来也不知道大家现在怎么样了呢，可能圣三一的大家都会担心的吧？所以......更近一些吧？让我们一起为基沃托斯的大家祈祷，也是为您的未来而祈祷......呀啊！！请，请您不要在意刚刚那句！！！
  gts_mari.6.c.response: "Speaking of which, I wonder how everyone is doing now. Perhaps everyone at Holy Trinity is worried? So... let's get closer? Let's pray together for everyone in Kivotos and for your future... Ah!! Please, please, don't mind that last part!!!"
  # 关于战争
  gts_mari.6.d: "About war"
  # 如果可以，还真是想避免啊，但玛丽也清楚这个世界并不像基沃托斯那般美好......没关系的，如果是必要的，我也会为您献上自己的力量
  gts_mari.6.d.response: "If possible, I'd really like to avoid it, but Mary understands this world isn't as pleasant as Kivotos... It's okay, if necessary, I will offer my strength for you."
  # 向玛丽提供服务
  gts_mari.6.e: "Offer Mary your services"
  # 诶？？？让，让您为我服务吗？这......哈啊，请宽恕我\n在做什么？因为让您为我服务的话，这么幸福过头了，担心会遭到天谴呢
  gts_mari.6.e.response: "Eh??? You want to serve me? That's... oh, forgive me for asking\nWhat's going on? If you serve me, I'd be overwhelmingly happy, afraid of heavenly retribution."
  # 关于神秘
  gts_mari.6.f: "About the mysterious"
  # 抱歉，这个我也不是很清楚，不过只要是您需要的话，玛丽会尽可能配合大家的研究！
  gts_mari.6.f.response: "Sorry, I'm not quite sure, but if you need it, Mary will cooperate as much as possible with everyone's research!"
  # §Y伊洛玛丽§!作为一名§H领袖§!加入了我们的帝国。
  gts_mari.6.hire_custom_tooltip: "§YIlomari§! has joined our empire as a §Hleader§!."
  # 神圣护佑
  gts_trait_leader_mari_a: "Divine Protection"
  # 
  gts_trait_leader_mari_a_desc: """"
  # 净化洗礼
  gts_trait_leader_mari_b: "Purification Baptism"
  # 
  gts_trait_leader_mari_b_desc: """"
  # 毅然的思念
  gts_trait_leader_mari_c: "Resolute Yearning"
  # 
  gts_trait_leader_mari_c_desc: """"
  # 慈爱之心
  gts_trait_leader_mari_d: "Kindheartedness"
  # 
  gts_trait_leader_mari_d_desc: """"
  # 运动中的小插曲
  gts_mari.100.name: "A Workout Incident"
  # 这位修女的到来对于人们而言已经不再是什么特别的事情，但对其隐私的保护仍是一件有待解决的问题。就在今天早上，正在进行锻炼的玛丽小姐并未关好门，以至于有几名偷窥者伺机潜入其中，甚至一人趁着她进行拉伸时攀上了足底，似乎在做什么非礼的事情
  gts_mari.100.desc: "The arrival of the nun is no longer a special event for the populace. However, protecting her privacy remains an unresolved issue. This morning, while Mary was exercising, she inadvertently left the door ajar, allowing a few peepers to sneak inside. One even climbed onto her sole during her stretches, seemingly engaging in inappropriate behavior."
  # 必须严肃处理，找出这几个家伙
  gts_mari.100.a: "Handle this seriously, find those culprits"
  # 无需担忧，让玛丽小姐自行处理吧
  gts_mari.100.b: "No need to worry, let Mary handle it herself"
  # 我寻思下次我也能进去看看？
  gts_mari.100.c: "Maybe I could sneak a peek next time?"
  # 运动中的小插曲
  gts_mari.110.name: "A Workout Incident"
  # 虽说玛丽小姐仍在为那几名犯人求情，但为了杜绝类似的事件发生，必须严惩这些胡作非为之人！
  gts_mari.110.desc: "Though Mary pleads for the perpetrators, to prevent similar incidents, harsh penalties must be imposed on these mischief-makers!"
  # 让他们好好反省啊
  gts_mari.110.a: "Make them reflect well!"
  # 运动中的小插曲
  gts_mari.120.name: "A Workout Incident"
  # 事实证明，担心是多余的，即便是现如今她的体型已经足矣像踩死虫子那样轻松杀死成年男性，但她仍未对几名冒犯了她的偷窥者做什么，甚至在一定程度上，玛丽似乎对于脚下那微妙的触感感到了一瞬的惊慌与不安，随后下意识地抖落过后才意识到原来刚刚在足底爬行的竟是一名男性\n\n“诶......您没有受伤吧？抱歉，我不知道是......”\n\n说着，少女的面容已经染上了几分红润，这一幕被内置的监控设备分享到所有人设备上，毫不意外的，她的举动为她应得了大量的信仰与爱戴，说实话，即便是你也多少对这位修女生出些好感与多余的情感
  gts_mari.120.desc: "It turns out the worry was unnecessary. Even though her size is now sufficient to squish adult men like insects, she did nothing to the voyeurs who insulted her. In fact, Mary seemed momentarily alarmed by the peculiar sensation beneath her foot and only realized it was a man crawling under her sole after instinctively shaking him off.\n\n'Eh... Are you not hurt? Sorry, I didn't know it was...'\n\nBlushing, the girl's words were shared with everyone via the surveillance equipment, unsurprisingly earning her adoration and affection. Honestly, even you couldn't help but develop a fondness and an unnecessary attachment for this nun."
  # 可惜咯
  gts_mari.120.a: "What a pity"
  # 运动中的小插曲
  gts_mari.130.name: "A Workout Incident"
  # 当你真正走近那位少女时，你便理解那几名偷窥者为何要冒着被踩死的风险接近这名少女。与平日里通过设备进行沟通不同的，那直观的体型差距所带来的力量感以一种如此优雅可爱的姿态展示在你的面前，即便是对方明明可以随时夺走你的性命也无法唤回自身的理性\n\n好在，玛丽先注意到了你的存在，她向你走来，随后蹲下身露出一抹温柔的笑，几乎一瞬便将方才生于你心中的所有不安摧毁，化作另一种微妙的情感肆意生长\n\n“诶？是有什么事情吗？”
  gts_mari.130.desc: "When you get close to her, you understand why those voyeurs would risk being squished to approach her. Unlike interacting through devices, the intuitive sense of power demonstrates itself in a cute and graceful manner. Mary noticed you first, approaching with a gentle smile. Her presence instantly wipes away your previous discomfort, nurturing another subtle emotion.\n\n'Eh? Is something wrong?'"
  # “我......”
  gts_mari.130.a: "'I...'"
  # 约会......?
  gts_mari.131.name: "A Date...?"
  # 面对你的提议，她似乎有些不安，以至于那总是轻松抖动的耳朵在此时有些不自然地紧绷，只是当你试探地说还是算了时，少女猛地将你抓在了手中紧紧不愿放开，随后才像是注意到了自己的失态那般发出一声可爱的悲鸣过后将你放回了地上\n\n“那就明天吧......？”\n\n玛丽努力撇开了脸，只是她那发红发烫的耳朵仍将少女的小心思向你展露无遗，见你迟迟没有回复，她小心地挪过脸来看向了你。似乎带着几分期待
  gts_mari.131.desc: "Seeing your suggestion, she shows a bit of unease, with her usually perky ears stiffening unnaturally, but when you suggest dropping it, she quickly grabs you, unwilling to release you. Only after realizing her gaffe did she emit a cute cry of distress and set you back down.\n\n'Then tomorrow...?' \n\nMary averts her face, her reddened ears revealing her buried thoughts. Noticing you hadn't replied promptly, she cautiously peeked at you again, seemingly expectant."
  # 不要
  gts_mari.131.a: "No way"
  # 约会......?
  gts_mari.132.name: "A Date...?"
  # 听到你的话语，少女显得有些恍惚，她稍张开口不敢相信地转过头来注视着你，像是想要从你脸上找出些开玩笑的迹象那般，但当她看清你脸上的笑容时又将已经到喉中的哽咽咽了回去，换做几分娇嗔宣泄着不满\n“不要明天，就今天，现在”\n像是回应你的恶作剧，少女将你从地面上再一次捏起，下一刻便将你握在掌心之中用那温暖的双手阻断了你与外界的最后一丝联系\n“哼......作为您坏心眼的惩罚，就老老实实做完祈祷再走吧”\n当然，你没有告诉玛丽，即便如此，你都能听见那副身躯之中，少女有力、雀跃的心跳声\n......来到某处，这里的一切在一定程度上来说更加适合玛丽的体型，看着那漫步于草地之中，偶尔低下头来看向你的少女，许久未有的松弛感夹带着几分倦意袭向了你\n“......？”\n回过神时，那已经习惯了的晃动却在不知何时消失了，就连身下的触感也从少女掌心的温润变作了带着土腥和草味的紧实，你下意识想要坐起身来寻找那名少女，却在下一瞬被一股不可能反抗的力量摁倒在了地面上\n“呵呵，这是对老师在约会中睡着的小小惩罚哦？”\n少女的话语让你的戒备顿时消散，她缓缓抬起了指尖，还你一片明媚的天空与那占据了你绝大多数视野的，少女的笑颜\n“嘘......闭上眼哦？接下来发生的事情，可以保密吗？”\n没有等你反应过来，玛丽便已经将你从草地中拾起，浑然不顾你身上还夹带着些许污渍，那温柔的吻便已经取代了你对外界的感知......
  gts_mari.132.desc: "Listening to your words, she seems spaced out, her mouth ajar in disbelief, scanning your expressions for signs of jest. However, seeing your softened face, she swallows her words, replacing them with endearing reproach.\n'Today, not tomorrow.'\nResponding to your prank, she plucks you up again, abruptly cutting all other senses around you.\n'Hmph... As a punishment for your mischief, remain silent until the ritual is over.'\nYou didn't need to tell Mary that despite everything, you could still hear her excited and rhythmic heart flutters.\n...... Arriving at a place perfectly suited for Mary's size, watching her tread through the grass and occasionally glance at you, you feel a relaxation you haven't felt in a while, mingled with slight drowsiness.\n'...?'\nSnapping back, you feel the accustomed swaying halted, and beneath you, where Mary's palm cushioned you, now replaced by the earthy solidity. Before you can seek Mary, a force presses you to the ground, impossible to resist.\n'Hehe, this is a small punishment for dozing off during our date, Teacher?'\nHer words swiftly ease your vigilance. Mary slowly lifted her finger, revealing the bright sky and her captivating smile consuming most of your field of view.\n'Shh... Close your eyes? What happens next, can we keep it a secret?'\nBefore you could react, she lifts you from the grass, ignoring any dirt clinging to you. Her gentle kiss replaced any sense of the external world..."
  # 可喜可贺
  gts_mari.132.a: "Congratulations"
  # 研究瓶颈
  gts_mari.200.name: "Research Bottleneck"
  # 对神秘的研究已经进入瓶颈，即便玛丽努力的配合科学家们的研究和实验，但这一难以理解的力量仍不受你们的控制，从目前片面的数据来看，科学家们也只能得出这种名为“神秘”的力量绝不只是保护一名普通少女能够抗下致命攻击这么简单
  gts_mari.200.desc: "Study on the mysterious force has plateaued. Despite Mary's cooperation with the research and experiments, the incomprehensible force eludes control. Current data suggests that the 'mystery' offers more than just protection against lethal attacks."
  # 进行一些刺激
  gts_mari.200.a: "Apply some stimulation"
  # 放缓实验研究的进度，一切以玛丽的人身安全为重！
  gts_mari.200.b: "Slow the research pace, prioritize Mary's safety!"
  # 研究瓶颈
  gts_mari.210.name: "Research Bottleneck"
  # 在某次实验刺激过后，玛丽的情绪出现了一定波动，同时生理指标在短时间内上升至正常水平的■■倍，即便是喊停了实验，但仍造成了重大的实验事故……名为玛丽的少女竟是在昏迷期间，体型增大到了恐怖的程度\n\n虽然采取了紧急措施，但这一事故仍导致了实验室周边严重的伤亡——迅速增长的体型轻易将实验室的墙面挤压摧毁，少女柔软的身躯此刻却成为了高效的杀戮武器将其巨大化过程中遇到的一切碾入身下变作废墟当中的一员。与地面直接接触的臀部与足底已然成为一片地狱，而导致了这一切的少女仍有些恍惚的模样\n\n周围的居民都注意到了那导致震感的来源……不如说，在这种被袜足笼罩头顶的情况下，想要忽视那位少女的存在反而是一种奢求吧？
  gts_mari.210.desc: "Following a stimulation experiment, Mary exhibited certain emotional fluctuations, with physiological indicators soaring to several times above normal baseline level. Despite halting the experiment, a severe incident occurred... Mary's body enlarged to a terrifying extent while unconscious.\n\nMeasures were taken immediately, but the accident inflicted serious casualties around the laboratory. Her rapidly growing body effortlessly collapsed the lab walls, becoming an efficient tool of destruction against all it encountered. The areas in direct contact with her body turned into chaos. Lamentably, the girl responsible continued dazed.\n\nNearby residents noticed the tremor's source... In fact, under her sock-covered feet, ignoring her is a luxury you can no longer afford."
  # 祈祷......
  gts_mari.210.a: "Pray..."
  # 研究瓶颈
  gts_mari.220.name: "Research Bottleneck"
  # 研究本身就是存在一定客观规律，既然目前的科技水平未能揭开玛丽身上的面纱，那么静观其变也未尝不是一种解决思路，毕竟那位少女身上所发生的奇迹不论哪一条对于这个宇宙而言都是足矣打破常理的......不过，玛丽是不是越来越大了
  gts_mari.220.desc: "Research inherently follows certain objective laws. With current technology unable to unveil the mystery surrounding Mary, patience might offer another solution. After all, the miracles surrounding her are enough to defy common sense in this universe... but, is Mary getting larger?"
  # 欲知后事如何，且听下回分解
  gts_mari.220.a: "To know what happens next, wait for the story to unfold"
