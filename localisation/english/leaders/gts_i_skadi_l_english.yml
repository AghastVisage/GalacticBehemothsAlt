  # 天体级扶她性欲处理
  gts_skadi_colossus.003.name: "Celestial Futanari Handling of Lust"
  # 在得到允许之后，这名巨娘揭晓了自己的身份，她是一名天体级的扶她巨娘，而她所谓的计划，则是用自己独特的武器来歼灭星球上的反抗...\n\n扶她巨娘已经在外太空巨大化到了5亿倍体型，现在§Y[event_target:gtsra_random_planet_resist.GetName]§!对她来说只有健身球的大小。丝毫不在意星球上虫豸的目光，扶她巨娘脱下了自己的短裙，已然兴奋地勃起全长超过8千万米的的肉棒展现出来。海量血液不断地通过表面半径超过万米的血管搏动到肉棒，使得充血的肉棒变得炽热通红。星球外围的舰队和星球上的防空火力迅速对出现的威胁展开猛烈攻击，大大小小的爆炸在扶她的龟头上产生，其威力能使恒星爆发使卫星粉碎，但却只能给予扶她一丝丝刺激，从铃口中分泌出更多先走汁。\n\n「哼哼，这就是你们这些杂鱼最强的火力了吗？」虽然在嘴上嘲笑着，但扶她目睹文明无力的反抗后感到兴奋起来，轻易地将§Y[event_target:gtsra_random_planet_resist.GetName]§!上的大陆连同其上的城市与数以亿计的居民挖起，如同垃圾般粗暴地涂抹在包皮上，开始上下摩擦自己的肉棒。舰队或是被卷入这场天体级的自慰中，或是只能在风暴的远处目睹自己的母星结局。\n\n随着扶她的喘息愈加强烈，手上的动作愈加迅速，她终于在消耗了[event_target:gtsra_random_planet_resist.GetName]上一半的居民后迎来了高潮。庞大到无法计量的乳白色精液从铃口中释放而出，如同最为致命的炮弹向[event_target:gtsra_random_planet_resist.GetName]袭去。精液在接触到地表时发出了震耳欲聋的响声，与其接触的一切都在一瞬之间消失了，而精液的势能实在太过于强烈，甚至直接贯穿了整颗星球，直接在另一半球穿向太空。但由于星球的重力，这些精液块很快就变成体积庞大的陨石砸向地表。没有生命能在这场浩劫中幸存，曾经繁荣的星球如今只剩下肆虐的精液海啸...
  gts_skadi_colossus.003.desc: "After being granted permission, this giantess revealed her identity. She is a celestial-level futanari giantess, and her so-called plan was to use her unique weapon to destroy the resistance on the planet...\n\nThe futanari giantess has already grown to 500 million times her original size in space. Now, §Y[event_target:gtsra_random_planet_resist.GetName]§! is only the size of a fitness ball to her. Completely ignoring the gaze of the insects on the planet, the futanari giantess took off her short skirt, and her already aroused meat rod, more than 80 million meters long, was revealed. Massive amounts of blood were continuously pumped through the blood vessels whose surface radius exceeded thousands of meters, making the engorged meat rod hot and red. The surrounding fleet and the anti-aircraft fire on the planet rapidly launched a fierce attack on the appeared threat. Explosions of varying magnitudes occurred on the futanari's glans. Their power was enough to make stars explode and satellites shatter, but could only give the futanari a slight stimulation, causing more pre-cum to secrete from her head.\n\n'Hmph, is this the strongest firepower of you trash?' Although she mocked them verbally, the futanari was excited after witnessing the fruitless resistance from the civilization. She easily dug out the continent along with the cities and hundreds of millions of inhabitants and roughly rubbed them on the skin of her foreskin. She then started moving her meat rod up and down. The fleet was either caught in this celestial-level masturbation or could only watch the ending of their home planet from the edges of the cosmic storm.\n\nAs the futanari's breathing became more intense, her movements became more and more rapid, and she finally achieved her orgasm after consuming half of the  [event_target:gtsra_random_planet_resist.GetName]'s population. An immeasurably large amount of milky-white semen was released from the glans, attacking §Y[event_target:gtsra_random_planet_resist.GetName]§! like a most lethal cannonball. When the semen made contact with the surface of the planet, it made a deafening boom. Everything that came into contact with it disappeared in an instant. The semen's momentum was too strong, it even pierced straight through the entire planet from the opposite hemisphere out into space. Due to the planet's gravity, these semen chunks soon turned into huge meteors that crashed onto the surface. No life survived this catastrophe. The once prosperous planet is now only left with a raging semen tsunami..."
  # 可怕
  gts_skadi_colossus.003.a: "Terrifying."
  # 精液海
