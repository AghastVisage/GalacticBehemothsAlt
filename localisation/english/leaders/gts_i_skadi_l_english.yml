  # 斯卡蒂登基大典
  gts_skadi_shroud.3324.tile: "Skadi's Coronation Ceremony"
  # §H今天是斯卡蒂的欢庆日，她与虚境灾厄的鏖战成为我们帝国能击败天灾的关键。她的功绩将被世人铭记，将被世代咏颂。如今，没有任何人会质疑斯卡蒂对我们帝国的真诚与忠心，那些有关斯卡蒂妖魔化的故事也全都不攻自破。\n\n有了斯卡蒂的指引，我们帝国将无惧任何存在，与世长存。\n\n国民的欢呼，信徒的歌颂，烟火的巨响...似乎都无法引起斯卡蒂的关注，她还在等待着那个人的到来...
  gts_skadi_shroud.3324.desc: "§HToday is the day of celebration for Skadi becoming our ruler. Her battles against the Shroud disaster have become the key for our empire to defeat the cataclysm. Her achievements will be remembered by the world and sung for generations. Now, no one would question Skadi's sincerity and loyalty to our empire. All the stories of Skadi being demonized have also completely fallen apart.\n\nWith Skadi's guidance, our empire will fear nothing and will last forever.\n\nThe cheers of the people, the praises of the devotees, the roar of fireworks... none of that seems to capture Skadi's attention. She's still waiting for that person to come..."
  # 新身份的感觉如何
  gts_skadi_shroud.3324.a: "How does it feel to have a new identity?"
  # §B无论高贵如鹓鸾，还是低贱如蝼蚁...\n\n只要能陪伴在你身边，斯卡蒂就再无他求...
  gts_skadi_shroud.3324.a.response: "§BWhether they are as noble as a mandarin duck or as lowly as an ant...\n\nAs long as I am by your side, Skadi has no other desires..."
  # 你出色地证明了你的力量
  gts_skadi_shroud.3324.b: "You have brilliantly demonstrated your power."
  # §B我不是一个空壳与幻象，那些与你度过的时光是斯卡蒂最珍贵的宝物，让我一点点蜕变成了现在的模样...\n\n博士...今后如果需要动用我的力量，也请随时呼唤我吧...
  gts_skadi_shroud.3324.b.response: "§BI am not an empty shell or an illusion. The time I spent with you is Skadi's most precious treasure, which has gradually transformed me into what I am today... \n\nDoctor... if you need to use my power in the future, please call on me at any time..."
  # 你说的海洋，究竟是什么地方
  gts_skadi_shroud.3324.c: "What exactly is the ocean that you're speaking of?"
  # §B那是你我曾经的故乡，一片再也无法抵达的海洋...\n\n不过这些已经不再重要了，眼下这片新世界才是值得我们关注的...
  gts_skadi_shroud.3324.c.response: "§BThat was the home of you and I, an ocean that can never be reached again...\n\nHowever, these are no longer important. The new world before us is what is worthy of our attention..."
  # 你好可爱,我喜欢你
  gts_skadi_shroud.3324.d: "You're so cute, I like you."
  # §B你的夸奖我一直铭记在心，现在我终于能回应这份善意...\n\n谢谢你，博士§!
  gts_skadi_shroud.3324.d.response: "§BI always keep your compliments in mind. Now, I can finally respond to this kindness...\n\nThank you, Doctor!§!"
  # 虚境的情况怎么样了
  gts_skadi_shroud.3324.e: "How is the situation in the Shroud?"
  # §B海洋已经达到了前所未有的宁静祥和，只是当地的原住民可能需要一些时间和努力来试着那些孩子们共存罢了...§!
  gts_skadi_shroud.3324.e.response: "§BThe ocean has reached an unprecedented peace. It's just that the natives may need some time and effort to try to coexist with those children...§!"
  # 今后也请多多指教
  gts_skadi_shroud.3324.f: "I look forward to your guidance in the future as well."
  # 让斯卡蒂成为我们统治者的按钮
  gts_skadi_shroud.3324.h: "A button for good measure."
