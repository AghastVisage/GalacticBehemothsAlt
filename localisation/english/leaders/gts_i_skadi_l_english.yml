  # 一名来自虚境的灵能实体§B海嗣§!入侵了我们现实宇宙，我们的舰船与她庞大的身躯相形见绌。\n\n在观察一会眼前的小小的舰船后，她似乎将其当做了她的玩物，不怀好意地将我们的舰船拍扁捏碎，我们的人员随同舰船在爆炸和火焰中消逝了...\n\n在欣赏完自己所创造的杰作，这位愉悦的存在将目光转向了我们的恒星基地。
  gts_skadi_shroud.0005.desc: "A psionic entity from the Shroud, a §BSea-being§!, has invaded our material universe. Our ships pale in comparison to her enormous body.\n\nAfter observing the small ships before her for a while, she seemed to have taken them as her toys, maliciously flattening and crushing our ships. Our personnel perished along with the ships in explosions and flames...\n\nAfter admiring her creations, this joyful presence turned her gaze to our starbase."
