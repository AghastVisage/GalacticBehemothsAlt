  # 伊莎玛拉建立的灵能网络将我们领袖们的心灵连接在了一起，这虽然让领袖的工作效率大幅提高，但他们的内心也完全暴露在伊莎玛拉面前。\n\n§H[event_target:victim_leader.GetName]§!似乎无法承受这样的压力，在居所留下一道灵能裂缝后，彻底失踪了...\n\n§B可悲可悲，如此渺小，你们能在里面找到她的可能性很低...§!\n\n搜救队肯定了伊莎玛拉的说法，在无边无垠的中筒靴鞋垫上搜寻之后，在队伍遭遇地震被壮观的足垢山脉掩埋之后，在与其他被关进靴子的巨娘文明战斗之后，剩余不到半数的搜寻队也没能找到§H[event_target:victim_leader.GetName]§!的踪影。\n\n§B啊啦啊啦...这另外一只靴子你们打算放弃寻找了吗...我倒是挺期望的呢...§!
  gts_skadi_shroud.0003.desc: "The psionic network established by Ishar-mla has linked the minds of our leaders together. While this has greatly improved the efficiency of the leaders' work, their hearts are also completely exposed to Ishar-mla. \n\nIt seems §H[event_target:victim_leader.GetName]§! could not withstand this pressure. After leaving behind a psionic crack in their residence, they have completely disappeared...\n\n§BHow pitiful, how pitiful. You are so small. The chances of finding her in there are low...§!\n\nThe search party confirmed Ishar-mla's claim. After searching on the endless insole of a mid-calf boot, after encountering an earthquake and being buried by the spectacular foot-dirt mountains, after fighting with other giantess civilizations imprisoned in boots, less than half of the remaining search party failed to find any trace of §H[event_target:victim_leader.GetName]§!.\n\n§BAra ara... Are you planning to give up searching for the other boot? I have high expectations for that one...§!"
  # 我等皆要死于妇人之手矣
  gts_skadi_shroud.0003.a: "We are all going to die at the hands of a woman"
