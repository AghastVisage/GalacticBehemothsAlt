l_english:
  # §B孤门
  site_skadi_potral: "§BIsolated Gate"
  # 一个奇怪的激活的传送门,我们可以派遣科学家前去调查\n\n§H警告:这可能是个陷阱§!
  site_skadi_potral.desc: "A strange, activated portal. We can send scientists to investigate.\n\n§HWarning: This might be a trap.§!"
  # 诡异的传送门
  gts_skadi_potral.01.name: "Strange Portal"
  # 我们境内一颗星球上出现了一个来历不明的巨大传送门装置。据调查,传送门能容纳数只舰队同时通过,科学家们提议派出调查队前往传送门后的世界进行调查,以弄清楚这个传送门的来历和建造者。
  gts_skadi_potral.01.desc: "A huge, unidentified portal device has appeared on one of our planets. Investigations indicate that the portal can accommodate multiple fleets passing through simultaneously. Scientists propose sending an investigation team to explore the world beyond the portal to determine its origin and builders."
  # 破碎石碑
  psionics_stone_monuments: "Shattered Stele"
  # 这块石碑上的灵能增强了我们的科研。
  psionics_stone_monuments_desc: "The psionic energy from this stele enhances our research."
  # 最后的抵抗
  final_city_resist: "The Final Stand"
  # 另一个世界的人类面对天灾的抵抗鼓舞了我们。
  final_city_resist_desc: "The resistance of humans in another world facing a cataclysm inspires us."
  # 斯卡蒂劳改中
  skadi_penalty: "Skadi's Forced Labor"
  # 斯卡蒂被发配到海洋星球，其工作方式就是用嘴巴像一张巨大的渔网将一片海域的所有鱼群纳入囊中，当然这些鱼一条都不允许吞咽。这种捕食方式极大地促进了当地的捕鱼业产出。
  skadi_penalty_desc: "Skadi has been assigned to a marine planet. Her method of work involves using her mouth like a giant fishing net to scoop up all the fish in an area, though she is not allowed to swallow any of them. This method of fishing greatly boosts local fishing production."
  # 苍茫世界
  gts_skadi_potral.02.name: "Vast and Barren World"
  # 调查团队顺利穿过了传送门,来到了一片白茫茫的大地上,这在我们文明所记载的一切资料上找不到相似的记载，大家都在为发现新世界而欢呼，着手建设营地开始探索。这里的大气弥漫着浓郁的花香味，令人感到舒畅、惬意。这股花香来自这个世界随处可见的白色矿石，这些矿石似乎是这个世界上唯一存在的物质，科学家对其进行了分析，惊奇地发现其成分大部分是蛋白质，但其坚硬程度甚至与舰船装甲不相上下。\n\n就在调查过程中,这片大地突然开始毫无预兆地出现强烈地震，我们的调查团队紧急通过传送门返回，传送门则在舰队穿过后自行关闭了。由于传送门的关闭，科学家只能失望地得出结论:那是一片由白色荒野和虚空组成的平面世界。虽然令人感到惋惜，但这段时间开采的白色矿石经过加工可以在建设上派上用场。
  gts_skadi_potral.02.desc: "The investigation team successfully passed through the portal, arriving on a vast white land. No similar environment can be found in all the records of our civilization. Everyone cheered at the discovery of a new world and began building a camp to explore. The atmosphere here is filled with an intense floral fragrance that is soothing and pleasant. This fragrance comes from the white minerals that are ubiquitous in this world. These minerals seem to be the only substance in this world. Scientists have analyzed them and were amazed to discover that the majority of their composition is protein, yet their hardness rivals even the armor of our starships.\n\nDuring the investigation, the land suddenly began to experience intense earthquakes without warning. Our investigation team urgently returned through the portal, which closed itself after the fleet passed through. Due to the closure of the portal, scientists could only conclude with disappointment: that it was a flat world made of white wilderness and void. Though regrettable, the white minerals we mined during that time can be processed for use in construction."
  # 令人好奇,等待下次传送门开启
  gts_skadi_potral.02a: "Intriguing, let us wait for the next portal opening."
  # 破损石碑
  gts_skadi_potral.03.name: "Damaged Stele"
  # 传送门再次开启，我们的调查团队这次降落到了一片海岸上。海岸上最引人注目的是一块破损的石碑，似乎是感应到了调查团队的存在，石碑上开始浮现一些影像:\n\n\n\n一位 maiden携带着一把等身长大剑向海洋深处走去......\n一位 maiden坐在礁石上,弹奏着手中的竖琴，天空开始变得阴沉......\n一位 maiden轻声吟唱着,一群诡异的鱼类生物围绕在其身旁......\n一位 maiden向陆地走去,巨大的身躯将不到她脚踝高度的灯塔所撞毁......\n一位 maiden顶着炮火向前面行进着,毫无留情地将脚下的军队碾碎......\n\n\n\n这些影像的主角都毫无疑问是同一位 maiden,为了弄清这位 maiden的身份和这些影像所代表的意义,我们的调查团队马上将这些影像拍摄送往首都研究。与此同时,石碑仍在不断播放着更多影像......
  gts_skadi_potral.03.desc: "The portal opened again. This time our investigation team landed on a coastline. The most striking feature of the coast is a damaged stele. As if sensing the presence of the investigation team, images began to appear on the stele:\n\n\n\nA girl carrying a life-sized greatsword walked toward the depths of the ocean...\nA girl sat on a reef, playing a harp, and the sky began to turn dark...\nA girl whispered a chant, and a group of strange fish-like creatures surrounded her...\nA girl walked towards the land, her massive body smashing a lighthouse that barely came up to her ankles...\nA girl marched forward under fire, mercilessly crushing the army under her feet...\n\n\n\nThe main subject of these images is undoubtedly the same girl. To understand the girl's identity and the meaning of these images, our investigation team immediately sent the footage to the capital for research. Meanwhile, the stele continues to play more images..."
  # 有什么不得了的事情要发生了
  gts_skadi_potral.03a: "Something extraordinary is about to happen."
  # 天灾
  gts_skadi_potral.04.name: "Cataclysm"
  # 天空一片昏暗，暴雨不住地敲打着地面，但人们机械麻木地向前走着，任其雨点打在身上，脸上没有携带任何表情，从远处看，就像是一群缓缓蠕动的蚂蚁。他们的目的地是人类的最后一座城市。\n\n自从名为伊莎玛拉的存在降临，大静谧便迅速开始侵袭吞没整个人类文明。阿戈尔，位于海洋中拥有高端科技技术的城市，第一个被伊莎玛拉所摧毁。伊莎玛拉先是用自己的双腿夹住整个阿戈尔，缓缓地向两腿之间的城市施加压力，代表人类科技结晶的高楼大厦并不能抗住如此重压，连同其中渺小的人类被蹂成了海中的泥沙。确保没有任何幸存者后，伊莎玛拉从伊比利亚的海岸线上登陆了，这个本就破碎的国家在伊莎玛拉巨足的践踏下被碾成齑粉。\n卡西米尔大骑士团与莱塔尼亚金律法卫的联合方阵向这面前的庞然大物发齐猛烈攻击，虽然没能打倒伊莎玛拉，但还是引起了伊莎玛拉的注意。伊莎玛拉缓缓地蹲下身子，这一轻微的动作甚至刮起了飓风将方阵吹的东倒西歪，伸出两根玉指，将方阵周围的城市一起挖了起来，举到自己的面前。张开双唇，露出里面深邃湿润的红色洞穴，这是伊莎玛拉进食的场所，也是他们所有人的葬身之地；血红色的舌尖如同一堵势不可挡的巨墙压过来，则是他们最后看到的景象。皇帝的利刃以生命为代价造就的国度防线成功地将伊莎玛拉抵挡在了乌萨斯的疆土之外，但很快适应了邪魔力量的伊莎玛拉则将整个国度给吸收，本就遮天蔽日的身躯在轰鸣声中成长得愈加巨大。现在，原本需要很长一段时间才能蹂躏完全的乌萨斯的国土面积对于伊莎玛拉来说还不如一张床。\n\n哥伦比亚、萨米、大炎和其他各国的残余军队聚集在了一起，共筑人类最后一道防线，并在一位名为凯尔希的领袖帮助下建成了人类最后的城市。
  gts_skadi_potral.04.desc: "The sky is dim, and heavy rain is incessantly hitting the ground. People mechanically numbly move forward, allowing the raindrops to hit their bodies. Their expressions are devoid of emotion, their forms resembling a group of slowly crawling ants. Their destination is the last city of humanity.\n\nSince the descent of a being called Ishar-mla, the Great Silence has rapidly begun to invade and devour the entire human civilization. Aegir, a city located in the ocean with advanced technology, was the first to be destroyed by Ishar-mla. Ishar-mla first used her legs to crush the entire city, slowly applying pressure to compress the structures squeezed between her thighs. The high-rise buildings that represent the pinnacle of human technological achievement could not withstand such pressure, and they were crumbled into the seabed along with the tiny humans within. After ensuring no survivors, Ishar-mla landed on the coast of Iberia. This already shattered nation was pulverized under Ishar-mla's giant feet. \n\nThe combined forces of the Kazimierz Grand Knight Order and the Laterano Gold Law Guard launched a fierce attack on this behemoth. Though they didn't topple Ishar-mla, they still caught her attention. Ishar-mla slowly squatted, a slight movement creating a hurricane that blew the formation into disarray. She reached out two jade-like fingers and dug up the cities surrounding the formation, lifting them to her face, opened her lips to reveal a dark, moist, red cavern - the place of Ishar-mla's feeding, and the final resting place of them all; the bloody, tongue was like an unstoppable wall pressing down being the last sight they saw. The Emperor's Blade - a defensive line of structures created at great cost, successfully held off Ishar-mla from Usas's land, but Ishar-mla, quickly adapting to demonic power, absorbed the entire nation as her body grew larger in the midst of explosions. The size of the nation, which would have taken her a long time to trample, is now not as large as a bed to her.\n\nColumbia, Sami, Yan, and the remnants of other nations have gathered together to form humanity's last line of defense, and with the help of a leader named Kal'tsit, they built humanity's last city."
  # 令人不安
  gts_skadi_potral.04a: "Disturbing."
  # 最后的抵抗
  gts_skadi_potral.05.name: "The Final Stand"
  # 凯尔希站在高墙上望向绵延至地平线的难民队伍，紧锁的眉头却一直没有松开过。凯尔希知道，以现在伊莎玛拉的体型，不出一日这个世界就不会被她翻个底朝天，这里被发现已经是板上钉钉的事情。\n\n大地开始震动，发出震耳欲聋的轰鸣声，城市内的建筑也开始倒塌，她来了。凯尔希跃下高墙，拉起旁边被叫做\"博士\"的人的手，向中央处的堡垒地底深处走去。§G\"博士......不要为我们所担心，这就是我们的归宿。\"§!凯尔希将博士身上的仪器启动，§G\"Mon3tr和我会保护所有人的，特别是博士你。\"§!源石技艺开始生效，博士感觉自己身上的血在沸腾。一阵强光过后，博士已经无影无踪，只留下一副石棺，和里面的宇宙。§G\"愿你在睡梦中也能保持清醒。\"§!\n外面的情况早已陷入一片混乱，一只血红色的眼睛占领了整片天空，凯尔希刚走出堡垒，血红色的眼睛一下子锁定在了她的身上。凯尔希目光对上了天空上的眼睛，一股巨大的压迫感爬上了她的脊背。§B\"凯尔希，你对博士做了什么，我都看得一清二楚。\"§!声音震天动地，地面上的人们尖叫着，耳朵渗出了鲜血。§G\"在这里得不到你想要的，你这怪物。\"§!凯尔希并不甘愿就地摧垮，她早已做好了舍弃自己近乎永恒的生命准备。§B\"啧，看来你们这些蝼蚁并没有共存的价值，那就这样被抹去把。\"§!血红色的眼睛退去了，取而代之的是，遮天蔽日的粉红肉壁，而后者正在高速地接近地面。\n\n\n\n石碑的画面戛然而止，同时调查团队身后的传送门也突然关闭了。\"天天天啊，你们快看天空！血红色的 -  - 眼睛 -  - \"我们与调查团队的联系被彻底切断了。
  gts_skadi_potral.05.desc: "Kal'tsit stood on the high wall, looking at the lines of refugees stretching to the horizon. The frown on her face never softened. Kal'tsit knows that with Ishar-mla's size now, this world will be turned upside down in a single day, and it is a certainty that they will be discovered.\n\nThe ground started to tremble with a deafening roar, and the buildings within the city began to collapse. She has arrived. Kal'tsit jumped from the high wall, grabbed the hand of the person called 'Doctor' next to her, and walked toward the deepest part of the fortress. §G 'Doctor... Do not worry about us, this is our fate.'§! Kal'tsit activated the device on the doctor's body. §G'Mon3tr and I will protect everyone, especially you, Doctor.'§! Originium Arts took effect, and the Doctor felt their blood boiling. After a flash of light, the doctor has vanished, leaving behind only a stone coffin, and the universe inside it. §G'May you remain clear-minded even in your dreams.'§!\n\nThe situation outside has already descended into chaos. A blood-red eye occupied the entire sky. Kal'tsit had barely stepped out of the fortress when the blood-red eye locked onto her. Kal'tsit stared the eye in the sky. A huge wave of pressure crawled up her spine. §B'Kal'tsit, what have you done to the Doctor? I can see everything.'§! The voice was deafening, and people on the ground screamed, blood oozing from their ears. §G'You won't get what you want here, you monster.'§! Kal'tsit was unwilling to give in. She had already prepared to sacrifice her near-eternal life. §B 'Tsk, it seems that you ants have no value in coexisting. Then you shall be obliterated.'§! The blood-red eye retreated, replaced by a sky-obscuring, pink flesh wall, which was rapidly approaching the ground.\n\n\nThe stele's images abruptly ended, and the portal behind the investigation team suddenly closed. 'Oh my god, look at the sky! That blood-red - eye -' Our communication with the investigation team was completely cut off."
  # 我们必须做好准备
  gts_skadi_potral.05a: "We must prepare."
  # 悲歌
  gts_skadi_potral.06.name: "Dirge"
  # 传送门再次毫无预兆地打开了，和以往不同的是，这次传送门传出了来自另一边的具有一定节律的......歌曲？我们无法破译这首歌曲的歌词，但歌声低沉、悠长，听到歌曲的人无不感到忧伤甚至落泪。奇异的石碑，恐怖的影像，忧伤的歌曲......这个传送门的谜团重重，我们下一步究竟该如何行动？
  gts_skadi_potral.06.desc: "The portal opened again without warning. Different from before, this time the portal emitted something rhythmic from the other side...a song? We can't decipher the lyrics of this song, but the singing is deep, long, making those who hear it feel sad, even to tears. A strange stele, terrifying images, and sad songs... the mystery of this portal is full of enigmas. What should we do next?"
  # 准备好舰队,我们必须清除威胁
  gts_skadi_potral.06a: "Prepare the fleet, we must eliminate the threat."
  # 宇宙外 maiden
  gts_skadi_meet.01.name: "Girl from Beyond the Cosmos"
  # 我们的舰队穿过传送门，所看到的正是那名石碑影像中的白发 maiden：具有普通人体型的她正浮在海面上，低声吟唱着无名哀伤的歌曲。 maiden察觉到了我们的到来，歌声戛然而止，她抬起头，\"注视\"着几公里外的高空的旗舰指挥室，或者说......你。§B\"博士......\"§! maiden的表情终于有一丝变化，到目前为止，她没有表现出一丝敌意，同时似乎有什么事情要向我们诉说。
  gts_skadi_meet.01.desc: "Our fleet passed through the portal, and what we saw was the white-haired girl from the stele's images: with a normal human-sized body, she floated on the surface of the sea, softly singing a nameless, sorrowful song. The girl noticed our arrival, and her song ended abruptly. She lifted her head and 'looked' at the flagship command room several kilometers above, or rather... at you. §B'Doctor...'§! The girl's expression finally changed slightly. So far, she has not shown any hostility, and it seems that she has something to tell us."
  # 让我们听听她想说什么
  gts_skadi_meet.01a: "Let's listen to what she wants to say."
  # 宇宙外 maiden
  gts_skadi_meet.02.title: "Girl from Beyond the Cosmos"
  # §B\"博士，我们终于又见面了。自从你离开我逃到这片世界，我就一直在找你，我找了太久，太久了。不过这些都不重要了，不再那么重要了.......\"§! maiden的语句越来越欣快，似乎下一秒她就要扑上来。
  gts_skadi_meet.02.desc: "§B'Doctor, we have finally met again. Since you left me and escaped to this world, I have been searching for you relentlessly. I have been searching for so long, for too long. But none of that matters anymore, it's not so important anymore...'§! The girl's tone became increasingly euphoric, as if she would pounce at any moment."
  # 你是谁
  skadi_answer01: "Who are you?"
  #  maiden的表情变得疑惑起来，§B\"博士，你不记得我了吗？\"§!思考了一会， maiden回答道：§B\"我的名字是斯卡蒂，曾经是你麾下的干员。\"
  skadi_answer01a: "The girl's expression became puzzled. §B 'Doctor, don't you remember me?'§! After thinking for a while, the girl replied: §B'My name is Skadi, a former operative under your command.'§!"
  # 之前的调查团队在哪里
  skadi_answer02: "Where is the previous investigation team?"
  # §B他们已经成为我们的血亲了。托他们的福，我才能以这样的姿态和你对话
  skadi_answer02a: "§BThey have become our kin. Thanks to them, I can speak with you in this form.\"
  # 询问石碑呈现的影像
  skadi_answer03: "Inquire about the images presented by the stele."
  # §B这便是你和我的过去，我接纳了自己，但你却被放逐到了这片世界中。我和我的血亲至今都在进化，尝试着压缩自己的身躯，适应这片世界。但这片世界实在是太过于渺小与脆弱，哪怕是我柔软的头发对你来说也已经是不可逾越的帷幕。这样的模样，我害怕伤害到你。
  skadi_answer03a: "§BThat is your and my past. I have accepted myself, but you were exiled to this world. I and my kin continue to evolve, trying to compress our bodies and adapt to this world. But this world is too small and fragile. Even my soft hair is an insurmountable barrier to you. I fear hurting you in this form.'\"
  # 询问关于凯尔希的下落
  skadi_answer04: "Inquire about Kal'tsit's whereabouts."
  # §B这不重要
  skadi_answer04a: "§BThat's not important.'"
  # 你的目的是
  skadi_answer05: "What is your purpose?"
  # §B我发誓，一定找出方法带你前往海洋，在那里，你才能褪去现在虚伪的外壳，成为你真实的模样。所以我请求你，在那之前，请让现在的我留在你身边把，哪怕只是在远处注视也好......
  skadi_answer05a: "§B I swear, I will find a way to take you to the ocean. There you shall shed your current false shell, and become your true self. So, I beg you, until then, please let me, in my current form, remain by your side, even if only to watch from afar..."
  # 窥探 maiden的想法
  skadi_answer06: "Peer into the girl's thoughts"
  # 虽然这位 maiden的灵能力量强大到能在虚境掀起滔天巨浪，但你还是轻易地读取到了她的想法。她没有说谎，她的想法十分纯粹，甚至让人感到......温驯。
  skadi_answer06a: "Although this girl's psionic power is so strong that she can create colossal waves in the Shroud, you easily read her thoughts. She isn't lying. Her thoughts are pure and, even... docile."
  # 我们可以接纳你，但是
  skadi_answer666: "We can accept you, but..."
  # 邀约
  gts_skadi_potral.07.name: "Invitation"
  # 我们对斯卡蒂进行了全身检查，发现她的生理结构跟我们种族如出一辙，提取到的基因序列有一小部分能和之前失踪的探险队相互吻合.......同时她的细胞活性和分化潜能远超我们，在几次压力试验中都表现出了惊人的适应能力，而且这不是被动的适应，而是主观的选择了展开方向，从某种意义上说，她可以通过自己的意愿重塑自己的形态，无论何种生物技术都不可能做到这一点。\n\n关于斯卡蒂所演奏的歌曲,则能够在物质宇宙和精神宇宙对现实产生影响，如果她效忠于我们的话，在战场上的演奏，可以增强我们的舰队，瓦解敌方的力量。\n\n至于斯卡蒂的本体的规模实在是太过于庞大了,她无论多么轻微的一举一动都会掀起天灾级别的风暴，我们只能让她退出我们的世界。\n\n现在,斯卡蒂静静地待在原处,等待着你的安排。
  gts_skadi_potral.07.desc: "We ran a full body scan on Skadi and discovered that her physiological structure is almost identical to our species. Part of the gene sequence we extracted closely matches that of the missing exploration team... At the same time, her cell activity and differentiation potential are far beyond ours. During several stress tests, she demonstrated amazing adaptability. Moreover, it's not passive adaptation but active selection of adaptation direction. In a sense, she can reshape her form according to her own will - no biological technology can do that.\n\nAs for the song Skadi performs, it can affect reality within both the material universe and the astral plane. If she were to serve us, her performance on the battlefield could enhance our fleets and weaken the enemy's forces.\n\nHowever, the sheer size of Skadi's true form is too vast. Even the slightest movements from her can cause disasters of cataclysmic proportions. We must make her withdraw from our world.\n\nNow, Skadi stands quietly, waiting on your instructions."
  # 发配到海军司令部
  gts_skadi_potral.07a: "Assign her to Navy Command."
  # 对她使用缩小激素把
  gts_skadi_potral.07b: "Use shrinking hormones on her."
  # 
  gts_skadi_traits.99.name: """"
  # 根据报告显示，我们帝国境内的一颗殖民地星球上存在着大片废弃已久的城市区划，坍塌的建筑物与占据了大量空间的设施已经为这颗星球上的建设工作带来了不便。因此，我们决定派出一位巨娘以一种简单粗暴的方式解决这个麻烦，回收那些资源，而最适合执行这项任务的人选非斯卡蒂莫属了。\n\n§B这就是......我的目标？真无聊......§!\n\n虎鲸 maiden重重地踏在了小小的城市区划旁边，冷漠地注视着正躺在自己裸足内侧的一小片灰色的城区。考虑到斯卡蒂本体极其庞大的体型，如果让她直接踩在这颗星球上面的话，恐怕整个行星都会在一瞬间之内撞碎在斯卡蒂的趾纹里面。因此，我们已经提前为斯卡蒂注射了少量可逆的缩小激素以调节至适宜的体型。但即便如此，即使只是斯卡蒂的前脚掌也比足以容纳上亿位小人生活的城市区划要宽阔许多。或者说，斯卡蒂的足趾已经足以成为小人们的\"城市区划\"了。\n\n§B只需要踩一脚就好了，对吧？§!\n\n maiden的声音为巨足之下地毯一般的城市下达了判决。山峦一般的脚掌拔地而起，遮天蔽日的足底在斯卡蒂的控制下缓缓地悬在了城市的上空，仅仅只是 maiden的脚掌抬起来时掀起的风浪就已经摧毁了城市边缘的大片街区。高耸入云的玉足裹挟着云层覆盖了城市的天空，被笼罩于斯卡蒂的足底投下的阴影之中的城市已经陷入一片黑暗，或许透过 maiden的趾缝垂下的几缕阳光就已经是斯卡蒂对小小的城市的最大的仁慈了。\n\n§B呼......那就再见了§!\n\n肉色的天空缓慢但坚定地倾轧而下，名为脚掌的巨墙逐渐向着城市碾了下来。曾经繁华的建筑在 maiden脚下的肉壁下几乎毫无抵抗之力，刚刚接触到肌肤的一瞬间就已经被碾成了碎末，只有极少数幸运的建筑物才能得到斯卡蒂的恩赐，侥幸被卡在了斯卡蒂脚掌下方的一道道纹路之中，逃脱了被踩得渣都不剩的命运。紧接着，在几乎几毫秒之后，斯卡蒂的足底就已经完全贴合了破碎的大地，脚掌与地面之间的缝隙在 maiden的重压下消失，这片城市区划如我们计划的那样成为了斯卡蒂脚下的一片灰尘。只不过，尽管城市中的场景如此绝望，但对于斯卡蒂来说，从她抬起脚掌到完全踩下去之后，小小的城市甚至就连一丝一毫的刺激都没能带给她。\n\n§B完成了？那就算了。我本来还想等缩小激素的时效过去之后把这颗星球毁掉呢......§!\n\n尽管斯卡蒂最后的这句话语让这颗星球上的其他住民心惊胆战，但在斯卡蒂离去之后留下的大陆级足印里，我们还是成功发现了我们需要的东西。
  gts_skadi_traits.99.desc: "According to reports, there are large areas of abandoned city districts on a colonized planet within our empire. Collapsed buildings and facilities occupying large amounts of space have made construction on this planet difficult. Therefore, we have decided to send a giantess to solve this problem in a simple and brutal manner and reclaim those resources. And the most suitable candidate for this task is none other than Skadi.\n\n§BThis is... my target? How tedious...§!\n\nThe Orca girl stepped heavily beside a small city district, coldly staring at a small patch of gray urban area lying against the inner side of her bare foot. Considering Skadi's enormous true form, if she were to step directly on this planet, the entire planet would probably be crushed into Skadi's footprints in an instant. Therefore, we have pre-injected Skadi with a small amount of reversible shrinking hormones to adjust her to a suitable size. But even so, even just Skadi's forefoot is much larger than a city district that could accommodate hundreds of millions of small people. Or rather, Skadi's toes are already large enough to be 'city districts' for the small people.\n\n§BOnly need one step, right?§!\n\nThe girl's voice sentenced the carpet-like city under her giant foot. A mountain-like foot rose from the ground, and Skadi controlled the sky-obscuring sole to slowly hover above the city. The gust of wind generated by the girl lifting her foot has already destroyed large swathes of the city's outskirts. Her towering jade foot, enshrouded in clouds, covered the sky above the city. The city, shrouded in the shadow cast by Skadi's sole, had plunged into darkness. Perhaps the few rays of light that seeped through the gaps in the girl's toes were the greatest kindness that Skadi could bestow on the small city.\n\n§BHmph... well, goodbye then.§!\n\nThe meat-colored sky slowly but firmly crushed down, and the giant wall called a foot gradually rolled down towards the city. Once prosperous structures offered little resistance under the meat wall of the girl's foot, crushed into dust the instant they made contact with her skin. Only a few lucky buildings were fortunate enough to be spared Skadi's wrath. Snagged in the wrinkles beneath her foot, they escaped being turned into a pile of rubble. Then, scarcely a fraction of a second later, Skadi's sole had completely made contact with the fragmented earth. The gap between her foot and the ground disappeared under the girl's weight. This city district, as we planned, had become dust under Skadi's foot. However, despite the desperate scenes within the city, Skadi felt not even a sliver of stimulation from the moment she lifted her foot to the moment she crushed it entirely.\n\n§BFinished? Oh well. I was planning to destroy this planet once the shrinking hormones' effect wore off...§!\n\nAlthough Skadi's last words caused the other inhabitants of this planet to feel apprehensive, we still successfully found what we needed in the continent-sized footprint Skadi left behind."
  # 在斯卡蒂的足印里提取合金
  gts_skadi_traits.99a: "Extract alloys from Skadi's footprint."
  # 将斯卡蒂趾缝里残留的那些资源提取出来就够了
  gts_skadi_traits.99b: "It's enough to extract the resources left in Skadi's toe crevices."
  # §B清理自己的脚？好...§!
  gts_skadi_traits.99c: "§BClean my foot? Okay...§!"
  # 缩小成功
  gts_skadi_potral.09.name: "Shrinking Successful"
  # 成功了，我们在斯卡蒂的指缝间投放了武器库中的所有缩小激素后，斯卡蒂的细胞受体与之识辨并相结合，诱使自身缩小的同时还不断生产分泌出新的激素作用到周围的细胞。这一瀑布式的联级反应使得斯卡蒂的身躯迅速缩小，剧烈的体型变化甚至引起了坍缩。幸亏斯卡蒂施展了灵能屏障,我们的舰队才能在欣赏到这一奇观的同时没有被压碎。不知过了多久，也不知道这一过程毁灭了多少银河系，我们的星系终于可以容纳斯卡蒂的整个身子了。\n\n如此大体积的巨娘,定能轻易吞噬来犯的舰队,撕裂恒星口牙。我们下一步该如何处置斯卡蒂的本体?
  gts_skadi_potral.09.desc: "Success! After releasing all the shrinking hormones in our armory into Skadi's toes, Skadi's cell receptors recognized and bound to them, which induced self-shrinking while continuously producing and secreting new hormones that acted on the surrounding cells. This cascading reaction caused Skadi's body to shrink rapidly, and the drastic changes in size even caused a collapse. Fortunately, Skadi cast a psionic barrier, so our fleet could observe this spectacle without being crushed. How long it's been, or how many galaxies it destroyed, is unknown, but our galaxy can finally contain Skadi's entire body.\n\nSurely, such a large giantess can easily devour invading fleets and tear apart stars. What should we do with Skadi's true form next?"
  # 继续缩小，然后发配到我床上
  gts_skadi_potral.09a: "Shrink her further and send her to my bed."
  # 天降虎鲸
  gts_skadi_potral.10.name: "Orca Descent"
  # 我们首都[Root.Capital.GetName]上空出现了奇怪的空间扭曲现象，扭曲逐渐增大，变成了一个巨大的传送门，同时来自另一边的什么东西要出现了。\n\n最先出现的是一双脚，但每一只脚掌长度超过2万公里，单单脚背就可以承载我们整个首都！脚的主人是斯卡蒂，拥有我们1亿倍体型大小的巨娘。虽然缩小激素确实能将那些毁天灭地的巨娘变成不及尘埃的存在，但似乎斯卡蒂原先的体型实在太宏伟了，1亿倍大小已经是极限了，现在几乎将整个星球的天空所遮盖的斯卡蒂正直冲冲地向我们首都砸下来。犹如数百颗巨大陨石降落，整个地壳被斯卡蒂直接撞碎，大陆在强烈的冲击下四分五裂飞到了外太空，海洋瞬间蒸发，居民直接在冲击波中化作血沫，行星的核心则发出了垂死前怒吼般的轰鸣声。\n\n斯卡蒂感受到了周围大量生命的消逝，努力稳定住了星球的核心没有造成进一步的破坏，但冲击过后整个星球已经满目疮痍了。
  gts_skadi_potral.10.desc: "A strange spatial distortion phenomenon has appeared over our capital [Root.Capital.GetName]. The distortion gradually grew larger, becoming a giant portal, and something from the other side is about to emerge.\n\nFirst to appear were a pair of feet. Each foot is more than 20,000 kilometers in length, and just the instep alone could support our entire capital! The owner of these feet is Skadi, a giantess with 100 million times our size. Although shrinking hormones can indeed turn world-destroying giantesses into less-than-grain-of-sand entities, it seems that Skadi's original size was too colossal. 100 million times larger is close to the limit. And now Skadi, who almost covers the entire sky of our planet, is falling directly on our capital. Like hundreds of giant meteorites crashing down, the entire crust was shattered by Skadi's impact. The continents were torn apart and flung into space by the intense impact. The ocean evaporated instantly. The inhabitants were directly reduced to blood foam in the shockwave and the planet's core emitted a deathly, furious roar. \n\nSkadi felt the loss of large amounts of life around her and stabilized the core of the planet, preventing further destruction. But, after the impact, the entire planet was already devastated."
  # 对外宣称是星神兽的入侵
  gts_skadi_potral.10a: "Claim it was an invasion by a Star God Beast."
  # 呱，是星神兽，大家快退
  gts_skadi_potral.10b: "Ribbit, it's a Star God Beast, everyone fall back!"
  # §B咯.......\"博士\"就住在这些尘埃里面吗
  gts_skadi_potral.10c: "§BGrunt... 'Doctor' lives in these specks of dust?"
  # 危险实验
  gts_skadi_potral.11.name: "Dangerous Experiment"
  # 缩小激素将人员、城市甚至星球缩小的作用在战争与羞辱巨娘中大放异彩，但现在我们武器库中一大批缩小激素即将自行分解，为了使这些激素派上用场，科学家们提议将这些激素运用到斯卡蒂的本体上，以获取宝贵的科研数据。虽然这个提议犹如极不合理，但是尝试将宇宙级别的巨娘缩小的机会可不多见，我们是否应该尝试一下？
  gts_skadi_potral.11.desc: "The ability of shrinking hormones to shrink personnel, cities and even planets has been a success in war and humiliating giantesses, but now a large batch in our armory is about to decompose. To put these hormones to good use, scientists propose to apply them to Skadi's true form to obtain valuable research data. Although this proposition is exceptionally unreasonable, opportunities to shrink a universe-level giantess are rare, should we try it?"
  # 传唤斯卡蒂
  skadi_portal.11a: "Summon Skadi."
  # 真是疯了
  skadi_portal.11b: "This is insane."
  # 一位熟悉又陌生的访客
  gts_skadi_paragon.01.name: "A Familiar yet Unfamiliar Visitor"
  # §B斯卡蒂§!
  skadi_leader: "§BSkadi§!"
  # 斯卡蒂，一位来自宇宙外的 maiden。这一次，她有足够的力量与自信保护好\"博士\"了。
  skadi_leader_desc: "Skadi, a girl from beyond the cosmos. This time, she has enough power and confidence to protect 'Doctor'."
  # §B空气与陆地......都太干燥。
  skadi_catch_phrase: "§BThe air and land... they're both too dry."
  # §H今天是斯卡蒂被纳入海军部的第二周,她的离群索居和寡言少语导致许多海军部人员对她缺少认识,有关斯卡蒂妖魔化的故事也在海军部流行了起来，当然，这些妖魔化的故事远没有现实可怕。\n\n天灾,这或许是他们对斯卡蒂最贴切的称呼了。\n\n斯卡蒂并不理会这些传闻,她只在意一个人对她的看法。梳理好头发，整理好戎装，做一个深呼吸，斯卡蒂敲开了\"博士\"的办公室。
  gts_skadi_paragon.01.desc: "§HIt's the second week of Skadi's integration into the Navy. Her reclusive and taciturn nature has caused many in the Navy to know little about her. Stories of Skadi becoming demonized have also become popular within the Navy. Of course, these demonized stories are much less terrible than the reality.\n\nCataclysm, perhaps that's the most fitting title for Skadi.\n\nSkadi doesn't care about these rumors. She only cares about one's opinion of her. After combing her hair, adjusting her uniform, and taking a deep breath, Skadi knocks on 'Doctor's' office door."
  # 新身份的感觉如何
  gts_skadi_paragon.a: "How does it feel to have a new identity?"
  # §B过去的我没能适应你赋予的身份,造就了不堪的往事。这一次我不会再让你失望了。
  gts_skadi_paragon.a.response: "§BThe past me failed to adapt to the identity you gave me, causing terrible things to happen. This time I will not disappoint you again.\"
  # 你的力量一定能在战场上大放光彩
  gts_skadi_paragon.b: "Your power will surely shine brightly on the battlefield."
  # §B我的剑销蚀了,我曾经的同僚都不在了。我接纳了海洋,那些曾经侵扰我和同僚们的危险,也不会再来了。你是我最后的......朋友，就请让我的力量，能在你遇到危险时派上用场把......
  gts_skadi_paragon.b.response: "§BMy sword is corroded, and my former comrades are gone. I have accepted the ocean. Those dangers that once plagued me and my colleagues will not return. You are my last... friend. So, please let my power be of use when you are in danger..."
  # 你说的海洋，究竟是什么地方
  gts_skadi_paragon.c: "What exactly is the ocean you speak of?"
  # §B那是你我共同的故乡，你真实的模样还在海浪深处等你。
  gts_skadi_paragon.c.response: "§BThat is the common home of you and me. Your true form is still waiting for you in the depths of the waves.\"
  # 你好可爱,我喜欢你
  gts_skadi_paragon.d: "You're so cute, I like you."
  # §B......§!\n斯卡蒂的大脑似乎已经宕机了
  gts_skadi_paragon.d.response: "§B......§!\nSkadi's brain seems to have crashed."
  # 关于要注意的事
  gts_skadi_paragon.e: "Things to be aware of"
  # §B我尚未完全适应这副躯壳，如果能得到足够的养分，这一进程将大大缩短。届时，这里也将成为我们的海洋。§!\n\n(我们可以在法令触发相关的事件了)
  gts_skadi_paragon.e.response: "§BI have not completely adapted to this body. If I can get enough nutrients, this process will be greatly shortened. Then, this place will also become our ocean.§!\n\n(We can now trigger related events with edicts)."
  # 涌潮悲歌
  subclass_commander_sadsong: "Surging Tide Dirge"
  # 那女人，将博士打至跪地，可能是要迫他回去做星怒力呀
  subclass_commander_sadsong_desc: "That woman forced the Doctor to their knees, perhaps to compel him to return to be a Star Fury."
  # §G专注将盆骨坐碎的老练领袖
  sadsong_subclass: "§GA skilled leader focused on crushing pelvises."
  # 同归殊途之吟
  trait_ruler_skadi_trait1: "Verse of Diverging Paths"
  # §B随我走吧，随我回去我们永恒的故乡。
  trait_ruler_skadi_trait1_desc: "§BCome with me, come back with me to our eternal home."
  # 同葬无光之愿
  trait_ruler_skadi_trait2: "Wish for a Shadowed Burial"
  # §B不该再有更多生命消逝了。
  trait_ruler_skadi_trait2_desc: "§BNo more lives should be lost."
  # 潮涌，潮枯
  trait_ruler_skadi_trait3: "Surge, Wane"
  # §B那么，就请听听这远海的歌吧......
  trait_ruler_skadi_trait3_desc: "§BThen, please listen to the song of the distant seas..."
  # 捕食习性
  trait_ruler_skadi_trait4: "Predatory Habits"
  # 自从星神兽袭击境内一颗农业星球后，我们新制定了对斯卡蒂的定时投喂政策。\n§R每等级+10£food£§Y$food$§!消耗(此数值受体型特质影响)§!
  trait_ruler_skadi_trait4_desc: "Since the Star God Beast attacked an agricultural planet within our borders, we have developed a policy for regularly feeding Skadi."
  # 独自狩猎
  skadi_leader_trait_hunt: "Solitary Hunter"
  # §B太空变形虫，缇杨奇鲸鱼，采矿无人机，太空变形虫，海盗，行商舰队，艺术家......唔，虽然这些是可以直接吃的，可博士没有告诉我如何辨别它们呀......
  skadi_leader_trait_hunt_desc: "§BSpace Amoebas, Tiyanki Whales, Mining Drones, Space Amoebas, Pirates, Trading Fleets, Artists... Hmm, Although these can be eaten directly, the Doctor didn't tell me how to identify them all..."
  # 冰镐猎人
  skadi_leader_trait_iceaxe: "Ice Pick Hunter"
  # 一把冰镐，其镐尖已经深深地凹陷进去。随着淡蓝色的液体滴滴坠落，冰镐的主人见到了最为恐怖的转化。
  skadi_leader_trait_iceaxe_desc: "An ice pick, with its point deeply dented. As pale blue liquid dripped down, the ice pick's owner saw the most terrifying transformation."
  # 波涛福音
  skadi_leader_trait_colossus: "Gospel of the Waves"
  # §B更多的灵魂......献给你§!
  skadi_leader_trait_colossus_desc: "§BMore souls... offered to you.§!"
  # 虚境爆炸反应装甲
  skadi_leader_trait_ERA: "Shroud Explosive Reactive Armor"
  # 这些受到虚境大能所祝福的爆反装甲能在我们战舰受到动能武器弹药击中时引爆自身，产生局部的亚空间冲击将其弹飞，从而保护船体和舰员。
  skadi_leader_trait_ERA_desc: "These explosive reactive armors, blessed by the great powers of the Shroud, can detonate themselves when our ships are hit by kinetic weapon ammunition, creating localized subspace shocks that deflect the projectiles, thereby protecting the hull and crew."
  # 这是蒂蒂，她很可爱
  skadi_leader_trait_cute: "This is Didi, She's Very Cute"
  # 这个特质并没有实质作用，只能说明你是一位品味高雅的人，文学造诣和自我修养很高的人。
  skadi_leader_trait_cute_desc: "This trait has no practical effect. It only indicates you are a person of high taste, literary talent, and self-cultivation."
  # 愚人曲
  skadi_leader_trait_fleetsing: "Fool's Tune"
  # §B那些弱小生命建立了强盛的帝国，铸造了辉煌的舰队。在浪潮遮蔽天空后，种种痕迹都被抹平了。
  skadi_leader_trait_fleetsing_desc: "§BThose weak lives established magnificent empires and forged glorious fleets. After the waves obscured the sky, all traces are wiped away.\"
  # 奇怪的猫耳
  skadi_leader_trait_cat: "Strange Cat Ears"
  # $skadi_Kaidie_picture$罕见的遗传病、虚境的诅咒、神奇的生物技术...无论如何，这位领袖长出了一对§G菲林耳§!。
  skadi_leader_trait_cat_desc: "$skadi_Kaidie_picture$A rare genetic disease, a curse from the Shroud, miraculous biotechnology... Regardless of the reason, this leader has grown a pair of §GFeline Ears§!."
  # \n\n\n£skadi_Kaidie_picture£ \n\n\n\n
  skadi_Kaidie_picture: "\n\n\n£skadi_Kaidie_picture£\n\n\n\n"
  # 腐化之心
  skadi_leader_trait_corrupting: "Corrupted Heart"
  # §B斯卡蒂§!和§B伊莎玛拉§!作为两位一体的存在，统治着整个名为虚境的海洋和现实宇宙中的[Owner.GetName]，带领着我们永无止境地§R吞食§!/§Y前进§!/§B进化§!....\n\n§G我们的领袖和人口会持续觉醒灵能力量§!
  skadi_leader_trait_corrupting_desc: "§BSkadi§! and §BIshar-mla§!, as two parts of a single entity, rule over the entire ocean called the Shroud and [Owner.GetName] in the material universe, leading our endless §Rdevouring§!/§Yadvancing§!/§Bevolving§!...\n\n§GOur leaders and population will continuously awaken psionic power!§!"
  # 鲸口脱险
  skadi_leader_train: "Escaped from the Jaws of a Whale"
  # 这位领袖在与斯卡蒂残酷的搏斗中生还下来，使得其对各种危险情况都能沉着应对从而扭转局势。
  skadi_leader_train_desc: "This leader survived a brutal struggle with Skadi, allowing them to remain composed and turn the tide in various dangerous situations."
  # 这位领袖不会被§B伊莎麻辣§!抓走
  isharmla_can_not_caught: "This leader cannot be captured by §BIshar-mla§!"
  # 血肉畸变
  skadi_leader_trait_variation: "Fleshy Aberration"
  # 这名领袖身上已经产生了严重变异，我们的医疗技术对其转变为海嗣的进程毫无办法。
  skadi_leader_trait_variation_desc: "This leader has undergone severe mutations, and our medical technology has no hope of stopping the sea-being transformation process."
  # 陷入恐慌
  skadi_leader_trait_horror: "Plunged into Panic"
  # 恐怖的场景使得这名领袖染上了严重的心理疾病，不得不接受大量药物的治疗。
  skadi_leader_trait_horror_desc: "The terrifying scenes have caused this leader to develop a severe mental illness, requiring extensive medication."
  # 虎鲸归来
  gts_skadi_paragon.02.name: "The Orca Returns"
  # 太可怕了，虽然斯卡蒂被不少人目击到在战场上打成碎片，但其本人第二天又安然无恙地来到海军司令部报到。虽然这引起了部分人员的恐慌，但至少这对我们来说是个好消息。
  gts_skadi_paragon.02.desc: "It's terrifying. Although Skadi has been witnessed being torn to pieces on the battlefield by many, she reports back to the Admiralty safe and sound the next day. Although it has caused panic among some personnel, at least it's good news for us."
  # 不亏是我的蒂蒂
  gts_skadi_paragon.02a: "As expected of my Didi."
  # §B梦，又一场梦......
  gts_skadi_paragon.02b: "§B A dream, just another dream..."
  # 毁灭的旧首都
  d_skadi_debris: "Ruined Old Capital"
  # 星神兽摧毁了我们的家园，我高贵的族人们沦为难民......
  d_skadi_debris_desc: "The Star God Beast destroyed our home. My noble people have become refugees..."
  # 斯卡蒂的厚乳
  d_skadi_breasts: "Skadi's Ample Breasts"
  # 在大灾变过后，我们将行政设施搬到了斯卡蒂的乳沟当中。奇怪的是，官僚们在一眼就能望到窗外傲人双峰的条件下办公效率大大提高了。
  d_skadi_breasts_desc: "After the cataclysm, we moved our administrative facilities into Skadi's cleavage. Strangely, the bureaucrats' efficiency greatly improved when they could see her proud peaks through the windows."
  # 斯卡蒂的小腹
  d_skadi_abdomen: "Skadi's Abdomen"
  # 一望无际的大平原，柔软有弹性的地面和 maiden的体香很适合发电。
  d_skadi_abdomen_desc: "An endless plain. The soft and elastic ground, infused with the girl's scent, is suitable for power generation."
  # 斯卡蒂的花园
  d_skadi_virgin: "Skadi's Garden"
  # §B禁止入内
  d_skadi_virgin_desc: "§BEntry Prohibited"
  # 饥肠辘辘的斯卡蒂
  gts_skadi_traits.00.name: "Famished Skadi"
  # 我们将来自数个星球的食物运输舰聚集到了外太空，其上的食物能足足供应我们首都所有子民三年的伙食，而如今它只是作为一顿下午茶的茶点被端上了巨娘的餐桌。\n\n拥有泰坦体型的斯卡蒂优雅地游到了舰队旁，还没等运输舰将食物卸下，斯卡蒂就伸出巨手，轻易地将舰船握在了手中。舰船的装甲因为承受不住如此大的压力而开始扭曲破溃，但斯卡蒂没有丝毫停下的意思，稍加用力就撕开了尾部的货仓。张开樱唇，伸出巨舌，里面的食物和船员被轻而易举地一扫而光，成为了斯卡蒂的养分。很快所有的船只都被斯卡蒂饕餮殆尽，但她的饥饿似乎还是没有得到满足，血红的双眼很快锁定到了过往的无辜舰船......\n\n幸亏我们的军队反应迅速，通过集中攻击斯卡蒂双腿间装甲薄弱的部位成功让她恢复理智，但仍有不少驾驶舰船渴望近距离接触虎鲸的人永远地消失在了斯卡蒂的口腔里。这一事件虽然引起了一时的混乱，但更多的人则是被斯卡蒂可爱的进食场景所打动。
  gts_skadi_traits.00.desc: "We gathered food transport ships from several planets in space. The food on board could feed all the citizens of our capital for three years, but now it is merely being served as an afternoon snack on the giantess's dining table.\n\nSkadi, with her titan-like body, gracefully swam up to the fleet. Before the transport ships could unload the food, Skadi stretched out her giant hand and easily grasped a ship. The ship's armor began to distort and break under the immense pressure, but Skadi showed no sign of stopping. With a bit of force, she tore open the cargo hold at the rear. She opened her cherry lips and extended her gigantic tongue, effortlessly sweeping in all food and crew members, becoming Skadi's nourishment. Soon all the ships were devoured by Skadi's gluttony, but her hunger didn't seem to be satisfied. Her bloodshot eyes quickly locked onto innocent passing ships... \n\nFortunately, our military reacted quickly. By concentrating attacks on the weak spots of Skadi's armor between her legs, we successfully restored her sanity. However, many of those who were eager to see the Orca up close forever disappeared into Skadi's mouth. Although the incident caused temporary chaos, most people were moved by Skadi's cute eating scene."
  # 你这肥鲸！
  gts_skadi_traits.00a: "You fat whale!"
  # §B呜呜，生物质，美味......
  gts_skadi_traits.00b: "§BWhimper, biomass, delicious..."
  # 顶级掠食者
  gts_skadi_traits.01.name: "Apex Predator"
  # 尽管我们对斯卡蒂领袖的供给一提再提，但她的胃口实在是惊人的大，在无法满足的饥饿的驱使下，斯卡蒂袭击了我们的一片星区，将星区总督所饲养的近半数缇杨奇鲸鱼吞食后逃逸。\n\n我们并不能完全指责于斯卡蒂，毕竟这一行为是完全出自其本能，但我们可以利用斯卡蒂的掠食习性和狩猎技巧，来对付帝国的威胁：比如骚扰我们边境的海盗和走私商贩，这样我们既能填饱斯卡蒂的肚子，也能减轻保全贸易路线的维护。
  gts_skadi_traits.01.desc: "Despite repeatedly increasing the supplies for Leader Skadi, her appetite is shockingly large. Driven by her insatiable hunger, Skadi attacked one of our star sectors, consuming half of the Tiyanki Whales raised by the sector's governor before escaping.\n\nWe can't entirely blame Skadi. After all, this behavior is completely instinctual. However, we can use Skadi's predatory habits and hunting skills to deal with threats to the empire, such as pirates and smugglers who harass our borders. This way we can both satisfy Skadi's hunger and reduce the maintenance needed to secure trade routes."
  # 随喜赞叹
  gts_skadi_traits.01a: "Praised be."
  # §B大群...还需要更多的供养...
  gts_skadi_traits.01b: "§BToo many... more sustenance is needed..."
  # 斯卡蒂躲过暗杀
  gts_skadi_traits.02.name: "Skadi Survives Assassination Attempt"
  # 今天早些时候，斯卡蒂在首都的家中经历了一场肉搏战后，她用冰斧干掉了一位尝试用冰斧攻击她的刺客，凶手已经确认为首都§H[Root.Capital.GetName]§!国民，据信受雇于对我们不屑一顾的堕落帝国知识管理者。\n\n由于对方始终不回应我们的通讯，我们无法得知这次行动的目的与意义所在。
  gts_skadi_traits.02.desc: "Earlier today, Skadi survived a melee battle at her home in the capital. She used an ice axe to kill an assassin who tried to attack her with another ice axe. The culprit has been identified as a citizen of the capital, §H[Root.Capital.GetName]§!, and is believed to be hired by the Fallen Empire Knowledge Keepers, who have no respect for us.\n\nSince they are not responding to our communications, we cannot determine the purpose and meaning of this action."
  # 《老壁灯谋害我领袖的性命》
  gts_skadi_traits.02a: "'Old Lamp Kills Our Leader'"
  # §B他在用武器伤害我的时候......会是什么感觉？
  gts_skadi_traits.02b: "§BWhen he used that weapon to hurt me... what did it feel like?"
  # 波涛福音
  gts_skadi_traits.03.name: "Gospel of the Waves"
  # 我们的探测器检测到帝国外出现了一个巨型生命体，那正是我们失踪了一个月的指挥官斯卡蒂，她正在...用一颗存在土著文明的星球满足自己的欲望。在斯卡蒂大腿的内侧，两瓣早已饥渴难耐的阴唇里已经流出了一些粘稠的液体。\n\n星球上的土著纷纷抬头望向天空，看着那巨大的脸庞，各国政府开始召开紧急会议，宗教团体大肆宣传神明降临，军事机构拿出最强的武器来保卫家园。但这一切在斯卡蒂看来都是难以理解的举动。\n\n给这颗星球套上灵能屏障后，斯卡蒂那长达数万公里宛如另一个行星的细长手指抵在了南半球，将星球缓缓推入早已湿润的小穴，开始这场行星级的性爱。北半球的屏障率先接触到穴壁，但无法抵御这强大的压力而碎裂开，上亿年未曾融化的极地冰川就这样毫无保留的接触到了穴壁。第一次体验到这种冰凉感觉的斯卡蒂没能抵御住这快感，一下子就将整个星球塞入了小穴内，强大的穴压不断挤压挑战着星球表面的屏障，不少地区上空的屏障已经出现些许裂纹。被快感驱动着斯卡蒂用力量不断的让这颗星球在小穴内抽插，上一秒还在小穴深处的星球下一秒几乎就要抽出穴外，而下一秒又重重的敲在了小穴深处的子宫颈上。行星在小穴内抽插的速度不断加快着，屏障说承受的穴压不断加强着，屏障不断悲鸣着，小人不断逃亡着，爱液不断涌出着。\n\n最终，屏障碎了，斯卡蒂设立的屏障最终还是没能抵御住体内的穴压，星球上无序的尖叫声消失了，巨大的穴肉包裹住了整个星球，吞噬了星球表面的一切生物，无论是高山还是深海，在穴壁面前全都平等的压缩成平面。从未如此畅快的体验的斯卡蒂肉体爆发出了惊人压力，在一瞬间压碎了小穴深处星球后，喷出的巨量星球残骸与爱液的混合物击碎了这颗星球可怜的卫星。面色潮红的斯卡蒂大口大口的喘气，缓缓的抽出了带着几条银丝的手指，看着胯下的一片狼藉...
  gts_skadi_traits.03.desc: "Our sensors detected a giant lifeform appearing outside our empire. It was our commander Skadi who had been missing for a month. She is.. satisfying her desires with a planet inhabited by a primitive civilization. On the inner side of Skadi's thighs, some viscous fluid is already flowing from the two lips, which are already desperate for the touch.\n\nThe natives on the planet looked up at the sky, watching the giant face. Governments began to hold emergency meetings, religious groups were vigorously propagating the descent of the gods, and military institutions were deploying their strongest weapons to defend their homes. But all this was incomprehensible to Skadi.\n\nAfter placing a psionic barrier around the planet, Skadi's slender finger, which was thousands of kilometers long and like another planet, pressed against the southern hemisphere. She slowly pushed the planet into her moistened entrance, starting this planetary-scale intercourse. The barrier of the northern hemisphere was the first to contact the cavity wall, but could not withstand the pressure and shattered. The polar ice caps, which hadn't melted for hundreds of millions of years, came into contact with cavity wall without any buffer. Skadi, experiencing this cold sensation for the first time, couldn't resist the pleasure and immediately slammed the entire planet into her cavity. The powerful internal pressure constantly squeezed and challenged the planet's surface barrier. Many areas on the planet experienced cracks in the barriers. Driven by pleasure, Skadi increased the friction within the cavity. One moment the planet is deep in the cavity and another it is almost pulled outside before slamming back into the cervix. The speed at which the planet is inserted and pulled increases. The cavity's pressure on the barrier is continuously increased. The barrier continues to wail. The small people continue to flee. The fluids continue to flow.\n\nFinally, the barrier shattered. Skadi's barrier ultimately could no longer withstand its internal pressure, and the disorderly screams on the planet disappeared. Huge walls of fleshy cavity enveloped the entire planet, devouring everything on its surface. Whether it was mountains or deep seas, they were all equally compressed into a flat surface by the cavity wall. Skadi's body, experiencing such unprecedented pleasure, erupted with tremendous power. In a brief moment, the planet, after being crushed by the pressure deep within the cavity, was ejected with large amounts of debris and fluids. The resulting mixture shattered the planet's pathetic moon. Skadi, her cheeks flushed, breathed heavily. She slowly withdrew her fingers, laced with strands of sticky fluid, and looked down at the mess beneath her..."
  # 看到了无比惊奇的画面呀
  gts_skadi_traits.03a: "Witnessed truly amazing scenes."
  # §B还渴望...更多...
  gts_skadi_traits.03b: "§BStill yearn...for more..."
  # 先进而又有趣的设计
  gts_skadi_traits.04.name: "Advanced and Interesting Design"
  # 我们的一支舰队被亚空间风暴拖入至虚境之中，其中的邪恶存在向我们的舰船发起了猛烈的攻势。我们的装甲与护盾无法对敌人亵渎的炮火形成有效的防御，形式对我们的战士太不利了。\n\n正当激战每况愈下的时候，先锋部队的斯卡蒂带回了一个惊人的消息，她在战斗中将敌方大魔咀嚼吞咽，并将虚境的灵能能量与舰队装甲以某种扭曲的方式相结合。\n\n这新制成的装甲能对敌人的灵能攻击到来之际作出反应，产生局部的灵能爆破将攻击弹开，仅凭这一优点，就足以将其他缺点所覆盖了。多亏了这些装甲，我们的舰队成功冲出了风暴。
  gts_skadi_traits.04.desc: "One of our fleets was dragged into the Shroud by a subspace storm, where evil entities launched a fierce offensive against our ships. Our armor and shields cannot effectively defend against the profane fire of the enemy. The situation is highly disadvantageous for our warriors.\n\nAs the battle worsened, Skadi, the leader of the vanguard, returned with shocking news. In a battle, she swallowed an enemy Greater Daemon and combined the Shroud's psionic energy with the fleet's armor in a distorted manner.\n\nThis newly made armor can react when enemy psionic attacks arrive, creating localized psionic bursts that deflect the attack. This feature alone is enough to cover up other deficiencies. Thanks to this armor, our fleet successfully escaped the storm."
  # 什么都爆反只会好了你
  gts_skadi_traits.04a: "Everything's explosively reactive, how nice for you"
  # §B没有任何一名船员死于敌人炮火的攻击，这论证了爆反的可行性
  gts_skadi_traits.04b: "§BNone of the crew members died from enemy fire attacks, which proves the feasibility of explosive reactive armor."
  # 愚人曲
  gts_skadi_traits.05.name: "Fool's Tune"
  # 我们的科学家对异世的石碑的研究有了新的进展，他们成功还原了泰拉文明一个帝国的部分资料。伊比利亚，依靠着来自海洋国家的超前技术，从普通的强国跃升为争霸者之一，其强势军事力量的化身 -  - 所向无敌的黄金舰队更是对其他国家有很强的威慑力。我们的科学家还摘抄下了一段关于伊比利亚辉煌时代黄金舰队的歌曲 -  - §H愚人曲§!。但我们并没有办法将这首歌曲咏唱出来，正当大家一头莫展的时候，有人提议让来自泰拉文明的斯卡蒂来尝试。起初斯卡蒂略有抗拒，但犹豫过后，悠扬的歌声从她的唇间飘了出来。\n\n§B晨空昭示着大海的汹涌,纵使时光流转也不会忘却信仰。§!\n\n在场的人员听到歌声无不激情澎湃，热血沸腾，迫不及待想要登上战船，前往充斥着鲜血与荣耀的战场。\n\n§B朋友，我们必须与风暴抗衡，直到那黄金时代终归来。§!\n\n曲终。被激起的振奋却久久不能平息。\n关于伊比利亚帝国和泰拉文明的后面的细节和结局并没有被记载到我们的资料库中，这也许本身就是不存在的历史。
  gts_skadi_traits.05.desc: "Our scientists have made new progress in the study of the otherworldly stele, and they have successfully restored some information about an empire of the Terra civilization. Iberia, relying on the advanced technology of an oceanic nation, had risen from an ordinary power to one of the contenders for hegemony. The incarnation of its powerful military force - the invincible Golden Fleet - posed a strong deterrent to other nations. Our scientists have also transcribed a song about the golden age of the Iberian Golden Fleet - §HFool's Tune§!. However, we had no way to sing this song. Just as everyone was at a loss, someone suggested letting Skadi, who is from the Terra civilization, give it a try. Skadi was initially reluctant but after hesitating, a melodious song floated from her lips.\n\n§BThe dawn heralds the surge of the sea. Even though time passes, the faith will not be forgotten.§!\n\nThose present who heard the song were filled with passion.  They were eager to board a warship and head to a battlefield filled with blood and glory.\n\n§BFriends, we must contend with the storm until the golden age returns.§!\n\nThe song ended. The excitement that had been stirred up could not be calmed for a long time.\nThe details and outcomes regarding the Iberian Empire and the Terra Civilization are not recorded in our database. Perhaps it is a history that never existed."
  # 跟着来自过去的歌声 去寻找黄金的国度。
  gts_skadi_traits.05a: "Following a song from the past to search for a golden nation."
  # §B他们自称海洋的霸主，真是狂妄......
  gts_skadi_traits.05b: "§BThey call themselves the overlords of the seas. How arrogant..."
  # 两百巨娘份的安眠药
  gts_skadi_traits.06.name: "Two Hundred Giantess Worth of Sleeping Pills"
  # 出于对斯卡蒂身体黑暗沉重秘密的好奇，海军司令部与医疗部私底下制定了计划：在斯卡蒂投喂的餐食中混入剂量约两百巨娘份的安眠药和肌松剂，然后将昏睡过去的斯卡蒂转运到医疗部进行肆意的研究。计划的前半部分非常顺利，斯卡蒂没有察觉到食物里面所掺入的药物。但或许是身体的保护机制起作用，斯卡蒂的身体开始巨大化，摧毁了沿途的一切建筑和设施，在达到两百倍体型的时候巨大化才停止。之后药物开始生效，斯卡蒂跌倒在地，安然睡去......\n\n利用巨大化来稀释所吸收的毒物，这种防御机制并不常见。但之后的检测证明，这些致死量的药物还是对斯卡蒂的身体造成了不可估量的影响。
  gts_skadi_traits.06.desc: "Out of curiosity about Skadi's dark and deep secrets, the Admiralty and the Medical Department secretly devised a plan: They would mix an amount of sleeping pills and muscle relaxants equivalent to two hundred giantesses into Skadi's food and then transfer the unconscious Skadi to the Medical Department for wanton research. The first half of the plan went smoothly. Skadi didn't notice the drugs mixed in the food. But perhaps her body's defense mechanism kicked in. Skadi's body began to grow larger, destroying all the buildings and facilities along the way. The growth stopped when she reached 200 times her original size. And then the drugs took effect. Skadi fell to the ground and fell asleep peacefully...\n\nUsing growth to dilute absorbed poisons, this defense mechanism is not common. But subsequent tests proved that these lethal doses of drugs still caused incalculable damage to Skadi's body."
  # 立刻把这些蠢货挂上舰桥示众
  gts_skadi_traits.06a: "Immediately hang these idiots on the bridge as a warning!"
  # §B梦？一个无比熟悉的梦...已经成为现实了呢。
  gts_skadi_traits.06b: "§BDream? A very familiar dream... that has become reality."
  # 昨日残梦
  gts_skadi_traits.07.name: "Fragmented Dream of Yesterday"
  # 已经连续好几天没有见过太阳了，天空还是一如既往的阴沉，抬头望去，整片天空仿佛成为了另一片海洋。我不知道该前往何处，也不知道自己在躲避着什么，一路走来，遇到的只有深浅不一的陨石坑，大地被掀翻开来，甚至能看到其底部的地幔，生命与文明的痕迹似乎被彻底抹去了。\n已经到达极限了，双腿仅仅是支撑自己的体重就已经要断裂开来。就在理智之弦即将断裂之际，眼前出现了一位白发猫耳的 maiden，奇怪...她是谁？为什么她的身影如此熟悉？\n\n§G博士......§!\n强烈的欲望驱使着我向她奔去，想要去靠近她，想要去拥抱她...\n§G博士......§!\n已经感受不到双腿的存在了，哪怕已经血从伤口淌出，骨头开始粉碎...\n§G请以一个人类的身份，活下去......§!\n我会拯救这片大地上的大家...\n\n梦醒，映入眼帘的不是熟悉的房间，而是斯卡蒂的怀抱。\n§B你似乎做了一个噩梦。§!\n试图起身，但发现自己没有力气挣脱。\n§B这是堕落为浮游生物的代价，我...感同身受。§!\n\n奇怪的是，斯卡蒂头上长出了和梦中 maiden一样的猫耳朵，但她却丝毫不掩饰这一异常。
  gts_skadi_traits.07.desc: "I haven't seen the sun for many days. The sky is as gloomy as ever. Looking up, the entire sky seems to have become another ocean. I don't know where I should go, nor what I'm avoiding. All I've encountered along the way are meteor craters of varying depths. The ground has been overturned, and it's even possible to see the mantle underneath. Traces of life and civilization seem to have been completely erased.\n\nI've reached my limit. Just supporting my own weight is about to break both of my legs. Just when the strings of reason were about to snap, a white-haired cat-eared girl appeared in front of me. Strange... who is she? Why does her figure feel so familiar?\n\n§GDoctor...§!\nA strong desire drove me towards her. I wanted to get close to her. I wanted to hug her...\n§GDoctor...§!\nI can no longer feel my legs, even though blood was still flowing from the wounds, my bones began to shatter...\n§GPlease live on as a human being...§!\nI will save everyone on this land...\n\nI woke up from the dream. What greeted my eyes was not a familiar room, but Skadi's embrace.\n§BYou seemed to have a nightmare.§!\nI tried to get up but discovered that I didn't have the strength to break free.\n§BThis is the price of falling into being plankton. I... empathize.§!\n\nStrangely, the same cat ears as the girl in my dream have sprouted on Skadi's head, but she doesn't hide her unusualness at all."
  # 身上的谜团越来越多了......
  gts_skadi_traits.07a: "More and more mysteries surround me..."
  # §B只是些碎片和毫无意义的幻象罢了......
  gts_skadi_traits.07b: "§BJust some fragments and meaningless illusions..."
  # 斯卡蒂的请求
  gts_skadi_events.00.name: "Skadi's Request"
  # §H不适应陌生的环境、袭击粮库屡次被阻止、愈加贪婪的消耗，缺乏生物质供养似乎已经开始影响到了斯卡蒂的身体和心灵上的状态，我们最好在斯卡蒂被饥饿彻底冲昏头脑之前通过投喂以阻止更严重的事件发生，或许这同时会给我们带来一些回报？!
  gts_skadi_events.00.desc: "§HFailure to adapt to an unfamiliar environment, repeated attempts to raid food storage, and increasingly greedy consumption. It seems the lack of biomass supply has begun to affect Skadi's physical and mental state. We should replenish her before she becomes completely hunger-crazed in order to prevent more serious events. Perhaps this will also bring some rewards?!"
  # 满足她的需求
  gts_skadi_events.00a: "Satisfy her needs."
  # 像你这样的虎鲸只会把米吃贵
  gts_skadi_events.00b: "An orca like you is just going to drive up the prices of rice."
  # 我们可以通过法令再次触发该事件
  gts_skadi_events.00b.tip: "We can trigger this event again through edicts."
  # 遭遇巨娘袭击训练
  gts_skadi_events.0100.name: "Encounter with Giantess Attack Training"
  # 泰坦 maiden的嬉戏
  gts_skadi_events.0101.name: "Titan Maidens' Playtime"
  # 这绝对是我们首都[Owner.Capital.GetName]最黑暗的一天。两名泰坦 maiden，斯卡蒂和§H[Root.GetName]§!，决定在星系里面展开所谓的对巨娘特训。\n\n§B这颗星球看起来很合适...§!斯卡蒂用手指捏住[Owner.Capital.GetName]的两端，如果没有提前设置灵能屏障，[Owner.Capital.GetName]肯定承受不住手指的撞击而毁灭了。\n\n将星球含在口中，斯卡蒂缓缓游向§H[Root.GetName]§!，牵起她的手，轻轻地抱在一起。两幅巨大而完美的胴体紧贴在一起，硕大的乳房将胸口之间的小行星轻易地夹碎。两名 maiden的樱唇逐渐凑到一起，能够轻易承载整颗恒星的舌头则相互紧紧缠绕，而[Owner.Capital.GetName]则不幸地被劫持到了中间，其上的居民只能看见不断变化着的粉红色天空。咕噜咕噜，波涛汹涌的唾液海洋不断冲刷着灵能屏障，如果屏障破裂，整颗星球就会被海量从天而降的唾液所淹没，数百亿人将会溺亡。每个人只能默默祈祷，祈祷头顶上的粉红野兽能快点离开，祈祷这场闹剧能尽快结束。仿佛在品尝着人们的恐惧，泰坦 maiden舌尖上的战斗更加猛烈了，天空变化的幅度与频率更加剧烈，星球表面的屏障也开始变形、出现裂痕，人们终于承受不住眼前的景象，开始大叫起来。\n\n所幸也在这时，巨娘之间的战斗结束了。舌头松开了，晶莹的能够轻易黏着行星的唾液白线还连接着彼此。斯卡蒂和§H[Root.GetName]§!在星系间大口喘着粗气，[Owner.Capital.GetName]上的居民则开始庆祝危机的结束......
  gts_skadi_events.0101.desc: "This has definitely been the darkest day for our capital, [Owner.Capital.GetName]. Two Titan Maidens, Skadi and §H[Root.GetName]§!, decided to engage in what they call giantess training within the system.\n\n§BThis planet looks about right...§! Skadi pinched [Owner.Capital.GetName] between her fingers. If psionic barriers hadn't been pre-installed, [Owner.Capital.GetName] would have surely been destroyed by the impact.\n\nPlacing the planet in her mouth, Skadi slowly swam toward §H[Root.GetName]§!, taking her hand and gently embracing each other. Two huge and perfect bodies pressed together, their colossal breasts easily crushing asteroids between their chests. The two maidens' cherry lips gradually drew together, easily accommodating entire stars worth of tongue, tightly entwining with each other, while [Owner.Capital.GetName] was unfortunately caught in the middle, its inhabitants only able to see the ever-shifting pink sky. Gurgle, gurgle, the turbulent ocean of saliva constantly battered the psionic barrier. If the barrier were to break, the entire planet would be flooded by the massive amount of saliva raining down from the sky, and billions would drown. Everyone could only pray silently, hoping the pink beasts above would leave soon, hoping that this farce would end quickly. As if savoring the fear of the people, the battle between the titan maidens' tongues intensified, the rate of change and fluctuations of the sky became more violent, the barriers on the planet's surface started to deform and crack. The people finally could not endure the sight before them and began to scream.\n\nFortunately, the battle between the giantesses ended at this time. The tongues parted, strands of glistening saliva that could easily stick to planets connected them. Skadi and §H[Root.GetName]§! gasped for breath within the system, while the inhabitants of [Owner.Capital.GetName] began celebrating the end of the crisis..."
  # 斯卡蒂腐蚀+1
  gts_skadi_events.0101a: "Skadi Corruption +1"
  # §B血亲的力量...增强了...
  gts_skadi_events.0101b: "§BThe power of kinship...is enhanced...§!"
  # 鲸口脱险
  gts_skadi_events.0102.name: "Escape from the Whale's Mouth"
  # 这片宇宙充斥着不友善的巨娘文明，如果我们的人员在执勤时遇到比飞船甚至星球还要巨大的巨娘没有足够的反应措施，那下场就不言而喻了。\n\n为了应对来自巨娘的威胁，海军司令部邀请我们的领袖参加一项特殊项目：由斯卡蒂扮演不怀好意的巨娘，模拟在各个情景下相遇的紧急情况。\n\n令人高兴的是，§H[Root.GetName]§!成功地通过了这次测试，避免了被囚禁在斯卡蒂长靴里面的惩罚，相信这次惊心动魄的经历会让这位领袖终身难忘。
  gts_skadi_events.0102.desc: "This universe is filled with hostile giantess civilizations. If our personnel don't have enough measures to respond when they encounter giantesses that are larger than ships or even planets, their fate is predictable.\n\nTo deal with threats from giantesses, the Navy Command has invited our leader to participate in a special project: Skadi will play the role of a hostile giantess, simulating emergency encounters in various scenarios.\n\nIt's a pleasure to report that §H[Root.GetName]§! successfully passed this test, avoiding the penalty of being imprisoned within Skadi's boots. I believe that this thrilling experience will be unforgettable for our leader for the rest of her life."
  # 结果是好的
  gts_skadi_events.0102a: "The outcome is good"
  # §B如此弱小，这样的活法太辛苦了...
  gts_skadi_events.0102b: "§BSo weak, it's too hard to live like this...§!"
  # 撕裂虚境
  gts_skadi_events.02.name: "Tearing the Shroud"
  # 斯卡蒂领袖身上的灵能能量在我们的世界和名为虚境的位面打通了一个通道，并且这股灵能能量似乎正在通过通道不断侵袭着虚境。这突如其来的入侵似乎惊扰了居住在此处的存在，但大部分存在都似乎陷入疑惑与犹豫的状态之中。\n\n经过一阵骚乱之后，五位灵能力量明显远强于其他的存在有了不同的反应，似乎在邀请我们与其交流。\n\n我们可以派出始作俑者斯卡蒂与这些存在交流，但只能选择其中一位，你的选择是？
  gts_skadi_events.02.desc: "The psionic energy on Leader Skadi opened a connection between our world and a dimension called the Shroud, and this psionic energy seems to be constantly invading the Shroud through the connection. This sudden invasion seems to have disturbed the beings residing there, with the majority appearing confused and hesitant.\n\nAfter a period of unrest, five beings whose psionic power is clearly far stronger than the others reacted differently, seemingly inviting us to communicate with them.\n\nWe can send the instigator, Skadi, to communicate with these entities, but we can only choose one. What is your choice?"
  # §B你也在寻找所谓黑图书馆吗
  gts_skadi_events.02.a: "§BAre you also searching for the so-called Black Library?§!"
  # §G这怎么有一锅冒着不祥气息的汤
  gts_skadi_events.02.b: "§GWhy is there a pot of ominous-looking soup here?§!"
  # §R一位坐在骷髅王座上的慈祥老人
  gts_skadi_events.02.c: "§RAn amiable elder sitting on a skull throne§!"
  # §r满意，只是暂时的
  gts_skadi_events.02.d: "§rSatisfied, but only for the moment§!"
  # §M是啊，我一直在等待这一刻
  gts_skadi_events.02.e: "§MYes, I've been waiting for this moment.§!"
  # 不是冰冷的太阳我不选
  gts_skadi_events.02.f: "I won't choose anything that isn't a cold sun"
  # §H或许我们还有一个人选
  gts_skadi_events.02.g: "§HPerhaps we have another candidate§!"
  # §B来都来了，不如去参加伊莎玛拉的茶会把§!
  gts_skadi_events.02.h: "§BSince we're here, why don't we go and join Isha'marla's tea party?§!"
  # §B这是虎鲸，你可以摸摸她§!
  gts_skadi_events.02.i: "§BShe's an orca, you can pet her!§!"
  # 伊莎玛拉的觉醒
  isharmla_awaken: "Isha'marla's Awakening"
  # 我们与名为§B伊莎玛拉§!的强大存在签订了契约，如今从祂的帮助中获益。§Y或许天下真的存在免费的午餐。§!
  isharmla_awaken_desc: "We have signed a contract with a powerful entity called §Bisha'marla§!, and are now benefiting from their aid. §YPerhaps there is such a thing as a free lunch.§!"
  # 伊莎玛拉的嘲弄
  isharmla_tease: "Isha'marla's Tease"
  # 受到来自虚境的强大干涉，我们的帝国几乎陷入停摆的状态。
  isharmla_tease_desc: "Due to powerful interference from the Shroud, our Empire has almost come to a standstill."
  # 伊莎玛拉的标记
  skadi_shroud_marked: "Isha'marla's Mark"
  # §B一个并没有任何害处的灵能标记§!\n\n我们应当在清算前驱散标记
  skadi_shroud_marked_desc: "§BA psionic mark that doesn't cause any harm.§!\n\nWe should dispel the mark before the reckoning."
  # 标记已驱散
  skadi_shroud_unmarked: "Mark Dispelled"
  # 伊莎玛拉的灵能标记被驱散了，这颗星球安全了,暂时...
  skadi_shroud_unmarked_desc: "Ishar-mla's psionic mark has been dispelled. This planet is safe... for now."
  # §B驱散标记§!
  skadi_remove_marked: "§BDispel Mark§!"
  # 我们的灵能使现在能在不受到§B伊莎玛拉§!干扰的情况下移除其上的灵能标记\n我们侍奉§B伊莎玛拉§!所获得的回报还剩下§Y[Owner.isharmla_satisfy]§!次
  skadi_remove_marked_desc: "Our psionics are now able to remove psionic marks without interference from §BIshar-mla§!. \nWe have §Y[Owner.isharmla_satisfy]§! more rewards remaining for serving §BIshar-mla§!."
  # 灵能加速已部署
  skadi_buildfast: "Psionic Acceleration Deployed"
  # 这颗星球的时间流速在虚境的强大干涉下加快了，虽然这一方面提高了建设效率，但也需要更高频率的人员轮替
  skadi_buildfast_desc: "The flow of time on this planet has been accelerated under the strong interference of the Shroud. While this has increased construction efficiency, it also requires more frequent staff rotations."
  # §B灵能加速§!
  skadi_decision_buildspeed: "§BPsionic Acceleration§!"
  # 通过标记，我们可以让§B伊莎玛拉§!将这颗星球的时间流速加快来提高星球建设速度\n我们侍奉§B伊莎玛拉§!所获得的回报还剩下§Y[Owner.isharmla_satisfy]§!次
  skadi_decision_buildspeed_desc: "Through the mark, we can have §BIshar-mla§! accelerate the flow of time on this planet to improve the construction speed. \nWe have §Y[Owner.isharmla_satisfy]§! more rewards remaining for serving §BIshar-mla§!."
  # §B虚境救援§!
  skadi_add_shroudpop: "§BShroud Rescue§!"
  # §G在星球上创建5£pop£人口§!
  skadi_add_shroudpop.tooltip: "§GCreates 5 £pop£ pops on the planet§!"
  # 在护佑之下，我们的搜索队将部分迷失与虚境的国民带回现实\n我们侍奉§B伊莎玛拉§!所获得的回报还剩下§Y[Owner.isharmla_satisfy]§!次
  skadi_add_shroudpop_desc: "Under her protection, our search teams have brought back some citizens who were lost in the Shroud to reality. \nWe have §Y[Owner.isharmla_satisfy]§! more rewards remaining for serving §BIshar-mla§!."
  # 伊莎玛拉的满足
  skadi_satisfy_marked: "Ishar-mla's Satisfaction"
  # 我们侍奉§B伊莎玛拉§!所获得的回报还剩下§Y[Owner.isharmla_satisfy]§!次，我们可以在§Y星球决议§!中消耗其获得加成。\n\n§B伊莎玛拉§!已经吞噬了我们£pops£§Y[Owner.eated_pop]§!人口
  skadi_satisfy_marked_desc: "We have §Y[Owner.isharmla_satisfy]§! more rewards remaining for serving §BIshar-mla§!.\n§BIshar-mla§! has devoured §Y[Owner.eated_pop]§! of our £pops£ pops."
  # §B海嗣
  NAME_seaheirs: "§BSea-beings§!"
  # §B迷路的海嗣
  NAME_lostseaheirs: "§BLost Sea-beings§!"
  # §B伊莎玛拉的海嗣§!
  NAME_isharmla_seaheirs: "§BIshar-mla's Sea-beings§!"
  # 逃出生天的食物
  NAME_isharmla_food: "Food That Escaped"
  # 我们的灵能使开始引导斯卡蒂身上的灵能力量，试图窥察其中所隐藏的奥秘。这股灵能力量一开始很顺利地从斯卡蒂身上剥离下来，但这一存在似乎被刺激到了，祂开始在这片虚境暴动起来，将灵能使像断线的风筝一样卷起，吸入了风暴当中。\n\n风暴开始肆虐，越来越多的个体被卷入其中，吸收了新灵魂的存在变得更加庞大，侵袭的速度与规模也随之大幅提升。眼看风暴就要波及到我们，祂突然开始停下了动作，细细地端详起来。雷鸣般的声音几乎将我们的灵魂贯穿，大量的信息开始涌入。\n\n祂正是那位事迹被刻印在石碑上的存在，大静谧的始作俑者，泰拉文明的毁灭者，永无止境进化着的神明。\n\n§B伊莎玛拉§!
  gts_skadi_shroud.0100.desc: "Our psionics began to guide the psionic power within Skadi, attempting to glimpse the secrets hidden within. This psionic power was initially stripped from Skadi smoothly, but this entity seemed to be provoked. It began to rage in the Shroud, sweeping up the psionics like a kite with its string cut, and pulled them into the storm.\n\nThe storm began to rage. More and more individuals were drawn into it. The entity, having absorbed new souls, became even larger. The speed and scale of the invasion also increased dramatically. Just as it seemed the storm was about to affect us, it suddenly stopped and began to carefully examine us. Thunderous sounds almost pierced our souls as large amounts of information surged in.\n\nShe was that same entity whose story was engraved on the stele, the instigator of the Great Silence, the destroyer of the Terra Civilization, and an ever-evolving god.\n\n§BIshar-mla§!"
  # §Y尝试与这个存在交流§!
  gts_skadi_shroud.0100.a: "§YAttempt to communicate with this entity!§!"
  # 随着虚境掀起阵阵渏澜，眼前的存在开始剧烈地转变着自己的形态。转变成体型约5000m的 maiden形态，祂拥有着和斯卡蒂一样的容貌和完美的酮体，但无论是灵能力量还是威压都达到后者的无以计数倍。名为海嗣的个体在祂身边不详的波动中成群游动，似乎这些生物已经将伊莎玛拉作为自己的栖息地了。\n\n伊莎玛拉睁开双眼，笑眯眯地看着我们。\n\n§B哦哈哈...真是有趣，我们会以如此精致小巧的形态会面...我也没想到，对力量的贪婪能让你不惜代价来唤醒天灾...你果然比其他浮游生物更加有趣，更有赏玩的价值，呵呵呵....\n\n§B虚境契约？唔...作为唤醒我的回报，我将赐予你和那些拥护你的浮游生物们无可匹敌的力量，去掠夺，去征服，去吞噬...一切低等存在都将跪倒在你的脚下...而你只需要支付一点小小的代价...§!\n\n§B时限？让我想想...十年？太短了...五十年？谁会为一个事件浪费这么长时间...啊哈哈，折中一下，二十五年。这段时间，足够你将自己的疆域扩散到整个银河系了，也足够让我成为所谓虚境的海洋的主宰...§!
  gts_skadi_shroud.0101.desc: "As the Shroud rippled, the entity before us began to drastically change its form. It transformed into a girl-like form about 5000 meters tall. She possessed the same appearance and perfect body as Skadi but with immeasurable times more psionic power and pressure. Individuals called Sea-beings swam in groups around her in ominous ripples, seemingly using Ishar-mla as their habitat.\n\nIshar-mla opened her eyes and looked at us with a smile.\n\n§BOh haha... how interesting. We'll meet in such a refined and petite form. It is also beyond my expectations that your greed for power has made you to willing to pay the price to awaken a cataclysm... you are indeed more interesting and more valuable to play with than other plankton, heh heh...\n\n§BShoud contract? Hmm... as a reward for awakening me, I will grant you and those planktons who support you with unparalleled power. To plunder, to conquer, to devour... all inferior beings shall kneel before you... and you only need to pay a small price...\n\n§BTime limit? Let me think... ten years? Too short... fifty years? Who would waste so long on one event... ahaha, let's compromise, twenty-five years. This time is enough for you to spread your territory across the entire galaxy, and enough for me to become the master of what you call the ocean of the Shroud...§!"
  # 你友善吗
  isharmla_answer01: "Are you friendly?"
  # §B嗯嗯...你可以完全将身心交付与我哦，我的海洋会温柔地接纳你...\n\n在我的海洋中，不会有纷争，不会有烦恼，不会有苦难...你可以和其他孩子们一样自由自在地游弋...当然，你绝对是这群孩子中最显眼最特别的那位呢...
  isharmla_answer01a: "§BUh-huh... You can completely entrust your body and mind to me. My ocean will embrace you gently...\n\nIn my ocean, there will be no disputes, no worries, no suffering... You can swim freely with the others... Of course, you'll definitely be the most noticeable and special one among the children..."
  # 你和斯卡蒂之间有什么关系
  isharmla_answer02: "What is your relationship with Skadi?"
  # §B啊哈哈...我和那孩子联系并不是很重要啦。\n\n如果你将与那孩子的牵绊与依赖转移到我身上的话，我也能欣然接受呢...
  isharmla_answer02a: "§BAhaha... The connection between me and that child isn't very important.\n\nIf you transfer the bonds and reliance you have with that child to me, I will gladly accept it..."
  # 询问关于凯尔希的下落
  isharmla_answer03: "Inquire about Kal'tsit's whereabouts."
  # §B这不重要§!\n\n伊莎玛拉的表情明显变得不悦\n\n§B如果你总是去追逐过去虚无缥缈的影子，又怎么能开拓属于自己的未来呢。§!
  isharmla_answer03a: "§BThat's not important!§!\n\nIshar-mla's expression clearly became displeased.\n\n§BIf you always chase the illusory shadows of the past, how can you open up your own future?§!"
  # 契约的代价是什么
  isharmla_answer04: "What is the price of the contract?"
  # §B代价...呵呵呵...\n\n与你所得到的相比，非常的微小，绝对能维持在你和浮游生物们所能承受的范围之内...
  isharmla_answer04a: "§BThe price... heh heh...\n\nCompared to what you will receive, it is very small, it will definitely stay within the range that you and your plankton can afford..."
  # §Y和伊莎玛拉签订契约§!
  gts_skadi_shroud.0101.a: "§YSign a contract with Ishar-mla!§!"
  # §R这并不明智§!
  gts_skadi_shroud.0101.a.tooltip: "§RThis is unwise!§!"
  # 签订契约
  gts_skadi_shroud.0102.name: "Signing the Contract"
  # 完成了，我们和§B伊莎玛拉§!签订了契约。当我们和祂定下契约时，§B伊莎玛拉§!肆意地笑了起来，其身上成群的海嗣也开始在虚境中飞舞，似乎在举行着一场盛大的舞会。\n\n很快我们就被驱逐出了虚境，但宛如一阵温和的微风拂过，整个§Y[Root.GetName]§!上下都是一派欣欣向荣的景象。§R没有纷争，没有烦恼，没有苦难。§!\n\n一切都在向着好的方向发展...
  gts_skadi_shroud.0102.desc: "It is done. We have signed a contract with §BIshar-mla§!. When we signed the contract with her, §BIshar-mla§! laughed recklessly.  The hordes of Sea-beings around her also began to dance in the Shroud, as if holding a grand ball.\n\nSoon we were expelled from the Shroud, but as if a gentle breeze swept over us, the entirety of §Y[Root.GetName]§! was a scene of prosperity. §RNo disputes, no worries, no suffering§!\n\nEverything is developing for the better..."
  # 这是我们亲手开启的故事呀
  gts_skadi_shroud.0102.a: "This is a story that we have opened with our own hands."
  # 她要是耍诈，我们就用大炮蹦她个王八蛋
  gts_skadi_shroud.0102.b: "If she plays a trick, we'll blast her head with cannons."
  # 伟大的神明，请施舍于我们怜悯与慈悲
  gts_skadi_shroud.0102.c: "Great god, please bestow mercy and compassion upon us"
  # 我们能利用好所获得的一切
  gts_skadi_shroud.0102.d: "We can take advantage of everything we have gained."
  # §B带来了天灾§!
  opinion_skadi_brought: "§BBrought the Cataclysm!§!"
  # §B驯服了天灾§!
  opinion_skadi_overcome: "§BTamed the Cataclysm!§!"
  # §B伊莎玛拉§!会感到§Y满意§!
  isharmla_like.tooltip: "§BIshar-mla§! is §Ypleased!§!"
  # §B伊莎玛拉§!会感到§G非常满意§!
  isharmla_verylike.tooltip: "§BIshar-mla§! is §Gvery pleased!§!"
  # §B伊莎玛拉§!会感到§R不满§!
  isharmla_dislike.tooltip: "§BIshar-mla§! is §Rdispleased!§!"
  # 血肉畸变
  gts_skadi_shroud.0301.title: "Fleshy Aberration"
  # §B伊莎玛拉§!的触须从虚境伸向了我们的领袖，所有和§B伊莎玛拉§!联系密切领袖在这一天都获得了来自虚境的大量知识与力量，但他们的生理结构产生了可怕的变异，变成跟原生种族和海嗣的混合体一样的存在。他们虽然变得面貌全非，但似乎还保有理智，仍能以这样的躯壳为我们帝国效力。\n\n而侥幸逃过一劫的领袖们却因目睹同伴变异转化的恐怖场景而患上了心理疾病。
  gts_skadi_shroud.0301.desc: "§BIshar-mla's§! tendrils extended from the Shroud towards our leaders. All leaders closely connected to §BIshar-mla§! received massive amounts of knowledge and power from the Shroud on this day. But their physiological structures underwent terrible mutations, transforming them into beings that were a mix of their original race and Sea-beings. Although they have been disfigured, they seem to still possess reason and can still serve our empire in this form.\n\nHowever, the leaders who were lucky enough to escape were inflicted with mental illnesses after witnessing the terrifying scenes of their companions transforming."
  # 他们还能听懂我们的语言吗
  gts_skadi_shroud.0301.a: "Can they still understand our language?"
  # 隔离并清除这些海嗣
  gts_skadi_shroud.0301.b: "Isolate and eliminate these Sea-beings."
  # 至高无上的赐福
  gts_skadi_shroud.0301.c: "A Supreme Blessing."
  # 研究这些骇人的畸变
  gts_skadi_shroud.0301.d: "Study these horrifying aberrations."
  # §R所有已经畸变成海嗣的领袖会被处决§!
  gts_skadi_shroud.0301.b.tooltip: "§RAll leaders who have already mutated into Sea-beings will be executed!§!"
  # §B族群，势不可挡。\n\n进化，永不停歇。\n\n给养，十分合适。§!\n\n\n\n§H(如果我们能让伊莎玛拉满意的话，兴许能找到消除星球上标记的方法)§!
  gts_skadi_shroud.0201.desc: "§BThe swarm is unstoppable.\n\nEvolution is unending.\n\nSustenance is quite adequate.§!\n\n\n\n§H(If we can please Ishar-mla, perhaps we can find a way to remove the marks on planets)§!"
  # 献上食物
  gts_skadi_shroud.0201.a: "Offer food."
  # §B就算是再陌生的食物，也将成为养料...
  gts_skadi_shroud.0201.a.respond: "§BEven unfamiliar food will become sustenance...§!"
  # 献上大量食物
  gts_skadi_shroud.0201.b: "Offer a large amount of food."
  # §B这么多吃的啊！\n\n额呵呵...我是说，你的供奉非常好...
  gts_skadi_shroud.0201.b.respond: "§BSo much to eat!\n\nUh... I mean, your offering is very good...§!"
  # 献上矿物
  gts_skadi_shroud.0201.c: "Offer minerals."
  # §B嚼碎了还是能咽下去的...
  gts_skadi_shroud.0201.c.respond: "§BEven if chewed, they can still be swallowed...§!"
  # 献上大量矿物
  gts_skadi_shroud.0201.d: "Offer a large amount of minerals."
  # §B这些在你们这里算是平常的食物吗？\n\n看来那些幼嗣们需要进化出更适合的口器来咀嚼了...
  gts_skadi_shroud.0201.d.respond: "§BIs this considered ordinary food in your world?\n\nIt seems that the younger Sea-beings will need to evolve more suitable mouthparts for chewing...§!"
  # 啊给马赛
  gts_skadi_shroud.0201.e: "A-Ge Ma Sai (Ah Give Me Some)"
  # §B宇宙的法则就是大鱼吃小鱼...§!\n\n伊莎玛拉顿了顿\n\n§B哪怕是再愚笨的捕食者，在身份转变为被捕食者时，也会丢下手中的食物然后逃窜呢...§!
  gts_skadi_shroud.0202.desc: "§BThe law of the universe is that the big fish eat the small fish...§!\n\nIshar-mla paused.\n\n§BEven the most foolish predators will drop their food and flee when they become prey...§!"
  # 献上小人
  gts_skadi_shroud.0202.a: "Offer small people."
  # §B比浮游生物更渺小的存在...幼嗣们会喜欢这些新玩具的...
  gts_skadi_shroud.0202.a.respond: "§BExistences even smaller than plankton... the young Sea-beings will like these new toys..."
  # 献上大量小人
  gts_skadi_shroud.0202.b: "Offer a large amount of small people."
  # §B哦呵呵...你也很喜欢欺负比你弱小的存在的感觉，不是吗...
  gts_skadi_shroud.0202.b.respond: "§BOh ho ho... you seem to like the feeling of bullying those weaker than you, don't you..."
  # 献上城市
  gts_skadi_shroud.0202.c: "Offer cities."
  # §B我很享受这些苔藓碾碎在身上酥麻的感觉...
  gts_skadi_shroud.0202.c.respond: "§BI enjoy the tingling sensation of this moss being crushed under my body..."
  # 献上大量城市
  gts_skadi_shroud.0202.d: "Offer a large amount of cities."
  # §B如此可悲...哪怕如此大规模的聚集在一起，也是被一次性消耗完的结局呢...
  gts_skadi_shroud.0202.d.respond: "§BSo pitiful... even if they are gathered in such a large scale, their fate is to be consumed all at once..."
  # 献上爱液
  gts_skadi_shroud.0202.aa: "Offer fluids of love."
  # §B这些晶莹剔透的粘稠液体是...\n\n啧...
  gts_skadi_shroud.0202.aa.respond: "§BThese translucent and viscous liquids are...\n\nTsk..."
  # 献上大量爱液
  gts_skadi_shroud.0202.bb: "Offer a large amount of fluids of love."
  # §B哦呵呵...你和那些浮游生物每天就和这些靡乱的产物打交道吗...\n\n还是说这已经是你们生活不可缺少的一部分了...
  gts_skadi_shroud.0202.bb.respond: "§BOh haha... do you plankton deal with these messy products every day?\n\nOr is this already an indispensable part of your lives..."
  # 献上巨娘
  gts_skadi_shroud.0202.cc: "Offer giantesses"
  # §B终于，来了一些能够激起感觉的玩物...
  gts_skadi_shroud.0202.cc.respond: "§BFinally, some playthings that can stimulate my senses..."
  # 献上大量巨娘
  gts_skadi_shroud.0202.dd: "Offer a large amount of giantesses."
  # §B哇(棒读)，能收买到这么多虫子的忠心，你和浮游生物们一定很辛苦把...\n\n不用担心，很快你就不用继续忍受讨好那些虫子的生活了...
  gts_skadi_shroud.0202.dd.respond: "§BWow (deadpan), to buy the loyalty of so many insects, you and the plankton must have been very tired...\n\nDon't worry, soon you won't have to endure the lifestyle of appeasing those insects anymore..."
  # 要饭也不能逮着一家薅啊
  gts_skadi_shroud.0202.e: "Don't rip off one family when begging either"
  # §B我的幼嗣们已经厌倦这片作为游乐场的虚境了，它们似乎对你那边宇宙的各种事物都充满了好奇和食欲呢...\n\n代替我照顾一下它们，这样微小的事情你应该能做到把...
  gts_skadi_shroud.0203.desc: "§BMy younger Sea-beings are tired of this Shroud as their playground. They seem to be filled with curiosity and appetite for various things in your universe.\n\nTake care of them for me. You should be able to handle such a minor thing..."
  # 乐意之至，我会带它们到战场上猎食的
  gts_skadi_shroud.0203.a: "With pleasure, I will lead them to the battlefield to hunt!"
  # 如果是萝莉海嗣的话，也不是不行
  gts_skadi_shroud.0203.b: "If they are loli Sea-beings, I wouldn't mind."
  # 它们会给我的国民带来烦扰
  gts_skadi_shroud.0203.c: "They will bring trouble to my people."
  # §B贵安...\n\n请注意，刚刚有几只小家伙趁我不注意从我嘴中窜逃到你那边去了...\n\n嗯呐，真是太有活力了...§!\n\n┓(´∀`)┏
  gts_skadi_shroud.0204.desc: "§BGreetings...\n\nPlease note, a few small fellas have just escaped from my mouth without me noticing...\n\nWell, they are so energetic!§!\n\n┓(´∀`)┏"
  # 献上食物作为补偿
  gts_skadi_shroud.0204.a: "Offer food as compensation."
  # 我们会处理的
  gts_skadi_shroud.0204.b: "We will handle it."
  # (伊莎玛拉的牙缝漏风)
  gts_skadi_shroud.0204.c: "(Ishar-mla's teeth are leaking air)."
  # 风暴将至
  gts_skadi_shroud.0205_title: "The Storm Approaches"
  # 越来越多的暴乱与破坏出现了，虚境的威胁如今已经向所有人显露出自己的獠牙，对即将到来的清算的恐惧与绝望狠狠地攥紧着每一位国民的内心。一大批[Root.Capital.GetName]上的国民开始自发组织起来，他们要求我们对签订契约以来一系列事件负责以及公布§B斯卡蒂§!和虚境存在的真相。\n\n如今他们的规模已经到了不可忽视的地步，我们必须对此作出回应。
  gts_skadi_shroud.0205_desc: "More and more riots and destruction have occurred. The threat from the Shroud has now shown its fangs to everyone. The fear and despair of the impending reckoning are clenching the hearts of every citizen. A large group of citizens on [Root.Capital.GetName] has begun to spontaneously organize. They demand that we take responsibility for a series of events since signing the contract and reveal the truth about §BSkadi§! and the entity in the Shroud.\n\nTheir size has now reached a point that cannot be ignored. We must respond to this."
  # §B你应该已经不需要这些质疑你权威的浮游生物了吧...
  gts_skadi_shroud.0205.a: "§BYou shouldn't need these plankton who doubt your authority anymore..."
  # 如此关键的时刻不允许一丝骚乱，镇压他们
  gts_skadi_shroud.0205.b: "At such a crucial moment, not a single riot is allowed. Suppress them."
  # 既然他们想要说法，那把斯卡蒂烧给他们看
  gts_skadi_shroud.0205.c: "Since they want an explanation, then let's burn Skadi for them to see."
  # §B斯卡蒂§!
  gts_skadi_shroud.0206.title: "§BSkadi§!"
  # §B陷入静谧的虚境海洋只是开始，毁灭泰拉的灾厄重新降临，绝不褪去的潮汐吞没一切...\n\n博士...我很遗憾这段颠簸的旅程也要迎来终点...
  gts_skadi_shroud.0206.desc: "§BThe silent Shroud Sea is just the beginning. The disaster that destroyed Terra has descended again. The tide that never recedes will engulf everything...\n\nDoctor... I regret that this turbulent journey is also coming to an end...§!"
  # 我们还剩多少时间
  skadi_warn01: "How much time do we have left?"
  # §B一千天。\n\n一千天后，大啖食粮之时就会到来。§!
  skadi_warn01a: "§BOne thousand days.\n\nAfter one thousand days, the time to devour all sustenance shall arrive.§!"
  # 我们犯下了滔天大罪
  skadi_warn02: "We have committed a heinous crime."
  # §B再强大的内心也理所当然拥有会动摇会颤抖的细微缝隙，你和我要做的就是不要让任何事物能够侵蚀它...§!
  skadi_warn02a: "§BEven the strongest of hearts naturally has minor cracks where it can be shaken. What you and I need to do is ensure that nothing can erode it...§!"
  # 还存在补救的契机吗
  skadi_warn03: "Is there still a chance for redemption?"
  # §B为了向前，有时你也需要回首反顾身边存在之物...§!
  skadi_warn03a: "§BTo move forward, sometimes you also need to look back at the things that are by your side...§!"
  # 这些财富带不进坟墓
  skadi_warn04: "These riches cannot be taken to the grave."
  # 我们会渡过难关的
  skadi_warn05: "We will overcome this obstacle."
  # §H简而言之，如果清算前斯卡蒂存活并伊莎玛拉的侍奉次数大于或等于5次，蒂蒂会出来挡刀§!
  skadi_warn_tooltip: "§HIn short, if Skadi is alive and the amount of Ishar-mla's services are greater or equal to 5 times before the reckoning, Didi will come out to block the attack.§!"
  # 与伊莎玛拉链接加深
  gts_skadi_shroud.0207_title: "Deeper Connection with Ishar-mla"
  # 我们与§B伊莎玛拉§!建立的纽带随着时间推移而加强，帝国的一些国民随机地获得了更为惊奇的灵能力量。一群信徒找上了我们，她们都是正处于花季时期的 maiden，声称听到了§B伊莎玛拉§!的神谕，要求我们为祂建立起一座高耸入宇的圣所，否则就将所有人都献给§B伊莎玛拉§!。\n\n起初我们认为这群 maiden只是无礼的狂信徒，但在见证她们施展可怕的能力将军队和城市缩小到肉眼几乎看不见的大小，再用各种残忍的方式玩弄这些受害者后，我们不得不承认，她们是§B伊莎玛拉§!的宠儿，她们带来了祂的神谕...\n\n我们可以在我方的某一颗行星上建造一座£building£§B深海圣所§!
  gts_skadi_shroud.0207_desc: "The bond between us and §BIshar-mla§! has strengthened over time. Some of the citizens of the empire have randomly obtained even more amazing psionic powers. A group of devotees have approached us. They were all girls in their prime, claiming to have heard the divine will of §BIshar-mla§!, demanding that we build a soaring sanctuary for her or else they would dedicate everyone to §BIshar-mla§!.\n\nAt first, we thought these girls were just rude fanatics. But after witnessing their ability to use their terrifying power to shrink armies and cities to sizes almost invisible to the naked eye, and torturing these victims in various cruel ways, we must admit that they are §BIshar-mla's§! favorites, and they brought her divine will..\n\nWe can build a £building£ §BDeep Sea Sanctuary§! on one of our planets!"
  # 一份祝福，亦或是诅咒...
  gts_skadi_shroud.0207.a: "A blessing, or a curse..."
  # 盯紧这些可疑分子
  gts_skadi_shroud.0207.b: "Keep a close eye on these suspicious individuals."
  # 传播福音的使者
  gts_skadi_shroud.0207.c: "Messengers of the Gospel."
  # 事态已经超出控制范围了
  gts_skadi_shroud.0207.d: "The situation is already out of control."
  # 深海谕使
  job_isharmla_slaves: "Deep Sea Oracle"
  # $job_isharmla_slaves$
  job_isharmla_slaves_plural: "$job_isharmla_slaves$"
  # 深海谕使是专门侍奉§B伊莎玛拉§!的奴仆，有时她们也会用自己方式处理掉贬低§B伊莎玛拉§!信仰的异端。
  job_isharmla_slaves_desc: "Deep Sea Oracles are servants dedicated to serving §BIshar-mla§!. They sometimes use their own methods to deal with heretics who belittle the faith of §BIshar-mla§!."
  # 深海圣所
  building_isharmla_sanctum: "Deep Sea Sanctuary"
  # 圣所是专门用于同§B伊莎玛拉§!进行沟通的地方。在此地，每年都有数万名 maiden被派往虚境迎接§H飞升§!，但她们最后的终局不是被残忍碾碎就是永远迷失在§B伊莎玛拉§!无边无际的身体上。
  building_isharmla_sanctum_desc: "The Sanctuary is a place dedicated to communicating with §BIshar-mla§!. In this place, tens of thousands of girls are sent to the Shroud every year to welcome §HAscension§!. However, their final fate is either to be brutally crushed or to be forever lost in the boundless body of §BIshar-mla§!."
  # $job_isharmla_slaves$消耗£consumer_goods£§Y$consumer_goods$§!、£gts_micro£§Y$gts_micro$§!、£gts_micro_city£§Y$gts_micro_city$§!或£consumer_goods£§Y$consumer_goods$§!、£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、£gts_giantess_underwear£§Y$gts_giantess_underwear$§!产出£unity£§Y$unity$§!\n每100§Y$job_isharmla_slaves$§!减少50点£crime£§Y$concept_crime$§!、提升2%£psionic£§Y$mod_psionic_pop_bonus_workforce_mult$§!、增加3%星球£spiritualist£§Y$mod_pop_ethic_spiritualist_attraction_mult$§!
  job_isharmlaslaves_effect_desc: "$job_isharmlaslaves$ $job_isharmlaslaves_plural$ consumes £gts_micro£ shrunken people and £gts_micro_city£ shrunken cities, produces £unity£ unity, and increases psionic population output.\n\n§GThis job can gain all the bonuses from serving the Shroud existences!§!"
  # $job_isharmla_slaves$消耗£consumer_goods£§Y$consumer_goods$§!、£gts_micro£§Y$gts_micro$§!、£gts_micro_city£§Y$gts_micro_city$§!或£consumer_goods£§Y$consumer_goods$§!、£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、£gts_giantess_underwear£§Y$gts_giantess_underwear$§!产出£unity£§Y$unity$§!\n每100§Y$job_isharmla_slaves$§!减少50点£crime£§Y$concept_crime$§!、提升2%£psionic£§Y$mod_psionic_pop_bonus_workforce_mult$§!、增加3%星球£spiritualist£§Y$mod_pop_ethic_spiritualist_attraction_mult$§!\n\n§B如此可爱的孩子们不应该继续被当做玩物被随意消耗，我会平等地怜爱她们...§!
  job_skadislaves_effect_desc: "§BThese adorable children shouldn't continue to be used as playthings and consumed arbitrarily. I will show them equal love and compassion...§!"
  # $job_isharmla_slaves$岗位
  mod_job_isharmla_slaves_add: "$job_isharmla_slaves$ jobs"
