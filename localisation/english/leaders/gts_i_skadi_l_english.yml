  # 危险实验·续
  gts_skadi_colossus.1000.name: "Dangerous Experiment: Continued"
  # 受上一次将斯卡蒂成功缩小到星球级别的成功，帝国科研部门持续对斯卡蒂体内的缩小激素进行优化研究。\n\n经过数次试验，这位白发红瞳的虎鲸 maiden终于成功适应了激素的力量，初步掌握了自主调节自身大小的能力。现在，她已经准备好离开[event_target:skadi_sit_planet.GetName]征战银河了。
  gts_skadi_colossus.1000.desc: "Following the previous success of shrinking Skadi down to planetary scale, the imperial research department continued its work optimizing the shrinking hormones within her body.\n\nAfter numerous tests, this white-haired, red-eyed Orca girl finally adapted to the hormone's power, gaining an initial mastery over voluntarily regulating her own size. Now, she is ready to depart from [event_target:skadi_sit_planet.GetName] to wage war across the galaxy."
  # 该虎鲸上场的时候了
  gts_skadi_colossus.1000.a: "Time for the Orca to take the stage"
  # 还不是时候
  gts_skadi_colossus.1000.b: "The time is not yet right"
  # §Y我们可以在斯卡蒂的通讯中继续事件，斯卡蒂一旦成长为舰船就无法解散§!
  gts_skadi_colossus.1000.b.tooltip: "§YWe can continue the event through Skadi's transmissions. Once Skadi grows into a ship, she cannot be disbanded.§!"
  # 虎鲸升起
  gts_skadi_colossus.1001.name: "The Orca Rises"
  # 在[event_target:skadi_sit_planet.GetName]上，数以亿计的帝国公民共同见证了这一历史性时刻。现场直播画面中，斯卡蒂那数万公里高的庞大身躯正缓缓从行星表面站起。\n\n§B...博士...别担心，我会很小心的...§!\n\n maiden低沉的声音如滚雷般在大气中回荡。她赤足踩在殖民星球上，雪白的长发披散在肩头，泳装紧紧贴着稍稍湿润的皮肤。仅仅只是双腿微微弯曲准备起身的动作，就让脚下的地壳发出低沉的轰隆隆震颤，大片山脉在她脚趾缝隙间崩塌。斯卡蒂红瞳微微眯起，表情认真而专注，拥有大陆体型的她正竭力控制着每一丝力量。她先是慢慢抬起一只脚掌。那只脚掌长度超过两万公里，足底还残留着被压成平地的城市痕迹。无数小人在她脚底的纹路中惊恐地抬头，只看到一片粉嫩却遮天蔽日的肉色天空缓缓远离。斯卡蒂小心地把脚抬起到星球之外的太空中，另一只脚也随之抬起。整个殖民星球在她起身的过程中剧烈摇晃，却奇迹般地没有彻底崩解。脱离行星引力后，斯卡蒂的身体开始主动巨大化。\n\n§B呼...就快到了...§!\n\n随着一声轻轻的吐息，她的身躯以肉眼可见的速度成长。雪白的肌肤在星光下泛着水润的光泽，丰满的胸部、纤细有力的腰肢，以及修长健美的双腿迅速在[event_target:skadi_sit_planet.system.GetName]中展开。曾经被她一屁股坐塌的[event_target:skadi_sit_planet.GetName]，此刻在她脚边只剩下一颗小小的蓝色弹珠。斯卡蒂在星系中轻轻舒展身体，一只手随意抬起到胸前，另一只手则撑在腰侧。她微微弓起背脊，仅仅是呼吸一次，胸前的起伏就掀起星球级的强大气流。 maiden低头俯视着脚边渺小的帝国舰队与星球，红瞳中带着一丝满足与温柔。\n\n帝国舰队指挥官们望着那几乎填满整个视野的巨大 maiden身影，既敬畏又振奋。斯卡蒂的存在本身，便为帝国海军提供了前所未有的战力。\n\n§B这样...应该够用了吧？博士，我现在可以正式帮到你们的海军了吧。只要你需要，我可以变得更大...§!\
  gts_skadi_colossus.1001.desc: "On [event_target:skadi_sit_planet.GetName], hundreds of millions of imperial citizens witnessed this historic moment together. In the live broadcast feeds, Skadi's immense form, tens of thousands of kilometers tall, was slowly rising from the surface of the planet.\n\n§B...Doctor... don't worry, I'll be very careful...§!\n\nThe girl's low voice echoed through the atmosphere like rolling thunder. She stood barefoot upon the colony world, her long snow-white hair cascading over her shoulders, her swimsuit clinging tightly to her slightly damp skin. The mere motion of slightly bending her legs in preparation to stand caused the planetary crust beneath her to rumble with deep tremors, vast mountain ranges collapsing between the crevices of her toes. Skadi narrowed her crimson eyes slightly, her expression earnest and focused; possessing the stature of an entire continent, she was doing her utmost to rein in every ounce of her strength. First, she slowly lifted one foot. That foot alone stretched over twenty thousand kilometers long, the sole still bearing the impressions of flattened cities. Countless Tinies looked up in terror from the tread-lines of her sole, only to see a soft-pink, sky-obscuring expanse of flesh slowly drifting away. Skadi carefully lifted her foot outward into the vacuum of space, followed by the other. The entire colony world shook violently as she stood up, yet miraculously avoided total collapse. Once freed from planetary gravity, Skadi's body began to actively enlarge.\n\n§BWhew... almost there...§!\n\nWith a gentle exhale, her body grew at a speed visible to the naked eye. Her snow-white skin shimmered with a moist luster under the starlight, while her voluptuous bosom, slender yet powerful waist, and long, toned legs rapidly expanded across [event_target:skadi_sit_planet.system.GetName]. The world of [event_target:skadi_sit_planet.GetName], once nearly crushed beneath her backside, was now reduced to a tiny blue marble by her feet. Skadi gently stretched in the star system, casually raising one hand before her chest while resting the other against her hip. She arched her back slightly; with just a single breath, the rise and fall of her chest stirred planet-scale gale-force currents. Gazing down at the minuscule imperial fleet and planets around her feet, a hint of satisfaction and tenderness appeared in the girl's crimson eyes.\n\nImperial fleet commanders gazed upon the colossal maiden's silhouette that filled nearly their entire field of vision, filled with both awe and exhilaration. Skadi's sheer existence granted the Imperial Navy unprecedented firepower.\n\n§BThis... should be enough, right? Doctor, now I can officially assist your navy. As long as you need me to, I can become even bigger...§!"
  # 我们再也不用惧怕星神兽了
  gts_skadi_colossus.1001.a: "We need never fear stellar leviathans again"
  # §B或者更小，陪在你身边...§!
  gts_skadi_colossus.1001.b: "§BOr even smaller, staying by your side...§!"
