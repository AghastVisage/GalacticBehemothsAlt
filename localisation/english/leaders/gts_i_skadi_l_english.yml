  # 初生的§B伊莎玛拉§!似乎对我们这片体型决定力量的世界充满了好奇，祂随意地渗透进我们的基因与思想当中，像橡皮泥一样捏造我们的生物形态，其结果是我们帝国时而有部分国民发生突兀的体型转变。\n\n但这次事态有些严重了，§H[event_target:victim_planet.GetName]§!上的国民在这一天集体失踪了。科学家调查后认为，§B伊莎玛拉§!所引发的极端的体型缩小让她们全都掉入了未知的绝望的微观世界，哪怕她们幸运地活下来，也没办法跟如今无数倍体型差的昔日的同伴们取得联系。\n\n我们不得不宣布,§H[event_target:victim_planet.GetName]§!上的人员全部失踪。
  gts_skadi_shroud.0004.desc: "The nascent §BIshar-mla§! seems to be filled with curiosity about our world, where size determines strength. She arbitrarily infiltrates our genes and thoughts, shaping and creating our biological forms like clay. As a result, some of our citizens in the empire occasionally experience abrupt changes in size.\n\nBut this time, things got serious. All citizens on §H[event_target:victim_planet.GetName]§! disappeared on this day. Scientists, after their investigations, believe the extreme size reduction caused by §BIshar-mla§! has made them all fall into an unknown and hopeless microscopic world. Even if they survive, they will not be able to contact their companions of the past, who are now many times larger than them.\n\nWe must announce that all personnel on §H[event_target:victim_planet.GetName]§! are missing."
