  # §B在哪里呢...在哪里呢...找到了，浮游生物的巢穴...§!我们的首都[Owner.Capital.GetName]不受控制地被剥离出了银河系，被固定在§H伊莎玛拉§!粉红色的阴蒂之上。\n\n§B这是给你的特等席位，作为奖励...§!阴蒂之下，是覆盖了整个银河系的外阴，如同洞穴入口一般，延伸着看不到尽头的深渊，§H伊莎玛拉§!要将整个星系用来自慰。\n\n感受着星系间无数微不足道的微生物们的恐惧与绝望，§H伊莎玛拉§!不禁有些兴奋，阴唇也开始以光年规模微微颤动，如同张开血盆大口的庞然大物要将眼前的猎物吞噬。从深渊中散发出来的淫糜气息开始侵入银河系，腐蚀着人们残存的理智。§B接下来...呼呼...可能有些颠簸...§!伊莎玛拉的手指轻易地捏住了银河中心，将其朝着小穴撞去。\n\n§B唔...§!无数的星球和其聚齐起来的星系在剧烈的撞击中终结。欣欣向荣的殖民地、叱咤虚空的强大舰队...一切令人引以为傲的文明成就都变为穴壁上沉没于爱液中微不足道的残骸。宏伟的阴蒂开始充血勃起，气温开始不断升高，我们首都仿佛置身于火炉之中。\n\n§B嗯哼...§!胯间传来不一样的感觉，§H伊莎玛拉§!停下了手上的动作...
  gts_skadi_shroud.3319.desc: "§BWhere is it... Where is it... Found it, the plankton nest...§! Our capital, [Owner.Capital.GetName], was uncontrollably ripped out of the galaxy. It was fixed onto the pink clitoris of §HIshar-mla§!.\n\n§BThis is a premium seat for you, as a reward...§! Beneath the clitoris is the vulva that covers the entire galaxy, a seemingly endless abyss, like the entrance to a cave. §HIshar-mla§! is about to use the entire galaxy to pleasure herself.\n\nFeeling the fear and despair of countless insignificance microorganisms in the galaxy, §HIshar-mla§! couldn't help but feel excited. Her labia began to slightly tremble on a scale of light years, like a giant beast opening its bloody mouth to devour her prey. The lewd aura emanating from the abyss began to invade the galaxy, corroding the remaining sanity of mankind. §BNext... huff huff... it might get bumpy...§!  Ishar-mla's fingers easily pinched the center of Milky Way, slamming it towards her cavernous entrance.\n\n§BUh...§! Countless planets and the star systems they were nestled within were annihilated by the fierce impact. Flourishing colonies, powerful fleets that dominated the Shroud... all the achievements of civilization that we were so proud of turned into insignificant debris submerged in the fluids of her abyss. The magnificent clitoris began to engorge and its temperature began to continuously rise. Our capital seems to be trapped in a furnace.\n\n§BEnnnh...§! A different feeling came from her crotch, §HIshar-mla§! stopped her actions..."
