  # 滔天的精液洪水将星球上的一切所吞没了，整颗星球的颜色如今都被白浊所侵染
  d_futa_jylake_desc: "The towering torrents of semen have swallowed everything on the planet. The color of the entire planet is now contaminated with whitish turbidity."
  # 精液海
  d_futa_jylake2: "Semen Sea"
