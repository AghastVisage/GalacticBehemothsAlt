  # 一伙斯卡蒂的狂信徒在§H[event_target:victim_planet.GetName]§!上逆向研究并建造了非常简易的虎鲸诱捕器。他们企图通过召唤斯卡蒂降临来传播自己的信仰，但理所当然的，斯卡蒂并没有回应他们的召唤，但同时有其他存在被吸引到了§H[event_target:victim_planet.GetName]§!....\n\n§H[event_target:victim_planet.GetName]§!上的一座繁荣的城市连同周围的几座山脉都消失了，取而代之的是在外太空就能清晰可见的土黄色深坑，以及其间可达千米深的粘稠唾液湖泊。\n\n好在我们的国民已经听惯了某某城市或是星球无故消失的新闻，这件事并没有引起很大的影响。
  gts_skadi_shroud.0002.desc: "A group of Skadi fanatics reverse-engineered and built a very rudimentary Orca lure on §H[event_target:victim_planet.GetName]§!. They attempted to summon Skadi to descend upon them to spread their faith. But as expected, Skadi didn't respond to their summons. At the same time, another entity was attracted to  §H[event_target:victim_planet.GetName]§!.... \n\nA prosperous city on §H[event_target:victim_planet.GetName]§!, along with several surrounding mountains, disappeared. In their place, a dull yellow pit that could be clearly seen from space, and a viscous saliva lake up to a thousand meters deep within it appeared. \n\nFortunately, our citizens have become accustomed to the news of a certain city or planet disappearing for no reason, so this incident did not have a large impact."
  # 就当他们只是到另外个世界度假了
  gts_skadi_shroud.0002.a: "Let's just assume they are on vacation in another world"
