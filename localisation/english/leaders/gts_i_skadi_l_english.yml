  # 自从我们与§B伊莎玛拉§!签订了契约，时而出现一些来自虚境的渏澜波及到我们的帝国，带来人员的伤亡和财产损失。\n\n尽管§B伊莎玛拉§!声称这是建立连接和虚境翻腾带来的一点点副作用，但现在这些渏澜聚集起来形成了猛烈的灵能风暴，迅速冲击了整个帝国。
  gts_skadi_shroud.0006.desc: "Since we signed a contract with §BIshar-mla§!, ripples from the Shroud have occasionally affected our empire, causing casualties and property damage.\n\nAlthough §BIshar-mla§! claims these are just slight side effects due to establishing a connection and the turbulence in the Shroud, these ripples have now gathered to form a fierce psionic storm, rapidly impacting the entire empire."
