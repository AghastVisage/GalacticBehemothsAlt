  # 二级深海推进阵列
  GTS_SKADI_ARK_THRUSTER_T2: "Tier 2 Abyssal Thruster Array"
  # 抵消十倍体型带来的迟滞，让二级方舟舰仍保有战术机动能力。
  GTS_SKADI_ARK_THRUSTER_T2_DESC: "Offsets the inertia from tenfold scaling, allowing the Tier 2 Arkship to retain tactical maneuverability."
  # 三级深海推进阵列
  GTS_SKADI_ARK_THRUSTER_T3: "Tier 3 Abyssal Thruster Array"
  # 三级方舟舰使用的推进系统。她移动得并不快，但无人能轻易逃离。
  GTS_SKADI_ARK_THRUSTER_T3_DESC: "The propulsion system used by the Tier 3 Arkship. She does not move swiftly, yet none can easily escape her reach."
  # 二级深海感知阵列
  GTS_SKADI_ARK_SENSOR_T2: "Tier 2 Abyssal Sensor Array"
  # 扩大方舟舰的索敌、追踪与超空间感知能力。
  GTS_SKADI_ARK_SENSOR_T2_DESC: "Expands the Arkship's target acquisition, tracking, and subspace awareness."
  # 三级深海感知阵列
  GTS_SKADI_ARK_SENSOR_T3: "Tier 3 Abyssal Sensor Array"
  # 覆盖多条航道的深海感知系统，让斯卡蒂在敌舰抵达前就已锁定目标。
  GTS_SKADI_ARK_SENSOR_T3_DESC: "An abyssal sensing system spanning multiple hyperlanes, locking onto targets long before enemy vessels arrive."
  # 二级方舟战术核心
  GTS_SKADI_ARK_COMBAT_COMPUTER_T2: "Tier 2 Ark Tactical Core"
  # 保留完整方舟舰交互指令，并强化二级方舟舰的远程火控能力。
  GTS_SKADI_ARK_COMBAT_COMPUTER_T2_DESC: "Preserves full Arkship interactive command protocols while enhancing long-range fire control for the Tier 2 Arkship."
  # 三级方舟战术核心
  GTS_SKADI_ARK_COMBAT_COMPUTER_T3: "Tier 3 Ark Tactical Core"
  # 为三级斯卡蒂方舟舰准备的战术核心，将整片星系视为一个战术界面。
  GTS_SKADI_ARK_COMBAT_COMPUTER_T3_DESC: "A tactical core tailored for the Tier 3 Skadi Arkship, treating the entire star system as a single combat interface."
  # 二级深海装甲隔舱
  GTS_SKADI_ARK_BARRIER_T2: "Tier 2 Abyssal Armored Bulkheads"
  # 以舰娘规格重新设计的方舟装甲模块，提供巨量装甲与持续修复。
  GTS_SKADI_ARK_BARRIER_T2_DESC: "Ark armor modules redesigned to Shipgirl specifications, providing immense armor and continuous hull repair."
  # 三级深海装甲隔舱
  GTS_SKADI_ARK_BARRIER_T3: "Tier 3 Abyssal Armored Bulkheads"
  # 三级方舟舰的巨型装甲隔舱，常规舰炮几乎无法留下有效创伤。
  GTS_SKADI_ARK_BARRIER_T3_DESC: "The colossal armored bulkheads of the Tier 3 Arkship, upon which conventional naval weaponry can barely leave a scratch."
  # 二级潮汐屏障
  GTS_SKADI_ARK_ARMOR_T2: "Tier 2 Tidal Barrier"
  # 环绕方舟舰的深海护盾模块，提供巨量护盾与静态恢复。
  GTS_SKADI_ARK_ARMOR_T2_DESC: "Abyssal shield modules enveloping the Arkship, granting massive shielding and static regeneration."
  # 三级潮汐屏障
  GTS_SKADI_ARK_ARMOR_T3: "Tier 3 Tidal Barrier"
  # 三级方舟舰的潮汐屏障，在战场上持续吞没来袭火力。
  GTS_SKADI_ARK_ARMOR_T3_DESC: "The tidal barrier of the Tier 3 Arkship, continuously swallowing incoming hostile fire across the battlefield."
  # 斯卡蒂二级战术海域
  SHIP_AURA_GTS_SKADI_BATTLE_ARK_T2: "Skadi Tier 2 Tactical Waters"
  # 斯卡蒂将更广阔的星系空间纳入自己的节奏，显著强化友军舰队的生存与输出。
  SHIP_AURA_GTS_SKADI_BATTLE_ARK_T2_DESC: "Skadi draws an even broader expanse of system space into her rhythm, significantly bolstering allied fleet survivability and firepower."
  # 斯卡蒂三级战术海域
  SHIP_AURA_GTS_SKADI_BATTLE_ARK_T3: "Skadi Tier 3 Tactical Waters"
  # 整片战场都被三级斯卡蒂的深海领域支配，友军舰队获得近乎压倒性的优势。
  SHIP_AURA_GTS_SKADI_BATTLE_ARK_T3_DESC: "The entire battlefield is dominated by the Tier 3 Skadi's abyssal realm, granting allied fleets an overwhelming advantage."
  # 斯卡蒂二级战术海域
  aura_gts_skadi_battle_ark_tier_2: "Skadi Tier 2 Tactical Waters"
  # 斯卡蒂三级战术海域
  aura_gts_skadi_battle_ark_tier_3: "Skadi Tier 3 Tactical Waters"
  # 斯卡蒂战术海域
  aura_gts_skadi_battle_ark: "Skadi Tactical Waters"
