  gts_skadi_arkship_grow_tooltip: "[Root.GetName] begins the gigantification process, advancing to the next tier form after 7 days. Size and all attributes will be increased, upkeep will increase, while colonies, districts, and pops hosted aboard the Arkship will be retained."
