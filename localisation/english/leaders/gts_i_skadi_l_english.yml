  # 我们的好日子到头了。在清算到来之前，我们的仁人志士苦苦求索，只为能找到一个逃避毁灭的办法，但回应他们的只有§H伊莎玛拉§!的轻蔑与嘲笑。如今祂的规模已经因吞噬巨量虚境存在而变得不可估量，大啖食粮之时已经到来...\n\n转瞬之间，首都的天空中的舰船、群星都消失不见了，空余一片黑暗，而我们与其他殖民地的联系也被全部切断了，仿佛整个世界只剩下。\n\n§B呼哈哈...你们那可悲的信息处理器官还没明白发生了什么吗...§!§H伊莎玛拉§!的低语在灵能网络中回响。好消息是，得益于§H伊莎玛拉§!的帮助我们能以高位的视角了解发生了什么；坏消息是，一般人根本无法承受这样的场面。\n\n§H伊莎玛拉§!已经入侵到了现实宇宙，而在祂赤裸的双腿间...银河系就像是一团不及手掌大小若隐若现的烟雾，恒星系烟雾中的就像一颗一颗砂砾，更别提其中更加微小的星球了
  gts_skadi_shroud.3318.desc: "Our good days are over. Before the reckoning, our patriots searched desperately, only to find a way to escape destruction. But all that greeted them was scorn and ridicule from §HIshar-mla§!. Her size has now become immeasurable due to the devouring of massive Shroud entities. The time to devour all sustenance has come...\n\nIn an instant, the ships and stars in the sky of the capital vanished, leaving behind only darkness. All of our connections with other colonies have also been severed, as if the whole world remain. \n\n§Buhahaha... have your pitiful information processing organs understood what's happening yet...§!  §HIshar-mla's§! whispers echoed through the psionic network. The good news is that thanks to §HIshar-mla's§! help, we can understand what has happened from a high-level perspective; the bad news is that most people cannot withstand such a scene.\n\n§HIshar-mla§! has invaded the material universe, and between her bare legs... the galaxy is like a faint wisp of smoke that is no larger than the palm of a hand. Star systems are like grains of sand in the smoke, not to mention the even more minuscule planets within them."
  # 祂想要从我们这里得到什么
