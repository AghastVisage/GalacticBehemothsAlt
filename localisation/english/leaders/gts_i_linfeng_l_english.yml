  #  “别……别这样……不是说好只是玩一下吗……”\n你抬起头来看着林凤，她正满脸宠溺的看着桌上对她而言和灰尘没什么区别的你，只是……她身上仅仅只披了一件薄薄的外套，而且她并没有将外套拉上，她将自己的酥胸几乎完全暴露在了你的面前。\n“是玩一下哦，玩一下‘过家家游戏’而已~”\n她将自己的双乳完全压在了你所在的桌上，你看着眼前如同山岳般巨大的乳球，完全不知道在这种体型差距下到底要怎样才会和她玩她所说的“过家家游戏”。\n“乖宝宝，张嘴~啊——”\n“不不不……不要这种过家家啊！我是成年人，不是那种幼儿，你别……给我留点面子……别——”\n林凤完全无视了你的话语，你的身躯被她的魔力托举着缓缓升起飘在了她的乳首前，你看着眼前那比你的身躯还要巨大的乳首，很难想象林凤居然会相用这样恐怖尺寸的东西给自己喂奶……\n林凤一只手轻轻按揉着你眼前的那团乳球，她的手指时不时地轻轻揉捏着乳首，不时地从中挤出些许散发着淡淡乳香的乳汁，就像是在诱惑着你一样，引诱着你主动向她发出一个乖宝宝的请求。\n那淡淡的乳香缓缓飘入你的鼻腔中，那清新的乳香让你感到异常的舒适，舒适到原本不能接受的事情现在似乎也不是不能被接受……\n“妈……妈妈——”\n“真棒~乖宝宝，张嘴~”\n你顺应着她的话语缓缓张开了自己的嘴，一股温热的热流缓缓涌入你的口中，没有想象中的激烈，就像是一位母亲在哺育自己的孩子一般，温柔、让人安心，让人忍不住的想要在这个时候把眼睛闭上，依偎在她温暖的怀抱中沉沉睡去……\n当你再次醒来时你已回到了旗舰上，而林凤现在正以天体级的大小悬浮在旗舰前，在她的面前有三块不同颜色的水晶，她眯眼看着旗舰缓缓开口。\n“好啦，忙活完了呢，接下来就该让你们做选择题咯~想要这双高跟呢，还是这双靴子呢，还是说……你们想要这双凉鞋~？”
  gts_linfeng.308.desc: "\"Don't... don't be like this... didn't we agree to just play for a bit...\"\nYou looked up at Linfeng; she was looking down at you on the table with a face full of doting, you who were no different from dust to her. However... she was only wearing a thin coat, and she hadn't zipped it up, almost completely exposing her soft breasts before you.\n\"It is just playing a bit, just a 'playing house game'~\"\nShe pressed her breasts completely onto the table where you were. Looking at the mountain-sized breasts before you, you had no idea how one could possibly play the \"playing house game\" she mentioned with such a size difference.\n\"Good baby, open your mouth~ ah—\"\n\"No no no... not this kind of playing house! I'm an adult, not a toddler, don't... save some face for me... don't—\"\nLinfeng completely ignored your words. Your body was lifted by her magic and floated slowly before her nipple. Looking at the nipple that was larger than your entire body, it was hard to imagine that Linfeng actually wanted to use such a terrifying-sized thing to breastfeed you...\nLinfeng gently massaged the breast before you with one hand, her fingers kneading the nipple from time to time, occasionally squeezing out some milk that emitted a faint milky fragrance, as if tempting you, enticing you to actively make a request of her like a good baby.\nThat faint milky scent slowly drifted into your nose. The fresh milky fragrance made you feel exceptionally comfortable, so comfortable that things that were originally unacceptable now seemed not entirely unacceptable...\n\"Ma... Mama—\"\n\"Wonderful~ Good baby, open your mouth~\"\nYou followed her words and slowly opened your mouth. A warm flow slowly poured into your mouth, not as intense as imagined, but just like a mother nursing her child, gentle and reassuring, making one want to close their eyes at this moment and fall into a deep sleep snuggled in her warm embrace...\nWhen you woke up again, you were back on