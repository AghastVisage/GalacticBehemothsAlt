  gts_linfeng.225.name: "Unknown Pink Threat"
  #  “呜……呜呜……我愿意……我什么都愿意……” 废墟中，传来了希瞳破碎的哭腔，“求求你……放过他们……用我……用我来换……”\n“用自己来换取你的国家的安全么？倒也很有意思呢，但是呢——\n我为什么不把你和你的国家都变成我的囊中之物呢？”\n“不会真信了吧～？逗你玩的呢，成为了我的女仆，可就要永生永世全心全意的为我服务哦，倘若你有一丝异心……我会让你死的很难看哦。”\n“哦……差点忘了呢，你的国家。看在你的态度还不错的份上，勉为其难的陪你们玩玩过家家游戏吧。
  gts_linfeng.225.desc: "“Ugh... wuwu... I'm willing... I'll do anything...” From the ruins came Xitong's broken sob. “Please... let them go... take me... take me instead...”\\n“Trading yourself for your country's safety? Quite interesting, but then—\\nWhy shouldn't I just take both you and your country as my belongings?”\\n“You didn't really believe me, did you? Just kidding~ Once you become my maid, you must serve me heart and soul for all eternity. If you have even a hint of betrayal... I’ll make sure you die a very ugly death.”\\n“Oh... almost forgot about your country. Since your attitude isn't bad, I’ll reluctantly play house with you all for a bit.”"
