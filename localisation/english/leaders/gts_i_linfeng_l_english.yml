  #  “您难道不知道么？林凤大人可以随心所欲的制造各种各样的分身，分身的长相身材能力以及拥有多强的力量完全由林凤大人决定。至于我嘛，我恰好是林凤大人的高阶分身之一，在此之前一直作为贴身女仆为林凤大人服务呢。”
  gts_linfeng.305.a.response: "“Don't you know? Lord Linfeng can create all sorts of clones at will. Their appearance, figure, abilities, and power are entirely decided by Lord Linfeng. As for me, I happen to be one of her high-level clones, having served as her personal maid before this.”"
  #  *你和林凤……不会有矛盾吗？
  gts_linfeng.305.b: "*Won't you and Linfeng... have conflicts?"
  #  “分身的存在完全依附于林凤大人呢，就算某个分身的力量已经强大到了能够击败林凤大人的地步，只要她一个念头分身和分身的力量就会被直接回收到林凤大人的身体里哦。和她起矛盾，我们可不会有这样的念头。”
  gts_linfeng.305.b.response: "“The existence of a clone depends entirely on Lord Linfeng. Even if a clone becomes powerful enough to defeat her, she can reclaim the clone and its power into her body with just a thought. Having a conflict with her? We wouldn't even dream of it.”"
  #  *分身的用途……
  gts_linfeng.305.c: "*Uses for the clones..."
  #  “用途……其实分身并没有什么特定的用途，每个分身用来做什么也只是林凤大人一句话一个念头的事情而已。我嘛……在女仆身份之外，我还是林凤大人的……情趣用具。”
  gts_linfeng.305.c.response: "“Uses... actually, there is no specific use. What each clone does is entirely up to Lord Linfeng's whim. As for me... besides being a maid, I am also Lord Linfeng's... adult toy.”"
