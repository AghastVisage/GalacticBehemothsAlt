  gts_linfeng.308.c.custom_tooltip: "\"Oh~? You're a scent-loving little insect~ But well, I also like boots myself~ Then... I'll give you these ankle boots.\"\nLinfeng waved her hand and then disappeared into the starry sky.\nWe detected a star system we hadn't discovered before. In that system, there is a pair of ankle boots, which seems to be the one granted to us by Linfeng."
