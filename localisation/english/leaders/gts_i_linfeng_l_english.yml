  gts_linfeng.901.desc: "The video starts playing. This video is a bit too clear, so clear that people can clearly feel that this is absolutely not a technology level we can achieve, even... not technology at all\n\nThe video seems to be shooting at the space station. Strange... we didn't send engineering ships to that location for space operations...\n\nThe space in the video shook strangely, and then... a pink-haired woman... no, a pink-haired fox woman appeared in space. Her body size... completely celestial level...\n\nThose satellites originally orbiting the colony were gradually captured by the gravity emitted by her body, and then... those satellites strangely gathered towards the same location. Incredible...\n\nThen she crushed all those gathered satellites with two fingers like pinching a mosquito. What took us three full years to complete... was crushed by her like a mosquito...\n\nShe slowly unbuttoned her chest, gently pulling away the tie and necklace blocking her chest with the other hand. The breasts covered by clothes were exposed in front of us...\n\nSo white...\n\nThe space station... The space station was also captured by the gravity she emitted, but we were powerless about it. After all, when this event broke out, we were completely unaware\n\nThe space station drifted slowly towards her body, towards her chest... drifting slowly towards her cleavage, falling between the breasts emitting strong milky fragrance\n\nWe saw sparks appearing between her breasts, but she seemed not to feel it at all...\n\n“Mmhmm~ I know, you will see this video”\n\nThat familiar female voice came from the video. She actually knew we would watch the video long ago?\n\n“Before destroying you, let me do a simple self-introduction~ You can call me Linfeng. Of course, other titles are also fine”\n\nHer face could not be seen in the video, only her upper body... seeing her using her hands to gently knead her breasts from both sides, as if grinding the space station that just fell in completely\n\n“As for why using you—just because it's fun”\n\nOther human voices came from the video at this time. It seems the crew on the engineering ship found the abnormally activated recording function\n\n“How to open the recording... Oh my god...”\n\n“What the hell, let me see... Heavens... Maintain silence! Don't let her find us...”\n\n“Should be done recording right~? Next—time to 'turn off' the video”\n\nThen, the first perspective of the video approached her body constantly. Judging from the screams constantly coming from around, the engineering ship should have been forcibly pulled to her side by some special power of hers, and the crew inside died in this process\n\nThen, we saw her sending the engineering ship towards her lower body...\n\nEven in a slightly opened state, it is so huge. This size, even if we put our planet in, probably can't meet her needs...\n\nFinally, the content of the video only left pink tender meat hole folds, and occasional soft moans from outside..."
