  # Original: “哈？你不给——那我可就要自己来拿了，我可不保证我会对你的子民们做什么呢，毕竟……他们和我本来就不是同族”\n\n“让我瞧瞧看，这次用什么体型呢～”\n\n画面里林凤那庞大的身躯消失了，接着画面便切换到了§Y[event_target:gts_linfeng_target_planet.GetName]§!上——\n\n林凤以百倍大的体型降临到了我们的城市中，我的天哪……她的身材怎么看着那么不对劲，她是不是调了胸部的大小？！\n\n林凤看了看周围的环境——这座城市里的高楼大多只有她的小腿一般高，只有市中心的一些楼房能够达到她大腿或是腰部的高度，看起来她是要毁掉那些楼房了……不要紧，我们很快就能重建这一切的……\n\n但……她选择无视掉了那些低矮的楼房，径直跨越了一片又一片的居民区，甚至造成的人员伤亡都仅仅只停留在了三位数的水准，这不像她\n\n她走进了市中心，缓缓靠近了那栋这座城市当中最高的大厦，这座大厦的高度刚刚好能够到她的下巴\n\n好吧，看来这座大厦要成为她立威用的祭品了……\n\n不……不对，她怎么把她一直戴着的项链给取下来了？\n\n林凤解开了胸口的扣子，让那对被紧紧挤压在狭小的衣物中的双乳从中迅速挣脱，尽管挣脱衣物的束缚后她也仅仅只是露出了完整的乳沟和内侧的大部分乳肉而已，完全谈不上什么少儿不宜的水平……\n\n林凤将双手伸进自己的乳沟中，然后轻轻向外拨开，她那一直佩戴着的领带在此刻相当配合的落入两乳之间，就像是在刻意引诱我们观察那里一样……\n\n她用手抵着自己的双乳将它们缓缓移到大厦的两侧，然后慢慢挪开了自己的双手，用自己那对丰硕的乳肉轻轻夹住了大厦\n\n这么看，她似乎还挺温柔的？\n\n画面被切到了大厦里的人们的视角上，这大概是接近顶楼的位置，视野完全被那洁白软嫩的乳肉所覆盖，那特制的钢化玻璃在她那丰硕柔软的乳肉的挤压下微微变形，整栋坚固的大厦在她的双乳面前却脆弱的像是一栋木房子一样，不断的发出一阵又一阵叫人心烦头疼的噪音\n\n林凤用双手轻轻挤压着自己的双乳，用它缓慢的挤压摩擦着两乳间的大厦，时不时的拖动着胸部上下摩擦着，就像是在为一位futa巨娘乳交一样\n\n但对大厦中的人们而言，这可就不是什么关于性的活动了——而是关乎他们生死的残酷行径\n\n坚固的墙壁在一瞬间便被那看似柔软的乳肉所挤碎，只是几秒钟的时间这边的职员便与另一头的职员相会，而他们的身边是林凤那丰硕柔软的乳肉，和被彻底破坏的大厦的碎片以及那些在这场灾难中不幸被林凤挤成碎肉的同事们\n\n这座可怜的大厦在林凤对它的乳交中还没撑上一分钟便被彻底毁坏，林凤有些失望地看着自己怀里的建筑废墟，然后将它们随手丢在了地上，顺带着切掉了我们的画面显示……\n\n一段时间后，空间站发来了§Y[event_target:gts_linfeng_target_planet.GetName]§!的卫星图……\n\n大陆上消失了几座城市，取而代之的是数不清的土褐色的脚印与成片成片的废墟……
  gts_linfeng.102.desc: "“Ha? You won't give it to me—then I'll have to take it myself. I don't guarantee what I'll do to your people, after all... they and I are not of the same race anyway.”\n\n“Let me see, what size for this time~”\n\nThe massive figure of Linfeng disappeared from the screen, and then the view switched to §Y[event_target:gts_linfeng_target_planet.GetName]§!—\n\nLinfeng descended into our city with hundred times the size. Good heavens... her figure looks so wrong, did she adjust her breast size?!\n\nLinfeng looked around—most of the buildings in this city were only as high as her calves, only some buildings in the city center could reach the height of her thighs or waist. Looks like she is going to destroy those buildings... It hurts, but we can rebuild all this soon...\n\nBut... she chose to ignore those low buildings and walked straight across residential area after residential area, even the casualties caused remained only in triple digits. This isn't like her.\n\nShe walked into the city center and slowly approached the tallest building in the city. The height of this building just reached her chin.\n\nWell, looks like this building is going to be the sacrifice for her demonstration of power...\n\nNo... wait, why did she take off the necklace she always wore?\n\nLinfeng unbuttoned her chest, letting the pair of breasts tightly squeezed in tight clothes break free quickly. Although after breaking free from the clothes, she only exposed the complete cleavage and most of the inner breast flesh, completely not reaching the level of unsuitable for children...\n\nLinfeng put her hands into her cleavage, then gently pulled outward. The tie she had been wearing cooperated quite well at this moment and fell between her breasts, as if deliberately tempting us to observe there...\n\nShe pressed her breasts with her hands and slowly moved them to both sides of the building, then slowly removed her hands, gently clamping the building with her plump breast 