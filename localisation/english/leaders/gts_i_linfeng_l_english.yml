  #  “嗯~很不错哦，我也很喜欢高跟呢。这双就送你们啦~记得自己签收~”\n林凤将她的一双高跟鞋丢在了一片我们未曾探索过的星系中，现在我们可以前往那片星系殖民她的鞋子了。
