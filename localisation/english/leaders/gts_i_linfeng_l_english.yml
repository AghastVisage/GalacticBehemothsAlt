  # Original: “哈？你不给——那我可就要自己凭本事来拿了，这可是你们自己说的呢，我向你保证，这一次的体型即便是你们派出了反抗力量也绝对无法撼动的～好好享受被我蹂躏的感觉吧，小虫子～♡”\n\n画面里林凤那庞大的身躯消失了，接着画面便切换到了§Y[event_target:gts_linfeng_target_planet.GetName]§!上——\n\n不对……这画面怎么看都像是卫星图……\n\n接着，我们便看着卫星图上的超级大都市在一瞬间被林凤那足以遮天蔽日的足部所覆盖，在左下角显示着的遇难者人数正在直线上升……\n\n“哈～这就是你们在这颗星球上建造的规模最大的城市么\n\n～？明明怎么看都是一块黑色的小苔藓吧～只是一脚就轻易覆盖了呢～♡”林凤故意左右碾动着那早已在她的黑丝玉足之下覆灭的城市，就像是在提醒我们违抗命令的下场一样……\n\n“嗯哼哼～”\n\n林凤的声音听起来相当愉悦，她非常享受这种将世间万物践踏在她足下的感觉……可恶……\n\n“嘛，踩起来的感觉还不错呢，所以我决定——赐予你们一个机会，一个能和我的足部亲密接触的机会～♡”\n\n林凤缓缓褪下了那包裹着她足部的丝袜，将她那洁白嫩滑且水润的玉足完全暴露在空气之中，暴露在整个大陆甚至是整个世界的人的视野之中\n\n人们只要抬起头来就能够看到林凤那近乎完美的玉足，人们能够清楚的看到她的足底上的一切，那足底纹路清晰可见，纹路之中还卡着海量的城市废墟和侥幸没被踩死的幸存者\n\n“好啦～欣赏的差不多了吧，接下来……就请你们去死吧～♡”\n\n然后，她降下了她的裸足，将整片城市群都碾在了她那白嫩美丽的玉足之下，而这整片城市群的消亡都没能在她的足下留下一点脏污\n\n接着，她又轻轻翘起她的足部，将整片大陆都一同带向天空，再用另一只脚给予它毁灭……\n\n不过好在，林凤还是比较慷慨的，那些死难者在她的足下重新复原了，至少我们没有因此损失人口\n\n但……她在抢走缩小资源的同时还将§Y[event_target:gts_linfeng_target_leader.GetName]§!缩小带走了，希望她们不会有意外……
  gts_linfeng.112.desc: "“Ha? Won't give it? I'll take it... this time the size is unshakeable...”... Linfeng crushed city... rubbed feet... took away leader..."
  # Original: “您好～一对一专属送餐服务，您的餐品已到达，请查收～”\n\n门外传来了无比熟悉的声音，只是这声音对此刻被缩小的林凤而言，有些过于的“吵闹”了\n\n“啊……听着就头疼……呃，不，不会真是她来送餐吧……”\n\n实验室的大门缓缓打开，林凤看见了此刻她最不想看见的人的身影——身着女仆装的艾普露\n\n艾普露端着一份厨师长为林凤精心烹饪的营养套餐缓缓走近研究台，然后将它放在了一旁的桌上\n\n而林凤，她已经把头埋进了木塞的孔洞里，祈求这艾普露不要发现被意外缩小的她，但这种掩耳盗铃的行为显然没法隐藏她的踪迹，更何况林凤自己那粉色的头发实在是过于显眼了，想看不见她都难\n\n“哎呀……瞧瞧这是谁呢～？”\n\n艾普露的声音从上空传来落入林凤的耳中，但林凤仍然把自己的上半身埋在孔洞里，只把自己的尾巴暴露在外面……就像鸵鸟一样\n\n“这个木塞上怎么长毛毛了呢～？仔细一看还是个狐萝卜呢，呀，还是粉色的～”\n\n“呜哇哇哇！”\n\n艾普露轻轻捏着林凤的大尾巴将她的身体从木塞的孔洞里拔了出来，她眯眼看着正在拼命挣扎扑腾的林凤，不禁的笑出了声\n\n“哎呀呀，之前到处横行霸道的天体级粉色狐狸，怎么今天变得这——么小了呢～？”\n\n艾普露将林凤的身体缓缓捏到自己的眼前，仔细的观察着眼前这只已被缩小到只有自己体型的百分之一大小的小狐狸，现在的她已完全没有了曾经那令人不敢直视的威压，只剩下了娇小身躯散发出的可爱软糯的气息，和那看起来就非常好欺负的体型\n\n就算是被人丢进鞋子里了恐怕也只敢在嘴上抱怨一下吧～\n\n“你你你你你……”\n\n林凤颤抖的看着眼前那翠绿色的巨大眼眸，大声叫喊着试图让自己至少在气势上压过艾普露一头\n\n但很显然——\n\n“放开我！不放开我的话你就等着被……呜呜呜！疼疼疼……嘤……错了错了……”\n\n艾普露只是用另一只手轻轻捏了下林凤的双腿，便让林凤感受到了难以忍受的剧痛，让林凤尖叫着向她服了软\n\n“怎么只是捏一下就不行了呢～？林凤大人未免也太——杂鱼了吧～？羸弱不堪的身体，感觉和您平时享用的小虫子没什么区别呢……”\n\n艾普露将林凤的身体缓缓下移，让她直面着自己那微微张开的小嘴\n\n而林凤，她看见了她粉红的唇瓣后微微遮掩住的虎牙，看见了那些锋利洁白的牙齿间夹着的属于小人的残肢断臂还有那即便已死也依旧保持着死前绝望面容的头颅……\n\n那是艾普露的嘴里残留着的她享用的上一餐的“美食”，她就好像是在威胁林凤一样，为她展示着自己口中的一切\n\n“你……你想做什么……？呃……很抱歉，我对我之前对你所做的一切感到非常抱歉……别，别把我放进去……”\n\n“你做错了什么呢～？”\n\n艾普露反问道\n\n而林凤却又低下了头，看着自己下方那如同万丈深渊一般的实验室地板，又抬起了头看着艾普露的口腔\n\n“你没错什么呢～那些都是因为体型而产生的事情而已呢，我不在意这些～”\n\n“真的……吗？”\n“当然——”\n然后，艾普露将林凤丢进了自己的嘴里\n
