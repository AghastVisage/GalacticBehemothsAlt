  gts_linfeng.222.desc: "After receiving the order, Hitomi clicked her tongue impatiently. An aboriginal planet she was playing with in her hand was casually tossed into deep space like trash—the unlucky planet struck an asteroid belt in flight and instantly exploded into a brilliant firework, but Hitomi didn't even bother to glance back.\\\\n\\\"How troublesome... I was just starting to get a feel for it.\\\"\\\\nAlthough complaining, her obedience as an Imperial Shipgirl made her move. A flash of light from space fold, and the next second, Hitomi's figure appeared in the border star region.\\\\nWhen she saw that giant pink figure in the distance, her golden pupils contracted slightly. (No Imperial ID, no energy circuit reaction... is it just a slightly larger wild creature?)\\\\n\\\"For a wild Giantess, she looks quite good. I'll just catch her and keep her as a pet.\\\"\\\\nHitomi sneered, not even fully unfolding her combat stance. Hitomi casually lifted her hand, and several blue-colored antimatter energy balls instantly condensed in her palm. This was enough firepower to instantly vaporize a joint fleet; she felt it was enough to give \\\"face\\\" to use it as a \\\"greeting.\\\"\\\\nEnergy balls trailed long flame tails, accurately booming toward Linfeng's face. However, the expected explosion and screams did not appear. Hitomi was stunned. Those few energy balls, enough to pierce through a planetary crust, seemed to have hit an invisible wall thousands of kilometers away from Linfeng's nose without even causing a ripple, and vanished... just like that.\\\\nLinfeng's purple eyes, which had been half-squinted, slowly opened a crack. She didn't even change her originally lazy floating posture, merely tilted her head slightly and looked at Hitomi floating in the air.\\\\n\\\"Oh my... I didn't expect it.\\\"\\\\n\\\"Does the tiny people's civilization also keep beings who are countless times more powerful than them?\\\"\\\\n\\\"Clearly possessing a body that could treat everything in the stars as playthings, yet still willing to degenerate and wear a collar to serve as a watchdog for insects... it must be quite humiliating for you.\\\"\\\\n\\\"But since you've already attacked me, don't blame me for fighting back~\\\"\\\\nThe smile at the corner of Linfeng's mouth deepened; it was the specific tenderness of a hunter looking at prey that had fallen into a trap.\\\\nBefore Hitomi could refute, she saw Linfeng gently lift a finger, merely a simple tap of the fingertip. In an instant, the originally black and cold space vacuum was dyed a startling crimson. Fireballs. The most basic, unadorned fireballs, but in a number completely beyond calculation.\\\\n\\\"This kind of thing—!\\\" Hitomi subconsciously propped up a shield, attempting to mock such a primitive attack. But the next second, her expression changed. When the first fireball hit the shield, she felt as if she had been hit head-on by a star. \\\\nImmediately following were the second, third, ten-thousandth... Hitomi's vision was instantly engulfed by endless flames. Her proud absolute defense was as fragile as a piece of cling wrap before this wave of fireball magic, lasting less than three seconds before shattering.\\\\nAfter an unknown amount of time, the frequency of the attacks slowly slowed down. She was deliberately controlling the rhythm—like the leisure of playing with prey until it's half-dead. While carelessly suppressing Hitomi in place with several giant fireballs, Linfeng elegantly floated closer, looking down from above at the battered Hitomi.\\\\n\\\"Although I don't mind letting you be buried with these little insects, I'm still quite willing to spare your life. After all, it's rare to find one of the same kind~\\\"\\\\nLinfeng extended a giant finger, gently lifting Hitomi's chin, which was already full of dust and scars, forcing her to look up.\\\\n\\\"As long as you're willing to beg for mercy~ how about it? It's a very fair deal, isn't it?\\\"\\\\nHitomi breathed heavily, her golden slit pupils trembling from pain and humiliation, but still staring deathly at the terrifying fox girl before her.\\\\n\\"
  gts_linfeng.222.a: "\"She's heading toward the capital planet?!\""
  #  未知的粉色威胁
  gts_linfeng.223.name: "Unknown Pink Threat"
  #  战斗结束得比任何人想象的都要快。 曾经不可一世的希瞳，此刻像是一个坏掉的玩偶，四肢被几道紫色的魔力锁链死死缠绕。她只能眼睁睁看着那个粉色的恶魔——林凤，用一种近乎散步的悠闲姿态，拖着她向那个她发誓要守护的母星飘去。\n随着距离的拉近，庞大的粉色阴影彻底笼罩了首都星。 大气层在林凤那恐怖的质量面前瑟瑟发抖，引发了全球范围的强对流风暴。地面上的人们绝望地抬头，看到的不再是天空，而是林凤那巨大的裙摆。\n“啊……走了这么多维度的路，脚稍微有点闷呢。”\n林凤停在了首都星的平流层之上，声音慵懒而妩媚。她无视了下方无数防空警报的凄厉尖叫，自顾自地抬起了那条修长的右腿，巨大的手掌搭上了高跟短靴边缘。\n伴随着皮革摩擦的声响，那只比整座首府城市还要巨大的黑色短靴被缓缓褪下。 一股肉眼可见的热气瞬间从靴筒中涌出，这股对于常人来说足以致死的“毒气”，直接在大气层中扩散开来。在那令人窒息的热浪中，一只包裹着黑色丝袜的玉足暴露在了空气中。 因为长时间的包裹，黑丝紧紧地贴合在她的肌肤上，勾勒出脚掌完美的肉感弧度。甚至能看到丝袜足底部分因为汗水浸透而呈现出更深的黑色。\n“希瞳酱，你说……这只脚要是踩下去，那个像积木一样的宫殿，会变成什么样呢？”\n林凤回过头，屑屑地笑着。还没等希瞳回答，她手指一勾，魔力锁链猛地收紧，将希瞳强行拖到了自己的脚下。\n“唔！你……你想干什么……” 希瞳惊恐地挣扎着，但她的脸颊已经被林凤那只散发着浓烈气味的黑丝玉足死死抵住。\n“嘘。别说话，好好看着，好好闻着。”\n林凤猛地发力，那只巨大的黑丝脚踩着希瞳的后脑勺，像是在踩一块垫脚石一样，带着希瞳的头颅狠狠地向下方那个象征着最高权力的总统府压去。希瞳发出了撕心裂肺的惨叫，但无济于事。 她的脸被迫紧紧贴着地面，视野里是惊恐逃窜的同胞。 而在她头顶，是那只正在无情施压的巨大黑丝脚掌。没有什么奇迹发生。 希瞳那张精致的脸庞，在林凤脚掌的巨力下，狠狠的贴到了地上。她亲眼看着自己的脸颊挤碎了总统府的穹顶，亲身体验着数百万人瞬间化为肉泥的触感。整座首府城市，就这样被林凤踩着希瞳的头，硬生生地碾成了一个巨大的凹陷深坑。\n林凤满意地看着脚下这幅“杰作”，脚趾隔着黑丝，在希瞳的头顶轻轻磨蹭了两下，像是在擦掉脚底沾染的灰尘。”
  gts_linfeng.223.desc: "The battle ended faster than anyone could have imagined. Once-arrogant Hitomi now looked like a broken doll, her limbs tightly bound by several purple magical chains. She could only watch helplessly as the pink demon—Linfeng—floated toward the home planet she had sworn to protect with an almost leisurely strolling posture, dragging her along.\\nAs the distance closed, the vast pink shadow completely shrouded the capital planet. The atmosphere trembled before Linfeng's terrifying mass, triggering global-scale strong convective storms. People on the ground looked up in despair, no longer seeing the sky, but Linfeng's giant skirt.\\n\"Ah... walking through so many dimensions, my feet are feeling a bit stuffy~\"\\nLinfeng stopped above the stratosphere of the capital planet, her voice lazy and charming. Ignoring the shrill screams of countless anti-aircraft alarms below, she casually lifted her long right leg, her giant palm resting on the edge of her high-heeled ankle boots.\\nWith the sound of leather friction, that black ankle boot, larger than the entire capital city, was slowly slipped off. A visible surge of heat instantly poured out from the boot; this \"poisonous gas,\" enough to be lethal for ordinary people, directly diffused in the atmosphere. In that suffocating heatwave, a jade foot wrapped in black silk stockings was exposed to the air. Due to long-term wrapping, the black silk clung tightly to her skin, outlining the perfect fleshy arc of her foot. One could even see the soles of the stockings appearing a deeper black due to being soaked in sweat.\\n\"Hitomi-chan, tell me... if this foot were to step down, what would that building-block-like palace become?\"\\nLinfeng turned back, smiling mischievously. Before Hitomi could answer, she hooked her finger, and the magical chains suddenly tightened, forcibly dragging Hitomi beneath her foot.\\n\"Ugh! You... what do you want to do...\" Hitomi struggled in horror, but her cheek was already firmly pressed against Linfeng's black-silk-wrapped jade foot, which emitted a strong scent.\\n\"Shh. Don't speak, just watch well, just smell well.\"\\nLinfeng suddenly applied force, that giant black-silk-wrapped foot stepping on the back of Hitomi's head like a stepping stone, bringing Hitomi's head crashing down toward the presidential palace below, which symbolized supreme power. Hitomi let out a heart-wrenching scream, but to no avail. Her face was forced tightly against the ground, and in her field of vision were her terrified fleeing compatriots. And above her head was that giant black-silk-wrapped sole mercilessly applying pressure. No miracles occurred. Hitomi's exquisite face was slammed into the ground under the giant force of Linfeng's sole. She personally watched her cheek crush the dome of the presidential palace, personally experiencing the sensation of millions of people instantly turning into meat paste. The entire capital city was thus hard-grinded into a giant sunken pit by Linfeng stepping on Hitomi's head.\\nLinfeng looked at this \"masterpiece\" beneath her foot with satisfaction, her toes rubbing gently over Hitomi's head through the black silk, as if wiping off the dust stained on her sole."
  #  未知的粉色威胁
  #  给凑粉毛一拳
  gts_linfeng.224.name: "A Punch for the Smug Pink Fox"
  #  一切发生得都很突然，也很……儿戏。\n也许是长期被当作玩物积攒的怨气，也许只是单纯的脑回路短路。在那个普通的午后，维持着常人大小的希瞳，面无表情地看着眼前正凑过来想要调戏她的林凤，鬼使神差地挥出了拳头。\n“砰！”\n一声清脆又略带空洞的闷响。 仿佛敲在了一个熟透的好瓜上。\n空气凝固了三秒。\n林凤愣住了。她两只手立刻捂住脑袋顶上被敲的地方，整个人缩了一下。头顶那对粉色的狐狸耳朵瞬间变成了“飞机耳”，死死地向后压去。 她抬起头，那双桃花眼里泛起了一层薄薄的水雾，脸颊气鼓鼓地成了包子，看起来竟然……意外地有点可爱？\n“你敲我头……” 林凤的声音里带着一丝不可置信，还有显而易见的委屈。 “很痛的哎！而且会长不高的你知不知道！”\n希瞳收回手，依然板着那张三无扑克脸，冷冷地说道：“手滑。谁让你凑过来的。”\n“唔……气死我了！气死我了！” 林凤像个被抢了糖果的小女孩一样在原地跺了跺脚，她恶狠狠地瞪了希瞳一眼。\n“我要还手！我现在就要敲回来！”\n话音未落，林凤的身影凭空消失。 还没等希瞳反应过来，天空……变色了。\n原本湛蓝的天空瞬间被一片漫无边际的粉色取代——那是林凤瞬间巨大化后的皮肤。希瞳僵硬地抬起头，看到了一幕让她后悔刚才那随手一敲的景象。在大气层之外，那张刚刚还因为委屈而气鼓鼓的脸庞，此刻已经变得比月球还要巨大。林凤依然鼓着脸颊，一只手捂着刚才被敲的头顶，另一只手却握成了足以覆盖半个大洲的巨拳。 她带着一副“我很生气、后果很严重”的表情，控制着那只巨拳，从外太空向着地表——也就是希瞳所在的位置，狠狠砸来。\n“这叫——礼、尚、往、来！”\n那个粉色的巨拳摩擦着大气层燃起了熊熊烈火，像是一颗灭世的陨石，带着毁灭一切的气势落下。\n“等……你管这叫‘敲回来’？！” 希瞳那万年不变的冰山脸终于崩不住了，眼角疯狂抽搐。\n轰隆————！！！\n没有给她吐槽的时间，巨拳落下。 地壳像是被重锤砸中的饼干一样瞬间崩碎，冲击波横扫了整个半球，海洋被瞬间蒸发，山脉被夷为平地。整颗星球都在这一拳的威力下发出了痛苦的呻吟，彻底偏离了原本的公转轨道。\n尘埃落定。 原本繁华的大陆板块中心，出现了一个深不见底的、巨大的拳印深坑。\n在那深坑的最中心，灰头土脸、衣衫褴褛的希瞳狼狈地躺在坑底。而肇事者——那个巨大的粉毛狐娘，正蹲在大气层外，用手指戳着这个深坑，脸上带着大仇得报的满足笑容\n“哼！扯平了！”
  gts_linfeng.224.desc: "Everything happened very suddenly, and very... childishly.\nPerhaps it was resentment accumulated from being treated as a plaything for so long, or perhaps just a brain circuit short-circuiting. On that ordinary afternoon, Hitomi, maintaining normal human size, expressionlessly looked at Linfeng who was leaning in close trying to tease her, and as if possessed, threw a punch.\n\"Bang!\"\nA crisp and slightly hollow thud. Like knocking on a ripe melon.\nThe air froze for three seconds.\nLinfeng was stunned. She immediately clutched the knocked spot atop her head with both hands, flinching back. The pink fox ears on her head instantly turned into \"airplane ears,\" pinned flat against her head. She looked up, a thin mist welling in her peach-blossom eyes, her cheeks puffed into buns in fury, looking... surprisingly cute?\n\"You hit my head...\" Linfeng's voice carried a hint of disbelief, along with unmistakable grievance. \"That really hurt! And do you know that stunts my growth?!\"\nHitomi withdrew her hand, still maintaining her deadpan poker face, and said coldly: \"My hand slipped. Who told you to lean in so close?\"\n\"Mmmgh... You make me so mad! So mad!\" Linfeng stomped her feet on the spot like a little girl whose candy had been stolen, glaring fiercely at Hitomi.\n\"I'm going to hit back! I'm going to knock you back right now!\"\nBefore the words fell, Linfeng's figure vanished into thin air. Before Hitomi could react, the sky... changed color.\nThe originally azure sky was instantly replaced by a boundless expanse of pink—that was Linfeng's skin after she instantly grew to colossal size. Hitomi stiffly lifted her head, beholding a sight that made her regret that casual knock from earlier. Outside the atmosphere, that face—which had just been puffed up in grievance—had now grown larger than the moon. Linfeng was still puffing her cheeks, one hand clutching the knocked spot on her head, while the other clenched into a gigantic fist large enough to cover half a continent. With an expression that said \"I am furious, and the consequences will be dire,\" she guided that colossal fist down from outer space toward the surface—directly at Hitomi's position.\n\"This is called—give-and-take!\"\nThe pink giant fist ignited with blazing flames against the atmosphere, descending with the apocalyptic momentum of a world-ending meteorite.\n\"Wait... You call this 'knocking back'?!\" Hitomi's perpetual iceberg face finally broke, the corners of her eyes twitching wildly.\nRumble————!!!\nGiving her no time to complain, the giant fist crashed down. The planetary crust shattered instantly like a biscuit struck by a sledgehammer. The shockwave swept across the entire hemisphere, oceans vaporized instantly, and mountain ranges were flattened into plains. The entire planet groaned in agony under the force of this punch, completely knocked out of its original orbital path.\nThe dust settled. In the center of what was once a prosperous continental plate, a bottomless, gigantic fist-shaped crater had appeared.\nAt the very center of that deep crater lay Hitomi, battered, dusty, and in tatters, lying miserably at the bottom. And the culprit—that gigantic pink-haired fox girl—was crouching outside the atmosphere, poking the crater with her finger, a satisfied grin of sweet revenge on her face.\n\"Hmph! Now we're even!\""
  gts_linfeng.224.a: ""
  gts_linfeng.301.name: "Unknown Visitor"
  #  我们探测到了一处神秘的虚空裂缝，从中走出了一位有着粉色头发的少女。她有着几千公里的身高，像是散步一般在星空中漂浮。她似乎注意到了我们的观测，正带着一丝玩味的微笑看向我们舰队的方向。
  #  “你的意思是说……想要我为你的帝国提供一艘舰船，而那艘舰船就是我的身体，对么？”\n你抬起头来仰望着林凤的面容，而她则是满脸不悦的俯视着那艘你所在的帝国目前为止最为巨大的太空战舰——她正因你打扰了她用星球爱抚自己身体的行为感到不悦。\n“是的……帝国财政与目前的工业能力无法在短期内组织起一支足够防御外敌的舰队，而我们现在还有许多的威胁要应对……”\n你的话还没有说完，林凤便对着你的方向翻了个白眼，接着再将她手中的那颗无人星球握成了一片片围绕着她的拳头公转的行星碎片。\n“不用说那么多的原因呢，我只需要知道你需要我就行了。我当然不需要花费你的帝国的那么多的资源，不过——这并不代表你不需要让你的帝国付出些代价。”\n你听着她的话语咽了口口水，几滴冷汗顺着你的额头缓缓滑落，你不清楚她会让帝国付出何种代价，但可以预见的是，她索要的代价绝对会让你的帝国现状雪上加霜——\n“不用那么紧张呢，你的帝国当然支付得起~”\n听着她的话，你渐渐放松了你的身体。有她这句话做保证，她肯定不会提出什么过于恐怖的要求了……\n“一颗星球，我可不要那种无人星球呢，我要的是有人居住的宜居星球。”\n你愣愣的看着她，这种代价对帝国而言说不上沉重，但也并不廉价。\n“瞧你那表情……我当然不会在你的疆域内随机挑选幸运儿呢，这一次，牺牲‘谁’由你来决定哦~”\n说着，你的面前出现了一块漂浮着的暗紫色的水晶，那块水晶发着微弱的紫光，上面还印着一个淡紫色的六芒星，不仔细看的话都很难看出形状来。\n“想好了的话就把它放在那颗星球的总督府上，我会亲自来‘验收’~‘验收’完成后，我就会把你想要的舰娘交给你。”\n说完这话，林凤的身影便消失在了她召唤出的传送门当中，只留下了一片胡乱飘荡的行星碎片、一块破碎的星系与你所在的舰船。\n*做好决定吧，要牺牲一整个星球……
  gts_linfeng.301.desc: "\"You mean to say... you want me to provide a ship for your empire, and that ship would be my body, right?\"\nYou look up, gazing upon Linfeng's face, while she looks down with evident displeasure at the space battleship you are aboard—the largest ship your empire has built to date. She is clearly annoyed that you interrupted her while she was using a planet to caress her own body.\n\"Yes... The empire's treasury and current industrial capacity cannot muster a fleet sufficient to defend against foreign enemies in the short term, yet we still have many threats to confront...\"\nBefore you can finish your sentence, Linfeng rolls her eyes in your direction, and then crushes the uninhabited planet in her hand into planetary debris that begins orbiting her fist.\n\"No need to give so many reasons. All I need to know is that you need me. Of course, I won't cost your empire all that many resources, but—that doesn't mean you won't have to make your empire pay a price.\"\nListening to her words, you swallow hard, cold sweat trickling down your forehead. You have no idea what price she will demand from the empire, but it is foreseeable that the price she asks will certainly make your empire's dire situation even worse—\n\"Don't be so nervous, your empire can certainly afford it~\"\nHearing her say that, your body gradually relaxes. With that assurance from her, she surely won't make any overly horrifying demands...\n\"A planet. And I don't want an uninhabited rock; what I want is an inhabited, habitable planet.\"\nYou stare at her in a daze. Such a price is neither crushing nor cheap for the empire.\n\"Look at that expression on your face... Of course, I won't randomly pick a 'lucky winner' across your territory. This time, who gets sacrificed is up to you to decide~\"\nAs she speaks, a floating dark-purple crystal appears before you, emitting a faint purple glow and stamped with a light purple hexagram that is hard to make out without looking closely.\n\"Once you've made up your mind, place it on that planet's planetary capital. I'll personally come to 'inspect' it~ Once the 'inspection' is done, I'll hand over the Shipgirl you want.\"\nWith those words, Linfeng's figure disappears into a portal she summoned, leaving behind only randomly drifting planetary fragments, a shattered star system, and your ship.\n*Make your decision; an entire planet must be sacrificed...*"
  #  解锁一次性行星决议：在总督府安放水晶
  gts_linfeng.301.a: "Unlock one-time planetary decision: Place Crystal in the Planetary Capital"
  #  林凤的舰娘“改造”
  gts_linfeng.302.name: "Linfeng's Shipgirl \"Refit\""
  #  “你果然还是用了它呢，就像我预测的那样~”\n林凤的声音率先到达了这颗星球上，但好在你已经先一步到了星系的空间站上，地表的灾难现在已与你没有任何关系了。\n她的身躯缓缓从传送门中飘出，这一次她展现给你看的身躯要比之前你所见过的体型还要巨大，那颗星球现在在她的面前如同小玻璃珠一般大，只要她稍不注意就会将整颗星球连带着你所在的空间站一起粉碎在她的身躯上。\n“不用太担心这些小家伙呢，他们不会因此而丢了性命呢，最多也只是从此变成虫子而已。”\n她将手指缓缓放在星球的上方，她的指肚上缓缓飘出一环银白色的魔力，那环魔力缓缓降下围在了星球的周围，接着她轻轻挥动手指将整颗星球都囚禁在了那渐渐拥有实体的魔力之中。\n现在的星球从空间站上看就像是一个内部造型独特的有两环可以翻转的银环的吊坠，而林凤也确确实实的将它当做吊坠一样扣在了她的腰间。\n“不过是制作一个饰品而已啦，放轻松。”\n接着，她的目光看向了空间站。她将手指缓缓伸了过来，又在即将触碰到空间站时停下了她指尖的动作将其收了回去。\n“逗你玩玩而已。接下来该说正事了，你有两个选择——”\n“是想要正常造型的舰娘呢，还有想要futa型的舰娘呢~？”
  gts_linfeng.302.desc: "\"You really did use it, just as I predicted~\"\nLinfeng's voice reaches this planet first, but fortunately, you have already relocated ahead of time to the system's space station; the disaster on the surface has nothing to do with you anymore.\nHer body drifts slowly out of the portal. The body she reveals to you this time is vastly more colossal than anything you've seen before; the planet before her looks like a tiny glass marble, and with the slightest carelessness, she could crush the entire planet along with the space station you're on against her body.\n\"No need to worry too much about these little guys. They won't lose their lives over this; at most, they'll just turn into bugs from now on.\"\nShe gently hovers her finger above the planet. A ring of silvery-white magic drifts from the pad of her finger, slowly descending to encircle the planet. Then, with a casual flick of her finger, she imprisons the entire planet within that solidifying magic.\nFrom the space station, the planet now looks like a uniquely designed pendant with two flippable silver rings, and Linfeng indeed clasps it around her waist like an ornament.\n\"It's just making an accessory, relax.\"\nNext, her gaze turns to the space station. She extends her finger toward it, but just as her fingertip is about to touch the station, she stops and pulls it back.\n\"Just teasing you. Now onto serious business: you have two choices—\"\n\"Do you want a normal-looking Shipgirl, or a futa Shipgirl~?\""
  #  *还是正常造型的吧……另一个……我不能接受。
  gts_linfeng.302.a: "*Let's stick to the normal appearance... the other one... I can't accept.*"
  gts_linfeng.303.name: ""
  gts_linfeng.303.desc: "\"Since I'm here, I might as well stay for a while. Though, my 'appetite' might be a bit larger than you can imagine... I hope you won't mind?\""
  #  那是林凤大人的荣幸
  #  *起码不亏。
  gts_linfeng.303.a: "*At least we broke even.*"
  gts_linfeng.304.name: ""
  gts_linfeng.304.desc: "Linfeng giggled, then she gently extended her hand and snatched a science ship of our empire. Despite the desperate struggle of the crew, the ship was as fragile as a toy in her palm. She held it close to her eyes, observing the tiny sparks of the thrusters with fascination."
  #  请温柔点！
  #  *起码……有更多涩涩能看了。
  gts_linfeng.304.a: "*At least... there's more lewdness to see.*"
  #  林凤「战斗特化型分身」
  gts_linfeng.305.name: "Linfeng \"Combat-Specialized Clone\""
  #  “主人您好~我是林凤大人的女仆分身，从今往后就由我来负责您的饮食起居以及行程安排，您的帝国的作战相关事务林凤大人也已嘱托我替您处理了。您只需要安心坐在这里，看着我以及那个小家伙一起蹂躏您的敌人就好咯~”
  gts_linfeng.305.desc: "\"Greetings, Master~ I am Lady Linfeng's maid clone. From now on, I will be responsible for your daily life, meals, and scheduling. Lady Linfeng has also entrusted me to manage your empire's combat-related affairs for you. You only need to sit here comfortably and watch me and that little one trample your enemies together~\""
  #  *什么叫……分身？
  gts_linfeng.305.a: "*What do you mean... clone?*"
  #  林凤（分身）的星球改造
  gts_linfeng.306.name: "Linfeng (Clone)'s Planet Terraforming"
  #  “哈……忍不了了呢……”\n林凤满脸兴奋的用手挑逗着她胯下的肉棒，几艘属于敌国的舰船被她缓缓塞入了马眼之中，她感受着马眼中传来的快感随即发出了一声充斥着催情魔力的淫叫声，那声音通过她身体的魔力回荡在星间，让我们与敌人的舰队上的船员们都遭受到了不同程度的影响，一些船员们在这声音的影响下开始自发地在一些较为宽敞的舱室里进行了极为淫乱的性活动……\n即便这只是林凤的一个小小的分身也能够发挥出这种轻易影响大片生物的能力……难以想象如果是她本人的话这片星域里会发生些什么。\n指挥官满脸愁容的看着她的行为，因船员的性活动所造成的损失已超出了舰队能够承受的非战斗损耗了，在这种情况下也只能准许她用敌人的星球来泄欲了。\n“请求批准……收敛点，星球我们还要的。”\n“我就等着你这句话呢~♡”\n在得到准许后，林凤毫不犹豫的将她胯下的那头巨龙对准了[from.GetName]，然后将她的手轻轻放在了肉棒上开始迅速撸动起来。\n“孩子们已经等不及要和你们这些小贱虫见见面了呢~♡”\n她撸动的速度渐渐加快，在撸动的过程中还时不时地伸出手来将周围仍在试图将她驱离的敌国舰船丢到她的肉棒之上，任其在肉棒产生的引力下坠向肉棒或是在撸动的过程中被当场微不足道的颗粒感粉碎。\n“嗯哼哼~要来咯，小虫子们可要接好了哦，不要在这个时候全都死掉了呢~♡”\n接着她一挺腰肢，随即便是一阵足以让近地轨道被完全吞没的浓精从马眼之中喷发出来。\n那一阵阵的浓精先是将敌国星球周围的卫星与空间站尽数吞没溶解，再裹着太空中的陨石一片片地坠向地表。\n敌国星球上的人们绝望的看着天空中坠向他们的精液雨，数不清的生灵与城市被淹没在精液之中再被其中的精子当做食物一般的直接吞食，被转化为了更小些的“小蝌蚪”。\n浓稠黏腻的精液如天灾般的将整颗星球完全覆盖，无论是山川大陆还是深海汪洋都在这天灾般的精液暴雨下被无情的吞没，只留下了一颗已被精液完全覆盖改造的残破星球与在避难所中苟且偷生的幸存者们。\n“爽了呢~要是这个时候感官连着的话……我都不敢想本体会有多爽呢~♡”\n她兴奋地摇了摇尾巴，缓缓远离了那颗被她当做泄欲对象的小小星球。至于这片星域中的敌方舰队，在她的马眼之中或许还能找到些许残骸。
  gts_linfeng.306.desc: "\"Hah... I can't hold back anymore...\"\nWith an excited face, Linfeng teases the shaft between her legs with her hand. Several enemy ships are slowly pushed into her opening. Feeling the intense pleasure, she lets out an aphrodisiac-infused moan of ecstasy. The sound echoes through the stars carried by the magic of her body, affecting the crews of both our fleet and the enemy fleet to varying degrees. Under the influence of this sound, some crew members spontaneously engage in wild, wanton orgies in the more spacious compartments...\nEven though this is only a tiny clone of Linfeng, she can easily influence vast swathes of living beings... It is unimaginable what would happen in this star system if it were her true body.\nThe commander watches her actions with a face full of sorrow. The losses caused by the crew's sexual activities have already exceeded the non-combat attrition the fleet can bear. Under these circumstances, there is no choice but to grant permission for her to vent her lust on the enemy's planet.\n\"Request approved... Keep it in check, we still need the planet.\"\n\"I've been waiting for those exact words~♡\"\nWith permission granted, Linfeng points the dragon between her legs at [from.GetName] without hesitation, placing her hand gently upon her shaft and stroking rapidly.\n\"The children can't wait to meet you little vile worms~♡\"\nHer stroking speed accelerates, and she occasionally reaches out to grab enemy ships still attempting to drive her off, throwing them onto her shaft—letting them crash toward it under its gravitational pull or get pulverized as insignificant granules during her vigorous strokes.\n\"Mmnhh~ Here it comes! You little bugs had better catch it, don't all go dying right now~♡\"\nThen she thrusts her hips forward, and an eruption of thick semen capable of completely engulfing low-Earth orbit blasts forth.\nWaves of dense semen first completely swallow and dissolve the satellites and space stations around the enemy planet, then wrap around space meteorites and crash down toward the surface piece by piece.\nThe inhabitants of the enemy planet watch in despair as the rain of cum falls from the sky upon them. Countless lives and cities are submerged under the semen, devoured directly as food by the sperm within, and transformed into even smaller \"tadpoles.\"\nThe thick, sticky semen completely covers the entire planet like a natural catastrophe. Mountains, continents, and deep oceans are ruthlessly swallowed beneath this cataclysmic downpour of semen, leaving behind only a ruined planet fully reshaped and coated in cum, and survivors desperately clinging to life in shelters.\n\"That felt so good~ If my senses were connected right now... I can't even imagine how good the main body would feel~♡\"\nShe wags her tail in excitement and slowly drifts away from the tiny planet she used to vent her lust. As for the enemy fleet in this star system, perhaps a few scraps of wreckage can still be found within her shaft."
