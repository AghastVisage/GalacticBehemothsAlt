  gts_linfeng.308.b.custom_tooltip: "\"Sandals? Well then~ I'll just leave them here. Go and sign for them yourself~\"\nLinfeng's body gradually faded until we could no longer observe her.\nA star system we hadn't discovered suddenly appeared on our star map. In that system, there's a pair of extremely giant sandals, which is probably the colony Linfeng intended to grant us."
