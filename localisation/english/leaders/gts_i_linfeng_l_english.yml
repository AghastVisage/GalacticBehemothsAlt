  #  “想要用我的鞋子来当殖民地？你们这种生物也真是从不挑食呢，居然能想出在鞋子上建立殖民地……”\n林凤的言语通过灵能传递到了你与内阁成员们的耳中，尽管你们已身处帝国最强大的旗舰上，但你们却依然无法看清林凤那过分庞大的身躯的全貌，可以确定的是，这次她现身的体型要远比初见她时的体型巨大不知多少倍。\n你们唯一能确定的是，你们所处的这片星域大概率正处于林凤的趾缝间，毕竟就在旗舰之外，你的国民已因四处弥漫着的过于浓厚的足部清香而陷入了几乎无止境的性爱狂欢中。\n你试着借用林凤身上散发出的灵能来查看林凤现在的体型究竟有多大，然后你便猛然发现光是这些从她身上自然逸散出的魔力就能够轻易的将你压碎，想要借用她的魔力恐怕至少也得达到她千分之一的体型……\n“是的……帝国发展并不顺利，我们探索了许多星域都未能找到适合我们的种族生存的星球，恳请您能够大发慈悲，将您的鞋子赐予我们……”\n国务卿如此说着，你并不将希望寄托于用言语来让林凤听话，你很清楚想让林凤给予好处就必须为她献上相应的代价。\n“倘若——我说不呢？你们的帝国发展是很不顺呢，但这与我有什么关系呢~？我现在完全可以把你们的帝国变成我足趾间的玩物，让你们和你们那卑微的种族一起永生永世为我的一根小小的脚趾服务，让你们永远居住在一点比微生物还要小的足垢上呢~”\n“我们可以为此付出些……”\n国务卿的话还未说完便被一场意外所打断，旗舰所处的星域毫无征兆的爆发了一场宇宙风暴，对此毫无准备的舰队在风暴中不断摇摆飘荡着……\n“付出代价？哪怕你们真的愿意用整个帝国作为代价也完全不如的我一双鞋呢，你们真觉得……你们的帝国在我眼中很重要么？而且——”\n宇宙风暴在一瞬间便平静了下来，周围混乱的星空在一秒不到的时间内迅速恢复了正常。\n“我动动脚趾就能处理掉的风暴却能要了你们的命，你们的种族未免有些太脆弱了吧~？”\n一丝寒意由你的心间扩散至全身，你很确信她正在用某种方式观察着你的反应。她不在乎你的帝国，但她在乎你。\n“不过——我倒是可以恩赐给你们一点呢。但是，你——我要拿去玩上几天。不容拒绝~♡”
  gts_linfeng.307.desc: "\"You want to use my shoes as a colony? Your kind really isn't picky, coming up with the idea of founding a colony on shoes...\"\nLinfeng's voice transmits telepathically into the minds of you and your cabinet members. Although you are aboard the empire's mightiest flagship, you still cannot see the full scale of Linfeng's ridiculously enormous body. What is certain is that the size she displays this time is countless times greater than when you first saw her.\nThe only thing you can be sure of is that your current star system is most likely situated between Linfeng's toes—after all, just outside the flagship, your citizens have descended into a nearly endless frenzy of sexual ecstasy caused by the overwhelming, intense foot fragrance pervading everywhere.\nYou try to use the psionic power radiating from Linfeng's body to gauge just how massive she currently is, only to suddenly realize that the sheer magic naturally leaking from her could effortlessly crush you; to tap into her magic, one would likely need to reach at least one-thousandth of her scale...\n\"Yes... The empire's development hasn't been smooth. We have explored many star systems without finding a suitable planet for our species to survive. We beg you to show mercy and bestow your shoes upon us...\"\nThe Secretary of State says so. You do not place your hopes on convincing Linfeng with mere words; you understand very well that to receive favors from Linfeng, you must offer a commensurate price.\n\"And what if—I say no? Your empire's development might not be going well, but what does that have to do with me~? I could easily turn your empire into a plaything between my toes right now, forcing you and your lowly species to serve a single tiny toe of mine for all eternity, living forever on a speck of foot grime smaller than a microbe~\"\n\"We are willing to pay some...\"\nBefore the Secretary of State can finish, he is cut off by an unexpected event: a cosmic storm erupts without warning across the star system where the flagship is located, and the unprepared fleet rocks and drifts helplessly in the tempest...\n\"Pay a price? Even if you were willing to sacrifice your entire empire as payment, it wouldn't even match a single pair of my shoes. Do you really think... your empire matters to me? And besides—\"\nThe cosmic storm calms down in an instant; the chaotic starry sky returns to normal in less than a second.\n\"A storm I can dispel with a wiggle of my toes could take your lives. Isn't your species a bit too fragile~?\"\nA chill spreads from your heart through your entire body. You are certain she is watching your reaction in some way. She doesn't care about your empire, but she cares about you.\n\"However—I can bestow a little favor upon you. But as for you—I'm taking you to play with for a few days. No refusals allowed~♡\""
  gts_linfeng.307.a: "*For the Empire, even if I'm played with like a toy by this fox, I'm willing!"
