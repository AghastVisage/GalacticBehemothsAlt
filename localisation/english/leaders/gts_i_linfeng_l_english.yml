  # Original: “执政官，消息来了，那个殖民地……被一个天体级巨娘当糖果吃掉了，是一个……粉色毛发的狐娘”\n\n“而且，她注意到了我们的科研舰，但是并没有表现出敌意，我们似乎可以和她沟通一下？”
  gts_linfeng.902.b.tooltip: "\"Archon, news came, that colony... was eaten by a celestial-level Giantess as candy, it is a... fox girl with pink hair\"\n\n\"Moreover, she noticed our science ship, but did not show hostility, we seem to be able to communicate with her?\""
