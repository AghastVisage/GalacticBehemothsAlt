  gts_linfeng_shoes_4_desc: "On the sandals, there are vast oceans composed of sweat left by Linfeng. Around these oceans are sweat stains left by Linfeng, their scent is much more comfortable than that of other Giantesses, and there's a complete marine ecosystem inside!"
