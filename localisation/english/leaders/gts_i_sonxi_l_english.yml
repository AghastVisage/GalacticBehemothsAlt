l_english:
  # 颂汐
  NAME_gts_sonxi: "Song Xi"
  # 一位资深小人学家，热衷于品尝自己的实验对象，无论是从口感上还是使用手感上。
  DESC_gts_sonxi: "A seasoned researcher of tinies, passionate about tasting her subjects, both in terms of flavor and tactile experience."
  # 该出发了，哪里会有更多的小人呢（流口水）
  gts_sonxi_catch_phrase: "Time to set out, where are more tinies? (drooling)"
  # 颂汐
  gts_sonxi.999.name: "Song Xi"
  # 一只巨大的熊耳 maiden，穿着看起来像是制式服装一类的短裙，出现在众人面前。 \n\n\"你们好。我叫颂汐。\"\n\n她怀抱着巨大的书本，脸上洋溢着暖暖的笑容。\n\n\"我路过于此，发现你们有充足的人口......资源嘛？介不介意分享一些，给我的科学研究帮一点小忙？作为回报，我不介意分享一些我的科研成果哦。\"\n\n她推了推根本不存在度数的巨大眼镜，肚子却发出了咕咕咕的叫声， maiden的小脸微微泛红了起来。有记录表明，最近星际间发生了多起人口失踪案，而各种证据，都直指面前的兽人 maiden，他们究竟去了哪里，或许只有 maiden温暖的肚腹知道了。
  gts_sonxi.999.desc: "A massive bear-eared girl appears before the crowd, wearing what looks like a standard uniform dress.\n\n\"Hello. My name is Song Xi.\"\n\nShe hugs a massive book, her face radiating with warmth.\n\n\"I was passing by and noticed you have plenty of population... resources, huh? Would you mind sharing some to aid my scientific research? In return, I'm willing to share some of my research findings.\"\n\nShe adjusted her non-prescription giant glasses, but her stomach let out a grumbling sound, causing her cheeks to redden slightly. Records indicate recent interstellar disappearances of populations, and all evidence points to the bear-eared girl in front of us. Where have they gone? Perhaps only her warm belly knows."
  # 你为什么要加入我们？
  gts_sonxi.999.a: "Why do you want to join us?"
  # 因为我路过，发现你有很多小人资源嘛，斯哈（小熊吸了吸口水）。别这么小气，分我一点玩一玩，我可以帮你们干很多事情的，尤其是科学研究。
  gts_sonxi.999.a.response: "I was just passing through and noticed you have many tiny resources, hehe (bear drooling). Don't be so stingy, share some with me for fun, and I can help you with many things, especially scientific research."
  # 那些失踪的人去哪里了？
  gts_sonxi.999.b: "Where did those missing people go?"
  # 哎呀，这可是 maiden的小秘密！但相信我，他们去了一个温暖、安全的地方，再也不用为了食物发愁，过着幸福的新生活呢。研究和保护小人，我可是专业的。
  gts_sonxi.999.b.response: "Oh, that's a little secret of mine! But trust me, they've gone to a warm, safe place where they no longer worry about food and live a happy new life. I'm a professional when it comes to researching and protecting tinies."
  # 你的研究，对象是小人？
  gts_sonxi.999.c: "Is your research subject tinies?"
  # 对啊，小人们很可爱吧。捏死他们就和捏死虫子一样，可他们还是会努力地活下去呢，无论在什么地方。\n\n小熊摸了摸圆滚滚的小腹，开心地笑了笑。
  gts_sonxi.999.c.response: "Yes, aren't tinies adorable? Crushing them is like crushing bugs, yet they still strive to survive anywhere.\n\nThe little bear patted her round belly, smiling happily."
  # §Y颂汐§!作为一名§H领袖§!加入了我们的帝国。
  gts_sonxi.999.hire_custom_tooltip: "§YSong Xi§! has joined our empire as a §HLeader§!"
  # 肠胃殖民地
  gts_trait_leader_sonxi_a: "Colonies of the Stomach"
  # 巨娘颂汐的消化道布满粘液和食物残渣，这给刚刚被吞下的新住户们带来了充足的水和食物来源，不过他们依旧要小心胃里那些致命的消化液和潮汐一样的肠胃反应。
  gts_trait_leader_sonxi_a_desc: "The digestive tract of the giantess Song Xi is full of mucus and food residue, providing water and food for the newly swallowed residents, though they must be wary of the deadly digestive fluids and tidal-like gut reactions."
  # 肠胃殖民地II
  gts_trait_leader_sonxi_a_2: "Colonies of the Stomach II"
  # 消化道中的居民已经逐渐适应了这柔软的新世界，他们对巨娘颂汐的消化反应轻车熟路起来，甚至开始利用蠕动肉壁进行生产作业，不过那些咕噜噜的脏器噪音给他们带来了不小的烦恼。
  gts_trait_leader_sonxi_a_2_desc: "The tract residents have gradually adapted to this soft new world, becoming familiar with Song Xi's digestive reactions and even using the peristaltic walls for production, though the gurgling organ noise remains bothersome."
  # 肠胃殖民地III
  gts_trait_leader_sonxi_a_3: "Colonies of the Stomach III"
  # 领地的民众已经彻底适应了巨娘颂汐的消化道，在布满粘液的血肉中开辟出新的天地，这里温暖且食物充足，唯一不足的一点还是不够安全，因为颂汐老是喜欢吃掉一些奇怪的东西，这让肠胃安全部队甚是烦恼。
  gts_trait_leader_sonxi_a_3_desc: "The populace has fully adapted to Song Xi's digestive tract, carving out new territories in mucous-filled flesh, warm and food-abundant, yet not entirely safe as Song Xi often consumes peculiar things, troubling the gut safety division."
  # 小人保护者
  gts_trait_leader_sonxi_b: "Protector of Tinies"
  # 巨娘颂汐致力于保护所有发现的小人，并把他们缩小吞到肚子里好好地\"保护\"起来，壮观的星球级消化反应给帝国的科学家们带来不少启发。
  gts_trait_leader_sonxi_b_desc: "Song Xi the giantess dedicates herself to protecting all discovered tinies, shrinking and swallowing them into her belly for \"safe-keeping\", offering spectacular planetary-scale digestive reactions that inspire imperial scientists."
  # 小人保护者II
  gts_trait_leader_sonxi_b_2: "Protector of Tinies II"
  # 巨娘颂汐带领一部分有天赋的小人科学家在自己的肠胃里建立了数座的前线观察站，以便更好地研究肠胃的周期活动来保护民众的安全。\n§G每等级+5£physics£、+5£society£、+5£engineering£§!
  gts_trait_leader_sonxi_b_2_desc: "Song Xi led some gifted tiny scientists to establish numerous front-line observational stations within her stomach, better studying gut cycles to protect the populace."
  # 小人保护者III
  gts_trait_leader_sonxi_b_3: "Protector of Tinies III"
  # 小人科学家们颂汐体内建立了完整的科研中心，利用大量传感器和先进设备在器官组织中进行各种安全而无害的实验。\n§G每等级+10£physics£、+10£society£、+10£engineering£§!
  gts_trait_leader_sonxi_b_3_desc: "Tiny scientists within Song Xi have built a complete research center, conducting various safe and harmless experiments using sensors and advanced equipment in her organs."
  # 小人发现者
  gts_trait_leader_sonxi_c: "Finder of Tinies"
  #  \"小熊一号，出发！呼呼呼！小家伙们你姑奶奶来咯！\"\n\n以上来自帝国舰队司令部的绝密通讯录音。
  gts_trait_leader_sonxi_c_desc: "\"Little Bear One, go! Hoohoohoo! Little guys, your grandma's here!\"\n\nAbove is a confidential communication record from the imperial fleet command."
  # 小人发现者II
  gts_trait_leader_sonxi_c_2: "Finder of Tinies II"
  # \"小熊科研船，前进4！哎哎哎！慢点慢点！要撞上去啦！\"\n\n以上来自帝国舰队司令部的绝密通讯录音。
  gts_trait_leader_sonxi_c_2_desc: "\"Little Bear Research ship, advance 4! Hey hey hey! Slow down! You're going to hit!\"\n\nAbove is a confidential communication record from the imperial fleet command."
  # 小人发现者III
  gts_trait_leader_sonxi_c_3: "Finder of Tinies III"
  # \"又一个小人部落！小熊火箭！发射！\"\n\n以上来自帝国舰队司令部的......\n\n\"嗯？你们在做什么？\"\n\n\"卧槽她来了！快！快跑！！啊啊！\
  gts_trait_leader_sonxi_c_3_desc: "\"Another tiny tribe! Little Bear Rocket! Launch!\"\n\nAbove is a confidential communication record from......\n\n\"Hmm? What are you doing?\"\n\n\"Oh crap, she's here! Quick! Run!! Ahh!\"
  # 小人研究者
  gts_trait_leader_sonxi_d: "Researcher of Tinies"
  # 巨娘颂汐是小人资源的开发和利用领域的专家，独具慧眼的她可以轻松找到出小人们的藏身处。
  gts_trait_leader_sonxi_d_desc: "Song Xi the giantess is an expert in the field of tiny resource development and utilization, with a sharp eye for finding tinies' hiding places."
  # 小人研究者II
  gts_trait_leader_sonxi_d_2: "Researcher of Tinies II"
  # 在发现失落的小人聚集地后，和蔼的巨娘颂汐会和当地土著居民签订一系列友好而平等的科研协议，这为帝国的小人生态研究带来了巨大的促进作用。
  gts_trait_leader_sonxi_d_2_desc: "Upon discovering lost tiny communities, amiable Song Xi signs a series of friendly and equal scientific agreements with local natives, greatly advancing tiny ecological research for the empire."
  # 小人研究者III
  gts_trait_leader_sonxi_d_3: "Researcher of Tinies III"
  # 巨娘颂汐在协议保护下，会充分利利用帝国科技帮助小人建立新家园，并对小人志愿者们开展一系列安全无害的研究，包括口感和吞咽满足感的测评。
  gts_trait_leader_sonxi_d_3_desc: "Under agreement protection, Song Xi fully utilizes imperial technology to help tinies establish new homes, carrying out a range of safe and harmless researches on volunteer tinies, including taste and swallowing satisfaction evaluations."
  # 沉睡中的天体级巨娘
  NAME_sleepbear: "Dormant Celestial Giantess"
  # 唤醒她
  SLEEP_BEAR_PROJECT: "Awaken Her"
  # 也许我们可以通过某种方式与这只天体级巨娘取得联系？
  SLEEP_BEAR_PROJECT_DESC: "Perhaps we can find a way to contact this celestial giantess?"
  # 天体级熊娘
  sleepbear_in_orbit: "Celestial Bear Girl"
  # 一只神秘的蓝色小熊就在这颗星球的轨道旁沉睡...
  sleepbear_in_orbit_desc: "A mysterious blue bear lies asleep beside the planet's orbit..."
  # 巨熊颂汐的体内研究站
  sleepbear_lab: "Giant Bear Song Xi's Internal Research Station"
  # 在她菊穴里建立的探测站极大地促进了我们对于天体级巨娘的了解
  sleepbear_lab_desc: "The probe station built within her anal entrance greatly advances our understanding of celestial giantesses."
  # 突然出现的巨娘
  gts_sonxi.3.name: "Sudden Appearance of a Giantess"
  # 最开始谁也没在意[gts_sleepbear_planet.GetName]的异常波动报告，直到巨大的电磁波和引力场铺天盖地般撕碎了整个星球的宁静，直到那巨大到足以毁灭整个星系的身躯突然出现在[gts_sleepbear_system.GetName]中时，我们才意识到这绝对不仅仅是一次简单的异常活动\n\n这位突然出现在[gts_sleepbear_system.GetName]中的巨娘甚至连动都没动，那双包裹在雪白棉袜上的双足就已经踏碎了一颗行星，残破的星球碎片奔逃着，溃败着，想要极力逃离来自天体级巨娘那磅礴的引力，但是最后只能徒劳地被她的双足捕获，成为那位巨娘脚踝上毫不起眼的脚环\n\n我们的恒星与她对比起来简直就像是玩具一般，在这位巨娘的一呼一吸中孱弱地颤抖着自己的光芒，甚至其散发的热量都没有她的万分之一......\n\n不过好在，根据我们的观察，这位随意就能抹去整个文明的巨娘似乎因为某种原因陷入了沉眠，这也许是个好消息，毕竟，如果不去打扰她的话......她也不会作出什么出格的举动......但愿吧......
  gts_sonxi.3.desc: "Initially, nobody paid much attention to the anomaly reports from [gts_sleepbear_planet.GetName], until powerful electromagnetic and gravitational fields nearly tore the silence of the entire planet, until the massive body large enough to destroy an entire galaxy suddenly appeared in [gts_sleepbear_system.GetName]. We then realized this was far more than a simple anomaly.\n\nThis giantess who suddenly appeared in [gts_sleepbear_system.GetName] didn't even move, yet her snow-white stocking-wrapped feet crushed a planet, its fragmented remnants fleeing desperately, trying to escape the massive gravity of the celestial giantess, but in the end, could only futilely become bangles on her ankle.\n\nCompared to her, our star is merely a toy, shivering weakly under her breath, its heat not even a fraction of hers...\n\nFortunately, according to our observations, this civilization-erasing giantess seems to have fallen asleep for some reason, which might be good news, as long as we don't disturb her... she likely won't act out... hopefully..."
  # 我们能否与她联系？
  gts_sonxi.3.a: "Can we contact her?"
  # 让她继续沉睡吧...
  gts_sonxi.3.b: "Let her continue to sleep..."
  # §R你预感到这么做在十年后会有严重后果！§!
  gts_sonxi.3.b.tooltip: "§RYou sense this may have severe consequences in a decade!§!"
  # 想办法干掉她！
  gts_sonxi.3.c: "Find a way to destroy her!"
  # §R你预感到这么做会有严重后果！§!
  gts_sonxi.3.c.tooltip: "§RYou sense this may have severe consequences!§!"
  # 醒来了
  gts_sonxi.4.name: "Awaken"
  # 我们的科学家尝试了许多与这只巨大熊娘的交流的方式，尽管遇到了许多的挫折，但我们的努力没有白费，在看到那青蓝色眸子聚焦在一颗星球上时，整个文明都为之战栗\n\n毫不在意那已经被她足部气息吞噬干净的星球脚环，这位兽人巨娘抖了抖她毛茸茸的熊耳，揉了揉惺忪的睡眼，随意地把那被榨干了利用价值的星球揉碎在她稀松平常的起床动作上\n\n整个国家都在看着这位巨娘接下来的动作，她会怎么对待我们的殖民地？会友善的交流嘛？还是直接拍碎在手掌里？\n\n但...... maiden腹中闷雷般的咕噜声解答了这个问题， maiden打了个哈欠，她的指尖游走在星系中，将自己随意捞起的东西塞入了自己口中，而我们整个帝国，就这样呆呆地看着恒星级 maiden将整个星球整个塞入自己口中，粉嫩的巨舌在雪白的贝齿间游走搅拌，可怜的星球就这样在一声声\"嘎吱嘎吱\"声中成为了 maiden的早餐，最后像巧克力一样，那团混合着岩浆，土地，以及绝大部分 maiden的唾液的混合物就在\"咕嘟\"一声后，永永远远地消失在了女孩那深不见底的喉咙中\n\n现在，意犹未尽的她拍了拍手，将目光投向了我们的星球......
  gts_sonxi.4.desc: "Our scientists tried many ways to communicate with this giant bear girl. Despite numerous setbacks, our efforts were not in vain. As her blue eyes focused on a planet, the entire civilization shuddered.\n\nNonchalantly stepping on a crust that had been devoured clean by her breath, this beastly giantess shook her furry bear ears, rubbed her sleepy eyes, and easily crushed the juiceless planet in her casual waking movements.\n\nThe entire nation watched this giantess's next act. How will she treat our colonies? Will she engage in amicable communication or squash them within her hand?\n\nBut... the rumbling thunder in her stomach answered this question, as she yawned, her fingers moving through the galaxy, randomly picking something up to place into her mouth. And so, our entire empire watched as the stellar girl devoured the entire planet, pink tongue swirling amidst pearly teeth, the poor planet becoming her snack amidst crunching noises, finally disappearing forever in her bottomless throat with a gulp.\n\nNow, unsatisfied, she claps her hands and sets her gaze on our planet..."
  # 她到底是什么来头？
  gts_sonxi.4.a: "What on earth is she?"
  # 离去
  gts_sonxi.6.name: "Departure"
  # 或许和她进行交流才是身为小人一方应该做的事，但无论怎样我们都已经无法回头了\n\n看来这位 maiden的沉眠不是永久的，只是恒星巨娘们那漫长的时间不是我们能够理解的，那天，人们只是像往常一样，一边干着自己的工作，一边看着悬在宇宙中那完美的熊耳 maiden，但是突然之间，她发出了一声呻吟\n\n所有人都震惊了，无数的信号塔纷纷转向了女孩，用尽了最大功率向着 maiden发送信号，但是刚刚从睡梦中苏醒的 maiden只是揉了揉眼睛，烦躁地抖了抖耳朵，便转过身去不再理会我们\n\n相安无事？还是另有打算？我们猜不透巨娘的心思，但......来自 maiden腹中的\"咕噜咕噜\"声音揭示了一切......\n\n她饿了\n她在这片只有我们存在的星系里饿了！\n\n maiden伸出手，围绕着行星轨道轻轻一捞，一颗对她来说小得只能塞牙缝的天体就这样躺在了她的手中，我们看不见女孩的表情，是戏谑的微笑？还是轻蔑的直视？亦或者......
  gts_sonxi.6.desc: "Perhaps communicating with her was the right choice for us tinies, but we can't turn back now.\n\nIt seems the giantess's slumber wasn't eternal, but their stellar time spans are beyond our understanding. That day, as people went about their everyday jobs, they caught sight of the perfect bear-eared girl suspended in the cosmos. Suddenly, she let out a moan.\n\nEveryone was stunned, countless signal towers turning toward the girl, broadcasting signals at maximum power, but the newly awakened girl merely rubbed her eyes irritably, shook her ears, and turned away from us.\n\nEverything okay? Or does she have other plans? We can't fathom the giantess's intentions, yet... the \"gurgle gurgle\" from her belly reveals everything...\n\nShe was hungry\nShe was hungry in this galaxy where only we resided!\n\nThe girl reached out her hand, casually scooping a celestial body small enough to be lodged in her teeth. We couldn't see her expression-was it an amused smile? Or disdainful gaze? Or perhaps..."
  # 离去
  gts_sonxi.7.name: "Departure"
  # 面无表情地将[gts_sonxi_next_planet_1.GetName]像花生米一样抛入口中，巨齿上下开合，巨舌来回游动，黏腻的唾液撕扯着[gts_sonxi_next_planet_1.GetName]，又让它不至于散开，虽然这样形容一位美丽巨娘确实不好，但是在那对我们来说宛如猩红色地狱般的口腔中，我们看到了绝望，我们目睹了毁灭，我们看着混合着 maiden唾液的已经看不出原来形状的[gts_sonxi_next_planet_1.GetName]随着她的吞咽而滑入那深不见底的喉咙中消失不见，而她仅仅只是舔了舔嘴唇，然后继续着她的早餐\n\n maiden在吞吃完[gts_sonxi_next_planet_1.GetName]后又将[gts_sonxi_next_planet_2.GetName]捏在手中，巨大的引力撕扯着我们建立的空间站，将这位摄像者连同星球一同送入了她的口中，这次 maiden没有急着嚼碎星球，而是像吃糖果一样把星球顶在舌尖，用巨舌不断舔舐着星球，山川，盆地，无论是什么地貌，在巨舌碾过后都平等的变成一片唾液海洋，继续腐蚀消耗着已然成为食物的星球，舌尖挑动，[gts_sonxi_next_planet_2.GetName]在 maiden舌头上来回滚动着然后......\n\n\"咕嘟~\"\n\n所有人都看着恒星级 maiden的早餐，她几乎吞吃了一整个星系而似乎还没有满足......不过她最后似乎还是决定放过我们，她向着我们带着歉意地笑了笑，随后就像她神秘的到来一样，一眨眼，便消失在了茫茫星海之中，至少......我们的殖民地没有被吞掉
  gts_sonxi.7.desc: "Unsheathing an expressionless look, she tossed [gts_sonxi_next_planet_1.GetName] into her mouth like a peanut, as giant teeth closed, her tongue twisted, sticky saliva torn from [gts_sonxi_next_planet_1.GetName], yet held its form, witnessing despair, witnessed destruction, a planet shapeless under saliva finally slid down her throat, marked as a mere snack, only to continue her breakfast.\n\nAfter consuming [gts_sonxi_next_planet_1.GetName], she picked up [gts_sonxi_next_planet_2.GetName], colossal gravity wrenching our space stations, delivering both observer and planet into her mouth. This time, she didn't rush to chew, her tongue playfully balancing a sweet treat at the tip, licking at the planet, transforming every topography-mountains and valleys-equally into a sea of saliva, eroding the food planet, tongue flicking, [gts_sonxi_next_planet_2.GetName] rolling before...\n\n\"Gulp~\"\n\nEveryone gazed at the stellar girl's breakfast, having devoured an entire galaxy, yet not fulfilled... perhaps she chose to spare us, offering an apologetic smile before vanishing into the starry sea..."
  # 天哪？
  gts_sonxi.7.a: "Oh my god?"
  # 神罚
  gts_sonxi.8.name: "Divine Punishment"
  # 是的，星系中沉睡的巨娘什么的，对于文明的发展和扩张来说都是一种阻碍，她庞大的身躯遮挡了恒星的能量，拦住了商船来往的航道，我们别无选择，躁动的导弹和激光无差别地砸在了 maiden的身体上，她必须被清除！\n\n显然，我们高估了自己在恒星级巨娘眼中的地位\n\n在持续轰炸了数天后，那位沉睡着的熊耳 maiden发出了一声烦躁的呻吟，旋即，她翻了个身，数十倍于恒星的躯体就这样毫无预警地碾在了我们的舰队上，他们连一声悲鸣都未能发出就被粉碎在女孩一个简单的翻身动作中！紧接着， maiden睁开眼睛，嗔怪地盯着我们的星球，看着我们的文明\n\n没有过多的交流，被吵醒的 maiden伸出两根手指，将我们的[gts_sonxi_next_planet_continue.GetName]捏在指尖，拎到眼前仔细打量着，两只手指轻轻搓碾着我们的殖民地，就好像......\n\n\"咕噜咕噜......\"\n\n maiden的肚子此刻不合时宜地响了起来，对 maiden来说不过是一时的饥饿，但对于[gts_sonxi_next_planet_continue.GetName]上的人来说，着无异于宣判了所有人的死刑\n\n统治着[gts_sonxi_next_planet_continue.GetName]上空的天青色眸子离开了，但是紧接着出现的，是粉嫩潮湿的巨大洞穴，那位 maiden要把我们的殖民地当成早餐吃了！
  gts_sonxi.8.desc: "Yes, a slumbering giantess within our star system obstructs civilization's growth, her colossal body blocking starlight and interrupting trade routes, leaving us no choice. Restless missiles and lasers indiscriminately bombarded her body; she must be removed!\n\nEvidently, we overestimate our status in the eyes of a celestial giantess.\n\nFollowing days of continuous bombardment, the sleeping bear-eared girl let out an irritated sigh, casually flipping over without warning. Her multi-stellar-sized body crushed our fleet without even a cry, annihilated by a simple movement. She opened her eyes, staring annoyed at our planet, eyeing our civilization.\n\nNo lengthy communication; the disturbed girl reached forward, pinching [gts_sonxi_next_planet_continue.GetName] between her fingers, lifting it to inspect closely, gently kneading our colony as if...\n\n\"Gurgle gurgle...\"\n\nHer stomach growled, marking our end, her temporary hunger sentencing [gts_sonxi_next_planet_continue.GetName].\n\nThe ruling tinge-eyed gaze departs, only to be replaced by a pink wet cavern-our colony to be breakfast!"
  # 神罚
  gts_sonxi.9.name: "Divine Punishment"
  #  maiden口腔中呼出的热气剥离替换了我们的大气，[gts_sonxi_next_planet_continue.GetName]上所有的幸存者都闻到了那来自 maiden口中腥咸的气味和贪婪的食欲，绝望在星球上蔓延着，无数飞行器妄图逃离，却在飞离星球的瞬间被女孩的引力捕获，比星球更快消失在那暗红色的深渊中，少数侥幸逃脱者也因为恒星级 maiden的引力而无法快速逃离，只能眼睁睁地看着这幕诡异的吃早餐的图像\n\n\"咔擦！\"\n\n贝齿闭合，强劲的撕咬力将[gts_sonxi_next_planet_continue.GetName]咬了对半，滚浓的岩浆宛如流心巧克力一样缓缓流出，飞溅在 maiden的口中后被海量的唾液吞噬成焦黑的脆块，再在女孩灵巧巨舌的轻轻扫动下被粉碎成早餐的调味料，巨唇闭合，切断了她口中那半殖民地发出的求救信号，我们能看到的最后画面，就是那缓缓闭合的入口，已经在越来越黑，越来越潮湿的伸出，缓缓探向我们的巨大舌头\n\n\"嘎吱~嘎吱~\"\n\n女孩推了推眼镜，半眯着双目，仔细品尝着殖民地和我们位于其上的人民，也许是女孩太饿了，又或者是我们的殖民地根本连她的牙缝都不够塞，熊耳 maiden只是微微咀嚼了几下，我们就看到她的喉咙口动了动，紧接着是粘稠丝滑，又令人无比绝望的一声......\n\n\"咕咚~\"\n\n舔了舔嘴唇，现在，她又将目光投向了被她牢牢捏住的剩下的半块殖民地......
  gts_sonxi.9.desc: "Exhaled heat from the girl's mouth replaced our atmosphere; all survivors on [gts_sonxi_next_planet_continue.GetName] smelled the salty odor of girlish mouth desire, despair spreading across the planet, as fleets desperately tried escape, only to be swallowed by her gravity faster than planets, few lucky ones unable to quickly flee because of her pull, just watching this eerie breakfast scene.\n\n\"Crunch!\"\n\nIvory teeth clashed, biting [gts_sonxi_next_planet_continue.GetName] in half, molten core oozing like molten chocolate, devoured by saliva into crispy shards, pulverized by her agile tongue, slashed into breakfast flavoring, the lip sealed, cutting emergency signals from half-colony, the last image, a closing entrance diminishing into a dark, wet maw, with giant tongue's reach towards us.\n\n\"Crunch~ crunch~\"\n\nShe squinted through her glasses, leisurely sampling colonies and us, her people. Maybe too hungry, or our colony barely sufficing a gap. The bear-eared girl chewed lightly; her throat shifted shortly after when sticky, slippery, despairing...\n\n\"Gulp~\"\n\nLicking her lips, she now eyed the captive remaining half of the colony..."
  # 救命啊
  gts_sonxi.9.a: "Save us"
  # 饱餐一顿？
  gts_sonxi.10.name: "A Full Meal?"
  # 没有停留，也没有犹豫，巨大的熊耳 maiden将剩下的一半星球抛入口中，带着一丝丝怨气，将牙齿狠狠砸在[gts_sonxi_next_planet_continue.GetName]上\n\n\"嘎吱~嘎吱~\"\n\n大地在崩溃！堪比恒星一般巨大的牙齿轻松碾碎了坚固的地壳，山川河流在 maiden咀嚼中被平等地碾磨成粉末，城市工厂被贪婪的巨舌卷入喉咙口，死亡的人数从千，到万，再到十万千万百万，直到几亿几亿的生物被吞噬，被碾碎，被吞咽，落入 maiden那饥渴难耐的胃袋中\n\n\"咕叽~咕叽~\"\n\n渺小的生命只配给巨娘们充当早餐，成片成片的建筑群在黏滑的食道中翻滚，挤压，连带着逃过咀嚼的幸存者们被吞咽进女孩的腹中，落入名为胃酸的海洋，蠕动的胃袋早已饥渴于落入的食物，一下一下的蠕动，掀起滔天的酸液海啸，比任何星球上的海啸都要巨大，都要壮观，也都要更具毁灭性，人们甚至能看到在不远处的海洋中还漂浮着几座不大的小岛，在胃酸的溶解下一点点没入深渊 -  - 那是 maiden刚刚吞食的另一半行星，在不到几分钟的时间内，就已经被消化得几乎一干二净，
  gts_sonxi.10.desc: "Without hesitation, the enormous bear-eared girl tossed the remaining half of the planet into her mouth, resentment shadowed in her teeth crashing onto [gts_sonxi_next_planet_continue.GetName].\n\n\"Crunch~ crunch~\"\n\nEarth crumbling! Teeth like stars easily grinding crust, rivers, mountains mingled evenly in her chew, cities engulfed by her greedy tongue and swallowed, death tolls skyrocketing from thousands, to millions, billions-lives swallowed, chewed, gulped, disappeared into her hungry stomach.\n\n\"Glu~glu~\"\n\nMinuscule lives are breakfast-bound for giants, endless structures rolling down her moist esophagus, squeezed relentlessly along with survivors escaping chew, dissolving into an acid ocean, swirling waves inside a pulsating stomach craving for incoming food, monumental waves eclipsing planetary tsunamis in scale, grandeur, and destruction. Some see small islands floating, dissolving in acid-remnants of the other half planet digested nearly entirely in minutes."
  # 饱餐一顿？
  gts_sonxi.11.name: "A Full Meal?"
  # 胃酸翻涌，潮起又潮落，海浪抚摸过的岛屿上，只留下一具具被腐蚀殆尽的骸骨，而下一个浪头过后，只有一些难以消化的岩石还坚挺在原处，只不过上面吱吱往外冒的白气也已经说明，即使是最坚硬的物质，在落入 maiden的胃袋里也挺不过几秒钟\n\n而再几分钟之后，那个翻涌着死亡与绝望的地狱里，就完全没有了生气，只留下亿万亡魂，在酸液中等待着被吸收殆尽\n\n可笑的是，经过我们的检测， maiden吃掉了我们的殖民地后所吸收的营养，甚至没有填补她刚刚起床时消耗的能量......\n\n所以......她把目光看向了这个星系，眼镜后那双贪婪的眼睛扫视着我们的星系，我们的文明......
  gts_sonxi.11.desc: "Stomach acids roiled, tide rose and fell; skeletons remained where waves touched land, eroded, only hard-to-digest rocks persisted with airy hiss showing even stubborn material lasted mere seconds in her stomach.\n\nMinutes later, the deathly churned hell faded, leaving billions of soul's remains in acidic assimilation.\n\nAbsurdly, our tests showed her nutritional intake from our colony, post-breakfast, didn't replenish her wakeful energy.\n\nNow... her sight fell upon the star system, glasses masking greedy eyes scanning our star system, our civilization..."
  # 你究竟吃了什么？
  gts_sonxi.11.a: "What exactly did you eat?"
  # 不要再吃啦！
  gts_sonxi.11.b: "Please, stop eating!"
  # 领袖间的小趣味？
  gts_sonxi.100.name: "Leader's Little Fun?"
  # 虽然整个[root.GetName]的民众都知道颂汐领袖是消耗缩小人最多的领袖之一，但作为一个优秀的领袖，一些小的爱好也是可以被包容的。\n\n然而最近，[root.GetName]的民众发现颂汐不再满足于玩弄普通的小人，而是把目光投向了其他领袖，相较于泰坦巨娘体型小一级的领袖经常被颂汐擅自捉去作为领袖聚会时的公用玩具，甚至同体型的巨娘也可能被颂汐暗算缩小，虽然其事后会很没有诚意地道歉，但其他巨娘领袖依旧对此颇有微词
  gts_sonxi.100.desc: "Although everyone in [root.GetName] acknowledges Leader Song Xi is among those who consume tinies the most, a respectable leader can have some minor hobbies.\n\nLately, [root.GetName] citizens noticed Song Xi unsatisfied merely toying with regular tinies, casting her eyes on other leaders. Leaders smaller than her titanic stature often abducted as party playthings, even leaders her size diminishing under her trickery. Apologies afterward seemed insincere, causing even giantess leaders to voice displeasure."
  # 对其他巨娘同类下手是不可原谅的！
  gts_sonxi.100.a: "It's intolerable to prey on giant peers!"
  # 这是领袖们之间的事。让他们自己注意就好
  gts_sonxi.100.b: "These are matters among leaders. They'll sort it themselves."
  # 或许可以让大家玩得更开心一点...？
  gts_sonxi.100.c: "Maybe we can make it more enjoyable for everyone...?"
  # 宇宙构成的新发现
  gts_sonxi.110.name: "New Cosmic Understanding"
  # 过去科学家们认为宇宙中蕴藏着一种我们看不见摸不着的物质，而这种物质却占有了整个宇宙70%的质量！过去的一百多年我们对这种物质的研究进展缓慢，但自从我们接触到这些天体级巨娘之后，我们对这个世界基础构成的理解有了革命性的突破，最新研究发现，填满宇宙的并不是暗物质，而是颂汐的●液，也就是说我们的星球仅仅是漂浮在●液海洋里的一颗沙砾...
  gts_sonxi.110.desc: "Previously, scientists hypothesized an unseen, intangible substance dominated 70% of the universe's mass! Research progressed slowly for over a century, but interacting with these celestial giantesses has revolutionized understanding of cosmic composition. The latest studies reveal it's not dark matter filling the universe but Song Xi's fluids, implying our planet merely floats in her secretion sea..."
  # 是她的爱液！
  gts_sonxi.110.a: "It's her love juices!"
  # 是她的精液！
  gts_sonxi.110.b: "It's her cum!"
  # 是她的尿液！
  gts_sonxi.110.c: "It's her urine!"
  # 只会睡觉的小熊
  sleepbear: "Little Bear that Only Sleeps"
  # 静静地趴在星球外的轨道上，似乎并没有敌意
  sleepbear_plural: "Lazily resting on the planet's orbit, seemingly devoid of hostility"
