  gts_guya.36.desc: """"
  # 营养收割
  gts_guya.36.a: "Nutrient Harvest"
  # 咕丫将以最有效率的方式将星球表面的一切吞噬殆尽\n消灭星球上所有人口与建筑，将星球变为§Y死寂星球§!
  gts_guya.36.a.tooltip: "Guya will devour everything on the planet's surface in the most efficient way.\nEliminate all population and buildings on the planet, turning it into a §YDead World§!"
  # 宜居性净化
  gts_guya.36.b: "Habitability Purification"
  # 使用大量触须包裹住星球，触手会孵化大量工人虫与真菌孢子对整颗星球进行改造\n消灭所有人口，保留建筑，将星球变为§Y盖亚星球§!
  gts_guya.36.b.tooltip: "Use a large number of tentacles to envelop the planet, the tentacles will hatch massive amounts of worker insects and fungal spores to reshape the entire planet.\nEliminate all population, retain buildings, turning it into a §YGaia World§!"
  # 泄欲
  gts_guya.36.c: "Lust Release"
  # 用星球发泄挤压性欲，同时还会向星球内部注入虫卵，星球的残骸会为新生的虫娘舰队提供营养 \n将星球变为§Y破碎星球§!，并在一个月后在星球位置生成一支虫娘舰队
  gts_guya.36.c.tooltip: "Release repressed lust on the planet while also injecting insect eggs into it. The planet's remnants will provide nutrients for the new Bug Girl fleet.\nTransform the planet into a §YShattered World§! and generate a Bug Girl fleet in the planet's position after a month."
  # 排毒
  gts_guya.36.d: "Detoxification"
  # 咕丫将体内无法分解的有毒废物作为武器抛掷到敌人的星球上\n消灭所有人口与建筑，将星球类变为§Y排泄星球§!
  gts_guya.36.d.tooltip: "Guya will throw indigestible toxic waste as a weapon on the enemy's planet.\nEliminate all population and buildings on the planet, transforming the planet class to §YExcrement World§!"
  # 外星虫娘研究所
  d_gts_loli_bug_lab: "Alien Bug Girl Research Lab"
  # 这座大型研究设施只用于研究从陨石中孵化出的巨大虫娘
  d_gts_loli_bug_lab_desc: "This large research facility is dedicated solely to the study of the giant Bug Girl hatched from the meteorite."
  # 外星虫娘保护区
  d_gts_loli_bug_reserve: "Alien Bug Girl Reserve"
  # 为了适应不断生长的虫娘我们不得不将这片广阔的野外区域全部划作研究区域，另外为了保护本地的生态平衡，我们依然要对其进行投喂
  d_gts_loli_bug_reserve_desc: "To accommodate the ever-growing Bug Girl, we have been forced to designate this entire vast wilderness area as a research area. Additionally, to maintain local ecological balance, we must continue to feed her."
  # 奇异生态区
  d_gts_loli_bug_reserve_2: "Strange Ecological Zone"
  # 这片地区里发现了一些与这颗星球生态完全不符的生物，不过似乎并没有人在意的样子
  d_gts_loli_bug_reserve_2_desc: "Some creatures that are completely inconsistent with the ecology of this planet have been discovered in this area, although no one seems to care."
  # 菌毯覆盖区
  d_gts_loli_bug_mushroom: "Fungal Carpet Area"
  # “咕丫”的分泌物覆盖了这些地区，但这些真菌意外地对当地居民十分有益
  d_gts_loli_bug_mushroom_desc: "The secretions of 'Guya' cover these areas, but these fungi are surprisingly beneficial to the local residents."
  # 虫娘巢穴
  d_gts_loli_bug_nest: "Bug Girl Nest"
  # 这片区域现在是“咕丫”的繁育场，内部已经形成了能够自给自足的生态系统
  d_gts_loli_bug_nest_desc: "This area is now 'Guya's' breeding ground, and an entire self-sufficient ecosystem has formed within."
  # 爱液海
  gts_guya_juice_ocean: "Love Fluid Sea"
  # 咕丫发情时漏出的一滴爱液，却引发了殖民地历史上最严重的灾难
  gts_guya_juice_ocean_desc: "A single drop of love fluid leaked by Guya during her heat is responsible for the most severe disaster in the colony's history."
  # 虫蛊之潮
  gts_swarm_army: "Insect Swarm Tide"
  # 
  gts_swarm_army_desc: """"
  # 弑星者基地
  gts_guya: "Star Slayer Base"
  # 弑星者基地
  gts_guya_ship: "Star Slayer Base"
  # 咕丫
  NAME_gts_guya: "Guya"
  # 咕丫
  NAME_gts_guya_ship: "Guya"
  # 咕丫
  NAME_gts_guya_fleet: "Guya"
  # 生长至6公里高的巨大虫娘，原本好奇而温和的性格因为产卵量的增加而开始变得凶暴
  DESC_gts_guya_general: "A giant Bug Girl who has grown to 6 kilometers tall. Her originally curious and gentle personality has become more ferocious due to increased egg-laying."
  # 产卵期的咕丫需要更多的食物，就让我们的敌人来“提供”吧
  gts_guya_general_catch_phrase: "Guya needs more food during her spawning phase, let our enemies 'provide' it."
  # 咕丫通讯
  gts_guya.100.name: "Guya Communications"
  # 咕呀...呜...嘎——！\n（饥饿，孩子们，需要，进食！）
  gts_guya.100.desc: "Guya...woo...gaaaah! \n(Hunger, children, need, food!)"
  # 你肚子饿了吗？
  gts_guya.100.a: "Are you hungry?"
  # 咕呀呀..咕...\n（孩子们，增加，更多，食物）
  gts_guya.100.a.response: "Guya ya...goo...\n(Children, increase, more, food)"
  # 对“母亲”的看法
  gts_guya.100.b: "Thoughts on 'Mother'"
  # 咕哇——咕...嘎...\n（母亲，现在，回归，我，服从）
  gts_guya.100.b.response: "Guwaah..goo...gah...\n(Mother, now, returned, I, obey)"
  # 对自己名字的看法
  gts_guya.100.c: "Thoughts on her name"
  # 嘎...咕呀...？\n（名字？不理解）
  gts_guya.100.c.response: "Gah...Guya...? \n(Name? Not understand)"
  # §Y咕丫§!作为一名§H领袖§!加入了我们的帝国。
  gts_guya.100.hire_custom_tooltip: "§YGuya§! has joined our empire as a §Hleader§!."
  # 生长至60公里高的巨大虫娘，巨大的体型足以令任何战舰都相形见绌
  DESC_gts_guya_admiral: "A giant Bug Girl who has grown to 60 kilometers tall, her enormous body dwarfs any warship."
  # 咕丫现在的庞大体型已经可以作为舰队母舰进行太空作战
  gts_guya_admiral_catch_phrase: "Guya's current immense size allows her to serve as the fleet's mother ship for space combat operations."
  # 咕呀...呜...嘎——！\n（成长，扩张，进食）
  gts_guya.101.desc: "Guya...woo...gaaaah! \n(Growth, expansion, food!)"
