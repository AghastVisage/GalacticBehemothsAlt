  gts_guya.30.desc: "Guya crawls towards the enemy capital on all fours, the immense mass of her six-kilometer-tall body shaking the ground, the giant tremors launching nearby ambushing ground troops into the air, only to smash them to pieces upon impact. Some of the troops ambushing along Guya's path are crushed unconsciously by Guya before they can even reorganize from the chaos caused by the earthquake. The enemy's deployed ground forces are annihilated by Guya without even having a chance to open fire. Even the air forces fare no better than the ground troops. Even when crawling, Guya's speed easily exceeds the speed of sound, leaving conventional fighters unable to keep up. The sonic booms generated by Guya's high-speed movement create gusts of wind around her, tearing apart the few fighters that can keep up. Within minutes, Guya arrives outside the suburbs, stops, and prepares to guide the subsequent air drop of troops. Realizing that a head-on attack is unlikely to succeed, the enemy decides to use chemical weapons against the giant Bug Girl. A squadron of fighters drops numerous gas bombs on Guya, the resulting cloud of poison gas completely enveloping her. Soon, accompanied by a massive vibration and hoarse moans, Guya stumbles out of the gas cloud, though for some reason, she has a blush on her face. It seems that the poison gas has had some other effect on Guya  -  she is in heat!\n\nHer face flushed, Guya lowers her upper body, raising her hips high, the overflowing juices of her private parts glistening in the sunlight. Suddenly, Guya's lower abdomen swells slightly, and then a giant insect egg, more than 50 meters in diameter, is discharged from her vulva along with viscous love fluids, falling directly into the city below. The white insect egg, over 50 meters in diameter, carries an unimaginable mass as it falls from the sky, shattering an entire residential area, the love fluids that drip from it demolishing the surrounding buildings that hadn't full