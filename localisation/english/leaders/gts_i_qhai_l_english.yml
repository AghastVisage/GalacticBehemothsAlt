  # 其实在落下来之前，穿着这泳装的犽戎甚至还穿着凉鞋。但是在进行了一番激烈而毫无软用的抵抗后 -  - 指尾巴被缠住了 -  - 小家伙的鞋子都已经被蹬飞了出去。如果犽戎仔细看的话，她甚至能够发现自己的鞋子一只泡在了海里，另一只落在了城市区划旁不到200米的距离。\n\n而现在，小龙崽子的闹腾的脚已经蹭到了她之前蹬出去的鞋子，但凡她在闹腾一下让那只凉鞋落下去......那恐怕比千海说的碾平还要可怕。\n\n§P\"呜......\"§!\n\n§r\"怎么这么委屈呀，是我欺负你了吗?\"§!\n\n千海一边以挑逗的语气说着，一边用小虎牙咬上了犽戎的耳朵，用她滚烫的信息素感染者只小龙。而小龙自然也是很没有骨气的软了下来 -  - 这次她还真的没有被欺负，她甚至连个借口或者理由都没有。\n\n她是帝国的神明，拥有至高无上的权柄与力量。她的父亲宠爱她，她的子民爱戴她信奉她，她的妹妹仰慕她，她甚至还有一只视她为神的\"小宠物\"。她认识的所有人几乎都会包容她，她也把这些当成理所当然的 -  - 她享受着敬畏与宠爱，也承担着守护的责任。这也是为什么在初次遇到千海的时候，她一个人冲过去了。\n\n只是现在......这只看上去平平无奇的魅魔小姐实在是太稳健了!犽戎实在是没有想到自己都已经彻底放下脸了做出这样放荡的举动后，千海都还能\"恬不知耻\"的跟她说话。\n\n§r\"而且小家伙......你应该......\"§!\n\n千海的手轻柔的抚上了小龙的手腕，像是一位仁慈的母亲教导孩子一般带着她学习。而在这样的一个过程中，犽戎的手掌从 maiden的双峰处向下移动，她肆意的抚摸着美好的躯体。从有着美好触感的双峰再到优美的人鱼线，从纤细的腰肢再到肉感的大腿......\n\n最后千海的手握着犽戎的手腕，将其伸进了她的胖次之中， maiden最为私密的性器官此刻被一抚无余。\n\n§r\"怎么啦，不敢使劲了?\"§!\n\n§r\"还是有小家伙看着，你害羞了?\"§!\n\n挑逗的话语带着滚烫的热气喷在了犽戎的脸上。犽戎并没有第一时间回应她，而是转而看向了周围的城市区划 -  - 她恶狠狠的露出来龇牙咧嘴的模样威胁着自己的小家伙。\n\n§r\"欺软怕硬的小龙。\"§!\n\n§r\"那你也让我欺负一下?\"§!\n\n千海笑了笑，随即伸手 -  - 一整个城市区划被她托举在手中，超过十亿人的生命也被她轻易的掌握。\n\n§r\"来，你把他们倒进去 -  - 他们愿意为你奉献自己的一切，不是么?\"§!\n\n犽戎皱了皱眉，她当然知道自己的小家伙们愿意为她奉献一切。尤其是在做性行为的过程中，被她当成消耗品更是在私下被称为\"圣祭\"的举动。但......\n\n§P\"放过他们......\"§!\n\n§P\"可以么......\"§!\n\n小龙有些底气不足。毕竟说到底，她是知道面前这个存在究竟是什么样的，如果她愿意，她甚至能把整个星系都塞进她的下体 -  - 而如果不是她先前的友善举动让犽戎有些忘乎所以，她甚至不会违抗父亲的意志去跟这位强大存在做出这样的叛逆举动。\n\n但很显然，小龙崽子的担心是多余的。再看到了用肩膀撑住她的小龙崽子服了软，而且用这么弱气的声音\"祈求\"让她的内心爽的不行。她放下了那座对人类而言雄伟无比的城市区划，转而伸出舌头，舔舐了一下小龙崽子滚烫的面容。\n\n§r\"那......小龙，你要让我满意哦～\"§!
  gts_leader_qhai.616.desc: "The dragon had been wearing sandals when she first descended onto the planet. But after she had done some pointless fighting, her shoes were lost within the planet. If Yaorong had the time to focus she could have spotted one in the ocean and the other only 200 meters away from her target. \n\nThe dragon's feet were now right next to her shoes. If she was to just move a little, the shoe may fall to the ground. A fate worse than being crushed with her feet. \n\n§P'Ugh...'§!\n\n§r'Aww, are you upset? Did I do something wrong?'§!\n\nQianhai teased, while nibbling at the sensitive ear of the dragon using her teeth. And her pheromones were making the small dragon weak. The dragon had no words to say, as she knew that she was in the wrong here. \n\nShe was the god of this empire.  She had the best powers at her fingertips. Her father adored her, the world worshipped her, and her sister looked up to her. Everyone wanted her, and she had always taken that for granted. \n\nBut now, this otherwise normal succubus was too much! She was not expecting to be turned red from her own actions. And that Qianhai had started talking as if nothing had happened. \n\n§r'And little one... You should...'§!\n\nQianhai places her hand onto the wrist of little dragon and makes her learn about her body. As Yaorong started to move her hand down, she was taught the secrets that were in here. From the perfect chest, going down to the smooth curves of her side, following down her firm legs, and to the softness of her thighs.... \n\nFinally, Qianhai's hand had been placed on the genitals of the succubus.\n\n§r'Hah! What's wrong, are you scared?'§!\n\n§r'Are you feeling shy as your little friends watching?'§!\n\nThe words felt like fire. And before she could respond, Yaorong looked at the buildings; she glared at the people who were her citizens.  \n\n§r'Trying to pick on the weak, Little dragon?'§!\n\n§r'How about you let me pick on them?'§!\n\nQianhai laughed while picking at the city she had been on. She now held 10 thousand lives in her hands.\n\n§r'Go on, drop them. They would do anything for you right?'§!\n\nYaorong frowned. She knew that her \"little friends\" would die for her. And if it was some sexual act, her small people would do it with ease. But.... \n\n§P'Let them go.....'§!\n\n§P'Can you....?'§!\n\nThe dragon was not so confident anymore. She knows who Qianhai is. And, if she wanted to, the succubus could fit their entire world inside her body. She wouldn't have gone to face Qianhai head on was it not for the need to keep her father's wishes. \n\nBut, it seems Yaorong's fear was nothing. When Qianhai saw that she was giving up, she knew that she had won. She placed the city carefully down and then lightly licked the burning face of the dragon.  \n\n§r'Then... little dragon, you have to please me, ok~'§!"
  # 叹为观止
  gts_leader_qhai.616.option: "Magnificent"
  # 魅魔小姐的足汗
  d_uniform_shoes_qhai_sweaty: "The Succubus's Foot Sweat"
  # 千海在运动时留下的足部汗液，在制服鞋内形成了细小的河流，并不知为何不会随时间蒸发消失并且永远无法开采干净，我们只能承认这是来自魅魔小姐的独特恶趣味吧。
  d_uniform_shoes_qhai_sweaty_desc: "The foot sweat that Qianhai has left behind during her workouts has become like a river inside the uniform shoe.  And for some reason, it never evaporates, so it is now a collection site for the fluid. We can only guess that this is just another hobby of the succubus."
  # 取回失物
  GTS_UNIFORM_SHOES_QHAI_SPECIAL_PROJECT: "Retrieve the Lost Item"
  # 我们在代号为\"鞋柜\"的恒星系中发现了一只天体级大小的制服鞋，即使是可爱的外表也无法掩盖它作为如此庞大的巨娘物品的压迫感 -  - 就像是直接面对那位天体级巨娘本人的行星级双足一般。\n\n因此，为了最大程度地防止不必要的损失与麻烦，我们决定拥抱巨娘的力量，正好千海领袖最近已经摸鱼了非常久，就让宅家的魅魔小姐运动活动活动身体吧。
  GTS_UNIFORM_SHOES_QHAI_SPECIAL_PROJECT_DESC: "It was found that a celestial-sized uniform shoe was in the \"Shoe Case\" system. It may look cute, but it hides its nature as a thing of great power  -  like looking at the feet of the succubus. \n\nTo avoid more unneeded losses and problems, we have decided to embrace this power, as we know that leader Qianhai has been \"off duty\". It may be time for the succubus to have a bit of exercise."
  # §H您好，我是终焉天使安露,现在仅作为主人的女儿而存在，在之后很长一段时间内我将听从您的指挥。§!
  gts_leader_qhai.2000.desc: "§HHello, I am Anlu, the End-of-Times Angel. I exist now only as my Master's daughter. I will follow your orders for the foreseeable future.§!"
  # 是千海介绍你来的？
  gts_leader_qhai.2000.option: "Did Qianhai send you here?"
  # §H是的，我遵循主人的意愿而行动，您不需要质疑我的战斗力，我会碾碎一切敢于阻挡在我面前的敌人。§!
  gts_leader_qhai.2000.respond: "§HYes, I act according to my Master's wishes. You do not have to doubt my combat abilities. I will crush any enemy that dares stand before me.§!"
  # 你身上好像有股熟悉的味道？
  gts_leader_qhai.2000.option.2: "You smell a bit familiar, though?"
  # §H您无需在意这些，这是我属于主人的证明。§!
  gts_leader_qhai.2000.respond.2: "§HYou do not have to mind those little things, it's a sign that I am owned by Master.§!"
  # 终焉天使是？
  gts_leader_qhai.2000.option.3: "What is an End-of-Times Angel?"
  # §H我不能透露与这些相关的内容，非常抱歉。§!
  gts_leader_qhai.2000.respond.3: "§HI cannot disclose any information about that. I am sorry.§!"
  # 你好像对我的态度很糟糕？
  gts_leader_qhai.2000.option.4: "Your attitude towards me seems terrible?"
  # §H没有的事，我会完成您交给我的一切任务。§!
  gts_leader_qhai.2000.respond.4: "§HThat is not true. I will complete any tasks that you give to me.§!"
  # 审判
  gts_leader_qhai.2002.title: "Judgement"
  # \"敌人还没来吗。\"\n\n[event_target:gts_tensi_destroyed_planet.GetName]的防御工事前一位巨娘领袖放下了手头的工作，不自觉地望向了阳光璀璨的湛蓝天际。在与[owner.GetName]正式开战以来，她都没法数清楚自己究竟重复了这个动作多少次，心中的担忧让她就连晚上也难以入眠，生怕自己看不见第二天的太阳。\n\n毕竟开战的国家是拥有天体级巨娘领袖的国度，这种力量在战场无亚于前超光速文明所称的核威慑。可能只是下一秒钟，她们的星球就会在突如其来的袭击中化作某位巨娘领袖丝足之上一缕尘沙。\n\n§H\"已抵达目标星系。\"§!\n\n达摩克利斯之剑终于落下，冷淡的 maiden嗓音凭空响彻在了[event_target:gts_tensi_destroyed_planet.GetName]上每个人的脑海中，与此同时原本万里无云的蓝图逐渐变得昏暗，来自恒星的灼热天光正在失去它应有的效力，直到被不断迫近而来的宏伟白墙所彻底隔绝，[event_target:gts_tensi_destroyed_planet.GetName]在无数个世纪之后首次失去了它所赖以生存的光照。\n\n星球上的应急灯光立刻亮起，但凭借着如此昏暗的光亮，慌乱的人们根本没法看清楚来者的全貌，仅能从目光所及之处，勉强判断出一个令人绝望的事实 -  - 那绵延到黑暗深处并且略有弧线的高墙，也许只是一位 maiden柔软挺拔的胸部。\n\n白发的安露小姐突兀地出现在了星系之中，在她平淡的粉色瞳孔注视之下，灰蓝色的[event_target:gts_tensi_destroyed_planet.GetName]在一个急刹车般的弧线运动之后，便毫无抵抗地便被她乳房的引力所束缚，拉出一个优美的弧度之后于天使小姐挺立的胸部尖端徒劳地开始了公转。\n\n天使小姐无视了胸口米粒大小星球上向她发射而来的可怜火力，轰然张开了背后白色的巨大羽翼，呼啸而去的宇宙飓风扇碎了路径上一切阻挡着的巨构与基地。\n\n§H\"你们的罪名是与主人所在的帝国为敌，因此罪无可赦，判处死刑。\"§!\n\n巨大的天使 maiden在所有仰望着天空的居民面前下达了她个人的审判结果，但这不亚于真正的神明裁决。安露的语气毫无波澜，毕竟她早已习惯了处决宇宙的流程，只不过这次只是将目标换成了小得多的多的行星罢了。\n\n审判敌人的方式总是多种多样，可以是身体的任意一个部位，不过安露最常用的还是用她漂亮硕大的胸部果实将目标放在其中，再用铺天盖地而来的汹涌乳肉将其彻底揉碎。但对于如此渺小的目标来讲，也许用另一种方法会更加的有效。\n\n\"啪嗒、啪嗒。\"\n\n天使 maiden纤手在开始在胸前的衣物上摸索，啪嗒声中，白色衬衫上的扣子自上而下被依次解开，令人绝望的沉寂之中，解扣子声也成了星球上众人的丧钟。最后一颗扣子在 maiden的手指用力间分离，安露被束缚了许久的两只白色大兔子带着可怕的威势迫不及待地弹跳了出来，如果不是天使 maiden有意的用手控制了兔子的活动范围，已经牢牢被吸引在 maiden乳首的[event_target:gts_tensi_destroyed_planet.GetName]可能就会这样滑稽地撞毁在她白皙的肌肤之上。
  gts_leader_qhai.2002.desc: "'Have the enemy arrived yet?'\n\nA giantess leader working at [event_target:gts_tensi_destroyed_planet.GetName]'s defenses had stopped her work to look at the bright sky. Since the war began with [owner.GetName], she has lost count of how many times she has looked out into the sky. The fear in her core has made it impossible to sleep. She was terrified she would not see the sun again.\n\nAfter all, their enemies were led by a leader with celestial power. It was a power comparable to an intergalactic nuke. One moment, everything is good, and the next, the planet is nothing more than a speck of dust at the heel of a giantess.\n\n§H'Arrived at the target system.'§!\n\nThe sword of Damocles had finally fallen. A cold voice rang out in the heads of everyone who resided at [event_target:gts_tensi_destroyed_planet.GetName], and the blue sky had now grown dark. All the light from the star started to fade, and the massive white wall came. For the first time in many eternities, [event_target:gts_tensi_destroyed_planet.GetName] had lost the light that kept it alive. \n\nEmergency lights flickered on, but even with that light, no one could see the entire body of the invader. With what they could see, that they were able to come to a single understanding. The massive white curved wall was nothing more then the chest of a girl. \n\nThe white-haired Anlu appears into the system, her eyes were emotionless as looking down upon her target her planet stops in its tracks and, was now orbiting her breast. \n\nThe angel did not care for the tiny lights aimed at her, and opened her white wings. The universe-spanning wind destroyed their structure and bases.  \n\n§H'Your crime is opposing the empire that my Master has made. And for that, you will all be put to death.'§!\n\nThe giant girl had stated that was going to happen with no emotion behind it.  To everyone who is on that planet, this might as well be from a god. Anlu did not care, for she had done this a million times before. It was just that she had a smaller target this time. \n\nThere were a lot a ways to deal with the enemy and, usually she will use her breasts to crush them. But for one this small, there might be an easier way.  \n\n*Plop, plop.* \n\nThe angel started to undo the buttons on her shirt. She was in a world of dread. Every sound from her was like the death bell of their planet. When the last button was undone, her two white breasts were freed.  If she had not held them in place. The planet would have collided with her breasts and it would have been something akin to a slapstick move."
