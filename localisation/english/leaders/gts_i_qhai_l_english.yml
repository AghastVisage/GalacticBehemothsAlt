  # 要不要来我所在的宇宙，看你平时都没什么娱乐项目。
  gts_leader_qhai.20.option.2: "Why don't you visit my universe? You don't seem to have any entertainment."
  # §r\"呜呜，居然这么为千海妈妈着想，妈妈很感动。\"§!\n\n自己身下所在的粉红腔囊随着千海身体浮夸的动作也微微摇晃。\n\n§r\"其实呢，我之前就有些想法了，找个小小宇宙就当做度假啦，去哪不是去呢。不过要弄一个这么小还能承载我小部分力量的身体真的很难呢。也许过一段时间我就来了，敬请拭目以待吧。\"§!
  gts_leader_qhai.20.respond.2: "§r'Wahh, you're actually thinking about Qianhai-mama, I'm so touched!'§!\n\nThe pink sac she was lying in rocked gently with Qianhai's dramatic movements.\n\n§r'Honestly, I had some thoughts about that, using a little universe as a retreat of sorts. It doesn't matter where it's going to be. But it's very difficult to make a body this small while still being able to contain a portion of my power. Maybe after a while I'll go, just you wait and see.'§!"
  # 这里的其他人也和你一样温柔吗？
  gts_leader_qhai.20.option.3: "Are the others here as gentle as you are?"
  # §r\"这个问题很难说呢，要是你的小小宇宙落到其他人手上，哼哼，我已经想出三百种玩法了。\"§!联系屏幕中的千海仍然保持着温柔的微笑，但感觉背后有些发凉。\"
  gts_leader_qhai.20.respond.3: "§r'That's hard to say. If your universe was to fall into another's hands, hehe, I already have over 300 kinds of ways to mess with them.'§! Qianhai on the comms screen still has a gentle smile, but it still feels like something is off about it."
  # (尝试将手臂捅入千海的子宫口)
  gts_leader_qhai.20.option.4: "(Attempt to shove your arm into Qianhai's cervix)"
  # 一直都是千海玩弄自己，区区魅魔，是时候反击了。热血涌上心头，三步并作两步来到不不远处一个粉红的孔洞之前。看似柔嫩的粉孔在此之前可是能够轻易容纳自己的半身，现在它却如活物一般微微颤动，仿佛在害怕着自己接下来的行动。铆足了劲，用力将右手捅入了滑溜的孔洞之中，手臂插入得异常顺利，一口气就没到了自己肩膀，紧贴着自己皮肤湿滑子宫黏膜仿佛在轻轻的吮吸着自己的身体。\n\n§r\"呜哇。\"§!\n\n随着面板内的千海轻哼出声，容纳自己的小小世界也猛然随之收缩，压着自己的身体紧紧贴在了另外一侧，虽然是柔软的腔壁，但传来的巨力还是使得自己陷入动弹不得的尴尬境地。好在不消多时，粉嫩的软肉便放过了自己。\n\n通讯面板中千海绝美的脸颊上已然浮现出些许红晕，眼神也泛起一旺春水。小手带着斥责的味道一顿一顿点着自己的毫无赘肉的肚子，开口道。\n\n§r\"哼哼，小家伙居然搞突然偷袭真是坏心眼呢，虽然很舒服没错，但是还是安全第一哦，不然把你压扁了的话千海妈妈我可要伤心的，虽然真的发生这种事的话也还能复活就是了，不过那时候你只能算作我身体的一部分了，哼哼，很期待吗。\"§!\n\n屏幕中的 maiden关闭了通讯，淡蓝色的屏幕在面前化作了虚空中的粒子。于此同时肉壁传来 maiden模糊的声音。\n\n§r\"现在千海妈妈还有事情要忙，我的小小房间就随便你折腾吧，小家伙可别让我失望哦，呵呵，魅魔的身体的结实程度可超乎你的想象。\"§!
  gts_leader_qhai.20.respond.4: "It was always Qianhai messing around with her. Now its time for that succubus to get back at her. Blood rushing to her head, she took a few steps toward the pink hole in front of her. The soft pink hole could almost swallow half of herself at this point, now it seemed to be twitching as if it was afraid of what she was going to do. With all of her energy, she shoved her arm into the smooth hole, with her arm quickly inserting itself into her all the way up to her shoulder. The moist mucous membrane felt like it was trying to suck each part of her body in.\n\n§r'Whoa!'§!\n\nAs Qianhai's moan came from the comms, her view of the world seemed to contract and slam her against the other side of her view. It was soft, but the pressure she felt made each part of her body numb. Thankfully, it went away after a while.\n\nQianhai's face on screen was now a bit red, and the look in her eyes were filled with lust. Her tiny hand was tapping on her flat abdomen with anger in a joking way as she spoke.\n\n§r'Hmph, little one is trying to make a surprise attack, you're so bad. It was alright though, but safety first, okay? I'd be so sad if I squished you. Though, if that were to actually happen I can just revive you again, but then you would just be my body part, ha. Are you looking forward to that?'§!\n\nThe girl on the screen then closed the comms screen and it faded to particles in the air. At the same time, the blurred voice of the girl, came from the other side of the wall.\n\n§r'Qianhai-mama still has some business to handle, you can do whatever you want in my little room, but don't disappoint me little one. Hehe, the body of a succubus is more durable then you may think.'§!"
  # 迷路的奇怪巨娘
  gts_leader_qhai.21.title: "A Confused and Strange Giantess"
  # \"我们的首都星球的各种观测设施在刚才同时传来了相同的紧急情报，就在首都星球的附近，毫无征兆地出现了一个极为庞大的天体级巨娘，悬殊的体型对比之下我们的恒星系也许也只能作为她的饭后甜点。但奇怪的是，如此大质量的生物出现在太阳系的上方却没有改变附近的任何引力场，造成任何的人员伤亡。\n\n宇宙中疑似种族疑似魅魔的穿着JK服装的紫罗兰双马尾可爱 maiden似乎陷入了一种迷茫状态，一直在首都星系附近缓缓踱步，似乎在寻找着什么。星空中万千的小行星和各类残骸碰撞在 maiden白皙的肌肤上便化作了芥粉，再大一些的无主星球在 maiden无意识的甩动头发下，便被紫色纤细的发丝轻易切开，就如同热刀划开黄油。\n\n maiden小小的一步便能轻易跨越无数星辰的距离，对比之下 maiden附近渺小的飞船的行进速度可以是忽略不计，在 maiden那遮天蔽日难以看清尽头的身躯极快接近之下，避无可避。就在飞船内所有成员接受了即将到来的死亡时，却被一股无形力量吹到一侧，紧贴着 maiden庞大的身躯躲过一劫。\n\n首都星系在 maiden的来回徘徊中已经于胯下过了几个来回，虽然 maiden没穿内裤的裙底非常的漂亮，干净不着一物的 maiden白虎简直就是世界至宝，但当她那能够轻易摧毁恒星乃至星系横贯穹宇的白色玉柱扫过首都附近的空间时，我们的领袖着实是捏了把汗。\n\n也许 maiden对我们目前抱有善意的态度，但我们不确定她那能随便将恒星系化作身上一缕粉尘的身躯撞上我们时，我们能否像飞船一样幸存下来，我们必须引起她的注意。
  gts_leader_qhai.21.desc: "All of the observation posts on our home planet have simultaneously sent out an emergency message. Very close to our capital planet, a massive celestial-level giantess has appeared out of nowhere. Compared to her size, our star system can be like a dessert after her meal. It is very strange as she doesn't change the gravitational field of her surroundings or didn't cause any casualties.\n\nThe creature that seemed like a succubus from a similar race, with a purple twin tails and wearing a JK uniform, seemed confused, and wandered around our capital system in search of something. Countless asteroids and debris just turn to dust the second they barely touch her white skin. And bigger planets are sliced in half by a simple flick of her slender purple hair. Like a hot knife on butter. \n\nOne simple step of the girl could easily travel the distance of countless stars. Compared to that, the travel speed of our small ships was insignificant. With the fast approach of her body, that was so large that it obscured the sky, it caused those ships to accept their death. However, before it was going to happen, it was pushed away by an unknown force that gently kept them close but without harm on the side of her body. \n\nThe systems have rotated several times beneath the girl's crotch while she wanders around. Although her skirtless crotch was quite beautiful, her pristine white slit was truly a treasure of the world; We were holding our breaths every time the white leg columns that can easily destroy the entire solar system crossed over the capital's air space. \n\nMaybe the girl has good will toward us as of right now, but we don't know if we would survive if her body that can turn solar systems to dust crashes down on us like it did the ships. We must try to attract her attention."
  # [event_target:gts_qhai_daughter.GetName]主动提出前往交涉
  gts_leader_qhai.21.option: "[event_target:gts_qhai_daughter.GetName] volunteers to negotiate"
  # 犽戎已经主动出发了
  gts_leader_qhai.21.option.2: "Yaorong has already set off."
  # 让我们的的HR前往与其交涉
  gts_leader_qhai.21.option.3: "Send our HR department to negotiate"
  # 迷路的奇怪巨娘
  gts_leader_qhai.22.title: "A Confused and Strange Giantess"
  # §r\"唔，明明就是在这附近的啊，我明明再三核验过了。\"§!\n\n在确认了[event_target:gts_qhai_daughter.GetName]所在国家的恒星系坐标之后，千海便将自己的小小分身投入到了微缩宇宙中目标的附近。但当千海睁开双眼时，眼前哪有什么首都星系，广袤无垠的宇宙空间中就连几个行星都看不到。\n\n§r\"这能传送错地方吗，不能吧，这传出去要丢死人了。\"§!\n\n千海一边自语自语一边搜寻着附近的可能目标，可惜一无所获。但千海忽然感觉到另外一边正在工作的自己小腹内部轻轻的锤击感，脑海中也传来了[event_target:gts_qhai_daughter.GetName]的通讯请求。\n\n§r\"咦，小家伙怎么这个时候找我聊天，我明明还想给她一个惊喜呢。\"§!千海意识微动，接通了通讯。\n\n淡蓝色的屏幕自虚空中出现，但出现在屏幕中的却是[event_target:gts_qhai_daughter.GetName]那焦急万分的神色。\n\n\"别乱动啦，再动首都星系就要被你摧毁啦！我现在就在你的裙子下方，往下看！！！\"\n\n§r\"嗯嗯？？\"§!\n\n千海急忙向后退后了几步向下看去，一个只有约莫饼干大小的恒星系出现在视野中，恒星上方则是米粒大小的[event_target:gts_qhai_daughter.GetName]，嗯，她似乎看起来很生气的样子。\n\n千海意识到她传送的地方没问题，只是不小心搞错了分身的体型大小，导致她在首都上方来回转了好多圈也没发现目的地的所在。也许整个首都的人都看清了她没穿胖次的裙底和干净的白虎私处。\n\n§r\"这下社死啦，世界毁灭吧。\"§!
  gts_leader_qhai.22.desc: "§r'Huh, it should have been around here, I checked it again and again.'§!\n\nAfter confirming the coordinate of [event_target:gts_qhai_daughter.GetName]'s star system, Qianhai sent her tiny clone near the target in her miniaturized universe. However, when Qianhai opened her eyes, there was no star system, just the vast space with not even a single planet.\n\n§r'How could I change the transport zone, that's not possible, if that leaked out I'd be so embarrassed.'§!\n\nQianhai muttered to herself while searching for any possible targets nearby, but to no avail. But then Qianhai felt a light thumping sensation on her lower abdomen which was her other self working, her mind received a comms request from [event_target:gts_qhai_daughter.GetName].\n\n§r'Huh, why is she trying to chat with me right now, I was going to give her a surprise.'§! Qianhai thought, and accessed the comms.\n\nA light blue screen appeared in the distance but on the screen was not the image of Qianhai, but [event_target:gts_qhai_daughter.GetName]'s flustered face. \n\n'Stop moving, if you keep on moving you are going to destroy the capital system again! I am right under your skirt, look down !!!'\n\n§r'Huh??'§!\n\nQianhai took a few steps back then looked down. A star system that is around the size of a cookie was now in her vision above it was [event_target:gts_qhai_daughter.GetName] who looked the size of a grain, and looked like she was very angry.\n\nQianhai realized her teleport went to the right spot but she accidentally messed up her body scale. That was why she was wandering so much without finding her target. It also meant that everyone in the capital saw her skirtless underside and pristine white crotch.\n\n§r'This is so embarrassing, just end it all.'§!"
