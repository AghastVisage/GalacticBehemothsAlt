  # 迷路的奇怪巨娘
  gts_leader_qhai.24.title: "A Confused and Strange Giantess"
  # §r\"唔，明明就是在这附近的啊，我明明再三核验过了。\"§!\n\n在确认了[event_target:gts_qhai_daughter.GetName]所在国家的恒星系坐标之后，千海便将自己的小小分身投入到了微缩宇宙中目标的附近。但当千海睁开双眼时，眼前哪有什么首都星系，广袤无垠的宇宙空间中就连几个行星都看不到。\n\n§r\"这能传送错地方吗，不能吧，这传出去要丢死人了。\"§!\n\n千海一边自语自语一边搜寻着附近的可能目标，可惜一无所获。这时千海感觉自己的小腿有什么东西正在轻点她的肌肤，有细小的声音从下方传来。\n\n向下看去，一个体型感觉只有手办大小的小人正用拳头猛击千海的膝盖，在看到 maiden确实看向了她之后，来自巨娘保险的HR整理了衣物，轻咳一声，用最得体的态度向千海发起了对话。\n\n\"您好，我是巨娘保险的HR，您是来巨娘公司应聘职员的吗。您所处的下方正是我们公司的总部，您真是找对地方了。\"\n\n§r\"嗯嗯？？下方？\"§!\n\n千海急忙向后退后了几步向下看去，一个只有约莫饼干大小的恒星系出现在视野中\n\n千海意识到她传送的地方没问题，只是不小心搞错了分身的体型大小，导致她在首都上方来回转了好多圈也没发现目的地的所在。也许整个首都的人都看清了她没穿胖次的裙底和干净的白虎私处。\n\n§r\"这下社死啦，世界毁灭吧。\"§!
  gts_leader_qhai.24.desc: "§r'Huh, it should have been around here, I checked it again and again.'§!\n\nAfter confirming the coordinates of the star system where [event_target:gts_qhai_daughter.GetName]'s country was located, Qianhai sent her tiny clone near the target in the miniature universe. However, when Qianhai opened her eyes, there was no star system in sight, just the vast space where she couldn't even see a single planet.\n\n§r'How could I change the transport zone, that's not possible, if that leaked out I'd be so embarrassed.'§!\n\nQianhai muttered to herself while searching for any possible targets nearby. All of a sudden, Qianhai felt something gently thumping her leg, with the tiny voice coming from down below.\n\nLooking down, was a small figure, that seemed to be the size of a figure, slamming at her knee cap. Once it was clear that she got Qianhai's attention, a well dressed HR from Giantess Insurance, spoke in a practiced tone.\n\n'Hello, I am an HR from Giantess Insurance. Are you here to apply for employment at the Giantess company? Our headquaters is located right here, you have came to the right place indeed.'\n\n§r'Huh?? Down there?'§!\n\nQianhai quickly took a step back, then looked down. A star system that was the size of a cookie appeared in her vision.\n\nQianhai understood that she transported to the right place, but that she messed up with her body scale, and wandered around the capital for hours without noticing. All the while everyone there probably had a clear view of her skirtless underside and pristine white crotch.\n\n§r'This is so embarrassing, just end it all.'§!"
