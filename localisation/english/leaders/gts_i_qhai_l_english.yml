  # 作为天体级生物的科学官却迷失在了一位 maiden的体内，但并非没有离开血肉世界的希望，向穴口探险是唯一的办法。
  gts_situation_qhai_ub_desc: "A scientist officer with a celestial understanding became lost in the body of a girl. But, there might be a chance to leave. Exploring the hole is the only option."
  #  maiden的体内探索
  situation_qhai_ub_tooltip: "Exploration of the Girl's Body"
  # 加把劲探索
  situation_qhai_ub_positive: "Push onward."
  # 在这里的每时每刻都可能遭受生命危险，我必须为自己的生命负责。
  situation_qhai_ub_positive_effect: "Every moment spent in here is a potential death sentence. I have to take responsibility for myself."
