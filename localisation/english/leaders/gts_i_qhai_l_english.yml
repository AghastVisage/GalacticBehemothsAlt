  # §r\"不用担心~没有我的允许的话，你是不会轻易死掉的，毕竟我还没消气呢。不过没想到这样把小人当做足垫的感觉还挺好的，嗯~软乎乎的。\"§!\n\n千海细细品味着足底[event_target:gts_qhai_av_target.GetName]凹凸有致身材传来的不错触感，脚掌开始了下一阶段的蹂躏。\n\n[event_target:gts_qhai_av_target.GetName]痛得浑身抽搐想要尖叫，却忘记了她早就失去了能够喘息的肺部。混乱之中，夹着她足趾终于松开了她的脆弱脖颈，但取而代之是遮天蔽日的巨大脚掌在摩挲间便覆盖了她的全身。就连最后一丝光亮也失去，她的完全被覆盖在了千海的软糯玉足之下，就连挪动手指也无法做到，目盲之中能感受到的只有断断续续传入已经残破不堪的嗅觉系统的 maiden足味，现在的她宛若 maiden脚下的一只可悲足虫。\n\n§r\"不过这样的话，体型还是有些太大了，不太方便接下来的去处呢。\"§!\n\n千海微微皱眉，有些不满于[event_target:gts_qhai_av_target.GetName]现在的大小，微微调整身体的重心，将另一半的体重也一同压到了右脚处。\n\n[event_target:gts_qhai_av_target.GetName]感到从覆盖了全身的 maiden脚掌处传来的重量再度增大，就连她最坚硬的头骨也在这样的重压下支离破碎，渗人的粉碎声中，她的全身都已经化作了一张仿佛被擀面杖碾平了的面皮，但仍然在千海神秘的力量下继续苟活。\n\n<如此的强大的力量，这样可以随便改变她人命运的存在，啊，我居然还妄想将其占为己有，也许我只配叫她主人？>\n\n[event_target:gts_qhai_av_target.GetName]自嘲地想着，现在的她恐怕连作为千海的足虫都早已不够格。更加可悲的是，在如此悲惨的处境之下，她居然可以感受到一种强烈的屈辱快感，源源不断从她已经破烂不堪的身体传达到她的思维中，难道这也是魅魔天生的能力吗。\n\n巨大的脚掌不厌其烦的揉搓着[event_target:gts_qhai_av_target.GetName]，仿佛在搓一颗肉丸子，她的全身都在软肉中融化，好像即将化作千海足部的一部分。[event_target:gts_qhai_av_target.GetName]模糊的视觉发现千海皮肤上的纹路在世界的晃动中缓缓扩大，到最后她甚至可以清晰看清 maiden细密到几乎不可见的毛孔。\n\n<呜，千海主人的脚底。>\n\n也许是斯德哥摩综合征的影响，又或者千海本身的魅力，[event_target:gts_qhai_av_target.GetName]尽全力用她刚刚再生完毕的舌头舔舐着千海光滑的皮肤，为 maiden清理着脚底，但已经只有米粒大小的她伸出的孱弱肉舌，就连让千海提起些许兴致的可能性都没有。\n\n§r\"好，这样就差不多了。\"§!\n\n千海挪开了她的漂亮的玉足，地面上残留着 maiden温热足印，淡淡的白印中间有一个小小的人形物体似乎还在颤动。 maiden从地上随意地拾起了已经缩小完毕的[event_target:gts_qhai_av_target.GetName]，躺回了舒适的床上。
  gts_leader_qhai.67.desc: "§r'Don't worry ~ You're not going to die easily without my permission, as I'm still not finished. I did however think having the tiny person as a foot pad was quite good. Mmm, it's all so soft.'§!\n\nQianhai savors the great texture she feels on her soles coming from the curves of [event_target:gts_qhai_av_target.GetName]'s  body. Her foot starts another wave of torment.\n\n[event_target:gts_qhai_av_target.GetName], in pain, convulses and tries to scream, forgetting that she lost the ability to breathe already. The toes that were clamping her neck release her, and in an instant, a gigantic foot has covered her entire body in the dim light. As her vision is completely lost, her only remaining connection to the world are the faint sensations her nose can still detect for the unique scent of her oppressor. Now she feels nothing more than an insignificant bug beneath her.\n\n§r'However... You are still a little too big. It's a little difficult to work with the way you currently are.'§!\n\nQianhai frowns slightly, displeased with [event_target:gts_qhai_av_target.GetName]'s current size. She shifts her weight and presses her other foot down as well. \n\n[event_target:gts_qhai_av_target.GetName] feels her entire body compress as Qianhai adds more weight onto her. Her skull cracks under the increased pressure and her body crushes into what would be described as a flat patty, but she remains alive under Qianhai's unique powers.\n\n<Such immense power, with the ability to whimsically control fate. And I foolishly thought I could make her mine. Maybe I only deserve to worship her as my master?>\n\n[event_target:gts_qhai_av_target.GetName] mocks herself. At this point, she doesn't even qualify as Qianhai's foot bug. Unfortunately for her, a strong sense of humiliation is mixing with her pleasure receptors, which relays into her conscious mind. Maybe that is a trait of a succubus?\n\nFor what seems like an eternity, the giant foot has its way with [event_target:gts_qhai_av_target.GetName], like she was a meatball. Her entire body dissolves into the soft foot, like her form is about to become one with her foot. In her blurred vision, [event_target:gts_qhai_av_target.GetName] can see Qianhai's skin textures. Everything around her slowly expands, so much so, that she can see her faint pores. \n\n<Ugh, Mistress Qianhai's foot sole.>\n\nPerhaps it was the effects of Stockholm Syndrome, or maybe it's Qianhai's charm. [event_target:gts_qhai_av_target.GetName] makes the effort and uses what's left of her tongue that just healed to lick the beautiful foot of Qianhai. She wants to give her sole a good clean for the mistress. Sadly she became the size of a grain of rice and cannot muster even the slightest of reactions from Qianhai.\n\n§r'Alright, that should be about right.'§!\n\nQianhai lifts her beautiful pristine foot. On the ground remained a warm foot print, and nestled between a white imprint was a tiny moving human figure. The girl picks up little [event_target:gts_qhai_av_target.GetName] and goes back to lay on her soft bed."
