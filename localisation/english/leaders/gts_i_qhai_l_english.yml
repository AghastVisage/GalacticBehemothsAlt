  # 迷路的奇怪巨娘
  gts_leader_qhai.23.title: "A Confused and Strange Giantess"
  # §r\"唔，明明就是在这附近的啊，我明明再三核验过了。\"§!\n\n在确认了[event_target:gts_qhai_daughter.GetName]所在国家的恒星系坐标之后，千海便将她的小小分身投入到了微缩宇宙中目标的附近。但当千海睁开双眼时，眼前哪有什么首都星系，广袤无垠的宇宙空间中就连几个行星都看不到。\n\n§r\"这能传送错地方吗，不能吧，这传出去要丢死人了。\"§!\n\n千海一边自语自语一边搜寻着附近的可能目标，忽然有个极快的事物从她的视野中一晃而过，窜入了她的JK制服之中。\n\n§r\"嗯嗯嗯嗯？？\"§!\n\n犽戎知道，不能让这个巨大的天体级巨娘继续靠近父亲所在的星球，即便她的身躯远超现在的自己，但即使是真正的女神至此，她也绝不会退缩分毫。\n\n能够随手毁灭敌人星球的身体在千海的面前显得格外渺小，可以切开世间万物的利爪却无法在 maiden白皙的肌肤上留下些许白印。于是犽戎立即改变了策略，将目标对准了千海的衣物。\n\n千海用手试图抓住未知的小小生物，但小家伙的动作如泥鳅般滑溜，转眼便游到了她身上的其他地方。小家伙的双足在千海身上沙沙地奔跑弄得她浑身发痒，但更糟糕的是小家伙似乎不停地在切割她的衣物，转眼间千海的上半身制服就只剩下了半边，白嫩浑圆的酥胸就这样暴露在宇宙的空间中。\n\n§r\"呜哇，得寸进尺啊你。\"§!千海有些恼羞成怒了，顾不得遮挡浑身上下泄露的春光，骤然加快了手上的动作。\n\n§r\"嘿，哪里逃。\"§!\n\n成功在小腹处用手压住了衣物下的未知生物，肌肤处传来四肢挣扎的触感，似乎还想逃离。千海将小小的人形生物从已经濒临散架的制服下掏了出来，定睛看去正是黑发金瞳的小龙 -  - 愤怒的犽戎。此刻犽戎黑色的头发都有要变金的迹象，这象征着她即将爆发的怒火。\n\n§r\"犽，犽戎，你怎么变得这么小一只了？\"§! 这还是千海熟悉的折磨了她好几晚的小龙龙吗，看着手心中仍在挣扎的小龙， maiden意识到了真相。§r\"难道说.....\"§!\n\n千海急忙向后退后了几步向下看去，一个只有约莫饼干大小的恒星系出现在视野中。\n\n千海意识到她传送的地方没问题，只是不小心搞错了分身的体型大小，导致她在首都上方来回转了好多圈也没发现目的地的所在，在刚才的胡闹中也许整个首都的人都看见了她衣衫褴褛的窘相。\n\n§r\"这下社死啦，世界毁灭吧。\"§!
  gts_leader_qhai.23.desc: "§r'Huh, it should have been around here, I checked it again and again.'§!\n\nAfter confirming the coordinates of the star system where [event_target:gts_qhai_daughter.GetName]'s country was located, Qianhai deployed her tiny clone near the target in the miniature universe. However, when Qianhai opened her eyes, there was no star system in sight, just the vast space where she couldn't even see a single planet.\n\n§r'How could I change the transport zone, that's not possible, if that leaked out I'd be so embarrassed.'§!\n\nQianhai muttered to herself while searching for any possible targets nearby. All of a sudden, something very fast streaked across her vision, slipping into her JK uniform.\n\n§r'Huh uh uh uh??'§!\n\nYaorong knew she could not let this immense, celestial-level giantess get closer to her father's planet. Even if her body was far larger than her current body, she would not back down even to a goddess.\n\nThe body that could destroy an enemy's planet with a swing seemed so tiny in front of Qianhai. The claws that could cut through anything were unable to even leave a white scratch on the girl's white skin. So Yaorong immediately changed her strategy and aimed at Qianhai's clothing.\n\nQianhai was trying to grab the small unknown creature with her hands, but it was as slippery as an eel and moved to a different part of her body. The creature's legs were running across her with her, scratching against her skin and making her feel itchy. To make matters worst the creature was also cutting through her clothing. Within moments the upper part of her uniform was almost tore apart, revealing her white, plump breasts.\n\n§r'Woah, how cheeky.'§! Qianhai was embarrassed and annoyed, forgetting to cover her exposed body as she quickly acted with her hands.\n\n§r'Hey, where do you think you're going.'§!\n\nShe managed to pin the unknown creature under her clothing with her hand, where she could feel the movement of the struggling limbs. Qianhai pulled out a small human-like creature from her tattered clothes, and when she looked closer, she found that it was Yaorong, the little dark dragon with golden eyes. Yaorong's black hair seemed to turn gold now, a sure sign of her rising anger.\n\n§r'Ya, Yaorong, why are you so small?'§! Was this the little dragon who has tormented her for the past few nights. When she saw the struggling little dragon, the girl realized the truth. §r'Could it be...'§!\n\nQianhai quickly took a step back, then looked down. A star system that was the size of a cookie appeared in her vision.\n\nQianhai understood that she transported to the right place, but that she messed up with her body scale, and wandered around the capital for hours without noticing. All the while everyone there probably had a clear view of her tattered clothes."
