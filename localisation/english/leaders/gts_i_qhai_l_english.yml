  # 这位科学官的本体实际目前位于§r千海§!的子宫内部，存在于此的只是科学官的复制身体。至于什么时候能放她回来？\n§r\"明明大家都是我的东西，还说什么还不还，真是见外\"§!
  gts_trait_qhai2_give_desc: "The body of this scientist is actually currently inside §rQianhai's§! womb. What exists here is but a copied body of the scientist. As for when she can come back?\n§r'We are all mine anyway, why are you talking about returning, how formal!'§!"
  # 体内迷失
  gts_trait_qhai3_give: "Lost Within"
  # 这位领袖似乎迷失在了某位 maiden的体内，目前无法参与任何工作。
  gts_trait_qhai3_give_desc: "This leader seems to be lost inside a certain girl's body, and currently cannot participate in any work."
  # §r汇入██§!
  gts_trait_qhai4_give: "§rMerged with ██§!"
  # 这位领袖的本质已被彻底改变，灵魂已然汇入千海的身体，即便是死去也不再能脱离 maiden的掌控。
  gts_trait_qhai4_give_desc: "The essence of this leader has been completely changed. Their soul has merged into Qianhai's body and no longer can they escape the girl's control, even in death."
  #  maiden的足虫
  gts_trait_qhai5_give: "The Girl's Foot Bug"
  # 这位领袖已完全沉迷于千海的足香之中，如果 maiden呼唤她进入鞋内，她绝对会义无反顾。
  gts_trait_qhai5_give_desc: "This leader is completely addicted to the scent of Qianhai's feet. If the girl calls her into her shoe, she will definitely go without hesitation."
  # 体内迷失
  gts_trait_qhai6_give: "Lost Within"
  # 这位统治者似乎永远迷失在了千海的体内，但神奇的是她居然仍然可以处理工作，不知道是怎么办到的。
  gts_trait_qhai6_give_desc: "This ruler seems to be lost forever inside Thousand Seas' body, but miraculously she can still handle work, don't know how she does it."
  # 情绪低落
