  # §r\"咳哼，刚才只是一个意外，如您所见，这才是我的实际的体型。其实我主要还是来找个地方度假的，如果可以的话还请不要派遣我出去工作，我会给你的国家提供足够的增益的。\"§!
  gts_leader_qhai.30.desc: "§r'Ahem, what happened earlier was just an accident. As you can see, this is my main form. I mainly came here to find a place to relax. If possible, please do not send me out to do work. I'll give your country enough bonuses.'§!"
  # .......
  gts_leader_qhai.30.option: "Was that your largest form?"
  # 在看到了你的样貌后，面前的巨大 maiden罕见的沉默了许久，§r\"......我是不是应该说，好久不见？"§!
  gts_leader_qhai.30.respond: "§r'Of course it was.'§!\n\nQianhai suspiciously looked away. \n\n§r'Please ignore those details. Um....how about this, if you like planetary modification, I can offer you a Qianhai special Love Fluid planetary modification, but only one time.'§!"
  # 刚刚你真的不是故意的吗。
  gts_leader_qhai.30.option.2: "You seem close to [event_target:gts_qhai_daughter.GetName]"
  # 千海的脸上似乎还保留着之前残余的红晕， maiden别过了脑袋去支支吾吾地说：\n\n§r\"嗯 -  - 嗯！是，是故意的，都怪你的首都星太小啦，我还以为是小宇..小石子呢！\""§!
  gts_leader_qhai.30.respond.2: "The blush from before still seems to remain on Qhai's face. The girl turns her head away and stammers:\n\n§r\"Um - um! Yes, it was intentional. It's all because your capital planet is too small. I thought it was a small uni... small pebble!\"§!"
  # 哎，刚才真的是你最大的体型了吗？
  gts_leader_qhai.30.option.3: "Eh, was that really your maximum size just now?"
  # §r\"当然是了。\"§!\n\n千海再次可疑地移开了目光。\n\n§r\"您就不要在意这些细节了，嗯....这样吧，您似乎很喜欢星球改造，我可以为您提供千海专属的爱液星球改造，不过先说好哦，仅限一次\""§!
  gts_leader_qhai.30.respond.3: "§r\"Of course it was.\"§!\n\nQhai looks away suspiciously again.\n\n§r\"Don't worry about these details. Hmm... how about this? You seem to like terraforming. I can provide you with a Qhai-exclusive love fluid terraforming. But let's be clear, only once.\"§!"
  # 你似乎和[event_target:gts_qhai_daughter.GetName]很熟
  gts_leader_qhai.30.option.4: "You seem to be very familiar with [event_target:gts_qhai_daughter.GetName]"
  # §r\"啊，被您看出来了吗。我们之间是有点小小的关系在里面啦。\"§!
  gts_leader_qhai.30.respond.4: "§r\"Ah, did you notice? There is a little relationship between us.\"§!"
  # 向导工作怎么办？
  gts_leader_qhai.30.option.5: "What about the guide work?"
  # §r\"这您就不需要担心了，现在您可以直接找我了也许更方便？随叫随到哦.\"§!
  gts_leader_qhai.30.respond.5: "§r\"You don't need to worry about that. Now you can come to me directly, which might be more convenient? I'm on call anytime.\"§!"
  # 那个提供增益是什么意思？
  gts_leader_qhai.30.option.6: "What does providing buffs mean?"
  # §r\"嗯嗯嗯？我刚才是这么说的吗，我意思其实是只要有我在，你的人民就能更加安居乐业，蓬勃发展啦。\"§!
  gts_leader_qhai.30.respond.6: "§r\"Hmm? Did I say that just now? What I actually meant is that as long as I'm here, your people can live in peace and work happily, and flourish.\"§!"
