  # 紫发的魅魔 maiden毫无预兆地出现在了帝国的恒星系之外，这次变大相比她初次来到这个国家时小了很多，但就算如此，帝国的母星在她的乳头面前依旧要自惭形秽。可毕竟只是偷袭犽戎，只需要比她大亿点点就够了。\n\n§r\"嘿嘿，偷偷摸摸的。\"§!\n\n黑色细长尾巴尖端的紫宝石散发着绮丽的炫光，权能作用下，帝国各个侦察仪器都暂时失去了它们原有的作用，现在即便是犽戎最灵敏的感官也绝对无法感知到她的任何动静，在悄无声息间，带着坏笑的 maiden便鬼鬼祟祟靠近了还在母星旁看得入迷的小小犽戎。\n\n小龙身着红黑白配色的礼服，以惬意的侧躺姿势漂浮在广袤的宇宙空间中，长长的黑红尾巴在千海幽然的注视中时而左摇，时而右摇，在无意识间就将轨道上一些发射器残骸抽成了更细碎的粉末。\n\n尾巴摇得快飞起来了，这真的不是哪来的小狗吗，千海心想。\n\n犽戎烫金永燃的竖瞳目不转睛得盯着父亲工作时的一举一动，似乎就算行星变节，宇宙毁灭，她们也会永远这样相伴下去，又在偶尔伸出青葱的手指，将一些真的胆敢在帝国女神注视下行偷摸狗盗之事的狂徒碾成分子层面的芥粉。\n\n忽然，犽戎感到没来由的脊背发寒，来自真龙的第六感不断敲打着脑海提醒着她危机的到来，危险但不致命，这是食物链最顶层的她从来没有体会过的感受。刚想回头，犽戎便感觉她被两团庞大的极致柔软的事物包裹其中，就视野两侧都被覆盖而来的乳白色的软肉淹没。\n\n§P\"呜，呜，呜\"§!\n\n§r\"嘿嘿，怎么样，小龙龙，虽然我的胸不算大，但挤一挤还是够用的吧~\"§!\n\n千海拉开了她的白色衬衫，带着两点殷红的雪白双峰就这样解开了束缚。 maiden两手挤压在两侧并开始不断揉搓，白花花的软肉便开始持续向犽戎的身周施压，犽戎只觉得口鼻间满是 maiden香甜的体香，就连说出几个字也成了难事，只能发出呜呜的悲鸣。但至少她认出了偷袭她的生物，是当时那个比恒星系还要大的多的奇怪巨娘，好像已经成为了帝国的领袖，应该是叫千海来着？她后来就没怎么没在意这件事。\n\n§P\"呜！！\"§!\n\n但犽戎从来不会坐以待毙，发出了愤怒的呜呜声，就连在双乳间已经被千海兴奋的汗水浸湿的黑色长发也转换成了灿金色，强有力的四肢撑着四周不断包裹而来的软肉，硬生生制造了一个小小的空腔。犽戎这时候尝试变大体型，以求从千海的双乳监牢中挣脱。可惜事与愿违，犽戎惊讶的发现，当她变大时，周围的软肉监牢也一同变大，而她最终仍被夹在白皙的乳房间没有变化。\n\n\"哇啊，小龙别再变大了，要是再大就不好收场了\"\n\n千海狠狠得挤了挤乳间呆愣着的小龙。\n\n§r\"刚才我再一块儿变大那么一点点就要把你的母星碰坏了，得亏咱走的早。不过我们现在已经在星系上方了，你就不用担心你的父亲和小小的星球啦。\"§!
  gts_leader_qhai.601.desc: "The succubus girl appears before the empire's star system without warning. Compared to the last time, she was significantly smaller, but her body was big enough to make the empire's capital planet look small. But for this plan to work it only needed to be a little bit bigger than Yaorong. \n\n§r'Hehe, Sneaky.'§!\n\nThe purple gems at the tip of her tail produced a strange aura that caused all of the empire's sensors to stop functioning for now. Even Yaorong's sensory organs would be unable to sense anything. With a smile, the girl started to move closer to Yaorong. \n\nThe small dragon was wearing a red, black, and white dress and was floating in space, her long tail waiving, destroying space debris that came into her way.   \n\n*Her tail is waiving like a little dog,* Qianhai thinks to herself.\n\nYaorong's burning pupils were watching her father work. It is very likely that even if the universe was to die, she would always be like this. Yaorong then would pick off the fools that dare to start something as she was keeping a watchful eye.\n\nSuddenly, Yaorong felt a chilling sensation. The feeling she had never felt before. Then she was slammed into soft flesh. Her vision was instantly taken over.\n\n§P'Ugh, ugh, ughh.'§!\n\n§r'Hehe, how's it, little dragon? Even if my chest is not the biggest, it is big enough to use as a prison~'§!\n\nQianhai pulls at her white shirt which was keeping her breasts prisoner. She used both of her hands to compress her breast, and as she did, the white flesh starts to push against Yaorong.. The smell of the succubus filled Yaorong's mouth and nose. All she could do is let out weak grunts. But she had to act. She could not forget that she was being attacked by the large woman who had become a leader, It should have been called Qianhai.\n\n§P'Ughh!'§!\n\nBut Yaorong had no intention of accepting defeat, letting out an angry grumble. Her hair was turning a golden colour, and her body was pushing against the c