  # §r\"嗯~应该是这样吧，果然有些不熟练呢。\"§!\n\n魅魔 maiden侧躺在床上，开始了前期的准备工作，千海先用一只手掌向一侧拉扯掰开了她浑圆白嫩的股瓣， maiden粉红诱人的小穴在皮肤的拉力之下开启了的神秘的大门。但今天即将押送[event_target:gts_qhai_av_target.GetName]进入的监牢入口并不是这里，而是在拉扯中同样扩张了些许的粉嫩菊穴， maiden那无毛干净的洞口似乎知道即将有客人到来，自顾自地加快了舒张的节奏。在千海黑色尾巴的帮助下，通往 maiden肠道的括约肌终于被谨慎地开启了部分， maiden的另一只手则是捻着罪犯[event_target:gts_qhai_av_target.GetName]将其对准了如同活物的监狱大门。\n\n[event_target:gts_qhai_av_target.GetName]在千海的两指之间时便恢复了身体的大部分损伤，等到她能够看清眼前事物时，面前只剩下了 maiden白皙庞大的屁股以及张开待客的巨大菊穴，有淡淡的热气从洞口中散出消弭在冰冷的空气中，只是微微张开的湿润洞穴却可以轻易同时塞入数十个她。\n\n<难道这就是我最后的归宿吗？>\n\n在房间白色的光线照射下，她能勉强看见其中蠕动的粉红肠壁，若是以她现在的微小体型进入其中，如此恐怖的活体监牢恐怕只要片刻就会将她送入 maiden的迷宫深处。\n\n§r\"来吧，小家伙，和外边世界做个最后的告别。毕竟也没有下辈子了，我的身体便是你灵魂永恒的归所~\"§!\n\n\"等等 - \"\n\n§r\"嗯~哈啊\"§!\n\n千海并没有给[event_target:gts_qhai_av_target.GetName]道别的时间，夹住她的手指猛地用力，在 maiden的轻吟中，将[event_target:gts_qhai_av_target.GetName]塞入了 maiden漆黑的粉红洞窟之中。\n\n§r\"应该没味道吧，如果你有希望出来的话，再给你做个专访~\"§!\n\n愣神之间，[event_target:gts_qhai_av_target.GetName]摔在了 maiden柔软的肠道之上，裹上了千海体内自然分泌出的大量肠液，但不是关心这个的时候。她身后的菊穴随着白皙手指的缓缓拔出也随之闭合，外界射入的光线以肉眼可见的速度减少，一如她逐渐渺茫的希望。\n\n[event_target:gts_qhai_av_target.GetName]身下的柔软肠道开始了蠕动，源自魅魔的本能反应启动了将她送入深处的进程。[event_target:gts_qhai_av_target.GetName]往着菊穴的方向狂奔，但根本无济于事，就连在波浪般湿滑柔软的粉红地面上站稳也成了奢望。\n\n\"不要，不要！\"\n\n[event_target:gts_qhai_av_target.GetName]嘴上含着无力的话语，手脚并用尽全力蹬出，千海还没有完全拔出手指，她还有机会！但是当她的右腿落在直肠的壁膜上时，突如其来的打滑打碎了她最后的希望。躺在活动的地面上她只能眼睁睁看着千海的手指拔出，活跃的菊穴掐灭了最后一束撒入的微光。\n\n§r\"挺活跃的呢,多闹闹吧，还怪舒服的。\"§!\n\n她一直在移动，周围漆黑无比，[event_target:gts_qhai_av_target.GetName]只知道自身已经身处千海的肠道的深处，离开已经无望，唯一能做的是在这处活体监狱中存活下去，直到千海回心转意的那一刻。在这之后每一天，与她相伴的只会有千海好听的肠鸣和蠕动的肠壁。但也许应该庆幸的是，千海的肠道中没有什么异味，就连粪便大概也不会遇得到。\n\n§r\"嗯哼，处刑完毕~\"§!\n\n千海看了看手指上从体内带出来的些许粘稠液体，在一旁的纸巾上抹了干净。魅魔 maiden最后慢吞吞的动作当然只是她的恶趣味，不过呢，如果她要是真的能赶上末班车，放她一条生路也未尝不可。可惜的是，曾经的泰坦级巨娘已经彻底消失了在她的菊穴入口，并被肠道押送往了她的身体最深处，这一切的一切根本无从谈起。\n\n米粒大小的[event_target:gts_qhai_av_target.GetName]会在一个个肠道转角之后永远迷失出来的方向，当然，千海并不会放任一个小人在她的体内一直玩生存游戏，小小的[event_target:gts_qhai_av_target.GetName]会在她的肠道的吸收下变得更加渺小，直到在最后完全地进入微观世界，又或者在哪个意外中与她的身体融为一体。
  gts_leader_qhai.68.desc: "§r'Hmm~ I think this should be right. I guess I'm not used to this yet.'§!\n\nThe succubus girl lies sideways on the bed, beginning her preparations. First, Qianhai uses a hand to pull apart her rounded, white buttocks, opening the secret gates to her pink, inviting little hole. However, today's entrance to the prison where [event_target:gts_qhai_av_target.GetName] will be taken is not there, but rather in her anus. The smooth, hairless hole seems to aware a guest is arriving.  The sphincter, at the help of Qianhai's black tail, cautiously opens itself. Her other hand has a firm grip on the prisoner [event_target:gts_qhai_av_target.GetName], holding it and aiming it at the gaping maw.\n\n[event_target:gts_qhai_av_target.GetName] fully heals between Qianhai's fingers. When she finally regains her sight, the only thing in view was the towering ass of the giantess and the welcoming hole, with hot air rising from the moist opening. Even barely open, the gaping maw could accept tens of copies of herself. \n\n<Is this where I belong?>\n\nIn the white light of the room, she can barely make out the pink wriggling intestinal walls. If she were to enter, the living prison may send her to the depths of her body. \n\n§r'Come on, little one. Say goodbye to the outside world. After all, there's no next life. My body is the eternal resting place of your soul~'§!\n\n'Wait-'\n\n§r'Hmm, ha-ahh!'§!\n\nQianhai doesn't give [event_target:gts_qhai_av_target.GetName] time to speak. Her fingers suddenly squeeze hard, and in a soft moan, she was pushed into the dark pink tunnel.\n\n§r'I hope it doesn't stink. If you manage to get out, I'll give an exclusive interview~'§!\n\nStunned, [event_target:gts_qhai_av_target.GetName] plops onto the soft walls of Qianhai's intestine. She was wrapped in the fluids naturally secreted by Qianhai's digestive system, but this wasn't the time to care about that. From behind, the ass closes shut after her fingers withdraw, and even the light that was previously entering, diminished like her hopes.\n\nThe soft stomach walls began to writhe, her succubus survival instinct kicks in to push her deeper. [event_target:gts_qhai_av_target.GetName] charges towards the entrance to the anus, but to no avail. Just standing on the slithery, soft, pink floor proves itself impossible. \n\n'No, no!'\n\n[event_target:gts_qhai_av_target.GetName] exclaims weakly and tries to squirm her way out. Qianhai hadn't pulled her fingers all the way out, she still had a chance! But when her right foot lands on the wall of intestines, a sudden slip shatters her final hope. On the squirming flesh she can do nothing as Qianhai's fingers withdraws then the opening closes, and the tiny glimmer of hope fades out.\n\n§r'Pretty active one, huh? Howl away, it's kind of comfortable.'§!\n\nShe continues drifting in complete darkness. [event_target:gts_qhai_av_target.GetName] knows that she is now somewhere in the depths of Qianhai's intestines. Her only option was to survive in this living prison until Qianhai changed her mind. From then on, the only companions she has is the groans of Qianhai's insides, and intestinal walls. Hopefully there won't be any odd smells inside, and that includes the poo.\n\n§r'Done with the execution~'§!\n\nQianhai looks at the sticky fluid on her fingers, and wipes it gently using tissue paper. The succubus girl's slow movements were obviously done on purpose, as her sadistic side was showing. It is not out of her character to let someone go. Unfortunately, the Titan-sized giantess has already been disappeared at the entrance of her anus, and has also been sent into her body's deepest part. Therefore, there is no going back.\n\nThe tiny [event_target:gts_qhai_av_target.GetName] will be lost in the corners of her intestine forever. Qianhai, however, will not permit the existence of any tiny beings in her body for long. As her digestive system processes [event_target:gts_qhai_av_target.GetName] even further into the microscopic world before she eventually merges with her own body."
  # 罪有应得
  gts_leader_qhai.68.option: "Well Deserved."
  # 处刑之后
  gts_leader_qhai.70.title: "After the Execution"
  # §r\"\"晚好~可爱的小小统治者。今天找我有什么事吗？\"§!\n\n你踏入了紫色的传送门又一次来到了千海的房间中，在这颗美丽的宜居星球上窗外夜色已深，但魅魔 maiden并没有什么疲倦的表现，看她不停的手部动作和翻飞的工具，似乎是在制作模型？
  gts_leader_qhai.70.desc: "§r'Good evening~ My cute little ruler. What brings you here tonight?'§!\n\nYou step into the purple teleporter once more and arrive at Qianhai's room. At this beautiful, habitable planet the night has grown deep. However, the succubus girl has shows no signs of tiredness. Judging by her busy hands and surrounding tools, it would seems like she was building a scale model?"
  # [event_target:gts_qhai_av_target.GetName]领袖还活着吗？
  gts_leader_qhai.70.option: "Is leader [event_target:gts_qhai_av_target.GetName] still alive?"
  # §r\"\"居然是这么尖锐的问题吗，好吧。\"§!\n\n千海放下了手上的动作，将她无暇的美丽面孔朝向了你， maiden低垂着眼眸似乎是在仔细感知着什么东西。你仔细端详着 maiden的面容，即便是如此近的距离仍然无法找到一丝瑕疵，此刻你总是会感叹于世界的偏心。\n\n§r\"嗯~感知不到了，我想大概已经是凶多吉少了。\"§!\n\n maiden适时露出了遗憾的表情，不过看她按着小腹的动作，真实心情也许并不是如此。\n\n§r\"不过呢，没准还活着哦，你打算去救她吗？\"§!
  gts_leader_qhai.70.respond: "§r'Such a sharp question, huh? Alright.'§!\n\nQianhai puts her work down, and looks up at you with her flawless face. Her eyes are closed like she was observing something carefully. Even after close observation, you can't seem to find any imperfections at all. At times like these, you always have your doubts because of the unfairness of the world.\n\n§r'Hmm~ Can't sense her anymore. I suppose she's gone.'§!\n\nThe girl shows a hint of sadness, but seeing her fingers rubbing her tummy it seems like her true feelings may not align with her words. \n\n§r'However, maybe she's still alive, would you want to go save her?'§!"
  # 她现在在哪？
  gts_leader_qhai.70.option.2: "Where is she now?"
  # §r\"呵呵，你猜？\"§!\n\n千海站了起来将裸露的美背朝向了你， maiden的体态不算非常丰盈，但胜在匀称且协调。紫发魅魔那被睡裙勾勒出的美妙曲线的臀部就这样优雅地半坐在了书桌上， maiden薄纱般的衣物在压力的拉扯下透露出了浅浅肉色，并隐约可以看到两股之间深邃的向下股沟，黑色的魅魔尾巴从衣服露背处探出在你的正上方波浪式的缓慢摆动，好似挑逗你的心弦；奇异漂浮的魅魔翅膀也在轻轻扇动，掀起的冷冽微风却浇灭不了你滚烫的内心。\n\n你知道千海领袖暗示你的意思什么，但你有必要为已经[event_target:gts_qhai_av_target.GetName]领袖做到这种程度吗。
  gts_leader_qhai.70.respond.2: "§r'Hehe, care to guess?'§!\n\nQianhai stands and turns her beautiful back toward you. The shape of her body wasn't over the top, but it was well balanced and symmetrical. The succubus is now sitting on her desk, and through the thin mesh fabric of her night wear, glimpses of smooth skin underneath show as the fabric tugged due to the weight of her body. In between her two cheeks, you see the dark ravine stretching downwards.  Her black tail protrudes from the back of her dress, waving slowly in a tempting wave above your head. As her succubus wings shift, the cool breeze that is emitted does little to quell the fires in your heart. \n\nYou understand what Leader Qianhai is trying to imply, but do you have to go this far for the sake of [event_target:gts_qhai_av_target.GetName]?"
  # 救！
  gts_leader_qhai.70.option.3: "I'll save her!"
  # 不救！
  gts_leader_qhai.70.option.4: "I won't!"
  # 处刑之后
  gts_leader_qhai.71.title: "After the Execution"
  # §r\"\"啊？\"§!\n\n千海显然还是被你的选择所震惊到了，怎么会有小人真的想要钻到那样污秽的地方去搜寻一个生死不知的领袖，尽管她的肠道是相当的干净的，但身体的消化能力却不是她能够随便控制的。\n\n§r\"不行，不行，你进去可是必死无疑，我可不想费力气再复活你一次。毕竟[event_target:gts_qhai_av_target.GetName]小姐的灵魂早在几天前都已经消化完毕了。\"§!\n\n maiden将跃跃欲试的你推回了原地然后坐回了原位，巨大的白皙手指点着你的脑袋，力度懵逼但不伤脑，仿佛只是想敲醒你污秽的思想。不过听她的话，在上次掉进千海的胃液海里的时候果然已经死了一次，不过根本没有实感，你只在冥冥中感觉你的灵魂已经汇入了一处无边际的巨大事物中。\n\n§r\"好啦，我要继续了，你就找个时间自己离开吧。\"§!
  gts_leader_qhai.71.desc: "§r'Huh?'§!\n\nQianhai was visibly shocked by your decision. It's bizarre for a small person to go inside such a vile place to save an unknown leader. Despite Qianhai's body being impeccably clean, the digestive fluids can't be controlled.\n\n§r'No, no, you go in there you're surely going to die. I don't want to revive you again; besides, Miss [event_target:gts_qhai_av_target.GetName]'s soul have been completely digested days ago.'§!\n\nThe girl pushes away the eager you, and continues on with her previous task. Her huge, white fingers start to poke your head, but the motion was light and not meant to cause you any harm. It was more or less to wake up your twisted mind. However, from hearing her words, you did indeed die from the lake of digestive juices last time. Though they were no pain as you only had a sense that your soul had merged with a vast entity. \n\n§r'Alright, I'm going to continue. You can leave whenever you want.'§!"
  # 尝试接近
  gts_leader_qhai.71.option: "Try to get closer"
  # 看着 maiden专注的动作，你意识到今天还是不要打扰千海比较好，否则可能真的会惹她生气的，上一个这么做的泰坦级'小人'的已经在这个世界上消失无迹。尽管你们之间的关系还不错，但还是不要这么做为好。
  gts_leader_qhai.71.respond: "Watching the concentrated movements of the girl, you understand that today isn't a good day to disrupt Qianhai. If you did, she could be seriously upset. Just ask the Titan-sized small person that did not exist anymore. Even if you both had a good connection, it was better to avoid that outcome."
  # 离开
  gts_leader_qhai.71.option.2: "Leave"
  # 处刑之后
  gts_leader_qhai.72.title: "After the Execution"
  # §r\"\"哼哼，真是寡情无义呢。不过的确是正确的选择，那个小家伙早就连灵魂都被我消化了，你再进去不过是变成我的一丝营养而已。\"§!\n\n千海坐回了原位，灵活修长的手指拿起了桌上比你要大得多的钳子，继续了她的模型大业。\n\n§r\"我要继续了，你的话请随意哦~\"§!
  gts_leader_qhai.72.desc: "§r'Hmph, how heartless. But it was the right choice. That little one has been completely digested, even their soul is gone. If you enter you'll only become a source of nutrition for me.'§!\n\nQianhai returns to her seat, and with her slender fingers, picks up a pair of pliers much bigger than yourself, and continues her model building.\n\n§r'I'm going to continue. You can feel free to do whatever you want~'§!"
  # 尝试接近
  gts_leader_qhai.72.option: "Try to get closer"
  # 看着 maiden专注的动作，你意识到今天还是不要打扰千海比较好，否则可能真的会惹她生气的，上一个这么做的泰坦级'小人'的已经在这个世界上消失无迹。尽管你们之间的关系还不错，但还是不要这么做为好。
  gts_leader_qhai.72.respond: "Watching the concentrated movements of the girl, you understand that today isn't a good day to disrupt Qianhai. If you did, she could be seriously upset. Just ask the Titan-sized small person that did not exist anymore. Even if you both had a good connection, it was better to avoid that outcome."
  # 离开
  gts_leader_qhai.72.option.2: "Leave"
  #  maiden的日常
