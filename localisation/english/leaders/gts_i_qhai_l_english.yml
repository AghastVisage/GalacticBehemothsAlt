  # 大概是初次见面
  gts_leader_qhai.50.title: "First Meeting"
  # 最近\"刚招募\"的千海领袖告诉你，如果想要更快地联系到她，比起叫她过来，你自己过去会更加便捷。只要需要默念她的名字就能打开前往她家中的传送门。\n\n§r\"面对面交谈可比通讯快多啦。\"§!\n\n你的早就知道千海并不是那种坏坏的巨娘，于是在你闲下来之后，你秉持着与你的向导巨娘加深羁绊的想法，选择孤身一人前往千海的家中。心中默念，一道散发着淡紫色光芒的门扉从虚空中凭空出现。\n\n踏入炫目的传送门，视野在刹那间完全被光芒覆盖，在思维混乱之间前脚踏上了一片硬质的大地，你睁开眼睛观察四周，根据你丰富的经验，当前似乎正处于木质的桌板之上，周围的放置的笔筒台灯都比你日常遇到的大上几十倍，相比之下你就只和一旁的放倒的橡皮等高。\n\n你向前仰头看去，巨大的魅魔 maiden霸占了你的整个视野， maiden不讲道理的美貌在体型的加持下更具破坏力。淡紫色双马尾的千海领袖此刻正津津有味看着手上的实体书籍，你却也难以移开自己的视野，也无处能够移开， maiden那紫罗兰色的深邃竖瞳将你的心神牢牢锁在其中。\n\n许久，你从 maiden的美貌中艰难地回过了神，转移注意力般地强迫自己看向了 maiden正在看的书籍，书本标题似乎是《群星的MO - 》，正当你想上前几步看清剩下的书名时， maiden终于发现了你的存在。千海将巨大的书籍轻轻放在了你的一侧，扬起的风压仍旧吹得你衣角猎猎作响。
  gts_leader_qhai.50.desc: "The recently \"newly recruited\" leader Qhai tells you that if you want to contact her faster, it's more convenient for you to go to her than to call her over. Just silently reciting her name will open a portal to her home.\n\n§r\"Talking face-to-face is much faster than communicating.\"§!\n\nYou already knew Qhai isn't a bad giantess, so after you had some free time, upholding the idea of deepening your bond with your guide giantess, you chose to go to Qhai's home alone. Reciting silently in your heart, a portal emitting a pale purple light appears out of thin air.\n\nStepping into the dazzling portal, your vision is instantly completely covered by light. Amidst chaotic thoughts, your front foot steps onto hard ground. You open your eyes and look around. Based on your rich experience, you seem to be on a wooden tabletop. The pen holder and desk lamp placed around you are dozens of times larger than what you usually encounter. In comparison, you are only as tall as the eraser lying on its side nearby.\n\nYou look up and forward. The giant succubus girl occupies your entire field of view. The girl's unreasonable beauty is even more destructive with the blessing of her size. Leader Qhai, with her pale purple twin-tails, is currently reading a physical book with relish. It is hard for you to look away, and there is nowhere else to look. The girl's deep violet vertical pupils firmly lock your mind within.\n\nAfter a long time, you struggle to recover from the girl's beauty. To divert your attention, you force yourself to look at the book the girl is reading. The book title seems to be \"Stellaris MO - \". Just as you want to step forward to see the rest of the title clearly, the girl finally discovers your presence. Qhai gently places the huge book beside you. The wind pressure raised still blows your clothes flapping loudly."
  # 打个招呼
  gts_leader_qhai.50.option: "Say hello"
  # 大概是初次见面
  gts_leader_qhai.51.title: "First Meeting"
  # §r"啊，抱歉刚刚没看到你，总而言之，欢迎光临，这里是千海的温馨小窝。"§!\n\n千海从不知道什么地方挪过来了几个小小的桌椅，甚至有搭配好的茶具，都是刚好适合你的尺寸。\n\n§r"嗯，也许你有发现自己的体型和平时好像不太一样，事实上不管是天体级还是微生物，到我这后都会是这个大小呢。至于为什么，当然是我比较喜欢这个体型差距哦。好啦，找我有事的话就直说吧。"§!\n\n千海的脸上似乎泛起了些许可疑的红晕，但眼下并不是怀疑和欣赏的时候。
  gts_leader_qhai.51.desc: "§r'Ah, sorry. I didn't see you earlier. All in all, welcome to Qianhai's cozy little home.'§!\n\nQianhai moved some small chairs and tables that she got from somewhere, there even was a set of tea ware. Everything was sized for you.\n\n§r'Hmm maybe you already noticed that your size isn't what it normally is. In fact, whether you are a celestial giant or a microorganism, you will be this size here. Why, you ask? Well, I like this size difference. Well, if you have something you wanted to say to me, let it out.'§!\n\nQianhai's face was flushed red, but this was not the time to admire or question."
  # 你刚刚在看什么书？ 
  gts_leader_qhai.51.option: "What book were you reading?"
  # §r\"啊，这个可不能告诉你，是 maiden的秘密哦。不过作为补偿，用另外一个秘密交换吧。\"§!\n\n千海拉近了距离，声音细小到只有你才能听得到：\n\n§r\"其实艾普露最开始的时候是好猫猫，而不是现在这样浅草的猫娘哦。\"§!
  gts_leader_qhai.51.respond: "§r'Ah, that is something I can't tell you. It's a girl's secret. But to make it up to you, how about I trade you for a secret?'§!\n\nQianhai leaned closer, and whispered so you could only hear her:\n\n§r'Actually, Apro was a good cat at the beginning, not those promiscuous catgirl she is right now.'§!"
  # 你说能够提供一次星球改造？ 
  gts_leader_qhai.51.option.2: "Did you say you can provide planetary modification?"
  # §r\"是有这么回事来着，如果你决定好了目标就和我联系吧，不过最好还是提前撤离星球上的居民哦，虽然我知道你肯定不会听我的，哼哼。\"§!
  gts_leader_qhai.51.respond.2: "§r'Oh yeah, I did say that. If you have decided on the planet, just contact me. But you should probably evacuate the citizens of those planets quickly. Though I know you'll probably just ignore me, hmph.'§!"
  # 你是恶魔吗？
  gts_leader_qhai.51.option.3: "Are you a succubus?"
  # §r\"这不是明知故问吗，你看这尾巴，你看这翅膀，还有我头上的角，虽然样式是和传统魅魔有些不同，但是如假包换哦。\"§!\n\n千海站起身转了个圈，向你展示了全身的种族特征，嗯，翅膀很白，尾巴很大，总之就是非常漂亮。
  gts_leader_qhai.51.respond.3: "§r'Isn't that obvious? Look at this tail, these wings, and the horns on my head, even though they look a bit different from other succubi, they are the real deal.'§!\n\nQianhai stood up and spun around showing her racial features. Hmm, the wings were very white, and the tail was very big, overall very beautiful."
  # 没事了
  gts_leader_qhai.51.option.4: "It's nothing."
  # 大概是初次见面
  gts_leader_qhai.52.title: "First Meeting"
  # §r\"嗯，没别的事了吗，那我就继续看书了。你从来时的传送门就能回去了，但如果你想待久一点我也不拦你哦，不过可别乱跑。\"§!\n\n千海换了另一本书开始津津有味地看了起来，这回你看清了书的标题，嗯，是《如何合理摸鱼》
  gts_leader_qhai.52.desc: "§r'Hmm, anything else? If not, then I'm going back to my book. You can go back through the portal you came through, but feel free to hang around if you want, but try not to wander.'§!\n\nQianhai swapped her book, and began looking at the new one. You noticed the title this time, 《How to Log Off Effectively》."
  # 尝试爬上千海搭在桌子上的手。
  gts_leader_qhai.52.option: "Try climbing onto Qianhai's hand on the table."
  # 你好不容易爬上了 maiden的手背，还没来得及感受脚下柔软的皮肤， maiden用另一只手的两根手指将你精准的捏了起来。洁白的纤手柔若无骨，虽然千海用的力气恰到好处，被夹在中间的你并没有感到疼痛，反而有种天堂般舒适的触感，但你毫不怀疑此时千海只要轻轻用力，你就会化作 maiden指尖的一抹血色， maiden将你放回了原地，并狠狠瞪了你一眼，随后继续专注看书了。
  gts_leader_qhai.52.respond: "You barely managed to climb onto the back of the girl's hand. But before you could feel the soft skin of her hand, she picked you up with two fingers, your form perfectly captured between them. Her fingers, although soft, were still very strong. You were not feeling any pain being held between them, in fact it felt like heaven. However, you did not doubt that Qianhai could easily kill you with a simple squeeze.  The girl put you back to the table and glared at you, then looked back to her book."
  # 尝试够到千海的酥胸。
  gts_leader_qhai.52.option.2: "Try to reach Qianhai's breasts."
  # 你从千海微微抬起的书本下方钻过，爬到了 maiden挺立的胸部面前， maiden的罩杯并不大但是胜在匀称，至少倾斜的弧度让你还能有攀登的机会。\n\n千海歪着头奇怪地看着你的一举一动，面对着 maiden的注视你也不藏着掖着，一个起跳抓住了 maiden宽松的白衬衫，此刻你展现出了惊人的身体能力，在陡峭的南半球上便开始向上攀登。\n\n就在你即将达到北半球时，所在的高度骤然下降，你只感觉自己陷入了沉重温软的物体之中，铺天盖地的软肉压制了你的胸腔，窒息了你的口鼻，就连呼吸也成为了奢望。\n\n就在你即将晕厥时，身上传来的巨大压力猛然减轻， maiden将你从她致命的乳压之下解放了出来，鼻尖似乎还残留着 maiden的体香，你知道这只是来着千海的一个小小的惩罚，警告你不要再整花活。\"
  gts_leader_qhai.52.respond.2: "You crawl under the book Qhai slightly raised and climb to the girl's perky chest. Her cup size isn't large but is well-proportioned, at least the slope gives you a chance to climb.\n\nQhai tilts her head and looks at your every move strangely. Facing the girl's gaze, you don't hide anything. With a jump, you grab the girl's loose white shirt. At this moment, you show amazing physical ability and start climbing up the steep southern hemisphere.\n\nJust as you are about to reach the northern hemisphere, your altitude drops suddenly. You only feel yourself sinking into a heavy, warm, and soft object. Overwhelming soft flesh suppresses your chest cavity, suffocating your mouth and nose. Even breathing becomes a luxury.\n\nJust as you are about to faint, the huge pressure on your body suddenly lightens. The girl releases you from her deadly breast press. Her body scent seems to linger on the tip of your nose. You know this is just a small punishment from Qhai, warning you not to play tricks again.\"
  # 尝试从桌子边缘跳到千海的腿上。
  gts_leader_qhai.52.option.3: "Try to jump from the table to Qianhai's leg."
  # 大概是初次见面
  gts_leader_qhai.53.title: "First Meeting"
  # 瞄准了千海裙子下漏出了小半截的光滑大腿，你进行了一段短暂的加速跑并高高跃出，在空中划出了一个优美的弧线，可下落刚过半程，一条黑色的长条物体精准地在空中接住了你，你迫不得已抱住了不明的温热物体，巨大的粗壮物体你甚至无法环抱，仔细看去竟是千海那总是在身后摇摆的尾巴。\n\n maiden的尾部表皮柔韧并且光滑，如果一不小心掉下去的话.....你并不敢想那种可能性。在一段缓缓的抬升中，你挂在尾巴上被迫提到了千海的正眼前，被 maiden绮丽的紫罗兰竖瞳盯着，你有种灵魂出窍般的恍惚，千海眼睑闭合之间有发自本能深处的恐惧涌上心头，看着你的呆愣的样子千海的眼中升起了些许无奈。\n\n§r\"你，哎 - 好吧，我早该想到的。\"§!千海微微叹气， maiden的声音不大，但是由于距离很近还是震得你脑袋有些嗡嗡的响。
  gts_leader_qhai.53.desc: "Aiming at the small section of smooth thigh exposed under Qhai's skirt, you make a short sprint and jump high, drawing a beautiful arc in the air. However, just halfway through the fall, a long black object catches you accurately in the air. You are forced to hug the unknown warm object. You can't even wrap your arms around the huge thick object. Looking closely, it turns out to be the tail Qhai always wags behind her.\n\nThe skin of the girl's tail is flexible and smooth. If you accidentally fall off... you don't dare to imagine that possibility. During a slow ascent, hanging on the tail, you are forced in front of Qhai's eyes. Stared at by the girl's beautiful violet vertical pupils, you feel a trance like an out-of-body experience. As Qhai's eyelids close, fear from deep instincts wells up in your heart. Seeing your dazed look, a hint of helplessness rises in Qhai's eyes.\n\n§r\"You... *Sigh* - alright, I should have thought of that.\"§! Qhai sighs slightly. Her voice isn't loud, but because of the close distance, it still makes your head buzz."
