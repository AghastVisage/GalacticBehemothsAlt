  # \"嘿咻\"\n\n[event_target:gts_qhai_daughter.GetName]手脚并用的又爬过了一片湿润的肉褶，随着时间推移，自己的体型仍然在不断得加速变大，目前体型已经能够有附近褶皱的一半还高了，这让[event_target:gts_qhai_daughter.GetName]的攀登更是得心应手。\n\n\"看来，以目前的变大速度，我的前进效率会越来越高，但也许这不是什么好事。\"\n\n[event_target:gts_qhai_daughter.GetName]自言自语着，手上把玩着前段时间在一片褶皱中意外发现的完整微缩宇宙，它以未知的原因成功躲开了无尽的肉壁摩擦，将自己保存了下来。但这能够抚育亿万生灵的小小世界现在还没有自己的巴掌来得大，已经不止一次，自己将它塞入自己的穴内以排解这段时间积压下的性欲。\n\n随着自己体型不断的变大，[event_target:gts_qhai_daughter.GetName]意识到，原本施加在自己身上的某种时间限制似乎逐渐失去了效用。自己脚下的软肉开始更加活跃，肉壁的蠕动与收缩越发频繁有力，这些现象都意味着，成为了自己整个世界的 maiden，在美妙的梦乡之后，就要醒来了。\n\n§r\"哈~啊~，这一觉睡得可真舒服。\"§!\n\n在一间摆满了各种精美手办和各种海报画作的以紫色为主色调的房间中，紫发紫瞳 maiden睁开了惺忪的双眼，伸了个懒腰。她的身上不着寸缕，大方的展示着自己如雪般纯洁的玉体，柔顺滑腻白瓷般健康的皮肤让视者瞩目，圆润挺拔的酥胸，丰满的臀部，都仿佛是世界极尽所能雕刻的杰作。但 maiden身上的非人之处也不可忽视，犹如恶魔般后绕的黑色双角，以及纤长光滑的黑色魅魔尾巴正缠绕在优美的大腿根部，让漂亮的鼠蹊部更加突出，为 maiden更增了几分诱惑。鼠蹊部间则是 maiden最神秘的三角区，纯洁无任何毛发的 maiden蜜穴就在此处。\n\n§r\"居然梦到了有小人在我的小穴里乱跑找不着北。\"§!\n\n maiden撑起身子，用手揉了揉她有着姣好弧度的小腹，似乎里面真的有些许细小的动静传来，嘴上吐槽不停.\n\n§r\"肯定是昨晚怪阿姨在硬我里面塞了太多微缩宇宙导致的，哪有直接用瓶子往里倒的，一点都不怜香惜玉。\"§!\n\n maiden随性之下的揉动小腹，却给蜜穴内的[event_target:gts_qhai_daughter.GetName]可带去了灭顶之灾，她全力也无法撼动的穴肉世界，在 maiden手部的动作下随意搓揉变形。此刻天空与大地轻吻，穹顶的骤然落下，即使是[event_target:gts_qhai_daughter.GetName]已经变大的身体也不敢不躲避，幸好周围就有一处内凹的褶皱，这才让她躲过了这次灭顶之灾。\n\n环顾四周， maiden从旁边的柜子的瓶子旁拿起了一张纸条，上面用娟秀的字迹写着：\n\n致千海：\n\n昨晚不小心玩过头了呢，里模式的千海真的有点恐怖呢，姐姐我的腰都有点疼了，得好好歇几天，下次再来找你玩哦。这瓶微缩宇宙就送给你了，不用谢。\n\nBy 雁栖\n\n§r\"哈啊，强硬的冲进人家的房门，现在又拍拍屁股跑了。等着吧，这仇我一定会报的，下次我会用尾巴把你整个都吞下去，哼\"§!\n\n千海轻哼一声，将纸片精准得飞进了一旁的垃圾桶中，这件事她已经记下了，不是不报，时候未到。\n\n§r\"事已至此，还是先看看有那些有趣的事情发生了吧，还好昨晚用的不是我收藏的小小宇宙。\"§!\n\n咸鱼翻面， maiden将自己整个翻了个身，将裸露的柔软乳肉在床上压出了美妙的弧线，舒舒服服地在床上开始用权能翻看最近关注的几个微缩宇宙中发生的事情。\n\n至于 maiden体内的小人，在刚才的巨变中也许就没这么好运了。
  gts_leader_qhai.5.desc: "'Heave-ho'\n\n[event_target:gts_qhai_daughter.GetName] had crawled over another patch of moist flesh. As time passed, her size continued to grow at an accelerated rate. She was now almost half the height of the surrounding folds. This made [event_target:gts_qhai_daughter.GetName]'s climb all the more effortless.\n\n'It seems with my current size increase rate, my mobility rate will increase, but this is perhaps not a good thing.'\n\n[event_target:gts_qhai_daughter.GetName] said to herself, playing with a miniature universe that she accidentally found in a fold a while back. It had managed to avoid endless friction with the fleshy walls for unknown reasons, preserving itself. But this small world that could have raised billions of lives was smaller than her own hand. She had already, more than once, stuffed it inside her own honeypot in order to ease the pent-up sexual desire.\n\nAs her size continued to increase, [event_target:gts_qhai_daughter.GetName] realized some time restrictions that had been placed upon her seemed to gradually lose its effect. The soft flesh under her feet became more active, and the contractions of the fleshy walls become more frequent and powerful. These phenomena all indicated that the girl who had become her entire world, was about to wake up from her wonderful dream.\n\n§r'Haaa~ah~, that was a nice sleep.'§!\n\nIn a room decorated with various exquisite figurines and posters, mainly colored purple, a purple-haired, purple-eyed girl opened her sleepy eyes and stretched. She was naked, generously displaying her pure white body, her smooth and healthy porcelain-like skin was eye-catching, her round and perky breasts, and plump buttocks, all seemed to be masterpieces sculpted by the world's utmost efforts. But the inhuman aspects of the girl's body cannot be ignored either. Demonic backwards-curving black horns, and a slender smooth demon tail was coiling around the base of her beautiful thighs, making her beautiful groin area more prominent, adding a few more points of enticement. Between her thighs was the most mysterious triangle of the girl. A pure, hairless honeypot was located there.\n\n§r'I had a dream of little people running around lost in my honeypot.' §!\n\nThe girl propped herself up and rubbed her well-curved abdomen as if there was some faint movement inside, complaining while she did so.\n\n§r'It must be because that perverted auntie stuffed too many miniaturized universes inside me last night. Why would you just pour it in with a bottle, don't you pity me one bit?'§!\n\nThe girl casually rubbing her abdomen caused a great catastrophe for [event_target:gts_qhai_daughter.GetName] inside her honeypot. The world of fleshy walls she couldn't normally move was easily deformed by the movement of the girl's hand. The sky and earth gently kissed each other when suddenly the ceiling fell down, even [event_target:gts_qhai_daughter.GetName]'s increased size could not help but flee. Fortunately there was an indented fold nearby for her to hide in.\n\nLooking around, the girl picked up a piece of paper near a bottle on a nearby cabinet. The paper was written in elegant script:\n\nTo Qianhai:\n\nI accidentally went overboard last night. Inner-side Qianhai is actually kind of scary. My waist is a bit sore, I'll need a few days rest. I'll come back to play next time. This flask of miniaturized universes is for you, don't mention it.\n\nBy Yanxi\n\n§r'Ha, she barged into my room forcefully, and now she's just going to run away. Just you wait, I'm going to get my revenge. Next time I'll swallow your whole body with my tail, humph!'§!\n\nQianhai snorted, and throw paper into the nearby trash can. She had remembered this incident. It was not forgotten, just not yet time to collect.\n\n§r'Now that that is settled, let's see what interesting things have happened, thankfully I did not use my collection of tiny universes last night.'§!\n\nThe salty fish had flipped. The girl turned her whole body over and let the soft flesh of her breasts make beautiful arcs on the bed, and comfortably started using her powers to watch what was happening in the few miniaturized universes she had been paying attention to. As for the little person inside of her, she might not be so lucky with the recent change."
