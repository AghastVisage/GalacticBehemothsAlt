  # §r\"噢，你说的是另外一边吗，大小确实可以随意调整呢，就算大到一口吃掉银河系都不在话下哦~不过千海妈妈我变太小可不接受。\"§!
  gts_leader_qhai.37.desc: "§r'Oh, are you talking about the other me? Yeah, her size can change freely, I can even grow to swallow the entire galaxy in one bite~ But Qianhai-mama would never accept being too small.'§!"
