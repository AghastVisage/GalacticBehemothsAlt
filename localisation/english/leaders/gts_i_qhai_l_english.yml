  edict_gtsra_contact_qhai_desc: "Use the communication tool given by Qianhai to chat with her."
  # 执行之后将会打开和千海的通讯频道，也许可以触发一些事件。
  gtsra_contact_qhai.tooltip: "Executing this will open communication channels with Qianhai, that may trigger some events."
  # 天体级科学官的突然失踪
  gts_leader_qhai.2.title: "Sudden Disappearance of a Celestial-level Scientist"
  # 在身上搭载全套科研建筑群和以及一个巨型手持放大镜式观测设备的天体级巨娘在前往任务星系执行调查任务时突然失去了信号，[this.getname]立即派出的救援队伍在抵达事发星系时附近时，只发现了遭受到严重破坏科研建筑群，身处其中的科研人员死伤惨重，只有寥寥几个具有泰坦体型的巨娘存活了下来。\n\n在幸存者的复述之下，我们得以了解[leader]失踪的全过程。[leader]在接近恒星系时，观察到星系内的星球与往常完全不同，其周围出现了奇特的空间错乱，同时存在着多种类型星球的特征，又在刹那间改变；同时存在多个时代的星球特征，但又好像并非如此。\n\n见多识广的巨娘表示她甚至见到了从未在记忆中出现过的时代和景色:\n\n"感觉就像是屏幕故障时的花屏，电脑报错后的乱码。当时我就在想，让领袖上去'邦邦'拍两下能不能就和修老电视一样修好。但没等到我开口，领袖她就.....消失了。\"\n\n在[leader]尝试更接近快速闪动的故障星球时，[leader]附近时空也出现了某种故障，空间突然发出刺耳的故障音声并开始超乎寻常的抖动，并且伴随大量空间碎屑的脱落，仿佛世界即将崩坏，脆弱的科研设备在瞬间便变形损坏，体型较小的巨娘和[leader]身上的小人殖民地也难逃厄运。\n\n离奇的是，空间即将达到彻底毁灭的临界点时，好像有一只手抚平了水面的涟漪，转瞬之间便平息了下来，就连周围的故障星球也恢复了正常。但[leader]那巨大到可以轻松碾碎行星的身躯却毫无预兆的消失在了原地。
  gts_leader_qhai.2.desc: "A celestial-level giantess, equipped with a full suite of research facilities and a giant magnifying glass-like observation device, suddenly lost signal while on a survey mission to their assigned star system. Rescue teams immediately dispatched by [this.getname] found the research facilities severely damaged upon arrival. The research personnel were severely injured, with only a handful of titan-sized giantesses surviving.\n\nFrom the survivors' retelling, we were able to piece together what had happened. Upon approaching the star system, [leader] observed the planets within to be completely different from usual, surrounded by strange spatial distortions. They exhibited characteristics of various planet types, yet changed in an instant; they also seemed to exhibit planet features from multiple eras, yet they were not quite that.\n\nThe knowledgeable giantesses said that she even saw eras and scenery that did not appear in the records. 'It was like the static of a broken screen and the garbled text after a computer error.' At the time I even thought to take her up there and 'bang bang' on that planet to fix it like an old TV. However before I could say a word, the leader... disappeared.\n\nAs [leader] attempted to approach the quickly flashing glitched planet, something went wrong with time-space around her. Spatial faults appeared with piercing noises, violently shaking accompanied by large amounts of space debris, looking like the world was going to fall apart. The fragile research facilities transformed and broke in an instant. The smaller giants and the little people colonies on [leader] were also struck with disaster.\n\nStrangely, when space was at the verge of a catastrophic destruction, it was somehow as if a hand had smoothed the ripples, and immediately calmed down, and the glitched planets returned to normal. However [leader]'s large body, one that could easily crush a planet, had disappeared without a trace."
  # 这是怎样的伟力，全力搜寻！
  gts_leader_qhai.2.option: "What kind of power is this? Search with all our might!"
  #  maiden的粉红世界
  gts_leader_qhai.3.title: "The Girl's Pink World"
  # 周围时空的混乱没有持续很久，嘈杂的声音和光怪陆离的光景逐渐从脑海中抽离，恍惚之后，[event_target:gts_qhai_daughter.GetName]惊奇的发现自己已经身处异处。这里并非此前的熟悉宇宙，而是一片广阔到不可思议的封闭空间。\n\n自身正处在两片的延伸到视线尽头的粉色山脉之间，两侧的高山有节奏的舒缓的进行摇摆。沿着末端的粉色墙壁向上看去。洞窟的穹顶高到不可企及，以肉眼已经难望极限。仔细观察被山脉遮挡了视野的顶部，整个洞窟似乎都在进行有规律的收缩和扩张。连带着自己脚下的粉色大地一同进行运动。\n\n<扑通，扑通>\n\n沉闷的声音有节奏的充当着背景音乐不断敲击着[event_target:gts_qhai_daughter.GetName]的鼓膜，自己身下本就如同活物一般上下慢慢起伏的地面也随之轻微的震动。仔细感知之下，似乎还能听到液体奔流的声音。\n\n\"感觉好像在生物的体内一样。难道说\"\n\n[event_target:gts_qhai_daughter.GetName]蹲下用手轻按粉色的大地，入手之际触感温热而滑腻，但全力下压却又难以撼动丝毫。奇异的是，地面一直有涓涓细流从地面慢慢渗出，积少成多，在地面上形成了厚厚的水膜, 给移动造成了相当的困难，这也许就是远处湖泊的成因。这种不断渗出的液体粘稠湿滑而透明并带着沁人身心的迷人香气，如果喝上一口怕是会甘心溺死其中。\n\n<扑通，扑通>\n\n有节奏的巨响，如活物般的洞窟，天边垂挂的粘稠丝线，还有隐隐可以听到的内脏蠕动音声。在汇总了周遭的种种发现，并结合自身充分长期作为人体殖民地的经验，这些现象此刻便也一一有了对应。\n\n\"不会吧。\"\n\n[event_target:gts_qhai_daughter.GetName]笃定了自己脑海中本迟迟不敢确认的想法 -  - 曾经作为天体级巨娘的自己，也许此刻正身处在一位熟睡 maiden湿润蜜穴的小小褶皱之中。
  gts_leader_qhai.3.desc: "The chaos surrounding space-time did not last long. The noisy voices and bizarre scenes gradually faded from [event_target:gts_qhai_daughter.GetName]'s mind. After coming to their senses, she was surprised to find herself in an alien place. This was not the familiar universe, but a vast unthinkably closed space.\n\nShe found herself between two pink mountain ranges extending as far as she could see. These tall mountains swayed in a slow rhythm. Following the pink walls at the far end, when she looked up at the cave vault, it was so high as to be beyond reach. If she looked closely at the top, blocked out by the mountains, the entire cave seemed to be contracting and expanding at regular intervals. Even the pink land under her feet moved with as well.\n\n<Thump, Thump>\n\nThese dull thumping sounds constantly hit [event_target:gts_qhai_daughter.GetName]'s eardrums, acting as background music for the cave. The ground under her feet that was already slowly moving up and down, also lightly trembled. If she sensed carefully, she could even hear the sound of liquid flowing.\n\n'It feels like I'm inside a creature. Could it be...'\n\n[event_target:gts_qhai_daughter.GetName] crouched down and lightly pressed on the pink earth. When she touched it, it felt warm and slippery, but when she pressed hard, she could not move it at all. Strangely, a thin stream of liquid kept slowly seeping out of the ground, accumulating, creating a thick film of water on the ground, making movement quite difficult. This was most likely the cause of the lakes in the distance. This constantly seeping liquid was thick, slippery, transparent and had a pleasant and alluring aroma, if she was to drink a mouthful, she would be willing to drown in it.\n\n<Thump, Thump>\n\nThese rhythmic thumps, the cave that felt like a living thing, the sticky threads hanging in the sky, and the faint sound of internal organs moving. Piecing together all the surrounding discoveries, and combining with her experience as a long-term colony in a human body, she had some potential theories as to what this was.\n\n'No way.'\n\n[event_target:gts_qhai_daughter.GetName] became certain of the idea that she had been too hesitant too confirm -- She, who used to be a celestial-level giantess, is perhaps now inside the moist folds of a sleeping girl's honeypot."
