  gts_leader_qhai.402.option: "Next Page"
  # 新年的愿望
  gts_leader_qhai.403.title: "New Year's Wishes"
  #  maiden灼热的体温开始熨烫行星，原本的大气循环系统在几个行星时之间便被 maiden腋下香甜的气味彻底改换，两极的冰雪在不断升高的温度中开始大片大片的融化，汇成雪水江川在进入大海又被 maiden滚烫的皮肤再度蒸发，小小的星球在短时间内下起了奇异的带着千海体香的特大暴雨。\n\n\"嗯哼，冰冰凉凉的，适应了之后感觉意外的舒服呢。不过这样应该差不多了吧。\"\n\n maiden将腋下已经完全染上了她气味的小小星球掏了出来，被焐热之后的小球还散发着 maiden身上携带而出的热气。\n\n§r\"嘿咻。\"§!\n\n千海精确地将其重新安置回了之前的绕日轨道之上，在她的神秘力量的帮助下，殖民地的人们没有受到任何财务上的损失，不过星球环境嘛，也许就要大变样了。\n\n§r\"完美！\"§!\n\n千海拍了拍手，在快捷的传送中便回到了她的家中。 maiden看着许愿网站上橙色大拇指的好评标签，满意地点了点头。\n\n忽然千海想起了似乎还有一位许愿人还没有评分呢，不过在她的感知中自己的胃中已经空空如也。但是！好在她在网站中设置了长期不评价自动好评的功能。\n\n§r嘿嘿，今年的许愿人也是好评如潮呢。\"§!
  gts_leader_qhai.403.desc: "The burning heat of the girl's body begins to iron the planet, The planet's atmospheric system completely changed over the next few local hours, the ice at the poles began to melt at an alarming rate, then turning to a river, then an ocean, then soon that was all steamed away by the burning-hot skin of the succubus. A bizarre storm that smelled like Qianhai's body broke out across the planet.\n\n'Um-hmm, it's nice and cold. But after getting used to it, it's kind of comfortable. But this should be enough right?'\n\nThe girl was finished soaking the planet in her unique sent, then she carefully takes the small body from her armpit. It was still steaming from the remnants of her body.\n\n§r'Hup!'§!\n\nQianhai carefully places the tiny planet back into its orbit. Using her magic powers, the colony did not lose any of their assets, but as for everything on the planet it was all about to change. \n\n§r'Perfect!'§!\n\nQianhai claps her hand, and teleports back to her home. The girl nods her head in satisfaction after looking at the orange thumb icon.\n\nThen Qianhai remembered that she still had to get a rating from the person she had eaten. But upon further inspection she realizes that her belly feels empty now. But luckily, she had set a feature to automatically mark the long-time non-reviewers to an automatic thumbs up.\n\n§r'Hehe. It seems my wishers this year are just full of high praise.'§!'"
  # 好...好评！
  gts_leader_qhai.403.option: "Good... Praise!"
  # 千海的腋香
  gts_planet_qhai: "Qianhai's Armpit Scent"
  # 作为愿望实现后的附赠品，这颗行星除了气温明显升高以外，空气中也充斥着千海的体香，居住在这里也许可以体验到与居住在 maiden腋下类似的感受？
  gts_planet_qhai_desc: "As a bonus for having a wish fulfilled, besides the noticeably higher temperatures, this planet is also filled with the lingering aroma of Qianhai's body scent. Living here might be a similar experience to living under the succubus's armpit?"
  # 千海的'报复'
  gts_planet_qhai2: "Qianhai's 'Retribution'"
  # 来自千海口内的美妙气息可以在这颗行星上的每一处地方闻到，即便是环境清理人员日以继日的工作，完成空气净化大概也需要以百年计数，更何况很多国民非常乐意在这样的环境下生活。
  gts_planet_qhai2_desc: "The alluring scent from Qianhai's mouth can be smelt everywhere on this planet. Even with the cleanup crew working day in and day out, it will take them roughly a century to purify the air. On top of this, there are citizens that have expressed their desire to live with the aroma."
  #  maiden的复活
  gts_leader_qhai.999.title: "The Girl's Resurrection"
  # §r"要是还有下次的话，你可就完蛋了，小小的统治者~"§!\n\n千海的眼中闪着危险的光，你被 maiden含在口中，并用柔软的舌头不停的搅拌,口鼻内都充满了带着千海甜蜜味道的唾液。你意识到，如果再让千海不小心死掉的话，下次也许再也无法从 maiden的体内离开了。
  gts_leader_qhai.999.desc: "§r'If there is a next time, you are done for, my little ruler~'§!\n\nQianhai's eyes flash dangerously as you are inside of her, being constantly stirred by her soft tongue. You cannot help but to taste the sweet saliva of the succubus. You realize that if she were to die again, you may not get to leave her body again."
