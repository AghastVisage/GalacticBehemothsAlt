  gts_leader_qhai.13.desc: "'It has been two weeks', [event_target:gts_qhai_daughter.GetName] murmured to herself, floating in the boundless universe. The stray asteroids floating around her formed a pretty little ring around her hair, automatically obeying her gravitational pull. Countless maintenance ships, like tiny specks of dust, shuttled around her, along with endless streams of colony ships carrying the micro-citizens, all rebuilding the destroyed colonies across her boundless jade skin.\n\nBut [event_target:gts_qhai_daughter.GetName] did not care about these things, still unable to believe all of the dream like events.  But the warm sensation emanating from the other body across time and space constantly reminded her of the truths of her experience. That other part of herself, a cosmic giantess, an existence that could easily crush a myriad of universes and could be called a true god, was at that moment locked in another girl's soft pink palace, unable to move. [event_target:gts_qhai_daughter.GetName] switched the main thread of her consciousness. She still could not get used to the strange feeling of simultaneously controlling two bodies, especially given the significant differences in the flow of time between them.\n\nAfter getting used to the discomfort of switching consciousness, [event_target:gts_qhai_daughter.GetName] opened her eyes which had been shut for a while. Qianhai seemed to still be at work.  The rhythmic beating of her heart was steady, as some light stubbornly tried to pierce the girl's porcelain skin, making the uterine walls have a translucent pink color, a minor light source in the dark cavity.  It felt as though the womb was in a constant state of slight arousal because of her presence, with a thin layer of love fluid coating the bottom, emitting a strange, exotic fragrance. The familiar claustrophobia set back in. It seemed like she increased in size since entering the girl's womb, just large enough to curl up into a fetal position in the fleshy sac. In this narrow space, not only would escape be impossible, but even stretching would be luxurious.\n\n'I really have become a baby.' This sentence had been said in [event_target:gts_qhai_daughter.GetName]'s mind countless times, but there was a sliver of truth in it. In Qianhai's dark womb, [event_target:gts_qhai_daughter.GetName] felt an inexplicable sense of peace and security, with surrounding flesh gently pulsating to Qianhai's movement, a warm, gentle sensation as though lying in her mother's arms. The girl's occasional bowel sounds were like listening to the most beautiful ASMR. Sleep began to creep into her mind, with a primeval desire pulling her into a beautiful dream ...\n\n'That was dangerous, I almost fell asleep.' [event_target:gts_qhai_daughter.GetName] slapped her cheeks with her hand, hard, and forcibly broke the creeping sleepiness. She had long since realized being in this pink warm bed would cause her to fall asleep unconsciously, but! She did not switch to this half of her to enjoy the experience, but to observe the activities of the owner of this pink world! [event_target:gts_qhai_daughter.GetName] used a flimsy excuse to convince herself.\n\nBut after several switches between her consciousness, Qianhai's life seemed to consist of the same routine: wake up, work, sleep. It was plain and boring. She didn't even have any entertainment. She was basically a saint. [event_target:gts_qhai_daughter.GetName] recounted all of the different giantess leaders in [root.getname], and she could not find such a hard worker.\n\n'She's not even a giantess.' [event_target:gts_qhai_daughter.GetName] thought, but it seemed the girl's unvaried routine was about to change.\n\n§r'Haa, finally all done.'§!\n\nQianhai slumped and pushed back on her chair. §r'Hmm--Haa--'§! With a satisfied groan, Qianhai tensed her body and stretched with power, as though she was trying to stretch away all of the fatigue of the past days. The girl's slender waist did not have an ounce of excess flesh, the movement formed an enticing curve. The already well-shaped lines of her white abdomen were even more eye-catching. The succubus's naturally beautiful figure was exquisitely expressed in that moment. But the tiny life inside her was not feeling so good.\n\nQianhai's pink uterus became even narrower as the muscles in her abdomen contracted. The already tight space was now even harsher. [event_target:gts_qhai_daughter.GetName] did not have the protection of amniotic fluid, and the pressure from the walls of the girl's cavity directly compressed her tiny body, almost turning her into a meat patty. Although [event_target:gts_qhai_daughter.GetName] had been specially strengthened by Qianhai, she still felt fragile in the face of the hydraulic meat wall. She could only weakly pound her tiny fists against Qianhai's pink membranes, hoping that the girl would acknowledge her existence before she lost her consciousness.\n\nLuckily, Qianhai finally became aware of the anomaly inside her body, and gave up her desire to finish her stretch. The feeling in her flat abdomen reminded her of her earlier distraction when she woke up a few days ago - she had carelessly swallowed a tiny giantess who had wandered into her honeypot."
