  # 度假时间
  gts_trait_qhai1: "Vacation Time"
  # 千海的本体仍然在痛并快乐着的工作，只能这个小小的分身来享受假期的乐趣。\n§r"请不要让我再在这里也继续工作了，求求了。"§!
  gts_trait_qhai1_desc: "Qianhai's true self is still working through pain and happiness. Only this small clone can enjoy the fun of the vacation.\n§r'Please don't let me keep working even here, please!'§!"
  # §r万物机理§!
  gts_trait_qhai2: "§rMechanisms of Everything§!"
  # $gts_qhai_event_1_picture$世间运转万物机理在千海的眼中都如同数据般简洁明了，调控事件的走向更是手到擒来。 maiden偷偷提高了国家的各类生产数值，并希望这样不会做的太明显。\n§r"应该不会调的太高了吧，大概？"§!
  gts_trait_qhai2_desc: "$gts_qhai_event_1_picture$ The mechanics of all things in the world are as clear as data in Qianhai's eyes. It is effortless for her to control the course of events. The girl secretly increased various production values of her country, hoping it would not be too obvious.\n§r'It shouldn't be too high, right? Maybe?'§!"
  # \n\n\n£qhai_leader_trait1_picture£ \n\n\n\n\n
  gts_qhai_event_1_picture: "\n\n\n£qhai_leader_trait1_picture£ \n\n\n\n\n"
  # 可变体型
