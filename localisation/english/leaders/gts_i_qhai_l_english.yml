  # 送上门的小龙龙
  gts_leader_qhai.608.title: "A Little Dragon Delivered To My Doorstep"
  # §r\"咳咳咳，怎么是这个偷袭法，呸呸呸。\"§!\n\n千海想要吐出嘴中的融沙，沙子居然都在刚才的剧烈摩擦中粒粒融化。魅魔 maiden意识到她的全身都被黑色柔软物体牢牢压住动弹不得，想要深呼吸一口却在肺部灌满了某只龙龙身上熟悉的气味。\n\n这算哪门子事，好不容易出来晒个太阳，就被犽戎给偷袭了，千海在心里嘀咕道。\n\n§P\"欺辱神明的异种，今天就是你的服罪之日。\"§!\n\n犽戎的柔嫩皮肤可以清晰地感知到脚底生龙活虎，毫发无损的魅魔小姐，心中有些发怵，她有想过她不会是千海的对手，但没想到这样偷袭也没用啊，但这时候表面上绝不能露怯，不然她的面子往哪里放。狠话放完，犽戎甚至开始左右扭动小脚，更进一步蹂躏着已经深陷坑洞的魅魔，将其掩埋地更加彻底。\n\n§r\"咳，好好好，小龙龙是吧。\"§!\n\n又吐掉一口吃进嘴里的沙子，千海感受着身上愈来愈重并在不断左右摩擦的黑丝脚丫，有些气笑了出来，虽然她并不会受到什么伤害，但是任谁在休假时间被打扰都会生气，虽然她百分之九十的时间都在休假，不过犽戎身上的这股子憨劲已经让千海没那么生气了。\n\n不断更换着施力角度，犽戎力求在千海还手前能踩多久踩多久，不过话说回来，魅魔 maiden柔软凹凸的身体踩上去真的很舒服，都让她有些爱不释脚了。忽然，犽戎敏锐地发现她看向事物的高度在降低，就连还在刚刚还在不停动作的丝足也在一股不知名的巨力下动弹不得。\n\n犽戎僵硬地看向了足底，随着她的持续缩小，原本被她的巨足完全掩盖了的坑洞中显露出了发型完全凌乱了的千海，就连黑色的泳衣带子也在刚刚的混乱中断成了两截，魅魔 maiden的脸上带着似笑非笑的温婉笑容，并在她绝望的视线中越变越大。\n\n最终，小巧可爱的犽戎看着周围参天的五根白嫩玉柱和脚下软和柔软的肉色地面，以及远处千海那闪着危险地光芒的眼眸。现在她不过魅魔 maiden的指节大小，犽戎知道的她的报仇时间已经结束了，取而代之的是千海更为激烈的玩弄时间。
  gts_leader_qhai.608.desc: "§r'Cough Cough, what kind of sneak attack was that? Pttuu.'§!\n\nQianhai tried to spit out the sand. It seemed that the sand had turned into a molten substance from the sudden force. The girl then realizes that something was pushing her into the ground, and that it smelled like that naughty little dragon. \n\n*What the hell just happened,* Qianhai thought as she was now being attacked again. \n\n§P'You who have bullied the gods will now know the true power of my feet!'§!\n\nYaorong can feel, through her feet, the completely undamaged girl. She may have her doubts now, but she will not show it to the girl, and started to massage her feet even deeper into the sand. \n\n§r'Cough, okay, okay, Little dragon.'§!\n\nAgain, she spat sand, she felt the now very firm feet upon her. That was good, but it still annoyed her. While she was fine, no one liked to have their vacations interrupted. She had time to think and realized that she was no longer angry and was in fact amused.  \n\nChanging her weight, Yaorong pushed harder and harder onto the body of the girl. But something about the way her body felt under her touch was too comfy for the dragoness. Then she noticed that her perspective was changing, and that the firm feet were also now unmovable. \n\nWith her heart sinking. Yaorong saw that she was shrinking back to her small size, and below her was a messy Qianhai, her face was that of joy. And in her eyes were a smile that made Yaorong tremble in fear. She was now smaller than Qianhai's fingers. She knew that her payback had ended, now the real fun is going to begin."
  # 嘁，事到如今，还能和解吗?
  gts_leader_qhai.608.option: "Ugh, at this point, can we just call this even?"
  # 送上门的小龙龙
  gts_leader_qhai.609.title: "A Little Dragon Delivered To My Doorstep"
  # §r\"小龙龙，这回可是你主动送上门来，就不能怪我啦。\"§!\n\n§P\"唔，不管你做什么我都不会屈服的！\"§!\n\n事实虽然确实如此，但她绝不会承认，身处千海白皙巨掌中的犽戎不断躲避着魅魔 maiden逗弄着她的手指，并将她的身体都护在了宽大的双翼之内，好似刚刚才被贼人侵犯的良家 maiden。\n\n§r\"咦？这话说的，搞得我才是坏人的一方呢，诺，你看泳装都被你弄坏了。\"§!\n\n千海拉了拉肩膀上脱落的泳装文胸带子，如果不是 maiden用尾巴固定两端，大片胸襟风采就任人观赏了。本来今天天气阳光明媚，千海想着可以好好晒个日光浴，但现在被小龙这么一打扰早没了兴致，不过呢，回家和小龙贴贴好像也不错的消遣方式。\n\n§r\"算了，先让我们先回家吧。不过呢，哼哼，坏孩子先需要一些惩罚措施。\"§!\n\n§P\"你想 - 唔啊？\"§!\n\n犽戎连忙又后退了几步靠到了千海的手指旁，企图用肉柱掩盖她的身形。但是小龙既然都落到了 maiden的手掌之中，她又能逃到哪里去呢。千海用实际行动说明了她的想法，灵巧的舌头在手掌间轻轻一舔，便将手心还在四处躲避的小龙黏起，在吸溜声中卷入了她湿润的口中。\n\n§r\"哼哼，想逃？\"§!\n\n红润的巨舌压上了犽戎的身躯，开始对其上下其手，早就尝过 maiden口腔厉害的犽戎象征性地反抗之后便放弃了挣扎，而是寻找了一个更加舒适的姿势。毕竟如果不能反抗，那就享受到底吧。\n\n.....\n\n并没有花费很久的时间，千海便回到了她的家中，在啪塔啪塔的光脚走路声中坐到了实木书桌之前并略微调整了尾巴的位置。\n\n§r\"哈 - 啊\"§!\n\n魅魔小姐微微分开樱唇，热气自然地逸散而出，千海伸出了她柔软的红舌，在颤动着的舌尖处，双目略显无神的小龙在这之上微微地喘息，似乎已经在路途中的搏斗中耗尽了力气。在重力的帮助下，黏滑的唾液不再能继续留住犽戎，在舌面上不断下滑着并最终脱离了舌尖，并在两者之间拉出了一条长长的透明拉丝，在小龙落到桌面后顺势形成了一处津液水潭。\n\n§P\"咳咳咳\"§!\n\n犽戎咽下了几口含入的魅魔津液，从粘稠的唾液露珠中踉跄地站起了身，浑身都湿漉漉的。她一脸嫌弃地看着已经被 maiden唾液完全浸湿的衣物，湿哒哒的头发还在向下滴落着晶莹的液体。虽然千海的体液实际上全都带着一种奇异的香气，并且尝起来甜滋滋的，但她可不能在脸上表现出欣喜的表情。\n\n§P\"恶 -  - 臭死了，坏魅魔，帮我擦干净。\"§!\n\n§r\"嗯？上次你不是自己用火焰蒸干的吗，哎~难道是喜欢千海妈妈的味道吗？\"§!\n\n虽然千海嘴上调笑着犽戎，但还是抽出了她的手帕为向前伸出了手来了的可爱小龙擦拭起了身体。\n\n§r\"嗯，都要擦干净，小腿要擦，股沟要擦~翅膀要擦，龙尾也要擦~\"§!\n\n maiden的手法轻柔且细心，为小龙清理着身上的每一个角落，青葱的手指偶尔落在犽戎的身上时有种微风拂过的舒适感，让她不禁惬意地眯起了眼睛，突然身上一凉，犽戎连忙睁眼，没想到上一秒还穿着的湿透衣物全都不翼而飞，现在她白花花的完美肉体就这样暴露在眼前魅魔的视线中。
  gts_leader_qhai.609.desc: "§r'Little dragon, you came to me first. It's not my fault.'§!\n\n§P'Ugh, I'll never give in, to what ever you do!'§!\n\nThat may have been a lie, but Yaorong would never say it out loud. The titaness tried her best to get out of the grasp of the giantess, and she used her wings to protect herself. Like a maiden who just had her purity taken from her. \n\n§r'Eh? What are you saying? It's like I'm the bad guy now! And look, you went and broke my bikini.'§!\n\nQianhai tugs at the swimsuit, and if her tail did not hold it all up, then one wrong move and the whole top would have fallen off. The weather outside was amazing. Qianhai was hoping to be able to bake under the sun, but it was all ruined now. She might as well play with the little dragon.  \n\n§r'Alright, lets get home. And little bad dragon, you need to be punished!'§!\n\n§P'You want-Oh, wait-'§!\n\nYaorong instantly starts to move to the safest spot on her hand. She uses her body to hide where she is. But Yaorong is on her hand she can not go anywhere.  Qianhai lets her actions speak for themselves, as her tongue reached out onto her palm and sucked up Yaorong, and in a slurp sent her inside of her mouth.  \n\n§r'Hmph, you thought.'§!\n\nThe giant tongue moved all over the body of the dragon. And after a small bit of resistance, she accepted it, and became comfy as well.   \n\n....\n\nIt was not long before Qianhai returned to her home. On soft footsteps, she sat down at the desk and adjusted herself.\n\n§r'Haa--'§!\n\nThe girl opened her lips, and let the heat out. Her tongue quivered as the little dragon, who had no more strength. And with help of gravity the fluids started to drip from the tongue, and after falling onto the desk, was now in a puddle of saliva. \n\n§P'Cough Cough Cough'§!\n\nYaorong swallowed some of the saliva, and stood up from the mess. She looked disgusted from the soaked clothes. Even if the spit tasted like nectar and was pleasing to the taste, she cannot show that now. \n\n§P'Ugh- It's so smelly, bad succubus, clean it off for me.'§!\n\n§r'Hmm? Last time you used fire, but oh, you must like my scent now? '§!\n\nQianhai teases Yaorong, but she still wipes her hand and starts to clean off the young dragon, her fingers clean every part of the body. The touch of her fingers makes it feel like a cool breeze over her body.  She closed her eyes to let herself enjoy the moment. Then, something cold hits her. Yaorong opened her eyes to see that all of her clothes were now gone. Her body is defenseless in front of this succubus, she had gone completely naked!"
