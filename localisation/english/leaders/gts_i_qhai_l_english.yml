  # §r\"对不起哦，之前实在是忙昏头了，就不小心把你给忘了。\"§!\n\n耳边是 maiden好听但震耳欲聋的声音，震得[event_target:gts_qhai_daughter.GetName]耳膜有些发疼。现在她并非处于千海的粉色宫殿中，而是被重新变回了指节大小的体型放置在实木色的桌板之上。场景在骤然变换之间，她便出现于此，用赤裸着的湿漉漉的身体与 maiden带着歉意的紫罗兰色巨大眼眸对视。\n\n千海的绝色脸庞还是与那时候的惊鸿一瞥一般无二， maiden白嫩无暇的脸颊轻轻被左手抵住，向一侧歪头，紫宝石般美丽的眼睛目不转睛得看着眼前小小的巨娘，紫色的眼眸中仿佛蕴藏世间万物的真理。淡紫色的柔顺的发丝从 maiden脑袋两侧恶魔般卷曲的双角上绕了一圈之后又垂挂而下，在 maiden身后细长恶魔尾巴的摇晃中时不时被撩起。而 maiden洁白的脖颈上的黑色项圈则更是引人注目，让人不禁遐想是怎样的超级巨娘才能降服如此的尤物。\n\n maiden超越了人智的美貌搭配着巨大的体型，带着无可置疑的震撼冲击力席卷了[event_target:gts_qhai_daughter.GetName]的理智，让她呆愣在原地。\n\n<也许就这样死在 maiden体内都是值得的吧。> [event_target:gts_qhai_daughter.GetName]脑海中此刻只剩下这个简朴的想法。\n\n许久之后，[event_target:gts_qhai_daughter.GetName]终于从 maiden小小的美貌震撼中回过神来，她感觉到自己正在被白色的柔软物体摩挲，传来的力道舒适而平稳，原来是千海用纸巾小心地给她擦拭着身上在 maiden体内时沾染的爱液。\n\n§r\"好啦，看你回过神来了，咱们就好好聊聊吧。\"§!\n\n maiden看了看自己擦拭得干干净净的小小巨娘，坐回了椅子，满意得点了点头。\n\n§r\"咳咳，我叫千海，你怎么称呼我都可以，主人啊，姐姐啊，随你喜欢。就算是千海妈妈也不无不可哦。\"§!千海眨了眨眼，嘴角带起了一丝浅浅的笑意:§r\"至于你的话，自我介绍就不必了，我早就对你知根知底了，哼哼，各种意义上的都是哦。\"§!\n\n千海得意地轻哼刮起的鼻息在[event_target:gts_qhai_daughter.GetName]的身上拂过，带来 maiden淡淡的令人沉迷的体香。\n\n§r\"有什么问题的话就直接问吧，能回答的我尽量回答。\"§!
  gts_leader_qhai.14.desc: "§r'I'm sorry, I was too busy. I'd accidentally forgotten about you.'§!\n\nHer ears were ringing with the girl's beautiful but deafening voice. [event_target:gts_qhai_daughter.GetName] was not in Qianhai's pink palace, she was back to her finger-sized form on top of a wooden desk. She was suddenly transported to this place, with her nude, wet body staring into the girl's apologetic, violet eyes.\n\nQianhai's stunning face was exactly the same as the breathtaking glance from before. The girl's snow-white flawless cheek gently rested on her left hand, while she tilted her head. Her beautiful eyes like violet gems stared intently at the tiny giantess in front of her, as though they held the truths behind all matter. Her soft, light-purple hair wrapped around her demonic horns, and then cascaded down her neck, occasionally moving with the gentle sway of her long and slender tail.  And the black choker on her fair neck drew even more attention, raising the question as to how a giantess was able to capture such a beauty.\n\nThe girl's beauty, beyond human comprehension, combined with her large size, created an undeniable and overwhelming impact that swept away any of the logic that [event_target:gts_qhai_daughter.GetName] had left. She simply stood there in a daze.\n\n[Maybe dying in this girls body is worth even this.]  This simple idea was all that was left in [event_target:gts_qhai_daughter.GetName]'s mind right now.\n\nAfter a while, [event_target:gts_qhai_daughter.GetName] managed to come out of her daze from shock at the girl's beauty. She felt herself being caressed by a soft white object. The force was comfortable and smooth, it was Qianhai carefully wiping the love fluid that had stained her during her time inside the girl's body with a towel.\n\n§r'Okay, you are back to your senses. Let's talk.'§!\n\nThe girl looked at the tiny giantess she had cleaned, sat back in her chair, and nodded in satisfaction. \n\n§r'Ahem, my name is Qianhai and you can call me whatever you like, master, sister, whatever. It's okay to call me mom too.'§!\n\nQianhai blinked and smiled, a faint one. §r'As for you, I do not need you to introduce yourself, I already know everything about you, hehe, in every meaning.'§!\n\nQianhai's proud snort brushed against [event_target:gts_qhai_daughter.GetName], bringing with it a faint and alluring fragrance.\n\n§r'Ask me anything, and I'll try to answer it.'§!"
