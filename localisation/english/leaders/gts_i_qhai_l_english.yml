  gts_leader_qhai.14.respond.1: "§r'Good question.'§!\n\nQianhai sat slightly straighter. The girl's soft breasts moved even closer to [event_target:gts_qhai_daughter.GetName], and the scent seemed to waft into her nostrils.\n\n§r'Actually, no one forces me to work. I just do it out of pure interest. I use my powers to help miniature universes get through their difficulties and to hide them from the Goddesses. Or to create interesting events to make their development more interesting. And as I do this, I can see more interesting things happen, due to these collisions between different civilizations, and also more great stories that come out of people's creativity. Isn't that interesting? But once in a while, very serious bugs happen, like this time your random teleportation to my body was an accident.'§!\n\nSpeaking of this, Qianhai frowned and had an unusual grimace on her face."
