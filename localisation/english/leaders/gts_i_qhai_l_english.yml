  situation_qhai_ub_complete_tooltip: "Is there any chance that you can leave the body?"
  #  maiden的\"穿鞋\"
  gts_leader_qhai.501.title: "The Girl's 'Shoe-Wearing'"
  # \"你 -  - ，明明[event_target:gts_qhai_daughter.GetName]也可以代劳，为什么要叫我来做？\"\n\n千海气鼓鼓地看着眼前桌子上向她指派任务的小人，用长长地魅魔尾巴愤怒地点着[ruler.GetName]的脑袋。但后者满脸堆笑，千海也不好说他什么，只能无奈地叹了口气，毕竟这个小人总归是她名义上的上司，而且这个任务实际上也并不麻烦。\n\n......\n\n没有任何预兆的，一个庞大到不可思议的生物突兀地出现在了我们的所处的鞋柜星系的一旁，根据我们的统治者传达过来的即时讯息，可以确认的是，眼前这个能够随意捏碎我们目前所在恒星系的巨娘正是我们的千海领袖。\n\n§r\"应该就是这个......小玩具吧。\"§!\n\n maiden的声音响彻了整片星域，似乎是在向我们征求意见，但没等我们回话，魅魔 maiden便自顾自地甩着能够抽碎恒星的长尾，从'鞋柜'之外用手指将数百倍于我们星球大小的制服鞋捏了起来，放在紫色的眼睛之前端详，需要我们长期探索数年之久的巨大制服鞋在千海手上也只配被称为过家家小玩具。震撼之中，我们错失了提醒进入鞋中进行勘探的科研队伍，正在调查鞋跟处凹陷的小队在突如其来的剧烈摇晃中乌压压摔倒了一大片，但庆幸的是并没有导致人员伤亡。\n\n§r\"好像不能直接带回去，某人特别叮嘱我要试穿一会呢，唔，真是变态呢。\"§!\n\n千海在另一只脚的鞋跟上蹭掉了她平时常穿的鞋子，被束缚了许久的白丝玉足在宇宙空间中肆意地舒张，颗颗浑圆饱满的红润足趾散发着薄薄的热气，让整个鞋柜星系的气温都上升了几度，我们身处在外却仿佛置身 maiden的鞋袜之中，好闻的香味让队伍中抵抗力不强的队友立刻沉迷其中不能自拔。\n\n§r\"不过这只鞋子有些太小了穿不进去，好吧，看来只能这样了。\"§!\n\n从巨变中缓过神来的鞋内科研队伍忽然惊讶地发现，整只小队都在不断缩小，不对，而是制服鞋在快读地变大，本就宽广的足垫在短暂却迅速地放大之后更是再也望不到边际，光论现在的鞋内大小，恐怕是耗费原本数十倍的时间也不一定能够探索到原本一半的进度。
  gts_leader_qhai.501.desc: "'You- , when [event_target:gts_qhai_daughter.GetName] could have done this, why is it that you made me do it?'\"\n\nQianhai looks at the tiny person on the table ahead. With her large succubus tail she points at the head of [ruler.GetName] angrily. But the latter has a huge smile, and Qianhai cannot say much to him. So she sighs because after all, this was her boss, and that the task was not too hard. \n\n...\n\nWithout any warning, a gigantic life form appears next to the Shoe Cabinet system. Based on the real time messages from our ruler, it was our leader, Qianhai, who could crush our system like a toy. \n\n§r'Should be this... little toy, right?'§!\n\nThe voice of the girl echoed throughout the system as if she needed our opinion. But before we could even respond her beautiful tail that could shatter stars started to move, and within moments she used her fingers to pick up the uniform shoe. On her hands, a shoe that we would take years to investigate, was nothing more than a plaything. Amazed, we forgot to inform the team that was inside of the shoe, and after a sudden jolt, they fell to the ground. Luckily there were no deaths from that accident.\n\n§r'I can't just take this back. I had specific instructions to wear this for a while. Hmm, how perverted.'§!\n\nQianhai rubs the pair of shoes that she was once wearing, on the heel of the uniform shoe. Her white stockinged foot had been confined for far too long and felt free in the emptiness of space. Each rounded red toe was releasing thin streams of mist, increasing the temperature in our system. To us, it felt like we were in the shoes or socks of that girl. The sweet aroma has sent us into a euphoric paralysis.  \n\n§r'Sadly, this shoe is too small, well, I guess this is the only way then.'§!\n\nThe scientific crew inside of the shoes has noticed their team shrinking, no, the shoe was enlarging rapidly. The soles that were already way too big have now infinitely grown, and exploring even half of it would be impossible."
  # 下一页
  gts_leader_qhai.501.option: "Next page"
  #  maiden的\"穿鞋\"
  gts_leader_qhai.502.title: "The Girl's 'Shoe-Wearing'"
  # §r\"唔，勉强还算干净，速战速决吧。\"§!\n\n千海将她的柔嫩白丝巨足探入了制服鞋之中，对 maiden来说缓慢地穿鞋却对深陷其中的科考小队来说是完全不可追赶的急速。在星系级别的跨度下，科考飞船早已来不及启动超光速引擎逃离此处，队员们只能眼看着照入的星光逐渐被 maiden白嫩的脚掌完全遮挡，并即将被千海不断下落的白丝足根完全碾碎，此刻我们的大部分人都绝望地闭上了眼睛。\n\n maiden并没有过多磨蹭，很快便穿好了制服鞋，甚至还好事地垫了垫脚尖试试鞋子是否合脚。\n\n巨大的震动在科考小队的周围炸裂，狂风呼啸而过，没有一个人能够在这样的巨震之中站稳身体。终于，环境平静了下来，队员们惊讶地发现她们居然仍然存活，微小的飞船似乎正好处于 maiden脚跟的一处细密纹路之间，而且并没有队友在刚才的突发情况中失踪。科考队长更是直接无力的瘫倒在了座椅上，每个人脸上都挂着劫后余生的表情。\n\n§r\"呼呼，大家的表情真是可爱呢。不过话说回来，这双鞋子果然是要穿着回去吧，算了，权当散步了。\"§!\n\n恒星级 maiden的行进速度远远超乎人们的想象，仅仅是1个标准时之后，千海那巨大的身体便出现在了首都星系临近处。 maiden小心地控制着动作避免碰到星系附近脆弱的巨构，在略有挑逗的抬脚中脱出了她穿了许久的制服鞋，千海将散发着白色雾气的鞋子重新变小并精准地放在了星系中的绕日轨道之上。\n\n不过千海看起来还是有些记仇，坏笑着朝着漂浮在她酥胸旁可能没有她小脚趾大的首都星球张开了樱唇，但 maiden并没有吃掉小球的打算，只是对着长长哈了口气。\n\n§r\"这样的话。小小领袖应该会满意了吧~\"§!
  gts_leader_qhai.502.desc: "§r'Ugh, it's almost clean enough, now then, best to get this done.'§!\n\nQianhai carefully pushed her soft white foot into the shoe. What was slow to the girl was too fast for the team inside. The ship's engine was too slow to escape, and the crew could only watch as the light faded and was replaced by the soft light of her feet as she lowered herself deeper into the hole. Most of us have accepted the end and closed our eyes.\n\nThe girl does not dawdle and quickly has put on her shoe and even bounces on her toes to make sure that the shoe was comfortable.\n\nThe ground beneath the surface exploded causing gusts of wind that were strong enough to knock everyone off their feet. After finally settling down, the ship crew that was still alive noticed that the ship was lodged in a groove on the heel. Miraculously, no one was lost from this ordeal. The captain limply fell onto his chair with everyone else was too shocked to move.\n\n§r'Huhu, what cute faces you have now, anyway I guess I have to wear them back. Okay, think of this as a small jog.'§!\n\nThe speed that a stellar-level being could move defied understanding. Within one local hour, the huge body of the girl was now at the edge of the capital system. She was careful not to hit the nearby large starbase that was still under construction, and freed her foot and her white and warm shoe in the space was placed back in the normal orbit. \n\nQianhai, still angry, turns to face the small capital that has no use other than being a plaything, she opens her mouth to breathe. Though, she doesn't eat it she still blows on it with a playful breathe.\n\n§r'There, how is that, little leader, is that what you wanted?'§!"
  # 要不下次还是找别人吧....
  gts_leader_qhai.502.option: "How about next time, you give this to someone else...."
  # 天体盛宴
  gts_leader_qhai.551.title: "The Celestial Feast"
  # §r\"唔，明明知道我不喜欢这样，算了，既然是任务就得好好完成。\"§!\n\n出发之前，万界编织者已经完全充能完毕，满盈的能量在宇宙中散发出淡淡的蓝光，但这些准备完全落了空。千海领袖当前的体型远远超乎了我们的想象，穿着JK服的魅魔 maiden以远超恒星系的大小漂浮在恒星系的附近，单星的天体系统在 maiden面前就和糖果一样小巧可爱，以她现在的体型根本不需要万界编织者的帮助就能轻易完成这个星际行动。\n\n§r\"报告，我申请小花田的陪同！\"§!\n\n maiden举起了白皙的手臂，仿佛上课回答问题的小朋友，双眼认真地看向了空中微小的联络船，只不过这个\"小朋友\"稍微有些巨大，如果现在联络船上的人不幸坠毁在 maiden身上，可能会陷入一条终其一生也无法寻及尽头的纹路之中，在此刻[root.GetName]并没有什么反驳的资本与余地。\n\n\"哎哎哎，我，我吗？\n\n只是在远处看热闹的花田领袖莫名其妙地遭到了点名，无助地左右进行张望，在千海紫罗兰眼眸射出的灼热视线中， maiden只好点头同意了下来，于是万界编织者在滴滴声中重新改变了放大目标。\n\n§r来吧，可爱的小花田。\"§!\n\n花田显然是头一次变得这么大，看起来还在适应当前的大小。千海上前一步，单手拉起了花田软糯的小手，略微用力，将仍有些犹豫的蓝发女孩拽到了她的怀中，小花田比她矮上两个头，柔软的腰肢摸起来格外的惹人怜爱。小花田抱上了千海略显纤细的腰肢，虽然魅魔 maiden的身体算不得丰满，但却有一种沁人心脾的香气，在 maiden温暖的怀中花田感受到了一种久违的安心与宁静。\n\n§r\"嗯，不错不错，出发。\"§!\n\n感受到小花田的胳膊搂上了她的脖颈，千海满意的点了点头，传送虽快，但可不能把小花田搞丢了。\n\n没有什么奇异的光效，两位恒星级 maiden就这样突兀地消失在了原地，参与这次行动的科学官面面相觑，感觉自己真的是十分多余。\n\n.......\n\n§r\"安全抵达!\"§!\n\n\"抵...抵达！\"\n\n花田的跟话略有生疏，但并不重要，千海和花田优美的嗓音跨越了物理定律，毫无预兆地响彻在了§H[event_target:gts_leader_system.GetName]§!的两侧，为敌人敲响了最后的丧钟。面对突如其来的袭击，[event_target:gts_leader_planet.GetName]立刻组织起了防御准备，但无论是他们怎样的探查，最后的结果只能得到一个令人绝望的结果，他们正处在两位远超他们所在星系大小 maiden的红唇之间。\n\n千海与花田甜腻的鼻息在 maiden平稳的呼吸之间喷涌到宇宙中，仅仅是两股气流碰撞产生的乱流就轻易毁灭了星系中的宇宙航船和仍然运行着的行星基地，唯一的宜居行星上的大气也在这股狂乱的风暴中被吹得几近逸散。\n\n§r\"唔，这个星系好像有些太小了，完全不够我们两个人分的呢，怎么办好呢。\"§!\n\n\"这个任务是千海妈妈的，当然是......\"\n\n§r\"这可不行~小花田还是在长身体的时候，必须得吃点好的。\"§!
  gts_leader_qhai.551.desc: "§r'Ugh, I already said that I didn't want this, but, if it's a task, then I best do my best.'§!\n\nBefore leaving, the World Weaver had been charged up. The energy it gave off was a soft blue color, and all of this effort had gone to waste. The body of leader Qianhai was on an astronomical scale that was way beyond our understanding. The tiny system was nothing more than a small treat to her. At this rate, the World Weaver was completely pointless. \n\n§r'Report, requesting Houtian to accompany me!'§!\n\nThe girl raises her small arm as she asks her question, like a student asking a question during class time. But this 'student' was significantly huge. The ship on the other end was surely going to be crushed if they happen to crash on the girl. And right now, [root.GetName] had little to no say.\n\n'Eh, is, is it me?'\n\nJust a spectator had been called on randomly, and looked to where she could hide. As she looked into the piercing violet gaze, she had no other choice other than to nod. The World Weaver began to change its target in reply.\n\n'Come on over, my lovely Houtian.'§!\n\nHoutian was clearly adapting to her new size, and before she could come to terms with her situation, Qianhai grabbed out to her hand, and, with a gentle pull, brought her into her embrace. Houtian was a couple of heads shorter than the succubus, and her body was so gentle it was so adorable. Houtian embraced her waist, and breathed in the strong unique scent of the succubus. \n\n§r'Hmm, perfect! Let's Go!'§!\n\nQianhai nodded her head in satisfaction at seeing the small girl latch onto her. Teleportation is too fast, and she couldn't just lose Houtian.\n\nThere was no special effect, the two stellar sized girls just vanished before our eyes. The crew all made eye contact as they felt that they had no purpose to be there.    \n\n.......\n\n§r'Safely arrived!'§!\n\n'A, Ar-arrived!'\n\nHoutian response was slightly off, but that did not matter. Qianhai and Houtian's voices moved faster than all known laws, as they boomed throughout [event_target:gts_leader_system.GetName], heralding the doom of the enemy. Before they could respond, [event_target:gts_leader_planet.GetName] started to engage with her defenses. But all any of their sensors can sense is that, they are between the lips of two star sized girls.\n\nQianhai and Houtian's breath creates a gust of wind that destroys any of their ships and bases. The atmosphere in their only habitable planet was torn asunder by the force. \n\n§r'Ugh, this system is way too small, and we can't share this. What should we do?'§!\n\n'It's your task, Mama Qianhai, surely......'\n\n§r'No way! Little Houtian still has a lot to grow. And has to eat a lot of good food!'§!"
