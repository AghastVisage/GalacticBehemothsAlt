  gts_leader_qhai.602.desc: "The stars that have burnt for millions of years look like toys that children would play with when compared to the size of Qianhai. The small dragon, who was once mighty and had all of the power was struggling inside of her breast. The girl felt something as she played with the small dragon. It felt so good. \n\n§r'Ugh, is this what wrong feels like?'§!\n\nThe movements of the surrounding flesh came to a stop. Taking the chance, Yaorong used the limbs to reach her head out. At that moment, her hair was black, and her skin was covered in sweat. Her face showed that she had felt an immense relief, but things were too calm. Qianhai also looked relieved.\n\n§P'Ugh, you giantess, what are you even planning?'§!\n\n§r'Ugh, its all because you are so adorable, I just wanted a hug!'§!\n\n§P'Mmh Mmh Mm?!'§!\n\nYaorong was speechless. She had never doubted her beauty. There was no shortage of people who loved her. However, almost no one could get her attention because of the immense power gap. Except for her father. But she had never been forcibly hugged like this before. Especially someone much bigger then her. This was her first time. \n\n§r'Ah-uughh'§!\n\nQianhai opens her mouth. Her breath fanned out onto the little dragon's face, as that she was getting closer to her. The little dragon knew what Qianhai wanted to do next. \n\n§P'Wait-'§!\n\nBefore Yaorong could respond, Qianhai was already covering the world with her mouth. She went down, and swallowed half of the small dragon into her mouth. And when she pulled her head back, all that was remaining was the wiggling legs of the dragon. Then, even that, had gone.\n\n'Popp.'\n\nYaorong could almost hear herself entering the mouth of the girl. Her body was being pushed into, and she was guided by it and was sent down a red tunnel of flesh. Even her tail had gone as well. Then her teeth closed, and the light of the stars were all gone. \n\n§P'cough cough, is this really what a hug is?'§!\n\nHowever