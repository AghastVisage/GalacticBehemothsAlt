  # 微小的星球总会在不经意间被丝足粉碎，舰队或城市的残骸贴附在丝袜的表面与足汗混合凝聚，使得干净的丝袜被污垢覆盖，充斥着淫靡的气味
  district_bfbf_bronya_6_desc: "Tiny planets are always inadvertently crushed by silk-clad feet. The wreckage of fleets or cities adheres to the surface of the stockings and condenses mixed with foot sweat, making the clean stockings covered with dirt and filled with obscene smells"
  # 丝袜
  district_bfbf_bronya_6_plural: "Stockings"
  # 乳腺开发
  district_bfbf_bronya_7: "Mammary Gland Development"
  # 旷阔的乳汁海洋可以给我们提供充足的食物，但一次小小的涨奶都可能淹没整片星系，想要寻找到足以容纳全部乳汁的容器恐怕天方夜谭...
  district_bfbf_bronya_7_desc: "The vast milk ocean can provide us with sufficient food, but a small milk engorgement may submerge the entire galaxy. It is probably a fantasy to find a container large enough to hold all the milk..."
  # 乳腺
  district_bfbf_bronya_7_plural: "Mammary Gland"
  # 肉棒开发
  district_bfbf_bronya_8: "Meat Rod Development"
  # 长度几乎可以用恐怖来形容的狰狞肉棒为领袖们提供了难以想象的乐趣，不知已经有多少星球或小人被其吞噬，浓烈的催情气息几乎可以让所有小人资源成为失去理智的护理虫\n无论是研究这极其违反常理的构造或是从中开采积攒的精垢，我们都能从中取得大量的收益.
  district_bfbf_bronya_8_desc: "The hideous meat rod whose length can almost be described as terrifying provides unimaginable pleasure for the leaders. It is unknown how many planets or small people have been swallowed by it. The strong aphrodisiac breath can almost turn all small people resources into irrational nursing worms\nWhether studying this structure that violates common sense or mining the accumulated semen scale from it, we can gain a lot of benefits."
  # 肉棒
  district_bfbf_bronya_8_plural: "Meat Rod"
  # 精子开发
  district_bfbf_bronya_9: "Sperm Development"
  # 随性欲源源不断产生的精子在此得到充分利用,尽管超高的活性与难以估量的数量给实际开发带来诸多麻烦.但从这里诞生的士兵无一例外都无比强大
  district_bfbf_bronya_9_desc: "The sperm produced endlessly by sexual desire is put to full use here, even though its extremely high activity and incalculable quantity pose numerous challenges for practical development. However, the soldiers born here are, without exception, incredibly powerful."
