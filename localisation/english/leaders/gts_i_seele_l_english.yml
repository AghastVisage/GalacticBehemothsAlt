  # \"唔...另一个我，你又带我到什么地方来了。\"看着底下蓝绿相间的地块，白希有些不知所措，这样的场景只有她与黑希在星海遨游时见过，但那些小小的星球根本不可能让她们有机会降临在上面。\n\"这可是我专门为你准备的礼物～\"带着坏笑的黑希向着白希走去，本应坚固的地面却被二十万倍的黑希踩出一个又一个足型坑洞，对于星球的小人们来说，这样的坑洞是巨大的灾难，不仅仅是其中溢出的岩浆，还有那被数百万吨的重量压实的泥土，但他们很快就不需要考虑这些了...\n\"另一个我！\"\n白希的话音还未落下，黑希的玉足就已经落在了地上，而脚印两边赫然分布着一座巨型城市，作为沿海的商业港口，大量的人口居住在其中，灾难来临时，他们早已聚集在地下的防空洞内，祈求着脆弱的工事能挡住黑希的毁灭，但黑希根本不会给他们机会，她早就看到了人们在哪里，并且精准的踩中了人口最多的数十个防空洞，上千万人被神明的力量所踩中，这裹挟着头顶泥土的力量瞬间将他们掩埋，尸体与血液在泥土中爆开，而没有躲进防空洞内的人们，要么在楼房内被碎裂的建筑所覆盖，要么\"幸运\"地与黑希的脚掌来了个亲密接触，但无一例外，他们都被希儿碾成肉泥。\n\"你...\"\n白希从未如此近距离看过这恐怖的一幕，即使曾经对星球的毁灭也仅仅是弹指一瞬，然而对微生物们的屠杀还在继续，似乎是为了让白希再看一次一般，黑希的脚向左右扫动，虽不如落脚的深度，但这样的破坏依然摧毁了小人们幸存的城市，而看着这一切的白希脑子一片空白，她仿佛能听到城市里人们的哀嚎与求饶，不过黑希此时已经来到了她的面前。\n\"怎么啦，你还对这些虫子抱有怜悯吗？\"坐下来的黑希无意间又压扁了一座城市，不过这对于城市里的百万人来说或许是件好事，如果他们看到了黑希接下来的行为，他们甚至会感谢黑希赐予了他们瞬间死亡。\"没...没有。\"不太想扰乱黑希兴致的白希只能违心地回答，但接下来黑希却环抱着她，慢慢躺了下来。\n\"这颗星球很适合做我们的游乐场呢，恒星的光芒与温度刚好合适，地面也挺软的，还有这么多小虫子陪我们一起～\"带着坏笑的黑希将脑袋轻轻放上白希的肩膀，享受着另一个自己身上 maiden的芬芳，而不断轰炸着她们的空军与轨道舰队则被随手扇毁，或是被黑希轻轻捏住，按碎在白希的身体上。\n\"你看，即使你什么都不做，这些小虫子们也会被你的一举一动给杀死呢。\"黑希笑着揉了揉白希的鼻子，就在刚刚，星球上的军队出动了所有的空军，但刚飞过白希的鼻子时就被呼吸所破坏，无数的钢铁巨兽炸开在白希的鼻孔旁，而海军，则早在白希将脚放入海洋中时，就与黑希的玉足一起将舰队搅碎了。\n\"怎么样，我的服务还不错吧～\"轻轻揉捏着白希的胸口，黑希的另一只手不老实的向白希身下伸去，而当白皙反应过来时，裙子已经被掀开，甚至胖次都要被扒开。\n\"别！\"脸羞红的白希摇了摇头，试图挡住黑希的手，但并没有什么效果，黑希只是随手一拍，白希也只能乖乖将手移开，任由黑希的手指伸进去。\n触碰到白希蜜穴的一瞬间，白希突然颤抖了一下，这对身下撤离的小人们来说可是不小的灾难，强烈的地震瞬间撕裂了大地，无数的小人掉进了那幽深的裂痕中，而接下来，一次又一次的震动将他们的下面完全变成了无人区。\n\"好好看着，虫子们，这说不定是你们最后一次欣赏 maiden的私处了呢～\"黑希一边挑弄这身下的虫子，一边双指继续在白希的蜜穴当中搅动，而白希从原本压抑的轻哼，逐渐变为一段一段的叫声，从十万倍躯体内发出的音波让近处的小人们瞬间炸开成一团团血雾，而即使是离希儿很远的，也无可避免的被这声音击穿了耳膜，不断流出鲜血。\n\"对，就是这样。\"黑希手上动作越发快速，抽查的力气也越来越大，白希的爱液造就在下面形成了一片高于地表的湖泊，流动的液体同样淹没着身下的一切，幸存者连同着他们的城市一起被粘稠的爱液淹没，破坏，并流入了海洋之中。\n\"啊！！！\"一声超越宇宙中一切声音的浪叫传遍了整颗星球，白希的爱液从蜜穴中瞬间冲出，白色的胖次拦下了大多数的液体，但仍有一部分液体顺着大陆流进海里，让海岸线变成了一片爱液的海洋。\n\"嗯～咸咸的。\"黑希将沾满爱液的手指轻轻伸进嘴里品尝后，随手抹在了一旁的城市上，而身旁的白希早已满脸羞红，或许在 maiden休息过后，这颗星球也难逃毒手吧...
