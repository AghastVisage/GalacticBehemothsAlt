  # 希儿的指尖捏起一颗蓝白色星球，[event_target:seele_roll_84.GetName]就这样被轻松地放在手中把玩，外层冰川泛着奶油般柔和的色泽，如同刚从冷柜取出的冰淇淋球，这颗被永冻层包裹的星球正安静地躺在指腹，体表的温度使得冰川不断融化，雪水与寒冰带给了希儿一丝凉意。\"在融化了吗？那必须快点吃掉呢。\"\n\n小舌轻轻贴住北极点，整片冰原迅速塌陷，香甜的津液滑向[event_target:seele_roll_84.GetName]，寒意顺着味蕾炸开，冰盖表层在唾液浸润下裂开蛛网状纹路，冰川被舌尖卷起送入口中，凉意顿时绽放开来，冰层逐渐在希儿的口腔内融化开来，内部封存的寒冰与各种残骸一并落入了深喉。破碎的冰川卡在了舌尖上细小的纹路中，在融化消失的过程中带来了别样的触感。\n\n\"感觉味道还不错呢，\"第一次的舔舐几乎将整个北半球彻底毁灭，地幔的岩浆撒向天空，冰蓝色的地表逐渐被赤红覆盖，希儿只是舔了舔嘴唇，似乎在回味着冰凉的触感。\"就全都吃掉吧~\"[event_target:seele_roll_84.GetName]像糖果一样被希儿送入了口中，坚硬的地表在牙齿的碰撞中裂解，岩层碎裂的咔嗒声宛如咬开巧克力脆皮，小舌扫过星球将其轻易拍碎为了大小不一岩石，滚烫的熔岩溏心从破口涌出，在舌床上铺开的暖流与冰凉的刺激相互照应在口腔中绽放开来。星球内核因冲击而剧烈震颤四散裂解，越来越多的熔岩涌到了舌苔之上流入喉咙，地核的颗粒感混杂着丝滑带来了奇特的享受。\n\n随着希儿将星球的碎片咽下，温热感与残留的冰渣在食道里碰撞，炽热的核心也仅仅在几次唾液冲刷下便冷却落入腹中。在胃酸中被消化殆尽。\"要不要让布洛妮娅姐姐也尝尝呢？\"
  gts_seele.84.desc: "§B<Seele>§! pinched a blue-white planet between her fingertips, [event_target:seele_roll_84.GetName] effortlessly held in her hand like an ice cream ball freshly taken from the freezer. The outer glaciers glowed with a creamy softness, and the eternally frozen planet lay quietly on her fingertip, its temperature causing the ice to melt constantly, the snow and ice bringing a faint chill to §B<Seele>§!. 'Is it melting? Then I must eat it quickly.'\n\nHer small tongue lightly touched the North Pole, the entire ice sheet collapsing rapidly. Sweet saliva slid toward [event_target:seele_roll_84.GetName], the coldness exploding across her taste buds. The ice surface cracked into a spiderweb pattern under the saliva's moistening, and the glaciers were rolled up by her tongue and sent into her mouth. The coldness instantly spread, the ice gradually melting in her mouth, the frozen remains and debris falling into her throat. Broken ice stuck to the tiny crevices on her tongue, providing a unique sensation as it melted.\n\n'It tastes pretty good,' the first lick almost completely destroyed the entire northern hemisphere. Mantle magma sprayed into the sky, the icy-blue surface gradually covered in crimson. §B<Seele>§! licked her lips, seemingly savoring the cool sensation. 'Let's eat it all~' [event_target:seele_roll_84.GetName] was sent into her mouth like candy. The hard surface cracked under her teeth, the sound of rock layers shattering like biting into a chocolate shell. Her tongue swept over the planet, easily crushing it into rocks of various sizes. The molten magma core oozed from the cracks, spreading warmth across her tongue, the contrast of hot and cold sensations blooming in her mouth. The planet's core trembled violently, scattering and disintegrating, more and more magma flowing onto her tongue and down her throat. The grainy texture of the core mixed with the smoothness brought a peculiar enjoyment.\n\nAs §B<Seele>§! swallowed the planet's fragments, warmth and residual ice shards collided in her esophagus. The burning core cooled and fell into her stomach after a few rinses of saliva. It was completely digested in stomach acid. 'Should I let §C<Bronya>§! sister try it too?'"
