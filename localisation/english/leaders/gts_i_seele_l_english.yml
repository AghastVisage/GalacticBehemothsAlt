  # 理之律者核心
  r_gtsra_bronya_core: "Core of the Herrscher of Reason"
  # 具有构造力量的核心，自原主人体内分离后仍保持着相当的能量产生，但其光芒却日渐黯淡.\n\n无论如何，利用时应当格外小心
  r_gtsra_bronya_core_desc: "A core imbued with the power of construction. Even after being separated from its original owner, it still maintains considerable energy production, though its glow is gradually dimming.\n\nRegardless, extreme caution should be exercised when using it."
  # 死生之律者核心
  r_gtsra_seele_core: "Core of the Herrscher of Life and Death"
  # 具有创生与凋零力量的核心，似乎并不存在于原主人体内，这只是她力量凝聚后的具象体现.\n\n出于对其能力的考虑，使用时应当小心
  r_gtsra_seele_core_desc: "A core imbued with the power of creation and withering. It doesn't seem to exist within its original owner; rather, it's a manifestation of her power condensed into form.\n\nDue to its abilities, caution is advised when using it."
  # 希儿的日记
  r_gtsra_seele_book: "Seele's Diary"
  # 量子之海的飘荡给希儿留下了深刻的影响，她将思念寄托在了这本日记之中\n如今凭借灵能构建的通道，我们能够通过它联系到希儿，<希儿>和布洛妮娅\n\n\"§B[event_target:seele_12.GetName]可以不要看希儿写的日记吗?不然的话...不然希儿真的会生气的.\"§!
  r_gtsra_seele_book_desc: "Drifting in the Quantum Sea left a profound impact on §B<Seele>§!. She poured her longing into this diary.\nNow, through a psionic channel, we can use it to contact §B<Seele>§!, §R<Seele>§!, and §C<Bronya>§!.\n\n'§B[event_target:seele_12.GetName], can you not read §B<Seele>§!'s diary? Otherwise... §B<Seele>§! will really get angry.'§!"
  # 给书
  gts_seele.1018.name: "Seele Gives the Book"
  # §Y[Root.GetRulerName]§!看着光点从§B希儿§!的手中缓缓缩小,飘到了自己面前\n"这是?"§B"是希儿的日记本啦,链接起来的话[Root.GetRulerName]应该也可以用它来和希儿联系."\n"啊,还有...可以不要看希儿前面写的东西吗..."§!
  gts_seele.1018.desc: ""§Y[Root.GetRulerName]§! Watching the speck of light slowly shrink in §B Seele's§! hand and float toward me\n\"What's this?\" §B \"It's Seele's diary. if we link it, [Root.GetRulerName] should be able to use it to contact Seele, too.\"\n\"Oh, and... could you please not read what Seele wrote earlier...?\"§!""
  # 那就收下吧\n\n现在你可以在遗珍界面通过希儿的日记本联系她了
  gts_seele.1018.1: ""Well, then, go ahead and take it.\n\nYou can now contact Seele through her diary in the \"Relics\" interface.""
