  # 希儿的爱液
  seele_liquid: "Seele's Love Juice"
  # 希儿为我们提供的"特制饮品"，只是采集时错误的体型导致收集到爱液数量过多，给收集和储存带来了巨大的麻烦...\n往好处想，人人都能分到了，不是吗?
  seele_liquid_desc_short: "The 'special drink' §B<Seele>§! provided for us. However, due to the size difference during collection, the amount of love juice collected was excessive, causing significant trouble in storage and handling...\nOn the bright side, everyone can have a share, right?"
  # 虽然不知道原理，但爱液中蕴含着丰富的营养与强大的灵能，或许还可以作为燃料使用？
  seele_liquid_desc_details: "Though the principle is unknown, the love juice contains rich nutrients and powerful psionic energy. Perhaps it can even be used as fuel?"
  # 破碎的冰川星球
  seele_ice_cream: "Shattered Glacier Planet"
  # 从希儿齿缝中发现的一块星球的残骸，寒冷的表层已被尽数融化，香津与熔岩混合在一起，残破的地核勉强在口中维持着形态.作为清理口腔的收获，我们将其列入收藏并借此进行地质研究.
  seele_ice_cream_desc_short: "A fragment of a planet discovered in the gaps of §B<Seele>§!'s teeth. The icy surface has completely melted, with saliva and magma mixed together. The broken core barely maintains its shape in her mouth. As a result of cleaning her mouth, we've added it to our collection and use it for geological research."
  # 根据希儿所说，冰川星球的味道似乎更像圣代?
  seele_ice_cream_desc_details: "According to §B<Seele>§!, the glacier planet tasted more like a sundae?"
  # 希儿的白丝
  seele_silk: "Seele's White Stockings"
  # 由<希儿>"自愿"送给我们的纪念品，虽然希儿看到的时候手足无措，然后满脸羞红地跑掉了.但这份礼物无疑见证了二人的深厚友情(?)，同时也加深了我们与希儿之间的联系
  seele_silk_desc_short: "A 'voluntary' gift from §R<Seele>§!. Although §B<Seele>§! was flustered and ran away blushing when she saw it, this gift undoubtedly symbolizes the deep friendship between the two (?), while also strengthening our connection with §B<Seele>§!."
  # 白丝中已经浸透了希儿的体香，浓郁的足臭从每一根纤维中散发出来，导致我们不得不支出额外的费用用于清理进入丝袜的小人.
  seele_silk_desc_details: "The stockings are soaked with §B<Seele>§!'s scent, and a strong foot odor emanates from every fiber, forcing us to spend extra resources on cleaning out the tiny people who entered the stockings."
  # 希儿的沙漠星球改造
  decision_gts_seele_desert: "Seele's Desert Planet Transformation"
  # 让希儿对着这颗星球轻轻吹口气，利用风力清理地表，通过唾液带来降水从而改变环境，使这颗星球宜居.
  decision_gts_seele_desert_desc: "Have §B<Seele>§! gently blow on this planet, using the wind to clear the surface and bringing precipitation through her saliva to change the environment, making the planet habitable."
  # 希儿的冰封星球改造
  decision_gts_seele_ice: "Seele's Frozen Planet Transformation"
  # 让希儿把这颗星球含在嘴里，用香甜的津液和气息融化冰川，使这颗星球摆脱寒冷的坏境从而宜居.
  decision_gts_seele_ice_desc: "Have §B<Seele>§! hold this planet in her mouth, using her sweet saliva and breath to melt the glaciers, freeing the planet from its frozen environment and making it habitable."
  # 宇宙碎片
  seele_universe: "Cosmic Fragment"
  # 在希儿加入我们时,趁机从游离的能量中一并提取的部分,我们或许可以借此研究虚境中神奇的生态,或是研究这片微小宇宙?
  seele_universe_desc_short: "The part extracted from the free energy when Seele joined us. Perhaps we can use this to study the magical ecology in the Shroud, or study this microscopic universe?"
  # 对此进行研究,我们得以推测希儿在量子之海中的经历...
  seele_universe_desc_details: "conducting research on this, we can speculate on Seele's experience in the Sea of Quanta..."
  # §B天秤崩落之刻§!
  seele_balance_white: "§BMoment of Scale Collapse§!"
  # 天秤此时偏向右侧
  seele_balance_white_desc_short: "The scale currently tilts to the right"
  # 这个物件也是希儿力量具象化的体现,如今似乎更加倾向§B希儿§!,我们可以从中隐隐感到一丝安宁
  seele_balance_white_desc_details: "This object is also a manifestation of Seele's power, and now seems to be more inclined towards §BSeele§!, from which we can faintly feel a trace of peace"
  # §R天秤崩落之刻§!
  seele_balance_red: "§RMoment of Scale Collapse§!"
  # 天秤此时偏向左侧
  seele_balance_red_desc_short: "The scale currently tilts to the left"
