  # \"唔，像是糖豆一样呢？不小心吞下去的话[Owner.GetRulerName]会很为难的吧。\"希儿漂浮在[Root.GetName]旁，看着小小的星球围绕着自己开始了公转，不由产生了些奇妙的想法，\"还是以后再试试吧。\"希儿摇了摇头，开始了自己的任务。\n\n希儿的唇瓣微微张开，清香的气息席卷了[Root.GetName]的每一处角落，冰封的星球被含入口中，[Root.GetName]顿时陷入了黑暗。温热的口腔像一座缓慢苏醒的熔炉，湿热的气息顺着星球表面蜿蜒爬行，积攒亿年的冰盖最先震颤，冰层开始渗出细密水珠零星银线在冰面游走，很快汇聚成奔腾的暗河。冰川底部传来闷雷般的轰鸣，一座座冰峰在蒸汽中轰然倒塌，碎冰坠入新生的河流，随之汇入海洋成为滋生生命的温床。波涛汹涌的唾液海洋落入新形成的海洋中，使得希儿清香的气味印刻在了[Root.GetName]之中。\n\n柔软的舌尖轻轻扫过星球背面，[Root.GetName]上的粉色天空骤然落下，仅凭简单的动作便被轻易改变了星球的地表，突如其来的高温让整片冰海溶解，融化的冰水漫过岩石，地下的熔岩因舌尖的挤压而迸发，以肉眼可见的速度吞噬岩石表面又在唾液中和下迅速冷却，[Root.GetName]在极短的时间内便完成了地壳数亿年的演变。在一次次舌尖的舔舐下，[Root.GetName]的冰层已经完全融化，雪泥与唾液混合形成了新的土壤，无数的生命能够以此生存。希儿口腔内湿热的气息改变了原有的气候，至少在未来的千年内[Root.GetName]绝对不会重归寒冷了。
  gts_seele.85.desc: "'Mm, it's like a candy, isn't it? It would be troublesome if I accidentally swallowed it, right?' §B<Seele>§! floated beside [Root.GetName], watching the tiny planet orbit around her, her thoughts wandering. 'Let's try it later.' §B<Seele>§! shook her head and began her task.\n\n§B<Seele>§!'s lips parted slightly, her fragrant breath sweeping across every corner of [Root.GetName]. The icy planet was placed into her mouth, and [Root.GetName] was plunged into darkness. Her warm mouth was like a slowly awakening furnace, humid breath winding across the planet's surface. The ice sheets, accumulated over billions of years, trembled first, water droplets seeping from the ice, forming thin silver lines that soon converged into rushing underground rivers. A thunderous rumble came from the base of the glaciers, ice peaks collapsing in the steam, the shattered ice falling into the newborn rivers and merging into the ocean, becoming a cradle for life. The turbulent saliva ocean fell into the newly formed sea, imprinting §B<Seele>§!'s fragrance onto [Root.GetName].\n\nHer soft tongue gently swept over the planet's backside, the pink sky of [Root.GetName] suddenly falling. The planet's surface was easily altered with a simple movement. The sudden high temperature melted the entire ice sea, the water flooding over the rocks. Underground magma burst from the pressure of her tongue, visibly devouring the rock surface and quickly cooling in the saliva. [Root.GetName] completed the evolution of its crust in an extremely short time. With each lick of her tongue, the ice layers of [Root.GetName] completely melted, the snow mud mixing with saliva to form new soil, nurturing countless forms of life. The humid heat in §B<Seele>§!'s mouth altered the planet's climate, ensuring that [Root.GetName] would not return to freezing for at least the next thousand years."
