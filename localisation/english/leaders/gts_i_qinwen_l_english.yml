  #  秦雯回过神，脸微微发烫：“没、没什么。”\n“骗人。”海柠凑近看她，忽然笑了，“你每次发呆都是在想‘我这种人怎么会有人理’，对不对？”\n秦雯被说中了心事，垂下眼不说话。\n海柠轻笑一声，伸手捧起她的脸，让她看着自己：“怎么会没人理呢？我理呀。\n秦雯张了张嘴，什么都说不出来。\n海柠的拇指轻轻摩挲着她的脸颊，像揉面团似的搓了搓，把秦雯的小脸搓得跟番茄一样红。\n秦雯眼眶有些发酸。她想说“谢谢”，可那几个字堵在喉咙里，怎么也说不出口。\n“好啦好啦，”海柠捏捏她的鼻尖，“你有人在意的好不好？我不是人吗？这辈子当你同桌，下辈子还当你同桌，够不够？”\n秦雯被她逗笑了，用力眨了眨眼，把感动的泪意憋回去：“哪有人自己说自己不是人的。”\n海柠理直气壮：“为了你，不是人就不是人。”\n秦雯看着她，忽然觉得心底那片总也填不满的空洞，被什么东西一点点暖热了。\n其实海柠不知道——在海柠眼里，秦雯是那个唯一不会被她光芒灼伤的人。从南方城市辗转来到寒岭那年，她见过太多冲着她笑脸凑上来的人。只有秦雯，安安静静地坐在角落，既不刻意靠近，也不刻意疏远。她递过去半块橡皮，秦雯接过来，小声说“谢谢”，然后认真地在卷子上改起了错题。\n那一刻她就知道，这个存在感极低的女孩，是唯一能让她放下所有防备的人。\n“那……”秦雯红着脸，小声说，“那就再亲你一口。”\n她凑过去，对准海柠的脸蛋，像小鸡啄米似的，轻轻啄了一下，又一下。\n海柠的脸被亲得又红又热，却笑得比谁都开心。她伸手把秦雯揽进怀里，下巴抵在她发顶，声音软得像化开的糖：“这才像话嘛。”\n“小柠，走吧，回房间”\n“好！”\n在秦雯的房间里，二人又玩了很长一段时间才沉沉睡去，睡觉的时候，仍是抱在一起的呢\n在这个世界上，这二人的故事已告一段落，不过，在一个未知的地方，以这二人为主角的史诗才刚刚开始，还是以一整个世界为舞台的状烈史诗
  gts_qinwen.10.desc: "Qin Wen came back to herself, her face growing slightly warm. \"No-nothing.\"\\n\"Liar.\" Haining leaned closer to look at her, then suddenly smiled. \"Every time you space out, you're thinking, 'How could anyone pay attention to someone like me,' aren't you?\"\\nQin Wen's thoughts had been exposed, and she lowered her eyes without speaking.\\nHaining chuckled softly, reached out to hold Qin Wen's face, and made her look at her. \"How could no one pay attention to you? I do.\\nQin Wen opened her mouth, but could not say anything.\\nHaining's thumb gently stroked her cheek, then rubbed it like kneading dough, until Qin Wen's little face was as red as a tomato.\\nQin Wen's eyes began to sting. She wanted to say \"thank you,\" but the words stuck in her throat and would not come out.\\n\"All right, all right,\" Haining pinched the tip of her nose. \"Someone cares about you, okay? Am I not someone? I'll be your desk mate in this life, and your desk mate again in the next. Is that enough?\"\\nQin Wen was amused by her and blinked hard, holding back the tears of emotion. \"Who calls themselves not someone?\"\\nHaining answered with perfect confidence, \"For you, if I'm not someone, then I'm not someone.\"\\nQin Wen looked at her and suddenly felt that the empty place in her heart, which had never been filled, was being warmed little by little by something.\\nIn truth, Haining did not know that, in Haining's eyes, Qin Wen was the only person who would not be burned by her radiance. The year she moved from a southern city to Hanling, she had seen too many people come up to her with smiling faces. Only Qin Wen sat quietly in the corner, neither deliberately approaching nor deliberately keeping away. Haining handed her half an eraser; Qin Wen took it, softly said \"thank you,\" and then earnestly corrected the mistakes on her test paper.\\nIn that moment, Haining knew that this girl with such a faint presence was the only person before whom she could lower all her defenses.\\n\"Then...\" Qin Wen said softly, blushing, \"then I'll kiss you again.\"\\nShe leaned over toward Haining's cheek and, like a chick pecking rice, gently pecked once, then again.\\nHaining's face was kissed red and warm, but she smiled more happily than anyone. She reached out and pulled Qin Wen into her arms, resting her chin on the top of her hair, her voice soft as melted sugar. \"That's more like it.\"\\n\"Xiao Ning, let's go back to the room.\"\\n\"Okay!\"\\nIn Qin Wen's room, the two of them played for a long time before falling deeply asleep. Even while sleeping, they were still holding each other.\\nIn this world, the story of these two had come to an end. But in an unknown place, an epic starring the two of them had only just begun, a magnificent epic with an entire world as its stage."
