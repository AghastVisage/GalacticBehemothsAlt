  #  “小柠~”\n秦雯轻声唤她，甜美的声音从唇间溢出\n“可爱呢……”\n然后，她轻轻吻了下去，那个吻住了海柠的整个身体\n轻柔得像一片花瓣飘落\n但对于海柠来说，却像是被整片天空亲吻，温热的触感从额头蔓延到全身，带着淡淡的、属于秦雯的香气，让人晕乎乎的，软绵绵的，像泡在温水中一样\n她下意识闭上眼睛，光芒更甚，海柠的身体也缓缓变大，几万千米的尺度，能让秦雯的亲吻更加甜蜜了\n秦雯的唇停在那里，很久很久，才缓缓离开\n等海柠再睁开眼睛时，映入眼帘的是那双含笑淡粉色眸子，近在咫尺，盛满了温柔。\n“脸好红呀~害羞了呢”\n秦雯轻声说，语气里带着点促狭，但更多的是宠溺\n海柠张了张嘴，想反驳，却发现自己的脸确实烫得吓人。\n“才、才没有……”\n声音小得像蚊子哼哼。\n秦雯轻笑着，用指尖轻轻蹭了蹭海柠的脸颊——那个动作温柔极了，像在抚摸什么稀世珍宝\n“小柠。”\n“嗯……？”\n“刚才踩星球的时候，那么大胆呢”\n秦雯歪着头看她。\n“怎么现在，被我亲一下，就变成这样啦？”\n海柠的脸更红了。\n她想说“那不一样”，想说“你突然变得这么大”，想说“我还没准备好”——但所有的话都堵在喉咙里，最后只能化作一句：\n“……坏蛋...坏”\n说完，海柠鼓起勇气，猛的一个大跳，对着如星球般的巨唇吻了上去\n声音又软又糯，带着点撒娇的意味。\n秦雯愣了一下，随后，使坏笑着，伸出那偌大的红舌，与海柠的小粉舌交织，香津溅了小海柠一脸\n然后她笑得更开心了\n那笑声在宇宙中回荡，温柔而明亮。她把海柠轻轻捧到胸前，用脸颊蹭了蹭她，像小猫蹭主人那样\n“小柠~坏蛋~”\n她轻声说，语气里满是依恋。\n“只属于我的坏蛋呀~”\n海柠被她蹭得晕乎乎的，整个人蜷缩在温热的掌心里，脸红得像熟透的番茄\n她想说什么，却发现自己好像……\n一点都不讨厌这样\n甚至有点喜欢\n喜欢被她这样捧着\n喜欢被她这样蹭着\n喜欢听她叫自己“小柠”，用那种温柔到让人想哭的声音\n\n就算体型的差距如鸿沟一样，对她们来说，也只是甜甜的贴贴罢了呢\n\n秦雯看着掌心那个小小的人儿，脸红红的，眼睛湿漉漉的，身上还沾满了属于自己的香津\n她心里软成一片\n“小柠~”\n她轻声唤道\n“嗯……？”\n海柠抬起头，对上那双似星球般含笑的淡粉色眸子\n然后她看见那张巨大的脸越来越近，越来越近，温热的呼吸拂过全身——那唇再次靠近，不过，这一次，却没有停下\n“诶……？”\n海柠还没来得及反应，整个世界忽然暗了下来，只剩温软的触感与无处不在的少女体香\n她被含住了\n秦雯的玉唇轻轻合拢，将她整个身体包裹进那片温热柔软之中。没有用力，只是轻轻地含着\n\n四周是温热的、柔软的、带着淡淡香气的壁——那是秦雯的口腔内侧。光线透过唇瓣的缝隙渗进来，染成暧昧的粉红色...她能感觉到秦雯的呼吸，一下一下，温热的潮汐拂过全身\n“唔……”\n她想说什么，但声音闷在喉咙里，传不出去\n然后——\n有什么东西轻轻碰了碰她。\n柔软、温热、湿漉漉的\n从脚底划过，顺着小腿，慢慢向上，把她足袜上的所有城市残骸都一下一下的舔舐干净\n那舌头对她来说太大了——像一条温热的河流，缓缓流淌过她的身体。舌尖轻轻卷起她的裙摆，又很快放开，像调皮的孩子在试探什么。然后舌面贴上来，将她整个身体托起，轻轻翻了个个儿\n海柠趴在那片温热的柔软上，大脑一片空白。\n她甚至能感觉到舌面上细小的味蕾，每一次舔舐都，痒痒的，暖暖的，让人浑身发软。
  gts_qinwen.17.desc: "“Xiao Ning~”\\nQin Wen called to her softly, her sweet voice spilling from between her lips.\\n“So cute...”\\nThen she gently kissed down, and that kiss covered Haining’s entire body.\\nIt was as light as a falling petal.\\nBut to Haining, it was like being kissed by the entire sky. The warm sensation spread from her forehead across her whole body, carrying the faint fragrance that belonged to Qin Wen, making her dizzy and soft, as if soaking in warm water.\\nShe instinctively closed her eyes. The light grew even brighter, and Haining’s body also slowly grew larger. At a scale of tens of thousands of kilometers, Qin Wen’s kiss could become even sweeter.\\nQin Wen’s lips stayed there for a long, long time before slowly leaving.\\nWhen Haining opened her eyes again, what entered her vision was that pair of smiling pale pink eyes, close at hand and filled with tenderness.\\n“Your face is so red~ You’re shy.”\\nQin Wen said softly, her tone carrying a little teasing, but even more affection.\\nHaining opened her mouth, wanting to refute her, but discovered that her face really was frighteningly hot.\\n“I-I’m not...”\\nHer voice was as small as a mosquito’s hum.\\nQin Wen laughed softly and gently rubbed Haining’s cheek with her fingertip—that motion was extremely gentle, like caressing some priceless treasure.\\n“Xiao Ning.”\\n“Mm...?”\\n“You were so bold when you were stepping on the planet just now.”\\nQin Wen tilted her head and looked at her.\\n“So how did you become like this just from one kiss from me?”\\nHaining’s face turned even redder.\\nShe wanted to say “that’s different,” wanted to say “you suddenly became this big,” wanted to say “I wasn’t ready yet”—but all the words caught in her throat, and in the end could only turn into one sentence:\\n“...Bad girl... bad.”\\nAfter saying that, Haining gathered her courage and took a sudden great leap, kissing the planet-like enormous lips.\\nHer voice was soft and sticky, with a little hint of acting spoiled.\\nQin Wen froze for a moment, then smiled mischievously and extended that enormous red tongue, intertwining it with Haining’s little pink tongue. Fragrant saliva splashed all over little Haining’s face.\\nThen she laughed even more happily.\\nThat laughter echoed through the universe, gentle and bright. She gently held Haining to her chest and rubbed her with her cheek, like a little cat nuzzling its owner.\\n“Xiao Ning~ Bad girl~”\\nShe said softly, her tone full of attachment.\\n“My bad girl alone~”\\nHaining was left dizzy from her nuzzling, curled up in the warm palm, her face as red as a ripe tomato.\\nShe wanted to say something, but found that she seemed...\\nnot to hate this at all.\\nShe even liked it a little.\\nShe liked being held by her like this.\\nLiked being nuzzled by her like this.\\nLiked hearing her call her “Xiao Ning” in that voice so gentle it made her want to cry.\\n\\nEven if the difference in their sizes was like a chasm, to the two of them, it was only sweet cuddling.\\n\\nQin Wen looked at the tiny person in her palm, her face red, her eyes wet, and her body still covered in Qin Wen’s fragrant saliva.\\nHer heart softened completely.\\n“Xiao Ning~”\\nShe called softly.\\n“Mm...?”\\nHaining raised her head and met those planet-like pale pink eyes filled with laughter.\\nThen she saw that enormous face drawing closer and closer, warm breath brushing over her whole body—the lips approached again, but this time, they did not stop.\\n“Eh...?”\\nBefore Haining had time to react, the entire world suddenly darkened, leaving only a warm, soft sensation and the everywhere-present scent of a young woman.\\nShe had been taken into her mouth.\\nQin Wen’s jade lips gently closed, wrapping Haining’s entire body in that warm softness. She did not use force, only held her lightly.\\n\\nAll around were warm, soft walls carrying a faint fragrance—that was the inside of Qin Wen’s mouth. Light seeped in through the gap between her lips, dyed an ambiguous pink... She could feel Qin Wen’s breathing, one breath after another, warm tides brushing over her whole body.\\n“Mm...”\\nShe wanted to say something, but her voice was muffled in her throat and could not get out.\\nThen—\\nsomething gently touched her.\\nSoft, warm, and wet.\\nIt swept from the soles of her feet, along her calves, and slowly upward, licking clean all the city debris on her socks bit by bit.\\nThat tongue was far too large for her—like a warm river, slowly flowing over her body. The tip of the tongue lightly curled up the hem of her skirt, then quickly let it go, like a mischievous child testing something. Then the surface of the tongue pressed up, lifting her entire body and gently turning her over.\\nHaining lay prone on that warm softness, her mind completely blank.\\nShe could even feel the tiny taste buds on the tongue’s surface. Every lick was ticklish and warm, making her whole body go soft."
