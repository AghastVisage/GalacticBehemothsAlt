  gts_qinwen.9.name: ""
  #  “咚咚咚。”\n“雯雯，我来啦。”\n轻柔的敲门声过后，一声温柔的呼唤传来。而这声音的主人，便是那少女为何下午就打烊的主要原因了。\n门开的瞬间，秦雯还没来得及说话，就被一把抱住了。\n“哎呀，想死你了！”\n海柠整个人挂在她身上，像只小猫般蹭着她的颈窝。夕阳从身后斜斜照进来，给那头雪白的长发镀上一层暖融融的金边，连带着整个门厅都明亮了几分。\n秦雯微微一僵——她总是这样，无论被抱多少次，第一反应都是不知所措。但她没有躲，只是轻轻拍了拍海柠的背，小声说：“回来了就好。”然后，她踮起脚，娇羞地在海柠脸颊上落下一个吻。\n“就这？”海柠松开她，佯装不满地鼓起脸，“我跑了一整天，你就亲一下？”\n秦雯抬眼看着她。海柠今天穿了一件米白色的棉袄，衬得本就出众的五官愈发柔和，眉眼间全是明媚的笑意——她天生就是这样的人，走到哪里都是焦点，随便一站就能让整条街亮起来。\n而自己呢？\n秦雯下意识往后挪了挪。她知道自己是什么样的人——白发在寒岭不算稀罕，但她这头白发总是被人忽略，连同她这个人一起。从小到大，她习惯了坐在教室角落不被点名，习惯了分组时最后一个被想起，习惯了明明站在人群中央，却像透明的一样。\n但海柠不一样。\n海柠是那种一进门就会被所有人注视的人。她的光芒不是刻意张扬，而是自然而然地流淌出来，让人忍不住想靠近。当初她转学到寒岭时，全班都轰动了，男生女生争着跟她做朋友。而秦雯只是远远地看着，心想：这样的人，跟自己不会有任何交集。\n可海柠偏偏走向了她。\n“嗨，”海柠伸手在她眼前晃了晃，“又发呆。在想什么？”
  gts_qinwen.9.desc: "\"Knock, knock, knock.\"\\n\"Wenwen, I'm here.\"\\nAfter the gentle knock came a tender call. The owner of that voice was the main reason the young woman closed the shop in the afternoon.\\nThe instant the door opened, Qin Wen had no time to speak before she was pulled into an embrace.\\n\"Ah, I missed you so much!\"\\nHaining hung herself on Qin Wen, rubbing against the hollow of her neck like a little kitten. The setting sun slanted in from behind, gilding that snow-white long hair with a warm golden edge and making the entire entrance hall brighten a little.\\nQin Wen stiffened slightly. She was always like this; no matter how many times she was hugged, her first reaction was always helpless confusion. But she did not dodge. She only gently patted Haining's back and said softly, \"It's good that you're back.\" Then she stood on tiptoe and shyly planted a kiss on Haining's cheek.\\n\"That's it?\" Haining let go of her and puffed out her cheeks in feigned dissatisfaction. \"I ran around all day, and you only kiss me once?\"\\nQin Wen looked up at her. Haining was wearing an off-white padded jacket today, making her already outstanding features seem even softer, her brows and eyes filled with bright laughter. She was naturally that kind of person: the center of attention wherever she went, able to light up an entire street just by standing there.\\nAnd herself?\\nQin Wen unconsciously shifted back a little. She knew what kind of person she was. White hair was not rare in Hanling, but her white hair was always ignored, along with her whole self. Since childhood, she had been used to sitting in the classroom corner and not being called on, used to being the last one remembered when groups were formed, used to standing clearly in the middle of a crowd yet seeming transparent.\\nBut Haining was different.\\nHaining was the kind of person everyone would look at the moment she entered a room. Her radiance was not deliberate flamboyance, but flowed out naturally, making people unable to resist drawing near. When she first transferred to Hanling, the whole class had been stirred up, boys and girls alike competing to be her friend. Qin Wen had only watched from afar, thinking: someone like that will never have anything to do with me.\\nYet Haining walked right toward her.\\n\"Hey,\" Haining waved a hand in front of her eyes, \"spacing out again. What are you thinking about?\""
