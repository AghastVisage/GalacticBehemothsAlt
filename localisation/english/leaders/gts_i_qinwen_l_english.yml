  #  通讯器那头沉默了片刻。\n她没有立刻回应，只是静静地看着屏幕上逐帧回传的冰窟影像\n勘探员小心翼翼地清理掉入口处的冰层，露出门楣上镌刻的一行古老文字时，秦雯的目光却骤然凝住了\n那是一行用极古老的金文写成的短句，翻译过来，大意是\n“此剑不染血，此身不称功。唯愿河山无恙，万民长安。”\n刚才还在撒娇的天体极少女轻声念出这句话，语气中那些平日里的慵懒被一种罕见的沉静所取代\n勘探队继续深入，打开了那扇被封冻的墓门。墓室内部并不奢华，只有一具保存完好的遗骸，身披素甲，手握一尊巨盾，安安静静地躺在石台之上，墓室四壁刻满了密密麻麻的铭文，记录着这位将军的一生\n他曾在古国最混乱的纷争年代，统兵镇守边疆。彼时，敌国屡次犯境，边境百姓饱受战火之苦。然而他却在连战连胜、兵锋正盛之际，主动向敌国递出了求和书信，许以互市、通婚、共修水利之利。敌方统帅大为震动，回信询问其意。他只在信上写了一行字：\n“吾所求者，非战功也。吾所求者，春耕时无人惊扰，秋收时无人焚粮，孩童不必在废墟中拾取箭镞。此即吾之战争。”\n最终，双方罢兵休战，边境安宁五十余年。而他，却在一个寻常的冬夜，在戍边的营帐中静静地闭上了眼睛\n他死得平静，轻于鸿毛，连学富五车的秦雯甚至都不知道他的故事\n秦雯久久没有说话\n最后，她轻轻摘下那副圆框眼镜，用衣角拭了拭镜片，又重新戴上。她抬起头，那双粉色的眼眸中只剩下一种清澈而深沉的敬意。她开口时，语气是那样郑重，那种带着古韵的、文绉绉的语调缓缓而口\n“吾尝以为，战争者，乃文明之痼疾，不可避也。然观此将军生平，始知些许，战争之终，非在于杀戮之尽，而在于生民得安。其所求者，非胜也，乃民之安矣”\n“此君以一己之罢兵，换得二十载河清海晏，吾辈生于星辰之间，动辄裂地摧城，却未必有此君之胸怀。诚惶诚恐，自愧不如”\n她沉默了片刻，又轻轻笑了几声\n“唉……这书，我今日怕是看不进去了。鄙人须亲往寒岭，祭拜此君，帝国的事务，还是放下为好”
  gts_qinwen.103.desc: "The other end of the communicator was silent for a moment.\\nShe did not respond immediately, merely watching in silence as the ice cavern footage returned to the screen frame by frame.\\nWhen the explorers carefully cleared away the ice at the entrance and revealed a line of ancient text carved into the lintel, Qin Wen’s gaze suddenly froze.\\nIt was a short sentence written in extremely ancient bronze-script characters. Translated, its general meaning was:\\n“This sword shall not be stained with blood; this body shall claim no merit. I wish only that rivers and mountains remain unharmed, and all people live in lasting peace.”\\nThe celestial-scale girl who had been acting spoiled just moments ago softly read those words aloud. The usual languor in her voice was replaced by a rare stillness.\\nThe exploration team continued deeper and opened the frozen tomb door. The inside of the tomb was not luxurious. There was only one well-preserved skeleton, clad in plain armor and holding a great shield, lying quietly upon a stone platform. The four walls of the tomb were carved densely with inscriptions, recording the life of this general.\\nHe had once commanded troops to guard the frontier during the most chaotic age of conflict in the ancient kingdom. At that time, the enemy state repeatedly violated the border, and the border people suffered bitterly from war. Yet when he had won battle after battle and his forces were at their strongest, he took the initiative to send the enemy state a letter seeking peace, offering the benefits of mutual trade, intermarriage, and joint irrigation works. The opposing commander was deeply shaken and wrote back asking his intention. He wrote only one line in reply:\\n“What I seek is not military glory. What I seek is that no one be disturbed during spring plowing, no one’s grain be burned during autumn harvest, and no child need pick arrowheads from the ruins. This is my war.”\\nIn the end, both sides ceased fighting, and the border remained peaceful for more than fifty years. As for him, on an ordinary winter night, in a frontier garrison tent, he quietly closed his eyes.\\nHe died peacefully, lighter than a feather, and even the learned Qin Wen, who had read countless books, had not known his story.\\nQin Wen did not speak for a long time.\\nAt last, she gently removed her round-framed glasses, wiped the lenses with the corner of her clothing, and put them back on. She raised her head, and in those pink eyes there remained only a clear and profound respect. When she spoke, her tone was so solemn, that archaic and literary cadence slowly leaving her mouth.\\n“I once believed that war was a chronic disease of civilization, unavoidable. Yet after observing this general’s life, I have come to understand a little: the end of war does not lie in slaughter exhausted, but in the people finding peace. What he sought was not victory, but the safety of the people.”\\n“This gentleman exchanged his own cessation of arms for twenty years of peace and order. We were born among the stars, and at the slightest motion split the earth and destroy cities, yet we may not possess even this gentleman’s breadth of heart. With fear and shame, I find myself inferior.”\\nShe was silent for a moment, then laughed softly a few times.\\n“Alas... I fear I will not be able to read this book today. I must personally go to Hanling and pay respects to this gentleman. The affairs of the empire are better set aside.”"
