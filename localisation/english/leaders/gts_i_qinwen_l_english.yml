  #  在我们的不懈努力后，终于将鸟音的几滴乳液改造成了可居住的星球.\n星球自带的乳汁海洋可以供公民饮用许久，之前那颗星球的损失已经挽回，而那位天体级的少女则是满脸绯色的盯着那颗星球，似乎有一丝丝快感...无论如何，这对帝国来说都是大有脾益的
  gts_qinwen.121.desc: "After our unremitting efforts, we finally transformed Birdsong's few drops of milk into habitable planets.\\nThe milk oceans naturally present on the planets can provide citizens with drink for a very long time, and the loss of the previous planet has already been recovered. As for that celestial-scale girl, she stared at that planet with a flushed face, seemingly feeling a faint trace of pleasure... In any case, this is greatly beneficial to the Empire"
