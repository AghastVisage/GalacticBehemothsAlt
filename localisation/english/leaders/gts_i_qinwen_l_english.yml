  #  “呼呼  啊~哈”\n伴随着一声少女的哈欠，海柠缓缓睁开双眼，湖绿色的眸子一闪一闪，在寻找着秦雯的踪迹，不过，秦雯没找到，她脚边的丝丝骚痒感就让海柠忍无可忍，于是便低下头一看...\n那是一整个小小的街区，古代的小茅草屋，远处的亭台楼阁，还有几个虫子大小手持农具，朝着海柠穿着白袜的小脚奋力挥砍的农民，看着样式，像是秦雯所为，不过，秦雯大体是没有这种能力的，所以海柠也——\n“呼，这一定是个梦吧...”\n“如果是梦的话...那...可以踩着玩了吧...”\n温柔的声音所伴随着的是那50多米高的白袜嫩足微微移动，那些渺小的农人也是毫无悬念的成为了海柠脚下绽放的血色花朵了\n“唔...这么一下...就”\n“我杀人了...不对，这是梦里...呼”\n“如果是梦里的话，那那些建筑...”\n就像是验证她的想法一样，本来侧身躺下的海柠瞬势站了起来，不站还好，她站立之时，那300米的身体就使得那些小人全部跪了下去，毕竟，300高的尺度对于古代来说，已经是不可能达到的尺度，没有飞机，没有高楼大厦，海柠此时的身高也与神明无异了\n“呼，都好小啊，不仔细找跟本看不清呢...先试着走两步吧”海柠小心翼翼地挪动了一下脚。\n那动作在她自己看来，不过是轻轻地把脚往前探了探，甚至连脚踝都没完全抬起。但对于脚下那片世界而言，却像是一整片天空忽然压低了下来，白袜包裹着的脚尖从云雾般的高度缓缓落下。\n“轰——”\n一声沉闷的巨响在街区间炸开，海柠愣了一下，她低头看去，只见刚才还整齐排列的茅草屋已经完全塌成了一片碎木与泥土，白袜脚尖下则陷出一个浅浅的坑\n而那些方才还在挥着农具的小人也已经完全看不见了\n只剩下一些细碎的红点，在袜底与地面之间慢慢漫开。\n“呜……”\n她本能地把脚抬起来一点，\n袜底黏着一点点细小的东西，看起来像是被踩碎的浆果。\n她看了一会儿，脸忽然有点红，\n“真的……踩死了。”\n她小声嘀咕着，声音轻得像怕被谁听见一样，不过，200倍扩大的声音...却是让所有人都听的见呢
  gts_qinwen.11.desc: "\"Hoohoo  ah~ha\"\\nWith a young woman's yawn, Haining slowly opened her eyes. Her lake-green eyes flickered as she searched for Qin Wen, but before she found her, the faint tickling sensation by her feet became unbearable, so she lowered her head to look...\\nIt was an entire tiny block: little ancient thatched huts, pavilions and towers in the distance, and several insect-sized farmers holding farm tools, hacking with all their might at Haining's small feet in white socks. Judging from the style, it seemed like Qin Wen's work, but Qin Wen probably did not have this kind of ability, so Haining also-\\n\"Hoo, this must be a dream...\"\\n\"If it's a dream... then... I can step on them and play, right...\"\\nAccompanying that gentle voice was the slight movement of her tender white-socked foot, more than fifty meters tall. Those tiny farmers, without any suspense, became blood-colored blossoms blooming beneath Haining's foot.\\n\"Mm... just like that... and\"\\n\"I killed people... no, this is a dream... hoo\"\\n\"If it's a dream, then those buildings...\"\\nAs if to confirm her thought, Haining, who had originally been lying on her side, immediately stood up. It would have been better if she had not stood, for the moment she did, her three-hundred-meter body made all the tiny people kneel. After all, a scale of three hundred meters was something ancient times could never reach. With no airplanes and no skyscrapers, Haining's height at this moment was no different from that of a deity.\\n\"Hoo, they're all so small. If I don't look carefully, I can't see them at all... I'll try taking two steps first.\" Haining carefully moved her foot.\\nTo her, the motion was only gently testing her foot forward, without even fully lifting her ankle. But to the world beneath her feet, it was as if the entire sky had suddenly lowered, and the toe wrapped in white sock slowly descended from a cloudlike height.\\n\"Boom-\"\\nA dull crash exploded through the block. Haining froze for a moment and looked down, only to see that the neatly arranged thatched huts from moments before had completely collapsed into broken wood and mud, while a shallow pit had been pressed beneath the white-socked toe.\\nAnd the tiny people who had been waving farm tools just now had completely disappeared.\\nOnly a few fine red specks remained, slowly spreading between the sole of the sock and the ground.\\n\"Uu...\"\\nShe instinctively lifted her foot a little.\\nA few tiny things were stuck to the sole of the sock, looking like crushed berries.\\nShe watched for a while, and her face suddenly grew a little red.\\n\"They really... got stepped to death.\"\\nShe muttered softly, her voice so light it seemed she was afraid someone might hear. However, a voice magnified two hundred times... was enough for everyone to hear."
