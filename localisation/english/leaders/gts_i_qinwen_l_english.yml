  #  她缓缓地将那颗蓝色的星球捏握在掌心\n她低头看着自己那越来越巨大的手掌，看着那颗在掌心中逐渐变得渺小的星球，嘴角缓缓上扬，露出一个既温柔又令人心悸的笑容\n她将那星球轻轻举到自己面前，然后——像是要履行刚才那句抱抱的诺言一般——缓缓的、带着无尽的温柔，将那颗星球向自己柔软的胸前贴近、轻轻地贴了上去，将那整颗曾经承载无数生命的星球，拥入了自己的怀抱...\n“咔嚓”\n一声极轻极脆的声响，从她胸前那层层衣料和被压扁的星球之间传来\n秦雯的动作微微一顿，她低头看了一眼——那颗蓝色的星球，在她那已经膨胀到足以与恒星比肩的柔软胸脯的轻压之下，已经出现了一道道清晰的裂纹。裂痕从地表蔓延到地幔，从海洋延伸到云层，整个球体的结构正在她胸前那个漫不经心的拥抱中，悄然崩溃\n她轻轻一笑，带着更多的戏谑。她缓缓松开怀抱，看着那颗早已支离破碎的行星从她胸前滑落，碎片如流星般散落在她越来越宽广的膝弯与裙摆之间。她的手指轻轻一捏——那颗曾经完整的星球，在她指尖彻底化作了一捧细碎的尘埃，从她的指缝间簌簌洒落，融入了她身下那片无尽幽暗的星空之中\n天体级的少女微微抬起头，那对粉色的眼眸在星海中闪烁。她的玉体依旧在无声地成长，将整片星域的恒星一颗颗纳入她身影的笼罩之下\n“嗯…抱歉啦~下次……我会再温柔一点点~”.
  gts_qinwen.114.desc: "She slowly pinched that blue planet into her palm\\nShe lowered her head and looked at her ever-growing hand, at the planet gradually becoming tiny in her palm. The corners of her mouth slowly lifted, revealing a smile that was both gentle and chilling\\nShe gently raised the planet before herself, then——as if fulfilling the promise of that hug from just now——slowly, with endless tenderness, brought the planet close to her soft chest and gently pressed it against herself, embracing the entire planet that had once carried countless lives...\\n“Crack”\\nAn extremely light, crisp sound came from between the layers of clothing on her chest and the flattened planet\\nQin Wen's movements paused slightly, and she lowered her head for a glance——that blue planet, under the light pressure of her soft breasts, which had already expanded enough to rival a star, had developed clear cracks one after another. The fractures spread from the surface to the mantle, from the oceans to the clouds, and the entire sphere's structure was quietly collapsing within that careless embrace against her chest\\nShe laughed softly, with even more teasing. She slowly loosened her embrace and watched the already shattered planet slide down from her chest, its fragments scattering like meteors between her ever-widening knees and skirt hem. Her fingers pinched lightly——and the once-whole planet completely turned into a handful of fine dust at her fingertips, trickling down through the gaps between her fingers and merging into the endless dark starry sky beneath her\\nThe celestial-scale girl raised her head slightly, her pink eyes glittering in the sea of stars. Her jade body was still growing silently, bringing the stars of the entire starfield one by one beneath the shadow of her figure\\n“Mm... sorry~ Next time... I'll be just a little gentler~”."
  #  “以她酒液的残骸为星球基底，重塑该星球”
  gts_qinwen.114.a: "“Use the remnants of her wine as the planet's foundation and reshape this planet”"
