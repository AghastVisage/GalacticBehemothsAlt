  #  “唔...好舒服...诶？怎么...回来了？雯雯？”\n在快感的洪流下，海柠缓缓睁开双眸，发现周围正是她熟悉的不能再熟悉的古董店，而刚才的景观像梦一样尽教消散，只不过又真的可怕...那快感...还有微微湿润的下面...令她倍感真实...\n而对面正常大小的秦雯令她稳定了许多\n“呼，雯雯，我刚才做了个奇怪的梦...”\n“那不是梦呢~你再看你的身下呢？”\n海柠微微俯首，便看见自己的胖次上沾上了丝丝粘绸的银丝\n“唔诶？！”\n面色瞬间如蕃茄般潮红，海柠连忙捂住那里，只不过转念又想自己在梦里的种种行径，又放下了戒心\n“雯...雯雯，这，这是怎么回事？你怎么变的这么大”\n“当然是~这不是梦呢~只是一个小小的道具而己”\n“只不过，你那时候居然这么开放呢”\n“唔诶！你别说了”\n“就要说哦~”\n“啾”\n“诶~？竟然这么主动的亲上了~？”\n“啾啾啾啾啾”\n“小柠~别亲了啦！我要喘不上气啦！”\n“哼~坏蛋”\n海柠一口猛的亲上去，而后又一下一下的亲的秦雯精神涣散，而她自己的脑袋也昏昏的，二人的双唇就这样紧贴着僵持了几秒，后来，还是海柠发现不对劲后，才害羞的从对方香唇上移开了呢\n“哎呀~小柠害羞了呢”\n“坏！快别逗我了，你还没告诉我你为什么变大呢”\n“一个客人给的一个小物件罢了，一个微缩城市，可以造梦进去~然后你就想干什么都可以了”\n“啊——那可真厉害啊...”\n在两个可爱少女温柔的低语中，寒岭平凡而又充实的一天也终是落幕了
  gts_qinwen.19.desc: "“Mm... so comfortable... Eh? How did I... come back? Wenwen?”\\nUnder the flood of pleasure, Haining slowly opened her eyes and discovered that around her was the antique shop she knew better than anywhere. The scenery from just now dispersed completely like a dream, but it had also felt truly terrifying... that pleasure... and the slight wetness below... made it feel utterly real...\\nAnd Qin Wen, now at normal size across from her, made her much calmer.\\n“Phew, Wenwen, I just had a strange dream...”\\n“That wasn’t a dream~ Look underneath yourself again.”\\nHaining lowered her head slightly and saw that her panties were stained with sticky silver threads.\\n“Wuh-eh?!”\\nHer face instantly flushed as red as a tomato, and Haining hurriedly covered that place. But then she remembered all the things she had done in the dream and lowered her guard again.\\n“Wen... Wenwen, wh-what’s going on? How did you become so big?”\\n“Of course~ It wasn’t a dream~ It was just a tiny little item.”\\n“Only, you were actually so bold back then.”\\n“Wuh-eh! Don’t say it!”\\n“I’m going to say it~”\\n“Chu.”\\n“Eh~? You actually kissed me so proactively~?”\\n“Chu chu chu chu chu.”\\n“Xiao Ning~ Stop kissing me! I can’t breathe!”\\n“Hmph~ Bad girl.”\\nHaining fiercely kissed her, then kissed Qin Wen again and again until Qin Wen was dazed, while Haining’s own head also grew dizzy. Their lips stayed pressed together in a standoff for several seconds like that. In the end, only after Haining noticed something was wrong did she shyly move away from the other’s fragrant lips.\\n“Oh my~ Xiao Ning is shy.”\\n“Bad! Stop teasing me. You still haven’t told me why you got bigger.”\\n“It was just a little object given by a customer, a miniature city that lets you enter a created dream~ Then you can do whatever you want inside.”\\n“Ah— That really is amazing...”\\nAmid the gentle whispers of the two cute girls, another ordinary yet fulfilling day in Hanling finally came to an end."
