  #  不过很快，她又自己摇了摇头\n“梦而已……梦而已……”\n“在梦里应该没关系吧……”\n说完这句话，她又低头看向脚下的世界，\n刚才那一脚踩塌的地方，只占整条街的一小块。更远处还有很多小屋、田地、河流，还有密密麻麻像蚂蚁一样奔跑的小人。\n他们显然已经看见了她。\n很多人正朝着远处逃跑，也有一些人跪在地上，不停地磕头。\n“他们……是在拜我吗？”\n她蹲下来一点点，注视着下方的城市\n光是这个动作，就让整个大地发出一阵沉重的震动，\n“轰隆——”\n地面裂开细细的缝隙，几座本就摇摇欲坠的房屋直接倒塌，海柠又僵住了。\n“啊……对不起对不起……”\n她连忙小声道歉，不过说完她又愣了一下\n“等等……”\n“我为什么要跟梦里的人道歉啊……”\n她歪着头想了想，确实\n如果这是梦的话，那不就像游戏一样吗~？\n想到这里，她忽然有点好奇。\n“那……再试一下~？”\n她轻轻把脚抬起来，这一次，她看得很清楚\n白袜包裹的小脚从天空一样的高度抬起，影子慢慢笼罩住一整片村落，那些小人似乎意识到了什么，他们开始疯狂四散奔逃。\n海柠看着这一幕，心里忽然有点开心\n“呃……不会太过分吧……”\n她犹豫了一下。\n然后——\n脚落了下去。\n“轰！！”\n这一脚比刚才重得多。\n大片房屋直接被压平，屋顶和墙壁像纸一样折断。尘土像雾一样升起来，顺着她的小腿缓缓散开。\n海柠忍不住吸了一口气。\n“哇……”\n她低头看着脚下。\n刚才那条街已经完全消失了。\n只剩下一个巨大的脚印，她慢慢抬起脚，白袜底部沾着一点点深色的痕迹。\n海柠盯着那痕迹看了好一会儿。\n而后，她忽然轻轻笑了一下。\n“真的像踩沙子一样呢……”\n她的声音里多了一丝愉悦，最开始那种紧张和不安，好像慢慢淡了\n远处的山丘，在她那300米的身高眼里不过像小土包一样，\n河流像细细的线，而那些小人……已经小得几乎看不见了\n少女轻轻抬起一只脚，在空中晃了晃\n“这么小……难怪刚才没注意到。”\n低声说着，轻轻向前迈了一步\n“轰隆——”\n大地再次剧烈震动\n她这一脚直接跨过了半个村子\n脚跟落在田地里，整片田垄被完完全全压扁，而脚尖则踩在另一条街上，房屋像被橡皮擦抹掉一样整排消失\n“诶……”\n“我只是走了一步呀~”\n她忽然忍不住笑出来。\n“原来会变成这样吗~”\n她又迈了一步\n“轰——”\n这一次她故意慢了一点。\n白袜玉足缓缓落下\n她甚至能看见脚影一点点盖住地面，小人像黑点一样四散奔逃\n“嗯……”\n海柠眯着眼看了一会儿。\n然后脚轻轻一压。\n“啪。”\n她脚底微微碾了一下。\n地面就像软泥一样塌陷。\n“……有点奇怪。”\n她小声说到，但她并没有停下，反而又慢慢转了一圈。\n裙摆在空中轻轻晃动，几座高一点的塔楼直接被吹倒了\n海柠低头看着，\n脸上渐渐露出一点点忍不住的笑\n“原来……我这么大啊~要是秦雯在就好了”\n“她肯定会说我又在胡闹。”\n想到这里，她忽然有点不好意思，于是便对着那些注视着她的小人们落下了玉足\n“轰！！”\n她轻轻晃了晃脚。\n“反正只是梦嘛。”\n这一次她没有再小心。\n三百米高的身体在古代城市中慢慢移动。
  gts_qinwen.12.desc: "But soon, she shook her head again on her own.\\n“It’s only a dream... only a dream...”\\n“It should be fine in a dream, right...”\\nAfter saying that, she lowered her head again to look at the world beneath her feet.\\nThe place that had collapsed under that step just now was only a small part of the whole street. Farther away, there were many little houses, fields, rivers, and densely packed tiny people running around like ants.\\nThey had clearly already seen her.\\nMany people were fleeing into the distance, and some were kneeling on the ground, kowtowing over and over.\\n“Are they... worshiping me?”\\nShe crouched down a little, gazing at the city below.\\nThat motion alone made the entire earth give off a heavy tremor.\\n“Rumble—”\\nFine cracks split across the ground, and several houses that had already been on the verge of collapse fell down outright. Haining froze again.\\n“Ah... sorry, sorry...”\\nShe hurriedly apologized in a small voice, but after saying it, she paused again.\\n“Wait...”\\n“Why am I apologizing to people in a dream...”\\nShe tilted her head and thought about it. True.\\nIf this was a dream, wasn’t it just like a game~?\\nThinking of that, she suddenly became a little curious.\\n“Then... should I try again~?”\\nShe gently lifted her foot. This time, she could see it very clearly.\\nHer little foot wrapped in a white sock rose from a height like the sky, its shadow slowly covering an entire village. Those tiny people seemed to realize something, and began scattering madly in all directions.\\nWatching this scene, Haining suddenly felt a little happy inside.\\n“Uh... this won’t be too much, right...”\\nShe hesitated for a moment.\\nThen—\\nHer foot came down.\\n“Boom!!”\\nThis step was much heavier than the last.\\nLarge swaths of houses were flattened outright, roofs and walls snapping like paper. Dust rose like mist, slowly spreading along her calf.\\nHaining could not help taking in a breath.\\n“Wow...”\\nShe lowered her head and looked beneath her foot.\\nThat street from just now had completely vanished.\\nOnly an enormous footprint remained. She slowly raised her foot, and a few dark traces clung to the bottom of her white sock.\\nHaining stared at those marks for quite a while.\\nThen, suddenly, she gave a soft little laugh.\\n“It really is like stepping on sand...”\\nThere was a trace of pleasure in her voice, and the nervousness and unease from the beginning seemed to slowly fade.\\nThe distant hills, to her 300-meter-tall self, were nothing more than little mounds of dirt.\\nThe rivers were like thin lines, and those tiny people... were already so small she could hardly see them.\\nThe girl gently raised one foot and swayed it in the air.\\n“So small... no wonder I didn’t notice them earlier.”\\nMurmuring that, she took a gentle step forward.\\n“Rumble—”\\nThe earth shook violently again.\\nThis one step carried her directly across half the village.\\nHer heel landed in the fields, flattening the entire stretch of ridges completely, while her toes stepped onto another street, whole rows of houses disappearing as if erased by an eraser.\\n“Eh...”\\n“I only took one step~”\\nShe suddenly could not help laughing.\\n“So this is what happens~”\\nShe took another step.\\n“Boom—”\\nThis time, she deliberately went a little slower.\\nHer jade-like foot in its white sock slowly descended.\\nShe could even see the shadow of her foot covering the ground bit by bit, while the tiny people scattered like black specks.\\n“Mm...”\\nHaining narrowed her eyes and watched for a while.\\nThen her foot pressed down gently.\\n“Pat.”\\nShe lightly ground the sole of her foot.\\nThe ground caved in like soft mud.\\n“...A little strange.”\\nShe said it softly, but she did not stop. Instead, she slowly turned around once more.\\nHer skirt swayed lightly in the air, and several taller towers were blown over outright.\\nHaining looked down,\\nand a smile she could barely hold back gradually appeared on her face.\\n“So... I’m this big~ If only Qin Wen were here.”\\n“She’d definitely say I was messing around again.”\\nAt that thought, she suddenly felt a little embarrassed, so she brought her jade foot down on the tiny people staring up at her.\\n“Boom!!”\\nShe gently swayed her foot.\\n“It’s only a dream anyway.”\\nThis time, she was no longer careful.\\nHer 300-meter-tall body slowly moved through the ancient city."
