  #  舰炮安装
  gts_qinwen.107.name: "Naval Gun Installation"
  #  随着作业的推进，越来越多的装甲板被安装到她的躯干与四肢上。那件白色的外套逐渐被银灰色的装甲所覆盖，她的双臂、胸口、腰侧、膝盖，乃至脚踝，都覆上了一层层精密而坚固的合金护甲。虽然装甲的厚度和重量足以压垮一支军队，但在她那宏伟的天体级身躯之上，那些装甲看起来却不过是她新添的一件漂亮外衣了\n接下来是火炮的安装\n两门巨型轨道炮在巨型机械臂的牵引下缓缓升空。那两门主炮的炮管每一根都足以容纳一艘驱逐舰在其中穿行，炮口的直径甚至超过了帝国最宏伟的议会穹顶，但，在天体级巨大少女眼里，只是两杖戒指\n“唔…”秦雯看着那两杖“戒指”，微微眯起那双粉色的眼眸，语气中带着一丝毫不掩饰的嫌弃，“这东西……是不是有点华而不实啊？”\n我们的总工程师一愣：“秦雯小姐，这是我们帝国最新型的轨道速射炮，威力足以一炮摧毁一整支舰队——”\n“我知道我知道。”秦雯摆了摆手，那动作带起的风压让整座船坞的照明灯都剧烈晃动，她低下头，那双巨大的粉瞳凑近指挥塔，带着几分慵懒的笑意轻声道：“但是啊——指挥官阁下，您觉得我捏碎一颗星球需要用几秒钟呢~？”\n秦雯抬起一只手，纤细修长的手指在星空中缓缓屈伸，瞬间，一颗无辜的小行星就成了少女指间的尘埃“与其装上这么多笨重的火炮，不如让我用这根手指，轻轻弹一下——效果不比您的炮差喔~。”\n总工程师的额头渗出一层冷汗，但依然坚持道：“秦雯小姐，这是帝国舰娘的标准装配流程，请您配合——”\n“好啦好啦，装就装吧~”秦雯叹了口气，语气中带着几分宠溺的无奈，“就当是戴个戒指啦~”
  gts_qinwen.107.desc: "As the work progressed, more and more armor plates were installed onto her torso and limbs. That white coat was gradually covered by silver-gray armor. Her arms, chest, waist, knees, and even her ankles were covered in layer after layer of precise and sturdy alloy plating. Though the armor's thickness and weight were enough to crush an army, on her magnificent celestial-scale body, it looked like nothing more than a pretty new outer garment\\nNext came the installation of the cannons\\nTwo giant railguns slowly rose under the pull of enormous mechanical arms. Each barrel of the two main guns was large enough for a destroyer to pass through, and the diameter of each muzzle even exceeded the Empire's grandest council dome. But in the eyes of the celestial-scale giant girl, they were merely two rings\\n“Mm...” Qin Wen looked at those two “rings,” slightly narrowed her pink eyes, and spoke with undisguised distaste in her tone, “Aren't these things... a little showy and impractical?”\\nOur chief engineer froze. “Miss Qin Wen, these are the Empire's newest rapid-fire railguns. Their power is sufficient to destroy an entire fleet with a single shot——”\\n“I know, I know.” Qin Wen waved her hand. The wind pressure from that motion made the lights throughout the entire dock sway violently. She lowered her head, bringing those huge pink pupils close to the command tower, and said softly with a somewhat languid smile: “But——Your Excellency Commander, how many seconds do you think it takes me to crush a planet~?”\\nQin Wen raised one hand, her slender fingers slowly flexing amid the stars. In an instant, an innocent asteroid became dust between the girl's fingers. “Rather than attaching so many heavy cannons, why not let me use this finger and flick lightly——the result wouldn't be any worse than your guns~.”\\nA layer of cold sweat beaded on the chief engineer's forehead, but he still insisted: “Miss Qin Wen, this is the standard outfitting process for an Imperial shipgirl. Please cooperate——”\\n“Fine, fine, install them then~” Qin Wen sighed, her tone carrying a somewhat indulgent helplessness. “I'll just treat them as rings~”"
