  #  “唔咿～♡”\n一阵细微的颤意从指尖传来。\n海柠完全没有想到，身体的变化竟会带来这样的感觉。\n海柠不知道的是，大小成长了，也更敏感了，这种感觉是那些“飞机场少女”不曾了解的，而与那些丰满的少女不同，胸前从橘子变成西瓜，正常人都会感觉到极其的压迫感，而海柠确没有，此时的她只是想用她那巨大的玉体与乳肉恩泽整个世界呢\n但与想象中的沉重不同，她并没有感到任何压迫感。那份力量反而像云一样轻盈，让她整个人都变得有些飘忽\n仿佛身体里有某种温暖的东西，正在慢慢溢出来。\n随着那细微的触碰，原本挺立的曲线微微一颤\n下一瞬\n温暖的乳白色液流顺势倾泻而出。\n然而海柠如今的身体早已达到万米之巨，那看似柔软的身体，在这个尺度之下却拥有着难以想象的质量，仅是那对巨乳，就有几万亿吨的重量了\n于是，那本应温柔的乳白色液流，在落向大地的瞬间，却化作了席卷天地的洪水\n空气中顿时弥漫起浓郁的奶香\n乳白色的洪流顺着山谷奔涌而下\n江河被填满，湖泊被覆盖，就连远处的大海也逐渐染成了乳白色，山脉在冲击下崩塌，大地被冲刷出新的沟壑\n对于这颗星球来说，这一次“释放”的力量，甚至比海柠之前所有的踩踏与破坏加起来都更加惊人\n巨大的压力甚至让地壳都微微凹陷了一块呢\n从太空望去——\n那颗星球的一半，都已经变成了淡淡的乳白色。\n而这场巨大的变化，对始作俑者来说，却只是一个有些尴尬的小意外\n“呼～”\n少女低头看着脚下已经变得面目全非的大地，脸颊仍然带着红晕。\n“对不起啦，小家伙们～”\n“谁知道一不小心就变成这样了呢……”\n万米高的少女轻轻歪着头，看着那已经被乳白色洪流覆盖的半个星球。\n“不过这样的话……你们应该很久都不缺吃的了吧？”\n她语气轻松地说着。\n仿佛刚刚发生的一切，只不过是一次无伤大雅的玩笑。\n“嗯……好像不小心把星球弄坏了一点呢。”\n她又低声嘟囔了一句。\n然后笑着耸了耸肩。\n“不过没关系啦。”\n“反正……也没人会怪我吧～？”\n\n哦~？小柠~”\n“原来这么小呀~不过，居然懂得释放欲望~有当女神的潜质呢”\n天外，本是千米巨大的海柠竟感受到了无边无际的压迫感，湛蓝的天空外，突然升起了某种嫩白的高墙，那墙的高度无法计量，就算是用上现代的科技也有心无力，更何况是古代呢，但与小人们不同的是，巨大的海柠则是一眼就明白了\n那高墙\n正是两只巨大到无法理解的少女玉足\n本覆盖在半个星球上的乳白，直接被那超巨大袜足完全吸干，而那玉足的主人，此时说是双足夹紧地球...也不夸张吧\n“怎么了~？小柠？不认得我了？”\n“诶？雯...雯雯？你在哪里？”\n“小柠小小的一只~好可爱~向上看喔~”\n海柠下意识地抬起头。\n然后她看见了...\n在那两堵嫩白高墙的尽头，在星球的穹顶之上，一张熟悉的脸正低头看着她\n“雯雯！？”\n海柠的声音在真空中无法传播，但秦雯显然听见了——她甚至微微侧了侧头，像是在分辨一只蚊虫的嗡鸣一样\n淡粉色的双眸眨了两下\n“嗯，是我呀。”\n秦雯的声音依然温柔，但现在的温柔和海柠记忆中的温柔完全不同。记忆里的秦雯说话总是小小声的，像怕惊扰到什么\n而现在这道声音从宇宙穹顶降下，每一声都让星系震颤，每一句都让星辰战栗，虽然同样甜美可爱，只不过，对一千来米的海柠来讲，也恐怖到不可理喻呢
  gts_qinwen.15.desc: "“Mmph~♡”\\nA faint tremor came from her fingertips.\\nHaining had never expected that the changes in her body would bring this kind of sensation.\\nWhat Haining did not know was that as their size had grown, they had become more sensitive too. It was a feeling those “flat-chested girls” would never understand, and unlike those fuller girls, when one’s chest grew from oranges to watermelons, a normal person would feel an extreme sense of pressure. Haining, however, did not. At this moment, she only wanted to bless the entire world with her enormous jade body and soft flesh.\\nBut unlike the heaviness she had imagined, she felt no pressure at all. That force was instead as light as clouds, making her whole body feel a little adrift.\\nIt was as if something warm inside her body was slowly overflowing.\\nWith that slight touch, her originally upright curves trembled faintly.\\nThe next instant,\\na warm, milky-white stream poured out with the motion.\\nHowever, Haining’s body had now already reached a size of ten thousand meters. That seemingly soft body possessed unimaginable mass at this scale. Just that pair of enormous breasts alone weighed several trillion tons.\\nAnd so, the milky-white stream that should have been gentle, the instant it fell toward the earth, turned into a flood sweeping heaven and earth.\\nThe air was instantly filled with a rich milky fragrance.\\nThe milky-white torrent surged down through the valleys.\\nRivers were filled, lakes were covered, and even the distant sea gradually turned milky white. Mountain ranges collapsed under the impact, and new gullies were carved into the earth.\\nFor this planet, the force of this “release” was even more astonishing than all of Haining’s previous trampling and destruction combined.\\nThe immense pressure even made a section of the crust sink slightly.\\nSeen from space—\\nhalf of the planet had already turned a faint milky white.\\nYet to the one responsible for this enormous change, it was only a somewhat embarrassing little accident.\\n“Phew~”\\nThe girl lowered her head and looked at the earth beneath her feet, now changed beyond recognition, her cheeks still flushed.\\n“Sorry, little ones~”\\n“Who would have known it would turn out like this by accident...”\\nThe ten-thousand-meter-tall girl gently tilted her head, looking at the half of the planet already covered by the milky-white flood.\\n“But in that case... you shouldn’t be short on food for a long time, right?”\\nShe said it lightly,\\nas if everything that had just happened was nothing more than a harmless joke.\\n“Mm... I think I accidentally damaged the planet a little.”\\nShe muttered again.\\nThen she smiled and shrugged.\\n“But it’s fine.”\\n“Anyway... no one will blame me, right~?”\\n\\n“Oh~? Xiao Ning~”\\n“So you were this small~ Still, you actually know how to release your desires~ You have the makings of a goddess.”\\nBeyond the sky, Haining, who was already thousands of meters tall, suddenly felt a boundless pressure. Outside the azure sky, some tender-white high walls suddenly rose. The walls’ height could not be measured; even with modern technology it would be hopeless, let alone in ancient times. But unlike the tiny people, the giant Haining understood with a single glance.\\nThose high walls\\nwere two young woman’s jade feet, so enormous they defied comprehension.\\nThe milky white substance originally covering half the planet was completely absorbed by those ultra-massive socked feet, and to say the owner of those jade feet was currently clamping the Earth between both feet... would not be an exaggeration.\\n“What’s wrong~? Xiao Ning? Don’t recognize me?”\\n“Eh? Wen... Wenwen? Where are you?”\\n“Tiny little Xiao Ning~ So cute~ Look up~”\\nHaining instinctively raised her head.\\nAnd then she saw...\\nAt the end of those two tender-white high walls, above the dome of the planet, a familiar face was looking down at her.\\n“Wenwen!?”\\nHaining’s voice could not travel through the vacuum, but Qin Wen clearly heard it—she even tilted her head slightly, as if distinguishing the buzz of a mosquito.\\nHer pale pink eyes blinked twice.\\n“Mm, it’s me.”\\nQin Wen’s voice was still gentle, but this gentleness was completely different from the gentleness in Haining’s memory. In her memory, Qin Wen always spoke softly, as if afraid to disturb something.\\nBut now this voice descended from the vault of the universe, every sound making galaxies tremble, every sentence making stars shudder. Although it was still just as sweet and cute, to Haining, who was only a thousand-some meters tall, it was terrifying beyond reason."
