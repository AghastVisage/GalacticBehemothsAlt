  #  《冬日下，独属于她的超巨大温暖》
  gts_qinwen.8.name: "《In Winter, the Super-Giant Warmth That Belonged Only to Her》"
  #  寒岭，一座藏于山中的小镇，顾名思义，每到冬季便迎来刺骨透心的严寒。那些在南边大都市被人们视为奇迹的“泼水成冰”，在这里不过是稀松平常的景象。\n寒字如此，岭字亦如其名。小镇被群山环抱，交通不便，信号也差——按常理推断，这里本该是人烟稀少、信息闭塞的贫穷之地。\n然而，现实有时与常理背道而驰。\n寒岭，竟是整个宁古塔地区交通最便利、外来人口最多的地方。虽不敢说每天，但每周都有不少来自南方富庶地区的豪商，开着加长车或私人飞机抵达此地。而他们唯一的目的地，便是山脚下的那座小山庄。\n山庄规模不大，说是山庄，其实不过一座四合院的大小。但它风景秀丽，气温宜人，景观更是超脱现实。\n倘若向池塘望去，只见碧波荡漾，莲叶成片。要知道，此时正值隆冬，又是在天寒地冻的宁古塔地区，能让池塘不结冰、植物仍然绿意盎然，近乎天方夜谭。可这座小山庄偏偏做到了。初来乍到的人只能暗自诧异，但与后面的景象相比，这点奇事便只能归为“特殊的保温科技”了。\n顺着人流望向山庄主屋，满目皆是古色古香。这家店，正是一家古董店——只不过，是举世闻名的古董店。\n“老板，今天有没有啥好东西啊？”\n“有的，这位客人。”\n循着交谈声向店内望去，只见一位白发少女坐在前台，看模样不过十八有余。然而，她从容应对着台前数不清的富商，身上看不出半分稚嫩之气；她对文物的熟悉程度，也不像一位少女，倒像是在这一行摸爬滚打多年的老手。\n她手拿一尊精美的时钟，通底为金石所制，又有花鸟点缀，而表盘上又有着美轮美奂的假山，青金石所制的瀑布更是巧夺天工。此物一出，门外令人诧异的诸多景象，便只能沦为背景板了。\n正当那些富商准备争抢之时，少女的一句话，却引得他们悻悻而去。\n“好了，各位来客，天色已晚，小店要打烊了。大家快些回去吧。”\n听到少女的话后，虽有人低声抱怨，却都识趣地离开了。尽管此刻不过下午，却没人敢闹事。即便心有不甘的人，也只是畏惧地瞥一眼面前的少女——那神情不像是敬畏，更像是害怕。
  gts_qinwen.8.desc: "Hanling was a small town hidden in the mountains. As its name suggested, every winter brought bone-piercing, heart-chilling cold. The phenomenon of \"throwing water into the air and watching it freeze,\" regarded as miraculous in the southern metropolises, was nothing unusual here.\\nThe \"cold\" in its name was fitting, and so too was the \"ridge.\" The town was surrounded by mountains, with inconvenient transportation and poor signals. By common sense, this should have been a poor place with few inhabitants and little access to information.\\nYet reality sometimes runs contrary to common sense.\\nHanling was actually the most conveniently connected place in the entire Ningguta region, and the one with the largest outside population. Perhaps not every day, but every week many wealthy merchants from the prosperous southern regions arrived here by limousine or private plane. Their sole destination was the little manor at the foot of the mountain.\\nThe manor was not large. Calling it a manor was generous; in truth it was only about the size of a traditional courtyard house. But its scenery was beautiful, its temperature pleasant, and its sights transcended reality.\\nLooking toward the pond, one saw rippling green waves and broad stretches of lotus leaves. One must remember that this was deep winter, in the bitterly cold Ningguta region. For a pond not to freeze and for plants to remain lush and green was nearly a fantasy. Yet this little manor had done it. Newcomers could only marvel inwardly, but compared with the sights that followed, this small wonder could only be attributed to \"special heat-preservation technology.\"\\nFollowing the flow of people toward the manor's main house, one saw antiquity and elegance everywhere. This shop was an antique shop, except that it was a world-famous antique shop.\\n\"Boss, do you have anything good today?\"\\n\"I do, honored guest.\"\\nFollowing the sound of conversation into the shop, one saw a white-haired young woman sitting at the front counter, looking no more than eighteen or so. Yet she calmly dealt with the countless wealthy merchants before the counter, without the slightest hint of immaturity. Her familiarity with cultural relics did not seem like that of a young woman at all, but rather like that of a veteran who had spent many years in the trade.\\nIn her hand she held an exquisite clock, its whole base made of gold and stone, adorned with flowers and birds, while the dial contained a beautiful artificial mountain. The lapis lazuli waterfall was a masterpiece of craftsmanship. Once this object appeared, the many surprising sights outside the door could only fade into the background.\\nJust as those wealthy merchants were preparing to fight over it, one sentence from the young woman made them leave in disappointment.\\n\"All right, honored guests, the day is late and this humble shop is closing. Please hurry home.\"\\nAfter hearing the young woman's words, although some muttered complaints under their breath, all tactfully left. Even though it was only afternoon, no one dared cause trouble. Even those who were unwilling merely glanced fearfully at the young woman before them. That expression was not reverence so much as fear."
