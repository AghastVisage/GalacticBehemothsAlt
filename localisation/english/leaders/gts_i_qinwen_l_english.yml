  gts_qinwen_megastructure_planets_DESC: "\"Beautiful mountains and waters breed tiny persons.\" Built along the milky-white coastline of the planet's natural \"milk sea,\" this scientific research settlement possesses unimaginable computing power and resources that are unmatched by any other planet."
