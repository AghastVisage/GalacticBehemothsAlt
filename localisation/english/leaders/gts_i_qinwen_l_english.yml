  #  宁古塔
  NAME_gts_qinwen_system: "Ningguta"
  #  宁古塔
  NAME_gts_qinwen_star: "Ningguta"
  #  寒岭
  NAME_gts_qinwen_planet: "Hanling"
  #  极冰之地
  gts_qinwen_anomaly: "Land of Extreme Ice"
  #  这是一颗被冰封的星球，荒无人烟
  gts_qinwen_anomaly_desc: "This is an icebound planet, barren and uninhabited."
  #  
  gts_qinwen.1.name: ""
  #  和我们的构想一样，这是一颗极冰的星球，覆盖星球的冰寒并不能遮蔽住文明的痕迹，拿铲子轻轻一挖，积雪下方的建筑残骸就显露了出来，如果有文明残骸的话就证明覆盖整个星球的大雪是在文明建设后突然降落下来的，往远处看去，一座山庄突兀的屹立于积雪之上，在这片荒无人烟的寂静中显得格外引人注目
  gts_qinwen.1.desc: "Just as we imagined, this is a planet of extreme ice. The cold that covers the planet cannot hide the traces of civilization. A light dig with a shovel reveals architectural ruins beneath the snow. If there are ruins of civilization, it proves that the heavy snow covering the entire planet suddenly fell after that civilization had been built. Looking into the distance, a manor stands abruptly above the accumulated snow, especially eye-catching amid this deserted silence."
  #  前去调查那栋建筑
  gts_qinwen.1.a: "Go investigate that building."
  #  咕咕嘎嘎
  gts_qinwen.1.a_custom: "Gugu gaga"
  #  
  gts_qinwen.1.b: ""
  #  
  gts_qinwen.1.b_custom: ""
  #  霜庭雪榭游增记
  gts_qinwen.2.name: "Additional Notes on a Visit to the Frost Courtyard and Snow Pavilion"
  #  然而，就在他们距离山庄大门还剩不到两百米时，一阵阴影猛然覆盖了整片天空\n那是一片巨大到令人窒息的少女身影，从他们的头顶缓缓掠过。原本湛蓝的天穹瞬间被遮蔽，阳光被彻底吞没，整片冰原陷入了一片昏暗的阴影之中。先遣队的通讯器里瞬间炸开了信号干扰的杂音，所有人的心跳都在那一瞬间停滞\n在那片阴影的轮廓中，通过通讯，我们看见了一双大到难以形容的、粉色眼眸，正隔着云层，带着几分好奇，俯瞰着这片冰封的大地与地面上那如尘埃般的研究员们\n“哎呀——”\n“这颗小星球上居然还有活着的小家伙在到处乱跑呢啊~”那道巨大的身影缓缓下降。冰原上的积雪被那股从天而降的气流卷起，形成一圈圈白气浪向四周扩散\n当那双粉色的眼眸终于从云层中完整地显现出来时，所有人都不由自主地屏住了呼吸\n一位大得能一手攥住整片天空的少女。\n她的面容精致而柔和，白色的短发在冰冷的空气中缓缓飘散，整个人看起来就像是从某本童话书中走出来的文学少女——如果忽略她那如山脉般横亘于天际的庞大身躯的话
  gts_qinwen.2.desc: "However, when they were less than two hundred meters from the manor gate, a shadow suddenly covered the entire sky.\\nIt was the figure of a young woman so enormous it was suffocating, slowly passing over their heads. The originally azure sky was instantly obscured, the sunlight completely swallowed, and the entire ice field fell into a dim shadow. The advance team's communicators instantly erupted with the static of signal interference, and everyone's heartbeat seemed to stop in that instant.\\nWithin the outline of that shadow, through the transmission, we saw a pair of indescribably vast pink eyes, gazing down through the clouds with a hint of curiosity at this icebound land and the researchers on the ground, who were like specks of dust.\\n\"Oh my-\"\\n\"So there are still living little ones running around on this tiny planet~\" The enormous figure slowly descended. The snow on the ice field was swept up by the air current falling from the sky, forming rings of white vapor waves that spread outward.\\nWhen those pink eyes finally emerged fully from the clouds, everyone involuntarily held their breath.\\nA young woman so large she could grasp the entire sky in one hand.\\nHer face was delicate and gentle, and her short white hair drifted slowly in the icy air. She looked like a literary girl who had stepped out of some fairy tale book, if one ignored her colossal body stretching across the horizon like a mountain range."
  #  示意研究员对少女挥手表示友好
  gts_qinwen.2.a: "Signal the researchers to wave to the young woman in friendship."
  #  
  gts_qinwen.2.a_custom: ""
  #  
  gts_qinwen.2.b: ""
  #  
  gts_qinwen.2.b_custom: ""
  #  鸟音山水
  gts_qinwen.3.name: "Birdsong, Mountains, and Waters"
  #  对于眼前的少女来说，你的存在能使她放下书，正眼对淮你，便是对你和帝国的尊重，庆幸的是，她对你保持友好，并没有把你当成某种珍惜的泡酒料\n“那么，客自何方来？又将适何处？今临此地，其意何为乎”
  gts_qinwen.3.desc: "To the young woman before you, the fact that your existence can make her put down her book and properly look at you is already a sign of respect toward you and the empire. Fortunately, she remains friendly toward you and has not treated you as some rare ingredient for medicinal liquor.\\n\"Then, from whence does the guest come? Whither shall the guest go? And for what purpose has the guest come to this place today?\""
  #  “我是帝国的人，来此地堪察，敢问阁下贵姓，同时在如此严寒之地，阁下是怎么生活下来的”
  gts_qinwen.3.a.name: "\"I am from the empire and have come here to survey this place. May I ask your honored name, and how you have survived in such a bitterly cold land?\""
  #  眼前的少女正对着你，脸上绽起一道微笑，像是在赞赏你跨体型的勇气\n“阁下好胆量！临危不乱，乃大丈夫乎！小女子秦雯，自号‘鸟音山水’，一位普通的收藏家，自从上次冰结期开始之后，此地的严寒就开始扩散，我念不下这一柜子的收藏，就留守在此处了，不过关于这里的异变，我也不知道什么内容，大冰期不是爆发，而是逐渐的缓慢的气温的降低，我的一位顾客兼挚友给了我一枚玉佩，应该就是它促使了我在这严寒下还能活下来吧”
  gts_qinwen.3.a.desc: "The young woman before you faces you directly, a smile blooming on her face, as if praising your courage in speaking across such a difference in size.\\n\"Your Excellency has fine courage! Calm in the face of danger, truly a person of character! This humble girl is Qin Wen, styled 'Birdsong and Landscapes,' an ordinary collector. Ever since the last freezing period began, the bitter cold of this place started to spread. I could not bear to abandon this cabinet of collections, so I remained here. As for the abnormal changes here, I know nothing of substance. The Great Ice Age did not erupt suddenly; rather, the temperature gradually and slowly declined. A customer and dear friend of mine gave me a jade pendant. I suppose it is what allowed me to survive in this severe cold.\""
  #  你的故事...
  gts_qinwen.3.b.name: "Your story..."
  #  “故事？我可没有什么轰轰烈烈的故事，自从继承了家父的古董店和这一屋子收藏之后，我就一直在这小山庄中，直到寒岭的雪越下越大，就连夏天都是白雪皑皑，过了几年，甚至寒岭之外都下起了大雪，人自然是都离开了，只有我不惧这严寒，相反，还习得了这变大的法术，有一次，我变得很大很大，和整个星系差不多大，整个星系都变成了一片白色，所有星球都成了冰河绝境，于是，我就把这个星系都命名为宁古塔了”
  gts_qinwen.3.b.desc: "\"A story? I have no grand and stirring tale. Ever since I inherited my father's antique shop and this house full of collections, I have remained in this little manor, until the snow in Hanling fell heavier and heavier, until even summer was blanketed in white. A few years later, heavy snow even began falling beyond Hanling. Naturally, everyone left. Only I did not fear this severe cold. On the contrary, I even learned this art of growing larger. Once, I became very, very large, almost the size of the entire star system, and the whole system turned white. Every planet became an icy wasteland. And so, I named this star system Ningguta.\""
  #  可以同行吗
  gts_qinwen.3.c.name: "May we travel together?"
  #  “求之不得，偶尔出去以文会友，见些世面，无害而大有脾益，只不过，你们的飞船撑不住这万里的严寒，鄙人闲时打造过一艘小船，回去就用这艘吧，鸟音山水，听侯阁下差遣”
  gts_qinwen.3.c.desc: "\"I could ask for nothing better. To go out now and then, make friends through literature, and see something of the world is harmless and greatly beneficial. However, your ships cannot withstand this boundless cold. In my leisure, I once built a small vessel. Let us use that to return. Birdsong and Landscapes awaits Your Excellency's command.\""
  #  先完成对话吧
  gts_qinwen.fail: "Finish the conversation first."
  #  最近过的怎么样
  gts_qinwen.5.a.name: "How have you been recently?"
  #  “谢谢阁下关心，蛮不错的，这里是少有的能让小女子感受到归属感的地方了”
  gts_qinwen.5.a.desc: "\"Thank you for your concern, Your Excellency. Quite well. This is one of the few places where this humble girl can feel a sense of belonging.\""
  #  “想看看你写的书”
  gts_qinwen.5.b.name: "\"I would like to see the book you wrote.\""
  #  “雕虫小技，本不足存。蒙君谬赏，实汗颜无地。若为消遣，幸甚至哉，这是我近期所作，是鄙人与吾友的故事，阁下喜欢就拿去吧”（拿出一个天体级的铁盒）
  gts_qinwen.5.b.desc: "\"A trifling skill, not worth preserving. To receive your undeserved praise leaves me truly ashamed. If it may serve as amusement, I am most fortunate. This is a recent work of mine, the story of myself and my friend. If Your Excellency likes it, please take it.\" (Takes out an astronomical-scale iron box)"
  #  “播放凑企鹅叫声”
  gts_qinwen.5.c.name: "\"Play Minato penguin calls.\""
  #  “诶？这是你们这里的企鹅叫声吗？到是...有一种...让人忍不住学舌的冲动...”
  gts_qinwen.5.c.desc: "\"Eh? Is this what penguins sound like here? It does have... a certain... urge that makes one want to imitate it...\""
  #  和其她的领袖相处的怎么样
  gts_qinwen.5.d.name: "How are you getting along with the other leaders?"
  #  §R并非并非施工中§!
  gts_qinwen.5.d.desc: "§RDefinitely not under construction§!"
  #  没有什么事了
  gts_qinwen.5.e.name: "That is all."
  #  咕咕嘎嘎
  gts_qinwen.6.name: "Gugu gaga"
  #  “诶？这是你们这里的企鹅叫声吗？到是...有一种...让人忍不住学舌的冲动...”
  gts_qinwen.6.desc: "\"Eh? Is this what penguins sound like here? It does have... a certain... urge that makes one want to imitate it...\""
