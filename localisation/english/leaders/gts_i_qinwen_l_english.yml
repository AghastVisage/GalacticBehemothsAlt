  #  造物初尝试
  gts_qinwen.120.name: "First Attempt at Creation"
  #  距离秦雯上次捏碎宁古塔星系中那颗行星的事情，已经过去几个月有余。而我们上次拿命拍摄的、记录了秦雯如何将那颗星球用胸部彻底毁灭的录像，想必足够让这位平日里优雅好面的文学少女，含羞带怯好一阵子了吧\n通讯接通的那一刻，屏幕上浮现出那张熟悉的面孔\n“啊哈哈……指挥官阁下，有什么事吗？”\n那白发的少女挠着头，眼神躲闪，嘴角挂着一抹尴尬而不失礼貌的笑容\n她一定是知道我们为何找上她\n然而，我们都心知肚明：秦雯的酒量好到恐怖。仅凭那个量级的啤酒，定不能让她酩酊大醉。所以，她那天所展现出的那副被酒精浸泡过的迷离，究竟是装出来的，还是她真的、发自内心地、享受那颗星球在她指尖碎裂的感觉，还有待查证\n我们将那份高清录像投屏到通讯界面中。画面一开始，便是秦雯那两团巨大的乳肉，双乳将一切压至平整，然后碎裂\n秦雯的脸“唰”地一下红了。她那双红色的眼眸睁得圆溜溜的\n“这、这个…这个是…” 她支支吾吾地，声音越来越小，“这个.那个…我当时喝多了嘛…”\n她的耳尖红得像要滴血，整个人坐在那里，手足无措地低下头\n“你们…你们怎么还拍下来了啊……好丢人啊…”\n“鸟音山水小姐，这一份录像，我们已经备份，如果你下次在管辖星系内再做出类似的酒后失态，那这份录像，可能会作为帝国安全档案，在全星系范围内进行公开展示哦”\n她猛地抬起头，那双粉瞳中的羞怯瞬间被一丝惊慌取代\n“诶？！公、公开？！不行不行不行！！！那、那多丢人啊！！！我堂堂一个作家，怎么能让大家看到我…我…我那个样子…”\n少女又急又羞，连说话都开始结巴起来，整个人在通讯屏幕前手忙脚乱地挥手\n“当然，我们也不是不讲道理的人。如果你愿意配合我们做一些事情...，并且保证不再出现...嗯——‘主动破坏已改造宜居行星’的情况，这份档案可以永久封存”\n“那…那你要我做什么事啊？先说好，太累人的我可不做哦”\n“放心，不是什么难事——阁下的乳汁貌似可以作为新星球的基底...”\n秦雯愣了一下，随即整张脸再度爆红，她抓起手边的书本猛地砸向通讯器的摄像头方向，气鼓鼓地喊道\n“你们这群坏蛋！”\n“哎呀~那阁下愿意吗”\n“好..好吧”\n选项：拿捏！\n那茫茫星海里，秦雯恢复了天体级的大小，双手揉捏着她傲人的双乳，而我们时不时对她采用火炮的攻击，加剧了她的快感，就这样经过一段时间后，我们从她的脸颊上看出，这个星系中有一颗新的行星要诞生了\n她轻轻捏起挺立的双峰，纤手的挤压伴随着我们火炮的攻击，不一会，她胸前就漫出了乳白色的几滴，那几滴乳液对秦雯来说微不足道，但对我们来说，已经算是星球的太小，仅需加以时日，使可弥补那颗星球的损失，而她彻底泛红的脸颊上也浮现出一丝“创造世界”的快感...
  gts_qinwen.120.desc: "Several months had passed since Qin Wen last crushed that planet in the Ningguta system. And the footage we risked our lives to record last time, documenting how Qin Wen completely destroyed that planet with her chest, should be enough to make this literary girl, usually elegant and concerned with appearances, feel shy and embarrassed for quite a while\\nThe moment the communication connected, that familiar face appeared on the screen\\n“Ahaha... Your Excellency Commander, is something the matter?”\\nThe white-haired girl scratched her head, her eyes dodging away, the corners of her mouth carrying an awkward yet polite smile\\nShe definitely knew why we had come to her\\nHowever, we all knew perfectly well: Qin Wen's alcohol tolerance was terrifyingly good. Beer of that scale alone certainly could not get her dead drunk. Therefore, whether the alcohol-soaked haze she displayed that day was an act, or whether she truly, sincerely enjoyed the feeling of that planet shattering at her fingertips, remained to be verified\\nWe projected that high-definition footage onto the communication interface. At the very start of the video were Qin Wen's two huge breasts, pressing everything flat, then crushing it apart\\nQin Wen's face went red with a “whoosh.” Her red eyes opened wide and round\\n“T-this... this is...” she stammered, her voice growing quieter and quieter. “Well... you know... I drank too much back then...”\\nThe tips of her ears were red enough to drip blood, and she sat there, flustered and at a loss, lowering her head\\n“You... why did you even record that... It's so embarrassing...”\\n“Miss Birdsong Landscape, we have already backed up this recording. If you once again commit a similar drunken lapse within a governed system, this recording may be publicly displayed across the entire galaxy as an Imperial security file”\\nShe suddenly raised her head, and the shyness in those pink pupils was instantly replaced by a trace of panic\\n“Huh?! P-public?! No no no no!!! That-that's too embarrassing!!! I'm a proper writer, how can I let everyone see me... me... looking like that...”\\nThe girl was both anxious and embarrassed, even starting to stutter as she spoke, waving her hands frantically in front of the communication screen\\n“Of course, we are not unreasonable people. If you are willing to cooperate with us on a few things... and guarantee that there will be no more... mm——‘active destruction of terraformed habitable planets,’ this file can be sealed permanently”\\n“Th-then... what do you want me to do? Let me say this first: I won't do anything too tiring”\\n“Relax, it isn't anything difficult——Your Excellency's milk seems capable of serving as the foundation for a new planet...”\\nQin Wen froze for a moment, then her entire face flushed bright red again. She grabbed the book beside her and hurled it fiercely toward the communicator's camera, shouting angrily\\n“You bunch of villains!”\\n“Oh my~ then is Your Excellency willing?”\\n“O... okay”\\nOption: Got her!\\nIn that boundless sea of stars, Qin Wen returned to celestial-scale size, kneading her proud breasts with both hands, while we occasionally attacked her with cannon fire, intensifying her pleasure. After some time passed like this, we could see from her cheeks that a new planet was about to be born in this system\\nShe gently squeezed her upright twin peaks, her slender hands pressing as our cannon attacks continued. Before long, several milky-white drops welled from her chest. Those few drops of milk were insignificant to Qin Wen, but to us, they were already roughly the size of planets. Given time, they could compensate for the loss of that planet, and on her thoroughly flushed cheeks there also appeared a hint of the pleasure of “creating a world”..."
