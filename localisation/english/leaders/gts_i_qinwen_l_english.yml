  #  从探测器传回的报告来看，冰窟内部比想像中更加壮观\n\n入口处是一道被寒冰包裹的天然拱门，冰层厚重如璃，在探照灯的照射下折射出冷冽的蓝白色光芒。沿着一条倾斜的冰道向下深入约几十米，空间豁然开朗，那是一处被冰封的古代战场遗迹。\n而遗迹中心，有一所类似于古墓的建筑
  gts_qinwen.102.desc: "Judging from the report transmitted back by the probe, the interior of the ice cavern is even more magnificent than imagined.\\n\\nAt the entrance is a natural arch wrapped in ice. The ice layer is thick as glass, refracting a cold blue-white light under the searchlights. Following a slanted ice passage downward for several dozen meters, the space suddenly opens up. It is the remains of an ancient battlefield sealed in ice.\\nAnd at the center of the ruins stands a structure resembling an ancient tomb."
