  #  “啊~应该是没人了吧~”\n她慵懒地打了个酒嗝，那带着浓郁麦芽香气的气息拂过星球表面，将原本漂浮在低空的一层云吹得干干净净，露出下方更加清晰的城市废墟\n“唔…这个姿势感觉还挺不错的~”\n秦雯眯着那双半醉的紫瞳，轻轻撑起身子，就让自己那对惊人柔软的胸膛，缓缓地膨胀，成长，使原来贫瘠的胸部变得傲人、又带着几分戏谑的力道，压在了原本是星球最繁华的一片大陆上\n那双巨大的、饱满的乳肉，在一片城市群上缓缓下压。动作优雅，令人气血上涌，甚至带着一种少女般漫不经心的轻巧——然而当她那柔软的胸腹触碰到地表时，数百平方公里的钢铁丛林使无声无息地陷入、碎裂、化作齑粉，接着被那层白皙的皮肤和衣料彻底掩埋\n她低头看了一眼自己身下那片被压扁的“小方块”，流露出一种支配般的纯粹愉悦~\n“这一片全被压平了呢~”\n而她丝毫没有要起身的意思，反而用那双撑着地面的手臂微微移动了一下重心，让那对柔软如绵云般的胸脯在废墟上轻轻揉了揉\n原本还有几座残留的摩天大楼尖顶，在那阵“轻柔的揉搓”中彻底被碾进了地壳里。而在她的乳晕与地表贴合的区域边缘，由于巨大的重量和挤压，地面像波浪般向四周隆起，形成了一圈足以延伸到地平线外的环形山脉\n“好像~那边还没被姐姐恩泽过呀~”\n她用那双撑着地面的手臂微微用力，将巨大的身子在星球表面挪动了几十公里——那动作对她只是慵懒地在翻了个身，但对这颗星球而言，却是大陆板块间一场毁灭性的剧变了。\n柔软的双乳在地面上碾过，将原本便已破碎的城市废墟彻底碾成了一道光滑的、略带弧度的凹痕，余波将地壳深处的地下水挤压出来，淹没一切\n她又翻过身来，以一个半躺半坐的姿势，将自己那对巨大的胸部再次悬停在那片沿海平原上方，然后，带着一种极其天真的，玩闹般的轻快揉捏着巨大的乳首...\n“嘿咻~”\n她发出一个带着醉意的、软绵绵的语气词，而她胸前那两颗挺立的乳首也沂出了几滴乳汁\n这次她仅仅是借着酒精带来的松弛感，将身体的重量自然而然地沉降下去。然而那足以承载她庞大身躯的柔韧胸部，却以一种温柔得近乎残忍的方式，将整片沿海平原上的高楼大厦全都淹没\n那些曾经精密的高塔和工业设施，在她胸口的压迫下，将一切轻轻抹平，只留下了一层浅浅的、带着她体温和衣料纹理的白色深坑\n她似乎对这个结果十分满意，甚至轻轻扭了扭腰肢，用那已经被压扁得几乎可以反射阳光的大地作为支撑，调整了一个更舒服的姿势——那双巨大的运动鞋在空中晃荡着，又被她晃下来，将远处几座尚未倒塌的孤峰碾得粉碎，碎屑洒落在她身下那片早已面目全非的大地上...\n“唉…果然不能喝太多呢~，一不小心就会做出点…嗯~…稍微~有点过分的事情呢~”\n“大家好不容易建的东西都被姐姐我压坏了...那就给这颗小星球…一个温柔的~巨大的抱抱当补偿吧~”\n\n\n话音刚落——她的身形便再次开始膨胀。\n那是如此优雅而无声的成长，原来支配大陆的玉体这一次遮蔽着星球
  gts_qinwen.113.desc: "“Ah~ there shouldn't be anyone left, right~”\\nShe lazily let out a drunken burp, and that breath rich with malt fragrance swept across the planet's surface, blowing away the layer of clouds originally floating at low altitude and revealing the city ruins below in even clearer detail\\n“Mm... this posture actually feels pretty nice~”\\nQin Wen narrowed those half-drunk violet eyes and gently propped herself up, letting her astonishingly soft chest slowly swell and grow, turning her once modest chest into an impressive one, and with a somewhat teasing force, pressed it down onto what had originally been the planet's most prosperous continent\\nThat pair of enormous, full breasts slowly pressed down over a cluster of cities. The movement was elegant, enough to quicken the blood, and even carried a girlish, casual lightness——yet when her soft chest and abdomen touched the surface, hundreds of square kilometers of steel jungle silently sank, shattered, and turned to dust, then were completely buried beneath that layer of fair skin and clothing\\nShe lowered her head and glanced at the flattened “little blocks” beneath her, revealing a pure, dominant pleasure~\\n“This whole area has been flattened~”\\nAnd she showed no intention of getting up. Instead, she used the arms braced against the ground to slightly shift her center of gravity, letting that pair of breasts, soft as cotton clouds, gently rub over the ruins\\nThe few remaining spires of skyscrapers were completely ground into the crust amid that “gentle rubbing.” Around the edge where her areolae met the surface, the ground rose outward like waves due to the immense weight and pressure, forming a ring of mountains that extended beyond the horizon\\n“Looks like~ that side hasn't received big sister's grace yet~”\\nShe used the arms supporting her on the ground to apply a little force, moving her huge body dozens of kilometers across the planet's surface——to her, that motion was merely a lazy roll over, but to this planet, it was a catastrophic upheaval between continental plates.\\nHer soft breasts rolled across the ground, grinding the already shattered city ruins into a smooth, slightly curved indentation. The aftershock squeezed groundwater from deep within the crust, drowning everything\\nShe rolled over again, half reclining and half sitting, suspending that pair of huge breasts above the coastal plain once more. Then, with an extremely innocent, playful lightness, she fondled her enormous nipples...\\n“Heave-ho~”\\nShe let out a soft, drunken little sound, and those two erect nipples on her chest also seeped a few drops of milk\\nThis time, she was merely using the relaxation brought by alcohol to let the weight of her body naturally settle downward. Yet the supple breasts capable of supporting her immense body submerged every skyscraper and building on the entire coastal plain in a way so gentle it was almost cruel\\nThose once-precise towers and industrial facilities were gently erased under the pressure of her chest, leaving only a shallow white crater bearing her body warmth and the texture of her clothing\\nShe seemed quite satisfied with this result, even gently twisting her waist and using the ground, already flattened enough to nearly reflect sunlight, as support to adjust into a more comfortable posture——those huge sneakers swung in the air, then were swung down by her, crushing several distant lonely peaks that had not yet collapsed into powder. The fragments scattered over the already unrecognizable land beneath her...\\n“Sigh... I really can't drink too much~ If I'm not careful, I'll do... mm~... slightly~ excessive things~”\\n“Everyone worked so hard to build all this, and big sister crushed it... Then I'll give this little planet... a gentle~ huge hug as compensation~”\\n\\n\\nThe moment her words fell——her figure began to expand once again.\\nIt was such elegant and silent growth. The jade body that had once dominated continents now obscured the planet"
