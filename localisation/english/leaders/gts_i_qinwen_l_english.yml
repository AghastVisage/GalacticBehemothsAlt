  #  以钢之躯，护千万家之安宁
  gts_qinwen.105.name: "With a Body of Steel, Protect the Peace of Countless Homes"
  #  通讯请求接通的那一刻，屏幕上出现的是一片浩瀚的星空，在那片星光之间，一道庞大到令人窒息的轮廓正缓缓舒展开来\n秦雯她已经恢复了那副天体级的傲人巨躯\n她的一根手指正轻轻捏着一颗荒芜星球的两极，指尖微微陷入地壳之中，那颗星球在她指间发出不堪重负的呻吟，表面开始崩裂出蛛网般的纹路\n少女歪过头，那张占据了小半个通讯屏幕的脸庞上，浮现出一抹熟悉的、带着几分戏谑的笑容。那双粉色的眼眸微微眯起，语气轻飘飘的，仿佛刚才那段庄重的感悟从未发生过一般\n“啊哈~指挥官阁下，别那么紧张嘛~这颗星球反正也是荒芜的，我捏着玩一玩又不会怎么样啦~”\n她说着，又轻轻捏了捏那星球的两极，地壳发出一阵清脆的碎裂声\n“刚才说的那句话，我可是认真的哦~‘这一次，我会保护所有人’”\n她顿了顿，指尖轻轻一旋，那颗星球在她指间缓慢转动\n“所以——指挥官阁下，我想成为你们的舰娘”\n“怎么样？收留一位爱喝酒、爱看书、偶尔喜欢捏碎一两颗星球来解闷的‘舰娘’……不算太亏吧~？”\n她的指尖微微一用力——那颗荒芜星球终于在她指间彻底碎裂，化作一片尘埃，而她那巨大的、笼罩星辰的身影，正等待着我们的答复\n娘对帝国来说是十足珍贵的资源，我们费劲巴力制造的各种舰队，在这天体级少女的玉指之下，也撑不过一秒，而秦雯所拥有的力量，如果为我们所用，那对我们来说将是如虎添翼，毕竟，她只需要吹几口气，踩下几脚，就能对整个星糸造成重创，更何况，她还拥有巨大化的能力
  gts_qinwen.105.desc: "The moment the communication request connected, a vast sea of stars appeared on the screen. Amid that starlight, a silhouette so enormous it stole one's breath was slowly unfolding\\nQin Wen had already returned to that proud, celestial-scale gigantic body\\nOne of her fingers was gently pinching the poles of a barren planet, her fingertip sinking slightly into the crust. The planet groaned under the strain between her fingers, and spiderweb-like cracks began to split across its surface\\nThe girl tilted her head. On the face that took up nearly half the communication screen appeared a familiar smile, carrying a hint of teasing. Her pink eyes narrowed slightly, and her tone was airy, as if that solemn realization from just now had never happened at all\\n“Ahaha~ Your Excellency Commander, don't be so nervous~ This planet is barren anyway. Nothing bad will happen if I squeeze it for fun a little~”\\nAs she spoke, she gently pinched the planet's poles again, and the crust rang out with a crisp cracking sound\\n“What I said just now, I really meant it~ ‘This time, I will protect everyone’”\\nShe paused. With a light twist of her fingertip, the planet slowly rotated between her fingers\\n“So——Your Excellency Commander, I want to become one of your shipgirls”\\n“How about it? Taking in a ‘shipgirl’ who loves drinking, loves reading, and occasionally likes crushing one or two planets to relieve boredom... isn't too bad a deal, right~?”\\nHer fingertip exerted just a little force——and that barren planet finally shattered completely between her fingers, turning into a cloud of dust, while her vast figure, shrouding the stars, waited for our reply\\nShipgirls are an utterly precious resource to the Empire. The various fleets we labored so hard to build would not last even a second beneath this celestial-scale girl's jade-like fingers. If Qin Wen's power could be put to use by us, it would be an enormous boon. After all, she only needs to blow a few breaths and step a few times to inflict heavy damage on an entire galaxy, not to mention that she also possesses the ability to grow gigantic"
