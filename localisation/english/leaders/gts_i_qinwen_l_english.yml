  #  在我们不辞辛劳的营建后，对天体级文学少女的改造终于成攻，而她，现在正在母星前，接受人民的检阅\n她轻轻活动了一下那两枚“戒指”——那两门足以摧毁整支舰队的巨型轨道炮在她的指间微微转动，炮门正对着母星，引起了一阵恐慌\n她听到那些从地面传来的、穿过大气层、微弱却热烈的呼唤声\n“嗯…被这么多人看着，感觉有点害羞~好像吓到小家伙们了”\n她说着，却并没有躲避那些目光，反而微微侧过头，将自己的脸庞正对着母星的方向。那张巨大的、精致的面容庞在星光与星港灯光的映照下泛着光芒，如同神明一般\n她缓缓抬起纤手，指尖轻触唇边，做了一个飞吻的动作，而她没注意的是，有几滴飞沫砸向了星球\n“嗨~小家伙们~”\n她的声音透过通讯器，被转播到母星各地的公共频道中。那声音轻柔而带着一丝俏皮，像是一位邻家姐姐在窗台边朝着楼下的孩子们招手\n地面上，爆发出一阵更加热烈的欢呼声，少女的几滴飞沫化作了最大的湖泊，让干旱地区几十年不愁水\n她甚至低下头，将那张巨大的脸庞稍微压低了一些，让那些地面上的人们能够更清晰地看到她的面容\n“好啦好啦，别一直盯着人家看啦~”她带着几分故作娇嗔的语气轻声道，“不过嘛……如果你们愿意的话，以后每次我执行完任务回来，都可以在星港这边跟大家打个招呼呀~”\n秦雯开朗的笑容传入了每一个人的心尖，有这样温柔且强大的舰娘领袖，帝国定会如虎添翼
  gts_qinwen.108.desc: "After our tireless construction, the modification of the celestial-scale literary girl was finally successful, and now she was before the homeworld, receiving the people's review\\nShe gently moved those two “rings”——the two giant railguns capable of destroying an entire fleet rotated slightly between her fingers, their muzzles pointing straight at the homeworld and causing a wave of panic\\nShe heard the faint yet passionate calls rising from the ground, passing through the atmosphere\\n“Mm... being watched by so many people feels a little embarrassing~ Looks like I scared the little ones”\\nAs she spoke, she did not avoid those gazes. Instead, she slightly turned her head, facing the homeworld with her own face. That huge, delicate face glowed under the starlight and starport lights, like a deity\\nShe slowly raised her slender hand, touched her fingertip to her lips, and made a blowing-kiss gesture. What she failed to notice was that a few droplets of spray fell toward the planet\\n“Hi~ little ones~”\\nHer voice passed through the communicator and was broadcast to public channels all across the homeworld. That voice was soft and carried a trace of playfulness, like a big sister next door waving from a windowsill to the children below\\nOn the ground, an even warmer cheer erupted. The girl's few droplets of spray became the largest lakes, leaving arid regions free from water worries for decades\\nShe even lowered her head, bringing that huge face slightly lower so that the people on the ground could see her features more clearly\\n“Alright, alright, don't keep staring at me~” she said softly in a somewhat deliberately coquettish tone. “But... if you like, every time I return from a mission in the future, I can greet everyone here at the starport~”\\nQin Wen's cheerful smile entered every person's heart. With such a gentle and powerful shipgirl leader, the Empire would surely be strengthened"
