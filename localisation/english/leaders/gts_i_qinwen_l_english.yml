  #  装甲铺设
  gts_qinwen.106.name: "Armor Plating"
  #  帝国最顶尖的工程团队已经在轨道上等待了整整半个小时。当秦雯那庞大的身影从星空中缓缓降临时，所有工作人员都不由自主地屏住了呼吸\n尽管他们已经看过无数次她的影像，但亲眼目睹一位天体级的少女躯体横亘在母星上方时，那种压迫感依然是任何言语都无法传达的。\n她悬浮在船坞中央，双臂微微张开，在配合工作人员进行测量。白暂的玉腿自然下垂，那双巨大的粉的色运动鞋几乎要触碰到母星，而如果真的让她触碰到的话，那对整个帝国来说都是一次灭顶之灾\n总工程师站在指挥塔上，仰头望着那道几乎遮蔽了半个星港穹顶的身影\n厚重的合金装甲板在巨型起重机的牵引下缓缓升空。那些装甲板每一块都足有半座城市的大小，厚度足以抵御旗舰级的主炮轰击。然而当它们被吊装到秦雯身前时，在她的身躯映衬下，那些装甲板却微不足道了\n秦雯微微侧过头，看了一眼那块即将被固定在她肩胛骨上的装甲板，眨了眨眼，带着一丝好奇的语气轻声道\n“唔…这个穿上去会不会有点重？”\n“请放心，秦雯小姐，”总工程师的声音从通讯器中传来，带着几分紧张的恭敬，“装甲经过轻量化处理，不会对您的行动造成负担。”\n“那就好~”
  gts_qinwen.106.desc: "The Empire's finest engineering team had already been waiting in orbit for a full half hour. When Qin Wen's immense figure slowly descended from the starry sky, every worker involuntarily held their breath\\nAlthough they had seen footage of her countless times, witnessing a celestial-scale girl's body stretch across the sky above the homeworld in person carried a pressure that no words could convey.\\nShe hovered in the center of the dock, arms slightly spread as she cooperated with the staff's measurements. Her fair, jade-like legs hung naturally downward, and her enormous pink sneakers nearly touched the homeworld. If she truly touched it, it would be a catastrophe for the entire Empire\\nThe chief engineer stood on the command tower, looking up at the figure that almost blotted out half the starport dome\\nHeavy alloy armor plates slowly rose under the pull of giant cranes. Each of those armor plates was the size of half a city, with thickness enough to withstand the bombardment of a flagship-class main cannon. Yet when they were hoisted before Qin Wen, set against her body, those armor plates seemed insignificant\\nQin Wen turned her head slightly, glanced at the armor plate about to be fixed to her shoulder blade, blinked, and softly asked with a hint of curiosity\\n“Mm... will this be a little heavy to wear?”\\n“Please rest assured, Miss Qin Wen,” the chief engineer's voice came through the communicator, carrying a somewhat nervous respect. “The armor has undergone lightweight processing and will not burden your movements.”\\n“That's good~”"
