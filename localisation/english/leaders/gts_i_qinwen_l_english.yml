  #  海柠被两根手指捏着，悬在半空。她低头看了一眼——秦雯的手指白皙纤细，指甲修剪得整齐干净，指尖上泛映着淡淡的粉色。每一道指纹都是一道峡谷，甚至，还夹带着几颗星球残渣\n秦雯看着她，像看着什么有趣的小东西。\n小柠好可爱。”\n海柠愣住了。\n“平时那么温柔，那么小心翼翼的，原来心里藏着这种东西呀。”秦雯笑着，笑容里带着宠溺，“释放欲望什么的……有当女神的潜质呢。”\n“雯雯…坏...突然变的这么大\n声音小得像蚊子哼哼。\n秦雯愣了一下，随后，便捂着嘴唇，噗嗤一下，笑了出来\n她笑得眉眼弯弯，笑得那两只巨大的玉足都轻轻晃了晃——那个动作，让她足掌间的地球都微微崩裂，若不是海柠被她捏了起来，要不然，海柠也会被碾成渣吧\n“我本来就很大呀。”秦雯笑着说，语气里带着点得意，“只是小柠一直没发现而已。”\n“刚才，自己在宇宙外面，找呀找，找呀找，发现，原来你在这颗小星球里，然后自己就变小了啦~”\n“你...为什么会变大...”\n“你说的，这是梦呀，等梦过去了再说吧”\n“那现在～”\n她轻轻笑着，声音里满是宠溺和玩味\n“轮到我玩啦~”\n说罢，秦雯把手心上的小海柠拖到了唇边，巨大的双唇在海柠眼里也与星体无异，止不过，在海柠眼里却无半点压迫感，更多的是温暖与悸动了\n“小柠~可爱呢...”\n秦雯愣了一下。\n随后，她捂着嘴唇，“噗嗤”一下笑了出来。\n那笑声轻柔得像风铃摇曳，却让整片宇宙都跟着轻轻颤动。她笑得眉眼弯弯，笑得那两只巨大的玉足都微微晃了晃——那个动作，让她足掌间的地球都轻轻滚动了一下，地表崩裂出几道细纹，岩浆从裂缝中渗出，又很快被宇宙的低温凝固。\n若是海柠没有被捏在掌心，恐怕也会像那些城市一样，被碾成细碎的尘埃吧。\n但此刻的她只是被温柔地托着，悬在那双淡粉色眸子前，小小的，红着脸\n\n她把海柠又举近了些，近到鼻尖几乎要碰在一起。那双淡粉色的眸子弯成两轮新月，倒映着海柠手足无措的样子。\n“刚才呀，自己在宇宙外面，找呀找，找呀找——”秦雯拖长了尾音，像在讲睡前故事，“发现原来你在这颗小星球里，然后就变小了，下来找你啦。”\n“变、变小...？”\n海柠愣住了。\n她低头看了看秦雯捏着自己的手指——那根手指比银河还粗，指纹比峡谷还深，指缝间还夹着几颗星球的残渣。\n“这叫变小？吗”\n秦雯似乎看出了她的疑惑，轻轻笑了一声。\n“对你来说还是很大，对吧~？”她歪了歪头，这个动作让整片星空都跟着倾斜，“可是对我来说，已经很小很小啦~为了不让小柠害怕，我可是很努力才缩成这么大的呢~”\n她说得轻描淡写，语气里却带着点撒娇的意味，像是在求表扬。\n海柠张了张嘴，想说什么，却什么都说不出来。\n“你……为什么会变大……”\n她终于挤出一句。\n秦雯眨了眨眼。\n那双淡粉色的眸子里闪过一丝狡黠的光\n\n“等梦过去了，再告诉你吧。”秦雯把她托到面前，用鼻尖轻轻蹭了蹭她——那个动作像小猫蹭蹭一样温柔，但对于海柠来说，却像是整座山峦压下来又抬起，只不过，只有温柔罢了，温热的气息拂过全身，痒痒的，暖暖的。\n“那现在——”\n秦雯拖长了尾音，眸子里盛满了笑意和宠溺。\n“轮到我玩啦。”\n说罢，她把掌心的小海柠轻轻托到唇边。\n如星球般巨大的双唇缓缓靠近。\n在海柠眼里，那唇与星体无异——柔软、温润、泛着淡淡的粉红色，每一次呼吸都带起温热的潮汐，轻轻拂过她的身体\n但奇怪的是。\n明明那么巨大，明明那么压迫，海柠却感受不到任何恐惧\n只有独属于“依靠”的温暖~\n只有女女羞涩的悸动~\n只有心跳加速时涌上脸颊的滚烫~
  gts_qinwen.16.desc: "Haining was pinched between two fingers, suspended in midair. She lowered her head and glanced down—Qin Wen’s fingers were fair and slender, her nails neatly and cleanly trimmed, a faint pink sheen reflecting from her fingertips. Every fingerprint was a canyon, and there were even a few scraps of planets caught between them.\\nQin Wen looked at her as if looking at some interesting little thing.\\n“Xiao Ning is so cute.”\\nHaining froze.\\n“You’re usually so gentle and so careful. So it turns out you were hiding this kind of thing in your heart.” Qin Wen smiled, her expression carrying affection. “Releasing your desires and all... you have the makings of a goddess.”\\n“Wenwen... bad... suddenly getting this big...”\\nHer voice was as tiny as a mosquito’s hum.\\nQin Wen froze for a moment, then covered her lips and burst into a little laugh.\\nShe laughed until her eyes curved, laughed until those two enormous jade feet swayed lightly—the motion made the Earth between the soles of her feet crack slightly. If Haining had not been pinched up by her, she would probably have been crushed into dregs too.\\n“I was always very big.” Qin Wen said with a smile, a little pride in her tone. “Xiao Ning just never noticed.”\\n“Just now, I was outside the universe, searching and searching, searching and searching, and found that you were in this little planet. Then I made myself smaller~”\\n“You... why did you get bigger...”\\n“You said it yourself. This is a dream. I’ll tell you after the dream is over.”\\n“And now~”\\nShe laughed softly, her voice full of affection and playfulness.\\n“It’s my turn to play~”\\nWith that, Qin Wen brought the tiny Haining on her palm to her lips. In Haining’s eyes, those enormous lips were no different from celestial bodies. And yet, in Haining’s eyes, there was not the slightest sense of pressure, only more warmth and fluttering excitement.\\n“Xiao Ning~ So cute...”\\nQin Wen froze for a moment.\\nThen she covered her lips and laughed with a “pfft.”\\nThat laughter was as soft as wind chimes swaying, yet it made the entire universe tremble gently with it. She laughed until her eyes curved, laughed until those two enormous jade feet swayed slightly—the motion made the Earth between her soles roll lightly, several fine cracks splitting across its surface. Magma seeped from the fissures, then was quickly solidified by the cold of space.\\nIf Haining had not been pinched in her palm, perhaps she would have been crushed into fine dust like those cities.\\nBut at this moment, she was only being held gently, suspended before those pale pink eyes, tiny and blushing.\\n\\nShe lifted Haining a little closer, so close their noses almost touched. Those pale pink eyes curved into two crescent moons, reflecting Haining’s flustered state.\\n“Just now, I was outside the universe, searching and searching, searching and searching—” Qin Wen drew out the ending, like telling a bedtime story. “Then I found out you were in this little planet, so I made myself smaller and came down to find you.”\\n“Made... yourself smaller...?”\\nHaining froze.\\nShe lowered her head and looked at the fingers Qin Wen was pinching her with—that finger was thicker than the Milky Way, its fingerprints deeper than canyons, with the remains of a few planets still caught between the fingers.\\n“You call this smaller?”\\nQin Wen seemed to see her confusion and laughed softly.\\n“To you, I’m still very big, right~?” She tilted her head, and that motion made the whole starry sky tilt with her. “But to me, this is already very, very small~ To keep Xiao Ning from being scared, I worked really hard to shrink down this much~”\\nShe said it lightly, but there was a hint of acting spoiled in her tone, as if seeking praise.\\nHaining opened her mouth, wanting to say something, but no words came out.\\n“You... why did you get bigger...”\\nShe finally squeezed out one sentence.\\nQin Wen blinked.\\nA cunning light flashed through those pale pink eyes.\\n\\n“I’ll tell you after the dream is over.” Qin Wen held her in front of her and gently rubbed her with the tip of her nose—that motion was as gentle as a little cat nuzzling, but to Haining, it was like an entire mountain range pressing down and then lifting away, only with nothing but tenderness. Warm breath brushed over her whole body, ticklish and warm.\\n“And now—”\\nQin Wen drew out the ending, her eyes filled with laughter and affection.\\n“It’s my turn to play.”\\nWith that, she gently carried the tiny Haining in her palm to her lips.\\nLips as enormous as planets slowly approached.\\nIn Haining’s eyes, those lips were no different from celestial bodies—soft, warm, faintly pink, each breath raising a warm tide that gently brushed over her body.\\nBut strangely,\\nalthough they were so huge, although the pressure should have been so immense, Haining felt no fear at all.\\nOnly the warmth of having someone to rely on~\\nOnly the shy fluttering between girls~\\nOnly the heat rushing to her cheeks as her heartbeat quickened~"
