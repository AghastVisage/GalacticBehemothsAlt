  #  在全境冰封的宁古塔星系中，仍存有几颗宜居的行星。 在我们不辞辛劳的建设下，数颗星球被相继改造，安置了大量人口，极大缓解了其它星系的人口危机。而秦雯——那位巨大的文学少女，此刻正真真切切地坐在这颗星球的商场顶层，悠然地享受着午后的惬意\n平日里天体级大小的秦雯如今却只有几十米的身高\n“酒，乃文明之源啊。” 她举起那只宛如山丘般的巨大酒杯，琥珀色的液体在耀眼的阳光中泛着金灿灿的光泽“没有酒，又哪来如此美妙的文明”\n她那微醺粉眸的微微眯起，带着三分陶醉与慵懒，垂眸望向脚下的街道。那双粉白交织的巨大运动鞋，恰好悬停在商场底层的广场上方，双腿随着呼吸晃动，而厚实洁净的鞋底——对于底下那些如同蝼蚁般渺小的文明子民而言，就是一整片遮天蔽日的穹顶\n秦雯忽然有些玩心大起\n她嘴角勾起一抹淡笑，轻轻晃了晃腿，巨大的鞋底在低空中掠过，气流将下方广场上的灰尘与落叶卷得四散飞舞。小人们惊慌失措地尖叫着四散奔逃，却被那宽阔的橡胶鞋底投下的阴影尽数笼罩\n“哎呀呀，小家伙们跑到挺快~”她带着几分醉意喃喃自语，缓缓将那只包裹着白袜的脚踝向下探去——用鞋沿，轻轻在广场边缘的砖地上擦了一下\n只是这么一个极其微不足道的逗弄动作，对底下的小人而言却是一场遮天盖地的惊涛骇浪。巨大的摩擦带动着一阵强风，几名跑得慢的小人直接被鞋侧刮起的气流掀倒在地，连滚带爬地翻出了好几米远\n秦雯却仿佛浑然不觉，只是露出一个少女般天真又略带顽劣的笑容。她重新将巨足悬高，将那带有柔软粉色纹路的鞋底轻轻踮了踮，让底下的小人在她鞋底阴影的笼罩下惊惧不安地抬头仰望\n“居高临下地看着文明在脚底繁荣、尖叫、四处逃窜…似乎比书本上的故事更加下酒呢~” 她惬意地灌下一大口麦酒，甘甜的液体顺着她白皙的下巴洒落在商场楼顶，将几只小人淹在了酒液中
  gts_qinwen.111.desc: "In the completely icebound Ningguta system, there were still several habitable planets. Through our tireless construction, several planets were transformed in succession and settled with large populations, greatly easing the population crises of other systems. And Qin Wen——that giant literary girl——was at this very moment genuinely sitting atop the shopping mall on this planet, leisurely enjoying the comfort of the afternoon\\nQin Wen, usually celestial-scale in size, was now only a few dozen meters tall\\n“Wine is the source of civilization.” She raised that enormous wine cup, like a hill, and the amber liquid gleamed golden in the dazzling sunlight. “Without wine, how could there be such wonderful civilization?”\\nHer tipsy pink eyes narrowed slightly, carrying three parts intoxication and languor, as she lowered her gaze toward the street beneath her feet. Those huge pink-and-white sneakers happened to hover above the plaza at the mall's lower level. Her legs swayed with her breathing, and the thick, clean soles——to the civilized citizens below, tiny as ants——were an entire sky-blotting dome\\nQin Wen suddenly felt playful\\nA faint smile curled at the corner of her mouth. She gently swung her legs, and the huge soles swept through the low air, the airflow scattering dust and fallen leaves across the plaza below. The little people screamed in panic and fled in all directions, yet all were covered by the shadow cast from the broad rubber soles\\n“Oh my, the little ones run pretty fast~” she murmured to herself with a bit of drunkenness, slowly lowering the ankle wrapped in a white sock——using the edge of her shoe to gently scrape the brick ground at the edge of the plaza\\nSuch an utterly insignificant teasing motion was, to the little people below, an overwhelming storm that blotted out the sky. The immense friction stirred up a strong gust, and several slower little people were directly knocked to the ground by the airflow from the side of the shoe, tumbling and scrambling several meters away\\nQin Wen, however, seemed completely unaware. She merely showed a girlish smile, innocent yet slightly mischievous. She raised her giant foot high again and lightly tiptoed the sole with its soft pink patterns, making the little people beneath the shadow of her sole look up in fear and unease\\n“Looking down from above as civilization prospers, screams, and flees in every direction beneath my feet... seems to pair even better with wine than stories in books~” She comfortably gulped down a large mouthful of ale, and the sweet liquid spilled along her fair chin onto the mall rooftop, drowning several little people in the wine"
