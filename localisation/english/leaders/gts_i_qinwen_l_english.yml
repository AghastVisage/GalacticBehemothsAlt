  #  咕咕嘎嘎
  gts_qinwen.7.name: "Gugu gaga"
  #  “咕咕嘎嘎！啊...失态了，不过，这声企鹅叫竞有如此魔力，若是我学会了，应该可以与企鹅沟通吧”
  gts_qinwen.7.desc: "\"Gugu gaga! Ah... forgive my lapse. Still, this penguin call truly has such magic. If I learn it, perhaps I will be able to communicate with penguins.\""
