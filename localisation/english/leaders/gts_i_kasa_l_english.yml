  d_gts_kasa_brain: "Brain Resonator"
  # 我们派遣了人员进入了卡萨的大脑......难以置信，她居然真的让我们进入她的大脑里面进行设备安装！通过在几个节点接入我们的设备，卡萨的大脑所产生的生物电足够我们来干些大事情了，也许我们可以趁机偷偷学习一些......其他世界的科技？
