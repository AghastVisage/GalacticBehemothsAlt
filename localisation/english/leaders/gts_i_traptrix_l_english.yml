  # 塞拉回归
  gts_traptrix.2000.title: "Sera's Return"
  # 我们的虫惑魔行政官从终末地归来之后，因为吸收了终末地黑洞的原因，体型发生了巨大的变化，而她能够进行的职责和能力远远超过了之前的状态，经过我们和她们的讨论，决定重新给她们安排一次授勋入职的流程。\n\n我们原本给巨娘种族的巨型徽记在她们手中如同沙砾一般，塞拉随意将它如同耳钉一般挂在了身上。\n\n“嘛嘛，帝国的东西我还是会尊重的，仪式什么时候开始？已经结束了？”
  gts_traptrix.2000.desc: "After our Traptrix Administrator returned from the Terminus, her size underwent a HUGE change due to absorbing the Terminus black hole. The duties and abilities she can perform far exceed her previous state. After discussions with them, we decided to arrange another investiture and onboarding process.\n\nThe giant emblem we originally gave to the giantess race was like a grain of sand in her hands. Sera casually hung it on her body like an earring.\n\n'Well, well, I will still respect the Empire's things. When does the ceremony start? Is it over already?'"
  # 欢迎回来，塞拉
  gts_traptrix.2000.option: "Welcome back, Sera"
  # 呼——我们从终末地回来啦！不过我和阿洛酱好像都变得……都有些太大了，不过这样的话我们能做的事情应该就更多了吧。”
  gts_traptrix.2000.option.response: "Whee - we're back from the Terminus! But me and Allomerus seem to have gotten... a little too big. But if that's the case, we should be able to do even more things, right?"
  # 终末地黑洞现在的情况是……
  gts_traptrix.2000.option2: "What's the situation with the Terminus black hole now?"
  # 抱歉啦，我们确认了一下，那边基本完全失去了原本的功能了，不过我这边还是保留了一部分视频数据以及我们本身也可以接受一定程度上的研究，不过当然，得增加待遇才行！
  gts_traptrix.2000.option2.response: "Sorry, we confirmed that it has basically completely lost its original function. But I still have some video data and we ourselves can accept a certain degree of research. But of course, we need to increase the treatment!"
  # 这个变化对你们有影响吗？
  gts_traptrix.2000.option3: "Does this change affect you?"
  # 现在看来身体上应该没问题。不如说现在能够直接在太空中活动这件事就已经很超出我的预期了——一开始看到原先的科研船在旁边和一个小虫子一样的时候还有些害怕，后面习惯了就好了，非要说的话……现在感觉下面……有点空空的，好像比之前更严重了。
  gts_traptrix.2000.option3.response: "It doesn't seem to be a problem physically now. Or rather, the fact that I can now move directly in space is already beyond my expectations - at first I was a little scared when I saw the original research ship next to me like a small bug, but I got used to it later. If I had to say... now I feel... a little empty down there... it seems even more serious than before."
  # 接下来可能会派遣你去进行一些战斗方面的任务，你觉得能胜任吗。
  gts_traptrix.2000.option4: "We may send you on some combat missions next, do you think you can handle it?"
  # 呜哇……如果是和那些船队战斗的话我应该不太行，而且我也不太擅长指挥这件事情，让我去和那些舰船战斗的话估计你只能看到一个满身都是伤的塞拉酱了……不过要是那些没有舰队保护的星球的话，我应该是没问题的哦~不如说，十分乐意处理这种事情~！
  gts_traptrix.2000.option4.response: "Uwa... I don't think I can fight those fleets that well, and I'm not very good at commanding this matter. If you let me fight those ships, you can only see a Sera-chan with injuries all over her body... But if it's those planets without fleet protection, then I should be fine~ Or rather, I am very happy to deal with this kind of thing~!"
  # §Y塞拉§!作为一名§H领袖§!加入了我们的帝国。
  gts_traptrix.2000.hire_custom_tooltip: "§Y Sera§! joined our empire as a §H leader§!."
  # 调度大师
  gts_trait_leader_sera_a: "Scheduling Master"
  # 原本就在虫惑花园中精通调度的塞拉来到了更广阔的世界后，开始将自己的才能用在了更适合的地方……不过，在工作途中稍微利用自己的特权多「使用」一些小虫子也是无可厚非的吧\n§R每等级+1£gts_micro£§Y$gts_micro$§!消耗(此数值受体型特质影响)§!
  gts_trait_leader_sera_a_desc: "Sera, who was originally proficient in scheduling in the Traptrix Garden, began to use her talents in even more suitable places after coming to the wider world... But, it is excusable to take advantage of her privileges to 'use' some bugs more during work."
  # 捕食习性
  gts_trait_leader_sera_b: "Predatory Habits"
  # 就算塞拉开始治理更大的区域，她也很难抑制住自己旺盛的食欲，但是至少她不再明目张胆的从星球上捕食小人了……但是，那些掉入「洞穴」的可怜虫就没人能帮上了
  gts_trait_leader_sera_b_desc: "Even if Sera starts to govern a larger area, it is difficult for her to restrain her strong appetite, but at least she no longer blatantly preys on people from the planet... But, no one can help those poor bugs that fall into the 'holes'."
  # 无底的落穴
  gts_trait_leader_sera_c: "Bottomless Pit"
  # 在变为天体型巨娘之后，她十分愿意帮我们“存放”一些东西，前提是，接受其中一些内容的“损耗\n§R每等级+10£food£§Y$food$§!消耗(此数值受体型特质影响)§!
  gts_trait_leader_sera_c_desc: "After becoming a celestial-level giantess, she is very willing to help us \"store\" some things, provided that some of the \"consumption\" of these things is accepted"
  # §V阿洛美勒丝§!
  NAME_gts_allomerus: "§V Allomerus§!"
  # 被虫惑之森选为代表的虫惑魔之一，体态比起其他虫惑魔来说更成熟一些，似乎很擅长于指挥军团战斗以及将战场变得更为混乱
  DESC_gts_allomerus: "One of the Traptrix chosen as a representative of the Traptrix Forest. Her body is more mature than other Traptrix. She seems to be very good at commanding legions to fight and making the battlefield more chaotic."
  # 当阿洛美勒丝变为天体级巨娘之后，原本被她放入下体的囚犯和俘虏们已经完全失去了违抗阿洛美勒丝的意图，而我们也乐于将一些设施直接建设在阿洛美勒丝的体内，只需要做好防护，以及忍受一下并不算舒适的环境罢了——但是为什么有这么多员工想主动进入这个岗位？
  DESC_gts_allomerus2: "When Allomerus becomes a celestial-level giantess, the prisoners and captives originally placed in her lower body have completely lost their intention to disobey Allomerus, and we are happy to build some facilities directly in Allomerus' body, just do a good job of protection and endure the not-so-comfortable environment - but why are so many employees willing to enter this position?"
  # 接下来，该去哪里布置陷阱来诱捕帝国的敌人呢~
  gts_allomerus_catch_phrase: "Next, where should we set up traps to lure the Empire's enemies~"
  # 真是新奇的感受呢，去找点小小的猎物吧~
  gts_allomerus_catch_phrase2: "What a novel feeling, let's find some small prey~"
  # 阿洛美勒丝
  gts_traptrix.2999.name: "Allomerus"
  # 经过了数日，虫惑之森中选择了两位领袖来作为我们的助力，她们相貌和擅长的方向似乎差差别巨大，所以一次交流是必不可少的\n\n而面前所站的少女，便是其中那个看起来更为成熟一些的红发少女\n\n「……这里是阿洛美勒丝，我可以利用我的能力帮助你们狩猎外族……」
  gts_traptrix.2999.desc: "After several days, the Traptrix Forest chose two leaders to be our help. Their appearance and the direction they are good at seem to be very different, so an exchange is necessary.\n\nAnd the girl standing in front of you is the red-haired girl who looks more mature.\n\n'...This is Allomerus, I can use my ability to help you hunt down foreigners...'"
  # 你们种族现在怎么样了？
  gts_traptrix.2999.a: "How is your race now?"
  # 能够作为[Root.GetName]的附庸是我们的荣幸，只要给我们足够多的尊重我们自然会为阁下创造更多的价值
  gts_traptrix.2999.a.response: "It is our honor to be a vassal of [Root.GetName]. As long as you give us enough respect, we will naturally create more value for you."
  # 你们的种族对现状满意吗？
  gts_traptrix.2999.b: "Is your race satisfied with the current situation?"
  # ……那自然是不介意的，虫惑魔原本就是以生存至上的种族，只要能为我们提供足够的生存资源和捕食乐趣，我们都会安于现状
  gts_traptrix.2999.b.response: "...Of course, we don't mind. Traptrix originally are a race that puts survival first. As long as you can provide us with enough survival resources and hunting fun, we will be content with the status quo."
  # 你擅长做些什么？
  gts_traptrix.2999.c: "What are you good at?"
  # 我对捕猎小虫子这方面颇有心得，或许可以在这方面为各位帮忙？
  gts_traptrix.2999.c.response: "I have a lot of experience in hunting bugs, maybe I can help you in this area?"
  # 你对接下来要进行的工作有什么想法吗？
  gts_traptrix.2999.d: "Do you have any ideas about the work you are going to do next?"
  # 我原先最多带领过姐妹们一起去捕食，但是带领军队……甚至是可能舰队还是第一次，不过大概来说应该能够成功胜任职位吧……把那些小虫子们诱骗到危险的地方，然后一网打尽，这种战斗方式应该没问题吧？
  gts_traptrix.2999.d.response: "I used to lead my sisters to hunt, but leading an army... or even a fleet is a first for me, but in general, I should be able to successfully hold the position... Lure those bugs to dangerous places and then wipe them out in one fell swoop. This way of fighting should be fine, right?"
  # §Y阿洛美勒丝§!作为一名§H领袖§!加入了我们的帝国。
  gts_traptrix.2999.hire_custom_tooltip: "§Y Allomerus§! joined our empire as a §H leader§!."
  # 阿洛美勒丝回归
  gts_traptrix.3000.title: "Allomerus's Return"
  # 我们的虫惑魔行政官从终末地归来之后，因为吸收了终末地黑洞的原因，体型发生了巨大的变化，而她能够进行的职责和能力远远超过了之前的状态，经过我们和她们的讨论，决定重新给她们安排一次授勋入职的流程。\n\n我们原本给巨娘种族的巨型徽记在她们手中如同沙砾一般，不过阿洛美勒丝还是将其制成了一个吊坠，挂在了胸口。\n\n“重新再进行一次仪式吗……没问题，说起来还有个小秘密。嗯……这段时间不太安定，等一切结束之后再展示给您吧。”
  gts_traptrix.3000.desc: "After our Traptrix Administrator returned from the Terminus, her size underwent a HUGE change due to absorbing the Terminus black hole. The duties and abilities she can perform far exceed her previous state. After discussions with them, we decided to arrange another investiture and onboarding process.\n\nThe giant emblem we originally gave to the giantess race was like a grain of sand in her hands, but Allomerus made it into a pendant and hung it on her chest.\n\n'Are we going through the ceremony again... No problem. Speaking of which, there is a little secret. Hmm... it has been a bit unstable lately, I'll show it to you after everything is over.'"
  # 欢迎回来，阿洛美勒丝
  gts_traptrix.3000.option: "Welcome back, Allomerus"
  # 嗯，我们成功从终末地返航了。我们这次旅行至少对我们两人而言受益巨大，而且也算是为帝国争取到了一定的利益。至少以我们现在的状态应该能为帝国做更多的事情了。
  gts_traptrix.3000.option.response: "Well, we successfully returned from the Terminus. This trip has been of great benefit to at least the two of us, and it can be regarded as winning certain benefits for the Empire. At least in our current state, we should be able to do more for the Empire.\"
  # 终末地黑洞现在的情况是……
  gts_traptrix.3000.option2: "What's the situation with the Terminus black hole now?"
  # 很遗憾，基本可以确定现在终末地黑洞目前已经是历史了，但是我还是尽量把原先载着我们的科研船带了回来，相关的勘探，探查数据应该在其中有所保留——不过关于这个任务……嗯，抱歉。
  gts_traptrix.3000.option2.response: "Unfortunately, it can basically be determined that the Terminus black hole is now history, but I still tried my best to bring back the research ship that originally carried us, and relevant exploration and investigation data should be retained in it - but about this task... um, sorry."
  # 这个变化对你们有影响吗？
  gts_traptrix.3000.option3: "Does this change affect you?"
  # 在见面之前我进行了一些粗略的测试，发现自己现在身体的强度和种族能力都远胜之前，不过如果想要更进一步，获得更准确的数据的话……应该是需要帝国的帮助了。然后在指挥舰队方面……我想，我现在可以进行一些原先想过，但是实施起来有些困难的战术了，不过或许你可能需要先培养一下你舰队们在湿润/黑暗环境中的待命能力。
  gts_traptrix.3000.option3.response: "Before meeting, I did some rough tests and found that my body strength and racial abilities are far better than before, but if I want to go further and get more accurate data... the Empire should help. And in terms of commanding the fleet... I think I can now carry out some tactics that I had thought about before, but were difficult to implement, but you may need to first train your fleet's standby ability in humid/dark environments."
  # §Y阿洛美勒丝§!作为一名§H领袖§!加入了我们的帝国。
  gts_traptrix.3000.hire_custom_tooltip: "§Y Allomerus§! joined our empire as a §H leader§!."
  # 隐形捕食者
  gts_trait_leader_allomerus_a: "Invisible Predator"
  # 阿洛美勒丝参与的战场上遍布的落穴与陷阱成为了小虫子的噩梦……尤其是刚刚还在身旁的同伴突然消失，而刻意未被断开联系中的通讯器中传来的瘆人的粘液声和惨叫声也从各个方面对军队造成伤害……
  gts_trait_leader_allomerus_a_desc: "The Bottomless Pits and traps scattered on the battlefield in which Allomerus is involved have become the nightmare of the little bugs... Especially when the comrades who were still next to them suddenly disappeared, and the eerie mucus and screams from the communicators that were deliberately not disconnected also caused damage to the army in various ways..."
  # 穴内亲军
  gts_trait_leader_allomerus_b: "Elite Hole Guard"
  # 阿洛美勒丝在自己身体内部设置了一支亲卫军，这些亲军通常来说被用来处理被阿洛美勒丝穴内的猎物残余……以及帮其解决非战时的性欲
  gts_trait_leader_allomerus_b_desc: "Allomerus has established an elite guard inside her own body. These elite guards are usually used to deal with the remnants of prey in Allomerus' hole... and to help her solve her sexual desires during peacetime."
  # 穴中文明
  gts_trait_leader_allomerus_c: "Civilization Within"
  # 当阿洛美勒丝变为天体级巨娘之后，原本被她放入下体的囚犯和俘虏们已经完全失去了违抗阿洛美勒丝的意图，而我们也乐于将一些设施直接建设在阿洛美勒丝的体内，只需要做好防护，以及忍受一下并不算舒适的环境罢了——但是为什么有这么多主动想进入这个岗位的？
  gts_trait_leader_allomerus_c_desc: "When Allomerus becomes a celestial level giantess, the prisoners and captives that were originally placed in her lower body have completely lost the desire to resist. We are happy to construct some facilities and buildings within Allomerus's body. Just be sure to take precautions, and to tolerate being within that not entirely comfortable environment- but why are there so many people now actively wanting to be assigned to the position that is inside Allomerus!"
  # 星间捕食者
  gts_trait_leader_allomerus_d: "Interstellar Predator"
  # 比起更无法控制自己的塞拉来说，阿洛美勒斯更多的把目光放在帝国之外的地方，而虫惑魔自带的性欲也让她变得更为好战，她成为天体级巨娘之后，每日最渴望的，便是出战，然后用敌人的身体满足自己的欲望。
  gts_trait_leader_allomerus_d_desc: "Compared to Sera who is unable to restrain herself as much, Allomerus trains her eyes most on the places beyond the Empire. The Traptrix also, by default, are hyper-sexual creatures which further make her incredibly warlike to begin with. Since becoming a celestial-sized giantess, every day she is most eager to be on the offensive, and longs to fill her desires through the bodies of her foes."
  # 狡猾的落穴
  gts_traptrix.2100.name: "Cunning Bottomless Pit"
  # 「指挥官！他们逃走了一部分，接下来要去把他们抓回来吗！」\n\n「不需要哦……他们已经是我的战利品了，要是你们抓回来的话，岂不是让我少了很多乐子……」\n\n在舰队观测室中的阿洛美勒丝带着微笑看着落荒而逃的残余小虫子们，回到了自己的房间内——早在之前的拉锯战中，她就已经将周边布满了自己设下的陷阱，而这些残兵败将只要稍微有些不慎，在遍布陷阱的战场中有一足落空，等待着的便是将其传送于阿洛美勒丝其之中的落穴\n\n而看着远处逐渐落入陷阱的小虫子，阿洛美勒丝开始笑盈盈地决定着他们的下场
  gts_traptrix.2100.desc: "'Commander! A part of them escaped! Are we going to catch them back!'\n\n'No need... they are already my spoils of war. If you catch them back, wouldn't that take away a lot of my fun...'\n\nAllomerus, in the fleet observation room, watched the remnant bugs fleeing in panic with a smile on her face as they returned to their room - even in the previous tug-of-war, she had already filled the surrounding area with traps she had set, and as long as these remnants were slightly careless, with one foot in the air in a battlefield full of traps, they were waiting to be transferred to Allomerus whose inside\n\nAnd watching the small bugs gradually falling into the trap in the distance, Allomerus began to decide their fate with a smile on her face"
  # 在这里打了这么久……下面可是早就已经无法忍耐了……
  gts_traptrix.2100.a: "I've been fighting here for so long... I can't stand it down there..."
  # 该好好补充一下养分了
  gts_traptrix.2100.b: "It's time to replenish some nutrients"
  # 其他同僚们好像是把它们当作脚奴的，要不然试试……?
  gts_traptrix.2100.c: "Other colleagues seem to treat them as foot slaves, why not try...?"
  # 嘛……败者就应该去败者应该在的地方才对
  gts_traptrix.2100.d: "Well... the losers should go where the losers should be"
  # 狡猾的落穴
  gts_traptrix.2101.name: "Cunning Bottomless Pit"
  # 阿洛美勒丝躺在床上，扒开自己的阴道，等待着坠入陷阱的小虫子，而没多久，就有几个可怜的虫子落入了阿洛美勒丝的陷阱中……名为阿洛美勒丝的虫惑少女因为个人的恶趣味，刻意将落穴的洞口设置在了自己的小穴之外，看着他们在空气中自由落体，然后一步一步地目视着自己在毫无支点的挣扎中，落入到敌军指挥官阴道之内……然后在粘稠的爱液中寸步难行，四周的荷尔蒙气息也在逐渐消磨着自己的体力，最后只能在性欲旺盛的少女的阴道中化为对方的养分……\n\n「……唔，这次的人数好像还不够解决问题的呢……有了，用这边居住着的小人吧~虽然单个没有下面的那些那么耐用，但是数量应该够用了~」
  gts_traptrix.2101.desc: "Allomerus lay on the bed, opened her vagina, and waited for the small bugs that fell into the trap. Before long, several poor bugs fell into Allomerus' trap... the Traptrix girl named Allomerus deliberately set the entrance of the black hole outside her own hole for personal evil taste, watching them in free fall in the air, and then step by step watching herself fall into the vagina of the enemy commander in a struggle without any fulcrum... Then it is difficult to move in the thick love, and the surrounding 气息 of hormones is gradually eroding their physical strength, and finally they can only turn into the nourishment of the girl in the vagina of the girl who is full of sexual desire... \n\n'...Well, it seems that the number of people this time is not enough to solve the problem... I have an idea, let's use the little people living here~ Although a single one is not as durable as those below, the number should be enough~'"
  # 或许……该给她提供一些排解自身欲望的东西了
  gts_traptrix.2101.a: "Perhaps... it's time to provide her with something to relieve her desires"
  # 狡猾的落穴
  gts_traptrix.2102.name: "Cunning Bottomless Pit"
  # 阿洛美勒丝闭目感受着腹中传来的逐渐充实的感觉……被落穴传送于此地的小虫子们几乎只能在自己强大的胃中存活一瞬间，只要稍微触到消化液，接触到的部位立刻被胃液将骨头和肉一同腐蚀殆尽，化为自己的养料，而侥幸存活下来的人，也无法在这充斥着酸性气息的世界中存活……而对比起来，或许直接坠入胃液之中的那些人会更为幸福一些，至少……他们还未体会到任何的痛苦就去世了
  gts_traptrix.2102.desc: "Allomerus closed her eyes and felt the gradually full feeling coming from her abdomen... The small bugs that were transferred here by the Bottomless Pit can almost only survive in their powerful stomach for a moment. As long as they touch the digestive juice, the contacted part will be instantly corroded by the gastric juice along with the bones and meat, turning into their own nourishment. Those who are lucky enough to survive cannot survive in this world full of acid 气息... Compared to that, perhaps those who fall directly into the gastric juice will be happier, at least... they haven't experienced any pain before they die."
  # 这就是虫惑魔的消化能力吗……
  gts_traptrix.2102.a: "Is this the digestive ability of the Traptrix..."
  # 狡猾的落穴
  gts_traptrix.2103.name: "Cunning Bottomless Pit"
  # 阿洛美勒丝向着坠入陷阱的俘虏们伸出了脚\n\n「好像说……是应该这么做的对吧~」\n\n几乎没有使用双足使用过小人的少女将俘虏们夹在自己的脚趾之间，随后想着该如何进行下一步的时候……便感受到了从足缝中传来的痒痒的，舒服的感觉，仔细看去，发现这些已经认清自己地位的战俘已经开始舔舐，侍奉其了自己的巨足，而所带来的轻微刺激也让阿洛美勒丝本能地夹紧了脚趾，随着噗呲几声，好几个小人也随着自己下意识的动作而化为一滩鲜血，而剩下的小人们也因为同伴的死去而更加卖力地使用自己的舌头清洁着面前的巨足……\n\n「呜……能理解其他人为什么要这么做了，确实感觉容易上瘾呐，要不要给自己找一双鞋子呢，原来那些人穿鞋子是为了放这些东西的啊，到时候问问到底该怎么做吧」
  gts_traptrix.2103.desc: "Allomerus stretched out her feet to the prisoners who fell into the trap\n\n'It seems... this is what I should do, right~'\n\nThe girl who has barely used small people with her feet puts the prisoners between her toes, and then thinks When thinking about what to do next... I felt a ticklish and comfortable feeling coming from the seam of her feet. Looking closely, she found that these prisoners who have recognized their status have begun to lick and serve their giant feet, which also brought slight stimulation to Allomerus. The instincts tightened her toes. With a Puchi sound, several little people turned into a pool of blood with their subconscious movements, and the remaining little people more actively used their tongues to clean the giant feet in front of them because of the death of their companions... \n\n'Ugh... I can understand why other people want to do this, it does feel easy to get addicted, do you want to find a pair of shoes for yourself, so the original people wear shoes to put these things in, ask them what to do when the time comes'"
  # 希望在她们的交流中能够稍微少一些损耗……
  gts_traptrix.2103.a: "I hope that there will be slightly less damage in their exchanges..."
  # 狡猾的落穴
  gts_traptrix.2104.name: "Cunning Bottomless Pit"
  # 阿洛美勒丝取出了一个肛塞，放在了一旁的椅子上，看到上面已经开始慢慢从内部浮起了被黏住的战俘们，满意地点了点头——这个特制的肛塞联通着星球地表的陷阱，所有踏入陷阱的小虫子们都会被传送到这个用于自慰的特制肛塞之中，然后逐渐浮到其之上的表面，不多时，上方就布满了密密麻麻的小人军队，他们被阿洛美勒丝的体液黏在表面动弹不得，只能任凭对方处置\n\n而阿洛美勒丝褪下了内裤，将菊穴放在了这个肛塞的上方\n\n「该让你们了解一下未来的工作环境了，以后就是里面生活的寄生虫了哦~不过还是希望你们在里面能够像之前战斗那样活跃就是了~」\n\n随后，放松开的菊穴发出了噗噗的声音，散发的气息也让下方的小人们理解了接下来自己的下场，但是被体液黏住的身体完全无法动弹，而发出的声音也只能让旁边的小虫子陷入更大的恐慌……\n\n「好了，那么……欢迎入住~❤」\n\n说着，阿洛美勒丝向着菊穴坐了下去，肛塞与肠道的摩擦让不少小人直接化为了肠道内壁的红点，随后化为了肠液的一部分——而更多的小人，则在阿洛美勒丝指挥官肠道内温度使得体液失去粘性之后，随着阿洛美勒丝的活动，彻底成为了阿洛美勒丝屁股里的寄生虫，只能生活在暗无天日的菊穴之中，以肠液和粪便为食……
  gts_traptrix.2104.desc: "Allomerus took out a butt plug and placed it on the chair next to her, seeing that the captured prisoners who were stuck were slowly floating up from the inside, she nodded in satisfaction - this special butt plug is connected to the traps on the surface of the planet, and all the bugs that step into the trap will be teleported to this special butt plug for masturbation, and then gradually float to the surface above it. Before long, the top will be covered with densely packed small human troops. They are stuck on the surface by Allomerus liquid and cannot move, and can only let the other party dispose of them\n\nAllomerus took off her underwear and put her chrysanthemum hole above the butt plug\n\n'Let you know about the future working environment, you will be parasites living inside in the future~ but I still hope you can be as active as you were in the previous battles inside~'\n\nThen, the relaxed chrysanthemum hole made a Pupu sound, and the dispersed 气息 also made the little people below understand their next end, but the body stuck by the body fluid could not move at all, and the sound made could only make the next little person fall into greater panic... \n\n'Okay, then... welcome to stay~❤'\n\nSaying that, Allomerus sat down towards the chrysanthemum hole. The frictional force between the anal plug and the intestinal tract directly turned many small people into red spots on the inner wall of the intestinal tract, and then turned into part of the intestinal fluid - and more small people, after the temperature in the Allomerus body commander's intestinal tract made the body fluid lose its viscosity, with the Allomerus activity, completely became parasites in the Allomerus butt, and can only live in the dark chrysanthemum hole, eating intestinal fluid and feces..."
  # 或许以后可以让囚犯也被这么对待？
  gts_traptrix.2104.a: "Perhaps future prisoners can also be treated like this?"
  # 星系捕食者
  gts_traptrix_chain_title: "Galaxy Predator"
  # 星系捕食者
  gts_traptrix_chain_desc: "Galaxy Predator"
  # 虫惑魔的主动请缨
  gts_traptrix.2200.title: "The Traptrix Volunteer"
  # 在探索终末地黑洞的行动研究快要结束，只剩最后一步进入黑洞探索的时候，我们的两位虫惑魔领袖突然对此产生了极大的兴趣，并多次要求参与调查，按照她们本人的话语来说的话……\n\n“我们虫惑魔对于洞穴的探索能力可是与生俱来的，而如此意义重大的洞穴的话，当然没有比我们更合适的了~”\n\n虽然在一些有关黑洞的探索研究中，虫惑魔种族曾经展示过她们得天独厚的天赋，但是有关终末地黑洞的问题上，我们必须要对这个决定慎之又慎。种种迹象表明，对终末地黑洞的研究虽然起源于对超古代巨大娘遗迹的探索。但是在这之上的研究无论是对我们星系甚至宇宙的本质探知，还是对我们帝国的未来造成的影响都十分重要，我们要将这进入终末地黑洞的机会交予给我们帝国的新成员吗。
  gts_traptrix.2200.desc: "When the action research to explore the Terminus black hole is about to end, and only the last step of entering the black hole is left to explore, our two Traptrix leaders suddenly became extremely interested in this and asked to participate in the investigation many times. According to their own words... \n\n'Our Traptrix's ability to explore caves is innate, and for such a significant cave, of course there is no one more suitable than us~'\n\nAlthough in some exploration and research on black holes, the Traptrix race has demonstrated their unique talents, we must be careful about this decision on the issue of the Terminus black hole. All indications show that the research on the Terminus black hole originated from the exploration of the ultra-ancient Juggernaut ruins. However, the research on this is very important whether it is the exploration of the essence of our galaxy or even the universe, or the impact on the future of our empire. Should we give the opportunity to enter the Terminus black hole to the new members of our empire?"
  # 既然她们是我们帝国的成员的话……让她们进入终末地也未尝不可。
  gts_traptrix.2200.a: "Since they are members of our empire... it is not impossible to let them enter the Terminus."
  # (该事件尚未完工，因此只能选这个)不行，她们也不是研究员，这种事情给予外族来处理太危险了。
  gts_traptrix.2200.b: "(This event has not been completed, so only this can be selected) No, they are not researchers, and it is too dangerous to give this kind of thing to foreigners to handle."
  # 虫惑魔的黑洞研究
  gts_traptrix.2201.title: "Traptrix's Black Hole Research"
  # 在几位虫惑魔代表乘坐科研船进入黑洞大约宇宙历7日后，我们的黑洞监视组惊恐地发现，终末地黑洞变得极其不稳定，从外界观测的大小和强度正在以肉眼可见地减弱。就此来看，不出几日，终末地黑洞对我们来说即将要成为过去，而进入其中的虫惑魔领袖在其中究竟会如何，我们只能为她们祈祷了……
  gts_traptrix.2201.desc: "About 7 cosmic days after several Traptrix representatives took a research ship into the black hole, our black hole monitoring team was horrified to find that the Terminus black hole became extremely unstable, and the size and intensity observed from the outside were weakening at a rate visible to the naked eye. From this point of view, in a few days, the Terminus black hole will become a thing of the past for us, and we can only pray for what will happen to the Traptrix leaders who entered it..."
  # 令人不安……
  gts_traptrix.2201.a: "Unsettling..."
  # 星系捕食者~诞生
  gts_traptrix.2202.title: "Galaxy Predator ~ Emergence"
  # 终末地的黑洞在我们的观测中逐渐缩小，而随着它的消失，有两个巨大的身影也从其中逐渐诞生。而当我们反应过来的时候，她们已经开始微笑着地向我们接近了……而直到她们在星球之间自由翱翔，星球在她们身边如同一个个小小的玻璃珠的时候，我们才认识到她们现在的身体有多么巨大……她们现在的大小已经远超一颗恒星的大小，现在已经可以轻松将星球当作玩具使用，当她们在停留在在我们首府星球前，展示她们那巨大的体型时，给我们的首府带来了不小的压迫感，所幸，她们似乎还把自己当作我们帝国的一员，在星系之间遨游的时候，刻意避开了我们的殖民星球和设施。\n\n不过，当她们将手指伸向我们大气层的时候，还是给我们的星球带来了不小的骚乱，她们两人只是轻轻一点，就随手将我们帝国的最高的山脉擦去了一大截。\n\n“呼，原本在地上的时候看到这个就不顺眼，现在舒服多了~”在大气层外，我们听到了来自塞拉的声音，看来即使变成了天体级巨大娘，她仍然保持着原本的精神状态，而接下来，她欣然同意了和我们的第二次沟通，一方面当然是她们在终末地黑洞之间的见闻，其次就是……她们理所当然的认为，她们的新力量足以成为再次和我们谈判的资本。\n\n从和她们的沟通中我们得知，她们进入终末地黑洞之后，只窥得了一瞬另一边的风景，另一边是一个更为庞大的世界。我们所在的宇宙和那一边相比，可以算是微不足道，而她也在那一边见到了，如同天神一般的巨大娘，终末地的出口便在她的脚缝之间，我们的星球……不，应该说宇宙在她的身前犹如飞蚊一般渺小，正当她们打算进一步探索时，另外一端的宇宙突然开始对两个虫惑魔领袖产生了排斥，四周巨大的压力向科研船袭来，轻而易举地将舰载护盾和船体给击溃，正当塞拉和阿洛美勒丝绝望之际，她们突然发现自己回到了终末地黑洞中，而且……黑洞的引力和质量对自己似乎毫无作用，她们因为在另一边世界受到了那一位巨大女神的影响，仅仅是与她的玉足接触了一瞬，她们便拥有了可以从终末地黑洞中获取黑洞和另一端的能量能力，而终末地黑洞很显然不能够长期支持来自另一端的逆向能量运输，所以，便自然地在她们的行动中逐渐损耗，最终成为了历史。\n\n而至于她们的情况\n\n“呜哇……吸收完那边的能量之后如果长期没能量补充的话自然会肚子饿的吧，我们现在的状态应该能帮你们解决不少敌人，我们感觉现在连那些坏家伙们的星球都能轻松捕获吃掉！不过对应的，报酬什么的可不能少得了我们哦——对了，还有我们的同族！”
  gts_traptrix.2202.desc: "The black hole at the end of the line gradually shrank in our observations, and as it disappeared, two huge figures gradually emerged from it. And when we reacted, they had begun to approach us with smiles... And when they soared freely between the planets, and the planets were like small glass beads beside them, we realized how huge their bodies are now... now their size has far exceeded the size of a star, and now they can easily use planets as toys. When they stayed in front of our capital planet, the display of their huge size brought a lot of pressure to our capital, fortunately, they still regard themselves as members of our empire, and carefully avoid our colonial planets and facilities when traveling between galaxies.\n\nHowever, when they stretched their fingers into our atmosphere, it still caused a lot of riots on our planet. With just a light touch, they casually erased a large section of the highest mountain range in our empire.\n\n'Huh, I didn't like seeing this when I was on the ground, now it's much more comfortable~' Outside the atmosphere, we heard Sera's voice. It seems that even after becoming a celestial-level giantess, she still maintained her original mental state. Next, she happily agreed to our second communication, on the one hand, of course, her experiences between the Terminus black holes, and secondly... both of them took it for granted that their new strength was enough to be the capital to negotiate with us again.\n\nFrom the communication with them, we learned that after they entered the Terminus black hole, they only glimpsed the scenery on the other side for a moment. The other side is a much larger world. Compared to that, our universe can be said to be insignificant, and she also saw a giant girl like a goddess over there. The exit of the Terminus was between her toes, and our planet... no, it should be said that the universe was as small as a mosquito in front of her. Just as they were planning to explore further, the universe on the other side suddenly began to repel the two Traptrix leaders. The huge pressure around them attacked the research ship, easily destroying the shipborne shields and the hull. Just when Sera and Allomerus were desperate, they suddenly found themselves back in the Terminus black hole, and... the black hole gravity and mass did not seem to have any effect on them. Because they were affected by the giant goddess on the other side of the world, If they only touched her jade feet for a moment, they had the ability to obtain energy from the black hole and the other end of the Terminus black hole, and the Terminus black hole obviously cannot support the reverse energy transportation from the other end for a long time, so naturally, in their actions Gradually depleted, eventually became history.\n\nAs for their situation\n\n'Uwa... If you don't have enough energy to replenish after absorbing the energy over there for a long time, you will naturally be hungry. Our current state should be able to help you solve a lot of enemies. We feel that we can easily capture and eat the planets of those bad guys! But correspondingly, the reward can't be less for us  -  oh, and our tribe!'"
  # 这结果令人震惊……
  gts_traptrix.2202.a: "This result is shocking..."
  # 虫惑的落穴
  gts_traptrix.2203.title: "Traptrix's Bottomless Pit"
  # 自从塞拉变为天体级生物之后，她原本的一些影响不大的小癖好成为了我们帝国最为头疼的问题，尤其是她无止尽地想要被外物所填满的欲望……\n\n原本她只是偷偷使用一些囚犯和下属来满足自己的性欲，现在她已经把目光盯到了我们领土中的星球之上。现在对于一些殖民星球上的住民来说，突然在一阵失重感中发现自己所在的星球已经完全被粉红色的肉壁覆盖也是常有的事情，而这个时候，所有星球住民都得忍受着来自于自己帝国领袖的淫靡气息和时常滴落在城市中的爱液——虽然因为各种巨娘活动的原因，只是爱液并不会造成多大的损害，但是给民众带来的出行不便以及……被爱液气息一同砸来的巨量荷尔蒙影响导致性行为和性犯罪激增的情况几乎无法避免\n\n在这种情况下你去找到罪魁祸首塞拉之时，她每次都是同一幅装无辜的样子，然后仿佛是公式化的狡辩一般随便找几个理由，最后恋恋不舍地把塞入在下体中的星球放回它原本的轨道上，而且满脸都写着下次还敢。\n\n“啊呀——这只是……只是没注意这个星球是殖民星球——！我……我下次会小心的！欸嘿嘿”\n\n如果让我们相信自称精于调度的虫惑魔能够犯这种低级失误的话，那这样只会让她未来更加肆意妄为，该对她们的行为决定了。
  gts_traptrix.2203.desc: "Since Sera became a celestial-level creature, some of her original minor quirks have become the most troublesome problem for our empire, especially her endless desire to be filled with foreign objects... \n\nOriginally, she was only secretly using some prisoners and subordinates to satisfy her sexual desires, but now she has set her sights on the planets in our territory. Now, it is a common thing for the residents on some colonial planets to suddenly find that their planet has been completely covered with pink flesh walls in a moment of weightlessness. At this time, all the residents of the planet have to endure the lewd aura and love fluid that often drips on the city from the leader of their empire - although because of various giantess activities, only love is not It will cause much damage, but the inconvenience it brings to the people and... the increase in sexual behavior and sex crimes caused by the impact of the huge amount of hormones brought by the atmosphere of love 액 is almost inevitable\n\nWhen you go to find the culprit Sera in this case, she is always the same innocent look, and then casually finds a few reasons like a formulaic sophistry, and finally reluctantly puts the planet inserted in her lower body back to its original orbit, Her face was full of the words 'I dare to do it next time'.\n\n'Oops - I just... just didn't notice that this planet is a colonial planet -! I... I'll be careful next time! Ehehehe'\n\nIf we believe that the Traptrix who claims to be proficient in scheduling can make such a low-level mistake, then this will only make her more reckless in the future, and a decision should be made on their behavior."
  # 批评和警告一下就好了。
  gts_traptrix.2203.option: "Just criticize and warn a little."
  # 必须得进行严惩。
  gts_traptrix.2203.option.2: "There must be severe punishment."
  # 虫惑魔的反叛
  gts_traptrix.2204.title: "Traptrix Rebellion"
  # “我们再也受不了你们了！明明我们帮了你们这么多事情！你们连给我们应得的报酬都做不到！”随着塞拉的命令，早就心生不满的虫惑魔们立刻响应了她的号召，开始向我们帝国发动反叛——\n\n而阿洛美勒丝也同时为虫惑魔们分发了她私藏的舰队——这些原本应该是我们帝国的家伙现在竟然将枪口对准了我们，真是笑话。
  gts_traptrix.2204.desc: "'We can't stand you anymore! We've helped you with so many things! You can't even give us the reward we deserve!' With Sera's order, the Traptrix, who had long been dissatisfied, immediately responded to her call and began to rebel against our empire - \n\nAnd Allomerus also distributed her private fleet to the Traptrix at the same time - these should have been our empire, but now they turned their guns on us, what a joke."
  # 那就在战场上见面吧。
  gts_traptrix.2204.option: "Then see you on the battlefield."
  # 反叛的结束
  gts_traptrix.2205.title: "End of the Rebellion"
  # 那两名最为巨大的虫惑魔倒下之后，剩下的胜利只是时间问题，随着最后一只虫惑魔也倒在了我们的武器之下，这次外族的反叛也宣告结束。
  gts_traptrix.2205.desc: "After the two largest Traptrix fell, the remaining victory was only a matter of time. With the last Traptrix also falling under our weapons, this rebellion of a foreign race was declared over."
  # ……或许我们之前能有更为妥当的法子。
  gts_traptrix.2205.option: "...Perhaps we could have had a more appropriate way before."
  # 最棒的盟友
  gts_traptrix.2206.title: "The Best Allies"
  # 之前从虫惑之森里跑出来和你们一起真是太好了！你们好像有数不清的有趣的事情等我们去做！现在要我们去做什么！吃掉其他国家的星球，还是舰队？让我们帮你们进行一些能做到的事情也行！只要我们能做的都会帮忙的！”\n\n随着时间的相处，虫惑魔们也对我们帝国越来越满意，她们虽然依旧不会放弃在城市内将他人抓入自己的“穴”内，但是都是一种玩闹性质的恶作剧，而市民们也越来越熟悉了和虫惑魔相处时对方的怪癖，而虫惑魔开设的风俗店和体验店也在城市中广受好评，我们的人民基本已经完全认同了与这些精于捕猎的朋友相处是一件美妙的事情，她们也完全成为了我们帝国的一份子。
  gts_traptrix.2206.desc: "It's great to run out of the Traptrix Forest and be with you! You seem to have countless interesting things for us to do! What do you want us to do now! Eat the planets or fleets of other countries? Let us help you with some things that can be done! As long as we can do it, we will help!\n\nAs time goes by, the Traptrix are also becoming more and more satisfied with our empire. Although they still will not give up catching others into their \"holes\" in the city, they are all pranks of a playful nature, and the citizens are becoming more and more familiar with it. The quirks when interacting with Traptrix, and the custom shops and experience shops opened by Traptrix are also widely praised in the city, as we the Traptrix and the people of the empire almost completely realize that it is also a wonderful thing to get along with these friends who are good at hunting, and they have completely become members of our empire."
  # 这是我们帝国前进的一大步。
  gts_traptrix.2206.option: "This is a big step forward for our Empire."
  # 落穴
  gts_traptrix.2210.title: "Bottomless Pit (Planet)"
  # 愤怒的阿洛美勒丝张开了嘴如虹吸般地将整个[gts_traptrix_next_colony.GetName]都吞入了口中，在舌头搅拌间便混着充满腐蚀性的唾液咽下了喉咙。\n\n"才这么点，连塞牙缝都不够呢！
  gts_traptrix.2210.desc: "The furious Allomerus opened her mouth and siphoned the entirety of [gts_traptrix_next_colony.GetName] whole.  With a swirl of her tongue and the deluge of her corrosive saliva, it was all swallowed down her gullet.\n\n'That's not enough to even pick my teeth!'"
  # 必须阻止她。
  gts_traptrix.2210.option: "We must stop her."
  # 落穴
  gts_traptrix.2211.title: "Bottomless Pit (Planet)"
  # 愤怒的塞拉将她如同深渊般深邃的菊穴对准了[gts_traptrix_next_colony.GetName]，"很抱歉呢小家伙们，恩将仇报的坏蛋们只配成为我的养分哦。"\n\n绿发少女的手指抽动之间，容纳着千亿人民的星球就这样消失在了塞拉的后庭之中。
  gts_traptrix.2211.desc: "Furious, Sera aimed her abyssally deep anus at [gts_traptrix_next_colony.GetName].  'I'm sorry, little ones.  Ungrateful villains are only fit to be my nourishment.'\n\nWith a twitch of the green-haired girl's fingers, the planet, which held hundreds of billions of people, disappeared into Sera's rear end."
  # 必须阻止她。
  gts_traptrix.2211.option: "We must stop her."
  # 狂惑的落穴
  gts_traptrix.2301.title: "Insane Bottomless Pit"
  # 塞拉接收指令之后，便在星空中穿行快速到达了目标星球所在的星系，而此刻，星球上的住民们，战战兢兢地看着从地平线上出现的“娇小的”身影——如果不是她一根手指就有这颗星球一般大的话。\n\n“欸——居然让我处理这样一颗星球吗，上面有好多人哦——而且看起来建设还挺厉害的……”塞拉将脸凑到了星球的旁边，仔细观察着上方如同苔藓一般的文明。\n\n而面对着这颗观察着自己的巨大的绿色眼眸，[gts_tensi_destroyed_planet.GetName]也发起了反击，星球上所存在的所有武器和所有能够向太空中敌人攻击到的武器都向着塞拉攻去——其中还有一架载兵飞船。\n\n而塞拉也注意到了这一点，对着所有向她打来的武器张开了嘴，随后，啊呜一口，将所有的攻击都抱进了嘴里\n\n“啊呜——嗯……唔唔……不好吃！”\n\n随后，星球上的所有人都眼睁睁地看着，巨大的绿发少女将星球上所有能够称之为武器的攻击都全部吞进了嘴里，而面前的绿发少女对举星球之力发起的攻击的评价仅仅是是一句简单的不好吃。\n\n“这样的杂鱼星球存在也没有什么意义吧，怪不得领袖要我过来处理这个星球，没用的东西最好进入废物该去的地方~——那么就希望各位好运咯~”\n\n说着，塞拉直接用手捏住了这个星球——直接将星球几乎四分之一的面积化为了废墟和残骸，手指直接砸向地面激起的海啸也让原本就大幅度减少的人口更加雪上加霜，而塞拉完全不在意这一点，而是直接褪下了自己的裙摆，然后——俯下了身子，将星球放在了自己的菊穴之前，星球上靠近塞拉的半球中仅存的市民们向天空中看去，天空已经完全呗粉色少女的屁股所覆盖，而正中心的粉色菊穴一张一合，仿佛在欢迎新“朋友”的到来。\n\n“呜呼呼~这个就是你们接下来要去的地方了~和废气与粪便为伍就应该是小虫子该做的事情吧~那么，再见咯~”\n\n随着一阵失重感，存活着的人口只能眼睁睁看着天空中的菊穴逐渐靠近，随后——整个星球进入了幼女虫惑魔的肠道之中，而四周弥漫着的气味，和暗红色的肉壁时刻提醒着整个星球已经成为了她肠内的寄生虫。\n\n“嘛，至少不用担心我的粪便会把你们完全消灭的——毕竟消灭了就不好玩了嘛，虫惑魔对“穴”的控制力可是很强的，要是我不想让你们星球破坏的话，可以说是轻松自如，嘛，这样吧，虫子也要有能生活下去的地方嘛~我会给你们留下一个区域让你们能够活下去，按照你们的科技，在里面活下去应该是能做到的吧，接下来怎么做就看你们自己的咯~”\n\n如塞拉所说，她的肠道内的确特意留下了一处场所，这个场所，粪便都会擦着这个区域向外排去，但是仿佛是刻意留下了一些漏洞，一些未被过滤的粪屑甚至可能会直接砸向星球，而[gts_tensi_destroyed_planet.GetName]只能在这恶劣的环境中艰难求生。星球上的一些人尽力寻找着离开的方法，而另一些则是将塞拉完全视作了神明，崇拜着塞拉的一切，甚至是她因为肠道活动砸在星球之上的粪便，他们认为这是女神给他们的赐福与惩罚，只有在肠道内艰难求生，才能让女神给他们一条生路，同时对寻找离开的人进行百般阻挠。\n\n然而这一切，绿色的虫惑魔都不得而知——毕竟这颗星球对于她来说完全无关紧要，只是自己在生活中的一个小插曲罢了。塞拉满足地穿上了自己的内裤，揉了揉肚子“好了——完成这个星球了，让我看看……下一步是哪一个呢~”
  gts_traptrix.2301.desc: "After receiving the order, Sera traveled quickly through the stars to reach the galaxy where the target planet was located. At this moment, the residents on the planet were trembling as they watched the 'petite' figure appearing on the horizon - if it weren't for the fact that one of her fingers was as big as this planet.\n\n'Eh - is it actually to let me deal with such a planet, there are so many people on it - and it looks quite powerful... ' Sera brought her face to the side of the planet and carefully observed the moss-like civilization above.\n\nFacing this huge green eye that was observing itself, [gts_tensi_destroyed_planet.GetName] also launched a counterattack. All the weapons on the planet and all the weapons that could attack the enemies in space attacked Sera - among them was a troop carrier.\n\nSera also noticed this, opened her mouth to all the weapons that hit her, and then, in one bite, took all the attacks into her mouth\n\n'Awoo - um... ugh... not delicious!'\n\nThen, everyone on the planet watched, as the massive green-haired girl swallowed all the attacks that could be called weapons on this planet, and the green-haired girl's evaluation of a massive attack powered by an entire world power was merely a simple and short, \"unappetizing\".\n\n'There's no point in having a trash planet like this. No wonder the leader wants me to deal with this planet. Useless things are best to enter the place where waste should go. Then, I wish you all good luck~'\n\nWith that said, Sera directly pinched the planet with her hand - directly turning almost a quarter of the planet's area into ruins and debris. The tsunami caused by her fingers slamming directly into surface also made the already significantly reduced population even worse. Sera didn't care about this at all. Instead, she directly took off her skirt, and then - bend down, placing the planet before her anus. The tiny remains of survivors that were on the side that would soon get devoured looked up to the sky, and found that the sky had already be completely obscured by the backside of a giant pink-haired girl. And at the very center was a gaping anus; like a sign of \"welcome\" to new potential \"friends\"\n\n'Wooo hooo hooo~ This is where you will be going next~ It should be what bugs do to associate with waste gas and feces~ so~ goodbye~'\n\n\"With a sense of weightlessness, the surviving population could only watch as the anus in the sky gradually approached. Then - the entire planet entered the intestines of the loli Traptrix, and the surrounding odor, and dark red flesh walls, are constant reminders that the entire planet has now become the girls internal parasites.\n\n'Well, at least you don't have to worry about my feces completely destroying you - after all, it won't be fun if it's destroyed. The Traptrix's ability to control 'holes' is very strong. If I don't want to let your planet be destroyed, it can be said that it is easy. Well, like this, bugs must also have a place to live~ I will leave you an area where you can live. With your technology, you should be able to survive in it. What you do next is up to you~'\n\nAs Sera said, she did deliberately leave a place in her intestines. In this place, the feces will rub against this area and be excreted, but it seems that some loopholes were deliberately left. Some unfiltered fecal matter may even directly hit the planet, and [gts_tensi_destroyed_planet.GetName] can only struggle to survive in this harsh environment. Some people on the planet try their best to find a way to leave, while others completely regard Sera as a god, worshiping everything about Sera, even the feces she smashed on the planet due to intestinal activities. They believe that this is the goddess's blessing and punishment. Only by struggling to survive in the intestines can the goddess give them a way to survive, and at the same time hinder those who are looking to escape in every possible way.\n\nHowever, all this is unknown to the green Traptrix - after all, this planet is completely irrelevant to her, just a small episode in her life. Sera put on her underwear with satisfaction and rubbed her belly 'Okay - this planet is done, let me see... which one is next~'"
