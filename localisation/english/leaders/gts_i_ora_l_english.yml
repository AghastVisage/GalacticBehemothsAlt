  # \"醒来了？\"\n这是你第十五天忙的在桌子上睡着了，而你睁开眼后......等会这是膝枕吗？\n橘子长的大小虽然收敛许多，你躺在她的腿上，却仍然感到周围十分宽阔，宛如整个人都被陷在了她的腿上。只是......如果能够躺在她的双腿中间就更好了......\n\"在想什么呢......让我想想，要是你想心甘情愿地被咱的双腿夹扁的话......橘子长也不是不可以满足的说......\"\n果然，你有时候甚至怀疑橘子长有着读心的能力。或许......是自己的表情管理太差了？\"那我去忙了，记得吃早饭哦。\"你看到小橘子长离去的身影，看了留在桌子上的早饭，却多了一种怅然若失的感觉...... \n眼前的小橘子长虽无本尊那样可以覆盖整个星球的体型以及强大的能力，甚至有点孤僻，总是喜欢一个人呆着，让人不禁怀疑她还到底是不是哪个万雌王。但是正因如此，你才不禁思考了起来：\n真正的橘子长，到底去哪里了呢？\n而就在你思索的时候......放在橘子长书桌上的手账本却不合时宜的翻开，而原本戛然而止的页面上，却突然浮现出了几行字：\n\"谜之城\"
  gts_ora.1016.desc: ""\"Woke up?\"\\ nThis is the fifteenth day in a row you've fallen asleep at your desk, and when you open your eyes... Wait, is this a lap pillow?\nAlthough Ora's size has shrunk considerably, as you lie on her lap, you still feel as if you're surrounded by vast space, as if your whole body were sinking into her legs. It's just... it would be even better if I could lie right between her legs...\n\"What are you thinking about...? Let me see... if you want to be willingly squished between my legs... I wouldn't mind making that happen...\"\\ nSure enough, sometimes you even suspect Ora has mind-reading abilities. Or maybe... you're just terrible at hiding your emotions? \"Well, I'm off to work. Remember to eat breakfast.\" You watched Mora's receding figure and looked at the breakfast left on the table, but a sense of wistfulness washed over you... \\ nThe Mora before you doesn't have the same planet-spanning stature or powerful abilities as the real Ora; she's even a bit reclusive, always preferring to be alone, which makes you wonder if she's really the Queen of Ten Thousand Females at all. But precisely because of this, you can't help but wonder:\nWhere has the real Ora gone? \nAnd just as you were pondering this... the notebook sitting on Ora Captain's desk opened at an inopportune moment, and on the page that had been abruptly closed, several lines of text suddenly appeared:\n\"The City of Mystery\"""
