  # \"一个女孩子的故事要从哪里讲起呢？还是从小时候开始吧。在察觉到自己并不是什么人类的时候......\"\n\n\"自己苏醒后并没有什么家人，以及任何和我相关的人物。有的只有这片荒芜的旧城区......以及在图书馆里面翻到的一些乱七八糟的纸质书。\"\n\n其实......还好吧。在那个纸质载体尚未淘汰的年代，一杯奶茶坐在桌子上看着书的时间总会引起无数的遐想。只是当时的条件吧......并没有奶茶可买，桌子也有点破破烂烂，但至少让我接触到了几乎无限的可能性。\n\n曾幻想自己是个面对风车的骑士，或者是什么给人们带来火种的存在......但是吧，直到看到了那个所谓的西西弗斯，却再也没能平静下来。得偿所愿是每个人的愿望，可生活在这个世界上的小人，却被和巨石还要沉重的足底压着......\n\n\"但是......\"你很想问些什么，毕竟你似乎猜到了些什么。从来到帝国后，以这样一个普通巨娘的大小开始，你就已经猜到了些什么。\n\n\"你，并不是生来的天体，对吧。\"\n\n\"谁知道呢？毕竟，再渺小的孤星，也还有可以向着千万光年外的世界，展示自己的璀璨不是吗？\"\n\n橘子长说完后，伸了个懒腰。或许，这是她难得放松下来的时段，你也明白，自从她来到这里之后，你担心的内容却和别的天体级行政官相悖：绝对不能让她再继续这样没日没夜下去。\n\n\"即使这样的星星要等待很久，久到足够一个银河的时长......不过咱要是这样说的话......你会陪着我走过这么长的时间吗？\"\n\n\"愿意。\"你很想这样说，只是碍于心底里的不好意思，决定换一种问法：\"话说......橘子长有没有什么很想要的东西吗......上次那个报单除外！\"\n\n\"这个啊......咱确实有一些，不过时间也不早了，总不能让那些家伙翻那么久不是吗？\"
  gts_ora.3021.desc: ""\"Where should I begin the story of a young girl? Let's start from when I was a child. Back when I first realized I wasn't human...\"\n\n\"When I woke up, I had no family - or anyone connected to me at all. All I had was this desolate old neighborhood... and a bunch of random paper books I stumbled upon in the library.\"\n\nActually... it wasn't so bad. Back in those days when paper books hadn't been phased out yet, sitting at a table with a cup of milk tea and reading a book always sparked endless daydreams. It was just the circumstances back then... There was no milk tea to buy, and the table was a bit rickety, but at least it gave me access to almost infinite possibilities.\n\nI used to fantasize about being a knight facing windmills, or some kind of being who brought the spark of fire to people... But then, after seeing that so-called Sisyphus, I could never find peace again. Everyone wishes to have their dreams come true, yet the tiny people living in this world are weighed down by a burden heavier than a boulder...\n\n\"But...\" You really want to ask something - after all, you seem to have guessed something. Ever since arriving in the Empire - starting with the size of this ordinary Giantess - you've already suspected something.\n\n\"You... weren't born as a celestial body, were you?\"\\ n\n\"Who knows? After all, even the tiniest, loneliest star can still shine brilliantly for worlds millions of light-years away, can't it?\"\\ n\nAfter Ora finished speaking, she stretched. Perhaps this was one of her rare moments of relaxation. You understood that ever since she'd arrived here, your concerns had run counter to those of other celestial-level administrators: you absolutely couldn't let her keep working day and night like this. \n\n\"Even if a star like that has to wait a very long time - long enough to span an entire galaxy... but if I put it that way... would you be willing to stay with me for that long?\"\\ n\n\"I would.\" You really wanted to say that, but held back out of a sense of shyness, so you decided to phrase it differently: \"By the way... is there anything you really want, Ora... aside from that order form from last time!\"\\ n\n\"Well... I do have a few things in mind, but it's getting late - I can't very well make those guys rummage through everything for that long, can I?\"""
