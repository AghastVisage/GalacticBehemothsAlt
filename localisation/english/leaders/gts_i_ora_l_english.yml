  # \"我以我身，写下这段星海的命运。\"
  gts_ora.1035.name: ""\"With my very being, I shall write the destiny of this sea of stars.\"""
  # 战斗已经进行至白热化阶段，双方都早已坚信，对方都坚持不了多久。\n整片星系内没有一颗星辰，不如说，整片宇宙的边界都成为了双方其中之一的坟场。而橘子长，无论是哪一个橘子长，在此刻完成了重逢。\n\"我以这副身躯，走到'我'这则故事的终点。\"\n是的，离开帝国，而后留在这里苦战。这是多少回了？橘子长不记得了，但是橘子长还记得的是：群星总会有更高维的存在，而她降临在此处，就是这片星海的末日。\n她是从什么时候开始得知末日的存在？或许从她诞生开始，也或许，换个说法，是从创造她的人死亡开始。\n写下这则故事的人，倒在了故事的完结回前，但是不必担心，会有人接过她的愿望，以她愿望的身份，继续续写下去。\n\"你，还是来了。\"\n你能听到来自你这位前辈的无奈，她燃尽了自己的过去和现在，走到了自己的终点，只为了在此地，为了心中守护的存在，和这个不可能战胜的目标坚守至今。\n\"算了，倒不如说，这才是'橘子长'应该做出的选择。\"\n当她的一生都在追逐，只为了飞到明天，哪怕自己徒劳无功，哪怕由虚幻构成的天空是虚假的现实。哪怕......这条路走到最后，她也是孤身一人。\n maiden举起长剑，对着面前这个不可能战胜的存在，这个万界星海之癌。\n剑起，枪刺，早已强弩之末的敌人也并非不可战胜。\n她曾问过自己，她是否怕过，她回答是，但她怕的，是半途而废。\n她也问过明天，如果走到明天的她不再是今天的自己，所做的一切又还有什么存在的意义。\n而答案，却显而易见。\n剑斩敌首，原本的橘子长收起长枪，而面对走自己过去走来的自己，她露出了久违的笑容，因为她知道，一切都已经结束了。\n\"要回去吗？\"\n\"你就不怕......现在拥有着强大力量的我，回去会给你取代了吗？\"\n面对小橘子长的请求，橘子长甚至可以开个小小的玩笑，虽然如今的她确实有着这样的力量。\n末日消散，天灾已陨，所有的力量都被橘子长吞下，化为靛蓝色的一只瞳孔，而她的身体早已跨越诸多星系之间，一条条环带在橘子长头部生成，化为了诸多行星，围绕着橘子长的头部形成了星系。\n\"好啊，正好上班上累了，两个人的话，你干一三五，我干二四，如何？反正你比我能干的多嘛。\"\n\"孩子啊，你这个年龄要多干一点，这是对你的考验啊......\"\n\n而此时此刻，在帝国焦急等待的你，却看到了一处熟悉的面孔\n她躺在孤星监狱的城市群内，城市宛如地毯一般将她笼罩，似乎......一切都已结束。却没有一个人敢上前去叫醒她。
  gts_ora.1035.desc: ""The battle had reached a fever pitch, and both sides were already convinced that the other wouldn't hold out much longer.\nNot a single star remained in the entire galaxy - or rather, the very edges of the universe had become a graveyard for one of the two sides. And the Ora - whichever one it was - were reunited at that very moment. \n\"With this body, I have reached the end of 'my' story.\"\\ nYes, leaving the Empire, then staying here to fight a bitter battle. How many times had this happened? Ora couldn't remember, but what she did remember was this: among the Stars, there are always beings from higher dimensions, and her arrival here signaled the end of this sea of stars.\nWhen did she first learn of the existence of the end? Perhaps from the moment she was born - or, to put it another way, from the moment the one who created her died.\nThe one who wrote this story fell before reaching the final chapter, but there's no need to worry: someone will take up her wish and continue writing the story in the role she intended.\n\"You... came after all.\"\ \nYou can hear the resignation in the voice of your senior. She has burned away her past and present, reaching the end of her journey, all just to stand here - for the sake of the one she guards in her heart, and to hold her ground against this impossible foe.\n\"Never mind. Or rather, this is the choice 'Ora' should have made.\"\\ nHer entire life had been spent chasing - just to fly toward tomorrow - even if her efforts were in vain, even if the sky woven from illusions was a false reality. Even if... at the very end of this path, she stood alone. \nThe young woman raised her longsword, facing the unbeatable entity before her - the cancer of the starry seas across all realms.\nAs the sword rose and the spear thrust forward, even an enemy already on its last legs was not invincible. \nShe had once asked herself if she had ever been afraid, and she answered yes - but what she feared was giving up halfway.\nShe had also asked tomorrow: if the \"she\" who reached tomorrow was no longer the \"she\" of today, what meaning would any of her actions hold? \nYet the answer was obvious.\nThe sword severed the enemy's head. The original Ora sheathed her spear, and as she faced her past self walking toward her, she flashed a long-missed smile - for she knew that everything had finally come to an end.\n\"Are you going back?\"\\ n\"Aren't you afraid... that now that I possess such great power, I'll replace you once we return?\"\nFaced with Mora's request, Ora could even afford to make a little joke - even though she truly did possess that kind of power now. \nThe apocalypse had dissipated, the celestial calamity had perished, and all power had been swallowed by Ora, transforming into a single indigo-blue pupil. Her body had long since traversed countless galaxies; rings formed around her head, transforming into numerous planets that circled her head to form a galaxy. \n\"Sure, I'm actually tired from work. If it's just the two of us, you can take Mondays, Wednesdays, and Fridays, and I'll take Tuesdays and Thursdays - how about that? After all, you're way more capable than I am.\"\n\"My child, at your age, you need to work harder - this is a test for you...\"\\ n\nBut at this very moment, as you waited anxiously in the Empire, you spotted a familiar face\nShe lay within the city cluster of Lone Star Prison, the cities enveloping her like a carpet. It seemed... as if everything had come to an end. Yet not a single person dared to step forward and wake her.""
