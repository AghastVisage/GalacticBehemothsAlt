  # 循此苦旅，终抵群星
  gts_ora.1036.name: ""Following this arduous journey, we finally reached the Stars""
  # \"橘子长？\"\n在经历了众多苦难中，你终于看到了橘子长的存在，但是......\n她的变化，有点太大。\n身高......天体级的身高难以界定，而身上的衣服也随之发生了变化，而外套却变得破破烂烂，上面的各种装饰也彻底遗失，只是将外套挂在了身后，一手巨剑，一手战旗，在看到你的到来后，却选择将你护在身后 -  - 即使你已经感觉到她早已力竭。\n周围没有一颗星辰，皆随战斗化为微尘，而站在橘子长对立面的，确是和如今的橘子长相同的人物 -  - 却有着靛蓝色的瞳孔。\n\"你说过的，我们终有一日'重逢'......就是这个时间段，有点不合时宜......\"\n\"无碍，你来的正是时候......\"\n声音都变得有点疲惫，却有种抹平了棱角的成熟感。\"你带来了......我的'过去'，和......'现在'？\"你将那本手账递给了橘子长，哪怕要抵抗着天体级巨娘的引力，而橘子长也随之一笑，收下了这份原本就属于她的东西。\n\"不过确实有个不合时宜的家伙......不过这一切该结束了......\"\n\"自我\"的炉火即将熄灭，而你的到来却让其燃烧的比以往还要明亮， maiden刺向伪神，身躯也逐渐变得庞大，开始逐渐覆盖星系，覆盖了数个银河，直到绵延至宇宙边界，将那个想取代自己的家伙一口吞下。\n\"我曾是一个学校的普通学生......但旅程和伙伴能够让我直面神明。\"\n\"我也在孤星的监狱中孤身一人，但监狱外仍有联结的羁绊\"\n\"我知道虚构的梦终有一天消散......但却是现实外最温柔的避风港。\"\n\"任何生物都会恐慌，恐慌未知，恐慌强大......但总有人挺身而出。\"\n\"而走过了这一切的我......又有什么伪证来质疑我作为'自我'，作为'橘子长'的意义？\"\n头顶的光环逐渐浮现，一侧的瞳孔也沦为了靛蓝。环状星系开始生成，却以 maiden的头部作为了恒星，绕其公转......不知道为什么，你的内心十分复杂，似乎......有些对不住这位你曾经的行政官。\n\n\"不用担心......都解决了......还是说......现在的你，或者你，也在'恐慌'着什么？\"\n\n似乎是安慰你，也似乎是安慰小橘子长。总之， maiden的手指将小橘子长的身躯围拢，仅仅只是一个拥抱，却让小橘子长得到了前所未有的安全感。\n\"我知道......我和你都度过同一片黑暗......\"\n\"但是不用担心，未来是过去的未来......我走过的，你总有一天会经历到，或者经历比这精彩的多的旅程。\"\n将小橘子长安抚完后，橘子长看向了你，虽然对方的体型比以往大了不少，而视线对上她瞳孔的那一刻你就明白：她仍然是你熟悉的那个存在。\n\"怎么说呢......一个人任性的辞职了几十年......是不是要......\"
  gts_ora.1036.desc: ""\"Ora?\"\nAfter enduring countless hardships, you finally caught sight of Ora, but...\nShe had changed - quite drastically.\nHer height... was so immense it was hard to gauge, and her clothing had changed accordingly, though her outer coat was now tattered and torn. and all its embellishments have been completely lost. She simply drapes the coat behind her, holding a giant sword in one hand and a battle flag in the other. Upon seeing you arrive, she chooses to shield you behind her - even though you can sense she is already completely exhausted. \nNot a single star remained in the sky; they had all been reduced to dust in the battle. Standing opposite Ora was a figure identical to her current self - yet with indigo-blue pupils.\n\"You said we would 'meet again' one day... It's just that this timing is a bit inopportune...\"\n\"It doesn't matter. You've come at exactly the right time...\"\nHer voice had taken on a hint of weariness, yet it carried a mature quality that smoothed out any rough edges. \"Have you brought... my 'past,' and... my 'present'?\" You handed the notebook to Ora, even as you struggled against the gravity of a Celestial Giantess, and Ora smiled in response, accepting what had always belonged to her.\n\"Though there really is one untimely fellow... but all of this should come to an end...\"\n The flame of the \"Self\" was about to die out, but your arrival made it burn brighter than ever before. The girl lunged at the pseudo-god, her body gradually growing immense, expanding to encompass a galaxy, then several galaxies, until it stretched to the very edge of the universe, swallowing whole the one who sought to replace her. \n\"I used to be an ordinary student at a school... but my journey and my companions have allowed me to stand face-to-face with the gods.\"\n\"I was also alone in the prison of the Lonely Star, but even outside those walls, bonds of connection remained.\"\n \"I know that fictional dreams will one day fade... but they are the gentlest refuge beyond reality.\"\n\"Every living being feels fear - fear of the unknown, fear of the powerful... but there are always those who step forward.\"\n\"And having gone through all of this... what false testimony could possibly question my significance as the 'Self,' as the 'Ora'?\"\nA halo gradually materialized above her head, and one of her pupils turned indigo. A ring-shaped galaxy began to form, with the girl's head serving as its star, orbiting around it... For some reason, your heart felt incredibly conflicted; it seemed... as if you owed this former administrator of yours an apology.\n\n\"Don't worry... it's all been resolved... or is it that... the 'you' of now - or rather, you - are also 'panicking' about something?\"\\ n\nIt seemed as if she were comforting you, or perhaps comforting Mora. In any case, the girl's fingers wrapped around Mora's body. It was just a simple hug, yet it gave Mora a sense of security unlike anything she'd ever felt before. \n\"I know... we've both walked through the same darkness...\"\n\"But don't worry. The future is the future of the past... What I've been through, you'll experience one day - or perhaps you'll embark on a journey far more exciting than this.\"\\ nAfter comforting Mora, Ora turned to look at you. Although she had grown considerably larger than before, the moment your gaze met hers, you knew: she was still the person you knew so well.\n\"How should I put this... After someone has been stubbornly quitting their job for decades... shouldn't they...\"""
  # \"欢迎回家，橘子长。\"
  gts_ora.1036.a: ""\"Welcome home, Ora.\"""
