  gts_ora.4303.a: ""In that case, let's wait a little longer.\n(Special projects can be carried out)""
  # 冻北女同
  gts_ora.4304.name: ""Frozen North Lesbians""
  # \"久等了啊 -  - \"\n\n已经不知道等了多久，再次醒来后，却发现鸟音正提着一壶热水蹲在自己面前，而自己的大小......却已经和正常人类的大小无异，却在她的脚下如同虫子一般。\n\n这是怎么一回事呢？我不是很清楚，只是在等待的过程中，遇到了一座城市，似乎......和曾经所在的风格有点像，一如之前的21世纪的城市建筑群。只是......为什么公告上写着不让舔栏杆？难道这里是？\n\n\"听说冻北的铁栏杆是甜的......啊我的舌头 -  - \"\n\n天体级的行政官却被一个小小的铁栏杆硬控在原地，这一点是自己没想到的，但是事实就是如此，却限制了自己行动的同时，铁栏杆就如同镶嵌在原地，和舌头见肉生根一般，哪怕变幻体型都无济于事。似乎.......事情就是这个样子的。\n\n\"这里的铁栏杆是不可以舔的......以前还有巨娘用这个来抓好奇的外地小人来着......那么橘子长做好'入乡随俗'的准备了吗......\"\n\n\"等等等等一下！\"\n\n柔软的手指压在没有单薄衣物遮蔽的身体上，温热的感觉却带着一丝窒息感，在如此严寒的环境中，这一丝温度却在手指接触的瞬间，将人的软弱放大，让人很难使得上力气。而看着鸟音脸上的表情，似乎她就是欣赏着小人在她指尖挣扎的样子吗，我不知道，我只知道我无论如何都挣脱不开。这种情况下，想要尝试挣脱开的话，或许只有一种办法了，那就是 -  - \n\n\"小橘子长在搞什么啊，这么痒可不会让咱把手指松开哦。\"我索性转变想法，开始用双手双腿在不停地挠着对方的手指。而就在对方感觉到痒痒的同时，身体却在一点一点地往外面蹭。\"那个......只是给姐姐的手指按摩而已，姐姐喜欢的话，不妨闭上眼睛享受一下捏。放心，我是绝对不会逃跑的。\"\n\n\"可以啊。\"见鸟音闭上了眼，我立刻加快了进度，而当我终于从对方的手指下挣脱出来的瞬间，却被对方一把捏住。不会吧，不会对方说话不算数吧。\n\n\"咱说话是算数的，咱会放过你的，不过小人说话也会算数的，对吧。\"\n\n啊这......就多余说这一句。不过既然不会玩弄的话，待在一个巨娘身边到也不是什么很可怕的事情了。\"啊这......我也没说我要跑啊，哈哈。\"我苦笑了一下，今天估计要和她一起度过了。\n\n\"开玩笑的，好了，这里的气候复苏工作还需要你的帮助呢，来吧\"
  gts_ora.4304.desc: ""\"Sorry to keep you waiting - \"\n\nI had no idea how long I'd been waiting, but when I woke up again, I found Niao Yin crouching in front of me, holding a pot of hot water. My size... was now no different from that of a normal human, yet I lay at her feet like a bug. \n\nWhat on earth was going on? I wasn't quite sure, but while I was waiting, I came across a city that seemed... somewhat similar in style to the one I'd once lived in - just like the 21st-century urban complexes of the past. But... why does the notice say not to lick the railings? Could this be...?\n\n\"I heard the iron railings in Dongbei are sweet... Ah, my tongue - \"\\ n\nI never would have imagined that a celestial-level administrator could be pinned in place by a tiny iron railing, but that's exactly what happened. While it restricted my movements, the railing seemed to be embedded in the ground, as if it had taken root in my tongue - and even shifting my form did nothing to help. It seemed... that was just the way things were.\n\n\"You're not supposed to lick the iron railings here... Back in the day, there was even a Giantess who used this to catch curious Tiny persons... So, Ora, are you ready to 'do as the locals do'...?\"\n\n\"Wait, wait, wait a minute!\" \n\nSoft fingers pressed against my body, unprotected by even the thinnest layer of clothing. The warmth carried a hint of suffocation; in such bitter cold, that slight warmth magnified my weakness the moment her fingers touched me, making it nearly impossible to muster any strength. Judging by the expression on Niao Yin's face, it seemed she was actually enjoying the sight of the Tiny person struggling beneath her fingertips. I didn't know - all I knew was that no matter what I did, I couldn't break free. In this situation, if I wanted to try to break free, there was perhaps only one way - \n\n\"What are you up to, Mora? If it's this ticklish, I'm not going to let go of my fingers, you know.\" I decided to change my approach and started scratching her fingers relentlessly with both my hands and legs. And just as she felt the tickling sensation, her body began to inch its way outward. \"Um... I'm just giving your fingers a massage. If you like it, why not close your eyes and enjoy it? Don't worry, I'm definitely not going to run away.\"\\ n\n\"Sure.\" Seeing that Niao Yin had closed her eyes, I immediately picked up the pace, but the very moment I finally wriggled free from her fingers, she grabbed me in a tight grip. No way - she's not going to go back on her word, is she? \n\n\"I keep my word - I'll let you go. But you keep your word too, right?\"\n\nOh, man... that was totally unnecessary. But since she wasn't going to toy with me, staying by a Giantess's side wasn't such a scary prospect after all. \"Uh... I didn't say I was going to run away anyway, haha.\" I gave a wry smile; it looked like I'd be spending the rest of the day with her.\n\n\"Just kidding. Anyway, we still need your help with the climate restoration efforts here. Come on.\"""
