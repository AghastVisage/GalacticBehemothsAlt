  gts_ora.1130.a.custom: """"
  # 求神无望，空余\"恐慌\"
  gts_ora.1031.name: ""With no hope in God, all that remains is \"fear\"""
  # 她曾经看到过，一个因梦而诞生的星球，星球的原住民欣欣向荣的发展着，也接连诞生了自己的文明，可这一切......却在一场来自天外的冲击下崩溃。\n巨娘傲人的身躯，似乎整个星系都容纳不下她的身影，而渺小的生灵却无一丝可以抵抗的权利......横跨数个大陆的足印下，小人的一切挣扎又显得是如此儿戏？在文明即将覆灭的前夕，她能看到政府宣布的无条件投降，随后在摇摇欲坠的内阁下，像个三岁的孩子一般嚎啕大哭 -  - \n恐慌，那是源自生物体内最直接的反应。哪怕只是刚出生的婴孩，还是年过耄耋的老者，此刻面对那般庞然大物，那个横跨整个天穹的足底......\n每个人都会\"怕\"，这不可怕，可怕的是......面对这样的怕......要怎么破局？\n孤星监狱......还是老样子，但是在那根吸管插在了海面后，此地却早已成为了一处死星......整个星球已然没有小人的生活痕迹，也没有任何生命迹象。或许......已经被某个路过的巨娘随手消灭......还是已经研究出载人飞船移民到别的行星了？\n城市的模样仍在，仍然能依稀看到当年生活的痕迹。 maiden看了一眼当时插上去的吸管。这么多年来，这颗孤星仍旧没有经受过任何巨娘的染指......除了她自己。\n天空已然暗淡，你透过简易的天文望远镜，看到了在那个高天之上的真正面目 -  - 那只是一个外观17岁左右的 maiden，而她此刻只是轻启双唇，大量的星球则被直接吸入口中。是的，是吸入。而你很清楚，你，包括你所在的这颗，或许是附近几个星系内唯一的孤星，也会面临着进入到这位\" maiden\"的身体内。此时，一切存在都将化为虚无，所有的证明都会被抹除......但是，你没有办法。你打不赢，却必须接下这一战。\n是绝望？不，是捍卫这颗孤星的决心。\n你不知这场战争从何开始，当\"她\"的视线注视到这颗孤星的一瞬间 -  - 一瞬间，铺天盖地的武器尽数朝着天空射出。人类的武器在这一刻，做出了最为正确的选择，也瞄准了最应该瞄准的目标 -  - 倾尽一切。是面向风车挥剑的决心，是面临风暴的面不改色，你们再向那位至高天穹的存在证明一个道理：你们绝不是虫豸。然而，你们所做的一切手段，却无法对这颗天空之上的瞳孔有着任何变化。地面开始生成怪物 -  - 是的，不是天降也不是孵化，而是凭空生成。她们虽为人形，却有着比人类庞大几十倍的身躯。所过之处，以往的城市在这样庞大的军团中被悉数碾为了粉末般的废墟。所幸你们的城墙足够坚固，也足以应对这些怪物的袭击。无数只巨娘的尸骸堆砌在堡垒的外围，你们的反击得到了阶段性的成功。然而，就在你们个高层在地下组织开会，决定进行着下一步的计划时 -  - 
  gts_ora.1031.desc: ""She had once witnessed a planet born from a dream, where the native inhabitants thrived and gradually developed their own civilization - yet all of this... came crashing down under the impact of a force from beyond the heavens. \nThe Giantess' imposing form seemed too vast for even the entire galaxy to contain, while the tiny creatures had not the slightest chance to resist... In the shadow of her footprints, which spanned several continents, how trivial did the struggles of these tiny persons appear? On the eve of civilization's collapse, she witnessed the government's declaration of unconditional surrender, followed by the crumbling cabinet - weeping uncontrollably like a three-year-old child - \nPanic - that was the most primal reaction within every living being. Whether a newborn infant or an octogenarian, faced at this moment with such a colossal entity - that sole that spans the entire sky...\nEveryone would \"fear\" it; that isn't terrifying. What is terrifying is... faced with such fear... how can one break free from this impasse? \nLone Star Prison... it looked just the same as ever, but ever since that straw was plunged into the ocean, this place had long since become a dead planet... There were no traces of Tiny person life left on the entire planet, nor any signs of life whatsoever. Perhaps... it had been casually wiped out by some Giantess passing by... Or have they already developed manned spacecraft to colonize other planets?\nThe city's outline remains; faint traces of past life are still visible. The girl glanced at the straw that had been inserted back then. All these years, this Lonely Star has still not been touched by any Giantess... except for herself. \nThe sky had already grown dim. Through a simple telescope, you saw her true form high above - she was merely a girl who appeared to be about 17 years old, and at that moment, she simply parted her lips slightly, and vast numbers of planets were sucked directly into her mouth. Yes, sucked in. And you know full well that you - including this solitary star you inhabit, perhaps the only one of its kind in several nearby galaxies - will also face the fate of being drawn into this \"girl's\" body. At that moment, all existence will be reduced to nothingness, and all evidence will be erased... But you have no choice. You cannot win, yet you must fight this battle. \nIs it despair? No, it is the resolve to defend this lone star.\nYou do not know when this war began, but the instant \"she\" set her gaze upon this lone star - in that very instant - a deluge of weapons was fired into the sky. At this very moment, humanity's weapons made the most correct choice and aimed at the target they ought to have aimed at most - giving everything they had. It is the resolve to swing a sword at windmills; it is the composure to face a storm without flinching. You prove one truth once more to that being in the highest heavens: you are by no means mere insects. Yet, none of the measures you took could bring about the slightest change in that pupil high in the sky. Monsters began to materialize from the ground - yes, not falling from the sky nor hatching, but appearing out of thin air. Though humanoid in form, their bodies were dozens of times larger than those of humans. Wherever they passed, entire cities were utterly crushed into powdery ruins by this colossal horde. Fortunately, your city walls are sturdy enough to withstand these monsters' attacks. Countless corpses of Giantesses are piled up around the fortress's perimeter, and your counterattack has achieved a temporary victory. However, just as your high-ranking officials were holding a meeting underground to decide on the next phase of your plan - ""
