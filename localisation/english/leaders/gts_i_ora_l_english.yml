  # \"你终于来了喵，咱已经等你很久了呢\"\n\n和之前一模一样的场景，但是眼前的柠檬 -  - 不如说，是她的\"心魔\"温柔地看着墨元轩。\n\n她喝了口茶，继续说道：\"咱可以一直和你耗着，但是那位可不一样，她等了你好久了呢，但是你好像辜负她了呢。\"\"心魔\"指向第三杯茶水的位置。\n\n原本空着的位置上不知什么时候多了一个长得像\"心魔\"的粉色猫娘。她眼神低落，愣愣地看着茶几。\n\n\"...我知道的...\"看到突然出现的粉色猫娘，墨元轩终于开口了，轻声说道：\"我知道自己整个都辜负了她，我知道自己...让她等了太久了...我也知道背对着她与其他女孩子交流什么的...也许，这就是其他人口中常说的'渣男'罢...\"他苦涩地笑了笑：\"辜负了深爱自己的 maiden，我...哈哈...真是十恶不赦呢...\"\n\n墨元轩慢慢地起身，走到柠檬旁边\"我不知道你是否会原谅，也不知道你是否还愿意面对我...也许你会觉得我很混蛋吧...\"他慢慢地抱住柠檬\"但我的眼里，永远有着你这个最亮的繁星，我不会辜负...也不敢再辜负你...因为我便是如此地爱着你，我那拥有粉红长发的挚爱之人...\"\n\n听着他的\"忏悔\"，\"心魔\"没有说什么，只是长叹了一口气\"果然是这样呢...\"她举起茶杯，一饮而尽。起身，拍了拍柠檬的肩膀。\"茶很好喝呢，下次需要力量再来找我吧。\"看着眼前的猫娘，眼里闪过一丝古怪的神情。\"你还是这么爱他啊，不过 -  - 这次我知道为什么了，另一个'我'。\"不知为何，\"心魔\"的脸上竟然微微泛起了一丝色彩，她转头向墨元轩说道：\"你赢了，迎接你的公主吧。\"然后转身走入黑暗中的某扇门，没有一丝留恋。\n\n静坐良久的猫娘动了，她转身抱住墨元轩\"以后...不要再离开了好吗...咱好孤单...好寂寞...\"此时一半的空间开始瓦解，从墨元轩进来的门那里开始向落地窗的方向蔓延。拥抱许久的两人终于分开了，他们看着对方，忽然柠檬笑了，然后拿起茶壶\"再多陪咱一会儿吧...刚才'她'也说了，这里的时间比外面更快\"\n\n此时的墨元轩看着来时的门，即使周围的空间已经崩坏，它还是好好的矗立在那里。\"好啊，那就多陪柠檬一会儿吧\"墨元轩收回脚步，坐回了位置上\"再来一杯吧，我想听听你的故事\"柠檬顿了一下，眼神里闪过一丝灰暗，然后笑着说：\"不是什么值得回忆的喵...被关在什么都没有的隔间里...被绑在手术台上...用各种药物仪器伤害咱的身体...\"她挤出一个惨淡的笑容\"抱歉让你听到这些不好的东西...不如小狼说说在咱不在的日子里发生了什么吧\"墨元轩放下茶杯，开始讲述他已经经历过的，但是这个柠檬没经历过的\"日常\"。\n\n此时的墨元轩看着来时的门，即使周围的空间已经崩坏，它还是好好的矗立在那里。\n\n\"没事的，现在我在这呢。所以，跟我回去吧，咱们的故事，还要继续呢。\"\n\n心中的感情再也抑制不住，少年将柠檬抱在怀里，随后对着柠檬吻了一口。\n\n\"我们的存在......将跨越'永恒'而延续。\"\n\n（你使用人口向橘子长换取了凝聚力，兑换数量按主体物种的体型计算。）
  gts_ora.101.e.response: "Do you want to see more... How about this: I will try to organize some and post them on that forum you know. What was it called... gwaltz, right? (Time to shill)\n(If you want to read them, you can search for \"橘子长_Ora\" on the gw forum~)"
