  # 选票逐渐拉高，被选中票数最高的星系也在瑟瑟发抖中。\n\n或许人们无论如何都不可能相信这一天：没有战争，没有宣称。甚至没有什么敌对国家的敌对。甚至关闭边境都变成了无用之举。因为如今整个星系，包括星系内的一切殖民地，行星，甚至这些全部加起来，此刻都不及千海的一根指头。\n\n随着直播的继续进行，对这个星系的讨伐也成为了开始：随着距离的逐渐逼近，所经过的途径划过了周边几千万光年外的星云。行星只是刚刚到了手指的引力范围，就被无情的力量撕个粉碎。人们开始恐慌，大家却已经看到已经有陆陆续续的移民船开始从星球内迁出，可是随着指尖逐渐逼近，人们却看到了更深的绝望：\n\n即使有超光速跃迁引擎，却也只能勉强越过 maiden半个指纹的距离。然而更加绝望的是，刚刚驶出星球的殖民船，却突然感到有一股无形的引力，令引擎瞬间失效，就连星球的磁场都开始发生改变 -  - \n\n毁灭，在此刻已然迫近。\n\n千海关闭了直播间，去洗手间洗了洗手，不多时，将一片气态微尘小心的放进了一处生态球内。很显然，直播间所看到的星系毁灭只是个障眼法。真正的星系早已被千海小心封存。毕竟......自己也不是什么恶魔不是吗？不对，自己好像真是恶魔......\n\n小人们所提供的打赏虽然在巨娘的眼中，算是微乎其微。但在多个宇宙中进行同平台直播所带来的收益仍然超出了千海的想象。或许......就这个打赏程度，哪怕把现有工作辞掉也能有一个不错的生活......不过直播的同时也和玩乐没什么区别。所以......\n千海打开了通讯器,向你发送了一条通讯:\n"如果有机会的话,找时间再播一次吧
  gts_ora.4108.desc: ""As the vote count gradually rose, even the galaxy with the highest number of votes was trembling in fear.\n\nPerhaps people would never have believed that this day could come: no war, no declarations of war. There wasn't even any hostility between enemy nations. Even closing the borders had become pointless. Because now, the entire galaxy - including all its colonies, planets, and everything else combined - was no match for a single finger of Qianhai. \n\nAs the live broadcast continued, the assault on this galaxy began: as the finger gradually drew nearer, its path sliced through nebulae tens of millions of light-years away. Planets were torn to shreds by the merciless force the moment they entered the finger's gravitational pull. Panic set in, yet people had already witnessed a steady stream of immigrant ships beginning to evacuate the planet. However, as the fingertip drew ever closer, they were confronted with an even deeper despair:\n\nEven with faster-than-light jump engines, they could barely cover the distance of half a fingerprint of the young girl. Yet what was even more despairing was that the colony ships that had just left the planet suddenly felt an invisible gravitational pull that instantly rendered their engines inoperable; even the planet's magnetic field began to shift - \n\nDestruction was now imminent. \n\nQianhai closed the livestream, went to the restroom to wash her hands, and shortly afterward, carefully placed a speck of gaseous dust into an ecosphere. Clearly, the destruction of the galaxy that viewers had witnessed was merely a smoke screen. The real galaxy had long since been carefully preserved by Qianhai. After all... he wasn't exactly a demon, was he? Wait, no - it seemed he really was a demon...\n\nAlthough the tips provided by his Tiny persons were negligible in the eyes of the Giantess, the revenue generated from live-streaming on the same platform across multiple universes still exceeded Qianhai's wildest expectations. Perhaps... with this level of tips, even if he quit his current job, he could still live quite comfortably... But streaming was really no different from just having fun. So...\nQianhai opened his communicator and sent you a message:\n\"If you get the chance, let's do another stream sometime.\"""
