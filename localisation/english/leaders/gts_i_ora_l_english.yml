  #  平等共存理念
  gts_trait_ora2: "Principle of Equal Coexistence"
  #  $gts_trait_ora2_picture$各物种，各个罩杯的大小理所应当遵循着“求同存异，平等发展”的理念。这也是橘子长想看到的。因此，可不要在她的面前挑起物种对立了……哪怕想象一下那个剁手哥在橘子长的胃里的景象。
  gts_trait_ora2_desc: "$gts_trait_ora2_picture$All species and cup sizes should naturally follow the principle of \"seeking common ground while shelving differences, and developing equally.\" This is also what Ora wishes to see. Therefore, do not incite interspecies conflict in front of her... just imagine the scene of Hands-Cutter Bro inside Ora's stomach."
  #  少女的清心寡欲
  gts_trait_ora3: "The Maiden's Simple Desires"
  #  $gts_trait_ora3_picture$作为天体级巨娘……橘子长消耗的资源要显著低于其她巨娘……甚至达到了普通巨娘的水准。“够用”，这是她唯一的解释。不过吧，这样确实为帝国捉襟见肘的资源提供了很大的帮助。
  gts_trait_ora3_desc: "$gts_trait_ora3_picture$As a celestial-scale Giantess... Ora consumes significantly fewer resources than other giantesses... even down to the level of an ordinary giantess. \"It's enough,\" is her only explanation. Still, this really provides great relief to the empire's strained resources."
  #  失忆症
  gts_trait_ora4: "Amnesia"
  #  “$gts_trait_ora4_picture$过往的记忆逐渐崩落，开始变得不再属于自己。橘子长只好不断将过去记下，以此逃脱“虚无”，维持自己的存在。”
  gts_trait_ora4_desc: "\\\"$gts_trait_ora4_picture$Her past memories are crumbling, becoming no longer her own. Ora must constantly record the past to escape the 'Void' and maintain her own existence.\\\""
  #  哈气
  gts_trait_ora5: "Hiss"
  gts_ora.4.a: "Anyway, thank you!"
  #  对于眼前的少女来说，你的出现或许能在她的笔下留下几个字符。只不过……在这样捉摸不透的少女面前，每一个字眼似乎都有可能引起她对文明的存护……亦或是覆灭。\n她在等你，在等你做出你想要做出的回应……你们的时间有很多，她也愿意在此停留一刻——在她的旅程中留下一个双方都会感到愉悦的“记忆”。
  gts_ora.5.desc: "For the girl before you, your appearance might leave a few characters under her pen. However... before such an unpredictable girl, every word seems potentially to trigger her preservation... or destruction of civilization.\\nShe is waiting for you, waiting for the response you want to make... You have plenty of time, and she is willing to stay here for a moment—to leave a \"memory\" in her journey that both sides will find pleasant."
  #  “抱歉……到现在还不知道你叫什么名字……” 
  gts_ora.5.a: "\"Sorry... I still don't know your name...\""
  #  “名字吗？”\n你难得见到少女做出了短暂的沉思。\n“名字只能作为一个符号，如果你想的话，可以用‘橘子长’来称呼……在紧张吗？不用担心，毕竟比起这些……我还是比较中意你们刚刚强装镇定的样子呢。毕竟……”\n少女微微一笑。“毕竟人类在面对如此巨大的存在，不选择徒劳的逃跑，而是选择靠近以寻求一线生机……这样的故事还挺适合在我的笔下诞生的说。”
  gts_ora.5.a.response: "\"My name?\"\\nYou rarely see the girl fall into a brief deep thought.\\n\"A name is merely a symbol. If you wish, you can call me 'Captain Ora'... Are you nervous? Don't worry, after all, compared to these... I rather prefer the way you were just forcing yourselves to stay calm. After all...\"\\nThe girl smiles. \"After all, for humans to choose not to flee in vain when facing such a giant existence, but instead choose to draw close to seek a slim chance of survival... such a story is quite suitable to be born under my pen.\""
  #  “你的故事……”
  gts_ora.5.b: "\"Your story...\""
  #  少女微微一笑，示意让你稍稍近些，丝毫不会在意因为体型上悬殊的差异会给你们带来什么样的压迫感。不过从她的举手投足间，似乎能依稀的感受到对方带来的善意——难得的能让气氛变得缓和的机会。\n“故事只是维系我的存在，每一段经历都会被我一一记下，包括你，”少女说完这些，却有意将笔抵在下巴上，似乎向你示意着什么，难道说……是要让你，让你们所处的文明，成为她笔下的一部分吗？
  gts_ora.5.b.response: "The girl smiles, signaling you to come a bit closer, completely unconcerned about what kind of oppression the huge difference in size might bring to you. However, from her every move, one can vaguely feel the goodwill she brings—a rare opportunity to allow the atmosphere to soften.\\n\"Stories merely sustain my existence. Every experience will be recorded by me, including you,\" the girl finished, but intentionally held her pen against her chin, as if signaling something to you. Could it be... that she wants you, the civilization you belong to, to become a part under her pen?"
  #  “可以一起同行吗？”
  gts_ora.5.c: "\"Can we go together?\""
