  # 随着手指抬起，刚刚那一大片楼房几乎全都化为了废墟，而刚刚那个小人的身影也是彻底消失在了这里。此时此刻，我很想和花田说些什么，只是......这样的情况下，自己这样的大小下，再怎么说自己也有点数：恐怕自己这个样子站出来，说什么对方都不会在意吧。而且，在她的粉丝见面会上说这个，怎么看都不合适，还是等一切结束之后再说吧。 maiden的眼神中看不出什么表情，似乎看不出她对刚刚那个小人的下头行为有什么不满，只是，我怎么隐隐约约中，感觉到她好像是......瞟了自己一眼呢？\n\n\"嗯嗯......小人们不要紧张哦，咱们既然来了，想必都是进来玩的......那么......\"\n\n\"接下来，就是咱给粉丝们的'福利'哦。\"\n\n沙沙......沙沙......宛如白沙滩上的风滚草，十分遥远，却也如此贴近。在这惺忪中睁开眼， maiden手中的棉球棒，在城市的高楼上摩挲着，蓝宝石般的眼眸微微眯起，就像是看着里面精心收养的小虫子般。时不时，棉球棒轻轻地接触到了几个幸运观众身上，虽然不会受伤，却也像是陷进了云朵中一般，顿时，整个身体被 maiden手中的小玩意儿当场俘获，而当那甜腻腻的感觉离开身体后，还停留到刚刚的那种放弃挣扎的感觉。有种恋恋不舍般地四处望去，直到抬头看到 maiden的脸才对刚刚所做的事情羞愧的无地自容。不过......就现在为止，这个大小下，还是暂且放过这种所谓的羞耻心，来全身心地接受这份来之不易的\"奖励\"吧。\n\n\"小家伙们很听话嘛，没有辜负了咱从世界的各个地方捡到的呢，那么现在躺好 -  - \"\n\n\"啪嗒。\"清脆的声响伴随着地底的轻微颤动，再次抬头时，天空中的 maiden早已和自己之间，隔了一块绵延无际的亚克力板，顿时，整个城市的高度瞬间被压缩，将里面的所有小人限制在了那几百米的高度。透明的平板虽看不出什么端倪，但仍然能感觉到空气被压缩的压迫感。 maiden那如碧海蓝天般的长发垂落在城市上空，却又在一定的高度，被透明的亚克力板接住，可望而不可及。只是......细心的你还是发现了， maiden那白皙的脸颊正在一点一点地靠近，出于本能反应，你的双腿顿时软了下来，只能就这么躺在了地面上，看着这个 maiden接下来的动作 -  - \n\n\"哈啊 -  - \"
  gts_ora.4204.desc: ""As his finger lifted, the vast expanse of buildings from just moments ago had almost entirely turned to rubble, and the figure of that Tiny person had also vanished completely from this place. At that very moment, I really wanted to say something to HuaTian, but... given the circumstances and my own stature, I knew better than to speak up: if I stepped forward looking like this, I doubt she'd pay any attention to whatever I said. Besides, bringing this up at her fan meet-and-greet just didn't seem appropriate. I'd better wait until everything was over to talk about it. The girl's expression was unreadable; she didn't seem to show any displeasure at the Tiny person's earlier behavior. However, I had a vague feeling that she might have... glanced my way?\n\n\"Mm-hmm... Don't be nervous, Tiny people. since we're here, I'm sure we're all here to have fun... so...\"\n\n\"Next up is a little 'treat' for our fans.\"\n\nRustle... rustle... like tumbleweeds on a white sandy beach - so distant, yet so close. Opening her eyes through the haze, the girl's cotton swab gently caressed the city's skyscrapers. Her sapphire-like eyes narrowed slightly, as if she were observing the tiny insects she'd carefully raised inside. Every now and then, the cotton swab would gently brush against a few lucky spectators. Though it wouldn't hurt them, it felt as if they'd sunk into a cloud; instantly, their entire bodies were captivated by the little object in the girl's hand. And even after that sweet, cloying sensation faded, the feeling of having given up all resistance lingered. They looked around with a sense of reluctance, only to feel utterly ashamed of what they'd just done the moment they looked up and saw the girl's face. But... for now, given the circumstances, they'd better set aside that so-called sense of shame and wholeheartedly embrace this hard-earned \"reward.\" \n\n\"You little guys are so well-behaved - you haven't let me down after all the trouble I went through to gather you from all corners of the world. Now, lie down nicely - \"\n\n\"Click.\" A crisp sound accompanied a slight tremor from beneath the ground. When she looked up again, the girl in the sky was already separated from her by an endless sheet of acrylic. Instantly, the entire city's height was compressed, confining all the tiny persons within it to a height of just a few hundred meters. Though the transparent panel revealed nothing, you could still feel the oppressive pressure of the compressed air. The girl's long hair, as blue as the ocean and sky, cascaded over the city, only to be caught by the transparent acrylic panel at a certain height - visible yet out of reach. But... if you're paying close attention, you'll notice that the girl's fair cheeks are drawing closer, bit by bit. Out of instinct, your legs suddenly give way, and you find yourself lying on the ground, watching to see what she'll do next - \n\n\"Haaah - \"""
