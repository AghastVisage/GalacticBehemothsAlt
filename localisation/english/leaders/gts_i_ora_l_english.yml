  # 橘与造物主
  gts_ora.4409.name: ""The Orange and the Creator""
  # 新的设备已经递交，随之一起的是御月希瞳一年的工资卡 -  - 虽然她这一年来除了摸鱼睡觉尾巴扫坏城市加上随意掀橘子长的裙子，工资表上本应该是惨不忍睹的样子。不过，比起别的天体级行政官来说，最起码...只要有零食有玩具就不会叛变的性格来看，还是不要扣除比较好吧。\n\n然而......平日里和一座大楼那般大的希瞳，此刻却没有这么想，她躺在一颗星球上，手指摩挲大陆海岸的浪花，而此时的她却一改往日，换上了一身礼服的同时，体型却覆盖整片大陆：\n\n是的，这颗星球已不再是往日所在的地方， 却也足够能看的出来，还原的不错。\n\n\"你来了啊......\"\n\n见到自己所在的星球有如此不速之客，橘子长应该会做出一些回应 -  - 而此刻，却如按下了什么开关一样，一向举止大方的天体级巨娘，此刻却向对方匍匐了起来。身体也缩成了一团，靠近了对方的手指。\n\n\"首播结束了喵......你说我......能赶得上前辈喵？\"\n\n maiden的声音已然十分虚弱，却还在尽可能的隐藏着自己的哽咽。希瞳不语，随处扔下的高跟鞋却立在海面上，却没有任何船只接近。确切的说 -  - \n\n似乎整个孤星，就只剩下了两个人。\n\n\"没事的，咱们可是要把椰汁成烧成灰的嘛......橘子长？\"\n\n而对方却僵住，没有了一点动静，希瞳放下头显，耳朵贴近耳机，对面却寂静的可怕。预\"感到不妙的希瞳立刻穿上衣服下楼，来到了之前庆祝生日的地方，可推开门却看到 -  - \n\n\"她睡着了，怀里抱着的还是这个平板......得到这样答案的橘子长，在想什么？\"\n\n放下头显后，橘子长思索了片刻。如今自己的存在，却是在如此渺小的仓库间中，靠着最简陋的东西来做出自己的梦想。这样的自己......低贱吗？或许吧。\n\n橘子长思索片刻后，却打开了平板，打开了绘画软件。
  gts_ora.4409.desc: ""The new equipment has been submitted, along with Mizuki Hitomi's pay stub for the past year - though given that all she's done this past year is slack off, sleep, destroy the city with her tail, and casually lift up her Ora skirt, her pay stub should have been a sight to behold. Still, compared to other celestial-level administrators - especially given her personality, which ensures she won't defect as long as she has snacks and toys - it's probably best not to dock her pay.\n\nHowever... Hitomi, who was usually as big as a skyscraper, wasn't thinking that way right now. She was lying on a planet, her fingers tracing the waves lapping at the continent's shore. Unlike her usual self, she was dressed in an evening gown - yet her form still covered the entire continent:\n\nYes, this planet was no longer the place it used to be, though it was still clearly recognizable - a pretty good recreation.\n\n\"So you're here...\"\\ n\nUpon seeing such an uninvited guest on her planet, Ora would normally have reacted - but at that moment, as if a switch had been flipped, the usually poised and graceful Celestial Giantess found herself crawling toward the other person. Her body curled into a ball, drawing close to the visitor's fingers.\n\n\"The premiere's over, meow... Do you think I... can catch up to you, senior, meow?\"\\ n\nThe girl's voice was already very weak, yet she was still doing her best to hide her choked sobs. Hitomi remained silent; the High Heels she'd tossed aside stood on the surface of the sea, yet no ships were approaching. To be precise - \n\nit seemed as though only the two of them remained on the entire lonely planet. \n\n\"It's okay. We're going to burn that coconut juice to ashes, right... Ora?\"\n\nBut the other person froze, not moving a muscle. Hitomi took off her headset and pressed her ear against the earpiece, only to be met by a terrifying silence. Sensing something was wrong, Hitomi immediately got dressed, went downstairs, and arrived at the place where they'd celebrated her birthday earlier. But when she pushed open the door, she saw - \n\n\"She's fallen asleep, still clutching this tablet... What is Ora thinking, having received such an answer?\"\\ n\nAfter taking off the headset, Ora pondered for a moment. Here she was, confined to such a tiny storage room, relying on the most rudimentary tools to bring her dreams to life. Was she... worthless? Maybe so.\n\nAfter pondering for a moment, Ora opened the tablet and launched the drawing software.""
  # 那就......把第十五个画出来吧。
  gts_ora.4409.a: ""Well then... let's draw the fifteenth one.""
