  # 天体级行政官的查抄工作已经接近尾声，很显然，除了冰箱里的两瓶橘子汽水以外，并没有搜到任何东西。只是这样的行为实在有些愧对于橘子长，毕竟......这样一个尽职尽责的天体级行政官属实有些求而不得了。\n\n\"走吧走吧......咱没这样的雅兴。如果不想变成吊在纪念碑上的那个巨娘的话......还是尽早离开我的视线吧。\"\n\n你感到自己的距离正在逐渐被她拉近，随后......橘子长打开抽屉，将一个手账本给予了你。\n\n\"至于你说的我想做的......短时间的话......算是都写在这里了吧。\"
  gts_ora.3022.desc: ""The Celestial-Level Administrator's search was nearing its end, and clearly, aside from the two bottles of orange soda in the fridge, nothing else had been found. Still, this behavior really didn't do Ora - after all... a Celestial-Level Administrator this dedicated is truly a rare find. \n\n\"Come on, come on... I'm not in the mood for this. If you don't want to end up like that Giantess hanging from the monument... you'd better get out of my sight as soon as possible.\"\\ n\nYou feel her gradually closing the distance between you, and then... Ora opens a drawer and hands you a notebook.\n\n\"As for what you said I want to do... for the time being... I guess it's all written here.\"""
  # （接下手账本）
  gts_ora.3022.a: ""(Continued from the notebook)""
