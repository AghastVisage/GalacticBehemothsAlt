  gts_ora.1029.name: ""Empty memories, devoid of fate, are all but \"illusions.\"""
  # \"过往所行......皆忆无灰......\"\n顺着小橘子长的指引，你们成功突围。而随后，你也注意到她一开始的不对劲......她的手......怎么这么凉？\n\"你刚刚看到了什么？\"你不禁问道，可 maiden的眼神却在逃离，似乎是不想让你看到你担心她的样子。只是这个样子......她的模样真的不能让你放下心来。\n\"别隐瞒了，这样对我们都不好......\"你叹了口气，说出了这句话。而也就这个时候，橘子长看了看你的双眼，思索一般，决定坦然说出了她刚刚看到了一切：\n\n\"我曾做着这样的梦，糖霜撒满的理想国。\"\n\n月影照在浅蓝色的窗棂前，有些清冷，也带着一丝空虚。今天......又没有找到食物，却在无数足底的踩踏间七零八碎地凑齐了这些。好饿......我尝试啃了一下雪糕棍，甜甜的，似乎能感受到 maiden口腔的芬芳抚摸着奶油一般。只是，甜腻过后，却是梦醒一般，感受不到一点热量和饱腹感。呜......\n身体愈发无力，可画上带着麻花辫的 maiden轮廓却是一点点显现出来，是一个很可爱的女孩子。或许......自己长这个样子？想不出来的我对着窗户发呆，却因为身高够不到上面的玻璃，因而看不清自己的长相。算了，自己就是长这样好了。那么，起一个什么样的名字好呢？\n\"想吃饱......想变得很厉害很厉害......\"\n橘子长，一个名字在脑海中浮现，却突然化作一丝清甜，甚至能感受到柑橘的汁水一般。是收获，是自己对未来不再挨饿的祈求，是愿望，是自己在梦中不断追寻的明天。\n\"早点睡吧......说不定就感觉不到难受了......\"\n\n\"醒来了？\"\n maiden的声音宛如远方的风，带着一丝小小的玩弄，拨开了早已年久失修的心弦。\"我......姐姐身上......暖和......\"话说到嘴边，脸却不自觉地红了起来。说起来，自己有撒谎的必要吗？自己就想投入她的怀抱中，感受到这份仅赐予给自己的温柔中。只是......不知为何，心中的羞耻却将话说出口的一瞬间，编织成内心里最柔软的模样。\n\"这样啊......那好哦。还有，现在是时候去......找那个'橘子长'了吧。\"\n她似乎能包容自己几乎一切的任性，就像自己所做的一切在她的眼里都像是在表示自己很可爱一样。我点了点头，爬上了 maiden伸出来的手指，似乎这会是一场旅程的开始，只是......在她的上衣兜中，我却开始动摇，就像即将远行的蒲公英一样，在临行之际，还在眷恋着自己所在的那片花园。而我......在害怕，害怕美梦的糖霜被记忆剥落。\n\"那个......我又不想去了。\"\n是怯懦，也是对 maiden身体的依赖。只是...... maiden并未追究这些 -  - \n\"那好吧，那么......咱还有一个小小的问题呢......\"\n\"小家伙......想永远和咱在一起吗？就让咱这样养着你......\"\n\"咱带着你一起上学、放学，陪你玩各种各样的游戏......咱们的时间会很长很长，玩法会很多很多，感觉每一天都会变得不一样呢。\"\n是 maiden为小人许下的约定，就像一场被人精心培养的胎床一般，不必考虑痛苦，也不必承担责任。只需要将身体，在她张开的口腔中静静躺下，感受到唇齿间对你的悉心照料 -  - 她不会再将你一口吞掉，这是她给予你的保证。而你，也只需要在她的口腔中，感受被舌苔轻轻托起的感觉，就像......\n将身体置的真空一般，如此虚幻。\n梦醒，无处可去。显示屏晃的睁不开眼。一看时间，三点，却不知是何时而写。手指放在早已脱漆的键盘上，有些按键早已老化，不听使唤地折磨着手指的耐心。直到最后一字，将一切全部投稿，身体疲惫地倒在了床上，希望能再次沉到那裹满糖霜的梦里。\n然而，却抓不住，宛如被打碎的万花筒般，先前那些华彩乐段再也无法奏鸣。我看着灰蒙蒙的窗外，将要拂晓的天看不到一点温暖，甚至我自己都无法预见，迎接自己的，是黎明？还是永夜。\n\n\"如果真的能，哪怕是刻意为之也好。\"\n\"将一切痛苦都剥离，只剩下被甜蜜淹没的乌托邦，糖霜撒满的理想国。\"\n\"但这样......真的算美好吗？\"\n\"至少能......骗一下自己吧。\"我拿起手机，却找不到联系人，懊恼之余，却只能在某个不知是谁的消息中，标记了一个\"未读\"。
  gts_ora.1029.desc: ""\"The things I've done in the past... all memories without a trace...\"\nFollowing Mora's guidance, you successfully broke through the encirclement. But then, you noticed something off about her from the very beginning... Her hands... why were they so cold?\n\"What did you just see? \" You couldn't help but ask, but the girl's gaze shifted away, as if she didn't want you to see how worried you were about her. But the way she looked... her appearance really wouldn't let you put your mind at ease.\n\"Don't hide it - this isn't good for either of us...\" You sighed and spoke those words. Just then, Ora looked into your eyes, as if deep in thought, and decided to candidly reveal everything she had just seen:\n\n\"I once had a dream like this - a utopia sprinkled with powdered sugar.\"\\ n\nThe moonlight fell on the pale blue windowpanes, casting a somewhat chilly glow tinged with a hint of emptiness. Today... she hadn't found any food again, yet she'd pieced these scraps together amid the countless footsteps trampling beneath her feet. I'm so hungry... I tried nibbling on an ice cream stick; it was sweet, and it felt as though the fragrance of a young girl's breath were caressing the cream. But after the cloying sweetness faded, it was as if I'd woken from a dream - I felt no warmth or sense of fullness at all. Ugh...\nMy body grew weaker and weaker, yet the outline of a girl with braids began to emerge bit by bit in the painting - a very cute girl. Maybe... this is what I look like? Unable to figure it out, I stared blankly at the window, but since I wasn't tall enough to reach the glass above, I couldn't see my own face clearly. Oh well, I guess this is just what I look like. So, what kind of name should I choose?\n\"I want to be full... I want to become really, really strong...\"\\ n \"Ora,\" a name floated into my mind, only to suddenly transform into a hint of sweetness - I could even feel the juice of a citrus fruit. It was a harvest, my prayer that I would never go hungry again in the future; it was a wish, the tomorrow I kept chasing in my dreams. \n\"Go to sleep early... maybe then I won't feel so miserable...\"\n\n\"You're awake?\"\nThe girl's voice was like a distant breeze, carrying a hint of playful teasing, plucking at the strings of a heart long neglected. \"I... you're... so warm...\" The words were on the tip of her tongue, but her face flushed involuntarily. Come to think of it, was there any need for her to lie? She just wanted to throw herself into her embrace and feel the tenderness reserved only for her. But... for some reason, the shame in her heart wove itself into the softest form within her the very moment the words left her lips.\n\"I see... Well, that's fine. Also, it's time to go... find that 'Ora,' isn't it?\"\nShe seemed capable of tolerating almost all of my whims, as if everything I did looked adorable in her eyes. I nodded and climbed onto the fingers the girl held out to me. It felt as though this would be the beginning of a journey, but... once inside her shirt pocket, I began to waver, like a dandelion about to set off on a long journey, still clinging to the garden where I belonged even as I was about to leave. And I... I was afraid - afraid that the icing on my beautiful dream would be stripped away by memory.\n\"Um... I don't want to go anymore.\"\nIt was cowardice, but also a reliance on the girl's presence. Yet... she didn't press the issue - \n\"All right, then... but we still have one little problem...\"\ \n\"Little one... do you want to stay with me forever? Let me take care of you like this...\"\n\"I'll walk you to and from school, play all kinds of games with you... We'll have so much time together, so many ways to play - every day will feel different.\"\\ nIt was a promise the young girl made to the Tiny person, like a carefully cultivated womb - no need to consider pain, no need to shoulder responsibility. All you had to do was lie quietly within her open mouth, feeling the tender care between her lips and teeth - she would never swallow you whole again; that was her promise to you. And all you need to do is lie there in her mouth, feeling the gentle lift of her tongue, as if...\nyour body were suspended in a vacuum - so ethereal.\nI woke from the dream, with nowhere to go. The screen flickered so brightly I couldn't keep my eyes open. I glance at the time - 3:00 a.m. - yet I have no idea when I wrote this. My fingers rest on a keyboard whose paint has long since peeled away; some keys have aged so much they no longer respond, testing the patience of my fingers. Not until the very last character is submitted do I collapse, exhausted, onto the bed, hoping to sink once more into that dream coated in frosting. \nYet I couldn't hold on to it - like a shattered kaleidoscope, those earlier brilliant passages could never be played again. I gazed out the window at the gray haze; the sky, on the verge of dawn, offered not a hint of warmth. I couldn't even foresee for myself what awaited me: dawn? Or eternal night. \n\n\"If it were truly possible - even if it were done on purpose.\"\n\"To strip away all suffering, leaving only a utopia drowned in sweetness, an ideal realm sprinkled with frosting.\"\\ n\"But would that... really be beautiful?\"\n\"At least I could... deceive myself for a while.\" I picked up my phone but couldn't find any contacts. Frustrated, I could only mark a message from someone I didn't even know as \"unread.\"""
