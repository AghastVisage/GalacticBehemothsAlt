  # \"已经放弃挣扎了吗？那好......\"\n将橘子长吞掉后，阿卡菈摸了摸自己的肚子，却感受不到小人进入腹中的感觉，不过也是，那么小的存在，又怎么会感觉到呢？就在她准备关闭这个世界，让橘子长彻底在她的胃里度过剩下的短暂人生时 -  - \n\"咚咚咚！咚咚咚！\"声音来自于世界之外。\"不对啊，咱还没有点外卖啊。\"阿卡菈摘下头顶上的设备，透过猫眼向外一看 -  - \n§M\"快点把橘子长交出来！不然的话......\"§!\n§E\"呼呼呼，这里是7个人对你一个，所以请速速投降哦。\"§!\n\"这样吗？橘子长嘛......已经被咱吃了。我还是很怀念她的口感就是了。\"仅仅只是隔着一扇门，阿卡菈也能感觉到，但是她从来都没有想到过，这些曾经邀请过的她们，竟然会为了一个小人而去做出这样的举动。\"所以，很遗憾，你们已经来晚了哦~\"\n§B\"喂，110吗？这里发生了一起独居女生被绑架的案件......\"§!\n§R\"想好了哦，就算你现在想暴起伤人，我们的小柠檬可是练了好几年的散打的哦。\"§!\n坠落，宛如在慢慢长夜中，独自一人面对着汹涌的浪潮，似乎没一次都能将自己整个人都完全吞没。我抵着伞，身体早无力迎接在她的胃里的一次次胃液的洗礼。而就在我认为自己就这么到此为止的时候 -  - 一声声呐喊在模糊的边沿，仿佛一条条乱码环绕在自己周围，将自己置入了一个气泡内，随着无数 maiden轻柔且熟悉的声音响起，意识也开始逐渐明晰过来：\n自己绝无孤身一人，而此地也绝非孤星。
  gts_ora.1419.desc: ""\"Have you given up struggling? All right, then...\"\nAfter swallowing Ora whole, Akara rubbed her stomach but couldn't feel the Tiny person entering her belly. But then again, how could she feel such a tiny being? Just as she was about to shut down this world, allowing Ora to spend the remainder of its brief life entirely inside her stomach - \n\"Knock, knock, knock! Knock, knock, knock!\" The sound came from outside the world. \"Wait a minute, I haven't ordered takeout yet.\" \" Akara took off the device on her head and peered out through the peephole - \n§M\"Hand over Ora right now! Otherwise...\"§!\n§E\"Huh huh huh, there are seven of us against just you, so please surrender immediately.\"§!\\ n\"Is that so? As for Ora... I've already eaten her. I still really miss the way she tasted, though.\" Even through just a single door, Akara could sense it, but she never would have imagined that these people - who had once invited them over - would go to such lengths over a Tiny person. \"So, unfortunately, you're too late~\"\n§B\"Hey, is this 110? There's been a kidnapping here - a girl living alone...\"§!\\ n§R\"Think twice. Even if you try to lash out right now, our Little Kaining has been training in Sanda for several years.\"§!\\ nFalling, as if alone in the long, dark night, facing surging waves that seemed on the verge of completely swallowing me whole with every crash. I braced myself against the umbrella, my body too weak to endure the repeated wash of stomach acid in her stomach. And just when I thought this was the end - shouts rang out from the blurred edges, like strands of garbled code swirling around me, enclosing me in a bubble. As the soft, familiar voices of countless young girls filled the air, my consciousness began to clear:\\ nI was by no means alone, and this place was certainly not a solitary star.""
