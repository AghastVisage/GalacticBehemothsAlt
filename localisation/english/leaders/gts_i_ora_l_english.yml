  # 多么朴实无华的理由，我们甚至不知道她究竟姓甚名谁，毕竟......已死之人又何必在意这些。当然，她也不会在意我们到底是谁，毕竟神明才不会记得蝼蚁之众的名字。只是需要理由......甚至连这个理由都是play的一环，而这里的所有人，都会为此承受来自天灾降临的毁灭。\n是啊，人群中已经开始恨起来了，在这灯红酒绿的城市中，人的偏见总会遮蔽那些无关紧要的东西。而在大难当前，这些虫豸才会展现出自己本来的那一面。\n什么？你是说这一切都是她的所作所为？笑死。大楼的倒塌是远处飞来的炮弹，四处飞溅的血迹是战车的倾轧。而她却只是，在看完这一场蝼蚁间的闹戏后，抬起脚，为此留下最后的收尾。至于那些无辜者......又有谁可置身事外呢？\n你们说......人死后的世界里，会看到什么？\n是漫漫长夜，看不到世界尽头的黑暗，没有一盏灯为自己而明，却每一盏都在照着自己的丑陋和恶俗。\n罢了，我又何尝不是......那些蝼蚁中的一个呢？在那个存在的脚下，在那个一看就不可战胜的家伙的脚下。甚至想多活那么一秒都是无望的奢求。罢了，踩着令脚掌刺痛的瓦砾，宛如披麻带枷一般，我试图跪倒在地，渴求此处的灵魂得以升天，却早已发现，自己哪里还有身体这一个概念？\n或许......这只是一个梦，一个在长夜中的幽灵所做的梦，而梦的名字：\n却是对明天，对力量，对未知的\"恐慌\"。
  gts_ora.1120.desc: ""What a simple, unassuming reason - we don't even know her full name. After all... why should the dead care about such things? Of course, she wouldn't care who we are either; after all, the gods don't remember the names of mere ants. It just takes a reason... and even that reason is part of the \"game\" - and everyone here will suffer the destruction brought by a natural disaster because of it. \nYes, hatred has already begun to spread among the crowd. In this city of neon lights and revelry, human prejudice always obscures what is truly unimportant. And only when faced with a great catastrophe do these vermin reveal their true colors.\nWhat? You're saying all of this is her doing? That's laughable. The collapse of the building was caused by shells flying in from afar; the blood splattered everywhere was the result of tanks running people over. Yet she merely - after watching this farce among the ants - lifted her foot to deliver the final blow. As for those innocent people... Who among us can truly remain uninvolved?\nTell me... what do people see in the afterlife?\nIs it an endless night - a darkness with no end in sight, not a single lamp shining just for you, yet every one of them illuminating your own ugliness and vulgarity? \nNever mind - am I not... just one of those ants myself? At the feet of that Being, at the feet of that creature who is clearly invincible. Even the hope of living just one more second is a hopeless luxury. Never mind - stepping on the rubble that stings the soles of my feet, as if shrouded in sackcloth and shackles, I try to kneel down, yearning for the souls here to ascend to heaven, only to realize long ago that I no longer even possess the concept of a body.\nPerhaps... This is just a dream - a dream had by a ghost in the long night - and the name of that dream:\nis \"fear\" - of tomorrow, of power, and of the unknown.""
