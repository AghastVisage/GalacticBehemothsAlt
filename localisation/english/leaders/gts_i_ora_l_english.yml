  gts_ora.1012.name: "Panic"
  #  少女离开了她诞生的星球，她开始了她的旅程。只是临走前，出于自己的小私心，她随手拾起了漂浮在宇宙间的吸管，插在了星球的海面上。\n巨大的白色吸管上到天际，向下直插地心，人们都看到少女的所作所为，却无人敢为之发声。曾几何时，这些人曾经向一个如此巨大的身影孤立，而如今，当少女做出了她想做的事情之后，所有人都意识到了一个问题：\n漫长的无神之路早已让这些渺小的生物感到安逸，而当这个星球迎来了属于他们的神明时——她却将生杀的权利交给小人自己决定。\n她已无心以小人的痛苦为乐，这根插在星球上的吸管也仅仅只是为了警告——顺带在心情不好的时候嘬一口。而她选择离开这里，只是为了能完成某个人临终前对自己的遗愿。\n“在群星璀璨。”\n她见过了太多，她看到无数人崇拜在以数个星系联结而成的巨娘身边，只为求得她性欲开始的一瞬吞没他们的帝国。她看到有无数巨娘，仗着横跨数个大陆的身体，践踏着才刚刚完成石器时代的渺小土著。她看到小人将自己视若神明，也不止一次从比自己还要大的多的巨娘手中逃生。少女手握长伞，怀揣手账，在群星间将所经历的一切都一一记录下来。\n她知道无数神明，她们甚至超出了这个维度本身。亦或是她所见到的也只是她们所投射到这个世界的模样。她不想这样，却无能为力，她为此表示恐慌，却仍然带着这份情感前行。\n\n“你看上去……不太像是天体级的巨娘啊……”\n“怎么见得？”\n“在这里这么久……一个小人都没ub……小妹妹不能是处……”\n\n少女难得的震惊，整个星球，甚至比星球还要大的多的巨娘，数以万计地在遥远的淫口前鱼贯而入。只是远远的看着，少女手扶长伞，这才勉强稳住身影没有因此晕倒。\n每片星海都有自己的传统，少女理解，少女尊重，可心底里这份恐慌却怎么都挥之不去。因为就算再怎么隐瞒自己，少女都不得不开始重视起一个问题：\n她和别人的差距太大了。\n故事到此，却突然戛然而止。你走到海岸边，看着那根庞然大物的吸管。似乎还能听到她做下这一切时的心情——那种被众人孤立的痛楚。\n你知道，她还在帝国的那段时间，她忙前忙后，忙着和周边各个国家的使节打交道。你很难想象她沉默寡言的样子，也很少看到她摧毁过什么城市或者星球。\n越是被孤立过，就越是对已经获得的感情更加珍惜。甚至到了小心翼翼的程度，所以，如果不是有什么很重要的事情的话……\n“那她当初为什么选择离开呢？”\n以及，还有一个从一开始就想提出的问题
  gts_ora.1012.desc: "The girl left the planet where she was born and began her journey. But before leaving, out of a small private impulse, she casually picked up a straw floating in space and inserted it into the planet's ocean.\\nThe enormous white straw reached up to the sky and plunged downward toward the planet's core. People all saw what the girl had done, yet no one dared speak out. Once, these people had isolated such an enormous figure, and now, after the girl did what she wanted to do, everyone realized one thing:\\nThe long road without gods had long made these tiny creatures comfortable, and when this planet welcomed the deity that belonged to them, she instead handed the power of life and death back to the little people themselves.\\nShe no longer has any desire to take pleasure in the suffering of little people. The straw inserted into the planet is merely a warning, with the added convenience of taking a sip when she is in a bad mood. And she chose to leave this place only so she could fulfill someone's dying wish for her.\\n\"Shine among the stars.\"\\nShe has seen too much. She has seen countless people worship beside giantesses formed from several linked star systems, seeking only the instant when their empire would be swallowed as her lust began. She has seen countless giantesses, relying on bodies that span several continents, trample tiny natives who had only just completed the Stone Age. She has seen little people regard her as a deity, and more than once escaped from giantesses far larger than herself. With a long umbrella in hand and a journal in her arms, the girl records everything she experiences among the stars.\\nShe knows countless gods. Some even exceed this dimension itself. Or perhaps what she has seen is only the form they project into this world. She does not want this, but is powerless. It frightens her, yet she continues forward while carrying that emotion.\\n\\n\"You look... not much like a celestial-scale giantess...\"\\n\"How can you tell?\"\\n\"You have been here so long... and you have not ub'd even one little person... a little girl cannot be a virgin...\"\\n\\nThe girl was rarely this shocked. Whole planets, and even giantesses far larger than planets, entered in the tens of thousands through a distant obscene opening in an endless stream. Merely watching from afar, the girl had to support herself with her long umbrella to barely avoid fainting.\\nEvery sea of stars has its own traditions. The girl understands. The girl respects them. But the panic in her heart will not disappear no matter what. Because no matter how she tries to hide it from herself, the girl must begin to pay attention to one issue:\\nThe gap between her and others is too large.\\nThe story reaches this point, then suddenly stops. You walk to the shore and look at that enormous straw. You can almost still hear the feelings she had when she did all of this, the pain of being isolated by everyone.\\nYou know that during the time she was still in the empire, she was busy from morning to night dealing with envoys from neighboring states. It is hard for you to imagine her silent and withdrawn, and you rarely saw her destroy any cities or planets.\\nThe more one has been isolated, the more one cherishes the feelings one has already obtained. Even to the point of extreme caution. So, if there was not something very important...\\n\"Then why did she choose to leave back then?\"\\nAnd there is one more question you have wanted to ask from the very beginning."
