  # 《夜间灵》
  gts_ora.1020.name: ""\"Night Spirit\"""
  # 你们说......人死后的世界里，会看到什么？\n很难回答的问题，至今也没有任何一个人，能够当着我的面回答过我的问题。不过也正是因为这样的原因下，才让这个看起来再简单不过的问题，成为了未解之谜吧。\n倒塌的楼房，四处飞溅的残骸。呼喊声伴随着他们的血迹，十分粘稠般地糊在了一起，却在逐渐黑下去的视野中，拉长到一点点失焦。新鲜的莓果在枝头上，随着风或者远行的愿望，却只是在路过之人的足下，轻轻踏下，留下了模糊不堪的鲜红汁水，糊在了那脏污不堪的鞋底的痕迹中。\n却拓印了作为一个渺小的存在的呼号与无望。\n灰白色的喷枪，和初雨后的泥水喷洒在了洁白的画布上。而随后，画师沾起一点点颜料，想作出点睛的一笔 -  - \"啪！\"谁家小孩的彩弹枪，此时正好有那么一发不偏不倚地打在了画板上，飞溅而来的红色颜料星星点点地泼在了这抽象派艺术的画作上，却再也不需要任何的笔墨。\n至此，画师凭借着这幅画获得了不少的殊荣。有人说这是雨后初晴的泥土中正在含苞待放的花朵，有人说这是岩石上，地衣中那无忧无虑啃食的瓢虫。当然，一幅画的含义也就在每个人的猜测中，身价也随之水涨船高。只是......\n我不知道，如今，看到如此的画面几万倍地投射在卫星投射下的地图上，这幅画的存在，多少带着那么一丝触目惊心。\n是预言？还是蓄谋已久？无人可知，人们只想要一个发泄口。只是......哪里还有能让画师锒铛入狱的机会呢？在全球各地激烈的讨论和恐慌中，夜幕降临。我却突然如梦初醒般，拿起手机，打开了这幅旷世巨作：\n\"你说......这个棕色的痕迹，怎么看......怎么像前几天小橘踩在门上的鞋印子呢？\"\n智者自诩自己睿不可当，而愚者总会找到比自己还要愚笨的家伙。总而言之，二者没有什么区别，因为......在这幅画作下，在那个星星点点灯光覆盖的城市中，仅仅一脚，仅仅一踏 -  - 整个城市都会为那个鞋子而尽数灭灯。\n你们说......人死后的世界里，会看到什么？\n答案是看不见，我不知我为谁，也不知那些灾难为谁。只是知道......天灾灭临当前，蝼蚁尚且无能为力。\n跑？撤？打不了，撤不出，五条车道被拥挤的车流堵死，最终化为了属于那些带有偏见之人的坟茔。这可笑吗？你为什么能够看到我早已控制不住的嘴角？不，可笑的绝对不是那些蝼蚁的临死前挣扎，而是行刑者在临刑前，对这个城市的死亡宣告：\n\"今天上午......是不是你在背后蛐蛐我了？
  gts_ora.1020.desc: ""What do you think... what do people see in the afterlife?\nIt's a difficult question to answer, and to this day, no one has ever been able to answer it to my face. But perhaps it is precisely for this reason that this seemingly simple question has become an unsolved mystery. \nCollapsed buildings, debris scattered everywhere. Screams mingled with their bloodstains, thick and sticky as they blended together, yet in the gradually darkening field of vision, they stretched out until they became slightly out of focus. Fresh berries on the branches, carried by the wind or the desire to journey far, are gently crushed beneath the feet of passersby, leaving behind a blurry, bright red juice that smears into the tracks left by filthy shoe soles. \nYet they imprinted the cry and despair of a tiny existence.\nGrayish-white paint from a spray gun, mixed with muddy water after the first rain, splattered onto the pristine white canvas. Then, the artist dipped his brush in a bit of paint, intending to add the finishing touch - \"Smack!\" A child's paintball gun - just at that moment - fired a shot that struck the canvas dead center. The splattered red paint dotted the abstract artwork, rendering any further brushstrokes unnecessary. \nSince then, the artist has won numerous accolades for this painting. Some say it depicts a bud about to bloom in the earth after the rain has cleared; others say it's a carefree ladybug munching on lichen among the rocks. Of course, the meaning of a painting lies in everyone's interpretation, and its value rises accordingly. But...\nI don't know - now, seeing such an image projected tens of thousands of times onto a map via satellite, the very existence of this painting carries a hint of something truly jarring. \nIs it a prophecy? Or a long-planned scheme? No one knows; people just want an outlet for their frustration. But... where is there any chance left to throw the artist behind bars? Amid fierce debates and panic around the globe, night falls. But I suddenly snapped out of it as if waking from a dream, picked up my phone, and opened this masterpiece:\n\"Don't you think... this brown mark... looks just like the shoeprint Xiao Ju left on the door a few days ago?\"\\ nThe wise pride themselves on their unparalleled wisdom, while the foolish always manage to find someone even more foolish than themselves. In short, there's no difference between the two, because... beneath this painting, in that city blanketed by scattered lights, with just one step, just one tread - the entire city would go dark for the sake of that shoe. \nTell me... what do people see in the afterlife?\nThe answer is nothing. I don't know who I am, nor do I know for whom these disasters occur. I only know... that when a natural disaster strikes, even an ant is powerless. \nRun? Retreat? We can't fight, and we can't escape - the five lanes are blocked by a gridlocked stream of traffic, ultimately turning into a graveyard for those filled with prejudice. Is this ridiculous? How can you see the smile I can no longer control? No, what's absolutely ridiculous isn't the last-ditch struggle of those ants, but the executioner's declaration of this city's death just before the sentence is carried out:\n\"This morning... was it you who was whispering behind my back?\"""
