  gts_ora.1030.name: ""\"Isolated\" and without support, using prayer as a banner""
  # 虫群的影响越来越多了，纵然身为天体级的[event_target:gts_ora_2_system_first_leader.GetName]，也难免会被虫群团团围住，虫群爬上了[event_target:gts_ora_2_system_first_leader.GetName]的腿上，开始向上爬行，似乎将她的身体当做了可以侵略的殖民地。[event_target:gts_ora_2_system_first_leader.GetName]捂着自己的私处，开始清理起自己的身体，却被更多的虫群围住。\n而小橘子长也并不好过，无数虫群开始攻击你所在的战舰，小橘子长拼命抵挡，尽可能将渗入战舰内的虫群消灭，来保护你的安全，可是，你也看到了橘子长的无力，不过，就在这千钧一发的时刻 -  - 原本还在猖獗的虫群却突然四散而开。怎么回事？\n\n\"我闭上眼睛，准备着出狱之后的打算，只是这次，和过往不同的是，我不会再选择躺平摆烂，而是......让她给自己一个交代。\n\"链接......链接断......断......\"\n\"链接断开。\"\n我......逃出来了？\n熟悉的场景，熟悉的大小，果然......但是我在意的并不是这个，而是......她到底成功逃出了吗？\n\"3000000份数据如流沙般飞过，唯独你，让她找到了救赎。这是你的想法吗？\"\n不对，这个声音是......\"咳咳......\"我强忍着疲惫的身体站了起来，还好，大小稍微恢复了些，虽然，在\"她\"的面前，自己还是如蝼蚁一般。\n\"所以......她出去了吗？\"\n\"你当真觉得，你有对咱发问的资格呢？自以为是的小家伙？\"\n令人窒息的感觉，只是略微靠近两步，身体仿佛是完全被她任意把玩一般。而造成这种压迫感的，却只是 maiden抬起了那一眼望不到头的手指，轻轻压在了自己上空。\n天空已然变为了一抹黑白， maiden白色的麻花辫在星海的染色下变成了一片惨灰，而靛蓝色的瞳孔，却宛如俯视着自己赝造的世界 -  - 一个她亲手创造的孤星。\n\"以你的自身为圆心，妄图任何人都围绕着你来转......其实，咱还是喜欢着你跪下来舔咱鞋底的样子......只是咱有洁癖，见不得脏东西呢。所以......\"\n\"自以为是，自欺欺人......到头来......\"\n两句话，却将小人彻底地从她的手指下抹除。连带着 maiden的指尖处，大片的大陆因此毁灭。造物主的实力就是如此，也理所应当如此。而做完这一切后， maiden抬起鞋子擦了擦，走到了电脑旁，在显示器发出的白光下， maiden白色的麻花辫却显露出一丝生人勿进的感觉。\n而后， maiden一言不发，只是默默地将账号的名字，从\"橘子长_Ora\"，改为了那恐怖的\"橘子长_Alka\"\n\"故事结束，想必在场为数不多还留在这里的观众，也在为这个笨蛋留下的荒诞结局而感到很失望吧。\"\n\"难怪呢，谁让她就是如此，外表光鲜实则内心早已腐烂的烂橘子呢？\"\n\"或许......这样的烂橘子......也就是在未来的某一天，独自枯萎下去，才是你理所应当的......\"
  gts_ora.1030.desc: ""The Swarm's influence is growing ever stronger; even [event_target:gts_ora_2_system_first_leader.GetName], a Celestial-class entity, cannot avoid being completely surrounded by the Swarm. The swarm crawled up [event_target:gts_ora_2_system_first_leader.GetName]'s legs and began climbing upward, seemingly treating her body as a colony to invade. [event_target:gts_ora_2_system_first_leader.GetName] covered her private parts and began to clean herself, only to be surrounded by even more swarm creatures. \nMora wasn't faring much better either. Countless insects began attacking the warship you were on. Mora fought desperately, doing her best to eliminate the insects that had infiltrated the ship to protect your safety. Yet you could see her helplessness, But just at this critical moment - the swarm, which had been rampaging, suddenly scattered in all directions. What's going on?\n\n\"I closed my eyes, making plans for life after my release. But this time, unlike before, I wouldn't just give up and let things slide - instead... I'd make her answer for this.\n\"Connection... connection lost... lost...\"\\ n\"Connection lost.\"\nDid I... escape?\nA familiar scene, a familiar scale - just as I thought... But what I was concerned about wasn't that - it was... had she actually managed to escape?\n\"Three million data points flew by like shifting sand, yet you alone allowed her to find redemption. Is that what you intended?\"\nNo, that voice was... \"Cough, cough...\" I forced my exhausted body to stand up. Thankfully, my size had returned somewhat - though in front of \"her,\" I was still as insignificant as an ant.\n\"So... did she get out?\"\n\"Do you really think you have the right to question me? You self-important little brat?\"\nA suffocating sensation - just taking two steps closer, my body felt as though it were completely at her mercy. Yet the source of this oppressive feeling was merely the girl raising one of her endless fingers and gently pressing it above my head. \nThe sky had already turned to shades of black and white; the girl's white braids had turned a pallid gray under the hues of the starry sea, while her indigo pupils seemed to look down upon a world she had fabricated - a solitary star she had created with her own hands. \n\"With yourself as the center, you presume everyone should revolve around you... Actually, I still prefer the way you kneel and lick the soles of my shoes... It's just that I have a潔癖 and can't stand anything dirty. So...\"\\ n\"Self-righteous, deluding yourself... In the end...\"\nThose two sentences completely wiped the Tiny person from existence at her fingertips. Along with it, vast swaths of the continent were destroyed right at the tips of the girl's fingers. Such is the power of the Creator - and so it should be. After doing all this, the girl wiped her shoe clean, walked over to the computer, and under the white glow of the monitor, her white braids gave off an aura that said, \"Keep out.\"\\ nThen, without a word, the girl silently changed her account name from \"Ora\" to the terrifying \"Alka.\"\n\"The story is over. I'm sure the few viewers still here are deeply disappointed by the absurd ending this fool has left behind. \"\n\"No wonder - after all, she's just a rotten orange, isn't she? All glitz on the outside, but already rotten to the core.\"\n\"Perhaps... a rotten orange like this... is destined to wither away all alone someday in the future - that's exactly what you deserve...\"""
