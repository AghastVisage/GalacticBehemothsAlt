  # \" maiden做过一个梦，糖霜撒满的理想国。而梦里的她遇到了最温柔的 maiden，似乎是最好的玩伴，也可以是永远的家人，她们的距离十分相近，即使被吃掉也心甘情愿，似乎这也是这份温柔的一部分，让不合时宜的记忆都为之消散。\"\n\"未来是过去的未来，过去却是未来早已抛弃的存在， maiden在梦界中，将自己的过去与未来闭合，因为只有在梦里才可以展现自己最脆弱的一面。\"\n睡吧，愿你的梦里，能遇到白安那般温柔的巨娘，我保证。\n\n故事在 maiden的口中完结，但是在得到故事的同时， maiden决定用一些小小的资源，向你换取一点点......\"零食\"？\n（你使用人口向橘子长兑换了2500能量币）
  gts_ora.101.a.response: "\"A young girl had a dream of an ideal realm sprinkled with powdered sugar. In her dream, she met the gentlest of girls - who seemed like the perfect playmate, and perhaps even a family member for eternity. They were so close that even if she were to be eaten, she would do so willingly; it seemed as though this was part of that tenderness, causing all untimely memories to fade away. \"\n\"The future is the future of the past, yet the past is an existence the future has long since abandoned. In the realm of dreams, the girl closes the loop between her past and future, for only in dreams can she reveal her most vulnerable side.\"\nSleep well. May you encounter a gentle Giantess like Bai An in your dreams - I promise. \n\nThe story ends with the girl's words, but upon receiving it, she decides to trade a few small resources with you for a little... \"snack\"?\n(You traded 2,500 Energy Coins to Ora for a population boost.)"
  # 《众星尽头的救赎》
  gts_ora.101.b: "*Redemption at the End of the Stars*"
  # 消耗人口获得矿物
  gts_ora.101.b.custom: "Use people to obtain minerals"
  # 小人曾陷入这般自证的境地，她在地砖缝中，追逐着巨娘的脚步，却究其一生，也无法走出巨娘的一步之遥。\n她曾失去希望，她曾深陷泥潭，她曾不信命运，也被别有用心之人推入深渊。她并没有别的故事里那般，有着花里胡哨的能力。而这样的她妄图染指神明，绝无可能。\n所幸她并非燃尽的孤星，她有一路上相陪的伙伴，才能让她再次拥有了与神明对垒的权利。小人手持长伞，宛如勇者的剑，相信的心成为了唯一的魔法。\n不过话说回来，你也并非孤星不是吗？有着一路上认识的巨娘......还有我。\n\n故事在 maiden的口中完结，但是在得到故事的同时， maiden决定用一些小小的资源，向你换取一点点......\"零食\"？\n（你使用人口向橘子长兑换了2500矿物）
  gts_ora.101.b.response: "A tiny person once found herself trapped in this cycle of self-justification. She chased after the Giantess's footsteps along the cracks in the floor tiles, yet throughout her entire life, she was never able to get even a single step closer to the Giantess. \nShe had lost hope; she had been mired in a quagmire; she had distrusted fate; and she had been pushed into the abyss by those with ulterior motives. Unlike the protagonists in other tales, she possessed no flashy powers. For someone like her, even attempting to challenge the gods was utterly impossible. \nFortunately, she was not a lone star burning out; she had companions who journeyed alongside her, granting her once again the right to stand against the gods. The Tiny person held a long umbrella, like a hero's sword, and her faith became her only magic.\nBut then again, you're not a lone star either, are you? You have the Giantess you met along the way... and me. \n\nThe story ends with the girl's words, but upon receiving it, she decides to trade a few small resources with you in exchange for a little... \"snack\"? \n(You traded 2,500 minerals to Ora for population.)"
  # 《璇星塔下的选择》
  gts_ora.101.c: "\"A Choice Beneath the Xuanxing Tower\"
  # 消耗人口获得食物
  gts_ora.101.c.custom: "Consume people to obtain food"
  # \"妥协\"还是\"反抗\"，这是一直以来的命题。\n星总是认为，自己不应当依靠璇这个推倒高塔的\"罪魁祸首\"。他讨厌塔，讨厌的是小人社会这般堪比斩杀线的\"吃人\"处境。而这份明面上对璇这个巨娘的反抗，却是对如今生活的\"妥协\"。\n璇所接受的教育却认为，应该给小人选择的权利，却不是因为别的，而是出于自己的一种\"心安理得\" -  - 把小人带回去的理由。那是一种\"温柔\"，却是对小人的\"妥协\"。\n至于小塔，他妥协了太多，高塔的崩塌让他一度陷入了被\"斩杀\"的处境。而他十分明白一个道理：星的\"反抗\"无法持续太久。既然跟着璇可以得到生存的机会，而自己却早已是个小人社会认定的\"死人\"。目的就是让星放下那些生活上的重压，投身于巨娘的怀抱。\n不过呢，故事的最后，巨娘推倒了偏见的高塔，也总是个大家都想看到的结局，至于你的话，放心，有我在，我们不会对未来选择\"妥协\"的，不是吗？\n\n故事在 maiden的口中完结，但是在得到故事的同时， maiden决定用一些小小的资源，向你换取一点点......\"零食\"？\n（你使用人口向橘子长兑换了2500食物）
  gts_ora.101.c.response: "\"Compromise\" or \"resistance\" - this has always been the question. \nXing has always believed that he shouldn't rely on Xuan, the \"culprit\" who toppled the tower. He hates the tower; what he hates is the \"cannibalistic\" situation in this society of Tiny persons, which is as ruthless as a death line. Yet this outward resistance to Xuan, the Giantess, is actually a \"compromise\" with his current life.\nXuan's upbringing, however, taught her that Tiny persons should be given the right to choose - not for any other reason, but out of her own \"sense of righteousness\" - the justification for bringing them back. It was a form of \"gentleness,\" yet it was a \"compromise\" toward the Tiny persons. \nAs for Xiao Ta, he had compromised too much; the collapse of the tower had once left him on the brink of being \"executed.\" And he understood one truth very clearly: Xing's \"resistance\" could not last long. Since following Xuan offered him a chance at survival - and he was already considered \"dead\" by the society of Tiny persons - his goal was to free Xing from the heavy burdens of life and lead him into the Giantess's embrace. \nHowever, in the end, the Giantess toppled the tower of prejudice - an ending everyone wanted to see. As for you, rest assured: with me here, we won't choose to \"compromise\" on our future, will we? \n\nThe story ends with the girl's words, but as she receives the story, she decides to use a few small resources to trade with you for a little... \"snack\"?\n(You used population points to trade with Ora for 2,500 food.)"
  # 《一忆双身之理》
  gts_ora.101.d: ""\"Reflections on the Principle of Duality\"""
  # 消耗人口获得消费品
  gts_ora.101.d.custom: ""Use the population to obtain consumer goods""
  # 我会时不时这么想：\n\nGIGA，在计量单位里也被称作\"千兆\"，也就是十亿倍数的大小......这样的倍率放在一个 maiden身上......想必你见到的也挺多了吧。那她所做的每一个细微的动作，恐怕对于普通的人类来说，都能称得上是灭顶之灾的程度。\n\n我就这么想，这样的话......人们会恐惧，会害怕到浑身战栗，会因为找不到可以逃离她足下的方法而万念俱灰。只是......我想的是：\n\n\"这样的大小下，真的不可以，让这具微尘般大小的灵魂安息吗？\"\n\n......\n\n\"姐姐......\"许久，我终于回答道：\"如果......姐姐不嫌弃咱的话......还是吃了咱吧......咱不想离开，但是咱也没有办法做到......\"\n\n\"好啊。\"\n\n意识突然沉底，片刻的工夫，身体再次躺在她温暖的指纹中。我闭上眼，准备躺入她为自己准备的眠床中，却只是听到一声轻轻的笑声，仿佛......在看着一个天真无知的孩童一般。\n\n\"想被咱吃掉吗？好啊，只是......\"\n\n\"你要一直在咱身边活下去，直到咱想吃掉你的那一天，在这之前，不允许给咱死掉哦~\"\n\n\"啊？\"\n\n此后，意识再次模糊起来，等到自己再次清醒之后，却早已身处在刚刚熟悉的穹顶内。只是......似乎因为意识游离的缘故，自己似乎已经可以和她进行交流了。只是......现在的我，应该称之为什么呢？或许......能这么毫无保留地对这样一个渺小的生灵进行如此的关照，应该，应该是......\n\n\"那个......姐姐，咱现在，算是你的'宠物'了吗？\"\n\n谁曾想，在听到我的发问后，却不禁让 maiden捂嘴偷笑起来。\"宠物？小家伙是很喜欢这样的称呼吗？\"在听到这样的话语后，我的内心不免有些失落下来。看来，自己终究还是想的太好了一些吧......\n\n\"如果小家伙愿意的话......咱是感觉'家人'会更好一些吧。\"\n\n\"只是如果想玩些什么的话......宠物也是可以的捏。\"\n\n原来......一切都不是自己的幻想。只是......自己还有一个疑问想问：为什么偏偏是我......不过，这已经不再需要问了吧。\n\n毕竟......这就是自己的归宿了。\n\n（你使用人口向橘子长换取了消费品，兑换数量按主体物种的体型计算。）
  gts_ora.101.d.response: ""Every now and then, I find myself thinking: \n\nGIGA - also known as \"gig\" in units of measurement - is a multiple of one billion... To apply that scale to a young girl... I'm sure you've seen plenty of examples like that. Every tiny movement she makes would likely be catastrophic for an ordinary human.\n\nThat's what I think - in that case... people would be terrified, trembling all over with fear, and utterly despondent because they couldn't find a way to escape from under her feet. But... what I was thinking was:\n\n\"Given her size, is it really impossible to let this soul - no bigger than a speck of dust - rest in peace?\"\\ n\n......\n\n\"Sister...\" After a long while, I finally replied, \"If... Sister doesn't mind having me... please just eat me... I don't want to leave, but there's nothing I can do...\"\\ n\n\"All right.\"\n\nMy consciousness suddenly sank to the depths, and in the blink of an eye, my body lay once more within the warmth of her fingertips. I closed my eyes, preparing to settle into the bed she had prepared for me, but all I heard was a soft chuckle, as if... she were watching an innocent, naive child.\n\n\"Do you want me to eat you? All right, but...\"\n\n\"You have to stay alive by my side until the day I decide to eat you. Until then, you're not allowed to die on me, okay~\"\\ n\n\"Huh?\"\n\nAfter that, my consciousness began to fade once more. When I came to again, I found myself back under the dome I'd just grown familiar with. Only... perhaps because my mind had drifted, it seemed I was now able to communicate with her. But... what should I call myself now? Perhaps... being able to care for such a tiny creature so unreservedly - I should be, I must be...\n\n\"Um... Sister, am I your 'pet' now?\"\\ n\nWho would have thought that upon hearing my question, the girl would cover her mouth and giggle. \"Pet? Do you really like that term, little one?\" Hearing those words, I couldn't help but feel a little disappointed. It seemed I'd gotten my hopes up a bit too much after all...\n\n\"If you're okay with it... I think 'family' would be a better fit.\"\\ n\n\"But if you want to play around a bit... 'pet' works too.\"\n\nSo... it wasn't all just my imagination after all. But... I still had one question I wanted to ask: Why me, of all people...? Though, I suppose there's no need to ask that anymore.\n\nAfter all... this is where I belong.\n\n(You traded with Ora for consumer goods; the exchange quantity is calculated based on the host species' body size.)""
