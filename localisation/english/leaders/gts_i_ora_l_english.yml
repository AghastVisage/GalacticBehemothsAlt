  #  “你为何不避？”\n“因为我的身后再无退路，唯有以身为薪，战至最后一刻（）。”\n（不会自刎归天的，放心）
  gts_trait_orangez2_desc: "\"Why do you not dodge?\"\\n\"Because there is no retreat left behind me. I can only make my body the fuel and fight until the final moment ().\"\\n(I won't cut my own throat and ascend to heaven, don't worry)"
  #  沉重的负担
  gts_trait_orangez3: "A Heavy Burden"
  #  告别了往日，如今的橘子长要承受的负担恐怕要比以往要多得多。不过这是她的选择，她也成功做到了这些。这份胸口上沉甸甸的分量，以及这比常规人类还要伟岸的身体恐怕也成为了她必须要承受的“代价”。
  gts_trait_orangez3_desc: "Having bid farewell to the past, the burdens the current Chief Orange must bear are probably far greater than before. But this was her choice, and she successfully accomplished it all. The heavy weight on her chest, along with this body far more imposing than that of an ordinary human, have probably also become the \"price\" she must bear."
  #  概念装甲模块
  gts_trait_orangez4: "Conceptual Armor Module"
  #  她仍然是你记忆中比较熟悉的那个橘子长，虽然你知道现在的她也只是过去的某个书页，但是和本尊不一样的是，那份你十分熟悉的“坦荡”胸怀，却能在战斗中意外的拦下了很多常规舰炮的攻击。
  gts_trait_orangez4_desc: "She is still the Chief Orange you remember rather well. Although you know that the current her is also only a certain page from the past, unlike the original, that very familiar \"open-hearted\" bosom can unexpectedly block many conventional naval cannon attacks in battle."
