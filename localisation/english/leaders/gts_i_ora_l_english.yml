  # 突然间，却感觉到，不断摇曳的裙摆处，却突然伸出了巨大的手掌，似乎要好好抓住自己这只不慎落入 maiden的裙底的小虫子。\"不行，不能被她抓到......\"我灵机一动，在对方的手指即将触碰到自己时 -  - 我立刻跳了下来，随后弹出气囊，在阿卡菈伸出的指尖当做跳板，对着 maiden那白皙的腿扑去，随后，我双手抓住伞柄，对着对方的腿猛的一戳。一瞬间，我甚至能感觉到 maiden的脚步都产生了一丝动摇。看来有效！我连忙在这巨大的白色肉柱上爬过来爬过去，柔软的触感使得自己只好抱的更紧了一些。只是......我不知道的是，就是这看上去像是拼尽全力的一戳，对于她而言，却和被针戳一下的结果没什么区别，可能会稍微刺激一下，但绝对论不到疼的地步。只是这一下，却彻底地惹急了阿卡菈，是啊，戏弄虫子反倒被虫子咬了一口，那这个虫子可要承担这个 maiden的怒火了哦。而就在我怀疑她接下来要做什么的时候，却突然感到眼前一黑 -  - \n\"轰 -  - \"\n花了好长时间，终于从刚刚那巨大的轰鸣声缓过来，却发现我早已身处阿卡菈的双腿中间，而此时，唯一的出口早已被对方拿手堵住，而唯一的入口......我可以选择不进去吗？对方在面对小人在自己的腿上到处爬来爬去的做法竟然不是伸手去摸，而去选择了更为简单粗暴的做法 -  - 直接坐在了下面还满是人群的城市里。一瞬间，整个城市都因此而生灵涂炭。\n\"怎么样啊，现在还想跑吗？你要是想进这个里面咱也不反对就是的啦......\"\n没有办法，自己只能被她捏了起来。\"不是谁要进去这里啊！\"我鼓着腮帮子，刚想站起身，却被阿卡菈一根指头就按了下去。随后，整个人都被捏了起来。\"好了，橘子长不要再浪费这么多时间了，反正到了最后，你也逃不掉被咱吃掉的命运不是吗？没事的，咱会保证，会让你在被咱吃掉的过程中，变得稍微那么舒服一点......\"\n\"不......不要！\"没有任何反应时间，这一次，对方的舌头直接卷住了自己，将自己拖入了那粉嫩的口腔中。\"呃啊啊啊 -  - \"身处在阿卡菈的牙床中，我将雨伞撑在了那两颗牙齿中间，面对对方的牙齿，像粉碎机一般的挤压，细弱的伞柄看上去随时都像是岌岌可危的样子。不行，这样的话......随着牙床开始挪动，我将伞柄一斜，整个身体开始往后滑去，随后将伞收回的一瞬间，只听到\"轰！\"的一声，那宛如锻造锤一般的牙床也在这个时候合拢，而没等自己反应过来的时候，却发现，我早已站在了......\n\"结局已定，你已经输了，在咱被吃掉之前......橘子长还有遗言吗？\"\n还没等我反应过来，自己早已被阿卡菈的舌头卷入了其中。我不停地拿着伞戳着，可是现在的情况下，似乎一点作用都没有了。只是......真的没有办法了吗？而这个时候，我却突然想了起来，手机？我打开手机，却看到了这样一个消息：\n§L\"橘子长已经表现的足够好了哦，接下来......\"§!
  gts_ora.1319.desc: ""Suddenly, I felt a huge hand reach out from beneath the swaying hem of her skirt, as if it were about to grab hold of me - this little bug that had accidentally fallen under the girl's skirt. \"No, I can't let her catch me...\" A sudden idea struck me, and just as her fingers were about to touch me - I immediately jumped down, deployed my airbag, used Akara's outstretched fingertips as a springboard, and lunged toward the girl's fair legs. Then, I grabbed the umbrella handle with both hands and jabbed it hard against her leg. For a split second, I could even feel the girl's footing waver slightly. It seemed to work! I quickly scrambled up and down this massive white column of flesh; its soft texture made me cling to it even tighter. But... what I didn't realize was that this jab - which looked like I was giving it my all - was, to her, no different from being pricked by a needle. It might have been slightly irritating, but it certainly didn't amount to pain. But that single thrust thoroughly infuriated Akara. After all, when you tease a bug only to get bitten by it, that bug is bound to bear the brunt of the girl's wrath. Just as I was wondering what she was going to do next, everything suddenly went black before my eyes - \n\"Boom - \" \nIt took me a long time to finally recover from that massive roar, only to discover that I was already trapped between Akara's legs. By then, the only exit had long been blocked by her hand, and as for the only entrance... did I even have a choice but to go in? Faced with a tiny person crawling all over her legs, she didn't reach out to grab it - instead, she opted for a much simpler, more brutal solution: she simply sat down right on top of the city teeming with people below. In an instant, the entire city was reduced to ruins.\n\"Well? Still want to run now? If you want to go inside here, I won't stop you, really...\"\nI had no choice but to let her pick me up. \"It's not like I wanted to go in here!\" I puffed out my cheeks, just as I was about to stand up, only to be pushed back down by a single finger from Akara. Then, my whole body was lifted up. \"All right, Ora, stop wasting so much time. In the end, you can't escape being eaten by me, can you? Don't worry - I'll make sure the process of me eating you is at least a little bit comfortable...\"\\ n\"No... don't!\" Without a moment to react, this time her tongue wrapped directly around me, dragging me into that pink, tender mouth. \"Ugh, aaaah - \" Trapped between Akara's teeth, I wedged the umbrella between them. Facing the crushing pressure of her teeth - like a shredder - the slender umbrella shaft looked as if it could snap at any moment. No, this won't do... As her jaws began to shift, I tilted the umbrella shaft, and my entire body started sliding backward. Just as I pulled the umbrella back, there was a \"BOOM!\" - those jaws, like a blacksmith's hammer, snapped shut at that very moment. Before I could even react, I realized I was already standing...\\ n\"The outcome is sealed; you've already lost. Before I get eaten... do you have any last words, Ora?\"\nBefore I could even react, I'd already been swept up by Akara's tongue. I kept poking at her with the umbrella, but in this situation, it seemed to be completely useless. But... was there really no way out? Just then, it suddenly occurred to me - my phone? I unlocked it and saw this message:\n§L\"Ora has done well enough. Next...\"§!""
