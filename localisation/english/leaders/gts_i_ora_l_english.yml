  # 我很幸运，我幸运的原因是碰到了这样一个对自己如此温柔的主人。哪怕这份名为\"记忆\"的拼图早已被\"忘却\"这个贪吃的巨娘吃掉了大半。但是，眼前这位叫做白安的 maiden，却将这份空洞填补，让破碎的内心重圆。\n \"放学了放学了！\"\n  指针恋恋不舍地划过\"5\"这个数字，急促的脚步声此起彼伏，是青春挣脱牢笼的乐章。而我，本该无缘，却被 maiden捏在手里，放在了胸前距离心脏最近的兜里。\n \"不要随便探头哦，被发现了的话......开玩笑啦~想看就看吧。\"\n  探出头来，属于自己的小小世界被无限放大。风很大，带着呼呼的声响，吹在人的心上却痒痒的。周边的景象在飞快的掠过，有种在高速飞行的感觉。我伸出手，却怎么也抓不住。不过也好，毕竟过去无法改变，我们能够做的，不也只能是拥抱现在去守望那不可知的明天吗？\n \"呜......头好乱......\"\n  我抬起头，乌黑的短发遮蔽了 maiden的脸颊，只能隐隐约约地看到下巴处，想伸出身体往下看，努力保持着不要掉下去的姿势，却被 maiden一根指头按了下去。\n \"在骑车哦~掉下去咱不好找捏~\"\n \"呜......摸头会长不高的......咱都已经这么小了......\"\n  单车沿着小路骑行着，空气中夹杂着泥土和雨水的清新。在这样的颠簸中，我躺在了里面。此刻，只需要等待，等待 maiden回到她的家中。\n \"出来了哦~嗯？小橘这就睡着了？\"\n  睡眼惺忪中，睁开眼才发现自己躺在 maiden粉的床上，白安的身影就在前方，抬起头却只能看到那两条修长的双腿上那不断摇曳着的jk短裙。一时间，心里却萌生出了一种想要接近的感觉，可没走两步，松软的床垫却让自己不小心摔了一跤。还没等我再次起来，就感觉衣服被拽了起来，整个人开始脱离地面。\n \"都回家了，要不......想和姐姐玩一下吗？
  gts_ora.1018.desc: ""I'm lucky - and the reason I'm lucky is that I've found an owner who's so gentle with me. Even though most of this puzzle called \"memory\" has long been devoured by that gluttonous Giantess named \"Oblivion,\" the young girl standing before me, Bai An, has filled that void and mended my broken heart.\n \"School's out! School's out!\"\\ n  The clock's hands reluctantly swept past the number \"5,\" and the sound of hurried footsteps rose and fell - a symphony of youth breaking free from its cage. As for me, I should have been left behind, but the girl clutched me in her hand and placed me in the pocket closest to her heart, right against her chest.\n \"Don't peek out carelessly, okay? If you get caught... just kidding~ Go ahead and look if you want.\"\n  I poked my head out, and my own little world was magnified infinitely. The wind was strong, whistling as it blew - yet it tickled my heart. The scenery around me was whizzing by at breakneck speed, giving me the sensation of flying at high speed. I reached out, but no matter how hard I tried, I couldn't grasp it. But that's all right - after all, the past cannot be changed. Isn't all we can do to embrace the present and look forward to that unknown tomorrow?\n \"Ugh... my head feels so dizzy...\" \n  I looked up. Her short, jet-black hair obscured the girl's cheeks; I could only vaguely make out her chin. I tried to lean forward to look down, straining to keep my balance so I wouldn't fall, but she pressed me back down with a single finger.\n \"We're riding a bike, you know~ If you fall off, it'll be hard to find you~\"\n \"Ugh... If you touch my head, I won't grow any taller... I'm already so small...\"\\ n  The bike rode along the narrow path, the air fresh with the scent of dirt and rain. Amid the bumpy ride, I lay back inside. All I had to do now was wait - wait for the girl to return home.\n \"I'm out~ Hmm? Little Orange's already fallen asleep?\"\\ n  Through sleepy eyes, I opened them only to find myself lying on the girl's pink bed. Bai An's figure was right in front of me, but when I looked up, all I could see were those two slender legs and the constantly swaying JK skirt. For a moment, a desire to get closer welled up inside me, but after taking just a couple of steps, the soft mattress caused me to stumble and fall. Before I could get back up, I felt my clothes being tugged, and my whole body began to lift off the ground.\n \"Everyone's gone home. How about... do you want to play with your big sister?\"""
