  #  想听听你的故事
  gts_ora.10.a: "I want to hear your story."
  #  “故事吗……乐意效劳呢。”\n少女翻开书页。\n“都在这里了，想听什么呢？”
  gts_ora.101.desc: "\"A story? I'd be glad to.\"\\nThe girl flips through the pages of a book. \\n\"It's all here. What would you like to hear?\""
