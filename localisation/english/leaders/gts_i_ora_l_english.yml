  #  “好久不见，大家好哦”\n“停更已久的■■■，现在，化身为‘巨大娘’归来了哦~”\n浅橘色的双麻花辩，却因为某个渺小的信仰，在整个星球上空浮现。整个天空宛如一块全息屏幕，而这次她的观众，则有惊人的90亿。\n“好了好了，不要害怕，也不要用任何武器……咱是不会伤害大家的……”少女简单的进行了自我介绍后，消失在了群星中。而她也在寻找着一个答案，一个世间的第一问：\n“我是谁？”\n\n“我是‘收获’，是那个人所追逐的明天……”\n如今，人已然不在，少女踏在了城市群中，一切都在那个人的想象中，却再也没见到其身影。\n有点……讽刺。\n她循着仍然存在的记忆，来到了一处旧居民楼，早已收敛些许大小的身体，却仍然有十层楼那般高，不过还好，足够了，至少能蹲下来看一下，房间里都有些什么样的存在了。\n“我循着过去，但过去的相片不属于我……”\n“她拒绝了我。那我是谁？”\n\n“老板……这个手账本多少钱？”\n“五块……啊怪物啊！！”\n少女堵住了整个街道，只是一家文具店，在她眼中和一个烟盒差不多大小。老板惊恐的眼神中，看着被少女那加厚的鞋底堵住的门口，堵住了唯一能够逃跑的希望。\n“抱歉啦……咱最小也就这样大了……钱给你……小人的收款码有点难扫……”\n接过了和指甲盖大小的手账本后，却突然因为少女的力量，变得适合少女使用的大小。少女拿起了事先准备好的笔，坐在一处荒废的大楼上，看着远处的城市发呆。\n“我的故事……我自己写下来吧。”\n\n你拾起找到的残页，将一切都抄在了这个手账本中。你不知道这样做的意义为何，只是冥冥中有一种感觉……
  gts_ora.1010.desc: "\"Long time no see. Hello, everyone.\"\\n\"■■■, who has been on hiatus for so long, has now returned in the form of a 'giant girl'~\"\\nThe light orange twin braids appeared over the entire planet because of one tiny faith. The whole sky was like a holographic screen, and this time her audience numbered an astonishing 9 billion.\\n\"All right, all right. Do not be afraid, and do not use any weapons... I will not hurt anyone...\" After the girl gave a simple self-introduction, she vanished into the stars. And she, too, was searching for an answer, the first question in all the world:\\n\"Who am I?\"\\n\\n\"I am the 'harvest,' the tomorrow that person pursued...\"\\nNow, that person is already gone. The girl steps through the urban cluster. Everything is as that person imagined it, yet the person herself is nowhere to be seen.\\nIt is a little... ironic.\\nFollowing the memories that still remain, she arrives at an old residential building. Her body has already shrunk somewhat, but is still as tall as a ten-story building. Fortunately, that is enough. At least she can crouch down and see what is inside the room.\\n\"I follow the past, but the photographs of the past do not belong to me...\"\\n\"She rejected me. Then who am I?\"\\n\\n\"Boss... how much is this journal?\"\\n\"Five yuan... ah, a monster!!\"\\nThe girl blocks the entire street. It is only a stationery store, about the size of a cigarette box in her eyes. In the owner's terrified gaze, the door is blocked by the girl's thickened shoe sole, cutting off the only hope of escape.\\n\"Sorry... This is as small as I can get... Here is the money... Little people's payment QR codes are a little hard to scan...\"\\nAfter receiving the journal, which is about the size of a fingernail, it suddenly becomes a size suitable for the girl to use because of her power. The girl picks up the pen she prepared beforehand, sits on an abandoned building, and stares blankly at the distant city.\\n\"My story... I will write it myself.\"\\n\\nYou pick up the remaining pages you found and copy everything into this journal. You do not know what meaning there is in doing this. You only have a faint feeling, as if guided by something unseen..."
