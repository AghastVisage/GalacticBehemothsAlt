  # \"嗯？醒来了，还有你这一身......耍杂技吗？\"\n这里......我出来了？抬头看了一眼周围，和平日里见到的街道一样，同样的人群，同样的车流，以及......同样那湛蓝的天空。\n \"都这个时候了，还不能以真面目示人吗？我紧紧握住伞柄，准备好和对方的殊死对决。\"阿卡菈......\"我对着天空大喊道：\"你陷的太深了！在我将你敲醒之前......\"\n话音未落，那个和自己如此相似的身影从空中缓慢下落，落地时掀起了巨大的冲击，周围的建筑物无一幸免。\n\"变成了我的'二进制'了还在出言不逊，还是说......\"\n\"这么辛苦地想从我为你准备的温室中出来......就只为了见咱一面吗？不如说......橘子长是想要了？\"\n\"我不是我没有！\"我向后退了两步，那白色和浅橘构成的厚底运动鞋就只是静静站在这里，周围最高的大楼甚至都没有她那4cm厚的鞋底那么高。如此强大的压迫感，虽然还是存在胆怯，虽然还是有可能会被她一脚踩死，但是......已经顾不上这么多了。我打开伞，只是轻轻一跳，强大的气流将自己带到了几百米的高空。然而，这样的高度下，却只能堪堪到达了她的裙摆处。\n\"在被咱彻底享用前，橘子长，就没有什么要和咱说说的吗？毕竟......你现在还能活蹦乱跳的时候可是不多了呢~\"\n沿着不断摇动的裙摆不断爬着，看到阿卡菈伸出来的手指，我刚想逃避，可身体却像是凝滞一般动不了。\"这是......你怎么还能......\"在我惊骇的眼神中，被对方捏了起来，显然，对方如今有了自己的模样，相对应的，也拥有了自己的能力了。\n\"咱们好好谈一下嘛，橘子长？还是说，你真的觉得就凭咱给你的这一柄伞，就能改变你身为小人和咱的差距吗？\"\n身体被捏住，那柄长伞也滑落在阿卡菈的指缝间。此时此刻，对方似乎还没有要将自己置于死地的地步，或许......自己对她的威胁还没有那么大吧。那么......接下来要做的，恐怕是只能拖延时间就是了。\"你......你现在怎么这么变态啊！打扮成我的模样把我困在这里自己取而代之......不会就是为了看咱在她们手里挣扎的样子吧！\"\n\"橘子长觉得是就是吧，只是......比起看来说，咱还是想亲自做一下......\"\n阿卡菈那微微垂下的眼眸突然闪过一丝异样的光亮，很快，捏着自己的手指也距离她的脸颊越来越近。这......就算不是第一次了，自己真的是第一次感觉到，自己给小人带来的压迫感，如今却是身临其境地感受到，那种对方明明对你放水了却完全无法翻身的绝望感。\"你......想做什么？就算玩也能不能换身打扮啊，这种自己被自己玩弄的感觉可不要 -  - \"我连忙挣扎着，双腿不断地踢着对方已经凑过来的脸颊。可是......有什么用吗？鞋子都差点被踢掉了，对方的脸却一点痕迹都没有，而且......这不也算是自己打自己的脸吗？\n\"算了，给你一点点机会吧，只不过代价嘛......\"\n\"就是被咱弄死了，可是再也回不去了哦~\"
  gts_ora.1119.desc: ""\"Huh? I'm awake. And look at what you're wearing... Are you performing acrobatics?\"\nHere... I'm out? I looked up at my surroundings - it was just like the streets I saw every day: the same crowds, the same traffic, and... the same deep blue sky.\n \"It's this late already - can't you show your true face yet?\" I gripped the umbrella handle tightly, preparing for a life-or-death showdown with my opponent. \"Akara...\" I shouted toward the sky, \"You've gone too far! Before I knock some sense into you...\"\\ nBefore I could finish, that figure - so strikingly similar to myself - slowly descended from the sky, creating a massive shockwave upon impact that left not a single building in the vicinity unscathed.\n\"You've become my 'binary' and you're still talking back - or is it that...\"\\ n\"You went to all that trouble to break out of the greenhouse I prepared for you... just to see me? Or rather... do you want Ora?\"\n\"No, I don't! I didn't!\" I took two steps back. Those thick-soled sneakers - a blend of white and pale orange - stood there motionless; even the tallest building nearby wasn't as high as her 4-centimeter-thick soles. The sense of oppression was overwhelming. Though I still felt a twinge of fear - and though there was still a chance she could crush me with a single step - I couldn't afford to worry about that anymore. I opened my umbrella and took just a light leap; a powerful air current carried me hundreds of meters into the air. Yet, even at that height, I could barely reach the hem of her skirt.\n\"Before I thoroughly enjoy you, Ora, isn't there anything you'd like to say to me? After all... you won't be able to run around like this for much longer~\"\nAs I kept climbing along her constantly swaying skirt, I saw Akara's outstretched finger. I tried to dodge, but my body felt frozen in place, unable to move. \"What's this...? How can you still...\" Amid my horrified gaze, she pinched me. Clearly, she had now taken on her own form and, accordingly, possessed her own abilities. \n\"Let's have a proper chat, Ora. Or do you really think that just because I gave you this umbrella, it'll bridge the gap between you - a Tiny person - and me?\"\\ nWith my body pinned, the long umbrella slipped through Akara's fingers. At this moment, she didn't seem intent on killing me - perhaps... I wasn't that much of a threat to her after all. So... all I could do now was buy some time. \"You... why are you being so twisted right now! Dressing up like me, trapping me here, and taking my place... you aren't just doing this to watch me struggle in their hands, are you!\"\n\"If Ora thinks so, then so be it. It's just... rather than watching, I'd rather do it myself...\"\\ nA strange gleam suddenly flashed in Akara's slightly lowered eyes, and soon, the fingers she was clenching drew ever closer to her cheek. This... even though it wasn't my first time, it was truly the first time I'd felt the sense of oppression I usually inflicted on Tiny persons - now I was experiencing it firsthand: that despair of being completely unable to break free, even when the other person was clearly going easy on you. \"What... are you trying to do? Even if we're just playing around, couldn't you at least change your outfit? I don't want this feeling of being toyed with by myself - \" I struggled frantically, kicking out with my legs at her face as it drew closer. But... what good would it do? I nearly kicked my shoes off, yet there wasn't a single mark on the other person's face. Besides... wasn't this just like slapping my own face?\n\"Fine, I'll give you a tiny chance. But the price...\"\n\"Is that I'll kill you - and you'll never be able to go back, you know~\"""
