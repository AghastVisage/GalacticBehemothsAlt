  #  maiden的清心寡欲
  gts_trait_ora3: "Vertical Take-off/Landing Platform"
  # $gts_trait_ora3_picture$作为天体级巨娘......橘子长消耗的资源要显著低于其她巨娘......甚至达到了普通巨娘的水准。\"够用\"，这是她唯一的解释。不过吧，这样确实为帝国捉襟见肘的资源提供了很大的帮助。
  gts_trait_ora3_desc: "$gts_trait_ora3_picture$Due to her 'expansive' flatness, many refer to her as the 'Orange Board.' While she responds with a 'hiss,' she is surprisingly tolerant of it. Perhaps for tiny people, even if they protest out loud, they are secretly quite willing to settle here ()."
  # \n\n\n\n£gts_trait_ora3_picture£ \n\n\n\n\n
