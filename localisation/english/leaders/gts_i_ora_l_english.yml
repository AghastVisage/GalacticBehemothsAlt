  # \"一个没注意，竟然让咱最'特殊对待'的小人跑掉了呢......\"\n\n或许自己的动作太过明显，还是如今如此渺小的我都没能躲过花田的视线，看着对方一点点向自己逼近，在桌角处的我立刻挣脱开巧克力的束缚，我抬头看着桌子的边缘，正好到了花田那海蓝的裙摆处，那白皙的双腿此时虽然只能看到绝对领域的位置，可就这高度，却已经是自己高不可攀的程度了。而顺着裙摆向上看，白色衬衣勾勒着自己无法理解的弧线，而在这上面，花田那冒着蓝光的瞳孔中，似乎......如果自己不跑的话，想必此时的自己太小以至于没有让她看出自己是谁吧。就在我看着周围一望无际没有一丝躲藏点的桌面不知如何是好时 -  - \n\n\"你说人生能不能放过我这一次~\"\n\n大运？为什么这里会突然出现一辆大运，但是无论如何 -  - 跑吧。我飞身上车，没有想那么多，只是一脚地板油，随后只听到\"轰\"的一声，那巨大的手指宛如两根擎天巨柱一般，在后面引发了剧烈的震动。不行！这样下去，就算这是大运，可在花田这几乎碾压的大小下，恐怕自己也只有当成虫子被碾碎的命......\"往城市开！\"看到不远处的城市，我心一横，猛打方向盘。\"那对不起了，有什么事跟花田说去吧！\"\n\n\"轰！\"\n\n就算是在国道上把人当减速带的大运，在这堪比定海神针的食指面前也只能乖乖截停。而伴随着一阵剧烈的失重感后，看到的却是花田老师那微微扬起的嘴角，以及那蓝色欧泊一般的眼眸。\"完了，要开罐即食啦！\"我闭上眼睛，能听到对方将后面货箱捏扁的动静，以及车门被突然掀开所吹过来的气流，都已经在表明了自己的结局。只是就在我闭上眼，认为一切都要完蛋的时候 -  - \n\n\"橘子长？橘子 -  - 长 -  - \"\n\n意识突然回到清醒中，我睁开眼，却发现小花田已经来到了城市中，并且不知为何，自己已经顺着游离的意识，宛如逃命一般逃到了街区里。\n\n\"是昨晚上没睡好吗......咱刚刚看到橘子长直接......都开始梦游了......\"
  gts_ora.4207.desc: ""\"I wasn't paying attention for a second, and the Tiny person we've been giving the most 'special treatment' actually got away...\"\\ n\nPerhaps my movements were too obvious, or maybe even someone as insignificant as I am couldn't escape HuaTian's gaze. As I watched her inch closer to me, I immediately broke free from the chocolate's grip at the corner of the table, I looked up at the edge of the table, which happened to be right at the hem of HuaTian's sea-blue skirt. Although I could only see her fair legs up to the \"Absolute Territory\" level, even at this height, she was already completely out of my reach. Looking up along the hem of her skirt, a white blouse traced curves I couldn't begin to understand. And above that, in HuaTian's blue-glowing pupils, it seemed... if I didn't run, I must be too small right now for her to recognize who I am. Just as I was staring at the endless tabletop - with not a single hiding spot in sight - and wondering what to do - \n\n\"Do you think life might spare me just this once~\"\n\nA Dayun? Why did a Dayun suddenly appear here? But no matter what - I had to run. I leaped into the car without a second thought, slammed the accelerator to the floor, and immediately heard a \"boom\" - those massive fingers, like two colossal pillars reaching to the sky, sent violent tremors rippling through the air behind me. No way! At this rate, even if this is a Dayun, given how much larger it is than HuaTian - it's practically crushing it - I'm probably doomed to be squashed like a bug... \"Head for the city!\" Spotting the city in the distance, I steeled myself and yanked the steering wheel hard. \"Sorry about that - if you've got a problem, take it up with HuaTian!\" \n\n\"Boom!\"\n\nEven Da Yun, who treated people like speed bumps on the highway, had no choice but to come to a screeching halt in the face of that index finger, which stood as solid as the Divine Pillar of the Sea. And after a sudden, intense sensation of weightlessness, all I saw was Teacher HuaTian's slightly upturned lips and those eyes, as blue as an opal. \"It's over - I'm about to be opened like a can of food!\" I closed my eyes. I could hear the sound of him crushing the cargo box in the back, and the rush of air from the car door being suddenly flung open - all signs that my fate was sealed. But just as I closed my eyes, convinced that everything was about to end - \n\n\"Ora grows? Ora - grows - \" \n\nMy consciousness suddenly snapped back to reality. I opened my eyes to find that Tiny HuaTian had already arrived in the city, and for some reason, my wandering mind had led me to flee into the neighborhood as if my life depended on it.\n\n\"Did I not sleep well last night... I just saw Ora and... I actually started sleepwalking...\"""
  # 没...没什么。
  gts_ora.4207.a: ""N-no... nothing.""
  # 
  gts_ora.4208.name: """"
  # \"那就好......这是给你的伴手礼...好像这个星球的习俗是这样的，如果我还记得的话。\"\n\n花田手中，出现了一份包装精美的小人城市模型。似乎是用整个城市一比一缩小的，可以让一些体型不大的巨娘过一把破坏城市的瘾。\"那个......那已经是很久以前了......而且这颗星球的原住民...都不知道飞到哪里去了。\"\n\n橘子长还能记得那一天所诞生的景象，在自己离开这颗孤星的十几年后，这颗无人在意的孤星却还是没能逃过巨娘的视界。然而，即使是再普通不过的高大巨娘，这颗星球的存在却如分子生物一般渺小......甚至连反抗的余地都做不到......\n\n橘子长还记得，就在公元历2049年，这颗上面插了半根吸管的星球，做出了最后且最悲壮的决定：
  gts_ora.4208.desc: ""\"That's good to hear... Here's a little souvenir for you... I think that's the custom on this planet, if I remember correctly.\"\\ n\nA beautifully packaged miniature city model appeared in HuaTian's hand. It seemed to be a one-to-one scale replica of the entire city, allowing smaller-statured Giantesses to indulge their urge to wreak havoc on a city. \"Um... that was a long time ago... and the native inhabitants of this planet... who knows where they've gone.\"\ \n\nOra could still recall the scene from that day. More than a decade after she had left this lonely planet, this neglected, uninhabited world still hadn't escaped the Giantess's field of vision. Yet, even to the most ordinary of Giantesses, this planet's existence was as insignificant as a molecular organism... It didn't even have the chance to put up a fight...\n\nOra still remembers that in the year 2049 AD, this planet - with half a straw stuck in it - made its final and most tragic decision:""
  # \"火种\"
  gts_ora.4208.a: ""\"The Spark\"""
  # 
  gts_ora.4209.name: """"
  # \"火种计划\"，将这颗星球所有还留存希望的人类聚集起来，作为\"火种\"，以这根巨娘留下的吸管作为发射架，将人类的希望发射至几千万光年后的世界。然而，能选择成为\"火种\"的小人有限，船体的容量也难以让所有的人类逃离这个早已成为巨娘玩具的星球。\n\n而剩下的人......则要和这个星球一起，伴随着这个孤星的最后一颗钴弹，从这个世界抹除。\n\n\"其实吧......可能大家都认为，能成为\"火种\"是很幸运的存在，只是......完全知道真相的人从不会这么想......因为这压根不是存活，而是延续 -  - 因为这个星球直到毁灭都做不到长时间的星际航行，所以那些\"火种\"只能焚尽此身，所剩的只有所谓的一个数据 -  - 一小段象征着执念所在的DNA片段，只为了能在未来的某一天......能凭借着自身的执念化作信仰中的模样......\"\n\n我平静的说完这些，仿佛这些事情都是自己亲身经历过一般，虽然......自己早在此之前就离开过这个星球，但是在听到如此悲壮的消息后，自身还是没能平静下去。然而小花田在听到这样的讯息后，眼角却是噙满了泪水。似乎......感同身受。\n\n\"要是......要是咱们能早点发现你们这颗星球就好了......\"小花田的声音几乎哽咽。\"虽然......我们的星球就算加在一起都不能说明什么......但至少，我们无论如何都不会让你们做出这么绝望的决定......\"\n\n没错，小花田的故土也曾遭受过巨娘的袭击，并且连反抗的能力都不存在。孤注一掷的选择总有些共同的呐喊，但是如今，在自己已经站在这个星球之上，这个早已沦为\"孤星监狱\"的星球中时......也早已对这些释然。
  gts_ora.4209.desc: ""The \"Spark Project\" aims to gather all the humans on this planet who still hold onto hope, designating them as \"sparks.\" Using the straw left behind by the Giantess as a launch pad, it will send humanity's hope to a world tens of millions of light-years away. However, only a limited number of Tiny persons could be chosen to become \"Seeds of Hope,\" and the ship's capacity was insufficient to allow all of humanity to escape this planet, which had long since become the Giantess's plaything.\n\nAs for those left behind... they would be wiped from existence along with this planet, along with the last cobalt bomb of this lonely star. \n\n\"Actually... everyone probably thinks that becoming a 'Spark' is a stroke of luck, but... those who fully know the truth would never think that way... Because this isn't survival at all - it's continuation. Since this planet is incapable of sustained interstellar travel even as it faces destruction, those 'Seeds of Fire' must burn their very beings to the ground, leaving behind nothing but a so-called data point - a small fragment of DNA symbolizing their obsession - all so that one day in the future... ...to transform, through their own obsession, into the form of their faith...\"\n\nI spoke these words calmly, as if I'd experienced all this firsthand. Although... I'd actually left this planet long before this, hearing such a tragic and heroic story still left me unable to stay composed. However, upon hearing this news, Tiny HuaTian's eyes welled up with tears. It seemed... as if she could feel their pain herself.\n\n\"If only... if only we'd discovered your planet sooner...\" Tiny HuaTian's voice was almost choked with emotion. \"Even though... our planets combined wouldn't amount to much... at the very least, we would never, under any circumstances, let you make such a desperate decision...\"\n\nThat's right - Tiny HuaTian's homeland had also suffered an attack by the Giantess, and they hadn't even had the strength to fight back. Desperate choices always share a common cry, but now, standing on this planet - this world that had long since become the \"Lone Star Prison\" - she had long since come to terms with all of that.""
  # \"你知道......橘子花的花语吗？\"
  gts_ora.4209.a: ""\"Do you know... what the orange blossom symbolizes?\"""
  # \"橘子花的花语\"
  gts_ora.4210.name: ""\"The Meaning of Orange Blossoms\"""
  # \"诶？\"\n\n在听到这样的话语后，小花田显然楞了一秒。很显然，说起橘子......人们只在乎其果实，还从未有什么人真正在乎过在结出果实之前，那朵白粉色的小花究竟会做些什么。\n\n\"我或许......就是这样的存在吧，平平无奇，破绽百出。\"橘子长闭上眼，却看到了那虚拟的牢笼内，一个 maiden在一处角落用一只断掉的笔头写着什么。对啊，或许这样的人，这样什么都做不到的一个存在，就算将生命付之一炬，都走不出巨娘手指从这头划到这头的距离......\n\n\"就算自己所做的任何事情，在最后结出'果实'之前都不会被任何人看见......\"
  gts_ora.4210.desc: ""\"Huh?\"\n\nUpon hearing those words, Tiny HuaTian clearly froze for a second. Obviously, when it comes to oranges... people only care about the fruit; no one has ever really cared about what that little white-pink flower actually does before it bears fruit. \n\n\"Maybe... that's exactly what I am - ordinary and full of flaws.\" Ora closed her eyes, yet inside that imaginary cage, she saw a young girl in a corner writing something with the broken tip of a pen. That's right - perhaps someone like this, a being incapable of accomplishing anything, could not even escape the distance of a single stroke of a Giantess's finger, even if she were to burn her life to ashes...\n\n\"Even if nothing I do is ever seen by anyone before it finally bears 'fruit'...\"""
  # 那就想办法，将信仰去交给\"时间\"吧。
  gts_ora.4210.a: ""Then find a way to entrust your faith to \"time.\"""
  # 文物考察
  gts_ora.4211.name: ""Archaeological Survey""
  # 此后的文化考察工作......也算是比较顺利。毕竟同为天体级......小花田对待星球内小人的态度也是比较温柔的。\n\n\"妈妈，妈妈！那个蓝色的大姐姐让咱们往她的那个地方钻了......就是裙子底下的那个地方！\"\n\"还有那里！还让咱们在她的胸部上跳来跳去了！和蹦床一样！橘子长从来都没让咱们做过这些......\"\n\n虽然计划十分轰轰烈烈，但那颗未引爆的钴弹终究还是让小花田排除了隐患。\"看来......就连孤注一掷的选择都没有啊......\"小花田的脸上虽然惋惜，但还是对橘子长的身体表示好奇，毕竟......\n\n\"这根吸管的最下面......竟然插着这颗钴弹的附近......难怪辐射量已经趋近为0了......难道说？\"\n\n难怪能在星球里尝到一点点奇怪的味道......而花田将那颗象征着人类最后希望的钴弹搬走之后，却看到下面压着的，一辆老旧的集装箱内，装着一封......信？\n\n纸质的信封，即使深埋地底，却仍然因风化而导致的破破烂烂。而这封信的内容......却埋下了一刻颗很惊人的种子：\n\n\"致：后来能看到这封信的人们：\n\n我们曾一度抗拒这些我们认为的现实不存在的东西......但如果还有一次机会的话......我们仍会相信，那个天外诞生的橘色巨娘，是指引这颗星球命运的长灯......\"
  gts_ora.4211.desc: ""The cultural research that followed... went relatively smoothly. After all, as fellow celestial beings... Tiny HuaTian treated the tiny people on the planet quite gently.\n\n\"Mom, Mom! That big blue sister told us to crawl into her... you know, right under her skirt!\"\\ n\"And there, too! She even made us jump up and down on her chest! Just like a trampoline! Ora has never made us do any of this...\"\\ n\nAlthough the plan was grand and ambitious, Tiny HuaTian ultimately managed to eliminate the threat posed by that unexploded cobalt bomb. \"It seems... there isn't even an option to go all in...\" Although Tiny HuaTian looked disappointed, he was still curious about Ora's body. After all...\n\n\"The very bottom of this straw... is actually stuck near that cobalt bomb... No wonder the radiation levels have dropped to nearly zero... Could it be?\"\\ n\nNo wonder I could taste a faint, strange flavor inside the planet... But after HuaTian moved the cobalt bomb - which symbolized humanity's last hope - she saw something pressed beneath it: inside an old shipping container lay a... letter?\n\nThe paper envelope, despite being buried deep underground, was already tattered and worn from weathering. And the contents of this letter... planted a seed of astonishment:\n\n\"To: Those who will read this letter in the future:\n\nWe once resisted these things we believed didn't exist in reality... But if we had one more chance... we would still believe that the Giantess born from beyond the heavens is the guiding light that shapes the destiny of this planet...\"""
  # （把小人城市放在这里）
