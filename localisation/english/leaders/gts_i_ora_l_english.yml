  gts_ora.3003.a.custom: """"
  # 不速之客的到达
  gts_ora.3004.name: ""The Arrival of an Uninvited Guest""
  # 近日，你收到了一则消息：有少量的太空海盗正集结于 群星 的外围，意图对你的帝国发动攻击。这些家伙看上去十分凶残，身躯却有着接近于泰坦级的大小，且各个配备着十分精良的装备。看来......贸然派遣一般舰队只会吃些苦头。\n\n那么......天体级的舰娘如何？你有了想让天体级的舰娘去解决此事，可到了部署的时候却突然发现：似乎这一刻，你所有的天体级舰娘，包括天体级指挥官全部被派遣至边缘星系执行任务。看来，远水解不了近渴，但是手头却并没有十分强大的舰队可以和对方抗衡，而就在这个时候......\n\n\"报告，事情已经解决了亲。\"\n\n平板内突然响起了这样一则通讯，然而通讯中声称解决了这件事的人并不是指挥官也不是科学官，而是......一个普普通通的天体级的行政官。
  gts_ora.3004.desc: ""Recently, you received a message: A small group of space pirates is gathering on the outskirts of Stars, intending to launch an attack on your empire. These creatures appear extremely vicious, are nearly Titan-class in size, and are all equipped with top-of-the-line gear. It seems... sending a standard fleet in would only lead to a beating.\n\nSo... what about Celestial-class Ship Girls? You decided to send your Celestial-class Shipgirls to handle the situation, but when it came time to deploy them, you suddenly realized: it seemed that at that very moment, all your Celestial-class Shipgirls - including the Celestial-class Commander - had been dispatched to a remote star system on a mission. It seems help from afar won't solve an immediate problem, but you don't have a fleet powerful enough at your disposal to stand up to the enemy - and just then...\n\n\"Report: The matter has been resolved, Commander.\"\\ n\nA communication suddenly rang out from the tablet, but the person claiming to have resolved the matter wasn't the Commander or the Science Officer - it was... an ordinary Celestial-class Administrative Officer.""
