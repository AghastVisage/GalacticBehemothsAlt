  #  “橘子长？”\n在经历了众多苦难中，你终于看到了橘子长的存在，但是……\n她的变化，有点太大。\n身高……天体级的身高难以界定，而身上的衣服也随之发生了变化，而外套却变得破破烂烂，上面的各种装饰也彻底遗失，只是将外套挂在了身后，一手巨剑，一手战旗，在看到你的到来后，却选择将你护在身后——即使你已经感觉到她早已力竭。\n周围没有一颗星辰，皆随战斗化为微尘，而站在橘子长对立面的，确是和如今的橘子长相同的人物——却有着靛蓝色的瞳孔。\n“你说过的，我们终有一日‘重逢’……就是这个时间段，有点不合时宜……”\n“无碍，你来的正是时候……”\n声音都变得有点疲惫，却有种抹平了棱角的成熟感。“你带来了……我的‘过去’，和……‘现在’？”你将那本手账递给了橘子长，哪怕要抵抗着天体级巨娘的引力，而橘子长也随之一笑，收下了这份原本就属于她的东西。\n“不过确实有个不合时宜的家伙……不过这一切该结束了……”\n“自我”的炉火即将熄灭，而你的到来却让其燃烧的比以往还要明亮，少女刺向伪神，身躯也逐渐变得庞大，开始逐渐覆盖星系，覆盖了数个银河，直到绵延至宇宙边界，将那个想取代自己的家伙一口吞下。\n“我曾是一个学校的普通学生……但旅程和伙伴能够让我直面神明。”\n“我也在孤星的监狱中孤身一人，但监狱外仍有联结的羁绊”\n“我知道虚构的梦终有一天消散……但却是现实外最温柔的避风港。”\n“任何生物都会恐慌，恐慌未知，恐慌强大……但总有人挺身而出。”\n“而走过了这一切的我……又有什么伪证来质疑我作为‘自我’，作为‘橘子长’的意义？”\n头顶的光环逐渐浮现，一侧的瞳孔也沦为了靛蓝。环状星系开始生成，却以少女的头部作为了恒星，绕其公转……不知道为什么，你的内心十分复杂，似乎……有些对不住这位你曾经的行政官。\n“不用担心……都解决了……还是说……现在的你，或者你，也在‘恐慌’着什么？”\n似乎是安慰你，也似乎是安慰小橘子长。总之，少女的手指将小橘子长的身躯围拢，仅仅只是一个拥抱，却让小橘子长得到了前所未有的安全感。\n“我知道……我和你都度过同一片黑暗……”\n“但是不用担心，未来是过去的未来……我走过的，你总有一天会经历到，或者经历比这精彩的多的旅程。”\n将小橘子长安抚完后，橘子长看向了你，虽然对方的体型比以往大了不少，而视线对上她瞳孔的那一刻你就明白：她仍然是你熟悉的那个存在。\n“怎么说呢……一个人任性的辞职了几十年……是不是要……”
  gts_ora.10001.desc: "\"Chief Orange?\"\\nAfter enduring countless hardships, you finally see Chief Orange's existence, but...\\nShe has changed a little too much.\\nHer height... a celestial-scale height is difficult to define, and the clothes on her body have changed along with it. Her coat, however, has become tattered and torn; all of its various ornaments have been completely lost, and she merely hangs it behind her. With a greatsword in one hand and a battle standard in the other, when she sees you arrive, she chooses to shield you behind her, even though you can already tell that her strength was exhausted long ago.\\nThere is not a single star around you. All have been reduced to dust by the battle. And standing opposite Chief Orange is indeed a figure identical to the current Chief Orange, but with indigo pupils.\\n\"You said that we would one day 'meet again'... it's just that this timing is a little inappropriate...\"\\n\"It's all right. You came at exactly the right time...\"\\nEven her voice has become somewhat weary, yet it carries a mature feeling whose sharp edges have been smoothed away. \"You brought... my 'past', and... my 'present'?\" You hand that notebook to Chief Orange, even while resisting the gravity of a celestial-scale giantess, and Chief Orange smiles as well, accepting this thing that had belonged to her in the first place.\\n\"But there really is one inappropriate fellow here... and all of this should come to an end...\"\\nThe hearthfire of the \"self\" is about to go out, yet your arrival makes it burn brighter than ever before. The girl thrusts toward the false god, and her body gradually grows vast, beginning to cover star systems, covering several galaxies, until it stretches to the edge of the universe and swallows in one bite the one who wanted to replace her.\\n\"I was once an ordinary student at a school... but the journey and my companions let me face the gods directly.\"\\n\"I was also alone in the prison of a lone star, but beyond that prison there were still bonds that connected us.\"\\n\"I know that fictional dreams will one day fade away... but they are the gentlest shelter outside reality.\"\\n\"Every living thing feels panic, panic before the unknown, panic before the powerful... but there are always those who step forward.\"\\n\"And after I have walked through all of this... what false evidence could possibly question my meaning as the 'self', as 'Chief Orange'?\"\\nThe halo above her head gradually emerges, and one of her pupils also falls into indigo. Ring galaxies begin to form, using the girl's head as their star and orbiting around it... For some reason, your heart feels very complicated, as if... you have somewhat wronged this former administrator of yours.\\n\"Don't worry... it's all resolved... Or could it be that the current you, or you, are also 'panicking' over something?\"\\nIt seems to be comforting you, and also comforting little Chief Orange. In any case, the girl's fingers gather around little Chief Orange's body. It is only an embrace, yet it gives little Chief Orange an unprecedented sense of safety.\\n\"I know... you and I both lived through the same darkness...\"\\n\"But don't worry. The future is the future of the past... The road I have walked, one day you will experience it too, or experience a journey far more wonderful than this one.\"\\nAfter soothing little Chief Orange, Chief Orange looks toward you. Although the other party's body is much larger than before, the instant your gaze meets her pupils, you understand: she is still the existence you know so well.\\n\"How should I put this... after willfully resigning for several decades all by myself... shouldn't I...\""
