  # 不明柱状物体
  gts_ora.2.name: "Unidentified Cylindrical Object"
  # \"太壮观了......或许我应当拍照纪念一下......\"\n从探测器取回来的图像可以看出，整个海域最令人显眼的地方，被一根直插天际的白色圆筒占领，令人惊叹至于，也在怀疑这根天外来物的用意：毕竟......哪怕不需要想象，从整个星球的样貌就可以看出 -  - 是一整根白色吸管，插进了整个星球中。\n\"筒壁的材质为聚合物，凭借现有技术很容易就能钻探出被埋藏在里面的大量矿产资源。只不过......我们仍在怀疑，这个怎么看都在将星球当做饮品的家伙......她的大小恐怕......\"\n话语尚未说完，却被恐惧强制阻断了通讯。至于这根看上去像是吸管的东西究竟是何人所为，恐怕还需要进一步的调查。
  gts_ora.2.desc: "\"It's magnificent... perhaps I should take a photo for memory's sake...\" \nThe images retrieved from the probe show that the most conspicuous spot in the entire sea is occupied by a white cylinder shooting straight into the heavens. While breathtaking, it also raises questions about the intent of this extraterrestrial visitor. After all... one doesn't even need to imagine it; from the planet's appearance alone, it's clear - a gigantic white straw has been plunged into the entire world. \n\"The material of the cylinder's wall is a polymer; with existing technology, we can easily drill into it to extract a vast amount of buried mineral resources. However... we are still wondering about the entity that, from any angle, appears to be using the planet as a beverage... Her size, I fear...\" \nThe report was cut short by panic, abruptly ending the communication. As for whose work this 'straw' actually is, that will likely require further investigation."
  # 立刻进行开采作业！
  gts_ora.2.a: "Initiate mining operations immediately!"
  # 吸入
  gts_ora.3.name: "Inhalation"
  # 整根吸管宛如一个天然的开采站般，在开采资源进行的如火如荼的时候 -  - 却突然出现了强烈的失重感。\n\"引力在一瞬间反转，仪表全部失灵，前方的光芒晦暗，身后却是阵阵蠕动的漆黑......我突然意识到一个很严重的问题，可心里的恐慌在不断的催促着自己否决这已经既定的事实。但是没有用，毕竟在打开这个潘多拉的盒子之前，我们都应该清楚一件事 -  - \n这根\"吸管\"的主人，她存在，且如今，自己早已被她连同整个星球的资源一起被她......\n所有仪表全部失灵，周围一片暗红，却总感觉能够听到轻微的蠕动声，等同宇宙间频率的共鸣。我们不知道能坚持多久，却早已知道自己已然不可能获救 -  - 所以我们尝试启动一下最大的通讯频率，试图将这里的一切向你汇报。\n如果这则通讯能够发到你的手里的话，请帮我转达一下我的家人，咱不能照护她们了......\"\n时间紧迫，现在的当务之急就是尽可能向开采站的人取得联系。或者......跟那位神秘的巨大 maiden取得联系？
  gts_ora.3.desc: "The entire straw functioned like a natural mining station. While the resource extraction was in full swing, a sudden and intense feeling of weightlessness occurred. \n\"Gravity reversed in an instant; all instruments have failed. The light ahead is dim, and behind us is a pulse of writhing darkness... I've suddenly realized a grave problem, yet the panic in my heart repeatedly urges me to deny this established fact. But it's useless. After all, before opening this Pandora's box, we should have known one thing - the owner of this 'straw' exists, and right now, we have already been... by her, along with the entire planet's resources...\" \nInstruments are offline, the surroundings a dark red. I feel a faint writhing sound, a resonance at a cosmic frequency. We don't know how long we can hold out, but we already know rescue is impossible. We are attempting to use the maximum transmission frequency to report everything here to you. \nIf this message reaches your hands, please tell my family that I won't be able to care for them anymore...\" \nTime is critical. The priority is to establish contact with the mining station... or perhaps with that mysterious, colossal girl?"
  # 出发救援，最高优先级
  gts_ora.3.a: "Launch rescue, highest priority!"
  # 相遇
  gts_ora.4.name: "Encounter"
  # 星海漫漫，没有对应的位置坐标，搜寻的工作如大海捞针，就在诸位准备放弃之时 -  - 却突然出现了一个神秘的 maiden。\n浅橘色的双麻花辫，却就像是突然出现在此处一般，而对方的体型却令在场的所有人胆寒 -  - 而对于我们这些在她眼中如同微尘一般的搜寻舰队，对方并没有过多的在意，只是自顾自来到了那颗被我们调查过的，那颗插着\"吸管\"的星球 -  - 只见她轻启双唇，含住了吸管的那段，仿佛整个星球在她眼中，和如今桌子上的这盒牛奶一般。\n不多时，整个星球仿佛被抽干一般，能看到殷红的熔岩从星球的地核中抽出，宛如熔岩巧克力糖浆一般，逆转引力被 maiden吸入口中 -  - 从她轻车熟路的动作可以看出，这颗星球早已被她当作了一个能让她随时\"补充能量\"的东西，至少我们是这样认为的。那么，失踪的舰队想必......\n知道了答案比茫然更加令人胆寒 -  - 所有人都知道，这是所剩无几的机会，但却没有任何一个人敢接近这个宛若神明的存在 -  - 她会怎么样对我们？想必她如果要对我们做些什么的话，恐怕逃到哪里都无济于事吧。抱着这样的想法，我打开了通讯，尝试发送一些什么消息的时候，抬起头，却发现对方的橘黄色瞳孔突然瞥了自己一眼 -  - 曾几何时，她已然注意到了我们！\n\"决定先让女孩子开启话茬吗？这可不是'提升好感度'的选项吧。\"\n短暂压制住的恐慌却被 maiden轻佻的话语击溃。\"那个......我们无意冒犯，但是我们的人曾经在这里失踪......可能是被您......\"\n\"吃掉了\"。最后三个字在内心的挣扎下还是没能说出口，我按在自己狂跳的心脏，想遏制住内心的恐慌，却逃不过 maiden橘黄色的瞳孔。\n\"这样啊......那你们要自己进来找吗？还是说......\"\n远远地看着 maiden轻启的双唇，吐出来的字眼却一个比一个恐怖。且不说 maiden有没有恶意，就如今这个情况，哪怕接近她都十分困难，更何况......要进入一个 maiden的身体里。\n见我迟迟没有反应， maiden不言，却早已微微张开口腔 -  - 那是我不敢想象的尺寸，仿佛片刻间就能够将自己连同整个舰队一起被吞噬掉的恐怖大小，以及不断失控的引力，还有......不知道为何内心里感觉到的威压似乎被一种更加扭曲的情绪占据着，却像是人为地控制着，让你不必担心坠入意识的深海中。\n胃中的环境一片漆黑，已经找不到出去的路，探测器却突然起了反应 -  - 一个早已模糊的坐标，和一个早已坠毁在肉壁的研究船。\n\"在她体内的环境仿佛度日如年。\"对方说道，\"我们早已做好了准备 -  - 成为她体内的一部分，就像周围游离的生物一样。\"说罢，指了指周围宛如鬼魂一般的存在。\n\"这些家伙......没有生命，没有意识，甚至连身体都没有，只有终日重复着做着同一件事情 -  - 宛如死亡回放一般。看着他们挣扎着淹没在如同潮汐一般的胃液中时，我们突然释怀了：我们没有义务去逃离一个不可能逃离的东西，宛如西西弗斯的巨石一般。\"话音未落，却突然感到一阵头晕目眩 -  - \n\"西西弗斯的故事吗？挺有意思。\"\n距离如此之近，却能看到 maiden眼中所带的一丝神性。\"不小心吃掉了你们的舰船真是抱歉，所以......开个我能力允许范围的小小玩笑，希望你们喜欢在我身体里的戏份捏。\"而看到 maiden露出牙齿的微笑之后，却突然感觉浑身发麻 -  - 这家伙，这么令人捉摸不透的吗？
  gts_ora.4.desc: "The sea of stars is vast, and without coordinates, searching was like looking for a needle in a haystack. Just as everyone was ready to give up, a mysterious girl appeared. \nWith pale orange twin braids, she materializes as if from nowhere. Her size strikes terror into everyone present. To her, our search fleet is nothing more than dust; she pays us little mind, simply making her way to the planet we investigated - the one with the 'straw.' She opens her lips and takes the end of the straw, as if the entire planet were no different from a carton of milk on a table. \nBefore long, the entire planet appears drained. Crimson magma is drawn from the core like molten chocolate syrup, gravity reversed as it's inhaled by the girl. From her practiced motions, it's clear she treats this world as a mere 'energy supplement.' Or so we think. As for the missing fleet... \nKnowing the answer is more terrifying than uncertainty. Everyone knows this is one of our last chances, yet no one dares approach this god-like existence. What will she do to us? If she intended anything, flight would be futile. With this thought, I open communications to try and send a message. Looking up, I find her amber pupils suddenly glancing at me - she had noticed us all along! \n\"Deciding to let the girl start the conversation? That's not a choice for 'increasing approval', is it?\" \nThe briefly suppressed panic is shattered by her playful tone. \"Uh... we mean no offense, but our people went missing here... they might have been... by you...\" \n'Eaten.' Those last words remain unsaid in my heart's struggle. I press against my racing heart, trying to curb the panic, but I cannot escape her amber gaze. \n\"I see... then do you want to come in and look for them yourselves? Or perhaps...\" \nWatching her lips from afar, every word she utters is more terrifying than the last. Malice aside, under these conditions, even approaching her is difficult, let alone... entering a girl's body. \nSeeing my lack of response, she says no more but slowly opens her mouth. It is a scale I cannot imagine - a terrifying size capable of devouring me and the entire fleet in an instant. Gravity fails, and an unaccountable pressure - occupied by an even more distorted emotion - seems to be artificially controlled, ensuring I don't drown in the sea of consciousness. \nThe environment inside her stomach is pitch black; there is no way out. But the probe suddenly reacts - to a blurred coordinate and a research ship long since crashed against the fleshy walls. \n\"Time inside her body feels like an eternity,\" they say. \"We've already prepared ourselves - to become a part of her, like the drifting organisms around us.\" He points to ghost-like entities nearby. \n\"These things... have no life, no consciousness, not even bodies. They only repeat the same actions day after day - like a playback of death. Watching them struggle to drown in the tidal gastric juices, we suddenly find peace: we have no obligation to flee from what is impossible to escape, like Sisyphus's boulder.\" Before the words fade, a wave of vertigo hits. \n\"The story of Sisyphus? Quite interesting.\" \nAt such close range, I see a trace of divinity in her eyes. \"I'm sorry for accidentally eating your ship, so... I'll play a little joke within my capabilities. I hope you enjoy your role inside me.\" Seeing her toothy smile, I feel my skin crawl - is she truly this unpredictable?"
  # 总之，谢谢您了！
  gts_ora.4.a: "Anyway, thank you!"
  # 
  gts_ora.5.name: """"
  # 对于眼前的 maiden来说，你的出现或许能在她的笔下留下几个字符。只不过......在这样捉摸不透的 maiden面前，每一个字眼似乎都有可能引起她对文明的存护......亦或是覆灭。\n她在等你，在等你做出你想要做出的回应......你们的时间有很多，她也愿意在此停留一刻 -  - 在她的旅程中留下一个双方都会感到愉悦的\"记忆\"。
  gts_ora.5.desc: "For the girl before you, your appearance might leave a few characters under her pen. However... before such an unpredictable girl, every word seems potentially to trigger her preservation... or destruction of civilization.\nShe is waiting for you, waiting for the response you want to make... You have plenty of time, and she is willing to stay here for a moment - to leave a \"memory\" in her journey that both sides will find pleasant."
  # \"抱歉......到现在还不知道你叫什么名字......\" 
  gts_ora.5.a: "\"Sorry... I still don't know your name...\"
  # \"名字吗？\"\n你难得见到 maiden做出了短暂的沉思。\n\"名字只能作为一个符号，如果你想的话，可以用'橘子长'来称呼......在紧张吗？不用担心，毕竟比起这些......我还是比较中意你们刚刚强装镇定的样子呢。毕竟......\"\n maiden微微一笑。\"毕竟人类在面对如此巨大的存在，不选择徒劳的逃跑，而是选择靠近以寻求一线生机......这样的故事还挺适合在我的笔下诞生的说。\"
  gts_ora.5.a.response: "\"My name?\"\nYou rarely see the girl fall into a brief deep thought.\n\"A name is merely a symbol. If you wish, you can call me 'Captain Ora'... Are you nervous? Don't worry, after all, compared to these... I rather prefer the way you were just forcing yourselves to stay calm. After all...\"\nThe girl smiles. \"After all, for humans to choose not to flee in vain when facing such a giant existence, but instead choose to draw close to seek a slim chance of survival... such a story is quite suitable to be born under my pen.\"
  # \"你的故事......\"
  gts_ora.5.b: "\"Your story...\"
  #  maiden微微一笑，示意让你稍稍近些，丝毫不会在意因为体型上悬殊的差异会给你们带来什么样的压迫感。不过从她的举手投足间，似乎能依稀的感受到对方带来的善意 -  - 难得的能让气氛变得缓和的机会。\n\"故事只是维系我的存在，每一段经历都会被我一一记下，包括你，\" maiden说完这些，却有意将笔抵在下巴上，似乎向你示意着什么，难道说......是要让你，让你们所处的文明，成为她笔下的一部分吗？
  gts_ora.5.b.response: "The girl smiles, signaling you to come a bit closer, completely unconcerned about what kind of oppression the huge difference in size might bring to you. However, from her every move, one can vaguely feel the goodwill she brings - a rare opportunity to allow the atmosphere to soften.\n\"Stories merely sustain my existence. Every experience will be recorded by me, including you,\" the girl finished, but intentionally held her pen against her chin, as if signaling something to you. Could it be... that she wants you, the civilization you belong to, to become a part under her pen?"
  # \"可以一起同行吗？\"
  gts_ora.5.c: "\"Can we go together?\"
  # \"可以啊。\"\n似乎是毫不迟疑的回答，让你们所有人感到欣喜的同时，又在质疑其真实性。谈判如同交易，而自己的砝码也仅仅只是她的一面之词，这样简单的答应下来是否会有猫腻，这也是你在考虑的点。\n\"只不过......可能会有离开的一天......不过会很久就是了。在这之前，'橘子长'这样的存在，就听从您的调遣了。\"\n maiden庄重的行了个礼，作为她\"短暂\"加入的象征。
  gts_ora.5.c.response: "\"Sure, why not?\" \nHer unhesitating answer brings joy to everyone, yet also raises doubts about its sincerity. Negotiations are like trades, and your only leverage is her word; whether such a simple agreement hides some catch is a concern in your mind. \n\"However... the day might come when I leave... though it will be a long time from now. Until then, an existence such as 'Ora' shall be at your disposal.\" \nThe girl performs a solemn bow, marking her 'temporary' enlistment."
  # 招募
  gts_ora.5.d: "Recruitment"
  # \"橘子长\"，加入，任您随意调遣。
  gts_ora_catch_phrase: "\"Ora, reporting for duty. I am at your disposal.\"
  # \"追逐明天的拾星者\"
  gts_ora_desc: "\"The Star-Gatherer Chasing Tomorrow\"
  # 橘子长
  NAME_gts_ora: "Ora"
  # 罩杯热议
  gts_ora.6.name: "The Heated Debate: Flat vs. Busty"
  # 近日，我们在各种社交平台均出现了有关橘子长的表情包：似乎在刻意强调她那比较\"坦荡\"的胸怀，以及她本人十分不情愿的表情。\n只不过，由于这条被称之为\"橘子板\"的表情包太过魔性，以至于早已在整个互联网上流传开来。却因为某些别有用心的家伙，江湖人称\"键盘侠\"，在网上挑起对立，引发了有关\"巨乳万岁\"以及\"贫乳万岁的争议。\"\n或许......不能让这些破坏团结的事情发生......
  gts_ora.6.desc: "Recently, memes regarding Ora have flooded social media platforms. They seem to pointedly emphasize her 'undulating' flatness and her visibly reluctant expression. \nHowever, because the meme - popularly dubbed 'Orange Board' - is so infectious, it has spread across the entire internet. Some malicious individuals, known as 'Keyboard Warriors,' have used it to incite conflict, sparking a fierce controversy between the 'Long Live Big Chests' and 'Long Live Flat Chests' factions. \nPerhaps... we shouldn't allow this divisive behavior to continue..."
  # 推举\"巨乳万岁\"
  gts_ora.6.a: "Promote 'Long Live Big Chests'"
  # \"乳不巨何以聚人心？如此伟岸的山峰正是给予了小人在此定居的可能。只是这样做对橘子长而言会不会是一种排挤......\"
  gts_ora.6.a_custom_tooltip: "\"If the mountain isn't massive, how can it bring people together? It is precisely this majestic peak that has made it possible for tiny persons to settle here. But might this be seen as a form of exclusion by Ora...\"
  # 推举\"贫乳万岁\"
  gts_ora.6.b: "Promote 'Long Live Flat Chests'"
  # 把找事的键盘侠给我逮起来！
  gts_ora.6.c: "Arrest those troublemaking Keyboard Warriors!"
  # 
  gts_ora.7.name: """"
  # \"乳不巨何以聚人心？\"这样的呼声在你的政策推动下开始逐渐高涨。一时间，竟压的一些\"贫乳派\"有些抬不起头 -  - 当然，那些生来就有这份缺陷的巨娘们并不满意这样的看法，于是她们找到了在这一领域当中最有权威的一个存在 -  - 橘子长。\n\"大雷万岁，应该把所有的小雷信徒全部归为邪教处理！\"就在所有人都在互联网上欢呼雀跃时，天空却突然毫无征兆的变暗了几秒 -  - 只有几秒。而恐慌的人们抬起头，看到的画面却差点连手机都难以抓稳：那是一颗橘黄色的星体，宛如瞳孔一般注视着地表上的苍生，仿佛是看到了我们得\"神明\"的亵渎。\n\"你们......似乎挺喜欢这个嘛......\"\n招惹一个天体级的巨娘会有什么样的后果，想必不必赘述，而她却只是稍稍地将自己与这个早已被吓成筛子的星球的距离拉远了一些，随后 -  - \n\"哈！\"曾经在各大平台火爆全网的黄皮恶毒猫猫的惯用伎俩，名为\"哈气\"，此时此刻在这位浅橘色麻花辫的 maiden身上学到了一些精髓 -  - 只不过......如果她认真起来的话，可能会将整颗星球偏离轨道吧。但是这看上去只是玩笑一般的轻轻一哈气，却令天空都变得晦暗下来：空气中凝结出了凝重的阴云， 呼啸的风连同建筑物连根拔起，伴随着柑橘的气息。却无人敢沉浸于此，只敢躲在防空洞内，或者随着风飘向远处。\n\"只是一点点小小的惩罚罢了。作为乱用咱表情包的惩罚。\"\n橘子长只是留下了这一句话，就离开了此处。难道说......这是傲娇吗？不会吧，她刚刚一定是生气了对吧！
  gts_ora.7.desc: "\"How can we unite hearts without grand bosoms?\" This slogan grew louder under your policies. For a time, the 'Flat Faction' was completely suppressed. Naturally, the giantesses born with this 'defect' were unhappy with this view, so they turned to the highest authority in this field - Ora. \n\"Long live the big ones! All small-chest believers should be classified as a cult!\" While people were cheering online, the sky suddenly went dark for a few seconds - just a few. Terrified people looked up and almost dropped their phones: an orange star, like a giant pupil, was staring down at the mortals below, as if witnessing a desecration of their 'deity.' \n\"You all... seem to like this quite a lot...\" \nThe consequences of provoking a celestial-scale giantess need no explanation. She merely moved slightly further away from the planet - which was already shaking like a sieve - and then: \n\"Hiss!\" The signature move of famous toxic cat memes, the 'Hiss,' was perfectly executed by this orange-braided girl. Except... if she were serious, she might have knocked the entire planet out of orbit. This seemingly playful, gentle puff of air made the entire sky turn dim; heavy clouds condensed in the atmosphere, and howling winds uprooted buildings, all accompanied by the scent of oranges. No one dared savor it; they only hid in shelters or were swept away by the gale. \n\"Just a tiny little punishment. For misusing my memes.\" \nOra left after saying only that. Could this be... tsundere? No way, she was definitely angry just now, right?!"
  # 
  gts_ora.7.a: """"
  # 
  gts_ora.8.name: """"
  # \"胸不平何以平人心！\"这是贫乳派所推崇的。抛弃身上这又重又累的负担，拥抱坦荡和轻量化的胸怀。在这样的政策推动下，似乎各样消费品的消耗都有了不同程度的降低，人们也终于不用担心和巨娘贴贴时会被那恐怖的巨大球体挤扁了。\n只是......少了群峰林立的感觉，人们想要崇拜大雷的dna却不会因此衰退。直到这条政策推动的第十五天后，橘子长突然找到了你。\n\"这样......是为何呢。\"\n这是她为数不多收敛起她的大小，仅仅以一个星球中标准巨娘的身高进入为她而准备的会议中。在我们滔滔不绝地向她谈论了三个小时\"关于推举贫乳万岁的优点\"之后却发现 -  - 她早已睡着了。哈喇子滴在桌子上，差点把一旁西装革履的小人官员浇的透湿。\n\"嗯......？啊抱歉......咱开会是容易睡着啦。既然你们觉得这样可以的话......其实也不用专门为自己去把那些家伙一棒打死的好嘛......就这样，我可以走了吗？\"说完后的橘子长刚想离开，却突然一个趔趄从桌子旁摔在了地上。\n\"呜......睡的有点久......腿有点麻了......等会是谁在咱腿上爬啊！\"
  gts_ora.8.desc: "\"How can we calm hearts without flat bosoms!\" This was the 'Flat Faction's' pride. To cast off heavy, exhausting burdens and embrace a 'flat and lightweight' chest. Under this policy, consumption of various goods decreased, and people no longer feared being crushed by terrifyingly massive orbs during snuggles with giantesses. \nHowever... without the 'towering peaks,' the human DNA that craves to worship grand bosoms did not fade. Fifteen days into this policy, Ora suddenly approached you. \n\"Why... is it like this?\" \nIn one of the rare moments she shrank her size, entering the meeting at the height of a standard planetary giantess, she listened as we spent three hours droning on about the 'advantages of promoting flat chests.' Then we realized - she had long since fallen asleep. Her drool pooled on the table, nearly soaking a well-dressed tiny official nearby. \n\"Hmm...? Ah, sorry... I tend to fall asleep in meetings. If you think this is fine... well, there's no need to crush the other side just for my sake... is that all? Can I go now?\" Ora moved to leave but suddenly stumbled from the table to the floor. \n\"Ugh... slept too long... my leg is numb... wait, who's crawling on my leg?!\"
