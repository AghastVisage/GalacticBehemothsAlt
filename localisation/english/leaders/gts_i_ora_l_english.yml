  # （尘封的记事本却翻不开任何书页，却无缘无故的划伤了你的手指......你能够感觉到这样的内容有着难以理解的封印......但是这样的封印或许是对你的保护，还是避免让你堕入更强大的未知？）
  gts_ora.4001.desc: ""(The dusty notebook won't let you turn a single page, yet it inexplicably cuts your finger... You can sense that this content is bound by an incomprehensible seal... But is this seal meant to protect you, or to keep you from falling into an even more powerful unknown?)""
