  # \"睡觉了哦......时间已经不晚了。\"\n 夜色蒙上窗棂，为世界敲响了休止符。关上了灯，躺在白安的怀里，此时此刻，无需什么摇篮，对方胸口间的温度却是最好的温床。\n \"小橘也不怕咱压着你......来吧，躺这里吧。\"\n  自己这样的大小，还是不要和她一起在被窝里吧。就这样，我被她推到了枕头下面，这是一个相对安全的地方，却挡住了她的侧颜。不多时，就已经听到她轻微的呼吸声，似乎已经睡着，可是......此时此刻，内心的一些想法也随着夜色开始蠢蠢欲动。\n  往上爬吧，爬到枕头上，踩着对方那乌黑色的短发，看着白安的睡颜，身体却不自觉地一点点靠近。直到脸颊贴到了对方的嘴唇上，才面色羞红地往后退了两步。\n \"姐姐真好看啊......\"趴在白安的脸颊旁，身边被对方的短发包裹，似乎......在这里睡也是一个不错的选择吧，但是现在，请允许自己再看一眼她，看一眼将自己从命运中拉出来的人。\"之前我一直有个愿望，是想找到橘子长，或者说，想找到咱丢失掉的记忆......\"\n \"但是现在，咱改变主意了，我的愿望，是想有无数条命，这样......是不是就能一直被姐姐吃掉了......\"\n  反正她也是在睡觉，想必......也听不见吧，思来想去，身体却不由得贴了过去。可就是在这个时候 -  - \n \"哈啊 -  - \"\n   maiden睡梦中的哈欠，却仿佛龙卷风的风眼一般，将自己整个人都被吸进了 maiden的口中。看着不断蠕动的舌苔和口腔深处的喉咙，我尽力扑腾着，却无济于事。命运如此弄人，轻而易举地就实现了我刚刚的愿望，只是......我丢失的那一块无限生命在哪里补啊！\n 就在绝望的时候， maiden的舌苔却突然有了反应，开始推着自己一点一点地往外面出去，直到我满身唾液地回到了枕头下，却看到对方仍然睡的正香。\"她......是在装睡吗？\"我心里想着，心里的悸动却还想爬上去再看一下，却看到对方再次缓慢地张开了嘴巴。这次却吓得我再也不敢爬了上去，只好滑到了枕头下，躺在 maiden的身边，闭上了眼。\n \"明天......明天就能见到橘子长了吧......\"\n \"只是......一场梦，能梦到明天吗？\"
  gts_ora.1218.desc: ""\"Time for bed... It's getting late.\"\n The night shrouded the windowpanes, bringing the world to a standstill. I turned off the light and lay in Bai An's arms. At this very moment, I didn't need a cradle - the warmth of her chest was the best bed of all.\n \"Xiao Ju, don't worry about me crushing you... Come on, lie here.\"\n Given my size, it's probably best not to share the bed with her. And so, she pushed me under the pillow - a relatively safe spot, though it blocked my view of her profile. Before long, I could hear her soft breathing; she seemed to have fallen asleep. But... at that very moment, certain thoughts began to stir within me as the night deepened. \n  I crawled up onto the pillow, stepping on her jet-black short hair, gazing at Bai An's sleeping face as my body unconsciously crept closer and closer. It wasn't until my cheek brushed against her lips that I blushed and took two steps back.\n \"Sis, you're so beautiful...\" Lying next to Bai An's cheek, surrounded by her short hair, it seemed... that sleeping right here might not be such a bad choice after all. But for now, let me just take one more look at her - one last look at the person who pulled me out of the clutches of fate. \"I used to have a wish - to find Ora, or rather, to recover the memories I'd lost...\"\n \"But now, I've changed my mind. My wish is to have countless lives, so that... maybe I could be eaten by you forever...\"\\ n  She's asleep anyway, so I suppose... she can't hear me. After much deliberation, my body couldn't help but drift closer to her. But just at that moment - \n \"Haaah - \"\\ n  The girl's yawn in her sleep was like the eye of a tornado, sucking my entire body into her mouth. As I watched her constantly wriggling tongue and the back of her throat, I struggled with all my might, but it was no use. Fate was so cruel - it had effortlessly granted the wish I'd just made, but... where was I supposed to replace that piece of infinite life I'd lost?! \n Just as I was on the verge of despair, the girl's tongue suddenly stirred, pushing me out bit by bit until I found myself back under the pillow, covered in saliva - only to see that she was still fast asleep. \"Is she... pretending to be asleep?\" I wondered to myself. A flutter of excitement made me want to crawl back up for another look, but then I saw her slowly open her mouth again. This time, I was too scared to crawl back up, so I slid back under the pillow, lay down beside the girl, and closed my eyes. \n \"Tomorrow... tomorrow I'll be able to see Ora grow...\"\n \"But... is it just a dream? Can I even dream of tomorrow?\"""
