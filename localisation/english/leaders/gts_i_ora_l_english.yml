  #  漫海孤星
  gts_ora.1005.name: "Lone Star in the Boundless Sea"
  #  时光飞逝，似乎抓不住她的尾巴，转眼间，你的帝国似乎步入了下一个阶段。\n在此期间，你经历了许多，也失去了许多，所幸得到的东西总是沉甸甸的，只是……在一个平静如常的一天，当你把堆积成山的文件扛到办公桌的时候——\n“她……要是她在的话……”\n你的脑海中总是浮现出一个身影，一个浅橘色麻花辫的模糊身影，一边笑着，将那些对你而言如小山一般的文件踹到兜里——随后你趴在她的手掌中，像个毛绒玩具一样被她放在她的书桌前，看着她把本应该是你的工作一点点完成。\n“完事……出去吃点？还是说……吃你呢？”\n似乎还能听到她一边打趣，一边带着你来到最近给巨娘供应的夜市中。所有巨娘都对你的身份避之不及，唯独她一边笑着，却早已将你的衣服串在了手里的烧烤竹签上。\n\n“她……应该是我比较重要的人吧。”\n你幡然醒悟一般，打开了被你珍藏在抽屉里的手账本——橘色的封皮，带着俏皮的贴纸，你翻开书页，里面的内容却是……空？怎么回事？你开始焦虑起来，翻着书页，却只在扉页找到了这样的一句话：\n“试着找到’自我”，追逐着自己的‘明天’。
  gts_ora.1005.desc: "Time flies, as though her tail can never be caught. In the blink of an eye, your empire seems to have entered its next stage.\\nDuring this time, you have experienced many things and lost many things. Fortunately, what you gained has always carried weight. But... on one ordinary, peaceful day, when you carry a mountain of documents to your desk...\\n\"She... if she were here...\"\\nA figure keeps appearing in your mind: a blurry figure with light orange braids, smiling as she kicks the documents, which are like little mountains to you, into her pocket. Then you lie in her palm, placed before her desk like a plush toy, watching her finish bit by bit the work that should have been yours.\\n\"Done... Want to go out for something to eat? Or should I... eat you?\"\\nYou can almost still hear her teasing you while taking you to the nearest night market that supplies giantesses. Every giantess avoids your identity, but only she smiles while having already threaded your clothes onto the barbecue skewer in her hand.\\n\\n\"She... should be someone rather important to me.\"\\nAs if suddenly enlightened, you open the journal you have treasured in your drawer: an orange cover with playful stickers. You turn the pages, but the contents inside are... blank? What is going on? You start to grow anxious, flipping through the pages, only to find this sentence on the title page:\\n\"Try to find 'myself,' and chase my own 'tomorrow'.\""
