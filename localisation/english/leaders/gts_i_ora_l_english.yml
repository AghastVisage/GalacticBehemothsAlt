  # \"滴滴滴滴 -  - 滴滴滴滴 -  - \"\n我睁开眼，却看到窗外天还蒙蒙，一看手机，好家伙，五点，谁定的雷霆闹钟。可是，不知道为什么，总是感觉像是经历了些什么一样。\n看了一眼手机里的内容，除了一个月前录用通知的消息外，剩下的也是些无关紧要的事件，算了，就当是一场梦吧。我躺下床，正准备再睡一觉的时候，却看到床头处，枕头底下多了一个什么东西。\n是信封。甚至还能闻到淡淡的墨水香气。这厚度一看就不像是自己的工资单，我打开信封，看了一眼内容，却不禁会心一笑。\n原来......我经历的一切都不是虚幻：\n致：橘子长\n或许这封信你难以收到，收到了也很难再回信吧，但是没关系。\n巨龙造成的威胁已经清除了，我和小粉现在也回到了自己的生活中。只不过，我现在并没有再去养第7个小宠物的打算啦。如果橘子长能回来的话......也可以继续当咱的小宠物哦，咱这个主人还没当够的说。\n不开玩笑啦，经过这些事情，你现在已经和我一样，是一个S级的冒险者了哦，而且，咱也帮你要了一个新的身份：埃维拉城自由公民，现在的你已经不再需要咱这个监护人了哦。也可以做些你喜欢做的事情了。\n其实这里还有很多地方可以玩的说，七芒啊，凡尔诺登啊什么的，还有我看你的服饰有点像东陆那一块地方的......等你回来着咱也想好了，要带你好好出去玩一会，咱现在已经开始攒钱了。\n至于母亲的事情，从这次事件开始，龙之谷算是彻底没了吧，杜蕾因也和咱住在一起了，还有我也找到了自己原本的家人，她们都过的不错，就是离的有点远......\n总之，纸牌的最后一页，我们随时都会等你回来哦，\n你一路上的伙伴，蓝哗之。\n信封旁，那把长伞和床头柜的纸牌，或许没有人能够知道她的故事，但是这些却是我在异世界游历的证明。如果终有一日，自己并不再是异世界的行客，也不再被任何人所记起，甚至连自己的名字都会因此而丢失掉。\n但是......每当这个时候，试着将沙漏倒转，去写下新的命运吧。
  gts_ora.1121.desc: ""\"Beep, beep, beep - beep, beep, beep - \"\nI opened my eyes to find the sky still dim outside the window. I checked my phone - wow, it was 5:00 a.m. Who set that thunderous alarm? But for some reason, I couldn't shake the feeling that I'd just been through something.\nI glanced at the messages on my phone. Aside from the job offer I'd received a month ago, the rest were just trivial matters. Oh well, I'll just pretend it was all a dream. I lay back down on the bed, just as I was about to go back to sleep, when I noticed something new under my pillow by the headboard.\nIt was an envelope. I could even smell a faint scent of ink. It was too thick to be my pay stub. I opened the envelope, glanced at the contents, and couldn't help but smile to myself. \nSo... everything I'd been through wasn't an illusion after all:\nTo: Ora\nYou might never receive this letter, and even if you do, it'll be hard to reply - but that's okay. \nThe threat posed by the dragon has been eliminated, and Little Pink and I have now returned to our normal lives. That said, I don't plan on getting a seventh little pet anytime soon. If Ora ever comes back... you can still be my little pet. I haven't had enough of being your owner yet. \nSeriously though, after everything we've been through, you're now an S-rank adventurer just like me. Plus, I've secured a new identity for you: a free citizen of Evira City. You no longer need me as your guardian. Now you can do whatever you like. \nActually, there are plenty of places to explore around here - Qimang, Vernoden, and so on. Plus, your outfit looks a bit like something from the Eastern Lands... I've been thinking about it ever since I've been waiting for you to come back, and I've decided to take you out for a proper adventure. I've already started saving up. \nAs for your mother, starting with this incident, Dragon Valley is pretty much gone for good. Durein is living with me now, and I've also found my original family - they're all doing well, though they live a bit far away...\nAnyway, on the last page of the deck of cards, we'll always be waiting for you to come back, \nYour companion on this journey, Lan Hua-zhi.\nBeside the envelope - that long umbrella and the playing cards on the nightstand - perhaps no one will ever know her story, but these are proof of my travels in this other world. If one day I am no longer a traveler in this other world, no longer remembered by anyone - and even my own name is lost as a result - \nbut... whenever that happens, I'll try turning the hourglass upside down and writing a new destiny.""
  # （捡起纸牌）
  gts_ora.1121.a: ""(Picking up the card)""
  # 该星球将变为盖亚星球\n小橘子长获得特质：命运\n当沙漏倒转，剩下的交给自己的笔和剑。\n§B但不用担心§!\n§P这一路上总会有无数人，无数故事§!\n§M去证明你的存在§!
  gts_ora.1121.a.custom: ""This planet will become a Gaia planet\nMora has gained the trait: Destiny\nWhen the hourglass runs out, leave the rest to your pen and sword. \n§B But don't worry §!\n§P Along the way, there will always be countless people and countless stories §!\n§M To prove your existence §!""
  # 《然后......未来是？》
  gts_ora.1023.name: ""\"And Then... What's Next?\"""
  # \"原来......那个橘子长......那个我已经做过那么多了吗......\"\n自此，她的经历已然写下了厚厚的一沓，却不再是小橘子长能够承受的范围内。\n她经历过一个已死之人的无能为力，也见证了她幻化为神。\n她见过糖霜撒满的理想国，虽然虚幻，却也收拾着心情去准备着醒来。\n她的伙伴曾离她而去，只留一人囚禁孤星，但这一切都是表象，等待着自我和伙伴的羁绊。\n她也见识过来自未来和未知的恐慌，却也鼓起勇气，拾起笔向前走着下一步。\n她何尝不是死过一次的人，那她自然明白\"失我\"的代价，也明白找到自我的宝贵。\n她抱住书页，仔细地记得书中的一字一句。\n总之，一瞬间遭遇了太多经历的橘子长，现在正倒在了一处公园的长椅上，而现在的你，即使以一个小人的身体，处于一个遍地巨娘的地方，也只能抱着橘子长的手指，等待着她，陪着她走过属于她的故事。\n\n\"emmmmmmm......我睡着了吗......\"\n而等待了许久的你终究还是看到橘子长醒来的模样，而你也看向了她怀里抱着的手账本 -  - 这是原本的橘子长留给你的东西，而如今，原本空白的纸上却出现了更多的字目。\n而后面的故事......想必你也已经知道了。经历这一切之后的橘子长,,,,,,却因为一次机缘巧合之下加入了自己的帝国。那接下来：
  gts_ora.1023.desc: ""\"So... Ora grew... have I really been through so much already...?\"\nFrom that point on, her experiences had piled up into a thick stack - yet they were no longer something Mora could bear. \nShe had experienced the helplessness of a person who had died, and had also witnessed her transformation into a god.\nShe had seen a utopia sprinkled with powdered sugar; though illusory, she gathered her composure to prepare for awakening. \nHer companion had once left her, leaving her alone to imprison the Lonely Star, but all of this was merely a facade, awaiting the bonds between herself and her companion.\nShe had also encountered the terror of the future and the unknown, yet she mustered her courage, picked up her pen, and took the next step forward. \nShe, too, had died once - so she naturally understood the cost of \"losing oneself\" and the preciousness of finding her true self.\nShe clutched the pages, carefully committing every word and sentence to memory. \nIn short, Ora - who had endured so much in the blink of an eye - is now slumped on a park bench. And you, even in the body of a Tiny person, in a world filled with Giantesses, can only hold onto Ora's finger, wait for her, and accompany her through the story that belongs to her. \n\n\"Um... did I fall asleep...?\"\\ nAfter waiting for so long, you finally saw Ora wake up, and your gaze fell on the notebook she was holding in her arms - this was something the original Ora had left for you, and now, more words had appeared on the pages that were once blank. \nAs for the rest of the story... I'm sure you already know it. After going through all of this, Ora... ended up joining her own empire by a stroke of luck. And then:""
  # 是时候接她回家了。
  gts_ora.1023.a: ""It's time to take her home.""
  # 遗珍\"她所赠予的手账\"更新，\"未来\"可以点开
  gts_ora.1023.a.custom: ""\"The Notebook She Gave Me\" has been updated; you can now click on \"Future.\"""
  # 远星追忆
  gts_ora.1024.name: ""Memories of a Distant Star""
  # 经历了这些事情后，小橘子长似乎变得好多，也开始逐渐显现出她作为\"万雌王\"的一面。或许......如果事态就这样下去的话......她完全可以作为帝国中的那个，你心中的那个优秀的行政官。只不过......\n有一天，你在窗外，却看到橘子长坐在孤星监狱的外围，也就是那一片旧城区中，手里多了一本不知从哪里弄来的笔记本，似乎在记着些什么。她身下的那栋楼房似乎要有坍塌的痕迹，不过还好，此地原本就早已废弃，现在不过是帝国分划到橘子长的后花园罢了。只是......你却感觉到，倒是她如今这般......作为泰坦级巨娘的大小，才更应该适合这样属于她自己的区域。\n\"你来了？我在想......在记着最近发生的事......可惜文笔是比不过本尊啦......\"\n你趴在书页中，却意外的看到了页脚处的留言：\n\"自我闭环......我如果能够试着打破这一切......\"\n\n\"啊这个啊......\"似乎橘子长看到了你的疑惑，她连忙将那几个字挡住，将你轻轻推到了页眉。\"我时常在想......既然我做不到她的文笔......要想打破这一切的话......可能......可以为我适配一套舰装吗？\"\n你明白了，她想通过这样的手段来弥补自己和本尊的差距，只不过......即使原本的橘子长只是一介文官，天体级的大小差距却不是只靠一个简简单单的舰装就能够解决的。毕竟......你见过她的真正实力，是可以在转瞬之间像吃掉一颗樱桃一样吞掉一整个星球的恐怖存在。而你在检查了她递交的申请材料后，却察觉出了一丝不对。\n这却是一艘只加载了基础武器，却带着大功率搜索模块的舰装，显然，她要做的事情，已然十分明确。\n\"你要......去找已经失踪的另一个橘子长？\"\n小橘子长点了点头，而得知这个消息的你，也做好了决定
  gts_ora.1024.desc: ""After going through all this, Mora seems to have matured a lot and is gradually beginning to show her side as the \"Queen of All Females.\" Perhaps... if things continue this way... she could very well become that outstanding administrator in the empire - the one you have in mind. However...\nOne day, looking out the window, you saw Ora sitting on the outskirts of Lone Star Prison - in that old city district - holding a notebook she'd somehow acquired, seemingly jotting something down. The building beneath her looked as if it might collapse at any moment, but fortunately, the area had long been abandoned; it was now simply a section of the Empire's territory allocated to Ora's backyard. Still... you can't help but feel that, in her current state - as a Titan-class Giantess - she's actually better suited to this space that belongs solely to her.\n\"You're here? I was thinking... writing down what's been happening lately... Too bad my writing skills can't hold a candle to the real thing...\"\\ n As you peered into the pages, you unexpectedly spotted a note at the bottom of the page:\n\"Self-looping... If only I could try to break this cycle...\"\\ n\n\"Oh, that...\" As if Ora had noticed your confusion, she quickly covered those words and gently pushed you back to the top of the page. \"I've often been thinking... since I can't match her writing style... if I want to break out of this... maybe... could you customize a ship outfit for me?\" \nYou understood - she wanted to use this method to bridge the gap between herself and the original Ora. However... even though Ora was merely a civilian official, the astronomical disparity in scale couldn't be resolved by a simple ship outfit alone. After all... you've seen her true power - a terrifying entity capable of devouring an entire planet in the blink of an eye, as if eating a cherry. Yet, after reviewing the application materials she submitted, you sensed something was off. \nThis was a ship outfit equipped only with basic weapons but featuring a high-power search module. Clearly, her intentions were already quite obvious.\n\"Are you... going to look for the other Ora who's gone missing?\"\nMora nodded, and upon hearing this news, you, too, made up your mind.""
  # 那就，接她回家吧。
  gts_ora.1024.a: ""Well then, let's take her home.""
  # （发起局势：小橘子长舰娘改造）
  gts_ora.1024.a.custom: ""(Thread Topic: Mora's Long-Range Battleship Remodel)""
  # 武器模块
  gts_ora.1124.name: ""Weapon Modules""
  # 作为武器......原本的橘子长并不需要武器，但是目前失去了天体级的大小，那也必然需要一个强大的武器才行。只是......在你思考什么样的武器适合橘子长的时候......\n你却在杂物间中翻找出了那把浅橘色的长伞。\n长度约为一米二，重量却比以往还要轻盈。只是......原本作为天体级的橘子长手中，这把伞也跟随着她变得能够横跨大半个银河。一把伞或许难以作为武器存在......却是最为适合小橘子长的存在。
  gts_ora.1124.desc: ""As a weapon... Originally, Ora didn't need a weapon, but now that she's lost her celestial-class size, she'll inevitably need a powerful one. However... just as you were pondering what kind of weapon would suit Ora...\nyou stumbled upon that pale orange long umbrella while rummaging through the storage room. \nIt's about 1.2 meters long, yet lighter than ever before. However... in the hands of the original, celestial-class Ora, this umbrella would have grown large enough to span nearly half the Milky Way. An umbrella might not seem like much of a weapon... but it's the perfect fit for Mora.""
  # 希望小橘子长能够用的顺手一些
  gts_ora.1124.a: ""I hope Mora will find it easier to use.""
  # 
  gts_ora.1124.a.custom: """"
  # 探测模块
  gts_ora.1224.name: ""Sensor Module""
  # 常规的战舰难以承担大规模的探测工作，不过还好，在抛弃了繁重的武器配备后，你终于在橘子长的身上安装上了原本作为科研船的探测模块。虽然这样对于她的算力会有一点负担......不过要想找到原本的橘子长......这也是必要的手段。
  gts_ora.1224.desc: ""Conventional warships are ill-suited for large-scale reconnaissance missions, but fortunately, after stripping her of her heavy armament, you were finally able to install the reconnaissance modules - originally designed for research vessels - onto Ora. Although this will place a slight strain on her processing power... it's a necessary step if we're to find the original Ora.""
  # 希望橘子长能够承受下来
  gts_ora.1224.a: ""I hope Ora can withstand it.""
  # 
  gts_ora.1224.a.custom: """"
  # 装甲模块
  gts_ora.1324.name: ""Armor Modules""
  # 在数次装甲对抗中，你却发现，作为泰坦级巨娘的限制，作用于橘子长的任何装甲在歼星级别的巨炮面前，却都如纸片一般脆弱。但是你显然清楚，无论任何情况，不视任何代价，在这份面临天体级巨娘，几乎十死无生的情况下，能够增加任何一点防御都是对橘子长的保障。而到了最后......\n\"我决定亲自承受。\"\n尚未改造完成的橘子长，走到了那比她还要大的炮口前，并下令开火。\n无人敢进行拦截， 毕竟没有人能够知道这一炮下去究竟如何恐怖，也没有人敢下令开火，甚至驾驶着歼星炮的人员都不敢按下发射按钮，毕竟没人知道在此之后，橘子长能否还留有完整的尸体。\n最终，可以令星辰碎裂的一炮，发出的震撼足以将一旁的星球偏离了1cm，但奇怪的是，在那毁天灭地的激光束击中她的胸口时，橘子长却奇迹般的拦下了此次炮击。\n不能用物理学解释，也难以让任何人相信，这种概念级别的防护却如同底层代码一般，令此前的一切准备都成为摆设，或许......
  gts_ora.1324.desc: ""During several armored confrontations, however, you discovered that - due to the limitations of a Titan-class Giantess - any armor applied to Ora was as fragile as a sheet of paper when faced with a planet-destroying cannon. But you clearly understood that, regardless of the circumstances and at any cost, in this nearly hopeless situation facing a Celestial Giantess - where survival was virtually impossible - any increase in defense, no matter how slight, would provide protection for Commander Ora. And in the end...\n\"I've decided to take the hit myself.\"\\ n Ora, whose改造 had not yet been completed, walked up to the cannon muzzle - which was even larger than she was - and ordered it fired. \nNo one dared to intercept her - after all, no one could fathom just how terrifying this single shot would be. Nor did anyone dare to order the firing; not even the operator of the planet-killer cannon dared to press the firing button, since no one knew whether Ora would even have a complete corpse left afterward. \nIn the end, the blast - capable of shattering stars - was so powerful it caused a nearby planet to shift by 1 cm. Yet strangely, when the world-shattering laser beam struck her chest, Ora miraculously deflected the attack. \nIt defied the laws of physics and was hard for anyone to believe, yet this conceptual-level protection - like the underlying code - rendered all prior preparations meaningless. Perhaps...""
  # 准备的这些材料都多余了
  gts_ora.1324.a: ""All these materials I prepared were unnecessary.""
  # 
  gts_ora.1324.a.custom: """"
  # 建造完成
  gts_ora.1025.name: ""Construction Completed""
  # 在这一系列的改造结束后，橘子长从中走了出来。很难想象她是经历了什么样的觉悟来弃笔从戎，也很难想象即使未来的自己总有一天会替代掉自己，却仍然做出这种选择。\n或许......这就是创造出橘子长的那个人的想法。哪怕自己的未来并不存在，哪怕自己的消失也只不过是为了让更好的\"自己\"取而代之。但是，无论如何，看着星海间正在待命的橘子长，或许......这就是执念的力量吧。
  gts_ora.1025.desc: ""After this series of transformations was complete, Ora emerged from the process. It's hard to imagine what kind of epiphany led her to lay down her pen and take up arms, and it's equally hard to imagine why she would make such a choice even knowing that her future self would one day replace her. \nPerhaps... this was the intention of the person who created Ora. Even if her own future did not exist, even if her disappearance was merely to make way for a better \"self.\" But in any case, looking at Ora standing by in the starry sea, perhaps... this is the power of obsession.""
  # 相信这份执念，能够得偿所愿。
  gts_ora.1025.a: ""I believe that this determination will make my wishes come true.""
  # 会生成一个舰娘（小橘子长）并且和领袖小橘子长绑定。
  gts_ora.1025.a.custom: ""A Kanmusu (Mora) will be generated and bound to the leader, Mora.""
  # 探测发现
  gts_ora.1026.name: ""Detection Findings""
  # 执念到了一定程度，就能让她到来。既然如此......在巨型结构\"缘阵列\"和已经改造成舰娘的橘子长的双重作用下，你终于在宇宙边际找到了一处信息，却让人感到如此的恐怖：\n\"被你发现啦，来自过去的......我。\"\n\"想必你也看过那片无忆虚幻的梦界，你也知道，我们，就像每一个橘子长手牵着手一样，将时间构成了一处闭环。\"\n不过现在......抱歉啦，原谅我的一意孤行，因为啊......\n这个世界有着各种不可抗力因素......所有我不得不放手了。所以......来自过去的我，请做好自己，拉好彼此的双手哦......\n\n\"......\"\n你听到小橘子长的沉默，却并不是妥协，却是等待着爆发的时机。你很想靠近她，安慰她一下，却担心她泰坦级巨娘的体型。不过过了许久，她却恢复了平常的模样，尽可能压着轻轻的语气说了一句： \n\"报告，已探测到目标位置，为星海边界，超空间航道已开启，是否出发？
  gts_ora.1026.desc: ""When obsession reaches a certain level, it can bring her here. Since that's the case... thanks to the combined effects of the massive \"Fate Array\" structure and Ora - who has been transformed into a Kanmusu - you've finally found a piece of information at the edge of the universe, yet it's so terrifying:\n\"You've found me - the 'me' from the past.\"\ \n\"I suppose you've also seen that dreamworld of memoryless illusion. You know, too, that we - just like every Ora Captain holding hands - have formed a closed loop of time.\"\\ nBut now... I'm sorry. Please forgive my stubbornness, because...\nThis world is full of forces beyond our control... so I have no choice but to let go. So... my past self, please be true to yourself and hold each other's hands tight...\n\n\"......\"\\ nYou heard the Mora's silence - not a sign of compromise, but rather a wait for the right moment to erupt. You really wanted to get closer to her and comfort her, but you were worried about her Titan-class Giantess build. However, after quite a while, she returned to her usual self and, keeping her voice as soft as possible, said: \n\"Report: Target location detected - the edge of the Star Sea. The hyperspace route has been opened. Are we proceeding?\"""
  # \"护航舰队听令，出发！\"
  gts_ora.1026.a: ""\"Escort fleet, stand by - let's go!\"""
  # 
  gts_ora.1026.a.custom: """"
  # 诸行之错，皆因\"无能\"
  gts_ora.1028.name: ""All mistakes stem from \"incompetence.\"""
  # 战舰行至星系内，却突然断开了一切通讯，果然，常规的探测手段在此都形同虚设。随后，铺天盖地的虫群席卷了整个星系。\n只是虚空虫而已，放在较大的帝国都能算上不值一提的小灾害。但是，在这般孤立无援的境地里，数量却将一切碾压。[event_target:gts_ora_2_system_first_leader.GetName]正在奋力抵挡，化解了一波又一波攻势，可如果再次纠缠下去......\n而就这时 -  - 小橘子长却做出了痛苦的表情，她似乎能感觉到，那个和她同源的 maiden正在与未知的力量厮杀。而你却只能陪在她的身边，一边让（[event_target:gts_ora_2_system_first_leader.GetName]）清理着更多的敌人。 \n\"我......我看到了......\"\n小橘子长到底看到了什么？\n\"你不是想找橘子长吗？她可是在这里哦。\"\n说罢，宛若神明的 maiden的手中却凭空里出现一个小笼子。里面的橘子长双眼呆滞，披头散发，衣服破破烂烂，已是待宰的羔羊一般 -  - 她已然失去了一切的手段，此刻却已经可以称作是神明的点心，或是零食一样的存在。\n\"阿巴...阿巴...\"\n双眼涣散，嘴中已经无法组织语言。让你看的内心有些战栗，两条腿悬在空中止不住地打颤。这...真的是橘子长吗？这真的是......自己内心那个什么都能做到的橘子长吗？\n\"怎么不是呢？只不过...\"神明眯起眼睛，坏笑道：\n\"只不过......人家可是和你一样，从始至终，都是彻头彻尾的废物罢了。\"\n说完，柠檬伸出另一只手，把橘子长连同牢笼悬在了自己的血盆大口之中。\n\"不...不是这样的！\"\n你哭着，大喊着，但是被捏住身体的两根手指却有种不可撼动的力量。就这么眼睁睁地看着这个 maiden就一点一点点地落进了深渊中，再也没有了回音，仿佛在大海中填入一粒尘埃。\n是啊，19142037次尝试，却还是这种结果，宛如亘古不变的\"永恒\"一般。直到\"时间\"的指针在此断裂，\"空间\"的维度也如断了弦一般，再也托举不住任何的希望。\n小橘子长感受不到这样的痛楚，却也只能饱尝于此，拖着沉重的躯体步履蹒跚，而就在此时......\n\"你要永远相信......剑指巨龙的 maiden绝不是因为她能做到......\"\n\"而是有着必须要去做的理由，有着必须要去守护的人。\"\n\"所以......感觉到这把伞的分量了吗？\"\n\"......\"\n长伞于 maiden手中显现，却有着令天体级的（[event_target:gts_ora_2_system_first_leader.GetName]）都刮目相看的力量，仅仅只是简单的挥砍，宛如学徒一般的剑术，却令无数虫群因此闻风丧胆。不过，这些虫群却不是什么具有同理心的家伙，纵使小橘子长已然恢复......不能让战线拖的太久，而小橘子长似乎也意识到了你在想什么 -  - \n\"走，这里！\"\n选项：向此方向突围！
  gts_ora.1028.desc: ""As the warship entered the star system, all communications suddenly cut off. Sure enough, conventional detection methods proved utterly useless here. Soon after, a swarm of insects swept across the entire star system.\nThey were merely Void Insects - a minor nuisance that would go unnoticed in a larger empire. However, in such an isolated and helpless situation, sheer numbers would overwhelm everything. [event_target:gts_ora_2_system_first_leader.GetName] was fighting desperately, fending off wave after wave of attacks, but if this continued any longer...\\ nAnd just then - Mora's face twisted in anguish; she seemed to sense that the girl who shared her origins was locked in a fierce battle against an unknown force. All you can do is stay by her side while letting ([event_target:gts_ora_2_system_first_leader.GetName]) take out more enemies. \n\"I... I saw it...\"\\ nWhat exactly did Mora see?\n\"Weren't you looking for Ora? She's right here, you know.\"\nWith that, a small cage materialized out of thin air in the hand of the goddess-like girl. Inside, Ora Captain's eyes were vacant, her hair disheveled, her clothes in tatters - she looked like a lamb led to the slaughter. Having lost all means of resistance, she was now little more than a divine snack or treat.\n\"Aba... Aba...\"\ \nHer eyes were unfocused, and she could no longer form coherent speech. The sight sent a shiver down your spine, and your legs, dangling in the air, trembled uncontrollably. Is this... really Ora? Is this really... Ora, the one who could do anything, from deep within me?\n\"Why wouldn't it be? It's just that...\" The deity narrowed her eyes and grinned wickedly:\n\"It's just that... I'm just like you - from start to finish, I've always been a complete and utter failure.\"\\ nWith that, Lemon reached out with her other hand and suspended Ora, cage and all, inside her gaping maw.\n\"No... it's not like that!\"\\ n You cried and screamed, but the two fingers gripping your body possessed an unshakable strength. You could only watch helplessly as the girl sank, bit by bit, into the abyss, never to be heard from again - as if a speck of dust had been cast into the vast ocean.\nYes, 19,142,037 attempts, yet still this outcome - as unchanging as \"eternity\" itself. Until the hands of \"time\" snapped here, and the dimensions of \"space\" snapped like broken strings, no longer able to hold up any hope. \nMora couldn't feel this kind of pain, yet she could do nothing but endure it, staggering along with her heavy body - and just then...\n\"You must always believe... that the girl who points her sword at the dragon does so not because she can...\"\\ n\"But because she has a reason she must act upon, and people she must protect.\"\n\"So... can you feel the weight of this umbrella?\"\n\"......\"\\ nA long umbrella materialized in the girl's hand, possessing a power that would make even a Celestial-class ([event_target:gts_ora_2_system_first_leader.GetName]) take notice. A simple swing - a sword technique as rudimentary as that of an apprentice - was enough to strike terror into the hearts of countless swarms of insects. However, these swarms weren't the empathetic type. Even though Mora had already recovered... the battle couldn't drag on too long, and Mora seemed to have realized what you were thinking - \n\"Let's go - this way!\"\nOption: Break through in this direction!""
