  # 《众星尽头的救赎》
  gts_ora.1019.name: ""*Redemption at the End of the Stars*""
  # \"橘子长在看什么呢？\"\n正翘课在花园的台阶上看书的我，却突然被爽朗的声音惊到，我回过头来一看，一个白发的 maiden，梳成了和自己一样的麻花辫，现在的场景，除了发色不一样以外，与其说闺蜜，不如叫双胞胎更合适。\n\"不是，怎么我躲在哪里都能被阿卡菈找到啊！\"我有点恼，但却没有什么办法。\"咱正在看书呢，阿卡菈怎么也逃课了啊！\"我虽然装作很不情愿，但身体早已诚实地在边缘让开了半个身位。\n怎么说呢，之所以我在这里不去上课，其原因嘛......我用一本撕烂的日记本告诉大家：\n\"嗨嗨嗨嗨！勇者斗恶龙啊！幼稚！\"\n\"找你家长来！\"\n天马行空的故事本应该是7岁的 maiden应当写下的日记，却在有一天，被不怀好意的人带走，撕碎，连带着坏掉的，是一扇门的门闩。\n所以呐，我也就在这个没人的地方，趁着老师没在意我不找我茬的时候，稍微写点自己的小故事，自己的心门只需要把自己关进去就好，不需要别人触及......\n但阿卡菈，她是唯一一个能撬开这扇门的撬棍。\n\"一个勇者斗恶龙的故事呢。不过......怎么这个故事的结局有些......\"\n勇者面对的恶龙却是身形巨大的 maiden，而勇者也彻底失败，只能被囚禁在'龙之谷'中，再也没能逃离。只是......原本已经完结的故事后面，却还有几页空白的网格纸，用着歪歪扭扭的字迹写着后面的故事：\n\"后来出现了一位牧师，她手里拿着一柄花伞，将早已被困在峡谷的勇者救出，可勇者早已失去了讨伐恶龙的勇气，于是牧师只好独自前往，讨伐恶龙......很有趣的故事呢~是橘子长写的吗？\"\n\"嗯嗯。\"我低下头，脸却早已红透。一直以来，自己也只能偷偷摸摸地写着这些拿不出台面的内容。因为......我早已不指望能有谁会因此欣赏自己笔下所写的这些幼稚的东西了。\"只是......为什么，这个主角拿着的武器不是别的什么......而是一把伞呢？\"\n\"因为......这把伞是阿卡菈给咱做的......\"\n那柄橘色的雨伞，打开能从下面看到橘子那分明的脉络，而在伞柄的尾端，那两朵橘子花正相互依偎着，仿佛她们将永远手拉着手，在每一个下雨的长夜里迎风走向黎明。\n\"橘子长......能给咱写点故事吗？咱想看的说......\"\n\"嗯嗯。\"\n从这段思绪中回到现实，却感觉到手里似有些许分量，我拿起来一看，那柄长一米一的雨伞就这么出现在了自己手中。我打开雨伞，对着窗外的阳光，阳光透过雨伞的透明处，在地面上投射出了清晰的橘子的一根根脉络。轻轻转动一下伞柄，虽然伞面很大，却是十分轻盈，仿佛看到了，在那雨后初晴的回家小路上，一个熟悉却又模糊的身影在向自己招着手。\n\"我或许曾在高天之上坠落......但是，阿卡菈，在这么多次的坠落中，我知道，哪怕坠落的有多深 -  - \"\n\"持有此伞者，必将迎风直飞！\"\n这是她当时将伞交给我时说的，当时的她，一边笑着将伞递给我，一边试图刻意隐藏自己那贴满创可贴的双手。\n我拿起伞，似乎还能感觉到阵阵风声，宛如时间都开始倒流，回到了那个台阶下，刮开着的日记本，脱落的纸片，正在随着风，随着自己的思绪飞走。这把伞......是个手艺精湛的匠师所铸，而如今，阿卡菈将这把伞重现于我的手中，而她却......
  gts_ora.1019.desc: ""\"What are you looking at, Ora?\"\\ nI was skipping class and reading on the garden steps when I was suddenly startled by a cheerful voice. I turned around to see a white-haired girl with her hair braided just like mine. Aside from the difference in hair color, the two of us looked more like twins than best friends. \n\"Seriously, how is it that no matter where I hide, Akara always finds me!\" I was a little annoyed, but there wasn't much I could do about it. \"I'm in the middle of reading here - how come you're skipping class too, Akara?\" Although I pretended to be reluctant, my body had already honestly moved half a body length to the side. \nHow should I put this? The reason I'm here skipping class is... I'll explain it to everyone using a torn-up diary:\n\"Heh heh heh heh! Dragon Quest! So childish!\"\\ n\"I'm going to call your parents!\"\nThis whimsical story - the kind a 7-year-old girl should have written in her diary - was one day taken away by someone with ill intentions, torn to shreds, and along with it, the latch on a door was broken.\\ nSo, here in this deserted spot - while the teacher isn't paying attention or picking on me - I'll jot down a little story of my own. The door to my heart only needs to keep me locked inside; it doesn't need anyone else to touch it...\\ nBut Akara - she's the only one who can pry open this door.\n\"A story of a hero battling a dragon. But... why does the ending of this story seem a bit...\"\\ nThe dragon the hero faced turned out to be a gigantic young girl, and the hero failed completely, ending up imprisoned in the \"Valley of the Dragon,\" never to escape. But... at the end of what was supposed to be a finished story, there were still a few blank pages of graph paper, with the rest of the story written in crooked handwriting:\n \"Later, a priestess appeared. Holding a flowered umbrella, she rescued the hero who had long been trapped in the valley. But the hero had already lost the courage to slay the evil dragon, so the priestess had no choice but to go alone to defeat it... What an interesting story~ Did Ora write this?\"\\ n\"Mm-hmm.\" I lowered my head, my face already flushed bright red. All this time, I'd only been able to write these unsavory stories on the sly. Because... I'd long since given up hope that anyone would ever appreciate the childish nonsense I'd put down on paper. \"But... why does the main character wield an umbrella of all things... instead of some other weapon?\"\n\"Because... Akara made this umbrella for me...\"\\ nThat orange umbrella - when opened, you could see the distinct veins of the orange through the fabric. And at the very end of the handle, those two orange blossoms were nestled together, as if they would forever hold hands, walking against the wind toward dawn on every long, rainy night. \n\"Ora... can you write a story for me? One I'd like to read...\"\n\"Mm-hmm.\"\nReturning to reality from these thoughts, I felt a slight weight in my hand. I picked it up and looked - the 1.1-meter-long umbrella had simply appeared in my grasp. I opened the umbrella and held it up to the sunlight streaming through the window. The sunlight filtered through the transparent parts of the umbrella, casting the clear, vein-like patterns of an orange onto the ground. I gave the handle a gentle twist. Though the canopy was large, it felt incredibly light, and it was as if I could see a familiar yet blurry figure waving to me on the path home after the rain had just cleared. \n\"I may have fallen from the heavens above... but, Akara, through all these falls, I know that no matter how deep the fall - \"\n\"Whoever holds this umbrella will surely soar against the wind!\"\\ nThat's what she said when she handed me the umbrella back then. As she smiled and handed it to me, she tried to deliberately hide her hands, which were covered in Band-Aids. \nI picked up the umbrella, and it seemed I could still feel the sound of the wind - as if time had begun to flow backward, taking me back to that spot beneath the steps, where the pages of my open diary were fluttering away, carried by the wind and my own thoughts. This umbrella... was crafted by a master artisan. And now, Akara has brought it back into my hands, yet she herself...""
