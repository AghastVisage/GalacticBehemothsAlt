  # 众星尽头的救赎
  gts_ora.4301.name: ""Redemption at the End of the Stars""
  # 你曾经做过这样的一个梦：\n\n\"那么，这个小人就交给你了。\"\n\n\"嗯嗯。\"而在对讲机的另一边，一个白色短发的 maiden看了看窗外，将眼镜摘了下来放在了桌子上。随后看了一眼桌子上的信纸，而信纸的下面，垫了一本书，正是她所写的《掌握\"色彩\"的 maiden》。\n\n\"橘子长......吗？到时候可要好好'品尝'一下呢。\"\n\n你入狱了。此刻却被一个看上去十分友善的家伙抓住。原因很简单：此刻的自己，在越狱。却没想到，身体此时变得如此渺小的自己......在被如此庞大的巨娘发现后会有多么的无力。\n\n\"哈？小东西竟然睡着了，是姐姐看上去不吓人吗？\"\n\n\"嗯？\"\n\n迷迷糊糊地爬起来，加上身体隐隐传来的疼痛和挤压。这么长时间的高强度被各种玩弄，显然让我这个小人的身体来到了极限。我揉了揉眼，看着那镜片后的那双粉色眼眸。一时间竟感觉不出究竟是自己睡断片了，还是自己被眼下这只捏着自己的大手\"物理\"意义上的哄睡着了。\n\n\"姐姐这么可爱......哪里会有吓人的说......\"我一时不知是脑子反抽，还是实话实说，就当是实话实说吧。毕竟人在足够害怕的时候，哪怕撒谎都显得如此自然且张嘴就来。但是就论结果来看，这句话的作用似乎有些明显。\n\n\"能说出这种话的......除了你以外，就只剩下那个蓝色的小家伙了呢。\"\n\n主动权不在自己身上，眼下只能先拿语言周旋一下然后就......跑！趁着对方一个愣神取下眼镜的空档，我立刻向手掌外逃跑去，而下一秒，\"砰！\"自己像是遇到玻璃门的猫猫一样，被空气撞倒在地 -  - 并不是空气，而是鸟音刚刚取下的眼镜。\"好痛！\"我揉了揉脑袋，却看到对方的笑意却又多了几分。是啊，不会挣扎的小人是不会有意思的啊，而橘子长，却是无论机会有多么渺茫，也要赌上一切的小人啊。然而，即使如此，自己的努力只不过是在给对方平添几分情绪价值，让我想起了餐盘上那条还在呼吸的小龙虾，在即将被食客吃掉前，还要尽自己最后的力气，用自己的螯钳在餐盘上比一个小小的心。
  gts_ora.4301.desc: ""Have you ever had a dream like this:\n\n\"Well then, I'll leave this Tiny person in your care.\"\n\n\"Mm-hmm.\" On the other end of the walkie-talkie, a girl with short white hair glanced out the window, took off her glasses, and set them on the table. She then glanced at the sheet of paper on the desk, which was propped up by a book - none other than her own work, *The Girl Who Mastered \"Color\"*.\n\n\"Ora grows...? I'll have to be sure to 'taste' one properly when the time comes.\"\\ n\nYou're in prison. Yet right now, you've been captured by a guy who seems very friendly. The reason is simple: right now, you're attempting to escape. But you never expected that, with your body now so tiny... you'd feel so helpless after being discovered by such a massive Giantess.\n\n\"Huh? \"The little thing actually fell asleep - does Big Sister not look scary enough?\"\n\n\"Hm?\"\n\nI crawled to my feet groggily, feeling a dull ache and pressure throughout my body. After being subjected to such intense, prolonged torment, my tiny person had clearly reached its limit. I rubbed my eyes and looked into those pink eyes behind the glasses. For a moment, I couldn't tell if I'd simply blacked out from exhaustion or if I'd been \"physically\" lulled to sleep by the large hand currently gripping me.\n\n\"Big sis is so cute... there's no way she could be scary...\" I wasn't sure if my brain had short-circuited or if I was just speaking the truth - let's just go with the latter. After all, when you're scared enough, even lying feels so natural it just rolls off your tongue. But judging by the result, the effect of that sentence seemed all too obvious.\n\n\"The only ones who'd say something like that... besides you, is that little blue guy.\"\n\nI wasn't in control of the situation, so for now, I could only try to stall with words and then... Run! Taking advantage of the split second when he paused to take off his glasses, I immediately dashed toward the open space beyond his palm. But the very next second - \"Thud!\" - I crashed to the ground like a cat running into a glass door - not into thin air, but into the glasses Bird Sound had just removed. \"Ouch!\" I rubbed my head, only to see the smile on the other person's face grow even wider. Yeah, a Tiny person who doesn't put up a fight isn't any fun - but Ora is the kind of Tiny person who'll bet everything, no matter how slim the odds. Yet even so, my efforts were merely adding emotional value to the other person's experience. It reminded me of that little lobster still breathing on the plate - just before being devoured by a diner, it mustered its last bit of strength to form a tiny heart with its claws on the plate.""
  # \"想喊救命......\"
  gts_ora.4301.a: ""\"I wanted to scream for help...\"""
  # 众星尽头的救赎
  gts_ora.4302.name: ""Redemption at the End of the Stars""
  # 随着镜片拿了起来，宛如高空中的玻璃栈道，一时间，腿却突然瘫软了下来。我闭上眼睛，努力不让自己去看下面。而看到自己浑身颤抖的样子， maiden却故意将镜片朝一侧倾斜，重心突如其来的变化使得自己不得不睁开了眼睛，拼命地扒着镜片，拼命地向上爬着。因为我看到了，在这透明的镜片下， maiden张开的嘴巴显得格外显眼。\n\n\"哈 -  - \"\n\n热气从 maiden口中哈出，在垂直的镜面上泛起了一层白雾，似乎是在为镜片另一端的我，遮挡了 maiden那张开的深渊巨口。而我双手抓着镜片的一边，不知不觉间，却感觉自己如那待宰的羔羊般。假如自己的动作再慢一点，那结局不是被摔扁，就是落到她那足以装下几千个自己的口中了吧。\n\n\"让姐姐看看......小橘子长的求生欲望有多么旺盛呢。\"\n\n手指停在自己脚下，似乎是让自己爬上去。于是我松开双手，趴在对方的手指上，不知道要对自己做什么。而接下来，自己却被放在了地板上，随后......却看到的，只是她那双白运动鞋。这个大小下，凑近过去，甚至鞋底的高度都超过了自己头顶。\"尝试爬上来吧。在咱还没有想踩下去的想法前。\"轻柔的话语带来的却是令自己头皮发麻，算了，别耽搁了，我尝试爬上去，而这个高度......自己的大小甚至还爬不到对方的鞋面上。自己花了不少时间，结果却只能在对方的鞋底上打滑，爬上去，滑下来。而对方似乎也是换了一丝想法，下一秒，自己怎么也爬不上去的鞋子却突然抬了起来，将好不容易抱在鞋底上的我掀飞了好几米，随后摔倒在地面上。但是，并没有给自己机会，下一秒，那和小山坡大小一般的白色运动鞋如今就压在了自己的身上。\n\n嘶......自己没有被踩扁，这算大难不死了吧。看着压在自己身上的白色运动鞋，距离将自己的身体完全成为番茄酱就差了那么一点点。而这也能够看出来，鸟音并不想直接踩扁自己，而这也就意味着，她还有更多的玩法，而这正是我不想看到的。\n\n果然，那压得自己快要窒息的白色运动鞋还是抬了起来，只见鸟音蹲下来，看着躺在地板上，和地板上那鞋印融为一体的奄奄一息的我，不由得笑出了声。而看着对方蹲下来俯视着自己的样子，我看着周围一眼望不到头的鞋印子，很难想象，刚刚的那一脚对方要是真踩下去了......正发楞呢，而接下来，突如其来的水球却将自己整个人都差点淹没。\"咕噜噜噜 -  - \"怎么回事，哪里来的水？不对，这个水怎么是温的？难道说......我不敢相信，但是自己却像是被丢到胶水里一样，难以挣脱。而当自己终于摆脱掉向上抬头看的时候，却发现 -  - \n\n鸟音的嘴巴微微张开，伸出的舌尖下，唾液随着一道长长的拉丝向下坠落，不偏不倚砸到了自己身上。而就是这简简单单的一滴，却能让自己花了将近十分钟才勉强挣脱开。\"看你身上脏脏的，现在洗干净咯。\"看到那突然砸到自己身上的水球，竟是 maiden口中的佳酿时，一时间，我却是感觉内心有什么东西彻底碎掉了。
  gts_ora.4302.desc: ""As the lens was lifted - like a glass walkway high in the sky - my legs suddenly went weak. I closed my eyes, trying hard not to look down. But seeing how I was trembling all over, the girl deliberately tilted the mirror to one side. The sudden shift in my center of gravity forced me to open my eyes; I clung desperately to the mirror, scrambling upward with all my might. Because I saw it - through the transparent mirror, the girl's parted lips stood out strikingly. \n\n\"Haa - \"\n\nWarm breath escaped from the girl's mouth, creating a layer of white mist on the vertical mirror surface - as if to shield me, on the other side of the glass, from the gaping abyss of her mouth. As I clung to one edge of the mirror with both hands, I unconsciously felt as though I were a lamb awaiting slaughter. If I'd moved even a fraction slower, my fate would have been either to be smashed flat or to fall into her mouth - a mouth large enough to swallow thousands of me.\n\n\"Let your big sister see... just how strong Mora's will to survive really is.\"\n\nHer finger paused at my feet, as if urging me to climb up. So I let go of the frame and lay face-down on her fingers, unsure of what she intended to do to me. But then, she set me down on the floor, and all I could see afterward... were her white sneakers. Given their size, when I leaned in, even the sole was taller than my head. \"Try climbing up. Before I get the urge to step on you.\" Her gentle words sent a chill down my spine. Oh well, no time to waste - I tried to climb up, but at this height... I was so small I couldn't even reach the top of her shoe. I spent quite a while at it, only to keep slipping on the sole of her shoe - climbing up, then sliding back down. It seemed she'd changed her mind a bit, because the very next second, the shoe I'd been unable to climb onto suddenly lifted up, flinging me - who'd managed to cling to the sole with great effort - several meters away, where I crashed to the ground. But I wasn't given a chance to catch my breath. The very next second, that white sneaker - as big as a small hill - was already crushing down on me.\n\nUgh... I hadn't been squashed flat. I guess that counts as a narrow escape. Looking at the white sneaker pressing down on me, I was just a hair's breadth away from my body being completely turned into tomato sauce. This also made it clear that Torine didn't want to crush me outright - which meant she had even more ways to torment me, and that was exactly what I didn't want to see. \n\nSure enough, the white sneaker that had been pressing down on me until I was nearly suffocating lifted off the ground. I watched as Torine crouched down, looking at me - lying on the floor, barely clinging to life and blending into the shoe print - and couldn't help but laugh. As I watched her crouch down and look down at me, and surveyed the endless trail of shoe prints all around me, I could hardly imagine what would have happened if she'd actually brought that foot down just now... I was still in a daze when, suddenly, a water balloon nearly drowned me. \"Gurgle, gurgle - \" What's going on? Where did this water come from? Wait, why is it warm? Could it be...? I couldn't believe it, but I felt as if I'd been tossed into a vat of glue - I couldn't break free. When I finally managed to break free and looked up, I discovered - \n\nNiao Yin's mouth was slightly open, and from the tip of her outstretched tongue, a long, stringy trail of saliva fell, landing squarely on me. And yet, that single, simple drop was enough to keep me struggling for nearly ten minutes before I could barely break free. \"You're all dirty, so now you're all clean.\" When I realized that the droplet that had suddenly hit me was actually the \"fine wine\" the girl had mentioned, I felt as if something inside me had completely shattered.""
  # \"好......好黏......\"
  gts_ora.4302.a: ""\"It's... so sticky...\"""
  # 梦醒，寒岭之行
  gts_ora.4303.name: ""Awakening from a Dream: A Journey to Hanling""
  # 突然一个寒颤，却将自己带离了那段记忆中的监狱，而睁开眼，此刻已然来到了此地，名为极寒之地的存在 -  - \n\n好冷......即使自己此时的大小已经接近四五千米，树木和山峦构成的地毯，甚至都无法触及到自己鞋底的高度。只是有句老话说道：\"高处不胜寒\"，风雪夹杂着低温还是让自己不由得裹紧衣服。\n\n\"外勤任务......协助领袖：鸟音山水 对寒岭的某星球的气候复苏工作。\"\n\n按理来说，鸟音大概三个小时前就来到这里了。只是面前的大雪，即使此刻的自己已经不再是一个小人，能见度却仍不及几千米。不过有一点可以确认......是我来早了。
  gts_ora.4303.desc: ""Suddenly, a shiver jolted him out of that prison of memory, and when he opened his eyes, he found himself here - in a place known as the Land of Extreme Cold - \n\nIt's so cold... Even though I was now nearly four or five thousand meters tall, the carpet of trees and mountains couldn't even reach the soles of my shoes. But as the old saying goes, \"It's colder at higher altitudes,\" and the wind and snow, combined with the freezing temperatures, made me instinctively pull my coat tighter.\n\n\"Field mission... Assist Leader: Qinwen with climate restoration efforts on a planet in Hanling.\"\\ n\nLogically speaking, Torine should have arrived here about three hours ago. But with the heavy snowfall before me - even though I'm no longer a Tiny person - visibility is still less than a few thousand meters. One thing is certain, though... I'm early.""
