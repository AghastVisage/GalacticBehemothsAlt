  concept_gts_ora_hitomi_black_card: ""§I$gts_trait_hitomi_ora_black_card$§!""
  # §Y御月希瞳§!\n每月£energy£ $energy$：§R-6480§!\n\n§Y任职星球总督时§!\n障碍清理速度：§G+150%§!\n障碍清理花费：§R+50%§!\n行星基础设施建造速度：§G+150%§!\n行星基础设施建造花费：§R+50%§!\n岗位产出的£gts_giantess_underwear£ $gts_giantess_underwear$：§G+50%§!
  concept_gts_ora_hitomi_black_card_desc: ""§Y Mizuki Hitomi§!\nMonthly £energy£ $energy$: §R-6480§!\\ n\n§Y while serving as Planetary Governor§!\nObstacle Clearance Speed:§G+150%§!\nObstacle Clearance Cost:§R+50%§!\nPlanetary Infrastructure Construction Speed:§G+150%§!\\ nPlanetary Infrastructure Construction Cost: §R+50%§!\nPosition-Generated £gts_giantess_underwear£ $gts_giantess_underwear$: §G+50%§!""
