  # 只是做了件无关紧要的事情罢了......至于您想凑近一些看的话......不妨可以靠近一些呢，放心，我以我的生命起誓，不会有危险的。
  gts_ora.1099.a.response: ""It was just a trivial matter... As for if you'd like to get a closer look... feel free to come a little closer. Don't worry - I swear on my life that there's no danger.""
