  gts_ora.1001.c: ""Actually... I have an idea that's still a bit half-baked...""
  # 橘子长留在帝国内，并开启小橘线的内容。
  gts_ora.1001.c.custom: ""Ora stays in the Empire and unlocks the \"Little Ora\" storyline.""
