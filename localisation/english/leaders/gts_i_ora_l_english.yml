  # \"孤立\"无援，以念作帜
  gts_ora.1130.name: ""\"Isolated\" and without support, using prayer as a banner""
  # 是啊，你绝无独自一人。\n她曾独立面对神明，但这绝不是她自己一个人的力量。而是所有人，每个人给予了她依赖，帮助，以及最为重要的......信念\n\"永恒\"的诞生只需一份执念，她将超脱时间，空间，超脱一切物理法则，一切因果。当然也包括体型和力量上的差距......\n\"时间\"的尺度还有很长，在十二点的钟声前，先休息吧，我为你将此停摆。\n你的\"记忆\"比任何繁星加起来都要璀璨，所以......请珍惜，哪怕要为此负荆挂棘......\n不要感到痛苦......那是\"法则\"为你加诸的冠冕，此刻......你已宛如神明。\n\"那就让\"终焉\"，为你的敌人写下星海间的安魂曲。\"\n\"最后......\" maiden举起长伞，面向对方这般超越天体，超越星系，甚至万界的造物主 -  - 也是她旧时的至交。\n\"而在我写下的'空间'中，你，想不到我身边会有多少人。\"\n\n尘埃散去，虚假的幻境已然被 maiden撕裂，而前方的虫群也在瞬间将你们团团包围。不过......在橘子长和[event_target:gts_ora_2_system_first_leader.GetName]的帮助下，或许这一切......都将是一定能度过的难关。
  gts_ora.1130.desc: ""That's right - you are by no means alone.\nShe once stood alone before the gods, but that was by no means her own strength alone. Rather, it was everyone - every single person - who gave her support, help, and most importantly... Faith\nThe birth of \"Eternity\" requires only a single resolve; she will transcend time, space, all physical laws, and all cause and effect. This, of course, includes disparities in size and strength...\nThe span of \"time\" is still long. Before the clock strikes twelve, rest for now. I will pause it for you.\nYour \"memories\" shine brighter than all the stars combined, so... cherish them, even if it means bearing thorns and thistles...\nDo not feel pain... that is the crown bestowed upon you by the \"Laws.\" At this moment... you are already like a god.\n\"Then let 'The End' compose a requiem for your enemies amidst the starry sea.\"\n\"Finally...\" The girl raised her long umbrella, facing the one who transcended celestial bodies, galaxies, and even all worlds - the Creator, who was also her former closest friend. \n\"And within the 'space' I have created, you would never imagine how many stand by my side.\"\n\nAs the dust settled, the illusory realm had already been torn apart by the girl, and in an instant, the swarm ahead surrounded you both. However... with the help of Ora and [event_target:gts_ora_2_system_first_leader.GetName], perhaps all of this... will be a challenge we can surely overcome.""
  # 继续前进。
  gts_ora.1130.a: ""Let's keep going.""
