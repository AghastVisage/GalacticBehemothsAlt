  #  寻找“她”的过去
  gts_ora.1007.name: "Search for \"Her\" Past"
  #  她的过去成谜，想找到一个天体级巨娘的过去谈何容易？因此你决定：在宇宙间寻找有关“橘子长”的各种内容，而她却如人间蒸发一般了无音讯，\n30年过去了，她到底变成了什么样？她是否还存在？你一无所知，可就在你觉得束手无策的时候，有一日，你闲来无事，翻开了那本手账，却突然找到了这样一句话，像是……一则日记的开头，或者说，日期？\n“2021年……孤星……”\n\n（你是否准备好了解“她”的过去？）
  gts_ora.1007.desc: "Her past is a mystery. How could finding the past of a celestial-scale giantess ever be easy? And so you decide to search the universe for all kinds of information related to \"Orange Chief,\" but she has vanished without a trace, as if she evaporated from existence.\\nThirty years have passed. What has she become? Does she still exist? You know nothing. Yet just when you feel utterly helpless, one day, with nothing else to do, you open that journal and suddenly find these words, like... the beginning of a diary entry, or perhaps a date?\\n\"Year 2021... Lonely Star...\"\\n\\n(Are you ready to learn about \"her\" past?)"
  #  是
  gts_ora.1007.a: "Yes"
