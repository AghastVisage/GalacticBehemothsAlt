  concept_gts_ora_hitomi_salary_card: ""§I$gts_trait_hitomi_ora_salary_card$§!""
  # §Y御月希瞳§!\n领袖维护费：§G-500%§!\n每月£energy£ $energy$：§G+648§!\n每月£food£ $food$：§G+100§!
  concept_gts_ora_hitomi_salary_card_desc: ""§Y Mizuki Hitomi§!\nLeader Maintenance Fee: §G-500%§!\nMonthly £energy£ $energy$: §G+648§!\nMonthly £food£ $food$: §G+100§!""
  # §I双月希瞳强化模块§!
  concept_gts_ora_hitomi_dual_mode: ""§I Double-Moon Hitomi Enhancement Module§!""
  # §Y$gts_trait_hitomi3$§!\n所在舰队舰船维护费：§G-80%§!\n每月£gts_giantess_fluid£ $gts_giantess_fluid$：§G+100§!\n每月£gts_giantess_underwear£ $gts_giantess_underwear$：§G+50§!\n\n§Y$gts_trait_hitomi4$§!\n领袖维护费：§R+1000%§!\n所在舰队对船体、护盾和装甲伤害：§G+1000%§!\n\n可通过双月希瞳的通讯切换模式。
  concept_gts_ora_hitomi_dual_mode_desc: ""§Y$gts_trait_hitomi3$§!\nShip maintenance costs for the fleet: §G-80%§!\nMonthly £gts_giantess_fluid£ $gts_giantess_fluid$: §G+100§!\\ n Monthly £gts_giantess_underwear£ $gts_giantess_underwear$: §G+50§!\n\n§Y$gts_trait_hitomi4$§!\n Leader Maintenance Cost: §R+1000%§!\\ n Damage dealt by the fleet to hull, shields, and armor: §G+1000%§!\n\nYou can switch modes via Double-Moon Hitomi's communication every two months.""
  # §I三月希瞳探索模块§!
  concept_gts_ora_hitomi_exploration_mode: ""§I Hitomi Mitsuki Exploration Module §!""
  # §Y异常专精§!\n异常现象研究速度：§G+100%§!\n调查速度：§G+100%§!\n亚光速航速：§G+150%§!\n\n§Y考古专精§!\n考古发掘速度：§G+300%§!\n亚光速航速：§G+150%§!\n\n可通过双月希瞳的通讯切换三月希瞳的探索模式。
  concept_gts_ora_hitomi_exploration_mode_desc: ""§Y Anomalies Specialization§!\nAnomaly Research Speed: §G+100%§!\nInvestigation Speed: §G+100%§!\\ n Sublight Speed: §G+150%§!\n\n§Y Archaeology Specialization§!\n Archaeological Excavation Speed: §G+300%§!\\ n Sublight Speed: §G+150%§!\n\nYou can switch Hitomi Mitsuki's exploration mode via Double-Moon Hitomi's communication system.""
