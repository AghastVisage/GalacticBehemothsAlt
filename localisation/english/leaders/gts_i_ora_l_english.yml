  #  无忆虚构的梦界，众星尽头的救赎，信念堆成的高塔……\n少女化作勇者，冲向笔下的风车，而做完这一切后，她合上书本，因为……\n脚下来了一群不速之客。\n少女来到这个世界并没有毁坏任何东西，除了时不时来到城市街道买点东西的行为让人们有点恐慌以外，更多的时间还是坐在那片废弃城区中。在那片破败的砖瓦中，似乎只有这片远离人间的地方，可以成为她笔下生花的土壤。只是……\n似乎这里也不是她的容身之所。\n\n“不管你从何而来……请你速速离开地球，否则……”\n\n赤裸裸的孤立，对异体的排斥，这似乎是生物本能的反应，或者说……是来自于渺小的恐慌，而此刻，却化作一颗155mm的炮弹，被少女单手接下。看着脚下的铁皮盒子，少女叹了口气。\n因为这是第六次如此，也是她最后的耐心了。\n丢掉指尖的小石子，少女站起身，轻轻抬起了自己的鞋子——制造它的主人刻意将鞋底做的相当厚实，恐怕就是为了踩掉这些烦人的小东西吧。\n“怪物已经有了攻击反应，开火……诶诶？别跑！”\n鞋子轻轻压在了铁皮盒子的顶端，稍稍用力，却宛如随处可见的塑料瓶一般，丝毫没有感觉到有什么生命的存在，而那个站在铁皮盒子顶端的小家伙……则被少女捏了起来，仔细端详着。\n黄昏为少女的麻花辫蒙上了一层橘红，却将少女的侧颜勾勒上了一笔绝美的色彩，只是少女并不知道自己竟有如此魅力，只是在想……为什么这个小家伙的心脏会跳的这么快？扑通——扑通——原来把这些小家伙捏住是这种感觉吗？\n软软的，似乎轻轻一捏就会碎掉一样……手指想捏的稍微轻一点，却又害怕会突然松手让小家伙滑下去，总之，这样的小生物在自己指间挣扎，引起了少女的兴趣。她想尝试着沟通一下……哪怕没有任何人去回应。但是……她想发声。\n“那个……你好？”\n“别吃我别吃我……”\n少女想多了，却突然提醒了她：“吃？……什么是吃呢？“少女曾在想这种问题，似乎从她诞生起，就没有过要进食的设定。那种……可以把东西塞进嘴里，吞咽，随后在胃里消化掉食物的感觉……不如先从这个小家伙试试呢？\n少女如此想着，张开了口，粉嫩的口腔毫无吝啬地在小人面前，展示着自己生杀予夺的权利，洁白的牙床，颤动的喉花，从上颚处往下滴落的唾液，在口腔间形成的拉丝，宛如溶洞一般，却带着一股柑橘的芬芳。\n松开手指，已经能感觉到舌尖有一个微小物体落入了此处。顺着舌苔的蠕动慢慢往深处滑下，能感受到小人挣扎的感觉，宛如在深海中溺水的船员一般，只能看着漆黑的海底在一点一点地吞噬着自己……让自己不再是自己，而是化为某些东西的一部分……\n\n“她……她是吃人了吧……她尝到咱们的味道了……”\n“我们……都会被她吃掉吗……我不想被吃掉啊……”\n\n食之无味，却宛如伊甸园的苹果一般，令人难以回头。少女舔了舔嘴角，开始往围观的人群靠近，人们四散逃开，却心怀绝望。此刻，这些小人已然不再是生物链的顶端，而是某个少女的“零食”。\n\n她……曾有过这样的一面吗？\n你不敢想，回过头仰望时，却看到远处那根矗立在远方的巨大吸管。你站在这片荒芜的废弃城区中，见到了她所看到的景象，也如她一般，记下了她的故事
  gts_ora.1011.desc: "A memoryless, fictional dreamworld; salvation at the end of the stars; a high tower built from faith...\\nThe girl became a hero and charged toward the windmills beneath her pen. After doing all of this, she closed the book, because...\\nA group of unwelcome guests had arrived beneath her feet.\\nThe girl had not destroyed anything after coming to this world. Aside from occasionally going to city streets to buy things, which frightened people somewhat, she spent most of her time sitting in that abandoned urban district. Among those ruined bricks and tiles, it seemed only this place, far from human society, could become the soil where flowers bloomed beneath her pen. It was just that...\\nIt seemed this was not a place she could belong either.\\n\\n\"No matter where you came from... please leave Earth immediately, or else...\"\\n\\nOpen isolation, rejection of an alien body. This seemed to be an instinctive biological reaction, or perhaps... fear born from smallness. And at this moment, it became a 155mm shell, caught by the girl with one hand. Looking at the metal box beneath her feet, the girl sighed.\\nBecause this was the sixth time, and also the end of her patience.\\nDropping the little pebble at her fingertip, the girl stood up and gently raised her shoe. The master who created it had deliberately made the sole quite thick, probably for the purpose of stepping on these annoying little things.\\n\"The monster has shown an attack response. Open fire... eh? Hey? Do not run!\"\\nHer shoe gently pressed down on the top of the metal box. With just a little force, it felt like an ordinary plastic bottle, with no sense that any life existed inside. And the little fellow standing on top of the metal box... was pinched up by the girl and examined carefully.\\nDusk draped the girl's braids in a layer of orange-red, outlining her profile with breathtaking color. But the girl did not know she possessed such charm. She was only wondering... why was this little fellow's heart beating so fast? Thump, thump. So this is what it feels like to pinch these little fellows between one's fingers?\\nSoft, as if they would shatter with the slightest squeeze... Her fingers wanted to hold a little more gently, yet she was afraid that if she loosened them too suddenly, the little fellow would slip and fall. In any case, this tiny creature struggling between her fingers aroused the girl's interest. She wanted to try communicating... even if no one would answer. But... she wanted to speak.\\n\"Um... hello?\"\\n\"Do not eat me, do not eat me...\"\\nThe girl had overthought it, but those words suddenly reminded her: \"Eat?... What is eating?\" The girl had once wondered about such things. It seemed that from the moment she was born, she had never been given the setting of needing to eat. That feeling of... putting something into one's mouth, swallowing it, and then digesting the food in one's stomach... why not first try with this little fellow?\\nThinking this, the girl opened her mouth. Her pink oral cavity generously displayed before the little person her power over life and death: white gums, a trembling uvula, saliva dripping down from the roof of her mouth and drawing threads between the oral walls. It was like a cavern, yet carried a citrus fragrance.\\nWhen she released her fingers, she could already feel a tiny object landing on the tip of her tongue. As it slowly slid deeper with the movement of her tongue coating, she could feel the little person's struggle. It was like a sailor drowning in the deep sea, able only to watch the pitch-black seabed swallow them bit by bit... making them no longer themselves, but part of something else...\\n\\n\"She... she ate someone, right... she tasted us...\"\\n\"Are we... all going to be eaten by her... I do not want to be eaten...\"\\n\\nTasteless, yet like the apple of Eden, impossible to turn back from. The girl licked the corner of her mouth and began moving toward the surrounding crowd. People scattered and fled, but their hearts were filled with despair. At this moment, these little people were no longer at the top of the food chain, but a girl's \"snacks.\"\\n\\nDid she... once have such a side?\\nYou dare not think about it. When you turn back and look up, you see the gigantic straw standing far away. You stand in this barren, abandoned urban district, witnessing the sights she once saw, and like her, recording her story."
