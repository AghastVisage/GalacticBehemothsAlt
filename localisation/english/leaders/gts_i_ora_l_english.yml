  # 巨娘财务报单
  gts_ora.3001.name: ""Giantess Financial Report Form""
  # 一天的时间悄然结束......你嚼着嘴里的口香糖，看着桌子上的巨娘报销单。\n\n\"今早八点某巨娘因被小人指责踩坏汽车导致踩踏，致使半个城市惨遭足底毁灭......\"\"中午10点因为巨娘太饿闯入小吃街导致整个小吃街被碾碎在巨娘的舌苔下......夜间因为巨娘绊倒高压输电线致使大半个城区停电......\"\n\n将所有物种纳入同一个星球里生活是谁的决议来着？你不记得了。只是在这一大堆领袖天体级别的报销单中......你却发现了一个特别特殊的存在......\n\n为何橘子长的报销单上写着一个1？
  gts_ora.3001.desc: ""The day quietly came to an end... You chewed your gum as you looked at the Giantess's expense report on the table.\n\n\"At 8:00 a.m. this morning, a certain Giantess, accused by a Tiny person of crushing a car, went on a rampage, causing half the city to suffer destruction at the soles of her feet...\" \" At 10 a.m., a Giantess, overcome by hunger, stormed into the food street, crushing the entire area beneath her tongue... At night, a Giantess tripped over a high-voltage power line, causing a blackout across most of the city...\"\\ n\nWhose decision was it to have all species live together on the same planet? You don't remember. But among this mountain of celestial-level expense reports... you discovered one that stood out as particularly special...\n\nWhy does the Ora's expense report have a \"1\" written on it?""
  # 找橘子长问明白
  gts_ora.3001.a: ""Ask Ora for clarification""
  # 发起特殊项目：§Y找橘子长问清情况§!。派遣任意舰船前往§Y孤星监狱§!轨道，调查需要§Y15天§!。
  gts_ora.3001.a.custom: ""Launch a special mission: §Y Contact Ora to clarify the situation§! Dispatch any ship to the orbit of §Y Lone Star Prison§!; the investigation will take §Y 15 days§!.""
  # 这家伙......偷税了？
  gts_ora.3001.b: ""This guy... evaded taxes?""
  # 你的\"1\"，只划给我的范围内。
  gts_ora.3011.name: ""Give your \"1\" only to those within my circle.""
  # \"你来了呢......\"\n\n见一个天体级巨娘的画面你想了很多次，直到你来到了她管理的星球内。却偶然像是明白了什么似的，走到了橘子长所在的办公室内。\n\n偌大的办公室只是对自己这样的体型而言。只是对于她而言，一张足够容得下公文的桌子，一把椅子，一张床，一处洗漱台， 此外，就只剩下一冰箱的饮料。或许这些东西可以养活不少小人......甚至拉高一整个城市的GDP都不在话下。但唯独是对她而言，或者说，对于那些动辄消耗以星球为单位的巨娘面前：\n\n节约，却井井有条。恐怕是对这个巨娘的真实写照。\n\n\"那个......你这个财务报单......这个1是？\"\n\n一旁的小人下属将热茶送在了你的手中，却更加让你感到诧异几分：这个小人......体型和你相近的小人。是不是一年前你安排在橘子长手里的那个？那也就意味着......想比那些都能称之为消耗品的存在，橘子长却从来没有换过。难道说？\n\n你不敢相信星海里会有一个从来不对小人做什么的天体级巨娘。除非这个1是？\n\n\"这个啊......这个1这不是来了嘛......\"\n\n在橘子长示意让下属离开后，你的身体被她捏了起来。果不其然，在你来到这里的时候你就已经在想这种事情的可能性。只是，却没想到被 maiden捏起来的触感却是如此的复杂。\n\n一边是带有温度的细腻肉体，一边是勒住绷紧的致密的尼龙手套纹路。一边白，一边黑，就这么被夹在食指和中指之间，顺应着手的移动而将你抬起，直到逐渐靠近橘子长的脸。你试图挪开视线，可下意识低头的瞬间，却看到下方没有任何缓冲的高空，如果，我是说如果，自己一定要被一个巨娘这样捏着玩弄的话......你希望对方的罩杯能大一些，最好是能接住自己的程度。只是现在，这些也只能是想想而已。而就在你闭上眼，在想自己究竟要被一个巨娘作何玩弄时 -  - 一股湿润而又温暖的感觉却席卷了你的全身，或者说是正面。\n\n湿润，柔软，像是陷在了柔软的床铺上 -  - 不对，或者说一辆裹满了棉花的大运在轻轻的接触着你，却仿佛经过里连绵的阴雨天一般，身体湿漉漉的，裹满了粘稠的液体，让你不禁怀疑雨伞的用处。但就算如此，从温暖中飘出的淡淡柑橘香却让你萌生出了想睁开眼的想法，而睁开眼的一刹那，却看到了一片粉色。\n\n正是橘子长那柔软的舌苔。\n\n\"现在......这个1就算报销了哦。\"
  gts_ora.3011.desc: ""\"You're here...\"\n\nYou'd imagined the sight of a Celestial Giantess countless times, until you finally arrived on the planet she governed. But then, as if suddenly realizing something, you walked into the office where Ora was located.\n\nThe vast office was spacious - but only relative to a figure like yours. But for her, it consisted of nothing more than a desk large enough to hold official documents, a chair, a bed, a sink - and a refrigerator full of drinks. Perhaps these items could sustain quite a few Tiny people... or even boost an entire city's GDP with ease. But for her - or rather, for a Giantess who routinely consumes resources measured in planetary units - \n\nfrugality and organization were, it seemed, her true hallmarks.\n\n\"Um... on this expense report of yours... what does this '1' mean?\"\\ n\nA tiny person standing nearby handed you a cup of hot tea, but this only made you even more puzzled: this tiny person... a tiny person about your size. Could this be the one you assigned to Ora a year ago? If so, that would mean... Unlike those beings who could be called disposable, Ora has never replaced this one. Could it be?\n\nYou couldn't believe there would be a Celestial Giantess in the Star Sea who never did anything to her Tiny people. Unless this \"1\" is...?\n\n\"Oh, this... this '1' - well, it just showed up...\"\\ n\nAfter Ora motioned for her subordinate to leave, she picked you up in her hand. Sure enough, ever since you arrived here, you'd already been considering the possibility of something like this. You just hadn't expected the sensation of being held by the young girl to be so complex. \n\nOn one side was warm, supple flesh; on the other, the tight, ribbed texture of a nylon glove. One side white, the other black - you found yourself sandwiched between her index and middle fingers, lifted as her hand moved, gradually drawing you closer to Ora's face. You tried to look away, but the moment you instinctively lowered your head, you saw the sheer drop below with no cushioning at all. If - and I mean if - you absolutely had to be pinched and toyed with by a Giantess like this... you'd hope her cup size would be larger, preferably big enough to catch you. But for now, these were just fantasies. And just as you closed your eyes, wondering exactly how a Giantess would toy with you - a moist, warm sensation swept over your entire body, or rather, your front. \n\nMoist, soft - as if you'd sunk into a plush bed... No, more like a large truck wrapped in cotton was gently brushing against you, yet it felt as though it had been through days of continuous, drizzling rain -  your body is soaked, covered in a viscous liquid, making you wonder what good an umbrella is. But even so, the faint citrus scent wafting from the warmth makes you want to open your eyes, and the moment you do, you're met with a sea of pink. \n\nIt was the soft white pith inside Ora.\n\n\"Now... this one's a write-off.\"""
  # 算了，舔就舔吧。
  gts_ora.3011.a: ""Oh well, I guess I'll just have to suck it up.""
  # 别一时兴起给我吞了就行......
  gts_ora.3011.b: ""Just don't go swallowing it on a whim...""
  # 完了衣服记得赔（）
  gts_ora.3011.c: ""Don't forget to pay for the clothes when it's all over ()""
  # 找橘子长问清情况
  gts_ora_financial_report_project: ""Ask Ora to find out more about the situation""
  # 橘子长的财务报单上只有一个\"1\"，这与其他巨娘的巨额报销形成了鲜明对比。派遣任意舰船前往孤星监狱轨道，向她问清情况。调查需要15天。
  gts_ora_financial_report_project_DESC: ""Ora's expense report shows only a single \"1,\" which stands in stark contrast to the massive reimbursement claims submitted by the other Giantesses. Dispatch any ship to the orbit of Lone Star Prison to get the details from her. The investigation will take 15 days.""
  # 孤星监狱轨道内的任意舰队：$COUNT$/$REQUIRED$。
  gts_ora_financial_report_project_requirement: ""Any fleet within the Lone Star Prison orbit: $COUNT$/$REQUIRED$.""
  # 为千海做惊喜大礼
  gts_ora_qhai_gift_project: ""A Surprise Gift for Qianhai""
  # 为千海制作一份惊喜礼物。项目需要2000社会学研究，必须在18个月内完成，完成后消耗5000巨娘之力。
  gts_ora_qhai_gift_project_DESC: ""Create a surprise gift for Qianhai. The project requires 2,000 sociology research points and must be completed within 18 months; upon completion, it will consume 5,000 Giantess Power.""
  # 至少拥有 £gts_giantess_human£ 5000 巨娘之力。
  gts_ora_qhai_gift_project_requirement: ""Possess at least £gts_giantess_human£ 5,000 of Giantess Power.""
  # 构建宇宙的帷幕
  gts_ora_qhai_stream_project: ""The Curtain Behind the Universe's Creation""
  # 或许让一个宇宙化身的存在临幸此处绝对不是一个明智的选择......但无论如何，作为帝国中的一份子，即使这份情感属于自己的一厢情愿，即使自己的力量在这片星海中过于渺小......既然这样的愿望可以实现，那就做下去吧。
  gts_ora_qhai_stream_project_DESC: ""Perhaps inviting a being who is the embodiment of the universe to grace this place is by no means a wise choice... But in any case, as a member of the Empire - even if this feeling is nothing more than a one-sided hope of my own, even if my power is far too insignificant in this vast sea of stars... since this wish can come true, then I will see it through.""
  # 裙底儿童乐园
  gts_ora.3002.name: ""Children's Playground Under the Skirt""
  # 近日，突然有一则报导传到了你的手中。\n某星球的极限体验点被突然改造成了儿童乐园，专门对身高不足1.2厘米的小人买票游玩，且家属大多数都保持放心的态度甚至自己都有想变成儿童进去玩的想法......\n这样的想法，却令你不安。因为这个地点发生在任何地方都不会太奇怪，非法的极限体验园中或许真的有那些为非作歹的巨娘，会选择专门对小孩子动手......但好死不死的就是，这个事情发生的地方 -  - \n却是橘子长目前所管辖的星球中。
  gts_ora.3002.desc: ""Recently, a news report suddenly caught your attention.\nAn extreme experience park on a certain planet has been suddenly converted into a children's playground, specifically selling tickets to tiny persons under 1.2 centimeters tall. Most parents seem unconcerned - and some even fantasize about becoming tiny persons themselves so they can go in and play...\\ nSuch thoughts, however, unsettle you. After all, it wouldn't be too strange for something like this to happen anywhere - illegal extreme experience parks might very well harbor malevolent Giantesses who specifically target young children... But as luck would have it, the place where this is happening - \nis one of the planets currently under Ora's jurisdiction.""
  # 我看看怎么个事？
  gts_ora.3002.a: ""Let me see what's going on.""
  # 
  gts_ora.3002.a.custom: """"
  # 裙底儿童乐园
  gts_ora.3012.name: ""Children's Playground Under the Skirt""
  # 你来到了橘子长所在的星球......也看到了这个所谓的儿童乐园到底为何物。同时你也验证了你的心中所想：你的担心不是多余的。\n天体级别的行政官，此刻却只是屈膝跪地，那双特制的厚底运动鞋此刻已不再是能拦住小人的巨大天堑。小孩子爬到了堪比大楼一般高大的腿上，在裙底的荫蔽下自由玩闹......有的小人在尝试往上爬，但你也清楚，这样的高度，哪怕是成年人都爬不到这高耸如云的裙底。有的小孩子甚至尝试将手伸进开了裆的裤子里......想尝试未到年龄的功能，不过很可惜，现在还不是时候。\n\"你来了呢......是要买票吗？\"\n很显然，即使橘子长的年龄怎么看都不像是比你年长的样子......可是就算不论年龄，你的体型在对方的眼里或许确实像是一个\"小\"孩子。'\n\"好了，咱开个玩笑......1.2厘米的小人免票哦......\n虽然你很想澄清自己的身高......但是橘子长下一刻手里拿起的超大尺寸卷尺又打消了你要验牌的冲动。毕竟按照橘子长这个计量标准来看，她在这里纯粹只是想让小人往自己的腿上爬。当然有句话也说的正是道理：\"来都来了...\"\n你趴在 maiden的小腿上，似乎在一堆小孩的簇拥中，你还能感觉到 maiden身体中所散发出来的一丝温度。渐渐地，刚刚诞生出的危机感也在一点点的烟消云散。你不知道那些小孩子是怎么想的，你也不知道橘子长的用意究竟是如何，才会让这样未经世事的小孩子如此接近自己。渐渐地，你也开始往上爬了起来， maiden皮肤的柔软似乎找不到合适的发力点，因此你无论如何努力，却也只是向上爬了十几米的高度就滑落下来。果然，像电视里看到的那种景象还是骗人的。巨娘高耸入云的双腿虽然如此诱人......却对这样慕名而来的你拉开了应该有的距离。\n\"你知道一个故事吗？曾经有一个很温柔的巨娘，她每天都会收留无数个小人并且很热情的把那些小人养在自己的身边......她自以为可以把小人的一生都保护好，直到被巨娘保护的小人想出去看看外面的世界......\"\n橘子长顿了两秒，语气间却变了一个调。转而变成了一种较为沉重的语气：\n\"只见过那一个巨娘的小人，却天真的以为所有的巨娘都是这个样子的，而这样的小人开始天真的找那些以摧毁小人为乐的家伙寻求保护的时候......\"\n\"所以嘛......要先让小人知道这些地方有多么可怕，让这些小家伙知道这么大的鞋子应该离的远远的......懂我的意思了吧。\"
  gts_ora.3012.desc: ""You've arrived on the planet where Ora resides... and seen for yourself what this so-called \"children's playground\" is really like. At the same time, you've confirmed what you'd suspected: your concerns were not unfounded. \nA celestial-level administrator was now simply kneeling on the ground; those specially made thick-soled sneakers were no longer a massive barrier capable of stopping tiny persons. Children had climbed onto legs as tall as skyscrapers and were playing freely in the shade beneath her skirt... Some of the tiny persons were trying to climb up, but you knew full well that at this height, even adults couldn't reach the hem of that skirt, which soared as high as the clouds. Some children even tried to slip their hands into the open crotch of her pants... eager to explore functions they weren't yet old enough for, but unfortunately, the time wasn't right yet. \n\"You're here... Are you here to buy a ticket?\"\nObviously, even though Ora doesn't look any older than you... but regardless of age, your stature might indeed appear \"small\" to the other person. '\n\"All right, just kidding... 1.2-centimeter-tall Tiny persons get in free...\n\" Although you really wanted to clarify your height... the extra-large tape measure that Ora pulled out the next moment quickly quashed any urge you had to verify your height. After all, judging by Ora's standards, she's here purely to have Tiny people climb onto her lap. Of course, there's a saying that rings true: \"Since I'm already here...\"\\ n As you lie on the girl's calf, seemingly surrounded by a crowd of children, you can still feel a hint of warmth radiating from her body. Gradually, the sense of unease that had just arisen begins to fade away bit by bit. You don't know what those little kids are thinking, nor do you know what Ora's true intentions are - why she would let such innocent, naive children get so close to her. Gradually, you start climbing up as well, but the softness of the girl's skin makes it hard to find a proper foothold, so no matter how hard you try, you only manage to climb a dozen or so meters before slipping back down. Sure enough, the scenes you'd seen on TV were just an illusion. Though the Giantess's sky-high legs were so alluring... they kept you - who'd come here drawn by her reputation - at a safe distance. \n\"Do you know a story? Once upon a time, there was a very gentle Giantess who would take in countless tiny people every day and warmly care for them by her side... She believed she could protect them for their entire lives, until the tiny people she protected wanted to go out and see the world...\"\\ n Ora paused for two seconds, but the tone of her voice shifted. It turned into a somewhat heavier tone:\n\"The tiny people who had only ever seen that one Giantess naively believed that all Giantesses were like her. And when these tiny people began, in their innocence, to seek protection from those who took pleasure in destroying them...\"\\ n\"So... we need to let the tiny persons know just how terrifying these places are, so they'll understand they should stay far away from shoes this big... You get my drift, right?\"""
  # 这就普及小人义务教育！
  gts_ora.3012.a: ""This is how we provide compulsory education for tiny persons!""
  # 加班时刻的休憩
  gts_ora.3003.name: ""A Break During Overtime""
  # 加班的时间会让一切都变得好久......在你决定在孤星监狱休息一晚的时候却发现......\n\n似乎此时却是小人的禁足期。\n\n你确实很少在别的地方见过这种情况，在巨娘大致要放学和下班的时间段内，小人只能躲在建筑物内，以免被一些巨娘无意识的踩踏。这样的情况一般只出现在巨娘和小人合理共存的城市内。虽然这样做对小人来说确实有些许的不公平......但是在一些更好的办法出现之前，还是尚且如此吧。\n\n孤星监狱的建筑尚且处于未翻新的范围内，很多城市依然保留着旧时代的建筑。不过细心的你却发现了，似乎远处还能看到一些塔吊的灯光和一些泰坦级巨娘的叫喊声，看上去应该是在施工些什么吧。\n\n既然出不去，不如看一下橘子长吧，正好在同一个楼。\n\n你如此想着，随着台阶来到了橘子长的位置却发现：她还在，此刻却是在闭眼休憩。那本她一直留在她身边的手账本摊开，上面似乎还画着类似建筑图纸一般的内容。只是对比手账本上那偏儿童画一般的画风相比，桌子上正在画的蓝图就有点工整许多......\n\n\"体型共存建筑\"，你很难想象到橘子长还会整这些，但是这个建筑的结构......你并不是这个领域的专家，但是你看到橘子长最近贴着创可贴的手，和周围乱七八糟的模型还有美工刀的时候，你才后知后觉起来：这家伙已经好几天没合眼了。\n\n你很想给她盖个被子，或者抱着她抱到床上，很可惜你现在的体型，即使橘子长的大小和一般巨娘差不多，这也是无论如何都办不到的事情。你尝试了许久，这才堪堪的将橘子长手上的铅笔取了下来，却感觉在抬一根粗大的圆木一般费力。算了，至少你这样小小的举动能够让她放下工作一会吧......在你把这根粗大的铅笔藏起来之后。
  gts_ora.3003.desc: ""Overtime makes everything feel like it takes forever... Just when you decide to spend the night at Lone Star Prison, you realize...\n\nIt seems this is actually the Tiny people's curfew period. \n\nYou've rarely seen this kind of situation elsewhere. Around the time when the Giantesses are getting out of school or finishing work, the Tiny People have to hide inside buildings to avoid being accidentally trampled by them. This usually only happens in cities where Giantesses and Tiny People coexist harmoniously. Although this is indeed a bit unfair to Tiny People... until a better solution emerges, this is how things will have to be for now.\n\nThe buildings at Lone Star Prison are still in the unrenovated section, and many cities still retain architecture from a bygone era. However, if you look closely, you'll notice the lights of construction cranes in the distance and the shouts of some Titan-class Giantesses - it looks like some kind of construction project is underway.\n\nSince I can't go out, I might as well check on Ora; she's in the same building anyway. \n\nWith that in mind, you follow the stairs to Ora's office only to find: she's still there, but right now she's resting with her eyes closed. The notebook she always keeps by her side is open, and it appears to contain something resembling architectural blueprints. However, compared to the childlike style of the sketches in the notebook, the blueprints she was drawing on the table were much neater...\n\n\"Body-Integrated Architecture\" - it's hard to imagine Ora working on something like this, but the structure of this building... You're no expert in this field, but when you saw Ora's hand - still covered in Band-Aids - along with the messy models and craft knife scattered around her, it finally dawned on you: this girl hasn't slept a wink in days. \n\nYou really want to tuck her in with a blanket or carry her to bed, but unfortunately, given your current size - even though Ora is about the same size as an average Giantess - that's simply impossible. You tried for a long time before you finally managed to pry the pencil from Ora's hand - though it felt as strenuous as lifting a thick log. Oh well, at least this small gesture might get her to take a break from work for a while... after you've hidden that thick pencil away.""
  # 就让她休息一会吧。
  gts_ora.3003.a: ""Let her rest for a while.""
