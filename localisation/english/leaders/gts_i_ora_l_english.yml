  # 求神无望，空余\"恐慌\"
  gts_ora.1131.name: ""With no hope in God, all that remains is \"fear\"""
  # 天黑了。\n几十亿年的恒星已然被 maiden一口吞下，而仅仅只有几千年的人类文明又作何抵挡？这时，你们明白到了一个道理：你们早已被这场反击战的胜利冲昏了头脑，而忘记了对方并非未开智的巨兽 -  - 那答案只有一种。\n神明......抱歉，在此地同生共死的人类早已不再对她有任何敬畏。人类只想让天空中这个自命不凡的家伙在吞掉自己之前，用手里的武器给予对方迎头痛击 -  - 而在这颗孤星陷入永夜的第十五天后，你们却在一片人造灯光中看到了更为恐怖的东西：\n那是一尊宛如泰坦巨兽的存在，仅仅只是一步的距离，即可跨越以国家为单位的存在。已有的装甲车和坦克此刻却如蝼蚁一般，而手中的武器也只是如毛毛雨一般，此刻，你知道要面临什么了，你知道这样下去，你必死无疑，可眼前这个家伙在这片大陆上哪怕只是一步 -  - 都是对人类的亵渎。你拿着核弹发射钮，在一群人的围佣下，用尽心间的全部力气按响了这份最终的大礼 -  - \n顷刻间，火光冲天，在这片慢慢长夜之下升起了一朵巨大的蘑菇云，数以万计的核弹埋藏在地下，掀起的尘雾连天空都将此遮蔽，将那位泰坦巨兽遮蔽。这是人类留下的最终手段，是以守护之名，对来犯的侵略者呼喊出的决死的高歌。火光散去，巨大的身躯倾倒，起身躯足以媲美一个国家，一片大陆。人类的挣扎在巨娘面前从来不是儿戏，而是为了守护自己的同胞而押上了自己的一切。\n哪怕......所行之事都是徒劳无功。\n泰坦级巨娘绝不是她唯一的杀手锏，但人类却为此拼尽了自己的一切。\n就在某一天，你看到了一个诡异的现象：一条巨大的管道插入海面，向上连接着天空，就在你以为是巨娘打造的什么太空电梯的时候，你却感觉到不对劲：\n地面......在塌陷？海平面也在下降。而这时你才得知了一切的真相，却做不到一切可以挣扎的点：人类早已失去了光，而人类仅有的土地也要被天空中的存在当做奶茶吸走......只是为了她一时的玩弄罢了。\n最终......一切皆以无望，整个孤星的一切都被掏空，唯有晦暗的星核还在堪堪运转，在倾尽全球所有的资源打造了最后一枚钴弹后，你们却没选择按下按钮 -  - 而是直接引爆。\n\"自此，孤星并未落入 maiden口中，而是直接爆炸，来代表人类最后的不妥协......\"\n\n\"在害怕？\"\n诚然，任何人都会\"怕\"，上至神明，下至孩童，世间的芸芸众生都将有着害怕的权利，面对着不可能战胜的敌人，面对着即将死亡的威胁，或是面临者来自未来的未知...... maiden发抖的手拄着长伞，被[event_target:gts_ora_2_system_first_leader.GetName]搀扶着站起，却全然不知衣服上早已沾满了各种各样的血肉 -  - \n但总要有人，需要顶着自己的恐慌，只为将她身后之人的不安焚尽。
  gts_ora.1131.desc: ""Night had fallen.\nA star billions of years old had already been swallowed whole by the young girl - how could human civilization, barely a few thousand years old, possibly stand a chance? At that moment, you realized a truth: you had long been blinded by the victory of this counterattack, forgetting that your opponent was no mindless beast - there was only one answer.\nA god... Sorry, but the humans who shared life and death here no longer held any reverence for her. Humankind only wanted to deal a crushing blow with the weapons in their hands to this self-important entity in the sky before it devoured them - yet on the fifteenth day after this lone star plunged into eternal night, you witnessed something even more terrifying amidst the sea of artificial light:\\ nIt was a being as colossal as a Titan - a single step from it could span the size of an entire nation. The armored vehicles and tanks at your disposal now seemed as insignificant as ants, and the weapons in your hands were no more than a light drizzle. At that moment, you knew exactly what you were up against, You knew that if this continued, you were as good as dead. Yet even a single step taken by this creature across this continent - even just one - would be a desecration of humanity. Gripping the nuclear launch button, surrounded by a crowd, you mustered every ounce of strength in your heart to set off this final, fateful gift - \\ In an instant, flames shot skyward, and beneath this long, dark night, a massive mushroom cloud rose. Tens of thousands of nuclear warheads buried underground sent up a cloud of dust so thick it obscured even the sky - and concealed that titanic beast. This was humanity's last resort - a desperate, defiant cry against the invaders, delivered in the name of protection. As the flames faded, the colossal form toppled; its sheer size rivaled that of a nation, or even a continent. Humanity's struggle against the Giantess was never a trivial matter; it was a desperate gamble in which they staked everything to protect their fellow humans.\nEven if... their efforts proved futile.\nThe Titan-class Giantess was by no means her only trump card, yet humanity had given everything they had for this cause. \nThen one day, you witnessed a strange phenomenon: a massive pipe jutting out of the ocean and reaching up toward the sky. Just as you were about to assume it was some kind of space elevator built by the Giantess, you sensed something was wrong:\nThe ground... was collapsing? The sea level was also dropping. It was only then that you learned the whole truth, yet there was nothing left to cling to: humanity had long since lost its light, and the only land humanity had left was about to be sucked away by the entity in the sky like a sip of milk tea... all just for her momentary amusement. \nIn the end... all hope was lost. The entire Lonely Star was hollowed out, with only its dim star core barely still spinning. After exhausting the planet's every resource to build one final cobalt bomb, you chose not to press the button - instead, you detonated it directly. \n\"From that moment on, the Lonely Star did not fall into the girl's hands, but exploded instead, symbolizing humanity's final act of defiance...\"\\ n\n\"Are you afraid?\"\nIndeed, anyone would be \"afraid\" - from gods to children, all living beings in this world have the right to feel fear. When facing an enemy they cannot defeat, the threat of imminent death, or the unknowns of the future...... The girl's trembling hand rested on her long umbrella as [event_target:gts_ora_2_system_first_leader.GetName] helped her to her feet, yet she was completely unaware that her clothes were already splattered with all manner of blood and flesh - \\ nBut someone must always step forward, forcing their own panic aside, just to burn away the anxiety of those behind her.""
