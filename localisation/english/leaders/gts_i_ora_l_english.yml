  # 想设法找到一个天体级巨娘的存在，想必需要一个以行星为单位的探测模块才行。
  gts_ora_megastructure_DESC: "To find a Celestial Giantess, we'll probably need a detection module on a planetary scale."
  # REPLACE_ME
  gts_ora_megastructure_MEGASTRUCTURE_DETAILS: "REPLACE_ME"
  # REPLACE_ME
  gts_ora_megastructure_CONSTRUCTION_INFO_DELAYED: "REPLACE_ME"
  # 橘子长
  NAME_gts_orangez: "Ora"
  # \"她履行了她的约定......在属于她时间的尽头再次成为你的利刃。\"\n只是这一次......拥有了更强大力量的她，或许能做到更多。
  gts_orangez_desc: "The End of Her Journey"
  # 别担心，我还是我，而这个名字，将继续随你而战。
  gts_orangez_catch_phrase: ""Don't worry, I'm still me, and this name will continue to fight alongside you.""
  # 小橘子长
  NAME_gts_mora: "Mora"
  # §H\"我是因你而诞生的橘子长......虽然还没有本尊那么强大的力量和体型，但是我仍会全力以赴。\"§!
  gts_mora_desc: "\"Wounds Haunted by the Past\"
  # 
  gts_mora_catch_phrase: """"
  # 旧梦萦绕之绊
  gts_trait_mora1: "The Bonds of Lingering Dreams"
  # $gts_trait_mora1_picture$\"我做到了，在未来的某一天。\"
  gts_trait_mora1_desc: "$gts_trait_mora1_picture$\"I did it - someday in the future.\"
  # 责任
  gts_trait_mora2: ""Responsibility""
  # 在有了挺身而出的觉悟后......这个名字会给你想象不到的力量。
  gts_trait_mora2_desc: ""Once you've made up your mind to stand up for what's right... this name will give you strength beyond your wildest imagination.""
  # 梦呓
  gts_trait_mora3: ""Sleep-Talking""
  # \"在第二天，收拾好自己的心情，对着明天说，早上好。\"
  gts_trait_mora3_desc: ""\"The next day, gather your thoughts and say, 'Good morning,' to the day ahead.\"""
  # 羁绊
  gts_trait_mora4: ""Bonds""
  # 正因有着大家一路以来的牵绊，我才得以走到现在这个位置。
  gts_trait_mora4_desc: ""It is precisely because of the bonds we've shared along the way that I've been able to get to where I am today.""
  # 自知
  gts_trait_mora5: ""Self-awareness""
  # 我是夜间的幽灵，却也是笼罩孤星的长夜。
  gts_trait_mora5_desc: ""I am a ghost of the night, yet I am also the long night that shrouds the lonely star.""
  # 命运
  gts_trait_mora6: ""Destiny""
  # 当沙漏倒转，剩下的交给自己的笔和剑。\n§B但不用担心§!\n§P这一路上总会有无数人，无数故事§!\n§M去证明你的存在§!
  gts_trait_mora6_desc: ""When the hourglass turns, leave the rest to your pen and sword.\n§B But don't worry§!\n§P Along the way, there will always be countless people and countless stories§!\n§M to prove that you exist§!""
  # 至高之力
  gts_trait_orangez1: "The Supreme Power"
  # $gts_trait_orangez1_picture$\"不必害怕我，也不必害怕这颗眼睛。我以群星之名起誓。我的剑，将为你斩灭星海诸恶，我的枪，将为你开拓繁天诸星。\"
  gts_trait_orangez1_desc: "$gts_trait_orangez1_picture$\"Do not fear me, nor this eye. I swear by the name of the Stars. My sword will slay all evils in the sea of stars for you, and my spear will carve out a path through the vast heavens for you.\"
  # 至死不休
  gts_trait_orangez2: "To the Death"
  # \"你为何不避？\"\n\"因为我的身后再无退路，唯有以身为薪，战至最后一刻（）。\"\n（不会自刎归天的，放心）
  gts_trait_orangez2_desc: "\"Why didn't you get out of the way?\"\n\"Because I have nowhere left to retreat - I have no choice but to burn myself as fuel and fight until the very end ().\"\n(Don't worry, I won't kill myself.)"
  # 沉重的负担
  gts_trait_orangez3: "A Heavy Burden"
  # 告别了往日，如今的橘子长要承受的负担恐怕要比以往要多得多。不过这是她的选择，她也成功做到了这些。这份胸口上沉甸甸的分量，以及这比常规人类还要伟岸的身体恐怕也成为了她必须要承受的\"代价\"。
  gts_trait_orangez3_desc: "With the past behind her, the burden that Ora now must bear is likely far greater than ever before. However, this was her choice, and she has successfully risen to the challenge. The heavy weight on her chest, along with her physique - which is even more imposing than that of an ordinary human - have likely become the \"price\" she must pay."
  # 概念装甲模块
  gts_trait_orangez4: "Conceptual Armor Modules"
  # 她仍然是你记忆中比较熟悉的那个橘子长，虽然你知道现在的她也只是过去的某个书页，但是和本尊不一样的是，那份你十分熟悉的\"坦荡\"胸怀，却能在战斗中意外的拦下了很多常规舰炮的攻击。
  gts_trait_orangez4_desc: "She's still the Ora you remember so well. Although you know that the present-day her is just a page from the past, unlike the real thing, that \"open-hearted\" nature you know so well has unexpectedly deflected many conventional gunfire attacks during battle."
  # \n\n\n\n£gts_trait_mora1_picture£ \n\n\n\n\n
  gts_trait_mora1_picture: "\n\n\n\n£gts_trait_mora1_picture£ \n\n\n\n\n"
  # \n\n\n\n£gts_trait_orangez1_picture£ \n\n\n\n\n
  gts_trait_orangez1_picture: "\n\n\n\n£gts_trait_orangez1_picture£ \n\n\n\n\n"
  # \"她的过去被你唤醒，但是她写过的故事却仍然成谜。\"
  gts_ora_book_botton_now_available: ""\"You've brought her past back to life, but the stories she wrote remain a mystery.\"""
  # \"是时候直视她的未来了......即使充满代价。\"
  gts_ora_book_botton_after_available: ""\"It's time to face her future head-on... even if it comes at a cost.\"""
  # §H以念铸身，终别\"无能\"§!\n\n大橘子长获得每日船体再生+5%，小橘子长获得+50免伤。
  gts_ora_book_ending_meteor_1_tooltip: ""§H: Forge Your Body Through Mindfulness, and Say Goodbye to \"Incompetence\"§!\n\nThe Senior Ora Captain gains +5% daily hull regeneration, and the Mora Captain gains +50 damage reduction.""
  # §H此心为终，祓除\"虚幻\"§!\n\n为大橘子长增加巨像模块：战略倾轧。\n使用超规格的鞋子进行踩踏，自身作为天体级巨娘散发出的威压会使该星球内的任何生物无差别死亡，或者是投降。\n（对星球释放，直接占领该星球并破坏所有建筑，CD为60）
  gts_ora_book_ending_meteor_2_tooltip: ""§HThis Heart Is the End, Banishing \"Illusion\"§!\n\nAdded a Colossus Module for Ora: Strategic Manipulation. \nBy stomping with oversized shoes, the overwhelming aura emitted by the player - as a Celestial Giantess - will cause all life on the planet to die indiscriminately or surrender.\n(When cast on a planet, it immediately occupies the planet and destroys all structures; cooldown is 60)""
  # §H苦刑将尽，接纳\"孤立\"§!\n\n大橘子长的跃迁冷却时间-80%，小橘子长的跃迁冷却时间-50%。\n大橘子长的跃迁范围+50%。
  gts_ora_book_ending_meteor_3_tooltip: ""§H: As the Torture Draws to a Close, Embrace \"Isolation\"§!\n\nThe cooldown for the Large Ora's long-range teleport is reduced by 80%; the cooldown for the Mora's long-range teleport is reduced by 50%.\nThe range of the Large Ora's long-range teleport is increased by 50%.""
  # §H以念化剑，斩灭\"恐慌\"§!\n\n大橘子长获得一个光环（配件），使敌方舰船获得：\n护盾无效化+1000%\n装甲无效化+1000%
  gts_ora_book_ending_meteor_4_tooltip: ""§H Transforms Thoughts into a Sword, Slaying \"Panic\"§!\n\nOra gains an aura (accessory) that grants enemy ships:\nShield Nullification +1000%\nArmor Nullification +1000%""
  # §H\"失我\"为码，以持\"至高\"§!\n\n小橘子长获得特质：\"至高之力\"。\n大橘子长获得特质：\"概念装甲模块\"。
  gts_ora_book_ending_meteor_5_tooltip: ""§H\"Loss of Self\" as a code to maintain \"Supremacy\"§!\n\nMora gains the trait: \"Supreme Power.\"\nThe Big Orange Leader gains the trait: \"Conceptual Armor Module.\"""
  # §H循此苦旅，终抵群星§!\n\n大橘子长将获得特殊舰载武器，且可以通过舰船按钮切换形态。
  gts_ora_book_ending_meteor_6_tooltip: ""§H After this arduous journey, we finally reached the Stars§!\n\nOra will gain a special ship-mounted weapon and can switch forms using the ship button.""
  # 星河摇曳之伞
  GTS_ORA_GALAXY_SWAYING_UMBRELLA: ""The Umbrella of the Shimmering Milky Way""
  # 作为一路上走过的证明......当那个白发萝莉将这把锻造好的长伞交给你的那一刻......当那个白发 maiden将这把手工做的长伞交给你的那一刻......当那个或许会消失的橙色 maiden为你定制了这把武器的那一刻......或许此刻决心就是她的力量。
  GTS_ORA_GALAXY_SWAYING_UMBRELLA_DESC: ""As proof of the journey you've taken... The moment that white-haired Loli handed you this forged long umbrella... The moment that white-haired girl handed you this handcrafted long umbrella... The moment that orange-haired girl - who might one day vanish - custom-made this weapon for you... Perhaps, at this very moment, her resolve is her strength.""
  # 巨剑·寰海苦刑
