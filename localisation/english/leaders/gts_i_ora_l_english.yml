  # 造物主
  gts_ora.4401.name: ""The Creator""
  # 当女仆形态的舰娘从星球外飞过时，橘子长陷入了一丝恍惚。\n\n不知道为什么，眼前的猫猫女仆虽然她并不熟悉，却总觉得有点眼熟。她翻开手账本，想找到对方的联系方式。可翻了一会之后却又意识到了什么似的合上书。\n\n也对，这里面的联系方式，早就在二百年前就没法用了嘛，毕竟现在是什么时代......橘子长正想着，却看到天空中的猫娘却越来越大，仿佛即将超越远处的天体......不对，这是在向这个星球迫降 -  - \n\n\"咚 -  - \"\n\n身载各种武器的女仆猫猫在星球表面上砸出了重重的大坑。不过还好，这片旧城区的居民早已搬迁，因而没有造成什么人员伤亡。只是见此情景。\"啥　猫\"俩字已经先比脑子进一步的浮现于自己的嘴边，却出于礼仪并没有出口。只是当距离一接近，对方的模样却终于让橘子长认识到了，眼前的舰娘为什么会让自己如此熟悉 -  - \n\n或许......这些事，和自己的\"造物主\"有关吧。橘子长合上书本，刚想看一下这只摔在旧城区的啥猫有没有受伤，而手指转动门把手的那一刻，眼前却浮现出了另一幅熟悉的景象。\n\n她很清楚，那是她还没来到这个世界前，作为\"橘子长\"这个名字诞生的那一天。
  gts_ora.4401.desc: ""As the maid-form Ora flew past the planet, Captain Tachibana fell into a brief daze.\n\nFor some reason, even though she wasn't familiar with the cat-themed maid before her, she felt she'd seen her somewhere before. She flipped open her notebook, hoping to find the girl's contact information. But after flipping through it for a moment, she seemed to realize something and closed the book.\n\nThat's right - the contact information in here had been useless for two hundred years now. After all, what era is this...? Just as Ora was thinking this, she saw the cat maid in the sky growing larger and larger, as if she were about to pass beyond the distant celestial body... No, wait - she's making an emergency landing on this planet - \n\n\"Thud - \"\n\nThe cat maid, laden with all sorts of weapons, slammed into the planet's surface, leaving a massive crater in her wake. Fortunately, the residents of this old district had long since been relocated, so there were no casualties. Just witnessing this scene, the words \"What the - cat?\" had already popped to the tip of his tongue before his brain could process it, but out of courtesy, he held them back. It wasn't until she drew closer, however, that her appearance finally made Ora realize why this Fleet Girl before him felt so familiar - \n\nPerhaps... These events must be related to her \"Creator.\" Ora closed her book and was just about to check if this \"what-kind-of-cat\" that had crashed into the old city district was injured, but the moment her finger turned the doorknob, another familiar scene flashed before her eyes. \n\nShe knew full well that this was the day she was born as \"Ora,\" before she had even come to this world.""
  # （翻开书页）
  gts_ora.4401.a: ""(Turning the page)""
  # 降生之日
  gts_ora.4402.name: ""Day of Birth""
  # ２０２６年　４月的第９个日出，那是这副模样诞生的时刻。\n\n而自己的造物主，一副屏幕微微泛起裂纹的二手平板，一直拼少少几块钱一支的触屏笔，最低的成本，也是最卑微的那段时间。直到平板中的那副三视图彻底完工之后，昏暗房间中，和日出一起在属于自己的世界多了一抹橘色。\n\n而这抹橘色带来的，是一只棕色的猫娘。\n\n\"橘子看看。\"\n\n刚刚下楼，想去便利店买瓶水，连着熬了四天，身体也有点难顶。手机中的消息虽然响起，但却没什么视野，只是敷衍的回了半句：\"等我花两分钟过一下马路......\"\n\n\"注意安全喵，别变成橘子饼了......\"\n\n......\n\n回到家后，摆在桌子上的蛋糕，刻意拉起的窗帘，虽然天边已经泛起了鱼肚白，却还是看不清周围的环境。我刚想打开灯，却突然失去了意识，像是被人用麻袋套住带走了一样......\n\n\"生日快乐喵！\"\n\n手机的消息是请帖，桌子上的蛋糕是奖励，头上的小帽子我暂时没搞懂是什么用意。但总之，虽然小小的房间内只有两个人，但此刻却是我诞生以来都难以忘记的降生。\n\n刚刚结束学业的自己却恰逢失业，手中这副平板和笔就成了自己勉强维生的手段，只是一切只是刚刚起步，能买账的人也少的可怜......我接受，也理解。毕竟活在这个世界上所需的不只是信仰那么简单......确信。\n\n直到希瞳的出现，让那段最痛苦的时间得以接济。\n\n话说......之后的事情怎么样了？我似乎忘记了，只记得眼前这个女仆猫猫应该是双月，而她的造物主......就是那个戴着猫猫耳却是人类之身的存在......则是凭借着双月希瞳的名字，比自己早几年出道：\n\n<双月希瞳喵喵......超超超可爱的女仆猫猫是也......因为稍微有一点懒所以一直还没正式出道喵......不过还是在慢慢准备中的未来Ｖｔｕｂｅｒ！>\n\n或许......这也是自己的造物主也想做虚拟主播的原因吧......而自己甚至都不知道自己的造物主到底是什么样的......\n\n对了，事已至此，问一下吧。
  gts_ora.4402.desc: ""The ninth sunrise in April 2026 - that was the moment this creation came into being.\n\nAnd its creator - a secondhand tablet with a screen slightly cracked, pieced together with touchscreen pens bought for just a few yuan each - was a time of the lowest costs and the humblest beginnings. It wasn't until the three-view drawings on the tablet were finally complete that, in the dimly lit room, a touch of orange joined the sunrise in this world of my own.\n\nAnd that touch of orange brought with it a brown cat girl.\n\n\"Orange, come here.\"\\ n\nI'd just gone downstairs to grab a bottle of water at the convenience store; after pulling four all-nighters in a row, my body was starting to feel the strain. A message pinged on my phone, but I didn't really have the energy to look at it - I just half-heartedly replied, \"Give me two minutes to cross the street...\"\\ n\n\"Be careful, meow. Don't end up as an orange-flavored cookie...\"\n\n......\n\nWhen I got home, there was a cake on the table and the curtains had been deliberately drawn. Even though the sky was already turning pale, I still couldn't make out my surroundings. Just as I was about to turn on the light, I suddenly lost consciousness, as if someone had pulled a sack over my head and carried me away...\n\n\"Happy birthday, meow!\"\\ n\nThe message on my phone was an invitation, the cake on the table was a reward, and I still haven't quite figured out the purpose of the little hat on my head. But in any case, even though there were only two of us in that tiny room, this moment was a celebration I'll never forget for as long as I live. \n\nHaving just graduated, I found myself unemployed; this tablet and stylus in my hands became my only means of barely scraping by. But it was all just getting started, and there were pitifully few people willing to pay for my work... I accepted it, and I understood. After all, surviving in this world requires more than just faith... I was certain of that.\n\nIt wasn't until Hitomi appeared that those most painful times were eased.\n\nSpeaking of which... what happened afterward? I seem to have forgotten, but I do remember that this maid cat in front of me is Double-Moon Hitomi, and her creator... that being who wears cat ears but has a human form... made her debut a few years before me under the name Double-Moon Hitomi:\n\n <Double-Moon Hitomi Meow Meow... I am a super, super, super cute maid cat... Since I'm just a little bit lazy, I haven't officially debuted yet, meow... But I'm still a future VTuber slowly getting ready!>\n\nMaybe... that's why my creator wants to be a virtual streamer too... and I don't even know what my creator actually looks like...\n\nOh right, now that it's come to this, I might as well ask.""
  # （出门）
  gts_ora.4402.a: ""(Leaving)""
  # 梦界核
  gts_ora.4403.name: ""Dream Realm Core""
  # 摔在旧城区的猫猫并没受什么伤。毕竟作为帝国出身的正规舰娘，估计星球碎掉了猫猫都不可能会碎吧......只是作为舰娘的猫猫刚醒来，见到橘子长后，却突然两个瞬移带一个闪现来到橘子长面前，随后 -  - \n\n只感觉到一股上升气流的诞生，却让整个星球都不禁屏住了呼吸。毕竟......作为别处而来的巨娘，竟然当众掀开一星球总督的裙子......只是不知为什么，橘子长只是一愣，随后则僵在原地，似乎表现出一副比较顺从的样子。\n\n\"喵喵喵？\"\n\n女仆形态的猫猫掀开裙子之后，仿佛更加确认了橘子长的存在，似乎她的诞生......从希瞳的角度来看，怎么看都像是个奇迹一般。\n\n\"是活的喵......奇怪了喵......橘子长不是在ｘｘｘｘ年就......\"\n\n希瞳所说的话并没有错，自己的造物主在自己诞生之前......在作为\"橘子长\"出道首播的十五天后，因心脏衰竭离开了......显然，自己很清楚一点......前造物主的执念，却在死后的十几年里，得到了自己的\"收获\"。\n\n\"那个......御月......现在还活着吗？\"\n\n我很想问出这个问题，毕竟自己也心知肚明。你我同处于这一颗孤星之上，哪怕差距再大，时间上的永恒总会带走一个人的生命......然而猫猫只是想了想，得到的回答却不是\"否\"，而是......\n\n\"不知道喵......但是一定还活着喵......我能感觉到她的存在喵。不过等咱得到了她的消息后......会和你说的喵，先执行任务去了，先走了喵！\"
  gts_ora.4403.desc: ""The cat that crashed into the old town wasn't hurt at all. After all, as a full-fledged Kanmusu from the Empire, she probably wouldn't break even if the planet itself were to shatter... However, as soon as Cat - the warship girl - woke up and saw Ora, she suddenly teleported twice and flashed once to appear right in front of him, and then - \n\na surge of rising air was felt, causing the entire planet to hold its breath. After all... as a Giantess from another world, she had actually lifted the skirt of a planetary governor right in public... Yet for some reason, Ora merely froze for a moment before standing rigidly in place, appearing to accept the situation rather meekly.\n\n\"Meow, meow, meow?\"\\ n\nAfter the cat in her maid form lifted the skirt, she seemed to confirm Ora's existence even more firmly; it appeared that her birth... from Hitomi's perspective, looked like nothing short of a miracle.\n\n\"She's alive, meow... That's strange, meow... Didn't Ora die in the year xxxx...?\"\n\nWhat Hitomi said was true - her creator had passed away before she was born... fifteen days after her debut broadcast as \"Ora,\" due to heart failure... Clearly, one thing was crystal clear to her... her former creator's obsession had, over the course of more than a decade after her death, borne its own \"fruits.\"\n\n\"Um... Mitsuki... is she still alive?\"\n\nI really wanted to ask that question - after all, I knew the answer deep down. You and I both dwell on this solitary star; no matter how great the gap between us, the eternity of time will eventually take a person's life... Yet when Meow Meow simply pondered this, the answer she received wasn't \"no,\" but rather...\n\n\"I don't know, meow... but she must still be alive, meow... I can sense her presence, meow. But once we get news about her... I'll let you know, meow. Gotta go carry out the mission now - see you later, meow!\"""
  # \"有消息一定要回来喵！\"\n(可以执行特殊项目)
  gts_ora.4403.a: ""\"If you hear anything, be sure to come back, meow!\"\n(Can carry out special missions)""
  # 通讯接入请求
  gts_ora.4404.name: ""Communication Access Request""
  # 在双月希瞳离开后，她迫降所在的区域已经被清理完毕，并改造成了一处公园。毕竟......对于这个占地５００公顷的大坑来说，大家也想知道这个来自别的星球的巨大猫猫到底是何方神圣不是吗？\n\n\"妈妈，快看啊，这个这么大的猫猫竟然是国家派来打大坏蛋的舰娘哦！\"\n\n只是时间过了许久，有关造物主的消息却是了无音讯。就在橘子长决定要放弃的时候，通讯却突然响了起来，橘子长接过电话，等到的却不是双月希瞳的声音。不如说，是相似。\n\n\"是你喵......\"\n\n眼前浮现的棕色猫娘，虽然和双月希瞳长的一模一样，但是和之前看到的女仆装相比，身着常服的希瞳反倒多添了一分成熟的气息......好吧，算是聊胜于无。只是和前世记忆的那副模样想比，最大的区别就是：\n\n此时此刻的对方，早已不再是那个孤星中的普通人，而是成为了在星海间有着天体一般傲人身躯的巨娘。
  gts_ora.4404.desc: ""After Double-Moon Hitomi left, the area where she made her emergency landing was cleared and transformed into a park. After all... given that this massive crater covered 500 hectares, everyone wanted to know who - or what - this giant cat from another planet really was, didn't they?\n\n\"Mom, look! This huge cat is actually a Kanmusu sent by the government to fight the big bad guys!\"\\ n\nBut a long time passed, and there was still no word from the Creator. Just as Ora was about to give up, the phone suddenly rang. She answered it, but the voice on the other end wasn't Double-Moon Hitomi's. Or rather, it was similar.\n\n\"It's you, meow...\"\\ n\nThe brown cat girl who appeared before her looked exactly like Double-Moon Hitomi, but compared to the maid outfit she'd seen before, Hitomi in her everyday clothes actually exuded a more mature aura... Well, I guess it's better than nothing. But compared to the image from her past life, the biggest difference was:\n\nAt this very moment, she was no longer just an ordinary person among the lonely stars - she had become a Giantess with a figure as majestic as a celestial body, soaring through the starry sea.""
  # 接入通讯
  gts_ora.4404.a: ""Connectivity""
  # 通讯接入
  gts_ora.4405.name: ""Communication Access""
  # 咱记得你喵......没想到那个家伙真的把你做出来了，要是她还活着的话我都想看看她到底是什么兴奋的表情喵......不过找咱的话到底要做什么喵......
  gts_ora.4405.desc: ""I remember you, meow... I never thought that guy would actually make a replica of you. If she were still alive, I'd love to see the look of excitement on her face, meow... But why did she come looking for me, anyway? Meow...""
  # 我的造物主......
  gts_ora.4405.a: ""My Creator...""
  # 你说那个家伙啊...那个时候的她除了一腔孤勇外，什么都没有。我还记得我当时想帮一下......不过最后还是找她给自己画了一些。\n\n在她出事后，咱第一时间去她的房间，却发现，房间的一切都被烧毁。就像网上流传的消息一样......是自杀。咱很担心，害怕真的如此，不过找了许久之后......总算找到了这个。\n\n希瞳说完后，交给你一个老旧的平板，上面还带着一丝裂纹。
  gts_ora.4405.a.response: ""You mean that girl... Back then, she had nothing but a reckless sense of courage. I remember wanting to help her out... but in the end, I just asked her to draw some for me.\n\nAfter what happened to her, I rushed to her room right away, only to find that everything inside had been burned to ashes. Just like the rumors circulating online... it was suicide. I was really worried, afraid that might actually be the case, but after searching for a long time... I finally found this.\n\nAfter Hitomi finished speaking, she handed you an old tablet with a faint crack running across it.""
  # （接过平板）
  gts_ora.4405.b: ""(Taking the tablet)""
  # 先询问\"我的造物主......\"。
  gts_ora.4405.b.requirement: ""First, ask, \"My Creator....\"""
  # 设计图
  gts_ora.4406.name: ""Design Drawings""
  # 房间内唯一完好无损的好像就只有这个了喵......可惜咱不知道密码是什么喵。不过既然都是\"橘子长\"的话，想必你应该知道密码是什么吧。\n\n陈旧的平板，还尚未出现人脸和指纹的解锁功能。不过就算有，沧海桑田间，哪怕是我也好，橘子长也罢，早已换了一副模样。而四位数的密码，却在那个一切巨娘的消息都严密封锁的年代，成为了唯一的锁，将一切流言蜚语挡在外面。\n\n\"只有一次机会哦，输入错误的话......平板会爆炸喵（）\"\n\n写在平板上的这句话，不知道在当时骗过了多少人，但即使无人愿意相信，至少也能带一点心理安慰。\"ＸＸＸＸ\"，随着四位密码的输入，平板打开，除了一个如今早已停服的音游后，就只剩下一个绘画软件｡\n\n\"是传位于十四月希瞳......\"\n\n一年只有１２个月，而一个时钟也只存在１２个小时。画板中所呈现的，却单独存在一个文件夹，里面摆放着的，却是自己的原型机。从一个简简单单的浅橘色麻花辫 maiden，到如今自己完整的模样。２０２４年开始，２０２８年结束。也是她离开世界的那一天。\n\n然而，再次翻找别的内容的时候，却找到了别的东西：\n\n里面存放着的，是和希瞳有关的，希瞳所有型号的立绘。以及，设计出的特殊模块。
  gts_ora.4406.desc: ""It looks like this is the only thing left intact in the room, meow... Too bad we don't know the password, meow. But since we're both \"Ora,\" I'm sure you must know what the password is.\n\nIt's an old tablet that doesn't even have face or fingerprint unlock features yet. But even if it had, with the passage of time, whether it's me or Ora, we've both changed beyond recognition. Yet that four-digit passcode, back in an era when all news about Giantesses was strictly censored, became the only lock, keeping all the rumors and gossip at bay. \n\n\"You only get one chance, okay? If you enter it wrong... the tablet will explode, meow ().\"\n\nI don't know how many people that message written on the tablet fooled back then, but even if no one was willing to believe it, at least it offered a little peace of mind. \"XXXX.\" As the four-digit passcode was entered, the tablet unlocked. Aside from a rhythm game - which had long since been shut down - all that remained was a drawing app.\n\n\"It's the succession to Hitomi...\"\\ n\nThere are only 12 months in a year, and a clock only has 12 hours. Yet, displayed on the drawing board was a separate folder containing her own prototype models - ranging from a simple girl with light orange braids to her current, complete form. It began in 2024 and ended in 2028 - the very day she left this world.\n\nHowever, while searching through other content again, she stumbled upon something else:\n\nStored inside were all the character art images related to Hitomi - every single model - as well as the specially designed modules.""
  # 这些......希瞳知道吗？
  gts_ora.4406.a: ""Does Hitomi know about these...?""
  # 猫猫狐
  gts_ora.4407.name: ""Cat Fox""
  # 诶？咱不知道还有这些东西喵。\n\n很显然，这些内容是自己的造物主背着希瞳偷偷画出来的。从双月希瞳开始......到后续的各种形态，每个希瞳似乎都照着原版再次画了一遍。\n\n\"那个，既然这些内容是橘子长要给希瞳的话，那我还是做出来吧，只是......要做哪个合适呢？\"\n\n很显然，内容十分庞大，想要把所有的模块全部创造出来这根本不现实。不过哪怕只有一个，对于给希瞳的感谢来说也算是足够看吧，只是希瞳并不会这么想。\n\n\"诶？我给了你这 -  - 么宝贵的东西，到头来连橘子长的裙子都得不到喵，咱伤熏了喵，喵喵喵......\"\n\n\"诶？\"\n\n橘子长先是一愣，随后立刻反驳道：\n\n\"哒咩！你的造物已经掀过咱一次裙子了不要啊啊啊啊啊 -  - \"\n\n即使如此，橘子长还是没能逃掉，毕竟希瞳如今早就想着要去对橘子长做着些这样那样的事情了......当裙底被掀开的那一刻，橘子长的脸瞬间红的难以招架起来。\n\n\"至于模块，咱不感兴趣喵......现在的咱更想要每天上班四个小时然后舒舒服服的躺在床上玩着游戏甚至还有小鱼干的生活喵......如果橘子长可以做到的话......\"
  gts_ora.4407.desc: ""Huh? I didn't know these existed, meow.\n\nClearly, these illustrations were drawn secretly by Hitomi's creator behind Xitong's back. Starting with Double-Moon Hitomi... all the way to the various forms that followed, it seems like each Hitomi was redrawn based on the original.\n\n\"Um, since these are things Ora wants to give to Hitomi, I guess I'll go ahead and make them. It's just... which one should I make?\"\\ n\nClearly, the scope is massive; it's simply unrealistic to create every single module. Still, even just one would be enough to show my gratitude to Hitomi - though Hitomi wouldn't see it that way. \n\n\"Huh? I gave you something this - precious, and in the end, I don't even get Ora's skirt, meow. I'm so hurt, meow, meow, meow...\"\\ n\n\"Huh?\"\n\nOra was taken aback at first, but immediately retorted:\n\n\"Da-me! Your creation has already lifted my skirt once - no, no, no, no, no - \"\\ n\nEven so, Ora couldn't escape. After all, Hitomi had been thinking about doing all sorts of things to Ora for quite some time now... The moment her skirt was lifted, Ora's face instantly flushed so red she could barely bear it. \n\n\"As for the modules, I'm not interested, meow... Right now, I'd much rather work four hours a day, then lie comfortably in bed playing games - and even have some fish snacks to boot, meow... If Ora can make that happen...\"""
  # \"我去找帝国报备一下吧。\"
  gts_ora.4407.a: ""\"I'll go report this to the Empire.\"""
  # 财务报备
  gts_ora.4408.name: ""Financial Reporting""
  # 橘子长的消息已经发送到帝国内，大家都对这宛如前文明的造物感到十分惊讶。毕竟......有时候和橘子长相关的事情总是有点\"俺寻思之力\"的意思。至于御月希瞳所说的......这样的生活在如今的财务报表里虽然不低，但所幸有橘子长和希瞳这样的天体级行政官的存在，现在的帝国完全承担的起。\n\n所以......是时候该考虑一下了。
  gts_ora.4408.desc: ""The news about Ora has spread throughout the Empire, and everyone is deeply astonished by this creation that resembles a relic from a past civilization. After all... sometimes things related to Ora tend to have a touch of \"my own way of thinking\" about them. As for what Mizuki Hitomi said... although the cost of such a lifestyle isn't insignificant in today's financial statements, fortunately, with the presence of celestial-level administrators like Ora and Hitomi, the Empire can fully afford it at present.\n\nSo... it's time to give it some thought.""
