  #  失我，堕入‘虚无’后的至高
  gts_ora.1013.name: "Losing Myself, the Supreme After Falling into 'Nothingness'"
  #  如何弥补人和人之间的差距，或者说……\n如何弥补虫豸和神明的差距？\n少女举灯，循着时间线一条条地梳理，而后，她意识到了一个很悲惨的现实，一个答案：\n不是否，却比否还要可怕，需要极大的代价。\n她看到了她未来的模样，剑指银河，不畏神明的模样。而追溯到她的过去，却是一片空白：她的未来是过去的未来，而她的过去却不再是未来的过去。\n她主动舍弃了一切。\n这份名为“至高”的力量，可以随意颠覆整个银河的秩序。而代价，却是她经历的所有过去。她距离她走到的终点只有一步之遥，只要将过去全部舍弃，只保留“终点”就好……\n她犹豫了，因为这也就意味着一个问题：\n“我是谁？”\n如果一艘船的木板全部被剥离，只留下一个空虚的龙骨，有有谁会承认这是一艘船？同样的道理。她舍弃掉属于她的一切故事，那她还是否会在这个世界存在？她犹豫了，而在她思索片刻后决定：\n她想回家了，想回到那颗孤星看看。\n\n后面的故事，你都明白了，她回来之后，却不小心误食了帝国的科研船。而随后就是你和她的邂逅。而她的模样，也在你的脑海中逐渐浮现：\n那是你一生都难以想象的内容，从天体级巨娘的胃里出来的时候，她决定加入你们的时候，浅橘色的麻花辫围绕在你的身旁，将你连同整个星球都包围在她的怀抱中，而她的名字，此时此刻，却已经迫不及待在脑子里呼之欲出：\n选项：“橘子……长？”\n效果：触发单个事件\n\n事件名称：“好久不见……或者……初次见面？”\n你的呼喊随着执念，在无人的旧城区间游荡，而后……\n“怎么了呢？”\n熟悉的声音响起，你回过头，却并未看到她的存在。直到你循着声音，找到了她。她正坐在一辆废弃的公交车门下，尝试让旁边的猫咪接近自己。\n“橘子长？”\n多年后的重逢，橘子长并没有太大的变化，只是……在接触到的一瞬间，你却觉察到一丝不对……\n为何……如此陌生？\n“我们……之前见过吗？”\n少女的疑问让你顿时感觉到不对劲：她是橘子长吗？显然是。但是她却不是你见到过的那个橘子长，而是……种种诡异的迹象让你不得不发出了这样的结论：\n她是“过去”的橘子长，是你的执念所诞生的模样。一如她刚刚诞生那般。
  gts_ora.1013.desc: "How can the gap between person and person be made up, or rather...\\nHow can the gap between insects and gods be made up?\\nThe girl raises a lamp and follows the timelines one by one, sorting through them. Then she realizes a very tragic reality, an answer:\\nIt is not impossible, but it is even more terrifying than impossibility. It requires an enormous price.\\nShe sees her future self, sword pointed at the galaxy, unafraid of gods. Yet when tracing back to her past, there is only blankness: her future is the future of her past, but her past is no longer the past of the future.\\nShe willingly gave up everything.\\nThis power called \"Supremacy\" can overturn the order of the entire galaxy at will. But the price is every past she has experienced. She is only one step away from the endpoint she has reached. She need only abandon all of the past and keep only the \"endpoint\"...\\nShe hesitates, because this means one question:\\n\"Who am I?\"\\nIf all the planks of a ship are stripped away and only an empty keel remains, who would still recognize it as a ship? The same logic applies. If she discards every story that belongs to her, will she still exist in this world? She hesitates, and after thinking for a moment, decides:\\nShe wants to go home. She wants to return to that lonely star and take a look.\\n\\nYou understand the rest of the story. After she returned, she accidentally ate the empire's research ship. Then came your encounter with her. Her appearance gradually emerges in your mind as well:\\nIt is something you could scarcely imagine in your lifetime. When you came out of the celestial-scale giantess's stomach, when she decided to join you, her light orange braids surrounded you, enclosing you together with the entire planet in her embrace. And now, at this very moment, her name is already impatiently rising to the tip of your tongue:\\nOption: \"Orange... Chief?\"\\nEffect: Triggers a single event\\n\\nEvent Name: \"Long Time No See... Or... Nice to Meet You?\"\\nYour call, carried by obsession, wanders through the deserted old urban district. Then...\\n\"What is it?\"\\nA familiar voice sounds. You turn around, but do not see her. Only by following the voice do you find her. She is sitting beneath the door of an abandoned bus, trying to get the cat beside her to approach.\\n\"Orange Chief?\"\\nReunited after many years, Orange Chief has not changed very much. It is just that... the moment you make contact, you sense something wrong...\\nWhy... is she so unfamiliar?\\n\"Have we... met before?\"\\nThe girl's question immediately makes you feel that something is wrong. Is she Orange Chief? Clearly, yes. But she is not the Orange Chief you once met. Instead... every strange sign forces you to reach this conclusion:\\nShe is the Orange Chief of the \"past,\" a form born from your obsession. Just as she was when she had only just been born."
