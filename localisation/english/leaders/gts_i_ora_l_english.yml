  gts_ora.1009.name: "Powerlessness"
  #  2021年4月 日\n在自己的第18岁的第一天，我遭遇了一场重大车祸。所幸命大，但是却还是对高考产生了影响。\n我已经不后悔了，被车撞飞的一瞬间，我想了很多，我似乎看到了，城市在崩坏，交通在瘫痪，似乎整个城市都在一个女孩的脚下变得如此卑微。不过……又如何呢？我这一世，什么时候低下那一直仰望的头颅？\n但是……是不是……如果自己就是那个女孩子的话……\n2024年12月5日\n近期发生的事情很多，也很累。\n倒霉的事情频频发生，我也总算在艰难维生中买了一块属于自己的pad——500块钱，却足以实现自己的梦想了吧。\n那个梦中不断浮现的景象……一个麻花辫的少女，整个城市都在她的脚边，显得如此渺小。似乎她抬起脚，就足以让一个城市，一个国家，甚至整个星球都为之胆寒……\n鞋底稍微厚一点吧……最好再穿个堆堆袜，这样任何人都别想爬到她的腿上……外套样式……是半搭着还是系在腰间？看看哪个更好画吧……\n2025年3月16日\n我无时无刻都在想着，当自己成为这个人，或者说，能够用自己的双手将其创造出来的时候。\n现在，时候到了，虽然粗糙了点，但时间能慢慢打磨她。\n至于名字……■■■吧。性别女，年龄17……今天就这些吧\n2028年3月25日\n大家好！今天是■■■的第一场首播哦~让我来看看有多少观众呢……\n15个，首播就有这样的成绩，已经算不错了。再接再厉吧。\n2028年4月……\n这本日记的主人恐怕难以再写下去了，就由我来继续写下去吧。\n就在今天，在虚拟主播■■■正式出道的15天后，我亲眼见到她在直播间里，随后突然停下了她那富有激情的演出，直到三十分钟后……我们才能够在直播间里听到微弱的救护车的声音。\n她为什么不求救？我不知道，我不知道这个问题究竟是谁能够问出来。就在刚刚，她被诊断出，为急性心脏衰竭，抢救无效死亡——确切的说，是放弃抢救吧，想必她也无力承担这笔医药费就是了。\n她留下的画作已成废纸，她写下的文章也被互联网冲进了垃圾堆。她的存在，她的死亡都变得那么无人在意，宛如被随意践踏的臭虫一般……\n那她为什么还要追求这么虚幻的东西？\n……\n“我恐怕……看不到你……在群星间璀璨的一日了……”\n\n这是你在一处旧居民房中找到的一本日记本，以及一份尚未出版的报导。这……是她吗？如果她的过去就是死亡的话……那你看到的那个天体级巨娘是——\n你不敢想，却突然听到了这样一个声音——
  gts_ora.1009.desc: "April, 2021\\nOn the first day of my 18th year, I was in a major car accident. Fortunately, I survived, but it still affected my college entrance exam.\\nI no longer regret it. In the instant I was sent flying by the car, I thought about many things. I seemed to see the city collapsing, traffic paralyzed, as if the entire city had become so humble beneath a girl's feet. But... so what? In this life, when have I ever lowered this head that has always looked upward?\\nBut... what if... what if I were that girl...\\nDecember 5, 2024\\nA lot has happened recently, and it has been exhausting.\\nUnlucky things keep happening, and at last, while barely scraping by, I bought a pad of my own. 500 yuan, but it should be enough to realize my dream, right?\\nThat scene that keeps appearing in my dreams... a girl with braids, with the entire city at her feet, looking so tiny. It seems that if she raised her foot, it would be enough to make a city, a country, or even the entire planet tremble in fear...\\nMaybe make the soles a little thicker... and it would be best if she wore loose socks too, so no one could even think of climbing onto her legs... The jacket style... half-draped, or tied around her waist? I will see which is easier to draw...\\nMarch 16, 2025\\nI think about it constantly, the moment when I become this person, or rather, when I can create her with my own hands.\\nNow, the time has come. It is a little rough, but time can slowly polish her.\\nAs for the name... ■■■, maybe. Female, age 17... That is all for today.\\nMarch 25, 2028\\nHello, everyone! Today is ■■■'s first debut stream~ Let me see how many viewers there are...\\n15. For a debut stream, that result is already pretty good. I will keep working hard.\\nApril 2028...\\nThe owner of this diary likely can no longer keep writing, so I will continue it for her.\\nJust today, 15 days after the virtual streamer ■■■ officially debuted, I personally saw her in the stream room. Then she suddenly stopped her passionate performance, and only thirty minutes later... could we hear the faint sound of an ambulance in the stream room.\\nWhy did she not call for help? I do not know. I do not know who could even ask that question. Just now, she was diagnosed with acute heart failure and died after resuscitation failed. More precisely, she gave up resuscitation, I suppose. She likely had no way to bear the medical expenses.\\nThe artwork she left behind has become waste paper, and the articles she wrote have been washed by the internet into the trash. Her existence and her death have become so unnoticed, like a bug casually trampled underfoot...\\nThen why did she still pursue something so illusory?\\n...\\n\"I am afraid... I will not be able to see... the day you shine among the stars...\"\\n\\nThis is a diary you found in an old residence, along with an unpublished report. Is this... her? If her past is death... then the celestial-scale giantess you saw is...\\nYou dare not think about it, but suddenly you hear a voice like this..."
