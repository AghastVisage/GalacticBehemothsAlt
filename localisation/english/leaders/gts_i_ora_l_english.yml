  # 你被橘子长推入了星门中，而天体级的[event_target:gts_ora_2_system_first_leader.GetName]刚要阻拦，却见橘子长的手中已然出现了一把长剑 -  - \n确切的说，是那个天体级巨娘留下的长伞。\n\"以我作为'人'的信念，我将此路走到终点......\"\n\"而我，过往......我走过的一切......只为一个目的......\"\n\"就用我来......以一次失约，让她回来吧。\"\n将天体级[event_target:gts_ora_2_system_first_leader.GetName]逼退回星门后，橘子长看着尚未关闭的星门，又看着仅剩残页的手账本，将手中的笔扔向了星门处。\n\"我的故事......要结束了。\"\n你在星门中，顺着橘子长的推力向身后退去，却发现自己的怀里却多了一个笔记本。以及一只包装精致的铅笔。 这么长的时间，你不止一次看过她在上面写的内容，却未曾拿起过巨娘所用的笔。如今她将这个交给了你，只有一种可能......\n\"如果我回不来......就由你的心情决定，写个你喜欢的故事吧。\"
  gts_ora.1034.desc: ""You were pushed through the stargate by Ora, and just as the celestial-class [event_target:gts_ora_2_system_first_leader.GetName] was about to intervene, a long sword appeared in Ora's hand - \\ nTo be precise, it was the long umbrella left behind by that Celestial Giantess.\n\"With my conviction as a 'human,' I will walk this path to its very end...\"\\ n\"As for me - my past... everything I've been through... it was all for a single purpose...\"\n\"Let me be the one... to break this promise, so she may return.\"\\ nAfter forcing the Celestial-class [event_target:gts_ora_2_system_first_leader.GetName] back through the stargate, Ora looked at the stargate, which had not yet closed, then at the notebook with only a few pages remaining, and threw the pen in her hand toward the stargate. \n\"My story... is coming to an end.\"\nInside the stargate, you were pushed backward by Ora's force, only to find a notebook in your arms. And a beautifully wrapped pencil. Over all this time, you've read what she wrote in it more than once, yet you've never picked up the pen that the Giantess used. Now that she's given this to you, there's only one possibility...\n\"If I don't come back... it's up to you. Write whatever story you like.\"""
