  gts_ora.101.c.custom: "Consume population to gain Food"
  #  “妥协”还是“反抗”，这是一直以来的命题。\n星总是认为，自己不应当依靠璇这个推倒高塔的“罪魁祸首”。他讨厌塔，讨厌的是小人社会这般堪比斩杀线的“吃人”处境。而这份明面上对璇这个巨娘的反抗，却是对如今生活的“妥协”。\n璇所接受的教育却认为，应该给小人选择的权利，却不是因为别的，而是出于自己的一种“心安理得”——把小人带回去的理由。那是一种“温柔”，却是对小人的“妥协”。\n至于小塔，他妥协了太多，高塔的崩塌让他一度陷入了被“斩杀”的处境。而他十分明白一个道理：星的“反抗”无法持续太久。既然跟着璇可以得到生存的机会，而自己却早已是个小人社会认定的“死人”。目的就是让星放下那些生活上的重压，投身于巨娘的怀抱。\n不过呢，故事的最后，巨娘推倒了偏见的高塔，也总是个大家都想看到的结局，至于你的话，放心，有我在，我们不会对未来选择“妥协”的，不是吗？\n\n故事在少女的口中完结，但是在得到故事的同时，少女决定用一些小小的资源，向你换取一点点……“零食”？\n（你使用人口向橘子长兑换了2500食物）
  gts_ora.101.c.response: "\"Compromise\" or \"resistance\" has always been the question.\\nXing always believes that he should not rely on Xuan, the \"culprit\" who toppled the high tower. He hates the tower, and what he hates is the \"man-eating\" predicament of little people's society, a situation practically at the execution threshold. Yet this open resistance against Xuan, this giantess, is itself a \"compromise\" with his current life.\\nThe education Xuan received tells her that little people should be given the right to choose, but not for any other reason than a kind of \"clear conscience\" of her own, a reason to bring the little people back. That is a kind of \"gentleness,\" but also a \"compromise\" with the little people.\\nAs for Little Tower, he has compromised far too much. The collapse of the high tower once plunged him into a state of being \"executed.\" And he understands one truth very well: Xing's \"resistance\" cannot last for too long. Since following Xuan can offer a chance at survival, while he himself has long been considered a \"dead man\" by little people's society, his goal is to make Xing set down the heavy burdens of life and throw himself into the giantess's embrace.\\nStill, at the end of the story, the giantess topples the high tower of prejudice. That is always the ending everyone wants to see. As for you, do not worry. With me here, we will not choose to \"compromise\" with the future, will we?\\n\\nThe story ends from the girl's lips, but while receiving the story, the girl decides to trade a few small resources with you for a tiny bit of... \"snacks\"?\\n(You used Pops to exchange with Orange Chief for 2500 Food)"
