  # §H\"我不接受！\"§!\n maiden不接受这一点，而她也清晰的知道，违逆教条的代价如何。但是她不在乎，因为年幼的她早已受尽了千夫所指。于是她来到教堂，靠着出色的能力让教堂的人们推举着，让她成为了主管祭祀的那个人，却无人知道，在这一次祭祀结束后，却有一个少年从教堂中走出，而第二天，总会有一户人家泪流满面地在 maiden家的门前，感谢着 maiden的所作所为。\n只可惜，隔墙有眼，在小人利益的驱使下， maiden的行为被不怀好意的人告发，而 maiden也被那些疯狂的教徒架到了火堆上。\n她不后悔，只恨自身无能。若自己有着足够强大的能力，又怎么能够受到这样的代价？如果有这足够强大的力量，或许就会存在更加直接有效的方法。总之，试图成为魔王的勇者，却被自家的村民送上了火堆，这个故事，如此讽刺。却有着更加荒诞的结局 -  - \n而这一刻，神明诞生了。\n\"若无跨越生死的彼岸......又怎能看到属于'空间'造就的伟业？若无耗尽一生奔跑，又怎能追赶上'维度'的边界？\"\n\"若你想要力量，就向前来，告诉我：如果给予你强大到改变整个世界的能力，你会做什么？\"\n\"我......\"
  gts_ora.1217.desc: ""§H\"I won't accept it!\"§!\nThe young girl refused to accept this, and she knew full well the price of defying the doctrine. But she didn't care, because even as a child, she had already endured the scorn of the masses. So she went to the church, where her exceptional abilities earned her the support of the congregation, and she became the one in charge of the rituals. Yet no one knew that after each ritual ended, a young boy would walk out of the church, and the very next day, a family would always appear at the girl's doorstep, tears streaming down their faces, to thank her for what she had done. \nUnfortunately, there were always prying eyes. Driven by self-interest, her actions were reported by ill-intentioned individuals, and she was dragged to the stake by those fanatical worshippers. \nShe had no regrets, only a deep resentment at her own powerlessness. If she had possessed sufficient strength, how could she have suffered such a fate? Had she possessed that power, perhaps there would have been a more direct and effective solution. In any case, the story of a hero who sought to become a Demon King, only to be sent to the stake by her own villagers, is deeply ironic. Yet it had an even more absurd ending - \nAnd at that moment, a god was born.\n\"Without crossing to the other shore beyond life and death... how could one ever witness the great achievements forged by 'space'? Without running until one's life is spent, how could one ever catch up to the boundaries of 'dimension'?\"\\ n\"If you want power, come forward and tell me: if you were given the power to change the entire world, what would you do?\"\n\"I...\"""
