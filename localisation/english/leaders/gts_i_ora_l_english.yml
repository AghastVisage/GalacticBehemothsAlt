  gts_ora.3020.name: ""Approach""
  # 你可以承认，橘子长在帝国的能力确实令人惊叹，但是你不能理解的一个事情是：\n\n为什么会有人会没经过自己允许的情况下查抄橘子长的屋子？\n\n当你感到现场时，橘子长的屋子和办公室已经被各种体型的巨娘围个水泄不通。而得到的理由却也是极为荒唐：\n\n\"橘子长有着天体级的俸禄却只有高大巨娘差不多的花销......一定有问题！\"\n\n在你认为这样的事情比较扯淡的时候，橘子长却对你伸出手，使了个眼神。你心领神会，爬上了橘子长的手。就这样被她带到了一边。\n\n\"查吧......趁这个机会，咱们去别的地方玩玩。\"\n\n橘子长并无愠色，只是带着你离开了此处，可走了几步，回过头，对着搜着自己屋子正起劲的巨娘说了句不轻不重的话：\n\n\"不过要是我回来后发现屋子被弄乱了......想必你们不会想知道弄乱女孩子的屋子是什么后果吧。\"\n\n你被橘子长带着，来到了一处公园。公园内，一群小人在巨娘的腿上玩滑滑梯，却比你想象中要和谐许多。橘子长来到了一处长椅坐下，也好，正好也能休息一下吧。只是有一件事情让你依旧不明白：\n\n星球总督，这个基本上可以算得上是整个星球最大的官职，却被那么几个蝇头大的小检查员，用这样一个扯淡的理由逼到这种程度。这一点你并不理解，甚至觉得橘子长的行为有点......憋屈。这不就是白白受欺负了嘛。\n\n\"想知道为什么咱不生气吗......\"\n\n就在这时，你的思绪却被橘子长打断。\n\n\"算了......闲着也是闲着，想听故事吗？我倒是可以给你讲讲，关于自己的一点小事......\"
  gts_ora.3020.desc: ""You can admit that Ora's abilities within the Empire are truly astonishing, but there's one thing you just can't understand: \\ n\nWhy would anyone raid Ora's house without her permission?\n\nBy the time you arrived on the scene, Ora's house and office were already completely swamped by Giantesses of all sizes. And the reason they gave was utterly absurd:\n\n\"Ora has a celestial-level salary but spends about as much as a tall Giantess... something must be wrong!\"\\ n\nJust as you were thinking this whole situation was utter nonsense, Ora reached out her hand and gave you a knowing look. You took the hint and climbed onto her hand. That's how she led you aside.\n\n\"Go ahead and search... Let's take this opportunity to go have some fun somewhere else.\"\\ n\nOra showed no sign of annoyance; she simply led you away. But after taking a few steps, she turned back and said, in a tone that was neither harsh nor gentle, to the Giantess who was busily searching her room:\n\n\"But if I come back and find the room in disarray... I'm sure you wouldn't want to know the consequences of messing up a girl's room.\"\\ n\nOra led you to a park. Inside, a group of Tiny people were playing on a slide on Giantess's legs - a scene far more harmonious than you'd imagined. Ora walked over to a bench and sat down; well, that's fine - it's a good chance to rest a bit. But there's one thing you still don't understand:\n\nThe Planetary Governor - a position that's essentially the highest office on the entire planet - has been pushed to this point by a handful of insignificant little inspectors using such a ridiculous excuse. You just don't get it - you even feel that Ora's behavior is a bit... unfair. Isn't this just letting himself get bullied for no reason?\n\n\"Want to know why I'm not angry...?\"\\ n\nJust then, your train of thought was interrupted by Ora.\n\n\"Never mind... I've got nothing better to do anyway. Want to hear a story? I could tell you a little something about myself...\"""
