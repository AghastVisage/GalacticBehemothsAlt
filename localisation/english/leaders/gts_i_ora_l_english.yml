  gts_ora.101.a: "Memoryless Illusory Dreamworld"
  #  消耗人口获得能量币
  gts_ora.101.a.custom: "Consume population to gain Energy Credits"
  #  “少女做过一个梦，糖霜撒满的理想国。而梦里的她遇到了最温柔的少女，似乎是最好的玩伴，也可以是永远的家人，她们的距离十分相近，即使被吃掉也心甘情愿，似乎这也是这份温柔的一部分，让不合时宜的记忆都为之消散。”\n“未来是过去的未来，过去却是未来早已抛弃的存在，少女在梦界中，将自己的过去与未来闭合，因为只有在梦里才可以展现自己最脆弱的一面。”\n睡吧，愿你的梦里，能遇到白安那般温柔的巨娘，我保证。\n\n故事在少女的口中完结，但是在得到故事的同时，少女决定用一些小小的资源，向你换取一点点……“零食”？\n（你使用人口向橘子长兑换了2500能量币）
  gts_ora.101.a.response: "\"The girl once had a dream, an utopia sprinkled with frosting. In that dream, she met the most gentle girl—seemingly her best playmate, or perhaps eternal family. They were so close that she would be willing to be eaten, as if that were part of that gentleness, letting untimely memories vanish.\" \\n\"The future is the past's future, while the past is an existence long abandoned by the future. In the dreamworld, the girl closes the loop between her past and future, for only in dreams can she show her most vulnerable side.\" \\nSleep now. I promise that in your dreams, you will meet a giantess as gentle as Baian. \\n\\nThe story ends from the girl's lips, but upon receiving the story, she decides to exchange some small resources for a bit of... 'snacks'? \\n(You exchanged population with Captain Ora for 2500 Energy Credits)"
  #  《众星尽头的救赎》
  gts_ora.101.b: "Redemption at the End of Stars"
  #  消耗人口获得矿物
  gts_ora.101.b.custom: "Consume population to gain Minerals"
  #  小人曾陷入这般自证的境地，她在地砖缝中，追逐着巨娘的脚步，却究其一生，也无法走出巨娘的一步之遥。\n她曾失去希望，她曾深陷泥潭，她曾不信命运，也被别有用心之人推入深渊。她并没有别的故事里那般，有着花里胡哨的能力。而这样的她妄图染指神明，绝无可能。\n所幸她并非燃尽的孤星，她有一路上相陪的伙伴，才能让她再次拥有了与神明对垒的权利。小人手持长伞，宛如勇者的剑，相信的心成为了唯一的魔法。\n不过话说回来，你也并非孤星不是吗？有着一路上认识的巨娘……还有我。\n\n故事在少女的口中完结，但是在得到故事的同时，少女决定用一些小小的资源，向你换取一点点……“零食”？\n（你使用人口向橘子长兑换了2500矿物）
  gts_ora.101.b.response: "The tiny once fell into such a state of self-justification, chasing the footsteps of a giantess within the cracks of floor tiles, yet never in her entire life could she escape a single step's distance. \\nShe once lost hope, once fell deep into a mire, once didn't believe in fate, and was pushed into the abyss by malicious intent. She didn't have the flashy abilities seen in other stories. For such a person to attempt to touch the divine was impossible. \\nFortunately, she was not a burnt-out lone star; she had partners accompanying her along the way, allowing her to once again gain the right to stand against a god. The tiny held a long umbrella like a hero's sword, her believing heart becoming the only magic. \\nBut then again, you aren't a lone star either, are you? You have the giantesses you've met along the way... and me. \\n\\nThe story ends from the girl's lips, but upon receiving the story, she decides to exchange some small resources for a bit of... 'snacks'? \\n(You exchanged population with Captain Ora for 2500 Minerals)"
  #  《璇星塔下的选择》
  gts_ora.101.c: "Choice Beneath the Revolving Star Tower"
