  #  
  gts_ora.1002.name: ""
  #  好哦，那请靠紧一些。”\n整个星球被橘子长包裹在了身体中间，少女轻轻托举着这个脆弱的生命，这颗星球美丽，却易碎。\n你不知道橘子长要做些什么，你也不知道橘子长离开后要去哪里。你更加不知道橘子长是否还能再回来，你什么时候还能再次见到她。无论如何，少女打点好了自己的行装，离开了此地，却留下了一些东西：\n一个星球，所谓的“孤星监狱”，她将这片恒星系交给了你。或许……这 意味着她还回来？\n而你回到办公室后，却看到，一个精致的手账本留在了你的桌子上。你认得这本，是橘子长一直带在身上的东西，而如今这样的大小放在桌子上，想必，也是她留给你的东西吧。而当你准备翻开第一页的时候，却在封面处看到了这样一句话，一句贴上去的便条：\n“别担心，我们终有一日重逢。”
  gts_ora.1002.desc: "All right, then please come a little closer.\"\\nThe entire planet was wrapped between Orange Chief's body. The girl gently held up this fragile life. This planet was beautiful, yet brittle.\\nYou do not know what Orange Chief intends to do, nor do you know where Orange Chief will go after leaving. You know even less whether Orange Chief can ever return, or when you will be able to see her again. In any case, the girl packed her belongings and left this place, but left behind a few things:\\nA planet, the so-called \"Lonely Star Prison.\" She entrusted this star system to you. Perhaps... this means she will still come back?\\nWhen you return to the office, however, you see an exquisite journal left on your desk. You recognize it. It is something Orange Chief has always carried with her, and now, at this size on your desk, it must be something she left for you. But when you are about to open the first page, you see these words on the cover, written on a pasted note:\\n\"Do not worry. One day, we will meet again.\""
