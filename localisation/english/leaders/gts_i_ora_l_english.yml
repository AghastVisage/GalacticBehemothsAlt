  # 晃啊晃，大脑仿佛要放空。不过嘛......到也没有什么拒绝的想法就是了。只是......求求姐姐不要晃了好吗？再晃下去只怕身体要被摇散黄了啊！\n \"好了，不会太为难你的......\"\n  双脚再次踏在了地面上，却突然毫无来由地隆起，导致自己摔倒在地 -  - 好吧，头晕晕的，走在平地上都感觉像是有无数道坎一样。只是，两边的两堵白皙的一眼望不到头的高墙，宛如身在峡谷中的两面悬崖，看上去却不是幻觉，而是...... maiden的两条纤长的腿。\n \"刚刚就盯着咱的腿看......小橘个头小小，脑子里却是涩涩的东西呢~\"\n \"好啦，不逗你了......玩个游戏，给你两个选择，从这里跑出去，或者......\"\n 话音刚落，却发觉到两边的墙壁开始收缩了一分，\"或者就被咱的腿夹在里面了哦~\"只听到白安说完这最后一句话，随后双腿间的距离却再次收紧了一分，仿佛是在催促着自己一般，似乎......游戏就这么开始了。\n 算了，跑吧，向着那前方的空隙处，不要停下，更不要回头。两边的墙壁在一点点收缩，有时会停下来一会，有时会稍微张开一点又再收回去。看来......白安为了自己能够顺利跑出去，似乎是放足了水。就在我累的气喘吁吁想要停下来的时候，身后却传出来了莫名其妙的推背感 -  - 回头一看，却发现对方的手指在推着自己走。\n \"唔......\"如此一来，这样要是还没能逃出去的话......想必自己要被对方笑话了吧。就在我这么想的时候，不知过了多久，转身一看，白安的双腿什么时候离自己这么近了？\n 丝毫不意外地，自己被对方的双腿夹在其中，柔软的触感让人恨不得就这么将自己融化在其中。只是......不甘心啊，还是想往上爬一下。似乎......动起来比想象中要难，不过自己还是一点一点地，左脚踩右脚般，在对方夹紧的双腿中间探出个头。却看到对方捂着嘴偷笑的样子。\n随后，夹住自己的双腿却毫无征兆地松开，自己慌忙扒住其中一边才慢慢地从上面滑落下来。我刚想说些什么，却看到白安的手里多了一个卷尺。\n \"不要动哦 -  - \"\n  17cm，这是不到半分钟左右自己全力奔跑的长度......吗？并不是，如果算上白安推着自己走的12cm的话......恐怕自己也只是跑了5cm这么远。瞬间，一种很不是滋味的情绪开始涌上心头，似乎像玩不起的孩童一般，只是碍于面子，眼泪却没能从眼眶中出现，却被对方那晶黑色的瞳孔捕捉到这细微的变化。\n \"好啦......小橘还真的是可爱呢......\"\n  只是被她捏在手中，刚刚所有的委屈都全部烟消云散一般。只是玩个游戏而已，自己也不会真的以为自己的大小能和她相比吧。想到这里，我伸出手抱住了对方的手指，想再感受一下对方手指间的温度。\n \"其实吧......小橘在学校里的问题......想知道答案吗？\"\n \"阿勒？\"我歪着头，看着白安的脸。她的心思是如此细腻，总是能一眼看透自己心里在想什么，可是......她心里想的是什么，自己却怎么都捉摸不透。似乎也就是这样的原因，自己才会一直被她捉弄着吧。\n \"这个房子只有咱一个人哦，放学回家也是空荡荡的......所以，没有咱的允许，小橘不可以离开咱哦。\"\n \"嗯嗯。\"我点了点头，原来......自己对她的意义也不是那么不值一提嘛。想到这里，心里总感觉有那么一团温泉，暖暖地流向了身体的每一处角落。下一秒，自己就这么被她放在了书桌上。\n \"在这里等一会哦，咱要去做饭了。你也不想......咱突然饿起来把你一口吃掉吧。\"\n 这当然是一句玩笑，可对方张开的嘴却实打实让自己后退了半步，就像是故意迎合她一般。却引得她扑哧一笑，顺带用手指轻轻推了一下自己，随后转过身去，身影逐渐远去。
  gts_ora.1118.desc: ""Swaying back and forth, my mind feels like it's about to go blank. But then again... I don't really mind it, though. It's just... please, sis, could you stop swaying? If this keeps up, I'm afraid my body's going to fall apart!\n \"Okay, I won't push you too hard...\"\\ n  My feet touched the ground again, but it suddenly bulged out for no apparent reason, causing me to fall flat on my face - well, my head was spinning so much that even walking on flat ground felt like navigating countless bumps. But the two pale, towering walls stretching as far as the eye could see on either side - like cliffs flanking a canyon - didn't look like an illusion. Instead, they were... the girl's two slender legs.\n \"You were just staring at my legs... Little Orange may be tiny, but she's got some naughty thoughts in her head, doesn't she~\"\n \"All right, I'll stop teasing you... Let's play a game. I'll give you two choices: run out of here, or...\"\\ n No sooner had the words left her mouth than she noticed the walls on either side begin to close in slightly. \"Or get trapped between my legs, hehe~\" Just as Bai An finished that last sentence, the gap between her legs narrowed once more, as if urging her on - it seemed... the game had begun. \n Oh well, I'll just run - toward that gap up ahead. Don't stop, and definitely don't look back. The walls on either side were closing in bit by bit; sometimes they'd pause for a moment, other times they'd open slightly before closing again. It seemed... Bai An had really gone all out to make sure I could run out safely. Just as I was gasping for breath and about to stop, I felt a strange push on my back from behind - I turned around and saw that his fingers were pushing me forward.\n \"Ugh...\" If I still can't escape like this... I'd probably be the butt of their jokes. Just as I was thinking this, after what felt like an eternity, I turned around and realized - when had Bai An's legs gotten so close to me?\n Unsurprisingly, I found myself sandwiched between her legs; the soft sensation made me want to melt right into them. But... I wasn't ready to give up; I still wanted to climb up a bit. It seemed... harder to move than I'd imagined, but I kept at it, inch by inch, stepping with my left foot over my right, until I managed to poke my head out from between her tightly clasped legs. That's when I saw her covering her mouth and giggling. \nSuddenly, the legs holding me in place loosened without warning. I frantically grabbed hold of one of them and slowly slid down from above. Just as I was about to say something, I noticed that Bai An was now holding a tape measure.\n \"Don't move, okay - \"\\ n  17 cm - was that the distance I'd covered in less than half a minute while running at full speed...? No, not really. If I included the 12 cm Bai An had pushed me... I'd probably only run 5 cm. In an instant, a bitter feeling welled up inside me. I felt like a child who couldn't handle losing a game - though out of pride, no tears welled up in my eyes. Yet that subtle change was caught by her jet-black pupils. \n \"All right... Xiao Ju really is cute...\"\n  Just being held in her hand made all the hurt and frustration from moments ago vanish into thin air. It was just a game - I wouldn't really think my size could compare to hers, would I? With that thought, I reached out and wrapped my hand around hers, wanting to feel the warmth between her fingers one more time.\n \"Actually... about Xiao Ju's problem at school... do you want to know the answer?\"\\ n \"Huh?\" I tilted my head, looking at Bai An's face. She was so perceptive - she could always see right through my thoughts at a glance - but... I could never quite figure out what she was thinking. It seemed that was exactly why she kept teasing me.\n \"I'm the only one in this house. It's so empty when I get home from school... So, Xiao Ju, you can't leave me without my permission.\"\n \"Mm-hmm.\" I nodded. So... I guess I'm not completely insignificant to her after all. Thinking of that, I felt a warm sensation, like a hot spring, spreading to every corner of my body. The next second, she set me down on the desk.\n \"Wait here for a bit, okay? I'm going to cook dinner. You wouldn't want... me to suddenly get hungry and gobble you up, would you?\"\\ n Of course, it was just a joke, but the sight of her opening her mouth made me instinctively take half a step back, as if I were deliberately playing along. This made her giggle, and she gave me a gentle nudge with her finger before turning away, her figure gradually fading into the distance.""
