  gts_ora.1032.name: ""\"Losing myself\" to convey the self... I am already a dead man.""
  # 先是郊外的巨大脚印，而后是更加频繁的地震。大家都不知道如何，只是在某一天，这个星球的所有人都收到了同一个消息：\n中东的战争在某一天悄无声息的终止，是终止，不是暂停。各个国家的领导罕见的聚集在了一起，无一缺席，谈判却是和谐，但仿佛是被某只看不清的大手所威胁的宁静。而数个小时后，先是束缚住互联网的高墙开始毫无征兆的拆除，而各方媒体均在同一个时间喊着同样的一句话：\n各国领导决定，成立\"全球命运\" -  - 世界和平了？不，接下来的消息给予了答案：\n全世界突然发了疯一般，科研，军事，生产......似乎一切都在被一场灾难催促一般，赖以生存的家园开始拆毁，转移，修建更加坚固的堡垒。加固，加固，没有材料就做，做不出来就拆，从已有的建筑物上往下迁移，只为了以自己的恐慌，铸就可以抵挡一切的高墙。更快，更高，更大......越来越多的大口径武器被制造，被装备，被运往世界各地，大量核武器被封存在地下，却没有想要发射出去的想法......至此，你似乎意识到什么，可一切似乎又有些来不及，或者说......挡不住。\n南太平洋堡垒已然建成，马奇诺防线也在堂堂复活中，整个世界都在全力运转的时候......你站在城墙顶端，看着远处早已被放弃的城市区划，而就在此刻，你终于看到了，这些高层的家伙们到底在恐慌什么：\n那是一个高达几十米的......人类？看样子确实是个唱的俊俏的女孩子。但你的心里早已万分清楚：不，这样的大小已然可以用怪物来形容，而她们却在早已废弃的城市间，似乎百米高的大楼在她们眼中，却如同沙子堆砌的城堡一般，一触即碎。而此刻，她们也显然注意到了你，正在向你的方向前进 -  - \n\"砰 -  - 砰砰砰 -  - \"\n耳边传来火药撕扯空气的轰鸣，大口径的炮弹贯穿了 maiden的身体，却不留情面的只能造成轻微的硬直，只能在这不断的压制下，将这堵巨大的身躯打成筛子。这时，你注意到，自己的手在紧紧攥着自己的衣角，你开始不受控制的窒息，正想抬头看一下天空时，却瞪大了双眼\n星星没了。\n不是看不到，而是彻底没了，北寒带的天空中却也看不见任何极光，而是出现了一道更加诡异的现象：\n那是......瞳孔？靛蓝色的天幕，将原有的夜色染上了一层诡异的气息。盖革表的度数正在疯狂发出警报，气温计在一瞬间报表，所有的卫星从这道靛蓝的天幕下坠落，一切的设备都因此瘫痪。失灵，短路，爆炸......似乎人类文明所诞生的一切在这道天幕下都将成为笑谈。而在这万分不幸的事实前，你终于收到了一个好消息：\n至少她会给予你一个较为体面的解脱，或许......死在 maiden的手指下对于她而言，也可以翻译为\"解脱\"吧。\n\"埃维拉城......西原大陆......沙漏中的时间已然流下了最后一滴眼泪......腐蚀的巨龙将世界啃食的千疮百孔，而你......却连你的存在都维系不了......\"\n\"失我者啊......来自世界之外的人啊......我等待着扉页上你的落款。\"
  gts_ora.1032.desc: ""First came the giant footprints on the outskirts of town, followed by increasingly frequent earthquakes. No one knew how it happened, but one day, everyone on the planet received the same message:\nThe war in the Middle East had quietly come to an end one day - an end, not a ceasefire. The leaders of every nation gathered together - a rare occurrence with not a single one absent - and the negotiations proceeded harmoniously, though the atmosphere felt like a calm forced by some unseen, looming threat. A few hours later, the high wall that had confined the internet began to be torn down without warning, and media outlets everywhere simultaneously proclaimed the same message:\n\"World leaders have decided to establish 'Global Destiny' - is there world peace?\" No - the news that followed provided the answer:\nThe entire world suddenly went mad: scientific research, the military, production... It seemed as if everything were being driven by a catastrophe. The homes we depended on for survival began to be demolished, relocated, and rebuilt into even sturdier fortresses. Reinforce, reinforce - if there were no materials, they were made; if they couldn't be made, structures were torn down; people were relocated from existing buildings - all to use their own panic to forge a wall capable of withstanding anything. Faster, higher, bigger... More and more large-caliber weapons were manufactured, deployed, and shipped around the globe; vast quantities of nuclear weapons were sealed underground, though there was no intention to launch them... At this point, you seem to realize something, yet it feels as if it's already too late - or perhaps... unstoppable. \nThe South Pacific Fortress has already been completed, the Maginot Line is being grandly revived, and the entire world is operating at full capacity... You stand atop the city walls, gazing at the long-abandoned urban districts in the distance. And at this very moment, you finally see what those high-and-mighty people are truly terrified of:\nIt is a creature dozens of meters tall... a human? It certainly looks like a strikingly beautiful young woman. But deep down, you already know full well: No, a creature of this size can only be described as a monster. Yet as they move through the long-abandoned city, even hundred-meter-tall skyscrapers seem to them like castles built of sand - fragile enough to crumble at the slightest touch. And now, they've clearly noticed you and are heading straight toward you - \n\"Bang - bang bang bang - \"\\ nThe roar of gunpowder tearing through the air rings in your ears. Large-caliber shells pierce the girls' bodies, yet they cause nothing more than a slight momentary stiffening - under this relentless barrage, their massive forms are reduced to sieves. At that moment, you notice your hand clenching the hem of your shirt tightly. You begin to feel an uncontrollable sense of suffocation. Just as you're about to look up at the sky, your eyes widen in shock\nThe stars are gone. \nIt wasn't that you couldn't see them - they were completely gone. Yet in the sky of the Arctic Circle, there was no sign of the aurora either; instead, an even more eerie phenomenon had appeared:\nWas that... a pupil? The indigo-blue canopy of the sky cast an eerie aura over the night. The Geiger counter was sounding a frantic alarm; the thermometer went haywire in an instant; all satellites plummeted from beneath this indigo canopy, and every piece of equipment failed as a result. Malfunctions, short circuits, explosions... It seemed as though everything humanity had ever created would become a laughingstock beneath this canopy. And in the face of this utterly tragic reality, you finally received some good news:\nAt least she'll grant you a relatively dignified release. Perhaps... dying at the hands of a young girl could, to her, also be interpreted as \"release.\"\n\"The City of Evira... the Western Plains Continent... The last tear has fallen from the hourglass... The Corroded Dragon has gnawed the world to tatters, and you... cannot even sustain your own existence...\"\n\"O Lost One... O One from Beyond the World... I await your signature on the title page.\"""
