  # 泰坦级别的海盗已经抵达了孤星监狱的轨道，已经有小股部队已经登陆星球，然而，就在人们认为对方要大肆进攻的时候......几乎只有小人陆军的星球内，敌方目标却在一瞬间发生了溃逃的动作。这是怎么个事？\n\n\"怎么了？帝国的长枪大炮不怕......反倒怕我这样一个手无寸铁的女孩子吗......\"\n\n橘子长却出现在孤星监狱的轨道外，手上捏着的却是太空海盗的首领。擒贼先擒王，在橘子长挟天子以令诸侯的操作下，刚刚还在入侵星球的巨娘却在一瞬间停止了动作。\n\n毕竟这些巨娘要面对的，是一个身躯跨越整个天体的女孩子。\n\n\"为了防止我的耐心消耗殆尽，我会给你们十三次心跳的时间，至于要怎么做......\"\n\n有的话不必完全讲清，哪怕未开智的生物都有趋利避害的可能，一瞬间，所有的巨娘全部撤出星球的轨道，只剩下橘子长手里捏着的这一只。\n\n\"忘了说了......在你们还在星系之外，我就已经联系了一个家伙来......我确实放过了她们，但是当她们走出这个星系的时候，就会 -  - \"\n\n橘子长的手指轻轻张开，做出了一个爆炸的动作，却令手中的巨娘吓得哆嗦，似乎有透明的液体从对方的下体渗出，堂堂泰坦级巨娘，却被一个普普通通的女孩子吓得全身发抖，或许这样的笑话，也只能在这样荒诞的场景下才会出现吧。\n\n\"不过不用担心......毕竟比起我的话，我认为你一会儿会更愿意落入那个杀伐果断的家伙手里......\"橘子长从兜里掏出了一小捆细线 -  - 任何人都没见过她这幅景象，也不知她的兜里为什么会有这捆堪比星界丝缕一般的细线 -  - 不过从外套上的补丁来看，或许这些都不重要。橘子长微微笑着，将巨娘绑成个很羞耻的样子。随后略带狡黠的说了两句：\n\n\"落在别人手里的小人，一般都会求着别死，不过可以理解，又有谁会想不开嘛。\"\n\n\"但是落到了橘子长的手里......恐怕你会认为死掉是一件多么轻松的事情......但是吧，世界上哪里又有那么些轻松的事情呢~\"
  gts_ora.3014.desc: ""Titan-class pirates have reached the orbit of Lone Star Prison, and small units have already landed on the planet. However, just as everyone thought the enemy was about to launch a full-scale assault... on a planet defended by almost nothing but a tiny army of tiny people, the enemy forces suddenly began to flee in disarray. What on earth is going on?\n\n\"What's going on? They're not afraid of the Empire's spears and cannons... but they're afraid of an unarmed girl like me...?\"\\ n\nOra suddenly appeared outside the orbit of Lone Star Prison, clutching the leader of the space pirates in her hand. To catch the thief, catch the king first - under Ora's strategy of using the \"emperor\" to command the \"vassals,\" the Giantesses who had just been invading the planet froze in their tracks in an instant. \n\nAfter all, these Giantesses were facing a girl whose body spanned the entire celestial body.\n\n\"To prevent my patience from running out, I'll give you the time of thirteen heartbeats. As for what you should do...\"\\ n\nThere was no need to spell it out completely; even unintelligent creatures are capable of seeking benefit and avoiding harm. In an instant, all the Giantesses withdrew from the planet's orbit, leaving only Ora in her hand.\n\n\"I forgot to mention... While you were still outside the galaxy, I'd already contacted someone... I did let them go, but the moment they leave this galaxy, they'll - \"\\ n\nOra's fingers spread slightly as she mimicked an explosion, causing the Giantess in her grasp to shudder in fear. It seemed as though a transparent liquid was seeping from her lower body. A mighty Titan-class Giantess, trembling all over at the sight of an ordinary girl -  Perhaps such a farce could only unfold in a scene as absurd as this.\n\n\"But don't worry... After all, compared to me, I think you'd much rather fall into the hands of that ruthless guy in a moment...\" Ora pulled a small bundle of fine thread from her pocket - no one had ever seen her like this before, nor did anyone know why she had this bundle of thread, as fine as threads from the Astral Realm, in her pocket - but judging by the patches on her coat, perhaps none of that mattered. Ora smiled faintly as she tied the Giantess up in a rather humiliating position. Then, with a hint of mischief, she said:\n\n\"When a tiny person falls into someone else's hands, they usually beg for their life - which is understandable. After all, who would want to end it all?\"\\ n\n\"But if you fall into Ora's hands... I'm afraid you'll come to think that dying is such a relief... But then again, where in this world are things ever that easy~\"""
