  # 睁开眼，天已然来到了白昼，可这也就意味着，自己还是没找到东西吃。梦终究还是要依附于现实的吧，自己的肚子这样说道，我看了看周围，却只是能在雪糕棍上的图画上，看到了 maiden的一角：\n整齐的深黑色短发，整齐的学生制服，此时正坐在旁边，怀里抱着的却是自己梦寐以求的东西：这米饭白花花的，似乎只需要一粒就可以让自己一整天不再为食物担忧。只是......本能早已超脱理智，却一个没留神，也可能是身体比较虚弱的原因，朝着那片白花花的美好中，倒了下去 -  - \n\"唔......好黏 -  - \"\n细腻的糯米团子，撒满的粉色糖霜让自己动弹不得，而随后，随着一阵失重感，在 maiden张开的口腔中，没有任何可以逃离的余地，那个想找点食物的小人，却 -  - \n却在 maiden不知不觉间，成为了她的食物。\n被吃掉了，没有一点可以改变的余地。似乎这才是自己应得的结局，也给现实留足了面子。只是......怅然若失的感觉，仿佛身体也早已被胃液洞穿一般，自己......真的喜欢这样的梦吗？\n已经不再能让自己睡下去了，看着7点的闹钟已然准时的想起，我披上大衣，赶往了早高峰的洪流中。\n梦，那么奢侈，以至于会是仅此一次的一生。\n而当你意识到这一切都是虚幻的时候，醒来时被现实撕扯的伤口却在不断的发出撕心裂肺的脉搏。\n小橘子长在这份半梦半醒中，却早已不知自己身体的存在，而自己又在何方，她捡起伞，尝试向前再走一步，却宛如踩空一般，仿佛下一秒就要坠落深渊一样。\n\"梦......是虚幻的，那因一份'梦'而诞生的我......\"\n\"就是最好的伪证了！\"\n是的，如果任由这样的声音涌入，橘子长也会因此迷失，只不过......\n\"橘子长......这个名字就是你的了。\"\n纵然梦是如此虚幻，纵然这现实是如此沉重，而她也看到了，即使只是几个凡人，也会选择在神明虚构的梦呓中，将枪口对准自己，只为赌这把老旧左轮的六发子弹。\n我曾做着这样的梦，糖霜撒满的理想国。\n梦，是心最柔软的眠床，既然如此，请放心将自己最脆弱的一面展开。\n然后，在第二天，带着收拾好的心情，明天见。\n\"走吧，我不是某人赝造的幻想......\"\n橘子长捡起掉落的长伞，走在了被净空区域的航道上。\n\"因为我是因为你的执念而诞生的......橘子长。\"
  gts_ora.1129.desc: ""When I opened my eyes, it was already daylight - but that just meant I still hadn't found anything to eat. \"Dreams must ultimately be rooted in reality,\" my stomach seemed to say. I looked around, but all I could see was a glimpse of the girl in the picture on the popsicle stick: \nNeat, short, jet-black hair; a neat school uniform. She was sitting right next to me, holding in her arms the very thing I'd been dreaming of: That snow-white rice - it seemed that just a single grain would be enough to keep me from worrying about food for the rest of the day. But... my instincts had long since overridden my reason. In a moment of inattention - or perhaps because my body was so weak - I collapsed right into that dazzling white splendor - \n\"Mmm... so sticky - \"\\ nThe delicate glutinous rice dumplings, dusted with pink powdered sugar, left her unable to move. Then, with a sudden sensation of weightlessness, there was no escape from the girl's open mouth. That Tiny person, who had been searching for food, instead - \nInstead, without the girl even realizing it, became her food. \nEaten - with absolutely no way to change it. It seemed this was the ending she deserved, and it saved face for reality. But... that feeling of desolation, as if my body had long since been pierced by gastric juices - did I... really like dreams like this?\nI could no longer bring myself to sleep. Seeing that my 7:00 a.m. alarm had gone off right on time, I threw on my coat and rushed into the torrent of the morning rush hour. \nDreams - such a luxury that they might be a once-in-a-lifetime experience.\nAnd when you realize it's all an illusion, the wounds torn open by reality upon waking continue to throb with a heart-wrenching pain. \nMora grew up in this state of half-sleep, half-awake, yet had long since lost awareness of her own body or where she even was. She picked up her umbrella and tried to take another step forward, but it felt as if she'd stepped into thin air - as if she were about to plunge into an abyss the very next second. \n\"Dreams... are illusory. And I, born from a 'dream'...\"\n\"Am the perfect false witness!\"\nYes, if she let such voices flood her mind, Ora would lose herself - but...\n\"Ora... this name is yours now. \"\nEven if dreams are so illusory, even if this reality is so heavy, she has seen that even a few mere mortals would choose, within the delusions fabricated by the gods, to point a gun at themselves - all to gamble on the six bullets in that old revolver. \nI once had a dream like this - a utopia sprinkled with powdered sugar.\nDreams are the heart's softest bed; since that is so, please feel free to lay bare your most vulnerable self.\nThen, the next day, with your emotions in order, see you tomorrow. \n\"Let's go. I'm not some counterfeit fantasy...\"\nOra picked up the fallen long umbrella and walked along the cleared flight path.\n\"Because I was born from your obsession... Ora.\"""
