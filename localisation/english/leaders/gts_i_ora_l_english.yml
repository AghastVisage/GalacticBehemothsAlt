  #  “嗯？这样吗？”\n你能看到少女的眼中闪过一丝惊讶，可转瞬之间，却又再次回到了往日乐呵呵的样子。\n“唉，等我什么时候把你包括但不限于雇佣童工克扣工钱外加强制打工等等罪行全部挤在这个小本子里……但是在此之前，我可要好好盯着你哦。”\n好吧，无论如何，你还是将这位天体级的行政官留在了帝国内。但是……你却无意间误入了一件无法回头的事情。不过还好，至少退一步讲，能在一个天体级巨娘的庇护下……甚至还有可能和她走的更近，怎么看，都不像是一件坏事吧。
  gts_ora.1003.desc: "\"Hm? Is that so?\"\\nYou can see a trace of surprise flash through the girl's eyes, but in the next instant, she returns once more to her usual cheerful self.\\n\"Sigh. Once I manage to squeeze all your crimes, including but not limited to hiring child labor, withholding wages, and forcing people to work, into this little notebook... But before that, I will be keeping a very close eye on you.\"\\nAll right. In any case, you have kept this celestial-scale administrator in the empire. But... you have also unwittingly stumbled into something from which there is no turning back. Still, at least from another perspective, being under the protection of a celestial-scale giantess... and perhaps even having a chance to grow closer to her, does not look like a bad thing no matter how you see it."
