  # 哪怕花田没有指明，小人们都知道， maiden手指所指向的嘴巴正是接下来要去的地方。只是......刚刚在整个城市上空不断巡视着的巨大舌尖，这样的大小，不要说被吞到胃里，就是在口腔中，自己的大小能否被对方感受得到都成为了未知数。一时间，人们开始犹豫了起来。害怕这个明知道有生命危险却还是想要往前走的想法。\"那个......我？\"我颤颤巍巍地走到最中间的广场，感觉双腿都在不断打颤，呼吸也在这种紧张感而变得急促起来。而 maiden听到这不仔细听甚至都听不到的声音后，微微眯起的眼神中似乎带着一丝微笑，看来......她或许是对自己向前的做法表示满意吧。\n\n\"小家伙很勇敢呢，那么......自己爬上来吧~\"\n\n轻轻伸过来的指尖，在整个城市中央。虽然 maiden十分小心，可就是手指所带动的气流却还是让一些建筑物没能幸免于难。不过还好，在手指伸出来的时候，周围的小人早已四散逃开，和 maiden的手指保持了一定的距离，看着我一个人站在广场中，一点一点地爬上这堪称为通往天堂的阶梯。我手脚并用，爬到了指甲盖上，趴在了对方的指尖上，等待着手指一点一点地向上抬升。扑面而来的气流压在我的身上，将自己挤在空气和手指中间。我费力地抬起头，却被风吹得什么都看不清。直到自己被丢在了一个我也不知道是什么的东西上，我才迷迷糊糊地爬起来，却感觉手和脚的触感有一些不对，有一种说不出来的粘腻感，仔细将手伸到嘴里一吮......\"巧克力？\"在尝到是什么东西的我后之后觉地抬起头，看到的却是花田已经张开的嘴巴。扑面而来的热气使我不得不趴在这一块巧克力上，我承认，我现在有点后悔自己刚刚的选择了，但是更不可否认的是，我现在感觉到的，除了心跳剧烈加速外，更多的是一种......像是被她完全支配的感觉，那种明知自己怎么挣扎都没有什么作用却还是忍不住想继续挣扎的感觉。\"emmmmm，感觉被花田老师吃掉......也挺爽的不是吗？\"察觉到这种想法的我脸突然一红，索性将脸埋了起来，要是让她知道咱有这种很奇奇怪怪的想法的话......\n\n\"哈啊 -  -  -  - \"\n\n还沉浸在那被吃掉的幻想中，浑然不知巧克力正因为呼出的热气和身体的温度开始一点点地化开，而当我意识到不对后却为时已晚，整个人都被陷进了这甜蜜的监牢中。而看着花田捂着嘴偷笑的表情才发现，原来自己的想法，她都知道吗......\"好了，这个小家伙先在这里待一会哦，要是被咱发现你跑出来的话......\"虽然没有说明会发生什么，但是这种未知的后果才更加让人不敢尝试，不过......我显然不认同这一点，既然被困住了，不想方设法跑出去那还能是自己吗？而且......自己是真的不喜欢这种全身像琥珀一样被封住的感觉。那既然如此，就只能......就只能舔了。
  gts_ora.4206.desc: ""Even though HuaTian hadn't specified it, the tiny people all knew that the mouth the girl's finger was pointing at was exactly where they were headed next. It was just that... given the size of that enormous tongue that had been patrolling the skies above the entire city just moments ago, it was uncertain whether they'd even be noticeable inside its mouth, let alone be swallowed into its stomach. For a moment, everyone began to hesitate. They were afraid of this idea - knowing full well it was life-threatening, yet still wanting to move forward. \"Um... me?\" I shakily made my way to the very center of the square, feeling my legs tremble uncontrollably and my breathing grow rapid from the tension. Upon hearing this voice - so faint it would have gone unnoticed without close attention - the girl's slightly narrowed eyes seemed to hold a hint of a smile. It appeared... she might be pleased with my decision to step forward.\n\n\"You're a brave little one. Well then... climb up here yourself~\"\\ n\nHer fingertips reached out gently, right in the center of the city. Although the girl was very careful, the air current created by her fingers still caused some buildings to be destroyed. Fortunately, by the time the finger extended, the tiny persons around it had already scattered, keeping a safe distance from the girl's finger as they watched me stand alone in the square, climbing inch by inch up these steps that could be called the stairway to heaven. Using both hands and feet, I climbed onto the fingernail and lay flat on the fingertip, waiting as the finger lifted me upward bit by bit. The gust of wind rushing toward me pressed down on my body, squeezing me between the air and the finger. I struggled to lift my head, but the wind blew so hard I couldn't see a thing. It wasn't until I was tossed onto something - I didn't even know what it was - that I groggily crawled to my feet. But the sensation on my hands and feet felt off; there was an indescribable stickiness to it. I carefully brought my hand to my mouth and licked it... \" Chocolate?\" After realizing what I'd tasted, I looked up - only to see HuaTian's mouth already wide open. The wave of heat washing over me forced me to lie face-down on this block of chocolate. I admit, I'm starting to regret my decision a little now, but what's even more undeniable is that what I'm feeling right now - aside from my heart racing - is more of a... ...a feeling of being completely at her mercy - that sensation where you know struggling is pointless, yet you still can't help but keep struggling. \"Hmmmm, feeling like I'm being eaten by Ms. HuaTian... is actually kind of nice, isn't it?\" Realizing this thought, my face suddenly flushed, and I buried my face in the chocolate. If she found out I had such weird thoughts...\n\n\"Haaah -  -  -  - \"\\ n\nStill lost in that fantasy of being devoured, I was completely oblivious to the fact that the chocolate was slowly melting from my warm breath and body heat. By the time I realized something was wrong, it was too late - I was completely trapped in this sweet prison. But when I saw HuaTian covering her mouth and giggling, I realized - did she know all about my thoughts...? \"All right, this little guy will have to stay here for a while. If I catch you trying to escape...\" She didn't specify what would happen, but the uncertainty of the consequences made it even more daunting to try. Still... I clearly didn't agree with that. Since I was trapped, wouldn't I be losing my sense of self if I didn't try every possible way to escape? Besides... I really didn't like this feeling of being sealed in like a piece of amber. So, in that case, I had no choice... I had no choice but to lick it.""
