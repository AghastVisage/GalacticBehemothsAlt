  # 我梦见了一片焦土，那是被陨星轰袭后的村落。天上的陨石砸向地面，房屋尽数损毁，人们开始逃荒，可母亲......\n我找不到了。我却只能够在被大火燃成灰烬的村落中，将意识化作无用的柴薪。然而，在醒来之后，却发现身处一处洞穴中。\n暗红色的墙壁，软乎乎黏糊糊的，却令人怀疑这是不是某种巨型生物的阴穴。然而，在这里，我却认识到了改变我一生的人：\n一个看上去比较年幼的龙娘，紫灰色的长发，却在我当时的存在而言，如同母亲一般的存在。而我也因为她的抚养，成为了如今这样的存在。\n\"乖，听话啊~\"\n躺在母亲的脚踝旁，我记着那是我高烧不退的那天，龙之谷内的环境比较阴湿，确实不适合我这个人类生存，然而，母亲却将渺小的自己捏了起来，是的，她的手掌很柔软，似乎在其中自己就感觉不到什么痛苦。我搂着母亲的手指，意识也在逐渐模糊，甚至都不知自己是什么时候痊愈，也不知为什么从这次高烧之后，身体却逐渐适应了这里的环境。\n\"别着急，睡醒了，母亲还在哦~\"\n每晚，每夜，我记不清昼夜是如何变化，只记得岁月的轮转间，我都伴随着母亲的怀抱中入睡。只知道在记忆的最后一天，却突然戛然而止般，母亲为我新换了一套衣服，却是在为我启行。\n\"乖啊，没有母亲的话......要学会自己生活哦~\"\n我本应该是巨龙豢养的孩子，却在我8岁的那一刻，被迫来到了属于人类的城邦。却好累，好饿......\n火球在 maiden手中连发，宛如密集的弹幕，街边的水果摊在这一刻掀开，人群四散而逃，只有 maiden坐在还留有余温的水果摊上，怀里抱着烧焦了的水果，丝毫不在意衣角处的点点火星。而就在这一刻 -  - \n\"小家伙这是......饿了吗？\"\n就这样，在妖精姐姐的帮助下，自己来到了此处魔法学院，却也只研读了两年，就草草的结了业。原因无他：这群人都认为我是个\"怪物\"。\n\"施法......你施法呢？还有你怎么别的学科都是0分？\"\n又怎么样呢，无论如何，似乎自己都只会最基础的火球术，却有着常人难以理解的施法间隔，甚至快到了将火球连接成密集的弹雨。只是......在外人看来，我的存在都是彻头彻尾的偏科怪物，却在冒险者协会里，自己再一次受到了青睐：\n\"没事，咱们这里不讲那些，劲大就行！\"\n\"没事，当那么些花里胡哨的人中出来一个只会火球术的人的话，咱们就得看看这个人的火球术是得有多么厉害了......\"\n火力，过快的射速，宛如异世界的重机枪一般，将所过之处的魔物尽数消灭，如此强烈，暴躁，甚至可以算的上是喧哗。或许......也正是这样的原因，虽然本人并不怎么喜欢在这样的场合说话，却也是被人赋予了这样的名字：哗之。\n\"你的意思是说......最近新发现的迷宫......龙之谷？\"\n\"是啊，不过这里面有规定，因为这个迷宫太过凶险，所以没有三人小组是不可以......啊不是，蓝小姐，我们不是看不起你的意思......\"\n自离开了母亲之后，我再也没有找到那个地方。或许......我确实应该去看一下，但是......最近收养的小家伙，算了，还是不要带着她一起去送死了吧。我确实是这样想的，也确实有很长一段时间动过要让她独立的机会。毕竟只要会了一点点魔法，就可以在埃维拉城里生存下来......直到我在魔法学院的书中发现了这样的故事：\n世界的本质是沙漏的倒带，而名为\"杜蕾因（尼德霍格）\"的巨龙在沙漏的底端，将世界倒转......自此，世界终有一天会被她吞噬殆尽。
  gts_ora.1021.desc: ""I dreamed of a scorched wasteland - a village ravaged by a meteor shower. Meteors rained down from the sky, destroying every house, and people began fleeing the disaster, but my mother...\nI couldn't find her. All I could do was let my consciousness turn into useless firewood amidst the village reduced to ashes by the flames. Yet, upon waking, I found myself inside a cave.\nThe dark red walls were soft and slimy, making me wonder if this was the lair of a Giant Creature. Yet it was here that I met the one who would change my life:\na relatively young dragon maiden with long, purplish-gray hair - who, to me at that time, was like a mother. And it is because of her care that I have become who I am today.\n\"Good boy, be a good boy~\"\\ nLying beside my mother's ankles, I remember that it was the day I had a persistent high fever. The environment in Dragon Valley was damp and gloomy - truly unsuitable for a human like me to survive. Yet my mother picked me up in her hands. Yes, her palms were so soft that I felt no pain at all. I clung to Mother's fingers as my consciousness gradually faded; I didn't even know when I had recovered, nor why, after that high fever, my body had gradually adapted to the environment here.\n\"Don't worry - when you wake up, Mother will still be here~\"\\ nEvery night, every night - I can't recall how day turned into night, only that as the years passed, I always fell asleep in my mother's embrace. All I know is that on the very last day of my memory, it came to an abrupt end: my mother dressed me in a new set of clothes, preparing me for my departure. \n\"Be a good girl. Without your mother... you'll have to learn to live on your own, okay?\"\nI was supposed to be a child raised by dragons, yet at the age of eight, I was forced to come to this human city-state. I was so tired, so hungry...\\ nFireballs rained down from the girl's hands like a dense barrage. The fruit stand by the street was blown apart in an instant, and the crowd scattered in all directions. Only the girl remained, sitting on the still-warm fruit stand, holding charred fruit in her arms, completely oblivious to the sparks flickering at the hem of her clothes. And just then - \n\"Little one, are you... hungry?\"\nAnd so, with the help of the fairy sister, I ended up at this magic academy, but I only studied there for two years before graduating in a hurry. The reason was simple: everyone there thought I was a \"monster.\" \n\"Casting spells... are you even casting spells? And why do you have zeros in every other subject?\"\nSo what? No matter what, it seemed I could only cast the most basic Fireball spell, yet with a casting interval that was hard for ordinary people to comprehend - so fast, in fact, that I could string the fireballs together into a dense hail of projectiles. It's just that... while outsiders saw me as a complete \"one-trick pony,\" at the Adventurers' Guild, I was once again favored:\n\"It's fine. We don't care about that here - as long as you've got the power!\"\\ n\"It's fine. If someone who only knows Fireball stands out among all those flashy types, we'll have to see just how powerful their Fireball really is...\"\\ nThe firepower and rapid rate of fire, like a heavy machine gun from another world, wiped out every monster in its path - so intense, so ferocious, it could even be called chaotic. Perhaps... that's exactly why - even though I don't particularly like speaking up in situations like this - I've been given the nickname: \"The Roarer.\"\n\"You mean... the newly discovered dungeon... Dragon Valley?\"\\ n\"Yeah, but there's a rule: since this dungeon is so dangerous, you can't go in without a team of three... Oh, wait - Miss Lan, we don't mean to look down on you...\"\nEver since I left my mother, I've never been able to find that place again. Perhaps... I really should go take a look, but... there's the little one I recently adopted. Never mind - I'd better not drag her along to her death. That's exactly what I thought, and for quite some time, I'd been considering giving her the chance to stand on her own. After all, as long as she knew even a little magic, she could survive in the city of Evira... That is, until I discovered this story in a book at the Magic Academy:\nThe essence of the world is the rewinding of an hourglass, and at the bottom of that hourglass lies a dragon named \"Durein (Nidhogg),\" who turns the world upside down... Thus, one day, the world will be completely devoured by her.""
