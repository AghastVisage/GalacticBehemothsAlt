  # 随着捏着自己的手突然松开，整个人坠落到了阿卡菈的脚下。看着对方抬起来的鞋底，我顾不得多想，连忙快步跑去，把插在不远处的长伞拔了出来。果然，自己的作品她都看过，当然明白这种反派死于主角频繁复活的戏码。只是......这一次，她却不知道的是，如今的自己，却早已不是过去那般羸弱。伞面撑开，我双手紧紧扶着伞柄，面对着上空这遮蔽了好几个足球场大小的阴影，我不躲不避，因为我深知压根就跑不掉。现在的我，也只能祈祷着，这柄来自于我和她心中的信仰，能够抗的住这毁天灭地的一踩吧。\n\"轰 -  - \"\n\"咳咳 -  - \"巨足抬起，留下一片鞋印形状的废墟，刚刚所出现的全部建筑物都已经失去了踪影，只能看到对方鞋底抬起时，在那花纹里裹挟着的由一根根钢筋藕断丝连的残垣断壁。我倒在地上，刚刚的一脚虽然有伞的帮助，自己并没有命丧于此，但是这巨足踩踏所带来的冲击力却差点震的内脏尽数破碎。嘶......这只是她踩下来的一脚，就已经如此勉强了吗？我抬头看着她玩昧的眼神，仿佛还在嘲讽一只蝼蚁敢撼动人类的鞋底一般。不行了，看来接下来的一脚不能再硬抗了。\n\"竟然还能站起来呢......只是，咱就踩下一脚就已经这样了吗？\"\n随着那宛如山峦一般的鞋子再次下落，这一次比上次更加猛烈，所带着的阵阵冲击，仅仅离地面几十米的高度，就已经能感觉到一股巨大的压迫感，在不断震颤着自己全身的器官。\"不行，这一脚得跑......\"按理来说，这样的一脚下去，恐怕作为人类来说无论如何都没有办法逃离，而我却面不改色，强装镇定地将伞撑在胸前，打开了左手处的手环。下一秒，\"嗖\"的一声，在阿卡菈的脚下划过了一个橘色的光线，随后装在远处的一栋大楼上，装出了一个不小的坑。\"呼呼 -  - \"我拍了拍身上的衣服，重新收起了伞。看到阿卡菈脸上那一闪而过的讶异，现在，自己终于可以在她的手中应付两下了。而就在这个时候 -  - 视野却突然一黑，随后整个人却因此失去了意识。\n\"我......这是......\"\n再次看到了卷了边的笔记本，周围嘲笑的人群，那隐约闪过的潦草字迹却无一不揭露了当年的自己是有多么无能。只是......这一次，我却并没有像之前那般哭泣，而是默不作声地走过去，捡起了那早已空白的封皮。\n\"看到了吗？以前的你是，现在的你也是，你只不过还是在追逐着她们的脚步罢了，而你......\"\n\"而你，不也同样是追赶着'橘子长'的阴影吗？\"\n我闭上眼，下一刻，阴云开始散开，前方的道路也骤然显现。我抬起伞向上跳去，准备跳到阿卡菈的头顶，想就此一剑封喉，可没想到的是 -  - 还没在空中飞多久，那在天空中飞着的雨伞却被阿卡菈伸手捏住，随后将自己捏在了手里。只是......从捏着的手感可以说明，刚刚的话语确实是让她的内心产生了些许动摇了。\n\"如何呢？稍微和你玩那么一会，橘子长不会真的觉得，你这样的大小可以和咱相提并论了吧。\"
  gts_ora.1219.desc: ""As the hand clutching mine suddenly let go, I fell right at Akara's feet. Seeing the sole of her shoe raised above me, I didn't have time to think - I hurried over and pulled out the long umbrella stuck in the ground nearby. Sure enough, she'd seen all my works and, of course, understood this trope where the villain dies because the protagonist keeps coming back to life. But... what she didn't know this time was that I was no longer the frail person I used to be. As the umbrella opened, I gripped the handle tightly with both hands. Facing the shadow overhead - one large enough to cover several soccer fields - I didn't flinch or try to dodge, because I knew full well there was no way to escape. All I could do now was pray that this umbrella - born of the faith in both her and me - could withstand that earth-shattering stomp.\n\"Boom - \"\\ n\"Cough, cough - \" The giant foot lifted, leaving behind a field of ruins shaped like a shoe print. All the buildings that had been there moments ago had vanished without a trace; all I could see were the crumbling walls and debris - still tenuously connected by strands of rebar - swept up in the patterns on the sole as it rose. I lay sprawled on the ground. Although the umbrella had saved my life from that kick, the sheer force of that giant foot's stomp nearly shattered all my internal organs. Ugh... Was I already struggling this much from just a single stomp from her? I looked up at her playful gaze, as if she were still mocking an ant that dared to challenge the sole of a human's shoe. I can't take this anymore - it seems I can't brace myself for the next stomp.\n\"You actually managed to get back up... but is this all it takes after just one stomp from me?\"\\ nAs that shoe - as massive as a mountain range - came down again, this time even more fiercely than before, the waves of impact created such immense pressure that even from a height of just a few dozen meters above the ground, I could feel a tremendous sense of oppression, causing every organ in my body to tremble incessantly. \"No, I've got to run from this one...\" Logically speaking, a blow like this would leave a human with no chance of escape, yet I remained unfazed. Feigning calm, I held the umbrella in front of my chest and activated the bracelet on my left wrist. The next second, with a \"whoosh,\" an orange beam streaked past Akara's feet, striking a building in the distance and leaving a sizable crater. \"Phew - \" I brushed the dust off my clothes and folded up the umbrella. Seeing the fleeting surprise on Akara's face, I realized that now, at last, I could hold my own against her for a moment. But just then - my vision suddenly went black, and I lost consciousness.\n\"I... what's happening...?\"\\ nOnce again, I saw the notebook with its curled edges, the mocking crowd around me, and the faint, hastily scrawled words - all of which laid bare just how incompetent I had been back then. But... this time, I didn't cry like I had before. Instead, I walked over in silence and picked up the now-blank cover.\n\"See? That's who you were back then, and that's who you are now. You're just still chasing after their footsteps, and you...\"\\ n\"And aren't you, too, chasing after the shadow of 'Ora'?\"\nI closed my eyes, and in the next moment, the dark clouds began to disperse, and the path ahead suddenly came into view. I raised my umbrella and leaped upward, intending to land on Akara's head and deliver a fatal blow with a single sword strike. But to my surprise - before I'd been in the air for long - Akara reached out and grasped the umbrella, then clenched it in her hand. Still... judging by the way she held me, it was clear that my words had indeed shaken her resolve just a little.\n\"Well then? After playing with you for a little while, Ora surely doesn't really think that someone your size can be compared to me, does he?\"""
