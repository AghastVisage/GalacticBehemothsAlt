  # \"在这里停下吧。\"\n不知行走了多远，却早已不见周遭星辰，你至今未知，在这场宇宙边界的寻觅中，前路还有多久，而未来又是什么。\n\"无能\"，\"虚幻\"，\"孤立\"，\"恐慌\"，\"失我\"。这些痛苦始终陪伴着橘子长，如影随形。而她却能够承受这些......甚至接纳这些，却无人知道她要做些什么。而你却总有预感......小橘子长变得越来越沉默寡言，陷入的幻境也越来越深，而每一次伴随着痛苦的回忆随着时间倒带......你却发现，她的身影却越发变得熟悉起来......\n\"在这里停下吧。\"\n不多时，你却在橘子长的带领下，在一处星球间小憩。难以想象的是，这颗在宇宙边际的孤星，却仍有一课恒星守候着，照映出星球表面的潮生潮落。\n\"埃维拉城......是个不错的故事呢。\"\n橘子长坐在河边的一处石头上，虽然作为泰坦级生物的大小，面临着只有微生物的海洋星球下，堪称降维打击，可橘子长并不想搭理这些，而是抬起头，伸出手，尝试触摸着天空中的星星点点 -  - 却只是破碎的行星环带。\n\"这则故事......为何没有讲完？\"\n你很想问这样的问题，而话说出口时，却只听到一声轻轻的笑。\n\"是啊,,,,,,这则故事，为何没有写完？\"\n\"埃维拉联邦、七芒帝国、凡尔诺登意志......这个世界观如此的庞大，只可惜。\"\n\"这篇的作者，在写到最后一篇文章的时候......死掉了啊。\"\n你不得不思考起来，也在为了故事未能完结而惋惜，只不过......橘子长却从湖面下，将那把在埃维拉城捡到的纸牌扔向了湖面。顿时，一道星门就此展开。\n\"好了......你们，回去吧。\"\n\"回去？\"\n你难以想象橘子长在说什么，但是看着她的眼神，却显得这件事情有着难以拒绝的余地。虽然......\n\"是啊，\"橘子长闭上眼睛，似乎在享受着属于她最后的时间。\n\"我们，就像每一个橘子长手牵着手一样，将时间构成了一处闭环。所以......\"\n\"我......要试着松开一只手，然后把她拉回来啊。\"
  gts_ora.1033.desc: ""\"Let's stop here.\"\nYou don't know how far you've walked, but the stars around you have long since vanished. You still don't know, in this quest to the edge of the universe, how much further you have to go - or what the future holds. \n\"Incompetence,\" \"Illusion,\" \"Isolation,\" \"Panic,\" \"Loss of Self.\" These torments have always accompanied Ora, following her like a shadow. Yet she is able to endure them... even embrace them - though no one knows what she intends to do. And yet, you always have a premonition... Mora has grown increasingly taciturn, sinking deeper and deeper into her illusions, and with each painful memory rewinding through time... you find that her figure is becoming more and more familiar to you...\n\"Let's stop here.\"\\ nBefore long, led by Ora, you take a brief rest on a planet. It's hard to imagine that on this lonely star at the edge of the universe, a single star still watches over it, casting its light on the ebb and flow of the planet's tides.\n\"The City of Evira... that's quite a story.\"\\ n Ora sat on a rock by the river. Although, as a Titan-class creature, his size made him seem like a \"dimension-lowering strike\" on this oceanic planet inhabited only by microorganisms, he paid no mind to such things. Instead, he raised his head, reached out his hand, and tried to touch the twinkling stars in the sky - only to find nothing but a shattered planetary ring system. \n\"This story... why wasn't it finished?\"\nYou really wanted to ask that question, but when the words left your mouth, all you heard was a soft chuckle.\n\"Yes... this story - why wasn't it finished?\"\\ n\"The Evira Federation, the Seven-Pointed Empire, the Will of Vernoden... This world is so vast - it's such a pity.\"\n\"The author of this story... died while writing the very last chapter.\"\\ nYou couldn't help but ponder this, feeling regret that the story remained unfinished - but then... Ora, from beneath the lake's surface, tossed the playing card she'd found in the city of Evira onto the water. Instantly, a stargate opened.\n\"All right... you two, go back.\"\ \n\"Go back?\"\nYou couldn't fathom what Ora was talking about, but the look in her eyes made it seem like something you simply couldn't refuse. Although...\n\"Yes,\" Ora closed her eyes, seemingly savoring her final moments. \n\"We, just like every Ora Leader holding hands, have formed a closed loop of time. So...\"\n\"I... have to try letting go of one hand, and then pull her back.\"""
