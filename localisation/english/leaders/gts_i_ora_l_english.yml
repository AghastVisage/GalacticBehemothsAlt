  #  虽然大家都认为橘子长承担这样的名号是理所应当的，但是对于她本人来说……橘子长只是一句“你们随意吧”，将所有慕名而来的小人用鞋子轻轻推了出去。
  councilor_gts_ora_desc: "Although everyone believes it is only natural for Orange Chief to bear such a title, for her personally... Orange Chief merely says, \"Do whatever you like,\" and gently pushes all the little people who came because of her fame away with her shoe."
  #  “抱歉……但，我可能要离开了”
  gts_ora.1001.name: "\"Sorry... but I may have to leave.\""
  #  随着橘子长加入了帝国后，她极为出色的管理能力和亲和力很快将整个帝国治理的井井有条。虽然作为天体级的大小，她的身体有时能够做到横贯整个天体甚至星系。折让所有人在她的管理下变得不再敢肆无忌惮。但是，橘子长的生活所投入的预算甚至不如一些普通大小的巨娘，除去她可以自由改变的体型外，或许平时清心寡欲的生活方式也是一个原因。\n是的，你不敢想象在这片茫茫星海中，能够找到一个如此理想化，甚至很少对小人痛下杀手的巨娘。但是，比起那些动不动就能毁掉一整个星球的巨娘相比，即使作为天体级的橘子长，也仅仅只是在执行惩罚的时候“吃”掉一些小人。不过……虽然那些被她吃掉的小人再也没能从橘子长的身体里出来，不过作为可能从橘子长的胃里出来的唯一的一批人，你知道里面有多么可怕。\n虽然橘子长只是一介文官，并没有像其她巨娘一样拥有着十分强大的武备，但是她的身体却弥补了这一部分——我们应当庆幸在执法预算中省下了一大笔经费用于投入其她巨娘的日常开销。毕竟……在橘子长治理的星球下，任何犯罪分子恐怕都被落入橘子长的胃里了吧。\n只是……这样的情况并没有持续太久，五年后，你看着已经到期的合同，也收到了属于她的通讯，你知道，她是时候要离开了。\n“抱歉……但，我可能要离开了。”\n城府的条框未必能束缚住这只飞鸟，但她要飞向的目标，却是慢慢长夜。少女将离职信交给你后，你很清楚一点：你看不到她的笑容，也看不到她以往的轻松。你刚想问什么，手指却被少女的食指抵住，示意你不要再说，又或者……示意你说些什么。
  gts_ora.1001.desc: "After Orange Chief joined the empire, her extraordinary management ability and approachability soon brought the entire empire into excellent order. Although, at her celestial scale, her body could sometimes stretch across an entire celestial body or even a star system. This made everyone under her administration no longer dare to act recklessly. Even so, the budget spent on Orange Chief's daily life was not even as high as that of some ordinary-sized giantesses. Aside from her ability to freely change her size, perhaps her usually restrained and ascetic lifestyle was also part of the reason.\\nYes, you can hardly imagine finding such an idealized giantess in this vast sea of stars, one who so rarely kills little people without mercy. Compared with those giantesses who can destroy an entire planet at the slightest whim, even Orange Chief, at celestial scale, only \"eats\" some little people when carrying out punishment. Still... although the little people she ate never managed to come out of Orange Chief's body again, as one of the only groups who may have come out of Orange Chief's stomach, you know just how terrifying it is inside.\\nAlthough Orange Chief is merely a civil official and does not possess powerful armaments like other giantesses, her body makes up for that part. We should be grateful that a large sum was saved from the law enforcement budget and invested into the daily expenses of other giantesses instead. After all... on planets governed by Orange Chief, any criminal is probably already in Orange Chief's stomach.\\nBut... this situation did not last very long. Five years later, as you look at the contract that has already expired, you also receive a communication from her. You know it is time for her to leave.\\n\"Sorry... but I may have to leave.\"\\nThe framework of the city government may not be able to bind this bird, but the destination she is flying toward is the long, slow night. After the girl hands you her resignation letter, one thing is very clear to you: you cannot see her smile, nor her usual ease. Just as you are about to ask something, the girl's index finger presses against yours, signaling for you not to say more, or perhaps... signaling for you to say something."
  #  “离开之前……再抱一次这里吧。”
  gts_ora.1001.a: "\"Before you leave... embrace this place one more time.\""
  #  §H别担心，离别的目的是为了更好的重逢。希望那个时候……你会见到更加‘成熟’的我吧~”§!
  gts_ora.1001.a.custom: "§HDo not worry. The purpose of parting is a better reunion. I hope that, when that time comes... you will meet a more 'mature' me~\"§!"
  #  ……我不接受你的辞职申请。”
