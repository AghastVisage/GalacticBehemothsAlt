  # 平等共存理念
  gts_trait_ora2: "'Flat' Equality Development Concept"
  # $gts_trait_ora2_picture$各物种，各个罩杯的大小理所应当遵循着\"求同存异，平等发展\"的理念。这也是橘子长想看到的。因此，可不要在她的面前挑起物种对立了......哪怕想象一下那个剁手哥在橘子长的胃里的景象。
  gts_trait_ora2_desc: "$gts_trait_ora2_picture$Willingness to establish a prosperous ecosystem with tiny people has always been Ora's desire. Though she occasionally eats a few - or perhaps an entire planet - she would never let you see that happening."
  # \n\n\n\n£gts_trait_ora2_picture£ \n\n\n\n\n
