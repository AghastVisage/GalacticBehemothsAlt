  #  （誓词说完的那一刻，牢牢的抱紧了希瞳，希瞳的樱唇紧紧的堵住了我的嘴唇）\n（漫长的，不知道过了多久的长吻后）\n（没有人需要仰头擦着泪水）\n（没有人需要用谎言遮盖自己的胆怯）\n（碧蓝的天空中看不到一丝阴霾）\n（完美的希冀，近在眼前）
