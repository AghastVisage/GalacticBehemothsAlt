  #  三月希瞳的临时雇佣协议，已经抵达预定终止日期。\n按照最初登记的合同内容，她在我方数据库中的临时人员权限、科研终端访问许可，以及相关项目协助权限，都将在本日完成解除。最后一份科研报告已经被整齐地归档，甚至连后续需要注意的异常数据，她也提前用醒目的标记整理在了附录里。\n通讯频道短暂地安静了几秒。\n画面中的三月希瞳没有立刻离开。她只是抱着手臂，像是早就料到这一刻会到来，却又对我方的沉默有些不满。\n“……到时间了呢。”\n她轻轻眨了眨眼，语气仍旧平静，却比平时柔和了一点。\n“别露出那种表情啦。合同就是合同，我可是很守信用的。该做的事情我都做完了，该留下的资料也都留给你们了。接下来，就算没有我，你们也应该能好好处理吧？”\n她抬手敲了敲身旁的小型终端，原本维持着浅层通讯的信号开始逐步收束。\n“不过嘛……如果你们真的还有什么非我不可的事情，就去看看我留下的那个小礼物吧。”\n通讯即将断开前，她偏过头，像是想补上一句什么。\n“还有，不许说我走得太突然。十五年前，我就已经告诉过你们了。”\n随后，信号归于沉寂。\n三月希瞳已结束临时雇佣关系，并离开我方服务序列。
  gts_hitomi.30008.desc: "Mitsuki Hitomi's temporary employment agreement has reached its scheduled termination date.\\nIn accordance with the originally registered contract terms, her temporary personnel privileges in our database, research terminal access authorization, and related project assistance permissions will all be revoked today. The final research report has been neatly archived, and she even marked the anomalous data that requires later attention in the appendix ahead of time.\\nThe communication channel fell quiet for a few seconds.\\nMitsuki Hitomi did not leave the screen immediately. She simply folded her arms, as if she had long expected this moment to arrive, yet was somewhat displeased by our silence.\\n\"...So it is time.\"\\nShe blinked softly. Her tone remained calm, but was a little gentler than usual.\\n\"Don't make that face. A contract is a contract, and I do keep my promises. I finished everything I was supposed to do, and left you all the materials I was supposed to leave. From here on, even without me, you should be able to handle things properly, right?\"\\nShe raised a hand and tapped the small terminal beside her. The signal that had been maintaining a shallow communication link began to gradually contract.\\n\"Still... if there really is anything you absolutely need me for, go take a look at that little gift I left behind.\"\\nJust before the transmission disconnected, she tilted her head, as though she wanted to add one more thing.\\n\"And don't say I left too suddenly. I already told you, fifteen years ago.\"\\nThen the signal sank into silence.\\nMitsuki Hitomi has ended her temporary employment relationship and left our service roster."
  #  我们会记住这段合作。
  gts_hitomi.30008.a: "We will remember this cooperation."
  #  （三月希瞳离开我方。\n可通过“三月希瞳的 Q 版手办”继续触发后续特殊事件。）
  gts_hitomi.30008.a_custom: "(Mitsuki Hitomi leaves us.\\nFurther special events can be triggered through \"Mitsuki Hitomi's Chibi Figure\".)"
