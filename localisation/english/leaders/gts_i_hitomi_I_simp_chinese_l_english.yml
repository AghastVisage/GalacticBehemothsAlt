  #  主人，我在對您宣誓。我以妄想之名起誓，我將堅持凌虐弱者；我將化自身為暴力；我將斬殺一切正確；我將把熱愛生活的人送入墳墓；我將把掙扎求存的人踢下深淵；我將如主人祈願的那樣傷害她；我將殺死所有背叛與即將背叛她的人；我發誓會永遠愛她，毫無保留，至死不渝。
  gts_hitomi_yuyue_catch_phrase: "Master, I am taking an oath to you. In the name of delusion, I swear to persist in tormenting the weak; I shall transform myself into violence; I shall slay all righteousness; I shall deliver those who love life to their graves; I shall kick those struggling for survival into the abyss; I shall harm her as master prays for; I shall kill all who have betrayed or will betray her; I swear to love her forever, without reserve, until death do us part."
