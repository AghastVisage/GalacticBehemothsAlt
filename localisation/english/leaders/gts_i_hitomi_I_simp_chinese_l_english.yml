  #  “嗯？明明是这么无趣的城市，居然还有这么细长的东西存在吗？”\n从刚刚的幻想之中脱身，漫步在城市之中的她忽然之间发现了什么有趣的东西。那是一列满载着小人的电车，正穿行在自己脚下的城市之中。\n“嗯哼？这样就以为自己能逃脱了吗？”\n巨大的希瞳挑衅的说着。在列车内乘客们不断感受着传来的巨大震动和轰鸣越来越近之时，突然，随着一声惊呼，列车后方的大楼，猛地被希瞳的脚趾所戳破。来时的铁道变成了希瞳那脏污的白丝脚掌，小人们勉强的挤在窗边望向天空，却只能看到希瞳那逐渐落下的，灰暗无比的脏脚底。\n“轰隆！”\n伴随着少女的脚尖挑逗性的砸到城市之中，本在大楼间疾驰的电车，如同一条蚯蚓般被希瞳轻松地踩住。银色的车头，在少女的脚下也如同那些不幸粘在她足底的汽车一般，成为了少女眼中的又一个垃圾。不过，我们的希瞳小姐，却想出了别样的羞辱方式，她慢慢的蹲下来，仔细打量着那互相撞在一起的，脱出轨道的列车。\n“如果......是这么小的列车的话......或许可以？”\n想到接下来将会发生什么的希瞳，忽然脸颊泛红了起来。虽然说出来颇为不堪，但一想到小人们接下来将要体会的事情，她就不由得窃喜了起来。\n“是......非常符合你们命运的事情呢......嘿嘿”\n小人的列车被从她的脚底捏起，双目扫视着那些勉强挂在车厢之中，紧紧的抱着立柱和扶手的小家伙们。\n“希瞳......接下来可是要带大家去一个地方呢？可不要被吓的屁滚尿流哦？”\n巨大的女仆猫娘顺势趴在城市当中，半趴着的上半身，将小人的列车夹在半空之中晃悠。\n“各位，可要像女仆一样，尽责地清扫我的身体哦~呵呵~”\n伴随着裙摆的掀起，少女的内裤一览无遗。已经湿了一片的白色胖次，被她的另一只手轻轻褪去。将天国和地狱，一同展现在了这些不幸的上班族面前。毫无毛发遮掩的胯下，肥厚的臀部之中，展现在小人面前的正是少女的性器和便器，正散发着甜腥和臭味混合着的神奇气味。\n“你觉得，你们配得上怎样的死法呢？”\n“是就这样进入我的阴道之中，还是变成我排泄物的一部分呢？”\n这样挑逗着的少女，将满是小人的电车在自己的两个洞口之上轻轻的晃动着。感受着他们的无能为力，以及那若有若无的，支撑不住的小人坠亡在自己圆润臀部上的感觉。\n其实已经想好了小人们耻辱结局的她，还是将列车缓缓的伸向了自己的便所，那个如同菊花一般微微张闭着的肛门。\n“不行，得忍住......”\n冰冷的列车轻轻搭上温热的肛门，便让少女不由得冷的一抖。扭动着的身体，下意识的又将身旁那些街区卷入其中。少女恼怒地强扭过身来，将自己的一瓣肥臀慢慢的掰开。\n“不行，说让你们怎么死你们就得怎么死，哪能便宜了你们......”\n收到刺激的菊穴再度张开，留出了那只有千分之一大小的玩具可以进入的通道。伴随着希瞳体内伸出那散发着的臭味沁入车厢，纵使已经是在生命的最后关头，不少人也顾不得体面，尝试逃出这死亡的地狱。\n“不行啊你们，只是闻到了一丝气味就完全忍受不住了吗？这样的废物小人......”\n长长的列车被如同细线一般，吞入暗无天日的恶臭地狱之中。再伴随着那巨大少女的本能，被下意识的夹断挤压，每次都将吞入的上百人，化作自己日后排泄物的一部分，吞入自己的直肠之中。\n“可惜了，早知道趁自己还没那么大就好好享用享用你们的......”\n这样想着的希瞳，悠闲的将自己手上残留的最后几节列车，一同让肛门夹碎。\n“只可惜，你们小人所制造出来的玩具，还是有点不够我玩呢？”\n抱怨着的希瞳再度站起，将身上的尘土全数扫净。\n“千倍的玩弄快腻了，也是时候来点刺激的呢？小家伙们，做好准备了吗？”
  gts_hitomi.118.a.desc: "'Hmm? In such a boring city, something so long and slender actually exists?'\\nEmerging from her previous fantasy and strolling through the city, she suddenly spotted something interesting. It was a train full of little people, travelling through the city beneath her feet.\\n'Hmm? You think you can escape like this?'\\nThe massive Hitomi spoke provocatively. As the passengers in the train felt the massive tremors and roars growing closer and closer, suddenly, with a cry of alarm, the building behind the train was pierced by Hitomi's toes. The railway they came from turned into Hitomi's dirty white silk-clad feet. The little people barely managed to crowd by the windows and look at the sky, only to see Hitomi's dark and filthy sole gradually descending.\\n'BOOM!'\\nAs the girl's toes playfully slammed into the city, the train racing between buildings was easily stepped on by Hitomi like an earthworm. The silver locomotive became just another piece of trash in the girl's eyes, just like the cars stuck to her sole. However, Miss Hitomi came up with a different way to humiliate them. She slowly crouched down, scrutinizing the derailed train cars that had collided with each other.\\n'If... it's a train this small... perhaps I could?'\\nThinking of what was about to happen, Hitomi's cheeks suddenly flushed. Although it was quite indecent to say, she couldn't help but feel a secret glee at the thought of what the little people were about to experience.\\n'It's... something very fitting for your fate... hehe.'\\nThe train was pinched up from beneath her foot. Her eyes scanned the little ones barely hanging on inside the cars, clutching the poles and handles tightly.\\n'Hitomi... is going to take everyone to a place next. Don't be so scared you wet yourselves, okay?'\\nThe giant maid cat-girl lay down in the city, her torso half-propped up as she dangled the train in mid-air.\\n'Everyone, you must fulfill your duties as maids and clean my body properly~ hehe.'\\nAs she lifted her skirt, her panties were completely exposed. The white panties, already wet in one area, were gently pulled down by her other hand. She displayed both heaven and hell to these unfortunate salarymen. Between her hairless thighs and plump buttocks, what was displayed to the little people were the girl's sexual and excretory organs, emanating a mysterious scent mixed with sweet musk and foul odor.\\n'What kind of death do you think you deserve?'\\n'Shall you enter my vagina just like this, or become a part of my excrement?'\\nTeasingly, the girl swayed the train full of little people over her two openings. She felt their helplessness and the occasional sensation of failing little people falling to their deaths on her rounded buttocks.\\nActually, she had already decided on a shameful end for the little people, as she slowly moved the train toward her anus, which was slightly opening and closing like a chrysanthemum.\\n'No, I must hold back...'\\nThe cold train lightly touched the warm anus, making the girl shudder involuntarily. Her twisting body instinctively dragged in more city blocks. Annoyed, the girl forcefully turned her body and slowly pried one of her plump buttocks apart.\\n'No, you must die exactly how I say you'll die. I can't let you off that easily...'\\nThe stimulated anal opening widened again, leaving a passage where a toy only one-thousandth its size could enter. As the foul smell emanating from Hitomi's body seeped into the train cars, many people forgot their dignity even in their final moments, trying to escape this hell of death.\\n'You really are useless. You can't even stand a hint of the smell? Such pathetic little people...'\\nThe long train was swallowed into the stinking, sunless hell like a thin thread. Following the giant girl's instincts, it was crushed and squeezed, each time turning hundreds of people into future excrement and swallowing them into her rectum.\\n'A pity. If I had known, I would have enjoyed you more before I got this big...'\\nWith such thoughts, Hitomi leisurely let the last few sections of the train in her hand be crushed by her anus.\\n'It's a shame that the toys you little people make aren't quite enough for me to play with.'\\nHitomi stood up again, dusting herself off completely.\\n'I'm getting tired of this thousand-fold play. It's time for something more exciting. Little guys, are you ready?'"



