  #  此刻在已经成为废墟的体育场旁，希瞳那巨大的鞋子，还正屹立在已经不剩下几个幸存者的街区之上。小人们终于得以挣扎着，在巨大的鞋垫之上再度挣扎着站起来。被巨量足臭冲晕过去的人们，还在思索着自己究竟会出现在如此宽广，却又如此刺鼻的一片空间之内。作为希瞳被囚禁了千年都未曾脱下的高跟洛丽塔鞋子，棕色哑光的平淡外表之下，却是一片巨大的，留下了希瞳淡灰色脚汗印记的巨大白色盆地。\n“这是......什么地方啊！”\n被困在足臭之中小人们抬头仰视作为天空的鞋内，却发现自己熟悉的街区早已成为了自己身旁散落着的废墟。忽然之间，脑内便想起了昏迷前自己所听到的，来自女巨人的最后一句话。\n“你们只不过是要被打扫的害虫而已，就这样苟活在我的足垫上吧”\n“——如果你们还能够活下去的话”\n忽然之间，他们记起了自己是如何出现在这里的。\n巨大的希瞳，那时正刚刚将满是幸存者的体育场，化作自己白丝之上的一抹脏污。\n“至于你们，剩下的小家伙，还得有人来好好服侍我这个女仆吧？”\n“千年来一直都是我在帮助你们，你们可要想办法回报我啊。”\n这么说着的希瞳，蹲到了自己的洛丽塔鞋旁边。双脚下意识的掂在城市之中，一边说着，一边找寻着自己的目标。\n“各位小虫子的建筑，都还没我的鞋子高呢？”\n少女一边坏笑着，一边将自己的手伸向了那些在自己身旁的，误以为少女已经忽视了自己从而停下脚步的幸存者。幸存着们还想要奔逃，却被从脚下传来的巨大震荡所击倒，目睹着少女的手掌插入地底，将自己连同街区一同挖起。看着面前打量着这片小人街区的希瞳，小人们慌张的趴在已经布满裂纹的街道上看着面前的巨大猫娘。\n“不如这样，既然你们住的这么差，不如就宜居到我暖和的鞋垫上来吧？”\n希瞳微微的笑着，便将小人的街区，如同一捧沙子那般倒入了自己的鞋中。\n建筑在空中逐步碎散，如同沙尘暴一半击打着留下了她巨大足印的鞋垫。但幸存者们却被这温热柔软的鞋垫所接住，如同蹦床一般在这本该洁白的大地之上蹦跳几下。\n然后，便被少女那温热的足臭包裹，失去了自己的意识。
