  #  才不是玩手游玩的呢
  gts_hitomi.403.name: "It's Not Because of Mobile-Gaming"
  #  資源結算完成後，一筆數額為 648 的經費被迅速劃出。監控顯示，希瞳在確認到賬後短暫地停留在個人終端前，屏幕亮度被調低，操作顯得異常熟練。幾分鐘後，賬戶餘額發生變化，而當被問及用途時，她只是平靜地關閉界面，淡淡回應“只是合理使用經費，概率提升了”。之後幾天希瞳經常念叨著什麼怎麼又歪了什麼聽不懂的話。
  gts_hitomi.403.desc: "After the resource tally was complete, an expenditure of 648 was swifty allocated. Surveillance showed Hitomi briefly lingering at her personal terminal after the credit arrival; the screen brightness was lowered, and her movements appeared exceptionally practiced. Minutes later, the account balance changed. When questioned about the purpose, she merely closed the interface calmly and dismissively replied, 'Just a reasonable use of funds; the probability was boosted.' Over the following days, Hitomi was often heard muttering incomprehensible things about 'losing the 50/50' again."
  #  阿這
  gts_hitomi.403.a: "Oh, that..."
  #  縮小城市就是最好的腳墊！
  gts_hitomi.404.name: "A Shrunk City is the Best Doormat!"
  #  作為休息時的消遣，一組經過等比縮小的微型城市並配備了相當數量的小人被送入了希瞳的辦公室。希瞳不顧運送城市的工作人員還沒有離開便一腳踏了進去，那些還沒有她腳踝高的高樓在她的運動鞋的重踏下被踩成了粉末和扭曲的金屬殘骸。\n希瞳微微抬起腳，鞋底脫離地面時帶起一陣碎屑雨。那些曾經是摩天大樓的殘骸像灰塵一樣從鞋紋裡簌簌掉落，落在下方尚未被波及的街區，砸出了一個個巨大的坑洞。\n她低頭看了一眼腳下那片狼藉，嘴角勾起一點無聊的笑意。鞋底中央黏著一截扭曲的鋼梁，末端還掛著幾輛被壓成薄片的汽車，像廉價飾品一樣晃盪。她隨意地用腳尖碾了碾，金屬發出一聲短促的哀鳴，便徹底斷了。\n“才剛開始就碎成這樣啊。”希瞳的聲音在辦公室裡回盪，對微型城市而言卻如同雷霆。她彎下腰，指尖輕輕撥開腳邊殘存的幾棟低矮建築，像撥開積木一樣輕鬆。指腹掠過之處，屋頂掀飛，牆體傾倒，裡面密密麻麻的小人尖叫著四散奔逃，無處可躲。\n她站直身體，運動鞋再次抬起，這一次懸在城市中央那片最繁華的區域上方。陽光被她的身影完全遮蔽，投下一片巨大的陰影。小人們抬頭，看見那隻鞋底緩緩壓下，鞋紋裡的碎屑還在往下掉，砸死了不少小人。\n希瞳沒有立刻踩下去。她喜歡這種懸著的感覺——那種無數目光同時聚焦在自己腳底、帶著絕望和祈求的感覺。她輕輕晃了晃腳踝，讓陰影微微搖晃，底下立刻爆發出一陣更劇烈的騷亂。有人跪地，有人抱頭，有人還在徒勞地開車逃竄。\n“跑啊，繼續跑。”她低聲說，聲音裡帶著一點倦怠的興味。\n然後，她慢慢地、帶著近乎慵懶的從容，把腳放了下去。這一次，沒有劇烈的衝擊，只有一種沉悶的碾壓感。鞋底觸碰到建築群的瞬間，整片街區像被無形的手掌緩緩按進了地面。高樓一層層塌陷，街道龜裂，車輛和人群一起被壓進鞋紋深處。希瞳甚至能感覺到腳底傳來細微的、像氣泡破裂一樣的觸感——那是無數脆弱生命在同一時刻被抹平的反饋。\n她輕輕扭了扭腳踝，像碾滅煙頭一樣，把最後一點抵抗磨成虛無。抬起腳時，原本繁華的市中心已經變成了一片平整的凹痕，邊緣散落著零星的殘磚碎瓦。希瞳看著自己的傑作，輕輕呼出一口气。\n“還有一半呢。”她自言自語，目光轉向辦公室另一側尚未被觸及的那片微型城市，“慢慢玩吧，反正午休還有四十分鐘。”
  gts_hitomi.404.desc: "As a pastime during her break, a set of scale-model miniature cities, populated with a substantial number of tinies, was delivered to Hitomi's office. Disregarding the delivery staff who hadn't even left yet, Hitomi stepped right in. High-rises that weren't even as tall as her ankles were crushed into powder and twisted metal wreckage under the heavy stomp of her sneakers. \\nHitomi lifted her foot slightly, a rain of debris falling from her sole as it cleared the ground. Remnants of what were once skyscrapers tumbled like dust from the tread, landing on untouched blocks below and smashing massive craters into them. \\nShe glanced down at the mess beneath her, a hint of bored amusement curling her lip. A twisted steel beam was stuck to the center of her sole, with several cars flattened into foil dangling from its end like cheap trinkets. She casually ground her toe over them; the metal gave a short, mournful cry before snapping completely. \\n\"Breaking like this when we've just started?\" Hitomi's voice echoed through the office, sounding like thunder to the miniature city. She leaned down, her fingertip lightly brushing aside the few remaining low buildings by her foot as easily as moving toy blocks. Wherever her finger passed, roofs were flipped, walls toppled, and the densely packed tinies inside fled in screaming chaos, with nowhere to hide. \\nShe straightened up and lifted her sneaker again, this time hovering it over the most prosperous area in the city center. Sunlight was completely blocked by her figure, casting a massive shadow. The tinies looked up to see the sole descending slowly, with debris from the treads still falling and crushing quite a few of them. \\nHitomi didn't stomp immediately. She enjoyed this hovering sensation—the feeling of countless eyes focused simultaneously on her sole, filled with despair and supplication. She wiggled her ankle slightly, letting the shadow sway, which immediately triggered a more violent riot below. People knelt, held their heads, or vainly tried to drive away. \\n\"Run, keep running,\" she said softly, her voice carrying a trace of weary interest. \\nThen, slowly and with an almost lazy composure, she brought her foot down. This time, there was no violent impact, only a heavy, dull crushing sensation. The moment the sole touched the buildings, the entire block was slowly pressed into the ground like it was being flattened by an invisible palm. High-rises collapsed floor by floor, streets fissured, and vehicles and crowds were pressed together into the depths of the tread. Hitomi could even feel the subtle sensations against her sole—like the popping of tiny bubbles—the feedback of countless fragile lives being leveled at the same instant. \\nShe twisted her ankle slightly, like grinding out a cigarette, crushing the last bits of resistance into nothingness. When she lifted her foot, the once-prosperous city center had become a flat indentation, its edges scattered with stray bricks and shards. Hitomi looked at her masterpiece and let out a soft breath. \\n\"Still half left.\" She muttered to herself, turning her gaze to the untouched miniature city on the other side of the office. \"I'll take my time. After all, there are still forty minutes of lunch break left.\""
  #  然後呢
  gts_hitomi.404.a: "And then?"
  #  縮小城市就是最好的腳墊！
  gts_hitomi.4042.name: "A Shrunk City is the Best Doormat!"
  #  希瞳懶洋洋地靠回椅背，翹起二郎腿，目光落在腳下那片已經被徹底夷平的廢墟上。鞋底的紋路裡嵌滿了細碎的建築物殘渣和被壓成薄片的車輛，偶爾還有幾點暗紅色的痕迹——那是來不及逃走的小人留下的。她輕輕晃了晃腳，碎屑簌簌落下，像一場灰色的雪。\n“穿鞋玩有點不過癮。”她喃喃自語，嘴角勾起一絲壞笑。\n她彎下腰，一手抓住右腳的鞋跟，輕鬆地把運動鞋脫了下來。鞋子被隨手扔到一旁，重重落地時震得整個辦公室的地板都微微一顫。脫鞋的瞬間，一股混合著皮革、汗水和淡淡腳香的热气從鞋口湧出，迅速籠罩了下方殘存的城市區域。小人們本來就已經被恐懼壓得喘不過氣，現在又被這股濃烈的氣味包圍，許多人直接咳嗽著倒下，像是被無形的毒霧吞没。希瞳把脫下的鞋子倒扣在城市邊緣，像蓋下一座巨大的黑洞穹頂。鞋口正對著尚未被觸及的那片城區，裡面的熱氣不斷湧出，帶著潮濕的溫度，把街道上的小人熏得頭暈目眩，有人甚至直接昏厥過去。\n接著，她慢條斯理地卷起褲腳，伸手去脫襪子。白色的棉襪已經被一上午的行走悶得微微發潮，她捏著襪口，緩緩往下拉。襪子脫離腳跟時發出輕微的“啵”一聲，露出了她光潔的腳底——皮膚白皙，足弓優雅地彎曲，腳趾修長而靈活，趾縫間還殘留著一點點濕潤的汗迹。她把脫下的襪子捏在指尖，輕輕抖了抖，然後像扔紙團一樣，把它扔向了城市另一側。襪子在空中展開，像一張巨大的白色網鋪天蓋地落下，精準地罩住了幾條主幹道。布料重重砸下，直接把成片的小人和車輛壓進地面，掙扎的人只來得及發出幾聲悶哼，就被柔軟卻沉重的棉織物徹底悶死在下面。襪子裡殘留的溫度和氣味迅速擴散開來，像一層無形的毯子覆蓋了整片街區。現在，兩隻腳都赤裸著。希瞳滿意地動了動腳趾，感受空氣拂過皮膚的涼意。她把右腳緩緩抬起，懸在剩下那片完好的微型城市上方。腳底的陰影投下，比鞋底時更加清晰、更加致命——小人們能清楚看見她足弓的曲線、腳趾的紋路，甚至趾縫間細微的汗珠在陽光下閃著光。\n“這樣應該更有感覺吧。”她輕聲說，聲音裡帶著一絲慵懶的期待。腳底慢慢下降，沒有鞋子的阻隔，這一次的接觸更加直接，更加殘酷。腳掌觸碰到高層建築的瞬間，整片城區像被一張溫熱的肉墊輕輕覆蓋。建築物在她的腳底下層層塌陷，鋼筋混凝土在皮膚的壓力下像餅乾一樣碎裂，發出細微的“咔嚓”聲。無數小人被直接壓進她腳底的紋路裡，掙扎的動作像微弱的瘙癢，讓希瞳舒服地眯起了眼睛。她輕輕碾動腳掌，像在柔軟的地毯上蹭癢癢一樣。腳趾隨意張開又合攏，每一次動作都夾碎數十棟建築，趾縫間掉落下細小的碎屑和被碾平的殘渣。她甚至能感覺到腳底下那些微弱的、像氣泡一樣破裂的觸感——那是生命在她的皮膚下成片成片地消失。\n抬起腳時，原本繁華的城區已經徹底變成了一個巨大的腳印形狀凹陷，邊緣還沾著她腳底的淡淡汗漬。希瞳看著自己的腳底，那上面嵌滿了細碎的建築物殘片和被壓扁的小人，像一層灰色的污垢。她笑了笑，把腳伸向最後殘存的那一小片城區，腳趾輕輕點下，像在玩弄最後幾顆棋子。\n“午休還有半小時呢……慢慢來。”
  gts_hitomi.4042.desc: "Hitomi leaned back lazily in her chair, crossing her legs, her gaze falling on the completely leveled ruins below. The treads of her soles were packed with debris from buildings and vehicles flattened into foil, with occasional dark red stains—the traces left by tinies who failed to flee. She wiggled her foot slightly, debris falling like a grey snow. \\n\"Playing with shoes on isn't quite satisfying enough,\" she murmured to herself, a mischievous smile curling her lips. \\nShe leaned down, grabbed the heel of her right sneaker, and easily slipped it off. The shoe was tossed carelessly aside, the heavy landing making the entire office floor tremble. The moment the shoe came off, a puff of warm air—a mixture of leather, sweat, and a faint girl's scent—surged from the opening, quickly enveloping the remaining city area below. Already breathless from terror, the tinies were now surrounded by this intense odor; many collapsed coughing, as if swallowed by an invisible toxic mist. Hitomi placed the removed shoe upside down at the edge of the city, like a massive black-hole dome. The opening faced the untouched urban area, constant heat billowing out with a damp warmth, making the tinies on the streets dizzy—some even fainted outright. \\nThen, she deliberately rolled up her pant leg and reached to remove her sock. The white cotton sock was slightly damp from a morning of walking; she pinched the top and slowly pulled it down. A soft 'pop' sounded as the sock cleared her heel, revealing her smooth sole—ivory skin, an elegantly curved arch, and long, flexible toes with faint traces of moisture between them. She held the removed sock at her fingertips, gave it a little shake, then tossed it like a crumpled bit of paper toward the other side of the city. The sock unfolded in mid-air, falling like a massive white net to accurately cover several main arteries. The fabric slammed down heavily, pressing entire swathes of tinies and vehicles into the ground; those struggling only had time for a few muffled groans before being completely smothered under the soft yet heavy cotton. The residual warmth and scent from the sock diffused rapidly, covering the whole block like an invisible blanket. Now, both feet were bare. Hitomi flexed her toes with satisfaction, feeling the cool air against her skin. She slowly raised her right foot, hovering it over the remaining pristine miniature city. The shadow from her sole was clearer and more lethal than before—the tinies could clearly see the curve of her arch, the prints of her toes, even the minute beads of sweat between them glinting in the light. \\n\"This should feel much better,\" she said softly, her voice carrying a trace of lazy anticipation. Her sole descended slowly; without the barrier of a shoe, this contact was more direct and more cruel. The moment her palm-sized foot touched the high-rises, the entire urban area was gently covered by a warm pad of flesh. Buildings collapsed layer by layer beneath her foot, reinforced concrete splintering like crackers under the pressure of her skin with subtle 'cracking' sounds. Countless tinies were pressed directly into the lines of her sole, their struggling movements a faint itch that made Hitomi squint comfortably. She lightly ground her sole, like scratching an itch on a soft carpet. Her toes spread and curled at will, each movement shattering dozens of buildings, with fine debris and flattened remains falling from between them. She could even feel those faint, bubble-like pops beneath her foot—the feeling of life vanishing in swathes under her skin. \\nWhen she lifted her foot, the once-flourishing urban area had been completely transformed into a massive footprint-shaped depression, its edges stained with faint sweat from her sole. Hitomi looked at her sole, which was encrusted with fine building fragments and flattened tinies like a layer of grey grime. She smiled, reaching her foot toward the last remaining patch of the city, her toe tap-tapping down like a player toy with the final few chess pieces. \\n\"Still half
    an hour of lunch break... let's take it slow.\""
  #  希瞳該洗腳了
  gts_hitomi.4042.a: "Hitomi needs to wash her feet."
  #  縮小城市就是最好的腳墊！
  gts_hitomi.4043.name: "A Shrunk City is the Best Doormat!"
  #  希瞳的腳趾在最後一片殘存城區上方輕輕逗留，像貓玩弄垂死的老鼠。她大腳趾隨意一點，一棟尚未倒塌的購物中心屋頂便被壓塌，裡面驚慌逃竄的小人像螞蟻一樣四散。她的腳底還殘留著之前碾壓的碎屑，灰塵和細小的金屬片黏在汗濕的皮膚上，偶爾掉落幾粒，砸在下方街道上，激起更多尖叫。\n忽然，她的目光微微一頓，落在了城市邊緣那幾個相對“高大”的身影上——那是最初運送微型城市進來的工作人員。他們比城市裡的普通小人略大一些，大概有她腳趾長度的兩三倍高，本該在放置好城市後立刻撤離，卻因為希瞳的突然行動而被困在原地。現在，他們驚魂未定地擠在殘存的運輸平臺旁，拼命揮手試圖吸引她的注意，或者……求饒。\n“哦？還有你們啊。”希瞳的聲音帶著一絲玩味的驚訝。她早就注意到他們了，只是之前懶得理會。那些工作人員穿著統一的灰色制服，在她眼中不過是大一點的蟲子，比城市裡的小人醒目些，卻依舊渺小得可笑。他們一開始就站在城市旁邊，監督放置過程，結果她一腳踩下來時，有幾個直接被鞋底的邊緣波及，壓成了腳印裡的暗紅污漬。剩下的這些，顯然是運氣好點，躲在了尚未被觸及的角落。\n一個工作人員——看起來像是領隊的，戴著小小頭盔——正拼命對著她大喊著什麼，聲音細如蚊鳴，希瞳根本聽不清。她眯起眼睛，腳趾微微張開，像鉗子一樣緩緩向下探去。\n“你們……不是應該早點跑嗎？”她輕笑一聲，聲音如雷霆般轟鳴在他們耳邊。那領隊的小人嚇得腿一軟，直接跪倒在地，其他幾個也抱成一團，瑟瑟發抖。希瞳的大腳趾和二腳趾輕輕夾住了領隊的身影。他在趾縫間瘋狂掙扎，雙手推著她溫熱的皮膚，卻像在推一堵肉牆。趾縫裡殘留的汗漬和之前碾碎的碎屑立刻沾滿了他的制服，那股濃烈的腳香混合著塵土味，讓他幾乎窒息。希瞳感覺到那微弱的撓痒感，舒服地哼了一聲，腳趾稍稍用力一合——“咔”的一聲輕響，那小人便被擠壓得變形，制服爆裂，鮮血從趾縫間滲出，像一點紅色的潤滑劑。\n她把腳趾抬起，抖了抖，殘渣和那灘模糊的肉泥掉落在他的同伴們頭上。剩下的工作人員徹底崩潰了，有人尖叫著往運輸平臺下鑽，有人徒勞地往外跑，卻被她另一隻腳的陰影瞬間籠罩。\n“運東西的工具人，也敢留下來看戲？”希瞳懶洋洋地說，腳掌緩緩壓下，這次直接對準了他們聚集的地方。腳底觸碰到的瞬間，那些比普通小人略大的身體發出了更清晰的“噗嗤”聲——骨骼碎裂，血肉被壓進她腳底的紋路裡，比城市小人更有“嚼勁”。她輕輕碾動腳跟，像在踩死幾隻頑強的蟲子，感受著他們最後的掙扎漸漸歸於平靜。抬起腳時，運輸平臺已經徹底扁平，工作人員的殘骸混在金屬碎片中，黏在她腳底形成幾點稍大的污漬。希瞳低頭看了看自己的腳掌，伸出腳掌隨意抹了抹，把那些殘渣蹭掉，甩到辦公室的地板上。\n“清理乾淨了。”她滿意地嘆了口氣，把雙腳並攏，輕輕在殘存的最後一點城區上蹭了蹭，像在擦拭腳底的灰塵。那片城區瞬間被抹平，只剩下一片模糊的双腳印痕迹。午休時間結束了。希瞳靠回椅子，赤裸的雙腳隨意搭在桌沿上，腳趾懶散地動了動，俯視著腳下那片徹底化為廢墟的“玩具”。\n“下次……要不要讓他們多準備點工作人員呢？感覺踩起來更帶勁。”她自言自語，嘴角又勾起那熟悉的壞笑。
  gts_hitomi.4043.desc: "Hitomi's toes hovered lightly over the last remaining urban patch, like a cat playing with a dying mouse. With a casual tap of her big toe, she crushed the roof of a shopping center that hadn't yet collapsed, sending panicked tinies fleeing like ants. Debris from her previous rampages still clung to her sweaty skin; dust and tiny shards of metal occasionally fell from her soles onto the streets below, sparking fresh waves of screaming as they landed. \\nSuddenly, her gaze paused, falling upon several relatively 'tall' figures at the city's edge—the staff who had initially delivered the miniature city. They were slightly larger than the average city dweller, perhaps twice or thrice the length of her toe. They should have evacuated immediately after placing the city, but were trapped by Hitomi's sudden movement. Now, they were huddled in terror by the remaining transport platform, waving desperately to catch her attention... or to beg for mercy. \\n\"Oh? You're still there?\" Hitomi's voice carried a hint of playful surprise. She had noticed them long ago but hadn't bothered to care until now. Those staff members, in their matching grey uniforms, were nothing more than slightly larger insects in her eyes—more noticeable than the city tinies, but still laughably small. They had been standing right next to the city to supervise, and when she first stepped in, several had been caught by the edge of her sole, compressed into dark red stains within her footprints. These survivors had simply been lucky enough to hide in a corner she hadn't touched yet. \\nOne staffer—apparently the leader, wearing a tiny helmet—was screaming something at her with all his might. To Hitomi, the sound was as faint as a mosquito's buzz, completely incomprehensible. She squinted, her toes spreading slightly like pincers as they slowly reached down. \\n\"Weren't you... supposed to run earlier?\" She chuckled, her voice booming like thunder in their ears. The leader's legs gave out from fear, and he sank to his knees while the others huddled together, trembling. Hitomi's big toe and second toe lightly pinched the leader's form. He struggled frantically between her toes, his hands pushing against her warm skin as if trying to move a wall of living flesh. The sweat and crushed debris remaining in the gap instantly covered his uniform; the intense scent of her feet mixed with the smell of dust nearly suffocated him. Hitomi felt a faint ticklish sensation and let out a comfortable hum, then gave her toes a small squeeze. With a soft 'crack', the man was crushed out of shape, his uniform bursting as blood seeped from between her toes like a crimson lubricant. \\nShe lifted her toes and gave them a shake, letting the remains and a glob of blurred gore fall onto his companions. The remaining staff completely broke down; some screamed and dove under the transport platform, others tried to run in vain only to be instantly swallowed by the shadow of her other foot. \\n\"Delivery tools dare to stay and watch the show?\" Hitomi said lazily, her sole descending slowly and aiming directly for where they had gathered. The moment the sole made contact, those bodies—larger than the city tinies—made a clearer 'squelch'—bones shattered, and flesh was pressed into the lines of her tread, providing more 'chew' than the city people. She lightly ground her heel, as if stepping on stubborn insects, feeling their final struggles fade into silence. When she lifted her foot, the transport platform was completely flattened, the staffers' remains mixed with metal fragments and stuck to her sole as several larger stains. Hitomi looked down at her foot, then casually wiped her sole to scrape off the residue, flicking it onto the office floor. \\n\"All cleaned up.\" She let out a satisfied sigh, brought her bare feet together, and lightly rubbed them against the last tiny patch of the city as if wiping dust from her soles. That patch was instantly leveled, leaving only a blurred set of double-footprints. Lunch break was over. Hitomi leaned back in her chair, her
    bare feet resting casually on the edge of the desk. Her toes flexed lazily as she looked down at the 'toy' that had been completely reduced to ruins. \\n\"Next time... should I have them prepare more staff? They feel better to step on,\" she muttered to herself, that familiar wicked smile returning to her lips."
