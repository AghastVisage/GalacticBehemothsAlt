  gts_hitomi.12.a.name: "What do you mean by 'captain'? Can you command a fleet?"



  #  “那是当然！需要舰队指挥官吗，我是希瞳，我在我在~”\n“虽然舰队指挥有些费神，但小瞳还是会细心指挥，谁让我是你的贴心女仆呢。” 
  gts_hitomi.12.a.desc: "'Of course! Need a fleet commander? I'm Hitomi, and I'm right here~'\\n'Though fleet command is a bit taxing, Little Hitomi will still command carefully. After all, I am your devoted maid.'"



  #  你怎么变小了？
  gts_hitomi.13.a.name: "How did you become smaller?"



  #  看着眼前没有形象瘫坐在舰船甲板上的女仆猫猫，不禁发出来了提问，刚才的天体级形象还是留下来过于深刻的印象\m“那个呀，是因为我的能力被压制了太久一下子全释放出来导致的，现在释放完了就恢复正常的大小了”\n“嗯？失望啦？” 
  gts_hitomi.13.a.desc: "Looking at the maid cat-girl slumped on the ship's deck without any sense of decorum, one couldn't help but ask. The previous celestial-scale image had left a far too profound impression.\\n'Oh that? It's because my power was suppressed for too long and it all came out at once. Now that it's all released, I've returned to my normal size.'\\n'Hmm? Disappointed?'"



  #  1微弱的求救信号
  gts_hitomi.101.title: "1. A Faint SOS Signal"



  #  　　经过科研船外围的研究，我们确认了这是一个还没有研发出FTL科技，加入群星大家庭的颇为原始的文明。虽然已经发展出了类似我们早期的科技，却并没有怎么涉及星空。\n通过对于这颗星球的外围观察，我们并没有发现这颗星球上有什么异于其他文明的东西。但是，随着我们的接近，以及我们的文明翻译器不断地捕获这颗星球所发射的电磁波，那个出现在我们脑海之中的少女正变的越来越清晰，很快，我们也便明白了她那模糊话语的本意。\n“救救我。”
  gts_hitomi.101.a.desc: "Through research on the planet's periphery, we have confirmed that this is a primitive civilization that has yet to develop FTL technology or join the interstellar community. Although they have developed technology similar to our early eras, they have hardly touched the stars.\\nThrough external observation of this planet, we found nothing differentiating it from other civilizations. However, as we approach and as our translators continue to capture the electromagnetic waves emitted by this world, the girl appearing in our minds is becoming increasingly clear. Soon, we understood the true intent of her blurred words:\\n'Save me.'"



  #  下一页
  gts_hitomi.next: "Next Page"



  #  离开
  gts_hitomi.file.a: "Leave"



  #  2逐步清晰的面貌
  gts_hitomi.102.title: "2. A Gradually Clearing Face"



  #  随着我们的逐步靠近，我们为了避免被土著发现真实意图，伪装成了一颗彗星，不断地尝试接近这颗孕育着不同生命的蓝色星球。虽然从我们截获的情报来看，我们应该不过是被视作了一个有些奇特的天体，我们依然谨慎地不断借着这个星系其他星球的掩护，慢慢靠近着这颗有着一位不断地在梦境当中，尝试和我们联系的少女。\n“请......你们救救我。”\n随着科研船渐渐的靠近，我们也终于有了和少女直接在意识之中对话的能力。我们大致了解过这种灵能感应的手段，却没曾想过能在这个土著星系真正用上过。\n“我是......双月希瞳，你们可以叫我希瞳。”\n“我曾经是这个星球存在的另一个种族，却因为我作为巨娘的身份被这个星球可恶的小人种族利用，把我产生的能够巨大化的能量全部利用起来......”\n“这个地方，好小，好无聊。”\n“你们，能够帮助我，让我也能够脱身出来吗？”
  gts_hitomi.102.a.desc: "As we gradually approached, we disguised ourselves as a comet to avoid our true intent being discovered by the natives, constantly trying to get closer to this blue planet teeming with diverse life. From intercepted intelligence, we were merely viewed as a somewhat peculiar celestial body. We remained cautious, slowly nearing the planet under the cover of other bodies in this system, seeking the girl who was trying to contact us through her dreams.\\n'Please... help me.'\\nAs the science ship neared, we finally gained the ability to communicate directly with the girl via consciousness. We had heard of such psionic sensing methods but never expected to actually use them in a native system.\\n'I am... Xitong Shuangyue. You can call me Xitong.'\\n'I was once another race on this planet, but I was exploited by the detestable little people of this world because of my identity as a giantess. They used all the energy I generate for giantification...'\\n'This place is so small, so boring.'\\n'Can you help me? Let me escape?'"



  #  3贸然的营救行动
  gts_hitomi.103.title: "3. A Rash Rescue Operation"



  #  我们的飞船如同流星一般，划过了土著星球的天际，却装作被捕获的样子，进入了环绕他的轨道。\n在土著们还在争论我们是外星人还是自然现象之时，为了将这只栗色的女仆猫娘从原住民的魔爪下拯救出来，我们打算冒险一试。\n我们的科学家带领着小队，直接传送到了那城市之下的基地之中。属于这个星球的科学家……惊奇的看着我们的出现，然后，便被我们逼迫着，交出了得以解救少女的钥匙。\n望着熟睡在培养皿中，被束缚着掠夺着能量的猫耳少女，我们不禁惋惜起来。但，就在这时，整个基地的警报都响了起来，看来……\n是时候了
  gts_hitomi.103.a.desc: "Like a shooting star, our ship streaked across the sky of the native planet, then entered orbit as if captured. While the natives debated whether we were aliens or a natural phenomenon, we decided to take a risk to save this chestnut-haired maid cat-girl from their clutches. Our scientists led a team, teleporting directly into the base beneath the city. The scientists of this planet... watched our appearance in surprise, then were forced to hand over the key to rescue the girl. Looking at the cat-eared girl sleeping in the incubator, her energy being stripped away, we couldn't help but feel pity. But then, the alarm throughout the entire base went off. It seems... it's time."



  #  4破茧而出
  gts_hitomi.104.title: "4. Breaking Out of the Cocoon"



  #  巨大的少女破茧而出，吓得那些赶来围追堵截的士兵呆若母鸡。\n“真的......很感谢你们。”\n淡红色的眼瞳打量着被一同包围的科学家，但她的眼神当中却没有畏惧，相反，能读出的则是满溢的恨。\n后续赶来的士兵如同潮水一般一波波的涌来，巨大的女仆少女则尝试着翻过身来，用自己庞大的身体挡住士兵们的视线。\n“虽然还没怎么了解你们的国家......但是我会记得你们的，不过，在此之前，我还有仇要报呢......”\n在我们的注视下，那位自称希瞳的猫娘少女逐步站起身来，将自己比常人大十倍的身躯压向了那些曾欺压着她的科学家和士兵们。\n“至于救出我的你们，就请......先不要打断我的复仇吧。”\n我们传送回了探测器上，少女则开始了自己的复仇。\n已然狭小的走廊，架在半空的管道和电线被少女轻易的扯断。\n胆敢拦在少女身前的小人，被比自己更为庞大的皮鞋碾作血污。\n失去了从自己身上汲取的能量，这座庞大的基地，同城市一同暗淡了下去。\n重新掌握了力量的少女，则思考着，这个背叛了自己的文明的处决方式。
  gts_hitomi.104.a.desc: "The giant girl broke out of the cocoon, frightening the soldiers who came to intercept her into a stupor.\\n'Truly... thank you.'\\nHer pale red eyes scanned the surrounded scientists, but there was no fear in her gaze; instead, it was filled with overflowing hatred. As soldiers arrived in waves like a tide, the giant maid attempted to turn over, using her massive body to block the soldiers' view.\\n'Though I haven't learned much about your nation yet... I will remember you. But before that, I still have a score to settle...'\\nUnder our gaze, the cat-girl calling herself Xitong slowly stood up, pressing her body, ten times larger than a normal person's, against the scientists and soldiers who once oppressed her.\\n'As for those who rescued me, please... don't interrupt my revenge for now.'\\nWe teleported back to the probe, and the girl began her revenge. In the narrow corridors, suspended pipes and wires were easily torn apart by the girl. Any little person bold enough to stand before her was crushed into blood and gore by her massive leather shoes. Deprived of the energy taken from her, the massive base—along with the city—went dark. The girl, having regained her strength, considered how to execute this civilization that had betrayed her."



  #  5背叛自己的ta？
  gts_hitomi.105.title: "5. The One Who Betrayed Her?"



  #  “就你，一个了吗？”\n身为女仆的她，在击退了几乎所有的，胆敢阻挡他的士兵们后，将那自己曾熟识的，曾经的“挚友”，但却出卖了自己，成为这个小人科学院院长的他，逼到了墙角之中。\n“我不是故意的！我......真的只是......”\n“真的不是故意的？就凭你能活到今天这个显而易见的事实，还打算继续蒙骗你的女仆吗？”\n穿着洛丽塔鞋的右脚轻轻地抬起，还沾着那些士兵背碾碎骨骼和血肉的鞋底，还在不断地向下滴着暗红色的鲜血。伴随着少女的威逼，她鞋底的棕色哑光厚底正顶着自己面前的这个叛徒。\n尽管那人正不断地求饶着，但是希瞳被关押了千年的恨意却并未消散一点。\n伴随着她收起的脚尖如同摆锤一般飞速落下，毫无抵抗之力的血肉之躯如同一节被碾碎的香肠一般爆裂开来。像是一颗鲜血的爆弹那般，同墙壁一起炸裂在了自己的鞋尖。\n“怯，还以为千年来你能有什么长进的，原来只有这点能耐吗？”\n少女左右晃动了自己的脚尖，将自己的脚同鞋子一同拔了出来。\n看着残留在自己鞋尖上的鲜血和骨骼，希瞳不由得嘟噜着。\n“十倍，对于彻底毁灭这个文明而言，还是太小了。”\n有些怨念的希瞳，用脚尖刮擦着一边的墙壁，将这小人的印记完全擦除。\n“解决了仇敌，那么也得把这个决议背叛自己的文明，一同扫除了才行。”\n没有了维生舱的束缚，希瞳的身躯，终于可以随心所欲的将能量完全用在巨大化之上，她的身躯将薄弱的楼板撑裂，将承重柱如同木棍一般折断撑裂，将自己的巨大化化作毁坏的力量，享受着那些愚蠢的科学家们，在躲避自己不断膨胀身躯时的不知所措，以及，最终连污损自己皮肤都做不到，也毫无反抗之法的——\n无力感。\n她的身体撑破了华美得穹顶，阴影逐步遮盖了大地。\n而展现在她面前的，则是自己还未曾享受过，却已经陷入混乱的现代化都市。
  gts_hitomi.105.a.desc: "'Just you left?'\\nActing as a maid, having repelled almost all soldiers who dared block her path, she cornered her former 'best friend'—the man who had once known her well but betrayed her to become the Dean of the Little People's Academy of Sciences.\\n'I didn't mean it! I... I really just...'\\n'Didn't mean it? Based on the obvious fact that you've lived until today, do you plan to continue deceiving your maid?'\\nHer right foot, clad in a Lolita shoe, was slowly lifted. The sole, still covered in the crushed bones and flesh of soldiers, was dripping with dark red blood. As she pressured him, the brown matte thick sole of her shoe was pressed against the traitor before her. Although he begged for mercy, Xitong's millenary resentment had not dissipated one bit. As her foot swung down like a pendulum at high speed, the defenseless body burst like a crushed sausage. Like a bomb of blood, he exploded against the wall at the tip of her shoe.\\n'Tch, I thought you might have made some progress over the millennium, but is this all you've got?'\\nThe girl shook her toes, pulling her foot and shoe out. Looking at the blood and bones remaining on her shoe tip, Xitong muttered to herself:\\n'Ten times larger... it's still too small to completely destroy this civilization.'\\nWith some resentment, Xitong scraped her toe against the side wall, completely erasing the mark of the little person.\\n'Now that the enemy is dealt with, the civilization that decided to betray me must be wiped out as well.'\\nWithout the restraint of the life-support pod, Xitong could finally use all her energy for giantification at will. Her body cracked the weak floorboards, snapping load-bearing pillars like wooden sticks. She turned her giantification into a force of destruction, enjoying the helplessness of the foolish scientists as they scrambled to avoid her expanding frame, and finally—the sense of total powerlessness—as they could neither harm her skin nor resist in any way.\\nHer body burst through the magnificent dome, and her shadow gradually covered the earth. Laid out before her was a modern metropolis, one she had never enjoyed but which was already falling into chaos."



  #  6重拾力量的她
  gts_hitomi.106.title: "6. She Who Recovers Her Strength"



  #  没有了自己身体所创造的能量，这些小人现在正在自己的面前，如同蝼蚁一般逃窜着。\n希瞳的双脚，重重的踩在广场之上。巨大的体重，瞬间就让看上去坚实的大地踩出了洛丽塔的鞋底印记。\n“既然不知道发生了什么的话，那我就再替各位蝼蚁们回忆回忆吧。”\n高跟踏击在小人的大街上，车流混着人流混乱地在希瞳的脚下逃窜着。穿着女仆装的猫娘希瞳，则像是猎手巡视猎场一般，踩踏着小人们的街道，践踏着那些被遗弃的车辆向前走去。\n“怎么？千年来依靠我的力量才发展到今天，你们难道毫无察觉吗？”\n“仔细想想也是，毕竟，能愚笨到被我追上呢......”\n少女的言语之间，满是对小人的不屑。\n车流堵塞成团，人群蜂拥向前。明明是自己的同类，却宁愿弃之不顾......\n希瞳的阴影，逐步笼罩在了逃跑的人群上方。\n本来宽阔道路，在她的身后只留下了冒着黑烟的残骸，以及一个又一个脚印，和被踩成铁皮的罐头。\n“看来，里面还有不少人呢？”\n希瞳轻轻的用脚跟压住了车流之中的一辆巴士，满载小人的公交车此刻被困在停滞的车流之中动弹不能。就连是车门，也被其他混乱的车辆所堵塞，车内满载着的乘客，只能眼睁睁的看着自己头顶的天花板一点点的被撕开，露出希瞳那只厚重的棕色洛丽塔的鞋跟。\n“切，就这样送你们这些蝼蚁上路吧。”\n少女忽然间重重的踩下，将满载的公交车化作了一个爆炸的番茄罐头，一旁的车辆之上，以及街旁的建筑，全部沾染上了那些半秒之前仍在挣扎，现在却变成各种红的黑的白的东西，就算是在这血肉地狱之中得以在少女的鞋尖和鞋跟之间存活的小人，下一秒则被少女更恶趣味的动作所完全碾碎——那辆已经不成样子的，混合着血肉的公交车残骸，连同后面积压着的几辆公交车一起被她后踢向空中，留下了喷洒着鲜血的轨迹，再重重的落在自己留下的脚印之间。完全不成样子的巴士残骸，还在姗姗的向外流出着人类遗骸的混合物。
  gts_hitomi.106.a.desc: "Deprived of the energy her body once created, these little people were now fleeing before her like ants. Xitong's feet landed heavily in the square, her immense weight instantly leaving Lolita shoe imprints on the seemingly solid ground.\\n'Since you don't know what's happening, I'll help you all remember.'\\nHer heels clicked against the streets of the little people. Traffic and crowds fled in chaos beneath Xitong's feet. Xitong, the cat-girl in a maid outfit, strode across the streets like a hunter inspecting a hunting ground, trampling abandoned vehicles.\\n'What? Using my power to develop for a millennium, yet you noticed nothing?'\\n'Now that I think about it, it makes sense; after all, you're stupid enough to let me catch up...'\\nHer words were full of contempt for the little people. Traffic jammed, people surged forward. Despite being of the same kind, they were willing to abandon each other... Xitong's shadow gradually loomed over the escaping crowd.\\nThe once-broad roads behind her left only smoking wreckage, footprints, and flattened metal cans.\\n'It seems there are quite a few people inside?'\\nXitong gently pressed her heel down on a bus in the traffic jam. The bus, full of little people, was stuck and unable to move. Even the doors were blocked by other chaotic vehicles. The passengers inside could only watch as the ceiling above them was torn open, revealing Xitong's thick brown Lolita heel.\\n'Tch, I'll just send you little ants on your way then.'\\nThe girl suddenly stomped down heavily, turning the packed bus into an exploding tomato can. Nearby vehicles and buildings were splattered with things that were struggling half a second ago but now turned into various shades of red, black, and white. Even little people who managed to survive between her toe and heel in this blood-soaked hell were completely crushed by her next cruel move—the mangled wreckage of the bus, mixed with flesh and blood, was kicked into the air along with several other buses behind it, leaving a trail of spraying blood before landing heavily among her footprints. The unrecognizable bus remains slowly oozed a mixture of human remains."



  #  7重拾力量的她
  gts_hitomi.107.title: "7. She Who Recovers Her Strength"



  #  看着面前逃难的人群，本来还在后面不紧不慢的虐杀着的希瞳，突然感受到了几下不明缘由的刺痛。定睛一看才发现，是本该维持着秩序的特警，正开着装甲车坚守在路口，用自己的那些毫无作用的烧火棍攻击着自己。\n“你们真的觉得这会有用吗？”\n少女抛弃了那一丝对猎物的矜持，本在驱赶着“猎物”的她，将逃跑中的人群的当作地毯向前跨去。每一步，都有几十个生命化作鲜红的血花，在她厚重的洛丽塔鞋下绽开着。而伴随着那黑影越来越大，她的面貌越来越清晰，站在这些抵抗着面前的希瞳，自然是对这些所谓英雄般的行动有所想法的。\n“怎么样啊，混蛋们？看看我的脚底，你们还要再反抗吗？”\n看着面前这些还没有自己脚趾高的小人儿，希瞳恶趣味的抬起了脚底，将一片地狱般的猩红，毫无保留的展示在这些抵抗者们的面前。\n“呕——”\n看着这番地狱的场景，纵使是经历过专业的训练，也有不少队员陷入了干呕之中，对此，希瞳小姐的处罚是......\n脚底重踏，将他们中间的，厚重的装甲车，如同易拉罐一般“咔擦”一下压扁。再如清扫一般，以鞋底为工具左右摆动。\n那些挥舞着烧火棍和护盾的士兵们，被少女比钢铁还要坚固的鞋面瞬间撞成了细小的血雾。仅仅是脚底在街道上左右摆动，就将这些恼人的蚂蚁，全部变成了自己鞋上的猩红印记。\n“真是的......幸好~你们丑陋的鲜血还没脏到本女仆的白丝呢......”
  gts_hitomi.107.a.desc: "Watching the fleeing crowd before her, Xitong, who had been slaughtering leisurely at the back, suddenly felt a few stabs of unexplained pain. Looking closer, she found that it was the special police, who were supposed to be maintaining order, stationed at the intersection with armored vehicles, attacking her with their useless fire sticks.\\n'Do you really think this will be useful?'\\nThe girl abandoned her shred of restraint toward her prey. As she drove the 'prey' forward, she used the escaping crowd as a carpet. Every step saw dozens of lives blooming like bright red blood flowers beneath her thick Lolita shoes. As the shadow grew larger and her face became clearer, Xitong, standing before these resistors, naturally had thoughts about these so-called heroic actions.\\n'How is it, you bastards? Look at the soles of my feet; do you still want to resist?'\\nLooking at these little people who weren't even as tall as her toes, Xitong mischievously lifted her sole, showing a slice of hellish crimson to the resistors without reservation.\\n'Ugh—'\\nSeeing this hellish scene, even with professional training, many team members fell into dry heaves. For this, Miss Xitong's punishment was... a heavy stomp, crushing the thick armored vehicle among them like a soda can. Then, using her sole as a tool, she swept side to side like a cleaning broom.\\nThose soldiers waving fire sticks and shields were instantly smashed into fine blood mist by the girl's shoe surface, which was harder than steel. Simply by moving her feet left and right on the street, she turned all these annoying ants into crimson marks on her shoes.\\n'Really... luckily, your ugly blood hasn't dirtied this maid's white silk yet...'"



  #  8清洁脚底
  gts_hitomi.108.title: "8. Cleaning the Soles"



  #  “可你们的血肉粘在我的双脚上，总感觉很恶心呢......”\n有了些厌恶的残忍女仆希瞳酱，继续朝着城市的一头走去。\n“有了......？”\n看着身旁那些十几层的，有自己小腿高的建筑，走到了一处公园之中的她，忽然之间想起了什么。\n“既然都是些无趣的小人建筑......用来擦拭鞋底的话？”\n她单脚着地，向后抬起了自己猩红的足底。鞋底的纹路几乎充满了逃难者的尸骸，还在滴落着血污的鞋子，此刻甚至还粘着几个拍扁到看不出原先样貌的小人车子。伴随着少女的脚底压在建筑的外立面上，如同猫咪磨爪那般，希瞳用着自己的鞋底，开始刮擦着那看似坚实的楼房。只可惜，小人的造物丝毫没有想过她的力量。仅仅是用自己的单脚擦拭几下，大楼便已经塌掉了半截，留下了从她鞋底刮下的大量血污，以及塌陷下来的破碎建筑残骸。\n“哼......我还是太高估你们了吗？”\n感到不解气的少女用脚尖轻重重地踢向楼房的一层，将她脚底刮落下来的，曾是几百条鲜活生命的人类原浆，和楼房一起垮塌埋没。\n“至于另一只脚吗，反正还有其他楼房呢？”\n少女恶趣味的将脚旁的大楼，当作了地毯，将自己的鞋底擦拭干净。末了，看到了脚边的池塘，下意识用小人的河塘洗脚的她，便穿着洛丽塔鞋轻踩了进去。\n“哗——哗——”\n伴随着她的脚底在池塘里轻轻的滑动，本来风景宜人的湖泊，瞬间便化作了脏黑的污水。\n其实也没想太多的希瞳，轮换着洗完了自己的双脚。棕色的皮鞋，终于少去了不少建筑的尘土，和那些垃圾一般的小人尸体。\n“这样才算弄干净吗~吗，还有很多小人没死干净呢？”\n这样想着的希瞳，继续追赶起了附近那些还在慌乱之中逃窜的小人。
  gts_hitomi.108.a.desc: "'But your flesh and blood clinging to my feet feels quite disgusting...'\\nXitong-chan, the cruel maid who was now somewhat repulsed, continued walking toward one end of the city.\\n'There...?'\\nLooking at the ten-story-high buildings beside her, which only reached her shins, she suddenly thought of something as she reached a park.\\n'Since they're all just boring little buildings... what if I use them to wipe my soles?'\\nStanding on one leg, she lifted her crimson sole backward. The tread of her shoe was almost filled with the remains of the fleeing victims, and dripping with blood and filth, the shoe even had several little people's cars flattened into it, their original shapes unrecognizable. As the girl pressed her sole against the building's facade, like a cat sharpening its claws, Xitong began to scrape the seemingly solid building with her sole. Unfortunately, the little people's creations had never considered her strength. With just a few wipes of her foot, the building was already halfway collapsed, leaving a large amount of blood and filth scraped from her sole, and the collapsed wreckage of the building.\\n'Hmph... did I overestimate you all?'\\nThe dissatisfied girl kicked heavily at the first floor of a building with her toe, burying her foot's scrapings—once hundreds of living lives—along with the building.\\n'As for the other foot, there are plenty of other buildings, aren't there?'\\nThe girl mischievously used the building beside her foot as a rug, wiping her sole clean. Finally, seeing a pond by her foot, she instinctively stepped into it with her Lolita shoes to wash them.\\n'Splash— splash—'\\nAs she moved her feet gently in the pond, the once-beautiful lake instantly turned into black, dirty sewage. Xitong, not thinking much of it, finished washing both feet alternately. The brown leather shoes were finally free of much of the building dust and the trash-like human remains.\\n'This counts as clean~ but there are still many little people who haven't died out yet?'\\nThinking so, Xitong continued to pursue the nearby little people who were still fleeing in panic."



  #  9绝佳视角
  gts_hitomi.109.title: "9. A Magnificent View"



  #  这里的房子就高了不少呢？一看就是你们这些小家伙的新聚居地吧？”\n希瞳站在小人的大街之上，周遭的大楼都繁华了不少向不少透明的玻璃覆盖其上，失去了能量的彩灯并未将街区最美的一面展露给我们的女仆，但对于目标是全歼这个星球生命的她来说，这些建筑物不过是他接下来选择的猎物罢了。\n嗯哼？看来你们的楼宇已经比欺骗我那会高上不少了呢......\n希瞳挑逗的走到了面前的楼宇前。刚好比她膝盖低一小节的大楼看上去还没收到什么警告。稍稍弯下腰去，便看见了里面还不知道外面究竟发生了什么，还在忙碌着的小家伙们。忽然之间又来了恶趣味的少女，将双脚踩在了楼宇的两旁。\n作为女仆的她，轻柔的蹲坐在了商场的上方。白丝的胖次轻松的就压溃了楼房顶端的各种设备，天线在她的骆驼趾上慢慢的弯曲折断，令希瞳感觉到了一丝瘙痒感。她收紧了大腿，将上半部分的商场一点点挤压在自己微胖紧实的大腿之下。伴随着身下那若有若无的悲鸣，满足着的少女正一点点的挤压着那些不幸着的生存空间。\n“既然不想逃的话，那就是自愿喽？”\n内倾的双脚，让自己的圆鞋头推碎了大门，将堵在门口的人群吓的连连后退。伴随着大楼四处发出悲鸣之声，原本华丽的玻璃幕墙在少女自上而下的挤压中逐渐架不住压力，一扇接一扇的碎裂开来。伴随着楼板一层层的垮塌，繁忙的商场终究还是受不住少女的压力，塌落了两三层。\n“真是的，连当椅子的能力都没有吗？废物~”\n希瞳厌恶的说着，将白丝包裹的双腿逐渐的夹拢。虽然有小人正在从低楼层一个个往下跳着，但毫不在意的她依然还是用自己的臀部和双腿，处决掉了被困在她身下的三百余名小人。\n在小人们的惊呼之中，大楼终究还是敌不过巨大女仆的力量，在她的小腿之间如同被孩童拆毁得沙堡一般塌落成了废墟。\n“本还以为你们能逃出来会聪明点的，没想到还是和那些蠢货一样直直的往前逃呢？”\n看着那逃出的几十个幸存者，嘴上说着自己毫不在意的希瞳仅仅是两步就追上了奔逃的人群。本还宽阔的大街，一下子便被她重踏所扬起的尘土所笼罩。\n“逃？逃的掉吗？”\n眼前一同逃跑的同伴消失不见，视野里只剩下了她冰冷的鞋底。\n末了，也不过是被她随意的一脚抹去，仅仅是比那些被双腿和臀部挤碎的小人多活了两三分钟。\n“真是的......才刚刚有感觉呢？”\n希瞳抬起脚来，看了看自己再度沾染上小人的鞋底，厌恶的又用身旁的建筑将脚底的血腥擦掉。
  gts_hitomi.109.a.desc: "The houses here are quite a bit taller, aren't they? Clearly a new settlement for you little guys.'\\nXitong stood on the main street of the little people. The surrounding buildings were much more prosperous. Many were covered in transparent glass, though the unpowered lights failed to show the maid the most beautiful side of the district. For her, whose goal was the complete annihilation of all life on this planet, these buildings were merely her next chosen prey.\\n'Hmm? It seems your buildings are already quite a bit taller than when you deceived me...'\\nXitong teased as she walked up to the building before her. Standing just below her knees, the building seemed not to have received any warning yet. Bending down slightly, she saw the little guys inside who were still busy, unaware of what was happening outside. Suddenly filled with mischief again, the girl planted her feet on both sides of the building.\\nActing as a maid, she gently sat down on top of the mall. Her white silk panties easily crushed various devices and antennas on the roof, which bent and snapped under her camel toe, giving Xitong a slight tickle. She tightened her thighs, gradually squeezing the upper half of the mall beneath her slightly plump and firm thighs. Accompanied by the faint wailing from beneath her, the satisfied girl slowly compressed the survival space of the unfortunate victims.\\n'Since you didn't want to flee, you must be volunteers, right?'\\nHer inward-turned feet used their rounded toes to smash the entrance, scaring the crowd blocked at the door into a continuous retreat. As the building groaned and wailed throughout, the once-magnificent glass curtain walls succumbed to the pressure of the girl's top-down squeeze, shattering one by one. As the floors collapsed layer by layer, the busy mall finally couldn't take the girl's pressure and collapsed by two or three stories.\\n'Honestly, you can't even serve as a chair? Useless~'\\nXitong said with distaste, gradually closing her white silk-clad legs. Though some people were jumping down from the lower floors one by one, she indifferently executed over three hundred little people trapped beneath her using her buttocks and thighs.\\nAmidst the cries of the little people, the building finally succumbed to the power of the giant maid, collapsing into ruins between her calves like a sandcastle destroyed by a child.\\n'I thought you'd be smarter after escaping, but you still ran straight forward like those other idiots.'\\nLooking at the dozens of survivors who escaped, Xitong, claiming she didn't care, caught up with the fleeing crowd in just two steps. The once-broad street was suddenly enveloped in the dust kicked up by her heavy stomping.\\n'Run? Can you escape?'\\nThe companions running alongside them disappeared, and only her cold sole remained in their vision.\\nFinally, they were wiped away by a casual kick, living only two or three minutes longer than those squeezed to death by her legs and buttocks.\\n'Really... I was just starting to get into the feel of it.'\\nXitong lifted her foot, looked at her sole which was once again stained with little people, and again wiped the blood away using a nearby building."



  #  空气中弥漫着一股乳香味。已经喷出一些的白色乳汁在建筑的残骸之中缓缓流动着，散发着蒸汽。而此刻的少女，则再次蹲了下来。透过满s裂纹的窗户，只能看到那些逃不出的所谓“精英”，正蜗居在大楼的中间，畏畏缩缩的看着注视自己的巨大女仆。\n“各位，想要死的更有价值一些吗？”\n希瞳轻启双唇，慢慢的哈出了湿热的空气。水汽逐步的遮蔽了玻璃幕墙，让小家伙们得以忽略掉巨大的淡红色眼瞳，以及那堆裸露在风中的丰硕乳房。但仿佛是抽奖一般，少女端详着，伸出手来，一下就击碎了大楼的某处。\n“恭喜你们，成为我今天的第一口小零食！”\n惊恐的上班族们想要逃跑，却只能眼睁睁的看着自己的同事被手指夹着，拉出了已经是巨大破洞的窗外。\n“我......还不想死，救命......啊！”\n连话都没说几句，倒霉的白领就被希瞳丢入口中。伴随着他的惨叫声，他如同一块生肉那般，被巨大的牙齿所碾碎。只有1/100的他，甚至比希瞳的牙齿还要小一些。在她本能的咀嚼之下，骨骼咯啦咯啦的被碾碎，体内的一切都被挤出，然后再被唾液混合，被舌头推挤到了一边。\n“怎么样？死的很干脆吧？”\n希瞳再次张大嘴巴，让各位得以看清那倒霉蛋的死法。在大家被这番画面震惊到说不出话的时候，她的另一只手也深入大楼之中，将一个又一个的幸存者拉了出来，丢到了自己的手心之中。\n“嗯......不错？光是吃掉一只小家伙的话还是不够解馋呢？”\n希瞳这样说着，将手掌斜向了自己张大的巨口。在不断地惊呼之中，小人们想要朝着手掌的另一侧攀爬着，却抵挡不过地球重力，滑落到了她的嘴中，如同跳跳糖一般在她的舌头之上蹦跳了几下。\n几十只本该有着美满生活的小虫子......就这样化作了女仆的解压零食。\n在旁人的围观之下，那双雪白的皓齿逐步落下，将想要挣扎着逃出生天的小人拦腰斩断。伴随着少女不清的咀嚼声，口中的求救和挣扎几乎瞬间断绝。就算是得以逃到牙齿下方，得以不被几下斩断粉碎的小人，也被那巨龙一般灵活的舌头推挤着，成为了上下牙齿之间的亡魂。\n“嗯~嗯~”\n伴随着鲜活的生命成为了自己的食糜，少女发出了满意的轻哼。咕咚一声，便将这些人类化成的看不清样貌的血肉，混合着口水一同咽下。\n“真是美妙呢，没想到这么久过去你们的味道已经变好了许多呢？”\n少女对着楼内的幸存者微微笑着，但大家却只能注意到她洁白的牙齿，已经沾满了同类遗留下的，可怕至极的暗红色血肉。\n“但是你们剩下的小人，可就没那么幸运了呢~”
  gts_hitomi.111.a.desc: "The air was filled with a milky fragrance. White milk, already sprayed out, flowed slowly among the wreckage of the buildings, giving off steam. At this moment, the girl crouched down again. Through the cracked windows, only the so-called 'elites' who couldn't escape could be seen, huddling in the middle of the building, cowering as they watched the giant maid gazing at them.\\n'Everyone, would you like to die a bit more meaningfully?'\\nHitomi slightly parted her lips, slowly breathing out hot, moist air. The water vapor gradually obscured the glass curtain wall, allowing the little ones to ignore the giant pale red pupils and the pair of plump breasts exposed to the wind. But as if drawing a lottery, the girl scrutinized them, reached out her hand, and shattered a part of the building in an instant.\\n'Congratulations, you have become my first bite of a snack today!'\\nTerrified office workers tried to flee, but they could only watch helplessly as their colleagues were pinched by fingers and pulled out of the already gaping hole in the window.\\n'I... I don't want to die yet, help... ah!'\\nBefore even a few words could be uttered, the unlucky white-collar worker was tossed into Hitomi's mouth. Accompanied by his screams, he was crushed by the giant teeth like a piece of raw meat. At only 1/100th her size, he was even smaller than one of Hitomi's teeth. Under her instinctive chewing, bones were ground and crunched, everything inside was squeezed out, then mixed with saliva and pushed aside by her tongue.\\n'How was it? A very quick death, wasn't it?'\\nHitomi opened her mouth wide again, allowing everyone to see the fate of the unlucky soul. While everyone was shocked into silence by the scene, her other hand reached deep into the building, pulling out one survivor after another and placing them into her palm.\\n'Hmm... not bad? Just eating one little guy isn't enough to satisfy my craving.'\\nSaying so, Hitomi tilted her palm toward her wide-open mouth. Amidst continuous cries, the little people tried to climb toward the other side of her palm, but they couldn't withstand the gravity and slid into her mouth, bouncing on her tongue like popping candy.\\nDozens of little bugs who should have had happy lives... just like that, they turned into the maid's stress-relief snacks.\\nUnder the gaze of onlookers, the snow-white teeth gradually descended, snapping the little people struggling to escape in half at the waist. Accompanied by the girl's indistinct chewing, the pleas for help and struggles in her mouth were cut short almost instantly. Even the little people who managed to escape beneath the teeth without being crushed were pushed by the dragon-like flexible tongue, becoming souls between the upper and lower teeth.\\n'Mmm~ Mmm~'\\nAs the fresh lives became her chyme, the girl let out a satisfied hum. With a gulp, she swallowed the indistinguishable flesh that had once been humans, mixed with saliva.\\n'Truly wonderful. I didn't expect that after all this time, your taste would have improved so much.'\\nThe girl smiled slightly at the survivors inside the building, but they could only notice her white teeth, now stained with the terrifying dark red flesh left behind by their kind.\\n'But you remaining little ones won't be so lucky~'"



  #  12绝赞一击
  gts_hitomi.112.title: "12. A Magnificent Strike"



  #  伴随着希瞳的轻哼声，她转过身弯下腰来，将自己圆润的屁股对准了这座还在勉强支撑着的大楼。\n“既然你们得以有幸存活到现在的话，那么......”\n少女的巨大臀部，轻轻的在风中晃动着。洁白的胖次，也因为刚刚的玩弄湿润了一小片。肉肉的大腿，肉肉的屁股，在外人看来极具诱惑力的情色，对于残留的小人，却怎么也想不到自己竟会惨死在这番美景之下。在那巨大臀部一次又一次的撞击之下，本还顽强地保持直立着的大楼，在少女一次又一次的撞击之下逐渐弯曲变形，最终，被可恶的女仆的肥硕屁股一下撞断，将整个建筑化作了尘烟。\n“呼......你们想的比我坚强不少吗？不过，就这点本事了吗？”\n少女的脚底抵着残余的半截大楼，用力一踢，将大楼本是连根拔起击倒在地。再度转过身来的她，也没有刚刚的那番挑逗，仅仅是来自鞋底的两脚重踏，便彻底的将自己刚刚还在玩弄的这“玩具”，化作了残破街区之中的两只巨大的脚印。\n“呼......接下来又是什么呢？好期待啊，发展了千年的小小人们，能怎么反抗我这个巨大化的女仆呢......”
  gts_hitomi.112.a.desc: "Accompanied by Hitomi's soft hum, she turned around and bent over, aiming her rounded buttocks at the building that was still barely standing.\\n'Since you have been lucky enough to survive until now, then...'\\nThe girl's massive buttocks swayed gently in the wind. Her white panties were slightly dampened from the previous play. Fleshy thighs, fleshy buttocks—what appeared to be highly seductive erotica to an outsider was a scene of impending doom for the remaining little people, who could never have imagined they would meet such a tragic end beneath such beauty. Under the repeated impacts of those massive buttocks, the building that had tenaciously stayed upright gradually bent and deformed, and finally, it was snapped in two by the wicked maid's plump rear, turning the entire structure into dust.\\n'Phew... you're much stronger than I thought. But is that all you've got?'\\nThe sole of the girl's foot pressed against the remaining half of the building. With a forceful kick, she uprooted the building and knocked it to the ground. Turning around again, she stopped her previous teasing. With just two heavy stomps of her soles, she completely turned this 'toy' she had been playing with into two giant footprints amidst the ruined street block.\\n'Phew... what's next? I'm so looking forward to it. How will the little people, developed over a millennium, resist me, this giantized maid...'"



  #  13
  gts_hitomi.113.title: "13."



  #  一千七百多米的希瞳可爱的坐在城市之中，无聊的寻找着自己的下一个目标。\n“你们真是太弱了~抵抗也抵抗不了，逃，又能逃到哪里去呢？”\n希瞳轻轻晃动着自己的双脚，像是碾碎蚁群一般，不断地用自己的脚跟砸入小人的街道之中。人群如同无头苍蝇一般在她巨大的身躯之下四处奔逃着，而希瞳不过是用脚跟轻轻砸下，就能将几十个人的人群连同周围的大楼，一起用自己那厚实的长鞋跟碾作尘土。\n“完全没意思呢......没办法，只能让你们提前感受一下了呢？”\n这样说着的少女，无趣的用指尖勾上了自己的鞋跟。伴随着一股浓郁的气味笼罩大地，希瞳那有些发黄的白丝从那双洛丽塔皮鞋之中被抽了出来。伴随着一股浓郁的气味，那些躲藏在楼宇和地下的小人都不由得的捂住口鼻。\n“嗯哼？你们难道不觉得这股臭味很美妙吗？”\n用手指捏住自己的鞋帮，希瞳稍加思索，便将自己巨大的鞋子看似随意的丢出。在轰鸣之中，那巨大的鞋子重重的倒在城市之中，滚动翻转的鞋身将逃命的小人，连同繁华的街区一同压扁。只留下了那高墙一般的，还粘着各种建筑小人以及汽车残骸的脏污鞋底。\n“呵呵？就这点本事吗，那，另一只鞋子也请你们保管好哦？”\n巨大的鞋子，即使看起来只是朴实无华的高跟洛丽塔鞋，但在千倍的大小下，依然有着毁天灭地的重量。重重落地的鞋子，竟然勉强维持了自己的直立。屹立在城市之中，即使与这个城市最为高耸的建筑物比起来都颇为庞大。而那些曾经能让希瞳好好玩弄的商场和居民楼，如今也不过是她脚趾大的无趣建筑物罢了。\n更为巨大化的她，此刻需要更为有趣的建筑来好好发泄一通。\n“嗯？居然全部逃到这里了吗？是等着我把你们一块扫除掉吗？”\n左右扫视着的希瞳，忽然在一片无趣的灰色建筑物里发现了什么。
  gts_hitomi.113.a.desc: "The 1,700-meter-tall Hitomi sat cutely in the city, bored and looking for her next target.\\n'You are all far too weak~ fiber couldn't even resist, and where could you possibly escape to?'\\nHitomi gently swung her feet, repeatedly slamming her heels into the streets of the little people as if crushing an ant colony. The crowds fled in all directions beneath her massive body like headless flies, but Hitomi only had to land a light blow with her heel to grind a crowd of dozens, along with the surrounding buildings, into dust with her thick heels.\\n'Totally boring... nothing for it, I'll just have to make you experience it a bit early then?'\\nSaying so, the girl boredly hooked her heel with her fingertip. As a thick scent enveloped the land, Hitomi's slightly yellowish white silk socks were pulled out from her Lolita shoes. Along with the heavy fragrance, the little people hiding in the buildings and underground couldn't help but cover their noses and mouths.\\n'Hmm? Don't you think this smell is wonderful?'\\nHolding the upper of her shoe with her fingers, Hitomi thought for a moment and tossed her giant shoe seemingly at random. Amidst the roaring, the giant shoe slammed down into the city, its rolling and flipping body flattening the fleeing little people along with the prosperous blocks. Only the wall-like, stained sole remained, with various buildings, little people, and car wreckages stuck to it.\\n'Hehe? Is that all? Well, please take good care of the other shoe too, then.'\\nThe giant shoe, even if it looked like a simple high-heeled Lolita shoe, possessed a world-ending weight at a thousand times the scale. The shoe that slammed to the ground even managed to maintain its upright position. Standing tall in the city, even compared to the most towering buildings, it was quite immense. And the malls and residential buildings that Hitomi used to play with were now just uninteresting structures the size of her toes.\\nBecoming even more giantized, she now needed more interesting buildings to blow off some steam.\\n'Hmm? Have you all fled here? Are you waiting for me to wipe you all out at once?'\\nScanning left and right, Hitomi suddenly discovered something among a field of boring gray buildings."



  #  14
  gts_hitomi.114.title: "14."



  #  “真是......有不少呢？”\n少女转过身来，巨大的双腿横跨了数个街区，一左一右的砸在体育场的旁边。场内残存的上万人......还以为自己已经躲过了少女的视线，再度抬头，迎接他们的却是少女的坏笑，以及她正在轻轻晃动着的，那一双大臭脚。\n“呕......”\n此时的体育场对希瞳，究竟是什么呢？这么个建筑物，看起来也确实能让希瞳踩上几脚，但是玩心大发的希瞳，却不想这么轻松的让面前的小人儿轻易死去。\n“既然你们有幸被我挑中了，那么，可是要好好的来仰望你们归来的......”\n希瞳轻摇着嘴唇，说出了她一直都想说出的那句话。\n“'女神'哦。”\n坐在地上曲着腿的少女，轻轻的抬起了自己的左足。那被束缚了千年的足部，此刻正毫无遮掩的展示在所有人的面前。千年的积怨如同这脚臭一般，泛黄的脚底，以及勾动着丝袜的巨大脚趾，都彰显着这位女仆曾经统治着这个星球的过往。\n“不错哦，你们居然还能逃到这里呢？真不错呢~看看你们的同伴，就没那么幸运了呢？”\n希瞳微微弯腰，用自己的手指指着那些不幸被碾碎并被粘在脚底上的垃圾。\n“小家伙们的城市，还挺多姿多彩的吗？”\n希瞳用手指指着那些粘在自己足底的残骸，一个接一个的吐槽着。\n“看起来你们这些人真是慌不择路呢，不过也方便被我一脚踩扁了耶。”\n有些挑衅的她，一边说着，一边将粘在脚底的各种被碾作铁片的小车揭下，丢在了体育场的一旁。一边耻笑着那些不自量力的，被自己脚跟一脚击碎的人群，一边感受着那胯下上万人对于自己的恐惧和钦慕。\n“嗯？我有说你们可以走吗？”\n忽然间，希瞳看到了什么。那是正在自己足下奔逃着的上百人。就算是被她抬起的左脚阴影所笼罩，却依然侥幸的觉得巨大的女仆根本注意不到自己的存在。只可惜，这样的蚂蚁逃窜，已经杀死了数十万人的希瞳自然是已经习惯了呢。\n伴随着巨大的脚跟在一瞬间砸在人群之中，大笑着的希瞳，将自己的脚跟当作的碾碎东西的杵一般，在那人群之中重重地旋转碾碎着。看着那所剩无几的小人们四散奔逃，杀戮成瘾的她几乎是用自己庞大的力量，将她脚边胆敢逃跑的每一只小人，都用自己的脚跟碾碎成了不分你我的细碎血肉。\n“怎么样？胆敢逃跑的下场......就是这样哦？各位愚蠢的虫子~”\n再次抬起脚的希瞳，她的脚跟正滴落着那人类的混合物。这番残忍血腥的场景，令场内避难的小人们不由得连连后退。
  gts_hitomi.114.a.desc: "'There really are... quite a few of you, aren't there?'\\nThe girl turned around, her massive legs straddling several city blocks as she slammed them down on either side of the stadium. The tens of thousands of survivors inside... had thought they had escaped the girl's sight. When they looked up again, they were met by the girl's wicked smile and her pair of giant, smelly feet swaying gently.\\n'Ugh...'\\nWhat was the stadium to Hitomi now? Such a building was certainly something she could stomp on a few times, but with her mischievous side in full swing, Hitomi didn't want to let the little people before her die so easily.\\n'Since you were lucky enough to be chosen by me, you must look up properly at your returning...'\\nHitomi lightly bit her lip and said the words she had always wanted to say.\\n''Goddess'.'\\nSitting on the ground with her legs bent, the girl gently lifted her left foot. The foot that had been bound for a thousand years was now displayed before everyone without any concealment. A thousand years of resentment was like the smell of her feet; the yellowish soles and the giant toes hooking into her silk socks all highlighted this maid's past when she ruled this planet.\\n'Not bad, you actually managed to escape here? Truly impressive~ But look at your comrades, they weren't so lucky.'\\nHitomi leaned over slightly, pointing her finger at the trash that had been unfortunately crushed and stuck to her sole.\\n'The city of the little ones is quite colorful, isn't it?'\\nHitomi pointed at the wreckages stuck to her sole, making one comment after another.\\n'It seems you people really lost your heads in your panic, but that just makes it easier for me to stomp you flat.'\\nSomewhat provocatively, she spoke while peeling off various small cars that had been crushed into iron sheets and discarding them beside the stadium. She mocked the overconfident crowds she had crushed with her heels while feeling the fear and admiration of the tens of thousands beneath her.\\n'Hmm? Did I say you could leave?'\\nSuddenly, Hitomi saw something. It was over a hundred people fleeing beneath her foot. Even under the shadow of her raised left foot, they still luckliy thought the giant maid wouldn't notice their existence. Unfortunately, Hitomi, who had already killed hundreds of thousands, was of course used to such ant-like scurrying.\\nAs her massive heel slammed into the crowd in an instant, the laughing Hitomi used her heel like a pestle, heavily rotating and grinding amidst the people. Watching the few remaining little people scatter, her addiction to slaughter made her use her immense power to grind every single little person daring to escape near her feet into indistinguishable, fine shreds of flesh.\\n'How was it? This is the consequence of daring to run away. You foolish bugs~'\\nLifting her foot again, Hitomi's heel was dripping with the mixture of human remains. This cruel and bloody scene caused the survivors in the stadium to retreat in terror."



  #  15
  gts_hitomi.115.title: "15."



  #  看着小人们在自己脚下屁滚尿流的场面，希瞳更是张狂的用脚底抵住了面前巨蛋般的体育馆，用自己的双脚不断地拍动着本就脆弱的避难所。\n“呵呵~你们真是弱小啊？哪里也去不了，反抗又做不了，只能把自己最为不堪的一面暴露给你们的毁灭神来看呢？”\n伴随着希瞳的双脚平铺在场馆的巨大穹顶上，仅剩的不到万人......正体验着身为希瞳脚底的足垫虫一般的待遇。每一口的呼吸，都是将希瞳积累了许久的脚臭吸入肺中的，浓郁到说不出话的臭味。索性，身为巨大女仆的希瞳也还没可怕到光光能用脚臭就能夺走人性命的程度。但在这番黑暗潮湿的足臭折磨之下，纵使是再有生命里的小人，也不得不在希瞳的足下败下阵来。\n“不过，反正你们也已经没啥用处了呢......”\n玩弄尽兴了的希瞳，终于想起来了自己灭杀人类的人物。伴随着盘腿的少女将双脚一左一右的夹在体育场的两旁，就连最为宽广的大街，此刻对于她的小腿来说都过于窄小。而在足心当中的体育场，此时已无人再敢逃跑，宁愿直面被面前这巨大女仆碾碎的命运。\n“哗啦——”\n在双脚闭合的一瞬间，巨蛋一般乳白色外壳的体育馆......便在她的足下彻底的被碾碎。意犹未尽的她，再搓动了几下双脚，直到再也感受不到双脚之间的生命气息才作罢。\n“果然只是一群愚笨的虫子呢？甚至是看到我白丝包裹着的巨大足底，都会害怕呢？”\n完全用双脚灭杀了这“避难所”里的一万小人了她，满意的抬起了自己的一只脚。穹顶和座椅的残骸从她的脚底像碎屑一般抖落，只留下了那些被鲜血浸透了的帐篷，以及成片成片的，曾是小人的红点。\n“没想到你们这些小人这么小呢？还没那些逃跑的家伙有意思呢......”
  gts_hitomi.115.a.desc: "Watching the little people wetting themselves in terror beneath her, Hitomi became even more wild, pressing her soles against the dome-like stadium and repeatedly patting the already fragile shelter with her feet.\\n'Hehe~ You are all so weak! You can't go anywhere, you can't resist, you can only expose your most pathetic side to your Goddess of Destruction, can't you?'\\nAs Hitomi's feet lay flat across the massive dome of the stadium, the remaining fewer than ten thousand people... experienced the treatment of foot-mat bugs beneath her soles. Every breath they took drew the concentrated smell of her feet, accumulated over ages, into their lungs—a scent so thick they couldn't speak. Fortunately, Hitomi the giant maid wasn't so terrifying that her foot odor alone could take lives. Yet under the torture of this dark, moist foot smell, even the hardest little people had to surrender beneath her feet.\\n'Well, you're useless now anyway...'\\nHaving had her fun, Hitomi finally remembered her mission to exterminate humanity. As the cross-legged girl placed her feet on either side of the stadium, even the widest streets were too narrow for her calves. Inside the stadium at the center of her arches, no one dared to run anymore, preferring to face the fate of being crushed by the giant maid.\\n'CRASH——'\\nThe moment her feet closed together, the milky-white dome of the stadium... was completely crushed beneath her feet. Not yet satisfied, she rubbed her feet together a few more times until she could no longer feel any signs of life between them.\\n'Truly just a bunch of stupid bugs. They're even afraid of seeing my giant white silk-clad soles.'\\nHaving completely exterminated the ten thousand little people in this 'shelter' with her feet, she lifted one foot in satisfaction. Wreckage of the dome and seats fell from her sole like crumbs, leaving behind only tents soaked in blood and fields of red dots that had once been little people.\\n'I didn't expect you little ones to be so tiny. You weren't even as interesting as those who tried to run...'"



  #  16
  gts_hitomi.116.title: "16."



  #  此时的少女，正悠闲的走在城市之中，用释放出来的双足感受着这片许久未见的大地。几乎每一步都能让上千人死去的她，尽情得享受着这座作为女神一般高高在上的快感。那双有些泛黄的袜底，现在已经沾满了小人的尸骸，和建筑的残渣混合再一起，让女仆本该洁白的白丝足底变的脏脏的。\n“怎么样各位~知道希瞳的厉害了吧？”\n纵使是小人们的河流，不过也只是她一步便能跨过的存在。看着满是逃难者的桥梁，本该继续破坏的希瞳，突然转过身来。\n“你们说，既然怎么都是死，那要不试试看这招呢？”\n少女屹立在大桥两边，调皮的抬起了一只脚，用脚趾搭在这没有自己脚底宽的小小桥梁之上。\n“看起来你们真够小的啊？甚至可以是被我一只脚就抓起来的存在呢？”\n话刚说完，少女的五根脚趾便刷的并拢，将小人和桥梁本身都一同抓住碾碎。\n“只是......稍稍的有了些感觉呢？各位？我对你们的反抗不是很满意呢？”\n希瞳不屑的抬起脚来，放开了自己的五根脚趾，任由那些得以在她趾弓之间得以存活的幸存者，和那已经四分五裂的桥梁一同坠下。\n“怎么样？震撼不震撼？你们拍摄我的样子，还没有得到我的许可呢？”\n看着勉强飞到自己身旁，拍摄自己当作新闻报道的直升机，这可爱的女仆也忽然之间正经了那么一下。稍稍地弯下腰去，仔细的用自己红色的眼瞳打量着这架小小的直升机。已经感觉到了危险的直升机正打算飞离，却被少女意外可爱的打了个招呼。\n“你们这群小虫子，居然能做出这座东西吗？真是了不起呢......”\n轻轻摆手的少女卷起的风，就让直升机在自己面前左摇右摆了起来。再度露出自己险恶一面的希瞳，也伸出了自己的五指。\n“啪——”\n本来还在空中勉强维持着姿态的小小直升机，在少女的手中变成了一朵不起眼的火光。\n“呼，果然假正经的日常，只适合主人呢。”\n轻松的解决掉了恼人的小飞虫，希瞳继续散步在城市之中，寻找着自己的下一个猎物。
  gts_hitomi.116.a.desc: "The girl was now walking leisurely through the city, feeling the long-unseen earth with her freed feet. Killing thousands with almost every step, she thoroughly enjoyed the pleasure of being as high and mighty as a goddess. Her slightly yellowed sock soles were now covered with the remains of the little people, mixed with the rubble of buildings, turning the maid's once pure white silk soles dirty.\\n'How's it going, everyone? Do you know how powerful Hitomi is now?'\\nEven the rivers of the little people were something she could cross in a single step. Looking at a bridge full of refugees, Hitomi, who should have continued her destruction, suddenly turned around.\\n'I say, since you're all going to die anyway, why not try this move?'\\nThe girl stood on either side of the bridge, mischievously lifting a foot and resting her toes on the tiny bridge that wasn't even as wide as her sole.\\n'It seems you really are small enough to be picked up by just my toes, aren't you?'\\nAs she finished speaking, the girl's five toes snapped together, grabbing and crushing both the little people and the bridge itself.\\n'That... felt a bit better. Everyone? I'm not very satisfied with your resistance.'\\nHitomi dismissively lifted her foot, releasing her toes and letting the survivors who had managed to stay alive in the arch of her foot fall along with the shattered bridge.\\n'How was that? Shocking? You haven't received my permission to film me yet.'\\nLooking at a helicopter that had barely managed to fly near her to film the scene for a news report, the cute maid suddenly turned serious for a moment. Stooping down slightly, she carefully scrutinized the tiny helicopter with her red eyes. The helicopter, sensing danger, was about to fly away when it was met with an unexpectedly cute greeting from the girl.\\n'You little bugs, you can actually make something like this? Quite impressive...'\\nThe wind whipped up by the girl's gentle wave caused the helicopter to sway uncontrollably before her. Reverting back to her sinister side, Hitomi extended her fingers.\\n'SNAP——'\\nThe tiny helicopter, which had been struggling to maintain its position in the air, turned into an insignificant spark in the girl's hand.\\n'Phew, a fake serious routine really only suits Master.'\\nEasily dealing with the annoying little flying insect, Hitomi continued her stroll through the city, searching for her next prey."



  #  17
  gts_hitomi.117.title: "17."



  #  此刻在已经成为废墟的体育场旁，希瞳那巨大的鞋子，还正屹立在已经不剩下几个幸存者的街区之上。小人们终于得以挣扎着，在巨大的鞋垫之上再度挣扎着站起来。被巨量足臭冲晕过去的人们，还在思索着自己究竟会出现在如此宽广，却又如此刺鼻的一片空间之内。作为希瞳被囚禁了千年都未曾脱下的高跟洛丽塔鞋子，棕色哑光的平淡外表之下，却是一片巨大的，留下了希瞳淡灰色脚汗印记的巨大白色盆地。\n“这是......什么地方啊！”\n被困在足臭之中小人们抬头仰视作为天空的鞋内，却发现自己熟悉的街区早已成为了自己身旁散落着的废墟。忽然之间，脑内便想起了昏迷前自己所听到的，来自女巨人的最后一句话。\n“你们只不过是要被打扫的害虫而已，就这样苟活在我的足垫上吧”\n“——如果你们还能够活下去的话”\n忽然之间，他们记起了自己是如何出现在这里的。\n巨大的希瞳，那时正刚刚将满是幸存者的体育场，化作自己白丝之上的一抹脏污。\n“至于你们，剩下的小家伙，还得有人来好好服侍我这个女仆吧？”\n“千年来一直都是我在帮助你们，你们可要想办法回报我啊。”\n这么说着的希瞳，蹲到了自己的洛丽塔鞋旁边。双脚下意识的掂在城市之中，一边说着，一边找寻着自己的目标。\n“各位小虫子的建筑，都还没我的鞋子高呢？”\n少女一边坏笑着，一边将自己的手伸向了那些在自己身旁的，误以为少女已经忽视了自己从而停下脚步的幸存者。幸存着们还想要奔逃，却被从脚下传来的巨大震荡所击倒，目睹着少女的手掌插入地底，将自己连同街区一同挖起。看着面前打量着这片小人街区的希瞳，小人们慌张的趴在已经布满裂纹的街道上看着面前的巨大猫娘。\n“不如这样，既然你们住的这么差，不如就宜居到我暖和的鞋垫上来吧？”\n希瞳微微的笑着，便将小人的街区，如同一捧沙子那般倒入了自己的鞋中。\n建筑在空中逐步碎散，如同沙尘暴一半击打着留下了她巨大足印的鞋垫。但幸存者们却被这温热柔软的鞋垫所接住，如同蹦床一般在这本该洁白的大地之上蹦跳几下。\n然后，便被少女那温热的足臭包裹，失去了自己的意识。
  gts_hitomi.117.a.desc: "Currently, beside the ruined stadium, Hitomi's giant shoe still stood amidst a neighborhood where almost no survivors remained. The little people finally managed to struggle and stand up again on the massive insole. Those who had been knocked unconscious by the overwhelming foot odor were still wondering how they ended up in such a vast yet pungent space. As the high-heeled Lolita shoes that Hitomi hadn't taken off throughout her thousand-year imprisonment, their plain brown matte exterior concealed a vast white basin marked by Hitomi's pale gray foot sweat.\\n'Where... is this place!'\\nTrapped within the foot odor, the little people looked up at the interior of the shoe serving as their sky, only to find that their familiar neighborhood had become the scattered ruins beside them. Suddenly, they remembered the last words they had heard from the giantess before losing consciousness.\\n'You are just pests to be cleaned up. Just live like this on my insole'\\n'——If you can even manage to survive'\\nSuddenly, they recalled how they had arrived here.\\nThe massive Hitomi had just finished turning the survivor-filled stadium into a smudge on her white silk.\\n'As for the rest of you little ones, I'll need someone to properly serve me as a maid, shouldn't I?'\\n'I've been helping you for a thousand years; you'd better find a way to repay me.'\\nSaying this, Hitomi crouched beside her Lolita shoe. Her feet instinctively tiptoed through the city as she spoke, searching for her targets.\\n'The buildings of you little bugs aren't even as tall as my shoe, are they?'\\nThe girl grinned wickedly as she reached out to the survivors beside her, who had mistakenly thought she had ignored them and stopped running. The survivors tried to flee again but were knocked down by the massive tremors from beneath them, witnessing the girl's palm plunging into the ground, digging them up along with the city block. Looking at Hitomi as she scrutinized this neighborhood of little people, they lay face down in panic on the cracked streets, staring up at the giant cat-girl.\\n'How about this? Since your living conditions are so poor, why not move onto my warm insole?'\\nHitomi smiled slightly and poured the neighborhood of little people into her shoe like a handful of sand.\\nThe buildings shattered in the air, hitting the insole marked with her giant footprint like a sandstorm. However, the survivors were caught by the warm, soft insole, bouncing a few times on the once-white ground as if on a trampoline.\\nThen, they were enveloped by the girl's warm foot odor and lost consciousness."



