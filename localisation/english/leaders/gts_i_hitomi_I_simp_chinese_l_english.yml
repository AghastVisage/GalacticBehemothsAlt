  gts_hitomi.121.title: "21. The Virtues and Vices of a 10,000-fold Maid"
  #  “果然还是......得让你们好好的满足我呢......”\n从高潮之中逐渐缓过神来的她，正以万倍的身躯躺在这片城市之中。\n她所逃出的研究所，如今刚好已经消失——就在她变大的足跟之下，被她翘起又落下的万倍足跟，一下便砸成了巨大的陨石坑。\n“好久......没这么舒服了......呼......”\n刚从高潮昏厥后反应过来的希瞳，挣扎着坐了起来，然后她便被自己的这番邋遢样所吓到——双腿之间的，还保留着一丝温热的湖泊，明明就是自己的尿液。橙黄的少女尿液，在自己双腿之中的城市之中，产生了一片可以算得上是前二十的城市景观湖。但少女的心思，却不在这场从天而降的尿液海啸究竟消灭了多少万小人，而在......自己双腿的过膝袜上。\n“噫！都怪你们......我的袜子都被弄湿了！”\n抱怨着的希瞳，恼怒的又挖起了一片城市，塞入了意犹未尽的下体之中。\n“就让你们这些变态虫子，才让本女仆变的如此不堪......”\n感受着下体的城市如同沙砾一般慢慢融化在自己的爱液之中，平复了些心情的希瞳抬起了双腿，将自己脚上的丝袜连根脱下，将自己的那一对裸足公之于众。随后，她便站了起来，拍了拍围裙之上因为自己意外巨大化而沾染上的各种城市残骸。\n“那就随你们愿吧~好好的感受一下，希瞳的美妙裸足哦？”\n像是挑衅一般......希瞳用自己的裸足，遮蔽了小人们的天空。\n“听说你们的肉泥包养脚底也是很不错的护肤品呢......算了，你们没那么值得。”\n这样说着的希瞳，拎着自己的一双丝袜，下意识的向着附近的“小池塘”走去，不过，她却突然发现了更有意思的东西——一座机场，并且，还是挤满了人的机场。\n“看起来还挺大的呢......不过，也就是两脚的事情吧？”\n因希瞳的高潮而产生的大量水汽，此刻正凝结成朵朵乌云，降下骚味的雨水。而现在，这阻碍着飞机起飞的小雨，则被“灾害”本人所驱走了。\n“本来还想用你们的水库好好的洗一下自己的袜子的，不过，既然你们刚好想要逃跑的话......”\n希瞳的脚底笼罩在了小人机场的上方，也剥夺了小人们最后一丝求生的可能。伴随着她脚底的晃动，砸下来的大块残渣便如同天上降下了陨石雨一般，袭扰着足底忙乱的机场。似乎只是为了好好的体会下这些所谓“求生者”想要活下去的欲望，希瞳的脚底，没有给那些小人一个死亡的爽快，反而是在寻找着什么。\n一架飞机，一架正在滑跑的小人飞机。\n“哦？是想要逃跑的小人先生吗？不错哦，能在希瞳的脚下存活这么久......现在，还是再给各位一次逃跑的机会吧？只要能逃出我的脚底的话......”\n发动机卷起着水雾，在发动机的前面形成了水雾，巨大的轰鸣响彻足底，努力的将这架飞机推离代表着死亡的少女足底。伴随着阴影一点一点逼近，无论是飞机上的乘客——还是机场里趴在窗户上观察着女仆足底的求生者们——都默不作声的，期待着那家飞机真能做到奇迹。\n本该巨大的飞机，现在却如同濒死的猎物一般，奔逃在她的足趾之下。\n伴随着那带一抹红色的飞机，优雅的抬起机头，或是那代表着神明的女仆忽然间发了一丝善心，抑或是各位小人的祈祷终于见效，在一片寂静之中，那架满载的客机，竟然真的从少女的脚底腾空而起，逃离了少女追赶着的五趾。\n“吗，既然你们这架还没我脚趾大的飞机如此努力，那作为女仆，就暂时放过你们吧？”\n正当航站楼里的大家为这架死里逃生的飞机欢呼雀跃的时候，少女的足跟却忽然之间落下，将刚刚滑到跑到之上，以及等待中的数架飞机，全部用足跟所压溃。\n“怯，你们是不是以为作为垃圾，意外跑掉一个就以为都能像他一样幸存了？”\n“反正你们都要被女仆所‘清理’掉的，不如就在我的足下乖乖就范吧？”\n伴随着希瞳的又一个宣言，那在少女眼中还没有自己指甲长的航站楼，便被少女的脚底如同推土机一般慢慢夷平。或许是少女的恶趣味，就算是分布在机场四处，那些放在露天的飞机和机库，也都没有幸免，被可爱的少女用脚趾，一个接一个的，拍碎在她圆润无暇的指纹之上。\n“本来还以为你们的城市确实没什么意思的，没想到到最后还能让我多发泄几下呢？”\n这样说着的希瞳，满意的抬起了自己的脚底，测过身来观摩着自己脚底之下的惨状。\n“看起来......万倍的我真厉害啊，光是用脚底随便踩踩就消灭了......二十几架飞机呢？比飞虫还要小的你们，真是可悲呢......”\n希瞳满意的放下了自己的脚底，朝着刚刚还看到的水库走去。
  gts_hitomi.121.a.desc: "\"As expected... you all really need to satisfy me properly...\" \\nGradually recovering from her climax, she lay across the city with a body ten thousand times its normal size. \\nThe research institute she had broken out of was now entirely gone—right beneath her enlarged heel, pounded into a massive impact crater by her shifting foot. \\n\"Hah... it's been so long since I felt this good... phew...\" \\nSnapping out of her post-climax daze, Hitomi struggled to sit up, only to be taken aback by her disheveled state. Between her legs lay a warm lake of fluids, forming one of the top twenty largest lakes on the planet within the ruins. Yet the girl's attention was not on how many tens of thousands of tinies had drowned beneath the sudden tsunami, but on her over-the-knee socks. \\n\"Eek! It's all your fault... my socks are completely soaked!\" \\nGrumbling with irritation, Hitomi scooped up another chunk of the city and pressed it into her unsatisfied crotch. \\n\"It's because of you perverted bugs that this maid has become so untidy...\" \\nFeeling the buildings melt like sand within her residual love fluid, Hitomi's mood cooled slightly. She raised her legs, pulled off her stockings entirely, and displayed her bare feet to the open air. Standing up, she brushed off the urban debris clinging to her apron from her sudden expansion. \\n\"Then have it your way~ Feel Hitomi's wonderful bare feet to your hearts' content!\" \\nAlmost mockingly, Hitomi's bare soles cast vast shadows across the tinies' sky. \\n\"I heard that paste made from your flesh makes for decent foot skincare... whatever, you're hardly worth the effort.\" \\nHolding her stockings, she instinctively headed toward a nearby 'puddle,' but suddenly noticed something far more amusing—an airport bustling with fleeing crowds. \\n\"Looks pretty big... but it's only a matter of a couple steps, isn't it?\" \\nVapor from Hitomi's climax had condensed into dark storm clouds, bringing down a light drizzle. Now, the rain delaying the flights was chased away by the catastrophe in person. \\n\"I originally wanted to use your reservoir to wash my socks, but since you're all eager to flee...\" \\nHitomi's sole loomed over the airport, extinguishing the survivors' last glimmer of hope. With a slight wiggle of her foot, falling boulders of debris showered the chaotic airfield like a meteor storm. Seemingly eager to savor their desperate will to live, she didn't crush them instantly, but searched for something specific. \\nAn airplane—a tiny passenger jet taxiing down the runway. \\n\"Oh? A little gentleman trying to take off? Impressive, surviving this long beneath Hitomi's feet... How about one last chance to escape? If you can outrun my sole, that is...\" \\nEngines screamed, kicking up water spray as the aircraft strained to clear the descending shadow of doom. As darkness closed in, passengers pressed against the windows, gazing in horror at the maid's titanic sole. \\n\"Going full throttle? Good effort... but far too slow!\" \\nHitomi chuckled softly as her big toe gently dropped down, pinning the nose of the plane against the tarmac. The fuselage buckled and exploded, and she casually dragged her toe across the runway, crushing dozens of aircraft and leveling the terminal in moments. \\n\"Looks like... at ten thousand times size, I'm truly unstoppable. Wiping out twenty-some planes with just a casual tap of my sole? You're even more pathetic than flies...\" \\nSatisfied, Hitomi set her foot down and turned toward the reservoir she had spotted earlier."
  #  心满意足的近乎全歼了那些妄想逃跑的小人之后，希瞳的一脚已经踏在了水库旁，另一只脚则好奇着的，轻轻的探入这片湖泊之中。试探着的少女将湖上无知的小船一起挤扁，令已经是一长串的击杀数字又多了几个无关轻重的小人。\n“总感觉你们的这个东西真是不像样呢？连没过我的脚尖都做不到吗？”\n看着脚下这片虽然勉强能够塞得下自己两只脚，却不过只能打湿自己脚底的水库，希瞳不由得有点小小的生气。不过吗，看着手中的丝袜，希瞳不由得又耍起了猫娘的小聪明。\n“既然足底放不下的话，那就......”\n“给各位小人们，做一杯你们从未见过的，世界上最大的丝袜奶茶吧？”\n伴随着少女的脚底脱离水面，那被少女脚底污染的已经有点浑浊不堪的水库，此刻又要面对着少女那更为庞大的丝袜陨落。\n在丝袜落地的海啸之中，建成了几十年，护佑了一方祥和安宁的水库，被少女的一只脏白丝，轻松的击溃了。巨量的湖水冲过了化为碎屑的水库，朝着下游那当地小有名气的沙滩冲去。巨量的散发着少女脚底恶臭，混合着那些从她脚底脱落残骸的湖水，席卷着那些曾经是一道风景线的游船码头，将原本游人不少的沙漠埋没其下，顺便将旁边那些依靠这不错风景当作卖点的小镇，一同变成了一片散发着少女脚臭的......沼泽。\n她不过只是把自己的丝袜，卷成了一团丢在脚下这小小的“水塘”之中，就顺便毁灭了一处旅游圣地，以及靠此为生的近两万人。\n“不过，只是用丝袜就造成这么大破坏的话......”\n觉得不够折磨小人的希瞳，寻找着自己的下一个猎物。
  gts_hitomi.122.a.desc: "Content after nearly wiping out all the fleeing tinies, Hitomi set one foot beside the reservoir while curiously dipping the other into the lake. Her probing toes crushed the ignorant pleasure boats on the water, adding a few more insignificant lives to her soaring kill count. \\n\"This thing really is pitiful, isn't it? It can't even cover my toes!\" \\nLooking down at the reservoir that barely held both her feet and only managed to wet her soles, Hitomi felt a twinge of annoyance. But glancing at the dirty stockings in her hand, the cat-girl's sly mind sparked with mischief. \\n\"If my feet won't fit, then...\" \\n\"How about I make you tinies the world's largest cup of stocking milk tea, something you've never seen before?\" \\nLifting her foot from the water, the reservoir already murky from her dirt was now forced to face the descent of her immense stocking. \\nIn the tsunami kicked up by the falling fabric, the reservoir dam that had guarded local peace for decades was effortlessly shattered by a single dirty white stocking. Colossal torrents surged over the smashed dam, roaring toward the popular resort beach downstream. Laden with the pungent stench of the maid's soles and crushed debris, the lake water swallowed docks, submerged dunes, and transformed scenic resort towns into a foul, foot-scented marsh. \\nBy merely rolling up her stocking and tossing it into the little 'pond,' she had casually destroyed a famous getaway and wiped out nearly twenty thousand souls who depended on it. \\n\"Still, causing this much devastation with just a stocking...\" \\nFeeling she hadn't tormented the tinies enough, Hitomi set off in search of her next prey."
  #  “哼哼~看起来居然都没那么害怕希瞳吗？明明都看到了如此巨大的女仆，居然还不愿意逃跑吗？”\n如此巨大的希瞳站在大学的旁边，即使是可以容纳十万学生的学校，此刻对于万倍希瞳的脚底也未免太小了一些。想着用脚底好好玩弄的她，却发现此时的自己仅仅只是抬起脚来，就发现自己光光是用一只裸足，就足以扫清还滞留在大学里的数万小人。\n“这么小的学校，光是只用一脚踩死你们的话，总感觉太对不起你们的学识了呢？”\n希瞳蹲下身来，仔细打量着脚趾之前的这些“聪明人”们。\n“这么晚才意识到自己的命运吗？果然是读书读傻了呢......”\n端详着那些在校园之中四处奔逃的学生，希瞳用手指，一栋又一栋的戳碎着其中的建筑物。明明是如此优雅的红砖房，可在希瞳那撼天动地的手指之下，却如同沙琪玛一般易碎。有时，希瞳忽然恶趣味一些，便等着其中的小人逃出半数以上，再用自己的手指戳爆他们所在的建筑——当小人们正窃喜于自己的幸存时，再用自己的指尖——一下抹去他们的生命。\n“看起来得好好折磨你们呢......嗯？”\n看着那些尝试躲入体育馆之中的学生们，眼尖的希瞳忽然之间想到了什么。\n“体育馆有什么好躲的~来女仆暖和的袜子里吧？”\n邪恶的希瞳向前挪了挪身体，把自己那只脱下的丝袜展现在了小人们的面前。还冒着少女气息的丝袜，在小人的学校上空微微的晃动着，将少女积累已久的味道散发到大地之上。浓郁的臭味席卷了整座学校，在场的所有人的不禁咳嗽起来。\n“要不，就到我的丝袜里来研学吧？”\n希瞳用手指勾开了自己的白丝袜口，笼罩在满是师生的体育馆上面。想着在丝袜的闷臭之中逐渐招架不住倒在地上的小人们，希瞳的内心便是一阵窃喜。\n“各位看来连自己爬进女孩子丝袜的能力都没有呢……还得女仆亲自接各位进来吗？”\n巨大的手掌挖入地底，将比自己手指稍大一点的体育馆和其他几个建筑都纳入其中。\n“嗯……居然还有图书馆吗？”\n“也罢，你们既然都不了解我的话，那么就到希瞳的丝袜里亲自体验下吧?”\n希瞳轻笑着，将手中的校园倒入自己的丝袜之中。体育馆还是图书馆，都在希瞳的丝袜内壁之上摔散开来。伴随着学生和图书漫天飞舞，其中躲藏的近万人，便都随着重力落到了少女丝袜的底部。在希瞳浓郁的臭味之中了，努力的在有些发黄的丝袜内壁之上挣扎着，但当幸存者抬头仰望之时，一股绝望便映入眼帘——少女正微笑着看着丝袜之中的他们，而这双有着上千米长的袜口，却是自己倾尽所能都无法逃出的囚笼。\n“就这样在我的丝袜里呆下去吧~愚笨的小人们~”\n一边说着，一边看着那些还在四散奔逃的小人们，希瞳便直接用手中的丝袜当作高墙，将大学的校园围在其中。\n“你们还是太笨了——逃到其他地方也会被我碾碎的，不如就在我的足臭之中好好反省吧？”\n巨大的她不屑的抬起脚来，一片又一片的将大学周围所能看到的小人聚居区全部扫平。本来还以为逃到这里就能躲避被希瞳碾碎命运的人们，在希瞳报复一般的双脚扫荡之中，彻底的消逝在了她的足弓之下。\n“果然变大之后，你们这些小人就更经不住玩了呢？”\n已经如此巨大的希瞳，终于是能将城市当作草坪一般践踏的存在。
  gts_hitomi.123.a.desc: "\"Heh heh~ You don't seem all that afraid of Hitomi, do you? Seeing such a colossal maid right here, and you still refuse to run?\" \\nColossal Hitomi stood beside the university campus. Even a school built for a hundred thousand students was far too miniature beneath her 10,000-fold feet. Planning to toy with them using her soles, she realized that simply lifting one bare foot would be enough to sweep away the tens of thousands of tinies stranded on campus. \\n\"For such a tiny school, crushing you with a single step would hardly do your intellect justice, wouldn't it?\" \\nHitomi crouched down, carefully scrutinizing the 'clever minds' before her toes. \\n\"Only realizing your fate this late? Studying truly made you silly...\" \\nWatching students scatter across the grounds, Hitomi poked and crumbled buildings one by one with her fingers. The elegant red-brick halls shattered like wafer biscuits under her earth-shaking touch. Occasionally indulging her cruel streak, she would wait until more than half the tinies had fled a building before poking it to pieces—wiping out their lives with a fingertip just as they rejoiced over their narrow escape. \\n\"Looks like I should torment you properly... hmm?\" \\nSpotting crowds rushing into the gymnasium, the sharp-eyed cat-maid had an idea. \\n\"What's the point of hiding in a gym? Come into your maid's warm stocking instead!\" \\nThe wicked Hitomi shifted forward, presenting her discarded stocking before the little people. The fabric, still radiating her warm scent, swayed gently above the school, casting her accumulated aroma over the earth. The pungent odor swept through the campus, sending everyone into coughing fits. \\n\"Why not hold your seminar inside my stocking?\" \\nHitomi hooked open the cuff of her white stocking with a finger, dangling it over the crowded gymnasium. Imagining the tinies collapsing under the suffocating stench brought a thrill of delight to her heart. \\n\"You can't even crawl into a girl's stocking on your own... does your maid have to pick you up personally?\" \\nHer massive palm dug into the earth, scooping up the gymnasium and adjacent structures like pebbles. \\n\"Hmm... there's even a library?\" \\n\"Oh well, since none of you understand me, experience it for yourselves inside Hitomi's stocking!\" \\nHitomi chuckled, pouring the captured campus straight into her stocking. The gymnasium and library smashed apart against the interior walls. Amidst flying books and scholars, nearly ten thousand trapped souls tumbled down to the very toe of the stocking. Surrounded by her overwhelming scent, they struggled desperately against the yellowed fabric. But looking up, utter despair greeted them—the girl smiling down at them, the towering cuff a thousand meters above forming an inescapable prison. \\n\"Just stay inside my stocking~ foolish little people~\" \\nWaving the stocking like a barricade around the remaining campus, she watched the scattered survivors in amusement. \\n\"You're still too foolish—running anywhere else will just get you crushed, so reflect on your mistakes amidst my foot odor!\" \\nLifting her foot disdainfully, the giant maid leveled one settlement after another around the university. Those who thought they could escape her wrath vanished completely beneath the sweep of her vengeful arches. \\n\"As expected, once I get this big, you tinies can't handle any playtime at all, can you?\" \\nNow colossal beyond measure, Hitomi could finally treat entire cities like mere grass beneath her feet."
