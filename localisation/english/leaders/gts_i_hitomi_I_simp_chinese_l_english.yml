  gts_hitomi.8.desc: "Hitomi, over 1700 meters tall, sat cutely in the city, boredly looking for her next target.\\\\n\\\"You're all too weak~ You can't resist, and as for escape, where could you possibly go?\\\"\\\\nHitomi gently swayed her feet, as if crushing a colony of ants, repeatedly slamming her heels into the streets of the tiny people. The crowd fled in all directions beneath her giant body like headless flies, but Hitomi merely had to slam her heels down gently to turn a crowd of dozens, along with the surrounding buildings, into dust with her thick, long shoe heels.\\\\n\\\"It's completely boring... oh well, I'll just have to let you experience it in advance.\\\"\\\\nSo saying, the girl, bored, hooked her shoe heel with her fingertip. Accompanied by a strong scent enveloping the land, Hitomi's slightly yellowed white silk stockings were pulled out of those Lolita leather shoes. Accompanied by a thick scent, the tiny people hiding in the buildings and underground couldn't help but cover their noses.\\\\n\\\"Hmm? Don't you all think this stinky smell is wonderful?\\\"\\\\nPinching the shoe upper with her fingers, Hitomi thought for a moment and then threw her giant shoes away as if casually. Amidst the roaring, the giant shoes landed heavily in the city, the rolling and flipping shoe bodies flattening the fleeing tiny people along with the prosperous blocks. All that remained were those wall-like, dirty shoe soles still sticking with various architectural tiny people and car wreckage.\\\\n\\\"Hehe? Is that all you've got? Well then, please keep the other shoe safe too.\\\"\\\\nThe giant shoes, even if they looked like plain high-heeled Lolita shoes, still had world-destroying weight at a thousand times the size. The shoes landing heavily actually managed to maintain their upright position. Standing in the city, the shoes were quite enormous even compared to the most towering buildings in this city. And those shopping malls and residential buildings that Hitomi could once play with were now merely boring buildings the size of her toes. More giantized now, she needed more interesting structures to vent properly.\\\\n\\\"Hmm? You've all escaped here? Are you waiting for me to sweep you all away at once?\\\"\\\\nLooking around, Hitomi suddenly discovered something among the uninteresting gray buildings.\\\\n\\\"My... there are quite a lot of them.\\\"\\\\nThe girl turned around, her giant legs spanning several blocks, slamming down one on each side of the stadium. The tens of thousands of remaining people in the stadium... thought they had already escaped the girl's sight, looking up once more to be met with the girl's malicious grin and her pair of big stinky feet that were gently swaying.\\\\n\\\"Ugh...\\\"\\\\nWhat was the stadium to Hitomi at this moment? Such a building could indeed be stepped on a few times, but Hitomi, struck by a playful mood, didn't want to let the little people before her die so easily.\\\\n\\\"Since you've had the luck to be chosen by me, well, you must look up well at your returning...\\\"\\\\nHitomi gently bit her lip and said the phrase she always wanted to say.\\\\n\\\"'Goddess', you know.\\\"\\\\nSitting on the ground with her legs bent, the girl gently lifted her left foot. Those feet, which had been bound for a thousand years, were now displayed before everyone without any cover. A thousand years of accumulated resentment was like this foot odor; the yellowed soles and the giant toes hooking the stockings all manifested the past of this maid who once ruled this planet.\\\\n\\\"Not bad, you actually managed to escape here? Truly not bad at all~ Take a look at your comrades, they weren't so lucky.\\\"\\\\nHitomi bent down slightly, pointing with her finger at the trash unfortunately crushed and stuck to her soles.\\\\n\\\"The cities of you little guys are quite colorful, aren't they?\\\"\\\\nHitomi pointed at the ruins stuck to her soles, mocking them one by one.\\\\n\\\"It seems you people are truly desperate, though it makes it easier for me to flatten you with one foot.\\\"\\\\nSomewhat provocatively, she said this while stripping off various small cars crushed into iron sheets stuck to her soles, throwing them to the side of the stadium. While mocking those who were overestimating themselves and were crushed by one blow from her heels, she felt the fear and admiration of the tens of thousands beneath her crotch toward her.\\\\n\\\"Hmm? Did I say you could leave?\\\"\\\\nSuddenly, Hitomi saw something. It was over a hundred people fleeing beneath her foot. Even though they were shrouded in the shadow of her lifted left foot, they fortunately thought the giant maid simply wouldn't notice their existence. Unfortunately, Hitomi, who had already killed hundreds of thousands of people, was naturally used to such ant-like scrambling. Accompanied by the giant heel slamming into the crowd in an instant, Hitomi, laughing, used her heel like a pestle to ground things, spinning and crushing heavily among the crowd. Watching the remaining tiny people flee in all directions, she, addicted to slaughter, used her vast power to crush every single tiny person near her feet who dared to flee into indistinguishable minced flesh with her heels.\\\\n\\\"How was it? This is the fate of those who dare to escape... you foolish insects~\\\"\\\\nLifting her foot again, Hitomi's heel was dripping with human mixture. This cruel and bloody scene made the tiny people seeking refuge in the stadium retreat repeatedly. Watching the scene of the tiny people scared out of their wits beneath her feet, Hitomi even more arrogantly pressed the stadium like a giant egg with the soles of her feet, constantly swatting the already fragile refuge with both her feet.\\\\n\\\"Hehe~ You're truly weak, aren't you? You can't go anywhere, you can't resist, and you can only expose your most unsightly side to your god of destruction.\\\"\\\\nAs Hitomi's feet lay flat on the giant dome of the stadium, the remaining less than ten thousand people... were experiencing the treatment of being footpad insects beneath Hitomi's soles. Every breath was a thick scent of Hitomi's long-accumulated foot odor, concentrated enough to leave one breathless. Fortunately, Hitomi as a giant maid wasn't so terrible as to be able to take a person's life with just foot odor. But under the torture of this dark and moist foot odor, even the most resilient tiny people had to give in beneath Hitomi's feet.\\\\n\\\"However, you're not of much use anymore anyway...\\\"\\\\nHaving finished her play, Hitomi finally remembered her task of exterminating the humans. As the sitting girl clamped both her feet on both sides of a stadium, even the widest street was now too narrow for her calves. And in the stadium at the center of her soles, no one dared to flee anymore, preferring to face the fate of being crushed by this giant maid before them.\\\\n\\\"Crack——\\\"\\\\nAt the moment her feet closed, the stadium with its egg-like milky white shell... was completely crushed beneath her feet. Unsatisfied, she rubbed her feet a few more times until she could no longer feel any signs of life between her feet and then stopped.\\\\n\\\"As expected, just a bunch of foolish insects. They're even afraid of seeing my giant soles wrapped in white silk.\\\"\\\\nHaving completely exterminated the ten thousand tiny people in this \\\"refuge\\\" with both feet, she satisfiedly lifted one of her feet. The dome and seat wreckage shook off from the soles of her feet like crumbs, leaving only those tents soaked in blood and patches and patches of red dots that were once tiny people.\\\\n\\\"I didn't expect you tiny people to be so small. You weren't even as interesting as those who ran away...\\\""
  gts_hitomi.8.a: "Continue observing"
