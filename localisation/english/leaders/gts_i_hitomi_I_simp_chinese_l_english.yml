  #  “嗯哼？既然到了这里的话，那希瞳可就要好好嘉奖大家了呢？”\n看着希瞳露出内裤，已经让不少小人们兴奋不已了，但希瞳接下来的动作，更是让那些高耸大楼里的小人们大惊失色。作为女仆的她，正毫无保留的，将那条沾染了她爱液的白色胖次褪到了膝盖，然后随意的丢在了这片繁华的街区之上。\n厚实的棉布胖次，像是白色的巨幕一般，毫不留情的覆盖了数个街区。那些逃避不及而被胖次压在身下的小人们，只能任由那布料之上的爱液和汗水的混合物，作为希瞳给他们的奖励，将自己最后的一丁点生命一并夺走。希瞳那毫无遮拦的私处，正散发着浓郁的热气，将小人的摩天大楼们，笼罩在了一层湿润的爱意之中。\n“各位，想要看看身为女神自慰的样子吗？”\n希瞳坏笑着，慢慢的俯下身去，那巨大的阴部便像是面对着猎物的巨口一般，紧紧地贴合在已经快要垮塌了的高楼群上。\n伴随着希瞳身体的一次又一次的挺进，那些屹立在云层之上方的摩天大楼，就像是这可爱女仆自慰的转珠一般，不仅作为发泄欲望的道具，还要承受来自希瞳这成神躯体的恐怖挤压。希瞳不断的扭动着自己的臀部，让那柔软而结实的一瓣瓣肥肉，在建筑的残骸之中无情地撞击着。哪怕是曾经作为地标的建筑，在希瞳的胯下，也不过是稍稍能增加一丁点快感的消耗品罢了。每伴随着希瞳的一次娇喘，都会有上万的小人，成为希瞳身上滑落的汗液和春水的亡魂。
  #  “所以，剩下来的各位小家伙们，可不要像这些笨蛋一样无知呢……希瞳~会心怀感激收下各位卑微生命的~”\n伴随着希瞳的宣言，巨大的希瞳，屹立在这座城市残存的天际线上，从湿透了的胖次上滴落下来的爱液，已经如同暴雨一般先行一步，给那些困在大楼里的小人们一点小小的巨娘震撼。\n“既然大家都逃不掉的话，那我可要好好得评鉴一下各位的生命，究竟可以承受多少来自希瞳的爱呢？”\n巨大的希瞳，轻轻的将臀部坐在城市之上。伴随着那一丝胖次被少女揭下，少女端详着，滴落着爱液的白色系带胖次。\n“总感觉光是我的胖次的话，就能把你们全歼了呢~不过，既然各位都自愿被我用掉的话，作为各位的巨大女仆，可不能就这样让各位这么无趣的死去呢......”\n正说着话的巨大希瞳，却被突如其来的蚊虫们所骚扰。匆匆赶到的小人机群，如同撒粉一般将各式炸药丢下，试图从希瞳的邪恶猫爪之下拯救自己的子民。\n“不错吗？居然没有想着玩谋略，而是希望正面击败我吗？有点意思喵？”\n刚好找到了自己目标的希瞳，紧接着就将自己手中的胖次甩了出去。\n“希望你们喜欢女仆的胖次哦？只希望你们的先进武器不要就这样被我全歼了呢......”\n铺天盖地如同蝗虫一般的机群，被更为巨大的少女胖次，轻而易举的捕获。纵使是千余架飞机组成的庞大波次，也终究不敌一位千倍少女正滴着爱液的内裤。伴随着飞机的残骸和胖次一同落地，干净利落的消灭了反抗军的希瞳，终于能将自己的玩弄欲望，尽数发挥在双腿之间的繁华街区上。\n“你们的大楼现在真的挺小啊~，要多少才能填满我的阴道呢~”\n希瞳坏笑着，另一只磨蹭着小“鲍鱼”的手，将已经等候多时的阴唇，展现在小人们的面前。被拿起的大楼布满了裂纹，被爱液蒸汽所晕染着，感受着那些小人从挣扎再到彻底绝望的过程，希瞳舔了舔嘴角，便将各位受害者们，送入了自己的外阴之中。伴随着阴唇逐渐的合拢，再张开，上百人的生命所能带来的，不过是那些建筑被自己本能所挤压破碎的酥麻感而已。\n“还不够......一点都不够呢？”\n伴随着越来越多的建筑物和人类被送入她的阴道之中，不断分泌出的爱液逐步将那些在建筑残骸之间得以幸存的小人们，化为一滴又一滴巨大而又粘稠的琥珀。本该晶莹剔透的爱液，此时却因为混杂了小人的浮肿尸体，和各种建筑的残骸变的浑浊不堪。\n“该说，虽然是千年以来第一次，但是你们的抵抗......还是有点不能让女仆满意呢......”\n明明是该完全靠击杀敌人的爽快感来达成高潮的希瞳，此时却自顾自的扣了起来。城市当中被当作纪念品售卖的，闪耀着金属光辉和各种网状结构的高塔，被少女轻而易举的连根拔起。\n“不错吗……居然不是一拿就差点碎掉了吗~果然我的眼光还不错呢？”\n希瞳满意的看着手中的高塔。虽然有了点变形，却依然比自己的手掌和脚掌都更为细长。虽然自己已经如此巨大，但是小人们的建筑技艺，显然比他预估的还要更为强大了不少。\n“这么个高塔……就让我看看效果如何吧？”\n作为地标性建筑的巨塔，化作了少女的假阳具，被送入了双指撑开的小穴之中。银白色的天线，在少女那柔嫩的宫颈口上折断。伴随着少女的娇喘，本该优雅华丽的塔身，正被少女的阴道壁所扭曲重塑。伴随着冰凉的塔身在自己的下体之中一抽一插，欲望高涨的她，几乎是用所能触及到的一切小人之物，来满足着自己的欲望。\n性情大发的希瞳，甚至是直接挖起了身旁那些小巧了不少的街区，一同倒入自己下体的“血盆大口”之中。就算是驶过的电车，也被少女一捏抓起搓揉成团，然后，粉碎在了自己的阴蒂之上。如同熟透的果实一般爆开在自己阴蒂上的小人列车，那对少女来说冰凉了不少的列车和鲜血，令希瞳不由得忍不住自己想要喷射出什么的欲望。\n“你们好小……好脆弱……就这样给我献出一切吧！”\n伴随着少女响彻天际的娇喘，终于得以享受这番快感的她却没有好好的管好自己的身体，伴随着巨大的她喷射出的尿液，身体也无法在这番愉悦下控制自己的巨大化能量，原本繁华的街区，被自己不断膨胀着的巨大身体所推平。温热的尿液，则一次又一次的涌出，洗刷着身下本该是城市的造物。\n“如此......失态......”\n伴随着希瞳不受控制的放尿，这座为了控制她而建立起来的城市——彻底的在少女的巨大潮吹之中华为冒着热气的沼泽。恼怒的少女虽然失去了大半意识，却还保留着自己千年以来的愤怒。\n“都是你们！要不是你们囚禁我的话......”\n变化到常人万倍大的她，将所有的过错都归咎于这帮作为敌人的小人文明之上。伴随着巨大的她重新站起，原本应该繁华的城市，现在也只配当她巨足践踏下的小小苔藓。\n“居然能让我如此失态......看我不把你们的国家踩个稀巴烂！”\n如此说着的少女，正开始了自己针对小人文明的猎杀，却被快感所冲晕了过去。
  gts_hitomi.120.a.desc: "\"So, remaining little ones, don't be as ignorant as those fools... Hitomi~ will gratefully accept all your humble lives~\" \\nAccompanied by Hitomi's declaration, the colossal maid stood tall against the city's surviving skyline. Droplets of love fluid seeping from her soaked panties cascaded down like a torrential storm, delivering a tiny bit of giantess shock to the little people trapped in the skyscrapers. \\n\"Since none of you can escape, I should properly evaluate your lives—just how much of Hitomi's love can you truly endure?\" \\nThe massive Hitomi gently settled her buttocks upon the city. Peeling off her white ribbon panties, she scrutinized the delicate fabric dripping with love fluid. \\n\"It feels like my panties alone would be enough to wipe you all out~ But since you've volunteered to be used by me, as your giant maid, I can't let you die in such a boring way...\" \\nMid-speech, the colossal Hitomi was harassed by sudden buzzing insects. A fleet of tiny aircraft rushed in, dropping bombs like dusting powder in a desperate bid to rescue their people from the wicked cat-maid's paws. \\n\"Not bad! Rather than playing tricks, you actually hope to defeat me head-on? Quite interesting, meow?\" \\nHaving found her target, Hitomi immediately flung the panties from her grasp. \\n\"Hope you enjoy the maid's panties! Let's just hope your advanced weapons aren't wiped out completely...\" \\nThe locust-like swarm of planes was effortlessly ensnared by the immense panties. Even an armada of over a thousand aircraft was ultimately no match for the soaked underwear of a thousand-fold girl. As the wreckage crashed alongside her panties, Hitomi, having neatly wiped out the resistance, was finally free to indulge her playful desires across the bustling blocks between her thighs. \\n\"Your skyscrapers really are tiny now~ How many would it take to fill me up?~\" \\nHitomi grinned wickedly, revealing her parted folds to the little people below. The skyscrapers she plucked were covered in cracks, glazed in warm vapors. Watching the victims transition from frantic struggle to utter despair, Hitomi licked her lips and drew them against her intimate depths. As her petals parted and closed, the sacrifice of hundreds brought nothing more than a faint tingling numbness from the crushed buildings beneath her instinctual pressure. \\n\"Not enough... not nearly enough!\" \\nAs more structures and humans were fed into her embrace, the continuously flowing love fluid gradually encased the surviving tinies into thick, viscous amber drops. What should have been crystal-clear fluid grew murky, churning with the ruined debris and swollen bodies of the little people. \\n\"I must say, for the first time in a thousand years, your resistance... still leaves your maid rather unsatisfied...\" \\nSeeking greater stimulation, she plucked a landmark tower glistening with metallic mesh right from its foundations. \\n\"Oh? It didn't even crumble upon being picked up? Looks like my eye for toys is quite good!\" \\nHitomi admired the spire. Though slightly warped, it was far longer and slender than her hands or feet. The little people's architectural feats had exceeded her expectations. \\n\"Such a tall tower... let's see how well it works!\" \\nThe landmark was turned into a makeshift toy, guided into her parted depths. Its silver-white antennae snapped against her tender inner walls. Amidst her soft gasps, the once-majestic spire was buckled and reshaped by her squeezing walls. With the cold metal sliding within her, her desires surged, and she used virtually every tiny thing she could reach to satisfy her longing. \\nCaught in intense arousal, Hitomi scooped up surrounding neighborhoods and poured them into her hungry abyss. Even passing trains were pinched, rolled into balls, and crushed against her sensitive center. The bursting of tiny trains and passengers against her flesh sent chills of pleasure coursing through her, unleashing an uncontrollable desire to erupt. \\n\"You're so small... so fragile... surrender everything to me!\" \\nWith a sky-shaking cry of release, her soaring pleasure shattered her control over her giantization energy. A massive torrent surged forth as her expanding body bulldozed the surrounding metropolis. Scalding fluids repeatedly flooded the surface, submerging what was once a civilization. \\n\"Such... a disgrace...\" \\nUnder her uncontrollable deluge, the city built to contain her was completely transformed into a steaming swamp under her overwhelming climax. Though hazy from the sheer intensity, the enraged maid still harbored her thousand-year grudge. \\n\"It's all your fault! If you hadn't imprisoned me...!\" \\nNow swollen to ten thousand times normal scale, she blamed the entire catastrophe on the enemy civilization. Rising to her feet once more, the once-glamorous city was now reduced to mere moss beneath her giant soles. \\n\"To make me lose composure like this... see if I don't trample your entire country to dust!\" \\nVowing vengeance, the girl set out on her hunt, before the sheer afterglow finally caused her to swoon."
