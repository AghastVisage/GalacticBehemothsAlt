  gts_hitomi.30011.name: ""
  #  我方舰队抵达目标坐标后，密密麻麻的舰队正在等待。所有舰船都以极其精确的阵列排列，如同某个巨大意识延伸出的肢体。随后，星系中央亮起一道贯穿恒星轨道的全息投影。\n三月希瞳出现在那里。\n她的身影被放大到近乎天体级别，白蓝色的装束被机械化装甲覆盖，猫耳与尾巴也被高维光带与金属结构重构。她静静悬立在星系中央，低垂着眼眸，俯视着我方舰队。\n在她面前，战列舰也不过像漂浮在掌心边缘的微小光点。\n她缓缓抬起手。\n星系内的无主舰队随之启动，引擎光芒像群星一样亮起。\n“结论：检测可以开始。”\n“我是三月希瞳。”\n“无心之猫。”\n她的目光落在我方旗舰之上。那一瞬间，舰桥内所有人都产生了一种错觉：并不是我们在进入这个星系，而是整个舰队被她放进了某个精密实验器皿之中。\n“来吧，小小的文明。”\n“证明你们仍有被记录的价值。
  gts_hitomi.30011.desc: "After our fleet arrived at the target coordinates, densely packed fleets were waiting. Every ship was arranged in an extraordinarily precise formation, like limbs extended from some vast consciousness. Then, in the center of the star system, a holographic projection lit up, spanning the orbit of the star.\\nMitsuki Hitomi appeared there.\\nHer figure was enlarged to an almost celestial scale. Her white-blue outfit was covered in mechanized armor, and her cat ears and tail had been reconstructed with higher-dimensional light bands and metallic structures. She hovered silently in the center of the system, eyes lowered, looking down upon our fleet.\\nBefore her, even battleships were no more than tiny points of light floating near the edge of her palm.\\nShe slowly raised a hand.\\nThe ownerless fleets within the system activated in response, their engine lights flaring like stars.\\n\"Conclusion: testing may begin.\"\\n\"I am Mitsuki Hitomi.\"\\n\"The Heartless Cat.\"\\nHer gaze fell upon our flagship. In that instant, everyone on the bridge had the same illusion: it was not that we had entered this star system, but that our entire fleet had been placed by her into some precise experimental vessel.\\n\"Come, little civilization.\"\\n\"Prove that you still have value worth recording."
  #  全舰队，进入战斗状态。
  gts_hitomi.30011.a: "All fleets, enter combat readiness."
