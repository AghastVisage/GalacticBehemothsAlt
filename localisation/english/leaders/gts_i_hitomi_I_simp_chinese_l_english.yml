  #  “嗯哼？既然到了这里的话，那希瞳可就要好好嘉奖大家了呢？”\n看着希瞳露出内裤，已经让不少小人们兴奋不已了，但希瞳接下来的动作，更是让那些高耸大楼里的小人们大惊失色。作为女仆的她，正毫无保留的，将那条沾染了她爱液的白色胖次褪到了膝盖，然后随意的丢在了这片繁华的街区之上。\n厚实的棉布胖次，像是白色的巨幕一般，毫不留情的覆盖了数个街区。那些逃避不及而被胖次压在身下的小人们，只能任由那布料之上的爱液和汗水的混合物，作为希瞳给他们的奖励，将自己最后的一丁点生命一并夺走。希瞳那毫无遮拦的私处，正散发着浓郁的热气，将小人的摩天大楼们，笼罩在了一层湿润的爱意之中。\n“各位，想要看看身为女神自慰的样子吗？”\n希瞳坏笑着，慢慢的俯下身去，那巨大的阴部便像是面对着猎物的巨口一般，紧紧地贴合在已经快要垮塌了的高楼群上。\n伴随着希瞳身体的一次又一次的挺进，那些屹立在云层之上方的摩天大楼，就像是这可爱女仆自慰的转珠一般，不仅作为发泄欲望的道具，还要承受来自希瞳这成神躯体的恐怖挤压。希瞳不断的扭动着自己的臀部，让那柔软而结实的一瓣瓣肥肉，在建筑的残骸之中无情地撞击着。哪怕是曾经作为地标的建筑，在希瞳的胯下，也不过是稍稍能增加一丁点快感的消耗品罢了。每伴随着希瞳的一次娇喘，都会有上万的小人，成为希瞳身上滑落的汗液和春水的亡魂。
  gts_hitomi.120.a.desc: "'Hmm? Since we've arrived here, Hitomi should reward everyone well, shouldn't she?'\\nSeeing Hitomi expose her panties already had many little people excited, but her next actions were even more shocking to those inside the skyscrapers. As a maid, she went all in, sliding her white panties—now stained with her love juices—down to her knees and then casually tossing them onto the prosperous district.\\nThe thick cotton panties, like a massive white curtain, relentlessly covered several blocks. Those little people who couldn't escape and were crushed beneath the fabric had to let the mixture of love juices and sweat on the cloth—Hitomi's reward to them—take away the last bit of their lives. Hitomi's uncovered private area was emitting intense heat, enveloping the skyscrapers of the little people in a layer of moist affection.\\n'Everyone, want to see what a goddess looks like when she masturbates?'\\nHitomi grinned wickedly and slowly leaned down. Her massive vulva, like the giant mouth of a predator facing its prey, pressed tightly against the clusters of tall buildings that were on the verge of collapsing.\\nWith each of Hitomi's thrusts, the skyscrapers standing above the clouds became like the rotating beads of this cute maid's toy. They served not only as props for venting her desire but also had to endure the terrifying pressure from Hitomi's godlike body. Hitomi continuously twisted her hips, letting the soft yet firm petals of her fleshy buttocks strike relentlessly amidst the wreckage of the buildings. Even buildings that had once been landmarks were merely consumables beneath Hitomi's crotch that could add a tiny bit of pleasure. With every one of Hitomi's moans, tens of thousands of little people became souls lost to the sweat and spring water sliding off her body."



