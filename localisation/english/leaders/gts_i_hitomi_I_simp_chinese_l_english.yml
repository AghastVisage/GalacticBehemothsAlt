  gts_hitomi.30013.name: ""
  #  三月希瞳的身体在最后一处锚点被击穿后，终于停止了动作，横贯时空狭缝的星轨逐层断裂，那些曾经封锁战场的光带也在我方舰队前方化作无数蓝白色碎片，像失去温度的星云般缓缓散落；她低垂着眼眸，瞳孔中的光芒不断闪烁，通讯频道里只剩下断续而冰冷的杂音：“判定……模仿弱小人类的姿态与行动……对于战斗能力的提高……没有任何有效作用……损伤严重……系统关闭……”短暂的沉默后，她似乎仍想抬起手继续战斗，可那只足以遮蔽舰队的巨大手掌只是微微颤动，便在旗舰前方崩散成光点，“无法承认……失败……硬件……已超过耐久极限……”她的声音越来越轻，却像是在执拗地重复着什么，“即便如此……也要变强……即便如此……也要前进……变得更加强大……继续前进……”在最后一缕光从她眼中熄灭前，三月希瞳看向我方舰队，又像是看向更加遥远的尽头，“更强……更远……我想见证……不断进化的尽头……”通讯中断，巨大的投影彻底消失，时空狭缝内的一切随之陷入沉寂。
  gts_hitomi.30013.desc: "After the final anchor point was pierced, Mitsuki Hitomi's body at last stopped moving. The star tracks spanning the spacetime rift fractured layer by layer, and the bands of light that had once sealed off the battlefield shattered before our fleet into countless blue-white fragments, drifting down slowly like a nebula that had lost its warmth. Her eyes were lowered, the light in her pupils flickering constantly, while only intermittent, cold static remained on the communication channel: \"Judgment... imitating the posture and actions of weak humans... has no effective impact... on improving combat ability... severe damage... system shutdown...\" After a brief silence, she still seemed to want to raise her hand and continue fighting, but that enormous palm, large enough to cover the fleet, only trembled slightly before collapsing into points of light in front of the flagship. \"Cannot acknowledge... failure... hardware... has exceeded durability limits...\" Her voice grew softer and softer, yet sounded as though she were stubbornly repeating something. \"Even so... I must grow stronger... even so... I must move forward... become even stronger... continue forward...\" Before the last trace of light faded from her eyes, Mitsuki Hitomi looked toward our fleet, and also seemed to look toward some far more distant end. \"Stronger... farther... I want to witness... the end of endless evolution...\" The communication cut off. The colossal projection vanished completely, and everything within the spacetime rift fell silent."
