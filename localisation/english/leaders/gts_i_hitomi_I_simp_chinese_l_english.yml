l_english:
  #  随着我们的逐步靠近，我们为了避免被土著发现真实意图，伪装成了一颗彗星，不断地尝试接近这颗孕育着不同生命的蓝色星球。虽然从我们截获的情报来看，我们应该不过是被视作了一个有些奇特的天体，我们依然谨慎地不断借着这个星系其他星球的掩护，慢慢靠近着这颗有着一位不断地在梦境当中，尝试和我们联系的少女。\n“请......你们救救我。”\n随着科研船渐渐的靠近，我们也终于有了和少女直接在意识之中对话的能力。我们大致了解过这种灵能感应的手段，却没曾想过能在这个土著星系真正用上过。\n“我是......双月希瞳，你们可以叫我希瞳。”\n“我曾经是这个星球前文明的创造物，现在却被这个星球现文明可恶的小人种族利用，把我产生的能够巨大化的能量全部利用起来......”\n“这个地方，好小，好无聊。”\n“你们，能够帮助我，让我能够脱身出来吗？”
  gts_hitomi.2.desc: "As we gradually approached, we disguised ourselves as a comet to avoid having our true intentions discovered by the natives, continuously trying to get closer to this blue planet teeming with diverse life. Although intercepted intelligence suggested we were merely viewed as a somewhat peculiar celestial body, we remained cautious, slowly nearing the planet under the cover of other bodies in the system. On this planet, a girl was continuously attempting to contact us through dreams. \\n\\n\"Please... save me.\" \\n\\nAs the science ship neared, we finally gained the ability to communicate directly with the girl via consciousness. We had a general understanding of these psionic sensing methods, but we never thought we'd actually use them in a native system. \\n\\n\"I am... Xitong Shuangyue. You can call me Xitong.\" \\n\\n\"I was once a creation of this planet's previous civilization. Now, I am being exploited by the current civilization's detestable little people, who are using all the energy I generate for giantification...\" \\n\\n\"This place is so small, so boring.\" \\n\\n\"Can you help me? Let me escape from here?\""

  #   “就你，一个了吗？”\n身为女仆的她，在击退了几乎所有的，胆敢阻挡他的士兵们后，将那自己曾熟识的，曾经的“挚友”，但却出卖了自己，成为这个小人科学院院长的他，逼到了墙角之中。\n“我不是故意的！我......真的只是......”\n“真的不是故意的？就凭你能活到今天这个显而易见的事实，还打算继续蒙骗你的女仆吗？”\n穿着洛丽塔鞋的右脚轻轻地抬起，还沾着那些士兵被碾碎骨骼和血肉的鞋底，还在不断地向下滴着暗红色的鲜血。伴随着少女的威逼，她鞋底的棕色哑光厚底正顶着自己面前的这个叛徒。尽管那人正不断地求饶着，但是希瞳被关押了千年的恨意却并未消散一点。伴随着她收起的脚尖如同摆锤一般飞速落下，毫无抵抗之力的血肉之躯如同一节被碾碎的香肠一般爆裂开来。像是一颗鲜血的爆弹那般，同墙壁一起炸裂在了自己的鞋尖。\n“怯，还以为千年来你能有什么长进的，原来只有这点能耐吗？”\n少女左右晃动了自己的脚尖，将自己的脚同鞋子一同拔了出来。看着残留在自己鞋尖上的鲜血和骨骼，希瞳不由得嘟噜着。\n“十倍，对于彻底毁灭这个文明而言，还是太小了。”\n有些怨念的希瞳，用脚尖刮擦着一边的墙壁，将这小人的印记完全擦除。\n“解决了仇敌，那么也得把这个决议背叛自己的文明，一同扫除了才行。”
  #   “就你，一个了吗？”\n身为女仆的她，在击退了几乎所有的，胆敢阻挡他的士兵们后，将那自己曾熟识的，曾经的“挚友”，但却出卖了自己，成为这个小人科学院院长的他，逼到了墙角之中。\n“我不是故意的！我......真的只是......”\n“真的不是故意的？就凭你能活到今天这个显而易见的事实，还打算继续蒙骗你的女仆吗？”\n穿着洛丽塔鞋的右脚轻轻地抬起，还沾着那些士兵被碾碎骨骼和血肉的鞋底，还在不断地向下滴着暗红色的鲜血。伴随着少女的威逼，她鞋底的棕色哑光厚底正顶着自己面前的这个叛徒。尽管那人正不断地求饶着，但是希瞳被关押了千年的恨意却并未消散一点。伴随着她收起的脚尖如同摆锤一般飞速落下，毫无抵抗之力的血肉之躯如同一节被碾碎的香肠一般爆裂开来。像是一颗鲜血的爆弹那般，同墙壁一起炸裂在了自己的鞋尖。\n“怯，还以为千年来你能有什么长进的，原来只有这点能耐吗？”\n少女左右晃动了自己的脚尖，将自己的脚同鞋子一同拔了出来。看着残留在自己鞋尖上的鲜血和骨骼，希瞳不由得嘟噜着。\n“十倍，对于彻底毁灭这个文明而言，还是太小了。”\n有些怨念的希瞳，用脚尖刮擦着一边的墙壁，将这小人的印记完全擦除。\n“解决了仇敌，那么也得把这个决议背叛自己的文明，一同扫除了才行。”\n没有了维生舱的束缚，希瞳的身躯，终于可以随心所欲的将能量完全用在巨大化之上，她的身躯将薄弱的楼板撑裂，将承重柱如同木棍一般折断撑裂， 将自己的巨大化化作毁坏的力量，享受着那些愚蠢的科学家们，在躲避自己不断膨胀身躯时的不知所措，以及，最终连污损自己皮肤都做不到，也毫无反抗之法的——无力感。她的身体撑破了华美得穹顶，阴影逐步遮盖了大地。而展现在她面前的，则是自己还未曾享受过，却已经陷入混乱的现代化都市。
  gts_hitomi.5.desc: "\"Just you left?\" \\n\\nActing as a maid, after repelling almost all soldiers who dared block her path, she cornered her former 'best friend'—the man who had once known her well but had betrayed her to become the Dean of the Little People's Academy of Sciences. \\n\\n\"I didn't mean it! I... I really just...\" \\n\\n\"Didn't mean it? Based on the obvious fact that you've lived until today, do you plan to continue deceiving your maid?\" \\n\\nHer right foot, clad in a Lolita shoe, was slowly lifted. The sole, still covered in the crushed bones and flesh of soldiers, was dripping with dark red blood. As she pressured him, the brown matte thick sole of her shoe was pressed against the traitor before her. Although he begged for mercy, Hitomi's millenary resentment had not dissipated one bit. As her foot swung down like a pendulum at high speed, the defenseless body burst like a crushed sausage. Like a bomb of blood, he exploded against the wall at the tip of her shoe. \\n\\n\"Tch, I thought you might have made some progress over the millennium, but is this all you've got?\" \\n\\nThe girl shook her toes, pulling her foot and shoe out. Looking at the blood and bones remaining on her shoe tip, Hitomi muttered to herself. \\n\\n\"Ten times larger... it's still too small to completely destroy this civilization.\" \\n\\nWith some resentment, Hitomi scraped her toe against the side wall, completely erasing the mark of the little person. \\n\\n\"Now that the enemy is dealt with, the civilization that decided to betray me must be wiped out as well.\" \\n\\nWithout the constraints of the life-support pod, Hitomi's body could finally direct its energy entirely into giantization as she pleased. Her expanding form cracked the fragile floors and snapped load-bearing pillars like twigs, turning her growth into pure destructive power. She relished the panic of those foolish scientists trying in vain to dodge her swelling body, as well as their total powerlessness—unable even to smudge her skin, completely devoid of any means of resistance. Her body broke through the magnificent dome, her shadow steadily blanketing the earth. And laid out before her was a modern metropolis she had yet to enjoy, already plunged into chaos."
  #  “看来，你们的星球，已经几乎没什么能刺激到我的东西了呢……”\n巨大的希瞳，正以和星球一般高大的身躯，飘在地球之外的宇宙之中。宛若一只面对着好玩球体的猫猫，正端详着各个已经残破不堪的大陆。\n“真是……难以置信呢？明明都这么破坏了，没想到你们这些被称作‘人类’的小家伙，居然还存活下这么多呢？”\n棕发的希瞳猫猫，缓缓的挪动着自己的身躯。已经比任何大陆都要巨大的她，变成一片笼罩在人类文明上空的巨大而不可测的危险。\n“都变的这么大了~那么，希瞳对各位微生物们，就什么都可以做了吧？”\n这样说着的希瞳，缓缓的挪到了这颗星球的一头，面对着那个被茫茫冰雪所覆盖的大陆。\n“看起来就像很好吃的雪顶呢?稍稍舔一口的话，你们这些小家伙也不会立刻死掉吧。”\n希瞳轻轻地微调了自己的身子，粉嫩的舌头如同巨蛇一般，从她微张的双唇之间缓缓伸出。万年不化的冰雪，在希瞳口中微微吐出的热气之下逐渐融化。\n“也许，你们的星球，尝起来会很像好吃的。”\n这样想着的希瞳，伸出了巨大的舌头，缓缓的扑向眼前的皑皑雪原。巨大的她趴在这颗星球上，散发着热气的舌头，凿入了覆盖着冰雪的大陆之下。\n“轰隆隆隆隆——”\n比任何山脉还要巨大的舌头，缓缓的探入大陆之下的岩浆海之中。微热的感觉，令希瞳不由得兴奋不已。有着千米山川的大地，缓缓的被希瞳的舌头所托起，像是蛋糕上的奶油装饰一般，被勺子般的巨大舌头挖起，缓缓的被送入她的口中。\n“星球雪顶咖啡……其实也就一般吧。”\n炽热的岩浆，在她的舌尖上迅速和唾液混合凝固。冰冷的冰雪，被她口中的热气席卷迅速的化开，在她的舌头上缓缓的滑落进了更深处的黑暗之中。\n“呼……极地的味道就这样吗，那么，你们的国家，又是什么味道呢?”\n在众人绝望的注视之下，希瞳的巨大身体，再次挪动了起来。如此巨大，如此可怕的她，几乎是飘到哪个大陆上空，哪个大陆的人类就陷入被她阴影所笼罩的恐慌之中。\n或许是出于恶意，亦或是这巨大猫娘对背叛自己文明的嘲弄，总之，她的眼瞳——直接撇向了那个攻击自己最为猛烈的大陆。可悲的人类纵使是用尽全力，也不过是能让已经成神的希瞳注视一撇。\n“看来，你们攻击的很开心呢？吃起来的话，也会很不错吧。”\n坏坏一笑的希瞳，缓缓的将双唇靠近着面前大陆上最为繁华的城市。望着地上朝着自己飞来的上百颗弹道导弹，颇为无趣的希瞳邪魅一笑。\n“居然还觉得可以打退我吗？你们最先进的导弹，可是飞到现在都没办法接触到我的身体呢？罢了，也帮你们处理掉吧。”\n希瞳说着，再次伸出了自己的巨舌。小人的导弹需要飞行数十分钟的距离，在她的巨大身形下也不过是一瞬。火光在她吐出的舌头上接连爆炸，却无法阻挡那舌头一丝一毫，眼看着那粉嫩的舌尖将要和自己的城市来个亲密接触，不少士兵面对此情此景，下意识的落荒而逃。巨舌的舌尖，却仿佛是有了那么一丝怜悯一般，在小人们的城市顶上停了下来。那巨大的、湿漉漉的粉嫩舌尖，悬停在那座繁华都市的摩天大楼顶端，相距不过几百米。 地面上的幸存者们屏住了呼吸，有人跪地祈祷，有人瘫软在地，以为这位伟大的神明终究动了恻隐之心。然而，希瞳只是微微皱了皱那挺翘的小鼻子，粉红色的双眼闪过一丝嫌弃。\n“嗅嗅……好冲的味道。” 她收回了舌头，有些失望地嘟囔着。 “这种东西舔进嘴里，绝对会拉肚子的吧？”\n在人类从天堂跌回地狱的绝望目光中，希瞳直起了身子，伸出了那只能轻易覆盖大洋的白皙手掌，像是剥橘子皮一样，五指深深地扣入了那块反抗最激烈的大陆板块边缘。地壳发出了凄厉的悲鸣。希瞳的手腕发力，那块承载着数个强国、拥有数亿人口的大陆，就这样硬生生地被她从地幔上剥离了下来。希瞳张开樱桃小口，将这块巨大的“土饼”随手丢进了嘴里。随着上下颚的闭合，数千年的文明史在她的齿间化为粉末。高楼大厦是咯嘣脆的配料，山脉是稍微硬一点的骨头。 希瞳鼓着腮帮子咀嚼了两下，随即眉头紧锁。\n因为味道实在太干涩乏味，希瞳下意识地侧过头，朝着虚空狠狠地吐了一口唾沫。\n“啧，难吃死了。” 希瞳有些烦躁地甩了甩那条巨大的栗色长尾巴。她低头看着这颗已经被啃得坑坑洼洼的星球，似乎在寻找最后一点乐子。\n“也许……应该换一种‘吃’法？”\n她那双灵动的猫眼忽然亮了起来，尾巴灵活地卷起，末端的绒毛轻柔地扫过大洋，将一块相对完整的、岛屿众多的破碎板块卷了起来。 希瞳脸颊微红，带着一丝恶作剧般的羞涩，那双巨大的手缓缓撩起了蓝白运动短裙的下摆，露出了那包裹着纯白棉布的神秘三角区。\n“稍微……借用一下哦～”\n在星球上幸存者无法理解的、超越认知的恐怖画面中，那块巨大的陆地被她的尾巴送到了身下。 希瞳轻轻拨开布料，那道湿热、深邃的“蜜穴”缓缓张开。她腰肢轻摆，将那块岛屿陆地作为某种大号的玩具，缓缓地吞了进去。\n“嗯……凉凉的，有点粗糙……” 希瞳眯起眼睛，发出了一声甜腻的呻吟。对于人类来说是灭顶之灾的挤压，对她来说不过是稍微有点异物感的刺激。 几秒钟后，她便兴致缺缺地将那块已经沾满了爱液、被挤压得变形的陆地排了出来，任由它坠入茫茫星海。\n“也没什么意思呢。”\n希瞳叹了口气，那种名为“无聊”的情绪彻底占据了上风。 她抬起腿，坐在了虚空之中，开始脱脚上那只巨大的高跟女仆皮鞋。\n“既然不好吃，也不好玩，那就结束吧。”\n她赤着一只脚，那包裹着白色丝袜的玉足在星光下散发着微热的气息。希瞳恶趣味地将脚掌悬停在地球仅存的最后一块完整大陆上空，脚趾灵活地动了动。\n“比比看？你们引以为傲的疆域，甚至还没有我的脚心大呢。” 那巨大的袜底纹路，如同遮天蔽日的白色苍穹，让所有仰视的人类深刻体会到了何为渺小。\n“最后——彻底再见吧。”希瞳那巨大的大拇趾和二趾猛地张开，像是一个巨大的肉色钳子，精准地夹住了这颗已经濒临解体的残破星球。 板块在她的脚趾缝间崩裂，大气层被脚汗浸透。随后那夹住星球的两根脚趾——大拇趾与二趾，毫不留情地开始向中间并拢、错动。没有任何悬念，那颗行星在希瞳两根脚趾那毁天灭地的夹击力下，发出了最后的悲鸣。希瞳脚趾猛地一用力。伴随着一声沉闷且湿润的爆裂音，这颗行星终于承受不住这星球级的握力。曾经繁荣的城市、巍峨的高山、深邃的海洋，在这一瞬间统统被挤压成了无数燃烧的碎块和尘埃。那些星球的残骸混合着希瞳脚趾间的汗液，化作了一团黏腻的暗红色泥浆，顺着她白皙的脚背滑落，消散在冰冷的宇宙真空中。
  gts_hitomi.9.desc: "\\\"It seems your planet has almost nothing left that can stimulate me...\\\" \\\\n\\\\nExtremely large but cute, Hitomi was floating in space outside Earth, her body now as large as the planet itself. Like a cat facing an interesting sphere, she scrutinized the various broken continents. \\\\n\\\\n\\\"Truly... unbelievable. Despite such destruction, I didn't expect so many of you little things called 'humans' to still survive?\\\" \\\\n\\\\nThe brown-haired Hitomi cat-girl slowly moved her body. Now larger than any continent, she became a massive and unpredictable danger looming over human civilization. \\\\n\\\\n\\\"Since I've become so big~ then Hitomi can do anything to all you microorganisms, right?\\\" \\\\n\\\\nSaying so, Hitomi slowly moved to one end of the planet, facing a continent covered in endless snow and ice. \\\\n\\\\n\\\"It looks like some delicious snow-top ice cream. Just taking a small lick, you little things won't die immediately, right?\\\" \\\\n\\\\nHitomi slightly adjusted her body, and her pink tongue, like a giant snake, slowly extended from her parted lips. The millenary ice and snow began to melt under the faint heat exhaled from Hitomi's mouth. \\\\n\\\\n\\\"Maybe your planet will taste quite delicious.\\\" \\\\n\\\\nWith that thought, Hitomi extended her massive tongue and slowly plunged it into the white snowfield. Crouched over the planet, her steaming tongue dug beneath the ice-covered continent. \\\\n\\\\n\\\"RUMBLE——\\\" \\\\n\\\\nA tongue larger than any mountain range slowly poked into the magma sea beneath the continent. The faint warmth made Hitomi uncontrollably excited. Land with thousand-meter mountains was slowly lifted by Hitomi's tongue, like cream decoration on a cake, scooped up by her spoon-like tongue and slowly delivered into her mouth. \\\\n\\\\n\\\"Planetary snow-topped coffee... actually, it's just average.\\\" \\\\n\\\\nBlazing magma quickly solidified with saliva on her tongue tip. Cold ice and snow were swept away by the heat in her mouth and rapidly melted, sliding into the deeper darkness within her throat. \\\\n\\\\n\\\"Phew... is the taste of the pole just like this? Then, what do your nations taste like?\\\" \\\\n\\\\nUnder the desperate gaze of everyone, Hitomi's massive body moved again. So vast and terrifying, whichever continent she floated over, its people fell into the panic of her shadow. \\\\n\\\\nPerhaps out of malice, or perhaps as a mockery to the civilization that betrayed her, she turned her eyes directly toward the continent that had attacked her most fiercely. Even using all their might, pathetic humans could only earn a mere glance from Hitomi, who had already become a god. \\\\n\\\\n\\\"It seems you had fun attacking me. It should taste quite good then.\\\" \\\\n\\\\nWith a wicked smile, Hitomi slowly brought her lips close to the most prosperous city on the continent. Facing the hundreds of ballistic missiles flying toward her from the ground, the bored Hitomi let out a charming smile. \\\\n\\\\n\\\"You still think you can repel me? Your most advanced missiles haven't even been able to touch my body yet. Fine, I'll deal with them for you.\\\" \\\\n\\\\nHitomi said, extending her giant tongue again. The distance that required tens of minutes for the little people's missiles was but an instant for her. Fireballs exploded continuously against her extended tongue, yet they couldn't stop it by a fraction of an inch. Seeing the pink tongue tip about to have an intimate encounter with their city, many soldiers instinctively fled. Yet the tongue tip seemed to have a sliver of mercy, stopping at the top of the little people's city. That massive, moist, pink tongue tip hovered over the skyscrapers of the prosperous metropolis, less than a few hundred meters away. Survivors on the ground held their breath; some knelt in prayer, some collapsed, thinking this great goddess had finally felt compassion. However, Hitomi just slightly wrinkled her cute nose, a hint of disgust flashing in her pink eyes. \\\\n\\\\n\\\"Sniff sniff... such a pungent smell.\\\" She retracted her tongue, muttering in disappointment. \\\"Licking something like this into my mouth would definitely cause diarrhea, right?\\\" \\\\n\\\\nAs human eyes fell from heaven back into hellish despair, Hitomi straightened up and extended her fair palm that could easily cover an ocean. Like peeling an orange, her five fingers dug deep into the edge of the most resistant continental plate. The crust issued a piercing wail. With a twist of Hitomi's wrist, the continent—bearing several powerful nations and hundreds of millions of people—was forcibly peeled away from the mantle. Hitomi opened her cherry lips and casually tossed this massive 'soil cake' into her mouth. As her jaws closed, thousands of years of civilization history turned to powder between her teeth. Skyscrapers were crunchy toppings, mountains were slightly harder bones. Hitomi chewed twice with puffed cheeks, then furrowed her brow. \\\\n\\\\nBecause the taste was so dry and bland, Hitomi instinctively turned her head and spat a large glob of saliva into the void. \\\\n\\\\n\\\"Tch, tastes terrible.\\\" Hitomi flicked her massive, long brown tail in annoyance. She looked down at the planet, already bitten and cratered, seemingly looking for one last bit of fun. \\\\n\\\\n\\\"Maybe... I should try a different 'way' to eat?\\\" \\\\n\\\\nHer spirited cat eyes suddenly lit up, her tail flexibly curling, the soft fur at the tip gently sweeping over the oceans, picking up a relatively intact island-rich broken plate. With a faint blush on her cheeks and a mischievous shyness, her giant hands slowly lifted the hem of her blue and white sports skirt, revealing the mysterious triangular area wrapped in pure white cotton. \\\\n\\\\n\\\"Borrowing you for a bit~\\\" \\\\n\\\\nIn a terrifying scene beyond human cognition, the massive land was delivered beneath her by her tail. Hitomi gently parted the fabric, and the moist, deep 'honeyed aperture' slowly opened. She swayed her waist, slowly swallowing the island-land as a sort of oversized toy. \\\\n\\\\n\\\"Mmm... cool, slightly rough...\\\" Hitomi squinted her eyes, letting out a sweet moan. A squeeze that was a cataclysm for humans was merely a stimulus with some foreign object sensation for her. Seconds later, losing interest, she expelled the land—already soaked in love juices and deformed from the pressure—letting it fall into the vast sea of stars. \\\\n\\\\n\\\"Not much fun either.\\\" \\\\n\\\\nHitomi sighed, the emotion of 'boredom' completely taking over. She raised her legs, sat in the void, and began to remove the giant high-heeled maid shoe from her foot. \\\\n\\\\n\\\"Since it's not tasty and not fun, let's just end it.\\\" \\\\n\\\\nBarefoot, her jade foot wrapped in white silk radiated a faint warmth in the starlight. With a wicked touch, Hitomi hovered her sole over Earth's last intact continent, her toes wiggling flexibly. \\\\n\\\\n\\\"Shall we compare? The territory you're so proud of isn't even as large as the arch of my foot.\\\" The massive sock pattern, like a white sky covering the sun, made all humans looking up realize how truly tiny they were. \\\\n\\\\n\\\"Finally—goodbye forever.\\\" Hitomi's giant big toe and second toe suddenly spread apart like a massive flesh-colored pincer, precisely pinching the broken planet that was already on the verge of disintegration. Plates crumbled between her toe-gaps, and the atmosphere was soaked in foot sweat. Then, those two toes—the big toe and the second toe—pinching the planet relentlessly began to close together and grind. Without any suspense, the planet, under the world-ending pinching force of Hitomi's two toes, gave its final wail. Hitomi's toes exerted a sudden burst of force. With a dull and wet explosion, the planet finally gave way to this planetary-scale grip. Once-prosperous cities, lofty mountains, and deep oceans were all squeezed into countless burning fragments and dust in an instant. The remains of the planet, mixed with the sweat from between Hitomi's toes, turned into a viscous dark red sludge, sliding down her fair instep and vanishing into the cold vacuum of the universe."
