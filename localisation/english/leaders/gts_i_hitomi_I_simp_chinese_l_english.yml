#  一千七百多米的希瞳可爱的坐在城市之中，无聊的寻找着自己的下一个目标。\n“你们真是太弱了~抵抗也抵抗不了，逃，又能逃到哪里去呢？”\n希瞳轻轻晃动着自己的双脚，像是碾碎蚁群一般，不断地用自己的脚跟砸入小人的街道之中。人群如同无头苍蝇一般在她巨大的身躯之下四处奔逃着，而希瞳不过是用脚跟轻轻砸下，就能将几十个人的人群连同周围的大楼，一起用自己那厚实的长鞋跟碾作尘土。\n“完全没意思呢......没办法，只能让你们提前感受一下了呢？”\n这样说着的少女，无趣的用指尖勾上了自己的鞋跟。伴随着一股浓郁的气味笼罩大地，希瞳那有些发黄的白丝从那双洛丽塔皮鞋之中被抽了出来。伴随着一股浓郁的气味，那些躲藏在楼宇和地下的小人都不由得的捂住口鼻。\n“嗯哼？你们难道不觉得这股臭味很美妙吗？”\n用手指捏住自己的鞋帮，希瞳稍加思索，便将自己巨大的鞋子看似随意的丢出。在轰鸣之中，那巨大的鞋子重重的倒在城市之中，滚动翻转的鞋身将逃命的小人，连同繁华的街区一同压扁。只留下了那高墙一般的，还粘着各种建筑小人以及汽车残骸的脏污鞋底。\n“呵呵？就这点本事吗，那，另一只鞋子也请你们保管好哦？”\n巨大的鞋子，即使看起来只是朴实无华的高跟洛丽塔鞋，但在千倍的大小下，依然有着毁天灭地的重量。重重落地的鞋子，竟然勉强维持了自己的直立。屹立在城市之中的鞋子，即使与这个城市最为高耸的建筑物比起来都颇为庞大。而那些曾经能让希瞳好好玩弄的商场和居民楼，如今也不过是她脚趾大的无趣建筑物罢了。更为巨大化的她，此刻需要更为有趣的建筑来好好发泄一通。\n“嗯？居然全部逃到这里了吗？是等着我把你们一块扫除掉吗？”\n左右扫视着的希瞳，忽然在一片无趣的灰色建筑物里发现了什么。\n“真是......有不少呢？”\n少女转过身来，巨大的双腿横跨了数个街区，一左一右的砸在体育场的旁边。场内残存的上万人......还以为自己已经躲过了少女的视线，再度抬头，迎接他们的却是少女的坏笑，以及她正在轻轻晃动着的，那一双大臭脚。\n“呕......”\n此时的体育场对希瞳，究竟是什么呢？这么个建筑物，看起来也确实能让希瞳踩上几脚，但是玩心大发的希瞳，却不想这么轻松的让面前的小人儿轻易死去。\n“既然你们有幸被我挑中了，那么，可是要好好的来仰望你们归来的......”\n希瞳轻摇着嘴唇，说出了她一直都想说出的那句话。\n“'女神'哦。”\n坐在地上曲着腿的少女，轻轻的抬起了自己的左足。那被束缚了千年的足部，此刻正毫无遮掩的展示在所有人的面前。千年的积怨如同这脚臭一般，泛黄的脚底，以及勾动着丝袜的巨大脚趾，都彰显着这位女仆曾经统治着这个星球的过往。\n“不错哦，你们居然还能逃到这里呢？真不错呢~看看你们的同伴，就没那么幸运了呢？”\n希瞳微微弯腰，用自己的手指指着那些不幸被碾碎并被粘在脚底上的垃圾。\n“小家伙们的城市，还挺多姿多彩的吗？”\n希瞳用手指指着那些粘在自己足底的残骸，一个接一个的吐槽着。\n“看起来你们这些人真是慌不择路呢，不过也方便被我一脚踩扁了耶。”\n有些挑衅的她，一边说着，一边将粘在脚底的各种被碾作铁片的小车揭下，丢在了体育场的一旁。一边耻笑着那些不自量力的，被自己脚跟一脚击碎的人群，一边感受着那胯下上万人对于自己的恐惧和钦慕。\n“嗯？我有说你们可以走吗？”\n忽然间，希瞳看到了什么。那是正在自己足下奔逃着的上百人。就算是被她抬起的左脚阴影所笼罩，却依然侥幸的觉得巨大的女仆根本注意不到自己的存在。只可惜，这样的蚂蚁逃窜，已经杀死了数十万人的希瞳自然是已经习惯了呢。伴随着巨大的脚跟在一瞬间砸在人群之中，大笑着的希瞳，将自己的脚跟当作的碾碎东西的杵一般，在那人群之中重重地旋转碾碎着。看着那所剩无几的小人们四散奔逃，杀戮成瘾的她几乎是用自己庞大的力量，将她脚边胆敢逃跑的每一只小人，都用自己的脚跟碾碎成了不分你我的细碎血肉。\n“怎么样？胆敢逃跑的下场......就是这样哦？各位愚蠢的虫子~”\n再次抬起脚的希瞳，她的脚跟正滴落着那人类的混合物。这番残忍血腥的场景，令场内避难的小人们不由得连连后退。看着小人们在自己脚下屁滚尿流的场面，希瞳更是张狂的用脚底抵住了面前巨蛋般的体育馆，用自己的双脚不断地拍动着本就脆弱的避难所。\n“呵呵~你们真是弱小啊？哪里也去不了，反抗又做不了，只能把自己最为不堪的一面暴露给你们的毁灭神来看呢？”\n伴随着希瞳的双脚平铺在场馆的巨大穹顶上，仅剩的不到万人......正体验着身为希瞳脚底的足垫虫一般的待遇。每一口的呼吸，都是将希瞳积累了许久的脚臭吸入肺中的，浓郁到说不出话的臭味。索性，身为巨大女仆的希瞳也还没可怕到光光能用脚臭就能夺走人性命的程度。但在这番黑暗潮湿的足臭折磨之下，纵使是再有生命里的小人，也不得不在希瞳的足下败下阵来。\n“不过，反正你们也已经没啥用处了呢......”\n玩弄尽兴了的希瞳，终于想起来了自己灭杀人类的人物。伴随着盘腿的少女将双脚一左一右的夹在一个体育场的两旁，就连最为宽广的大街，此刻对于她的小腿来说都过于窄小。而在足心当中的体育场，此时已无人再敢逃跑，宁愿直面被面前这巨大女仆碾碎的命运。\n“哗啦——”\n在双脚闭合的一瞬间，巨蛋一般乳白色外壳的体育馆......便在她的足下彻底的被碾碎。意犹未尽的她，再搓动了几下双脚，直到再也感受不到双脚之间的生命气息才作罢。\n“果然只是一群愚笨的虫子呢？甚至是看到我白丝包裹着的巨大足底，都会害怕呢？”\n完全用双脚灭杀了这“避难所”里的一万小人的她，满意的抬起了自己的一只脚。穹顶和座椅的残骸从她的脚底像碎屑一般抖落，只留下了那些被鲜血浸透了的帐篷，以及成片成片的，曾是小人的红点。\n“没想到你们这些小人这么小呢？还没那些逃跑的家伙有意思呢......”
  gts_hitomi.8.desc: "Hitomi, over 1700 meters tall, sat cutely in the city, boredly looking for her next target.\\n\"You're all too weak~ You can't resist, and as for escape, where could you possibly go?\"\\nHitomi gently swayed her feet, as if crushing a colony of ants, repeatedly slamming her heels into the streets of the tiny people. The crowd fled in all directions beneath her giant body like headless flies, but Hitomi merely had to slam her heels down gently to turn a crowd of dozens, along with the surrounding buildings, into dust with her thick, long shoe heels.\\n\"It's completely boring... oh well, I'll just have to let you experience it in advance.\"\\nSo saying, the girl, bored, hooked her shoe heel with her fingertip. Accompanied by a strong scent enveloping the land, Hitomi's slightly yellowed white silk stockings were pulled out of those Lolita leather shoes. Accompanied by a thick scent, the tiny people hiding in the buildings and underground couldn't help but cover their noses.\\n\"Hmm? Don't you all think this stinky smell is wonderful?\"\\nPinching the shoe upper with her fingers, Hitomi thought for a moment and then threw her giant shoes away as if casually. Amidst the roaring, the giant shoes landed heavily in the city, the rolling and flipping shoe bodies flattening the fleeing tiny people along with the prosperous blocks. All that remained were those wall-like, dirty shoe soles still sticking with various architectural tiny people and car wreckage.\\n\"Hehe? Is that all you've got? Well then, please keep the other shoe safe too.\"\\nThe giant shoes, even if they looked like plain high-heeled Lolita shoes, still had world-destroying weight at a thousand times the size. The shoes landing heavily actually managed to maintain their upright position. Standing in the city, the shoes were quite enormous even compared to the most towering buildings in this city. And those shopping malls and residential buildings that Hitomi could once play with were now merely boring buildings the size of her toes. More giantized now, she needed more interesting structures to vent properly.\\n\"Hmm? You've all escaped here? Are you waiting for me to sweep you all away at once?\"\\nLooking around, Hitomi suddenly discovered something among the uninteresting gray buildings.\\n\"My... there are quite a lot of them.\"\\nThe girl turned around, her giant legs spanning several blocks, slamming down one on each side of the stadium. The tens of thousands of remaining people in the stadium... thought they had already escaped the girl's sight, looking up once more to be met with the girl's malicious grin and her pair of big stinky feet that were gently swaying.\\n\"Ugh...\"\\nWhat was the stadium to Hitomi at this moment? Such a building could indeed be stepped on a few times, but Hitomi, struck by a playful mood, didn't want to let the little people before her die so easily.\\n\"Since you've had the luck to be chosen by me, well, you must look up well at your returning...\"\\nHitomi gently bit her lip and said the phrase she always wanted to say.\\n\"'Goddess', you know.\"\\nSitting on the ground with her legs bent, the girl gently lifted her left foot. Those feet, which had been bound for a thousand years, were now displayed before everyone without any cover. A thousand years of accumulated resentment was like this foot odor; the yellowed soles and the giant toes hooking the stockings all manifested the past of this maid who once ruled this planet.\\n\"Not bad, you actually managed to escape here? Truly not bad at all~ Take a look at your comrades, they weren't so lucky.\"\\nHitomi bent down slightly, pointing with her finger at the trash unfortunately crushed and stuck to her soles.\\n\"The cities of you little guys are quite colorful, aren't they?\"\\nHitomi pointed at the ruins stuck to her soles, mocking them one by one.\\n\"It seems you people are truly desperate, though it makes it easier for me to flatten you with one foot.\"\\nSomewhat provocatively, she said this while stripping off various small cars crushed into iron sheets
    stuck to her soles, throwing them to the side of the stadium. While mocking those who were overestimating themselves and were crushed by one blow from her heels, she felt the fear and admiration of the tens of thousands beneath her crotch toward her.\\n\"Hmm? Did I say you could leave?\"\\nSuddenly, Hitomi saw something. It was over a hundred people fleeing beneath her foot. Even though they were shrouded in the shadow of her lifted left foot, they fortunately thought the giant maid simply wouldn't notice their existence. Unfortunately, Hitomi, who had already killed hundreds of thousands of people, was naturally used to such ant-like scrambling. Accompanied by the giant heel slamming into the crowd in an instant, Hitomi, laughing, used her heel like a pestle to ground things, spinning and crushing heavily among the crowd. Watching the remaining tiny people flee in all directions, she, addicted to slaughter, used her vast power to crush every single tiny person near her feet who dared to flee into indistinguishable minced flesh with her heels.\\n\"How was it? This is the fate of those who dare to escape... you foolish insects~\"\\nLifting her foot again, Hitomi's heel was dripping with human mixture. This cruel and bloody scene made the tiny people seeking refuge in the stadium retreat repeatedly. Watching the scene of the tiny people scared out of their wits beneath her feet, Hitomi even more arrogantly pressed the stadium like a giant egg with the soles of her feet, constantly swatting the already fragile refuge with both her feet.\\n\"Hehe~ You're truly weak, aren't you? You can't go anywhere, you can't resist, and you can only expose your most unsightly side to your god of destruction.\"\\nAs Hitomi's feet lay flat on the giant dome of the stadium, the remaining less than ten thousand people... were experiencing the treatment of being footpad insects beneath Hitomi's soles. Every breath was a thick scent of Hitomi's long-accumulated foot odor, concentrated enough to leave one breathless. Fortunately, Hitomi as a giant maid wasn't so terrible as to be able to take a person's life with just foot odor. But under the torture of this dark and moist foot odor, even the most resilient tiny people had to give in beneath Hitomi's feet.\\n\"However, you're not of much use anymore anyway...\"\\nHaving finished her play, Hitomi finally remembered her task of exterminating the humans. As the sitting girl clamped both her feet on both sides of a stadium, even the widest street was now too narrow for her calves. And in the stadium at the center of her soles, no one dared to flee anymore, preferring to face the fate of being crushed by this giant maid before them.\\n\"Crack——\"\\nAt the moment her feet closed, the stadium with its egg-like milky white shell... was completely crushed beneath her feet. Unsatisfied, she rubbed her feet a few more times until she could no longer feel any signs of life between her feet and then stopped.\\n\"As expected, just a bunch of foolish insects. They're even afraid of seeing my giant soles wrapped in white silk.\"\\nHaving completely exterminated the ten thousand tiny people in this \"refuge\" with both feet, she satisfiedly lifted one of her feet. The dome and seat wreckage shook off from the soles of her feet like crumbs, leaving only those tents soaked in blood and patches and patches of red dots that were once tiny people.\\n\"I didn't expect you tiny people to be so small. You weren't even as interesting as those who ran away...\""
