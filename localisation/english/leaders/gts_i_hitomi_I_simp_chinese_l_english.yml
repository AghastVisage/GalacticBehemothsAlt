  #  这、这次我可不是临时来的了……你们拼尽全力的样子让我看到了新的可能性，所以我会正式加入你们，继续学习这个世界、记录这个世界，顺便把那些麻烦的科研项目都处理掉——但、但是不要以为这样就能随便盯着我看，耳朵也还是不能摸！
  gts_hitomi.30017.desc: "Th-this time I am not here temporarily... Seeing you give everything you had showed me new possibilities, so I will formally join you, continue learning about this world, record this world, and take care of those troublesome research projects while I am at it. B-but do not think that means you can just stare at me whenever you like, and you still cannot touch my ears!"
