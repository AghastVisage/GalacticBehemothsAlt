  gts_hitomi.112.a.desc: "Accompanied by Hitomi's soft hum, she turned around and bent over, aiming her rounded buttocks at the building that was still barely standing.\\\\n'Since you have been lucky enough to survive until now, then...'\\\\nThe girl's massive buttocks swayed gently in the wind. Her white panties were slightly dampened from the previous play. Fleshy thighs, fleshy buttocks—what appeared to be highly seductive erotica to an outsider was a scene of impending doom for the remaining little people, who could never have imagined they would meet such a tragic end beneath such beauty. Under the repeated impacts of those massive buttocks, the building that had tenaciously stayed upright gradually bent and deformed, and finally, it was snapped in two by the wicked maid's plump rear, turning the entire structure into dust.\\\\n'Phew... you're much stronger than I thought. But is that all you've got?'\\\\nThe sole of the girl's foot pressed against the remaining half of the building. With a forceful kick, she uprooted the building and knocked it to the ground. Turning around again, she stopped her previous teasing. With just two heavy stomps of her soles, she completely turned this 'toy' she had been playing with into two giant footprints amidst the ruined street block.\\\\n'Phew... what's next? I'm so looking forward to it. How will the little people, developed over a millennium, resist me, this giantized maid...'"
  gts_hitomi.113.title: "13."



  #  一千七百多米的希瞳可爱的坐在城市之中，无聊的寻找着自己的下一个目标。\n“你们真是太弱了~抵抗也抵抗不了，逃，又能逃到哪里去呢？”\n希瞳轻轻晃动着自己的双脚，像是碾碎蚁群一般，不断地用自己的脚跟砸入小人的街道之中。人群如同无头苍蝇一般在她巨大的身躯之下四处奔逃着，而希瞳不过是用脚跟轻轻砸下，就能将几十个人的人群连同周围的大楼，一起用自己那厚实的长鞋跟碾作尘土。\n“完全没意思呢......没办法，只能让你们提前感受一下了呢？”\n这样说着的少女，无趣的用指尖勾上了自己的鞋跟。伴随着一股浓郁的气味笼罩大地，希瞳那有些发黄的白丝从那双洛丽塔皮鞋之中被抽了出来。伴随着一股浓郁的气味，那些躲藏在楼宇和地下的小人都不由得的捂住口鼻。\n“嗯哼？你们难道不觉得这股臭味很美妙吗？”\n用手指捏住自己的鞋帮，希瞳稍加思索，便将自己巨大的鞋子看似随意的丢出。在轰鸣之中，那巨大的鞋子重重的倒在城市之中，滚动翻转的鞋身将逃命的小人，连同繁华的街区一同压扁。只留下了那高墙一般的，还粘着各种建筑小人以及汽车残骸的脏污鞋底。\n“呵呵？就这点本事吗，那，另一只鞋子也请你们保管好哦？”\n巨大的鞋子，即使看起来只是朴实无华的高跟洛丽塔鞋，但在千倍的大小下，依然有着毁天灭地的重量。重重落地的鞋子，竟然勉强维持了自己的直立。屹立在城市之中，即使与这个城市最为高耸的建筑物比起来都颇为庞大。而那些曾经能让希瞳好好玩弄的商场和居民楼，如今也不过是她脚趾大的无趣建筑物罢了。\n更为巨大化的她，此刻需要更为有趣的建筑来好好发泄一通。\n“嗯？居然全部逃到这里了吗？是等着我把你们一块扫除掉吗？”\n左右扫视着的希瞳，忽然在一片无趣的灰色建筑物里发现了什么。
