  gts_hitomi.file.a: "Leave"



  #  2逐步清晰的面貌
  gts_hitomi.102.title: "2. A Gradually Clearing Face"



  #  随着我们的逐步靠近，我们为了避免被土著发现真实意图，伪装成了一颗彗星，不断地尝试接近这颗孕育着不同生命的蓝色星球。虽然从我们截获的情报来看，我们应该不过是被视作了一个有些奇特的天体，我们依然谨慎地不断借着这个星系其他星球的掩护，慢慢靠近着这颗有着一位不断地在梦境当中，尝试和我们联系的少女。\n“请......你们救救我。”\n随着科研船渐渐的靠近，我们也终于有了和少女直接在意识之中对话的能力。我们大致了解过这种灵能感应的手段，却没曾想过能在这个土著星系真正用上过。\n“我是......双月希瞳，你们可以叫我希瞳。”\n“我曾经是这个星球存在的另一个种族，却因为我作为巨娘的身份被这个星球可恶的小人种族利用，把我产生的能够巨大化的能量全部利用起来......”\n“这个地方，好小，好无聊。”\n“你们，能够帮助我，让我也能够脱身出来吗？”
  #  随着我们的逐步靠近，我们为了避免被土著发现真实意图，伪装成了一颗彗星，不断地尝试接近这颗孕育着不同生命的蓝色星球。虽然从我们截获的情报来看，我们应该不过是被视作了一个有些奇特的天体，我们依然谨慎地不断借着这个星系其他星球的掩护，慢慢靠近着这颗有着一位不断地在梦境当中，尝试和我们联系的少女。\n“请......你们救救我。”\n随着科研船渐渐的靠近，我们也终于有了和少女直接在意识之中对话的能力。我们大致了解过这种灵能感应的手段，却没曾想过能在这个土著星系真正用上过。\n“我是......双月希瞳，你们可以叫我希瞳。”\n“我曾经是这个星球存在的另一个种族，却因为我作为巨娘的身份被这个星球可恶的小人种族利用，把我产生的能够巨大化的能量全部利用起来......”\n“这个地方，好小，好无聊。”\n“你们，能够帮助我，让我能够脱身出来吗？”
  gts_hitomi.102.a.desc: "As we gradually approached, we disguised ourselves as a comet to avoid our true intent being discovered by the natives, constantly trying to get closer to this blue planet teeming with diverse life. From intercepted intelligence, we were merely viewed as a somewhat peculiar celestial body. We remained cautious, slowly nearing the planet under the cover of other bodies in this system, seeking the girl who was trying to contact us through her dreams.\\\\n'Please... help me.'\\\\nAs the science ship neared, we finally gained the ability to communicate directly with the girl via consciousness. We had heard of such psionic sensing methods but never expected to actually use them in a native system.\\\\n'I am... Hitomi Shuangyue. You can call me Hitomi.'\\\\n'I was once another race on this planet, but I was exploited by the detestable little people of this world because of my identity as a giantess. They used all the energy I generate for giantification...'\\\\n'This place is so small, so boring.'\\\\n'Can you help me? Let me escape?'"
  gts_hitomi.103.title: "3. A Rash Rescue Operation"



  #  我们的飞船如同流星一般，划过了土著星球的天际，却装作被捕获的样子，进入了环绕他的轨道。\n在土著们还在争论我们是外星人还是自然现象之时，为了将这只栗色的女仆猫娘从原住民的魔爪下拯救出来，我们打算冒险一试。\n我们的科学家带领着小队，直接传送到了那城市之下的基地之中。属于这个星球的科学家……惊奇的看着我们的出现，然后，便被我们逼迫着，交出了得以解救少女的钥匙。\n望着熟睡在培养皿中，被束缚着掠夺着能量的猫耳少女，我们不禁惋惜起来。但，就在这时，整个基地的警报都响了起来，看来……\n是时候了
  gts_hitomi.103.a.desc: "Like a shooting star, our ship streaked across the sky of the native planet, then entered orbit as if captured. While the natives debated whether we were aliens or a natural phenomenon, we decided to take a risk to save this chestnut-haired maid cat-girl from their clutches. Our scientists led a team, teleporting directly into the base beneath the city. The scientists of this planet... watched our appearance in surprise, then were forced to hand over the key to rescue the girl. Looking at the cat-eared girl sleeping in the incubator, her energy being stripped away, we couldn't help but feel pity. But then, the alarm throughout the entire base went off. It seems... it's time."



  #  4破茧而出
  gts_hitomi.104.title: "4. Breaking Out of the Cocoon"



  #  巨大的少女破茧而出，吓得那些赶来围追堵截的士兵呆若母鸡。\n“真的......很感谢你们。”\n淡红色的眼瞳打量着被一同包围的科学家，但她的眼神当中却没有畏惧，相反，能读出的则是满溢的恨。\n后续赶来的士兵如同潮水一般一波波的涌来，巨大的女仆少女则尝试着翻过身来，用自己庞大的身体挡住士兵们的视线。\n“虽然还没怎么了解你们的国家......但是我会记得你们的，不过，在此之前，我还有仇要报呢......”\n在我们的注视下，那位自称希瞳的猫娘少女逐步站起身来，将自己比常人大十倍的身躯压向了那些曾欺压着她的科学家和士兵们。\n“至于救出我的你们，就请......先不要打断我的复仇吧。”\n我们传送回了探测器上，少女则开始了自己的复仇。\n已然狭小的走廊，架在半空的管道和电线被少女轻易的扯断。\n胆敢拦在少女身前的小人，被比自己更为庞大的皮鞋碾作血污。\n失去了从自己身上汲取的能量，这座庞大的基地，同城市一同暗淡了下去。\n重新掌握了力量的少女，则思考着，这个背叛了自己的文明的处决方式。
  gts_hitomi.104.a.desc: "The giant girl broke out of the cocoon, frightening the soldiers who came to intercept her into a stupor.\\n'Truly... thank you.'\\nHer pale red eyes scanned the surrounded scientists, but there was no fear in her gaze; instead, it was filled with overflowing hatred. As soldiers arrived in waves like a tide, the giant maid attempted to turn over, using her massive body to block the soldiers' view.\\n'Though I haven't learned much about your nation yet... I will remember you. But before that, I still have a score to settle...'\\nUnder our gaze, the cat-girl calling herself Xitong slowly stood up, pressing her body, ten times larger than a normal person's, against the scientists and soldiers who once oppressed her.\\n'As for those who rescued me, please... don't interrupt my revenge for now.'\\nWe teleported back to the probe, and the girl began her revenge. In the narrow corridors, suspended pipes and wires were easily torn apart by the girl. Any little person bold enough to stand before her was crushed into blood and gore by her massive leather shoes. Deprived of the energy taken from her, the massive base—along with the city—went dark. The girl, having regained her strength, considered how to execute this civilization that had betrayed her."



  #  5背叛自己的ta？
  gts_hitomi.105.title: "5. The One Who Betrayed Her?"



  #  “就你，一个了吗？”\n身为女仆的她，在击退了几乎所有的，胆敢阻挡他的士兵们后，将那自己曾熟识的，曾经的“挚友”，但却出卖了自己，成为这个小人科学院院长的他，逼到了墙角之中。\n“我不是故意的！我......真的只是......”\n“真的不是故意的？就凭你能活到今天这个显而易见的事实，还打算继续蒙骗你的女仆吗？”\n穿着洛丽塔鞋的右脚轻轻地抬起，还沾着那些士兵背碾碎骨骼和血肉的鞋底，还在不断地向下滴着暗红色的鲜血。伴随着少女的威逼，她鞋底的棕色哑光厚底正顶着自己面前的这个叛徒。\n尽管那人正不断地求饶着，但是希瞳被关押了千年的恨意却并未消散一点。\n伴随着她收起的脚尖如同摆锤一般飞速落下，毫无抵抗之力的血肉之躯如同一节被碾碎的香肠一般爆裂开来。像是一颗鲜血的爆弹那般，同墙壁一起炸裂在了自己的鞋尖。\n“怯，还以为千年来你能有什么长进的，原来只有这点能耐吗？”\n少女左右晃动了自己的脚尖，将自己的脚同鞋子一同拔了出来。\n看着残留在自己鞋尖上的鲜血和骨骼，希瞳不由得嘟噜着。\n“十倍，对于彻底毁灭这个文明而言，还是太小了。”\n有些怨念的希瞳，用脚尖刮擦着一边的墙壁，将这小人的印记完全擦除。\n“解决了仇敌，那么也得把这个决议背叛自己的文明，一同扫除了才行。”\n没有了维生舱的束缚，希瞳的身躯，终于可以随心所欲的将能量完全用在巨大化之上，她的身躯将薄弱的楼板撑裂，将承重柱如同木棍一般折断撑裂，将自己的巨大化化作毁坏的力量，享受着那些愚蠢的科学家们，在躲避自己不断膨胀身躯时的不知所措，以及，最终连污损自己皮肤都做不到，也毫无反抗之法的——\n无力感。\n她的身体撑破了华美得穹顶，阴影逐步遮盖了大地。\n而展现在她面前的，则是自己还未曾享受过，却已经陷入混乱的现代化都市。
