  #  我是希瞳，作为女仆兼舰长，我愿一直陪伴你左右
  gts_hitomi.11.desc: "I am Hitomi. As both a maid and captain, I wish to stay by your side forever."



  #  你怎么会在这里？
  gts_hitomi.11.a.name: "Why are you here?"



  #  趴在前甲板上的希瞳透过舰桥指挥室的玻璃饶有兴趣的看着小小的科学官们\n“哈~舒服了，既然帮我完成了复仇，那我可以仔细来谈谈怎么报答你们了。”\n“比如，我会带你去到星河的彼端~”\n“嗯哼？当真啦？” 
  gts_hitomi.11.a.desc: "Hitomi, lying on the foredeck, watches the tiny science officers through the glass of the bridge's command center with great interest.\\n'Hah~ that feels good. Since you helped me complete my revenge, I can now talk in detail about how to repay you.'\\n'For example, I could take you to the very edge of the galaxy~'\\n'Hmm? You mean it?'"



  #  你说的舰长是什么意思，你可以指挥舰队吗？
  gts_hitomi.12.a.name: "What do you mean by 'captain'? Can you command a fleet?"



  #  “那是当然！需要舰队指挥官吗，我是希瞳，我在我在~”\n“虽然舰队指挥有些费神，但小瞳还是会细心指挥，谁让我是你的贴心女仆呢。” 
  gts_hitomi.12.a.desc: "'Of course! Need a fleet commander? I'm Hitomi, and I'm right here~'\\n'Though fleet command is a bit taxing, Little Hitomi will still command carefully. After all, I am your devoted maid.'"



  #  你怎么变小了？
  gts_hitomi.13.a.name: "How did you become smaller?"



  #  看着眼前没有形象瘫坐在舰船甲板上的女仆猫猫，不禁发出来了提问，刚才的天体级形象还是留下来过于深刻的印象\m“那个呀，是因为我的能力被压制了太久一下子全释放出来导致的，现在释放完了就恢复正常的大小了”\n“嗯？失望啦？” 
  #  看着眼前没有形象瘫坐在舰船甲板上的女仆猫猫，不禁发出来了提问，刚才的天体级形象还是留下来过于深刻的印象\n“那个呀，是因为我的能力被压制了太久一下子全释放出来导致的，现在释放完了就恢复正常的大小了”\n“嗯？失望啦？” 
