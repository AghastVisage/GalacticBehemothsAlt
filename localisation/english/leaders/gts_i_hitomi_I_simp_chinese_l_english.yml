  #  希瞳迷离的双眼死死的盯着那正矗立在自己胯下的，那座近五百米之高的电视塔。\n“终于轮到你了吗？虽然小了一些，但看起来还挺可口的吗？”\n希瞳的阴部已经满是爱液，顺着那巨大的塔身缓缓流下。而作为这颗星球最为尖端的文明成果，这座电视塔，正面临着自己被当作一只震动棒，强行插入身为女神的希瞳阴道之中的耻辱。伴随着希瞳腰肢的不断下压，塔身的警报和金属崩溃的声音早已连成了一片，但就算是这样，也没法阻拦希瞳的欲望。\n伴随着希瞳那近千吨之重的腰部下压，塔尖毫不留情的刺入了希瞳最为隐秘的领地。在那温热湿润的环境之下，塔内的幸存者们，一边惊恐地看着不断破碎的舱室，一边又不得不被希瞳那散发着甜腻气息的子宫颈，紧紧地包裹在其中。希瞳有些兴奋地夹紧了自己的双腿，塔身在巨大的压力之下瞬间崩溃，曾经引以为傲的高塔，此刻竟然被希瞳用阴道，轻易地挤成了粉碎。\n“嗯~啊~太舒服了......”\n伴随着一阵高潮的颤抖，希瞳瘫坐在了这一片废墟之上。而剩下的，仅仅是那些混杂着建筑残骸和小人尸体的，作为希瞳淫欲证明的浑浊液体。
  gts_hitomi.121.a.desc: "Hitomi's glazed eyes stared fixedly at the nearly 500-meter-tall television tower standing beneath her crotch.\\n'Finally your turn? Though a bit small, you look quite tasty, don't you?'\\nHitomi's vulva was already overflowing with love juices, which flowed slowly down the massive tower. As the most advanced achievement of this planet's civilization, the television tower was facing the humiliation of being used as a vibrator, forcibly inserted into goddess Hitomi's vagina. With the continuous downward pressure of Hitomi's waist, the tower's alarms and the sound of metal collapsing had long since merged into one, yet even that couldn't stop Hitomi's desire.\\nWith the downward pressure of Hitomi's nearly thousand-ton waist, the tower's tip mercilessly pierced into Hitomi's most private territory. Within that warm and moist environment, the survivors inside the tower watched in terror as the cabins shattered, while being tightly enveloped by Hitomi's sweet-scented cervix. Hitomi excitedly clamped her legs together, and the tower instantly collapsed under the immense pressure. The once-proud tower was now easily crushed to pieces by Hitomi's vagina.\\n'Mmm~ Ah~ Too good...'\\nAccompanied by the tremors of an orgasm, Hitomi slumped down onto the ruins. What remained were only the turbid liquids—a mixture of building wreckage and the corpses of little people—serving as proof of Hitomi's lust."



  #  在高潮的快感尚未褪去之时，希瞳却感到了一丝从未有过的空虚。\n“终究，在这颗星球上，已经没有什么能让我感到愉悦的东西了吗？”\n已经近乎二十公里的希瞳，再度直起了自己的身姿。此时的她，已经不再是那个只会玩弄小人的女仆，而是一个真正降临在这颗星球之上的，正在逐步收回自己权柄的造物主。她的脚尖轻轻的垫起，每一步在地面落下的震动，都能将数个街区化作尘埃。对于此时的她来说，原本引以为傲的人类城市，不过是可以用脚掌随意涂抹的涂鸦罢了。\n正如此时此刻，希瞳那巨大的足底，正屹立在这颗星球曾经作为最为繁华，也是最为庞大的“大都会”上空。在那足底阴影的笼罩之下，数百万人正绝望地跪地祈祷，妄图获得这位已经成神的巨大女仆的一丝仁慈。但遗憾的是，哪怕是曾经的小人，在此时的希瞳眼中，早已成了可以被随意抹去的尘灰。\n“差不多，也该让这番闹剧结束了呢？”\n希瞳微微地笑着，张开了那能够遮天蔽日的双足，伴随着一阵毁天灭地的轰鸣声，那曾经象征着人类文明极点的大都会，在希瞳那一双巨大臭脚的并拢碾压之下，仅仅是几分钟的功夫，就变成了一摊看不清样貌的，混合着建筑残渣和血肉的烂泥。\n希瞳有些意犹未尽的搓揉了几下自己的脚趾。那些得以在缝隙之中存活的可怜虫们，甚至还没得来及庆祝自己的劫后余生，就被希瞳脚趾间那无情的力量，彻底的碾成了虚无。\n“真的......已经完全坏掉了呢~”\n希瞳俯视着这颗此时已经满目疮痍，几乎不再存有任何高度文明痕迹的星球，发出了近乎病态的娇笑声。
  gts_hitomi.122.a.desc: "While the pleasure of the orgasm hadn't yet faded, Hitomi felt a hint of emptiness she had never experienced before.\\n'In the end, is there nothing left on this planet that can bring me joy?'\\nNow nearly twenty kilometers tall, Hitomi straightened her body once more. At this moment, she was no longer just a maid playing with little people, but a true Creator who had descended upon this planet, gradually reclaiming her authority. She stood slightly on her tiptoes, and the vibration of each step falling to the ground could turn several blocks into dust. To her now, the human cities they were once so proud of were merely graffiti that could be casually wiped away with her soles.\\nJust like this very moment, Hitomi's massive soles loomed over what was once the most prosperous and largest 'metropolis' on the planet. Under the shadow of her soles, millions were kneeling in prayer, trying to obtain a sliver of mercy from this giantized maid-turned-god. But unfortunately, even those once-familiar little people were, in Hitomi's current eyes, already dust that could be wiped away at will.\\n'It's about time to end this farce, isn't it?'\\nHitomi smiled slightly and spread her feet wide enough to blot out the sun. Accompanied by a world-shaking roar, the metropolis that once symbolized the pinnacle of human civilization turned into a mess of indistinguishable mud—a mixture of architectural debris and flesh—within just a few minutes under the crushing pressure of Hitomi's giant, smelly feet.\\nHitomi rubbed her toes together as if not yet satisfied. Those poor souls who had managed to survive in the gaps didn't even have time to celebrate their survival before being completely ground into nothingness by the ruthless force between Hitomi's toes.\\n'Truly... completely broken now~'\\nHitomi looked down at the planet, now ravaged and almost devoid of any traces of advanced civilization, and let out an almost pathological giggle."



  #  对于此时的希瞳来说，这颗已经支离破碎的星球，已经再也没有哪怕一丝一毫值得她留念的地方了。\n她再度踏上了这颗星球。但这番原本还能被希瞳当作玩具玩弄的大陆，此时在成神的她面前，却由于其本体脆弱到甚至都无法承受她迈出出的双足。\n随着少女赤着的白丝玉足砸入大洋之中。已经比海沟还要巨大的她，轻而易举地就将海水全数的排开。海床在她的脚下发出了阵阵凄厉的鸣响。随着希瞳腰部的不断发力，地壳已经在这份无情的力量之下逐步开裂，伴随着从地心涌出的岩浆，这颗星球正处在自己生命最后的葬礼之中。\n“各位......准备好迎接希瞳送给大家的，最后的礼物了吗？”\n希瞳坏笑着，她那双能够覆盖半个大洋的白皙手掌，毫不留情地。五指深深地扣入了板块的边缘。地壳发出了震耳欲聋的悲鸣，希瞳猛地发力，那块承载着数个文明、拥有数亿人口的大陆，就这样硬生生地被她从地幔上剥离了下来。\n希瞳张开樱桃小口，将这块巨大的“土饼”随手丢进了嘴里。随着上下颚的闭合，数千年的文明史在她的齿间化为粉末。建筑是咯嘣脆的零食，山脉是稍微硬一点的配料。希瞳漫不经心地大嚼着。\n“没意思呢。接下来......就让大家作为希瞳的装饰品，一同去见证这个星球的终结吧？”
  gts_hitomi.123.a.desc: "For Hitomi now, this fragmented planet held not even a single shred of sentimental value.\\nShe stepped onto the planet again. But these continents, which Hitomi could once play with as toys, were now so fragile that they couldn't even withstand her footsteps as she moved. \\n\\nAs the girl's bare, white silk-clad jade feet slammed into the ocean, she—already deeper than any oceanic trench—easily displaced all the seawater. The seabed emitted a series of piercing shrieks beneath her feet. With the continuous force from Hitomi's waist, the crust gradually cracked under this ruthless power. Along with the magma gushing from the core, the planet was now attending its own final funeral.\\n'Everyone... are you ready for the final gift Hitomi has for you?'\\nHitomi grinned wickedly, her fair palms—large enough to cover half an ocean—acting without mercy. Her five fingers dug deep into the edge of a continental plate. The crust issued a deafening wail. With a sudden burst of force from Hitomi, the continent, bearing several civilizations and hundreds of millions of people, was forcibly peeled away from the mantle.\\nHitomi opened her cherry lips and casually tossed this massive 'soil cake' into her mouth. As her jaws closed, thousands of years of civilization history turned to powder between her teeth. Buildings were crunchy snacks, and mountains were slightly harder ingredients. Hitomi chewed nonchalantly.\\n'Boring. Next... let everyone act as Hitomi's decorations and witness the end of this planet together.'"



  #  希瞳无聊地坐在被她啃食过的星球残骸之上，无趣得盯着那正在手中残留着的，正在垂死挣扎着的人类文明最后的火种。\n她褪下了自己另一只包裹着白丝的高跟皮鞋。那双因过度巨大而散发出淡淡白雾的玉足，此刻正邪恶得悬停在仅存的一块相对完整的大陆上空。\n“各位......你们引以为傲的国家，甚至是加上那些所谓得联盟，现在还没有我的脚心大呢？”\n希瞳恶趣味地动了动自己的脚趾，那一瓣瓣如同巨山般的足肉，正散发着令人作呕却又令人上瘾的足臭。她毫不留情地将脚掌按了下去。那是没有任何悬念的屠戮。大楼被脚心那柔软却又厚实的软肉拍成了齑粉。人群在脚趾缝隙间绝望的哀嚎，却又不得不成为这脏污白丝之上的一抹暗红。\n希瞳像是碾死一只虫子那般，反复在大陆之上搓揉着自己的脚心。直到那一整块大陆都变成了被鲜血和污泥浸透后的暗红色烂泥，她才满意地抬起了自己的双足。而在那脏污得足底，仅剩的是那些再也看不清样貌的，被希瞳当作“战利品”粘附在脚汗之中的城市废墟。\n“呵呵......真是美妙的终结呢。”\n希瞳那满是病态愉悦的娇笑声，在这个死寂的星系之中不断地回荡着。
  gts_hitomi.124.a.desc: "Hitomi sat boredly atop the planetary remains she had gnawed on, staring listlessly at the last sparks of human civilization clinging to life in her hands.\\nShe removed her other silk-wrapped high-heeled shoe. Her jade feet, so massive they emitted a faint white mist, now hovered evilly over the only remaining relatively intact continent.\\n'Everyone... the nations you're so proud of, even together with your so-called alliances, aren't even as large as the arch of my foot now, are they?'\\nHitomi mischievously moved her toes, petals of fleshy mountain-like toes emanating a nauseating yet addictive foot odor. She mercilessly pressed her sole down. It was a slaughter without any suspense. Buildings were turned to dust by the soft yet thick flesh of her arch. Crowds wailed in despair within the gaps of her toes, only to become a smear of dark red on the dirty white silk.\\nLike crushing an insect, Hitomi repeatedly rubbed her soles against the continent. It wasn't until the entire continent turned into dark red mud soaked with blood and filth that she raised her feet in satisfaction. On her filthy soles, all that remained were the ruins of cities, no longer recognizable, adhering to her foot sweat as 'trophies'.\\n'Hehe... what a wonderful ending.'\\nHitomi's giggle, filled with pathological pleasure, echoed continuously in the deathly silent star system."



  #  “是时候，宣告彻底的再见了呢~”\n巨大的希瞳，此刻正以一种几乎和这颗残破星球相当高大的身姿，飘荡在地球之外的虚空之中。\n她张开了那双白丝早已被尘土和血迹彻底浸污的巨大足底。原本那颗象征着人类文明最后希望的残破星球，此时在希瞳那超越星辰的伟力面前，竟然像是一个可以随手丢弃的破烂玩偶。\n希瞳那巨大的大拇趾和二趾猛地张开，像是一柄血红色的巨型钳子，精准地夹住了这颗已经濒临解体的最后残骸。\n板块在她的脚趾缝隙间崩裂。地核中原本炽热的浆液在希瞳巨大的握力之下，竟然像是因为恐惧而失去了所有的热度。\n没有任何悬念，整个行星在希瞳那两根脚趾那毁天灭地的夹击力下，发出了作为生命体最后的悲鸣。\n伴随着希瞳猛地一用力——\n“噗滋！”\n伴随着一声沉闷且湿润的爆裂音，这颗行星终于彻底承受不住这星球级的恐怖握力。曾经繁荣的城市、巍峨的高山、深邃的海洋，在这一瞬间统统被挤压成了无数燃烧的碎块和尘埃。这些星球的残骸混合着希瞳脚趾间的汗液，化作了一团黏腻且散发着恶臭的基础暗红色泥浆，顺着她那已经脏污不堪的白皙脚背缓缓滑落，最终消散在冰冷、漆黑且死寂的宇宙真空中。\n“坏东西，果然还是要坏掉呢~”\n希瞳一边悠闲地舔着自己手指上残留的星球碎渣，一边发出了极其愉悦的轻哼声。在这个已经失去了最后一丝光亮的星系之中，唯有这位已经成神的巨大女仆，正散发着令人胆寒的，作为毁灭女神的万丈光芒。
  gts_hitomi.125.a.desc: "'It's time to say a complete goodbye~' \\n\\nExtremely large but cute, Hitomi was now floating in the void outside Earth, her stature almost as tall as the broken planet itself. \\n\\nShe spread her massive soles, the white silk already thoroughly stained by dust and blood. The broken planet that once symbolized the last hope of human civilization was now like a ragged doll that could be discarded at will before Hitomi's power that surpassed the stars. \\n\\nHitomi's massive big toe and second toe suddenly spread apart like a giant blood-red pincer, precisely pinching the final remains that were on the verge of disintegration. \\n\\nPlates crumbled between her toe-gaps. The once-blazing core fluids of the planet seemed to lose all heat out of fear under Hitomi's massive grip. \\n\\nWithout any suspense, the entire planet issued its final cry as a living entity under the world-ending pinching force of Hitomi's two toes. \\n\\nWith a sudden burst of force from Hitomi— \\n\\n'SQUELCH!' \\n\\nWith a dull and wet explosion, the planet finally gave way completely to this planetary-scale terrifying grip. Once-prosperous cities, lofty mountains, and deep oceans were all squeezed into countless burning fragments and dust in an instant. The remains of the planet, mixed with the sweat from between Hitomi's toes, turned into a viscous and foul-smelling dark red sludge, sliding slowly down her already filthy, fair instep and finally vanishing into the cold, black, and deathly silent vacuum of the universe. \\n\\n'Broken things really should be broken~' \\n\\nAs she leisurely licked the planetary fragments remaining on her fingers, Hitomi let out an extremely pleasant hum. In this star system that had lost its final glimmer of light, only this giantized maid-turned-god remained, radiating the chilling, magnificent light of a Goddess of Destruction."
