  gts_hitomi.106.a.desc: "Deprived of the energy her body once created, these little people were now fleeing before her like ants. Hitomi's feet landed heavily in the square, her immense weight instantly leaving Lolita shoe imprints on the seemingly solid ground.\\\\n'Since you don't know what's happening, I'll help you all remember.'\\\\nHer heels clicked against the streets of the little people. Traffic and crowds fled in chaos beneath Hitomi's feet. Hitomi, the cat-girl in a maid outfit, strode across the streets like a hunter inspecting a hunting ground, trampling abandoned vehicles.\\\\n'What? Using my power to develop for a millennium, yet you noticed nothing?'\\\\n'Now that I think about it, it makes sense; after all, you're stupid enough to let me catch up...'\\\\nHer words were full of contempt for the little people. Traffic jammed, people surged forward. Despite being of the same kind, they were willing to abandon each other... Hitomi's shadow gradually loomed over the escaping crowd.\\\\nThe once-broad roads behind her left only smoking wreckage, footprints, and flattened metal cans.\\\\n'It seems there are quite a few people inside?'\\\\nHitomi gently pressed her heel down on a bus in the traffic jam. The bus, full of little people, was stuck and unable to move. Even the doors were blocked by other chaotic vehicles. The passengers inside could only watch as the ceiling above them was torn open, revealing Hitomi's thick brown Lolita heel.\\\\n'Tch, I'll just send you little ants on your way then.'\\\\nThe girl suddenly stomped down heavily, turning the packed bus into an exploding tomato can. Nearby vehicles and buildings were splattered with things that were struggling half a second ago but now turned into various shades of red, black, and white. Even little people who managed to survive between her toe and heel in this blood-soaked hell were completely crushed by her next cruel move—the mangled wreckage of the bus, mixed with flesh and blood, was kicked into the air along with several other buses behind it, leaving a trail of spraying blood before landing heavily among her footprints. The unrecognizable bus remains slowly oozed a mixture of human remains."
  gts_hitomi.107.title: "7. She Who Recovers Her Strength"



  #  看着面前逃难的人群，本来还在后面不紧不慢的虐杀着的希瞳，突然感受到了几下不明缘由的刺痛。定睛一看才发现，是本该维持着秩序的特警，正开着装甲车坚守在路口，用自己的那些毫无作用的烧火棍攻击着自己。\n“你们真的觉得这会有用吗？”\n少女抛弃了那一丝对猎物的矜持，本在驱赶着“猎物”的她，将逃跑中的人群的当作地毯向前跨去。每一步，都有几十个生命化作鲜红的血花，在她厚重的洛丽塔鞋下绽开着。而伴随着那黑影越来越大，她的面貌越来越清晰，站在这些抵抗着面前的希瞳，自然是对这些所谓英雄般的行动有所想法的。\n“怎么样啊，混蛋们？看看我的脚底，你们还要再反抗吗？”\n看着面前这些还没有自己脚趾高的小人儿，希瞳恶趣味的抬起了脚底，将一片地狱般的猩红，毫无保留的展示在这些抵抗者们的面前。\n“呕——”\n看着这番地狱的场景，纵使是经历过专业的训练，也有不少队员陷入了干呕之中，对此，希瞳小姐的处罚是......\n脚底重踏，将他们中间的，厚重的装甲车，如同易拉罐一般“咔擦”一下压扁。再如清扫一般，以鞋底为工具左右摆动。\n那些挥舞着烧火棍和护盾的士兵们，被少女比钢铁还要坚固的鞋面瞬间撞成了细小的血雾。仅仅是脚底在街道上左右摆动，就将这些恼人的蚂蚁，全部变成了自己鞋上的猩红印记。\n“真是的......幸好~你们丑陋的鲜血还没脏到本女仆的白丝呢......”
  gts_hitomi.107.a.desc: "Watching the fleeing crowd before her, Xitong, who had been slaughtering leisurely at the back, suddenly felt a few stabs of unexplained pain. Looking closer, she found that it was the special police, who were supposed to be maintaining order, stationed at the intersection with armored vehicles, attacking her with their useless fire sticks.\\n'Do you really think this will be useful?'\\nThe girl abandoned her shred of restraint toward her prey. As she drove the 'prey' forward, she used the escaping crowd as a carpet. Every step saw dozens of lives blooming like bright red blood flowers beneath her thick Lolita shoes. As the shadow grew larger and her face became clearer, Xitong, standing before these resistors, naturally had thoughts about these so-called heroic actions.\\n'How is it, you bastards? Look at the soles of my feet; do you still want to resist?'\\nLooking at these little people who weren't even as tall as her toes, Xitong mischievously lifted her sole, showing a slice of hellish crimson to the resistors without reservation.\\n'Ugh—'\\nSeeing this hellish scene, even with professional training, many team members fell into dry heaves. For this, Miss Xitong's punishment was... a heavy stomp, crushing the thick armored vehicle among them like a soda can. Then, using her sole as a tool, she swept side to side like a cleaning broom.\\nThose soldiers waving fire sticks and shields were instantly smashed into fine blood mist by the girl's shoe surface, which was harder than steel. Simply by moving her feet left and right on the street, she turned all these annoying ants into crimson marks on her shoes.\\n'Really... luckily, your ugly blood hasn't dirtied this maid's white silk yet...'"



  #  8清洁脚底
  gts_hitomi.108.title: "8. Cleaning the Soles"



  #  “可你们的血肉粘在我的双脚上，总感觉很恶心呢......”\n有了些厌恶的残忍女仆希瞳酱，继续朝着城市的一头走去。\n“有了......？”\n看着身旁那些十几层的，有自己小腿高的建筑，走到了一处公园之中的她，忽然之间想起了什么。\n“既然都是些无趣的小人建筑......用来擦拭鞋底的话？”\n她单脚着地，向后抬起了自己猩红的足底。鞋底的纹路几乎充满了逃难者的尸骸，还在滴落着血污的鞋子，此刻甚至还粘着几个拍扁到看不出原先样貌的小人车子。伴随着少女的脚底压在建筑的外立面上，如同猫咪磨爪那般，希瞳用着自己的鞋底，开始刮擦着那看似坚实的楼房。只可惜，小人的造物丝毫没有想过她的力量。仅仅是用自己的单脚擦拭几下，大楼便已经塌掉了半截，留下了从她鞋底刮下的大量血污，以及塌陷下来的破碎建筑残骸。\n“哼......我还是太高估你们了吗？”\n感到不解气的少女用脚尖轻重重地踢向楼房的一层，将她脚底刮落下来的，曾是几百条鲜活生命的人类原浆，和楼房一起垮塌埋没。\n“至于另一只脚吗，反正还有其他楼房呢？”\n少女恶趣味的将脚旁的大楼，当作了地毯，将自己的鞋底擦拭干净。末了，看到了脚边的池塘，下意识用小人的河塘洗脚的她，便穿着洛丽塔鞋轻踩了进去。\n“哗——哗——”\n伴随着她的脚底在池塘里轻轻的滑动，本来风景宜人的湖泊，瞬间便化作了脏黑的污水。\n其实也没想太多的希瞳，轮换着洗完了自己的双脚。棕色的皮鞋，终于少去了不少建筑的尘土，和那些垃圾一般的小人尸体。\n“这样才算弄干净吗~吗，还有很多小人没死干净呢？”\n这样想着的希瞳，继续追赶起了附近那些还在慌乱之中逃窜的小人。
  gts_hitomi.108.a.desc: "'But your flesh and blood clinging to my feet feels quite disgusting...'\\nXitong-chan, the cruel maid who was now somewhat repulsed, continued walking toward one end of the city.\\n'There...?'\\nLooking at the ten-story-high buildings beside her, which only reached her shins, she suddenly thought of something as she reached a park.\\n'Since they're all just boring little buildings... what if I use them to wipe my soles?'\\nStanding on one leg, she lifted her crimson sole backward. The tread of her shoe was almost filled with the remains of the fleeing victims, and dripping with blood and filth, the shoe even had several little people's cars flattened into it, their original shapes unrecognizable. As the girl pressed her sole against the building's facade, like a cat sharpening its claws, Xitong began to scrape the seemingly solid building with her sole. Unfortunately, the little people's creations had never considered her strength. With just a few wipes of her foot, the building was already halfway collapsed, leaving a large amount of blood and filth scraped from her sole, and the collapsed wreckage of the building.\\n'Hmph... did I overestimate you all?'\\nThe dissatisfied girl kicked heavily at the first floor of a building with her toe, burying her foot's scrapings—once hundreds of living lives—along with the building.\\n'As for the other foot, there are plenty of other buildings, aren't there?'\\nThe girl mischievously used the building beside her foot as a rug, wiping her sole clean. Finally, seeing a pond by her foot, she instinctively stepped into it with her Lolita shoes to wash them.\\n'Splash— splash—'\\nAs she moved her feet gently in the pond, the once-beautiful lake instantly turned into black, dirty sewage. Xitong, not thinking much of it, finished washing both feet alternately. The brown leather shoes were finally free of much of the building dust and the trash-like human remains.\\n'This counts as clean~ but there are still many little people who haven't died out yet?'\\nThinking so, Xitong continued to pursue the nearby little people who were still fleeing in panic."



  #  9绝佳视角
  gts_hitomi.109.title: "9. A Magnificent View"



  #  这里的房子就高了不少呢？一看就是你们这些小家伙的新聚居地吧？”\n希瞳站在小人的大街之上，周遭的大楼都繁华了不少向不少透明的玻璃覆盖其上，失去了能量的彩灯并未将街区最美的一面展露给我们的女仆，但对于目标是全歼这个星球生命的她来说，这些建筑物不过是他接下来选择的猎物罢了。\n嗯哼？看来你们的楼宇已经比欺骗我那会高上不少了呢......\n希瞳挑逗的走到了面前的楼宇前。刚好比她膝盖低一小节的大楼看上去还没收到什么警告。稍稍弯下腰去，便看见了里面还不知道外面究竟发生了什么，还在忙碌着的小家伙们。忽然之间又来了恶趣味的少女，将双脚踩在了楼宇的两旁。\n作为女仆的她，轻柔的蹲坐在了商场的上方。白丝的胖次轻松的就压溃了楼房顶端的各种设备，天线在她的骆驼趾上慢慢的弯曲折断，令希瞳感觉到了一丝瘙痒感。她收紧了大腿，将上半部分的商场一点点挤压在自己微胖紧实的大腿之下。伴随着身下那若有若无的悲鸣，满足着的少女正一点点的挤压着那些不幸着的生存空间。\n“既然不想逃的话，那就是自愿喽？”\n内倾的双脚，让自己的圆鞋头推碎了大门，将堵在门口的人群吓的连连后退。伴随着大楼四处发出悲鸣之声，原本华丽的玻璃幕墙在少女自上而下的挤压中逐渐架不住压力，一扇接一扇的碎裂开来。伴随着楼板一层层的垮塌，繁忙的商场终究还是受不住少女的压力，塌落了两三层。\n“真是的，连当椅子的能力都没有吗？废物~”\n希瞳厌恶的说着，将白丝包裹的双腿逐渐的夹拢。虽然有小人正在从低楼层一个个往下跳着，但毫不在意的她依然还是用自己的臀部和双腿，处决掉了被困在她身下的三百余名小人。\n在小人们的惊呼之中，大楼终究还是敌不过巨大女仆的力量，在她的小腿之间如同被孩童拆毁得沙堡一般塌落成了废墟。\n“本还以为你们能逃出来会聪明点的，没想到还是和那些蠢货一样直直的往前逃呢？”\n看着那逃出的几十个幸存者，嘴上说着自己毫不在意的希瞳仅仅是两步就追上了奔逃的人群。本还宽阔的大街，一下子便被她重踏所扬起的尘土所笼罩。\n“逃？逃的掉吗？”\n眼前一同逃跑的同伴消失不见，视野里只剩下了她冰冷的鞋底。\n末了，也不过是被她随意的一脚抹去，仅仅是比那些被双腿和臀部挤碎的小人多活了两三分钟。\n“真是的......才刚刚有感觉呢？”\n希瞳抬起脚来，看了看自己再度沾染上小人的鞋底，厌恶的又用身旁的建筑将脚底的血腥擦掉。
