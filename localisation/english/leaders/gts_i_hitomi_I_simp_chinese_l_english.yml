  gts_hitomi.115.a.desc: "Watching the little people wetting themselves in terror beneath her, Hitomi became even more wild, pressing her soles against the dome-like stadium and repeatedly patting the already fragile shelter with her feet.\\\\n'Hehe~ You are all so weak! You can't go anywhere, you can't resist, you can only expose your most pathetic side to your Goddess of Destruction, can't you?'\\\\nAs Hitomi's feet lay flat across the massive dome of the stadium, the remaining fewer than ten thousand people... experienced the treatment of foot-mat bugs beneath her soles. Every breath they took drew the concentrated smell of her feet, accumulated over ages, into their lungs—a scent so thick they couldn't speak. Fortunately, Hitomi the giant maid wasn't so terrifying that her foot odor alone could take lives. Yet under the torture of this dark, moist foot smell, even the hardest little people had to surrender beneath her feet.\\\\n'Well, you're useless now anyway...'\\\\nHaving had her fun, Hitomi finally remembered her mission to exterminate humanity. As the cross-legged girl placed her feet on either side of the stadium, even the widest streets were too narrow for her calves. Inside the stadium at the center of her arches, no one dared to run anymore, preferring to face the fate of being crushed by the giant maid.\\\\n'CRASH——'\\\\nThe moment her feet closed together, the milky-white dome of the stadium... was completely crushed beneath her feet. Not yet satisfied, she rubbed her feet together a few more times until she could no longer feel any signs of life between them.\\\\n'Truly just a bunch of stupid bugs. They're even afraid of seeing my giant white silk-clad soles.'\\\\nHaving completely exterminated the ten thousand little people in this 'shelter' with her feet, she lifted one foot in satisfaction. Wreckage of the dome and seats fell from her sole like crumbs, leaving behind only tents soaked in blood and fields of red dots that had once been little people.\\\\n'I didn't expect you little ones to be so tiny. You weren't even as interesting as those who tried to run...'"
  gts_hitomi.116.title: "16."



  #  此时的少女，正悠闲的走在城市之中，用释放出来的双足感受着这片许久未见的大地。几乎每一步都能让上千人死去的她，尽情得享受着这座作为女神一般高高在上的快感。那双有些泛黄的袜底，现在已经沾满了小人的尸骸，和建筑的残渣混合再一起，让女仆本该洁白的白丝足底变的脏脏的。\n“怎么样各位~知道希瞳的厉害了吧？”\n纵使是小人们的河流，不过也只是她一步便能跨过的存在。看着满是逃难者的桥梁，本该继续破坏的希瞳，突然转过身来。\n“你们说，既然怎么都是死，那要不试试看这招呢？”\n少女屹立在大桥两边，调皮的抬起了一只脚，用脚趾搭在这没有自己脚底宽的小小桥梁之上。\n“看起来你们真够小的啊？甚至可以是被我一只脚就抓起来的存在呢？”\n话刚说完，少女的五根脚趾便刷的并拢，将小人和桥梁本身都一同抓住碾碎。\n“只是......稍稍的有了些感觉呢？各位？我对你们的反抗不是很满意呢？”\n希瞳不屑的抬起脚来，放开了自己的五根脚趾，任由那些得以在她趾弓之间得以存活的幸存者，和那已经四分五裂的桥梁一同坠下。\n“怎么样？震撼不震撼？你们拍摄我的样子，还没有得到我的许可呢？”\n看着勉强飞到自己身旁，拍摄自己当作新闻报道的直升机，这可爱的女仆也忽然之间正经了那么一下。稍稍地弯下腰去，仔细的用自己红色的眼瞳打量着这架小小的直升机。已经感觉到了危险的直升机正打算飞离，却被少女意外可爱的打了个招呼。\n“你们这群小虫子，居然能做出这座东西吗？真是了不起呢......”\n轻轻摆手的少女卷起的风，就让直升机在自己面前左摇右摆了起来。再度露出自己险恶一面的希瞳，也伸出了自己的五指。\n“啪——”\n本来还在空中勉强维持着姿态的小小直升机，在少女的手中变成了一朵不起眼的火光。\n“呼，果然假正经的日常，只适合主人呢。”\n轻松的解决掉了恼人的小飞虫，希瞳继续散步在城市之中，寻找着自己的下一个猎物。
  gts_hitomi.116.a.desc: "The girl was now walking leisurely through the city, feeling the long-unseen earth with her freed feet. Killing thousands with almost every step, she thoroughly enjoyed the pleasure of being as high and mighty as a goddess. Her slightly yellowed sock soles were now covered with the remains of the little people, mixed with the rubble of buildings, turning the maid's once pure white silk soles dirty.\\n'How's it going, everyone? Do you know how powerful Hitomi is now?'\\nEven the rivers of the little people were something she could cross in a single step. Looking at a bridge full of refugees, Hitomi, who should have continued her destruction, suddenly turned around.\\n'I say, since you're all going to die anyway, why not try this move?'\\nThe girl stood on either side of the bridge, mischievously lifting a foot and resting her toes on the tiny bridge that wasn't even as wide as her sole.\\n'It seems you really are small enough to be picked up by just my toes, aren't you?'\\nAs she finished speaking, the girl's five toes snapped together, grabbing and crushing both the little people and the bridge itself.\\n'That... felt a bit better. Everyone? I'm not very satisfied with your resistance.'\\nHitomi dismissively lifted her foot, releasing her toes and letting the survivors who had managed to stay alive in the arch of her foot fall along with the shattered bridge.\\n'How was that? Shocking? You haven't received my permission to film me yet.'\\nLooking at a helicopter that had barely managed to fly near her to film the scene for a news report, the cute maid suddenly turned serious for a moment. Stooping down slightly, she carefully scrutinized the tiny helicopter with her red eyes. The helicopter, sensing danger, was about to fly away when it was met with an unexpectedly cute greeting from the girl.\\n'You little bugs, you can actually make something like this? Quite impressive...'\\nThe wind whipped up by the girl's gentle wave caused the helicopter to sway uncontrollably before her. Reverting back to her sinister side, Hitomi extended her fingers.\\n'SNAP——'\\nThe tiny helicopter, which had been struggling to maintain its position in the air, turned into an insignificant spark in the girl's hand.\\n'Phew, a fake serious routine really only suits Master.'\\nEasily dealing with the annoying little flying insect, Hitomi continued her stroll through the city, searching for her next prey."



