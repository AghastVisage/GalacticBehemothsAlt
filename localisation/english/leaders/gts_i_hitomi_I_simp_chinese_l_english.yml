  gts_hitomi.113.a.desc: "The 1,700-meter-tall Hitomi sat cutely in the city, bored and looking for her next target.\\\\n'You are all far too weak~ fiber couldn't even resist, and where could you possibly escape to?'\\\\nHitomi gently swung her feet, repeatedly slamming her heels into the streets of the little people as if crushing an ant colony. The crowds fled in all directions beneath her massive body like headless flies, but Hitomi only had to land a light blow with her heel to grind a crowd of dozens, along with the surrounding buildings, into dust with her thick heels.\\\\n'Totally boring... nothing for it, I'll just have to make you experience it a bit early then?'\\\\nSaying so, the girl boredly hooked her heel with her fingertip. As a thick scent enveloped the land, Hitomi's slightly yellowish white silk socks were pulled out from her Lolita shoes. Along with the heavy fragrance, the little people hiding in the buildings and underground couldn't help but cover their noses and mouths.\\\\n'Hmm? Don't you think this smell is wonderful?'\\\\nHolding the upper of her shoe with her fingers, Hitomi thought for a moment and tossed her giant shoe seemingly at random. Amidst the roaring, the giant shoe slammed down into the city, its rolling and flipping body flattening the fleeing little people along with the prosperous blocks. Only the wall-like, stained sole remained, with various buildings, little people, and car wreckages stuck to it.\\\\n'Hehe? Is that all? Well, please take good care of the other shoe too, then.'\\\\nThe giant shoe, even if it looked like a simple high-heeled Lolita shoe, possessed a world-ending weight at a thousand times the scale. The shoe that slammed to the ground even managed to maintain its upright position. Standing tall in the city, even compared to the most towering buildings, it was quite immense. And the malls and residential buildings that Hitomi used to play with were now just uninteresting structures the size of her toes.\\\\nBecoming even more giantized, she now needed more interesting buildings to blow off some steam.\\\\n'Hmm? Have you all fled here? Are you waiting for me to wipe you all out at once?'\\\\nScanning left and right, Hitomi suddenly discovered something among a field of boring gray buildings."
  gts_hitomi.114.title: "14."



  #  “真是......有不少呢？”\n少女转过身来，巨大的双腿横跨了数个街区，一左一右的砸在体育场的旁边。场内残存的上万人......还以为自己已经躲过了少女的视线，再度抬头，迎接他们的却是少女的坏笑，以及她正在轻轻晃动着的，那一双大臭脚。\n“呕......”\n此时的体育场对希瞳，究竟是什么呢？这么个建筑物，看起来也确实能让希瞳踩上几脚，但是玩心大发的希瞳，却不想这么轻松的让面前的小人儿轻易死去。\n“既然你们有幸被我挑中了，那么，可是要好好的来仰望你们归来的......”\n希瞳轻摇着嘴唇，说出了她一直都想说出的那句话。\n“'女神'哦。”\n坐在地上曲着腿的少女，轻轻的抬起了自己的左足。那被束缚了千年的足部，此刻正毫无遮掩的展示在所有人的面前。千年的积怨如同这脚臭一般，泛黄的脚底，以及勾动着丝袜的巨大脚趾，都彰显着这位女仆曾经统治着这个星球的过往。\n“不错哦，你们居然还能逃到这里呢？真不错呢~看看你们的同伴，就没那么幸运了呢？”\n希瞳微微弯腰，用自己的手指指着那些不幸被碾碎并被粘在脚底上的垃圾。\n“小家伙们的城市，还挺多姿多彩的吗？”\n希瞳用手指指着那些粘在自己足底的残骸，一个接一个的吐槽着。\n“看起来你们这些人真是慌不择路呢，不过也方便被我一脚踩扁了耶。”\n有些挑衅的她，一边说着，一边将粘在脚底的各种被碾作铁片的小车揭下，丢在了体育场的一旁。一边耻笑着那些不自量力的，被自己脚跟一脚击碎的人群，一边感受着那胯下上万人对于自己的恐惧和钦慕。\n“嗯？我有说你们可以走吗？”\n忽然间，希瞳看到了什么。那是正在自己足下奔逃着的上百人。就算是被她抬起的左脚阴影所笼罩，却依然侥幸的觉得巨大的女仆根本注意不到自己的存在。只可惜，这样的蚂蚁逃窜，已经杀死了数十万人的希瞳自然是已经习惯了呢。\n伴随着巨大的脚跟在一瞬间砸在人群之中，大笑着的希瞳，将自己的脚跟当作的碾碎东西的杵一般，在那人群之中重重地旋转碾碎着。看着那所剩无几的小人们四散奔逃，杀戮成瘾的她几乎是用自己庞大的力量，将她脚边胆敢逃跑的每一只小人，都用自己的脚跟碾碎成了不分你我的细碎血肉。\n“怎么样？胆敢逃跑的下场......就是这样哦？各位愚蠢的虫子~”\n再次抬起脚的希瞳，她的脚跟正滴落着那人类的混合物。这番残忍血腥的场景，令场内避难的小人们不由得连连后退。
  gts_hitomi.114.a.desc: "'There really are... quite a few of you, aren't there?'\\nThe girl turned around, her massive legs straddling several city blocks as she slammed them down on either side of the stadium. The tens of thousands of survivors inside... had thought they had escaped the girl's sight. When they looked up again, they were met by the girl's wicked smile and her pair of giant, smelly feet swaying gently.\\n'Ugh...'\\nWhat was the stadium to Hitomi now? Such a building was certainly something she could stomp on a few times, but with her mischievous side in full swing, Hitomi didn't want to let the little people before her die so easily.\\n'Since you were lucky enough to be chosen by me, you must look up properly at your returning...'\\nHitomi lightly bit her lip and said the words she had always wanted to say.\\n''Goddess'.'\\nSitting on the ground with her legs bent, the girl gently lifted her left foot. The foot that had been bound for a thousand years was now displayed before everyone without any concealment. A thousand years of resentment was like the smell of her feet; the yellowish soles and the giant toes hooking into her silk socks all highlighted this maid's past when she ruled this planet.\\n'Not bad, you actually managed to escape here? Truly impressive~ But look at your comrades, they weren't so lucky.'\\nHitomi leaned over slightly, pointing her finger at the trash that had been unfortunately crushed and stuck to her sole.\\n'The city of the little ones is quite colorful, isn't it?'\\nHitomi pointed at the wreckages stuck to her sole, making one comment after another.\\n'It seems you people really lost your heads in your panic, but that just makes it easier for me to stomp you flat.'\\nSomewhat provocatively, she spoke while peeling off various small cars that had been crushed into iron sheets and discarding them beside the stadium. She mocked the overconfident crowds she had crushed with her heels while feeling the fear and admiration of the tens of thousands beneath her.\\n'Hmm? Did I say you could leave?'\\nSuddenly, Hitomi saw something. It was over a hundred people fleeing beneath her foot. Even under the shadow of her raised left foot, they still luckliy thought the giant maid wouldn't notice their existence. Unfortunately, Hitomi, who had already killed hundreds of thousands, was of course used to such ant-like scurrying.\\nAs her massive heel slammed into the crowd in an instant, the laughing Hitomi used her heel like a pestle, heavily rotating and grinding amidst the people. Watching the few remaining little people scatter, her addiction to slaughter made her use her immense power to grind every single little person daring to escape near her feet into indistinguishable, fine shreds of flesh.\\n'How was it? This is the consequence of daring to run away. You foolish bugs~'\\nLifting her foot again, Hitomi's heel was dripping with the mixture of human remains. This cruel and bloody scene caused the survivors in the stadium to retreat in terror."



  #  15
  gts_hitomi.115.title: "15."



  #  看着小人们在自己脚下屁滚尿流的场面，希瞳更是张狂的用脚底抵住了面前巨蛋般的体育馆，用自己的双脚不断地拍动着本就脆弱的避难所。\n“呵呵~你们真是弱小啊？哪里也去不了，反抗又做不了，只能把自己最为不堪的一面暴露给你们的毁灭神来看呢？”\n伴随着希瞳的双脚平铺在场馆的巨大穹顶上，仅剩的不到万人......正体验着身为希瞳脚底的足垫虫一般的待遇。每一口的呼吸，都是将希瞳积累了许久的脚臭吸入肺中的，浓郁到说不出话的臭味。索性，身为巨大女仆的希瞳也还没可怕到光光能用脚臭就能夺走人性命的程度。但在这番黑暗潮湿的足臭折磨之下，纵使是再有生命里的小人，也不得不在希瞳的足下败下阵来。\n“不过，反正你们也已经没啥用处了呢......”\n玩弄尽兴了的希瞳，终于想起来了自己灭杀人类的人物。伴随着盘腿的少女将双脚一左一右的夹在体育场的两旁，就连最为宽广的大街，此刻对于她的小腿来说都过于窄小。而在足心当中的体育场，此时已无人再敢逃跑，宁愿直面被面前这巨大女仆碾碎的命运。\n“哗啦——”\n在双脚闭合的一瞬间，巨蛋一般乳白色外壳的体育馆......便在她的足下彻底的被碾碎。意犹未尽的她，再搓动了几下双脚，直到再也感受不到双脚之间的生命气息才作罢。\n“果然只是一群愚笨的虫子呢？甚至是看到我白丝包裹着的巨大足底，都会害怕呢？”\n完全用双脚灭杀了这“避难所”里的一万小人了她，满意的抬起了自己的一只脚。穹顶和座椅的残骸从她的脚底像碎屑一般抖落，只留下了那些被鲜血浸透了的帐篷，以及成片成片的，曾是小人的红点。\n“没想到你们这些小人这么小呢？还没那些逃跑的家伙有意思呢......”
