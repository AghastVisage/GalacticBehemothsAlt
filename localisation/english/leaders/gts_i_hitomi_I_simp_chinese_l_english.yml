  gts_hitomi.30014.name: ""
  #  就在我方舰队准备确认战斗结束时，一道陌生而柔和的声音忽然从沉寂深处传来，新的身影出现在破碎的星轨中央，她有着与三月相似的耳朵与轮廓，却穿着更加朴素而温和的衣装，紫色的眼眸安静地注视着散落在虚空中的光点；她没有看向我方舰队，而是缓缓走到三月希瞳消失的位置，像是在呼唤一件亲手创造、却迷失了太久的作品：“……三月。”那些碎片回应了她，微弱的光芒重新聚合，沉睡中的三月希瞳仿佛听见了什么，残破的意识在虚空中发出断续的回响：“御月……你为什么会过来？” 御月希瞳轻轻抬起手，将一枚微小的光点托在掌心，将那枚光点轻轻按进了三月胸前。下一秒，两人的身影同时亮了起来，原本沉寂的时空狭缝被蓝白色光芒重新点燃，散落在四周的碎片也像听见召唤一样，一点一点朝她们汇聚。御月希瞳这时忽然扭头看了我们一眼，还非常自然地眨了下眼。虽然她什么都没说，但那个表情怎么看都像是在说：“先别急着庆祝哦，等一下就把你们打到哭出来.jpg。”还没等舰桥成员反应过来，沉寂便被彻底打破，无数光点在时空狭缝中重新聚合，三月希瞳的身影再次于光芒中浮现。
  gts_hitomi.30014.desc: "Just as our fleet was preparing to confirm the end of combat, an unfamiliar yet gentle voice suddenly came from the depths of the silence. A new figure appeared at the center of the shattered star tracks. She had ears and a silhouette similar to Mitsuki's, but wore plainer, gentler clothes, and her purple eyes quietly watched the points of light scattered through the void. She did not look toward our fleet, but slowly walked to the place where Mitsuki Hitomi had disappeared, as if calling to a creation she had made with her own hands, yet which had been lost for far too long: \"...Mitsuki.\" Those fragments answered her. Faint light gathered again, and the sleeping Mitsuki Hitomi seemed to hear something. Her broken consciousness sent out intermittent echoes in the void: \"Mitsuki... why did you come here?\" Mitsuki Hitomi gently raised a hand, held a tiny point of light in her palm, and softly pressed it into Mitsuki's chest. In the next second, both of their figures lit up at once. The spacetime rift that had fallen silent was reignited by blue-white light, and the fragments scattered all around also seemed to hear a summons, gathering toward them bit by bit. At that moment, Mitsuki Hitomi suddenly turned her head and glanced at us, then winked very naturally. Although she said nothing, that expression looked no matter how you read it like it was saying: \"Don't celebrate just yet. In a moment I'll beat you until you cry.jpg.\" Before the bridge crew could react, the silence was completely broken. Countless points of light reassembled within the spacetime rift, and Mitsuki Hitomi's figure emerged once more from the radiance."
