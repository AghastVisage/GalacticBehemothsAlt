  gts_hitomi.13.a.desc: "Looking at the maid catgirl slumped unceremoniously on the ship's deck, you couldn't help but ask—her earlier celestial-scale presence had left an indelible impression.\\n\"That? Oh, that was just because my powers had been suppressed for so long and all burst out at once. Now that it's all released, I'm back to my normal size.\"\\n\"Hm? What, are you disappointed?\""
  gts_hitomi.101.title: "1. A Faint SOS Signal"



  #  　　经过科研船外围的研究，我们确认了这是一个还没有研发出FTL科技，加入群星大家庭的颇为原始的文明。虽然已经发展出了类似我们早期的科技，却并没有怎么涉及星空。\n通过对于这颗星球的外围观察，我们并没有发现这颗星球上有什么异于其他文明的东西。但是，随着我们的接近，以及我们的文明翻译器不断地捕获这颗星球所发射的电磁波，那个出现在我们脑海之中的少女正变的越来越清晰，很快，我们也便明白了她那模糊话语的本意。\n“救救我。”
  gts_hitomi.101.a.desc: "Through research on the planet's periphery, we have confirmed that this is a primitive civilization that has yet to develop FTL technology or join the interstellar community. Although they have developed technology similar to our early eras, they have hardly touched the stars.\\nThrough external observation of this planet, we found nothing differentiating it from other civilizations. However, as we approach and as our translators continue to capture the electromagnetic waves emitted by this world, the girl appearing in our minds is becoming increasingly clear. Soon, we understood the true intent of her blurred words:\\n'Save me.'"



