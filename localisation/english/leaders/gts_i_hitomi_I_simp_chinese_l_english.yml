  gts_hitomi.105.a.desc: "'Just you left?'\\\\nActing as a maid, having repelled almost all soldiers who dared block her path, she cornered her former 'best friend'—the man who had once known her well but betrayed her to become the Dean of the Little People's Academy of Sciences.\\\\n'I didn't mean it! I... I really just...'\\\\n'Didn't mean it? Based on the obvious fact that you've lived until today, do you plan to continue deceiving your maid?'\\\\nHer right foot, clad in a Lolita shoe, was slowly lifted. The sole, still covered in the crushed bones and flesh of soldiers, was dripping with dark red blood. As she pressured him, the brown matte thick sole of her shoe was pressed against the traitor before her. Although he begged for mercy, Hitomi's millenary resentment had not dissipated one bit. As her foot swung down like a pendulum at high speed, the defenseless body burst like a crushed sausage. Like a bomb of blood, he exploded against the wall at the tip of her shoe.\\\\n'Tch, I thought you might have made some progress over the millennium, but is this all you've got?'\\\\nThe girl shook her toes, pulling her foot and shoe out. Looking at the blood and bones remaining on her shoe tip, Hitomi muttered to herself:\\\\n'Ten times larger... it's still too small to completely destroy this civilization.'\\\\nWith some resentment, Hitomi scraped her toe against the side wall, completely erasing the mark of the little person.\\\\n'Now that the enemy is dealt with, the civilization that decided to betray me must be wiped out as well.'\\\\nWithout the restraint of the life-support pod, Hitomi could finally use all her energy for giantification at will. Her body cracked the weak floorboards, snapping load-bearing pillars like wooden sticks. She turned her giantification into a force of destruction, enjoying the helplessness of the foolish scientists as they scrambled to avoid her expanding frame, and finally—the sense of total powerlessness—as they could neither harm her skin nor resist in any way.\\\\nHer body burst through the magnificent dome, and her shadow gradually covered the earth. Laid out before her was a modern metropolis, one she had never enjoyed but which was already falling into chaos."
  gts_hitomi.106.title: "6. She Who Recovers Her Strength"



  #  没有了自己身体所创造的能量，这些小人现在正在自己的面前，如同蝼蚁一般逃窜着。\n希瞳的双脚，重重的踩在广场之上。巨大的体重，瞬间就让看上去坚实的大地踩出了洛丽塔的鞋底印记。\n“既然不知道发生了什么的话，那我就再替各位蝼蚁们回忆回忆吧。”\n高跟踏击在小人的大街上，车流混着人流混乱地在希瞳的脚下逃窜着。穿着女仆装的猫娘希瞳，则像是猎手巡视猎场一般，踩踏着小人们的街道，践踏着那些被遗弃的车辆向前走去。\n“怎么？千年来依靠我的力量才发展到今天，你们难道毫无察觉吗？”\n“仔细想想也是，毕竟，能愚笨到被我追上呢......”\n少女的言语之间，满是对小人的不屑。\n车流堵塞成团，人群蜂拥向前。明明是自己的同类，却宁愿弃之不顾......\n希瞳的阴影，逐步笼罩在了逃跑的人群上方。\n本来宽阔道路，在她的身后只留下了冒着黑烟的残骸，以及一个又一个脚印，和被踩成铁皮的罐头。\n“看来，里面还有不少人呢？”\n希瞳轻轻的用脚跟压住了车流之中的一辆巴士，满载小人的公交车此刻被困在停滞的车流之中动弹不能。就连是车门，也被其他混乱的车辆所堵塞，车内满载着的乘客，只能眼睁睁的看着自己头顶的天花板一点点的被撕开，露出希瞳那只厚重的棕色洛丽塔的鞋跟。\n“切，就这样送你们这些蝼蚁上路吧。”\n少女忽然间重重的踩下，将满载的公交车化作了一个爆炸的番茄罐头，一旁的车辆之上，以及街旁的建筑，全部沾染上了那些半秒之前仍在挣扎，现在却变成各种红的黑的白的东西，就算是在这血肉地狱之中得以在少女的鞋尖和鞋跟之间存活的小人，下一秒则被少女更恶趣味的动作所完全碾碎——那辆已经不成样子的，混合着血肉的公交车残骸，连同后面积压着的几辆公交车一起被她后踢向空中，留下了喷洒着鲜血的轨迹，再重重的落在自己留下的脚印之间。完全不成样子的巴士残骸，还在姗姗的向外流出着人类遗骸的混合物。
