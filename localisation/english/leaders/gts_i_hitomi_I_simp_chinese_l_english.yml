  gts_hitomi.109.a.desc: "The houses here are quite a bit taller, aren't they? Clearly a new settlement for you little guys.'\\\\nHitomi stood on the main street of the little people. The surrounding buildings were much more prosperous. Many were covered in transparent glass, though the unpowered lights failed to show the maid the most beautiful side of the district. For her, whose goal was the complete annihilation of all life on this planet, these buildings were merely her next chosen prey.\\\\n'Hmm? It seems your buildings are already quite a bit taller than when you deceived me...'\\\\nHitomi teased as she walked up to the building before her. Standing just below her knees, the building seemed not to have received any warning yet. Bending down slightly, she saw the little guys inside who were still busy, unaware of what was happening outside. Suddenly filled with mischief again, the girl planted her feet on both sides of the building.\\\\nActing as a maid, she gently sat down on top of the mall. Her white silk panties easily crushed various devices and antennas on the roof, which bent and snapped under her camel toe, giving Hitomi a slight tickle. She tightened her thighs, gradually squeezing the upper half of the mall beneath her slightly plump and firm thighs. Accompanied by the faint wailing from beneath her, the satisfied girl slowly compressed the survival space of the unfortunate victims.\\\\n'Since you didn't want to flee, you must be volunteers, right?'\\\\nHer inward-turned feet used their rounded toes to smash the entrance, scaring the crowd blocked at the door into a continuous retreat. As the building groaned and wailed throughout, the once-magnificent glass curtain walls succumbed to the pressure of the girl's top-down squeeze, shattering one by one. As the floors collapsed layer by layer, the busy mall finally couldn't take the girl's pressure and collapsed by two or three stories.\\\\n'Honestly, you can't even serve as a chair? Useless~'\\\\nHitomi said with distaste, gradually closing her white silk-clad legs. Though some people were jumping down from the lower floors one by one, she indifferently executed over three hundred little people trapped beneath her using her buttocks and thighs.\\\\nAmidst the cries of the little people, the building finally succumbed to the power of the giant maid, collapsing into ruins between her calves like a sandcastle destroyed by a child.\\\\n'I thought you'd be smarter after escaping, but you still ran straight forward like those other idiots.'\\\\nLooking at the dozens of survivors who escaped, Hitomi, claiming she didn't care, caught up with the fleeing crowd in just two steps. The once-broad street was suddenly enveloped in the dust kicked up by her heavy stomping.\\\\n'Run? Can you escape?'\\\\nThe companions running alongside them disappeared, and only her cold sole remained in their vision.\\\\nFinally, they were wiped away by a casual kick, living only two or three minutes longer than those squeezed to death by her legs and buttocks.\\\\n'Really... I was just starting to get into the feel of it.'\\\\nHitomi lifted her foot, looked at her sole which was once again stained with little people, and again wiped the blood away using a nearby building."
  #  空气中弥漫着一股乳香味。已经喷出一些的白色乳汁在建筑的残骸之中缓缓流动着，散发着蒸汽。而此刻的少女，则再次蹲了下来。透过满是裂纹的窗户，只能看到那些逃不出的所谓“精英”，正蜗居在大楼的中间，畏畏缩缩的看着注视自己的巨大女仆。\n“各位，想要死的更有价值一些吗？”\n希瞳轻启双唇，慢慢的哈出了湿热的空气。水汽逐步的遮蔽了玻璃幕墙，让小家伙们得以忽略掉巨大的淡红色眼瞳，以及那堆裸露在风中的丰硕乳房。但仿佛是抽奖一般，少女端详着，伸出手来，一下就击碎了大楼的某处。\n“恭喜你们，成为我今天的第一口小零食！”\n惊恐的上班族们想要逃跑，却只能眼睁睁的看着自己的同事被手指夹着，拉出了已经是巨大破洞的窗外。\n“我......我还不想死，救命......啊！”\n连话都没说几句，倒霉的白领就被希瞳丢入口中。伴随着他的惨叫声，他如同一块生肉那般，被巨大的牙齿所碾碎。只有1/100的他，甚至比希瞳的牙齿还要小一些。在她本能的咀嚼之下，骨骼咯啦咯啦的被碾碎，体内的一切都被挤出，然后再被唾液混合，被舌头推挤到了一边。\n“怎么样？死的很干脆吧？”\n希瞳再次张大嘴巴，让各位得以看清那倒霉蛋的死法。在大家被这番画面震惊到说不出话的时候，她的另一只手也深入大楼之中，将一个又一个的幸存者拉了出来，丢到了自己的手心之中。\n“嗯......不错？光是吃掉一只小家伙的话还是不够解馋呢？”\n希瞳这样说着，将手掌斜向了自己张大的巨口。在不断地惊呼之中，小人们想要朝着手掌的另一侧攀爬着，却抵挡不过地球的重力，滑落到了她的嘴中，如同跳跳糖一般在她的舌头之上蹦跳了几下。\n几十只本该有着美满生活的小虫子......就这样化作了女仆的解压零食。\n在旁人的围观之下，那双雪白的皓齿逐步落下，将想要挣扎着逃出生天的小人拦腰斩断。伴随着少女不清的咀嚼声，口中的求救和挣扎几乎瞬间断绝。就算是得以逃到牙齿下方，得以不被几下斩断粉碎的小人，也被那巨龙一般灵活的舌头推挤着，成为了上下牙齿之间的亡魂。\n“嗯~嗯~”\n伴随着鲜活的生命成为了自己的食糜，少女发出了满意的轻哼。咕咚一声，便将这些人类化成的看不清样貌的血肉，混合着口水一同咽下。\n“真是美妙呢，没想到这么久过去你们的味道已经变好了许多呢？”\n少女对着楼内的幸存者微微笑着，但大家却只能注意到她洁白的牙齿，已经沾满了同类遗留下的，可怕至极的暗红色血肉。\n“但是你们剩下的小人，可就没那么幸运了呢~”
  gts_hitomi.111.a.desc: "The air was filled with a milky fragrance. White milk, already sprayed out, flowed slowly among the wreckage of the buildings, giving off steam. At this moment, the girl crouched down again. Through the cracked windows, only the so-called 'elites' who couldn't escape could be seen, huddling in the middle of the building, cowering as they watched the giant maid gazing at them.\\\\n'Everyone, would you like to die a bit more meaningfully?'\\\\nHitomi slightly parted her lips, slowly breathing out hot, moist air. The water vapor gradually obscured the glass curtain wall, allowing the little ones to ignore the giant pale red pupils and the pair of plump breasts exposed to the wind. But as if drawing a lottery, the girl scrutinized them, reached out her hand, and shattered a part of the building in an instant.\\\\n'Congratulations, you have become my first bite of a snack today!'\\\\nTerrified office workers tried to flee, but they could only watch helplessly as their colleagues were pinched by fingers and pulled out of the already gaping hole in the window.\\\\n'I... I don't want to die yet, help... ah!'\\\\nBefore even a few words could be uttered, the unlucky white-collar worker was tossed into Hitomi's mouth. Accompanied by his screams, he was crushed by the giant teeth like a piece of raw meat. At only 1/100th her size, he was even smaller than one of Hitomi's teeth. Under her instinctive chewing, bones were ground and crunched, everything inside was squeezed out, then mixed with saliva and pushed aside by her tongue.\\\\n'How was it? A very quick death, wasn't it?'\\\\nHitomi opened her mouth wide again, allowing everyone to see the fate of the unlucky soul. While everyone was shocked into silence by the scene, her other hand reached deep into the building, pulling out one survivor after another and placing them into her palm.\\\\n'Hmm... not bad? Just eating one little guy isn't enough to satisfy my craving.'\\\\nSaying so, Hitomi tilted her palm toward her wide-open mouth. Amidst continuous cries, the little people tried to climb toward the other side of her palm, but they couldn't withstand the gravity and slid into her mouth, bouncing on her tongue like popping candy.\\\\nDozens of little bugs who should have had happy lives... just like that, they turned into the maid's stress-relief snacks.\\\\nUnder the gaze of onlookers, the snow-white teeth gradually descended, snapping the little people struggling to escape in half at the waist. Accompanied by the girl's indistinct chewing, the pleas for help and struggles in her mouth were cut short almost instantly. Even the little people who managed to escape beneath the teeth without being crushed were pushed by the dragon-like flexible tongue, becoming souls between the upper and lower teeth.\\\\n'Mmm~ Mmm~'\\\\nAs the fresh lives became her chyme, the girl let out a satisfied hum. With a gulp, she swallowed the indistinguishable flesh that had once been humans, mixed with saliva.\\\\n'Truly wonderful. I didn't expect that after all this time, your taste would have improved so much.'\\\\nThe girl smiled slightly at the survivors inside the building, but they could only notice her white teeth, now stained with the terrifying dark red flesh left behind by their kind.\\\\n'But you remaining little ones won't be so lucky~'"
  gts_hitomi.112.title: "12. A Magnificent Strike"



  #  伴随着希瞳的轻哼声，她转过身弯下腰来，将自己圆润的屁股对准了这座还在勉强支撑着的大楼。\n“既然你们得以有幸存活到现在的话，那么......”\n少女的巨大臀部，轻轻的在风中晃动着。洁白的胖次，也因为刚刚的玩弄湿润了一小片。肉肉的大腿，肉肉的屁股，在外人看来极具诱惑力的情色，对于残留的小人，却怎么也想不到自己竟会惨死在这番美景之下。在那巨大臀部一次又一次的撞击之下，本还顽强地保持直立着的大楼，在少女一次又一次的撞击之下逐渐弯曲变形，最终，被可恶的女仆的肥硕屁股一下撞断，将整个建筑化作了尘烟。\n“呼......你们想的比我坚强不少吗？不过，就这点本事了吗？”\n少女的脚底抵着残余的半截大楼，用力一踢，将大楼本是连根拔起击倒在地。再度转过身来的她，也没有刚刚的那番挑逗，仅仅是来自鞋底的两脚重踏，便彻底的将自己刚刚还在玩弄的这“玩具”，化作了残破街区之中的两只巨大的脚印。\n“呼......接下来又是什么呢？好期待啊，发展了千年的小小人们，能怎么反抗我这个巨大化的女仆呢......”
