  #  “嗯？看起来你们居然还能有比我高的楼呢？不错哦？”\n踏平了繁华商业街的她，发现了身旁的，有着150米的大楼。作为百倍大小的少女，她则刚好比这栋可以称得上是地标性的建筑高出了整整一个头。\n“虽然还是没我高，不过看起来比那些十几层的小楼有意思不少呢？”\n这样说着的少女蹲了下来，用手指轻轻的沿着外墙滑动着。本该忙于工作的小人们被惊动，却被少女巨大的几乎是占满一层楼高度的淡红色眼瞳，以及她那对微微摇晃的，和大楼比还要宽上不少的乳房所惊吓到。\n“真是的，现在才察觉到自己的命运吗？不过，在死之前，你们可一定要满足我啊~”\n这样说着的希瞳，踮起了自己的脚跟，将自己的巨乳完全靠在了大楼之上。\n温热的双乳，顺着大厦流线型的外表微微滑动，散发着一股少女独特的气味。伴随着少女的上下晃动，整个大楼也被希瞳拥抱着，伴随着她的动作不断地震动着。周遭的大地出现裂纹，坚固的窗户虽比之前的商场要牢靠上不少，却依然有不少布上了裂纹。\n“嗯呐~努力反抗我吧~”\n大楼的顶端完全破碎，变成了她胸口的形状。包裹着南半球的衣服早已脱落，露出了她那圆润柔软的双乳。但在如此巨大的重量和大小之下，就算是能够养育生命的乳头，也几乎是如同一个坚硬的岩石一般，不断地在被破坏的越来越严重的建筑上留下深深的刻痕。\n“呼......冰冰凉凉的大楼粉碎在我的巨乳上......还挺舒服的，不过这些乳汁......要留给更多的小人呢？
  gts_hitomi.110.a.desc: "\\\"Hmm? It seems you actually have a building taller than me? Not bad.\\\" After trampling the prosperous commercial street, she discovered a nearby 150-meter building. As a girl a hundred times larger than normal, she was exactly one head taller than this landmark architecture. \\\"Although it's still not as tall as me, it looks much more interesting than those little ten-story buildings.\\\" Saying this, the girl squatted down, her fingers sliding gently along the exterior wall. The tinies busy with work were startled, terrified by her massive light-red eyes that occupied nearly an entire floor's height and her swaying breasts, which were far wider than the building itself. \\\"Honestly, only realizing your fate now? Well, before you die, you must satisfy me~\\\" Hitomi stood on her tiptoes, leaning her giant breasts completely against the skyscraper. Her warm breasts slid slightly along the building's streamlined surface, emitting a girl's unique scent. As she rocked up and down, the entire building was embraced by her, vibrating constantly with her movements. Fissures appeared in the surrounding ground. Though the reinforced windows were sturdier than those of the commercial centers, many still shattered with cracks. \\\"Ahn~ try your best to resist me~\\\" The top of the building shattered completely, taking the shape of her chest. The clothing once covering her lower chest had already fallen away, revealing her round, soft breasts. But under such immense weight and scale, even nipples meant for nurturing life were more like solid rock, carving deep gouges into the increasingly ruined architecture. \\\"Whew... the ice-cold building crumbling against my breasts... it feels quite good. But this milk... must be saved for more tinies.\\\""
