  gts_hitomi.30009.name: ""
  #  在我方主动启用“三月希瞳的 Q 版手办”后，这个看似只是纪念品的小型终端忽然停止了所有常规响应。\n数秒后，手办的双眼亮起微弱的蓝白色光芒。隐藏在内部的应急子程序被彻底唤醒，一串从未记录在我方星图中的坐标被投射到了舰桥中央。\n该坐标位于已知航道之外。\n通讯频道中，传来了一个熟悉，却又无比陌生的声音。\n“检测对象确认。”\n“文明编号：已接入。”\n“观测变量：意志、适应、战斗续行能力。”\n“检测者：三月希瞳。”\n短暂的沉默后，那声音继续说道：\n“这是最初的检测。”\n“也是最终的检测。”\n舰桥内所有终端在同一时间弹出了新的航行目标。\n一个未知星系，出现在我方星图边缘。
  gts_hitomi.30009.desc: "After we actively activated \"Mitsuki Hitomi's Chibi Figure,\" the small terminal that had seemed to be nothing more than a keepsake suddenly stopped all routine responses.\\nSeveral seconds later, the figure's eyes lit with a faint blue-white glow. The emergency subroutine hidden inside was fully awakened, and a set of coordinates never before recorded on our star charts was projected into the center of the bridge.\\nThe coordinates lay beyond known routes.\\nOver the communication channel came a voice that was familiar, yet utterly strange.\\n\"Test subject confirmed.\"\\n\"Civilization ID: connected.\"\\n\"Observation variables: will, adaptation, combat endurance.\"\\n\"Tester: Mitsuki Hitomi.\"\\nAfter a brief silence, the voice continued:\\n\"This is the first test.\"\\n\"And also the final test.\"\\nEvery terminal on the bridge displayed a new navigation target at the same time.\\nAn unknown star system appeared at the edge of our star charts."
  #  解析该坐标。
  gts_hitomi.30009.a: "Analyze those coordinates."
  #  
  gts_hitomi.30009.a_custom: ""
  #  
  gts_hitomi.30009.b: ""
  #  
  gts_hitomi.30009.b_custom: ""
