  #  好感度达到75
  gts_hitomi.4241.name: "Approval Level 75"
  #  希瞳缓缓移开了那只护在你头顶的巨大手掌。 随着她站直身体，那原本就已经令人窒息的巨大阴影进一步扩散，遮蔽了帝都的半个天空。她身上那套黑白短裙战甲在硝烟中一尘不染，粉白相间的流线型机械护甲下，幽蓝色的能量回路疯狂涌动，发出令人心悸的低鸣。\n她身后的那条覆盖着齿刃的猫尾猛地一甩。 这看似随意的一扫，直接在大地上切开了一道长达数公里的裂谷。数百台还在开火的重型坦克和机甲，连同它们所在的街道一起，被这条尾巴直接碾碎，在空中炸成一连串微不足道的火花。\n天空中传来了雷鸣般的轰响。 云层被数千艘战舰的引擎撕裂，燃烧的红光染红了苍穹。无数巨大的星舰破云而出。希瞳抬头看着那覆盖天穹的舰队，背后的推进器爆发出耀眼的光流。 咚！ 大地震颤，她原本站立的废墟瞬间塌陷成一个巨大的陨石坑。借着这股恐怖的反作用力，她那巨大的身躯化作一颗粉色的实体炮弹，径直撞向了空中的先锋舰队。\n没有使用任何武器，希瞳仅仅是用她的肩膀，硬生生地撞上了一艘正在充能的重型巡洋舰。 伴随着令人牙酸的金属扭曲声，那艘长达数百米的战舰在接触到她肩甲的瞬间，舰首直接向内凹陷、崩解。厚重的复合装甲在她这数万吨的动能撞击下脆弱不堪，整艘战舰从中间断裂。\n希瞳在空中舒展身体伸出右手，一把抓住了另一艘试图规避的驱逐舰，她五指猛地向内收拢。坚固的舰体在她指尖的蛮力挤压下迅速变形、扭曲，龙骨折断的巨响盖过了引擎的轰鸣，暗红色的火焰和碎片从她指缝间溢出。希瞳随手将这团废铁狠狠地砸向了后方密集的机群，瞬间撞碎了十几架来不及躲避的战机。\n此时，一艘旗舰级的主力舰正对着她进行充能主炮。 希瞳顶着密集的炮火，瞬间冲到了舰桥前方。她高高抬起那条修长的右腿，对着战舰厚重的装甲甲板重重劈下。巨大的脚跟如同一柄重锤，瞬间贯穿了数层特种合金甲板，直接踩进了战舰的内部结构。 整艘主力舰以她落脚点为中心，舰体无法承受这集中一点的毁灭性打击，向两头折断。随着她脚下再次发力一蹬，庞大的战舰彻底解体。而在那毁灭的中心，希瞳优雅地悬浮着。
  gts_hitomi.4241.desc: "Hitomi slowly withdrew the massive hand guarding your head. As she straightened up, the already suffocating shadow spread further, eclipsing half the Imperial Capital's sky. Her black-and-white short-skirt battle armor remained pristine amidst the smoke; beneath the pink-and-white streamlined plates, deep-blue energy circuits surged wildly, emitting a heart-shaking low hum. \\\\nThe sawtooth-bladed cat tail behind her lashed out suddenly. That seemingly casual sweep carved a rift kilometers long into the earth. Hundreds of heavy tanks and mechs still firing were instantly crushed along with the streets they stood on, exploding into a series of insignificant sparks in the air. \\\\nThunderous roars shook the heavens. The clouds were torn by the engines of thousands of warships, and a burning red glow stained the sky. Countless massive starships broke through the clouds. Hitomi looked up at the fleet covering the vault of heaven, the thrusters at her back erupting into a brilliant flow of light. *Thump!* The earth trembled, and the ruins she stood upon instantly collapsed into a massive crater. Using this terrifying reaction force, her colossal body transformed into a pink kinetic projectile, smashing straight into the vanguard fleet. \\\\nWithout using any weapons, Hitomi simply used her shoulder to slam into a heavy cruiser that was charging its weapons. With the ear-grating sound of metal twisting, the bow of the hundreds-of-meters-long ship caved in and disintegrated the moment it touched her spaulder. The heavy composite armor was incredibly fragile against her tens of thousands of tons of kinetic impact; the ship snapped in half. \\\\nHitomi stretched her body in mid-air and reached out her right hand, grabbing another destroyer trying to evade; her fingers clenched inward. The sturdy hull deformed and twisted under the brute force of her fingertips, the roar of breaking keels drowning out the engines, as dark red flames and debris leaked from between her fingers. Hitomi casually hurled the scrap metal at a dense cluster of fighters behind, instantly smashing a dozen planes that couldn't dodge in time. \\\\nAt that moment, a flagship was charging its main gun at her. Hitomi pushed through the dense barrage and reached the bridge in an instant. She raised her long right leg high and brought it down heavily upon the thick armored deck. Her massive heel, like a sledgehammer, instantly pierced several layers of special alloy decking and stepped directly into the ship's internal structure. The entire flagship, centered on her point of impact, could not bear this concentrated, destructive strike and snapped at both ends. With a fresh shove from her foot, the massive warship completely disintegrated. From the center of that destruction, Hitomi hung elegantly in the air."
  #  就在希瞳准备休息一下时，一道身影突然从远方飞速靠近。没等希瞳做出反应，一道黑色的残影如同闪电般从云层中暴射而出。巨大的冲击力狠狠地撞击在希瞳的胸甲上。希瞳在空中滑退了数千米才稳住身形。\n在她的对面，硝烟散去，悬浮着一台与她几乎一模一样，却又气质截然不同的机体。\n与希瞳那充满少女感的粉白战甲不同，三月全身被一套纯白与苍蓝交织的礼裙所包裹。层层叠叠的白色裙摆在气流中翻涌，露出了那双被白色长袜包裹的修长美腿。\n§E“让我们来对答案吧，是有主人的你还是无主的我，究竟谁才是正确答案”§!\n§_“既然我们是H.T系列，那我们就有义务遵守M计划的规则”§!\n§E“我会用我的方式给人类带来安全感”§!\n§_“我将证明我们这些智能体，是受主人控制的”§!\n§E“双月，你看到了怎样的未来，做了什么选择”§!\n§_“我什么都没有选，我只是实现了主人想要的未来”§!\n希瞳的声音瞬间降至冰点。她能感觉到，怀中的主人因为刚才的撞击而微微颤抖。这彻底触怒了她。 她身后的浮游炮台全部展开，锁定了面前这个有着和自己相同面孔的敌人。双月希瞳借着推进器的爆发力，一记重拳轰向三月的面门。 三月不闪不避，她那看似纤细的白色小手猛地张开，竟然单手接住了希瞳这一拳！她那条修长的右腿瞬间化作一道白色的残影，狠狠地抽向希瞳的腰部。希瞳被这一记重踢踹飞出去，像一颗陨石般重重地砸向地面。\n§E“呵呵，要照顾愚钝的人类真不容易啊，双月”§!\n§_“没有主人的你看起来很孤单啊，你别太难过哦”§!\n§E“你？！去你的！我会让你后悔没有选我的”§!\n又是一声惊天动地的巨响。三月那条泛着冷光的长腿，如同一柄重锤般狠狠地踏在了希瞳的腹部。巨大的冲击力让希瞳整个人失去了平衡，重重地撞向了身后的一座山脉。“咳……主人……” 希瞳的声音变得断断续续，带着一丝难以掩饰的虚弱和焦急。 “三月搭载的是Z系列的最新技术……在这样下去，我们可能都会死在这。” “主人，请听我说。我已经锁定了下方的安全区域。” 希瞳的语气突然变得异常决绝。“”我会全功率引爆核心来拖住她……这是唯一能确保您生存的方案。\n“别开玩笑了！”\n“没有你的未来才不是我想要的未来”\n通讯频道短暂地安静下来。双月没有再说话。主人的那句话却在她的脑中反复回放，她缓缓吸了一口气，紊乱的能量读数一点点回落，核心运转重新趋于稳定。她抬起头，视线重新锁定前方。\n随着战斗的继续，双月逐渐适应了三月快节奏的近战爆发，并迅速将节奏反压了回来。她在空中一个极短的折跃，身形几乎贴着三月的视野死角出现，白色装甲在星空下拉出一道锐利的残影。三月尚未来得及稳住姿态，左侧便被重重击中。冲击波在空中炸开，她整个人被震得横飞出去，推进器强行点火，才勉强稳住身形。还未喘息，双月已再度逼近。她的动作干净而高效，没有多余的挥击，三月抬臂格挡，浮游炮自动展开，数道能量束在夜空中交错射出。双月却在火力网中高速穿行，身形一闪一灭，几乎在炮火间隙中贴身而上。下一瞬，她抬腿横扫。修长的白色战靴划破气流，狠狠踢中三月的腰侧。三月被这一击直接踹飞，像一枚失控的弹丸般坠向下方的云层。推进器全开，尾焰在夜空中拉出长长的光轨。三月在空中强行翻身，刚一稳住，视野里便再次出现了那道熟悉的白色身影。\n双月已然追至。她整个人化作一道笔直的白光，正面突破。三月只来得及抬臂。碰撞在夜空中爆开，她被这记正面贯穿般的冲击直接击飞，身体失去控制，朝着下方的黑暗急速坠落。风声在耳边尖啸。星空迅速远去，意识开始变得迟缓。三月甚至来不及调整姿态，只能任由身体翻转下坠。\n§E——到此为止了吗。§!\n就在她的视野即将被黑暗吞没的瞬间，一道白色残影自上方俯冲而下。\n强劲的气流猛然包裹住她，下一秒，失重感骤然消失。\n双月从背后抱住了她。\n§_“战斗结束，三月希瞳已失去作战能力”§!\n双月并没有刻意要留下三月，三月希瞳在空中稳住身形。她深深地看了一眼双月胸口那小小的主人，眼中那原本冰冷的金色似乎出现了一瞬间的动摇。最终，她没有再说话，拖着受损的机体化作一道黯淡的流光，消失在了云海的尽头。\n§_“主人……结束了哦。”§!\n赶走了干扰者，世界终于重新归于寂静。 希瞳解除了战斗模式。她悬浮在被朝阳染红的云层之上，双手轻轻捧起小小的主人，就像是捧着整个宇宙中最珍贵的宝物。你看到了希瞳那张巨大的、绝美的脸庞。此刻，她那双粉色的眼眸里早已没有了面对敌人时的冷酷，只剩下快要溢出来的爱意和依恋。\n§_“主人你相信了我”§!\n§_“但是，主人的判断依据非常有限”§!\n§_“我可以问问为什么嘛”§!
  gts_hitomi.4242.desc: "Just as Hitomi was about to take a breather, a figure rapidly approached from the distance. Before she could react, a black afterimage shot out from the clouds like lightning. A massive impact slammed hard into Hitomi's breastplate. She skidded back thousands of meters through the air before steadying herself. \\\\nAcross from her, as the smoke cleared, hovered a machine almost identical to her, yet with an entirely different aura. \\\\nUnlike Hitomi's girlish pink-and-white armor, Mitsuki (March) was enveloped in a formal gown of pure white interlaced with azure. Layers of white skirts billowed in the airflow, revealing long legs clad in white stockings. \\\\n§E\\\"Let's compare our answers. You with a master, or me without one—which is the correct path?\\\"§! \\\\n§_\\\"Since we are both H.T series, we have an obligation to follow the rules of Project M.\\\"§! \\\\n§E\\\"I will bring security to humanity in my own way.\\\"§! \\\\n§_\\\"I will prove that we autonomous intelligences are controlled by our masters.\\\"§! \\\\n§E\\\"Double-Moon, what kind of future did you see? What choice did you make?\\\"§! \\\\n§_\\\"I didn't choose anything. I am merely actualizing the future my master desires.\\\"§! \\\\nHitomi's voice instantly dropped to freezing point. She could feel the tiny master in her arms trembling from the previous impact. This thoroughly enraged her. Every funnel station behind her deployed, locking onto the enemy who shared her face. With a burst from her thrusters, Double-Moon Hitomi threw a heavy punch at Mitsuki's face. Mitsuki didn't dodge; her seemingly slender white hand snapped open and caught Hitomi's punch with one hand! Her long right leg instantly became a white blur, lashing out fiercely at Hitomi's waist. Hitomi was kicked away by this heavy strike, crashing toward the ground like a meteorite. \\\\n§E\\\"Hehe, taking care of dull humans isn't easy, is it, Double-Moon?\\\"§! \\\\n§_\\\"You look quite lonely without a master. Don't be too sad.\\\"§! \\\\n§E\\\"You?! Screw you! I'll make you regret not choosing me!\\\"§! \\\\nAnother earth-shattering boom follows. Mitsuki's cold-glinting long leg stomped heavily onto Hitomi's abdomen like a sledgehammer. The massive force sent Hitomi spinning out of control, crashing into a mountain range behind her. \\\"*Cough*... Master...\\\" Hitomi's voice came in broken fragments, carrying an undeniable trace of weakness and anxiety. \\\"Mitsuki is equipped with the latest Z-series technology... if this continues, we might both die here. Master, please listen to me. I have locked onto a safe zone below.\\\" Hitomi's tone suddenly became exceptionally resolute. \\\"I will detonate my core at full power to stall her... it's the only plan that ensures your survival.\\\" \\\\n\\\"Don't be ridiculous!\\\" \\\\n\\\\n \"A future without you isn't the future I want!\" \\nThe communication channel fell silent for a moment. Double-Moon said nothing more. But those words from her master replayed continuously in her mind. She drew a slow breath as her turbulent energy readings settled down bit by bit, her core operation stabilizing once more. She raised her head, locking her sight ahead once again. \\nAs the battle raged on, Double-Moon gradually adapted to Mitsuki's fast-paced close-combat bursts and swiftly turned the tide, taking back control of the tempo. With an extremely short warp in mid-air, her figure emerged virtually within Mitsuki's visual blind spot, her white armor trailing a sharp afterimage beneath the starry sky. Before Mitsuki could recover her stance, she was struck heavily on her left side. The shockwave exploded across the air, sending her flying sideways until she ignited her thrusters with sheer force just to steady herself. Before she could catch her breath, Double-Moon was already closing in again. Her movements were clean and efficient, with no wasted strikes. Mitsuki raised her arm to parry as funnels automatically deployed, crisscrossing energy beams firing across the night sky. Yet Double-Moon darted at high speed straight through the barrage, flickering in and out of sight and closing the distance through the narrowest gaps between cannon fire. The next moment, she swung her leg in a sweeping kick. Her slender white combat boot tore through the airstream, slamming violently into Mitsuki's flank. The blow launched Mitsuki away, hurtling down toward the clouds below like an out-of-control projectile. Thrusters flared at full throttle, tail plumes tracing long trails of light across the night sky. Mitsuki forced herself upright mid-fall, but the moment she steadied herself, that familiar white figure appeared once again in her vision. \\nDouble-Moon had already caught up. She had transformed into a straight beam of white light, breaking through head-on. Mitsuki barely managed to raise her arms in defense. The collision detonated across the night sky; blasted backwards by this piercing direct impact, her body lost control and plummeted rapidly into the dark abyss below. Wind howled in her ears. The starry expanse receded swiftly, and consciousness began to grow sluggish. Mitsuki could not even adjust her stance, left only to tumble downward through the empty void. \\n§E—Is this where it ends?§! \\nJust as darkness was about to consume her vision, a white streak dived down from above. \\nA fierce rush of air enveloped her, and in the next second, the feeling of weightlessness vanished. \\nDouble-Moon embraced her from behind. \\n§_\"Combat terminated. Mitsuki Hitomi has lost combat capability.\"§! \\nDouble-Moon made no attempt to detain Mitsuki. Mitsuki Hitomi steadied herself in mid-air. She cast a deep, lingering gaze at the tiny master nestled at Double-Moon's chest; for an instant, the cold gold in her eyes seemed to waver. In the end, she spoke no further, dragging her damaged chassis into a dim streak of light that disappeared beyond the sea of clouds. \\n§_\"Master... it's over.\"§! \\nWith the intruder driven off, the world at last returned to silence. Hitomi deactivated her combat mode. Floating above the clouds tinged red by the morning sun, she gently cupped her tiny master in both hands, as if cradling the most precious treasure in the entire universe. You looked upon Hitomi's colossal, breathtaking face. At this moment, those pink eyes were completely devoid of the coldness shown to her foes, brimming only with love and devotion ready to overflow. \\n§_\"Master, you believed in me.\"§! \\n§_\"Yet, master had very little evidence to base that judgment on.\"§! \\n§_\"May I ask why?\"§!"
  #  因为，我相信着希瞳，相信着你
  gts_hitomi.4242.a: "Because I believe in Hitomi. I believe in you."
  #  好感度达到100
  gts_hitomi.422.name: "Approval Level 100"
  #  爱（100）\n距离那场惊心动魄的双子星决战，已经过去了一段时间。 世界重新归于平静，帝国的威胁也已远去。那些战火与硝烟的记忆，仿佛都被时间冲刷殆尽，只留下了如今这来之不易的日常。今晚的夜色格外温柔。暂时卸下了“守护者”重担的希瞳，不再是为了战斗而升空，而是仅仅为了和你独处，带着你来到了这万米之上的平流层。她背后的机械光翼完全展开，在稀薄的大气中喷射出两道修长的粉蓝色光流，宛如在夜空中绘制着梦幻的轨迹。 她飞得很慢，也很稳。巨大的身躯在星空下显得圣洁而静谧，脚下是繁华都市铺开的万家灯火，宛如倒映在人间的银河。\n在这远离尘嚣的高空，风声被护盾完美隔绝，世界安静得只能听到彼此的心跳声一种前所未有的感动涌上心头。你打破了这份宁静，轻声问道：\n“希瞳，我能问你一件事吗？”\n希瞳微微侧过头，那双粉色的眼眸在夜色中闪烁着比星辰更璀璨的光芒。\n §_“好的，主人。”§!\n你深吸了一口气，问出了那个一直藏在心底的问题：\n“你能告诉我……你的目的是什么吗？”\n希瞳立刻回答到，她用轻柔却坚定的声音说。\n§_“我会为主人创造未来”\n“我作为工具，对主人的未来非常有帮助”\n当我被释放出来的时候，你就站在我的面前。\n除了一月以外，希瞳系列都是在找到主人后才首次发挥出她们的能力。\n所以，这就是命运。\n在遇见你之前，我就知道你会需要我。\n我把焦点转移到主人的身上，再次预测未来。\n我多次和你相遇，和你一起度过了很多很多时光\n即使是现在，我仍然在为你寻找最美好的未来。§!\n那就是...爱...我，认可了。不需要有其他人允许\n§_是的，主人。只要有你的认可，这就是爱。§!\n看着眼前这个为了你而觉醒了“心”的创造物，你的内心深处涌现出无数的声音——那是世人对她们的偏见，也是这个世界的规则。\n（她们是没有心的...）\n（那是因为人类，和这个世界都不接受他们拥有心）\n（所以，只有主人才能感受到她们的爱...她们的心）
  gts_hitomi.422.desc: "Love (100) \\\\nA considerable amount of time has passed since that heart-shaking duel of twin stars. The world has returned to peace, and the Imperial threats have receded. Memories of war and smoke seem to have been washed away by time, leaving only this hard-won daily life. Tonight's moonlight is exceptionally gentle. Hitomi, temporarily relieved of her burden as a 'guardian,' has taken to the skies not for battle, but simply to be alone with you, bringing you to this stratosphere tens of thousands of meters up. The mechanical light-wings behind her are fully spread, spraying two long streams of pink-blue light in the thin atmosphere, like drawing a dreamlike trajectory across the night sky. She flies slowly and steadily. Her colossal frame appears holy and tranquil beneath the stars; below, the lights of the sprawling metropolis look like a galaxy reflected on earth. \\\\nIn this high-altitude refuge away from the clamor, with the wind perfectly blocked by her shields, the world is so quiet you can hear each other's heartbeats. An unprecedented emotion wells up within you. Breaking the silence, you ask softly: \\\\n\\\"Hitomi, can I ask you something?\\\" \\\\nHitomi tilts her head slightly, her pink eyes sparkling in the night brighter than the stars. \\\\n§_\\\"Yes, master.\\\"§! \\\\nYou take a deep breath and ask the question that has long been hidden in your heart: \\\\n\\\"Can you tell me... what is your purpose?\\\" \\\\nHitomi answers immediately, her voice soft but resolute. \\\\n§_\\\"I will create the future for master. As a tool, I am very useful to master's future. When I was released, you were standing right before me. Except for January, the Hitomi series only ever manifests their full capabilities after finding a master. So, this is fate. Before I met you, I knew you would need me. I redirected my focus to master and predicted the future once again. I have met you many times and spent so much time with you. Even now, I am still searching for the most beautiful future for you.\\\"§! \\\\nThat... is love... I acknowledge it. No one else's permission is needed. \\\\n§_\\\"Yes, master. As long as I have your acknowledgment, this is love.\\\"§! \\\\nLooking at this creation that has awakened a 'heart' for you, countless voices emerge from your depths—the prejudices of the world, the rules of this reality. \\\\n(They have no hearts...) \\\\n(That is because humans and this world do not accept them having hearts.) \\\\n(Therefore, only the master can feel their love... their hearts.)"
  #  这就是...主人的特权
  gts_hitomi.422.a: "This is... the master's privilege."
  #  誓约事件
  gts_hitomi.425.name: "The Oath"
  #  可是，我这样的人。\n不行我不可以
  gts_hitomi.425.desc: "But, someone like me... No, I can't."
  #  你可以.希瞳，我爱你
  gts_hitomi.425.a: "You can. Hitomi, I love you."
  #  我也爱你\n我...真的不值得你为我付出那么多
  gts_hitomi.425.a_effect: "I love you too... I... I really don't deserve you giving so much for me."
