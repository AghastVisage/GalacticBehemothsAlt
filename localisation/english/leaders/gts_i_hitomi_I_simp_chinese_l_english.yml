#  “这里的房子就高了不少呢？一看就是你们这些小家伙的新聚居地吧？”\n希瞳站在小人的大街之上，周遭的大楼都繁华了不少。不少透明的玻璃覆盖其上，失去了能量的彩灯并未将街区最美的一面展露给我们的女仆，但对于目标是全歼这个星球生命的她来说，这些建筑物不过是他接下来选择的猎物罢了。嗯哼？看来你们的楼宇已经比欺骗我那会高上不少了呢......\n希瞳挑逗的走到了面前的楼宇前。刚好比她膝盖低一小节的大楼看上去还没收到什么警告。稍稍弯下腰去，便看见了里面还不知道外面究竟发生了什么，还在忙碌着的小家伙们。忽然之间又来了恶趣味的少女，将双脚踩在了楼宇的两旁。作为女仆的她，轻柔的蹲坐在了商场的上方。白丝的胖次轻松的就压溃了楼房顶端的各种设备，天线在她的骆驼趾上慢慢的弯曲折断，令希瞳感觉到了一丝瘙痒感。她收紧了大腿，将上半部分的商场一点点挤压在自己微胖紧实的大腿之下。伴随着身下那若有若无的悲鸣，满足着的少女正一点点的挤压着那些不幸着的生存空间。\n“既然不想逃的话，那就是自愿喽？”\n内倾的双脚，让自己的圆鞋头推碎了大门，将堵在门口的人群吓的连连后退。伴随着大楼四处发出悲鸣之声，原本华丽的玻璃幕墙在少女自上而下的挤压中逐渐架不住压力，一扇接一扇的碎裂开来。伴随着楼板一层层的垮塌，繁忙的商场终究还是受不住少女的压力，塌落了两三层。\n“真是的，连当椅子的能力都没有吗？废物~”\n希瞳厌恶的说着，将白丝包裹的双腿逐渐的夹拢。虽然有小人正在从低楼层一个个往下跳着，但毫不在意的她依然还是用自己的臀部和双腿，处决掉了被困在她身下的三百余名小人。\n在小人们的惊呼之中，大楼终究还是敌不过巨大女仆的力量，在她的小腿之间如同被孩童拆毁得沙堡一般塌落成了废墟。\n“本还以为你们能逃出来会聪明点的，没想到还是和那些蠢货一样直直的往前逃呢？”\n看着那逃出的几十个幸存者，嘴上说着自己毫不在意的希瞳仅仅是两步就追上了奔逃的人群。本还宽阔的大街，一下子便被她重踏所扬起的尘土所笼罩。\n“逃？逃的掉吗？”\n眼前一同逃跑的同伴消失不见，视野里只剩下了她冰冷的鞋底。末了，也不过是被她随意的一脚抹去，仅仅是比那些被双腿和臀部挤碎的小人多活了两三分钟。\n“真是的......才刚刚有感觉呢？”\n希瞳抬起脚来，看了看自己再度沾染上小人的鞋底，厌恶的又用身旁的建筑将脚底的血腥擦掉。\n“嗯？看起来你们居然还能有比我高的楼呢？不错哦？”\n踏平了繁华商业街的她，发现了身旁的，有着150米的大楼。作为百倍大小的少女，她则刚好比这栋可以称得上是地标性的建筑高出了整整一个头。\n“虽然还是没我高，不过看起来比那些十几层的小楼有意思不少呢？”\n这样说着的少女蹲了下来，用手指轻轻的沿着外墙滑动着。本该忙于工作的小人们被惊动，却被少女巨大的几乎是占满一层楼高度的淡红色眼瞳，以及她那对微微摇晃的，和大楼比还要宽上不少的乳房所惊吓到。\n“真是的，现在才察觉到自己的命运吗？不过，在死之前，你们可一定要满足我啊~”\n这样说着的希瞳，踮起了自己的脚跟，将自己的巨乳完全靠在了大楼之上。\n温热的双乳，顺着大厦流线型的外表微微滑动，散发着一股少女独特的气味。伴随着少女的上下晃动，整个大楼也被希瞳拥抱着，伴随着她的动作不断地震动着。周遭的大地出现裂纹，坚固的窗户虽比之前的商场要牢靠上不少，却依然不少布上了裂纹。\n“嗯呐~努力反抗我吧~”\n大楼的顶端完全破碎，变成了她胸口的形状。包裹着南半球的衣服早已脱落，露出了 she 那圆润柔软的双乳。但在如此巨大的重量和大小之下，就算是能够养育生命的乳头，也几乎是如同一个坚硬的岩石一般，不断地在被破坏的越来越严重的建筑上留下深深的刻痕。\n“呼......冰冰凉凉的大楼粉碎在我的巨乳上......还挺舒服的，不过这些乳汁......要留给更多的小人呢？”\n空气中弥漫着一股乳香味。已经喷出一些的白色乳汁在建筑的残骸之中缓缓流动着，散发着蒸汽。而此刻的少女，则再次蹲了下来。透过满是裂纹的窗户，只能看到那些逃不出的所谓“精英”，正蜗居在大楼的中间，畏畏缩缩的看着注视自己的巨大女仆。\n“各位，想要死的更有价值一些吗？”\n希瞳轻启双唇，慢慢的哈出了湿热的空气。水汽逐步的遮蔽了玻璃幕墙，让小家伙们得以忽略掉巨大的淡红色眼瞳，以及那堆裸露在风中的丰硕乳房。但仿佛是抽奖一般，少女端详着，伸出手来，一下就击碎了大楼的某处。\n“恭喜你们，成为我今天的第一口小零食！”\n惊恐的上班族们想要逃跑，却只能眼睁睁的看着自己的同事被手指夹着，拉出了已经是巨大破洞的窗外。\n“我......我还不想死，救命......啊！”\n连话都没说几句，倒霉的白领就被希瞳丢入口中。伴随着他的惨叫声， he 如同一块生肉那般，被巨大的牙齿所碾碎。只有1/100的他，甚至比希瞳的牙齿还要小一些。在她本能的咀嚼之下，骨骼咯啦咯啦的被碾碎，体内的一切都被挤出，然后再被唾液混合，被舌头推挤到了一边。\n“怎么样？死的很干脆吧？”\n希瞳再次张大嘴巴，让各位得以看清那倒霉蛋的死法。在大家被这番画面震惊到说不出话的时候，她的另一只手也深入大楼之中，将一个又一个的幸存者拉了出来，丢到了自己的手心之中。\n“嗯......不错？光是吃掉一只小家伙的话还是不够解馋呢？”\n希瞳这样说着，将手掌斜向了自己张大的巨口。在不断地惊呼之中，小人们想要朝着手掌的另一侧攀爬着，却抵挡不过地球的重力，滑落到了她的嘴中，如同跳跳糖一般在她的舌头之上蹦跳了几下。几十只本该有着美满生活的小虫子......就这样化作了女仆的解压零食。在旁人的围观之下，那双雪白的皓齿逐步落下，将想要挣扎着逃出生天的小人拦腰斩断。伴随着少女不清的咀嚼声，口中的求救和挣扎几乎瞬间断绝。就算是得以逃到牙齿下方，得以不被几下斩断粉碎的小人，也被那巨龙一般灵活的舌头推挤着，成为了上下牙齿之间的亡魂。\n“嗯~嗯~”\n伴随着鲜活的生命成为了自己的食糜，少女发出了满意的轻哼。咕咚一声，便将这些人类化成的看不清样貌的血肉，混合着口水一同咽下。\n“真是美妙呢，没想到这么久过去你们的味道已经变好了许多呢？”\n少女对着楼内的幸存者微微笑着，但大家却只能注意到她洁白的牙齿，已经沾满了同类遗留下的，可怕至极的暗红色血肉。\n“但是你们剩下的小人，可就没那么幸运了呢~”\n伴随着希瞳的轻哼声，她转过身弯下腰来，将自己圆润的屁股对准了这座还在勉强支撑着的大楼。\n“既然你们得以有幸存活到现在的话，那么......”\n少女的巨大臀部，轻轻的在风中晃动着。洁白的胖次，也因为刚刚的玩弄湿润了一小片. 肉肉的大腿, 肉肉的屁股, 在外人看来是极具诱惑力的情色, 对于残留的小人, 却怎么也想不到自己竟会惨死在这番美景之下. 在那巨大臀部一次又一次的撞击之下, 本还顽强地保持直立着的大楼, 在少女一次又一次的撞击之下逐渐弯曲变形, 最终, 被可恶的女仆的肥硕屁股一下撞断, 将整个建筑化作了尘烟.\n“呼......你们想的比我坚强不少吗？不过，就这点本事了吗？”\n少女的脚底抵着残余的半截大楼，用力一踢，将大楼本事连根拔起击倒在地。再度转过身来的她，也没有刚刚的那番挑逗，仅仅是来自鞋底的两脚重踏，便彻底的将自己刚刚还在玩弄的这“玩具”，化作了残破街区之中的两只巨大的脚印。\n“呼......接下来又是什么呢？好期待啊，发展了千年的小小人们，能怎么反抗我这个巨大化的女仆呢......”
  gts_hitomi.7.desc: "\"The houses here are quite a bit taller, aren't they? It seems this is a new settlement for you little guys, isn't it?\"\\nHitomi stands on the streets of the tiny people, the surrounding buildings have become much more prosperous. Many are covered with transparent glass, and the colored lights that have lost their energy didn't reveal the most beautiful side of the block to our maid, but for her, whose goal is to annihilate all life on this planet, these buildings are merely the prey she will choose next. Hmm? It seems your buildings have become much taller than when you deceived me before...\\nHitomi provocatively walked to the building in front of her. The skyscraper, which was just a section lower than her knees, seemed not to have received any warning yet. Leaning down slightly, she saw the little guys busy inside, not yet knowing what was happening outside. Suddenly, the girl, struck by a wicked interest, stepped her feet on both sides of the building. As a maid, she gently squatted on top of the shopping mall. Her white silk panties easily crushed various equipment on the roof of the building, and the antennas slowly bent and broke against her camel toe, giving Hitomi a hint of an itchy sensation. She tightened her thighs, gradually squeezing the upper part of the mall under her slightly plump and firm thighs. Accompanied by the faint wailing from beneath her, the satisfied girl began to squeeze the living space of those unfortunate souls bit by bit.\\n\"Since you don't want to run, then it's voluntary, right?\"\\nWith her toes pointed inward, her round shoe tips pushed through the main doors, scaring the crowd blocked at the entrance into leaning back repeatedly. As wails rose from all parts of the building, the once magnificent glass curtain walls gradually couldn't withstand the pressure from the girl's top-down squeeze and shattered one after another. With the floors collapsing layer by layer, the busy mall finally couldn't withstand the girl's pressure and collapsed by two or three floors.\\n\"Really, you don't even have the ability to serve as a chair? Useless~\"\\nHitomi said with disgust, gradually closing her white silk-wrapped legs. Although tiny people were jumping down from the lower floors one by one, she didn't care at all and used her buttocks and legs to execute the three hundred odd tiny people trapped beneath her.\\nAmidst the exclamations of the tiny people, the building finally couldn't withstand the power of the giant maid and collapsed into ruins between her calves like a sandcastle destroyed by a child.\\n\"I thought you'd be a bit smarter if you managed to escape, but I didn't expect you to just run straight forward like those idiots.\"\\nLooking at the dozens of survivors who escaped, Hitomi, who claimed she didn't care at all, caught up with the fleeing crowd in just two steps. The once wide street was suddenly shrouded in the dust raised by her heavy stomps.\\n\"Escape? Can you escape?\"\\nThe companions who were fleeing together disappeared, and only her cold shoe soles remained in their field of vision. In the end, they were wiped away by her casual foot, living only two or three minutes longer than those tiny people crushed by her legs and buttocks.\\n\"Really... I was just starting to get a feeling...\"\\nHitomi lifted her foot and looked at her soles, which were once again stained with tiny people, and in disgust used a nearby building to wipe off the blood on her soles.\\n\"Hmm? It seems you actually have buildings taller than me? Not bad.\"\\nHaving flattened the prosperous commercial street, she discovered a 150-meter building nearby. As a girl of a hundred times the size, she was just exactly one head taller than this building, which could be called a landmark.\\n\"Though it's still not as tall as me, it looks much more interesting than those ten-story little buildings.\"\\nSo saying, the girl squatted down, gently sliding her finger along the outer wall. The tiny people who should have been busy working were startled, but were terrified by the girl's giant
    pale red eyes, which almost filled an entire floor's height, and her pair of breasts, which were slightly swaying and were much wider than the building.\\n\"Really, only now do you realize your fate? But, before you die, you must satisfy me~\"\\nSaying this, Hitomi stood on her heels and leaned her giant breasts completely against the building.\\nHer warm breasts slid slightly along the streamlined surface of the building, emitting a unique girl's scent. As the girl swayed up and down, the entire building was also embraced by Hitomi, vibrating constantly with her movements. Cracks appeared in the surrounding earth, and although the sturdy windows were much more reliable than those of the previous mall, many still became covered in cracks.\\n\"Nn~ Try your best to resist me~\"\\nThe top of the building was completely broken, taking the shape of her chest. The clothes covering the southern hemisphere had long since fallen off, revealing her round and soft breasts. But under such giant weight and size, even nipples that could nurture life were almost like hard rocks, constantly leaving deep gashes on the increasingly severely damaged building.\\n\"Phew... the icy cold building crushing against my giant breasts... it's quite comfortable, but this milk... must be saved for more tiny people, right?\"\\nThe air was filled with a milky fragrance. Some white milk had already sprayed out and was slowly flowing among the ruins of the building, emitting steam. And at this moment, the girl squatted down again. Through the windows full of cracks, she could only see those so-called \"elites\" who couldn't escape, huddled in the middle of the building, looking timidly at the giant maid watching them.\\n\"Everyone, do you want to die with more value?\"\\nHitomi parted her lips slightly, slowly exhaling moist and hot air. The water vapor gradually obscured the glass curtain wall, allowing the little guys to ignore her giant pale red eyes and the pair of plump breasts exposed to the wind. But as if drawing a lottery, the girl scrutinized them, reached out her hand, and instantly shattered a certain part of the building.\\n\"Congratulations, you've become my first snack of the day!\"\\nThe terrified office workers wanted to escape, but could only watch helplessly as their colleagues were pinched between her fingers and pulled out of the window, which was already a giant hole.\\n\"I... I don't want to die yet, help... ah!\"\\nWithout even saying a few words, the unlucky white-collar worker was thrown into Hitomi's mouth. Amidst his screams, he was crushed by giant teeth like a piece of raw meat. Being only 1/100th of her size, he was even smaller than Hitomi's teeth. Under her instinctive chewing, the bones were ground with a crackling sound, everything inside was squeezed out, then mixed with saliva and pushed to one side by her tongue.\\n\"How was it? A very quick death, wasn't it?\"\\nHitomi opened her mouth wide again, letting everyone see the unlucky one's manner of death. While everyone was shocked beyond words by this scene, her other hand also reached deep into the building, pulling out survivors one by one and dropping them into her palm.\\n\"Hmm... not bad. Just eating one little guy isn't enough to satisfy the craving.\"\\nHitomi said this, tilting her palm toward her giant open mouth. Amidst constant screams, the tiny people tried to climb toward the other side of her palm, but couldn't withstand Earth's gravity and slid into her mouth, bouncing a few times on her tongue like popping candy. Dozens of little insects who should have had happy lives... just turned into the maid's stress-relief snacks. Under the gaze of onlookers, that pair of snow-white teeth gradually came down, cutting in half the tiny people who wanted to struggle to escape. Accompanied by the girl's indistinct chewing sounds, the calls for help and struggles in her mouth were cut off almost instantly. Even the tiny people who managed to escape beneath her teeth and avoid being cut and crushed in a few strokes were pushed by that dragon-like flexible tongue, becoming
    souls of the departed between her upper and lower teeth.\\n\"Nn~ Nn~\"\\nAs fresh lives became her chyme, the girl let out a satisfied hum. With a gulp, she swallowed these flesh and blood turned from humans, whose appearances were no longer distinguishable, mixed with saliva.\\n\"It's truly wonderful, I didn't expect that after so long your taste would have improved so much.\"\\nThe girl smiled slightly at the survivors in the building, but everyone could only notice her snow-white teeth, which were already stained with the terrifying dark red flesh left behind by their comrades.\\n\"But for the rest of you tiny people, you won't be so lucky~\"\\nAccompanied by Hitomi's hum, she turned around and bent down, aiming her round buttocks at this building that was still barely supporting itself.\\n\"Since you've had the luck to survive until now, then...\"\\nThe girl's giant buttocks swayed gently in the wind. Her snow-white panties were also slightly moistened from the play just now. Fleshy thighs, fleshy buttocks, what appeared to outsiders as highly seductive eroticism, the remaining tiny people could never have imagined they would meet a tragic death under such scenery. Under the repeated impacts of those giant buttocks, the building that was still stubbornly standing upright gradually bent and deformed under the girl's repeated impacts, and finally, was broken in one go by the perverted maid's plump buttocks, turning the entire building into dust.\\n\"Phew... you're a bit tougher than I thought. But, is that all you've got?\"\\nThe girl's sole pressed against the remaining half of the building and kicked hard, uprooting the building and knocking it to the ground. Turning around again, she no longer had that provocative playfulness, merely two heavy stomps from her soles, and the \"toy\" she was just playing with was completely turned into two giant footprints in the ruined block.\\n\"Phew... what's next? I'm so looking forward to it. How can the little people who have developed for a thousand years resist me, this giant maid...\""
