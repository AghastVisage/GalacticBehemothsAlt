  gts_hitomi.7.desc: "\\\"The houses here are quite a bit taller, aren't they? It seems this is a new settlement for you little guys, isn't it?\\\"\\\\nHitomi stands on the streets of the tiny people, the surrounding buildings have become much more prosperous. Many are covered with transparent glass, and the colored lights that have lost their energy didn't reveal the most beautiful side of the block to our maid, but for her, whose goal is to annihilate all life on this planet, these buildings are merely the prey she will choose next. Hmm? It seems your buildings have become much taller than when you deceived me before...\\\\nHitomi provocatively walked to the building in front of her. The skyscraper, which was just a section lower than her knees, seemed not to have received any warning yet. Leaning down slightly, she saw the little guys busy inside, not yet knowing what was happening outside. Suddenly, the girl, struck by a wicked interest, stepped her feet on both sides of the building. As a maid, she gently squatted on top of the shopping mall. Her white silk panties easily crushed various equipment on the roof of the building, and the antennas slowly bent and broke against her camel toe, giving Hitomi a hint of an itchy sensation. She tightened her thighs, gradually squeezing the upper part of the mall under her slightly plump and firm thighs. Accompanied by the faint wailing from beneath her, the satisfied girl began to squeeze the living space of those unfortunate souls bit by bit.\\\\n\\\"Since you don't want to run, then it's voluntary, right?\\\"\\\\nWith her toes pointed inward, her round shoe tips pushed through the main doors, scaring the crowd blocked at the entrance into leaning back repeatedly. As wails rose from all parts of the building, the once magnificent glass curtain walls gradually couldn't withstand the pressure from the girl's top-down squeeze and shattered one after another. With the floors collapsing layer by layer, the busy mall finally couldn't withstand the girl's pressure and collapsed by two or three floors.\\\\n\\\"Really, you don't even have the ability to serve as a chair? Useless~\\\"\\\\nHitomi said with disgust, gradually closing her white silk-wrapped legs. Although tiny people were jumping down from the lower floors one by one, she didn't care at all and used her buttocks and legs to execute the three hundred odd tiny people trapped beneath her.\\\\nAmidst the exclamations of the tiny people, the building finally couldn't withstand the power of the giant maid and collapsed into ruins between her calves like a sandcastle destroyed by a child.\\\\n\\\"I thought you'd be a bit smarter if you managed to escape, but I didn't expect you to just run straight forward like those idiots.\\\"\\\\nLooking at the dozens of survivors who escaped, Hitomi, who claimed she didn't care at all, caught up with the fleeing crowd in just two steps. The once wide street was suddenly shrouded in the dust raised by her heavy stomps.\\\\n\\\"Escape? Can you escape?\\\"\\\\nThe companions who were fleeing together disappeared, and only her cold shoe soles remained in their field of vision. In the end, they were wiped away by her casual foot, living only two or three minutes longer than those tiny people crushed by her legs and buttocks.\\\\n\\\"Really... I was just starting to get a feeling...\\\"\\\\nHitomi lifted her foot and looked at her soles, which were once again stained with tiny people, and in disgust used a nearby building to wipe off the blood on her soles.\\\\n\\\"Hmm? It seems you actually have buildings taller than me? Not bad.\\\"\\\\nHaving flattened the prosperous commercial street, she discovered a 150-meter building nearby. As a girl of a hundred times the size, she was just exactly one head taller than this building, which could be called a landmark.\\\\n\\\"Though it's still not as tall as me, it looks much more interesting than those ten-story little buildings.\\\"\\\\nSo saying, the girl squatted down, gently sliding her finger along the outer wall. The tiny people who should have been busy working were startled, but were terrified by the girl's giant pale red eyes, which almost filled an entire floor's height, and her pair of breasts, which were slightly swaying and were much wider than the building.\\\\n\\\"Really, only now do you realize your fate? But, before you die, you must satisfy me~\\\"\\\\nSaying this, Hitomi stood on her heels and leaned her giant breasts completely against the building.\\\\nHer warm breasts slid slightly along the streamlined surface of the building, emitting a unique girl's scent. As the girl swayed up and down, the entire building was also embraced by Hitomi, vibrating constantly with her movements. Cracks appeared in the surrounding earth, and although the sturdy windows were much more reliable than those of the previous mall, many still became covered in cracks.\\\\n\\\"Nn~ Try your best to resist me~\\\"\\\\nThe top of the building was completely broken, taking the shape of her chest. The clothes covering the southern hemisphere had long since fallen off, revealing her round and soft breasts. But under such giant weight and size, even nipples that could nurture life were almost like hard rocks, constantly leaving deep gashes on the increasingly severely damaged building.\\\\n\\\"Phew... the icy cold building crushing against my giant breasts... it's quite comfortable, but this milk... must be saved for more tiny people, right?\\\"\\\\nThe air was filled with a milky fragrance. Some white milk had already sprayed out and was slowly flowing among the ruins of the building, emitting steam. And at this moment, the girl squatted down again. Through the windows full of cracks, she could only see those so-called \\\"elites\\\" who couldn't escape, huddled in the middle of the building, looking timidly at the giant maid watching them.\\\\n\\\"Everyone, do you want to die with more value?\\\"\\\\nHitomi parted her lips slightly, slowly exhaling moist and hot air. The water vapor gradually obscured the glass curtain wall, allowing the little guys to ignore her giant pale red eyes and the pair of plump breasts exposed to the wind. But as if drawing a lottery, the girl scrutinized them, reached out her hand, and instantly shattered a certain part of the building.\\\\n\\\"Congratulations, you've become my first snack of the day!\\\"\\\\nThe terrified office workers wanted to escape, but could only watch helplessly as their colleagues were pinched between her fingers and pulled out of the window, which was already a giant hole.\\\\n\\\"I... I don't want to die yet, help... ah!\\\"\\\\nWithout even saying a few words, the unlucky white-collar worker was thrown into Hitomi's mouth. Amidst his screams, he was crushed by giant teeth like a piece of raw meat. Being only 1/100th of her size, he was even smaller than Hitomi's teeth. Under her instinctive chewing, the bones were ground with a crackling sound, everything inside was squeezed out, then mixed with saliva and pushed to one side by her tongue.\\\\n\\\"How was it? A very quick death, wasn't it?\\\"\\\\nHitomi opened her mouth wide again, letting everyone see the unlucky one's manner of death. While everyone was shocked beyond words by this scene, her other hand also reached deep into the building, pulling out survivors one by one and dropping them into her palm.\\\\n\\\"Hmm... not bad. Just eating one little guy isn't enough to satisfy the craving.\\\"\\\\nHitomi said this, tilting her palm toward her giant open mouth. Amidst constant screams, the tiny people tried to climb toward the other side of her palm, but couldn't withstand Earth's gravity and slid into her mouth, bouncing a few times on her tongue like popping candy. Dozens of little insects who should have had happy lives... just turned into the maid's stress-relief snacks. Under the gaze of onlookers, that pair of snow-white teeth gradually came down, cutting in half the tiny people who wanted to struggle to escape. Accompanied by the girl's indistinct chewing sounds, the calls for help and struggles in her mouth were cut off almost instantly. Even the tiny people who managed to escape beneath her teeth and avoid being cut and crushed in a few strokes were pushed by that dragon-like flexible tongue, becoming souls of the departed between her upper and lower teeth.\\\\n\\\"Nn~ Nn~\\\"\\\\nAs fresh lives became her chyme, the girl let out a satisfied hum. With a gulp, she swallowed these flesh and blood turned from humans, whose appearances were no longer distinguishable, mixed with saliva.\\\\n\\\"It's truly wonderful, I didn't expect that after so long your taste would have improved so much.\\\"\\\\nThe girl smiled slightly at the survivors in the building, but everyone could only notice her snow-white teeth, which were already stained with the terrifying dark red flesh left behind by their comrades.\\\\n\\\"But for the rest of you tiny people, you won't be so lucky~\\\"\\\\nAccompanied by Hitomi's hum, she turned around and bent down, aiming her round buttocks at this building that was still barely supporting itself.\\\\n\\\"Since you've had the luck to survive until now, then...\\\"\\\\nThe girl's giant buttocks swayed gently in the wind. Her snow-white panties were also slightly moistened from the play just now. Fleshy thighs, fleshy buttocks, what appeared to outsiders as highly seductive eroticism, the remaining tiny people could never have imagined they would meet a tragic death under such scenery. Under the repeated impacts of those giant buttocks, the building that was still stubbornly standing upright gradually bent and deformed under the girl's repeated impacts, and finally, was broken in one go by the perverted maid's plump buttocks, turning the entire building into dust.\\\\n\\\"Phew... you're a bit tougher than I thought. But, is that all you've got?\\\"\\\\nThe girl's sole pressed against the remaining half of the building and kicked hard, uprooting the building and knocking it to the ground. Turning around again, she no longer had that provocative playfulness, merely two heavy stomps from her soles, and the \\\"toy\\\" she was just playing with was completely turned into two giant footprints in the ruined block.\\\\n\\\"Phew... what's next? I'm so looking forward to it. How can the little people who have developed for a thousand years resist me, this giant maid...\\\""
  gts_hitomi.7.a: "Continue observing"
  #  一千七百多米的希瞳可爱的坐在城市之中，无聊的寻找着自己的下一个目标。\n“你们真是太弱了~抵抗也抵抗不了，逃，又能逃到哪里去呢？”\n希瞳轻轻晃动着自己的双脚，像是碾碎蚁群一般，不断地用自己的脚跟砸入小人的街道之中。人群如同无头苍蝇一般在她巨大的身躯之下四处奔逃着，而希瞳不过是用脚跟轻轻砸下，就能将几十个人的人群连同周围的大楼，一起用自己那厚实的长鞋跟碾作尘土。\n“完全没意思呢......没办法，只能让你们提前感受一下了呢？”\n这样说着的少女，无趣的用指尖勾上了自己的鞋跟。伴随着一股浓郁的气味笼罩大地，希瞳那有些发黄的白丝从那双洛丽塔皮鞋之中被抽了出来。伴随着一股浓郁的气味，那些躲藏在楼宇和地下的小人都不由得的捂住口鼻。\n“嗯哼？你们难道不觉得这股臭味很美妙吗？”\n用手指捏住自己的鞋帮，希瞳稍加思索，便将自己巨大的鞋子看似随意的丢出。在轰鸣之中，那巨大的鞋子重重的倒在城市之中，滚动翻转的鞋身将逃命的小人，连同繁华的街区一同压扁。只留下了那高墙一般的，还粘着各种建筑小人以及汽车残骸的脏污鞋底。\n“呵呵？就这点本事吗，那，另一只鞋子也请你们保管好哦？”\n巨大的鞋子，即使看起来只是朴实无华的高跟洛丽塔鞋，但在千倍的大小下，依然有着毁天灭地的重量。重重落地的鞋子，竟然勉强维持了自己的直立。屹立在城市之中的鞋子，即使与这个城市最为高耸的建筑物比起来都颇为庞大。而那些曾经能让希瞳好好玩弄的商场和居民楼，如今也不过是她脚趾大的无趣建筑物罢了。更为巨大化的她，此刻需要更为有趣的建筑来好好发泄一通。\n“嗯？居然全部逃到这里了吗？是等着我把你们一块扫除掉吗？”\n左右扫视着的希瞳，忽然在一片无趣的灰色建筑物里发现了什么。\n“真是......有不少呢？”\n少女转过身来，巨大的双腿横跨了数个街区，一左一右的砸在体育场的旁边。场内残存的上万人......还以为自己已经躲过了少女的视线，再度抬头，迎接他们的却是少女的坏笑，以及她正在轻轻晃动着的，那一双大臭脚。\n“呕......”\n此时的体育场对希瞳，究竟是什么呢？这么个建筑物，看起来也确实能让希瞳踩上几脚，但是玩心大发的希瞳，却不想这么轻松的让面前的小人儿轻易死去。\n“既然你们有幸被我挑中了，那么，可是要好好的来仰望你们归来的......”\n希瞳轻摇着嘴唇，说出了她一直都想说出的那句话。\n“'女神'哦。”\n坐在地上曲着腿的少女，轻轻的抬起了自己的左足。那被束缚了千年的足部，此刻正毫无遮掩的展示在所有人的面前。千年的积怨如同这脚臭一般，泛黄的脚底，以及勾动着丝袜的巨大脚趾，都彰显着这位女仆曾经统治着这个星球的过往。\n“不错哦，你们居然还能逃到这里呢？真不错呢~看看你们的同伴，就没那么幸运了呢？”\n希瞳微微弯腰，用自己的手指指着那些不幸被碾碎并被粘在脚底上的垃圾。\n“小家伙们的城市，还挺多姿多彩的吗？”\n希瞳用手指指着那些粘在自己足底的残骸，一个接一个的吐槽着。\n“看起来你们这些人真是慌不择路呢，不过也方便被我一脚踩扁了耶。”\n有些挑衅的她，一边说着，一边将粘在脚底的各种被碾作铁片的小车揭下，丢在了体育场的一旁。一边耻笑着那些不自量力的，被自己脚跟一脚击碎的人群，一边感受着那胯下上万人对于自己的恐惧和钦慕。\n“嗯？我有说你们可以走吗？”\n忽然间，希瞳看到了什么。那是正在自己足下奔逃着的上百人。就算是被她抬起的左脚阴影所笼罩，却依然侥幸的觉得巨大的女仆根本注意不到自己的存在。只可惜，这样的蚂蚁逃窜，已经杀死了数十万人的希瞳自然是已经习惯了呢。伴随着巨大的脚跟在一瞬间砸在人群之中，大笑着的希瞳，将自己的脚跟当作的碾碎东西的杵一般，在那人群之中重重地旋转碾碎着。看着那所剩无几的小人们四散奔逃，杀戮成瘾的她几乎是用自己庞大的力量，将她脚边胆敢逃跑的每一只小人，都用自己的脚跟碾碎成了不分你我的细碎血肉。\n“怎么样？胆敢逃跑的下场......就是这样哦？各位愚蠢的虫子~”\n再次抬起脚的希瞳，她的脚跟正滴落着那人类的混合物。这番残忍血腥的场景，令场内避难的小人们不由得连连后退。看着小人们在自己脚下屁滚尿流的场面，希瞳更是张狂的用脚底抵住了面前巨蛋般的体育馆，用自己的双脚不断地拍动着本就脆弱的避难所。\n“呵呵~你们真是弱小啊？哪里也去不了，反抗又做不了，只能把自己最为不堪的一面暴露给你们的毁灭神来看呢？”\n伴随着希瞳的双脚平铺在场馆的巨大穹顶上，仅剩的不到万人......正体验着身为希瞳脚底的足垫虫一般的待遇。每一口的呼吸，都是将希瞳积累了许久的脚臭吸入肺中的，浓郁到说不出话的臭味。索性，身为巨大女仆的希瞳也还没可怕到光光能用脚臭就能夺走人性命的程度。但在这番黑暗潮湿的足臭折磨之下，纵使是再有生命里的小人，也不得不在希瞳的足下败下阵来。\n“不过，反正你们也已经没啥用处了呢......”\n玩弄尽兴了的希瞳，终于想起来了自己灭杀人类的人物。伴随着盘腿的少女将双脚一左一右的夹在一个体育场的两旁，就连最为宽广的大街，此刻对于她的小腿来说都过于窄小。而在足心当中的体育场，此时已无人再敢逃跑，宁愿直面被面前这巨大女仆碾碎的命运。\n“哗啦——”\n在双脚闭合的一瞬间，巨蛋一般乳白色外壳的体育馆......便在她的足下彻底的被碾碎。意犹未尽的她，再搓动了几下双脚，直到再也感受不到双脚之间的生命气息才作罢。\n“果然只是一群愚笨的虫子呢？甚至是看到我白丝包裹着的巨大足底，都会害怕呢？”\n完全用双脚灭杀了这“避难所”里的一万小人的她，满意的抬起了自己的一只脚。穹顶和座椅的残骸从她的脚底像碎屑一般抖落，只留下了那些被鲜血浸透了的帐篷，以及成片成片的，曾是小人的红点。\n“没想到你们这些小人这么小呢？还没那些逃跑的家伙有意思呢......”
