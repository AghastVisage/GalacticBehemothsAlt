  #  這一季度的財務報表簡直是場災難。 你看著全息屏幕上那幾行觸目驚心的紅色赤字，長嘆了一口氣。又要維護龐大的艦隊，又要搞基建，還要滿足刁民們的需求，資源早就捉襟見肘了。就在你準備削減一部分科研預算時，一陣腳步聲逐漸接近。 “主人，你的眉頭皺得都能夾死蚊子了哦？” 雙月希瞳整個人毫無形象的坐到你的椅子扶手上，還搶過你的鋼筆轉了起來。\n“別煩我，希瞳。由於財政赤字，我們甚至快發不出你下個月的零食費了。”你無奈地把筆搶了回來。\n聽到“零食費”三個字，希瞳立刻坐直了身子，掃了一眼報表，隨後露出了一個神祕兮兮的壞笑。\n“既然主人你搞不定，我也搞不定，那我們為什麼不把‘那個傢伙’拉過來干活呢？就是創造了‘雙月希瞳’這個存在的那個傢伙哦，御月希瞳哦”\n雙月希瞳一邊說著，一邊在通訊終端上熟練地輸入了一串複雜的座標代碼。伴隨著她按下確認鍵，辦公室內原本穩定的空間結構突然像水波一樣蕩漾開來，隨後撕裂出一道紫色的縫隙。然而，預想中的少女並沒有出現，相反，裂縫那邊傳來了一陣死死抓住門框不肯鬆手的摩擦聲。雙月希瞳恨鐵不成鋼地嘖了一聲，直接伸手進裂縫，一把抓住了對方的手腕，像拔蘿蔔一樣把裡面的人硬生生地拽了出來。\n一個穿著灰色針織開衫和百褶短裙的身影狼狽地跌坐在了辦公室的地毯上。 這位名為御月希瞳的少女，有著一頭柔順的灰棕色長發，頭頂的獸耳因為驚嚇而成了飛機耳，那雙漂亮的紫色眼瞳里此刻寫滿了剛睡醒般的困惑和對陌生環境的極度恐慌。 她下意識地整理了一下自己有些凌亂的衣領和裙擺，縮著身子，連看都不敢看你一眼。\n雙月雙手叉腰，指著全息屏幕上那一片紅色的赤字報表，理直氣壯地對坐在地上的御月說道： “聽好了！主人的帝國現在財政大崩潰！艦隊要沒飯吃了，我也快沒零食吃了！現在立刻、馬上，發揮你那個聰明的大腦，給我們當行政官！”\n“行……行政官？！” 御月希瞳嚇得聲音都變了調，雙手不安地絞著衣角，眼神慌亂地在地面上游移。 “不、不行的……絕對不行的……我……我這種人，怎麼可能管理一個帝國啊……”
  #  这一季度的财务报表简直是场灾难。 你看着全息屏幕上那几行触目惊心的红色赤字，长叹了一口气。又要维护庞大的舰队，又要搞基建，还要满足刁民们的需求，资源早就捉襟见肘了。就在你准备削减一部分科研预算时，一阵脚步声逐渐接近。 “主人，你的眉头皱得都能夹死蚊子了哦？” 双月希瞳整个人毫无形象的坐到你的椅子扶手上，还抢过你的钢笔转了起来。\n“别烦我，希瞳。由于财政赤字，我们甚至快发不出你下个月的零食费了。”你无奈地把笔抢了回来。\n听到“零食费”三个字，希瞳立刻坐直了身子，扫了一眼报表，随后露出了一个神秘兮兮的坏笑。\n“既然主人你搞不定，我也搞不定，那我们为什么不把‘那个家伙’拉过来干活呢？就是创造了‘双月希瞳’这个存在的那个家伙哦，御月希瞳哦”\n双月希瞳一边说着，一边在通讯终端上熟练地输入了一串复杂的坐标代码。伴随着她按下确认键，办公室内原本稳定的空间结构突然像水波一样荡漾开来，随后撕裂出一道紫色的缝隙。然而，预想中的少女并没有出现，相反，裂缝那边传来了一阵死死抓住门框不肯松手的摩擦声。双月希瞳恨铁不成钢地啧了一声，直接伸手进裂缝，一把抓住了对方的手腕，像拔萝卜一样把里面的人硬生生地拽了出来。\n一个穿着灰色针织开衫和百褶短裙的身影狼狈地跌坐在了办公室的地毯上。 这位名为御月希瞳的少女，有着一头柔顺的灰棕色长发，头顶的兽耳因为惊吓而成了飞机耳，那双漂亮的紫色眼瞳里此刻写满了刚睡醒般的困惑和对陌生环境的极度恐慌。 她下意识地整理了一下自己有些凌乱的衣领和裙摆，缩着身子，连看都不敢看你一眼。\n双月双手叉腰，指着全息屏幕上那一片红色的赤字报表，理直气壮地对坐在地上的御月说道： “听好了！主人的帝国现在财政大崩溃！舰队要没饭吃了，我也快没零食吃了！现在立刻、马上，发挥你那个聪明的大脑，给我们当行政官！”\n“行……行政官？！” 御月希瞳吓得声音都变了调，双手不安地绞着衣角，眼神慌乱地在地面上游移。 “不、不行的……绝对不行的……我……我这种人，怎么可能管理一个帝国啊……”
  gts_hitomi.426.desc: "This quarter's financial statement is a total disaster. You look at the rows of shocking red deficits on the holographic screen and let out a long sigh. Maintaining a massive fleet, managing infrastructure, and satisfying the needs of fussy citizens—your resources have long been stretched thin. Just as you're preparing to cut part of the research budget, the sound of footsteps approaches. \\\"Master, your brow is furrowed so tightly it could crush a mosquito, you know?\\\" Double-Moon Hitomi unceremoniously sits on the arm of your chair, snatching your fountain pen and spinning it. \\\\n\\\"Don't bother me, Hitomi. Due to the fiscal deficit, we can barely afford to pay for your snacks next month.\\\" You helplessly snatch the pen back. \\\\nHearing the words 'snack money,' Hitomi immediately sits up straight, glances at the report, and then lets out a mysterious, wicked grin. \\\\n\\\"Since master can't handle it, and I can't either, why don't we drag 'that girl' over here to work? You know, the one who created the existence known as 'Double-Moon Hitomi'—Mizuki Hitomi!\\\" \\\\nAs she speaks, Double-Moon Hitomi expertly types a string of complex coordinate codes into the comms terminal. The moment she hits confirm, the stable space within the office ripples like water before tearing open into a purple rift. However, the girl you expected doesn't appear; instead, a scraping sound comes from the other side of the rift—someone clutching a doorframe and refusing to let go. Double-Moon Hitomi tsked in disappointment, reached into the rift, grabbed the other's wrist, and hauled her out like pulling a radish. \\\\nA figure in a grey knit cardigan and a pleated short skirt tumbles awkwardly onto the office carpet. This girl, named Mizuki Hitomi, has smooth brownish-grey hair and animal ears flattened in fright; her beautiful purple eyes are filled with the confusion of someone who just woke up and extreme panic at the unfamiliar surroundings. She instinctively tidies her disheveled collar and skirt, huddling and not daring to even look at you. \\\\nDouble-Moon, hands on her hips, points at the red deficit on the holographic screen and speaks righteously to the girl on the floor: \\\"Listen up! Master's Empire is having a financial meltdown! The fleet is going hungry, and I'm about to run out of snacks! Right now, immediately, use that big brain of yours and be our Administrator!\\\" \\\\n\\\"Ad... Administrator?!\\\" Mizuki Hitomi's voice cracks in terror; her hands wring her skirt edges anxiously as her gaze darts across the floor. \\\"No... no... definitely impossible... how could someone like me possibly manage an empire...\\\""
