  gts_hitomi_anomaly: "Unknown Distress Signal"
  #  “廣闊無垠的大宇宙，被寂靜環繞的世界之中，既有正走向終結的星球，亦有方才誕生的星球。在這片龐大的星海之中，存在著眾多我們還沒發現研究的文明......”
  gts_hitomi_anomaly_desc: "\"In the vast, boundless universe, within worlds surrounded by silence, there are planets nearing their end and planets just born. In this immense sea of stars, there exist many civilizations we have yet to discover and study...\""
  #  貓貓的求救信號
  gts_hitomi.1.name: "Kitten's Distress Signal"
  #  我們正在探索【希冀】時，忽然有人在打盹時，見到了這樣一段微弱且模糊的視頻影像。本以為只不過是某人的幻覺，沒想到在商量之後，卻都是幾乎同樣的畫面。畫面的中心，是一隻栗色的貓娘，正在說著我們聽不懂的話語。我們，應該嘗試破解這個謎團嗎？
  gts_hitomi.1.desc: "While we were exploring [Hope], someone suddenly saw a faint and blurred video image while dozing off. Initially thought to be someone's hallucination, it turned out that upon discussion, everyone had seen almost the same scene. At the center of the image was a chestnut-colored catgirl speaking words we couldn't understand. Should we attempt to solve this mystery?"
  #  去試著破解吧
  gts_hitomi.1.a: "Try to crack it."
  #  沒有窗戶的大樓
  gts_hitomi_digsite: "The Windowless Building"
  #  經過科研船外圍的研究，我們確認了這是一個還沒有研發出FTL科技，加入群星大家庭的頗為原始的文明。雖然已經發展出了類似我們早期的科技，卻並沒有怎麼涉及星空。通過對於這顆星球的外圍觀察，我們並沒有發現這顆星球上有什麼異於其他文明的東西。但是，隨著我們的接近，以及我們的文明翻譯器不斷地捕獲這顆星球所發射的電磁波，那個出現在我們腦海之中的少女正變的越來越清晰，很快，我們也便明白了她那模糊話語的本意。\n救救我。
  gts_hitomi_digsite_desc: "After research from the periphery by our science ship, we confirmed it is a rather primitive civilization that has not yet developed FTL technology or joined the galactic community. Though they have developed tech similar to our early stages, they have barely touched the stars. Through outer observations of this planet, we found nothing unusual compared to other civilizations. However, as we approached and our translators continued to capture the electromagnetic waves emitted by the planet, the girl appearing in our minds became clearer and clearer. Soon, we understood the true meaning of her blurred words:\\nHelp me."
  #  逐步清晰的面貌
  gts_hitomi.2.name: "A Gradually Clarifying Face"
  #  嗯
  gts_hitomi.2.a: "Hmm"
  #  貿然的營救行動
  gts_hitomi.3.name: "A Rash Rescue Operation"
  #  我們的飛船如同流星一般，劃過了土著星球的天際，卻裝作被捕獲的樣子，進入了環繞他的軌道。\n在土著們還在爭論我們是外星人還是自然現象之時，為了將這隻栗色的女僕貓娘從原住民的魔爪下拯救出來，我們打算冒險一試。\n我們的科學家帶領著小隊，直接傳送到了那城市之下的基地之中。屬於這個星球的科學家……驚奇的看着我們的出現，然後，便被我們逼迫著，交出了得以解救少女的鑰匙。\n望著熟睡在培養皿中，被束縛著掠奪著能量的貓耳少女，我們不禁惋惜起來。但，就在這時，整個基地的警報都響了起來，看來……
  gts_hitomi.3.desc: "Our ship swept across the sky of the primitive planet like a meteor, yet feigned being caught as it entered orbit. While the primitives were still debating whether we were aliens or a natural phenomenon, we decided to risk a rescue to save this chestnut-colored catgirl maid from their clutches. Our scientists led a team, teleporting directly into the base beneath the city. The native scientists... watched our appearance in amazement and were then forced by us to hand over the key to rescue the girl. Looking at the cat-eared girl sleeping in a culture vat, bound and being drained of energy, we couldn't help but feel pity. But just then, the entire base's alarms rang out. It seems..."
  #  是時候了
  gts_hitomi.3.a: "It's time."
  #  破繭而出
  gts_hitomi.4.name: "Bursting from the Cocoon"
  #  巨大的少女破繭而出，嚇得那些趕來圍追堵截的士兵呆若母雞。\n“真的......很感謝你們。”\n淡紅色的眼瞳打量著被一同包圍的科學家，但她的眼神當中卻沒有畏懼，相反，能讀出的則是滿溢的恨。\n後續趕來的士兵如同潮水一般一波波的湧來，巨大的女僕少女則嘗試著翻過身來，用自己龐大的身體擋住士兵們的視線。\n“雖然還沒怎麼了解你們的國家......但是我會記得你們的，不過，在此之前，我還有仇要報呢......”\n在我們的注視下，那位自稱希瞳的貓娘少女逐步站起身來，將自己比常人大十倍的身軀壓向了那些曾欺壓著她的科學家和士兵們。\n“至於救出我的你們，就請......先不要打斷我的復仇吧。”\n我們傳送回了探測器上，少女則開始了自己的復仇。\n已然狹小的走廊，架在半空的管道和電線被少女輕易的扯斷。\n膽敢攔在少女身前的小人，被比自己更為龐大的皮鞋碾作血污。\n失去了從自己身上汲取的能量，這座龐大的基地，同城市一同暗淡了下去。\n重新掌握了力量的少女，則思考著，這個背叛了自己的文明的處決方式。
  gts_hitomi.4.desc: "The giant girl burst from her cocoon, scaring the soldiers who rushed to intercept her into stunned silence. \"I... really thank you.\" Her light-red eyes sized up the surrounded scientists, but there was no fear in her gaze—instead, it was overflowing with hatred. As more soldiers arrived like a tide, the giant maid girl tried to turn over, using her massive body to block the soldiers' view. \"Though I don't know much about your nation... I will remember you. But before that, I have a score to settle...\" Under our gaze, the catgirl who called herself Hitomi gradually stood up, pressing her body—ten times larger than a normal person—toward the scientists and soldiers who had oppressed her. \"As for you who rescued me, please... do not interrupt my revenge for now.\" We teleported back to the probe, and the girl began her vengeance. The already narrow corridors and the pipes and wires hanging in mid-air were easily torn down by her. Any tinies who dared to stand before the girl were ground into bloody stains by her massive leather shoes. Deprived of the energy drained from her, this vast base and the city above dimmed together. Reclaiming her power, the girl contemplated the execution of this civilization that had betrayed her."
  #  繼續觀察
  gts_hitomi.4.a: "Continue observing."
  #  背叛自己的ta？
  gts_hitomi.5.name: "The One Who Betrayed Her?"
  #  重拾力量的她
  gts_hitomi.6.name: "She, Reclaiming Her Power"
  #  沒有了自己身體所創造的能量，這些小人現在正在自己的面前，如同螻蟻一般逃竄著。\n希瞳的雙腳，重重的踩在廣場之上。巨大的體重，瞬間就讓看上去堅實的大地踩出了洛麗塔的鞋底印記。\n“既然不知道發生了什麼的話，那我就再替各位螻蟻們回憶回憶吧。”\n高跟踏擊在小人的大街上，車流混著人流混亂地在希瞳的腳下逃竄著。穿著女僕裝的貓娘希瞳，則像是獵手巡視獵場一般，踩踏著小人們的街道，踐踏著那些被遺棄的車輛向前走去。\n“怎麼？千年以上依靠我的力量才發展到今天，你們難道毫無察覺嗎？”“仔細想想也是，畢竟，能愚笨到被我追上呢......”\n少女的言語之間，滿是對小人的不屑。\n車流堵塞成團，人群蜂擁向前。明明是自己的同類，卻寧願棄之不顧......\n希瞳的陰影，逐步籠罩在了逃跑的人群上方。\n本來寬闊的道路，在她的身後只留下了冒著黑煙的殘骸，以及一個又一個腳印，和被踩成鐵皮的罐頭。\n“看來，裡面還有不少人呢？”\n希瞳輕輕的用腳跟壓住了車流之中的一輛巴士，滿載小人的公交車此刻被困在停滯的車流之中動彈不能。就算是車門，也被其他混亂的車輛所堵塞，車內滿載著的乘客，只能眼睜睜的看着自己頭頂的天花板一點點的被撕開，露出希瞳那隻厚重的棕色洛麗塔的鞋跟。\n“切，就這樣送你們這些螻蟻上路吧。”\n少女忽然間重重的踩下，將滿載的公交車化作了一個爆炸的番茄罐頭，一旁的車輛之上，以及街旁的建築，全部沾染上了那些半秒之前仍在掙扎，現在卻變成各種紅的黑的白的東西，就算是在這血肉地獄之中得以在少女的鞋尖和鞋跟之間存活的小人，下一秒則被少女更惡趣味的動作所完全碾碎——那輛已經不成樣子的，混合著血肉的公交車殘骸，連同後面積壓著的幾輛公交車一起被她後踢向空中，留下了噴灑著鮮血的軌跡，再重重的落在自己留下的腳印之間。完全不成樣子的巴士殘骸，還在姍姍的向外流出著人類遺骸的混合物。看着面前逃難的人群，本來還在後面不緊不慢的虐殺着的希瞳，突然感受到了幾下不明緣由的刺痛。定睛一看才發現，是本該維持着秩序的特警，正開着裝甲車堅守在路口，用自己的那些毫無作用的燒火棍攻擊着自己。\n“你們真的覺得這會有用嗎？”\n少女拋棄了那一絲對獵物的矜持，本在驅趕著“獵物”的她，將逃跑中的人群的當作地毯向前跨去。每一步，都有幾十個生命化作鮮紅的血花，在她厚重的洛麗塔鞋下綻開著。而伴隨著那黑影越來越大，她的面貌越來越清晰，站在這些抵抗着面前的希瞳，自然是對這些所謂英雄般的行動有所想法的。\n“怎麼樣啊，混蛋們？看看我的腳底，你們還要再反擊嗎？”看着面前這些還沒有自己腳趾高的小人兒，希瞳惡趣味的抬起了腳底，將一片地獄般的猩紅，毫無保留的展示在這些抵抗者們的面前。\n“嘔——”\n看着這番地獄的場景，縱使是經歷過專業的訓練，也有不少隊員陷入了乾嘔之中，對此，希瞳小姐的處罰是......\n腳底重踏，將他們中間的，厚重的裝甲車，如同易拉罐一般“咔擦”一下壓扁。再如清掃一般，以鞋底為工具左右擺動。那些揮舞著燒火棍和護盾的士兵們，被少女比鋼鐵还要堅固的鞋面瞬間撞成了細小的血霧。僅僅是腳底在街道上左右摆动，就將這些惱人的螞蟻，全部變成自己鞋上的猩紅印記。\n“真是的......幸好~你們醜陋的鮮血還沒髒到本女僕的白絲呢......”
  gts_hitomi.6.desc: "Without the energy her body once created, these tinies were now fleeing before her like ants. Hitomi's feet slammed heavily onto the plaza. Her massive weight instantly pressed Lolita sole prints into the seemingly solid ground. \"Since you don't know what's happening, let me help you ants remember.\" High heels clattered on the tinies' main streets as traffic and crowds fled in chaos beneath Hitomi's feet. Catgirl Hitomi, dressed in a maid outfit, walked forward like a hunter scanning a killing field, stepping through the tinies' streets and trampling abandoned vehicles. \"What? Having relied on my power for over a millennium to reach today, were you truly oblivious?\" \"Come to think of it, it makes sense. After all, you're stupid enough to let me catch up...\" The girl's words were filled with disdain for the tinies. Traffic jammed into knots, and crowds surged forward. Despite being of the same kind, they were willing to abandon each other... Hitomi's shadow gradually loomed over the fleeing crowd. The once wide roads left only smoldering wreckage behind her, along with footprint after footprint and 'cans' crushed into scrap metal. \"It seems there are quite a few people inside?\" Hitomi gently pressed her heel onto a bus caught in the traffic jam. The bus, packed with tinies, was now immobile in the gridlock. Even the doors were blocked by other chaotic vehicles. The passengers inside could only watch helplessly as the ceiling above them was torn open bit by bit, revealing Hitomi's heavy brown Lolita heel. \"Tch, just let me send you ants on your way.\" The girl suddenly stomped down hard, turning the packed bus into an exploding tomato can. The surrounding vehicles and street-side buildings were all stained with things that half a second ago were struggling—now turned into various shades of red, black, and white. Even the tinies who managed to survive between the girl's toe and heel in this flesh-and-blood hell were completely crushed a second later by her more spiteful actions—the mangled wreck of the bus, mixed with flesh, was kicked into the air along with several other buses behind it, leaving a spray of blood in its trajectory before landing heavily among her previous footprints. The completely unrecognizable bus wreckage slowly leaked out a mixture of human remains. Looking at the fleeing crowd, Hitomi, who had been unhurriedly slaughtering from behind, suddenly felt several stings from an unknown source. Looking closer, she found it was SWAT teams supposed to maintain order, holding a crossroad with armored vehicles and attacking her with their useless 'fire-sticks.' \"Do you really think this will work?\" The girl abandoned her trace of restraint toward her prey. No longer just herding them, she used the fleeing crowd as a carpet to step forward. With every step, dozens of lives blossomed into bright red flowers under her heavy Lolita shoes. As the shadow grew larger and her face became clearer, Hitomi, standing before the resistors, naturally had some thoughts on their 'heroic' actions. \"How is it, you bastards? Look at my soles—do you still want to resist?\" Looking at these little people who weren't even as tall as her toes, Hitomi mischievously lifted her sole, showing the hellish crimson without reservation to the resistors. \"Ugh—\" Looking at this hellish scene, even with professional training, many team members fell into dry heaves. To this, Miss Hitomi's punishment was... a heavy stomp, flattening the thick armored vehicle in their midst like a soda can. Then, like a sweep, she swung her sole left and right. The soldiers waving fire-sticks and shields were instantly smashed into fine bloody mist by her shoe surface, which was harder than steel. Merely by swinging her feet on the street, she turned all these annoying ants into crimson marks on her shoes. \"Honestly... luckily, your ugly blood hasn't stained this maid's white stockings...\""
