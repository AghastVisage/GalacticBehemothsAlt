  gts_hitomi.30004.name: "This is a placeholder."
  #  请注意！未到合同期时主动使用遗珍将会提前触发离开事件。
  gts_hitomi.30004.desc: "Please note! Actively using the relic before the contract period ends will trigger the departure event early."
  #  确定提前触发
  gts_hitomi.30004.a: "Confirm Early Trigger"
  #  ......只是点错了
  gts_hitomi.30004.b: "......I just clicked the wrong thing"
  #  耳朵就是用来rua的！
  gts_hitomi.30005.name: "Ears are meant for petting!"
  #  这一天，三月希瞳正坐在终端前，认真地处理着堆积如山的科研与考古数据。她的手指在操作面板上飞快掠过，神情专注得几乎没有一丝多余动作，只有那对立在发间的毛茸茸耳朵，时不时因为思考或情绪波动而轻轻抖上一下。\n你的目光很快就不受控制地落在了那里。\n柔软，蓬松，还会动。\n这实在很难让人不去在意……\n面对这样近在咫尺、毫无防备的耳朵，你真的能忍住不伸手摸一摸吗？
  gts_hitomi.30005.desc: "On this day, Mitsuki Hitomi is sitting before a terminal, seriously processing a mountain of scientific and archaeological data. Her fingers fly across the control panel, her expression so focused there isn't a single wasted motion, save for the pair of furry ears nestled in her hair, which twitch occasionally from thought or shifts in emotion.\\nYour gaze quickly falls uncontrollably upon them.\\nSoft, fluffy, and they move.\\nIt's truly hard to ignore...\\nFacing such close-at-hand, defenseless ears, can you really resist reaching out for a pet?"
  #  这怎么可能忍得住！狠狠摸！
  gts_hitomi.30005.a: "How could I resist! Pet them hard!"
  #  耳朵就是用来rua的！
  gts_hitomi.30006.name: "Ears are meant for petting!"
  #  “这样做，可是很无礼的呢。”\n三月希瞳微微歪了歪头，唇边甚至还带着一点若有若无的笑意，可那双眼睛里显然已经没有刚才那种还能糊弄过去的余裕了。\n“像你们这样无礼的小虫子……可是要接受惩罚的哦~”\n下一瞬间，窗外的光线被骤然遮蔽。\n伴随着一阵令人心跳停滞的震动，三月希瞳的身形在建筑之外急速放大，转眼间便膨胀到原本的一百倍。庞大的身影就这样矗立在楼宇之间，仿佛整片城区都只不过是她脚边随手可拨弄的模型。她微微俯下身，带着几分戏谑与居高临下的从容，透过外壁与窗幕注视着下方那些因为她的出现而陷入混乱的渺小身影。\n原本明亮的办公室忽然暗了下来，你扶着桌子，一点点挪到窗边。下一秒，一只巨大得令人头皮发麻的眼眸出现在玻璃外侧，几乎占满了整扇窗。那眼睛微微弯起，带着几分戏谑，像是在欣赏玻璃后那个被吓得僵住的小小身影。\n紧接着，震耳欲聋的声音从楼外压了过来，连空气都仿佛在她的声线里颤抖。\n“怎么啦？”她眨了眨眼，声音里还带着那种让人头皮发紧的轻快，“刚才不是还很有胆子吗？现在怎么连站都站不稳了？”\n你张了张嘴，却一个字也说不出来。理智根本无法解释眼前的一切，本能只剩下一个念头——逃。\n“切，真小气。”希瞳轻轻鼓了鼓脸，语气里带着点不满，又像是在故意逗弄猎物，“既然没人肯乖乖认错，那我就只好亲自来收一点惩罚了哦~”\n“抓到了。”她轻声说道，耳朵愉快地抖了抖，“那么，无礼的小家伙——你觉得，自己该接受什么样的惩罚呢？”\n视角渐渐抬升，视野渐渐被眼前的巨大猫娘的酥胸所填满——映入眼帘的首先是那层遮蔽着胸前的薄薄的蓝色抹胸与微微遮挡住胸口的白色布料，然后再是那不断散发淡淡的乳香气息乳沟。手掌微微倾斜，手中的小家伙便被塞进了下方的“峡谷”之中，恰好能让他清清楚楚地俯瞰下方整片城市。\n“你就待在这里，好好看着。”希瞳歪了歪头，笑容甜得让人心里发寒，“看看你的国家、你的城市，还有你那些自以为很有用的臣民，是怎么被我毁灭的。”\n希瞳微微蹲下，她的身躯所构成的阴影渐渐覆盖住下方的车潮，一些被洪流裹挟着的人们惊慌的下车想要逃走但却猛然发觉周围的道路已被彻底堵死。\n但希瞳无视了那些想要求生的人们，她伸出指尖向着自己鞋上的小人们碾去——只是轻轻一碾，原本还活跃在鞋面上的小人们便化作了黏在指尖与鞋面上微微拉着丝的粘稠肉泥。\n原本躁动着的人群忽然间安静了下来，仅仅几秒后安静的人群便立刻四散而逃，但人们逃离的方向各不相同，人们互相推搡着想要为自己谋得一条逃离的道路，但这无序的逃窜显然无法让人们有效的逃离，一条又一条鲜活的生命在希瞳的运动鞋上消逝、在她的指尖下被抹除……\n“嗯……？”\n她头顶的猫耳轻轻抖了抖，捕捉到了一阵引擎声，她顺着声音看去，只见一辆莽撞的跑车不断轰鸣着从她足边冲了过去。但对于一只拥有如此庞大体型的猫娘而言，像这样在她的面前飞速移动显然是不理智的。\n“小家伙，你要去跑去哪里呀”\n少女缓缓站起身来接着再慵懒的伸了个懒腰，然后再轻轻迈出一步——高大的运动鞋便像一堵蓝白色的墙一般阻塞了它的道路，那辆跑车还没来得及刹车便重重地撞上了上去。\n“捉到了呢，那么...”\n猛烈的撞击让坐在驾驶位的小人近乎昏厥，若不是他的爱车上配有安全气囊否则他现在就已经当场丢了小命了。\n当他再次睁开眼睛时，那堵让他差点直接丢了性命的墙已经立了起来——希瞳半抬着脚，那双运动鞋的鞋底里满是道路碎屑、车辆残骸与人类的血肉，但即便是这样这双鞋却依旧看着很新，光是看着就能看出来它的主人并不经常穿它。\n鞋底的纹路中印着些可爱的小猫符号，配合着那小小的尺码标让它无论怎么看都是一只很可爱很适合青春少女穿着的运动鞋，甚至会很适合他的小女儿……\n嘎吱——\n希瞳的鞋底缓缓下压，跑车的车架便因承受不住这份伟力而开始扭曲变型，整辆小车以和其中的小人都被少女的鞋底碾成一片印着可爱图案的破铁片，无论从任何角度上都已无法看出它原有的样子。无论这辆跑车曾经是多么的昂贵多么的引人注目，现在它已变为了一片薄薄的铁片，就这样贴在希瞳的鞋底上，紧紧地卡在鞋底的纹路之中。\n“真差劲呢，就算是小猫玩具也比你们的小车要结实多了。”\n希瞳缓缓将自己的脚向后勾起，那辆已彻底变成她鞋底模样的小车和车内那位可怜的车主正满怀不舍的黏在她的鞋底上，但这也只是对她来说。\n“就算再舍不得也要从我的鞋底上下去呢~”\n轻轻晃了晃脚，鞋底上的车辆残骸便如同被人踩到的垃圾一样从她的鞋底上脱落然后再坠向地面，以机器扭曲的形状瘫在地上。\n而就在她晃脚的同时，一辆满载乘客的公交车正以最快的速度横穿市区想要趁着她不注意直接逃出这片灾难般的地方。\n但可惜，猎物大多很难从猫娘的眼皮底下逃出去。\n“哦呀，有小家伙自己送上门了呢~”\n希瞳微微俯身将那辆正尝试着从她的足边逃走的公交车抓起，就像是家猫抓老鼠一般的轻松。\n而车内的乘客们，他们只看见自己所处的车辆在即将逃离最危险的地方时忽然间停了下来，窗外还同时出现了好几根巨大的手指，接着再抬升，升到了那位正在城市中肆意玩乐的巨大猫娘的眼前。\n“满客呢，看来小家伙们很喜欢这种拥挤的感觉~？”
  gts_hitomi.30006.desc: "“Doing this is very rude, you know.”\\nSanyue Xitong tilted her head slightly. There was even the faintest hint of a smile at her lips, but those eyes clearly no longer held the leeway from just now, the kind that could still be brushed off.\\n“Rude little bugs like you... have to be punished~”\\nIn the next instant, the light outside the window was suddenly blocked out.\\nAccompanied by a tremor that made one's heartbeat stop, Sanyue Xitong's figure rapidly enlarged outside the building, swelling to a hundred times her original size in the blink of an eye. Her enormous figure stood among the buildings just like that, as if the entire urban district were nothing more than a model at her feet that she could casually toy with. She bent down slightly, carrying a teasing and condescending calm, and gazed through the outer wall and window curtain at the tiny figures below who had fallen into chaos because of her appearance.\\nThe once-bright office suddenly darkened. You steadied yourself on the desk and moved bit by bit to the window. The next second, an eye so enormous it made your scalp tingle appeared outside the glass, almost filling the entire window. That eye curved slightly, carrying a trace of teasing, as if admiring the tiny figure frozen in fear behind the glass.\\nImmediately afterward, a deafening voice pressed in from outside the building, and even the air seemed to tremble within her voice.\\n“What is it?” She blinked, her voice still carrying that scalp-tightening lightness. “Weren't you very brave just now? Why can you barely even stand now?”\\nYou opened your mouth, but could not say a single word. Reason could not explain anything before your eyes. Instinct left only one thought——run.\\n“Tch, how petty.” Xitong puffed her cheeks lightly, her tone carrying a bit of dissatisfaction, yet also seeming to deliberately tease her prey. “Since no one is willing to obediently admit their mistake, I suppose I'll have to personally collect a little punishment~”\\n“Caught you.” she said softly, her ears twitching happily. “Now then, rude little one——what sort of punishment do you think you should receive?”\\nThe viewpoint gradually rose, and the field of vision was gradually filled by the huge catgirl's soft chest before him——the first thing that entered view was the thin blue bandeau covering her chest and the white cloth slightly covering her bosom, and then the cleavage that continuously gave off a faint milky fragrance. Her palm tilted slightly, and the little one in her hand was stuffed into the “valley” below, just right for him to clearly overlook the entire city beneath.\\n“You stay here and watch carefully.” Xitong tilted her head, her smile so sweet it chilled the heart. “Watch how your nation, your city, and those subjects you thought were so useful are destroyed by me.”\\nXitong squatted slightly, and the shadow formed by her body gradually covered the stream of traffic below. Some people swept up in the flow got out in panic and tried to flee, only to suddenly realize that the surrounding roads had been completely blocked.\\nBut Xitong ignored those people who wanted to survive. She extended a fingertip and ground it toward the little people on her shoe——with only a gentle press, the little people who had still been active on the shoe upper turned into sticky meat paste clinging to her fingertip and the shoe surface, drawing faint strings.\\nThe originally restless crowd suddenly went quiet. Only a few seconds later, the quiet crowd immediately scattered and fled, but people fled in different directions, shoving each other as they tried to find a path of escape for themselves. Yet this disorderly flight clearly could not let them escape effectively. One fresh life after another vanished on Xitong's sneaker, erased beneath her fingertip...\\n“Mm......?”\\nThe cat ears atop her head twitched gently, catching the sound of an engine. She looked toward the sound and saw a reckless sports car roaring continuously as it rushed past her foot. But for a catgirl with such an enormous body, moving at high speed in front of her like that was clearly unwise.\\n“Little one, where are you trying to run off to?”\\nThe girl slowly stood up, then lazily stretched, and then lightly took one step——her tall sneaker blocked its path like a blue-and-white wall. Before the sports car had time to brake, it slammed heavily into it.\\n“Caught you. Now then...”\\nThe violent impact nearly made the little person in the driver's seat faint. If his beloved car had not been equipped with airbags, he would already have lost his life on the spot.\\nWhen he opened his eyes again, the wall that had almost directly killed him had already risen——Xitong was half lifting her foot, and the sole of that sneaker was full of road debris, vehicle wreckage, and human flesh and blood. Yet even so, the shoe still looked very new. One could tell just by looking that its owner did not often wear it.\\nCute little cat symbols were printed in the sole patterns, and together with the small size label, it looked from every angle like a very cute sneaker, very suitable for a young girl to wear, and it would even have suited his little daughter...\\nCreak——\\nXitong's sole slowly pressed down, and the sports car's frame began to twist and deform because it could not withstand this mighty force. The entire little car and the little person inside were crushed by the girl's sole into a broken iron sheet printed with cute patterns, its original appearance no longer recognizable from any angle. No matter how expensive or eye-catching this sports car had once been, it had now become a thin sheet of metal, stuck to Xitong's sole just like that, tightly wedged into the sole's grooves.\\n“How awful. Even a kitten toy is much sturdier than your little cars.”\\nXitong slowly hooked her foot backward. The little car that had completely taken the shape of her sole, and the poor owner inside it, clung reluctantly to her sole, but only from her perspective.\\n“No matter how reluctant you are, you still have to get off my sole~”\\nShe gently shook her foot, and the vehicle wreckage on her sole fell off like garbage that had been stepped on, then dropped to the ground, lying there in a twisted machine shape.\\nAt the same time as she shook her foot, a bus full of passengers was crossing the city at its fastest speed, trying to escape this disaster-like place while she was not paying attention.\\nUnfortunately, prey usually has a hard time escaping from under a catgirl's eyes.\\n“Oh my, a little one has delivered itself right to me~”\\nXitong bent down slightly and picked up the bus that was trying to escape from beside her foot, as easily as a house cat catching a mouse.\\nAs for the passengers inside, they only saw the vehicle they were in suddenly stop just as it was about to escape the most dangerous place. At the same time, several enormous fingers appeared outside the windows, and then they rose, lifted before the eyes of the giant catgirl playing wantonly in the city.\\n“A full load. Looks like the little ones really like this crowded feeling~?”"
  #  还好损失不是很大
  gts_hitomi.30006.a: "Fortunately, the losses aren't too great."
  #  事实上，这辆满载乘客的公交车里大多是些赶早班的上班族，若不是他们的经济情况与时间限制不允许他们有别的选择，不然他们也不会想坐在这样拥挤的公交车里。\n“我想到了一个有意思的玩法呢……你们肯定很乐意被我那样子玩弄，对吧~？”\n但她并没有给予车内的小人们回答的机会，接着她将双手压在了公交车的上下两端，然后渐渐向内挤压……\n“快，把门给我开开！”\n司机在几个愤怒的乘客的威胁下打开了车门，但那几人刚看到车门外的景象后又颤抖着退回了车内。\n他们看见，车外是一只自己这辈子都没见过的拥有庞大尺寸的手掌，而在那手掌下方是足有百米之高的高空，在那高空之下才是自己所熟悉的城市街道。\n“回来干嘛？跑啊，你不逃我先逃了。”\n一个不知情的乘客一边嘲笑着退回来的几人一边走向了车门，然后再消失在其他人的视野中。\n刚走出车门的乘客直直地摔在了希瞳那嫩滑的微微倾斜着的手掌上，他刚想扶着周围的“地面”站起身来便愣愣的发现自己的身体正在顺着她的手掌渐渐下滑——\n他的身躯坠向地面，重重砸在希瞳足边的一辆无人的汽车上，他的身躯当场摔得失去了人形，变成了一摊血肉模糊的肉饼。\n\n“希瞳自制小人猫条，想想就觉得美味呢~”\n手掌渐渐合拢，先是手掌间的边缘缝隙渐渐贴合，将外界照入车内的光线连带着车内的人们求生的希望一同掩埋。\n一阵黏腻的触感渐渐在掌心滋生，希瞳仔细地感受着掌心上生命消逝的过程，感受着一满车的人在自己的手上被自己的手掌渐渐碾磨粉碎的感觉。\n“感觉差不多了呢……”\n她挪开一只手让外界的光明重新洒在了这辆可怜的公交车上，只是可惜现在这辆车内已经不剩下一个活物，而这辆车也已变成了一块保着些许肉酱的扁平铁片了。\n“让我尝尝小家伙们的味道怎么样吧~”\n希瞳微微张开嘴轻轻抿住了那片散发着浓浓血腥味的钢铁猫条，手指轻轻捏住“猫条”的尾部接着再慢慢向前推去——\n她用舌尖轻轻舔舐着“猫条”开口处不断涌出的肉酱，感受着这糅合了几十人的生命的肉酱所散发的“绝美”的味道——满满的血腥味与一种仅有她能够感受到的鲜甜的味道。\n“美味呢~啊——诶？这么快就没了嘛，小人真不耐吃呢。”\n希瞳刚想再接着享用自己特制的猫条便忽然发现，这条用小人制作的猫条完全没有正常猫条的分量多，自己才只是尝了点味道便已被清空。\n希瞳的舌尖用力挤开已被压成铁片的公交车在里面不断地舔弄摸索着想要将里面可能残存着的肉酱也送入自己的口中，直至她再也无法从中找到一点东西时她才满怀不舍地将“猫条外壳”揉成了一颗小铁球，再当做糖豆一般的抛入口中。\n“小家伙的车吃起来味道也一般呢……嘛，勉强算是吃了些早点吧。\n紧接着，城市的其余地带也没能幸免，在她随意的践踏与摆弄下接连化作一片狼藉。”\n在这座繁华的城市之中她看不到一栋能够超越她的身高的建筑，哪怕是在最为繁华的市中心她也未能找到哪怕一个比她要高的建筑。以她现在的体型，整座城市都完全可以被她当做一个只属于她的游乐场来玩耍。\n“好杂鱼哦，这么大的城市结果连一个比我高的房子都没有，真没意思——”\n希瞳的身影渐渐消失在忽然变浓的雾气之中，待到浓雾消失时，那片层有一位体型极为巨大的猫娘的城区只剩下了一片光秃秃的土褐色的土地与一个无比巨大的有着猫爪团的鞋印。\n至少对这座城市中的人类而言，他们的危险暂时消失了。
  gts_hitomi.30007.desc: "In fact, the bus full of passengers was mostly filled with office workers hurrying to the early shift. If their financial situation and time constraints had allowed them any other choice, they would not have wanted to sit in such a crowded bus.\\n“I've thought of an interesting way to play... You must be very willing to be toyed with by me like that, right~?”\\nBut she did not give the little people inside the bus a chance to answer. Next, she pressed her hands against the top and bottom ends of the bus, then gradually squeezed inward...\\n“Quick, open the door for me!”\\nUnder the threats of several angry passengers, the driver opened the door, but after those people saw the scene outside the door, they trembled and retreated back into the bus.\\nThey saw that outside the bus was an enormous palm unlike anything they had ever seen in their lives, and below that palm was a height of a full hundred meters. Only beneath that height were the familiar city streets.\\n“Why are you coming back? Run. If you won't escape, I'll escape first.”\\nAn uninformed passenger mocked the people who had retreated while walking toward the door, then disappeared from everyone else's view.\\nThe passenger who had just stepped out of the door fell straight onto Xitong's smooth, slightly tilted palm. Just as he tried to support himself on the surrounding “ground” and stand up, he froze as he realized his body was gradually sliding down along her palm——\\nHis body fell toward the ground, smashing heavily onto an unmanned car beside Xitong's foot. His body instantly lost its human shape from the impact, becoming a bloody, mangled patty.\\n\\n“Xitong's homemade little-person cat treat. Just thinking about it sounds delicious~”\\nHer palms gradually closed. First, the edge gaps between her palms slowly came together, burying both the light from outside that shone into the bus and the hope of survival of the people inside.\\nA sticky sensation gradually arose in her palm. Xitong carefully felt the process of lives fading away in her palm, felt the sensation of an entire busload of people being gradually ground and crushed by her own hands.\\n“That feels about right...”\\nShe moved one hand away, letting the outside light shine once more on this poor bus. Unfortunately, there was not a single living thing left inside the vehicle now, and the bus had already become a flattened iron sheet holding a little meat sauce.\\n“Let me taste what the little ones are like~”\\nXitong opened her mouth slightly and gently held that steel cat treat, thick with the smell of blood, between her lips. Her fingers gently pinched the tail end of the “cat treat,” then slowly pushed forward——\\nShe lightly licked with the tip of her tongue at the meat sauce continuously spilling from the opening of the “cat treat,” savoring the “exquisite” taste emitted by the meat sauce that had blended together dozens of lives——a full bloody taste, and a fresh sweetness that only she could perceive.\\n“Delicious~ Ah——huh? It's gone already? Little people really don't last long as food.”\\nJust as Xitong wanted to continue enjoying her special cat treat, she suddenly discovered that this cat treat made from little people had nowhere near the volume of a normal cat treat. She had only tasted a little, and it had already been emptied.\\nXitong's tongue tip forcefully pried open the bus that had been flattened into an iron sheet, constantly licking and probing inside as she tried to send any possible remaining meat sauce into her mouth. Only when she could no longer find even a little bit inside did she reluctantly knead the “cat treat shell” into a small iron ball, then toss it into her mouth like a candy bean.\\n“Little people's vehicles taste pretty ordinary too... Well, I suppose it barely counts as having some breakfast.\\nImmediately afterward, the rest of the city was not spared either, successively turning into a mess under her casual trampling and playing.”\\nIn this prosperous city, she could not see a single building that surpassed her height. Even in the most prosperous city center, she could not find even one building taller than herself. With her current size, the entire city could completely be treated as a playground belonging only to her.\\n“What small fry. Such a big city, and yet there isn't even one building taller than me. How boring——”\\nXitong's figure gradually disappeared into the suddenly thickening mist. When the dense fog vanished, the urban district that had once held an extremely huge catgirl was left with only a bare, earthy-brown stretch of land and an incomparably huge shoeprint bearing a cat-paw pattern.\\nAt least for the humans in this city, their danger had temporarily disappeared."
