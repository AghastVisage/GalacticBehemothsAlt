  gts_hitomi.30012.name: ""
  #  最后一支检测舰队在我方炮火中崩解。时空狭缝内，原本精密运转的舰队阵列开始逐层熄灭。那些没有生命的战斗单元化作无数蓝白色光点，沿着星系轨道逆流而上，最终汇入三月希瞳的巨大投影之中。\n她低垂着眼眸，静静注视着我方舰队。\n下一秒，三月希瞳的投影开始逐渐变得凝实起来。取而代之的，是我方曾经熟悉的白蓝色身影。此刻的三月希瞳，巨大到足以让舰队像尘埃一样悬停在她的指尖前方。\n“导入弱小人类的特征，来追寻真正的强大
  gts_hitomi.30012.desc: "The final test fleet disintegrated under our fire. Within the spacetime rift, the fleet arrays that had once operated with precision began to go dark layer by layer. Those lifeless combat units turned into countless blue-white points of light, flowing backward along the system's orbits until they finally merged into Mitsuki Hitomi's enormous projection.\\nWith lowered eyes, she silently watched our fleet.\\nThe next second, Mitsuki Hitomi's projection began to gradually solidify. In its place appeared the white-blue figure we had once known so well. Now, Mitsuki Hitomi was so immense that the fleet seemed like dust suspended before her fingertips.\\n\"Importing the traits of weak humans, in pursuit of true strength"
  #  开始了
  gts_hitomi.30012.a: "It has begun"
