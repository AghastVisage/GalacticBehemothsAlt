  #  意外援助
  gts_hitomi.30001.name: "Unexpected Aid"
  #  一段陌生的通讯信号直接接入了我方主频道。\n她自称“三月希瞳”，长期以自由身份活动于边境与未登记宙域之间，承接各种任务。\n她向我方提交了一份时限明确的短期雇佣申请。根据合同内容，在受雇期间，她将以科学家的身份为我方提供服务，参与科研、调查与特殊项目解析。需要说明的是，一旦协议生效，她当前所展示的舰装与舰队指挥接口将不会随雇佣一并转入我方体系。在本次合作中，她将以“研究者”而非“指挥官”的身份加入我方行动序列。\n通讯末尾，她轻轻抬眼，语气平静得近乎理所当然：\n“别露出那种表情。你们雇佣的是我的知识、经验和判断力——不是这套东西。”
  gts_hitomi.30001.desc: "A strange communication signal has directly accessed our main channel.\\nShe calls herself 'Mitsuki Hitomi' and has long operated as a freelancer between borders and unregistered space, taking on various missions.\\nShe has submitted a time-limited short-term employment application. According to the contract, during her employment, she will provide services to us as a scientist, participating in scientific research, investigations, and special project analysis. It should be noted that once the agreement takes effect, her currently displayed rig and fleet command interface will not be transferred to our system along with the employment. In this collaboration, she will join our action sequence as a 'researcher' rather than a 'commander'.\\nAt the end of the communication, she looks up slightly, her tone calm and almost matter-of-fact:\\n'Don't make that face. You're hiring my knowledge, experience, and judgment—not this equipment.'"
  #  好..好耶？!
  gts_hitomi.30001.a: "G-Great?!"
  #  三月希瞳
  gts_hitomi.30002.name: "Mitsuki Hitomi"
  #  你、你你你……你在盯着哪里看呀！喂！你那种视线也太失礼了吧！我现在只是来当科学家的，不是来给你参观的……还有，耳朵也不能摸！\n对了对了送你个小礼物，要好好感谢我哦~
  gts_hitomi.30002.desc: "Y-You... where are you looking! Hey! That kind of gaze is so rude! I'm only here as a scientist, not for you to look at... And you can't touch my ears, either!\\nAnyway, anyway, I've got a little gift for you. You'd better be grateful~"
  #  你的舰装呢
  gts_hitomi.30002.a.name: "Where is your rig?"
  #  ……不用你提醒，我当然知道自己少了什么。那套舰装现在处于锁定状态，暂时不在我可调用的权限里。别再追问了，至少现在，你把我当成科学家用就够了。所以，少露出那种可惜的表情。
  gts_hitomi.30002.a.response: "...I don't need you to remind me. I know exactly what I'm missing. That rig is currently locked and isn't available to me for now. stop asking. For now, just using me as a scientist is enough. So, stop making that disappointed face."
  #  你说的短期雇佣是什么意思？
  gts_hitomi.30002.b.name: "What do you mean by short-term employment?"
  #  意思就是我不是卖给你们了呀。我会履行整整§R十五年§!的合同，在这期间作为科学家为你们工作；等时间一到，这段合作关系自然终止。对我来说，已经足够久了。
  gts_hitomi.30002.b.response: "What I mean is that I have not been sold to you. I will fulfill a contract lasting exactly §Rfifteen years§!, working for you as a scientist during that time; once the time is up, this cooperative relationship will naturally end. For me, that is already long enough."
  #  你说的小礼物是？
  gts_hitomi.30002.c.name: "What is this little gift you mentioned?"
  #  这个呀？只是一个按我的样子做的小型终端挂件而已。别看它小，里面塞了基础通讯模块、简化科研模块，还有一个……咳，没什么用的应急子程序。总之，你收下就对了。
  gts_hitomi.30002.c.response: "This? It's just a small terminal pendant made in my likeness. Don't look at its size; it's packed with a basic communication module, a simplified research module, and a... cough, mostly useless emergency subroutine. Anyway, just take it."
  #  
  gts_hitomi.30003.name: ""
  #  §R提示：目前三月希瞳为临时雇佣状态，15年后会自己离开，之后完成特殊事件可以永久获得，但是临时雇佣期间的等级和特质不会保留§!\n§R主动启用遗珍可以提前离开并触发后续事件§!
  gts_hitomi.30003.desc: "§RNotice: Sanyue Xitong is currently temporarily employed. She will leave on her own after 15 years. Afterward, she can be permanently obtained by completing a special event, but her levels and traits during the temporary employment period will not be retained§!\\n§RActively using the relic can make her leave early and trigger the subsequent event§!"
