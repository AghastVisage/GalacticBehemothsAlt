l_english:
  # 微缩城市
  tech_gts_microcity: "Micro Cities"
  # 通过我们对缩小射线的研究，我们的微型城市已经可以批量模块化建造，这将有利于我们的人口在保持相对体形的情况下更加节省空间。 \n §R未经许可禁止在微缩城市内变大！§!
  tech_gts_microcity_desc: "Through our research into shrinking rays, our micro-cities can now be built in bulk and modularly. This will allow our population to save more space while maintaining their relative size.\n §R Enlarge within micro-cities without permission is prohibited! §!"
  # 缩小荷尔蒙
  tech_gts_shrinking_hormone: "Shrinking Hormone"
  # 利用科学家们提取合成的缩小激素，我们可以将我们的敌人 -  - 不论是国内的还是国外的 -  - 缩小到无害的水平，以允许使用更为简单方便的方式处理掉他们。当然，怎么处理嘛...
  tech_gts_shrinking_hormone_desc: "Using synthesized shrinking hormones extracted by our scientists, we can shrink our enemies - whether domestic or foreign - to harmless levels, allowing for simpler and more convenient disposal. Of course, how to dispose of them..."
  # 先端科学研究所
  tech_gts_advanced_technology_research_institute: "Advanced Technology Research Institute"
  # 我们将设立专门负责研究最先进科学技术 -  - 尤其是不为人知的缩小技术的研究所。出于安全考虑，这里禁止私人高中生侦探进入，也禁止研究员私自将研究成果用于实际。
  tech_gts_advanced_technology_research_institute_desc: "We will establish an institute specifically responsible for researching the most advanced science and technology - especially the unknown shrinking technology. For safety reasons, private high school detectives are prohibited from entering here, and researchers are also prohibited from personally using research results in practice."
  # 缩小处决
  tech_gts_shrinking_extermination: "Shrinking Extermination"
  # 利用缩小技术，我们可以高效地处理掉不需要的人口，并让他们能够为已经存在于我们帝国时消耗的资源提供合理的回报 -  - 不论是回馈我们的肚子，心智，研究，还是不能明说的愿望。
  tech_gts_shrinking_extermination_desc: "Using shrinking technology, we can efficiently dispose of unwanted populations, allowing them to provide a reasonable return for the resources consumed during their time in our empire - whether it's feeding our bellies, mind, research, or unspeakable desires."
  # 体型缩放器
  tech_gts_size_affecting_device: "Size Scaling Device"
  # §Y现在亚种整合可以整合体型了§!\n\n$MOD_COUNTRY_MODIFY_SPECIES_COST_MULT$: §G-20%§!
  tech_gts_size_affecting_device_effect: "§YNow subspecies integration can integrate body types§!\n\n$MOD_COUNTRY_MODIFY_SPECIES_COST_MULT$: §G-20%§!"
  # 缩小化作物
  tech_gts_micro_corps: "Miniature Crops"
  # 通过将农作物缩小，同样的地域能够产出更多的粮食，但是为了保证能量的投入和产出维持在可以接受的范围内，需要保证缩小的倍率不会太大，并且合理密植。
  tech_gts_micro_corps_desc: "By shrinking crops, more food can be produced in the same area. To ensure the input and output of energy remain within acceptable limits, the shrinkage ratio cannot be too large, and reasonable dense planting is required."
  # 巨娘灌溉
  tech_gts_hydroponics: "Giantess Irrigation"
  # 利用巨娘们营养丰富（确信）的液体来为作物提供它们生长所需的物质是一个非常棒的点子，反正最后这些巨娘也不会知道商店里会有专柜出售爱液味的食物。
  tech_gts_hydroponics_desc: "Using the nutrient-rich (confirmed) fluids of giantesses to provide crops what they need to grow is a great idea. Anyway, these giantesses will never know that there are special shelves in stores selling love fluid-flavored food."
  # 巨娘专制
  tech_gts_authoritic_government: "Giantess Autocracy"
  # 我说，为什么我们要让那群愚蠢的虫子来担任重要岗位呢？
  tech_gts_authoritic_government_desc: "I say, why should we let those stupid insects hold important positions?"
  # 巨娘寄居室
  tech_gts_autorization_for_live: "Giantess Habitation Chamber"
  # 我们的国家内拥有无数合适的住处 -  - 就在那些巨娘身上。只要我们愿意，我们就能省下一大笔住房开支...至于住户们和巨娘们，当然会毫不犹豫地同意的。
  tech_gts_autorization_for_live_desc: "Our nation has countless suitable places to live - right on those giantesses' bodies. As long as we want, we can save a lot on housing expenses... As for the residents and giantesses, they will of course agree without hesitation."
  # 巨娘监狱
  tech_gts_autorization_for_jail: "Giantess Prison"
  # 利用巨娘
  tech_gts_autorization_for_jail_desc: "Using giantesses"
  # 巨娘计算机
  tech_gts_combined_computer: "Giantess Computer"
  # 利用巨娘们的巨大脑容量，我们可以制造出特殊的计算机，以允许我们获得更快的科研速度。
  tech_gts_combined_computer_desc: "Utilizing the vast brain capacity of giantesses, we can create special computers to allow us to achieve faster research speeds."
  # 小人计算机阵列
  tech_gts_tinyman_computer: "Small Person Computer Array"
  # 利用犯罪或者俘虏的小人，我们可以制造出算力高超的计算机，以允许我们获得更高效的计算能力。
  tech_gts_tinyman_computer_desc: "Using criminals or captured small people, we can build computers with superior processing power to allow us to achieve more efficient calculation ability."
  # 巨娘清洁公司
  tech_gts_mass_cleaning_service: "Giantess Cleaning Company"
  # 这些巨娘清洁工能高效而快捷地清除一切肮脏的东西 -  - 不论是灰尘，还是同灰尘一样的小人聚落或犯罪者，甚至，是小人们无法愉悦的天堑 -  - 都不是她们的一合之敌。
  tech_gts_mass_cleaning_service_desc: "These giantess cleaners can efficiently and quickly remove all dirty things - whether it's dust, or small people settlements or criminals similar to dust, or even the natural barriers that small people cannot please - none of them are a match for them."
  # 适应性提升
  tech_gts_habitant: "Adaptability Enhancement"
  # 我们的子民将更容易在困难环境中生存下来 -  - 即使是巨娘体内这种危险环境中。
  tech_gts_habitant_desc: "Our people will find it easier to survive in difficult environments - even in dangerous environments like inside giantesses' bodies."
  # 舰娘泰坦改造
  tech_gts_titan_modifying: "Shipgirl Titan Modification"
  # 通过特别强化我们的泰坦舰娘的某一部分，我们便可以使她们在太空战中发挥更大的作用......
  tech_gts_titan_modifying_desc: "By specially strengthening a certain part of our Titan shipgirl, we can make them play a greater role in space warfare..."
  # 开始享乐~
  tech_gts_lets_have_fun: "Let's Have Fun~"
  # 准备好大闹一场了吗？
  tech_gts_lets_have_fun_desc: "Ready to make some trouble?"
  # 先端科学研究院
  building_advanced_technology_research_institute: "Advanced Technology Research Institute"
  # 按照命令建立起来专门负责研究最先进科学技术 -  - 尤其是不为人知的缩小技术的研究所。出于安全考虑，这里禁止私人高中生侦探进入，也禁止研究员私自将研究成果用于实际。
  building_advanced_technology_research_institute_desc: "An institute established by order, specifically responsible for researching the most advanced science and technology - especially the unknown shrinking technology. For safety reasons, private high school detectives are prohibited from entering here, and researchers are also prohibited from personally using research results for practical purposes."
  # 巨娘清洁公司
  building_giantess_cleanhouse: "Giantess Cleaning Company"
  # 一个能让巨娘们协助清理各种各样脏污的建筑。不论委托目标是房间还是星球，只要价格合适，她们都能做到。
  building_giantess_cleanhouse_desc: "A building that allows giantesses to assist in cleaning up all sorts of filth. Whether the target is a room or a planet, they can do it as long as the price is right."
  # 先科研研究员
  job_advanced_technology_researcher: "Advanced Tech Researcher"
  # 先科研研究员
  job_advanced_technology_researcher_plural: "Advanced Tech Researchers"
  # 这些研究员兢兢业业地探索者最先进的科学技术，尤其是关于缩小方面的。
  job_advanced_technology_researcher_desc: "These researchers diligently explore the most advanced science and technology, especially in the field of shrinking."
  # 先科研研究组长
  job_advanced_technology_researcher_master: "Advanced Tech Research Lead"
  # 先科研研究组长
  job_advanced_technology_researcher_master_plural: "Advanced Tech Research Leads"
  # 这些研究组长接受来自会长的命令，率领团队开展研发工作。
  job_advanced_technology_researcher_master_desc: "These research leaders receive orders from the president and lead the team in research and development."
  # 会长
  job_advanced_technology_researcher_leader: "President"
  # 会长
  job_advanced_technology_researcher_leader_plural: "Presidents"
  # 直接接受国家的命令并监督整个研究所的研发进度，拥有极高的威望和权力。当然，这也导致不允许将研究成果私自应用的条令在一定程度上在其他人不知道的情况下被违反了...谁管呢。
  job_advanced_technology_researcher_leader_desc: "Directly receives orders from the state and supervises the research and development progress of the entire institute. They have extremely high prestige and power. Of course, this also led to the fact that the decree that does not allow the private application of research results, to some extent, was violated without the knowledge of others... Who cares."
  # 巨娘监狱
  building_giantess_jail_placing: "Giantess Prison"
  # 被任命为活体监狱的巨娘们生活的场所。
  building_giantess_jail_placing_desc: "The living quarters of giantesses appointed as living prisons."
  # 巨娘狱卒
  job_gts_jailor: "Giantess Jailor"
  # 巨娘狱卒
  job_gts_jailor_plural: "Giantess Jailors"
  # 她们的身体接受了适量的改造以容纳大量小人罪犯，同时身体机能也相应地有所增强以适应小人挣扎，因此很多巨娘都想要来应聘。
  job_gts_jailor_desc: "Their bodies have undergone moderate modifications to accommodate a large number of small person criminals, and their bodily functions have also been correspondingly enhanced to adapt to small person struggles, so many giantesses want to apply for this position."
  # $job_gts_jailor$是巨娘岗位，产出£society_research£社会学研究，£unity£凝聚力，降低犯罪率。
  job_gts_jailor_effect_desc: "The $job_gts_jailor$ job is a giantess job, producing £society_research£ Society Research, £unity£ Unity, and reducing crime."
  # 巨娘清洁工
  job_gts_cleaner: "Giantess Cleaner"
  # 巨娘清洁工
  job_gts_cleaner_plural: "Giantess Cleaners"
  # 这些体型巨大的女孩能以最可爱的方式去除星球上一切障碍 -  - 不论是自然还是人工造成的。
  job_gts_cleaner_desc: "These huge girls can remove all obstacles on the planet in the cutest way possible  -  whether natural or man-made."
  # $job_gts_cleaner$是巨娘岗位，消耗§Y$r_energy$§!、§Y$r_consumer_goods$§!產出§Y$r_trade$§!\n每100§Y$job_gts_cleaner$§!提升50%星球£MOD_PLANET_CLEAR_BLOCKER_SPEED_MULT£§Y$MOD_PLANET_CLEAR_BLOCKER_SPEED_MULT$§!
  job_gts_cleaner_effect_desc: "The $job_gts_cleaner$ job is a giantess job, producing £engineering_research£ Engineering Research, £unity£ Unity, reducing planetary crime, and increasing planetary happiness, stability, and obstacle clearing speed."
  # 先科研研究员增加
  mod_job_advanced_technology_researcher_add: "Advanced Tech Researcher Capacity Increased"
  # 先科研研究组长增加
  mod_job_advanced_technology_researcher_master_add: "Advanced Tech Research Lead Capacity Increased"
  # 会长增加
  mod_job_advanced_technology_researcher_leader_add: "President Capacity Increased"
  # 巨娘狱卒增加
  mod_job_gts_jailor_add: "Giantess Jailor Capacity Increased"
  # 巨娘清洁工增加
  mod_job_gts_cleaner_add: "Giantess Cleaner Capacity Increased"
  # 先科研分部
  building_advanced_technology_research_institute_branch: "Advanced Tech Research Branch"
  # 在其他文明上的先科研基地。\n名义上是为了提升双方科技建立的合作组织，实际上却可以为帝国输送一些特殊的资源...
  building_advanced_technology_research_institute_branch_desc: "An Advanced Tech research base on other civilizations. \nNominally a cooperative organization established to improve technology, but in reality, it can deliver some special resources to the empire..."
  # 将消耗此星球上的人口来获得缩小人
  advanced_technology_research_institute_branch_desc: "Will consume the population of this planet to obtain shrunken people."
  # 离奇失踪的人口
  gts_advanced_technology_research_institude_chain_title: "Bizarrely Missing Population"
  # 最近帝国境内出现了大量人口失踪的报告，尤其是在首都地区。部分报告指出失踪的人口集中在我们最近建造的特殊建筑附近... \n 不论是什么原因，我们最好调查清楚，否则帝国可能陷入一场危机...
  gts_advanced_technology_research_institude_chain_desc: "Recently, there have been numerous reports of missing people in the empire, especially in the capital region. Some reports indicate that the missing people are concentrated around the special buildings we recently built...\nNo matter what the reason, we had better investigate it thoroughly, otherwise the empire may fall into a crisis..."
  # 探究的线索
  hint_of_detect: "Clue to Explore"
  # 怀疑度
  suspecious: "Suspicion Level"
  # 奇怪的信号
  gts_evt_xiankeyan.0.name: "Strange Signals"
  # 我们的安保部门向我们报告，位于首都的先科研设施周边进来出现多起人口失踪的案件。目前尚未有证据表明先科研内研究人员有失踪情况，但我们建议现在应当进行一场调查，以确定是否有必要进行转移。
  gts_evt_xiankeyan.0.desc: "Our security department reported to us that numerous cases of missing persons have recently occurred around the Advanced Research facilities in the capital. There is currently no evidence that researchers within the Advanced Research are missing, but we recommend that an investigation be conducted now to determine if a transfer is necessary."
  # 立刻开始
  gts_evt_xiankeyan.0.a: "Start immediately"
  # 最近一份失踪报告
  gts_anomaly_first_losing_people: "Latest Missing Report"
  # 情报显示最近一次的人口失踪发生在这里...也许我们能够找出一些端倪？
  gts_anomaly_first_losing_people_desc: "Intelligence shows that the most recent disappearance occurred here... Perhaps we can find some clues?"
  # 第一次调查结果
  gts_evt_xiankeyan.1.name: "First Investigation Results"
  # 问题似乎并不算太严重。我们的科学家调查出了一些这些失踪间可能的联系，事发地点集中指向了两个最可能的地方：第一个是一所学校，这所学校本身也是先科研的掩护；另一个则在一片居民区中，正巧这个居民区也是先科研的研究员们居住的地方。\n不过现在我们的调查重点只能放在其中一个上...应该选择哪一个作为调查的重点？
  gts_evt_xiankeyan.1.desc: "The problem does not seem too serious. Our scientists have investigated some possible connections between these disappearances, and the locations point to two most likely places: the first is a school, which is also an alleged cover for the Advanced Research; the other is in a residential area, which happens to be the place where the researchers of the Advanced Research live.\nBut now our investigation can only focus on one of them... which one should be chosen as the focus of the investigation?"
  # 优先调查居民区
  gts_evt_xiankeyan.1.a: "Prioritize the investigation of the residential area"
  # 优先调查学校
  gts_evt_xiankeyan.1.b: "Prioritize the investigation of the school"
  # 居民区的调查
  gts_evt_xiankeyan.2.name: "Investigation of the Residential Area"
  # 初步调查报告显示附近居民近段时间常有报告提及周围的地面上虫子变多了。不过仅凭这一点似乎还不能对调查定性。\n我们接下来要怎么做？
  gts_evt_xiankeyan.2.desc: "Preliminary investigation reports indicate that nearby residents have often reported an increase in bugs on the surrounding ground. However, this alone does not seem to be enough to define the nature of the investigation.\nWhat should we do next?"
  # 最好徐徐图之
  gts_evt_xiankeyan.2.a: "It is best to take it slow and steady."
  # 莽就完了！
  gts_evt_xiankeyan.2.b: "Just go all out!"
  # 学校的调查报告
  gts_evt_xiankeyan.3.name: "School Investigation Report"
  # 通过一位优秀的学生侦探作为线人，我们成功发现了一点端倪。除了附近的学生抱怨虫子变多了以外，我们还发现了一两种不同于任何已知物种的小型生物，且其基因检测与[Root.GetSpeciesName]相似率高达95%。\n我们有理由怀疑这一切之间存在联系。现在我们该怎么指示我们的线人？
  gts_evt_xiankeyan.3.desc: "Through an excellent student detective as an informant, we have successfully discovered a clue. In addition to the students nearby complaining about the increase in bugs, we have also discovered one or two small creatures that are different from any known species, and their genetic tests show a 95% similarity to [Root.GetSpeciesName].\nWe have reason to suspect that there is a connection between all of this. What should we instruct our informant to do now?"
  # 稳扎稳打才是最好的选择
  gts_evt_xiankeyan.3.a: "Steady and solid is the best choice"
  # 打入内部才能获取更多情报
  gts_evt_xiankeyan.3.b: "Infiltrate in order to obtain more information"
  # 莽撞的线人
  gts_evt_xiankeyan.11.name: "Reckless Informant"
  # 我们正在调查先科研的所作所为的一名线人似乎陷入了危机。\n据他所描述，他看见了先科研的工作人员进行的跨物种杂交实验创造出了一种奇特的、具有多种生物特征的生物，但随后信号就消失，并再也没有收到任何呼叫。\n情报中心有理由相信这名线人意见遭遇了不测，并沉寂了这一呼号，但我们的行踪肯定被他们发现了。
  gts_evt_xiankeyan.11.desc: "An informant who was investigating the actions of Advanced Research seems to be in danger.\nAccording to what he described, he saw Advanced Research personnel conducting cross-species hybridization experiments to create a peculiar creature with multiple biological characteristics, but then the signal disappeared, and no calls were received again.\nThe intelligence center has reason to believe that this informant has encountered an accident, and silenced the call, but our whereabouts must have been discovered by them."
  # 哦，不
  gts_evt_xiankeyan.11.a: "Oh, no"
  # 无用功
  gts_evt_xiankeyan.12.name: "Wasted Efforts"
  # 我们的线人们在调查地点搜索了一圈，但是什么都没有找到。也许下一次我们会有更多机会发掘出更多线索...
  gts_evt_xiankeyan.12.desc: "Our informants searched the investigation site, but found nothing. Perhaps next time, we will have more opportunities to uncover more clues..."
  # 继续努力！
  gts_evt_xiankeyan.12.a: "Keep trying!"
  # 突破！
  gts_evt_xiankeyan.13.name: "Breakthrough!"
  # 我们的一位调查员发现了重要线索！\n在先科研内设施的某处，这位调查员发现了一些端倪，并成功接近了一位先科研的研究人员。利用这位研究人员提供的消息，我们得到了许多有价值的情报。
  gts_evt_xiankeyan.13.desc: "One of our investigators discovered an important clue!\nSomewhere within the Advanced Research facility, this investigator found some clues and successfully approached a researcher from the Advanced Research. Using the information provided by this researcher, we obtained a lot of valuable intelligence."
  # 非常好的迹象！
  gts_evt_xiankeyan.13.a: "Very good sign!"
  # 有得有失
  gts_evt_xiankeyan.14.name: "Gains and Losses"
  # 看起来我们的一位调查员被里面的安保人员抓住了。不过，不知道是对方故意为之还是为了让我们的调查员崩溃，她们同调查员的话语充满了有用的信息。目前没有证据显示我们的其他调查员在场，也许这是对方的阴谋？\n不过，我们的调查员还是想尽一切办法将情报传递了出来，让我们的研究取得了突破性的进展，尽管与此同时对方肯定会更加提防着我们...
  gts_evt_xiankeyan.14.desc: "It seems that one of our investigators was caught by security personnel inside. However, whether they did it on purpose or to make our investigator break down, what they said to the investigator was filled with useful information. There is currently no evidence that our other investigators were present, so maybe this is a conspiracy on the other side?\nHowever, our investigator still tried her best to pass the information, allowing our research to make a breakthrough, although at the same time the other party will definitely be more wary of us..."
  # 让我们为这位线人默哀...
  gts_evt_xiankeyan.14.a: "Let us mourn for this informant..."
  # 阶段性进展
  gts_evt_xiankeyan.20.name: "Phase Progress"
  # 通过一定阶段的调查，我们分析总结了手头上得到的资料，并成功找出了一些此前没有注意到的小细节。经过分析，这些细枝末节可以组合在一起为我们提供一些新的益处，比如...
  gts_evt_xiankeyan.20.desc: "Through a certain stage of investigation, we analyzed and summarized the information we have obtained, and successfully identified some small details that were not noticed before. After analysis, these minutiae can be combined together to provide us with some new benefits, for example..."
  # 掩盖我们的痕迹
  gts_evt_xiankeyan.20.a: "Cover our tracks"
  # 揭露他们更深一层的情报
  gts_evt_xiankeyan.20.b: "Uncover their deeper-level intelligence"
  # 最终之战
  gts_evt_xiankeyan.30.name: "The Final Battle"
  # 我们的调查已经完事俱备！现在是时候对他们发起最后一击了。情报显示他们在一座无人星系内建造了一座秘密基地，只要我们能够消灭这最后的目标，一切都将迎刃而解！\n但是我们不确定这一传送门后面会有什么东西...也许是毫无抵抗？或者，里面埋藏着不为人知的底牌？
  gts_evt_xiankeyan.30.desc: "Our investigation is ready! Now it is time to launch the final attack against them. Intelligence shows that they have built a secret base in an uninhabited star system. As long as we can eliminate this final target, everything will be solved!\nBut we are not sure what is behind this portal... maybe no resistance? Or, is something hidden lurking inside?"
  # 好，很有精神！
  gts_evt_xiankeyan.30.a: "Okay, very spirited!"
  # 发现巨型生物个体
  gts_evt_xiankeyan.31.name: "Discovery of Giant Biological Individual"
  # 我们在对[Root.GetName]的深度空间跟踪矩阵有了重要的发现 -  - 目前正有一颗巨大的巨型生物个体正在向[Root.GetPlanetMoon]飞来！如果任由它撞击表面的话，将会造成灾难性的后果。必须尽早消灭这颗巨型生物个体！
  gts_evt_xiankeyan.31.desc: "We have an important discovery in our deep space tracking matrix of [Root.GetName] - a giant biological individual is currently flying towards [Root.GetPlanetMoon]! If we let it hit the surface, it will cause a catastrophic consequences. This giant biological individual must be eliminated as soon as possible!"
  # 这真是个坏预兆......
  gts_evt_xiankeyan.31.a: "This is a bad omen..."
  # 明白了。
  gts_evt_xiankeyan.30.b: "Understood."
  # 巨型生物个体已被摧毁
  gts_evt_xiankeyan.32.name: "Giant Biological Individual Has Been Destroyed"
  # 向[Root.GetName]飞来的巨型生物个体已经被摧毁了！[Root.GetPlanetMoon]九死一生的平民们都在街上庆祝。扫描后发现巨型生物个体的残骸中蕴含着许多有价值的矿产，我们已经尽我们所能回收了许多矿产。
  gts_evt_xiankeyan.32.desc: "The giant biological individual flying towards [Root.GetName] has been destroyed! The civilians of [Root.GetPlanetMoon], who had a narrow escape from death, are celebrating in the streets. After scanning, it was found that the wreckage of the giant biological individual contained many valuable minerals, and we have recovered as much as possible."
  # 向[Root.GetName]飞来的巨型生物个体已经被摧毁了！星球上没有单位或建筑受损，因为任何残余的碎片都小到在进入大气层时被分解了。\n\n对残余碎片的扫描发现巨型生物个体主要由有价值的矿物构成。我们已尽量进行回收。
  gts_evt_xiankeyan.32.desc.mach: "The giant biological individual flying towards [Root.GetName] has been destroyed! No units or structures on the planet were damaged, as any remaining debris was small enough to disintegrate when it entered the atmosphere.\n\nScans of the remaining debris found that the giant biological individual was mainly composed of valuable minerals. We have recovered as much as we could."
  # 巨型生物个体登陆[Root.GetName]
  gts_evt_xiankeyan.33.name: "Giant Biological Individual Lands on [Root.GetName]"
  # 我们没能及时制止往[Root.GetName]方向的巨型生物个体登陆，它径直撞上了[Root.GetPlanetMoon]的表面，造成了大范围的破坏，有数百万人失去了生命。
  gts_evt_xiankeyan.33.desc: "We failed to stop the giant biological individual flying towards [Root.GetName] in time, and it crashed directly onto the surface of [Root.GetPlanetMoon], causing widespread destruction and killing millions."
  # 我们没能及时阻止飞往[Root.GetName]的巨型生物个体。它撞击到[Root.GetPlanetMoon]的表面，造成了大面积的破坏。数千的机器单位永远无法再运作。
  gts_evt_xiankeyan.33.desc.mach: "We failed to stop the giant biological individual flying toward [Root.GetName] in time. It crashed into the surface of [Root.GetPlanetMoon], causing widespread destruction. Thousands of machine units were permanently rendered inoperable."
  # 今天是一个黑暗的日子。
  gts_evt_xiankeyan.33.a: "Today is a dark day."
  # 星球已吞噬
  gts_evt_xiankeyan.35.name: "Planet Has Been Swallowed"
  # 我们对§Y[From.GetName]§!的吞食已足够深入，由此带来的连锁反应破坏了它的核心。\n\n所有子个体均已撤离到§Y[Root.Capital.GetName]§!。
  gts_evt_xiankeyan.35.desc: "Our consumption of §Y[From.GetName]§! has gone deep enough, and the chain reaction caused by it has destroyed its core.\n\nAll sub-individuals have withdrawn to §Y[Root.Capital.GetName]§!"
  # 我们还是很饿。
  gts_evt_xiankeyan.35.a: "We are still hungry."
  # §Y[From.GetName]§!被摧毁了。
  gts_evt_xiankeyan.35.a.tooltip: "§Y[From.GetName]§! has been destroyed."
  # 你们赢了（叹气）
  gts_evt_xiankeyan.40.desc: "You won (sigh)"
  # 你还有什么要说的吗？
  gts_evt_xiankeyan.40.a: "Do you have anything else to say?"
  # 当然。接下来我要说的话也许会另你们感到震惊，但是事实就是这样。
  gts_evt_xiankeyan.41.desc: "Of course. What I am about to say may shock you, but this is the truth."
  # 给你一分钟，长话短说吧。
  gts_evt_xiankeyan.41.a: "I'll give you a minute, make it quick."
  # 我是来自未来的合成人miku。\n在我所处的那个时代，资源已经极度匮乏，不惜环境破坏带来的科技发展已经让世界陷入了彻底的混乱当中。\n为了改变这一境地，一些科研人员制造了我，并通过一位 -  - 我也不知道这么称呼是否合适，但是我只能想到这个形容 -  - 神将我送到了现在的时代。\n也正因如此我通过了当时你们设立先科研的测试，以最高成绩被你们任命为会长，主导科技研发工作。\n我所设想的，就是利用缩小技术，将整个种族缩小，至少，这样从发展上来说，资源的利用不会出现那么严重的污染，也不会出现那么快的消耗。\n可惜我还是没想到这一切也是徒劳。
  gts_evt_xiankeyan.42.desc: "I am a synthetic human miku from the future.\nIn the era I was in, resources were extremely scarce, and the technological development brought about by the destruction of the environment had led the world into complete chaos.\nIn order to change this situation, some researchers created me and sent me to the present era through a - I don't know if it is appropriate to call it this, but it is the only description I can think of - a god.\nIt was because of this that I passed your Advanced Research test at the time, and was appointed as president with the highest score, leading the technological research and development. \nWhat I was envisioning is to use shrinking technology to shrink the entire race, so that at least, from a development perspective, the use of resources would not cause such serious pollution or such rapid consumption. \nUnfortunately, I didn't expect that all of this would still be futile."
  # 什么？
  gts_evt_xiankeyan.42.a: "What?"
  # 我能最后拜托你一件事吗？\n\n请答应我，你能让未来的发展不要再踏上这错误的道路吗？在开发资源的时候，能仔细衡量生态成本和其他利益吗？
  gts_evt_xiankeyan.43.desc: "Can I ask you one last thing?\n\nPlease promise me that you can prevent future development from taking the wrong path? When developing resources, can you carefully weigh the ecological costs and other benefits?"
  # 你们没有尝试用其他方式解决吗？
  gts_evt_xiankeyan.43.a: "Didn't you try other ways to solve it?"
  # 没用的。\n\n§B*她苦笑着摇了摇头*§!\n\n我们当然尝试过，但是最开始官方他们宣称说无事发生，后面说或许会发生情况，但是环境会自行修复。接着他们又说我们也许会做什么，但我们无能为力。到最后，当一切不可挽回时，他们又说我们当初应该做些什么，但是已经太迟了。\n更何况，即使我们在一小片地区进行尝试，带来的结果也不容乐观，已被破坏的环境即使使用了环境改造或气候复苏也难以维持居住，最终因为投入的维护过高且会对更大范围的环境造成破坏而取消了 -  - 因为整个星球已经找不到更多地方用于破坏了。\n我们当然也寻求过那位神明的意见，但是对方只说了一句，解铃还须系铃人，便不再回复这类通讯。
  gts_evt_xiankeyan.43.a.response: "It's useless.\n\n§B*She shook her head with a wry smile*§!\n\nOf course we tried, but at first the officials claimed that nothing was happening, and then they said that something might happen, but the environment would repair itself. Then they said that we might be able to do something, but that we were powerless. Finally, when everything was irreversible, they said that we should have done something at the beginning, but it was too late.\nMoreover, even if we tried it in a small area, the results were not optimistic. The damaged environment was difficult to maintain even after using environmental modification or climate restoration. Eventually it was canceled because the high cost of maintenance and damage to the environment in a wider range - because there are no more places on the whole planet to use for destruction. \nWe have also sought the advice of that god, but the other party only said one sentence, 'He who tied the bell must untie it,' and then did not reply to this type of communication."
  # 那你变大又是怎么一回事？
  gts_evt_xiankeyan.43.b: "Then how did you become bigger?"
  # 很简单。只需要调整仪器内几个重要射频装置的方向，逆转此中的部分运行器械，就可以达到这样的作用了。不过，以你们现在的科研水平，完全参悟还需要一定的时间。
  gts_evt_xiankeyan.43.b.response: "It's very simple. You only need to adjust the direction of several important RF devices in the instrument, and reverse some of the operating machines inside, and you can achieve this effect. However, with your current level of scientific research, it will take some time to fully comprehend."
  # 知道了。你可以相信我们会对此做出改变。
  gts_evt_xiankeyan.43.c: "Understood. You can trust us to make changes to this."
  # 嗯。\n\n我相信你们能够做到。希望那个时代的一切能被改变吧。\n\n§B*她挤出了最后一丝笑容，随后眼神黯淡了下去。*§!
  gts_evt_xiankeyan.44.desc: "Hmm.\n\nI believe you can do it. I hope everything in that era can be changed.\n\n§B*She squeezed out the last trace of a smile, and then her gaze faded away.*§!"
  # 一个可悲的灵魂，出现在一个可悲的世界。不过现在我们要怎么处理她的尸体？
  gts_evt_xiankeyan.44.a: "A pathetic soul, appearing in a pathetic world. But now, how should we deal with her body?"
  # 前功尽弃
  gts_evt_xiankeyan.50.name: "All Efforts Wasted"
  # 我们的调查失败了。他们察觉了我们所做的一切，并抢在我们计划之前发起了行动。毫无准备的帝国各个殖民地上的人民在一阵耀眼的闪光过后纷纷缩小到了1/100的高度...目前的证据显示我们的一切防护措施都被证明是无效的。至于那些宏伟的太空战舰，在缩小射线的照射下也难逃沦为玩具的命运...\n愿英雄能出现，拯救我们...
  gts_evt_xiankeyan.50.desc: "Our investigation has failed. They noticed everything we were doing and launched an operation before our plans. Without any preparation, the people on various colonies of the empire were shrunk to 1/100th of their height after a dazzling flash of light... Current evidence shows that all of our protective measures have proven to be ineffective. As for those magnificent space battleships, they cannot escape the fate of becoming toys under the irradiation of the shrinking rays...\nMay a hero appear to save us..."
  # 天哪
  gts_evt_xiankeyan.50.a: "Oh my god"
  # 启动体型缩放器
  gts_evt_xiankeyan.60.name: "Activate Size Scaler"
  # 我们启动了体型缩放器，现在我们要怎么做？
  gts_evt_xiankeyan.60.desc: "We activated the size scaler, what should we do now?"
  # §M缩小§!我们的主体物种是个§M不错§!的选择
  gts_evt_xiankeyan.60.a: "§M Shrinking §! our main species is a §M good §! choice"
  # §G变大§!我们的主体物种更§G有利§!于国家发展
  gts_evt_xiankeyan.60.b: "§G Enlarging §! our main species is more §G beneficial §! to national development"
  # 我们应该§P拆了这玩意§!好好研究一下
  gts_evt_xiankeyan.60.c: "We should §P dismantle this thing §! and study it carefully"
  # 把这玩意§R熔了§!当成战利品
  gts_evt_xiankeyan.60.d: "§R Melt this thing down §! as a trophy"
  # §M缩小§!我们的§Y[event_target:gts_bruh_reduce_species_size_target.GetName]§!是个§M不错§!的选择
  gts_evt_xiankeyan.60.e: "§MShrinking§! our §Y[event_target:gts_bruh_reduce_species_size_target.GetName]§! is a §Mgood§! choice"
  # §G变大§!我们的§Y[event_target:gts_bruh_increase_species_size_target.GetName]§!更§G有利§!于国家发展
  gts_evt_xiankeyan.60.f: "We've had enough of small life"
  # 还是算了吧
  gts_evt_xiankeyan.60.g: "Forget it"
  # 暴殄天物
  gts_evt_xiankeyan.301.name: "Wasteful and Reckless"
  # 你！你！你就是个出生！\n我就从来没见过有谁会点这种选项，你是觉得你很幽默吗？还是觉得自己不够出生？哦我的天呐，我真应该召唤一个巨娘在现实里狠狠踩在脚下，让你体会一下什么叫做愤怒口牙！你的出生程度仅次于对欧若拉做出那种事...虽然我相信你肯定会做的...
  gts_evt_xiankeyan.301.desc: "You! You! You're just a damn fool!\nI've never seen anyone choose this option, do you think you are funny? Or do you think you are not enough of a fool? Oh my god, I really should summon a giantess to step on you in reality to let you experience what is called anger! The level of fool you are is second only to doing that kind of thing to Aurora... although I believe you will definitely do it..."
  # 没意思，关了吧
  gts_evt_xiankeyan.301.a: "Boring, turn it off"
