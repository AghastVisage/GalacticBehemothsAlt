  # 洗脑
  PLANET_KILLER_HERMONE_ACTION: "Brainwash"
  # 主人的乳汁拥有极强的吸引力，没有物种能够拒绝主人的乳汁液滴，并将从此永远变成奴隶...
  PLANET_KILLER_HERMONE_DESC: "Our master's milk has an extremely strong attraction. No species can refuse our master's milk droplets, and will from then on become slaves forever..."
  # 主人的尿道
  PLANET_KILLER_URINE: "Master's Urethra"
  # 放尿
  PLANET_KILLER_URINE_ACTION: "Piss"
  # 主人在生理需要和羞辱下组合出的行为。奔腾的尿液将淹没整个星球，将一切淹没在汪洋中...
  PLANET_KILLER_URINE_DESC: "A combination of physiological needs and humiliation by the master. The rushing urine will flood the entire planet, submerging everything in the ocean..."
  # 主人的雏菊
  PLANET_KILLER_FART: "Master's Daisy"
  # 放屁
  PLANET_KILLER_FART_ACTION: "Fart"
  # 主人在生理需要和嘲弄下组合出的行为。充满高能气体的恶臭气体将会从主人的雏菊中释放，产生的冲击波和爆炸足以摧毁星球表面的一切的同时让这个星球染上难以退化的味道...
  PLANET_KILLER_FART_DESC: "A combination of physiological needs and mockery by the master. The smelly gas filled with high-energy gasses will be released from the master's daisy. The shock waves and explosions generated are enough to destroy everything on the planet's surface and give the planet a difficult-to-degrade smell..."
  # 主人的胃袋
  PLANET_KILLER_ACID: "Master's Stomach"
  # 消化
  PLANET_KILLER_ACID_ACTION: "Digest"
  # 这片宇宙当中最强腐蚀性的物质会将这个星球彻底融化为身体的养分,化为下一次的需要。
  PLANET_KILLER_ACID_DESC: "This most corrosive substance in the universe will completely dissolve this planet into nutrients for the body, becoming the need for the next time."
  # 主人的直觉
  SENSOR_ANNIHILATOR: "Master's Intuition"
  # 主人的力量
  ANNIHILATOR_REACTOR: "Master's Power"
  # 主人的意愿
  JUMP_DRIVE_ANNIHILATOR: "Master's Will"
  # 主人的双足
  ANNIHILATOR_THRUSTER: "Master's Feet"
  # 主人的交互体
  SHIP_MASTER_SECTION: "Master's Interactive Body"
  # 主人的身体
  SHIP_MASTER_SECTION_1: "Master's Body"
  # 主人的下肢
  SHIP_MASTER_SECTION_2: "Master's Lower Limbs"
  # 主人的手指
  KINETIC_ARTILLERY_MASTER: "Master's Finger"
  # 这个宇宙最强大的动能武器，没有什么能承受它的一击。
  KINETIC_ARTILLERY_MASTER_DESC: "The most powerful kinetic weapon in the universe, nothing can withstand a single blow from it."
  # 主人的灼热视线
  PLASMA_MASTER: "Master's Scorching Gaze"
  # 这算是主人的能力吧...只需要盯着敌人看，对面就会灰飞烟灭？
  PLASMA_MASTER_DESC: "This can be considered master's ability... Just by staring at the enemy, they will be reduced to ashes?"
  # 主人身体的翕动
  AUTOCANNON_MASTER: "Master's Body Twitch"
  # 有规律而无意识的活动在巨大的体型差下不啻毁天灭地。
  AUTOCANNON_MASTER_DESC: "Regular and unconscious movements are no less than earth-shattering due to the huge size difference."
  # 主人的静电
  SCOURGE_MISSILE_MASTER: "Master's Static Electricity"
  # 主人巨大的身体表面在穿梭中积累了超乎想象的电荷，靠近身体的外来物必然会被这些电荷形成的电弧攻击。
  SCOURGE_MISSILE_MASTER_DESC: "The master's huge body surface has accumulated an unimaginable amount of charge during transit. Foreign objects approaching the body will inevitably be attacked by the arcs formed by these charges."
  # 主人的手刀
  ENERGY_LANCE_MASTER: "Master's Hand Blade"
  # 也许，直接用手刀更加方便驱赶虫子？
  ENERGY_LANCE_MASTER_DESC: "Perhaps it's more convenient to drive away the bugs with a hand blade?"
  # 主人的自卫器官
  POINT_DEFENCE_MASTER: "Master's Self-Defense Organs"
  # 我们太愚蠢了，根本没注意到主人还有这样的器官，也不能理解发生了什么
  POINT_DEFENCE_MASTER_DESC: "We are too foolish, we didn't even notice that master had such organs, and we can't understand what happened."
  # 主人的唾液
  TORPEDO_MASTER: "Master's Saliva"
  # 高速时，水的破坏力不亚于土，更何况是这么一大团唾液以这么高的速度...
  TORPEDO_MASTER_DESC: "At high speed, the destructive power of water is no less than that of earth, let alone such a large glob of saliva at such a high speed..."
  # 主人的服饰
  LARGE_ARMOR_MASTER: "Master's Clothing"
  # 主人的服装看起来飘逸轻盈，那也是在体型差下的结果...它的厚度和强度不能简单地直接想象...
  LARGE_ARMOR_MASTER_DESC: "Master's clothing looks light and flowing, which is also the result of the size difference... Its thickness and strength cannot be simply imagined directly..."
  # 主人的意识屏障
  LARGE_A_BARRIER_MASTER: "Master's Consciousness Barrier"
  # 似乎，主人的意识能够形成一道巨大的屏障阻碍外界攻击的渗透...
  LARGE_A_BARRIER_MASTER_DESC: "It seems that the master's consciousness can form a huge barrier to block the penetration of external attacks..."
  # 近距离玩弄
  BOMBING_MASTER: "Playing Up Close"
  # 也许这么近才能使那群微生物知道主人是怎样的存在呢...
  BOMBING_MASTER_DESC: "Perhaps only so close can those microorganisms know what kind of existence the master is..."
  # 自我恢复
  AUTO_REPAIR_MASTER: "Self-Recovery"
  # 主人强大的自愈能力令我们望尘莫及。
  AUTO_REPAIR_MASTER_DESC: "Master's powerful self-healing ability is beyond our reach."
  # 主人的想法
  COMBAT_COMPUTER_MASTER: "Master's Thoughts"
  # 和烦人的虫子还是保持一定距离为好
  COMBAT_COMPUTER_MASTER_DESC: "It's best to keep a certain distance from those annoying bugs."
  # 胖次
  ARMOR_MASTER: "Panties"
  # 保护主人敏感地带的重要防护，设计非常大胆前卫，还可以用来囚禁取乐的奴隶。
  ARMOR_MASTER_DESC: "Important protection for master's sensitive area. The design is very bold and avant-garde, and can also be used to imprison slaves for fun."
  # 胸衣
  A_BARRIER_MASTER: "Bra"
  # 主人上身重要地带的防护，尽管它总是给我们一种随时会因为主人庞大的双峰撑开的感觉...
  A_BARRIER_MASTER_DESC: "Protection for the important part of the master's upper body, although it always gives us the feeling that it will open because of the master's huge breasts at any time..."
  # 漫无目的
  gts_annihilator_planet_killer.1.name: "Aimless"
  # [Root.GetName]遭到了可怖的§Y[From.GetAdj]§!邪恶巨人的攻击。我们失去的不仅仅是这个星球，还有我们的始祖以及所有居住在这个[Root.GetPlanetHabitat]上的子嗣。[Root.GetName]上的每一个子嗣和子个体都集结在一起，尽全力保护我们的始祖不受这个可怕巨娘的波及。最终，它们的所有努力都只不过是延缓了无可避免的厄运，始祖很快陨落了。\n\n现在我们的主体意识里满是矛盾碰撞的思想和冲动。如果我们不马上指派一名新的始祖，[Owner.GetName]很快就会停止生命。
  gts_annihilator_planet_killer.1.desc: "[Root.GetName] was attacked by a terrifying §Y[From.GetAdj]§! evil giant. We lost not only this planet, but also our progenitor and all the descendants living on this [Root.GetPlanetHabitat]. Every descendant and sub-individual on [Root.GetName] gathered together, doing their best to protect our progenitor from this terrible giantess. In the end, all their efforts only delayed the inevitable, and the progenitor soon fell.\n\nNow our collective consciousness is filled with conflicting thoughts and impulses. If we do not immediately appoint a new progenitor, [Owner.GetName] will soon cease to live."
  # 我们要奋起反击！
  gts_annihilator_planet_killer.1.a: "We must fight back!"
  # 得，赶紧逃命吧！
  gts_annihilator_planet_killer.1.b: "Well, let's get out of here!"
  # 我们需要更多矿物。
  gts_annihilator_planet_killer.1.c: "We need more minerals."
  # *难以理解的嘶鸣*
  gts_annihilator_planet_killer.1.d: "*Incomprehensible screeching*"
  # 行星被屁覆盖
  gts_annihilator_planet_killer.11.name: "Planet Covered in Farts"
  # 来自[FromFrom.GetName]的滔天屁浪渐渐平息，[From.GetName]上生意盎然的生态系统不复存在，充满毒气的星球中唯有少数几种寄生在主人肠道的微生命能繁衍生息。
  gts_annihilator_planet_killer.11.desc: "The overwhelming fart wave from [FromFrom.GetName] has gradually subsided, and the vibrant ecosystem on [From.GetName] no longer exists. Only a few types of micro-life that parasitize in the host's intestines can thrive in the poisonous planet."
  # 行星被消化
  gts_annihilator_planet_killer.21.name: "Planet Digested"
  # 来自[FromFrom.GetName]的一切终于结束，上面的一切物体都已经消失，[From.GetName]上的生物和有用的无机物全部化作了主人身体的养料，只剩下因为没有作用而随着少许残留的消化液一起排出的残骸。
  gts_annihilator_planet_killer.21.desc: "Everything from [FromFrom.GetName] is finally over. All objects above have disappeared, and all the living things and useful inorganic matter on [From.GetName] have all been transformed into nutrients for our master's body. Only the remnants, which were of no use, are discharged along with some remaining digestive juices."
  # 星球被戳碎
  gts_annihilator_planet_killer.71.name: "Planet Poked to Pieces"
  # 戳球助兴
  gts_annihilator_planet_killer.72.name: "Poking a Ball for Fun"
  # 随着手指完成其毁天灭地的任务，[From.From.GetName]因受到[From.GetName]地壳破裂与磁层分解的猛烈冲击而产生的微微晃动也平息了下来。\n\n我们很难理解一颗星球死亡时的那种壮烈，但[From.GetName]炽热的核心在冰冷宇宙中冷却时的那种死亡之美是无可争辩的。不过可惜这样的景象只有这么一瞬间呢...
  gts_annihilator_planet_killer.71.desc: "As the finger completes its earth-shattering task, the slight shaking of [From.From.GetName], caused by the violent impact of [From.GetName]'s crust fragmentation and magnetosphere decomposition, has also subsided.\n\nIt is difficult for us to understand the magnificence of a planet's death, but the deathly beauty of [From.GetName]'s fiery core cooling in the cold universe is undeniable. But unfortunately, such a sight is just for a moment..."
  # 非常棒。
  gts_annihilator_planet_killer.71.a.purifexter: "Excellent."
  # 舔舐与吮吸
  gts_annihilator_planet_killer.31.name: "Licking and Sucking"
  # [From.GetName]地表上的吮吸完成后，[From.From.GetName]上的唾液逐渐散去了。扫描显示未发现智慧生命迹象；植被虽被摧毁，但会逐渐恢复的。有些人会称这种彻底消灭智慧生命，只保留无机质的做法为邪恶的战争罪行。\n\n §R我们将其称为高效的娱乐§!。
  gts_annihilator_planet_killer.31.nobots.desc: "After the sucking on the surface of [From.GetName] was completed, the saliva on [From.From.GetName] gradually dissipated. Scans show no signs of intelligent life; although the vegetation was destroyed, it will gradually recover. Some would call this complete obliteration of intelligent life, while only leaving inorganic matter, an evil war crime.\n\n §R We call it efficient entertainment §!."
  # [From.GetName]表面上的吮吸完成后，[From.From.GetName]上的唾液逐渐散去。\n\n声波传感器只传输来风声和合成人的呼声。所有生命已被扫除。
  gts_annihilator_planet_killer.31.bots.desc: "After the sucking on the surface of [From.GetName] was completed, the saliva on [From.From.GetName] gradually dissipated.\n\nSound sensors only transmit the sound of wind and synthetic people's calls. All life has been wiped out."
  # 完成了对[From.GetName]地表的舔舐之后，[From.From.GetName]的唾液渐渐消散。\n\n快速扫描确认了曾遍布地表的扭曲翻腾的有机质，已经彻底失去活性，仅剩贫瘠而不像样的石堆。
  gts_annihilator_planet_killer.31.infested.desc: "After licking the surface of [From.GetName], the saliva of [From.From.GetName] gradually dissipated.\n\nA quick scan confirmed that the twisting and churning organic matter that once covered the surface had completely lost its activity, leaving only barren and unsightly piles of rocks."
  # 强制改信
  gts_annihilator_planet_killer.41.name: "Forced Conversion"
  # [From.From.GetName]上的乳液的哗啦声逐渐淡去，一瞬间万物寂静。[From.GetName]上的人群目瞪口呆（如果他们有眼和鼻的话），主人的样貌和身影在他们的脑海和心智发散着，每个人都着迷于其强大和强烈的个人信仰。\n\n如果他们之前不明白的话，现在他们知道了：我们都只是某个更伟大事物的一部分，只配成为她的奴隶。
  gts_annihilator_planet_killer.41.desc: "The splashing sound of the milk on [From.From.GetName] gradually faded, and for a moment, all was silent. The people on [From.GetName] were dumbfounded (if they had eyes and noses), the master's appearance and figure dissipated in their minds and hearts, and everyone was fascinated by her power and strong personal beliefs.\n\nIf they didn't understand it before, now they know: we are all just part of something greater, only worthy of becoming her slaves."
  # 所有§Y$trait_mechanical$§!，§Y$trait_machine_unit$§!或§Y$trait_hive_mind$§!人口都被灵能共振§R摧毁§!。\n\n所有残存的§Y生物§!人口变成§Y$ethic_spiritualist$§!。\n\n为[This.GetName]添加§Y$god_rayed$§!修正，持续§Y10年§!：\n唯心思潮吸引力：§Y+999%§!。
  gts_annihilator_planet_killer.41.tooltip: "All §Y$trait_mechanical$§!, §Y$trait_machine_unit$§! or §Y$trait_hive_mind$§! populations are §Rdestroyed§! by psionic resonance.\n\nAll remaining §Ybiological§! populations become §Y$ethic_spiritualist$§!.\n\nAdds the §Y$god_rayed$§! modifier to [This.GetName] for §Y10 years§!:\nPsionic Attraction: §Y+999%§!."
  # [From.GetName]被UB
  gts_annihilator_planet_killer.61.name: "[From.GetName] is UB'd"
  # 从[From.From.GetName]发出的耀眼光束逐渐暗淡，[From.GetName]寂静无声。\n\n也许历史会将这次UB，这次将[From.GetName]从大宇宙完全隔离的行为，视作极端且不合理。也许也不会。不管如何，从现在起[From.GetStarName]星系有了一颗行星规模的主人的小玩具。
  gts_annihilator_planet_killer.61.desc: "The dazzling beam emitted from [From.From.GetName] gradually dimmed, and [From.GetName] was silent.\n\nPerhaps history will see this UB, this act of completely isolating [From.GetName] from the great universe, as extreme and unreasonable. Maybe it won't. Anyway, from now on, the [From.GetStarName] system has a planet-sized toy of our master's."
  # [From.From.GetName]炫目的光芒已渐渐黯淡，[From.GetName]归于沉寂。\n\n生活将在封闭的世界中继续。
  gts_annihilator_planet_killer.61.desc.alt: "The dazzling light from [From.From.GetName] has gradually dimmed, and [From.GetName] has returned to silence.\n\nLife will continue in the enclosed world."
  # 轻按小穴看他们蠕动。
  gts_annihilator_planet_killer.61.a: "Lightly press on the hole and watch them squirm."
  # 必要的取乐。
  gts_annihilator_planet_killer.61.b: "Necessary entertainment."
  # 行星已被尿液淹没
  gts_annihilator_planet_killer.51.name: "Planet has been Flooded with Urine"
  # 随着从[FromFrom.GetName]上下降的尿液消散，[From.GetName]的表面完全改变了。 曾经有广阔缺水的大陆，现在只有崭新闪耀着欢迎的微光的黄色海洋，随时可以供忠诚的我们利用居住。
  gts_annihilator_planet_killer.51.desc: "As the urine descending from [FromFrom.GetName] dissipated, the surface of [From.GetName] was completely changed. What was once a vast, arid continent is now a brand new, shimmering yellow ocean that welcomes us with a slight glow, ready for housing our loyal ones."
  # 星球变为§Y$pc_ocean$§!。\n没有§Y$trait_aquatic$§!特质的人口全部死亡。
  gts_annihilator_planet_killer.51.tooltip: "Planet becomes §Y$pc_ocean$§!.\nAll pops without the §Y$trait_aquatic$§! trait die."
  # 超空间捷径
  gts_annihilator_planet_killer.81.name: "Hyperspace Shortcut"
  # 超空间规划委员会报告，将太阳系的第三行星戳爆后，一个天然虫洞形成了。这个虫洞也许能逐渐缓解附近超空间通路的超光速交通拥堵。
  gts_annihilator_planet_killer.81.desc: "The Hyperspace Planning Committee reports that a natural wormhole has formed after the third planet in the Sol system was poked out. This wormhole may gradually alleviate the FTL traffic congestion in nearby hyperspace passages."
  # 这无聊的行星，我完全没有同情它。
  gts_annihilator_planet_killer.81.a: "This boring planet, I have no sympathy for it."
  # §Y[sol_sys.GetName]§!里已形成一个§H$NATURAL_WORMHOLE_GALACTIC$§!。
  gts_annihilator_planet_killer.81.a.tooltip: "A §H$NATURAL_WORMHOLE_GALACTIC$§! has formed in §Y[sol_sys.GetName]§!."
