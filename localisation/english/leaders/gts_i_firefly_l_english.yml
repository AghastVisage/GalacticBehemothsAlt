  # 沉睡在静默的星河
  leader_trait_firefly_DeepSleep_sever: "Sleeping in Silent Galaxy"
  # $leader_trait_firefly_DeepSleep_picture$在那最后一战之后，她想尽办法联系其她队友，但是耳边只有宇宙背景中的白噪声
  leader_trait_firefly_DeepSleep_sever_desc: "$leader_trait_firefly_DeepSleep_picture$After that final battle, she tried every way to contact other teammates, but only white noise from the cosmic background entered her ears."
