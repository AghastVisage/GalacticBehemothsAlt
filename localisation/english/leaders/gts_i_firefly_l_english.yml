  leader_trait_firefly_SoonGaze_sever: "I Will See, Firefly's Flame"
  # $leader_trait_firefly_SoonGaze_picture$银河间发光的浮游生物被她吸引，围绕着她翩跹飞舞。她目送它们飞向远方，却不知自己的终点在哪里。
  leader_trait_firefly_SoonGaze_sever_desc: "$leader_trait_firefly_SoonGaze_picture$Luminary plankton in the galaxy are attracted to her, dancing around her. She watches them fly away, not knowing where her destination is."
  # \n\n\n\n£leader_trait_firefly_SoonGaze_picture \n\n\n\n\n
