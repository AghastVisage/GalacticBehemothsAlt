  # 行走于毁灭的命途上
  Destruction_Path: "Walking the Path of Destruction"
  # 毁灭
  leader_trait_Destruction: "Destruction"
  # 践行着毁灭命途之人，拥有着强大的战斗力与破坏力
  leader_trait_Destruction_desc: "One who walks the path of destruction, possessing powerful combat and destructive capabilities."
  # 繁育
  leader_trait_Propagation: "Propagation"
  # 遵循着繁育命途之人，能够产生并统领大量生物
  leader_trait_Propagation_desc: "Those following the Path of Propagation can produce and command massive numbers of creatures."
  # 失熵症
  leader_trait_EntropyLossSyndrome: "Entropy Loss Syndrome"
  # 由基因改造而患上的基因疾病，会使物理结构会陷入不可逆的慢性解离，慢慢消失，只能依靠医疗舱维持生命
  leader_trait_EntropyLossSyndrome_desc: "A genetic disease caused by genetic modification, causing the physical structure to fall into irreversible chronic dissociation, slowly disappearing, and can only be sustained by a medical pod."
  # 主体
  leader_trait_FireflyMaster: "Subject"
  # 分化出小流萤的主体§E流萤§!，虽然力量有所减弱，但是消耗也随之降低了
  leader_trait_FireflyMaster_desc: "Main body §EFirefly§! who differentiated Little Fireflies. Although power weakened, consumption also decreased."
  # 客体
  leader_trait_FireflySever: "Object"
  # 由主体§E流萤§!分化出的小流萤，与主体相比的力量微乎其微，但是却能更加方便的进行科学研究与政务管理
  leader_trait_FireflySever_desc: "Little Firefly differentiated from main body §EFirefly§!. Power is negligible compared to main body, but more convenient for scientific research and administration."
  # 流萤燃烧形态
  NAME_firefly_Warship: "Liúyíng Burning Form"
  # 萤火战舰级
  gts_firefly_warship: "Firefly Battleship Class"
  # 流萤机甲形态
  NAME_firefly_army: "Liúyíng Mech Form"
  # 火萤战术机甲
  gts_firefly_army: "Firefly Tactical Mech"
  # 火萤形态
  NAME_firefly_transport: "Firefly Form"
  # 火萤运输船
  gts_firefly_transport: "Firefly Transport"
  # 由流萤提供来自失落的格拉默帝国生产的量产型机甲
  gts_firefly_army_desc: "Mass-produced mechs from the lost Glamour Empire, provided by Liúyíng."
  # 流萤通讯
  gts_firefly.301.title: "Liúyíng Communication"
  # 今天来是又有什么事情要拜托我了吗，只要是你的请求，我一定全力完成
  gts_firefly.301.a.desc: "Is there something you need me to do today? I will do my best to fulfill any request of yours."
  # 需要海军援助
  gts_firefly_call.1.a: "Request Naval Assistance"
  # “需要动用我的身体吗？请稍等一下哦。”\n面前的流萤闭上了双眼，片刻后，震天动地的轰鸣声从远处传来，你能看到这个女孩从天边缓缓坐起，遮天蔽日的身影挡住了自然光线，随后她的身边燃起萤火，周边的空气开始扭曲，脚下的岩石树木都开始燃烧。她慢慢地悬浮到空中，直到来到一个你看起来合适的位置。\n“好了，火萤系统已经启动完毕，告诉我目标，我一定会完成任务”
  gts_firefly_call.1.a.response: "'Do you need me to use my true form? Please wait a moment.'\nLiúyíng closes her eyes. Moments later, a deafening roar echoes from the distance. You see the girl slowly rising from the horizon, her towering figure blocking the natural light.  Fireflies ignite around her, the surrounding air distorts, and the rocks and trees below begin to burn. She slowly levitates into the air until she reaches what you consider a suitable position.\n'Alright, the Firefly System is activated. Tell me your target, and I will complete the mission.'"
  # 需要陆军援助
  gts_firefly.call.1.b: "Request Ground Force Assistance"
  # 火萤IV型战略强袭装甲会成为你的利刃
  gts_firefly.call.1.b.response: "The Firefly Type IV Strategic Assault Armor will be your blade."
  # 没什么，就是来看看你
  gts_firefly.call.1.c: "Nothing in particular, just checking on you."
  # 停止雇佣
  gts_firefly.call.1.d: "Stop Employment"
  # 停止雇佣文案
  gts_firefly_call.1.d.response: "Stop Employment Copy"
  # 缺少能源供应
  gts_firefly_employ.name: "Lack of Energy Supply"
  # 长时间维持作战形态需要消耗大量的精力与能量，流萤已经向我们表示目前的能量不足以支持大规模的作战了，需要能源补给。从我们的监测数据来看，她应该是需要补魔了
  gts_firefly_employ.desc: "Maintaining combat form for extended periods requires a significant amount of energy and stamina. Liúyíng has indicated that her current energy levels are insufficient to support large-scale combat and she requires energy replenishment. Based on our monitoring data, it appears she needs... replenishment."
  # 提供少量精华供应
  gts_firefly_employ.1.a: "Provide a small amount of essence."
  # 提供大量精华供应
  gts_firefly_employ.1.b: "Provide a large amount of essence."
  # 干的不错，先休息一下吧
  gts_firefly_employ.1.c: "Good work. Take a break."
  # 流萤海军修正
  gts_firefly_warship_first_gts: "Firefly Navy Modifier"
  # 流萤海军修正
  gts_firefly_warship_first_tiny: "Firefly Navy Modifier"
  # 流萤陆军修正
  gts_firefly_army_first_gts: "Firefly Army Modifier"
  # 流萤陆军修正
  gts_firefly_army_first_tiny: "Firefly Army Modifier"
  # 流萤舰队遭受重创
  gts_firefly_reform.2.name: "Firefly Fleet Heavily Damaged"
  # 在与敌方舰队的交火中，流萤寡不敌众，在耗尽能源后只能脱离战场休整（两年后才能重新启用舰队）
  gts_firefly_reform.2.desc: "In crossfire with enemy fleet, Firefly was outnumbered. After exhausting energy, she could only leave battlefield for rest (Fleet can be reactivated in two years)"
  # 这场战斗我们失败了，但是还有希望
  gts_firefly_reform.2.response: "We lost this battle, but there is hope."
  # 流萤舰队休整完毕
  gts_firefly_reform.3.name: "Firefly Fleet Restored"
  # 经过修整，流萤已准备好再次为帝国效力
  gts_firefly_reform.3.desc: "After rest, Firefly is ready to serve the empire again."
  # 是时候亲手复仇了
  gts_firefly_reform.3.response: "Time for revenge."
  # 流萤军队遭受重创
  gts_firefly_reform.5.name: "Firefly Army Heavily Damaged"
  # 我们最新的机甲军队在战斗中损失殆尽，需要重新集结部队（两年后才能重新启用军队）
  gts_firefly_reform.5.desc: "Our latest Mecha army was lost in battle, needing to regroup forces (Army can be reactivated in two years)"
  # 我的战士们遭受了巨大的损失
  gts_firefly_reform.5.response: "My warriors suffered heavy losses."
  # 流萤军队集结完毕
  gts_firefly_reform.6.name: "Firefly Army Assembled"
  # 机甲部队已经集结完毕，就等您的命令了
  gts_firefly_reform.6.desc: "Mecha troops assembled, awaiting your order."
  # 再次进发
  gts_firefly_reform.6.response: "Advance again."
