  gts_aurora.1191.desc: "§HLady Aurora, your food is ready. Please enjoy.§!\\\\n\\\\nA mothership pulls a planet-sized round bowl as it floats before Aurora. Inside are piled many small portions of food whose size does not match the bowl. The tiny people, who have not yet cultivated gigantic vegetables and fruit, can only use this method for now to provide Lady Aurora with staple dishes, though pastries and desserts such as cream cakes do not have this problem.\\\\n\\\\nBeneath the cover of fragrant dishes on the surface, tiny people who fanatically worship Lady Aurora have mixed themselves among the leaves in the bowl, longing to enter the spiritual holy land: Lady Aurora's mouth. For this reason, these tiny people wash their bodies clean so as not to defile Lady Aurora's mouth, then sneak into the food during production and transport.\\\\n\\\\nEven though the procedures for guarding against such people have become increasingly strict, this phenomenon can never be completely stopped.\\\\n\\\\n§rThank you. I'm going to eat now.§!\\\\n\\\\nThe ship cuts the connection. Aurora picks up the small bowl, tilts her head back, and pours it into her mouth. The tiny people plunge into her mouth along with the shredded food.\\\\n\\\\nThe small bowl's contents soon all fall into her mouth. Aurora closes her mouth and begins to chew, and darkness descends inside her oral cavity as teeth broader than cities come smashing down.\\\\n\\\\nThe tiny people who land on the teeth burst one after another. Together with the dishes, they are cut apart and crushed by the teeth. The metallic smell of blood mixes with sweet saliva and delicious mashed food, adding a hint of fresh sweetness to the dish. Then her fragrant tongue turns, sending another piece of unchewed food together with tiny people onto the surface of her teeth.\\\\n\\\\nThe constant chewing gradually accumulates saliva in her mouth. Aurora closes her eyes and swallows the food mash with satisfaction, feeling the delicacy enter her throat, slide down her warm esophagus, and fall into her constantly writhing, food-craving stomach.\\\\n\\\\nIn the end, only a few tiny people survive near the roots of her teeth, untouched by tongue or teeth. These tiny people kiss her gums and praise Lady Aurora's mercy, swallowing saliva from between her teeth and cleaning food residue hidden there.\\\\n\\\\nThe aphrodisiac saliva is swallowed into the tiny people's stomachs, and its fermented, slightly sweet-and-sour taste erodes their reason. Gradually, the tiny people discover that they can no longer live without Lady Aurora's saliva.\\\\n\\\\nIt is foreseeable that even the tiny people who did not become food will gradually lose their dignity as people here, becoming residue-eating bugs inside Lady Aurora's mouth, unable to live without saliva as they clean away food scraps."
  gts_aurora.1192.desc: "Recently, among fanatical giantess worshippers, a trend has arisen of entering through the rear, passing through the rectum, being digested and absorbed in the intestines, and becoming nutrients for Lady Aurora's body.\\n\\nOn the surface, they claim that this lets them become part of Lady Aurora's body and align with Lady Aurora's will, but in reality it is only to satisfy their sexual desire.\\n\\nAt the rear, beside Lady Aurora's constantly opening and closing anus, these tiny people excitedly gather. They constantly discuss the route ahead with one another, showing no fear at all of the death waiting at the end.\\n\\nTaking advantage of the anus contracting and then relaxing, they leap in batch after batch, plunging into the rectum. After adapting to the dim light before them, the tiny people look around.\\n\\nThe surrounding environment is vast and dark red, like entering a new world. The intestinal flesh walls are covered in twisted transverse folds that constantly squeeze and writhe back and forth. A layer of crystal-clear mucus coats the surface of the flesh walls. Stepping on it is like walking on ice during a slight earthquake, and they must crawl in order to advance with any composure.\\n\\nThe tiny people sigh with relief that no food residue has accumulated in the rectum. Otherwise, before they could become Lady Aurora's nutrients, they would be smeared by the rectum's peristalsis onto the surface of excrement and expelled from the body together with it.\\n\\nThe tiny people crawl through the long rectum, climb over section after section of round colon filled with fermented chyme, and barely pass through the ileocecal valve with the help of their tools.\\n\\nAfter a long time, the tiny people arrive at the destination of this journey: the small intestine. The flesh walls here are covered with villi taller than they are, and the faint stench in the air has vanished, replaced by a sour scent of cream cake.\\n\\n§HSo Lady Aurora's dessert today was cream cake.§!\\n\\nThe tiny people take off their protective suits and walk naked into the thicket of villi. The soft villi scrape across their skin, and the tiny people soon find that their skin begins to burn, only for the sensation to vanish like a dream.\\n\\nThe villi constantly rub their bodies, and the writhing small intestine becomes a warm cradle swaying back and forth. The tiny people feel their eyelids grow heavy, sink into sleep here, lose all awareness of the outside world, and begin a beautiful dream from which they will never wake.\\n\\nThen intestinal fluids are secreted and cover them. They are broken down without any awareness, turning into Lady Aurora's nutrients within their beautiful dreams."
  #  自从星球决案颁布之后，欧若拉大人常活动的部位被划上了禁区，而不去这些地方成了居住在身体上人们的共识。\n\n但这也让部分年轻的小人情侣，将去往这些地方视作他们发挥叛逆精神、彻底独立的彰显，同时在这幽会时，那种违背社会规则在生命边缘试探的刺激也让他们欲罢不能。\n\n为了追寻这种刺激，这对小人情侣为此来到了此处。在胸膛砰砰直跳的兴奋中这对小人结束了拥吻，眼神迷离的对视着皆有些意犹未尽，她们已经是第三次来到这里，但之前她们并未前往深处，只敢在外围，只敢在脚背上做。但这样的刺激感现在已经满足不了她们了，她们看向后方，看向如白玉般的脚背前端，五个软糯圆润的脚趾缝间的广阔空间。\n\n女孩子可爱的脚趾缝间看上去就已经很色了，如果在那里做爱只是想想就已经让这对小人面红耳赤头顶冒起蒸汽，在对视的眼神之后，她们明白了对方的意图动身前往了趾缝之间。没用太长时间她们便来到两座有小行星规模的大拇趾与第二趾的缝隙中，来到对他们而言如同乳白的大海上，这里的海面上弥散着一层令人浑身燥热，头脑冲动的淡泊足臭，而且越闻越令人上瘾，恨不得将头埋入趾窝里舔舐汗液，品尝美味的趾肉。\n\n其中一个小人遵循着内心的意愿直接扑倒了对方，用舌头蛮横的敲开对方的口腔蛮横的索取起对方的口津，另一只手也伸到了对方身下开始猛烈的抽插。他们彼此拥抱地翻滚向趾窝深处，她们并不是很担心可能的危险，毕竟前两次做的时候足趾就毫无动静。不断的翻滚中她们身上被涂抹了令人发情的足汗，涂抹上彼此的体液，头脑的昏沉让她们失去对外界的感知，只是狠狠拥抱着，恨不得与彼此融为一体。仅仅又过了一会。意外陡生，两座小行星般的肉墙向着彼此靠拢，而失去理智的小人情侣丝毫不关注彼此之外的动静，依旧机械地用手指在对方下体摆动。\n\n噗叽—— 肉墙贴合在一起，这对小人也愈发紧密地贴合在一起，最终她们如愿的与彼此融为一体，随着足趾的前后揉搓摆动，被均匀的涂平抹开。\n\n§r唔姆——§!\n\n刚刚睡醒的欧若拉，丝毫没有注意到有两个微小的存在，在小脚丫无意识的揉搓下销声匿迹。
