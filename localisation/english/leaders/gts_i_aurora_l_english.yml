  # §H这就是欧若拉大人的嘴唇上嘛，真的好柔软啊。§!\n\n一群加在一起对于欧若拉大人来说，连灰尘都不如的人，因为好奇与另一个羞耻的原因聚集在此。\n\n§H是呀是呀!§!\n\n§H连空气间都充斥满欧若拉大人齿涎的香甜气息。§!\n\n§H是呀是呀！§!\n\n这群难以被察觉的小人匍匐在地面，亲吻舔舐起甘甜柔软的唇瓣，丝毫不知有一股恐怖的能量正在汇聚。\n\n地面晃动，恐怖的吸力卷来，有许多人被气流卷起投入到嘴唇间开合的峡谷裂隙中，粘在了牙齿，舌面，甚至被吸到了更深的地方。\n\n§r啊湫§!\n\n欧若拉忍耐着鼻腔的搔痒，直到发现忍耐不下来，才控制自己小小地打了一个喷嚏。\n\n难以想象的空气喷射而出，强劲的气流撕碎了不请自来的无礼之徒，就算有命大的幸存者。却也被一同送往了星系深处开启了一场难以遗忘的星系之旅。\n\n§r应该没人看见吧？§!\n\n欧若拉天真的希望无人能注意到她失礼的打了一个喷嚏，完全忽略了自己巨大的体型是多么的显眼。
  gts_aurora.1091.desc: "§HSo this is Lady Aurora's lips... they're truly so soft.§!\n\nA group of people who, even combined, were less than specks of dust to Lady Aurora had gathered here out of curiosity and another shameful reason.\n\n§HYes, yes!§!\n\n§HEven the air is filled with the sweet fragrance of Lady Aurora's saliva.§!\n\n§HYes, yes!§!\n\nThese barely perceptible tiny people crawled upon the ground, kissing and licking the sweet, soft lips, utterly unaware that a terrifying force was gathering.\n\nThe ground trembled as an immense suction swept in. Many were caught up in the gust and plunged into the chasm between her parting lips, sticking to her teeth, the surface of her tongue, or even sucked deeper inside.\n\n§rAchoo!§!\n\nAurora endured the tickling itch in her nose until she could hold it no longer, managing only a small sneeze.\n\nAn unimaginable blast of air erupted, the violent gale tearing the uninvited, impudent visitors to shreds. Even the lucky survivors were blown deep into the galaxy, embarking on an unforgettable galactic journey.\n\n§rNo one saw that, right?§!\n\nAurora naively hoped no one had noticed her unladylike sneeze, completely oblivious to how conspicuous her colossal body actually was."
  # 在欧若拉的后庭处，被称作星系之眼的菊穴如同星系间最盛大的花朵一样，一收一展地绽放着。\n\n尽管这对于巨娘来说只是最微小、无意识的身体自然蠕动，但相对于居住在巨娘上的居民来说，依旧是壮观的奇景。\n\n一对穿戴整齐的小人正站在不断蠕动的深渊边缘，不断的拍照摆姿势。\n\n§H怎么样，这个探险地点选的不错吧？记得把我拍的英勇一点。§!\n\n他们把自己的行为当做一次大胆的鬼屋探险，这里当做了景区名地，不断的拍照纪念。\n\n但也许是小人的行为造成了影响，也许只是菊穴的收缩无意识的稍微大了一点，小人所站的位置正在舒展，向内凹陷，他们因此无法控制的向中间的深渊滑落。\n\n不过工具的齐全让小人正好停留在菊穴的入口部分。不至于掉入充斥气味的肠道中。\n\n§H哈，人类的智慧，有备无患不是…§!\n\n菊穴舒展又收缩，收紧的括约肌推着他们向那一侧会合，两堵肉墙死死贴合在一起，小人连同人类的智慧一起被紧致的菊穴碾碎了。\n\n§r感觉好痒。§!\n\n欧若拉左手按上还不够挺翘的臀部，回首观察异常的位置，不过身体的构造阻止了她，尝试无果后她放弃了。\n\n§r不过，似乎还挺舒服的。§!
  gts_aurora.1092.desc: "At Aurora's rear, the anus known as the Eye of the Galaxy blooms with each contraction and expansion like the grandest flower among the galaxies.\\\\n\\\\nAlthough to the giantess this is only the faintest unconscious natural motion of her body, to the residents living upon the giantess it remains a spectacular wonder.\\\\n\\\\nA pair of neatly dressed tiny people are standing at the edge of the constantly writhing abyss, taking photos and striking poses again and again.\\\\n\\\\n§HHow about it? Not a bad exploration spot, right? Remember to make me look heroic in the photo.§!\\\\n\\\\nThey treat their actions as a daring haunted-house expedition, regarding this place as a famous scenic site and constantly taking commemorative photos.\\\\n\\\\nBut perhaps the tiny people's actions have had an effect, or perhaps the contraction of the anus has simply become unconsciously a little stronger. The place where the tiny people stand is spreading open and sinking inward, causing them to slide uncontrollably toward the abyss in the center.\\\\n\\\\nHowever, because they are fully equipped, the tiny people happen to stop at the entrance of the anus, not quite falling into the odor-filled intestines.\\\\n\\\\n§HHa, human wisdom. Always be prepared, right...§!\\\\n\\\\nThe anus expands and then contracts again. The tightening sphincter pushes them together toward that side, and two walls of flesh press tightly against each other. The tiny people, together with human wisdom, are crushed by the tight anus.\\\\n\\\\n§rIt feels so itchy.§!\\\\n\\\\nAurora presses her left hand to her not-yet-perky-enough buttocks and looks back to observe the abnormal spot, but the structure of her body prevents her. After trying without result, she gives up.\\\\n\\\\n§rStill, it seems rather comfortable.§!"
  # 尽管欧若拉巨大的身躯始终赤裸着，但在她体内积蓄的、星球般的能量，已就为她提供了不低的热量，这也导致了她的腋下偶尔会继续起薄薄的汗液。\n\n而这充满风险又不规律、不富足的巨娘体液，自然没有被政府雇员所盯上，反而成了另一部分私人开采客的天堂，尽管这并不安全，他们也愿意付出一时的风险，来赌接下来几年无拘无束的生活。\n\n他们日常来到距离腋窝较远的地方观察是否有体液产出，他们也得偿所愿的，得到了想要的结果。\n\n欧若拉腋下已经沁出了薄薄的汗液，那一颗颗晶莹剔透的汁液，如同勾魂锁魄的糖水一般，勾引着他们的身体、精神。\n\n他们奔跑着来到了欧若拉的腋窝，甜腻浓郁的气息入侵了他们的思想，可口美味的体液摧毁了他们的意志，闷热的环境蒸腾了他们的心神。\n\n那些满眼财富的逐财客，转眼就成臣服在女孩身体主动降温时，生产的副产物下，他们跪地齐齐允吸着一颗最微小，最不起眼的一颗汗珠，并进行了最原始的色情崇拜行为。\n\n尽管这颗非常微不足道、渺小的的汗珠，也如同高山般远比这些小人巨大的很多，其中只有稀少个别的人抵抗住了诱惑，采取到了自己满足的分量，匆匆离开了此地。\n\n§r唔，好痒。§!\n\n闷热的腋下让女孩感到了搔痒，而这就是让政府国委员不想在此建设的主要原因。\n\n无法看到边际的的手指遮到了头顶，这些完全丧失了理智的小人意识不到发生了什么事，就被指头连同汗液摩擦碾碎，被指甲剐蹭到指甲缝中，混合融入到杂质中化作了污垢，等待被下一次的身体清理部队打扫清理出去。\n\n欧若拉收回了手，完全没有注意到手指间发生了什么事，这对她而言仅是一次普通的抓痒，毕竟有谁能注意到比灰尘还要渺小的存在呢？
  gts_aurora.1093.desc: "Although Aurora's enormous body is always naked, the planet-like energy accumulated inside her provides her with no small amount of heat. This also causes a thin layer of sweat to occasionally form beneath her armpits.\\\\n\\\\nThis risky, irregular, and scarce giantess body fluid has naturally not attracted government employees. Instead, it has become a paradise for another group of private prospectors. Although it is unsafe, they are willing to accept a moment of risk to gamble on several years of unrestricted life afterward.\\\\n\\\\nThey routinely come to places far from the armpit to observe whether any bodily fluid has appeared, and as they wished, they obtain the result they wanted.\\\\n\\\\nA thin layer of sweat has already seeped from Aurora's armpit. Those crystal-clear drops of liquid, like soul-snaring syrup, tempt their bodies and minds.\\\\n\\\\nThey run to Aurora's armpit. The sweet, rich scent invades their thoughts, the delicious bodily fluid destroys their will, and the sweltering environment steams their minds.\\\\n\\\\nThose wealth-chasers with riches in their eyes are, in the blink of an eye, made to submit beneath a byproduct produced when the girl's body cools itself. They kneel together and suck at one of the smallest, most inconspicuous beads of sweat, performing the most primitive act of erotic worship.\\\\n\\\\nEven this utterly insignificant, tiny bead of sweat is still like a mountain, far larger than these tiny people. Only a very small few among them resist the temptation, collect the amount that satisfies them, and hurry away from this place.\\\\n\\\\n§rMm, so itchy.§!\\\\n\\\\nThe stuffy heat beneath her armpit makes the girl feel itchy, and this is the main reason the government council does not want to build here.\\\\n\\\\nFingers whose edges cannot be seen cover the sky above. These tiny people, who have completely lost their reason, do not realize what is happening before they are rubbed and crushed together with the sweat by her fingers, scraped by her nails into the gaps beneath them, mixed into impurities and turned into grime, waiting to be cleaned away by the next body-cleaning unit.\\\\n\\\\nAurora withdraws her hand, completely unaware of what happened between her fingers. To her, this was merely an ordinary scratch. After all, who could notice existences smaller than dust?"
  # 欧若拉大人的小穴内，阴道内肉壁上布满不断蠕动、参差不齐的圆型凸起，那些凸起与彼此之间互相接触、摩擦、挤压，仅是两处凸起互相挤压时的力量就足矣毁灭行星，互相碰撞时的表面震颤起的地震，就能毁灭绝大部分想在此扎根的建筑。\n\n对于小人来说这里拥有要比恒星更宏大，比黑洞更恐怖的伟力，不过他们还是克服了这些困难，整个星球一半的体液开采工厂零散的分布在此。\n\n工厂内那些能与山岳比肩的铁锤缓缓爬升又坠下，一下下敲着软肉上，造成未比虫子强多少的微小触觉，刺激欧若拉娇柔的小穴，充满女孩味道的爱液在凸起间的裂隙中缓缓渗出，积蓄出一片爱液湖泊，专门的工作人员拿着工具收集着这些体液。\n\n炙热的肉壁蒸腾着爱液，在广阔的小穴内具有催情效果的爱液不断挥发，构造出令人血脉喷张浑身发烫的甜蜜潮湿的小穴三温暖房。\n\n一分一秒过去，尽管这些小人们有着减少影响的防护服，也有点吃不消，快要抵抗不住那种诱惑，想要全身投入到那一片爱液中。\n\n§H交班，交班。§!\n\n小人们沿着搭建好的安全道路离开，其中一位小人突然停下步伐，佝偻腰背以手抚胸，喃喃自语。\n\n§H好浓郁的味道，欧若拉大人的小穴，欧若拉大人的爱液，好想要…不想要离开这里，不想要离开欧若拉大人的爱液。§!\n\n那个小人脱下防护服，喘着粗气像发情的野兽般呼吸着空中雌性味道。\n\n§H呼…呼…好棒，还想要更多。§!\n\n小人一只手探到身下不断摆动，一边翻越安全通道投入到外面爱液软肉的淫靡中。\n\n小人投身粘稠的爱液中，让整个身体被淹没，大口吸入的爱液填满了小人的肺腔，手指不断地在下体运动，不过短短几分钟小人就已高潮数次。\n\n肉壁蠕动，两堵肉墙把小人掩埋，周围的人就这么看着对方被包裹、吞噬，他们对此已经见怪不怪，反倒有点羨慕。\n\n小人就这样窒息消逝在软肉间化作小穴里的阴垢，没有带给欧若拉哪怕一丝一毫的快感。\n\n§r唔，好舒服，小穴里的大家今天也很努力。§!\n\n欧若拉轻抚小腹，感受着体内工厂的运转，露出一个满意的微笑。
  gts_aurora.1094.desc: "Inside Lady Aurora's vagina, the inner fleshy walls are covered with constantly writhing, uneven round protrusions. Those protrusions touch, rub, and press against one another. The force of just two protrusions squeezing together is enough to destroy a planet, and the surface tremors from their collisions can destroy most buildings that try to take root here.\\\\n\\\\nTo the tiny people, this place possesses a power more magnificent than a star and more terrifying than a black hole, but they have still overcome these difficulties. Half of the entire planet's bodily-fluid extraction factories are scattered throughout this place.\\\\n\\\\nInside the factories, iron hammers that can rival mountains slowly rise and fall, striking the soft flesh again and again, producing a tiny sensation no stronger than an insect's touch and stimulating Aurora's delicate vagina. Girl-scented love fluid slowly seeps out from the cracks between the protrusions, accumulating into lakes of fluid, while specialized workers hold tools and collect these bodily fluids.\\\\n\\\\nThe scorching flesh walls steam the love fluid. Within the vast vagina, the aphrodisiac fluid continuously evaporates, forming a sweet, damp vaginal sauna that makes the blood surge and the whole body grow hot.\\\\n\\\\nSecond by second, although these tiny people wear protective suits that reduce the effects, they still find it somewhat hard to endure. They are almost unable to resist the temptation and want to throw their whole bodies into that expanse of fluid.\\\\n\\\\n§HShift change, shift change.§!\\\\n\\\\nThe tiny people leave along the constructed safe road. One of them suddenly stops, hunches over, presses a hand to their chest, and mutters to themselves.\\\\n\\\\n§HWhat a rich scent. Lady Aurora's vagina, Lady Aurora's love fluid. I want it so much... I don't want to leave this place. I don't want to leave Lady Aurora's love fluid.§!\\\\n\\\\nThat tiny person takes off their protective suit, panting heavily and breathing in the female scent in the air like a beast in heat.\\\\n\\\\n§HHah... hah... wonderful. I want more.§!\\\\n\\\\nWith one hand reaching below and moving constantly, the tiny person climbs over the safe passage and throws themselves into the obscene mixture of love fluid and soft flesh outside.\\\\n\\\\nThe tiny person plunges into the viscous fluid, letting their entire body be submerged. The love fluid they inhale in great gulps fills their lungs, while their fingers keep moving at their lower body. In only a few minutes, the tiny person has already climaxed several times.\\\\n\\\\nThe flesh walls writhe, and two walls of flesh bury the tiny person. The surrounding people simply watch as the other is wrapped up and swallowed. They have long grown accustomed to this, and are even a little envious.\\\\n\\\\nThe tiny person suffocates and vanishes between the soft flesh in this way, turning into vaginal grime without bringing Aurora even the slightest hint of pleasure.\\\\n\\\\n§rMm, that feels good. Everyone in my vagina is working hard today too.§!\\\\n\\\\nAurora gently strokes her lower abdomen, feeling the factories operating inside her, and reveals a satisfied smile."
  # \n\n§H报告，这是到目前为止所有的失踪损失人口，包括不限于被欧若拉大人的喷嚏吹飞，自制力不行迷失在小穴深处，藏入食物中被吃掉，在城区再也没回来的……§!\n\n§H到目前为止我们一共损失了上百万[Root.Owner.GetSpeciesName]，需要和欧若拉沟通协调一下吗？。§!\n\n手套的主人按揉起紧皱的眉头，望向窗外瞪大眼睛兴致勃勃观察人们工作的女孩。\n\n§H不，不用。在教育安排上新增对全民科普巨娘身体生存课程，在危险区域设立告示牌，如果还有这种情况，就当最佳化物种了。§!\n\n不久后法令颁布，此类现象大部分减少，但依旧有狂热的爱好者消失在不知何处。
  gts_aurora.1095.desc: "\\\\n\\\\n§HReport. This is the full list of missing and lost population so far, including but not limited to those blown away by Lady Aurora's sneezes, those who lacked self-control and became lost deep inside her vagina, those who hid in food and were eaten, those who went into urban districts and never returned...§!\\\\n\\\\n§HSo far we have lost over one million [Root.Owner.GetSpeciesName] in total. Do we need to communicate and coordinate with Aurora about this?.§!\\\\n\\\\nThe owner of the gloves rubs their tightly furrowed brow and looks out the window at the girl, who is watching people's work with wide-eyed fascination.\\\\n\\\\n§HNo, no need. Add public giantess-body survival courses to the education curriculum, and set up warning signs in dangerous areas. If this still happens, consider it species optimization.§!\\\\n\\\\nSoon afterward, the decree is issued. Most such incidents decline, but fanatical enthusiasts still disappear to unknown places."
