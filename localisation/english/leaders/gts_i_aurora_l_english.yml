  # 给欧若拉换衣服
  edict_gts_aurora_cloth: "Change Aurora's Clothes"
  # 给欧若拉换衣服
  edict_gts_aurora_cloth_desc: "Change Aurora's Clothes"
  # 给欧若拉换衣服
  edict_gts_aurora_cloth_description: "Change Aurora's Clothes"
  # 欧若拉
  NAME_gts_aurora: "Aurora"
  # 陷入沉睡状态的欧若拉为了方便交流而制造出的与本体一致的灵能分身，因为没有穿衣服的习惯所以经常会做出在公共场合脱衣服的举动，需要随时有人在一旁监护
  DESC_gts_aurora: "Aurora, who was in a sleeping state, created a psionic clone identical to her main body to facilitate communication. Because she does not have the habit of wearing clothes, she often takes off her clothes in public places and needs to be supervised at all times."
  # 那片湖是怎么来的啊......是我睡觉时流出的口水？！\n*脸红*我，我的睡相居然这么差吗！\n（殖民地的平均气温上升了5℃）
  gts_aurora_catch_phrase: "Where did that lake come from...... Is it saliva from when I was sleeping?!\n*Blushing* Me, is my sleeping posture really that bad!\n(The average temperature of the colony has increased by 5℃)"
  # 欧若拉
  gts_aurora.998.name: "Aurora"
  # \"我的分身对你们而言还是有些大啊......欸？这个大小就最好，唔，好吧。不过不要对我恶作剧哦，生气起来的欧若拉，会变得非常非常可怕.....可怕到三天都不会理你哦！\"\n\n\"这个分身可以随意控制我的本体，所以有任何要求就随意向我提吧。唔，虽然调整过大小，但对你们来说还是有些大啊。嗯？衣服？没关系啦，我更习惯这样子呢。\
  gts_aurora.998.desc: "\"My clone is still a bit big for you guys...... Eh? This size is best, okay then. But don't play pranks on me, Aurora when she's angry becomes very, very scary.... so scary that she won't talk to you for three days!\" \n\n\"This clone can control my main body at will, so feel free to make any requests to me. Hmm, although the size has been adjusted, it's still a bit big for you guys, isn't it? Hmm? Clothes? It's okay, I'm more used to this way.\"
  # 关于衣服的问题
  gts_aurora.998.a: "About the Clothing Problem"
  # 嗯？衣服？啊，都快忘记穿衣服是什么感觉了呢，不过大家好像也不讨厌我脱掉衣服的样子啊，不如......欸，不行吗。
  gts_aurora.998.a.response: "Hmm? Clothes? Ah, I almost forgot what it feels like to wear clothes, but everyone doesn't seem to dislike me taking off my clothes, how about...... eh, is that not okay?"
  # 巨大的原因
  gts_aurora.998.b: "The Reason for the Huge Size"
  # （欧若拉露出了些许悲伤的神情）我变成这样......是因为一个诅咒，我的国家，还有整个世界，都因为我而毁灭。不过，母后告诉过我，受诅咒的公主最终一定会得到勇者的拯救。而现在，看来我终于等到我的勇者了呢。
  gts_aurora.998.b.response: "(Aurora showed a hint of sadness) I became like this...... because of a curse, my country, and the whole world, were destroyed because of me.  But, my mother told me that a cursed princess will eventually be saved by a hero. And now, it seems I have finally waited for my hero."
  # 我们的开发是否会伤害到你？
  gts_aurora.998.c: "Will Our Development Hurt You?"
  # 没关系哦，倒不如说因为有你们帮忙清理污垢，最近感觉身体都清爽了不少呢，唔，感觉有些难为情呢...
  gts_aurora.998.c.response: "It's okay, or rather, because of your help in cleaning the dirt, my body has felt a lot more refreshed lately, um, I feel a little embarrassed..."
  # 关于哼唱的摇篮曲
  gts_aurora.998.d: "About the Lullaby You Hum"
  # 啊，那是母后大人经常唱给我听的摇篮曲，只要听着这首歌就不会做噩梦呢。没，没有打扰到大家吧？
  gts_aurora.998.d.response: "Ah, that's the lullaby that my mother often sang to me, as long as I listen to this song, I won't have nightmares. H-hasn't it disturbed everyone?"
  # 关于工作
  gts_aurora.998.e: "About Work"
  # 没关系哦，再怎么说人家曾经也是一国公主来的，一些文书工作而已，根本.....欸？刚才处理的只是昨天剩下的文件？
  gts_aurora.998.e.response: "It's okay, you know, I used to be a princess of a country, so some paperwork is nothing... Eh? Was the one I just processed just the remaining documents from yesterday?"
  # §Y欧若拉§!作为一名§H领袖§!加入了我们的帝国。
  gts_aurora.998.hire_custom_tooltip: "§YAurora§! has joined our empire as a §HLeader§!"
  # 天体级存在
  gts_trait_leader_aurora_a: "Celestial Being"
  # 盖亚星球般巨大的幼女，是无论如何都不想让人与之为敌的存在
  gts_trait_leader_aurora_a_desc: "A Gaia planet-sized young girl, she's the kind of being that no one would want to be enemies with."
  # 迷迷糊糊
  gts_trait_leader_aurora_b: "Dazed and Confused"
  # 欧若拉的本体平时除了吃就是睡，这样懒散的性格对宇宙中的其他生物来说实在是一种幸运\n§R每等级+10£food£§Y$food$§!消耗(此数值受体型特质影响)§!
  gts_trait_leader_aurora_b_desc: "Apart from eating and sleeping, Aurora's true self is usually doing nothing. This lazy personality is a blessing to the other creatures of the universe."
  # 举手之劳
  gts_trait_leader_aurora_c: "Easy Task"
  # 对天体般巨大的幼女而言，再错综复杂的地形也只是一层浮土，轻轻动手便能拂去
  gts_trait_leader_aurora_c_desc: "To a celestial-sized young girl, even the most complex terrain is nothing more than a layer of topsoil that can be brushed away with a light flick of the hand."
  # 举手之劳II
  gts_trait_leader_aurora_c_2: "Easy Task II"
  # 我们引以为傲的巨构工程对欧若拉来说就像搭积木一样简单
  gts_trait_leader_aurora_c_2_desc: "Our pride mega-structural projects are like building blocks to Aurora."
  # 举手之劳III
  gts_trait_leader_aurora_c_3: "Easy Task III"
  # 放在这里就可以了吧？欸，还要再往左两万公里？......又超了九千公里？唔....好麻烦
  gts_trait_leader_aurora_c_3_desc: "It should be fine to put it here, right?  Eh, it needs to be another 20,000 kilometers to the left? ...It's off again by 9000 kilometers? Ummm... What a bother."
  # 小公主
  gts_trait_leader_aurora_d: "Little Princess"
  # 她从未得到过与身份相符的待遇，而现在她是我们的\"小\"公主
  gts_trait_leader_aurora_d_desc: "She has never been treated according to her status, and now she is our \"little\" princess."
  # 治愈系
  gts_trait_leader_aurora_e: "Healing Type"
  # 巨大、可爱又友善的欧若拉迅速成为了国民级别的偶像，光是看着就会让人感到精力充沛
  gts_trait_leader_aurora_e_desc: "The huge, cute, and friendly Aurora has quickly become a national-level idol. Just looking at her is enough to make people feel energetic."
  # 治愈系II
  gts_trait_leader_aurora_e_2: "Healing Type II"
  # 欧若拉的超高人气带动了各种商业活动的蓬勃发展，其中最火热的周边\"欧若拉大人1:1亿公仔\"更是在一夜之间炒出了天价
  gts_trait_leader_aurora_e_2_desc: "Aurora's high popularity has driven the vigorous development of various commercial activities, and the hottest merchandise, the \"Aurora-sama 1:100 million scale figurine\", has been sold for a sky-high price overnight."
  # 治愈系III
  gts_trait_leader_aurora_e_3: "Healing Type III"
  # 欧若拉的影响力已经扩散到了宇宙中的其他星系，是时候让全宇宙的智慧物种都感受欧若拉大人的魅力了
  gts_trait_leader_aurora_e_3_desc: "Aurora's influence has spread to other star systems in the universe, and it's time to let all sentient species in the universe feel the charm of Aurora-sama."
  # 暴露癖
  gts_trait_leader_aurora_f: "Exhibitionist"
  # 因为长期裸体的缘故，欧若拉对衣服的概念已经消失，导致经常赤身裸体地出现在各种场合，执法部门与公关为了平息犯迷糊的欧若拉带来的不良影响不得不经常彻夜加班
  gts_trait_leader_aurora_f_desc: "Due to being naked for a long time, Aurora has lost the concept of clothes, which often leads to her appearing naked on various occasions. Law enforcement and public relations departments have to work overtime frequently to quell the adverse effects caused by Aurora's confusion."
  # 无形威压
  gts_trait_leader_aurora_g: "Formless Pressure"
  # 行星级巨大娘与渺小生命之间那令人绝望的体型差带来的是绝对的压迫感
  gts_trait_leader_aurora_g_desc: "The despairing size difference between a planetary-sized giantess and minor life creates an absolute sense of oppression."
  # 宜居体质
  gts_trait_leader_aurora_h: "Habitable Body"
  # 巨大萝莉恒定的体温产生了稳定的气候环境，一滴富含矿物质的汗液就能供给整个殖民地一周的饮用水，分泌的污垢可以用作耕地或矿物，欧若拉的身体宛如一座永不枯竭的天堂\n§G会根据居住在身上的小人人口数生产资源§!\n§G每100个人口提供：0.01£gts_micro_city£§Y$gts_micro_city$§!、0.1£gts_micro£§Y$gts_micro$§!、0.5£gts_giantess_fluid£§Y$gts_giantess_fluid$§!§!
  gts_trait_leader_aurora_h_desc: "The giant loli's constant body temperature produces a stable climatic environment. Just one drop of her mineral-rich sweat can provide an entire colony with a week's worth of drinking water.  Her excreted filth can be used as arable land or minerals. Aurora's body is like an endless paradise."
  # 沉睡的行星
  gtsra_sleep_loli: "Sleeping Planet"
  # 这颗星球的地下传来了十分不寻常的反应，这颗星球似乎，是活着的？
  gtsra_sleep_loli_desc: "There are very unusual reactions coming from the underground of this planet. It seems that this planet... is alive?"
  # 唤醒
  GTSRA_AWAKE_LOLI_SCI: "Awaken"
  # 扫描器传回的数据显示，这颗星球的地表下很有可能存在某种巨型生命体，不过目前来看这个巨型生物还处在睡眠之中，我们的科学家认为这或许是研究恒星级巨娘的重要线索，但也有部分人士认为这只沉睡的行星级生物会是一个巨大的威胁\n\n无论如何，这都能加强我们对巨大生物的理解，批准研究
  GTSRA_AWAKE_LOLI_SCI_DESC: "Data from the scanner shows that there is a very likely chance of a giant lifeform existing beneath the surface of this planet. However, for now, this giant creature appears to be sleeping. Our scientists believe that this might be an important clue for the study of star-level giantesses, but some also believe that this sleeping planetary creature could be a huge threat.\n\nRegardless, this could enhance our understanding of giant creatures. Authorize the study."
  # 灭绝
  GTSRA_AWAKE_LOLI_MIL: "Extinction"
  # 扫描器传回的数据显示，这颗星球的地表下很有可能存在某种巨型生命体，不过目前来看这个巨型生物还处在睡眠之中，我们的科学家认为这或许是研究恒星级巨娘的重要线索，但也有部分人士认为这只沉睡的行星级生物会是一个巨大的威胁\n\n天体般巨大的生物太危险了！我们不能冒这样的风险，摧毁这颗星球！
  GTSRA_AWAKE_LOLI_MIL_DESC: "Data from the scanner shows that there is a very likely chance of a giant lifeform existing beneath the surface of this planet. However, for now, this giant creature appears to be sleeping. Our scientists believe that this might be an important clue for the study of star-level giantesses, but some also believe that this sleeping planetary creature could be a huge threat.\n\nIt's too risky to have a celestial-sized creature! We cannot take such a risk, destroy this planet!"
  # 垃圾中的线索
  gts_aurora.1020.name: "Clues in the Debris"
  # 这颗星球似乎有巨大的引力，四周的轨道内吸引了许多宇宙残骸，或许我们可以从这些碎片入手？
  gts_aurora.1020.desc: "This planet seems to have a strong gravitational pull, attracting a lot of space debris into its orbit. Perhaps we can start by examining these fragments?"
  # 批准，进行探索。
  gts_aurora.1020.a: "Approve, begin the exploration."
  # 我们没有必要在垃圾上浪费时间。
  gts_aurora.1020.b: "We have no need to waste time on garbage."
  # 神秘裂缝
  gts_aurora.1021.name: "Mysterious Fissures"
  # 这座星球的地表上有很多条巨大的裂缝，有些甚至深至核心层，有科学家建议派出探测器，深入地下进行探索。
  gts_aurora.1021.desc: "There are many giant fissures on the surface of this planet, some even reaching deep into the core. Some scientists suggest sending down probes to explore deep underground."
  # 批准，派出探测器。
  gts_aurora.1021.a: "Approve, send down the probes."
  # 我们没有必要在泥巴上浪费时间。
  gts_aurora.1021.b: "We have no need to waste time in the mud."
  # 弱点侦查
  gts_aurora.1022.name: "Weakness Reconnaissance"
  # 通过调查科研船调查时上传的数据，我们可以推断出这只巨型生物的大致身体特征和弱点，一些海军将领建议我们提前做好准备，以备不时之需。
  gts_aurora.1022.desc: "By investigating the data uploaded from the science ships' scans, we can deduce the approximate physical characteristics and weaknesses of the giant creature. Some naval commanders suggest that we prepare in advance, just in case."
  # 批准，立即开始训练。
  gts_aurora.1022.a: "Approve, begin training immediately."
  # 我们没有激怒它的打算。
  gts_aurora.1022.b: "We have no intention of provoking it."
  # 鼓鼓的小肚子
  gts_aurora.1023.name: "A Full Little Tummy"
  # 可爱的欧若拉终于吃饱了，肚皮上的居民再也不用担心那震耳欲聋的咕咕叫了，取而代之的是轻柔的肠鸣，大家终于可以睡个好觉了！
  gts_aurora.1023.desc: "The adorable Aurora has finally eaten her fill. The inhabitants on her tummy no longer have to worry about that deafening rumbling sound. Instead, there are soft stomach gurgles. Everyone can finally get a good night's sleep!"
  #  可喜可贺。但不知道，她什么时候又会饿了......
  gts_aurora.1023.a: "Congratulations. But I wonder... when will she be hungry again?"
  # 扁扁的小肚子
  gts_aurora.1024.name: "A Flat Little Tummy"
  # 可爱的欧若拉又饿了，现在那软软的肚皮的巨大下的巨大胃囊开始骚动起来，不时地发出震耳欲聋的咕咕叫。大家抱怨道只能带着耳塞才能睡个好觉了！
  gts_aurora.1024.desc: "The adorable Aurora is hungry again, and now the huge stomach under her soft belly begins to stir, emitting deafening rumbling noises from time to time. Everyone complained that they can only get a good sleep with earplugs!"
  # 迅速准备好食物！
  gts_aurora.1024.a: "Quickly prepare some food!"
  # 摇篮曲
  gts_aurora.1025.name: "Lullaby"
  # *哈欠*呜啊~~~ 吃饱后好困啊，晚安~
  gts_aurora.1025.desc: "*Yawn* Uwaaa~~~ I'm so sleepy after eating, goodnight~"
  # 睡着了！？
  gts_aurora.1025.a: "She fell asleep!?"
  # 摇篮曲
  gts_aurora.1026.name: "Lullaby"
  # 欧若拉慢慢的沉入了梦乡后，慢慢哼唱出了一首美妙动听的摇篮曲，身上的居民无不被少女的梦呓所打动。时断时续的动人旋律与幼女诱人的躯体让居民们感觉身处天堂。
  gts_aurora.1026.desc: "After slowly drifting into sleep, Aurora begins to hum a beautiful lullaby. The inhabitants on her body are all moved by the girl's sleepy mutterings. The intermittent, moving melody and the alluring body of the young girl give the inhabitants a feeling of being in paradise."
  # 好耶
  gts_aurora.1026.a: "Nice."
  # 欧若拉梦游小人国
  gts_aurora.1027.name: "Aurora Sleepwalks into Lilliput"
  # 距欧若拉陷入沉睡已经过去了一个月，就在我们苦恼如何如睡着的她沟通时，欧若拉的巨大分身突然出现在了我们的总督府，而且居然一丝不挂！
  gts_aurora.1027.desc: "A month has passed since Aurora fell asleep. Just as we were struggling to figure out how to communicate with her while she was asleep, Aurora's giant clone suddenly appeared in our Governor's office, and she was completely naked!"
  # 快把衣服穿上！
  gts_aurora.1027.a: "Get some clothes on, quick!"
  # 沉睡的泰坦
  gts_aurora.1029.name: "Sleeping Titan"
  # 扫描器传回的数据显示，这颗星球的地表下很有可能存在某种巨型生命体，不过目前来看这个巨型生物还处在睡眠之中，我们的科学家认为这或许是研究恒星级巨娘的重要线索，但也有部分人士认为这只沉睡的行星级生物会是一个巨大的威胁，我们应该.....
  gts_aurora.1029.desc: "Data from the scanner shows that there is a very likely chance of a giant lifeform existing beneath the surface of this planet. However, for now, this giant creature appears to be sleeping. Our scientists believe that this might be an important clue for the study of star-level giantesses, but some also believe that this sleeping planetary creature could be a huge threat. We should..."
  # 无论如何，这都能加强我们对巨大生物的理解
  gts_aurora.1029.a: "Regardless, this could enhance our understanding of giant creatures."
  # 起床气
  gts_aurora.1030.name: "Waking Up Grumpy"
  # 研究发现，这只巨型生物正处于原因不明的深度睡眠状态。我们的科学家记录下了这只巨型生物的脑电波频率，并制作出了可以将其缓缓唤醒的电磁频率。通过在星球表面及轨道上布置的信号放大装置进行播放，而且效果拔群，这只行星级巨物马上就要苏醒了！
  gts_aurora.1030.desc: "Research has found that this giant creature is in a deep sleep of unknown cause. Our scientists recorded the brainwave frequency of the giant creature and created an electromagnetic frequency that can slowly wake it up. By broadcasting it through the signal amplification devices placed on the planet's surface and orbit, it had an excellent effect, and this planetary-sized giant is about to wake up soon!"
  # 快回避！
  gts_aurora.1030.a: "Evacuate now!"
  # 巨大萝莉
  gts_aurora.1031.name: "Giant Loli"
  # 随着地底下巨物的活动，这颗行星随即分崩离析，而从这颗星球中出现的巨大身影居然是......一只巨大的萝莉？
  gts_aurora.1031.desc: "With the activity of the giant creature underground, the planet immediately disintegrated, and the giant figure that emerged from this planet was actually... a giant loli?"
  # 真是有趣
  gts_aurora.1031.a: "How very interesting."
  # 泰坦萝莉
  gts_aurora.1032.name: "Titan Loli"
  # 这只超巨大萝莉的表情并不是很高兴，看来她对于从被睡梦中叫醒这件事很不满意。而几乎是一瞬间，她便看向了我们的科研船所在位置，然后，她伸出了一只\"纤纤玉手\"，飞船甚至还为来得及加速就被那只\"小手\"产生的重力所捕获，我们只能看着飞船无助的被捏在了双指之间，看着那巨大到令人目眩的指纹峡谷慢慢闭合。就当所有人都以为要英勇就义时，手指的动作突然停了下来，紧接着一股强大到差点烧毁通讯接收器的灵能信号便接入了进来。
  gts_aurora.1032.desc: "This super giant loli doesn't look very happy; she seems very dissatisfied with being woken up from her slumber. And almost in an instant, she looked towards the location of our science ship, and then, she stretched out a \"delicate hand.\" The ship didn't even have time to accelerate before being captured by the gravity produced by her \"small hand.\" We could only watch helplessly as the ship was pinched between two fingers, watching the dizzying, giant fingerprint valleys slowly close. Just when everyone thought they were about to valiantly sacrifice themselves, the movement of her fingers suddenly stopped. Then a psionic signal, so powerful it almost burned out the communication receiver, was sent to us."
  # 女神显灵了？
  gts_aurora.1032.a: "Has the goddess manifested?"
  # 泰坦萝莉
  gts_aurora.1033.name: "Titan Loli"
  # \"就是你们叫醒人家的？\
  gts_aurora.1033.desc: "\"Was it you guys who woke me up?\"
  # 没错
  gts_aurora.1033.a: "That's right."
  # 泰坦萝莉
  gts_aurora.1034.name: "Titan Loli"
  # \"唔姆姆姆，居然如此大胆，那想必你们也知道后果会是什么吧。\
  gts_aurora.1034.desc: "\"Hmph~, you are so bold, then you probably know what the consequences will be.\"
  # 别以为块头大一点就能吓倒我们，放马过来吧
  gts_aurora.1034.a: "Don't think a big size can scare us, bring it on!"
  # 请冷静，我们没有恶意
  gts_aurora.1034.b: "Please calm down, we meant no harm."
  # 泰坦萝莉
  gts_aurora.1035.name: "Titan Loli"
  # \"哼(▼ヘ▼#)！别以为这样说我就会原谅你们，准备好面对（咕~ ~ ~ ~ ~ ~ ~！）\"\n\n*一阵雷鸣般的声音从巨大幼女的腹部传来*\n\n\"（涨红了脸）呜啊......\
  gts_aurora.1035.desc: "\"Hmph(▼ヘ▼#)! Don't think I will forgive you by just saying that, be prepared to face (Grumble~ ~ ~ ~ ~ ~ !) \n\n *A thunderous sound came from the giant girl's abdomen* \n\n \"(Face flushed) Uwa......\"
  # 呃，请问您需要帮助吗
  gts_aurora.1035.a: "Um, do you need help?"
  # 发出了很不得了的声音呢~
  gts_aurora.1035.b: "That was quite the sound~"
  # 泰坦萝莉
  gts_aurora.1036.name: "Titan Loli"
  # \"唔...那个...原谅你们也不是不行，只，只要给我点吃的就可以了....人家已经很久没吃过东西了QAQ \
  gts_aurora.1036.desc: "\"Ummm...well... it's not impossible to forgive you, as lo, as long as you give me something to eat... I haven't eaten anything for a long time QAQ.\"
  # 好的哦（宠溺）食物-1000
  gts_aurora.1036.a: "Okay~ (doting) Food -1000"
  # 对不起，我们暂时无法提供数目如此庞大的食物
  gts_aurora.1036.b: "I am sorry, we are unable to provide that large amount of food for the time being."
  # 泰坦萝莉
  gts_aurora.1037.name: "Titan Loli"
  # \"呜啊————好饿啊\
  gts_aurora.1037.desc: "\"Uwaaaahhhhh-  I'M SO HUNGRY\"
  # 好的哦（宠溺）食物-1000
  gts_aurora.1037.a: "Okay~ (doting) Food -1000"
  # 对不起，我们暂时无法提供数目如此庞大的食物
  gts_aurora.1037.b: "I am sorry, we are unable to provide that large amount of food for the time being."
  # 泰坦萝莉
  gts_aurora.1038.name: "Titan Loli"
  # \"这，这是什么！？好美味！比那些小行星矮行星好吃了几百万倍！*抹嘴* 呼嗯，很好，你们这些小家伙们还挺能干的嘛，那么为了表示感谢，就特别允许你们在我身上居住吧\"\n\n\"那么常联系哦，小家伙们~\
  gts_aurora.1038.desc: "\"W-What is this!? It's so delicious! It's a million times better than those small asteroids and dwarf planets! *Wipes mouth* Hmm, very good, you little guys are quite capable, so as a token of my gratitude, I will specially allow you to live on my body.\"\n\n\"Keep in contact, little ones~\"
  # 萝莉赛高！
  gts_aurora.1038.a: "Lolis are the best!"
  # 消灭威胁
  gts_aurora.1039.name: "Eliminate the Threat"
  # 根据扫描结果，我们标记了几个疑似为这个巨型生物要害的部位，并对这几个部位进行了专门的定向爆破，整颗星球因此被炸的四分五裂。
  gts_aurora.1039.desc: "Based on the scan results, we have marked several areas that appear to be the vital parts of this giant creature and carried out specialized directional blasts on those areas. As a result, the entire planet was blown to pieces."
  # 干得好！
  gts_aurora.1039.a: "Well done!"
  # 起床气
  gts_aurora.1040.name: "Waking Up Grumpy"
  # 我们错了，我们的炸弹并没有杀死那只怪物，那颗星球也并不是被炸弹破坏掉的，而是那个巨型生物的苏醒造成的！而那只巨型生物居然长着一副人类幼女的样子，她的表情看来十分愤怒，一场大战在所难免....
  gts_aurora.1040.desc: "We were wrong. Our bombs did not kill that monster, and it was not the bombs that destroyed the planet, but the awakening of that giant creature! And that giant creature even looks like a human girl. Her expression looks extremely angry. A major battle is inevitable..."
  # 单位进入最高戒备状态！
  gts_aurora.1040.a: "All units, go to maximum alert!"
  # 起床气
  gts_aurora.1041.name: "Waking Up Grumpy"
  # 一股强大灵能信号席卷了整个恒星系，让我们的接收器一度陷入瘫痪，经过调整后我们终于收到了来自巨大幼女的通讯
  gts_aurora.1041.desc: "A powerful psionic signal swept across the entire star system, temporarily paralyzing our receivers. After adjustments, we finally received a transmission from the giant girl."
  # 接入通信画面
  gts_aurora.1041.a: "Patch to the communication screen."
  # 起床气
  gts_aurora.1042.name: "Waking Up Grumpy"
  # \"唔姆姆姆，虽然不知道你们的目的，但人家可不是什么星球！不能给你们测试武器用！人家现在很生气！\
  gts_aurora.1042.desc: "\"Hrmmm, Although I don't know what your purpose is, I am not a planet! I'm not for you to test weapons on! I'm very angry right now!\"
  # 正合我意，决一死战吧，怪物！
  gts_aurora.1042.a: "Perfect, let's have a final showdown, monster!"
  # 你会成为很好的靶子！
  gts_aurora.1042.b: "You will make a great target!"
  # 泰坦萝莉被击败
  gts_aurora.1043.name: "Titan Loli is Defeated"
  # \"唔....肚子好饿，好痛....为什么....大家都讨厌我.....\
  gts_aurora.1043.desc: "\"Ugh... I'm so hungry, and it hurts... Why... does everyone hate me...\"
  # 控制住她，把她变成我们的殖民地！
  gts_aurora.1043.a: "Take control of her and turn her into our colony!"
  # 挣脱
  gts_aurora.1050.name: "Break Free"
  # 不知为何，这只巨大萝莉体内的灵能反应突然大幅增强，强大的灵能波动袭击了巨娘体内的各处殖民地，并制造出了与她本人形象一致的灵能投影，如果我们不尽快采取措施，这些投影很快就会进入到物理世界并破坏掉拘束装置。
  gts_aurora.1050.desc: "For some reason, the psionic reaction within this giant loli suddenly increased dramatically. The powerful psionic fluctuations attacked various colonies within her giant body and created psionic projections that looked identical to her. If we do not take action quickly, these projections will soon enter the physical world and destroy the restraining devices."
  # 尽全力压制住她！
  gts_aurora.1050.a: "Suppress her with all our might!"
  # 短时麻醉
  gts_aurora.1051.name: "Short-Term Anesthesia"
  # 我们透过让拘束装置超频运转的方式暂时压制住了这股灵能波动，但这只是暂时的，无论我们如何加大功率，能量的波动依然存在。我们的科学家认为拘束装置只能控制住巨娘身体的活动，要想彻底解决问题，就要将脑部的活动也一并控制住。
  gts_aurora.1051.desc: "We have temporarily suppressed the psionic fluctuations by overloading the restraints, but this is only temporary.  No matter how much we increase the power, the energy fluctuations still exist.  Our scientists believe that the restraints can only control the activity of the giantess's body. To fully solve the problem, we must also control the activity of her brain."
  # 奴仆不需要有自己的思想，把她彻底洗脑！
  gts_aurora.1051.a: "Slaves do not need their own thoughts, let's completely brainwash her!"
  # 绝对服从
  gts_aurora.1052.name: "Absolute Obedience"
  # 随着强力脑控装置的启动，萝莉那庞大躯体中的每一根神经现在都由我们掌控，而她最后的反抗不过是几滴眼泪与一声尖叫而已，我们将征服一切！
  gts_aurora.1052.desc: "With the activation of the powerful mind-control device, every nerve in the loli's gigantic body is now under our control, and her last resistance is nothing more than a few tears and a scream. We shall conquer everything!"
  # 太棒了！
  gts_aurora.1052.a: "Excellent!"
  # 挣脱
  gts_aurora.1053.name: "Break Free"
  # 一切都太迟了，我们没能阻止她的反抗，现在能做的只有祈祷并静候事态的发展。
  gts_aurora.1053.desc: "It's too late. We failed to stop her resistance. Now, all we can do is pray and wait for developments."
  # 我们只能自求多福了
  gts_aurora.1053.a: "We can only rely on ourselves now."
  # 无声离去
  gts_aurora.1054.name: "Silent Departure"
  # 缚解开了，强大的灵能蔓延到了整个恒星系的角落，但想象中的灵能冲击却并未到来，只有一阵略显哀伤的歌曲在星系内回响，在歌声结束后，只是一眨眼的时间，那名行星般巨大的幼女便凭空消失了，就像她从未来过一样。万幸的是，我们的殖民者们全都被传送到了首都上并且对殖民到萝莉身上的事情毫无印象。
  gts_aurora.1054.desc: "The shackles are broken, and powerful psionic energy spread throughout the entire star system, but the psionic shock we expected did not come. Only a slightly sorrowful tune echoed within the star system. At the end of the song, in the blink of an eye, the planetary-sized young girl disappeared into thin air, like she was never there.  Fortunately, all of our colonists were transported to the capital and had no recollection of colonizing on the loli."
  # 此事就此作罢，将档案永久封入数据库。
  gts_aurora.1054.a: "Let this matter be dropped and seal the file in the database permanently."
  # 不再有梦
  gts_aurora.1055.name: "No More Dreams"
  # 在成功控制住这只巨大的幼女后，我们对其身体的研究得以继续进行。我们进一步研究发现，她的大脑中储存着来源不明的各种远古先进文明的知识，有的甚至比堕落帝国还要古老，为了更好的进行研究并防止类似的挣脱事故再次发生，我们决定将其主体意识剥离出来并放置到我们制造的小型克隆体中，再用干扰装置隔断其与本体的联系，这样一个永远不会失控的人型超算就会一直为我们服务。
  gts_aurora.1055.desc: "After successfully controlling this giant young girl, our research on her body can continue. We further research and found that her brain contains unknown knowledge from various ancient advanced civilizations, some even older than the Fallen Empires. In order to better conduct research and prevent similar break-free incidents from happening again, we decided to strip her main consciousness and put it into a small clone we created. Then use a jamming device to sever her connection with the main body. Such a humanoid supercomputer that will never be out of control will always serve us."
  # 马上动手！
  gts_aurora.1055.a: "Do it immediately!"
  # 沉睡的泰坦
  gtsra_situation_giga_loli: "Sleeping Titan"
  # 沉睡的泰坦
  gtsra_situation_giga_loli_type: "Sleeping Titan"
  # 无论如何，这只沉睡的巨型生物或多或少都是一个不容忽视的威胁，谁也无法预料到这只沉睡的行星级生物什么时候会醒来，我们必须尽快做出决定。
  gtsra_situation_giga_loli_desc: "In any case, this sleeping giant creature is more or less a threat that cannot be ignored. No one can predict when this sleeping planetary creature will wake up, we must make a decision as soon as possible."
  # 我们的舰队正在准备作战计划
  stage_gtsra_giga_loli_1_tooltip: "Our fleets are preparing a battle plan."
  # 目前，对于这个巨大的存在我们还一筹莫展
  stage_gtsra_giga_loli_2_tooltip: "Currently, we are at a loss on how to deal with this giant being."
  # 我们正在进一步调查这只沉睡的泰坦
  stage_gtsra_giga_loli_3_tooltip: "We are further investigating this sleeping titan."
  # 深入调查
  gtsra_giga_loli_completed: "Investigate Deeply"
  # 消除威胁
  gtsra_giga_loli_fail: "Eliminate Threat"
  # 进行研究
  gtsra_giga_loli_research: "Conduct Research"
  # 无论如何，这都能加强我们对行星级生物的理解，批准研究。
  gtsra_giga_loli_research_effect: "Regardless, this will enhance our understanding of planetary-level creatures. Approve the research."
  # 有限观察
  gtsra_giga_loli_observe: "Limited Observation"
  # 因为行星级生物对我们来说过于危险，我们最好动用全部力量进行防御，进行远距离的被动观察。
  gtsra_giga_loli_observe_effect: "Because planetary-level creatures are too dangerous for us, it is best that we use all our strength for defense and conduct passive observation from a long distance."
  # 准备消灭
  gtsra_giga_loli_neutralize: "Prepare to Eliminate"
  # 天体般巨大的生物太危险了！我们不能冒这样的风险，必须摧毁这颗星球！
  gtsra_giga_loli_neutralize_effect: "Celestial-sized creatures are too dangerous! We cannot take such a risk, this planet must be destroyed!"
  # 萝莉
  NAME_gtsra_giga_loli: "Loli"
  # 萝莉
  NAME_gtsra_giga_slave_body: "Loli"
  # 巨型生物
  NAME_gtsra_titans: "Giant Creature"
  # 天体级巨娘
  loliship: "Celestial Giantess"
  # 她的身躯甚至比我们的星球还要巨大...
  loliship_plural: "Her body is even larger than our planets..."
  # 天体级巨娘
  NAME_loliship: "Celestial Giantess"
  # 萝莉圣躯
  NAME_gtsra_giga_loli_body: "Loli Holy Body"
  # 肉体俘虏
  NAME_gtsra_giga_salve_body: "Flesh Captive"
  # 欧若拉
  pc_gtsra_loli: "Loli Holy Body"
  # 建立在行星级巨娘身上的殖民地，可爱的欧若拉大方的允许我们随意开采她身上的资源，她似乎很高兴看到自己的身上这一派欣欣向荣的景象
  pc_gtsra_loli_desc: "A colony established on the body of a planetary-sized giantess. The adorable titan loli generously allows us to freely exploit her resources. She seems very happy to see this thriving scene on her body."
  # 肉体俘虏
  pc_gtsra_loli_slave: "Flesh Captive"
  # 通过巨型脑控装置与无数埋藏在其体内的植入体，我们彻底控制住了这只巨娘，现在她身上的资源将任我们开采，无论她是否愿意。
  pc_gtsra_loli_slave_desc: "Through a giant mind-control device and countless implants buried within her body, we have completely controlled this giantess. Now, the resources on her body will be exploited by us, whether she wants them to be or not."
  # \"大家都很可爱哦\
  r_giga_loli_kawai: "\"Everyone is so cute~\"
  # 还有什么事情能比住在一个可爱的巨大萝莉身上更美好呢？
  r_giga_loli_kawai_desc: "What could be better than living on a cute giant loli?"
  # \"贪吃鬼\
  r_giga_loli_eat: "\"Glutton\"
  # \"今天的美食是什么呢？\
  r_giga_loli_eat_desc: "\"What will the delicious food be today?\"
  # 鼓鼓的小肚子
  r_giga_loli_full: "A Full Little Tummy"
  # 可爱的欧若拉终于吃饱了，肚皮上的居民再也不用担心那震耳欲聋的咕咕叫了，取而代之的是轻柔的肠鸣，大家终于可以睡个好觉了！
  r_giga_loli_full_desc: "The adorable Aurora has finally eaten her fill. The inhabitants on her tummy no longer have to worry about that deafening rumbling sound. Instead, there are soft stomach gurgles. Everyone can finally get a good night's sleep!"
  # 梦幻旋律
  r_giga_loli_melody: "Dreamlike Melody"
  # \"这是我还没有变成这样时，母后常唱给我听的歌\
  r_giga_loli_melody_desc: "\"This is the song my mother often sang to me before I became like this.\"
  # 上课时间
  d_gtsra_giga_loli_archive_unexploit: "Class Time"
  # 欧若拉的身世似乎相当不简单，在宇宙中游历（睡觉）的漫长岁月里，她见识过不少奇怪的东西，或许我们可以请求独具慧眼的她指导我们的研发项目。
  d_gtsra_giga_loli_archive_unexploit_desc: "Aurora's background seems quite complex. During her long years of traveling (sleeping) in the universe, she has witnessed many strange things. Perhaps we can ask for her insightful guidance on our research projects."
  # 前往圣地
  d_gtsra_giga_loli_pussy_unexploit: "Journey to the Holy Land"
  # 漆黑一片的巨大肉腔，四处弥漫着温热的雾气。这是欧若拉身躯最柔软、神秘的地方，为了防止在欧若拉体内迷失方向，每次探索我们都需要集结一只武装到牙齿的科研团队。经过科学家不断探查，我们似乎可以利用机器收集到一些稀有资源，但具体是什么还有待考究。
  d_gtsra_giga_loli_pussy_unexploit_desc: "A huge dark fleshy cavity, filled with warm mist. This is the softest and most mysterious place in Aurora's body. In order to prevent us from getting lost within Aurora's body, each exploration requires us to gather a research team armed to the teeth. After continuous exploration, our scientists believe we can use machinery to collect some rare resources, but what exactly remains to be investigated."
  # 深入洞窟
  d_gtsra_giga_loli_hole_unexploit: "Deep into the Cave"
  # 尽管欧若拉允许我们随意开采她身上的资源，但进入巨大萝莉的体内置立生产基地依旧十分危险，我们还需要对工作人员进行充分的培训和心理建设，来保护我方人员的安全和欧若拉的健康。
  d_gtsra_giga_loli_hole_unexploit_desc: "Although Aurora allows us to freely exploit her resources, it is still very dangerous to establish a production base inside the giant loli's body. We still need to provide sufficient training and psychological preparation for our staff to protect their safety and Aurora's health."
  # 填不满的小肚子
  d_gtsra_giga_loli_hungry: "A Bottomless Tummy"
  # 欧若拉的胃口可相当大，无论她是清醒还是熟睡状态，那巨大的身躯都需要大量食物才能填满，我们需要定期投喂这只可爱的萝莉来保证她的健康。
  d_gtsra_giga_loli_hungry_desc: "Aurora has quite an appetite. Whether she is awake or sleeping, her huge body requires a lot of food to be filled. We need to regularly feed this adorable loli to ensure her health."
  # 腹部大平原
  d_gtsra_giga_loli_abdomen: "Abdominal Plains"
  # \"一起一伏的是不是很好玩啊~\
  d_gtsra_giga_loli_abdomen_desc: "\"Isn't it fun to go up and down~?\"
  # 幼嫩玉足
  d_gtsra_giga_loli_feet: "Tender Jade Feet"
  # 表面光滑的\"小脚丫\"上藏匿着无数高质量矿脉
  d_gtsra_giga_loli_feet_desc: "Countless high-quality mineral veins are hidden on the smooth surface of her \"little feet\"."
  # 超级数据库
  d_gtsra_giga_loli_archive: "Super Database"
  # \"人家的知识很渊博的哦！\
  d_gtsra_giga_loli_archive_desc: "\"My knowledge is vast!\"
  # 胸部大平原
  d_gtsra_giga_loli_chest: "Chest Plains"
  # \"唔姆姆姆，还会发育的!\
  d_gtsra_giga_loli_chest_desc: "\"Hrmmm, they're still growing!\"
  # 秘密花园
  d_gtsra_giga_loli_pussy: "Secret Garden"
  # \"请，请轻一点，不要弄疼人家\
  d_gtsra_giga_loli_pussy_desc: "\"P-please, be gentle, don't hurt me.\"
  # 深邃洞穴
  d_gtsra_giga_loli_hole: "Deep Cave"
  # 唔，痒痒的...\
  d_gtsra_giga_loli_hole_desc: "\"Ugh, that tickles...\"
  # 腋窝湿地
  d_gtsra_giga_loli_armpit: "Armpit Wetlands"
  # \"注意不要被热晕过去哦\
  d_gtsra_giga_loli_armpit_desc: "\"Be careful not to overheat and pass out.\"
  # 沉睡
  NAME_Aurora_system: "Slumber"
  # 玛琳菲森
  NAME_Aurora_Prime: "Maleficent"
  # 注定的毁灭
  aurora_digsite: "Destined Destruction"
  # 初步勘察显示，这颗星球上的文明在一场全球性的战争中毁灭，对于前超光速土著文明而言此事平平无奇，但这颗星球上有着数量众多的稀有文物，因此我们应成立专门的考古项目并进行有计划的发掘。
  aurora_digsite_desc: "Preliminary surveys show that the civilization on this planet was destroyed in a global war. This is nothing unusual for pre-FTL native civilizations, but this planet has a significant number of rare artifacts, therefore we should establish a dedicated archaeological project and conduct a planned excavation."
  # 与世隔绝
  gts_aurora.1000.name: "Secluded from the World"
  # 在最近一次的星际巡查中，我们的科学家发现了一个此前从未在地图上标出的星系，随后我们发现这个星系没有任何相连通的超空间航道，或许这就是没有地图标注的原因，尽管从扫描结果来看此星系并没有任何异常之处，我们的许多科学家仍然对此产生了浓厚的兴趣
  gts_aurora.1000.desc: "During a recent interstellar patrol, our scientists discovered a star system not previously marked on any maps. Subsequently, we discovered that this star system has no connection to any hyperspace lanes. Perhaps this is the reason why it wasn't marked on the maps. Although from the scan results, this star system does not seem to have any anomalies, many of our scientists have developed a strong interest in it."
  # 那就让她们去研究吧
  gts_aurora.1000.a: "Then let them study it."
  # 非原生物种
  gts_aurora.1001.name: "Non-Native Species"
  # 发掘过程中我们发现了一些关于这颗星球前文明物种的史料，奇怪的是，这些史料记载的内容与这颗星球的进化过程有着明显的不协调感，似乎这些智慧物种是突然出现到这颗星球上的，但这些土著的科技水平很明显没有达到能进行星际殖民的程度。
  gts_aurora.1001.desc: "During the excavation process, we found some historical documents regarding the previous civilization's species on this planet. Strangely, the content recorded in these documents does not coincide with the planet's evolutionary process. It seems that these sentient species suddenly appeared on this planet, but the technological level of these natives was clearly not advanced enough to conduct interstellar colonization."
  # 有趣，别管那些文物了，全力调查这件事情
  gts_aurora.1001.a: "Interesting, forget about the artifacts, investigate this matter thoroughly."
  # 女巫狩猎
  gts_aurora.1002.name: "Witch Hunt"
  # 通过进一步的调查，我们发现这个智慧物种天生就觉醒了一定的灵能潜力，但他们没有任何一项与灵能有关的技术。在我们后续发现的更多史料中，我们发现这个物种出于某些原因对灵能十分的忌惮，有着极端得禁止灵能的文化氛围，甚至还出现过将灵能力较强个体集中进行处决的现象，这或许与这个物种来到这颗星球的原因有关。
  gts_aurora.1002.desc: "Through further investigation, we discovered that this sentient species was born with a certain degree of psionic potential, but they do not have any technology related to psionics. In more historical documents we found later, we discovered this species, for some reason, were extremely wary of psionics, with an extreme culture that forbids psionics. There were even cases of concentrating individuals with strong psionic abilities for execution. Perhaps this is related to the reason why this species came to this planet."
  # 有趣，继续挖！
  gts_aurora.1002.a: "Interesting, continue digging!"
  # 熟悉的称呼
  gts_aurora.1003.name: "Familiar Terminology"
  # 经过不懈的发掘与研究，我们最终确定，这个物种在转移到此时文明已经发展到了中世纪左右。那一时期的文本多次中提到被遮蔽的天空与难以直视的强光，看来我们已经很接近真相了。
  gts_aurora.1003.desc: "Through relentless excavation and research, we finally determined that this species had reached around the medieval period when they were transferred to this planet. The text of that period repeatedly mentioned a veiled sky and strong lights that were difficult to look at. It seems that we are very close to the truth."
  # 继续！
  gts_aurora.1003.a: "Continue!"
  # 过往
  gts_aurora.1004.name: "Past"
  # 在研究一筹莫展之际，我们的一支探索小队发现了一个奇怪的洞穴，洞穴的规模并不算大，但内部有着人居住过的痕迹，从陈设来看应该正是被转移到这颗星球上的时代所建造的。我们在这里找到了一个由水晶封存起来的笔记本，而这上面的内容十分的令人震惊。
  gts_aurora.1004.desc: "As the research reached a dead end, one of our exploration teams discovered a strange cave. The cave was not very large, but it had signs that people had lived there. Judging from the furnishings, it should have been built in the era when they were transferred to the planet. Here, we found a notebook sealed in crystal, and the content of the book is shocking."
  # 让我看看
  gts_aurora.1004.a: "Let me see."
  # 结局
  gts_aurora.1005.name: "The Ending"
  # 看来这颗星球上的智慧物种来自于欧若拉曾经的母星，欧若拉与生俱来的强大力量让她被自己国家的人所敌视。但欧若拉究竟是出于什么目的才会将整个星球的智慧生物都转移到这颗星球上呢？
  gts_aurora.1005.desc: "It seems that the sentient species on this planet came from Aurora's former home world. Aurora's innate powerful strength caused her to be ostracized by her own people. But what was Aurora's purpose for transferring the entire planet's sentient beings to this planet?"
  # 直接问问欧若拉吧
  gts_aurora.1005.a: "Let's just ask Aurora directly."
  # 只是又一个被自己的愚蠢毁灭的文明而已，此时平平无奇
  gts_aurora.1005.b: "Just another civilization destroyed by their own stupidity. Nothing unusual here."
  # 诅咒与摇篮
  gts_aurora.1006.name: "Curse and Lullaby"
  # 她出生时，金黄色的曙光照耀着整个王国，因此，欧若拉（Aurora）便是这位新生的小公主的名字。就连仙子们也为公主的降生感到高兴，她们来到王宫献上自己的祝福。\n\n\"看哪！那小脸蛋肉嘟嘟的多可爱！她长大后一定是个大美人！我要祝福你能茁壮成长，成为万众瞩目的明星！\"\n\n\"喂，看她的眼睛水灵灵的像清晨的露水一样，我要祝你能像蒲公英一样自由自在，不受束缚。\"\n\n但下一秒，一位邪恶仙子闯入了王宫\n\n\"成长？自由？我要让这祝福变成她的诅咒！变成不受控制的力量！她会被这股力量扭曲，变成一只怪物！10年后她会替我毁灭这个肮脏的王国！\"\n\n恶毒的诅咒落在新生的公主身上，邪恶的仙子在狞笑与黑烟中消失，热闹的会场瞬间变得像葬礼般沉寂。最终，还未给出祝福的第三位仙子打破了沉默\n\n\"虽然我无法解开这诅咒，但我想给小公主信任他人的能力，希望这能帮到她。\
  gts_aurora.1006.desc: "When she was born, the golden dawn shone on the entire kingdom. Thus, Aurora was the name given to this newly born little princess. Even the fairies were happy about the princess's birth, and they came to the palace to offer their blessings.\n\n\"Look! How cute her chubby cheeks are! She will surely grow into a great beauty! I wish her a healthy growth, to become a star that attracts everyone's attention!\"\n\n\"Hey, look at her eyes, they are as watery and lively as the morning dew. I wish that you can be free like a dandelion, without any constraints.\"\n\nBut the next second, a wicked fairy broke into the palace.\n\n\"Growth? Freedom? I shall turn these blessings into her curse! Into an uncontrolled power! She will be twisted by this power, becoming a monster! After 10 years, she will destroy this filthy kingdom for me!\"\n\nThe malicious curse fell upon the newborn princess, and the evil fairy disappeared into sneers and black smoke. The lively venue instantly became as silent as a funeral. Finally, the third fairy, who had yet to give her blessing, broke the silence.\n\n\"Although I cannot break the curse, I want to give the little princess the ability to trust others. I hope this will help her.\"
  # ...
  gts_aurora.1006.a: "..."
  # 蝴蝶吹起的飓风
  gts_aurora.1007.name: "The Hurricane Stirred by a Butterfly"
  # 转眼间，8年过去了，那恐怖的诅咒似乎没有任何应验的迹象，王后甚至觉得诅咒已经消失了，欧若拉将会在幸福与宠爱中继续成长。直到一名侍女发现公主头发变成了异常的颜色。已经第8年了，或许这就是征兆，大臣们议论纷纷，国王低着头沉默不语，而王后则被软禁在寝宫中，整日以泪洗面。欧若拉本以为自己会因为用浆果给头发染色而被母后责备，毕竟平时最宠欧若拉的母后只要一碰到仪容的问题就会变得无比严厉。但那一天母后并没有出现，而晚上居然是父王来给她讲睡前故事，父王低沉又有些颤抖的声音让她感到非常新奇，但白天消耗掉的过剩精力让她很快进入了梦乡，模模糊糊中她看到了一颗亮闪闪的银色星星。\n\n那一晚，欧若拉做了一个噩梦，她感觉胸口剧痛无比，她处在一片漆黑之中想要哭喊却发不出声音。而当她终于醒来时，却发现四周的景色变得陌生——大片凹陷的地面，废墟一般的王宫，还有从远处隐隐约约传来的惨叫声，这诡异的场景与昨晚的噩梦，让欧若拉感到无比不安，她飞奔着呼喊自己母后的名字，但刚跑出不远就看到跪坐在地上的父王，他的怀中躺着的正是母后。她走了过去，轻轻唤着自己的母后，但没有得到回应，再也没有得到回应。
  gts_aurora.1007.desc: "In the blink of an eye, 8 years have passed. The horrific curse seemed to have no signs of coming true. The Queen even thought the curse had disappeared, and Aurora would continue to grow in happiness and love. That's until a maid discovered that the princess's hair had changed to an abnormal color. It has been 8 years. Perhaps this is the sign, the ministers discussed. The king bowed his head and remained silent, while the Queen was placed under house arrest in her bedroom, crying all day long. Aurora thought that her mother would scold her for dyeing her hair with berries. After all, her mother, who usually spoiled Aurora the most, would become extremely strict when it came to grooming problems. But that day, her mother did not appear. Instead, her father came to tell her a bedtime story in the evening,. His deep but trembling voice made her very curious. But the excess energy she used up during the day quickly sent her to sleep, and in a haze, she saw a shiny silver star.\n\nThat night, Aurora had a nightmare. She felt a searing pain in her chest, and she was in the dark, trying to cry out but could not make a sound. When she finally woke up, she found that the surrounding scenery had become unfamiliar - large areas of sunken ground, ruins of the palace, and faint screams coming from afar. The strange scenery, combined with last night's nightmare, made Aurora feel extremely uneasy. She ran and shouted her mother's name, but not far out, she saw her father kneeling on the ground, with her mother lying in his arms. She walked over and softly called to her mother, but there was no response, and there would never be a response."
  # ...
  gts_aurora.1007.a: "..."
  # 梦
  gts_aurora.1008.name: "Dream"
  # 那一夜后，欧若拉立刻就被送到了王宫边境的一处高塔中\"软禁\"了起来，甚至没有让她参加王后的葬礼。\n\n王宫被毁的消息则随着第二天的黎明迅速传遍了整个王国\n\n\"公主变成了比王宫穹顶还高的巨人！她像怪物一样四处破坏，而士兵的武器甚至没能刮伤她的皮肤！甚至有士兵被当做点心葬身公主腹中！就连王后也被她亲手杀死！\"\n\n各种各样的谣言在民间不断滋生。但欧若拉并不担心能不能回到王宫，因为父王告诉她等到王宫修好了就会来接她回去，况且对她而言，高塔上的生活与在王宫中没什么区别，只是没有了侍女与母后的陪伴。\n\n没有人陪伴，她就翻看塔中的书籍，与小动物说话，她经常会给聚在她身边的小动物读书上的故事，而她最喜欢的，莫过于那个勇者拯救被囚禁在高塔上的公主的故事。而欧若拉的幻想在两个月后成真了，她看到一个带着武器的人从高塔的窗户翻了进来，\n\n\"勇者大人！你是勇者大人吗！你是来带欧若拉离开的吗！欸？为什么要拔出刀？怪物......但这里没有怪物把守啊？\"\n\n欧若拉看到锋利的刀砍向了自己的脖子，然后，她又做了那个噩梦。醒来后房间乱作一团，天花板也不知为何开了个洞。\n\n\"原来是梦啊，勇者大人才不会对公主动手。\"\n\n那天之后欧若拉便经常做这样的\"噩梦\"，不过奇怪的是，每次醒来后欧若拉都感觉肚子像是吃饱了一样。
  gts_aurora.1008.desc: "After that night, Aurora was immediately sent to a tower on the border of the palace and \"placed under house arrest\", without even attending the Queen's funeral.\n\nThe news of the palace's destruction quickly spread across the entire kingdom by the next day's dawn.\n\n\"The princess has turned into a giant taller than the palace dome! She is destroying everything like a monster, and the soldiers' weapons cannot even scratch her skin! Some soldiers were even used as snacks and buried in the belly of the princess! Even the queen was killed by her own hands!\"\n\nAll kinds of rumors were constantly spreading in the civil community. But Aurora was not worried about returning to the palace, because her father told her that he would come to pick her up when the palace was repaired. Besides, for her, life in the tower was no different from life in the palace, except that there were no maids or her mother's company.\n\nWithout anyone to accompany her, she read the books in the tower and talked to the little animals. She would often read stories from the books to the little animals that gathered around her, and her favorite was the story of a hero saving a princess imprisoned in a tower. Two months later, Aurora's fantasy became a reality. She saw someone with a weapon climbing in through the window of the tower.\n\n\"Brave hero-sama! Are you the brave hero-sama! Have you come to take Aurora away! Eh? Why did you draw your sword? Monster...... But there are no monsters guarding this place?\"\n\nAurora saw the sharp blade slash towards her neck, and then, she had that nightmare again. After waking up, the room was a mess, and for some reason, there was a hole in the ceiling.\n\n\"It was a dream, brave hero-sama would not hurt the princess.\"\n\n After that day, Aurora would often have such \"nightmares\", but strangely, every time she woke up, Aurora felt like her stomach was full."
  # ...
  gts_aurora.1008.a: "..."
  # 公主观察日记
  gts_aurora.1009.name: "Princess' Observation Diary"
  # 关于公主的谣言越来越夸张，老夫曾受王后委托要找出解开公主诅咒的方法，现在是时候动身了。\n第1天：公主大人似乎有些警惕，也许是老夫有些操之过急，那就明天再问问给公主做全身检查的事情吧。\n第7天：经过观察，公主大人的心智显然并未受到诅咒的影响，但公主还是没有同意全身检查的事情，用一些树莓蛋糕做诱饵可能会是个不错的选择。\n第16天：公主大人已经非常明确的表明了她对于全身检查的态度，不过居然能徒手捏碎塔楼的墙砖，或许接下来的研究有方向了。另外公主大人做的树莓蛋糕味道很好。\n第21天：经过同意，我抽取了公主大人的一些血液样本，老夫发现公主大人体内的魔力含量高得惊人，但这些魔力并非来自诅咒，而是与生俱来的，也就是说诅咒只是会让这股力量变得难以控制。或许并不需要解开诅咒，只要让公主大人学会控制这份力量，或许就能拯救公主。\n第53天：控制训练已经过去一个月有余，现在公主大人已经能熟练地控制力量，甚至能将身体进行一定程度的巨大化，或许公主大人很快就能回到正常的生活中去了，王后托付给老夫的任务也终于能完成。\n第59天：寄给王宫的信鸽一直没有飞回来，难道是王宫出了什么事吗？\n第90天：这么久过去了，寄给王宫的信却还是没有下落，不能再耽搁了，看来老夫该亲自去一趟了。\n（后面是一段更工整的字体）老爷爷说他很快就会回来，但已经两个月了，老爷爷还是没有回来，所以欧若拉写了这封信，希望您能快点回来，欧若拉做了很多树莓蛋糕等着爷爷回来吃！
  gts_aurora.1009.desc: "The rumors about the princess are becoming more and more exaggerated. I was entrusted by the queen to find a way to break the princess' curse. It is time to act.\nDay 1: The princess seems somewhat wary. Perhaps I was a little too hasty. I will ask about the full body checkup for the princess tomorrow.\nDay 7: After observation, the princess' mind has clearly not been affected by the curse. But the princess still has not agreed to a full body checkup. Using some raspberry cake as bait might be a good option.\nDay 16: The princess has made it very clear about her attitude towards full body checkups. But she was able to crush the bricks of the tower walls with her bare hands. Perhaps the research has a direction now. In addition, the raspberry cake made by the princess tastes very good.\nDay 21: With consent, I extracted some blood samples from the princess. I found that the amount of magical power in the princess' body was shockingly high, but this magical power does not come from the curse, but innate. This means that the curse will only make this power difficult to control. Perhaps it is not necessary to break the curse. If we let the princess learn to control this power, maybe we can save the princess.\nDay 53: It has been over a month since the control training began. Now the princess can skillfully control her power and can even expand her body to a certain extent. Perhaps the princess will soon be able to return to a normal life, and the task entrusted to me by the queen can finally be completed.\nDay 59: The pigeons sent to the palace have not flown back. Could something have happened to the palace?\nDay 90: So much time has passed, but the letters sent to the palace are still nowhere to be found. We can't delay any longer. It seems that I should go there myself.\n(The following is a section written in a more formal font) Grandpa said that he would be back soon, but it has been two months, and Grandpa has not come back yet. So Aurora wrote this letter, hoping that you can come back soon. Aurora has made a lot of raspberry cake waiting for Grandpa to come back and eat!"
  # ...
  gts_aurora.1009.a: "..."
  # 梦醒时分
  gts_aurora.1010.name: "When Dreams Awaken"
  # 随着老学者的离开，欧若拉又回到了孤单的生活之中，或许是习惯了有人陪伴，她第一次对这漫无尽头的等待感到了厌倦。然而半年过去了，那位和蔼的老爷爷依然了无音讯。一天清晨，偏僻的高塔附近突然传来了一阵嘈杂的人声，\n\n\"是老爷爷吗？要来接我回家了吗？\"\n\n按捺住内心的兴奋，欧若拉学着母后曾经的样子，轻轻提起裙摆迈着优雅的步伐走了出门外。然而映入眼帘的却是全副武装的士兵与暴民，与被关押在囚车中的老学者。\n\n\"烧死那个蛊惑人心的巫师！\"\n\"别被她的外表骗了，那可是吃人的怪物！\"\n\"把她烧死！\"\n\"是那个怪物，还披着公主的皮！\"\n\n疑惑，委屈，恐惧，迷茫，压抑许久的情感此时汇聚成了一股怒火，在欧若拉的内心中熊熊燃烧，\n\n\"为什么要伤害老爷爷！为什么要把错都怪到我头上！\"\n\n原本娇小的女孩，在下一刻就变成了能遮蔽住高塔的巨人\n\n\"总算露出真面目了，怪物！\"\n\"杀死它！\"\n\"为了王国的明天！\"\n\n欧若拉向前踏出了一步，坚实的地面被女孩那白皙娇嫩的脚掌砸出深坑，卷起的气浪掀翻了冲锋的士兵，高涨的士气被小女孩的一次跺脚瞬间击溃。人们四散奔逃，然而那巨大的脚掌并没有落在人群身上，欧若拉只是迈过人群走到了那辆囚车面前。即使再怎么愤怒，欧若拉依然不想伤害任何人，她想做的只是救下眼前这位饱受折磨的善良的老学者。\n\n\"她上当了！放箭！\"\n\n埋伏在一旁的攻城弩车射出了巨大的箭矢，附魔的箭头刺穿了欧若拉的胸口。胸口传来的剧痛让她回想起自己命运改变的那一晚\n\n\"原来欧若拉就是怪物，难怪大家都这么讨厌欧若拉...\"\n\n强光闪过，\"怪物\"消失了，但却发生了更恐怖的异变，被肉色墙壁遮蔽的暗淡天空，将大树连根拔起的强风，不规则的地震，人们还未来得及庆祝就又陷入了末日来临般的恐慌。但是，没有任何预兆地，末日般的异变突然停止，整个王国奇迹般的没有任何人伤亡，除了周围的地形变得陌生之外没有任何异常。人们从瓦砾堆中走出开始重建自己的家园。王国在这一天毁灭了，但也没有毁灭。诅咒最终还是应验，但欧若拉已经用自己的方式努力过了。
  gts_aurora.1010.desc: "With the old scholar leaving, Aurora returned to a lonely life. Perhaps she had become so used to having someone with her, she was bored with this endless wait for the first time. However, half a year had passed, and there was still no news of the amiable old grandpa. One early morning, a clamor of voices suddenly came from near the remote tower.\n\n\"Is that grandpa? Has he come to take me home?\"\n\nSuppressing the excitement in her heart, Aurora, imitating her mother's previous actions, gently lifted her skirt and walked out with elegant steps. But what came into view was soldiers and mobs fully armed, and an old scholar held captive in a prison wagon.\n\n\"Burn the bewitching sorcerer to death!\"\n\"Don't be fooled by her looks, she is a man-eating monster!\"\n\"Burn her to death!\"\n\"That's the monster, still wearing the skin of the princess!\"\n\nConfusion, grievance, fear, disorientation, and suppressed emotions at this moment converged into a raging fire, burning in Aurora's heart.\n\n\"Why are you hurting grandpa! Why are you blaming me for everything!\"\n\nThe petite girl in the next instant became a giant that could shield the tower.\n\n\"Finally showing her true colors, monster!\"\n\"Kill it!\"\n\"For the future of the kingdom!\"\n\nAurora took a step forward. The solid ground was smashed into a deep pit by the girl's fair and delicate soles, and the gust of air lifted the charging soldiers. The high morale was instantly shattered by the little girl's stomp. People scattered and fled, but the huge sole did not fall onto the crowd. Aurora simply stepped over the crowd and walked to the prison wagon. Even in anger, Aurora still did not want to hurt anyone. All she wanted to do was to save the kind old scholar in front of her who was being tortured.\n\n\"She fell for it! Fire the arrows!\"\n\nThe siege crossbows ambushed on the side shot out huge arrows, and the enchanted arrowheads pierced through Aurora's chest. The searing pain in her chest made her recall the night her destiny had changed.\n\n\"So Aurora is the monster. No wonder everyone hates Aurora so much...\"\n\nA flash of light passed, the \"monster\" disappeared, but a more terrifying change took place. The dim sky covered by flesh-colored walls, the strong wind that uprooted large trees, and irregular earthquakes. Before people had a chance to celebrate, they were plunged back into a panic as if the end of the world had arrived. However, without any warning, the doomsday-like changes suddenly stopped. The entire kingdom was miraculously free from casualties. Other than the surrounding terrain becoming unfamiliar, nothing was abnormal. People emerged from the rubble and began to rebuild their homes. The kingdom was destroyed on this day, but it was not destroyed. The curse was finally fulfilled, but Aurora had already tried her best in her own way."
  # 原来如此
  gts_aurora.1010.a: "I see."
  # 爱洛
  NAME_gts_arlo: "Arlo"
  # 被我们征服的泰坦生物，现在她将永世成为我们的奴隶
  DESC_gts_arlo: "A titan creature we conquered. Now she will forever be our slave."
  # 虽然很多东西都不记得了，但爱洛始终记得与主人的事，请您尽管吩咐爱洛就好。
  gts_arlo_catch_phrase: "Although I don't remember many things, Arlo always remembers her duties to her master. Please, feel free to give Arlo any orders."
  # 爱洛
  gts_aurora.999.name: "Arlo"
  # \"那个星球一样的生物就是我的身体吗......爱洛明白了，感谢主人让爱洛能以正常人的样子生活，爱洛会尽全力弥补自己造成的破坏的。\"\n\n\"主...主人...啊，对了，您是我的主人，请下命令吧，爱洛一定会帮您的！\
  gts_aurora.999.desc: "\"Is that planet-like creature my body...... Arlo understands. Thank you, Master, for allowing Arlo to live like a normal person. Arlo will do her best to make up for the damage she caused.\"\n\n\"Ma...Master, ah, that's right, you are my master. Please give me orders, and Arlo will be sure to help you!\"
  # 关于身份
  gts_aurora.999.a: "About Identity"
  # 我...我记得我曾是泛星际市场上的奴隶，因为自身的灵能暴走而巨大化，多亏了主人我才能用现在这副身体生活。为了报答，我一定会努力帮上大家的忙的！
  gts_aurora.999.a.response: "I...I remember I used to be a slave in a pan-galactic market, before becoming giant due to my psionic powers going berserk. Thanks to my master, I can live in this body now. To repay you, I will work hard to help everyone!"
  # 询问身体状况
  gts_aurora.999.b: "Inquire About Physical Condition"
  # 主人请放心，除了偶尔头疼之外没什么大碍，而且有了主人的药之后就连头疼的次数也变少了。但是最近总是会失眠，下次睡不着的时候主人能再给我唱那首摇篮曲吗。呜...摇篮曲？我不该在睡前听过摇篮曲才对，啊...啊啊啊啊啊！主人！我的头又开始痛了....药....
  gts_aurora.999.b.response: "Please rest assured, Master, apart from occasional headaches, there is nothing serious. And with the medicine from my Master, the number of headaches has even decreased. However, I have been having insomnia lately. Can you sing that lullaby to me again when I cannot sleep next time. Ugh... lullaby? I shouldn't have listened to lullabies before sleep, ah... ahhhhh! Master! My head hurts again....the medicine...."
  # 检查工作
  gts_aurora.999.c: "Check Work"
  # 主人！这是今天的研究报告，我提前完成了哦，夸我！夸我！欸，主人的工作还没完成吗，那就让我来帮忙吧，没关系，我又不是娇滴滴的小女孩，交给我吧！
  gts_aurora.999.c.response: "Master! This is today's research report, I finished it ahead of schedule! Praise me! Praise me! Eh, is Master's work still not finished? Then let me help you, it's okay, I'm not a delicate little girl, leave it to me!"
  # 观察发呆的\"爱洛\
  gts_aurora.999.d: "Observe \"Arlo\" Daydreaming"
  # .....头....好痛.....痛....身体也好痛.....主人...主人在哪里.....爱洛好害怕....爱洛不想变大，不想伤害别人.....请惩罚爱洛吧....（这种语无伦次的现象通常会持续数个小时，不过暂时不会影响到她的工作效率）
  gts_aurora.999.d.response: ".....head....hurts so much.....pain....my body also hurts.....Master...where is Master.....Arlo is so scared....Arlo doesn't want to become big, doesn't want to hurt others..... Please punish Arlo.... (This incoherent phenomenon usually lasts for several hours, but it does not temporarily affect her work efficiency)"
  # 收下\"爱洛\"送的礼物
  gts_aurora.999.e: "Receive a Gift from \"Arlo\"
  # 主人！平时工作辛苦了！这是我亲手做的蛋糕，请品尝一下吧，啊，是在闲暇时做的，没有耽误工作哦。
  gts_aurora.999.e.response: "Master! You work hard every day! This is a cake I made myself, please try it, ah, I made it during my spare time, it did not delay my work."
  # §Y爱洛§!作为一名§H领袖§!加入了我们的帝国。
  gts_aurora.999.hire_custom_tooltip: "§YArlo§! has joined our empire as a §HLeader§!"
  # 天体级奴隶
  gts_trait_leader_arlo_a: "Celestial Slave"
  # 盖亚星球般巨大的幼女，是无论如何都不想让人与之为敌的存在，但我们依然可以将其征服！
  gts_trait_leader_arlo_a_desc: "A Gaia-planet-sized young girl, a being that no one would want to be enemies with, but we can still conquer her!"
  # 灵能阻隔
  gts_trait_leader_arlo_b: "Psionic Barrier"
  # 将主体意识与本体分隔开可以大大降低其暴走的风险，当然这也需要更频繁的维护
  gts_trait_leader_arlo_b_desc: "Separating her main consciousness from the main body can greatly reduce the risk of her going berserk, but of course, this also requires more frequent maintenance."
  # 48h工作制
  gts_trait_leader_arlo_c: "48h Work System"
  # 强大的运算能力让爱洛可以以常人两倍的速度处理工作，而我们提供的特殊药物则可以让她一天24h保持工作状态
  gts_trait_leader_arlo_c_desc: "Her powerful computing abilities allow Arlo to process work twice as fast as a normal person, and the special drugs we provide allow her to stay in a working state for 24 hours a day."
  # 为了主人!
  gts_trait_leader_arlo_d: "For the Master!"
  # \"爱洛最喜欢主人了！虽然记不清为什么喜欢，但总之就是最喜欢主人了！咳.....咳...抱歉，有些太激动了。\
  gts_trait_leader_arlo_d_desc: "\"Arlo loves Master the most! Although I do not remember why I like you, I just love Master the most! Cough.....cough...sorry, I got a little too excited.\"
  # 忠实奴仆
  gts_trait_leader_arlo_e: "Loyal Servant"
  # \"主...主人，今天的任务爱洛已经完成了，可以......啊...欸...主人，爱洛准备好开始今天的工作了。\
  gts_trait_leader_arlo_e_desc: "\"Ma...Master, Arlo has completed today's tasks, can I......ah...eh...Master, Arlo is ready to start today's work.\"
  # 精神不稳定
  gts_trait_leader_arlo_f: "Mentally Unstable"
  # 爱洛的精神状态必须随时监控，并确保稳定
  gts_trait_leader_arlo_f_desc: "Arlo's mental state must be monitored at all times and ensured to be stable."
  # 超级数据库
  gts_trait_leader_arlo_g: "Super Database"
  # 在对爱洛的本体进行研究后发现，其脑部是一个无比庞大的数据库，甚至数据比堕落帝国还要久远
  gts_trait_leader_arlo_g_desc: "After researching Arlo's body, it was discovered that her brain is an incredibly vast database, with data even older than the Fallen Empires."
  # 超级数据库II
  gts_trait_leader_arlo_g_2: "Super Database II"
  # 通过在其脑部建造的抑制器，我们可以在不唤醒本体的情况下将数据库连接到爱洛的脑中，但这样会对爱洛的精神造成一定负担，因此需要加大她每日用药的剂量
  gts_trait_leader_arlo_g_2_desc: "By building a suppressor in her brain, we can connect the database to Arlo's brain without awakening her main body. But this will put a certain burden on Arlo's mind, so we need to increase her daily dose of medicine."
  # 超级数据库III
  gts_trait_leader_arlo_g_3: "Super Database III"
  # 在上一次精神崩溃事件后我们决定为爱洛更换一个新素体，牺牲部分让身体保持健康的技能来保证更强的处理能力，当然因为新素体仍会感到疲惫，因此维护也会更频繁。
  gts_trait_leader_arlo_g_3_desc: "After the last mental breakdown, we decided to replace Arlo with a new body, sacrificing some skills to keep the body healthy to ensure stronger processing capabilities. Of course, because the new body will still feel fatigued, maintenance will also be more frequent."
  # 常态超频运算
  gts_trait_leader_arlo_h: "Constant Overclocking"
  # 通过高速运算爱洛可以迅速推演出考古遗迹构造
  gts_trait_leader_arlo_h_desc: "Through high-speed computing, Arlo can quickly deduce the structure of archaeological sites."
  # 常态超频运算II
  gts_trait_leader_arlo_h_2: "Constant Overclocking II"
  # 爱洛还能用自身的灵能进行一定程度的巨大化来帮助考古遗迹的探索
  gts_trait_leader_arlo_h_2_desc: "Arlo can also use her psionic powers to enlarge her body to a certain extent to assist in the exploration of archaeological sites."
  # 常态超频运算III
  gts_trait_leader_arlo_h_3: "Constant Overclocking III"
  # \"主人，主人，这是爱洛找到的，很有用的东西，夸我夸我。\
  gts_trait_leader_arlo_h_3_desc: "\"Master, Master, Arlo found this, it's very useful, praise me, praise me.\"
  # 失心童话
  gts_trait_leader_arlo_I: "Lost Fairy Tale"
  # 受到诅咒的公主变成了怪物，不会再有人来拯救她
  gts_trait_leader_arlo_I_desc: "The cursed princess became a monster and no one will come to save her."
  # 挣脱
  gtsra_situation_giga_slave: "Break Free"
  # 挣脱
  gtsra_situation_giga_slave_type: "Break Free"
  # 不知为何，这只巨大萝莉体内的灵能反应突然大幅增强，强大的灵能波动袭击了巨娘体内的各处殖民地，并制造出了与她本人形象一致的灵能投影，如果我们不尽快采取措施，这些投影很快就会进入到物理世界并破坏掉拘束装置。
  gtsra_situation_giga_slave_desc: "For some reason, the psionic reaction within this giant loli suddenly increased dramatically. The powerful psionic fluctuations attacked various colonies within her giant body and created psionic projections that looked identical to her. If we do not take action quickly, these projections will soon enter the physical world and destroy the restraining devices."
  # 她即将挣脱
  stage_gtsra_giga_slave_1_tooltip: "She is about to break free."
  # 拘束装置正受到攻击
  stage_gtsra_giga_slave_2_tooltip: "The restraining devices are under attack."
  # 她暂时停止挣扎了
  stage_gtsra_giga_slave_3_tooltip: "She has temporarily stopped struggling."
  # 再次拘束
  gtsra_giga_slave_completed: "Re-Restrain"
  # 她将挣脱
  gtsra_giga_slave_fail: "She will break free."
  # 尽全力压制
  gtsra_giga_slave_positive: "Suppress With All Might"
  # 重新加强我们的拘束装置，消除意外的能量波动
  gtsra_giga_slave_positive_effect: "Reinforce our restraining devices and eliminate accidental energy fluctuations."
  # 无动于衷
  gtsra_giga_slave_negative: "Remain Indifferent"
  # 天要下雨，娘要嫁人，随她去了。
  gtsra_giga_slave_negative_effect: "The sky wants to rain, the girl wants to marry, let her go."
  # 急性衰竭
  gts_aurora.1060.name: "Acute Failure"
  # 巨大萝莉的身体状况突然恶化，多个器官开始衰竭，同时灵能的波动也开始活跃起来，爱洛也受到本体异变的影响而昏迷不醒
  gts_aurora.1060.desc: "The giant loli's physical condition has suddenly deteriorated, with multiple organs beginning to fail and the psionic fluctuations also becoming active. Arlo is also affected by the mutations of her main body and has fallen into a coma."
  # 必须尽快查出原因
  gts_aurora.1060.a: "The cause must be found as soon as possible."
  # 亡国厄咒
  gts_aurora.1061.name: "Doomed Curse"
  # 经过医学团队的不懈努力，我们暂时稳定住了萝莉的身体状况，但心脏处产生的异常灵能波动妨碍了我们的治疗进程，如果不尽快解决萝莉的死亡只是时间问题
  gts_aurora.1061.desc: "After the medical team's tireless efforts, we have temporarily stabilized the loli's physical condition, but the abnormal psionic fluctuations generated at her heart are hindering our treatment progress. If this is not resolved soon, it's only a matter of time before the loli dies."
  # 赶快想办法！
  gts_aurora.1061.a: "Find a way, quickly!"
  # 灵能通讯接入
  gts_aurora.1062.name: "Psionic Communication Connection"
  # 萝莉心脏处突然传来了一个灵能通讯信号，事情或许要迎来转机了
  gts_aurora.1062.desc: "A psionic communication signal suddenly came from the loli's heart. Perhaps things are about to take a turn for the better."
  # 接入通讯画面
  gts_aurora.1062.a: "Connect to the communication screen."
  # 灵能通讯接入
  gts_aurora.1063.name: "Psionic Communication Connection"
  # \"懦弱又愚蠢，可怜的欧若拉（Aurora）,哦，不对，他们现在叫你‘爱洛’（Aurora）,不会再有人来救你了...\
  gts_aurora.1063.desc: "\"Cowardly and foolish, pitiful Aurora, oh, no, they are calling you 'Arlo' now. No one will come to save you anymore...\"
  # 你是谁？
  gts_aurora.1063.a: "Who are you?"
  # 灵能通讯接入
  gts_aurora.1064.name: "Psionic Communication Connection"
  # \"哦，我只是一个微不足道的小仙子，不过这不重要。我想感谢你们制服了这个小怪物，给了我复活的机会。不过你们的眼光太短浅了，居然只甘心做一群寄生虫，我会让你们知道这具身躯的真正潜力\
  gts_aurora.1064.desc: "\"Oh, I'm just an insignificant little fairy, but that is not important. I want to thank you for subduing this little monster and giving me a chance to resurrect. But your vision is too short-sighted. You are just content to be a group of parasites. I will let you know the true potential of this body.\"
  # 你是什么意思？
  gts_aurora.1064.a: "What do you mean?"
  # 灵能通讯接入
  gts_aurora.1065.name: "Psionic Communication Connection"
  # \"嘻嘻嘻，你们马上就会知道了\
  gts_aurora.1065.desc: "\"Hee hee hee, you will find out soon enough.\"
  # 结束通讯
  gts_aurora.1065.a: "End Communication"
  # 苏醒
  gts_aurora.1066.name: "Awakening"
  # §R所有的控制设备瞬间失灵，泰坦萝莉醒过来了！！！§!
  gts_aurora.1066.desc: "§R All control devices have failed instantly, the titan loli is awake!!! §!"
  # 我草！！！
  gts_aurora.1066.a: "Holy shit!!!"
  # §Y挣脱萝莉会袭击殖民地！效果同裂爪龙§!
  gts_aurora.1066.a.tooltip: "§Y The breaking free loli will attack colonies! The effect is the same as a Rift Dragon §!"
  # 毁灭
  gts_aurora.1067.name: "Destruction"
  # 巨大萝莉袭击了我们的殖民地，守军舰队的拼死抵抗甚至没有引起她的注意，而她仅仅是将脚掌轻轻放到了星球的地表便让整颗星球脱离了轨道，慢慢坠向了恒星的方向，萝莉饶有兴趣得看着整个殖民地被烤成焦炭的过程
  gts_aurora.1067.desc: "The giant loli attacked our colony. The desperate resistance of the garrison fleet did not even attract her attention. She simply placed her foot lightly on the surface of the planet, which caused the entire planet to detach from its orbit and slowly fall towards the star. The loli watched with interest as the whole colony was burned to a crisp."
  # 天啊
  gts_aurora.1067.a: "Oh my god"
  # 毁灭
  gts_aurora.1068.name: "Destruction"
  # 巨大萝莉向我们的殖民地伸出了粉嫩的舌头，将地表的一切尽数收入腹中，整个星球的平均海拔因为萝莉的舔食而降低了1km，吞吃了整个殖民地后她还意犹未尽般的揉了揉自己的肚子
  gts_aurora.1068.desc: "The giant loli stretched her pink tongue towards our colony, taking everything on the surface into her belly. The entire planet's average altitude was reduced by 1km due to the loli's licking, After swallowing the entire colony, she rubbed her belly as if she had not had enough."
  # 天啊
  gts_aurora.1068.a: "Oh my god"
  # 毁灭
  gts_aurora.1069.name: "Destruction"
  # 巨大萝莉降临到了我们的殖民地上，她缓慢的调整姿势，直接骑坐在了星球上，她戏谑的向着自己腿间的星球微笑，然后向双腿之间慢慢注入力量，整颗星球瞬间像蛋壳一般分崩离析，而星球爆炸的力量甚至没能在她的皮肤留下一点痕迹
  gts_aurora.1069.desc: "The giant loli descended onto our colony. She slowly adjusted her posture and sat directly on the planet. She jokingly smiled at the planet between her legs, and then slowly poured power between her thighs, and the entire planet disintegrated like an eggshell in an instant. The force of the planet exploding did not even leave a single mark on her skin."
  # 天啊
  gts_aurora.1069.a: "Oh my god"
  # 毁灭
  gts_aurora.1070.name: "Destruction"
  # 巨大萝莉停留在殖民地的轨道上，似乎在思考要如何与星球\"玩耍\"，然后她伸出了手，地壳在她面前就像是沙子一样轻易的被挖起来拿到了胸前，最后巨大萝莉松开了手，任由那块地表坠向殖民地，整颗星球瞬间化作火海
  gts_aurora.1070.desc: "The giant loli stayed in the orbit of the colony, seeming to wonder how to \"play\" with the planet. Then she stretched out her hand, and the crust was easily dug up and brought to her chest as if it were sand. Finally, the giant loli released her grip, letting the surface fall towards the colony. The entire planet was instantly turned into a sea of fire."
  # 天啊
  gts_aurora.1070.a: "Oh my god"
  # 苏醒的爱洛
  gts_aurora.1071.name: "Awakened Arlo"
  # \"这是......我的诅咒，让我去解决吧，我不会再让她伤害别人了...\
  gts_aurora.1071.desc: "\"This is......my curse, let me solve it. I will never let her hurt anyone again...\"
  # 你要去哪？
  gts_aurora.1071.a: "Where are you going?"
  # 不，我们能摆平这件事
  gts_aurora.1071.b: "No, we can handle this."
  # 击败挣脱萝莉
  gts_aurora.1072.name: "Defeat the Breaking-Free Loli"
  # \"不可能，居然会被被一群寄生虫给...\"\n\n付出了巨大的牺牲我们终于再次击败了这只恐怖的行星级生物，在进行了全方位检查后，判断异常灵能信号已经彻底消失，我们可以再次殖民在巨大萝莉的身体上了
  gts_aurora.1072.desc: "\"Impossible, how could I be defeated by a group of parasites...\"\n\nAfter a huge sacrifice, we finally defeated the terrifying planetary creature again. After a comprehensive examination, it is determined that the abnormal psionic signal has completely disappeared. We can colonize the giant loli's body again."
  # 谢天谢地
  gts_aurora.1072.a: "Thank goodness"
  # 被当做食物的星球
  gts_aurora.1080.name: "A Planet Used As Food"
  # §r抱歉啦，小小的大家……§!\n\n洪钟一般的声音回响在[event_target:gts_nutrition_planet.GetName]的天空中，少女平常温柔可爱的声音此时在[event_target:gts_nutrition_planet.GetName]上的人们耳中却如同来自地狱的丧钟一般令人绝望。紧接着，一道无比庞大的身影出现在了星球的轨道之上，洁白无瑕的脸庞占据了整片天空，翠绿色的瞳孔缓缓地扫视着整片大陆。无论是苔藓一般的灰色城市还是尘埃一般的微小生命，在欧若拉的眼中此时也完全被一视同仁地看作了食物的模样。\n\n§r按照[Root.Ruler.GetName]的要求，这颗星球和上面的大家都是我的食物了哦……！虽然很对不起……但是，还请大家做好被我吃掉的准备吧。§!\n\n虽然这颗星球上没能撤离，或者不被允许离开的可怜的人们早就知道了自己的命运，但在天体级欧若拉庞大的身躯之下，难以言喻的压迫感与恐慌最终还是完全笼罩了渺小的人们。一时间，[event_target:gts_nutrition_planet.GetName]上乱作一片，胡乱地逃离着的人们却没能想到，自己所能够做到的事情最多最多也仅仅只是从欧若拉脸庞笼罩的区域逃到被少女双足覆盖着的天空之下吧。\n\n§r如果大家没有意见的话……那我就开始了哦～§!欧若拉微微地闭上了眼睛，轻轻地张开了她的“小嘴”，一点点地飘向了[event_target:gts_nutrition_planet.GetName]。少女的吐息裹挟着洪流一般的唾液冲向了这颗星球，清香而又粘稠的液体在一瞬间之内就混杂着欧若拉口中的气息笼罩了整颗星球，强硬地替换掉了[event_target:gts_nutrition_planet.GetName]上曾经适宜的大气。紧随其后的是，一阵阵唾液暴雨出现在了星球上的各个区划与建筑附近，冲刷着脆弱的构造与更加微小的人们，被淹没在欧若拉唾液中的人口已经完全无法计算。仅仅只是少女的一次平凡的吐息而已，[event_target:gts_nutrition_planet.GetName]上的生态系统就已经被摧毁了大半。或许，这就是天体级巨娘所独有的伟力吧？\n\n§r啊——§!缓缓地分离着的双唇露出了其后深不见底的黑暗深渊，[event_target:gts_nutrition_planet.GetName]上幸存的人们此时如果还有余力抬头看去的话，所能够看到的恐怕也只剩下少女恒星一般庞大的口腔，其余的空间则全部被欧若拉的嘴唇与牙齿挡住了。紧接着，少女的舌尖微微颤抖着伸向了[event_target:gts_nutrition_planet.GetName]，牵连着几道唾液银丝的舌尖径直插入了大地之中，粉红色的柔嫩巨物缓缓地在大陆上挪动着，所到之处的一切——无论是高耸的山脉、坚固的建筑与细微的小人们——都逃不过被欧若拉巨大的舌尖扫过，被碾碎在软肉之下或是被黏在舌尖之上的命运。\n\n§r唔嗯……好吃～§!意犹未尽的欧若拉轻轻地向后退了一下，缓缓地收回了庞大的舌尖，认真地品味着[event_target:gts_nutrition_planet.GetName]与其上城市的滋味，古老的地壳物质与人们工业的成果在海洋一般的唾液中被迅速溶解、淹没，直到在欧若拉的一次吞咽之后消失在了天体级的肠胃之内。\n\n§r咕噜……还想要更多……！§!咽下了这道用一整座大陆制成的“前菜”之后，可爱的欧若拉露出了一抹甜美的微笑，抬起了比起战列舰还要巨大的手指，轻柔地捏住了[event_target:gts_nutrition_planet.GetName]的南北极，产生的震动又一次毁掉了星球上所剩无几的聚集地。随后，最终还是忍耐不住“食物”的诱惑的欧若拉小姐慢慢地把[event_target:gts_nutrition_planet.GetName]送向了自己的嘴巴里面，曾经承载着无数人希望的小小星球就这样消失在了一位天体级巨娘的口中。灵巧的舌尖将渺小的星球送向了洁白的贝齿之间，轻轻咀嚼了几下的欧若拉仔细地品味着口中流出的地幔与碰撞着牙齿的地核，随后无声地咽了下去。\n\n§r唔唔～就像是夹心的巧克力一样呢～§!笑容可掬的欧若拉小姐满意地揉了揉自己的小肚子，哼着我们已经熟悉了的歌谣离开了这个恒星系。至于[event_target:gts_nutrition_planet.GetName]和那些被她吃掉了的人们最终的命运，无论是被足以熄灭恒星的胃液彻底消化还是侥幸穿过比起环世界还要漫长的肠道被排出体外，就不是我们的帝国需要关心的了
  gts_aurora.1080.desc: "§r Sorry, little ones......§!\n\nA booming voice echoed in the sky of [event_target:gts_nutrition_planet.GetName]. The girl's usual gentle and lovely voice was now as hopeless as a death knell from hell in the ears of the people of [event_target:gts_nutrition_planet.GetName]. Immediately after, an immeasurably huge figure appeared in the planet's orbit. Her flawless white face occupied the entire sky. Her emerald green pupils slowly scanned the entire continent. Whether it was the moss-like gray cities or the dust-like minuscule lives, in Aurora's eyes, they were now all seen as food.\n\n§r According to [Root.Ruler.GetName]'s request, this planet and everyone on it are all my food...! Although I am very sorry...but, please do be prepared to be eaten by me. §!\n\nAlthough the pitiful people of this planet, who were not able to evacuate or were not allowed to leave, had long known their fate, under the immense body of the celestial Aurora, an indescribable sense of oppression and panic completely enveloped the tiny people. For a moment, [event_target:gts_nutrition_planet.GetName] was in chaos. The people who ran around blindly failed to realize that the most they could do was to escape from the area covered by Aurora's face to the sky covered by the girl's feet.\n\n§r If everyone has no objections... then I will begin ~ §! Aurora slightly closed her eyes and gently opened her \"small mouth\", drifting towards [event_target:gts_nutrition_planet.GetName] little by little. The girl's breath, wrapped in a torrent of saliva, rushed towards the planet. The fragrant yet viscous liquid instantly enveloped the entire planet with Aurora's breath, forcefully replacing the atmosphere that had once been suitable on [event_target:gts_nutrition_planet.GetName]. Immediately following that, a torrent of saliva rain appeared in every district and building on the planet, eroding the fragile structures and the even smaller people. The population drowned in Aurora's saliva could no longer be calculated. That is how much the ecosystem of [event_target:gts_nutrition_planet.GetName] had been destroyed by just a small exhale by the girl. Perhaps, this is the unique power of a celestial giantess?\n\n§r Ah-§! The slowly separating lips revealed a bottomless dark abyss behind them. If the survivors on [event_target:gts_nutrition_planet.GetName] had the strength to look up, all they could see was the girl's mouth as massive as a star, with the rest of the space completely blocked by Aurora's lips and teeth. Immediately after, the tip of the girl's tongue trembled slightly and reached towards [event_target:gts_nutrition_planet.GetName]. With a few strands of saliva trailing behind, the tip of her tongue went straight into the ground. The soft, pink giant slowly moved across the continent, and everything it passed  -  whether it was towering mountains, solid buildings, or tiny little people  -  could not escape being swept by Aurora's huge tongue, being crushed under the soft flesh or stuck to the tongue.\n\n§r Mmm... delicious~!§! Aurora, still wanting more, gently receded a bit, slowly retracting her huge tongue. She then carefully savored the taste of [event_target:gts_nutrition_planet.GetName] and the cities on it. The ancient crust and the industrial products of the people were quickly dissolved and submerged in the ocean of saliva, until it disappeared into the celestial size stomach after Aurora swallowed.  \n\n§r Glurp...Want more...! §! After swallowing this \"appetizer\" made from a whole continent, the adorable Aurora revealed a sweet smile. She then raised her fingers, which were larger than a battleship. She gently pinched the south and north poles of [event_target:gts_nutrition_planet.GetName], and the resulting tremors once again destroyed the few remaining settlements on the planet. Then, Aurora, who finally could not resist the temptation of \"food,\" slowly sent [event_target:gts_nutrition_planet.GetName] into her mouth. The small planet that had once carried countless people's hopes disappeared into the mouth of a celestial giantess.\nHer nimble tongue sent the tiny planet between her white teeth. After chewing lightly a few times, Aurora carefully savored the mantle flowing out of her mouth and the core colliding with her teeth, and then silently swallowed it.\n\n§r Mmm~ It's like a chocolate with a filling ~! §! Smiling, Miss Aurora contentedly rubbed her tummy, humming a song that we have already familiar with, and left this star system. As for the final fate of [event_target:gts_nutrition_planet.GetName] and the people she ate, whether they were completely digested by stomach acid strong enough to extinguish the star or managed to get through the intestines that were longer than a ringworld and be excreted are not things our empire needs to be concerned about."
