  # 欧若拉大人的小穴口，另一条不属于工厂的偏僻小道，小人们穿行过粗壮的阴毛树林，站在粉嫩的幼小阴唇上，穴口处的阴唇表面沾满黏哒哒的爱液。\n\n崇拜着欧若拉大人的小人，在这里退下了衣物以最坦诚的姿态跃入暗红的深渊甬道中，他们掉落在阴道内侧、富有弹性的软肉丘陵上，肉丘如同弹床接住了小人，又将其高高弹起。\n\n等到全部人聚集齐，他们向着小穴的深处前进，一路上总有人被阴道壁的沟壑捕获，陷入到软绵绵的阴肉沉入沟壑底部再也无法离去，尽管他们因此醉心梦死甘愿化作清理阴道的小虫，直到被爱液吞没窒息而死。\n\n不知过了多久，肉壁的蠕动幅度减弱，最后仅剩的一小部分小人湿漉漉的站在如同太空站的子宫颈前。\n\n在小人眼中中心凹陷，外圈圆润的子宫颈，高大巍峨得难以用言语表达，而那子宫颈中间凹陷的洞窟所连接的子宫，便是这些小人来到这的目的。\n\n这些小人们渴望能进入欧若拉大人的子宫，进入那片圣所，哪怕那会让小人真真正正再也无法逃离欧若拉大人的阴道，最后在子宫的爱液里丧失理智，成为清理子宫的阴虫。\n\n那子宫口与阴道底部之间有着难以企及的距离，且子宫颈饱满的外圈有着一层粘滑的爱液，就如同被涂抹了洗洁精难以着力，小人们仅向上攀爬两步就坠落下来。\n\n不知道过去了多久年月后，这些小人始终没有攀登上去，而没有食物的小人只能从爱液中汲取营养，化作了对爱液越来越上瘾的卑微虫子，散布各处的阴道沟壑里。
  gts_aurora.1194.desc: "At the entrance to Lady Aurora's vagina, along another remote path that does not belong to the factories, the tiny people pass through a forest of thick pubic hair and stand on the pink, young labia. The surface of the labia at the entrance is covered in sticky love fluid.\\\\n\\\\nThe tiny people who worship Lady Aurora take off their clothing here and, in their most honest state, leap into the dark-red abyssal passage. They fall onto elastic hills of soft flesh on the inner side of the vagina. The fleshy hills catch them like trampolines, then bounce them high into the air.\\\\n\\\\nOnce everyone has gathered, they advance toward the depths of the vagina. Along the way, someone is always captured by the gullies in the vaginal wall, sinking into the soft vaginal flesh and down to the bottom of the gully, never able to leave again. Even so, they become intoxicated and willingly turn into tiny bugs that clean the vagina, until they are swallowed by love fluid and suffocate.\\\\n\\\\nAfter an unknown amount of time, the writhing of the flesh walls weakens, and only a small portion of the tiny people remain, wet and dripping, standing before the cervix, which is like a space station.\\\\n\\\\nIn the eyes of the tiny people, the cervix, concave at the center and rounded around the outside, is so tall and majestic that words cannot describe it. The uterus connected to the recessed cave at the center of that cervix is precisely the reason these tiny people came here.\\\\n\\\\nThese tiny people long to enter Lady Aurora's uterus, to enter that sanctuary, even if it would truly make them unable to ever escape Lady Aurora's vagina again, and even if in the end they would lose their reason in the uterus's love fluid and become vaginal bugs that clean the uterus.\\\\n\\\\nThere is an unreachable distance between the opening of the uterus and the bottom of the vagina, and the full outer ring of the cervix is coated with a layer of slippery love fluid, m