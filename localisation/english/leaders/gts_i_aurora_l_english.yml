  # §r$NAME_gts_arlo$§!：\n体型增加了§G[event_target:gts_nutrition_planet.gts_bruh_get_planet_size_change_count]§!\n获得了§G[event_target:gts_nutrition_planet.gts_bruh_get_experience_count]§!点经验值\n已经§Y$gts_vore_kills_logs$§!增加了§R[event_target:gts_nutrition_planet.gts_bruh_get_planet_killed_pop_count]§!人\n已经§Y$gts_city_kills_logs$§!增加了§R[event_target:gts_nutrition_planet.gts_bruh_get_planet_destroyed_city_count]§!座\n已经§Y$gts_planet_kills_logs$§!增加了§R1§!颗
