  gts_aurora.1091.desc: "§HSo this is Lady Aurora's lips... they're truly so soft.§!\n\nA group of people who, even combined, were less than specks of dust to Lady Aurora had gathered here out of curiosity and another shameful reason.\n\n§HYes, yes!§!\n\n§HEven the air is filled with the sweet fragrance of Lady Aurora's saliva.§!\n\n§HYes, yes!§!\n\nThese barely perceptible tiny people crawled upon the ground, kissing and licking the sweet, soft lips, utterly unaware that a terrifying force was gathering.\n\nThe ground trembled as an immense suction swept in. Many were caught up in the gust and plunged into the chasm between her parting lips, sticking to her teeth, the surface of her tongue, or even sucked deeper inside.\n\n§rAchoo!§!\n\nAurora endured the tickling itch in her nose until she could hold it no longer, managing only a small sneeze.\n\nAn unimaginable blast of air erupted, the violent gale tearing the uninvited, impudent visitors to shreds. Even the lucky survivors were blown deep into the galaxy, embarking on an unforgettable galactic journey.\n\n§rNo one saw that, right?§!\n\nAurora naively hoped no one had noticed her unladylike sneeze, completely oblivious to how conspicuous her colossal body actually was."
