  # §H欧若拉大人，食物已经备好，请用。§!\n\n母舰拉着行星大小的圆碗飘浮在欧若拉面前，里面堆叠起许多与这个碗大小不符的小份食物，还没有培育出巨型蔬果的小人，只能先以这种方式为欧若拉大人提供主食菜品，但在奶油蛋糕之类的面点甜品就没有这方面的烦恼。\n\n表面香气四溢的菜肴遮蔽下，狂热崇拜着欧若拉大人的小人混入碗里的菜叶之中，渴望着能进入精神圣土:欧若拉大人的嘴里，因此这些小人清洗净身体为求不玷污欧若拉大人的嘴，并在制作运输的过程里潜入食物中。\n\n纵使现在防备他们这种人的流程愈加苛刻，但始终做不到完全阻止这种现象。\n\n§r谢谢你们，我要开动了。§!\n\n舰船切断了连接，欧若拉捧起小碗仰头倒入口中，小人也随着稀碎的食物扎入口中。\n\n一小碗的分量很快就全部落入口中，欧若拉合上嘴开始咀嚼，口腔内陷入了黑暗，比城市还宽广的牙齿砸了下来。\n\n落在牙齿上的小人一个个爆开，与菜肴一起被牙齿切割碾碎，血液的铁腥味与香甜的唾液、美味的菜糜混在一起，为这份菜肴增添了一丝鲜甜，接着香舌翻动，将另一片没被咀嚼过的菜肴连同小人送到牙面上。\n\n不断的咀嚼让口腔内的唾液逐渐积蓄，欧若拉合眼饕足地咽下食糜，感受着美食进入咽喉，划过温暖的食道，落入不断蠕动，渴求食物的胃中。\n\n口腔内最后仅在齿根处幸存下几位没有被舌头和牙齿波及的小人，这些小人亲吻牙床赞美着欧若拉大人的仁慈，吞咽起齿缝间的唾液，清理着藏匿在这食物残渣。\n\n具有催情效果的唾液被小人咽入腹中，发酵过有些酸甜的味道侵蚀着小人理智，渐渐的小人们发现自己越来越离不开欧若拉大人的唾液。\n\n可以预见，尽管没有变成食物的小人，也会在这里渐渐失去生为人的尊严，在欧若拉大人的口腔内变成离不开唾液，清理口腔食物残渣的食渣虫。
  gts_aurora.1191.desc: "§HLady Aurora, your food is ready. Please enjoy.§!\\\\n\\\\nA mothership pulls a planet-sized round bowl as it floats before Aurora. Inside are piled many small portions of food whose size does not match the bowl. The tiny people, who have not yet cultivated gigantic vegetables and fruit, can only use this method for now to provide Lady Aurora with staple dishes, though pastries and desserts such as cream cakes do not have this problem.\\\\n\\\\nBeneath the cover of fragrant dishes on the surface, tiny people who fanatically worship Lady Aurora have mixed themselves among the leaves in the bowl, longing to enter the spiritual holy land: Lady Aurora's mouth. For this reason, these tiny people wash their bodies clean so as not to defile Lady Aurora's mouth, then sneak into the food during production and transport.\\\\n\\\\nEven though the procedures for guarding against such people have become increasingly strict, this phenomenon can never be completely stopped.\\\\n\\\\n§rThank you. I'm going to eat now.§!\\\\n\\\\nThe ship cuts the connection. Aurora picks up the small bowl, tilts her head back, and pours it into her mouth. The tiny people plunge into her mouth along with the shredded food.\\\\n\\\\nThe small bowl's contents soon all fall into her mouth. Aurora closes her mouth and begins to chew, and darkness descends inside her oral cavity as teeth broader than cities come smashing down.\\\\n\\\\nThe tiny people who land on the teeth burst one after another. Together with the dishes, they are cut apart and crushed by the teeth. The metallic smell of blood mixes with sweet saliva and delicious mashed food, adding a hint of fresh sweetness to the dish. Then her fragrant tongue turns, sending another piece of unchewed food together with tiny people onto the surface of her teeth.\\\\n\\\\nThe constant chewing gradually accumulates saliva in her mouth. Aurora closes her eyes and swallows the food mash with satisfaction, feeling the delicacy enter her throat, slide down her warm esophagus, and fall into her constantly writhing, food-craving stomach.\\\\n\\\\nIn the end, only a few tiny people survive near the roots of her teeth, untouched by tongue or teeth. These tiny people kiss her gums and praise Lady Aurora's mercy, swallowing saliva from between her teeth and cleaning food residue hidden there.\\\\n\\\\nThe aphrodisiac saliva is swallowed into the tiny people's stomachs, and its fermented, slightly sweet-and-sour taste erodes their reason. Gradually, the tiny people discover that they can no longer live without Lady Aurora's saliva.\\\\n\\\\nIt is foreseeable that even the tiny people who did not become food will gradually lose their dignity as people here, becoming residue-eating bugs inside Lady Aurora's mouth, unable to live without saliva as they clean away food scraps."
  # 最近巨娘狂热崇拜者中，兴起了一场从后庭进入、穿过直肠，在肠道中被消化吸收，变成欧若拉大人身体营养的潮流。\n\n表面上他们宣称，这样可以成为欧若拉大人身体一部分，与欧若拉大人的意念契合，但实际这只是为了满足他们的性欲。\n\n后庭处，欧若拉大人不断开合的菊穴边，这些小人兴奋的聚集到此，他们彼此之间不断讨论着待会的路程，完全没有对最后会死的恐惧。\n\n趁着菊穴收缩又放松的时候，他们一批一批的跃入，扎入到直肠中，等到适应了眼前昏暗的光线小人们看向四周。\n\n周围的环境宽广暗红如同进入到一处新的天地，肠道的肉壁上爬满扭曲横向的褶皱，不断的来回挤压蠕动着，在肉壁的表面一层晶莹的粘液，踩在上面如同行走在发生小幅地震的冰面上，必须匍匐才能较为从容的前进。\n\n小人们感叹还好直肠中没有食物残渣的堆积，不然还未成为欧若拉大人的营养，就被直肠的蠕动抹入排泄物的表面，一起被排出体外。\n\n小人们匍匐着穿过悠长的直肠，翻越过一节节盛有发酵食糜的圆状结肠，在工具的帮助下勉强穿过回盲瓣。\n\n在漫长的时间后小人们到达了此行的终点小肠，这里的肉壁上布满比他们更高大的绒毛，空气中也没有了淡淡的臭味，取而代之的是带有奶油蛋糕的酸味。\n\n§H欧若拉大人今天的甜点原来是奶油蛋糕呀。§!\n\n小人们褪下防护服，赤身裸体的走入绒毛丛中，柔软绒毛刮过皮肤，小人们很快就发现自己的皮肤开始有灼烧感，却又如同梦一般消失不见。\n\n绒毛不断的揉蹭着身体，蠕动的小肠化作来回摇摆温暖的摇篮，小人们感觉眼皮沉重，在这里沉沉睡去失去对外界的感知，做起一个永远不会醒来的美梦。\n\n接着肠液分泌将他们覆盖，毫无知觉的被分解，在美好的梦境中，化作欧罗拉大人的营养。
  gts_aurora.1192.desc: "Recently, among the most fervent admirers of the Giantess, a trend has emerged involving entering through the anus, passing through the rectum, and being digested and absorbed in the intestines to become nourishment for the body of Lady Aurora. \n\nOn the surface, they claim this allows them to become a part of Aurora's body and align with her will, but in reality, it is merely to satisfy their sexual desires. \n\nAt the rear entrance, near Lady Aurora's constantly contracting and relaxing anus, these tiny persons gathered excitedly. They discussed the journey ahead among themselves, completely unafraid of the fact that they would ultimately die. \n\nTaking advantage of the anus's contractions and relaxations, they leaped in batch after batch, plunging into the rectum. Once their eyes had adjusted to the dim light, the tiny persons looked around.\n\nThe surrounding environment was vast and dark red, as if they had entered a whole new world. the intestinal walls were covered with twisted, horizontal folds that constantly squeezed and contracted back and forth. A layer of crystalline mucus coated the surface of the walls; stepping on it felt like walking on ice during a minor earthquake, so they had to crawl on all fours to move forward with relative ease. \n\nThe Tiny people were relieved that there was no accumulation of food residue in the rectum; otherwise, before they could become nourishment for Lady Aurora, they would have been swept to the surface of the excrement by the rectum's peristalsis and expelled from the body along with it. \n\nTiny people crawled through the long rectum, scrambled over one circular segment of the colon after another - each filled with fermenting chyme - and, with the help of their tools, barely managed to pass through the ileocecal valve.\n\nAfter what seemed like an eternity, the tiny people reached the final destination of their journey: the small intestine. Here, the muscular walls were covered with villi taller than they were, and the faint stench in the air had vanished, replaced by the tangy scent of buttercream cake.\n\n§H So Aurora's dessert today is buttercream cake, after all. §!\n\nThe tiny people shed their protective suits and walked naked into the thicket of villi. As the soft villi brushed against their skin, they soon felt a burning sensation - yet it vanished as if in a dream. \n\nThe down continued to rub against their bodies, and their wriggling small intestines transformed into a warm cradle swaying back and forth. The tiny people felt their eyelids grow heavy; here, they entered Slumber, losing all sense of the outside world and drifting into a beautiful dream from which they would never wake. \n\nThen, intestinal secretions covered them, and they were broken down without any awareness. In their beautiful dream, they were transformed into nourishment for Lady Aurora."
  # 自从星球决案颁布之后，欧若拉大人常活动的部位被划上了禁区，而不去这些地方成了居住在身体上人们的共识。\n\n但这也让部分年轻的小人情侣，将去往这些地方视作他们发挥叛逆精神、彻底独立的彰显，同时在这幽会时，那种违背社会规则在生命边缘试探的刺激也让他们欲罢不能。\n\n为了追寻这种刺激，这对小人情侣为此来到了此处。在胸膛砰砰直跳的兴奋中这对小人结束了拥吻，眼神迷离的对视着皆有些意犹未尽，她们已经是第三次来到这里，但之前她们并未前往深处，只敢在外围，只敢在脚背上做。但这样的刺激感现在已经满足不了她们了，她们看向后方，看向如白玉般的脚背前端，五个软糯圆润的脚趾缝间的广阔空间。\n\n女孩子可爱的脚趾缝间看起来就已经很色了，如果在那里做爱只是想想就已经让这对小人面红耳赤头顶冒起蒸汽，在对视的眼神之后，她们明白了对方的意图动身前往了趾缝之间。没用太长时间她们便来到两座有小行星规模的大拇趾与第二趾的缝隙中，来到对他们而言如同乳白的大海上，这里的海面上弥散着一层令人浑身燥热，头脑冲动的淡泊足臭，而且越闻越令人上瘾，恨不得将头埋入趾窝里舔舐汗液，品尝美味的趾肉。\n\n其中一个小人遵循着内心的意愿直接扑倒了对方，用舌头蛮横的敲开对方的口腔蛮横的索取起对方的口津，另一只手也伸到了对方身下开始猛烈的抽插。他们彼此拥抱地翻滚向趾窝深处，她们并不是很担心可能的危险，毕竟前两次做的时候足趾就毫无动静。不断的翻滚中她们身上被涂抹了令人发情的足汗，涂抹上彼此的体液，头脑的昏沉让她们失去对外界的感知，只是狠狠拥抱着，恨不得与彼此融为一体。仅仅又过了一会。意外陡生，两座小行星般的肉墙向着彼此靠拢，而失去理智的小人情侣丝毫不关注彼此之外的动静，依旧机械地用手指在对方下体摆动。\n\n噗叽—— 肉墙贴合在一起，这对小人也愈发紧密地贴合在一起，最终她们如愿的与彼此融为一体，随着足趾的前后揉搓摆动，被均匀的涂平抹开。\n\n§r唔姆——§!\n\n刚刚睡醒的欧若拉，丝毫没有注意到有两个微小的存在，在小脚丫无意识的揉搓下销声匿迹。
  gts_aurora.1193.desc: "Ever since the planetary resolution was issued, the places where Lady Aurora often moves have been marked as forbidden zones, and avoiding these places has become the consensus among the people living on her body.\\\\n\\\\nBut this has also led some young tiny couples to regard going to these places as a demonstration of their rebellious spirit and complete independence. At the same time, during their trysts, the thrill of breaking social rules and testing the edge of life makes them unable to stop.\\\\n\\\\nIn pursuit of this thrill, this tiny couple has come here. In an excitement that makes their chests pound, the two tiny people finish kissing and look at each other with hazy eyes, both still wanting more. This is already their third time coming here, but previously they had not gone deep inside, daring only to stay on the outskirts and do it on the instep. That level of excitement can no longer satisfy them. They look behind them, toward the front of the jade-white instep and the vast spaces between five soft, round toes.\\\\n\\\\nThe spaces between the girl's cute toes already look erotic, and merely imagining making love there makes the tiny couple blush, steam seeming to rise from their heads. After meeting each other's eyes, they understand each other's intent and set out for the spaces between the toes. It does not take long before they arrive in the gap between two asteroid-sized toes, the big toe and the second toe, and reach what to them is like a milky-white sea. A faint foot odor that makes the body burn and the mind impulsive drifts over the surface of this sea, and the more they smell it, the more addictive it becomes, making them long to bury their heads in the toe cleft, lick the sweat, and taste the delicious toe flesh.\\\\n\\\\nOne of the tiny people follows their inner desire and directly tackles the other, using their tongue to force open the other's mouth and roughly claim the other's saliva, while the other hand reac