  # 我们将通过放大技术将鞋子居住站放大到行星大小，获得§Y10个额外区划§!
  gtsra_decision_upgrade_lottieshoes2_effects: "Through enlargement technology, we will enlarge the shoe habitation station to the size of a planet and gain §Y10 additional districts!§!"
