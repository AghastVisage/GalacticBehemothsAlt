  # 鞋垫居住区
  district_shoes_1: "Insole Housing District"
  # 鞋垫居住区
  district_shoes_1_plural: "Insole Housing Districts"
  # 鞋垫上相对平摊的部分十分适于进行建筑开发，很大程度上缓解了帝国范围内的住房问题，大量的鞋内居民同样带来非常旺盛的商业需求。
  district_shoes_1_desc: "The relatively flat areas on the insole are very suitable for construction development, and greatly alleviate the housing problems in the empire. A large number of shoe residents also bring very strong commercial demand."
  # 资源挖掘区
  district_shoes_2: "Resource Extraction District"
  # 资源挖掘区
  district_shoes_2_plural: "Resource Extraction Districts"
  # 鞋垫上的缝隙深处蕴含着大量的矿物资源，这些采矿城镇和资源提取中心一直延伸到鞋垫深处。
  district_shoes_2_desc: "The crevices deep in the insole contain large amounts of mineral resources. These mining towns and resource extraction centers extend deep into the insole."
  # 蒸汽发电区
  district_shoes_3: "Sweat Steam Power District"
  # 蒸汽发电区
  district_shoes_3_plural: "Sweat Steam Power Districts"
  # 巨娘留下了大量的高温汗液，一排排的大型蒸汽发电厂可以利用这些热量生成大量的能源。
  district_shoes_3_desc: "The giantess has left a large amount of high-temperature sweat. A row of large-scale steam power plants can generate a large amount of energy by using this heat."
  # 沃土种植区
  district_shoes_4: "Fertile Soil Cultivation District"
  # 沃土种植区
  district_shoes_4_plural: "Fertile Soil Cultivation Districts"
  # 巨娘的代谢产物是肥力极高的土壤，建立在其上的农耕土地要么用来种庄稼，要么用来放牧动物。
  district_shoes_4_desc: "The metabolic products of the giantess are very fertile soil. The farmland built on it is either used to grow crops or to graze animals."
  # 鞋内研究区
  district_shoes_5: "Shoe Research District"
  # 鞋内研究区
  district_shoes_5_plural: "Shoe Research Districts"
  # 如此巨大的鞋子不论在工程学上还是在物理学上都是一个奇迹，而居住于巨娘的鞋子之中也会对居民们产生巨大的社会学影响。总之，帝国的学者们都希望能在这里进行研究。
  district_shoes_5_desc: "Such a huge shoe is a miracle in engineering and physics. Living in it will also have a huge sociological impact on the residents. In short, the empire's scholars all hope to conduct research here."
  # 鞋内度假区
  district_shoes_6: "Shoe Resort District"
  # 鞋内度假区
  district_shoes_6_plural: "Shoe Resort Districts"
  # 巨娘留下的鞋子吸引了无数慕名而来的游客，这些游客都希望能一睹鞋内世界的风采，感受巨娘的伟大之处！
  district_shoes_6_desc: "The shoes left by the giantess has attracted countless tourists who hope to get a glimpse of the world inside the shoes and feel the greatness of the giantess!"
  # 鞋内工业区
  district_shoes_7: "Shoe Industrial District"
  # 鞋内工业区
  district_shoes_7_plural: "Shoe Industrial Districts"
  # 从巨娘留下的物质中提取出的原材料支撑起这些鞋内工业区，该区划遍布着冶炼设施和工厂，制造出先进的产品。
  district_shoes_7_desc: "The raw materials extracted from giantess' leavings support these shoe industrial districts. This district is covered with smelting facilities and factories that manufacture advanced products."
  # 忆质钻探区
  district_cyrene_shoes_1: "Memory Drilling District"
  # 忆质钻探区
  district_cyrene_shoes_1_plural: "Memory Drilling Districts"
  # 鞋垫四周宏伟如世界之墙般晶莹剔透的鞋面和鞋头是由极度浓厚的忆质凝结而成，通过开采我们得以获取其中封存星球的矿物和一些稀有的水晶。
  district_cyrene_shoes_1_desc: "The magnificent crystal-clear shoe upper and toe cap around the insole, like a wall of the world, are condensed from extremely thick memory substance. Through mining, we can obtain minerals and some rare crystals sealed in the planet inside."
  # 忆质分析所
  district_cyrene_shoes_2: "Memory Analysis Institute"
  # 忆质分析所
  district_cyrene_shoes_2_plural: "Memory Analysis Institutes"
  # 这双鞋子的历史可以追溯到及其久远的过去，甚至于宇宙诞生之前。成立专精忆质分析的工作小组会为我们逐渐揭开记忆的面纱，探寻数千万亿年中粉碎在其上的天体记忆有助于提高我国对物理学的理解。
  district_cyrene_shoes_2_desc: "The history of these shoes can be traced back to the extremely distant past, even before the birth of the universe. Establishing a working group specializing in memory analysis will gradually unveil the veil of memory for us. Exploring the memories of celestial bodies shattered on them over tens of quadrillions of years helps to improve our country's understanding of physics."
  # 爱之圣庭
  district_cyrene_shoes_3: "Sanctuary of Love"
  # 爱之圣庭
  district_cyrene_shoes_3_plural: "Sanctuaries of Love"
  # 鞋子内宜居程度更甚于盖亚星球，大气中弥漫着具有安神舒心效果的清香。经过大气成分分析我们确定这种气味实际上是巨娘残留的足香，这在该殖民地内形成对鞋子主人的崇拜。在气味更浓郁的区域建立圣庭有利于激发民众内心对爱与美好的向往并提升工作效率。
  district_cyrene_shoes_3_desc: "The habitability inside the shoes is even better than Gaia planets. The atmosphere is filled with a fragrance that has a soothing effect. After atmospheric composition analysis, we determined that this scent is actually the residual foot fragrance of the Giantess. This formed worship of the shoe owner within the colony. Establishing a sanctuary in the area with richer scent is conducive to stimulating people's inner yearning for love and beauty and improving work efficiency."
  # 鞋垫矿工
  job_shoe_miner: "Insole Miner"
  # 鞋垫矿工
  job_shoe_miner_plural: "Insole Miners"
  # 这些工人将在广阔的鞋垫上采集足汗结晶，将其加工为矿物和稀有水晶。
  job_shoe_miner_desc: "These workers will collect sweat crystal on the vast insoles and process them into minerals and rare crystals."
  # 鞋垫矿工生产矿物和稀有水晶。
  job_shoe_miner_effect_desc: "Insole miners produce minerals and rare crystals."
  # 足汗蒸汽处理工
  job_shoe_steamer: "Sweat Steam Processor"
  # 足汗蒸汽处理工
  job_shoe_steamer_plural: "Sweat Steam Processors"
  # 身着防护服的技术人员，谨慎的处理这这些高浓度的足汗蒸汽，来为我们的国家提供能源，同时也能获得一些易爆微粒副产物。
  job_shoe_steamer_desc: "Technicians wearing protective suits carefully handle these high concentrations of foot sweat vapor to provide energy to our nation, and also obtain some volatile particle byproducts."
  # 足汗蒸汽处理工生产能量币和易爆微粒。
  job_shoe_steamer_effect_desc: "Sweat Steam Processors produce energy credits and volatile motes."
  # 鞋垫农夫
  job_shoe_farmer: "Insole Farmer"
  # 鞋垫农夫
  job_shoe_farmer_plural: "Insole Farmers"
  # 鞋垫上的代谢残留物，足够肥沃，能孕育出许多口味独特的作物
  job_shoe_farmer_desc: "The metabolic residues on the insole are fertile enough to nurture many unique-tasting crops."
  # 鞋垫农夫生产食物
  job_shoe_farmer_effect_desc: "Insole Farmers produce food."
  # 鞋内研究员
  job_shoe_researcher: "Shoe Researcher"
  # 鞋内研究员
  job_shoe_researcher_plural: "Shoe Researchers"
  # 研究员们没日没夜的在巨娘的鞋子里研究这里的一切。
  job_shoe_researcher_desc: "Researchers are studying everything inside the giantess's shoes day and night."
  # $job_shoe_researcher$消耗£energy£§Y$energy$§!、£consumer_goods£§Y$consumer_goods$§!产出\n£physics£§Y$physics_research$§!\n£society£§Y$society_research$§!\n£engineering£§Y$engineering_research$§!
  job_shoe_researcher_effect_desc: "Shoe Researchers produce research points and unity."
  # 鞋垫导游
  job_shoe_entertainer: "Insole Tour Guide"
  # 鞋垫导游
  job_shoe_entertainer_plural: "Insole Tour Guides"
  # 这些训练有素的接待人员，会带领参观的游客走访鞋内的各处，以领略巨娘的伟大。
  job_shoe_entertainer_desc: "These trained receptionists will lead the visiting tourists to visit different parts of the shoe, so as to appreciate the greatness of the giantess."
  # $job_shoe_entertainer$消耗£consumer_goods£§Y$consumer_goods$§!产出\n£unity£§Y$unity$§!、£amenities£§Y$amenity$§!
  job_shoe_entertainer_effect_desc: "Insole Tour Guides produce unity, population growth and amenities."
  # 鞋内工匠
  job_shoe_artisan: "Shoe Artisan"
  # 鞋内工匠
  job_shoe_artisan_plural: "Shoe Artisans"
  # 工匠们利用这里的环境和特殊原材料，制作着以巨娘鞋子为主题的各种工艺品。
  job_shoe_artisan_desc: "The artisans use the environment and special materials here to produce various handicrafts based on the giantess's shoes."
  # $job_shoe_artisan$消耗£minerals£§Y$minerals$§!产出\n£consumer_goods£§Y$consumer_goods$§!
  job_shoe_artisan_effect_desc: "Shoe Artisans use minerals to produce consumer goods."
  # 鞋内冶金师
  job_shoe_foundry: "Shoe Metallurgist"
  # 鞋内冶金师
  job_shoe_foundry_plural: "Shoe Metallurgists"
  # 技师们在鞋内有着高温蒸汽的区域加工着高强度合金。
  job_shoe_foundry_desc: "Technicians process high-strength alloys in the high-temperature steam areas inside the shoes."
  # $job_shoe_foundry$消耗£minerals£§Y$minerals$§!产出\n£alloys£§Y$alloys$§!
  job_shoe_foundry_effect_desc: "Shoe Metallurgists use minerals to produce alloys."
  # 忆质开采工
  job_cyrene_shoe_miner: "Memory Miner"
  # 忆质开采工
  job_cyrene_shoe_miner_plural: "Memoria Miners"
  # 开采工们在与巨娘脚掌侧面长时间接触理论上相对薄弱的忆质晶壁区域进行破壁开采作业。
  job_cyrene_shoe_desc: "Miners conduct wall-breaking mining operations in the areas of memory crystal walls that are theoretically relatively weak due to long-term contact with the side of the Giantess's foot."
  # 
  job_cyrene_shoe_effect_desc: """"
  # 天体记忆分析员
  job_cyrene_shoe_researcher: "Celestial Memory Analyst"
  # 天体记忆分析员
  job_cyrene_shoe_researcher_plural: "Celestial Memory Analysts"
  # 得益于出色的物理学和星界裂隙研究，分析员可以从一小块忆质晶体内解码其中蕴含某一特定时期的宇宙物理参数与社会集群记忆
  job_cyrene_shoe_researcher_desc: "Thanks to excellent physics and astral rift research, analysts can decode cosmic physical parameters and social cluster memories of a specific period contained in a small piece of memory crystal."
  # 
  job_cyrene_shoe_researcher_effect_desc: """"
  # 爱之祭司
  job_cyrene_shoe_entertainer: "Priest of Love"
  # 爱之祭司
  job_cyrene_shoe_entertainer_plural: "Priests of Love"
  # 如此怡人的生活环境使民众确信鞋子的主人是掌管爱与美好的女神，在充斥女神足香的殿堂内祭司主持赐福祭典，与民众一同饮下从空气中提纯而出浓缩甘甜的女神圣液。
  job_cyrene_shoe_entertainer_desc: "Such a pleasant living environment convinces the people that the owner of the shoes is the goddess in charge of love and beauty. In the hall filled with the goddess's foot fragrance, the priest presides over the blessing ceremony, drinking the concentrated sweet goddess holy liquid purified from the air with the people."
