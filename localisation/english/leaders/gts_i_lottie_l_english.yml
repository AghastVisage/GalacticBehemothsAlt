  # 洛蒂鞋子宜居改良1
  tech_gts_lottie_habitability1: "Lottie Shoe Habitability Improvement 1"
  # 要让鞋子里的居民们明白，她们与致命的太空之间，只是隔着一层*薄薄*的鞋帮而已，要学会珍惜现在的环境！
  tech_gts_lottie_habitability1_desc: "To let the residents in the shoes understand that they are only separated from the deadly vacuum of space by a *thin* shoe upper, they must learn to cherish their current environment!"
  # 洛蒂鞋子宜居改良2
  tech_gts_lottie_habitability2: "Lottie Shoe Habitability Improvement 2"
  # 最新款的除臭剂已经可以净化大部分对身体有害的鞋内气体了，配合上我们新编写的洛蒂主神论教材，全国的人民都会爱上在鞋子里的生活的！
  tech_gts_lottie_habitability2_desc: "The latest deodorants can now purify most of the harmful shoe gases. Coupled with the new Lottie the Archgod textbooks that we have written, the people will love living in the shoes!"
  # 可以通过星球决议改善洛蒂鞋中环境
  tech_gts_lottie_habitability2_effect: "Can improve the environment in Lottie's Shoes through planetary decisions."
