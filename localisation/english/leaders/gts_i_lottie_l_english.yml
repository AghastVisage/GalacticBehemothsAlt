  job_event_stocking_crushed_purge: "Souls Under Lottie's Feet"
  # 洛蒂足下的亡魂
  job_event_stocking_crushed_purge_plural: "Souls Under Lottie's Feet"
  # 这些人口正在被§W洛蒂的白丝大脚§!成片的踩扁，她显然乐在其中！
  job_event_stocking_crushed_purge_desc: "These pops are being flattened in droves by §WLottie's white silk feet§!. She is clearly enjoying herself!"
  # $job_event_stocking_crushed_purge$崗位
  mod_job_event_stocking_crushed_purge_add: "$job_event_stocking_crushed_purge$ job"
  # 丝足祭品
  job_stocking_crushed_purge: "Silk Foot Sacrifice"
  # 丝足祭品
  job_stocking_crushed_purge_plural: "Silk Foot Sacrifices"
  # 这些人口正在被§W巨娘的丝足§!成片的踩扁，这种踩踏游戏让巨娘很开心
  job_stocking_crushed_purge_desc: "These pops are being crushed into flat layers by a §Wgiantess' silk feet§!. This stomping game makes the giantess very happy."
  # $job_stocking_crushed_purge$崗位
  mod_job_stocking_crushed_purge_add: "$job_stocking_crushed_purge$ job"
  # 洛蒂的鞋子
  pc_lottie_shoes: "Lottie's Shoes"
  # 洛蒂脱下的鞋子，放大后被放置在了行星轨道上，广阔的鞋垫上可以容纳大量的人口
  pc_lottie_shoes_desc: "Lottie's discarded shoes, enlarged and placed in orbit of a planet. The spacious insoles can accommodate a large population."
  # 鞋子
  pc_lottie_shoes_adj: "Shoe"
  # 洛蒂的鞋子
  lottie_shoes_station_0: "Lottie's Shoes"
  # 洛蒂鞋内宜居度
  mod_pc_lottie_shoes_habitability: "Shoe Habitability"
  # 洛蒂鞋内偏好
  trait_pc_lottie_shoes_preference: "Shoe Preference"
  # 这个物种能够适应洛蒂鞋内潮湿阴暗的环境，并且进化出了一套鞋内生存之道
  trait_pc_lottie_shoes_preference_desc: "This species is able to adapt to the humid and dim environment inside the shoes, and has evolved a way of life that is suitable for the interior of a shoe."
  # 洛蒂同意我们使用她的鞋子作为居住站，在将其放大之后，我们可以让居民搬入鞋内居住。
  lottie_shoes_station_0_MEGASTRUCTURE_DETAILS: "Lottie agreed that we can use her shoes as a habitation station. After enlarging it, we can allow our inhabitants to dwell inside."
  # 洛蒂的鞋子里有着广阔的空间，洛蒂还会定期重新穿上鞋子，来维持内部大气和稀有资源。
  lottie_shoes_station_0_DESC: "Lottie's shoes have a large interior space. Lottie will also wear the shoes periodically to maintain the internal atmosphere and deposit rare resources."
  # 洛蒂的鞋子
  rp_lottie_shoes_station_1: "Lottie's Shoes"
  # 刚被猫娘脱下的鞋子，鞋内残留的汗雾提供了一些生存环境，但这气味...
  rp_lottie_shoes_station_1_desc: "The shoes just taken off from the cat-girl. The lingering sweat vapor provides some living conditions, but the smell..."
  # 洛蒂的鞋子
  rp_lottie_shoes_station_2: "Lottie's Shoes"
  # 经过大气过滤装置的作用，以及针对殖民者展开的关于洛蒂气味的教育课程，鞋内的居住环境已经堪比天堂了！
  rp_lottie_shoes_station_2_desc: "After the application of the atmospheric filtration device, and educational programs for the colonists about Lottie's scent, the living environment inside the shoes is now comparable to paradise!"
