  # \"那看起来你们不是很愿意帮我解决啊，那我可就要自己来了，不过我看看这次怎么放松下呢\"\n\"唔~\"\n小白悠闲的伸了个懒腰缩小了降临在了首都\n她试探性地抬起小脚，由于这次是缩小了自己的体型，所以也只有这个一个区域遭到了毁坏，即便只是她那一只白皙稚嫩的脚掌，都能覆盖下方几乎整个城市的面积，没有任何的犹豫，似乎早就对自己这一次落足将会造成的灾难有所预感，苏小白就这样落下了她那长达千米的脚掌\n\n\"嗯？\"\n和平时一样，没有任何特别的感觉，苏小白的脚地踩在了地上，将下方被不幸覆盖住的某个不幸城市中的一块区域当场踩平\n\n数万的生命当场当场消亡，死后的灵魂也被吸收进了苏小白的体内，直到最后进入身体的最深处被吸收掉化为其力量的一部分，不过对于这一切的始作俑者，对此的反应却反倒冷淡至极\n\n毕竟对她来说，自己只不过是再平常不过的落脚而已，至于地上那些小到可怜的城市，以及里面那些堪比小石子的建筑，则是由于太过弱小而被她不幸踩平碾碎了而已\n\n\"天啊快想想办法阻止她\"\n片刻之后，苏小白再次抬起她那摧毁了整座城区的脚掌，与想象中大致相同，直到刚刚还分布着一片繁荣城市的大地，现如今只剩下一个深深镌刻进大地的脚印\n\n整个繁荣的城区在毫无感知的情况下被夷为平地，不仅如此，在将那寸土寸金的首都城区当中所有高楼、所有建筑全都抹平之后，她脚上依旧是没穿任何鞋子，大地本身也一同碾碎，直至形成了现在所看到的这一个超巨大脚印\n\n已经化作烂泥的城市，被生硬地挤出她落足之处的土地，在她的脚印附近形成了一座壮观的环形山脉，不幸的是，正巧有好几座城镇分布在这环形山脉形成的土地上，而那些可怜的人们，就这样随同整座城镇消失殆尽了\n\n在对这座大型城市进行了一些踩踏后，苏小白的身影消失在了星球表面，从新出现在了首都外的太空中\n\"简单的脚底按摩结束了，希望下次你们会同意我的请求\"
  gts_suxiaobai.201.desc: "\"It seems you are not very willing to help me solve it. Then I'll have to do it myself. But let me see how to relax this time.\"\n\"Mmm~\"\nXiaobai stretched lazily, shrunk, and descended on the capital.\nShe tentatively lifted her small foot. Since she shrunk her body size this time, only this one area was destroyed. Even if it was just her white and tender sole, it could cover almost the entire area of the city below. Without any hesitation, as if she had already had a premonition of the disaster her landing would cause, Su Xiaobai dropped her thousand-meter-long foot just like that.\n\n\"Hmm?\"\nJust like usual, without any special feeling, Su Xiaobai's sole stepped on the ground, flattening an area in an unfortunate city covered below on the spot.\n\nTens of thousands of lives perished on the spot. Even the souls after death were absorbed into Su Xiaobai's body until they entered the deepest part of her body and were absorbed into part of her power. However, the initiator of all this reacted extremely coldly to this.\n\nAfter all, for her, it was just a very ordinary foothold. As for those pitiably small cities on the ground and the buildings comparable to small stones inside, they were unfortunately trampled flat and crushed by her because they were too weak.\n\n\"God, think of a way to stop her.\"\nA moment later, Su Xiaobai lifted her foot again, which had destroyed the entire urban area. Roughly the same as imagined, the land that was distributed with a prosperous city just now, now only had a footprint deeply engraved into the earth remaining.\n\nThe entire prosperous urban area was razed to the ground without any perception. Not only that, after flattening all high-rise buildings and all buildings in that inch-of-gold capital urban area, she still didn't wear any shoes on her feet, and the earth itself was crushed together until this super huge footprint seen now was formed.\n\nThe city that had turned into mud was stiffly squee