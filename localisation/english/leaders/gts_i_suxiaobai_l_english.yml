  gts_suxiaobai.51.desc: ""To express its deep admiration and gratitude toward Su Xiaobai, the Empire made a decision unanimously approved by the entire nation. They voluntarily offered [event_target:gts_suxiaobai_gift_planet.GetName] in its entirety to Su Xiaobai as a toy. This planet boasts a beautiful environment, its surface covered with azure oceans and crystalline continents. The Empire formally submitted a request to Su Xiaobai via communication: \"Your Highness Xiaobai, should you ever feel bored, please feel free to use (Planet Name) as your toy. All citizens of this planet consider it an honor to be at your mercy.\" \" When the news reached (Planet of Choice), a grand nationwide referendum was held across the entire planet. The proposal passed with a 99.97% approval rating. The planet's residents were thrilled and proud; during a global live broadcast, they shouted, \"It is our greatest honor to be used by Her Highness Xiaobai for her physical pleasure!\" The planetary government even organized several celebratory ceremonies in advance, and everyone awaited the arrival of the giant, silver-haired, fox-eared maiden with reverence and joy. Soon after, Su Xiaobai arrived. Her massive form, which obscured the sky, gently hovered above the planet. Her dazzling long silver hair cascaded like the Milky Way; the fluffy white fox ears atop her head quivered gently; her bare feet rested casually in the void, her toes slightly curled, clearly surprised and delighted by this gift. \"Wow... so this time you've given me a planet with people on it to play with?\" Su Xiaobai laughed softly, her voice tinged with a joyful tremor. \"Are you really willing to do this?\" Cheers from billions of people across the entire planet rang out simultaneously, transmitted directly into her consciousness through divine perception: \"We're willing! Please, Your Highness Xiaobai, use us as you please!\" Su Xiaobai's eyes curved into crescent moons, and her fox ears twitched contentedly. She slowly parted her long, slender legs, her bare feet gently tapping the void as she settled into the most comfortable position. Her long silver hair cascaded across her chest, swaying gently with her movements. She carefully pinched the planet between two fingers. It spun slowly at her fingertips, its atmosphere growing slightly warm from her body heat. The planet's inhabitants, looking through their windows and up at the sky, saw that enormous, gentle face and those adorable, twitching fox ears, and were all filled with excitement and happiness. Su Xiaobai slowly moved the planet toward her lower body; her large, pink, and moist labia had already parted slightly. She rubbed it gently a few times, allowing her Love fluid to coat the planet's surface evenly, then aligned it with her opening and, bit by bit, slid the entire planet inside her. \"Mmm... This is amazing... The people on the planet actually volunteered...\" she murmured softly, her voice sweet and satisfied. The planet was slowly enveloped by her soft, warm, and moist vaginal flesh; the continents and oceans on its surface gently rubbed against her sensitive inner walls, and every slight thrust drew a sigh of pleasure from her. The people on the planet felt themselves surrounded by warm, moist flesh, yet they felt no fear whatsoever; instead, they cheered as one. Some shouted from the streets, \"We are serving Her Highness Xiaobai!\" Countless others were so moved by this sacred contact that they wept with emotion. Su Xiaobai began to move in and out slowly. She used her fingers to gently guide the planet as it rotated and slid in and out of her vagina. Her bare feet curled and relaxed unconsciously in the void, her toes splayed, and her long hair flew wildly. Her breathing grew increasingly rapid, and her fox ears perked up excitedly before drooping again. \"Ah... deeper... you guys are amazing... you're making me feel so good...\" She gradually picked up the pace, thoroughly playing with the entire pl