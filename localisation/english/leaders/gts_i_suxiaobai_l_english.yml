  gts_suxiaobai.21.desc: ""After the Supreme Magistrate nodded in agreement, saying, \"Go ahead, do as you please\" - \"Hehe~ Thanks a lot~\" - Su Xiaobai's eyes lit up, and her smile grew even sweeter - and more devious. She immediately cast a spell, instantly shrinking [event_target:gts_suxiaobai_guest.GetName]'s body to less than ten centimeters tall, then gently pinched him between two slender yet enormous fingers and lifted him up to her eyes. \"I've decided it's you~ You look like the perfect toy. \" With that, she vanished from the conference hall and reappeared shortly afterward on the outskirts of the imperial capital. She first placed the tiny [event_target:gts_suxiaobai_guest.GetName] in the palm of her hand to play with for a moment, then, under the gaze of citizens from around the globe, slowly parted her long, slender legs. Her long silver hair cascaded down onto her chest. She leaned back slightly, and with her other hand, gently parted her pink, moist labia, revealing the slightly contracted, glistening, and slippery opening within. \"Come on~ Be a good boy and slide inside to be my toy.\" Her Highness Xiaobai guided [event_target:gts_suxiaobai_guest.GetName] toward her already wet and warm opening and slowly slid it inside. The warm, soft, and incredibly elastic vaginal flesh immediately wrapped tightly around [event_target:gts_suxiaobai_guest.GetName], with layer upon layer of folds greedily writhing and sucking at his body. \"Mmm... this is so fun...\" She pressed two fingers gently against his body, treating him like a living dildo, and began to slowly thrust him in and out of her vagina. At times she thrust deeply into her most sensitive spot; at other times, she pulled him out almost all the way before thrusting him back in forcefully. With every thrust, crystal-clear love fluid was drawn out; in the live stream broadcast across the capital, one could even see the lewd threads of moisture trailing from His Highness Xiaobai's lower body. She gra