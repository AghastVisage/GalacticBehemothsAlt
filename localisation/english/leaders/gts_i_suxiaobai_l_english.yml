  gts_suxiaobai.107.desc: ""With the assistance of Her Highness Xiao Bai, the Empire successfully captured the enemy's colonial planet. Under the command of the Imperial Fleet and Her Highness Xiao Bai, the planet's defenses completely collapsed, and the remaining enemy forces surrendered in their entirety. The Empire's high command swiftly convened a meeting and unanimously passed a resolution to present the entire planet to Su Xiaobai as her newest toy. The Empire extended a formal invitation to Su Xiaobai: \"Princess Xiaobai, this recently conquered enemy colony planet is your spoils of war. Please feel free to use it as a toy; we hope it brings you pleasure.\" Su Xiaobai soon arrived in high spirits. Her massive form, large enough to block out the sun, hovered above the planet. Her long silver hair cascaded down like a galactic waterfall, and the fluffy white fox ears atop her head quivered excitedly. Barefoot, she casually stepped into the void, her toes slightly curled - clearly very pleased with this gift. \"Oh my~ Are you giving me the enemy's entire planet as a toy?\" Su Xiaobai laughed softly, her voice brimming with playful glee. \"Well, I won't hold back then - I've actually been wanting to try out the back part.\" \"The Imperial fleet had retreated entirely to a safe viewing distance, and the planet's inhabitants - whether natives or surrendered enemy personnel - could only look up at the giant, silver-haired figure obscuring the sky. Su Xiaobai slowly turned around, her long silver hair cascading down to her waist. She bent forward slightly, using both hands to gently part her full, rounded buttocks, revealing her huge, pink, soft, and slightly contracted anus. \"Then I'll use this to swallow you all up~\" She first gently massaged her anus with her fingers, allowing it to gradually relax and become moist. Then, adjusting her posture, she slowly aligned the planet with her slightly parted anus. \"Mmm... just right... take it slow...\" Su Xiaobai murmur