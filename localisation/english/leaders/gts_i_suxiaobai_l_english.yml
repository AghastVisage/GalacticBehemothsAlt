  # 苏小白
  NAME_gts_suxiaobai: "Su Xiaobai"
  # 一位穿越无数宇宙的九尾狐神。如今显露的天体级身形，也只是为了进入这个宇宙而缩小后的模样。
  DESC_gts_suxiaobai: "A nine-tailed fox who has traveled through countless universes and calls herself the Fox God. Her wisdom and mysterious powers indeed prove her formidable strength" # "一位穿越无数宇宙自称为狐神的九尾狐，拥有的智慧和神秘力量确实证明了其强大的实力"
  # 欢迎你们的小白殿下吧～
  gts_suxiaobai_catch_phrase: "Happy cooperation~" # "合作愉快哦~"
  # 遗落之环
  NAME_gts_suxiaobai_ring_system: ""The Lost Ring""
