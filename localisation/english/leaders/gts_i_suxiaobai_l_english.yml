  gts_suxiaobai.105.desc: ""With the assistance of Her Highness Xiao Bai, the Empire successfully conquered the enemy's colonial planet. The Supreme Governing Council swiftly decided to present the entire planet to Her Highness as a trophy of war, and the Empire extended an invitation with the utmost reverence: \" 'Princess Xiao Bai, we have unanimously decided to present this recently conquered enemy planet to you. We hope it will serve as a delicious meal for you.' Su Xiaobai soon arrived in high spirits. Her enormous form, which blocked out the sky, appeared above the planet. \"Wow~ Are you giving me this whole planet to eat~\" Su Xiaobai's eyes curved into crescent moons as she laughed softly, her voice sweet and cheerful. \"Then I'm really going to dig in. A little planet like this should taste delicious.\" After the Imperial fleet had fully retreated to a safe distance, The planet's inhabitants looked up at the sky in terror and helplessness as the colossal shadow that obscured everything slowly lowered its head. Su Xiaobai first stuck out her pink tongue and gently licked the planet's surface. The scorching tip of her tongue swept across continents and oceans, stirring up massive tides and storms. She narrowed her eyes contentedly, her fox ears twitching. \"Hmm... it has a very unique flavor - not bad at all~\" Xiaobai opened her little mouth, and her soft, pink lips slowly enveloped the entire planet. The planet's surface was instantly enveloped by her warm, moist mouth, and saliva surged forth like a flood. Su Xiaobai sucked gently, as if savoring a gigantic piece of candy, her tongue deftly swirling around the planet, making it roll and rub against the inside of her mouth. \"Mmm... this is so fun... It feels so good under my tongue...\" After playing with it for a while, she tilted her head back, her throat gently contracting. With a satisfied gulp - gulp - the entire planet was effortlessly swallowed into her esophagus, slowly sliding down her soft, tight