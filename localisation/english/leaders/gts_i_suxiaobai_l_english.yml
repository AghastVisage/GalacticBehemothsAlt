  # 神明的遗物
  gts_suxiaobai_ring_site: ""Relics of the Gods""
  # 一枚横跨星系的银灰色巨环，其自我修复的外壳与不属于这个宇宙的能量规律，正等待科考队揭示。
  gts_suxiaobai_ring_site_desc: ""A massive silver-gray ring spanning the galaxy, with its self-repairing outer shell and energy laws that defy the laws of this universe, awaits discovery by the scientific expedition.""
  # 完成\"趾环上的异常脉动\"异常调查，即可直接发现考古遗址。完成三章考古后即可招募苏小白。
  gts_suxiaobai_claim_ring: ""Complete the \"Unusual Pulsations on the Toe Ring\" mystery to discover the archaeological site directly. After completing the archaeological missions in Chapter 3, you can recruit Su Xiaobai.""
  # 趾环上的异常脉动
  gts_suxiaobai_ring_anomaly: ""Abnormal Pulsations in the Toe Ring""
  # 对狐神趾环 A 区段的扫描发现了一组规律性的微弱脉动。信号似乎来自环体表面不断自我修复的纹路，其能量特征无法用现有理论解释。需要由科学家带领科研船进一步调查。
  gts_suxiaobai_ring_anomaly_desc: ""A scan of Section A of the Fox God's Toe Ring revealed a series of regular, faint pulsations. The signal appears to originate from patterns on the ring's surface that are constantly self-repairing, and its energy characteristics cannot be explained by existing theories. Further investigation by scientists aboard a research vessel is required.""
  # 遗落的巨环
  gts_suxiaobai.901.name: ""The Lost Giant Ring""
  # 科研船在调查狐神趾环 A 区段时，发现了来自环体表面的异常脉动。进一步的观测表明，眼前这个庞然大物无法用现有理论解释。它是一枚\"戒指\"。一枚漂浮在星际虚空中的巨型圆环。其直径跨越整整一片星系的尺度，环身厚度相当于数千个恒星系并排，整体呈现出近乎完美的圆形轮廓。在探测器传回的高分辨率影像中，它的外表面如抛光过一样，却又在特定角度下反射出冰冷而深邃的金属光泽。没有明显的推进痕迹，没有能量溢出，也没有已知的自然天体形成机制能够解释它的存在。它就像是一枚被某位神明遗落在宇宙间的戒指，静静地悬停在帝国的边疆之外。我们的科学家初步分析显示，这个巨环并非由普通物质构成。其环体内部的引力场呈现出高度规则的扭曲，部分区域甚至出现了局部时空稳定现象，仿佛有人在用整个星系的尺度，强行\"固定\"了一段空间。更令人不安的是：环的中心空洞处空无一物，却能清晰观测到对侧遥远星域的景象 -  - 就像一扇被打开的窗户，连接着我们从未涉足过的未知区域。我们的部分学者认为，这可能是一座已经废弃的戴森环、曲率航道稳定器，甚至是某个早已消逝的超级文明留下的\"超级星门\"残骸。也有极端派系警告，这或许根本不是\"遗迹\"，而是一枚仍在等待主人的\"戒指\"。帝国最优秀的探险家、理论物理学家和异星学家已经着手开始准备研究了。目前，探测器仍在持续传回数据。最新一组影像显示，当我们的探测器尝试靠近环体表面时，环身局部出现了极其微弱的脉动光纹 -  - 像心跳，又像......苏醒的征兆。\n\n整个帝国都在屏息等待。这枚漂浮在帝国疆域附近的巨型戒指，究竟是无主之宝、还是远古文明的见证，我们很快就会知道答案。
  gts_suxiaobai.901.desc: ""While surveying Section A of the Fox God's Toe Ring, a research vessel detected anomalous pulsations emanating from the ring's surface. Further observations revealed that this colossal structure could not be explained by existing theories. It was a \"ring.\" A gigantic ring floating in the interstellar void. Its diameter spans the scale of an entire galaxy, its thickness equivalent to thousands of star systems lined up side by side, and its overall shape forms a nearly perfect circular outline. In the high-resolution images transmitted by the probe, its outer surface appears polished, yet at certain angles, it reflects a cold and profound metallic luster. There are no obvious signs of propulsion, no energy leakage, and no known natural celestial formation mechanism that can explain its existence. It is like a ring lost in the cosmos by some deity, hovering silently beyond the Empire's frontiers. Preliminary analysis by our scientists indicates that this giant ring is not composed of ordinary matter. The gravitational field within the ring exhibits highly regular distortions, and in some areas, localized phenomena of spatiotemporal stability have even appeared - as if someone were forcibly \"fixing\" a segment of space on a galactic scale. Even more unsettling is this: though the ring's central void is completely empty, we can clearly observe scenes from a distant star system on the opposite side - as if it were an open window connecting to an unknown region we have never set foot in. Some of our scholars believe this may be an abandoned Dyson ring, a curvature channel stabilizer, or even the wreckage of a \"super stargate\" left behind by a long-vanished supercivilization. Others, however, warn that this may not be a \"ruin\" at all, but rather a \"ring\" still awaiting its master. The Empire's finest explorers, theoretical physicists, and exo-scientists have already begun preparing for research. Currently, the probe continues to transmit data. The latest set of images shows that as our probes attempted to approach the ring's surface, extremely faint pulsating light patterns appeared in certain sections of the ring - like a heartbeat, or perhaps... a sign of awakening.\n\nThe entire Empire is holding its breath in anticipation. We will soon know the answer: Is this gigantic ring floating near the Empire's borders an ownerless treasure, or a testament to an ancient civilization?""
  # 让探测小队登陆发掘一下有用的信息。
  gts_suxiaobai.901.a: ""Have the reconnaissance team land and gather some useful information.""
  # 会自我修复的环体
  gts_suxiaobai.910.name: ""A Self-Healing Ring-Shaped Structure""
  # 接触小组乘坐探测艇，缓缓靠近趾环外表面。随着距离拉近，环体表面的淡金色光纹逐渐清晰起来，像沉睡已久的脉搏，正随着他们的接近而微微加快。探测艇悬停在环体上方。工程船降落后，尝试采集样本。那外壳坚硬得超乎想象，几乎无法切取。可当他们费尽一切手段终于取下一小块碎片时，环体表面竟像活物一般流动愈合，转眼间又恢复如初了。更令人不安的是，那块被带回的样本在探测艇内依然沉默着没有任何可探测的能量，但却让周围的空气变得沉重起来，仿佛带着某种超越物质的威严。科考队随后将目光转向趾环巨大的内侧空洞。透过那空洞望去，对侧的星域清晰可见，却呈现出完全陌生的星辰排列与色彩。那不是简单的空间通道，更像是一扇被强行撕开的\"窗户\"，连接着另一个未知的、或许完全不同的空间。当探测艇小心翼翼地接近空洞边缘时，环体表面骤然浮现出大片复杂而美丽的符文纹路。那些符号既非人类文字，也不是任何已知文明的产物，却带着近乎完美的神性对称。光纹的脉动越来越明显，像一颗正在缓缓苏醒的心脏。首席解译专家的声音微微发颤：\"它......在回应我们。它知道我们来了。\"首席科学家在旗舰上看着这一幕，眼神复杂地低语：\"如果这真是一枚属于神明的趾环......那我们现在触碰的，或许只是它的一小部分。\"整个科考队都笼罩在一种混合着敬畏、兴奋与隐隐恐惧的情绪中。这枚漂浮在帝国边疆之外的巨型趾环，远比任何人最初想象的更加古老、更加神圣，也更加危险。而他们，才刚刚触碰到它的边缘。
  gts_suxiaobai.910.desc: ""The contact team boarded the exploration craft and slowly approached the outer surface of the Toe Ring. As they drew closer, the pale golden patterns on the Toe Ring's surface gradually became clearer, like a pulse that had been in slumber for a long time and was slightly quickening with their approach. The probe hovered above the ring. After the engineering vessel landed, the crew attempted to collect a sample. The outer shell was harder than they could have imagined, making it nearly impossible to cut into. Yet when, after exhausting every possible method, they finally managed to pry off a small fragment, the ring's surface flowed and healed as if it were a living thing, restoring itself to its original state in the blink of an eye. Even more unsettling was that the sample they had brought back remained silent inside the probe, emitting no detectable energy, yet it made the surrounding air feel heavy, as if imbued with a majesty that transcended the material world. The scientific expedition then turned its attention to the massive inner cavity of the Toe Ring. Looking through the cavity, the starfield on the opposite side was clearly visible, yet it displayed a completely unfamiliar arrangement of stars and colors. This was not a simple spatial passage; it resembled a \"window\" that had been forcibly torn open, connecting to another unknown - and perhaps entirely different - space. As the probe cautiously approached the edge of the cavity, vast patterns of intricate and beautiful runes suddenly emerged on the surface of the ring. These symbols were neither human script nor the product of any known civilization, yet they possessed an almost perfect, divine symmetry. The pulsation of the light patterns grew increasingly pronounced, like a heart slowly awakening. The chief interpreter's voice trembled slightly: \"It... is responding to us. It knows we've arrived.\" Watching the scene from the flagship, the chief scientist murmured with a complex expression: \"If this truly is a Toe Ring belonging to a deity... then what we are now touching may be only a small part of it.\" \" The entire scientific expedition was enveloped in a mixture of awe, excitement, and a vague sense of fear. This gigantic Toe Ring, floating beyond the Empire's borders, was far older, far more sacred, and far more dangerous than anyone had initially imagined. And they had only just touched its edge.""
  # 我们就快接近答案了。
  gts_suxiaobai.910.a: ""We're getting close to the answer.""
  # 虚空中的来客
  gts_suxiaobai.911.name: ""Visitors from the Void""
  # 就在科考队还在小心翼翼的探索趾环时，旁边的虚空毫无征兆地被撕裂开来。一道巨大的身影从裂隙中骤然出现。那是一位有着一头主体为银白、发梢晕染着樱花粉的长发，头顶竖着两只毛茸茸的狐耳，身后摇曳着九条优雅而华丽的银白色尾巴，每一条尾巴的末端都带着淡淡的樱花粉色的 maiden。她赤足踏在虚空中，整个人散发着超脱一切的神性与慵懒的气质，仿佛从古老传说中直接走出的九尾狐。她的出现，让整个空间都静止了下来。当 maiden完全走出裂隙、安静地悬停在巨型趾环旁时，舰队瞬间陷入了死一般的瘫痪。所有靠近她的战舰同时失去动力，主引擎、备用能源、武器系统、通讯设备全部失效。数百艘舰船如同被无形的力量冻结，静静漂浮在太空中，只能勉强维持生命系统。探测仪器上依旧读不到任何能量数据，仿佛她的存在本身就超越了这个宇宙的规则。旗舰指挥厅内，所有屏幕闪烁着无意义的警告，却无法给出任何解释。
  gts_suxiaobai.911.desc: ""Just as the scientific expedition team was cautiously exploring the Toe Ring, the void beside them suddenly ripped open without warning. A massive figure abruptly emerged from the rift. It was a young girl with long hair - silver-white at the roots and tinged with cherry blossom pink at the tips - two fluffy fox ears standing upright on her head, with nine elegant and magnificent silvery-white tails swaying behind her, each tail's tip tinged with a faint cherry blossom pink. Barefoot upon the void, she exuded a divine and languid aura that transcended all things, as if she were a nine-tailed fox stepping directly out of an ancient legend. Her appearance brought the entire space to a standstill. When the young woman fully emerged from the rift and hovered silently beside the giant Toe Ring, the fleet instantly fell into a deathly paralysis. All warships near her simultaneously lost power; their main engines, backup power sources, weapon systems, and communication equipment all failed. Hundreds of ships, as if frozen by an invisible force, floated motionlessly in space, barely able to sustain their life support systems. The sensors still registered no energy readings whatsoever, as if her very existence transcended the laws of this universe. In the flagship's command center, every screen flashed with meaningless warnings, yet none could offer an explanation.""
  # 到底发生了什么？
  gts_suxiaobai.911.a: ""What exactly happened?""
  # 趾环的主人
  gts_suxiaobai.912.name: ""The Owner of the Toe Ring""
  #  maiden微微侧头，猩红的竖瞳扫过整个瘫痪的科研舰队，嘴角勾起一丝玩味的笑意。她的声音直接在每一个人脑海中响起，柔美却带着不容抗拒的威严：\"渺小又好奇的小家伙们......你们竟然敢碰我的东西。\"首席科学家强忍着内心的震撼与恐惧，深吸一口气，通过勉强建立的紧急通讯频道回应道：\"尊敬的存在......请问您是谁？这座巨型建筑是......\" maiden轻笑一声，九条尾巴优雅地舒展。她轻轻抬起一只赤足，放在那横跨星系的银灰色巨环边上。就在这一刻，所有人才彻底明白 -  - 他们视为星系级遗迹的巨构，其实只是眼前这位九尾狐 maiden脚趾上佩戴的一枚普通饰品。\n\n\"我叫苏小白，你们可以称呼我小白殿下，我也是那枚戒指的主人。\" maiden语气随意，\"这只是枚对我来说很普通的趾环，它是我朋友背着我偷偷放在这里的。没想到会被你们这些小东西发现，还兴师动众地跑来探索。\"她低头欣赏了一下自己脚上的趾环，随后目光重新落回舰队，笑意更深：\"既然你们这么有勇气，又让我感到了一点久违的乐趣......那我就给自己找点消遣吧。\"\"我决定，加入你们这个小小的帝国。\" maiden赤足在虚空中轻轻一点，趾环从新佩戴在了她的脚趾上，她九条尾巴在身后轻轻摆动：\"当然，我喜欢给自己找些会开心的事情做。谁要是敢欺负我看中的小家伙，我就替你们踩扁他们。\"她微微歪头，眼睛弯成月牙：\"怎么样？欢迎我吗？\"看着眼前这位神明般的 maiden，舰队中的所有人缓缓行气了帝国最高礼节。
  gts_suxiaobai.912.desc: ""The young girl tilted her head slightly, her crimson vertical pupils sweeping over the entire paralyzed research fleet, a playful smile curving her lips. Her voice resonated directly within everyone's minds - soft yet imbued with an authority that commanded obedience: \"You insignificant, curious little creatures... How dare you touch my belongings.\" \" The chief scientist, struggling to suppress his inner shock and fear, took a deep breath and replied through a hastily established emergency communication channel: \"Honored Being... May I ask who you are? And what is this colossal structure...?\" The girl let out a soft chuckle as her nine tails unfurled gracefully. She gently lifted a bare foot and placed it on the edge of the massive silver-gray ring that spanned the galaxy. At that very moment, everyone finally understood - the colossal structure they had regarded as a galactic-scale relic was, in fact, nothing more than an ordinary ornament worn on the toe of this nine-tailed fox girl standing before them. \n\n\"My name is Su Xiaobai. You may call me Her Highness Xiaobai. I am also the owner of that ring,\" the girl said casually. \"To me, it's just an ordinary Toe Ring - my friend secretly placed it here behind my back. I didn't expect you little creatures to discover it and make such a big fuss about coming here to explore.\" She looked down to admire the Toe Ring on her foot, then turned her gaze back to the fleet, her smile deepening. \"Since you're so brave and have given me a bit of long-lost fun... I suppose I'll find myself some entertainment. \"I've decided to join your little empire.\" The girl tapped her bare foot lightly in the void, and the Toe Ring slipped back onto her toe; her nine tails swayed gently behind her. \"Of course, I like to find things that bring me joy. \"If anyone dares to bully the little ones I've taken a liking to, I'll crush them for you.\" She tilted her head slightly, her eyes curving into crescent moons: \"So? Do you welcome me?\" Gazing at the goddess-like girl before them, everyone in the fleet slowly performed the Empire's highest ceremonial salute.""
  # 欢迎您的到来，小白殿下！
  gts_suxiaobai.912.a: ""Welcome, Your Highness Xiaobai!""
  # 苏小白
  gts_suxiaobai.999.name: "Su Xiaobai"
  # 她留下了一枚能够自我修复的趾环副本，供我们居住与研究。九条银白色的尾巴轻轻摆动，她正等待我们的欢迎。
  gts_suxiaobai.999.desc: "Hello, little ones. What is your purpose in going to such lengths to establish contact with me? Do you seek my help, or wish to pry into my secrets? Or perhaps..." # "你们好小家伙们，你们费劲的想要与我建立联系的目的是什么呢？是想寻求我的帮助，还是窥探我的秘密？又或者是..."
  # 请问您是最大的体型就是现在这样了吗？
  gts_suxiaobai.999.a: "We want to understand an existence like yours" # "我们想了解您这样的存在"
  # 并不是，我真正的体型不是你们这渺小的宇宙可以容纳的，你们的宇宙于我而言跟灰尘没什么两样，至于这枚趾环为什么会在这，只是我某位恶趣味的朋友把他缩小了带过来丢在这的。
  gts_suxiaobai.999.a.response: "Don't be afraid or nervous, I won't hurt you. My name is Su Xiaobai. I just happened to travel to this plane for entertainment. Of course, what you see is not my maximum form; this tiny universe cannot bear my true size. As for whether I stay to help you, that depends on what value you can offer me.\n\n§LAlthough Su Xiaobai's tone is lazy, a hint of playfulness can be seen in her eyes.§!\n\nSomething novel that interests me, or perhaps~\n(Su Xiaobai signals with her eyes towards the planet filled with crystal clear liquid behind her)"  # "不用害怕也不用紧张，我并不会伤害你们，我名为苏小白，我只是碰巧穿越到了这个位面进行娱乐的，当然你们所见到的也不是我的最大形态这颗渺小的宇宙无法承载我真实的大小，至于要不要留下帮你们之类的就要看你们能为我提供一些什么价值了\n\n§L虽然苏小白的语气是慵懒的，但是可以看得出来她的眼神中带着几分玩味§!\n\n能让我提起兴趣的新奇玩意儿，又或者说～\n(说着苏小白用眼神示意了一下后面充满晶莹剔透的液体的星球)"
  # 那座巨型的趾环您会留给我们做研究吗？
  gts_suxiaobai.999.b: "What can you do for us"  # "您能帮我们做些什么"
  # 我已经收回了平时佩戴的趾环。至于现在还留在那里的那个，是我随手做的副本。想研究就去吧，以前也有不少宇宙文明居住在上面。你们也可以尝试居住或开采资源，不必担心损坏，它会自我修复。
