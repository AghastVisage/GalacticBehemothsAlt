  # 二期科研工程竣工
  gts_linglu.2007.name: "Second Phase Research Project Completed"
  # 又一年过去，在原有科研大楼的周围又拔地而起了几栋稍矮的大楼，这些大楼辅助着主楼进行各类科研活动，根据统计报告显示最受欢迎的的研究部门是§H\"big and small\"§!，不少人挤破头皮也没能获得面试资格。\n\n在这么多大楼中，一栋标明仅限马娘进入的7号楼格外引人注意，有不少非研究部门的马娘也在此进进出出。而最频繁进出的则是一名穿着尺寸不合身白袍的马娘，据说其经常通过各种途径获得缩小人进行各类惨无人道的研究。\n\n而且周围又多了许许多多一眼就可以认出是供马女人使用的设施，也助长了这颗星球的旅游业。在比赛日有全国各地的人来到赛场，只为亲眼一见巨大马娘之间的比赛。
  gts_linglu.2007.desc: "Another year has passed, and several shorter buildings have sprung up around the original research building. These buildings assist the main building in various research activities. According to the statistics report, the most popular research department is §H \"big and small\" §!, and many people have had to fight tooth and nail to even get an interview. \n\nAmong so many buildings, Building 7, marked as 'Uma Musume Only,' is particularly eye-catching. Many Uma Musume from non-research departments also go in and out. The person who goes in and out most frequently is an Uma Musume wearing an ill-fitting white coat. It is said that she often obtains shrunken people through various means for all sorts of cruel experiments.\n\nMoreover, many more facilities that can be recognized immediately as being for the use of Uma Musume have also been added, which has also boosted the tourism industry of this planet. On race days, people from all over the country come to the track just to witness the races between giant Uma Musume."
  # （我们仍然不知道为什么会需要如此多的缩小人资源）
  gts_linglu.2007.a: "(We still don't know why so many shrunken people are needed.)"
  # 204房间记录
  gts_linglu.2008.name: "Room 0204 Record"
  # 刚刚结束训练的无声铃鹿和特别周一起来到了7号楼的0204房间门口，铃鹿调整了门旁显示器内房间时间流动的速率，从一秒一天改变为实际流动时间。两人脱下鞋子放在门外走进了房间。进入房间后，映入眼帘的是一大片比两位马娘小4000倍的都市群。在铃鹿惊讶这些小人发展速度的同时，早已忍耐不住的特别周率先一步踏入了城市。\n\n两人散发着一丝白色蒸汽的黑丝足与白丝足踩进了城市内，微微酥麻的触感让两人心情舒畅，对两人而言，践踏城市总是会伴随着一丝性兴奋，很快两人的内裤就随着丝足不断的践踏而泛出一丝水渍，脸庞也一点一点红润起来，率先忍不住的铃鹿走到特别周面前，推倒了她。\n\n铃鹿压在特别周身上，用手挖起一片完好的街区压在特别周内裤上揉搓，等完全揉碎在内裤上后再挖起另一片完好的街区。还没等到第四次，就可以看见特别周的内裤与铃鹿手上牵起一座晶莹剔透的爱液桥。看着已经准备就绪，脸色潮红洪水泛滥的特别周，自己也快忍不住的铃鹿与特别周的嘴唇贴在一起，两只巨大的舌头互相交缠，时不时松口喘口气再继续交缠着。而铃鹿的手也没闲着，在热吻的同时悄悄伸进特别周的内裤，爱抚着阴蒂的同时插到穴内扣动起来。 \n\n这个过程持续了几分钟，可对地上的小人来说却如同几个世纪一般难熬，两位马娘微微震动的身躯如同地震一般，周围大量建筑倒塌或是被不经意间的移动压碎，股间流出的爱液溺死许许多多来不及逃跑的小人。但很快这就结束了，敏锐的铃鹿根据特别周身上的种种迹象判断出她即将高潮，娴熟的手法进一步加强了高潮的力度，其喷射出的爱液甚至透过内裤发射向远方，摧毁了几栋倒霉的建筑。\n\n§M\"得让铃鹿也享受一下。\"§!\n\n稍微休息了一下的特别周反压在铃鹿身上，脱下铃鹿的内裤，把一座不知道从哪拔下的圆柱形大楼插进铃鹿同样早已洪水泛滥的穴内。直接顶到宫口的大楼为铃鹿带来了莫大的刺激，突然绷直的双腿推平了大片的城区，微微拱起的腰肢露出身下黄褐色的土地。随着特别周开始抽插手中的大楼，大楼的外壁剐蹭着穴内的褶皱，快感如同波浪一般涌入脊髓直冲大脑，看着如此淫乱的铃鹿，特别周的另一只手又伸到她的胸口，隔着决胜负开始按摩铃鹿的乳头。在上下两侧同时进攻下，很快就将铃鹿推向高潮的边缘，同样敏锐的特别周也发现这一情况，加速了双手上的动作，在即将高潮的前一刻猛地将整栋大楼推进穴内。下一刻高潮降临，穴壁猛地压紧，可怜的大楼与小人根本无法抵挡四周的的穴壁向内带来的压力，一瞬间就被压扁成腔内最初始的形态。气喘吁吁的两人躺在城市废墟中，胯下流出的爱液混合在一起成为了一片巨大的湖泊。\n\n§G\"小特，下次记得先套一层膜再用哦，直接这样插进来之后清理会很麻烦的。\"§!\n\n§M\"嗯，知道了。\"§!\n\n完事后的两人在浴室里互相清理完对方的身体，清理完毕后，铃鹿重新调整房间内时间速度到一秒一天，加速重建的同时等待着下一批马娘的临幸。
  gts_linglu.2008.desc: "Silent Suzuka and Special Week, who had just finished training, arrived at the entrance to Room 0204 on the 7th floor. Suzuka adjusted the speed of the room's time flow shown on the monitor next to the door from one second per day, to real time. The two took off their shoes outside the door and went into the room. Upon entering the room, they saw a vast urban area that was 4000 times smaller than the two Uma Musume. While Suzuka was surprised by the speed of these little people's development, Special Week, who had already lost her patience, was the first to step into the city.\n\nThe two people's black-stockinged feet and white-stockinged feet, emitting a slight white steam, stepped into the city. The slightly tingling sensation made them feel comfortable. For both of them, trampling cities was always accompanied by a hint of sexual excitement. Soon, the two's underwear showed a hint of moisture as they were stomping incessantly, and their faces gradually turned red. Suzuka, who couldn't restrain herself first, walked in front of Special Week and pushed her over. \n\nSuzuka pressed down on Special Week, scooped up a piece of intact street with her hand, and rubbed it on Special Week's underwear. After it was completely crushed into pieces, she then scooped up another intact piece.      before the fourth time, clear liquid could be seen connecting Special Week's underwear and Suzuka's hand as the resulting \"love bridge.\" Seeing Special Week who was ready, with her face flushed red and flooded with desires, Suzuka who was also becoming impatient kissed Special Week's lips, the two giant tongues intertwining, occasionally breaking away to catch their breath before continuing to intertwine. Suzuka's hand was not idle, and while kissing, quietly slipped into Special Week's underwear. While caressing the clitoris, she inserted into the cavity and worked her fingers. \n\nThis process lasted for a few minutes, but to the little people on the ground, it was like centuries of suffering. The slightly shaking bodies of the two Uma Musume were like earthquakes. Many buildings around them collapsed or were crushed by unintentional movements. The love fluids flowing from their crotches drowned many little people who did not have time to escape. But it ended quickly. The keen Suzuka judged from various signs on Special Week's body that she was about to orgasm. Her skillful technique further increased the intensity of the orgasm, and the love fluid she ejected even shot into the distance through her underwear, destroying several unlucky buildings.\n\n§M \"It's time for Suzuka to enjoy herself as well.\"§!\n\nAfter taking a short rest, Special Week turned over, pressing against Suzuka, took off Suzuka's underwear, and inserted a cylindrical building that she had picked up from somewhere into Suzuka's cavity which was also already flooded with desires. The building, which was directly touching the cervix, brought great stimulation to Suzuka. Her legs suddenly tensed, flattening a large area of the district. Her slightly arched waist revealed the yellowish-brown soil underneath her. As Special Week started thrusting the building in her hand, the exterior walls of the building scraped against the folds in the cavity. Pleasure rushed to the brain like a wave. Seeing how lewd Suzuka was, Special Week's other hand reached her chest, starting to massage Suzuka's nipples through the competition uniform. With attacks on both sides, Suzuka was soon pushed to the edge of orgasm. The equally keen Special Week also discovered this, accelerated the movements of both hands, and just before orgasm, pushed the whole building into the cavity. The next moment, orgasm hit. The cavity walls squeezed tightly. The poor building and the little people were no match for the inward pressure from the surrounding walls of the cavity and were instantly crushed back to the original state of the cavity. The two of them, breathing heavily, lay in the