  # 外交总长
  councilor_gts_seele: ""Secretary of State for Foreign Affairs""
  # §B希儿§!全权负责外交事务,在巨大的体型压制下几乎所有外交阻碍都不会存在.\n\n可以替代§Y国务卿§!及同类内阁席位
  councilor_gts_seele_desc: ""§B Seele §! Has full authority over foreign affairs; given her immense stature, virtually all diplomatic obstacles are rendered nonexistent.\n\nCan replace §Y Secretary of State §! and similar cabinet positions""
  # 魇夜星渊
  councilor_gts_seele_li: ""Starchasm Nyx""
  # §R「希儿」§!全权负责军事的管理,无聊时也会亲自参与到这场游戏中.\n\n可以替代§Y国防部长§!及同类内阁席位
  councilor_gts_seele_li_desc: ""§R \"Seele\" §! Has full authority over military affairs and, when bored, will personally participate in this game.\n\nCan replace §Y Minister of Defense §! and similar cabinet positions""
  # E.T studio首席执行官
  councilor_gts_bronya: ""CEO of E.T. Studio""
  # §C布洛妮娅§!是所有研究领域的负责人,由于理之律者的权能,她总能在意想不到的时刻提出更好的方f...\n§C"是最好的方法"§!\n\n可以替代§Y首席科学官§!及同类内阁席位
  councilor_gts_bronya_desc: ""§CBronya§! She is the head of all research fields. Thanks to the powers of the Herrscher of Reason, she is always able to propose better solutions at unexpected moments...\n§C\"That's the best approach\"§!\n\nCan replace §Y Chief Science Officer§! and similar cabinet positions""
