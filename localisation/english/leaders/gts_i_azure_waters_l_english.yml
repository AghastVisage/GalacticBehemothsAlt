  gts_azure_waters.4.b_custom: ""
#  惊喜
  gts_azure_waters.5.name: "Surprise"
#  §B希儿§!将自己的体型压缩到了与感知中布洛妮娅一致的水平，虽然接近极限的缩小带来了些许的不适，但为了给布洛妮娅姐姐一个惊喜，§B希儿§!还是维持这样的体型向她悄悄靠近。\n与此同时，布洛妮娅成为理之律者后也经历了相似的变化，近十万倍的身躯几乎可以无视任何阻拦的生物，游荡在虚无中的量子之影常常在布洛妮娅无意的移动中被粉碎。经过了许久漫无目的的漫游，布洛妮娅突然感到身后出险什么威胁，但转身后却没有发现异常，只是一片照旧的虚无与一些漂浮着的世界泡。还未等布洛妮娅放松警惕，她的眼睛便突然被两只纤细的小手蒙住，感到身后的柔软紧紧贴住自己，便打消了摆脱的念头。\n“姐姐猜猜我是谁。”§B希儿§!悄悄捂住了布洛妮娅的眼睛，身体紧紧贴住她，静静地等待姐姐的回答。“希…§B希儿§!。”听到久违的声音，布洛妮娅不敢相信，难以抑制心中激动。“§B希儿§!终于找到你了，布洛妮娅姐姐。现在，让§B希儿§!带姐姐离开这里吧。”
  gts_azure_waters.5.desc: "§BSeele§! compressed her body to match the size of the Bronya she could sense. Although shrinking so close to her limit brought some discomfort, §BSeele§! still maintained this size and quietly approached her in order to give Sister Bronya a surprise.\\nMeanwhile, after becoming the Herrscher of Reason, Bronya had undergone similar changes. With a body nearly one hundred thousand times larger, she could ignore almost any creature that tried to obstruct her, and the quantum shadows wandering through the void were often crushed by Bronya's unconscious movements. After wandering aimlessly for a very long time, Bronya suddenly felt some threat appear behind her, but when she turned around she saw nothing unusual, only the same void as before and a few floating world bubbles. Before Bronya could lower her guard, her eyes were suddenly covered by two slender little hands. Feeling the softness behind her press tightly against her, she gave up the thought of breaking free.\\n\"Sister, guess who I am.\" §BSeele§! quietly covered Bronya's eyes, pressing her body close against her while silently waiting for her sister's answer. \"See... §BSeele§!.\" Hearing that long-missed voice, Bronya could hardly believe it, and could not suppress the excitement in her heart. \"§BSeele§! finally found you, Sister Bronya. Now, let §BSeele§! take you away from here.\""
