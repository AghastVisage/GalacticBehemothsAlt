#  意外
  gts_azure_waters.7.name: "Accident"
#  经过不知多久的探索，我们得到了许多许多珍贵的数据，但寻找§C布洛妮娅§!依然没有任何进展。在她们打算返回时，「希儿」突然感到了危险的气息，迅速构造出了镰刀准备应对。经过探测，我们也发现了让「希儿」警戒的源头，但认清远处的人影是谁后，她却放松了警惕。\n“姐姐大人，好久不见。”「希儿」将镰刀收起，朝着§C布洛妮娅§!飘去。但§C布洛妮娅§!出乎意料地突然对她发起了攻击，浮游炮的烟尘散去后，「希儿」愤怒地站在那里。“你们先走，我待会就把§C布洛妮娅§!姐～姐～一起带出去。”「希儿」恶狠狠地威胁，我们见状便立即准备撤离……\n在裂隙外联系到希儿后，我们又等待了许久。终于看到「希儿」与§C布洛妮娅§!一同从裂隙中离开，虽然我们没有见到后续，但看到得意洋洋的「希儿」和有些愧疚的§C布洛妮娅§!，我们大概也能猜到发生了什么…
  gts_azure_waters.7.desc: "After exploring for who knows how long, we obtained a great deal of valuable data, but still made no progress in finding §CBronya§!. When they were preparing to return, \"Seele\" suddenly sensed danger and quickly formed a scythe to prepare for it. Through detection, we also discovered the source of \"Seele\"'s vigilance, but once she recognized who the distant figure was, she relaxed.\\n\"Sister, long time no see.\" \"Seele\" put away her scythe and drifted toward §CBronya§!. But §CBronya§! unexpectedly launched an attack on her. After the smoke from the floating cannons dispersed, \"Seele\" stood there in anger. \"You go first. In a little while, I'll bring §CBronya§! sis~ter~ out with me.\" \"Seele\" threatened viciously, and seeing this, we immediately prepared to withdraw...\\nAfter making contact with Seele outside the rift, we waited for a long time. At last, we saw \"Seele\" and §CBronya§! leave the rift together. Although we did not see what happened afterward, seeing the triumphant \"Seele\" and the somewhat guilty §CBronya§!, we could more or less guess what had happened..."
