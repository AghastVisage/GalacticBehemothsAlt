#  §C布洛妮娅§!
  gts_azure_waters.8.name: "§CBronya§!"
#  从量子之海中离开,§C布洛妮娅§!终于找到§B希儿§!.如今她们在这个宇宙中安定下来
  gts_azure_waters.8.desc: "After leaving the Sea of Quanta, §CBronya§! finally found §BSeele§!. Now they have settled down in this universe."
#  与§R希儿§!的关系
  gts_azure_waters.8.c.name: "Relationship with §RSeele§!"
#  她作为§B希儿§!的另一个人格,§C布洛妮娅§!相信她一定不会做危害§B希儿§!的事.我们会一起保护好§B希儿§!的
  gts_azure_waters.8.c.desc: "As §BSeele§!'s other personality, §CBronya§! believes she would never do anything to harm §BSeele§!. We will protect §BSeele§! together."
#  接下来的打算
  gts_azure_waters.8.d.name: "Future Plans"
#  §C布洛妮娅§!会和§B希儿§!呆在这里很长时间,直到找到原本的世界...有什么需要的话就尽管向§C布洛妮娅§!提吧
  gts_azure_waters.8.d.desc: "§CBronya§! will stay here with §BSeele§! for a very long time, until we find our original world... If you need anything, just ask §CBronya§!."
#  你可以做什么
  gts_azure_waters.8.e.name: "What can you do?"
#  §C布洛妮娅§!可以担任许多职位,这就看你的需要了
  gts_azure_waters.8.e.desc: "§CBronya§! can take on many positions. It depends on what you need."
#  量子之海
  gts_azure_waters_rifts_2: "Sea of Quanta"
#  我们对这里目前的了解还过于匮乏,冒进可能带来意想不到的后果,还是从长计议吧
  gts_azure_waters.101.c_custom: "Our current understanding of this place is still far too limited. Acting rashly may bring unexpected consequences, so let us take the long view."
