#  初次进入
  gts_azure_waters.2.name: "First Entry"
#  这处裂隙被破坏后，我们的世界便与量子之海连接了起来，在探清风险之前，最好先跟随希儿她们一同进入。
  gts_azure_waters.2.desc: "After this rift was destroyed, our world became connected to the Sea of Quanta. Before we understand the risks, it would be best to enter alongside Seele and the others."
#  跟随§B希儿§!进入
  gts_azure_waters.2.a: "Enter with §BSeele§!"
#  
  gts_azure_waters.2.a_custom: ""
#  跟随§R「希儿」§!进入
  gts_azure_waters.2.b: "Enter with §R\"Seele\"§!"
#  
  gts_azure_waters.2.b_custom: ""
#  离开
  gts_azure_waters.2.c: "Leave"
#  这里多变的坏境与大量未知生物对我们还是太危险了...让更熟悉的人来领队吧
  gts_azure_waters.2.c_custom: "The shifting environment here and the many unknown creatures are still too dangerous for us... Let someone more familiar with this place lead the way."
#  探索
  gts_azure_waters.3.name: "Exploration"
#  §B希儿§!顺着记忆来到了记忆中的那片区域。自跌入量子之海后，周围逸散的能量便一点点进入了她的身体，似乎她天生便与这里有着某些特殊的亲和。跟随着的科学官尝试接触周边漂浮着的世界泡，但随着距离越来越近，她的体型也不断地变小，漆黑的世界泡仿佛无边无际般扩展开来。注意到这一情况的§B希儿§!无奈地伸出手，将她靠在指尖从世界泡的边缘离开。“想要进入世界泡的话，就会受到它本身规则的影响，所以自己也会被改变。”“诶？你问§B希儿§!为什么没有被影响？大概是因为§B希儿§!和量子之海融为一体？”\n随着体型的不断增大与感知能力逐步提高，在原先世界泡的不远处§B希儿§!感受到了某些熟悉的气息。她激动的情愫已经溢于言表，已经没有什么能够阻拦她们的重逢。
  gts_azure_waters.3.desc: "§BSeele§! followed her memories to the area she remembered. Ever since falling into the Sea of Quanta, the energy dissipating around her had been entering her body bit by bit, as if she had some special natural affinity with this place. The science officer accompanying her tried to touch the world bubbles floating nearby, but as she drew closer, her body kept shrinking, while the pitch-black world bubble seemed to expand without end. Noticing this, §BSeele§! helplessly reached out and, with the science officer leaning against her fingertip, moved her away from the edge of the world bubble. \"If you want to enter a world bubble, you will be affected by its own rules, so you yourself will also be changed.\" \"Huh? You're asking why §BSeele§! wasn't affected? Probably because §BSeele§! has become one with the Sea of Quanta?\"\\nAs her body continued to grow and her perceptive ability gradually improved, §BSeele§! sensed a certain familiar presence not far from the original world bubble. Her excitement was already written all over her face. Nothing could stop their reunion now."
#  给布洛妮娅一个惊喜?
  gts_azure_waters.3.a: "Give Bronya a surprise?"
#  
  gts_azure_waters.3.a_custom: ""
#  
  gts_azure_waters.3.b: ""
#  
  gts_azure_waters.3.b_custom: ""
#  探索
  gts_azure_waters.4.name: "Exploration"
#  “先说好，你们乱跑要是出了什么事情，我可不会浪费时间去救你们。”刚刚进入量子之海，§R§R「希儿」§!§!便警告打算为科研献身而跟随进来的科学官们。“我对这里的适应性没有希儿那么强，如果你们出了什么事情，回去我也不好交代…”\n§R「希儿」§!的警告不无道理,我们如今对量子之海的知识过于贫乏,如果贸然行动很有可能造成不必要的损失,处于安全与效率考虑,我们还是跟随着她探索即可
  gts_azure_waters.4.desc: "\"Let me make this clear first. If something happens because you run off on your own, I won't waste time saving you.\" As soon as we entered the Sea of Quanta, §R§R\"Seele\"§!§! warned the science officers who had followed her in for the sake of research. \"I'm not as well adapted to this place as Seele is. If something happens to you, it will be hard for me to explain when we get back...\"\\n§R\"Seele\"§!'s warning is not without reason. Our current knowledge of the Sea of Quanta is far too limited, and reckless action could easily cause unnecessary losses. For the sake of safety and efficiency, we should simply follow her as she explores."
