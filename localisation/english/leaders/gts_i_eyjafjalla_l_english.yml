  # 巨娘的身体对小人来说即是行走的金矿，又是危及生命的禁地，更不要说这是个天体级巨娘了。因此我们必须仔细考量科考队在§G收益§!与§R风险§!上的平衡。\n\n如果§G全盘按照计划§!行动，虽然不一定会有什么显著收获，但至少可以保证科考队按时返回。如果我们选择更§R激进§!的探索计划，我们或许能采集更多标本，甚至发现近路以缩短探险周期，但很显然，一旦科考队迷失其中，轻则延误时间，重则...
  gts_situation_eyjafjalla_foot1_desc: "For small people, the giantess's body is both a walking goldmine and a forbidden place that endangers their lives, let alone a celestial-level giantess. Therefore, we must carefully consider the balance between the §Gbenefits§! and the §Rrisks§! of the science team.\n\nIf we act §Gcompletely according to plan§!, although there may not be any significant gains, we can at least ensure that the science team returns on time. If we choose a more §Raggressive§! exploration plan, we may be able to collect more specimens and even discover shortcuts to shorten the exploration period, but it is clear that if the science team gets lost, at best, there will be a delay, at worst..."
