l_english:
  # \"火山之母\
  d_gts_eyjafjalla: "\"Mother of Volcanoes\"
  # 当地人对这个居于星球中部的巨型火山的贴切昵称。\n虽然地质检测表明其状态相对稳定，但如果真的打算向内探索，我们仍需要做很多准备。
  d_gts_eyjafjalla_desc: "A fitting nickname given by the locals to this giant volcano located in the center of the planet.\nAlthough geological surveys indicate that its state is relatively stable, we still need to make many preparations if we really intend to explore inside."
  # \"火山之腹\
  d_gts_eyjafjalla_vore: "\"Belly of the Volcano\"
  # 谁能想到这巨型火山之下竟然会是一片温暖柔软的地下温泉？总之这个意外收获进一步刺激了整颗星球的旅游业，如今在地表观光、在地下度假已经成为这个星球最热门的选择。
  d_gts_eyjafjalla_vore_desc: "Who would have thought that beneath this giant volcano would be a warm and soft underground hot spring? In any case, this unexpected gain further stimulated tourism on the entire planet. Nowadays, sightseeing on the surface and vacationing underground have become the most popular options for this planet."
  # 艾雅法拉大峡谷
  d_gts_eyjafjalla_pit: "Eyjafjalla Grand Canyon"
  # 艾雅法拉离开这颗星球后其身体原本占据的巨大空间，臀部和足部留下的宽阔盆地如今尤其的被作为\"现任巨娘科学官的印迹\"成了新的旅游热点。\n在失去了艾雅法拉作为能量源，整个星球的火山活动也逐渐稳定到了当地居民足以安稳生活的水平了。
  d_gts_eyjafjalla_pit_desc: "After Eyjafjalla left this planet, the huge space that her body originally occupied, the wide basins left by her buttocks and feet are now especially regarded as \"the mark of the current giantess scientist\" and have become a new hot tourist spot.\nAfter losing Eyjafjalla as an energy source, the volcanic activity of the entire planet has gradually stabilized to a level where the local residents can live in peace."
  # 乳汁内海
  d_eyjafjalla_milk_sea: "Milk Inner Sea"
  # 艾雅法拉为缓解涨奶在母星上空挤出的奶水形成的内海，曾经这里是死寂的沙海，如今已经成为农耕和旅游的圣地，新的生态系统正在艾雅法拉的乳汁中形成。
  d_eyjafjalla_milk_sea_desc: "The inner sea formed by the milk that Eyjafjalla squeezed out above her home planet to relieve her engorgement. This place, once a desolate sand sea, has now become a holy land for farming and tourism, with new ecosystems forming in Eyjafjalla's milk."
  # 治愈艾雅法拉
  GTS_CURE_EYJAFJALLA: "Cure Eyjafjalla"
  # 为了治疗艾雅法拉小姐，帝国医学部将利用我们最新的检查仪器对她体内的病灶进行定位，随后联合工程部、科学部，派遣数千名小人干员从耳道、口腔、肠道等地方进入艾雅法拉体内搜寻并移除她体内的源石残余。
  GTS_CURE_EYJAFJALLA_DESC: "In order to heal Miss Eyjafjalla, the Imperial Medical Department, using our latest examination equipment, will locate the lesions in her body. Subsequently, coordinating with the Engineering Department and the Science Department, thousands of small person agents will be dispatched to enter Eyjafjalla's body through the ear canals, mouth, and intestines to search for and remove the Originium remnants within her."
  # 艾雅法拉
  system_gts_eyjafjalla: "Eyjafjalla"
  # 熔岩之泉
  planet_gts_eyjafjalla: "Lava Spring"
  # 火山之星
  gts_eyjafjalla_category: "Volcanic Star"
  # 这颗星球上有着数量惊人的火山群。
  gts_eyjafjalla_category_desc: "There is an astonishing number of volcanoes on this planet."
  # 火山之星
  gts_eyjafjalla.26.name: "Volcanic Star"
  # 扫描结果表明，这颗星球的地下存在着一个巨大的能量源 -  - 这个能量源显然不是这个中型行星能自然产生的。其不断向四周散发大量能量，而无处释放的能量并没有摧毁这颗行星，而是在某种非自然的力量引导下从各个较薄的地表喷发出来，形成了这颗行星上壮观的火山群景象。\n\n我们的科研官同时指出，鉴于这颗行星地热能源之充沛，一旦我们能稳定这个星球，并促使其气候回暖，这颗星球有望在短时间内转化为一个欣欣向荣的温暖世界。不过具体方案仍需要等到我们决定在这颗星球上定居后另行研究。
  gts_eyjafjalla.26.desc: "Scans indicate that there is a huge energy source beneath this planet-an energy source that clearly could not have been naturally generated by this medium-sized planet. It constantly emits large amounts of energy to the surrounding areas, and this energy, with nowhere to be released, did not destroy the planet, but instead under the guidance of some unnatural force, it erupted from various thinner areas of the surface, it has formed the magnificent volcanic landscape on this planet.\n\nOur science officer also pointed out that, given this planet's abundant geothermal energy, once we can stabilize the planet and cause its climate to recover, it is expected that this planet will be transformed into a thriving and warm world in a short period of time. However, concrete plans will still need to wait until after we decide to settle on this planet for further research."
  # 火山之星
  gts_star_volcano: "Volcanic Star"
  # 这个星球奇妙的火山群景观吸引了帝国各地旅游者的参观，当然对定居这里的居民来说就是另一回事了。
  gts_star_volcano_desc: "The wondrous volcanic landscape of this planet attracts tourists from all over the Empire, though it's another story for the residents who live here."
  # 挖掘成功
  gts_egg.1.name: "Successful Excavation"
  # 我们顺利完成了这一阶段的挖掘工作，现在更多地下区划可供我们进行建设。在挖掘过程中我们意外发现了许多珍贵文物，经过鉴定，这些珍贵的文物来自历史上许多神秘消失的城市与文明，有些文物甚至来自从未记载过的超古代生命，这些发现对我国社会产生了很大影响。
  gts_egg.1.desc: "We have successfully completed this phase of excavation, and now more underground districts are available for us to build. During the excavation, we unexpectedly discovered many precious cultural relics. After identification, these precious relics came from many mysteriously vanished cities and civilizations in history. Some relics even came from ultra-ancient life that has never been recorded. These findings have greatly influenced our society."
  # 这颗星球还埋藏着怎样的秘密？
  gts_egg.1.a: "What other secrets does this planet hold?"
  # 挖掘成功
  gts_egg.2.name: "Successful Excavation"
  # 我们顺利完成了这一阶段的挖掘工作，现在更多地下区划可供我们进行建设。期间我国科学家为了进行安全挖掘而开发的新技术以及我们在向内部挖掘中的新发现给我国目前的科研工作带来了很多启发。
  gts_egg.2.desc: "We have successfully completed this phase of excavation, and now more underground districts are available for us to build. During this time, the new technologies developed by our scientists for safe excavation, as well as our new discoveries during the inward excavation, have brought a lot of inspiration to our current scientific research."
  # 干得好！
  gts_egg.2.a: "Well done!"
  # 挖掘事故
  gts_egg.3.name: "Excavation Accident"
  # 我们完成了这一阶段的挖掘工作，现在更多地下区划可供我们进行建设。不幸的是，由于对这部分开发的环境风险预估不足和实际操作中的一系列失误，我们的卵子母星瞬间吞噬了大量城区和城市里数以百万计的人口
  gts_egg.3.desc: "We have completed this phase of excavation, and now more underground districts are available for construction. Unfortunately, due to insufficient assessment of the environmental risks of this development and a series of errors in actual operation, our Egg Home Planet instantly devoured a large number of urban areas and millions of people in the city."
  # 真是灾难!
  gts_egg.3.a: "What a disaster!"
  # 开发完成
  gts_egg.4.name: "Development Completed"
  # 我们顺利的完成了全部的挖掘工作，而我们母星的核心则在安全距离下被专门保护着。\n这颗独一无二的巨大星球已经被我们完全摸透，她所蕴藏的那无穷的潜力将为我们所用。
  gts_egg.4.desc: "We have successfully completed all the excavation work, and the core of our home planet is specially protected at a safe distance.\nThis unique and enormous planet has been completely understood by us, and its infinite potential will be used by us."
  # 终于...
  gts_egg.4.a: "Finally..."
  # 地下热泉
  gts_eyjafjalla.2.name: "Underground Hot Springs"
  # 我们的探险队决定从火山近处的一个开阔的洞穴进入。\n在经过了宽敞的地下溶洞、狭长的走廊、蒙着温暖的空气和湿滑的地面，我们的探险队终于抵达了火山正下方。\n出乎我们的科学家曾推测的任何假说，火山内部并不直接联通火山口，环境也并非极度炎热，我们的探险队甚至可以脱下防护服在里边自由行动，探险队员甚至认为这个地下空间要比地上的恶劣环境宜居的多。除了这空间里一侧边缘有一些强腐蚀性的酸液外，其余大部分地表都是温暖舒适的，探险队计划在下次探索中带上开发人员，如果一切顺利，我们或许会获得一个新的旅游景点？
  gts_eyjafjalla.2.desc: "Our expedition decided to enter from an open cave near the volcano.\nAfter passing through spacious underground caverns, narrow corridors, draped in warm air and slippery ground, our expedition finally reached directly below the volcano.\nContrary to any hypothesis that our scientists had speculated, the inside of the volcano is not directly connected to the crater, and the environment is not extremely hot. Our explorers can even take off their protective suits and move freely inside. The explorers even believe that this underground space is more habitable than the harsh environment on the surface. Apart from some highly corrosive acid on one side of this space, most of the surface is warm and comfortable. The expedition team plans to bring developers on the next exploration trip. If all goes well, perhaps we will get a new tourist attraction?"
  # 天赐的奇景啊！
  gts_eyjafjalla.2.a: "A gift from the heavens!"
  # 总感觉这地方很危险啊，我们得换个地方探索。
  gts_eyjafjalla.2.b: "I feel like this place is dangerous, we should explore somewhere else."
  # 我们将从另一个地方进入火山内。
  gts_eyjafjalla.2.tooltip: "We will enter the volcano from another place."
  # 沉谧乳泉
  gts_eyjafjalla.3.name: "Serene Milk Spring"
  # 我们的探险队最终决定直接从火山口绳索直降下去。\n但事实证明这个火山远比我们想象的要高，在数次加长绳索后探险队员才成功着陆，而柔软的地面上又有数个更小的洞穴，里边则是宛如迷宫般的复杂通路。\n数日之后探险队才找到了这座火山的核心 -  - 一片温暖乳汁海。难道这就是这座巨型火山的核心了吗？我们的探险队员实在无法相信。\n现在他们提出了一些颇为激进的办法，比如定点爆破，来向下寻找真正的核心。
  gts_eyjafjalla.3.desc: "Our expedition eventually decided to descend directly into the crater by rope.\nBut it turns out that this volcano is much higher than we thought. After lengthening the ropes several times, the explorers successfully landed, and on the soft ground were several smaller caves with complex paths resembling a maze.\nAfter several days, the explorers found the core of this volcano - a sea of warm milk. Could this really be the core of this giant volcano? Our explorers cannot believe it.\nNow they have proposed some rather radical solutions, such as pinpoint blasting, to look for the real core downwards."
  # 那为什么不试试呢？" #引爆
  gts_eyjafjalla.3.a: "Then why not give it a try?" #detonate"
  # 深邃菊穴
  gts_eyjafjalla.4.name: "Profound Chrysanthemum Cave"
  # 我们的探险队决定从火山远处一个偏僻洞口进入。\n除了遍地黏液外，洞穴内比我们想象的要宽阔和干净，但我们越往深处前进，越是能感受到一股异味。而当我们抵达路的尽头时，我们看到了一个小型天体般的巨大障碍物，球形橡胶质，似乎还印着一颗爱心？\n这个宛如巨娘跳蛋一般的巨大造物完美的挡住了我们钻过去的企图，而且根据这跳蛋的大小判断，恐怕这后边还会有更加无法想象的东西。
  gts_eyjafjalla.4.desc: "Our expedition decided to enter from a remote cave far from the volcano.\nApart from the sticky liquid everywhere, the cave was wider and cleaner than we imagined, but the deeper we went, the more we could sense a strange odor. And when we reached the end of the road, we saw a huge obstacle like a small celestial body, spherical, rubbery, and seemed to be printed with a heart?\nThis huge creation, like a giantess's dildo, perfectly blocked our attempt to drill through, and judging from the size of this dildo, there will probably be something even more unimaginable behind it."
  # 想办法炸开条路！
  gts_eyjafjalla.4.a: "Find a way to blast a path!"
  # 火山喷发！
  gts_eyjafjalla.5.name: "Volcanic Eruption!"
  # 按照计划，大量定向炸药被部署在火山核心的四周。按钮启动，但火山底部只传来了轻微的颤抖，而这些炸药丝毫没能炸出什么坑洞来。正当探险队怀疑是炸药装药量不足时，火山核心的乳汁海突然在极短的时间内暴涨，然后各个洞口中都瞬间喷射出海量的高温乳汁。这座火山喷发了。而仿佛这一切还不够可怕一般，在随后一阵范围极广的巨大地震后，火山连同周围的数座山地轰然倒塌，一个巨大的身影从漫天的灰尘中起身。这座巨大的火山竟然联通着某个沉睡的巨娘的胸部！
  gts_eyjafjalla.5.desc: "As planned, a large number of shaped explosives were deployed around the core of the volcano. The button was activated, but only a slight tremor came from the bottom of the volcano, and these explosives failed to blow out any holes. Just as the expedition began to suspect that there were not enough explosives loaded, the milky sea in the core of the volcano suddenly surged in a very short period of time, and then massive amounts of extremely hot milk were sprayed out of all the openings. This volcano erupted. And as if all this wasn't terrible enough, after a massive earthquake across a wide area, the volcano, along with the surrounding mountains, collapsed with a roar, and a huge figure rose from the dust-filled sky. It turns out that this huge volcano was connected to the chest of a sleeping giantess!"
  # 立刻接入通讯面板！
  gts_eyjafjalla.5.a: "Immediately connect to the communication panel!"
  # 火山喷发！
  gts_eyjafjalla.6.name: "Volcanic Eruption!"
  # 按照计划，大量高能炸药被部署在这颗跳蛋的四周。遗憾的是，在引爆后，这颗跳蛋和周围的墙壁丝毫没有损伤，随后整个洞穴都开始剧烈颤抖着，探险队连忙逃出了洞窟，随后一阵猛烈的异星天然气便从洞口涌出，发出十分不雅的声音。毫无疑问，但凡探险队没能及时撤离，就会被这风暴撕成碎片。而仿佛这一切还不够可怕一般，在随后一阵范围极广的巨大地震后，火山连同周围的数座山地轰然倒塌，一个巨大的身影从漫天的灰尘中起身。这座巨大的火山竟然联通着某个沉睡的巨娘的胸部！而我们之前探索的地方便是这位巨娘的...后庭。
  gts_eyjafjalla.6.desc: "As planned, a large amount of high-energy explosives were deployed around this dildo. Unfortunately, after the detonation, this dildo and the surrounding walls suffered no damage whatsoever. Then the entire cave began to tremble violently. The expedition team quickly escaped from the cave, and then a burst of violent alien natural gas gushed out of the opening, making a very indecent sound. There is no doubt that if the expedition had not been able to evacuate in time, they would have been torn to pieces by this storm. And as if all this wasn't terrible enough, after a massive earthquake across a wide area, the volcano, along with the surrounding mountains, collapsed with a roar, and a huge figure rose from the dust-filled sky. It turns out that this huge volcano was connected to the chest of a sleeping giantess! And the place we explored before was this giantess's...back passage."
  # 艾雅法拉" #招募界面
  gts_eyjafjalla.7.name: "Eyjafjalla" #Recruitment Interface"
  # 她看起来对周围的一切茫然无知的样子，而因为我们刚才的爆破行为而显得惊慌失措。一只手撑着地面，而另一只手紧紧地捂着我们刚刚刺激的位置，穴口似乎还在向外流淌着黏液。\n\n\"你，你们是谁？我又在哪？\
  gts_eyjafjalla.7.desc: "She looks bewildered by everything around her, and she looks flustered because of our blasting behavior just now. One hand is supporting on the ground, while the other hand is tightly covering the position we just stimulated, and sticky liquid seems to be still flowing out of the vaginal opening.\n\n\"You, who are you? Where am I?\"
  # 别紧张，我们没有恶意
  gts_eyjafjalla.7.a: "Don't be nervous, we mean no harm"
  # 没有恶意？那为什么要...要这么做\n\n（之后经过漫长的解释，艾雅法拉理解了现状）\n\n也就是说，我不在泰拉吗...
  gts_eyjafjalla.7.a.response: "No harm? Then why... why did you do that?\n\n(After a long explanation, Eyjafjalla understood the situation)\n\nSo, I'm not on Terra..."
  # 那你知道你为什么会在这吗？
  gts_eyjafjalla.7.b: "Do you know why you are here?"
  # 不，我完全没有记忆...当时我正在宿舍里自...总之不知道怎么的就陷入昏睡，然后就感受到你们的刺激，然后我就醒来了...
  gts_eyjafjalla.7.b.response: "No, I have no memory at all... I was in the dormitory then self... anyway, I don't know how I fell asleep, and then I felt your stimulation, then I woke up..."
  # 那你接下来打算这么办呢
  gts_eyjafjalla.7.c: "Then what are you planning to do next?"
  # 嗯...\n既然唤醒我的是你们，那我也只好暂时加入你们了，我的地质学知识可以帮助你们进行地形勘探，虽然看起来你们的世界比我们的世界要小得多...\n然后我打算在这个宇宙中探索一下。\n\n（说到这里，艾雅法拉看起来有些兴奋，你想起来刚刚她在谈到自己的母星是说道她们的社会尚处于前太空时代）\n\n嗯，如果能找到我的母星，到时候我再另做决定吧。
  gts_eyjafjalla.7.c.response: "Hmm...\nSince you are the ones who woke me up, I have no choice but to join you for the time being. My geology knowledge can help you with terrain surveys, although it seems your world is much smaller than ours...\nAnd then I plan to explore this universe.\n\n(As she said this, Eyjafjalla looked a little excited, which reminded you that she said their society was still in the pre-space era when she talked about her home planet)\n\nWell, if I can find my home planet, I'll make other decisions then."
  # §Y艾雅法拉§!作为一名§H领袖§!加入了我们的帝国。
  gts_eyjafjalla.7.hire_custom_tooltip: "§YEjyafjalla§! has joined our empire as a §HLeader§!."
  # 艾雅法拉
  NAME_gts_eyjafjalla: "Eyjafjalla"
  # 一位沉睡多年的火山学者，尽管重病缠身，但她仍愿意为科学发展贡献自己的力量。
  gts_eyjafjalla_desc: "A volcano scholar who has been asleep for many years. Although she is seriously ill, she is still willing to contribute her strength to the development of science."
  # 那...就请多多关照了，前辈。
  gts_eyjafjalla_catch_phrase: "Well... please take care of me, seniors."
  # 地质学者艾雅法拉
  scientist_gts_eyjafjalla: "Geologist Eyjafjalla"
  # 艾雅法拉在其曾生活的世界作为天灾信使活动，工作期间的经验积累使得这名天才的地质学家能很快适应靠自己巨大的身体调查足下行星的生活，并能利用自己的特长找到行星的开发潜力。\n§G每等级+30£physics£、+30£society£、+30£engineering£§!
  scientist_gts_eyjafjalla_desc: "Eyjafjalla served as a messenger of natural disaster in her previous world. The experience accumulated during her work enabled this talented geologist to quickly adjust to the life of investigating planets under her feet with her huge body, and she can use her strengths to find the potential for planetary development."
  # 源石病
  oripathy: "Oripathy"
  # 一种其种族特有的疾病正严重影响着这名领袖的身体健康和正常工作。
  oripathy_desc: "A disease unique to her race is seriously affecting this leader's health and normal work."
  # 敏感肌肤
  gts_eyjafjalla_sex: "Sensitive Skin"
  # 我们在唤醒艾雅法拉时略显粗暴的手段似乎让这个纯洁的科学家觉醒了什么奇怪的癖好。
  gts_eyjafjalla_sex_desc: "The slightly rough methods we used to awaken Eyjafjalla seem to have awakened some strange fetish in this pure scientist."
  # 治疗矿石病？
  gts_eyjafjalla.8.name: "Cure Oripathy?"
  # 贴身医护小组对艾雅法拉小姐的长程基因诊断工作已经完成。依据诊断报告，虽然银河各国都没有对这种病症的相关记录，但在现代医学的帮助下，她口中的\"不治之症\"很有希望被我们治愈。由于艾雅法拉的可爱性格和在帝国的良好风评，帝国医学部已经收到了无数顶级医师和志愿者的申请，希望能参与治愈艾雅法拉小姐的手术。
  gts_eyjafjalla.8.desc: "The close medical team has completed a long-range genetic diagnosis of Miss Eyjafjalla. According to the diagnostic report, although there are no records of this disease in any galaxy, with the help of modern medicine, there is a high chance that the \"incurable disease\" in her words can be cured. Due to Eyjafjalla's lovely personality and good reputation in the empire, the Imperial Medical Department has received countless applications from top physicians and volunteers hoping to participate in the surgery to cure Miss Eyjafjalla."
  # 立刻去准备手术！
  gts_eyjafjalla.8.a: "Prepare for surgery immediately!"
  # 艾雅法拉痊愈！
  gts_eyjafjalla.9.name: "Eyjafjalla Healed!"
  # 手术成功了！\n虽然结果已是十拿九稳，但手术成功的消息还是令关心艾雅法拉小姐的国民大为振奋。出院后的艾雅法拉小姐换上了新衣服，并向你发来了通讯。
  gts_eyjafjalla.9.desc: "The surgery was a success!\nAlthough the result was almost certain, the news of the successful surgery was very exciting to the citizens who cared about Miss Eyjafjalla. After being discharged from the hospital, Miss Eyjafjalla changed into new clothes and sent a message to you."
