  # §r\"那，我就开始了哦，前辈～\"§!\n\n正安静地飘浮在星球轨道上的艾雅法拉在收到了我们的通讯之后，一边轻声地回应着一边凑近了这颗和她现在的躯体大小相当的星球，乳白色的肌肤逐渐笼罩了行星的天空，粉色的瞳孔缓缓地扫视着陆地上的一切，无论是曾经繁荣的都市还有葱郁的植被在现在的艾雅法拉眼中已经仅仅如同一片片灰色或绿色的苔藓一般微小而脆弱，仿佛哪怕只是自己的一次舔舐都足以毁灭这里的一切。\n\n§r\"啊 -  - \"§!\n\n maiden可爱的声音响彻了整颗星球，横跨天际的双唇微微颤抖着向着两侧分离，露出了 maiden那名为\"口腔\"的暗红色深渊，一阵湿热的气息从深不见底的喉咙深处冲出，在一瞬间之内就已经几乎冲刷了半颗星球的陆地，几场由艾雅法拉的唾液形成的暴雨也纷纷在星球的各处形成。随后，艾雅法拉轻柔地伸出了晶莹的舌尖，粉红色的柔嫩巨物直直地插入了陆地之中，数百米深的土地被 maiden的舌尖碾作一缕浮尘，一切文明或自然的抵抗在如此庞大的巨舌下几乎全无反抗之力。轻轻移动舌尖，无数旧日的城市与一些自愿留在陆地上的小人们就这样被卷进了粉嫩的巨物之上，散落在了巨大的舌苔之间，最终落入了唾液的洪流之中。喉咙缓缓张开，一层足以存续千年的陆地地表就这样落入了艾雅法拉的卫星一般大小的胃袋之中，在粘稠而又炽热的胃液里逐渐化为了艾雅法拉身体的一部分。
  gts_eyjafjalla.226.desc: "§r\"Then, I'll start, Senior~\"§!\n\nAfter receiving our communication, Eyjafjalla, who had been floating quietly in the planet's orbit, gently responded and approached the planet that was about the same size as her current body. Her milky-white skin gradually enveloped the planet's sky, and her pink pupils slowly scanned everything on the land. Whether it was the once prosperous cities or the lush vegetation, in Eyjafjalla's eyes, they were now merely as small and fragile as patches of gray or green moss, as if even a single lick from her would be enough to destroy everything here.\n\n§r\"Ah--\"§!\n\nA cute voice from the girl resounded throughout the planet. Her lips, which stretched across the sky, trembled slightly and separated towards both sides, revealing the dark red abyss of the girl's \"mouth\". A moist and hot breath rushed from the depths of her bottomless throat, and in an instant, it had almost washed over half of the planet's land. Several rainstorms formed by Eyjafjalla's saliva also formed in various parts of the planet. Then, Eyjafjalla gently extended her translucent tongue tip. The soft, pink behemoth pierced straight into the land, grinding hundreds of meters deep of land into a wisp of dust. All resistance from civilization or nature was essentially powerless in the face of such a gigantic tongue. Moving her tongue gently, countless old cities and some small people who volunteered to stay on the land were rolled onto the pink behemoth, scattered among the huge taste buds, and finally fell into the torrent of saliva. Her throat slowly opened, and a layer of the land surface, which was sufficient to last for thousands of years, fell into Eyjafjalla's satellite-sized stomach, gradually turning into a part of Eyjafjalla's body in the viscous and scorching gastric juices."
  # §r\"好像......我的确在变大？\"§!\n\n我们的计划出人意料地成功，仅仅消化掉了这颗星球的一小部分，艾雅法拉的躯体就在一阵巨响中急剧地膨胀起来，直至那颗行星现在也仅仅只能有艾雅法拉的身体的一半大小。而我们的主角，那位显得有点惊讶的 maiden则环顾了一下自己的躯体，随后重新看向了这颗显得更加弱小的星球。\n\n§r\"那就，让我们继续吧。\"§!\n\n艾雅法拉重新张开了嘴，红润的双唇轰然砸向了大地，湿热的深渊覆盖住了星球上的一整座大洲，足以养育上亿小人的大地如同一片脆弱的饼干一般被 maiden含在了嘴里。紧接着，庞大的双唇逐渐合拢，整座大洲无力地落在了艾雅法拉的舌面之上，海洋一般的唾液不断地冲刷着小小的陆地，最终，这片大地也逃不过被艾雅法拉吞咽、消化的命运。随后，身体又一次膨胀起来的艾雅法拉轻轻地握了握拳头，不再犹豫地又一次张开了已经如同星门一般大小的巨口，开始迅速地吞噬着星球上的一切，无论是残留的建筑与小人，千年的地貌与地幔，最终都在 maiden的嘴中或胃里被溶解利用。而当艾雅法拉已经足以用嘴巴轻柔地含住残余的所有星球残骸之时，她终于回到了她曾经的那个形态：一位真正的天体级巨娘。
  gts_eyjafjalla.227.desc: "§r\"It seems... I'm indeed getting bigger?\"§!\n\nOur plan succeeded unexpectedly. Eyjafjalla's body rapidly expanded with a loud bang after only digesting a small part of the planet, until the planet now was only half the size of Eyjafjalla's body. And our heroine, the somewhat surprised girl, looked around her body and then looked back at the even smaller planet.\n\n§r\"Then, let's continue.\"§!\n\nEyjafjalla reopened her mouth, and her rosy lips slammed down onto the ground, the moist and hot abyss covering an entire continent of the planet. The earth, which could nurture hundreds of millions of small people, was held in the girl's mouth like a fragile cracker. Then, her huge lips gradually closed, and the entire continent fell powerlessly onto Eyjafjalla's tongue. Ocean-like saliva continuously washed over the small piece of land. Eventually, this land could not escape the fate of being swallowed and digested by Eyjafjalla. Then, Eyjafjalla, whose body had expanded once again, gently clenched her fist, and without any hesitation, she opened her huge mouth, which was already the size of a star gate, and began to rapidly engulf everything on the planet. Whether it was the remaining buildings and small people, or millennia of landforms and the mantle, all were eventually dissolved and utilized in the girl's mouth or stomach. And when Eyjafjalla had become large enough to gently hold all the remaining remnants of the planet in her mouth, she finally returned to her former state: a true celestial-level giantess."
  # 腋下星球
