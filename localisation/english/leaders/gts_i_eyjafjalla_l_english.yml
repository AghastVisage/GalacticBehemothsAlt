  # §r\"唔唔......我的腋下，应该没有那么多汗液吧......？\"§!\n\n艾雅法拉软糯的声音在太空中响起， maiden用另一只巨手轻柔地按住了腋下的皮肤，本就无比宏伟的腋下大陆显得更庞大了几分。稍微犹豫了一下的艾雅法拉轻轻地呼出了一口气，随后鼓起勇气贴上了这颗行星。粉红色的肉墙轰然落地，无论是残余的城市与小人还是薄薄的一层植被都在 maiden柔软的肌肤下被碾得粉碎，与浓稠的汗液混在了一起，最终变成了附着在艾雅法拉腋下的一丝尘埃。\n\n紧接着，正如我们预料的那样，这颗星球上的能量开始顺着 maiden的肌肤而回到艾雅法拉小姐体内，经过第一次剧烈的膨胀之后，原本就足以夹住一座大洲的腋下巨墙此时已经能够笼罩一整片大陆，脆弱的地壳在艾雅法拉的身体下方几乎毫无抵抗之力。一座又一座废弃的城市连带着其中不愿离去的小人化为了艾雅法拉腋下的吸汗巾而被碾碎消耗，身体也随之而更加巨大化的艾雅法拉则满脸舒适与羞涩地使用着这颗愈加渺小的星球。直到整颗行星都已经被艾雅法拉的汗液蓄满，变成了一颗\"汗液星球\"之时，已经正式成为了一位天体级巨娘的艾雅法拉缓缓地放下了手臂，这颗大小甚至已经比不上 maiden的一滴汗液大小的星球最终迎来了它最后的命运，光荣地成为了被天体级艾雅法拉的腋下碾碎的第一颗星球。
