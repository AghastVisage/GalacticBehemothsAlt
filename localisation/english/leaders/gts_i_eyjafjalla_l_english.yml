  # 艾雅法拉" #招募界面
  gts_eyjafjalla.10.name: "Eyjafjalla" #Recruitment Interface"
  # 艾雅法拉穿着新衣服，虽然因为手术刚刚结束看起来有些疲惫，但看起来欣喜的心情仍然难以抑制的在脸上满溢出来。
  gts_eyjafjalla.10.desc: "Eyjafjalla is wearing new clothes. Although she looks a little tired because the surgery just finished, her joyful mood is still overflowing on her face."
  # 你感觉还好吧
  gts_eyjafjalla.10.a: "Are you feeling okay?"
  # 嗯，我感觉好多了，感觉看的更清楚了，耳朵也灵光了许多，身上也不再痛了，太好了...这个时代的医学真的太好了。\n只可惜我罗德岛的同事们没能有机会见到矿石病的终结啊...
  gts_eyjafjalla.10.a.response: "Yes, I feel much better, my vision is clearer, my ears are much more sensitive, and my body doesn't hurt anymore, that's great... medicine in this era is really great.\nIt's a pity that my Rhodes Island colleagues didn't get the chance to see the end of Oripathy..."
  # 你接下来有什么打算？
  gts_eyjafjalla.10.b: "What are your plans next?"
  # 打算吗？前辈的国家拯救了我，我肯定是要继续为前辈服务的！但既然我已经摆脱了源石病，我想我能花更多时间在地质学的理论研究上了，这对前辈的帝国来说也是更有用的对吧。
  gts_eyjafjalla.10.b.response: "Plans? Your country saved me, I will definitely continue to serve you, senior! But now that I'm rid of Oripathy, I think I can spend more time on theoretical research in geology. That would be more useful for your empire, right?"
  # 欢迎回来，艾雅法拉
  gts_eyjafjalla.10.c: "Welcome back, Eyjafjalla"
  # 嗯！我回来啦，前辈！
  gts_eyjafjalla.10.c.response: "Yes! I'm back, senior!"
  # 火山学者艾雅法拉，如今以全新的姿态继续为您的帝国带来幸福与繁荣。
  gts_eyjafjalla_desc_after: "The volcano scholar Eyjafjalla is now in a new form to continue to bring happiness and prosperity to your empire."
