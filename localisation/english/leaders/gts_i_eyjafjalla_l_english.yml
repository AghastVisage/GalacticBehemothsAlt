  # §r\"唔嗯......好舒服......\"§!\n艾雅法拉的躯体随着破坏区域的增加而逐步膨胀，越来越宏伟的身躯也逐渐抱紧了显得愈加渺小的星球。原本需要用全身去抱住的行星现在对艾雅法拉来说已经可以搂在怀中，一片片宽广的大陆在席卷了近半颗星球的肉壁下被卷起挤碎，变成了连 maiden的阴道都不配进入的几缕灰尘。与此同时，从 maiden的褶皱间奔涌而出的爱液早已彻底替换了这颗星球上的全部海洋，即使是星球另一侧没有被阴唇碾碎的陆地最终也逃不过被爱液海洋淹没的命运。\n\n§r\"唔呜......呜咿！\"§!\n随着艾雅法拉的一声响彻寰宇的娇喘，在星球的刺激之下最终顺从了内心的欢愉的 maiden伸出手一下子拍住了已经与手掌等大的行星，于高潮中喷发而出的爱液也几乎全部被星球的引力所捕获。在毁灭性的爱液洪流下，整颗行星上已经不存在任何一片陆地或高山，更加脆弱不堪的废弃城市则早已连带着其中那些顽固的小人一同被爱液冲碎或淹没。甚至可以说，现在艾雅法拉的爱液已经成为了这颗星球新的地壳。而在艾雅法拉的天体级改造彻底完成之后，已经屹立于寰宇之间的 maiden则满脸羞红地把只有指尖大小的星球塞入了下体之中，穿上了胖次。
  gts_eyjafjalla.233.desc: "§r\"Uhm... It feels so good...\"§! Eyjafjalla's body gradually expanded as the area of destruction increased, and her increasingly magnificent body gradually hugged the increasingly diminutive planet tighter. The planet she once used her entire body to hug could now be held in her arms. Pieces of wide continents were rolled up and crushed under the fleshy wall that swept over almost half of the planet and turned into wisps of dust that were not even worthy of entering the girl's vagina. At the same time, the love fluid that gushed out from the girl's folds had long since completely replaced all the oceans on this planet. Even the land on the other side of the planet that was not crushed by her labia could not escape the fate of being submerged by the ocean of love fluid.\n\n§r\"Uuuh... Uwee!\"§! With a sensual moan that echoed through the universe, Eyjafjalla, who had finally yielded to the pleasure in her heart after being stimulated by the planet, reached out and patted the planet, which was now the size of her palm. The love fluid, which gushed out during her climax, was almost entirely captured by the planet's gravity. Under the devastating torrent of love fluid, there was no longer any land or mountain on the entire planet. The even more fragile ruins had long been crushed or submerged by the love fluid, along with the stubborn small people inside. It could even be said that Eyjafjalla's love fluid has now become the new crust of this planet. And after Eyjafjalla's celestial-level transformation was completely finished, the girl, standing between the universe, stuffed the planet, which was only the size of her fingertip, into her lower body, and put on her panties, her face flushed with shame."
  # §r\"既然前辈都这样说了......\"§!\n悬浮在太空中的艾雅法拉小心翼翼地扶住了自己的短靴，几乎和卫星等大的足跟跃出了靴口，裹着黑丝的圆润足跟连带着修长的脚掌从靴子中抽出，一阵浓烈的气息与大量 maiden靴内的足汗在数百万倍的放大下从靴子中氤氲而出，随后在行星的引力作用下冲向了小小的星球。很快，仅仅只是艾雅法拉一只靴子里的气味，就已经占据了星球上的大半个大气层。艾雅法拉的动作还没有停止，尽管 maiden的一点点无意识动作都足以为这颗星球降下神罚，但始终只是在做自己的事情的艾雅法拉仅仅只是又一次伸出了手褪下了轻薄的黑色丝袜，随手丢向了一边，就已经为这颗星球带来了一个\"丝袜卫星\"的奇观。\n\n紧接着，迅速地脱下了另一只脚上的靴袜的艾雅法拉稍稍犹豫了一下，随后长长地呼出了一口气，最终还是转过了身体，抬起了两只细嫩白洁的裸足，脚心正对着渺小的行星。从地面上预设的摄影设备看去，曾经蔚蓝的天空已经完全被艾雅法拉的足底覆盖，一片雪白的大陆正带着无与伦比的压迫感悬在了这颗星球北半球的上空，轻轻地扭动着的五根细腻的足趾为下面的小小城市带去了一场场混杂着足味的风暴，脚掌上的纹路则分割着广阔的脚心天空，仿佛其中任意一条足纹都足以让这些小小的城市与其中的崇拜者小人们移居殖民一般。\n\n§r\"......那就开始吧！\"§!\n修长的双腿猛地前伸，庞大的裸足毫无征兆地踩向了星球上的大地。 maiden足下的区域只来得及记录下一片黑暗的突然降临与白嫩天空的坠落，就被 maiden柔软的足底碾碎在了软肉之间。无论是成片的城市还是茂密的植被，在艾雅法拉的裸足之下都几乎毫无抵抗之力，如同一片片灰色与绿色的苔藓一般被一视同仁地踩碎在脚下。紧接着，身体已经开始膨胀起来了的艾雅法拉抬起了另一只脚，同样重重地踏在了大陆之上，脚掌下的一切都在一瞬间之内变成了 maiden足底的新一层污垢，掀起的气浪则冲刷着四周的大地，侥幸在趾缝间幸存的城市也仅仅只多存续了几分钟，就被足趾上落下的几滴晶莹的足汗砸地粉碎，混杂着 maiden的足垢成为了艾雅法拉脚下的新的污泥。\n\n一脚又一脚，始终悬在太空中的艾雅法拉面带羞涩地不断地踩踏着这颗已经废弃了的宜居行星，她的躯体也如我们预料的那样逐步膨胀着。相对的，她每次踩下裸足时造成的破坏也越来越明显，直至艾雅法拉的脚掌已经和星球上的大陆等大时，又一次凑上前去的艾雅法拉则缓缓地移动着自己庞大的双足，将它们环绕在星球的两侧，不断地用脚心揉搓着小小的星球。至于行星上的一切则早就在超巨大足底肉墙的蹂躏下变成了夹杂着足垢的一滩烂泥，地表与地幔中的物质也逐步被 maiden的足汗与足垢替换。直至最后，已经成为了一名天体级巨娘的艾雅法拉羞涩地微笑着将行星的残骸放入了趾缝间，轻轻揉搓了一下足趾。
  gts_eyjafjalla.234.desc: "§r\"Since senior said so...\"§! Eyjafjalla, floating in space, carefully held her boots. Her heels, almost the size of a satellite, leaped out of the boot opening. Her rounded heels, wrapped in black silk, along with her slender feet, were pulled out of the boots. An intense scent and large amounts of foot sweat from the girl's boots, magnified by millions of times, permeated from the boots. Then under the effect of the planet's gravity, it rushed toward the small planet. Soon, just the scent from one of Eyjafjalla's boots occupied most of the atmosphere on the planet. Eyjafjalla's movements did not stop. Although a small, unconscious movement by the girl was enough to bring down divine punishment on this planet, Eyjafjalla, who was still just doing her own thing, reached out again and took off her thin black stocking, tossing it to the side. This in itself created a spectacle for the planet-a \"stocking satellite\".\n\nThen, after quickly taking off the boot and stocking on her other foot, Eyjafjalla hesitated a little before finally exhaling a long breath. She then turned her body, raised her two delicate and fair bare feet, and aimed her soles directly at the tiny planet. Looking at it from the pre-set photography equipment on the ground, the once azure sky was completely covered by Eyjafjalla's foot sole. A snow-white continent was suspended above the northern hemisphere of this planet with incomparable oppressive force. Her five slender toes wiggled slightly, bringing storms mixed with the scent of her feet to the small cities beneath, and the patterns on her foot sole divided the vast expanse of the sole's sky, as if any one of these foot lines could allow these small cities and their minute devotees to migrate and colonize.\n\n§r\"... Then, let's begin!\"§! Her slender legs suddenly stretched forward, and her huge bare feet stepped on the ground of the planet without warning. The area under the girl's feet only had time to record the sudden arrival of darkness and the fall of a fair sky, and then was crushed into soft flesh by the girl's soft sole. Whether it was cities in pieces or lush vegetation, they were almost defenseless under Eyjafjalla's bare feet, and were crushed underfoot just the same, like patches of grey and green moss. Then, Eyjafjalla, whose body had already begun to expand, raised her other foot and stepped heavily on the continent as well. Everything under her feet turned into a new layer of filth on the girl's foot sole in an instant, and the surging air currents swept across the surrounding earth. The cities that barely survived in the gaps between the toes only survived a few more minutes before being crushed by a few drops of crystalline foot sweat that fell from the toes and became new mud under Eyjafjalla's feet, mixed with her foot dirt.\n\nFoot after foot, Eyjafjalla, who was still suspended in space, shyly continued to step on this abandoned habitable planet, and as we expected, her body gradually expanded. Relatively, the damage she caused each time she stepped down with her bare feet became more and more noticeable. Until Eyjafjalla's foot sole was as big as a continent on the planet, Eyjafjalla, who had once again moved forward, slowly moved her huge feet, wrapping them around the sides of the planet, constantly rubbing the tiny planet with her soles. As for everything on the planet, it had long been turned into a puddle of mud mixed with foot dirt under the ravaging of the massive, super-sized foot sole, and the matter in the surface and mantle was gradually replaced by the girl's foot sweat and foot dirt. Until the end, Eyjafjalla, who had become a celestial-level giantess, smiled shyly and placed the remains of the planet into the gaps between her toes, gently rubbed her toes."
  # §r\"虽然这颗星球上好像已经没有人了......但这么做果然还是感觉很奇怪呢......\"§!\n黑丝包裹的足跟缓缓地从靴口中抽出，纤细的脚掌连带着修长的五根足趾出现在了行星的上空。已经几乎如同神明一般的艾雅法拉可能没有意识到，仅仅只是自己的这个微小的动作都已经为这颗星球带来了难以想象的灾难，在靴中闷了若干个天体时的足味从靴口处喷涌而出，连带着 maiden的脚汗与足垢的气息很快就在行星的引力作用下冲向了小小的星球，整个行星上的大半个大气层几乎在一瞬间之内就被艾雅法拉袜足的气味粗暴地占据，突然广泛发生在星球四处的足汗暴雨与足垢陨石雨则已经摧毁了数座大洲的基础地貌，大量的城市也在这样的天灾之下被足汗淹没或是被足垢碾碎。换句话说，哪怕仅仅只是艾雅法拉脱下靴子露出丝足这一个极其普通的动作，也几乎足以毁掉这颗行星的大部分生态系统。而艾雅法拉随手将自己的靴子丢向一边的行为，则为这颗星球带来了一个极其罕见的\"巨靴卫星\"奇观。\n\n§r\"那......我就踩下去啦，前辈？\"§!\n无比庞大的丝足逐渐接近着脆弱的星球，被艾雅法拉的脚掌笼罩的区域只能看到一片绝望的黑暗逐渐加深，裹着黑丝的足底天空带着无与伦比的压迫感倾轧而下，就连丝袜上的每一道丝线都足以看清，或者说......就连丝袜上每一道夹杂着汗液或足垢的黑色丝线都足以碾碎一片又一片的城市，摧毁一块又一块的地貌。而这一切甚至仅仅只是艾雅法拉轻轻地踩下了自己的丝足而引起的。然而，即使地面上艾雅法拉的丝足周围或下方已经如同地狱一般，庞大的艾雅法拉本人却仍然对此没什么实感，就像是踩在了一层沙子之上一样。轻轻地嘟起了小嘴的艾雅法拉似乎对星球的脆弱有些不满一般，缓缓地挪动起了自己的脚掌。黑丝包裹的超巨大丝足山脉在大地上肆虐，巨足所经过的地表上的一切都逃不过被卷入足底或丝袜上的丝线之间被蹂躏的命运，或许只有最幸运的城市才能够被卡在丝袜间的缝隙之中，得以觐见 maiden的圣足。\n\n§r\"感觉自己的确有在变大呢......那就继续吧！\"§!\n艾雅法拉的另一只丝足也重重地踏在了星球之上，本就已经被蹂躏得一塌糊涂的行星在两只大陆级巨足的踩踏下甚至已经开始破碎，部分地壳与地幔物质在艾雅法拉的脚掌旁边被掀飞，随后又被 maiden修长的双腿的引力所捕捉，化为黑丝纤维间的灰尘，最终变成了混杂着汗液的污垢。紧接着，身躯又一次膨胀起来了的艾雅法拉轻轻地笑了笑，抬起足跟用趾尖戳向了星球的深处，无论是脆弱的地壳地幔还是地核都完全无法阻止艾雅法拉趾尖的深入，甚至可以说，现在的艾雅法拉的一根脚趾都足以成为一颗宜居星球的地核。而随着被破坏区域的增多，艾雅法拉的身体也随之不断地变大。直到整颗星球都已经被艾雅法拉踩得支离破碎的时候，终于心满意足了的艾雅法拉顺手从身旁拉回了自己的靴子，轻柔地把小小的星球残骸塞了进去，重新穿好靴子之后满意地直起了身子，向着我们的通讯方向羞怯地微笑了一下。同一时刻，帝国中也有着无数艾雅法拉小姐的追随者欢呼雀跃了起来，庆祝着又一位伟大的天体级巨娘的诞生。至于那颗残留着靴中与丝足为伴的星球的命运，恐怕只有那些仍然有幸存活在艾雅法拉的丝袜纤维之间或脚掌纹路之中的小人们能够知道了。
  gts_eyjafjalla.235.desc: "§r\"Although it seems that there is no one left on this planet anymore... it still feels weird to do this...\"§! A heel, wrapped in black silk, was slowly pulled out of the boot opening. Her slender foot, along with her five slender toes, appeared above the planet. Eyjafjalla, who was now almost like a god, might not have realized that just this small action of hers had brought unimaginable disasters to this planet. The scent of her feet that had been trapped in the boot for several celestial days gushed out from the boot opening. The scent of the girl's foot sweat and foot dirt, along with the scent of her feet, soon rushed toward the small planet under the effect of the planet's gravity. Almost half of the planet's atmosphere was brutally occupied by the scent of Eyjafjalla's socked feet in an instant. The sudden widespread foot-sweat rain and foot-dirt meteorite rain in various parts of the planet had already destroyed the basic landscape of several continents. Numerous cities were also flooded by foot sweat or crushed by foot dirt under such disasters. In other words, even if Eyjafjalla only made the extremely ordinary action of taking off her boots to reveal her silken feet, it would still be enough to destroy most of this planet's ecosystem. And Eyjafjalla's casual action of throwing her boots to the side brought a very rare spectacle of a \"giant boot satellite\" to this planet.\n\n§r\"Then... I'll step down, senior?\"§! Eyjafjalla's incomparably huge silken foot gradually approached the fragile planet. The area covered by Eyjafjalla's feet could only see a deepening sense of despair. The silken foot sole, with its incomparable oppressive force, tilted down, and even each thread on the stocking could be clearly seen, or rather... every black thread on the stocking, mixed with sweat or foot dirt, could crush one city after another, destroying one piece of landform after another. And all of this was even just caused by Eyjafjalla gently stepping her silken foot down. However, even though the area around or below Eyjafjalla's silken feet on the ground was already like hell, the huge Eyjafjalla herself still did not have much of a real feeling about it, as if she was stepping on a layer of sand. Eyjafjalla, slightly pouting her small mouth, seemed a little dissatisfied with the planet's fragility, and slowly moved her foot. The super-giant silken foot mountains, wrapped in black silk, rampaged on the land. Everything on the surface passed by the giant foot could not escape the fate of being rolled up into the sole or between the threads of the stocking and being ravaged. Perhaps only the luckiest cities could get stuck in the gaps between the stockings and have a glimpse of the girl's holy feet.\n\n§r\"I feel like I am indeed getting bigger... then let's continue!\"§! Eyjafjalla's other silken foot also stepped heavily on the planet. The planet, which had already been ravaged into a complete mess, even began to break apart under the trampling of the two continent-sized giant feet. Some crust and mantle matter was thrown up next to Eyjafjalla's foot and then was captured by the gravity of the girl's slender legs, turning into dust between the black silk fibers, and eventually, into dirt mixed with sweat. Then, Eyjafjalla, whose body had expanded once again, chuckled lightly, raised her heel and used her toes to poke into the depths of the planet. Neither the fragile crust and mantle nor the core could stop Eyjafjalla's toes from going deeper. In fact, it could be said that one of Eyjafjalla's toes was now sufficient to become the core of a habitable planet. And as the destroyed area increased, Eyjafjalla's body continued to grow. When the entire planet had been completely shattered by Eyjafjalla's feet, Eyjafjalla, who was finally satisfied, conveniently pulled her boots back from her side, and gently stuffed the tiny remains of the planet into them. After putting her boots back on, she straightened her body in satisfaction and smiled shyly in the direction of our communication. At the same time, countless followers of Miss Eyjafjalla in the empire cheered, celebrating the birth of another great celestial-level giantess. As for the fate of the planet that remained, accompanied by boots and silk-clad feet, perhaps only those people who were still lucky enough to survive between the silk fibers of Eyjafjalla's stockings or the lines of her feet would know."
  # 幽邃深渊
  gts_eyjafjalla.236.name: "Secluded Abyss"
  # 穿着泳装的艾雅法拉褪下胖次，跪坐在[event_target:gts_eyjafjalla_planet.GetName]的表面。仍感到些许羞涩的小羊收拢起大腿，试图遮住自己的下体。但对她身下的城市来说，艾雅法拉的小小心思只会让她臀下小世界的热岛效应更加剧烈。阴唇和菊穴缓缓散发出的温度无处释放，伴随着私处湿漉漉的气体从天际下沉到城市中，将这里变成了第一块被艾雅法拉的身体改造的土地。\n\n她伸出手切下一块城市区划，拿到眼前仔细端详起来。空荡荡的城市里只剩下寥寥一些智械还在徒劳地试图修复着东倒西歪的大楼。它们，连同整个城市都将幸运地成为艾雅法拉升格为天体级巨娘的第一批消耗品。\n\n艾雅法拉把手指伸到菊穴前，将手指和指尖上的小小城市伸进穴内。为了保证完全吸收，小羊强忍着刺激感，细心地将城市建筑抹碎在自己的肠壁，或许某些在强震和肠液侵蚀下幸存的智械能在直肠内的沟壑继续它们的打扫工作吧。\n\n将小人们生存其间的繁荣都市塞进下体里摧毁的羞耻感、菊穴四周敏感带被不断摩擦的瘙痒感和肠壁吸收星体能量带来的欣快感交织在一起。艾雅法拉逐渐放下了一开始的拘谨，越来越多的城市区划被切下，再被一股脑塞入菊穴的动作也不自觉的越来越快。然而被快速吸收的能量未能及时散去，而是愈发频繁地刺激着肠壁。尽管艾雅法拉努力忍耐着，但终于，一股废气伴随着腹鸣从肛门的束缚中排了出来。\n\n憋闷许久后放屁的畅快感在星体能量的影响下被百倍千倍的放大，小羊双腿发软，干脆平躺在已经被玩弄的不成样子的大陆上，闭上眼完全沉浸其中，想象着在臀下瑟瑟发抖的小人城市最终被高空中褐黄色的气浪掀翻，屁穴正对的地方化作如同核爆中心的废土，而弥漫的废气让整个星球都染上了她的气味...\n\n几分钟后，稍微冷静下来的艾雅法拉睁开眼，看到了近地轨道上的观测站。像是意识到了什么似的，她的脸颊瞬间变得通红。\n\n§r\"别...不要拍我...\"§!小羊不知道该遮住脸还是捂住下体，最后自暴自弃般地捂住了眼睛。
  gts_eyjafjalla.236.desc: "Eyjafjalla, wearing a swimsuit, took off her panties and knelt on the surface of [event_target:gts_eyjafjalla_planet.GetName]. Still feeling a little shy, the little lamb drew her thighs together, trying to cover her lower body. But for the cities beneath her, Eyjafjalla's little consideration only intensified the heat island effect under her buttocks. The temperature emitted slowly from her labia and butthole had nowhere to escape, and along with the wet gas from her private parts, descended from the sky into the cities, turning this place into the first piece of land transformed by Eyjafjalla's body.\n\nShe reached out and cut off a city district, bringing it up to examine it carefully. In the empty city, only a few machine intelligences were still trying in vain to repair the dilapidated buildings. They, along with the entire city, will be fortunate enough to become the first batch of consumables for Eyjafjalla's ascension into a celestial-level giantess.\n\nEyjafjalla reached a finger towards her butthole and inserted the finger with the small city on the tip into her rectum. In order to ensure full absorption, the little lamb endured the stimulation, and carefully crushed the city's buildings on her intestinal walls. Perhaps some machine intelligences that survived the strong tremors and the erosion of the intestinal fluids could continue their cleaning work in the grooves of the rectum.\n\nThe sense of shame of destroying a thriving city, where the small people were living, by stuffing it inside her lower body and the sense of itchiness caused by the constant friction of the sensitive areas around her butthole, and the euphoria brought by the absorption of stellar energy by the intestinal walls were all intertwined. Eyjafjalla gradually abandoned her initial restraint, and more and more city districts were cut off. Her actions of stuffing them into her butthole became faster and faster unconsciously. However, the rapidly absorbed energy failed to dissipate in time but was instead stimulating the intestinal walls more and more frequently. Despite Eyjafjalla's efforts to endure it, finally, a burst of waste gas, accompanied by a rumbling sound in her belly, was expelled from the confinement of her anus.\n\nThe feeling of relief after holding it in for so long was magnified a hundredfold and a thousandfold by the influence of stellar energy. The little lamb's legs went weak, and she simply lay down on the continent that had been played with beyond recognition. She closed her eyes and completely immersed herself in it, imagining the tiny cities trembling under her buttocks, eventually being overturned by the brownish-yellow air currents from high above, and the area directly under her butthole turning into a wasteland like the center of a nuclear explosion. And the pervasive waste gas stained the entire planet with her scent...\n\nSeveral minutes later, after calming down a little, Eyjafjalla opened her eyes and saw the observation station in near-Earth orbit. As if realizing something, her cheeks instantly turned red.\n\n§r\"D-don't...don't film me...\"§! The little lamb didn't know whether to cover her face or her lower body, and finally covered her eyes in self-despair."
  # 不断的吞噬让艾雅法拉的身体快速成长，终于，艾雅法拉的身体成长到了准天体级大小，刚才还与她大小相近的星球如今用一只手就能握住。现在距离完成升格仪式只差最后一步。\n\n艾雅法拉小心地将星球挪到菊穴附近。她轻抚着星球表面，将这颗曾保护自己的星球推入穴内。无数山川被皮肤磨为碎屑，留在了肛门周围，与那些即使仔细擦拭仍然留存在褶皱中的污泥融为一体，而星球的主体有惊无险的抵达了它本应呆在的地方 - 艾雅法拉体内的广袤空间中。\n\n星球上残存的观测系统向我们实时直播着艾雅法拉肠道内的画面：星球的天空被暗红色的肉壁笼罩，天外传来的肠内蠕动声无时不刻地干扰着行星通讯系统，粘稠的肠液滴落在星球护盾上，随时可能攻破护盾，将整个星球融作排泄物的一部分。而在更远的地方，一颗巨行星般庞大的球状物静静地堵在肠道深处，微微震动着。我们在第一次遇到艾雅法拉时，就检测到了这颗跳蛋，如今，在这位巨大 maiden领袖的后庭里，一颗繁荣的帝国星球甚至比一颗裹满黏液的性玩具更低微，也只有这个级别的人造物才能满足她的小小性趣，还是说，艾雅法拉其实早就忘记了这颗跳蛋的存在呢？\n\n似乎是感到了某种庞大的绝望感，观测团队启动了[event_target:gts_eyjafjalla_planet.GetName]武器库里所有能正常发射的星级重型导弹，向那颗跳蛋发射过去。结果显而易见，在几声闷响后，导弹未能伤到跳蛋分毫，而爆炸的能量则被完全吸收，这轮原本计划用于防范天灾入侵的跨星系导弹攻击就这样快速发生又快速消弭在了艾雅法拉的后庭里，甚至没能引起她的注意。\n\n§r\"诶，怎么有点痒...啊！那个...是之前阿米娅她们买的...\"§!\n得到能量激活的跳蛋开始疯狂震动起来，终于让艾雅法拉注意到了后庭里的异样。\n§r\"不好，好像太靠里了，完全摸不到啊...\"§!巨大的手指在庭内的小宇宙中胡乱摸索着，将肠内的星球、体液和污垢全搅作一团，而始作俑者的[event_target:gts_eyjafjalla_planet.GetName]伴随着黏液被一齐蘸在指纹间，被汗液和肠液彻底浸透。探索无果，艾雅法拉只得放弃，将手指拔了出来。\n\n§r\"唔...有点恶心...\"§!艾雅法拉猛地甩了甩指尖上的黏液。§r\"赶紧去找前辈他们去把那东西关掉吧。\"§!
  gts_eyjafjalla.237.desc: "The constant devouring made Eyjafjalla's body grow rapidly. Finally, Eyjafjalla's body had grown to a near-celestial size. The planet that was the same size as her before could now be held with one hand. Now, there was just one final step before completing her ascension ceremony.\n\nEyjafjalla carefully moved the planet near her butthole. She gently caressed the surface of the planet and pushed this planet, which once protected her, into her rectum. Countless mountains were ground into fragments by her skin and remained around her anus, merging with the filth that remained in the folds even after careful wiping. The main body of the planet arrived safely at the place where it was supposed to be - the vast space within Eyjafjalla's body.\n\nThe planet's remaining observation system was broadcasting the scene within Eyjafjalla's intestines to us in real-time: the planet's sky was covered by dark red fleshy walls, and the sound of intestinal peristalsis from beyond continuously interfered with the planetary communication system. The viscous intestinal fluid dripped on the planet's shields, threatening to break through the shields at any moment and turn the entire planet into a part of her excrement. And further away, a huge, planet-like sphere was quietly blocking the depths of the intestines, vibrating slightly. We detected this dildo when we first encountered Eyjafjalla. Now, in the rectum of this giantess leader, a thriving imperial planet is even more lowly than a dildo covered in mucus, and only this level of man-made object can satisfy her little sexual perversions. Or, could it be that Eyjafjalla has already forgotten the existence of this dildo?\n\nAs if she felt some kind of enormous despair, the observation team activated all the star-level heavy missiles that can be launched normally in [event_target:gts_eyjafjalla_planet.GetName]'s armory and launched them towards the dildo. The result was obvious. After a few muffled sounds, the missiles failed to wound the dildo in the slightest, and the energy of the explosion was completely absorbed. This round of cross-galaxy missile attack, which was originally planned to prevent a natural disaster, happened quickly and dissipated quickly in Eyjafjalla's rectum, without even attracting her attention.\n\n§r\"Eh, why does it feel a little itchy... Ah! That... it's the one Amiya and the others bought before...\"§! The dildo, which was activated with energy, began to vibrate wildly, finally making Eyjafjalla notice the abnormality in her rectum.\n§r\"Oh no, it seems to be too deep inside, I can't reach it at all...\"§! Her huge fingers were groping around wildly in the small universe inside her body, stirring up the planet, fluids, and filth inside her intestines, and the instigator of all of this [event_target:gts_eyjafjalla_planet.GetName], along with mucus, was all smeared on the fingerprints, completely soaked in sweat and intestinal fluid. After an unsuccessful search, Eyjafjalla had no choice but to give up and pull her fingers out.\n\n§r\"Uhm... a bit disgusting...\"§! Eyjafjalla vigorously flicked the mucus off her fingertips. §r\"I need to quickly go find the senior to turn that thing off.\"§!"
