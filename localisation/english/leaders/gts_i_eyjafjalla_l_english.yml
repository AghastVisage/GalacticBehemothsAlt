  # 调查事故
  gts_eyjafjalla.101.name: "Investigation Accident"
  # 一脸沮丧的艾雅法拉向我们发来了通讯，安慰半天后我们才明白发生了什么。\n在调查一颗无人星球时，过度熬夜的艾雅法拉在星球极地的冰川上不慎滑倒，重重的坐进了这颗脆弱星球的深处，当她尝试挣脱起身时，已经受到严重冲击的星球无法承受其力量而迅速解体，虽然艾雅法拉小姐本身并无大碍，但一整颗自然形成的星球就这样被她破坏掉这件事还是令她十分伤心。\n现在工程无人机已经被派往艾雅法拉小姐的裙子和臀下以回收可用的星球碎片。从反馈数据来看，附着在艾雅法拉身上的岩石都因她的伟力而化为合金般的坚硬物质，其他尘埃也都凝结为了优质矿物。或许艾雅法拉小姐在其它地方的潜力意外的大？\n当然，考虑到仅仅是不小心摧毁一颗星球就让她如此愧疚，为了不刺激她，我们还是不要这么做为好。
  gts_eyjafjalla.101.desc: "A dejected Eyjafjalla sent us a communication. After comforting her for a while, we understood what had happened.\nWhen investigating an uninhabited planet, Eyjafjalla, who had been staying up late too much, accidentally slipped on the glacier at the planet's polar region and heavily landed deep into the fragile planet. When she tried to struggle to her feet, the planet, which had already been severely impacted, could not withstand her strength and rapidly disintegrated. Although Miss Eyjafjalla herself was fine, she was still very sad about the fact that an entire naturally formed planet had been destroyed by her.\nNow engineering drones have been dispatched to Miss Eyjafjalla's skirt and under her buttocks to recover usable planet fragments. From the feedback data, the rocks attached to Eyjafjalla have been transformed into a hard substance like alloy due to her great power, and other dust has also condensed into high-quality minerals. Perhaps Miss Eyjafjalla's potential in other areas is unexpectedly high?\nOf course, considering that she is so guilty just for accidentally destroying a planet, to avoid upsetting her, it is better if we do not do that."
  # 好啦好啦，没事的
  gts_eyjafjalla.101.a: "Okay, okay, it's fine"
  # 涨奶
  gts_eyjafjalla.110.name: "Engorgement"
  # 艾雅法拉几天前向我们的医疗小组表示其胸部有些胀痛。\n经全面排查，医疗小组惊讶的发现艾雅法拉涨奶了！我们确信艾雅法拉小姐没有妊娠经历，但事实确实如此，这或许是因为她们的物种特性或者是矿石病康复的后遗症之类的原因。\n现在的当务之急是如何处理艾雅法拉乳房内的奶水，即便是保守估计，艾雅法拉小姐的一次喷乳也足以在我们的母星上形成一片内海。
  gts_eyjafjalla.110.desc: "Eyjafjalla told our medical team a few days ago that her breasts were a bit sore and swollen.\nAfter a comprehensive investigation, the medical team was surprised to find that Eyjafjalla was engorged! We are certain that Miss Eyjafjalla has no pregnancy experience, but the fact is indeed the case. Perhaps it is due to their species characteristics or the aftermath of Oripathy recovery.\nThe immediate priority now is to deal with the milk in Eyjafjalla's breasts. Even if conservatively estimated, one spray of milk from Miss Eyjafjalla would be enough to form an inland sea on our home planet."
  # 找个黑洞让艾雅法拉自行处理吧
  gts_eyjafjalla.110.a: "Find a black hole and let Eyjafjalla handle it herself"
  # 让工程部帮艾雅法拉处理一下
  gts_eyjafjalla.110.b: "Let the engineering department help Eyjafjalla with it"
  # 内海？我们的星球刚好有这样的改造计划！
  gts_eyjafjalla.110.c: "Inland sea? Our planet just happens to have such a modification plan!"
  # 我们又收到了艾雅法拉小姐涨奶的报告。\n现在我们已经做好充足准备应对艾雅法拉小姐海量的喷乳了，不过艾雅法拉小姐也表示她可以去某片无人星系自己解决问题，不用劳烦我们。
  gts_eyjafjalla.111.desc: "We have received another report of engorgement from Miss Eyjafjalla.\nNow that we are well prepared to deal with Miss Eyjafjalla's massive sprays of milk, but Miss Eyjafjalla has also stated that she can go to an uninhabited star system to solve the problem herself without troubling us."
  # 白洞
  gts_eyjafjalla.112.name: "White Hole"
  # 我们找到了一个偏僻的黑洞星系并发布了超光速交通禁令，所有安保舰队则驻守在进出该星系的各个跃迁锚点巡逻，保证艾雅法拉小姐挤乳的行为不会被不怀好意的人偷看。\n\n不久后，我们巡逻舰队都侦测到了来自黑洞方向的强烈引力波动，舰队赶到时只看到了赤裸上衣，面色潮红，乳头还在不停流淌着奶滴的艾雅法拉，以及短暂地变为白色的黑洞。\n\n据艾雅法拉自述，她在对着黑洞挤乳时被黑洞的引力吸引，情不自禁的将乳头伸入黑洞进行...哺乳。然而面对性兴奋的艾雅法拉，即使是黑洞也一时无法处理那么多乳汁，于是便喷发出强烈的引力波动，这才让艾雅法拉清醒过来。\n\n无论如何，艾雅法拉暂时解决了她的涨奶问题，我们的科研舰也收集到了非常有价值的研究数据。
  gts_eyjafjalla.112.desc: "We found a secluded black hole system and issued a supraluminal traffic ban. All security fleets are stationed at each jump point in and out of the system to ensure that Miss Eyjafjalla's milk extraction is not peeped at by malicious people.\n\nSoon after, our patrol fleets detected a strong gravitational fluctuation from the direction of the black hole. When the fleet arrived, they only saw Eyjafjalla with her upper body naked, her face flushed, and milk droplets still dripping from her nipples, as well as the black hole briefly turning white.\n\nAccording to Eyjafjalla's own description, she was attracted by the gravity of the black hole when squeezing milk facing it, and couldn't help but put her nipple into the black hole for...nursing. However, even the black hole could not handle that much milk in the face of the sexually aroused Eyjafjalla, so it sprayed out strong gravitational fluctuations, which made Eyjafjalla sober up.\n\nIn any case, Eyjafjalla has temporarily solved her engorgement problem, and our research ship has also collected very valuable research data."
  # 太好了
  gts_eyjafjalla.112.a: "Great!"
  # 等不及！
  gts_eyjafjalla.113.name: "Can't Wait!"
  # 工程部给出的方案非常简单粗暴:直接在艾雅法拉的乳头处抽取乳汁，直到抽干为止。\n\n但这个办法显然比较低效，在之后数周艾雅法拉无论是工作，进食还是睡觉，都要保持掀开衣服露出上乳的状态供运输舰队停靠，装载抽取的一大罐奶水然后运往帝国仓库。艾雅法拉一边要憋住喷出奶水的欲望，一边忍受着向帝国络绎不绝的运输队展示着自己的乳房的羞耻，一边还要忍受着乳头处抽水机器带来的若有若无的瘙痒。\n\n最终当她听说处理工作才刚刚过半时，她彻底接受不了，逃到星系中央，一边哭泣一边对着恒星自暴自弃地开始了挤乳。\n\n当她冷静下来后，她向工程部诚恳地道了歉，作为补偿，帝国仓库里从艾雅法拉身上抽取的乳汁就直接送给我们了。\n\n当然，她强烈要求以后工程部必须改进它们的处理方案。\n\n\n工程部当然会听取她的建议啦。
  gts_eyjafjalla.113.desc: "The solution given by the engineering department was very simple and crude: directly extract milk from Eyjafjalla's nipples until it's all drained.\n\nBut this method is obviously inefficient. In the following weeks, whether Eyjafjalla was working, eating, or sleeping, she had to keep her clothes up exposing her upper breasts for the transport fleet to dock, load a large can of milk that had been extracted, and then transport it to the Imperial warehouse. On one hand, Eyjafjalla had to suppress her desire to spray out milk, and on the other hand, she had to endure the shame of showing her breasts to the endless stream of transport teams who were constantly going to the empire, while also enduring the near-nothing itching caused by the water extraction machine at her nipples.\n\nIn the end, when she heard that the processing work was only halfway done, she couldn't accept it any longer and escaped to the center of the galaxy, where she began to squeeze her breasts in a self-destructive manner towards the star, while crying.\n\nWhen she calmed down, she sincerely apologized to the engineering department. As compensation, the milk extracted from Eyjafjalla that was in the imperial warehouse was directly given to us.\n\nOf course, she strongly demanded that the engineering department must improve their processing solutions in the future.\n\nThe engineering department will of course listen to her suggestions."
  # 内海
  gts_eyjafjalla.114.name: "Inland Sea"
  # 把乳房里的奶水倾泻在母星表面无论怎么说都太疯狂了，艾雅法拉小姐在我们好一阵劝说后才勉强同意。\n\n喷乳的预定地点是星球中部的一片热带沙漠，在此之前我们已经转移了当地的人口和有价值的设施，而全球乃至全帝国对这件事感兴趣的人们都被牢牢控制在几百公里的管制线外。\n\n为了方便艾雅法拉确定落点，喷乳时间被设定在当地夜间，数以万计的灯光将引导艾雅法拉校准乳头朝向。\n\n时间到了，在天幕中显现的，便是羞涩的艾雅法拉和握着胸前乳头的两只手。之后按照指示，艾雅法拉开始揉搓她的胸部，害羞逐渐转为享受，她不再顾忌身下星球上数以亿计的小虫子注视的目光，专心于她的自慰中，几滴乳汁先从乳头流出，落到星球上空，变成白色雨滴和冰雹落在干旱了千万年的沙漠里。\n\n随后雨越下越大，白色的海洋开始形成，而当艾雅法拉达到高潮时，海量的乳汁穿透了大气层的阻挡，直接注入到乳汁海中，海洋面积甚至超越了一开始的推测，看起来艾雅法拉在被注视的情况下自慰甚至会感到更加兴奋。虽然我们疏散掉了因乳汁海上涨而陷入危险的群众，但许多建筑就只能被抛弃，沉没在艾雅法拉自慰后留下的海洋里，在以后的数月里整个星球都满溢着奶香味。\n\n\n虽然很壮观，但我们以后还是不要这么做为好。
  gts_eyjafjalla.114.desc: "It was too crazy to pour milk from breasts on the surface of our home planet, and Miss Eyjafjalla barely agreed to it after a lot of persuasion from us.\n\nThe planned location for milk spraying was a tropical desert in the center of the planet. Before that, we have already relocated the local population and valuable facilities, and those from all over the globe and even the empire who were interested in this event were firmly controlled outside of the several hundred kilometers of the control line.\n\nIn order to make it easier for Eyjafjalla to determine the landing point, the milk spraying was scheduled at night, and tens of thousands of lights would guide Eyjafjalla to calibrate the direction of her nipples.\n\nThe time came, and what was shown in the sky was a shy Eyjafjalla with two hands holding her nipples in front of her chest. Then, as instructed, Eyjafjalla began to rub her breasts, and her shyness gradually turned into enjoyment. She no longer cared about the gaze of billions of tiny insects on the planet beneath her, and concentrated on her self-pleasuring. A few drops of milk first flowed from her nipples, fell into the sky above the planet, and turned into white raindrops and hailstones, falling on the desert that had been arid for tens of millions of years.\n\nThen the rain was getting heavier and heavier, and a white ocean began to form, and when Eyjafjalla reached her climax, a massive amount of milk broke through the barrier of the atmosphere and directly poured into the milk sea. The area of the ocean even exceeded the original prediction. It seems that Eyjafjalla even feels more excited when she is watched while pleasuring herself. Although we evacuated the masses who were in danger due to the rising milk sea, many buildings could only be abandoned and submerged in the ocean left behind by Eyjafjalla's self-pleasuring. For the following months, the entire planet was filled with the smell of milk.\n\nAlthough it was magnificent, it is better if we don't do that again in the future."
  # 我相信艾雅法拉可以自己解决问题
  gts_eyjafjalla.111.c: "I believe Eyjafjalla can solve the problem herself"
  # 选择此选项会禁止艾雅法拉涨奶事件再次弹出。
  gts_eyjafjalla.111.custom_tooltip: "Selecting this option will disable the Eyjafjalla engorgement event from appearing again."
  # 艾雅法拉成长计划
  gts_eyjafjalla.200.name: "Eyjafjalla Growth Plan"
  # 我们的科学家对艾雅法拉母星的地质勘察工作已经完成了。\n\n实验数据表明，其[event_target:gts_eyjafjalla_planet.GetName]自诞生到现在的历史相当之短，完全不符合星球形成和演化的一般规律。整个星球的物质很可能是艾雅法拉瞬间释放的海量能量在短时间内塑成的。\n\n目前最有说服力的猜想大概是这样:艾雅法拉曾经所在的世界比我们的宇宙都要大上数倍，那时的艾雅法拉在我们宇宙的相对大小足足有一个星系之大。而当她意外进入这个世界时，高冷真空的宇宙环境让她的身体本能地展开了能量护盾。\n\n能量大量散失让艾雅法拉陷入沉睡的同时，体型也缩小到了普通泰坦巨娘的大小。而这种不稳定的能量波动形成了这个星球上频繁的火山活动。\n\n换句话说，整颗星球本质上都曾是艾雅法拉身体的一部分。如果我们让这颗星球重新回到艾雅法拉的体内，或许她就能收回之前失去的力量？
  gts_eyjafjalla.200.desc: "Our scientists have completed the geological survey of Eyjafjalla's home planet.\n\nExperimental data shows that the history of [event_target:gts_eyjafjalla_planet.GetName] from its birth to the present is quite short, which is completely inconsistent with the general laws of planetary formation and evolution. The matter of the entire planet was likely formed in a short time by the massive energy released by Eyjafjalla in an instant.\n\nThe most convincing hypothesis at present is probably this: the world where Eyjafjalla once lived was several times larger than our universe. At that time, Eyjafjalla's relative size in our universe was as large as an entire galaxy. And when she accidentally entered this world, the cold and vacuum environment of space made her body instinctively deploy an energy shield.\n\nThe massive loss of energy caused Eyjafjalla to fall into a deep sleep, while her body size shrank to that of a normal Titan Giantess. And this unstable energy fluctuation formed the frequent volcanic activity on this planet.\n\nIn other words, the entire planet was essentially once part of Eyjafjalla's body. If we return this planet back to Eyjafjalla's body, perhaps she can regain the powers she lost before?"
  # 很好，立刻去准备吧
  gts_eyjafjalla.200.a: "Excellent, prepare it immediately"
  # 艾雅法拉现在这个样子就很好了
  gts_eyjafjalla.200.b: "Eyjafjalla is fine as she is now"
  # 艾雅法拉成长准备
  gts_eyjafjalla.201.name: "Eyjafjalla Growth Preparation"
  # 既然让艾雅法拉吞噬其母星已经列入日程，我们就得尽快开始人口和资产的转移工作。更不要说我们还得花上不少时间确定另一件事 -  - §Y要怎么让艾雅法拉用掉那颗星球？§!\n\n[event_target:gts_eyjafjalla_planet.GetName]上的人口和重要资产转移工作已经完成。人去楼空的都市群里安装了大量探测器和摄像头以实时记录艾雅法拉吞噬星球并成长时的星球环境变化和体内生理变化。\n\n据说不少艾雅法拉的狂热粉丝滞留或偷渡到这个星球，不过我们已经没时间去一个个找他们了，就满足他们的愿望吧。\n\n现在我们只需要通知我们的女主角，告诉她我们决定好的星球使用方式了！
  gts_eyjafjalla.201.desc: "Now that having Eyjafjalla devour her home planet is on the agenda, we have to start the transfer of population and assets as soon as possible. Not to mention, we still have to spend quite a bit of time figuring out another thing - §YHow is Eyjafjalla going to use that planet?§!\n\nThe transfer of population and important assets on [event_target:gts_eyjafjalla_planet.GetName] has been completed. A large number of detectors and cameras have been installed in the empty city clusters to record the planet's environmental changes and internal physiological changes in real-time when Eyjafjalla devours the planet and grows.\n\nIt is said that many of Eyjafjalla's fanatic fans have stayed or smuggled themselves onto this planet, but we no longer have time to find them one by one, so let their wishes be satisfied.\n\nNow, we just need to notify our leading lady and tell her about the way we decided for her to use the planet!"
  # 接入通讯
  gts_eyjafjalla.201.a: "Initiate Communication"
  # 呜，真的要我把它吃掉吗？大家在这个星球上花了不少精力才建好的城市，就为了我而被毁掉...\n\n§Y艾雅法拉扭扭捏捏的看着面前这个和自己等大的盖亚星球§!\n\n诶，大家都很乐意吗？为了科学啊...好吧，那么我要怎么处理掉这个星球呢？
  gts_eyjafjalla.202.desc: "Uuuh, do you really want me to eat it? Everyone spent a lot of effort building cities on this planet, and they will be destroyed for my sake...\n\n§YEyjafjalla looks at the Gaia planet in front of her, which is as big as her, fidgeting nervously§!\n\nEh, everyone is happy about it? For science... Okay, then how do I deal with this planet?"
  # 把星球一口口吃掉吧
