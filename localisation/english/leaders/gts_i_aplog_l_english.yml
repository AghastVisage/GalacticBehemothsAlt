  # 这个星球上的人类已经明白了雁栖和艾普露两个人想要做什么了，可问题在于他们根本没有能力反抗那两个怪物，一整个装甲团对她们而言也不过就是一脚的事，使用最大当量的核武已经变成了他们最后的一个选择——然而这一切都在雁栖发出的那个投票面前彻底崩溃了，「万一那两个恶魔只是去祸害其他城市呢？」\n\n这样的想法出现在了普通人的脑海中，而一些意志不坚定的领导人也是这么想的\n\n「小烧猫，去看一下哪个票数比较高」\n\n本来雁栖是打算自己直接碾过去的，但看到不整衣装的大猫猫就躺在废墟里晃尾巴她就莫名的想草……一定是女神下的咒，一定是\n\n「好麻烦喵，这种小虫子们的投票根本没有看的必要吧，还是说雁栖姐你的体力不……」\n\n艾普露挑衅的话语还没有说完便被扑面而来的高跟鞋击中——只是击中倒还好，毕竟她们俩的体型截至目前为止还是相同的，那鞋跟都足以碾死数百个人类的高跟鞋也不过是让她痛一下罢了\n\n可事情并没有像艾普露想的那么简单，毕竟挑衅那些连她足垢都无法清理掉的小人和位格比她还要高的神女是两种事\n\n散发着闷热臭气的高跟鞋把艾普露倒扣在了城市间，原本体型相差不大的两位神女一下子拥有了云泥之别\n\n「哎呀，小烧猫，刚刚忘记跟你说了，投票的结果除了要我们去a国以外，还有把你变小十倍哦～」\n\n雁栖没有说出的话是她还变大了十倍，她只是往地上一坐便把先前那个摆放手机的城市给完全覆盖住了，对于小人而言，一位神女用身体覆盖自然就意味着处决\n\n「呜呜呜！」\n\n艾普露发出来意味不明的嚎叫，但雁栖没有选择理会她，她只是坐在小人的城市——现在可以说是城市残骸上，安稳而又优雅的系上黑丝，她并没有什么奇怪的爱好，比如往丝袜里亦或是鞋子里放上缩小人缩小城市什么的，直到今天为止她才明白了为什么自己的同僚喜欢这样的玩法了\n\n丝袜亦或是高跟鞋内本来闷热潮湿的环境就足以处决掉大部分的小人，而其中侥幸活下来的则会毫无疑问的成为神女们的足部养料，哪怕是最幸运的那一波人，他们最终也会在神女走动的过程中成为神女鞋面或是脚底的一抹嫣红\n\n以上的想法出自雁栖把艾普露穿在鞋里的那一刻——艾普露的m属性大爆发让她的神女同僚能够真正的把她当做一只小虫子穿进去，当然，艾普露之前并不是什么事都没有做，在保持着千米的姿态，她还是能够很轻松的挖取城市地块铺在雁栖的高跟鞋中\n\n「A国啊……跟你的名字很搭呢，小烧猫～」\n\n虽然拥有十万米高的体型，哪怕是山岳也就是一抬脚的事，但为了充足的得这个小星球上的文明带来她们所拥有小力量，她选择了很慢很慢的走过去，不过话又说回来了，她一开始发起的投票也就是「欣赏」\n\n呀\n\n十万米高的身躯对于那些已经摆脱了重力场束缚的文明也能过称得上是恐怖至极，更何况这个弱小的文明，在雁栖走向投票数最高的a国路上中，就有超过两位数的城市被雁栖穿着高跟鞋的巨足给拦腰截断亦或是完全覆盖，这个时候就不得不说高跟鞋比之裸足的区别了，雁栖是穿着高跟鞋来阔阔的造成的死亡数有着将近7亿2312万，这要是换成艾普露的裸足，伤亡恐怕能直奔12亿
  gts_aplog.1026.desc: "The humans on this planet have understood what Yanxi and Apro wanted to do, but the problem was that they had no ability to resist those two monsters, even an entire armored corps was nothing to them other than something to step on. Using a nuclear weapon of the highest yield had become their last option-but all of this completely crumbled before the poll that Yanxi had created; \"What if those two devils just go and mess up other cities?\"\n\nSuch thoughts entered the minds of ordinary people, and some weak-willed leaders thought the same thing.\n\n\"Little slut cat, go look what the top vote is.\"\n\nOriginally, Yanxi was going to just crush them directly, but when she saw the great cat, who was not dressed completely but just wagging her tail while lying in the ruins, she inexplicably wanted to fuck her... it must be a curse cast by the goddess, it must be.\n\n\"How troublesome, there's no need to look at the votes of these little bugs, does this mean sister Yanxi, you have no stamina-\"\n\nBefore Apro could finish her provocations, she was hit by a high heel that came at her face-it was still okay to just hit her, after all, their size was still the same up to this point. The heel, which could crush hundreds of humans, could do no more than just make her hurt a little.\n\nBut things were not as simple as Apro imagined, after all, provoking the small people, that even she couldn't clean the filth from their feet, was different from provoking a goddess who was above her in the hierarchy.\n\nThe high heel, which was emitting a hot and foul scent, slammed Apro into the cities, the two goddesses who were initially almost the same size had instantly become as different as the clouds and the mud.\n\n\"Oh dear, little slut cat, I forgot to tell you just now, the result of the vote was that besides us having to go to country A, you'll have to shrink down ten times, meow~\"\n\nWhat Yanxi didn't say was that she has also grown ten times larger. She only fully covered the city where she had posed her phone just by sitting down. For the small people, the act of a goddess covering something with her body was a sure death sentence.\n\n\"Uuuuuh!\"\n\nApro let out an unclear wail, but Yanxi chose to ignore her. She just sat stably and elegantly on top of the small people's city -  now you could say it's the remains of a city, and then put on her black silk stockings. She didn't have any peculiar hobbies like putting small people or small cities in her stockings or shoes. It was only today that she actually finally understood why her colleagues liked such play styles.\n\nThe hot and humid environment inside stockings and high heel shoes is enough to execute most of the small people. The lucky ones who survive will undoubtedly become nourishment for the goddesses' feet. Even for the luckiest of the lot, they will eventually become a smear of red on the goddesses' shoe or soles when the goddesses walk.\n\nThe above thoughts were from when Yanxi put Apro inside her shoe-Apro's m-attribute had completely exploded and enabled her goddess colleague to truly treat her like a small bug that she could put on. Of course, Apro wasn't completely submissive before this, as she was still able to dig up chunks of the city to place inside Yanxi's high heels with ease while maintaining her 1000-meter stature.\n\n\"Country A, huh... it actually suits your name quite well, Little slut cat~\"\n\nAlthough she has a 100,000 meters tall body, and that even mountains were just obstacles to overcome with each stride, in order to truly let the civilisation of this little planet experience the power that they possessed, she chose to walk very, very slowly. But then again, the vote that she had initiated was for them to \"Appreciate\" after all.\n\nA body that was 100,000 meters in height was an extremely frightening figure for those civilizations that have broken free of the shackles of gravity, not to mention this weak civilization. On the road to the country A, which received the most votes, more than 10 cities had been cut in half or were completely covered by Yanxi's giant feet in high heels. At this point, you couldn't help but appreciate the difference between high heels and bare feet. Yanxi's rampage while wearing high heels caused something like 723,120,000 causalities. If she had done it with Apro's bare feet, then the casualties would have probably been around 1.2 billion."
