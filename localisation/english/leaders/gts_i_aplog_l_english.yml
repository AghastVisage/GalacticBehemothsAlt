  # 「噗啪」健康色泽的裸足踏在这个星球上，带来恐怖的震动以及并发的灾难，然而这双脚的主人丝毫不在乎她引发的灾难——她甚至饶有兴致的望着自己刚刚踩出来的脚印，一座城市正被她留下的脚印拦腰截断\n\n「一百二十一万七……哎呀，万后面的数字根本没必要去记喵～」\n\n巨大的猫娘笑眯眯的蹲了下来，刻意用自己的身子挡住了太阳，将近万米的身高所投下来的绝望阴影足以将整座城市笼罩——艾普露甚至能够听到人群的哭喊声，绝望与哀鸣的声音是那么悦耳\n\n然而只是这么看着还是太过无趣了，远比小孩子蹲在路边看蚂蚁要无趣，艾普露晃了晃她的尾巴后这么想到，不如随着尾巴落在城市边缘而激起的人类惨叫声，她想到了一个坏坏的想法——她让黑色尾巴落在了城市中，大多数猫科动物都会对尾巴很敏感，而猫娘自然也是如此\n\n「对了喵，女神的旨意要留下执行人的签名…那就用咱的尾巴签好了」\n\n和女神麾下其他的神女们不同，虽然艾普露也喜欢在人类的城市与星球中写下自己的名字，但她更喜欢用自己的尾巴，因为她的尾巴特别敏感，碾在小小的城市中能够给她带来别样的快感\n\n「签好了！现在是多少了喵……二百三十二万……那应该差不多了？」\n\n听着这像是玩够了的发言的人类们终于抬起了头，他们期待的看着那遮天蔽日的魔鬼玩腻了走开，可惜的是他们的愿望落了个空，大坏猫可不会这么轻易的放过被她选中的玩具\n\n「剩下的就……不留着咯～」\n\n带着雄浑热气的巨足毫不留情的碾了过去，尽管她的言语轻佻而顽皮，但碾过人类城市的力道却像是在复仇一般，无论是刚刚用尾巴画出的名字还是人类花了数十年修建的高楼，全部被她当做缓解足底炽热的消耗品了\n\n当然，万米级别的巨娘即便是仔细的碾过去，她们那巨大的指纹中都能留下让人类苟延残喘的空间，更何况这只大猫只是随意的碾过——只不过即便如此，这个位于前光速时代的都市群也算是彻底消失了
  gts_aplog.1021.desc: "\"Plop\" a healthy-colored bare foot stepped onto this planet, bringing a terrifying tremor and the disaster that came after, the owner of these feet isn't concerned with the disaster that she causes-she was even happily looking at the footprint that she just stepped out, a city is being cut in half by the footprint left behind.\n\n\"One million, two hundred and seventeen thousand... ah, there's no point of remembering the numbers after a million, meow~\"\n\nThe giant catgirl smiled and squatted down, deliberately using her body to block the sun. The despairing shadow cast by her nearly ten-thousand meters of height was enough to envelop the entire city-Apro could even hear screams among the crowd, the sounds of despair and sorrow were so pleasant to hear.\n\nHowever, just watching was too boring, even more boring than a child crouching on the side of the road watching ants, Apro thought after waving her tail. Then, after she used her tail to hit the edge of the city and provoked human screams,she came up with a wicked idea-she dropped her black tail into the city, most felines are very sensitive to their tails, and the catgirl was naturally the same.\n\n\"That's right meow, the goddess's orders asked to leave a signature of the executor... so I'll just sign with my tail then.\"\n\nUnlike the other goddesses under the deity's command, although Apro also liked to write her name in the human cities and planets, she preferred to use her tail, because her tail was especially sensitive and stomping it on the small city brought her a different kind of pleasure.\n\n\"Signed! What is the number now meow... Two million, three hundred and twenty thousand... that should be about right?\"\n\nHearing the playful words that indicated that she had enough, humans finally looked up. They were looking up expectantly, hoping the sky-obscuring devil would get bored and leave. Unfortunately their hopes were not fulfilled as the bad cat would not so easily let go of a toy that she had selected.\n\n\"The rest is... Not needed anymore~\"\n\nWith a resounding and heated step, the giant foot stomped down mercilessly. Although her words were frivolous and playful, the force that crushed the human city was as if she was taking revenge, both the signature she drew using her tail and the towering buildings the humans had built over the decades were all treated like expendable materials to relieve the heat from her soles.\n\nOf course, even if 10k meter giants were careful when crushing a place, they would still leave traces of small life that could survive in the cracks of their giant footprints, not to mention that this big cat was just casually crushing down - but even so, the urban complex of this early FTL era could be regarded as completed destroyed."
  # 女神的任务
  gts_aplog.1022.name: "The Goddess's Task"
  # 「所以……为什么会有保持这样体型的处决任务喵，女神大人是闲的O疼了吗？」\n\n尽管像是在抱怨，但艾普露却很高兴的看着这片星球，一个即将完成繁荣统一的前光速文明，如果把他们分割成城市来玩的话是能够晚上许久的——而女神大人下发的任务也只是要求处决这上面的智慧生命罢了\n\n「中午好喵～」\n\n艾普露一边笑着一边对地上的坦克集群打着招呼，当然，她用的是已经踩的脏兮兮的脚\n\n早在艾普露碾过第一座城市的时候，这个星球上的人类就已经组织好了反抗部队，可惜的是无论是他们的空军陆军亦或是海军，都没办法对这个保持着万米姿态的巨娘造成足够的伤害，甚至大多数武器只能给她带来情趣的快感\n\n「好玩么？」\n\n「哈哈，超好玩的～………喵？」\n\n本来艾普露是开开心心的望着地面上士气崩溃的军队，在琢磨着怎么接着让他们重新鼓起士气向她发起反击来着，但现在她可不敢这么想了，毕竟此刻出现在她身边的家伙，可是比她还要暴虐上十倍的怪物啊！「等等，为什么你会在这喵！」\n\n大猫显然没有想到除了她之外还有其他女神大人麾下的神女来到这个不起眼的小星球上，事实上哪怕是整个「玩具箱」\n\n中的宇宙文明联合起来在面对一位神女的情况下都无法做到自保，他们能够活多久全看神女或者她们那位女神的意愿罢了\n\n「怎么，不欢迎我？」\n\n雁栖挑了挑眉，随即露出了一个坏笑并向着大猫走去——两人此刻都是万米级别的伟岸身躯，这也就意味着对她而言的如同散步一般的行为，其实对于已经惨遭艾普露蹂躏的人类而言又是一场惨绝人寰的屠戮\n\n但其实……如果客观的看，雁栖穿的毕竟是高跟鞋，从她鞋跟到鞋底的距离也足够容纳一些幸存者\n\n「就不欢迎你！哈！！！」\n\n大猫猫选择了哈气，然而这样的行为对于她脚下那些被蹂躏的生物来说也许能称得上是威慑，亦或是一种强大的武器——但是她这么对同位格的神女还是多少有点看不起自己人了\n\n大猫猫被揪住了耳朵，随后便瘫软的倒了下来，虽然猫咪的耳朵相当敏感，但这并不是艾普露被揪一下就直接倒下的原因——真正的原因是这里还有一片大城市可以给她当成地毯
  gts_aplog.1022.desc: "\"So... why would there be a task that required me to stay at this size, meow? Does the goddess have nothing to do?\"\n\nDespite complaining, Apro was still happily looking at the planet, an early FTL civilization that had almost achieved prosperity and unity. If she split them into cities to play with she would have more than enough to keep herself occupied for a long time-and the task that the Goddess had issued was just to execute the sentient life there.\n\n\"Good afternoon, meow~\"\n\nApro greeted the tank divisions on the ground while smiling. Of course, she was doing it using her foot that was already covered in dirt.\n\nLong before Apro stepped on the first city, the humans on the planet had already organized a resistance force, but unfortunately, their air force, ground force, or even navy couldn't inflict enough damage on the giantess who was at 10,000 meters. Most weapons would just bring pleasure to her. \n\n\"Is it fun?\"\n\n\"Haha, it's super fun~..... Meow?\"\n\nApro was originally happily watching the morale of the troops on the ground collapsing, she was thinking of how to make them raise their morale again and start attacking her again but now she wouldn't dare think of that again, because the being that was now appearing beside her was a monster that was ten times more cruel than her! \"Wait, why are you here, meow!\"\n\nThe great cat definitely didn't expect that there would be other goddesses under the goddess's command on this insignificant little planet, in fact, even the entire inter-civilization alliance inside the \"Toy Box\"\n\nUniverse couldn't protect themselves when facing a goddess, their survival depended on the goddesses or their goddess's will.\n\n\"What, are you not welcoming me?\"\n\nYanxi raised her eyebrow, then showed a mischievous smile and walked towards the great cat-both of them were, at this moment, at a majestic 10k meter state. Which meant that what was just like simply taking a walk for her was actually a terrifying massacre for the humans who were already being tormented by Apro.\n\nBut actually... if you were to look at it objectively, Yanxi was wearing high-heels, the space between her heel and the sole of her foot were big enough for some survivors to take shelter.\n\n\"I don't welcome you! Hah!!!\"\n\nThe great cat chose to hiss, however such an act might be considered to be a deterrent to the beings that she had trampled on, or even a powerful weapon-but for her to do this towards a goddess who was her equal, was simply looked down upon her self.\n\nThe great cat was grabbed by her ear then collapsed limply, although cats' ears were extremely sensitive, that wasn't the true reason why apro collapsed so easily after being grabbed-The true reason is that she had a large city that she could use as a carpet here."
  # 女神的任务
  gts_aplog.1023.name: "The Goddess's Task"
  # 「喵喵喵！松开呀！」\n\n雁栖松开了手，可还没等艾普露揉了揉那已经开始发烫的耳朵雁栖便一口咬了上去——她确实是松开了，可她也没说就这么放过这只小猫呀\n\n最终的结果是俩个人一同扭倒在了城市群中，这对神女们而言自然没有多大伤害，甚至倒不如说她们更像是故意的，毕竟对神女而言自己身体的每一个都是处决小人的绝佳武器——如果以女神的视角看来那么她俩现在像是两条蛆扭在一起，而如果是被她们碾在身下的小人看来……那么她们现在就像是两条狂龙在人类城市里交配一般\n\n「等等，这是什么喵………」\n\n似乎是感受到了又是什么锐物顶到了她，艾普露的脸色突然从享受变成了………更加享受，她随意的握住了周围结构还算完整的城市，她做出来了一个喂食的动作\n\n将近百米的高楼在神女的手中脆弱的跟脆脆鲨也没有什么区别，而味道嘛……对于她们而言，钢筋混疑土与星球本身的味道都是一样的，无非是脆一点还是厚重一点\n\n「好吃吧——喂，你来真的喵！」\n\n刚刚把手的小零食「喂给」\n\n了雁栖的艾普露感受到了压在她身上的重量减少了一点，可她还没来的及爬起来眼光就瞄到了雁栖正在脱裙子\n\n脱裙子………艾普露已经想到了接下来要发生什么事了——她要艾草了，她要被草飞了，她要……爽死了\n\n大猫没有露出犹豫的神色，她只是撑着身子起来，然后找到了一个绝佳的位置像一只发情的雌兽一样趴了下来\n\n「来真的？」\n\n雁栖重复着艾普露的话，不过和艾普露兴奋且性奋的语气不同，她刚刚抹完嘴发出的声音是像周末被无良老板喊过来加班的社畜\n\n「女神的任务罢了」\n\n尽管两位少女已经再这个星球上阔阔了好一阵了，但实际上造成的破坏并不算太过恐怖，除了一开始艾普露写过名字的城市已经试图做出反抗的部队已经她俩现在正在阔阔的城市，其他生活在这个星球上的人都没有遭到屠戮——其实在这个前光速文明的星球上，还有许多国家并不知道他们的星球已经成为了神女们的玩具了\n\n「你脱，还是我帮……你怎么都弄完了」\n\n艾普露此刻已经乖乖的趴好在了地上，除了勉强裹住饱满胸部的bra以外已经不着片点衣褛，就在雁栖犹豫着想是草飞自己的同僚还是去女神的胃袋里清理顽固的残渣的时候，艾普露已经很自觉的把衣服脱干净并且随意丢在了地上，至于有没有覆盖或是压垮几座小城镇……她已经不想去想那么多了\n\n「快来喵～快来喵～」\n\n似乎是觉得自己不够有吸引力，害怕自家的同僚用着下面的巨兽去阔阔其他小人，艾普露特意拍了拍自己饱满的臀部来勾引她——勾引的效果是很奏效的，只不过这对她的同僚而言可能并不算是勾引，这对雁栖更像是挑衅
  gts_aplog.1023.desc: "\"Meow meow meow! Let go-nya!\"\n\nYanxi released her hand, but before Apro could rub her now-burning ear, Yanxi bit it at once-she did release it, but she never said she would just let her go.\n\nThe result of this was, the two of them tumbled down into the urban complex. Naturally, it didn't cause much damage to them. In fact, it was more like they were doing it on purpose, since every part of a goddess's body is a perfect weapon to execute small people. To a goddess, they probably look like two maggots writhing together, but to the small people being crushed under them... they look like two giant dragons mating in a human city.\n\n\"Wait, what's this, meow...\" \n\nSeemingly feeling a sharp object poking her again, Apro's face suddenly changed from an expression of pleasure to... a more intense expression of pleasure. She casually grabbed a nearby city that was still structurally sound, and made a motion of feeding someone.\n\nHigh-rise buildings, reaching near 100 meters in height were just as fragile as a crispy wafer in the goddess's hands. As for their taste, to them, the taste of concrete and steel was the same as the planet itself; it was all just a question of whether they were a bit crunchy or thick.\n\n\"Is it good -  hey, you're being serious, meow!\"\n\nApro, who had just \"fed\" her snack in her hand to Yanxi, felt her body lessen under her. But even before she could climb up, her gaze was caught by Yanxi, who was taking off her skirt\n\nTaking off her skirt... Apro had already imagined what was about to happen next -  she was about to get fucked, she was about to get fucked flying, she was about to... get satisfied to death.\n\nThe great cat didn't hesitate at all, she just braced her body and found the best spot, then lay down like a female beast in heat.\n\n\"Are you being serious?\"\n\nYanxi repeated Apro's words, but unlike Apro's excited and horny tone, the sound she made after wiping her mouth was like a company employee who was forced to work overtime on the weekend by an unscrupulous boss.\n\n\"It's just the goddess's task.\"\n\nAlthough the two girls have been causing a ruckus on this planet for a long time, the destruction they had caused wasn't too terrifying. Except for the city where Apro had drawn her name and the forces that were trying to resists, as well as the city were they were currently causing a ruckus, many other people on this planet had not been slaughtered - in fact, on this pre-FTL planet, there were many countries that were still unaware that their planet had become a toy in the hands of the goddesses.\n\n\"Are going to take it off yourself, or should I help... how did you finish already?\"\n\nApro was already lying obediently on the ground, wearing nothing besides a bra that was barely concealing her full breasts. While Yanxi was hesitating as to whether she should take down her comrade or go to the goddess's belly to clean up the stubborn scraps, Apro had already consciously taken off her clothes and thrown them down carelessly. Whether it covered or crushed a few small towns in the process.... she didn't want to think about it anymore.\n\n\"Come here, meow!~ Come here, meow!~\"\n\nSeemingly thinking that she wasn't attractive enough, scared that her comrade would use the monster below her body to go mess with other small people, Apro deliberately patted her full buttocks to seduce her-the seduction was very effective, but for her comrade, that probably didn't count as seduction. For Yanxi, it was more like a provocation."
  # 女神的任务
