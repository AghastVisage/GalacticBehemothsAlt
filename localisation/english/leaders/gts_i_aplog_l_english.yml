  gts_aplog.10.name: "Strange Troops"
  # 艾普露兑现了她当初的承诺，尽管她所消耗的人是几乎不可估量的\n\n当我们来到她的\"皇宫\"里时，一群被她抓走当成女仆的人正围在她的身体周围，不断刺激这这只巨大猫娘的敏感点，艾普露她也不含糊，用一个由几个女仆绑在一起做成的自慰棒狠狠在下体抽插着\n\n\"这是你们的部队…\"\n\n高潮之后软倒在地的艾普露指了指一个房间，在里面，我们找到了一批训练好的部队\n\n虽然确实如她所言，除了服从命令之外这些家伙什么都不会做，但是看着她们空洞的双眼和浑身上下散发出的不可名状的味道，我们有理由猜测一些不好的事情……
  gts_aplog.10.a: "Apro has fulfilled her initial promise, although the number of people consumed by her can hardly be estimated.\n\nWhen we arrived at her \"palace\", a group of people she had captured as maids were surrounding her body, constantly stimulating the giant catgirl's sensitive spots. Apro, without holding back, was violently thrusting her lower body with a dildo made of several maids bound together.\n\n\"These are your troops...\"\n\nAfter climaxing, Apro collapsed on the floor and pointed at a room. Inside, we found a batch of trained troops.\n\nAlthough they do indeed do nothing but obey orders as she said, looking at their empty eyes and the indescribable smell emanating from their bodies, we have reason to suspect some unpleasant things..."
  # 别管了，这些东西知道的越多，我们越危险
  gts_aplog.10.a.answer: "Never mind, the more we know about these things, the more dangerous it is for us."
  # 我们高估了艾普露的邪恶一面\n\n当看到她把那些可怜的家伙一把一把塞进下体里的时候，我们才反应过来，为了这支陆军我们要付出什么样的代价。在一进一出的抽插中，腥涩的液体冲刷出大量的小人残骸，无论是断臂，骨骼，还是粘稠的血液，混在巨大艾普露的自慰中被碾碎得几乎看不见\n\n看到我们来讨要军队的特使，这只淫乱的恐怖巨猫甚至向她们伸出了那只沾满淫液的手，要不是躲避的及时，我们的特使恐怕也要消失在那个深不见底的巨穴内\n\n\"训练好了，在这里哦喵~\"\n\n艾普露从一边捡起来一只袜子，只是抖了抖，里面就扑簌簌地掉落出许多小人，摔在地面上后也不知道疼痛，只是麻木的站起来，用空洞的眼神盯着那只袜子\n\n\"有了这个，你就能指挥他们喽~\"\n\n艾普露把那只袜子朝我们的特使一丢，就继续沉浸在她那无休止的欲望中里了
  gts_aplog.10.b: "We overestimated Apro's evil side.\n\nIt was only when we saw her stuffing those poor things into her lower body that we realized what price we had to pay for this army. During each thrust, a foul-smelling fluid flushed out a large number of small people's remains. Arms, bones, and viscous blood, all mixed together during the giant Apro's masturbation, were crushed almost beyond recognition. \n\nWhen our envoys came to ask for their troops, this lewd and terrifying giant cat even stretched out her hand covered in lust fluid towards them. If they hadn't dodged in time, our envoys would likely have disappeared into the bottomless abyss.\n\n\"They're trained, they're over there meow~\"\n\nApro picked up a sock from the side. With just a shake, many small people fell out. They didn't seem to feel pain after hitting the ground, but stood up numbly, staring at the sock with empty eyes.\n\n\"With this, you can command them, meow~\"\n\nApro threw the sock towards our envoys and continued to indulge in her endless lust."
  # 至少…我们得到了我们想要的…
  gts_aplog.10.b.answer: "At least... we got what we wanted..."
  # 她对我们做了什么！？\n\n我们不应该答应她的，现在，我们的人民像是垃圾一样挣扎在她的统治之下，承载着无数人的城市就这样被她捧在手中，随手一丢就消失在她的喉咙深处，化作养分消逝在她翻滚的胃酸中，甚至有些倒霉的城市在被她吃掉之前，还要经过猫捉老鼠一般的挑弄\n\n当艾普露光着双足站在被她选为食物的城市中时，无数的火炮和爆炸在她的脚趾上绽放开来，但是巨大的猫娘只是轻轻扣了扣脚趾，那些所谓的火炮和导弹就尽数被她肉山一般的指纹磨灭，而那些幸存者也只能苟活在巨大猫猫的脚趾缝里，被迫呼吸那令人窒息的空气。当艾普露玩够之后，这些哭喊着的人们只能眼睁睁地看着她把残破不堪的城市挖起，送入自己粉嫩的小穴或者黑暗的巨口中\n\n看到我们的特使，艾普露只是无聊地在地上拖了拖脚，把那座还在挣扎的城市彻底变成黏在脚底上的残骸之后，把手伸进来她的小穴，在一阵\"咕叽咕叽\"的恐怖声音之后，她把一个混合着爱液的废墟城市扔到了我们的面前\n\n\"呐~能抵御住小穴的挤压，这些小东西是最成功的一批呢喵~希望下次还有这么顽强的家伙哦~\
  gts_aplog.10.c: "What did she do to us!??\n\nWe shouldn't have agreed to her offer. Now, our people are struggling like trash under her rule.  A city carrying countless people is held in her hands and disappears down her throat, turning into nutrients that are digested in her churning stomach acid. Some unlucky cities even have to endure a cat-and-mouse torment before being eaten by her.\n\nWhen Apro stood barefoot in the city she had chosen to be the feeding ground, countless cannons and explosions bloomed on her toes. But the giant catgirl simply tapped her toes, and all the so-called cannons and missiles were erased by the prints of her fleshy toe pads. The survivors could only struggle for their lives in the crevices of the giant cat's toes, forced to breathe the suffocating air. When Apro was done playing, those crying humans could only watch helplessly as she dug up the dilapidated city and tossed it into her pink honey hole or dark maw.\n\nSeeing our envoys, Apro listlessly dragged her foot on the ground. After turning the city that was still struggling into remains that stuck to her sole, she put her hand deep into her small hole. After some \"squish squish\" sounds, she threw a ruins that was mixed with love fluids at us.\n\n\"Well~ these small things that can resist the squeeze from my honey hole the best. I hope there'll be more tenacious ones next time, meow~\"
  # 苍天啊…
  gts_aplog.10.c.answer: "Oh, heavens..."
  # 艾普露的训练
  gts_aplog_training_tiny: "Apro's Training"
  # 训练之后的小人拥有更强的忍耐力，至于那些不合格的小人嘛...
  gts_aplog_training_tiny_desc: "After training, the small people have stronger endurance. As for the unqualified ones..."
  # 教官？玩具！
  gts_aplog.11.name: "Drill Sergeant? Toy!"
  # 我们高估了这只猫娘的吹嘘，特别是当她在我们那些没有战斗经验的姑娘们的下体里挣扎的时候\n\n被沾湿成了深紫色的头发和猫耳趴在她的脑袋上，就算再怎么挣扎也无济于事，只能绝望地看着自己一点一点地往小穴更深去挤进去\n\n\"喵…主人！主人求求你…不要…艾普露不要到那里去…\"\n\n可惜我们那些正在性头上的姑娘们根本听不见玩具一样的艾普露的求饶，随着\"咕叽\"一声和艾普露的悲鸣，这个被当成跳蛋的小体型巨娘就被我们这些新兵姑娘们彻底塞进了蜜穴中\n\n希望她能开心
  gts_aplog.11.desc: "We overestimated this catgirl's bragging, especially when she was struggling in the lower bodies of our inexperienced recruits.\n\nHer dark purple hair and cat ears, which were wet with lust fluids, were plastered on her head. No matter how hard she struggled, it was futile. She could only watch helplessly as she was being pushed deeper and deeper into the small hole.\n\n\"Meow... Master! Master please... don't... Apro doesn't want to go there...\"\n\nUnfortunately, our girls, who were already in the heat of it, couldn't hear Apro's plea, a toy like giantess. With a \"squish\" sound, combined with Apro's cry, this small-sized giantess who was used as a vibrator was completely stuffed into the honey holes of our new recruits.\n\nHopefully she enjoys it."
  # 看来她对于提高士气很有用呢
  gts_aplog.11.a: "It seems she's indeed helpful for improving morale."
  # 教官？玩具！
  gts_aplog_training_gts: "Drill Sargeant? Toy!"
  # 我们的巨娘战士把艾普露当做用不坏的小玩具使用，似乎大家都士气高涨
  gts_aplog_training_gts_desc: "Our giantess warriors are using Apro like an indestructible toy. It seems everyone's morale is high."
  # 索要贡品
  gts_aplog.12.name: "Demanding Tribute"
  # \"喂，看到我的时候，你们这些小虫子就应该知道要做什么了吧！\"\n\n看着屏幕里一脸不耐烦的紫发猫娘，又透过落地窗，看了看站在城市里的她，我们的官员无奈地叹了口气\n\n艾普露那近乎无穷无尽的欲望不是我们每天送上的\"贡品\"所能满足的，如今她出现在城市中，如果我们不能满足她的欲望的话，整座城市都要变成她玩乐的陪葬！
  gts_aplog.12.desc: "\"Hey, when you see me, you little bugs should know what to do, right!\" \n\nLooking at the impatient purple-haired catgirl on the screen, and then looking at her standing in the city through the floor-to-ceiling windows, our officials sighed helplessly.\n\nApro's nearly endless desire cannot be satisfied by the \"tributes\" we send in every day. Now that she has appeared in the city, if we don't satisfy her lust, the entire city will become the burial ground for her playfulness!"
  # 给吧给吧，总比她毁灭整座城市好
  gts_aplog.12.a: "Just give it to her, it's better than her destroying the whole city."
  # 不可能！我们绝不向她屈服！
  gts_aplog.12.b: "Impossible! We will never submit to her!"
  # 心满意足
  gts_aplog.13.name: "Satisfied"
  # 艾普露得到了自己想要的，城市免受灾难，我们的文明得以延续。真是一举三得\n\n至于那些被她握在手里带回去的人们？\n\n我们除了默哀，还有什么办法呢？
  gts_aplog.13.desc: "Apro got what she wanted, the city was spared from disaster, and our civilization was able to continue. It's a triple win, really.\n\nAs for those she took back with her in her hands?\n\nWhat else can we do but mourn for them?"
  # 愿她们的灵魂能在艾普露的脚底安息
  gts_aplog.13.a: "May their souls rest under Apro's feet."
  # 劫掠
  gts_aplog.14.name: "Pillage"
  # 根据边境发来的报告，艾普露又一次独自前往了宇宙中。看来我们的那些\"贡品\"没有尽职尽责，让这位巨娘满足于她的性欲\n\n艾普露很快就跨过了边界，来到了§Y[event_target:aplog_invade_country.GetName]§!的领土内，由于她巨大的体型，那些恒星基地所谓的防御根本无法伤及她分毫，至于那些没有装备武器系统，甚至于一些只装备小功率武器的舰队，都成了艾普露狩猎的目标\n\n巨大的猫娘一边围追堵截，一边享受着那些小小炮击给她带来脚趾尖微微的瘙痒感，淡紫色的猫尾甩来甩去，毫不在意一些弱小的舰船已经被她那不长眼的尾巴抹去了存在，只剩下一朵灿烂的火花\n\n直到那些飞船的燃料耗尽，艾普露才结束她那单方面碾压一般的狩猎，将这些毫无反抗能力的铁罐头塞进裤兜里，拿不下的干脆就直接撑开内裤，把这些可怜虫们尽数丢入后松手。没人知道那些飞船在经过这凄厉的内裤冲击之后能残存多少，也没人知道这些小人们能在艾普露那连最坚韧的战士都不敢进入的小穴中存活多久\n\n欲求不满的艾普露又将目光移向了那颗养育着外星文明的小人星球，我们只能从她不断晃动的尾巴猜测，这颗小人星球即将面对何等天灾
  gts_aplog.14.desc: "According to reports from the border, Apro has once again left for outer space on her own. It seems that our \"tributes\" did not fulfill their duties to satisfy the giantess's lust.\n\nApro quickly crossed the border, entering the territory of §Y[event_target:aplog_invade_country.GetName]§!. Due to her enormous size, the so-called defenses of the starbases could not harm her at all. As for fleets that were not equipped with weapon systems, or even those equipped with low-power weapons, they all became targets for Apro's hunt.\n\nThe giant catgirl chased down ships, enjoying the slight tickle on her toe tips from the small attacks. Her light purple cat tail swished back and forth, not caring that some weak ships had already been obliterated by her careless tail, leaving only a burst of bright sparks.\n\nIt wasn't until the ships ran out of fuel that Apro ended her one-sided hunt. She stuffed these defenseless metal cans into her pockets, and those that didn't fit, she simply expanded her underwear waistband to throw those poor bugs in before letting go. No one knew how much of the ships would survive this violent impact from being shoved into her underwear, and no one knew how long those small people could survive in Apro's small hole, that even the most resilient warriors dare not enter.\n\nUnsatisfied, Apro then shifted her gaze to the small person planet which was supporting an alien civilization. We can only guess from her constantly wagging tail what kind of disaster this small person planet was about to face."
  # 都等她回来去她小穴里找找有没有幸存者
  gts_aplog.14.a: "Wait until she returns and see if there are survivors in her small hole."
  # 去她的内裤，把那些合金收回来吧
  gts_aplog.14.b: "Go to her underwear, and retrieve those alloys."
  # 艾普露的大肆劫掠
  opinion_gts_aplog_invade: "Apro's Rampage"
  # 猫猫的星球征服
  gts_aplog.15.name: "The Catgirl's Planetary Conquest"
  # 经过艾普露的强烈要求，我们遣散了这颗星球的全部陆军，将这颗星球的控制权完全交给了艾普露\n\n我们很庆幸，艾普露不是我们的敌人\n\n小人们最后一道防线首先被摧毁在艾普露脱下后随意丢弃的凉鞋下，高大的堡垒，坚固的城墙在飞跃后落地的凉鞋面前不堪一击，镶嵌着无数建筑残骸和破碎尸体的黝黑鞋底是那些站在城墙之上的守卫最后看到的场景。而击溃城墙后的凉鞋威力不减，在居民区滑行了数百名才停了下来。运气好的小家伙被巨大的凉鞋生生摩死，而那些不走运的小家伙则落到了五颗被踩出的黑黑的脚趾印上，她们将在无尽的足臭中，等待着艾普露穿上凉鞋，结束她们卑微的生命\n\n而光着双足的艾普露，再次为我们展示了她是怎样用自己的方式毁灭了一个文明\n\n无论是手无寸铁的平民，还是自发组织的游击队，在巨大猫娘的裸足下被完全平等地碾成肉片，大片大片的建筑被连根挖起，在小穴，在口腔里带着躲藏在其中的小人化为碎渣，为艾普露的破坏之旅增加些许情趣\n\n至于那些想要逃跑的宇宙飞船，艾普露则是直接将后庭对准了它们，那些已经点火的飞船没有能力改变方向，就这样直直撞进艾普露的菊穴上，巨大的力量甚至将艾普露粉嫩的菊穴撬开了一些\n\n不过艾普露也只是稍微有了一点感觉，在一次轻微的用力之后，那些卡在菊穴褶皱里还在喷火的飞船统统挤扁，然后随着一阵不雅的淡黄色气流，这些唯一存在的证据也被艾普露的一个小小的屁吹得无影无踪
  gts_aplog.15.desc: "After Apro's strong request, we disbanded all of the planet's land forces and completely handed the control of this planet over to Apro.\n\nWe are glad that Apro is not our enemy.\n\nThe last line of defense of the small people was first destroyed when Apro carelessly threw her sandals. Tall fortresses and sturdy walls were easily crushed by her sandals when they landed after they simply fell from her feet. The dark soles of her shoes, embedded with countless building remains and shattered corpses, were the final sight for the guards standing on the city walls. The sandals still didn't lose their power after they crushed the wall, as they slid for hundreds of meters through the residential area before finally stopping. Some lucky ones were simply crushed to death by the sandal, while the unlucky ones landed on one of five blackened toe prints. In the endless foot odor, they would await Apro to put on her sandals, ending their humble lives.\n\nAnd the barefoot Apro once again showed us how she destroys a civilization in her own way.\n\nWhether they were unarmed civilians or self-organized guerrillas, they were all equally trampled into pieces of meat under the bare feet of the giant catgirl. Large swathes of buildings were dug up from the ground and crushed with small people hiding inside in her small hole and her mouth, adding a little excitement to Apro's destructive journey.\n\nAs for those spaceships that tried to escape, Apro simply aimed her rear at them. Those ships that had already ignited did not have the ability to change direction. They crashed straight into Apro's chrysanthemum hole with such great force that it opened up Apro's pink chrysanthemum hole slightly.\n\nBut Apro only felt a little something. With a slight push, those ships that are still spewing fire, which were stuck in the folds of her chrysanthemum hole, were all crushed flat. Then, with a vulgar stream of yellowish gas, these remaining evidence of their existence, all were erased by Apro's single tiny fart."
  # 好，让她们知道艾普露的厉害！
  gts_aplog.15.a: "Good, let them know Apro's might!"
  # 劫掠准备
  gts_aplog.31.name: "Pillaging Prep"
  # \"哎，剩下的小人数量已经不够吃了呢，明明上次弄到了不少呢...\"\n\n我们的猫娘艾普露最喜欢的娱乐活动就是去那些无主的土著星球进行小人狩猎，猫娘所到之处便是一片地狱景象，对于小人土著来说无疑是一场灭顶之灾，但小人们的悲惨处境也是狩猎乐趣的一部分，艾普露和她的朋友们在小人城市的废墟上寻欢作乐不亦乐乎\n\n现在又到了五年一度的狩猎时间了，我们该如何准备？
  gts_aplog.31.desc: "\"Sigh, the remaining number of small people isn't enough to eat, even though I got quite a lot last time...\"\n\nOur catgirl Apro's favorite pastime is going to unclaimed primitive planets to hunt small people. Wherever the catgirl goes, it's a sight of hell. It's undoubtedly a cataclysm for the small indigenous people. But the miserable plight of the small people is also part of the hunting fun. Apro and her friends have a great time playing in the ruins of the small people's cities.\n\nNow it's time for the once-in-five-years hunt again. How should we prepare?"
  # 出发！
  gts_aplog.31.a: "Let's go!"
  # 可惜现在没空
  gts_aplog.31.b: "Too busy right now, unfortunately."
  # 意外惊喜
  gts_aplog.32.name: "Unexpected Surprise"
  # 艾普露在劫掠这个土著星球的时候意外发现了一个与土著体型相去甚远的巨大遗迹，就连艾普露在这个迷宫般的遗迹中也渺小的如同蝼蚁一般\n\n在躲过重重机关之后，艾普露和存活的几位小人部下来到一片金碧辉煌的厅堂，在这个恢弘大厅的中央，一个装饰精良的台子上放着远古巨娘帝国收藏的秘宝！
  gts_aplog.32.desc: "While pillaging this primitive planet, Apro unexpectedly discovered a huge ruin that was vastly different in size from the natives. Even Apro is as small as an ant in this labyrinthine ruin.\n\nAfter dodging many traps, Apro and her surviving small person subordinates arrived at a magnificent hall. In the center of this grand hall, on an exquisitely decorated platform, lay a secret treasure collected by an ancient giantess empire!"
  # 太棒了！
  gts_aplog.32.a: "Excellent!"
  # 意外
  gts_aplog.33.name: "Accident"
  # 艾普露一行人像往常一样蹂躏着星球上渺小的土著小人，这些小人毫无抵抗，纷纷变成艾普露脚底的红色污垢\n\n可是谁曾想，在艾普露吃饱喝足躺在城市中休息的时候，一只巨大的手指从天而降直接把艾普露碾入了地壳之中，随后巨指抬起，艾普露如同垃圾一样黏在了指纹之中\n\n原来这里是天体级巨娘收藏的\"缩小星球\"，不幸的艾普露竟然闯进了这些骇人巨兽的家里！但是好在我们的舰队趁哪位巨娘睡觉的时候，在她的内裤大陆中找到了迷失在黑暗森林中的艾普露，如果没有我们的营救，恐怕艾普露只能做一辈子的阴虱了吧
  gts_aplog.33.desc: "Apro and her group were normally tormenting the tiny indigenous small people on the planet, who offered no resistance and quickly turned into red filth under Apro's feet.\n\nBut who would have thought that while Apro was resting in the city after eating and drinking her fill, a huge finger descended from the sky and crushed Apro directly into the earth's crust, then the giant finger lifted, Apro was stuck to the fingerprint like trash.\n\nIt turned out that this was a \"miniature planet\" collected by the celestial giantess. Unfortunately, Apro had accidentally broken into the homes of these horrifying giants! But thankfully, while the giantess was sleeping, our fleet found Apro lost in the dark forest on her underwear continent. If it weren't for our rescue, Apro would probably have been forever a pubic louse."
  # 天外有天！
  gts_aplog.33.a: "There is always someone bigger!"
  # 劫掠
  gts_aplog.34.name: "Pillage"
  # 根据边境发来的报告，艾普露又一次独自前往了宇宙中\n\n艾普露很快就跨过了边界，来到了§Y[event_target:aplog_invade_country.GetName]§!的领土内，由于她巨大的体型，那些恒星基地所谓的防御根本无法伤及她分毫，至于那些没有装备武器系统，甚至于一些只装备小功率武器的舰队，都成了艾普露狩猎的目标\n\n巨大的猫娘一边围追堵截，一边享受着那些小小炮击给她带来脚趾尖微微的瘙痒感，淡紫色的猫尾甩来甩去，毫不在意一些弱小的舰船已经被她那不长眼的尾巴抹去了存在，只剩下一朵灿烂的火花\n\n直到那些飞船的燃料耗尽，艾普露才结束她那单方面碾压一般的狩猎，讲这些毫无反抗能力的铁罐头塞进裤兜里，拿不下的干脆就直接撑开内裤，讲这些可怜虫们尽数丢入后松手。没人知道那些飞船在经过这凄厉的冲击之后能残存多少，也没人知道这些小人们能在艾普露那连最坚韧的战士都不敢进入的小穴中存活多久\n\n欲求不满的艾普露又将目光移向了那颗养育着外星文明的小人星球，我们只能从她不断晃动的尾巴猜测，这颗小人星球即将面对何等天灾！
  gts_aplog.34.desc: "According to reports from the border, Apro has once again left for outer space on her own.\n\nApro quickly crossed the border, entering the territory of §Y[event_target:aplog_invade_country.GetName]§!. Due to her enormous size, the so-called defenses of the starbases could not harm her at all. As for the fleets that were not equipped with weapon systems, or even some with only low-power weapons, they all became targets for Apro's hunting.\n\nThe giant catgirl, while chasing and intercepting ships, enjoyed the slight tickle on her toe tips from the small attacks. Her light purple cat tail swished back and forth, not caring that some weak spaceships had already been obliterated by her careless tail, leaving only a bright burst of fireworks in their place.\n\nIt wasn't until those spaceships ran out of fuel did Apro end the one-sided hunting, stuffing those defenseless metal cans into their pockets, and for the ones that couldn't be squeezed in, she simply stretched open her underwear and tossed the poor bugs in before letting go. No one knew how much of the ships would survive this severe impact, and no one knew how long those small people could survive in Apro's small hole, where even the toughest warriors dared not enter.\n\nUnsatisfied, Apro then turned her gaze toward the small-person planet that was nurturing an alien civilization. We could tell from her constantly swinging tail, what kind of catastrophe that small-person planet was about to face!"
  # 都等她回来去她小穴里找找有没有幸存者
  gts_aplog.34.a: "Wait until she comes back, and see if there are any survivors in her small hole."
  # 去她的内裤，把那些合金收回来吧
  gts_aplog.34.b: "Go to her underwear and collect those alloys."
  # 猫娘的生日
  gts_aplog.40.name: "Catgirl's Birthday"
  # 今天是特殊的一天，这是§Y艾普露§!来到我们帝国的第十个生日\n\n一改往日的蛮横，这只猫娘居然破天荒的没有要求使用我们人民的生命为她庆生，而是向军部的监狱发出了当一天「处刑官」的申请\n\n数不尽的罪人和俘虏被驱赶进笼子里后，由直升机运至§Y艾普露§!的「宫殿」里。在§Y艾普露§!的强烈要求下，我们不得不开启了直播，让整个帝国都见证着她独特的庆生方式\n\n很显然这些被当成消耗工具的家伙们还没有意识到自己的地位，满口都是「人权」和「俘虏公约」之类的条令，§Y艾普露§!明显不属于这些法律的管辖范围，手掌只是轻轻合拢，关押着数千人的铁笼就在一阵令人牙酸的尖啸声中爆开，连带着里面的生命一起变成皱巴巴的一团垃圾，红白色的混合物从可爱的指缝中迸溅出。§Y艾普露§!故意把血淋淋的手悬在剩下的笼子上，让这些被碾成血沫的反抗者淋在剩下的小人头上，带着一丝轻蔑的微笑说：\n\n§S「要是不能让我在生日开心的话，你们都会被咱判处死刑哦喵~」§!\n\n面对几个不明觉厉还在叫嚣的家伙，§Y艾普露§!只是舔了舔手指，用蘸着香津手指带到空中\n\n可怜的小家伙连挣脱开粘稠香津的能力都没有，被巨大猫娘坏笑着盯了许久之后，再次被带到了另一个热腾腾地方，不等想明白这里是面前巨大猫娘的那一部分，一阵凄厉的嚎叫首先震碎了那些人的耳膜，而他们最后看到的一幕，是面前巨大菊学里喷出的铺天盖地的黄色气体\n\n不过§Y艾普露§!似乎没打算放过他们。这些被猫娘的屁剥了一层皮的家伙们似乎还剩最后一口气，于是§Y艾普露§!也毫不客气地把这些小家伙直接按在柔软的菊穴上揉搓\n\n女孩柔软的褶皱在他们看来和一道道巨大的山丘没有区别，而上面蘸着的一些东西更是和巨石一样狠狠切割着这些罪人的身体和灵魂，不少可怜虫们在不间断的揉搓下，被迫吞下§Y艾普露§!没有擦干净的排泄物，尽管身体在就破碎，面部也被挤压得几乎断裂，但是他们还是在§Y艾普露§!蛮横的意志下成为了合格的厕纸，也帮助她完成了她玩乐的一部分\n\n感觉擦干净之后，§Y艾普露§!也毫不保留地用一个更大的屁结束了他们卑微的生命\n\n开胃小菜之后，玩心大发的§Y艾普露§!干脆也不演了，挑选出一些囚犯和俘虏之后，把剩下的小家伙们纷纷倒进我们为她准备的城市里。面面相觑的小人还以为自己成为了幸运儿，纷纷嘲笑起了那些被§Y艾普露§!选走的同胞们，而他们的笑声也在§Y艾普露§!脱下裤子，把饥渴难耐的屁穴对准整个城市的时候戛然而止\n\n「你们居然嘲笑自己的同胞，看起来，你们的罪孽可不浅呢喵~好好感谢我吧，如果能活下来的话，你们说不定能成立一个建立在我的排泄物上的文明哦~」\n\n头顶少女活力满满的声音给整个城市判了死刑，慌乱的人群推搡逃窜，争抢车辆，却连菊穴投下的阴影都逃不出，覆盖整个天空的屁穴只是抽动了一下，一条粗壮的深色排泄物在轰隆隆的巨响中冲向了市中心，仔细看的话，还能在其中看到一些没有被消化完全的骸骨和建筑残骸\n\n不过在排泄物碾碎城市之前，其散发出的热腾腾的臭气就蛮横地冲进城中，无差别地搜罗着每一个倒霉蛋，这些连§Y艾普露§!排泄物都接触不到的家伙，就这样在窒息的恶臭中被排泄物的热量活活蒸熟，仅存的意识也只够勉强睁开眼睛，绝望地看着猫娘巨大的排泄物从天而降，碾碎一切\n\n§S「嗯~一想到小家伙们连我的排泄物都挡不住喵，诶嘿嘿……」§!\n\n被§Y艾普露§!特意抓走的小人们，最后被撒到了我们为她制作的生日蛋糕上，燃烧的蜡烛和欢悦的生日歌，蛋糕上的奶油里是拼命扒拉着想要浮起来的小人，不过，至于他们最后的结局，我们的「临时行刑官」早就决定好了，希望他们能在§Y艾普露§!的肚子里为她带来一个开心的生日
  gts_aplog.40.desc: "Today is a special day as it is §YApro's§! tenth birthday since she came to our empire.\n\nContrary to her usual arrogance, this catgirl was unusually not asking to use the lives of our people to celebrate her birthday. Instead, she applied to the military prison for a day as an \"executioner\".\n\nCountless criminals and prisoners were herded into cages, then transported by helicopter to  §YApro's§! \"palace\". At §YApro's§! strong request, we had to broadcast live, allowing the entire empire to witness her unique way of celebrating her birthday.\n\nClearly, these people who are used as consumable tools had yet to realize their place. Their mouths were full of regulations such as \"human rights\" and \"prisoner of war conventions.\" §YApro§!, who is obviously not under the jurisdiction of these kinds of laws, simply closed her hand, and the iron cage holding thousands of people exploded in a tooth-aching screeching sound, turning the lives inside into a crumpled pile of garbage. A mixture of red and white spurted out from her cute finger crevices.  §YApro§! deliberately held her bloody hand over the remaining cage and let the blood of the rebels dripped onto the remaining small people, and said with a hint of contempt:\n\n§S \"If you can't make me happy on my birthday, you'll all be sentenced to death, meow~\"!§!\n\nFaced with some confused yet still yelling people, §YApro§! only licked her fingers and brought her fingers, now wet with sweet fluids, into the air.\n\nThe poor little guys didn't even have the ability to free themselves from the sticky sweet fluid. After being stared at by the giant catgirl for a long time, they were once again brought to another hot place. They didn't even have time to understand what part of the giant catgirl's body they were in before a piercing howl shattered their eardrums. The last scene they saw was the immense yellow gas spraying from the giant asshole in front of them.\n\nBut it seemed that §YApro§! did not intend to let them off the hook. These guys who had a layer of skin peeled off by the catgirl's farts seemed to have their last breath, and so §YApro§! bluntly pressed the guys against her soft chrysanthemum hole and rubbed them.\n\nTo them, the soft folds of the girl were no different from huge hills; the stuff that covered them was like boulders that were cutting through the bodies and souls of these criminals. Under the non-stop rubbing, many unfortunate bugs were forced to swallow §YApro's§! uncleaned excrement. Even though their bodies were already broken and their faces were almost crushed, they still became decent toilet paper for §YApro§! under her tyrannical will, helping her complete a part of her playtime.\n\nAfter feeling clean, §YApro§! also unapologetically ended their humble lives with a much bigger fart.\n\nAfter these appetizers, the playful §YApro§! didn't even bother acting. After selecting a few prisoners and captives, she dumped the remaining small people into the city prepared for her. The small people, who were looking at each other, thought that they had become the lucky ones, and began to mock their companions who were chosen by §YApro§!.  Their laughter, however, suddenly stopped when §YApro§! pulled down her pants and aimed her lustful asshole at the entire city.\n\n\"You guys dared to laugh at your companions. It seems your sins are not small, meow~ Be grateful to me, if you can live through this, you might be able to establish a civilization built on my excrement, meow~\"\n\nThe energetic voice of the girl above them sentenced the entire city to death. The panicked crowd pushed and shoved, fighting over the vehicles but could not escape the shadow that the asshole casted. The asshole that covered the entire sky twitched, and a thick, dark piece of excrement charged towards the city center with a rumble, and after closer inspection, traces of undigested bones and building debris could still be seen inside.\n\nBut before the excrement crushed the city, the warm and foul odor emitted from them charged into the city with a tyrannical force, indiscriminately gathering each and every unlucky person. These guys, who couldn't even touch §YApro's§! excrement, were boiled alive by the heat of her excrement, their last conscious act being to barely open their eyes and to watch the catgirl's huge excrement fall from the sky and crush everything in its path.\n\n§S \"Hmm~ thinking that those little guys can't even stop my excrement, ehehehe...\"§!\n\nThe small people who were specially captured by §YApro§! were finally scattered on the birthday cake we had prepared for her. The burning candles, the cheerful birthday songs, the cream on the cake... those were small people who were desperately trying to climb their way up, but as for their fate, our \"temporary executioner\" had already decided. We hope they can bring a happy birthday to §YApro§! in her belly."
  # 生日快乐！
  gts_aplog.40.a: "Happy Birthday!"
