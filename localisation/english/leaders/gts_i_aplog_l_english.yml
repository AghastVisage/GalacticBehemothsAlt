  # 就要结束了！\n\n我们几乎所有的国民已经变成了艾普露的狂热足虫！而我们甚至连这种病的病因都没有发现！\n\n这只残忍的巨大猫娘正在把整个文明变成她的玩具！我们必须要加紧速度，不然我们的下场只有黏在她的足底，成为她足垢的一部分了……
