  # 终于！在耗费了几乎整个国家的财力，我们终于把星球上所有的大气重新过滤了一遍！\n\n我们无法容忍艾普露想要掌控整个帝国的邪恶计划！于是我们为她专门设计了一个巨大的硅胶肉棒，里面注入了那些过滤出的发情物质\n\n在全国直播下，被绑起来的艾普露在我们军队的控制下，用这个特制的\"肉棒\"开始了她的惩罚\n\n从猫耳到嘴巴，从小穴到后庭，这个巨大特制肉棒在挤压中喷涌出粘稠的催情物质，令本就饥渴的艾普露更加狂躁，玩具划过她的身体发出扑簌簌的黏糊声，混杂着泪水，口水，尿液和爱液的肉棒玩具在艾普露一次次的挤压一下终于承受不住，在巨大猫猫哒后庭处爆裂开来，巨量的催情物质一下子灌满的艾普露的后庭，巨大的刺激几乎让她昏厥过去\n\n而当她醒来的时候，面色潮红，双目空洞当她已经被我们成功驯服，现在，这只巨娘将听命于我们！
  gts_aplog.102.desc: "Finally! After spending almost the entire country's financial resources, we have finally re-filtered the entire atmosphere on the planet!\n\nWe cannot tolerate Apro's evil plan to control the entire empire! Therefore, we designed a special giant silicone dildo for her, injected with the filtered aphrodisiac substances.\n\nIn a nationwide live broadcast, Apro, who was tied up under the control of our army, used this special \"dildo\" to begin her punishment.\n\nFrom her cat ears to her mouth, from her small hole to her rear end, the giant special dildo sprayed out viscous aphrodisiac material during each thrust, making the already lustful Apro even more frantic. The toy brushed against her body with a squelching sound, the toy that was mixed with tears, saliva, urine and love fluids was finally unable to withstand Apro's repeated pressure, and burst open in the giant kitten's rear end. The massive amount of aphrodisiac substances immediately filled Apro's rear end causing a massive stimulation of such intensity that it almost made her faint.\n\nAnd when she woke up, her face was flushed, and her eyes were empty. She had finally been successfully tamed by us. Now this giantess will obey us!"
