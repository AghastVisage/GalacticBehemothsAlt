  # 善于训练小人的§Y艾普露§!对她的一批小人士兵们进行了建筑特训，训练有素的它们熟知巨娘脚底的穴位分布图，能够建筑经过精心设计的楼房，这种楼房在经受踩踏时能够适当的刺激巨娘足底的神经，舒爽的感觉常常令巨娘沉醉其中。数据显示，经常踩踏§Y艾普露§!特制城市的巨娘，健康程度比踩踏普通城市的巨娘高11.5%，工作效率也提高了16.4%。这种建筑方法已经在被饲养的小人之间传播，预计很快就会推广到整个小人世界
  gts_aplog.42.desc: "§YApro§!, an expert in training small people, gave her batch of small person soldiers special building training. These well-trained soldiers knew the distribution of the acupoints on a giantess's soles and could build carefully designed buildings. These buildings, when stepped on, could appropriately stimulate the nerves of the giantesses' feet. The comfortable sensation often made the giantesses indulge in them. Data showed that giantesses who frequently step on special cities made by §YApro§! had a 11.5% higher level of health and 16.4% higher efficiency compared to those who step on normal cities. This method of building is has already spread among the small people that were being cultivated, and is expected to be promoted throughout the entire small people world."
