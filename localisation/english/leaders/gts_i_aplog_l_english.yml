  # 囚禁
  gts_aplog.50.name: "Imprisonment"
  # 协调与同事之间的关系总是一件困难的事，而对于艾普露来说更是如此，作为体型较小的领袖，艾普露不可避免的会受到来自体型更为巨大的领袖的捉弄\n\n艾普露连带着她所在的住所都被§S[event_target:gts_leader_bigger_than_aplog.GetName]§!秘密传送到了自己位于地板上的其中一座缩小城市中，由于§S[event_target:gts_leader_bigger_than_aplog.GetName]§!的体型格外巨大，所以通常提供给她使用的缩小城市的比例比正常的缩小城市要大得多，因此一座房屋的突然出现并没有引起太多的注意——毕竟缩小人成群结队的失踪，城区成块成块的消失在这个世界再正常不过了\n\n从远处传来的脚步声让整座城市都在发生震动，艾普露疑惑的出门查看情况，却惊恐的发现天空不知何时被天花板所取代，房间的事物变得十分巨大，就连散落在地板上的袜子都像一座山脉一样屹立着
  gts_aplog.50.desc: "Coordinating relationships with colleagues is always a difficult thing, and for Apro, it is even more so.  As a leader of a relatively small size, Apro was inevitability tormented by leaders who are greater in size.\n\nApro, along with her residence, was secretly teleported by §S[event_target:gts_leader_bigger_than_aplog.GetName]§! to her own miniature city on the floor. Because §S[event_target:gts_leader_bigger_than_aplog.GetName]§! is exceptionally large, the miniature cities she uses are usually much bigger than the normal miniature city. Therefore, a sudden appearance of a small house didn't attract much attention  -  After all, the disappearances of large groups of small people and the disappearance of whole districts are too common in this world.\n\nThe sound of footsteps from afar made the whole city shake.  Apro went out to see what was going on, but was horrified to find that the sky had been replaced by the ceiling. The things in her room had become huge, and even the socks scattered on the floor stood like a mountain range."
  # 囚禁
  gts_aplog.51.name: "Imprisonment"
  # 「轰隆隆…」「轰隆隆…!」§S[event_target:gts_leader_bigger_than_aplog.GetName]§!迈出的每一步对地板上的小城市来说都是一次灾难，被踩中的小城市会在片刻间变成粘连在§S[event_target:gts_leader_bigger_than_aplog.GetName]§!足底的黑灰色残骸，而附近的城市建筑则会被剧烈的冲击震塌\n\n「12点钟方向，就快到了…」§S[event_target:gts_leader_bigger_than_aplog.GetName]§!打开个人终端上的定位软件，搜寻着艾普露所在的位置，代表着艾普露的小红点随着自己的移动变得越来越近，而软件左上角的击杀数字在每一次落足后都会飞速跳动，迄今为止已经有数百万人丧生了
  gts_aplog.51.desc: "\"Rumble...\"  \"Rumble...!\" Each step that §S[event_target:gts_leader_bigger_than_aplog.GetName]§! took was a disaster for the small city on the floor.  The small cities that were stepped on would instantly turn into dark gray remains that were stuck to the bottom of §S[event_target:gts_leader_bigger_than_aplog.GetName's]§! feet. Nearby city buildings would be collapsed by the severe shock.\n\n\"12 o'clock direction, almost there...\".  §S[event_target:gts_leader_bigger_than_aplog.GetName]§! opened the positioning software on her personal terminal and searched for Apro's location. The little red dot representing Apro got closer as she moved. The number of kills in the upper left corner of the software also jumped rapidly at each step, and has reached millions."
  # 囚禁
  gts_aplog.52.name: "Imprisonment"
  # 「啊…果然，浏览击杀数字都是一件很令人愉悦的事呢，每次都会把持不住…嗯~」§S[event_target:gts_leader_bigger_than_aplog.GetName]§!的脸颊微微泛红，下体也有些湿润了，被囚禁在内裤中的微小城市已经被淹没了大半，使得§S[event_target:gts_leader_bigger_than_aplog.GetName]§!的击杀数字又开始暴涨，心情愉悦的她不禁加快了步伐，来到了艾普露所在的区域\n「艾普露♡~」\n§S[event_target:gts_leader_bigger_than_aplog.GetName]§!抬起脚掌，足尖点地，脚趾撞倒并碾碎了大量的街区，画了一个爱心将在艾普露所在的地区与其他区域分隔开来，对于小人们来说，这道沟壑就是一道不可逾越的天险，它们已然变成了§S[event_target:gts_leader_bigger_than_aplog.GetName]§!的囊中之物… \n\n「好想把你变成我的所有物…」面色绯红的§S[event_target:gts_leader_bigger_than_aplog.GetName]§!脱下早已被爱液浸透的内裤，随意的扔在了一旁的城市里，这座倒霉的城市当场被夷平，内裤散发的大量荷尔蒙激素又令周围的小人们纷纷发情，成为了§S[event_target:gts_leader_bigger_than_aplog.GetName]§!的性奴\n\n混乱的城市里，艾普露慌张的呼叫着领袖安防服务，然后却发现通讯转接到§S[event_target:gts_leader_bigger_than_aplog.GetName]§!的通讯面板上，对方正一脸坏笑的看着她
  gts_aplog.52.desc: "Ah... as expected, browsing through the kill count is such a delightful thing. I can't restrain myself every time...hm~' §S[event_target:gts_leader_bigger_than_aplog.GetName]§!'s cheeks flushed slightly, and her lower body also felt a bit wet. The miniature cities, imprisoned in her underwear, were already more than half submerged causing  §S[event_target:gts_leader_bigger_than_aplog.GetName]§!'s kill count to skyrocket. With her mood lifted, she quickened her pace, arriving at the area where Apro was located.\n'Apro♡~'\n§S[event_target:gts_leader_bigger_than_aplog.GetName]§! lifted her foot, her toes touching the ground then crashing into and crushing a large number of city blocks. She drew a heart shape to separate Apro's area from the others. To the small people, this crevice was an insurmountable barrier. They had already become prisoners in the palm of §S[event_target:gts_leader_bigger_than_aplog.GetName]§!...\n\n'I really want to make you all mine...' §S[event_target:gts_leader_bigger_than_aplog.GetName]§!, her face flushed, took off her underwear that was already soaked with love fluid and threw it casually into the nearby city. That unlucky city was instantly leveled, and the large amounts of hormonal pheromones that were released from her underwear made the surrounding small people fall into a frenzy, becoming §S[event_target: gts_leader_bigger_than_aplog.GetName]§!'s sex slaves.\n\nIn the chaotic city, Apro frantically called for the leader security service. However, her communication was redirected to §S[event_target:gts_leader_bigger_than_aplog.GetName]§!'s communication panel, where she was met with the sight of the other leader looking at her with a malicious smile."
  # 囚禁
