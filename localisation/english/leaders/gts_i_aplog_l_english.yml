l_english:
  # 艾普露
  NAME_gts_aplog: "Apro"
  # 一位猫娘战士，对小人奴隶十分感兴趣
  DESC_gts_aplog: "A catgirl warrior who is very interested in small person slaves."
  # 喵！（哈气）（挠）
  gts_aplog_catch_phrase: "Meow! (Hiss) (Scratch)"
  # 艾普露
  gts_aplog.999.name: "Apro"
  # 你们好哦小虫子们，我是艾普露喵~也许你们会对我充满疑惑，但是相信在接下来的相处中，我们一定会更好地了解彼此哦~物理意义上的喵~
  gts_aplog.999.tiny.desc: "Hello little bugs, I'm Apro meow~ Maybe you're full of doubts about me, but I believe in our future interactions, we'll understand each other better meow~ In a physical sense, meow~"
  # 那个…主…主人…我…艾普露永远对你们忠诚！请不要踩死我喵！\n（害怕地发抖）
  gts_aplog.999.gts.desc: "Th-that... M-master... I... Apro will be forever loyal to you! Please don't step on me meow! \n(Shaking with fear)"
  # 你是谁？
  gts_aplog.999.a: "Who are you?"
  # 都说了哦~我是艾普露喵~正如你所见，咱是一只猫娘哦~\n（抖抖耳朵晃晃尾巴）
  gts_aplog.999.a.response: "I already said it meow~ I'm Apro meow~ As you can see, I'm a catgirl meow~\n(Wiggles ears and wags tail)"
  # 你把我们那些可怜的科考队员怎么了！？
  gts_aplog.999.b: "What did you do to those poor science officers of ours!?"
  # 什么什么？哦~你说那些给人打下手的没用东西呀~\n（摸了摸肚子）\n\n也许你们明天可以在我的排泄物里面找到她们的衣服和骨头也说不定？我最近消化不好喵~可能会留下点什么哦~
  gts_aplog.999.b.response: "What what? Oh~ You're talking about those useless things that just do odd jobs~\n(Pats belly)\n\nMaybe tomorrow you can find their clothes and bones in my excrement? My digestion has been bad lately meow~ I might leave something behind~"
  # 你为什么要加入我们？
  gts_aplog.999.c: "Why do you want to join us?"
  # 不行嘛~我一个人太孤单了嘛~而且即使已经毁灭了好几个星球的文明，我还是感觉不到满足感呢~（仔细打量）\n\n嘛~不过嘛~你们的文明这么发达，而且……
  gts_aplog.999.c.response: "Can't I~? I'm so lonely by myself~ and even after destroying the civilizations of several planets, I still don't feel satisfied~ (Looks carefully)\n\nWell~ but~ your civilization is so advanced, and..."
  # 引猫入室
  gts_aplog.4.name: "Luring the Cat In"
  # 不行嘛~我一个人太孤单了嘛~而且即使已经毁灭了好几个星球的文明，我还是感觉不到满足感呢~\n\n（仔细打量）\n\n嘛~不过嘛~你们的文明这么发达，而且……\n\n而且你们的体型对我来说是再合适不过的仆人呢~这样的大小的话，可是正好能解决我的性欲…啊不，成为我的女仆呢~\n\n（舔舔手指）\n\n不过放心，我也会为你训练出最最听话的部队，你让她们干什么，她们是绝对不敢违抗的哦~
  gts_aplog.4.a: "Can't I~? I'm so lonely by myself~ and even after destroying the civilizations of several planets, I still don't feel satisfied~\n\n(Looks carefully)\n\nWell~ but~ your civilization is so advanced, and...\n\nAnd your sizes are just perfect as servants for me~ With this size, you're just right to satisfy my lust... ah, no, to be my maids~\n\n(Licks fingers)\n\nBut don't worry, I'll also train the most obedient army for you, they'll never dare to disobey what you ask them to do~"
  # 不行嘛~我一个人太孤单了嘛~而且即使已经毁灭了好几个星球的文明，我还是感觉不到满足感呢~\n\n（仔细打量）\n\n嘛~不过嘛~你们的文明这么发达，而且……\n\n而且~你们看起来很好吃的样子哦！之前那些科考队连味道都没吃出来就咽下肚了，好可惜呜…所以…记住哦~给我带来你们活蹦乱跳的人民哦~不然…哼哼哼……\n\n（一脸邪恶地盯着）\n\n嘛，不过我也会给你训练一只完美的部队哒，放心放心喵，连我的小穴里面都能来去自如的部队，害怕那些敌人嘛~\n\n
  gts_aplog.4.b: "Can't I~? I'm so lonely by myself~ and even after destroying the civilizations of several planets, I still don't feel satisfied~\n\n(Looks carefully)\n\nWell~ but~ your civilization is so advanced, and...\n\nAnd~ you look so delicious! Those previous science teams didn't even get a taste before they were gone, what a shame huh... so... remember~ bring me your lively and bouncy people~ or else... heh heh...\n\n(Stares evilly)\n\nWell, but I'll train a perfect army for you, don't worry meow, an army that can even go in and out of my pussy hole, do you have anything to fear from those enemies~"
  # 不行嘛~我一个人太孤单了嘛~而且即使已经毁灭了好几个星球的文明，我还是感觉不到满足感呢~\n\n（仔细打量）\n\n嘛~不过嘛~你们的文明这么发达，而且……\n\n而且你们好——小——啊——\n\n（捂着嘴偷笑，伸出裸足在城市上空比划了一下）\n\n你看，你们的城市，在我看来就是完完全全的解压玩具嘛~要是我就这样把脚放下去的话…会不会？\n\n（毫不留情地踩下去）\n\n啊~还真的和解压玩具没什么区别呢~嘛~就这样吧，以后，你们就是我的专属地毯啦喵~作为回报，我允许你们用我的身体作为你们军队的训练场哦~怎么样很合理吧~
  gts_aplog.4.c: "Can't I~? I'm so lonely by myself~ and even after destroying the civilizations of several planets, I still don't feel satisfied~\n\n(Looks carefully)\n\nWell~ but~ your civilization is so advanced, and...\n\nAnd you're so-small-ah-\n\n(Covers mouth and giggles, extends a bare foot and makes a gesture over the city)\n\nSee, your city, to me it's just a perfect stress relief toy~ If I just put my foot down like this... wouldn't it?\n\n(Steps down mercilessly)\n\nAh~ it really is no different from a stress relief toy~ well~ that's it, from now on, you're my personal rugs meow~ As a reward, I'll allow you to use my body as a training ground for your army~ how's that, very reasonable right?"
  # 你是谁
  gts_aplog.999.d: "Who are you"
  # 我…我是艾普露…是主人永远的仆人…（缓缓爬过来舔舔[Root.GetRulerName]脚趾）
  gts_aplog.999.d.response: "I... I'm Apro... Master's eternal servant... (Slowly crawls over and licks [Root.GetRulerName]'s toes)"
  # 你做了什么
  gts_aplog.999.e: "What have you done"
  # 我只是…不小心毁灭了一个小人文明喵…我不知道主人要来这里…我…我会给主人补偿的…（用脑袋蹭蹭）
  gts_aplog.999.e.response: "I just... accidentally destroyed a small person civilization meow... I didn't know master was coming here... I... I will make it up to master... (Nuzzles with her head)"
  # 为什么加入我们
  gts_aplog.999.f: "Why join us"
  # 为了主人而献出自己…艾普露感觉…很值得！谢谢主人的关心喵！
  gts_aplog.999.f.response: "To offer myself for master... Apro feels... it's worth it! Thank you for your concern master meow!"
  # §Y艾普露§!作为一名§H领袖§!加入了我们的帝国。
  gts_aplog.999.hire_custom_tooltip: "§YApro§! has joined our empire as a §Hleader§!."
