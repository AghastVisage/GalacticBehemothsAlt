  # 尽管艾普露现在很想把面前那位笑的开心的神女直接塞进她的小穴里，毕竟刚刚她可是用那个玩意把她顶飞了起来\n\n「等一下哦～」\n\n雁栖一边舔舐着身上已经脏兮兮的猫咪，一边笑嘻嘻的举起了手机竖在艾普露面前\n\n「他们说，也想要看你用futa魔法呢～」\n\n纤细修长的手指从艾普露的脑袋开始向下抚摸，直到她的下体……「你说呢，小猫猫？」\n\n随着雁栖将艾普露再度放在地上后随即微笑的蹲了下来\n\n「可咱就这么丁点诶？」\n\nfuta魔法艾普露也不是第一次用了，但这个大小……就连这些高楼给她当做飞机杯都显得太大了一点\n\n「嗯，让我看看投票……」\n\n雁栖一边用手指分割着城市，一边有些无聊的等着这个星球上的小家伙们出结果——她当然可以不遵守规则，但是看着这些小家伙们自以为是的借刀杀人却让她的玩心大起，这些小家伙们不会以为这个a国只是开始吧？「嗯，六万倍吧，艾普露你觉得怎么样？」\n\n投票上面数量最多的是1倍，仅次于1倍的是十分之一——但对于这种东西雁栖只会一笑置之，真当神女要听这些小虫子们的话了么？「可以喵！」\n\n艾普露表面上应的是相当痛快，只不过那张小麦色泽的脸上已经掩盖不住她的想法了——无论是对她的这位同僚，还是对还没欺负够的小人\n\n下一瞬间，小猫咪变成了大猫猫，艾普露那根粗长的猫尾甚至能够环绕住这座城市，但拥有了如此庞大且强大的躯体的猫猫，她会做亦或是被做什么呢？「等一下……喵！！」\n\n如狂龙一般的粉色巨兽狠狠的插入了艾普露的后穴，随着一进一出的强烈摩擦与振动两个人的爱液一同流出——可十万米高的躯体与万米高的躯体根本不是一个概念，只是白灼色的液体从高空坠落就足以压碎最坚固的建筑，因为激烈动作而导致脚掌缱绻收缩与伸直，便挖出来几十年前修剪的地下避难所……她们只是在城市中宣泄自己的欲望，甚至没有主观意义上的想要破坏这座城市，然而只是她们欢爱释放的体液就淹没了a国的首都，身体不自觉的小动作便踩死碾碎了数十万人\n\n然而这只是她们欢爱的开始而已，随着两位少女贴的愈发的近了，被汗完全浸湿的bra，从身体中溢出的热气与汗味，乳房与宽阔后背彼此摩擦仿佛能听见黏哒哒的液体粘连声……这些无一不触动着「观众们」\n\n的心，对于观众们而言，这是一场已经达到了1700万人死亡的恐怖屠杀，但同时也是这个世界上最奢靡的欲望宣泄场所\n\n毕竟，就拿与a国处于两个极端n国民众而言，这两个十万米高的女巨人在a国首都做爱又能有他们什么事呢？「噗！」\n\n随着做爱达到了高潮，先前艾普露受到了的futa魔法终于起了作用，原本远远不及雁栖大小的巨兽傲然挺拔，随后浓稠厚重的乳白色液体像是歼星炮一般射出——高楼，部队，人群，亦或是其他什么东西，在神女的伟力面前一冲而散，甚至因为两位神女的宏大尺度，艾普露的精液甚至飙蛇到了与a国接壤的e国首都\n\n毕竟国与国的距离，对于神女们而言说不定还没有她们的脚长呢\n\n「雁栖……好棒，再也不说你还要cd了……」\n\n大猫猫的眼里露出了肉眼可见的爱心，然而雁栖依旧没有停下她的动作——她随意的将刚刚还在拍摄的手机扔出，狠狠的砸落在e国和a国的边界线上，随后开始使劲的揉搓着艾普露饱满而又健康的胸脯……随着大猫猫被雁栖压在身下后，两者的爱液已经弥漫了有数米高，但即便如此，a国的首都依旧有十万左右的幸运儿存活了下来，只不过这些幸运儿从某种程度上而言又是不幸的，因为在爱液海洋里沉浮的他们，被艾普露一次涨乳所溢出的体液给彻底淹没了……
  gts_aplog.1028.desc: "Although Apro really wanted to stuff the smiling goddess in front of her into her small hole, after all, she was just knocked up into the air with that thing.\n\n\"Wait for a bit, okay~\"\n\nYanxi licked the now dirty cat while smiling, and then raised her phone and held it up in front of Apro.\n\n\"They said, they also want to see you use futa magic, meow~\" A slender finger reached from Apro's head, then stroked all the way to her lower body... \"What do you say, little kitten?\"\n\nAs Yanxi placed Apro on the ground again, she smiled and crouched down.\n\n\"But I'm so small right now, meow?\"\n\nApro had also used Futa magic before, but this size... even using these high-rises as a fleshlight was still too big for her.\n\n\"Hmm, let me see the vote...\"\n\nYanxi leisurely waited for the small people on this planet to make their decision while using her fingers to split apart the city-of course she could've disregard the rules, but seeing the small people thinking they can use her as a tool to kill their enemy made her playful side come out, these small people didn't actually think that Country A was the end, did they? \"Hmm, 60,000 times then, what do you think Apro?\"\n\nThe most votes went to 1 times the size. The next highest was one-tenth the size - but these votes were just something Yanxi would laugh off. Did they think that a goddess would obey the words of these little bugs? \"It's okay meow!\"\n\nApro answered with a perfectly agreeable tone on the surface, but on her tan face, she could no longer hide her intentions-it goes both for her colleague, and at those yet-to-be-bullied small people.\n\nThe next instant, the little cat became a great cat. The coarse tail of Apro was even large enough to circle the entire city. But what would the cat, with their vast and strong body do, or what would be done to her? \"Wait a second... Meow!!\"\n\nA giant pink beast reminiscent of a dragon ripped into Apro's rear hole, as the intense friction and vibration occured the two lovers' fluids began flowing out all at once-but a 100,000m tall body was not the same as a 10,000m tall body. The sheer act of white liquid falling from the sky was enough to crush the strongest buildings. And just by the act of their feet twitching, whole underground shelters built decades ago get dug up... They were just releasing their desires in a city and didn't even have the subjective intent to destroy that city consciously, and yet their fluids alone submerged the capital of Country A. And the small unconscious actions they made crushed and trampled hundreds of thousands to death.\n\nHowever, that was only just the start of their lovemaking. As the two girls stuck closer to each other, the bra that was now completely soaked in sweat, the heat and sweat that was dripping from their bodies, the sound of fleshy skin rubbing together while their breasts and backs were pushing into each other... all of this touched the hearts of the \"audience.\"\n\nFor the audience, it was a terrifying massacre of over 17 million deaths, but it was also the most luxurious outpouring of desire in the world.\n\nAfter all, if we were to take the citizens of Country N that are on the opposite side of country A for comparison, what business of theirs would it be if those two 100,000 meter giantesses were doing it in Country A's capital? \"Plop!\"\n\nWhen their lovemaking reached its climax, the futa magic that Apro had been subjected to finally activated. Her monster, which was nowhere near the size of Yanxi, stood proudly tall, and then thick milky white fluids shot out like a planetary destruction cannon-high-rise buildings, troops, crowds, or whatever else it was, all were blown apart in the face of the goddesses' power, and because of the colossal scale of the two goddesses, Apro's juices even sprayed into the capital of Country E, which was next to Country A.\n\nAfter all, the distance between countries was probably even smaller than their foot length.\n\n\"Yanxi... That was amazing, I won't say that you need to recharge again...\"\n\nVisible hearts appeared in the eyes of the big cat. However, Yanxi still didn't stop her actions-she randomly threw aside the phone with which she was filming so that it crashed to the border of Country E and A, and then she began to rub and squeeze on Apro's full, healthy breasts... as the Big Cat was pushed under Yanxi's weight, the two's juices had already overflowed to several meters in height, but even then, around 100,000 lucky people of Country A had managed to survive. But those lucky ones were also the unfortunate ones; as they were submerged into the sea of ​​juices, they got completely flooded by the fluids that leaked from Apro's breasts during her milk explosion..."
