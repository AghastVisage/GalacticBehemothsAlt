goddess who was always being used by goddess for her personal pleasure, this was the first time she found a goddess's task somewhat interesting.\n\n\"How did you play it last time, meow?\"\n\n\"Last time?\"\n\nWhile seeing Yanxi squatting on the side of the city, messing with her phone, the cat languidly rolled over and answered leisurely,\n\n\"I picked the most popular prettyboy on that planet. Made him 10,000 times bigger and made him pin me down on their capital and fuck... I have to say he was quite strong and had stamina. But in the end, I turned him back to normal, hmm... did he end up drowning in his own cum, or was it my juices?\"\n\nYanxi's fingers that were messing with the phone paused, in the end she couldn't help but swipe right, while the screams of humans and the sound of high-rise buildings falling over was ringing beside her, what was also ringing was Yanxi voice with slight hints of anger.\n\n\"You little slut cat, I'll fuck you to death.\"
