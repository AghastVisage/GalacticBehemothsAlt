  gts_aplog.103.desc: "There is no doubt that, even if we used the power of our entire civilization, we cannot stop the unstoppable attraction of the Giantess. When our last scientist watched in horror as their fully enclosed laboratory was filled with the scent emanating from the giant catgirl, we... no... our civilization, had undoubtedly become her toy.\n\nEvery day, every hour, every second, our people would continuously gather around the soles of Goddess Apro. The lucky ones could enjoy her favor and be held in her hands, and then after merely getting a contemptuous glance, disappear into her mouth or small hole, while the unfortunate could only become filled with lust for that giant foot that was covered with filth and blood while whispering \"Thank Goddess\" while transforming into part of those garbage, making intimate contact with the soles of Goddess Apro.\n\nAh... Goddess! You are our everything! Our civilization shall thrive only for your pleasure!-"
