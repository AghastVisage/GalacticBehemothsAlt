  # 雁栖柔白色的双手按在如同巧克力色泽的屁股上，那温热而且有着良好触感的肉体总是让人想入非非，这样美好诱人的身体加上艾普露那有些偏向m又欺软怕硬的性格，她总是会被其他的神女欺负……倒也不能算欺负吧\n\n雁栖一边想着，一边双手不老实的乱摸，面对同僚这般举动的艾普露也是非常食髓知味的叫唤了起来，那略显浪荡的叫声轻而易举的震碎了整座城市的玻璃\n\n「叫那么大声？」\n\n雁栖将自己的重心调整至上本身，用自己那一对丰满的乳房反复挤压大猫的后背，虽然大猫的身材已经算得上凹凸有致性感可人，但毕竟那对兽耳以及猫尾还是占了一点模的，这也就导致了此刻压在艾普露身上的乳房重的险些让她喘不过气来\n\n「喵…呜………」\n\n原先大声而且浪荡的叫声变成小声的喘息，而这样的行为自然躲不开这个星球上文明的观察——在他们看来，反击的时候终于到了\n\n「舒服么？」\n\n雁栖看着被她压在身下的猫娘「痛苦」\n\n的攥起来了手，很难说艾普露究竟是在享受还是真的觉得痛苦，毕竟大猫的另一只手还执着的试图往雁栖的下面扣……「小猫还有力气反抗吗？」\n\n艾普露的手最终还是放下了，并不是因为扣不到，而是因为自己被捏了——被捏住奶子了\n\n于是好不容易整理起反抗部队的人类中，大多数人都只能应到一声好听的闷哼便被震的昏了过去，而极少数幸运儿则能够看到随后那乳白色的洪流冲了过来……也许这座城市用了数十年来建造，最终的目的就是为了见证神女们的玩乐吧\n\n「没了……没力气了喵」\n\n「真的吗？」\n\n随着手松开了艾普露那丰满的双峰，雁栖再度贴到大猫的耳朵旁——不过这次可不是要咬她的耳朵，而是要向她宣布一件事\n\n「这才只是刚刚热身哦～」\n\n然而雁栖在说完这句话之后便利落的起身，留下有些不知所措的大猫在那里爽的喵喵叫\n\n「雁栖姐姐？你要干什么喵？」\n\n在大猫看来，雁栖的这种行为就跟年过四十多中年老男人一样，叫她在床上乖乖躺好自己却在一边抽烟等待cd，可按理来说，像她们这样的神女连着做上几年也没有问题\n\n「难道雁栖姐姐真的被女神给玩坏了喵…」\n\n雁栖蹲在了另一座城市前，在小人们惊恐大猫无聊的目光中往她的裙底里扣了扣——她并不是刚刚被艾普露扣爽了，她只是需要从裙底拿出个东西罢了\n\n「这个角度应该勉强可以吧？」\n\n远比楼房还要巨大的手机压在了城市上，原本还在看戏的人群根本没来得及退散便被碾成了手机壳上的一摸殷红，然而这还不算完，一个连引力场束缚都无法突破的凡人所建造的高楼自然是扛不住神女手机的重量，花费了无数人力物力所修建的高楼就像是多米诺骨牌一样倾倒……直到雁栖摆得实在有些烦了挖去了一块城市的地基后，她的手机才安稳的靠在了城市中\n\n「喵喵？什么角度？」\n\n「女神的任务罢了」\n\n和之前敷衍的声音不同，此刻的雁栖声音中带着些许玩味，毕竟作为一个经常被女神拿过去阔阔的神女，这还是她第一次觉得女神大人给的任务挺有趣的\n\n「你上次是怎么玩的喵？」\n\n「上次？」\n\n眼见着雁栖还蹲在城市边摆弄她的手机，大猫猫慵懒的翻了个身悠哉悠哉的回答道\n\n「选了那个星球的一位网红小男娘，把他也变大了一万倍，让他把我摁在他们的首都上草……别说他还挺有力蛮持久的，不过我最后还说把他变回去了，嗯…他最后是淹死在了自己精液里还是我流出来的爱液里来着？」\n\n雁栖摆弄手机的手指一顿，随后还是没能忍住往右一滑，随着人类的尖叫与高楼被切断坠地声音一同响起的，还有雁栖略带愤怒的声音\n\n「小烧猫，我草似你」
