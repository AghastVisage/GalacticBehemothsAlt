  # 「到了喔～」\n\n不知道雁栖这妩媚的声音是敢给艾普露听的还是喊给在「观赏」\n\n直播的人类听的，反正因为这一声呼唤，这个星球上尚且存活而且再看这场直播的人，有超过半数的人因为这一声娇嗔而加大了手上的力度\n\n这其中也包括了a国的人\n\n他们有许多人做出了他们最激烈但是毫无卵用的抵抗——在抵达目标城市之前便已经有无数的火力的倾泻过去，其中效果最好的是海基的大当量核武，成功的擦到了雁栖的脚踝\n\n那一点点火光确实成功的勾起了神女的注意力，只不过几分钟的时间，雁栖便从这个星球当上的一端走到了另一端，而沿途造成的破坏则比这个星球上最惨烈的大战还要恐怖，但从某种程度上而言，两位……额，雁栖神女的行为已经算的上是相当温柔了，毕竟这个星球上的文明所信奉的是弱肉强食的法则，而不论是雁栖还是艾普露其实都能够用一根手指把星球碾碎，或者丢进鞋子里慢慢「享受」\n\n，但她们没有这么做，的确是温柔的行为\n\n「刚刚是这里吧…」\n\n雁栖蹲了下来，开始脱鞋——这对她而言也许算得上是一种仪式，当然，对于这个进入「僵直」\n\n状态的雁栖，a国尚且保存士气的部队像是赴死一般发动了最后的进攻\n\n然而即便是路基的战术核武也只能勉强触碰到雁栖穿在身上的丝袜，而其他的陆地部队更是只能绝望的看着面前那个绝望的黑色山脉……那是他们这辈子都无法逾越的伟大存在\n\n「唔……有些热呢」\n\n雁栖终于褪下了高跟鞋与踩脚袜让双足亲切的与大地交互，让人类的城市为她那已经略显潮热的双足解闷——而一旁艾普露的交换声也依旧中气十足\n\n「你这家伙，快把咱给……」\n\n可惜的是艾普露的话才说到一半，便看到了雁栖的足又抬了回来——她的角度能够看清那双本来十分白哲漂亮的脚掌此刻正粘黏着黑漆漆的城市残骸与装甲部队的碎片，艾普露甚至能够看到那些变成垃圾的残骸正随着雁栖挑逗似的晃着脚而像冰雹一样落下\n\n「对不起嘛……」\n\n雁栖笑着摇了摇头，随即把脚落在了另一座城市中——在怎么铁石心肠的人看到这只大猫咪给闷了十多分钟后，都不会舍得再碾上去吧\n\n「你先出来吧，我看看接下来该玩什么」\n\n在雁栖操纵着手机发起下一次投票的时间里，艾普露泄愤般的将她塞在雁栖高跟鞋里的城市碾成她脚底上的污垢后便爬出来踩在了新的城市群中，尽管跟雁栖现在足足有一万米的身躯完全不能相比，但哪怕是一千米高的身躯对于这个文明而言也是绝对致命的——更何况大猫咪现在都怒气都叠满了，这不阔阔小人们的城市发泄一番都对不起她那欺软怕硬的性子\n\n 「为什么做爱的这个选项人数这么多啊……」\n\n雁栖有些嫌弃的扫视了一眼周围的城市，如果是现在的体型拉上亲爱滴小烧猫做的话，恐怕这周围都所有城市群都会淹没在她们两个人爱液的海……雁栖突然意识到了不对，现在都小烧猫就一千米高，甚至还没有她胯下那只巨兽大来着……在雁栖原版计划中要被捅穿的小烧猫此刻完全不自知，她正悠哉悠哉的漫步在这个「巨大」\n\n的城市群中，「氢疽铀蒿」\n\n的跟a国的反抗部队打招呼呢\n\n「你们这些垃圾！臭虫！微生物！全都去死喵！！！」\n\n艾普露随意的摆动猫尾拉拽着人类口中的高楼，讲那些花了数年乃至十多年的心血结晶就这么被当成垃圾抛在地上造成二次灾害，不过即便是面对这样的绝望场景，也有不少人敢发起反抗，其中幸运的人给猫尾所造成的此生灾害给掩埋或者砸成肉酱，而不幸运的……要么被艾普露抓起来像是撒白糖一样丢进了嘴里——其中大多还因为抓起来太过暴力而只剩下残肢断臂，要么就是被艾普露现在那已经脏兮兮的脚掌彻踏平，成为她肮脏脚印的一部分\n\n「哈哈哈！全都变成咱的奴隶吧！」\n\n不过这样的残忍行为很快就被终止了，但既不是艾普露突然善心大发放过了这些小虫子，也不是他们反抗能够撼动这位只有千米高的神女——而是刚刚还在大肆破坏的猫猫被车飞了起来\n\n原本还在耀武扬威的大猫飞了起来，随后便被抓在了手心之中\n\n「雁！栖！哈！！！」
  gts_aplog.1027.desc: "\"We've arrived, meow~\"\n\nIt's unknown whether Yanxi's charming voice was directed at Apro or the humans that were \"appreciating\" the broadcast but, because of that call, over half of the humans still alive and watching that broadcast on this planet had increased the intensity of their grip because of that one coquettish exclamation.\n\nThat also included the people in country A.\n\nMany of them had launched their most intense yet futile resistance - before reaching the target city, countless fire power had rained down, the most effective among which was the high-yield nuclear weapons of the sea's forces, which successfully scratched Yanxi's ankle.\n\nThat little point of light did successfully catch the goddess's attention, but in just a few minutes, Yanxi walked from one end of this planet to the other. The collateral damage she caused along the way was even more terrifying than the most brutal war on this planet. But to some extent, if you take a look at their actions, these actions were rather gentle-after all, the civilization on this planet believed in the law of the jungle, and both Yanxi and Apro could crush the planet with one finger or put it in their shoes to slowly \"enjoy\", but they didn't, that was certainly a gentle act.\n\n\"Was it around here...\"\n\nYanxi crouched down and started to take off her shoes  -  To her it could be considered a sort of ritual. Of course, to Yanxi, who had entered a state of \"rigor mortis\", the troops of Country A, who were still struggling to keep their morale up, started their last suicidal attacks.\n\nHowever, even the land-based tactical nuclear weapons could barely touch Yanxi's silk stocking, while the rest of the land forces could only watch in despair at the black mountain in front of them ... It was a majestic existence that they will never even surpass in their lives.\n\n\"Hmm... It's a little hot, meow~\"\n\nFinally Yanxi slipped off her heels and socks, letting her feet make familiar contact with the ground. She let the city of humans be a way for her feet, which were already getting moist, to relax-Apro's gasps nearby also still managed to retain their vigor.\n\n\"You bastard, quickly release me... \"\n\nUnfortunately, before Apro could finish her words, she saw Yanxi's foot came back-from her angle, she could see that the pure white sole was now covered in bits of black city debris and scraps from armored vehicles, Apro could even see the bits of trash falling like hailstones as Yanxi teased them by shaking her foot.\n\n\"Sorry, meow...\"\n\nYanxi chuckled shook her head, and then dropped her foot into another city -Even someone with an iron will wouldn't have the heart to crush it again after hearing that big cat moaning for more than ten minutes, right?\n\n\"You can come out for now, I'll see what we should play next.\"\n\nWhile Yanxi was fiddling with her phone and starting the next poll, Apro, feeling vengeful, crushed the city that Yanxi trapped her in inside her high heel into mud and then stepped into a new urban complex. Although she could not compare to Yanxi, who was now at 10k meters tall, even a body at 1000 meters was still absolutely fatal to this civilization-not to mention that the big cat was now a ball of rage, this time she was going to crush the city of those small people to vent her anger. There was nothing she cared about more than being able to bully the weak with her nature.\n\n\"Why are there so many votes for the sex option...\"\n\nYanxi glanced at the surrounding cities with some disdain. If they were to do it at her current size along with her beloved little slut-cat, then the entire city would be submerged in two of their juices... Yanxi suddenly realized something was wrong, the little slut-cat was at 1000 meters right now, she wasn't even bigger than the giant beast beneath her.... In Yanxi's original plan, the little slut-cat who was supposed to be penetrated was blissfully unaware at this point, she was still walking leisurely among this \"huge\" urban complex, greeting the resistance forces of Country A, \"Hydrogen Peroxide Uracil Arsenic\"\n\n\"You trash! Vermin! Microbes! All go and die, meow!!!\"\n\nApro casually swung her cat tail, pulling down buildings that humans called high rises, turning the fruits of their labor and painstaking effort into garbage that caused secondary disasters. However, even in the face of such desperate scenes, there were still a number of people who actually dared to put up a fight. The lucky ones were either buried or smashed into meat paste by the collateral damage of the cat tail, and the unlucky, they were either grabbed by Apro and thrown into her mouth, like sprinkling sugar- most of them only had their limbs remaining due to Apro's violent actions -  or they were just completely flattened by the dirty foot pad of Apro, becoming a part of her dirty footprint.\n\n\"Hahaha! All of you shall become my slaves!\"\n\nHowever, such cruel behavior was quickly stopped, as it was not that Apro suddenly became kind and let these bugs go, or even that they had launched an attack to hurt that goddess who was only 1000 meters tall. What happened was the cat who was wildly causing destruction was propelled up into the air.\n\nThe great cat who was just flexing her power was thrown up and then caught in her hands.\n\n\"Yan!xi! Hah!!!\"
