  # 「不乖哦~为什么要想着逃走呢~」\n\n她绝望的跪坐在地与泛着爱心眼的§S[event_target:gts_leader_bigger_than_aplog.GetName]§!对视，一滴爱液从§S[event_target:gts_leader_bigger_than_aplog.GetName]§!早已淫靡不堪的花穴中滴落，砸在了远处的城市里瞬间将整座城市吞没，腥臭的爱液已经侵蚀了这座城市的大气，释放的信息素正在侵蚀每个人的心智\n\n「不乖的宠物就该关起来呢~」\n\n§S[event_target:gts_leader_bigger_than_aplog.GetName]§!跪在地上，伸出手将整座城市挖起，像端着披萨片一样将城市对准了自己的花穴，在小人们的尖叫声中把整座城市用花穴「吃掉」\n\n凹凸不平的建筑群像沙粒一样刮蹭着肉壁，小人们被爱液粘附在阴道的沟壑里，被巨量快感冲昏头脑的§S[event_target:gts_leader_bigger_than_aplog.GetName]§!机械的用城市来回摩擦着花穴，最后整座城市搓成一摊混合着爱液的烂泥状物质时才恋恋不舍的将其倒在了地板上，纵欲过度的§S[event_target:gts_leader_bigger_than_aplog.GetName]§!直直躺在了城市铺成的地毯上，在压扁了一大片城区后赤身裸体的睡去了
  gts_aplog.53.desc: "'Naughty~ why are you trying to run away~?'\n\nShe despairingly knelt on the ground and made eye contact with the lust-filled eyes of §S[event_target:gts_leader_bigger_than_aplog.GetName]§!.  A drop of love fluid fell from §S[event_target:gts_leader_bigger_than_aplog.GetName]§!'s already obscene flower hole and landed on a distant city, instantly engulfing it.  The foul-smelling love fluid had already contaminated the atmosphere of the city, and the released pheromones were eroding the minds of everyone.\n\n'Naughty pets should be locked up~'\n\n§S[event_target:gts_leader_bigger_than_aplog.GetName]§! kneeled on the ground and scooped up the entire city. She held it up, like a slice of pizza, towards her flower hole, then \"ate\" the entire city through her vagina amidst the screams of the small people.\n\nThe uneven buildings scraped against the fleshy walls like sand. The small people were stuck to the crevices of the vagina by the love fluid. §S[event_target:gts_leader_bigger_than_aplog.GetName]§!, who was overwhelmed by pleasure, mechanically rubbed her flower hole back and forth with the city. Only when the entire city was rubbed into a pile of mush mixed with love fluids, did she reluctantly pour it on the floor.  Exhausted from excessive indulgence, §S[event_target:gts_leader_bigger_than_aplog.GetName]§! went straight to lie down on the carpet that was made from the city. After flattening a large part of the district, she fell asleep naked."
