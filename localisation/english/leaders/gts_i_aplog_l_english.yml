  # §Y艾普露§!带着饲养的小城市来到了聚会现场，大方的将自己小城市分享给其他巨娘使用，勇于尝试的§S[Root.GetRulerName]§!小心翼翼的掀起裙子，将白色连裤袜包住的下体对准城市期待着小人们的反应，受过专业训练的小人们熟练的锁定§S[Root.GetRulerName]§!的欢乐豆然后按下了发射按钮，无数具有增加敏感度效果的特制炮弹炸破了白丝，直冲着豆豆飞去，产生的爆炸火光覆盖了豆豆表面，§S[Root.GetRulerName]§!只看见阴蒂突然产生亮光，来不及思考就被巨量的快感冲昏了头脑，一个踉跄向后跌去，瘫软在§Y艾普露§!怀里。此时，§Y艾普露§!褪去§S[Root.GetRulerName]§!的内衣，轻轻用手指挑逗着§S[Root.GetRulerName]§!的乳头，向小人士兵们示意着集火位置，璀璨的焰火很快在§S[Root.GetRulerName]§!的两颗粉红的樱桃上绽放，§S[Root.GetRulerName]§!被刺激的面色潮红淫叫连连，乳汁爱液一齐喷出将整座城市溅满淹没，最终失去意识爽晕在§Y艾普露§!的怀抱中，其他参加聚会的巨娘面面相觑，一时不知道说什么好\n\n 事后，§Y艾普露§!收到了很多帮忙训练小人城市的请求
  gts_aplog.41.desc: "§YApro§! brought her little cultivated city to the gathering. Generously, she shared her little city with the other giantesses.  The courageous §S[Root.GetRulerName]§! carefully lifted her skirt and aimed at the city with her lower body covered in white pantyhose, anticipating the reactions of the small people. The professionally trained small people skillfully targeted §S[Root.GetRulerName's]§! pleasure bean and pressed the launch button. Numerous special bombs that had a sensitivity enhancement effect exploded through her white stockings and flew directly towards the bean. The produced explosions covered the surface of the bean, §S[Root.GetRulerName]§! only saw her clit producing a sudden burst of light before being overwhelmed and sent reeling backward by the intense pleasure. She collapsed into §YApro's§! arms. At this time, §YApro§! took off §S[Root.GetRulerName's]§! underwear, gently teased §S[Root.GetRulerName's]§! nipples with her fingers and signaled to the small soldiers to focus fire.  Magnificent flames quickly bloomed on both of  §S[Root.GetRulerName's]§! pink cherries.  §S[Root.GetRulerName]§! was so stimulated that her face flushed as she let out淫叫 after 淫叫, spraying both breast milk and love fluid all over the city, before eventually losing consciousness in §YApro's§! arms. The other giantesses who were at the gathering looked at each other, not knowing what to say.\n\nAfterward, §YApro§! received numerous requests to train small person cities."
