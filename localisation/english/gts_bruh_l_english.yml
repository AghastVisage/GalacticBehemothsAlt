#  击败驱逐舰娘
  gts_leader_bruh.0006.name: "Defeat Destroyer Shipgirl"
#  战斗结束了。那位曾在星海中灵活穿梭的驱逐舰娘终於倒在了我们舰队的集火之下。她那娇小(相对而言)的身躯上布满了灼烧的痕迹，破损的舾装还在不断漏出冷却液，毫无生气地漂浮在太空中，我们的工程师迫不及待地登上了她的残骸。在那已经失去光泽的舾装中，我们找到了大量技术资料，关於如何在巨大的身躯上维持惊人的机动性，如何用动能武器发挥出毁灭性的威力，以及那些绑在她大腿上的鱼雷发射管的设计蓝图。\n\n§G解锁随机一种§MBruh驱逐舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!
  gts_leader_bruh.0006.desc: "The battle is over. The Destroyer shipgirl, who once maneuvered nimbly through the sea of stars, has finally fallen under the concentrated fire of our fleet. Her petite (relatively speaking) body is covered in scorch marks, and her damaged rigging is constantly leaking coolant as she drifts lifelessly in space. Our engineers rushed to board her wreckage. Within that now-lustreless rigging, we found a wealth of technical data: how to maintain incredible maneuverability on a massive body, how to unleash devastating power with kinetic weapons, and the design blueprints for the torpedo tubes strapped to her thighs.\\n\\n§GUnlocked a random §MBruh Destroyer Shipgirl§! blueprint!§!\\n\\n§YComponents must be researched before they appear in the designer!§!"
#  确定
  gts_leader_bruh.0006.a: "Confirmed"
#  击败战列舰娘
  gts_leader_bruh.0007.name: "Defeat Battleship Shipgirl"
#  这是一场艰苦的战斗。那位战列舰娘直到最後一刻还在开火，她肩上的主炮在熄灭前轰出了最後一发炮弹，将我们三艘主力舰送进了历史。但最终她还是倒下了。在她那已经冷却的身躯中，我们还找到了一本笔记。里面记录着她对每一场战斗的感想，对每一次开火的校正数据，以及...对家乡的思念。原来她也曾是某个文明培养出的守护者。\n\n§G解锁随机一种§MBruh战列舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!
  gts_leader_bruh.0007.desc: "This was a grueling battle. The Battleship shipgirl was still firing until the very last moment; before going dark, her shoulder-mounted main battery unleashed one final shell, sending three of our capital ships into history. But ultimately, she fell. Within her cooled body, we also found a notebook. It recorded her reflections on every battle, calibration data for every shot, and... a longing for home. It turns out she too was once a guardian cultivated by some civilization.\\n\\n§GUnlocked a random §MBruh Battleship Shipgirl§! blueprint!§!\\n\\n§YComponents must be researched before they appear in the designer!§!"
#  击败无畏舰娘
