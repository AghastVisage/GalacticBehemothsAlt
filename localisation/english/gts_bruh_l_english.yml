  # 这些工人攀爬在直径数公里的棉质纤维上，使用特制的切割工具收割这些坚韧的材料。每日的工作都是在悬空数公里的高度进行的
  job_gts_bruh_panties_planet_03_worker_desc: "These workers climb upon cotton fibers several kilometers in diameter, using specialized cutting tools to harvest these tough materials. Daily work is performed suspended at heights of several kilometers."
