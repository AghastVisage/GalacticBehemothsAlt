#  究极的原味兵器
  gts_leader_bruh.0022.name: "The Ultimate Original Weapon"
#  通讯萤幕上，鹅将军兴奋地挥舞着翅膀，它身後的实验室里堆满了各种数据图表和材料样本。\n\n§M"成功了！我成功了！"§!\n\n§Y(它激动地大喊)§!\n\n§M"经过对七种不同星球的详细数据分析，我终於研发出了完美的胖次包覆武器！"§!\n\n§M"套上去的过程非常简单"\n\n"舰娘只需要像平时脱胖次一样，把它从身上褪下来，然後对准目标星球一套就行。胖次的松紧带会自动收缩，紧紧勒在星球的赤道上，确保没有任何缝隙"§!\n\n萤幕切换到实战示范画面。一条巨大的蓝白条纹胖次被无畏舰娘脱下，她将胖次撑开，对准了一颗行星。画面中，那条胖次完整地套在了星球上。星球的赤道位置被松紧带勒出一道深深的凹痕。整颗星球被蓝白条纹的布料严密包裹。\n\n§M"这就是我设计的歼星武器！"§!\n\n§Y(鹅将军张开翅膀)§!\n\n§M"它不会立刻杀死敌人，而是让他们在漫长的时间里慢慢绝望。让他们明白，自己的文明、自己的母星、自己呼吸的每一口空气，都被一个巨大少女的小穴气味所污染，而且永远无法摆脱！"§!\n\n它顿了顿，补充道:\n\n§M"只有一个问题。脱下胖次的舰娘可能会感到不适。建议在执行任务时携带备用内裤，或者乾脆真空作战。反正以舰娘的体型，大家本来就能看到她们的裙底风光了"§!\n\n通讯即将结束时，鹅将军认真地说:\n\n§M"感谢您对这个项目的支持。正是七次实验提供的宝贵数据，才让这个武器得以诞生。现在，原味胖次包覆武器已经可以正式投入生产了"\n\n§Y获得新巨像武器：$tech_gts_bruh_shipgirl_planet_killer_panties$§!
  gts_leader_bruh.0022.desc: "On the communication screen, General Goose flaps his wings excitedly. The lab behind him is piled with data charts and material samples.\\n\\n§M\"It's a success! I've succeeded!\"§!\\n\\n§Y(He shouts excitedly)§!\\n\\n§M\"After analyzing detailed data from seven different planets, I have finally developed the perfect Pantsu-wrapping weapon!\"§!\\n\\n§M\"The application process is very simple.\"\\n\\n\"The shipgirl only needs to shed her pantsu as she normally would, then align it with the target planet. The waistband will automatically contract, tightening around the planet's equator and ensuring there are no gaps.\"§!\\n\\nThe screen switches to a combat demonstration. A massive pair of blue-and-white striped pantsu is shed by a Dreadnought Shipgirl; she stretches them out and aligns them with a planet. In the footage, the pantsu perfectly encapsulates the planet. The planet's equator is deeply indented by the waistband. The entire planet is strictly wrapped in the blue-and-white striped fabric.\\n\\n§M\"This is the planet-killer weapon I designed!\"§!\\n\\n§Y(General Goose spreads his wings)§!\\n\\n§M\"It won't kill the enemies immediately; instead, it lets them slowly despair over a long time. It makes them understand that their civilization, their home planet, and every breath of air they take are polluted by the scent of a giant girl's pussy, and they can never escape!\"§!\\n\\nHe paused and added:\\n\\n§M\"There's only one issue. The shipgirl might feel uncomfortable after shedding her pantsu. I recommend carrying spare undergarments during missions, or simply operating bare. Anyway, with a shipgirl's size, everyone can see up their skirts anyway.\"§!\\n\\nAs the communication ends, General Goose says seriously:\\n\\n§M\"Thank you for your support of this project. It was the valuable data from the seven experiments that allowed this weapon to be born. Now, the Original Pantsu-wrapping Weapon can officially enter production.\"\\n\\n§YObtained new Colossus weapon: $tech_gts_bruh_shipgirl_planet_killer_panties$§!"
#  伟大的发明...大概吧...
  gts_leader_bruh.0022.a: "A great invention... probably..."
#  有点同情那些被套住的星球了
  gts_leader_bruh.0022.b: "I feel a bit sorry for those wrapped planets."
