  gts_event_bruh.61.b.custom_tooltip: "Since resistance is impossible, might as well grovel. Hand over double the amount, hoping for mercy\n§YHand over 25% of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]'s population§!\n§YNext requisition in 30 years§!"
