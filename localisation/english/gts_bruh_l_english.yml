  # Original: 回到上一页
  gts_leader_bruh.7.hire: "Return to previous page"
  # Original: 输送至食品加工链
  gts_event_bruh.51.b: "Transport to food processing chain"
  # Original: 该领袖调查完星系时:获得少量资源
  gts_skill_official_level_two_2_effect: "When this leader finishes surveying a system: Gain a small amount of resources"
  # Original: 根据我们与§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!签订的附庸条约中的『人口取用』条款，帝国商务部例行公事地签发了一份征用令，要求该附庸国提供一批小人劳动力。货物，或者说小人，已经准时送达指定的集散中心。他们被分类装在透明的强化玻璃箱内，每个箱子容纳了数以万计的小人。他们中的大多数面露恐惧，紧紧靠在一起，仰望着对他们而言如同苍穹般巨大的仓库顶棚和前来验收的帝国官员。有些箱子里的『货物』似乎因为运送途中的颠簸而出现了损耗，箱底沾染着不易察觉的暗红色污渍。一份电子清单已经上传至您的终端，列出了这批『货物』的数量、性别和大致健康状况。现在，需要您对这批资源的最终用途进行批示。
  gts_event_bruh.31.desc: "According to the 『Population Usage』 clause in the vassal treaty we signed with §Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!, the Imperial Ministry of Commerce has routinely issued a requisition order, requiring the vassal state to provide a batch of tiny labor. The cargo, or rather the tiny people, has been delivered on time to the designated distribution center. They are sorted and packed in transparent reinforced glass boxes, each containing tens of thousands of tiny people. Most of them look terrified, huddling together, looking up at the warehouse ceiling, which is as huge as the sky to them, and the Imperial officials who came to accept them. The 『cargo』 in some boxes seems to have suffered losses due to bumps during transport, with difficult-to-detect dark red stains at the bottom of the boxes. An electronic list has been uploaded to your terminal, listing the quantity, gender, and approximate health status of this batch of 『cargo』. Now, your approval is needed for the final use of these resources."
  # Original: 既然无法反抗，那就竭力讨好。不仅如数上交，还要额外献上我们『最优秀』、『最自愿』的同胞，并附上谄媚的颂词。或许极致的顺从能换来一丝怜悯，甚至是一点残羹冷炙般的赏赐\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!
  gts_event_bruh.41.b.custom_tooltip: "Since resistance is impossible, try to please them. Not only hand over the full amount but also offer our 『best』 and 『most willing』 compatriots, accompanied by flattering eulogies. Perhaps extreme obedience can be exchanged for a trace of pity, or even a bit of leftover-like reward\n§YHand over 10% of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]'s population§!"
  # Original: §Y二级好感§!   ([this.gts_love_logs] / 50)\n[this.GetName]的感情逐渐升温，似乎逐渐成为了[Owner.GetName]的一份子
  trait_leader_gts_love_lv2_desc: "§YLevel 2 Affection§!   ([this.gts_love_logs] / 50)\n[this.GetName]'s feelings are gradually heating up, seemingly becoming a part of [Owner.GetName]"
  # Original: §Y六级好感§!   ([this.gts_love_logs]) \n[this.GetName]与我们已然超越了言语的描述，直至星河尽头
  trait_leader_gts_love_lv6_desc: "§YLevel 6 Affection§!   ([this.gts_love_logs]) \n[this.GetName] and us have gone beyond words, until the end of the galaxy"
  # Original: 将这些小人分送到帝国的娱乐设施。用于满足巨娘的性欲需求，在巨大的手指、舌尖或性器下体验极致的渺小感与绝望感，直至被碾碎，为帝国的娱乐产业贡献其微不足道的价值
  gts_event_bruh.51.a.custom_tooltip: "Distribute these tiny people to the Empire's entertainment facilities. Used to satisfy the sexual needs of giantesses, experiencing extreme insignificance and despair under giant fingers, tongues, or genitals until crushed, contributing their negligible value to the Empire's entertainment industry"
  # Original: §Y3000£gts_micro£人口死亡§!
  gts_bruh_casualties_3000.tooltip: "§Y3000£gts_micro£Populations Died§!"
  # Original: 将这些小人归类为食品资源。它们将被批次处理，成为巨娘餐桌上的活点心、调味品或零食，在巨大的口腔和胃袋中结束其微不足道的存在
  gts_event_bruh.51.b.custom_tooltip: "Classify these tiny people as food resources. They will be processed in batches, becoming live snacks, condiments, or treats on the giantess's table, ending their insignificant existence in huge mouths and stomachs"
  # Original: 将部分小人用于高强度的劳动消耗，另一部分则作为巨娘的玩物
  gts_event_bruh.31.a.custom_tooltip: "Use some tiny people for high-intensity labor consumption, while others serve as playthings for giantesses"
  # Original: 反抗即是毁灭。为了种族的存续，我们必须忍受这份屈辱。至少...这能换来短暂的和平\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]5%的人口§!
  gts_event_bruh.41.a.custom_tooltip: "Resistance is destruction. For the survival of the race, we must endure this humiliation. At least... this can buy brief peace\n§YHand over 5% of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]'s population§!"
  # Original: 还是算了
  gts_leader_bruh.7.close: "Forget it"
  # Original: 巨型通告画面照亮了整个首都的天空，冰冷的机械女声宣读着来自巨娘母星的指令。§Y[from.GetName]§!的指令如同其体型一般沉重且无可抗拒。根据那份将我们定义为『消耗品』的屈辱条款，新一批的征收令已经送达。我们必须立即上缴又一批我们的同胞，他们将永远离开我们的城市，也就是那些在巨娘眼中不过是鞋印缝隙里沙砾般的聚集点。政府的抽签系统已经开始残酷地运转，无数家庭在恐惧中等待着结果。街上弥漫着绝望的气氛，所有人都清楚被选中的命运意味着什么。身为附庸国的领导人，您需要对此作出回应，以稳定（或利用）这沸腾的民意。
  gts_event_bruh.61.desc: "Huge announcement screens lit up the entire capital's sky. A cold mechanical female voice read out the orders from the giantess homeworld. The command from §Y[from.GetName]§! was as heavy and irresistible as their size. According to that humiliating clause defining us as 'consumables', a new requisition order has arrived. We must immediately hand over another batch of our compatriots, who will leave our cities forever—those gathering points that are but sand in the crevices of footprints in the giantess's eyes. The government's lottery system has begun to operate cruelly, and countless families wait for the results in fear. Despair fills the streets, everyone knows what fate awaits the chosen ones. As the leader of a vassal state, you need to respond to this to stabilize (or exploit) this boiling public opinion."
  # Original: §Y75%£gts_micro£人口死亡§!
  gts_bruh_casualties_75_50.tooltip: "§Y75%£gts_micro£Populations Died§!"
  # Original: 遵守命令，交出名单上的人民。动用宣传机器，宣称这是「为国奉献」，并为其家属提供补偿\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]1%的人口§!
  gts_event_bruh.21.a.custom_tooltip: "Obey orders, hand over the people on the list. Use propaganda machines to declare this as \"devotion to the country\" and provide compensation to their families\n§YHand over 1% of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]'s population§!"
  # Original: 将这些小人作为奖赏分发给她们，无论是用作私人奴仆、脚底按摩还是别的什么"用途"都能极大地鼓舞士气
  gts_event_bruh.31.b.custom_tooltip: "Reward these tiny people to them. Whether used as private slaves, foot massages, or other \"uses\", it can greatly boost morale"
  # Original: 它们不是消耗品，而是宠物。应当给予它们尊重与关怀，让它们成为宫殿中一道亮丽的风景线
  gts_event_bruh.11.a.custom_tooltip: "They are not consumables, but pets. They should be given respect and care, making them a beautiful scenery line in the palace"
  # Original: 一道冰冷的指令从§Y[from.GetName]§!传来。根据那份屈辱的「宠物条款」，他们要求我们提供一批公民，以满足其巨娘公民对「宠物」的需求。征召令上附带著名单，上面是我们的人民、工程师、艺术家、劳工，它们现在仅仅被视为可供挑选的商品。我们该如何回应？
  gts_event_bruh.21.desc: "A cold command arrived from §Y[from.GetName]§!. According to that humiliating \"Pet Clause\", they demand we provide a batch of citizens to satisfy their giantess citizens' demand for \"pets\". The conscription order comes with a list, containing our people, engineers, artists, workers. They are now merely seen as commodities for selection. How should we respond?"
  # Original: §Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§!的大使带着一队精心挑选的小人来到了您的宫殿。这些小人被训练得彬彬有礼，穿着华丽的服饰，眼神中混杂着恐惧与一丝被选中的荣耀。根据我们签订的"宠物条款\"，这是它们应尽的义务。大使恭敬地呈上名单，并向您解释道，这些是本届最\"优质"的宠物候选者，他们经过健康筛选和严苛训练，旨在为您提供最好的服务。现在，是时候决定如何「使用」这批活体贡品了。
  gts_event_bruh.11.desc: "The ambassador of §Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§! arrived at your palace with a team of carefully selected tiny people. These tiny people are trained to be polite, wearing gorgeous clothes, with a mixture of fear and a trace of honor of being chosen in their eyes. According to the \"Pet Clause\" we signed, this is their obligation. The ambassador respectfully presented the list and explained to you that these are the most \"high-quality\" pet candidates of this session, screened for health and rigorously trained, aiming to provide you with the best service. Now, it is time to decide how to \"use\" this batch of living tributes."
  # Original: §R摧毁所有普通帝国大部分的军用船只，不包含民用船只
  gts_leader_bruh.7.a: "§RDestroy most military ships of all normal empires, excluding civilian ships"
  # Original: 我这有两个能提升速度的选项§R（想好了再用，非必要别用）§!\n\n§R摧毁所有普通帝国大部分的军用船只，不包含民用船只§Y（小幅提升游戏速度）§!§!\n\n§R摧毁所有普通帝国几乎所有的船只，包含开采站及星港§Y（大幅提升游戏速度，但会失去除了殖民地以外的星系）§!§!
  gts_leader_bruh.7.desc: "I have two options that can increase speed here §R(Use with caution, don't use unless necessary)§!\n\n§RDestroy most military ships of all normal empires, excluding civilian ships §Y(Slightly increase game speed)§!§!\n\n§RDestroy almost all ships of all normal empires, including mining stations and starbases §Y(Greatly increase game speed, but will lose systems except colonies)§!§!"
  # Original: 分配至巨娘红灯区
  gts_event_bruh.51.a: "Send to entertainment venues"
  # Original: 谄媚讨好
  gts_event_bruh.61.b: "Reject Requisition"
  # Original: 筛选一下，健壮的送去劳动，孱弱的送去娱乐中心
  gts_event_bruh.31.a: "Agree to requisition"
  # Original: 含泪执行
  gts_event_bruh.21.a: "Obey Requisition"
  # Original: 尽管心如刀割，但反抗意味着整个文明可能被一只巨足轻易抹去。出动治安部队镇压任何形式的反抗，确保『货物』能准时、足量地送达。并向它们保证，它们的牺牲将被铭记（尽管无人会记得)\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!
  gts_event_bruh.61.a.custom_tooltip: "Execute the order without hesitation, even if it means sacrificing our people. For survival, any price is worth it"
  # Original: 一份来自巨人国度的指令抵达了§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!。根据那份我们无法拒绝的条约，宗主国§Y[from.GetName]§!要求我们立即提供人口，作为『特殊劳务输出』。运输船队已经停靠在近地轨道，巨大的阴影投射在城市上空，如同末日降临。国内的新闻媒体被强制噤声，但恐慌仍透过口耳相传蔓延开来。人们躲在家中，祈祷厄运不会降临在自己头上。军队在街上巡逻，强制征召适龄人口，哭喊声和呵斥声在街上回荡。我们深知这些同胞一旦被送走，将面临的命运绝非简单的『劳务』。我们必须立刻决定如何面对这道冰冷的命令。
  gts_event_bruh.41.desc: "The giantess empire §Y[from.GetName]§! sent another instruction. The wording is polite but arrogant, \"inviting\" us to contribute a part of the population to their entertainment industry. They explicitly stated that giantess citizens need more \"living toys\" to pass the time. Our citizens will be sent to arenas, circuses, or private parties, to be played with or crushed to death amidst laughter. The Minister of Finance reminded you that rejecting might lead to trade sanctions or even war, while agreeing can exchange for a considerable amount of resource assistance, they call it \"performance fee\"."
  # Original: §R摧毁所有普通帝国几乎所有的船只，包含开采站及星港
  gts_leader_bruh.7.b: "§RDestroy almost all ships of all normal empires§!"
  # Original: 投入红灯区
  gts_event_bruh.11.b: "Perfunctory drafting"
  # Original: §Y四级好感§!   ([this.gts_love_logs] / 100)\nw我们如今与[this.GetName]拥有了深厚的情谊，即使再大的体型差距也难以阻碍这份关系\n$leader_trait_gtsdestroyer_picture$
  trait_leader_gts_love_lv4_desc: "§YLevel 4 Affection§!   ([this.gts_love_logs] / 200)\n[this.GetName] has become sticky with us, willing to dedicate everything to [Owner.GetName]"
  # Original: 履行条款
  gts_event_bruh.41.a: "Obey Requisition"
  # Original: 视为宠物
  gts_event_bruh.11.a: "Obey Requisition"
  # Original: 谄媚讨好
  gts_event_bruh.41.b: "Refuse Requisition"
  # Original: §Y五级好感§!   ([this.gts_love_logs] / 100)\n无论[Owner.GetName]剑指何方，[this.GetName]始终都将陪在我们身旁
  trait_leader_gts_love_lv5_desc: "§YLevel 5 Affection§!   ([this.gts_love_logs] / 400)\n[this.GetName] loves [Owner.GetName] deeply, willing to give everything for [Owner.GetName]"
  # Original: 向宗主国发出请求，表示愿意上缴双倍的资源来「赎回」这些公民的自由，强调这样对§Y[from.GetName]§!更有利可图
  gts_event_bruh.21.b.custom_tooltip: "Refuse to hand over citizens. This will be seen as a challenge to the suzerain's authority, possibly leading to deteriorating relations or war, but will protect our people from the fate of becoming pets"
  # Original: 宠物？不过是高级玩具罢了。把它们送到红灯区去，物尽其用，让大家开心开心，还能赚点外快
  gts_event_bruh.11.b.custom_tooltip: "Select prisoners and homeless people to hand over. They are burdens to society anyway, better to exchange for some value"
  # Original: 赏赐给有功的将领和官员
  gts_event_bruh.31.b: "Reject requisition"
  # Original: §Y500£gts_micro£人口死亡§!
  gts_bruh_casualties_500.tooltip: "§Y500£gts_micro£Populations Died§!"
  # Original: §Y一级好感§!   ([this.gts_love_logs] / 25)\n[this.GetName]与我们还十分生疏，难以真正地敞开心扉.相信这层壁垒会随着相处时间增加而逐渐消融
  trait_leader_gts_love_lv1_desc: "§YLevel 1 Affection§!   ([this.gts_love_logs] / 25)\n[this.GetName] is still very unfamiliar with us, difficult to truly open her heart. Believe this barrier will gradually melt with increased time together"
  # Original: §Y50%£gts_micro£人口死亡§!

  gts_bruh_casualties_50_50.tooltip: "§Y50%£gts_micro£Populations Died§!"
  # Original: 打捞或研究完成星系中的残骸时：打捞出舰船的概率：10%\n§R只能打捞军用[GetShipType]§!。
  gts_skill_scientist_level_two_07_effect: "When salvaging or researching debris in a system: Ship salvage chance: 10%\n§ROnly military [GetShipType] can be salvaged§!."
  # Original: 履行条款
  gts_event_bruh.61.a: "Fulfill the terms"
  # Original: 回到上一页
  # Original: 输送至食品加工链
  # Original: 该领袖调查完星系时:获得少量资源
