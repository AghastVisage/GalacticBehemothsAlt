  sc_gts_bruh_aurora_desc: ""
  #  據說如果能穿過白洞就能到達§R巨娘居住的世界§!，但直到現在似乎也沒有人能做到完整地進入白洞。因為§Y$NAME_gts_eyjafjalla$§!瞬間注入的巨量乳汁，使得白洞的質量大增，發出的引力波比一般黑洞還強，更加干擾超光速引擎的工作，使戰艦難以緊急脫離戰鬥。
  pc_gts_bruh_white_hole_desc: "It is said that if one could pass through the White Hole, they could reach the §RWorld where Giantesses Reside§!, but so far no one seems to have been able to enter it completely. Because of the massive amount of milk injected by §Y$NAME_gts_eyjafjalla$§! in an instant, the White Hole's mass has greatly increased, emitting gravitational waves stronger than average black holes and further interfering with FTL engines, making it difficult for warships to emergency disengage from combat."
  #  這顆星球被完全包裹在一條從無畏艦娘身上脫下的巨大藍白條紋內褲之中。原本的天空已被厚達數公里的棉質織物所取代，抬頭望去，只能看見無邊無際的白色與藍色纖維交織而成的「天空」。地表常年處於濕熱、陰暗的狀態，空氣中瀰漫著令人窒息的氨味、汗味與女性下體特有的濃烈麝香味。自然降雨已不復存在，取而代之的是當上方的織物吸飽了體液後，滴落下來的粘稠愛液雨與變質的汗水。海洋已變成了渾濁的黃白色混合液體。
  #  这颗星球被完全包裹在一条从无畏舰娘身上脱下的巨大蓝白条纹内裤之中。原本的天空已被厚达数公里的棉质织物所取代，抬头望去，只能看见无边无际的白色与蓝色纤维交织而成的「天空」。地表常年处於湿热、阴暗的状态，空气中弥漫着令人窒息的氨味、汗味与女性下体特有的浓烈麝香味。自然降雨已不复存在，取而代之的是当上方的织物吸饱了体液後，滴落下来的粘稠爱液雨与变质的汗水。海洋已变成了浑浊的黄白色混合液体。
#  这颗星球被完全包裹在一条从无畏舰娘身上脱下的巨大蓝白条纹内裤之中。原本的天空已被厚达数公里的棉质织物所取代，抬头望去，只能看见无边无际的白色与蓝色纤维交织而成的「天空」。地表常年处於湿热、阴暗的状态，空气中弥漫着令人窒息的氨味、汗味与女性下体特有的浓烈麝香味。自然降雨已不复存在，取而代之的是当上方的织物吸饱了体液後，滴落下来的粘稠爱液雨与变质的汗水。海洋已变成了浑浊的黄白色混合液体。
  pc_gts_bruh_panties_planet_01_desc: "This planet is completely enveloped in a giant pair of blue and white striped panties removed from a Dreadnought Shipgirl. The original sky has been replaced by cotton fabric miles thick; looking up, one can only see an 'atmosphere' of endless interwoven white and blue fibers. The surface is perpetually humid and dark, with the air filled with suffocating scents of ammonia, sweat, and the intense musky aroma of a woman's lower body. Natural rainfall no longer exists; instead, when the fabric above becomes saturated with body fluids, viscous love juice rain and decomposed sweat drip down. The oceans have turned into a turbid mixture of yellow and white liquids."
#  裤带城市
  district_gts_bruh_panties_planet_01: "Elastic Band City"
#  原本的天空已被厚达数公里的织物取代，地表常年处於湿热阴暗的状态，殖民者在织物纤维间建立城市，开采尿渍结晶作为能源，在爱液沼泽中打捞各种残骸\n空气中混杂着汗味、氨味与女性特有的浓烈气息
  col_gts_bruh_panties_tt: "The original sky has been replaced by miles-thick fabric, and the surface remains humid and dark year-round. Colonists establish cities among the fabric fibers, mine urine stain crystals for energy, and salvage various wrecks from love juice swamps. \\nThe air is a mixture of sweat, ammonia, and the intense unique aura of women."
#  位於高空的巨大环形山脉，实则是勒紧星球的松紧带结构。这里远离了底部的潮湿与异味，空气相对清新且乾燥。巨大的纤维如同天然的地基，为建筑提供了稳固的依托。
  district_gts_bruh_panties_planet_01_desc: "A massive ring mountain range in the high altitude, which is actually the elastic band structure tightening around the planet. It is far from the humidity and odors of the bottom, with relatively fresh and dry air. The giant fibers serve as natural foundations, providing stable support for buildings."
#  位於胖次前段的区域，通常是对应舰娘尿道口的位置。织物呈现出淡淡的黄色并已经硬化。这些「黄渍」中蕴含着巨娘排泄的高能化合物晶体。虽然开采过程伴随着令人窒息的氨气味，但燃烧这些晶体能提供惊人的能量，每一块晶体都浓缩了舰娘膀胱内的高能代谢废物。
  district_gts_bruh_panties_planet_02_desc: "An area in the front of the panties, typically corresponding to the position of the shipgirl's urethral opening. The fabric appears slightly yellow and has hardened. These 'yellow stains' contain high-energy compound crystals excreted by the giantess. Although the mining process is accompanied by a suffocating ammonia smell, burning these crystals provides incredible energy; each crystal concentrates the high-energy metabolic waste from the shipgirl's bladder."
#  位於胖次核心的区域，这里的织物常年湿润，形成了一片由爱液构成的沼泽。开采这里需要重型机械进行打捞，每一铲下去都能挖出各种残骸，那是无数个被舰娘塞入小穴内的星球残渣或船舰与爱液混合的产物。
  district_gts_bruh_panties_planet_03_desc: "An area at the core of the panties, where the fabric is perpetually moist, forming a swamp made of love juices. Mining here requires heavy machinery for salvaging; every scoop can dig up various wrecks—the remains of countless planets or ships inserted into the shipgirl's aperture, mixed with love juices."
#  卷曲阴毛丛林
  d_gts_bruh_panties_planet_05_deposits: "Curled Pubic Hair Jungle"
#  几根从舰娘私处脱落的黑色阴毛掉落在这里，对於小人来说，它们是横亘在地表上、粗达数公里且坚硬无比的卷曲黑色山脉。这些巨型阴毛阻断了交通，且难以切断
  d_gts_bruh_panties_planet_05_deposits_desc: "Several black pubic hairs shed from the shipgirl's private parts have fallen here; for the little people, they are curled black mountains crossing the surface, several kilometers thick and incredibly hard. These giant pubic hairs block transportation and are difficult to cut through."
  job_gts_bruh_panties_planet_01_worker: "Urine Crystal Miner"
  #  專門負責在黃漬區域開採硬化的尿液結晶。這些工人配備密封面罩以過濾空氣中的氨氣，使用震動鎬敲碎琥珀色的晶體層，將其送往煉製設施轉化為能源
  job_gts_bruh_panties_planet_01_worker_desc: "Specialized in mining hardened urine crystals in the yellow stain areas. These workers are equipped with sealed masks to filter out ammonia from the air, using vibration picks to break the amber crystal layers and sending them to refining facilities for conversion into energy."
  #  $job_gts_bruh_panties_planet_02_worker$崗位
  #  $job_gts_bruh_panties_planet_02_worker$岗位
#  $job_gts_bruh_panties_planet_02_worker$岗位
  mod_job_gts_bruh_panties_planet_02_worker_add: "$job_gts_bruh_panties_planet_02_worker$ Job"
  job_gts_bruh_panties_planet_03_worker: "Fiber Collector"
  #  這些工人攀爬在直徑數公里的棉質纖維上，使用特製的切割工具收割這些堅韌的材料。每日的工作都是在懸空數千公尺的高度進行的
  #  這些工人攀爬在直徑數公里的棉質纖維上，使用特製的切割工具收割這些堅韌的材料。每日的工作都是在懸空數公里的高度進行的
  #  这些工人攀爬在直径数公里的棉质纤维上，使用特制的切割工具收割这些坚韧的材料。每日的工作都是在悬空数公里的高度进行的
#  这些工人攀爬在直径数公里的棉质纤维上，使用特制的切割工具收割这些坚韧的材料。每日的工作都是在悬空数公里的高度进行的
  job_gts_bruh_panties_planet_03_worker_desc: "These workers climb upon cotton fibers several kilometers in diameter, using specialized cutting tools to harvest these tough materials. Daily work is performed suspended at heights of several kilometers."
#  你可以在这里购买Bruh舰娘的坐标\n\n§Y"提醒您，虽然§M鹅§!总是会把影响力还你，但每次使用通讯面板所花费的影响力还是会增加§!\n\n§R所以别没事打扰§M鹅§!§!
  gts_leader_bruh.0002.desc: "You can purchase the coordinates of Bruh Shipgirls here. \\n\\n§Y\"Reminder: although §MGoose§! always returns your Influence, the Influence cost for using the communication panel increases each time.\"§! \\n\\n§RSo don't disturb §MGoose§! for no reason.§!"
#  §M鹅:这些事件通常会摧毁一些东西，毕竟舰娘也没那麽受控的......§!\n\n§R"自己斟酌要不要开吧(大多数事件要开这个才会触发)"§!
  gts_leader_bruh.0002.e.custom_tooltip: "§MGoose: These events usually destroy something; after all, shipgirls aren't that easy to control...§! \\n\\n§R\"Decide for yourself whether to enable them (most events require this to be enabled to trigger)\"§!"
#  §M鹅:我建议使用小型船只去打，舰娘的单发火力强大，小船的数量、高闪避、低造价都能很好的消除掉舰娘的攻击§!
  gts_leader_bruh.0002.h.custom_tooltip: "§MGoose: I suggest using small ships to fight; shipgirls have powerful single-shot fire, so the quantity, high evasion, and low cost of small ships can effectively offset their attacks.§!"
#  我们做到了。付出了惨痛的代价後，我们击败了那位曾让整个星区为之颤抖的无畏舰娘。当她那比恒星还要巨大的身躯终於停止挣扎时，整个战场陷入了诡异的寂静。没有人敢第一个靠近她。那些曾经吞噬过星球的唇瓣，那双能够徒手捏碎战舰的玉手，那柄削铁如泥的斩舰刀...即使在死亡面前，她依然散发着令人窒息的威压。花了整整一个月，我们才完成对她屍体的初步勘探。我们发现了她的记忆数据。原来在变成这样的存在之前，她也曾是个普通的少女，是某种我们无法理解的技术将她改造成了这样的「武器」。在记忆的最後，一个想法闪过了她的脑海中。"我已经记不清自己的名字了，但我还记得...我曾经也想要被温柔对待......"\n§V(研究团队陷入了长久的沉默)§!\n\n§G解锁随机一种§MBruh无畏舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!
  gts_leader_bruh.0008.desc: "We did it. After paying a tragic price, we defeated the Dreadnought Shipgirl who once made the entire sector tremble. When her body—larger than a star—finally stopped struggling, the entire battlefield fell into an eerie silence. No one dared to be the first to approach her. Those lips that once swallowed planets, those jade hands capable of crushing warships with bare strength, that ship-slaying blade that cut metal like butter... even in death, she still radiated an overwhelming pressure. It took an entire month to complete the preliminary exploration of her remains. We discovered her memory data. It turns out that before becoming such an existence, she too was just an ordinary girl; some technology beyond our understanding had transformed her into this 'weapon'. At the very end of her memories, a thought flashed through her mind: \"I can no longer remember my name, but I remember... I once wanted to be treated with tenderness...\" \\n§V(The research team fell into a long silence)§! \\n\\n§GUnlocked a random §MBruh Dreadnought Shipgirl§! blueprint§! \\n\\n§YRequires researching components to appear in the designer§!"
#  通讯萤幕上出现了鹅将军那张标志性的脸庞。这只总是发出奇怪叫声的生物最近一直盯着舰娘们换洗下来的衣物发呆，那些面积媲美大陆、散发着浓烈气味的巨大胖次堆积如山。它突然灵光一闪，那颗聪明的脑袋里诞生了一个疯狂的想法。\n\n§M"光是把星球塞进小穴内还不够！"§!\n\n§Y(它拍着桌子大喊)§!\n\n§M"我们需要一种能让敌人世世代代都活在巨娘胯下阴影之中的手段!一种能够羞辱它们、封锁它们、让它们的後代只能呼吸少女私处气味的终极武器！"§!\n\n鹅将军说明了它的计划，画面上显示着一条巨大的舰娘胖次完整包裹住整颗星球的示意图。它需要收集不同类型星球被塞入舰娘小穴後的详细数据，以便计算出最合适的胖次材料强度、弹性系数，以及能够完美保存舰娘体味的织物配方。\n\n§M"我需要七种不同环境的星球数据"§!\n\n§Y(鹅将军兴奋地说)§!\n\n§M"荒芜的、冰冻的、有毒的、炽热的、乾燥的、寒冷的，还有那种生机勃勃的！把它们全都塞进去，然後记录下舰娘小穴内壁的每一次收缩、爱液的分泌量、以及星球表面被碾压的具体数据！"§!\n\n它指着萤幕上标记出的七个目标星球。\n\n§M"完成这些实验，我就能制造出一种特殊的巨像武器。它能把舰娘刚脱下的、还沾满爱液和阴垢的胖次完整地套在敌人的母星上！让那颗星球永远沾着少女私处的气息！"§!\n\n§Y任务目标：使用舰娘的【塞入小穴】巨像武器处理掉7个指定星球(查询情报日志以追踪位置)§!
  gts_leader_bruh.0021.desc: "General Goose's iconic face appeared on the communication screen. This creature, which always makes strange noises, has recently been staring blankly at the laundry the shipgirls changed out of—massive panties spreading like continents and emitting intense scents, piled high like mountains. A sudden flash of inspiration struck, and a crazy idea was born in that clever head. \\\\n\\\\n§M\\\"Just inserting planets into the aperture isn't enough!\\\"§! \\\\n\\\\n§Y(It shouts, slamming the table)§! \\\\n\\\\n§M\\\"We need a way to make the enemy live in the shadow of the giantess's crotch for generations! An ultimate weapon that can humiliate them, block them, and force their descendants to breathe nothing but the scent of a girl's private parts!\\\"§! \\\\n\\\\nGeneral Goose explained the plan, while the screen showed a schematic of a giant shipgirl panty completely enveloping entire planets. It needs to collect detailed data from different types of planets being inserted into the shipgirls' apertures to calculate the most suitable panty material strength, elasticity coefficients, and a fabric formula that can perfectly preserve the shipgirls' body scent. \\\\n\\\\n§M\\\"I need data from seven planets with different environments,\\\"§! \\\\n\\\\n§Y(General Goose says excitedly)§! \\\\n\\\\n§M\\\"Barren, Frozen, Toxic, Molten, Desert, Cold, and those full of life! Shove them all in, then record every contraction of the aperture's inner walls, the volume of love juice secretion, and the specific data of the planet's surface being crushed!\\\"§! \\\\n\\\\nIt points to the seven target planets marked on the screen. \\\\n\\\\n§M\\\"Complete these experiments, and I can create a special Colossus weapon. It can take the shipgirl's just-removed panties, still covered in love fluid and crotch residue, and envelop the enemy's home planet completely! Let that planet forever carry the scent of a girl's private parts!\\\"§! \\\\n\\\\n§YMission Objective: Use the [Insert into Aperture] Colossus weapon to process 7 designated planets (Track locations in Situation Log)§!"
#  无畏舰娘刚刚结束了一场长达两周的巡逻任务，身上的衣物早已被汗水浸透。一支舰队小心翼翼地接近正在休息的舰娘。她此刻正漂浮在恒星基地附近，双腿微微张开，让恒星过被汗水浸湿的胯部。那条蓝白条纹的胖次已经完全变了颜色，原本鲜艳的蓝色变成了暗沉的灰蓝，而白色部分则呈现出不均匀的黄褐色。\n\n§Y"舰娘小姐，我们需要...呃...收集您的...那个..."§!\n\n舰队指挥官结结巴巴地通过通讯器说道。舰娘睁开眼睛，看着那些漂浮在她胯下，如同飞蚊的的小飞船，脸上露出疑惑的表情。\n\n§R"收集什麽？"§!\n\n§Y"您的...内裤..."§!\n\n指挥官硬着头皮说出来，声音小得像蚊子。\n\n§R"啊？！"§!\n\n舰娘的脸瞬间涨红。\n\n§Y"你们要我的胖次？这...这也太羞耻了吧！而且我已经穿了两个星期了，肯定很臭..."§!\n\n§M"正是因为这样才需要！"§!\n\n鹅将军的声音突然插入通讯。\n\n§M"我需要您最原汁原味的胖次！上面的汗液、爱液、尿渍、阴垢，全都是宝贵的研究材料！拜托了，这关系到帝国的未来！"§!\n\n舰娘犹豫了很久，最後还是叹了口气。\n\n§R"好吧...但你们要保证不会拿去做奇怪的事情..."§!\n\n她伸手勾住胖次的边缘，缓缓向下褪去。那条被浸透的内裤与肌肤分离时发出"嗤啦"的粘连声，裆部的布料更是因为乾涸的爱液而变得硬邦邦的。当胖次完全脱下时，一股浓烈的气味瞬间扩散开来。当胖次被放入货舱时，舰员们即使隔着密封舱，也能闻到那股混合了汗臭、尿骚和腥味的复合气味。有几个人当场就晕了过去，剩下的人强忍着恶心，用机械臂小心翼翼地将这条巨大的胖次收纳进特制的密封容器中。\n\n§Y"样本采集完成...天啊...我这辈子都不想再闻到这种味道了..."§!\n\n指挥官虚弱地说道。而在基地里，鹅将军已经迫不及待地打开了密封容器。浓烈的气味像实体一样涌出，整个基地瞬间被这股臭味淹没。但鹅将军丝毫不在意，它兴奋地扑向那条有如平原一般的胖次，开始仔细检查每一处污渍。\n\n§M"完美!完美!这裆部的黄渍简直是艺术品！"\n"看这浓度!看这粘稠度!这得有多少爱液和汗水才能累积成这样！"§!\n\n§Y(日志结束)§!
  gts_leader_bruh.0023.desc: "The Dreadnought Shipgirl had just finished a two-week patrol mission, her clothing long since soaked in sweat. A fleet cautiously approached the resting shipgirl. She was currently floating near the starbase, her legs slightly apart, letting the sun pass over her sweat-soaked crotch. Those blue and white striped panties had completely changed color: the once bright blue had turned into a dull grayish-blue, while the white parts showed uneven yellowish-brown stains. \\\\n\\\\n§Y\\\"Shipgirl-san, we need to... er... collect your... that...\\\"§! \\\\n\\\\nbleated the fleet commander over the communicator. The shipgirl opened her eyes, looking at those tiny ships floating beneath her crotch like gnats, her face showing a puzzled expression. \\\\n\\\\n§R\\\"Collect what?\\\"§! \\\\n\\\\n§Y\\\"Your... underwear...\\\"§! \\\\n\\\\nThe commander braced himself and spoke, his voice as small as a mosquito's. \\\\n\\\\n§R\\\"Ah?!\\\"§! \\\\n\\\\nThe shipgirl's face instantly turned bright red. \\\\n\\\\n§Y\\\"You want my panties? This... this is too embarrassing! Besides, I've been wearing them for two weeks, they must be smelly...\\\"§! \\\\n\\\\n§M\\\"That's exactly why we need them!\\\"§! \\\\n\\\\nGeneral Goose's voice suddenly cut into the communication. \\\\n\\\\n§M\\\"I need your most original, authentic panties! The sweat, love fluid, urine stains, and crotch residue on them are all precious research materials! Please, this concerns the future of the Empire!\\\"§! \\\\n\\\\nThe shipgirl hesitated for a long time before finally sighing. \\\\n\\\\n§R\\\"Fine... but you must promise you won't use them for weird things...\\\"§! \\\\n\\\\nShe hooked her finger into the edge of the panties and slowly pulled them down. The sound of the soaked fabric separating from the skin was a sticky 'schlorp', and the fabric at the crotch was stiff from dried love fluid. When the panties were completely removed, an intense scent instantly diffused. As the panties were placed in the cargo bay, the crew could smell that complex mixture of sweat, urine, and fishy odors even through sealed cabins. Several people fainted on the spot, while the rest endured the nausea, using robotic arms to carefully store the massive panties in a specially made sealed container. \\\\n\\\\n§Y\\\"Sample collection complete... Heavens... I hope I never have to smell that again in my life...\\\"§! \\\\n\\\\nsaid the commander weakly. Back at the base, General Goose had already impatiently opened the sealed container. The intense odor surged out like a solid entity, instantly flooding the entire base. But General Goose didn't care at all, excitedly pouncing on the plain-sized panties and beginning to inspect every stain. \\\\n\\\\n§M\\\"Perfect! Perfect! These yellow stains at the crotch are a work of art!\\\"\\\\n\\\"Look at this concentration! This viscosity! Just how much love fluid and sweat must have accumulated to become like this!\\\"§! \\\\n\\\\n§Y(Log ends)§!"
#  §Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§!的大使带着一队精心挑选的小人来到了您的宫殿。这些小人被训练得彬彬有礼，穿着华丽的服饰，眼神中混杂着恐惧与一丝被选中的荣耀。根据我们签订的"宠物条款"，这是它们应尽的义务。大使恭敬地呈上名单，并向您解释道，这些是本届最"优质"的宠物候选者，他们经过健康筛选和严苛训练，旨在为您提供最好的服务。现在，是时候决定如何「使用」这批活体贡品了。
  gts_event_bruh.0010.desc: "The ambassador of §Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§! has arrived at your palace with a team of carefully selected little people. These tiny people have been trained to be polite and are dressed in magnificent attire, their eyes a mix of fear and a hint of the honor of being chosen. According to the 'Pet Clause' we signed, this is their duty. The ambassador respectfully presented the list and explained to you that these are this session's most 'high-quality' pet candidates, having undergone health screenings and rigorous training to provide you with the best service. Now, it is time to decide how to 'use' this batch of living tributes."
#  根据本公司与微观客户签署的§Y《天体级生物安全保障协定》§!，每隔十年，公司将启动资产回收程序进行保费结算。监於双方在体型与经济体系上的维度差异，常规货币已失去流通意义，因此协议规定以该文明的「生物人口」作为唯一认可的等价交换物。董事会可需根据当前的库存需求与外交战略，调整本周期的保费徵收费率。此项决策将直接决定流入公司加工厂与宠物市场的货源数量，同时也会对客户文明的社会结构造成不同程度的物理性削减，进而影响其对公司的外交态度。\n\n§Y(只会向人口超过5000的星球收费)§!
  policy_gts_bruh_insurance_rate_desc: "According to the §Y'Celestial-level Bio-Security Guarantee Agreement'§! signed between this Company and our micro-clients, every ten years, the Company will initiate asset recovery procedures for insurance premium settlement. Given the dimensional differences between the two parties in terms of size and economic systems, conventional currency has lost its significance for circulation; therefore, the agreement stipulates 'biological population' as the only recognized equivalent for exchange. The board of directors may adjust this cycle's premium collection rate based on current inventory needs and diplomatic strategies. This decision will directly determine the volume of 'goods' flowing into our processing plants and pet markets, while also causing varying degrees of physical reduction to the client civilizations' social structure, thereby affecting their diplomatic attitude toward the Company. \\n\\n§Y(Only charges planets with a population over 5000)§!"
