  # §Y奴隶徵收§!
  gts_event_bruh.0040.name: "§YSlave Requisition§!"
  # 根据我们与§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!签订的附庸条约中的『人口取用』条款，帝国商务部例行公事地签发了一份徵用令，要求该附庸国提供一批小人劳动力。货物，或者说小人，已经准时送达指定的集散中心。他们被分类装在透明的强化玻璃箱内，每个箱子容纳了数以万计的小人。他们中的大多数面露恐惧，紧紧靠在一起，仰望着对他们而言如同苍穹般巨大的仓库顶棚和前来验收的帝国官员。有些箱子里的『货物』似乎因为运送途中的颠簸而出现了损耗，箱底沾染着不易察觉的暗红色污渍。一份电子清单已经上传至您的终端，列出了这批『货物』的数量、性别和大致健康状况。现在，需要您对这批资源的最终用途进行批示。
  gts_event_bruh.0040.desc: "According to the 'Population Acquisition' clause in our vassal treaty with §Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!, the Imperial Commerce Department has routinely issued a requisition order for a batch of tiny laborers. The cargo - or rather, the tinies - has arrived on time at the designated distribution center. They are sorted into transparent tempered glass boxes, each holding tens of thousands. Most of them show fear, huddling together, looking up at the warehouse ceiling that is as vast as the sky to them, and at the Imperial officials conducting the inspection. In some boxes, the 'cargo' seems to have suffered losses due to the bumps during transport, with the bottom of the boxes stained with subtle dark red marks. An electronic list has been uploaded to your terminal, detailing the quantity, gender, and general health of this batch. Now, instructions for the final use of these resources are required."
  # 筛选一下，健壮的送去劳动，孱弱的送去娱乐中心
  gts_event_bruh.0040.a: "Screen them: send the strong to labor, and the weak to entertainment centers."
  # 将部分小人用于高强度的劳动消耗，另一部分则作为巨娘的玩物
  gts_event_bruh.0040.a.custom_tooltip: "Use some tinies for high-intensity labor consumption, and others as toys for giantesses."
  # 赏赐给有功的将领和官员
  gts_event_bruh.0040.b: "Reward meritorious generals and officials"
  # 将这些小人作为奖赏分发给她们，无论是用作私人奴仆、脚底按摩还是别的什么"用途"都能极大地鼓舞士气
  gts_event_bruh.0040.b.custom_tooltip: "Distribute these tinies as rewards; whether used as private servants, for foot massages, or other 'purposes', it will greatly boost morale."
  # §Y奴隶徵收§!
  gts_event_bruh.0050.name: "§YSlave Requisition§!"
  # 一份来自巨人国度的指令抵达了§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!。根据那份我们无法拒绝的条约，宗主国§Y[from.GetName]§!要求我们立即提供人口，作为『特殊劳务输出』。运输船队已经停靠在近地轨道，巨大的阴影投射在城市上空，如同末日降临。国内的新闻媒体被强制噤声，但恐慌仍透过口耳相传蔓延开来。人们躲在家中，祈祷厄运不会降临在自己头上。军队在街上巡逻，强制徵召适龄人口，哭喊声和呵斥声在街上回荡。我们深知这些同胞一旦被送走，将面临的命运绝非简单的『劳务』。我们必须立刻决定如何面对这道冰冷的命令。
  gts_event_bruh.0050.desc: "An order from the giantess kingdom has reached §Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!. According to the treaty we cannot refuse, the overlord §Y[from.GetName]§! demands immediate population provision as 'special labor export'. The transport fleet has docked in low-orbit, its giant shadow cast over the city like an apocalypse. The domestic news media has been forcibly silenced, but panic still spreads through word of mouth. People hide in their homes, praying misfortune doesn't fall on them. The military patrols the streets, forcibly conscripting eligible population; cries and shouts echo through the streets. We know all too well that once these compatriots are sent away, the fate they face is by no means simple 'labor'. We must immediately decide how to face this cold order."
  # 履行条款
  gts_event_bruh.0050.a: "Fulfill Terms"
  # 反抗即是毁灭。为了种族的存续，我们必须忍受这份屈辱。至少...这能换来短暂的和平\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]5%的人口§!
  gts_event_bruh.0050.a.custom_tooltip: "Resistance is destruction. For the survival of our race, we must endure this humiliation. At least... it will buy us a brief peace.\n§YHand over 5% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!"
  # 谄媚讨好
  gts_event_bruh.0050.b: "Fawning and Flattery"
  # 既然无法反抗，那就竭力讨好。不仅如数上交，还要额外献上我们『最优秀』、『最自愿』的同胞，并附上谄媚的颂词。或许极致的顺从能换来一丝怜悯，甚至是一点残羹冷炙般的赏赐\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!
  gts_event_bruh.0050.b.custom_tooltip: "Since we cannot resist, we must strive to please. Not only will we fulfill the quota, but we will also offer our 'finest' and 'most voluntary' compatriots, accompanied by fawning praise. Perhaps extreme obedience will buy a shred of mercy, or even some meager scraps as a reward.\n§YHand over 10% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!"
  # §Y消耗品徵收§!
  gts_event_bruh.0070.name: "§YConsumables Requisition§!"
  # 根据我们与§Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!签订的消耗品条款，新一批的"资源"已经准备就绪，正等待您的指示进行输送。一批数量可观的小人正被集中看管在他们的星球上，对我们而言，那不过是脚边的一个小笼子。是时候决定如何最大限度地利用这些渺小的生命，来满足帝国公民的需求与欲望了。
  gts_event_bruh.0070.desc: "According to the consumables clause signed with §Y[event_target:gts_bruh_get_subject_pop_usage_2_country.GetName]§!, a new batch of \"resources\" is ready and awaiting your instructions for transport. A significant number of tinies are being held under concentrated custody on their planet - to us, that is merely a small cage by our feet. It is time to decide how to maximize the use of these tiny lives to satisfy the needs and desires of Imperial citizens."
  # 分配至巨娘红灯区
  gts_event_bruh.0070.a: "Distribute to Giantess Red-Light District"
  # 将这些小人分送到帝国的娱乐设施。用于满足巨娘的性慾需求，在巨大的手指、舌尖或性器下体验极致的渺小感与绝望感，直至被碾碎，为帝国的娱乐产业贡献其微不足道的价值
  gts_event_bruh.0070.a.custom_tooltip: "Distribute these tinies to the Empire's entertainment facilities. Used to satisfy giantesses' sexual desires, they will experience extreme insignificance and despair under giant fingers, tongues, or genitals until they are crushed, contributing their negligible value to the Empire's entertainment industry."
  # 输送至食品加工链
  gts_event_bruh.0070.b: "Transport to Food Processing Chain"
  # 将这些小人归类为食品资源。它们将被批次处理，成为巨娘餐桌上的活点心、调味品或零食，在巨大的口腔和胃袋中结束其微不足道的存在
  gts_event_bruh.0070.b.custom_tooltip: "Classify these tinies as food resources. They will be processed in batches to become live desserts, condiments, or snacks on giantesses' tables, ending their insignificant existence within massive mouths and stomachs."
  # §Y消耗品徵收§!
  gts_event_bruh.0080.name: "§YConsumables Requisition§!"
  # 巨型通告画面照亮了整个首都的天空，冰冷的机械女声宣读着来自巨娘母星的指令。§Y[from.GetName]§!的指令如同其体型一般沉重且无可抗拒。根据那份将我们定义为『消耗品』的屈辱条款，新一批的徵收令已经送达。我们必须立即上缴又一批我们的同胞，他们将永远离开我们的城市，也就是那些在巨娘眼中不过是鞋印缝隙里沙砾般的聚集点。政府的抽签系统已经开始残酷地运转，无数家庭在恐惧中等待着结果。街上弥漫着绝望的气氛，所有人都清楚被选中的命运意味着什么。身为附庸国的领导人，您需要对此作出回应，以稳定(或利用)这沸腾的民意。
  gts_event_bruh.0080.desc: "Giant notification screens light up the capital's sky as a cold mechanical female voice reads out orders from the giantess homeworld. §Y[from.GetName]§!'s orders are as heavy and irresistible as their size. According to the humiliating clause defining us as 'consumables', a new requisition order has arrived. We must immediately hand over another batch of our compatriots; they will leave our cities forever - cities that are nothing more than congregations like sand in the cracks of shoe prints to the giantesses. The government's lottery system has begun its cruel operation, with countless families waiting for the results in terror. The atmosphere in the streets is filled with despair, and everyone knows exactly what selected fate means. As the leader of a vassal state, you must respond to stabilize (or exploit) this boiling public sentiment."
  # 履行条款
  gts_event_bruh.0080.a: "Fulfill Terms"
  # 尽管心如刀割，但反抗意味着整个文明可能被一只巨足轻易抹去。出动治安部队镇压任何形式的反抗，确保『货物』能准时、足量地送达。并向它们保证，它们的牺牲将被铭记(尽管无人会记得)\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]10%的人口§!
  gts_event_bruh.0080.a.custom_tooltip: "Though it's heartbreaking, resistance means the entire civilization could be easily wiped out by a single giant foot. Deploy security forces to suppress any form of resistance, ensuring the 'cargo' is delivered on time and in full. Assure them their sacrifice will be remembered (though none will remember).\n§YHand over 10% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!"
  # 谄媚讨好
  gts_event_bruh.0080.b: "Fawning and Flattery"
  # 既然无法反抗，不如极尽谄媚之能事。我们不仅足额上交，还额外交出双倍的资源，并请求巨娘在享用贡品时，偶尔能想起我们的忠诚，以期换取未来配额可能的减少或微不足道的赏赐\n§Y交出[event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]25%的人口§!\n§Y下次徵收改为30年後§!
  gts_event_bruh.0080.b.custom_tooltip: "Since we cannot resist, it is better to exert every effort to flatter. We will not only meet the quota but also offer double the resources in addition, requesting that the giantesses occasionally remember our loyalty when enjoying the tribute, in hopes of potential future quota reductions or meager rewards.\n§YHand over 25% of the population of [event_target:gts_bruh_get_subject_pop_usage_1_planet.GetName]§!\n§YNext requisition changed to 30 years later§!"
  # 密室会议
  gts_event_bruh.1200.name: "Closed-Door Meeting"
  # 会议室内的灯光显得格外昏暗,厚重的金属门已经紧紧关闭,外面的警卫也被遣散到走廊尽头.\n椭圆形的会议桌旁坐着帝国最有权势的几个人,§H[ruler.GetRegnalName][Root.GetRulerTitle]§!、星区总督、首相,还有几位平时连面都很难见到的政府高层.\n每个人的脸上都写满了不安和困惑.\n桌子的一端,一个看起来普通的 maiden投影静静地坐在那里.\n她看起来十分年轻,穿着简单的白色连衣裙,双手安静地叠放在膝盖上.\n如果不知道真相,任何人都会以为这只是一个无害的孩子.\n但在座的每个人都清楚,眼前这个投影背後的真实存在正漂浮在星球轨道外的太空中,她的真正体型足以用手指握住整颗星球.\n§Y"各位,感谢大家抽出宝贵时间参加这次...特殊会议."§!首相清了清嗓子,声音有些颤抖.\n他手中的文件夹边缘已经被汗水浸湿.\n§Y"今天讨论的议题是关于...关于星球改造授权法案."§! maiden投影轻松地靠在椅背上,双腿轻轻晃动着,就像个在课堂上感到无聊的学生.\n§M"其实这件事没什么大不了的啦."§!她的声音甜美而漫不经心.\n§M"你们想想看,我帮你们改造那些星球,其实对大家都有好处呢."§!她数着手指,语气就像在讨论明天的天气.\n§M"比如说,那些产出不高的农业星球,我可以把它们变成超级肥沃的土地."\n"还有那些矿产枯竭的星球,经过我的...处理...之後,保证会有源源不断的新资源."\n§!§M"而且啊."§!她歪了歪头,笑得很天真.\n§M"人口过剩的问题也能一并解决掉,多省心呢!"§!星区总督的脸色变得苍白如纸,双手紧握成拳.\n§R"省心?你知道你在说什么吗?"§!他猛地站起身来,椅子发出刺耳的摩擦声.\n§R"我看过那些报告!我亲眼见过那些被你"改造"过的星球!"§!他的声音变得颤抖而愤怒.\n§R"原本的蓝色海洋变成了恶心的爱液!大气层充满了令人窒息的气味!山脉被夷为平地,取而代之的是巨大的...的..."§!\n他停顿了一下,努力控制着自己的情绪.§R"那根本不是什么改造!那是彻底的毁灭!"§!\n maiden投影眨了眨眼睛,表情依然轻松,§M"哎呀,星区总督先生说话真夸张呢.那些星球现在过得很好啊,产出比以前高多了."\n§!她用手支着下巴,§M"而且居民们也很适应新环境的.那些还活着的人都说很幸福呢."§!\n§R"还活着的人?"§!星区总督的声音近乎嘶吼.\n§R"你知道有多少人在那些"改造"中死去吗?数十亿的生命!他们被你当作玩具一样随意处置!"§!他转向其他人,眼中满含绝望.\n§R"你们都看到过那些影像资料!整座城市被碾成粉末,文明的痕迹在几个小时内就彻底消失!那些幸存者被迫生活在...在那种环境下,根本不是人该有的生活!"§!\n会议室内陷入了死一般的沉寂.所有人都低着头,没有人敢接话,没有人敢与星区总督的目光对视.\n他们都知道星区总督说的是事实,但同时也都明白反对的後果.\n maiden投影似乎完全没有被星区总督的话影响,她还是那副轻松的样子.\n§M"星区总督先生也很容易激动呢.不过话说回来..."§!\n她用一种讨论购物清单的语气说道,§M"我这次想要改造的那几颗星球,确实很有潜力."\n"想想看,经过我的处理之後,你们就能获得那么多新资源,还能解决掉一些...不太听话的总督问题."\n"一举两得呢!"§!\n§H[ruler.GetRegnalName][Root.GetRulerTitle]§!缓缓抬起头,声音沙哑.\n§H"§M[event_target:gts_bruh_ap_gts_planet_event_leader.GetName]§!,我必须说,这个决定会违背我们帝国的基本原则..."§!\n§M"原则?"§! maiden投影歪着头,天真地问道,§M"什么原则比实际利益更重要呢?而且啊..."§!\n她的语气变得更加随意,§M"不管你们同不同意,我都会去做的."\n"通过法律程序的话,大家面子上都好看一些嘛."§!她站起身来,双手背在身後,就像个在花园里散步的 maiden.\n§M"如果没有这个授权书,我就只能...怎么说呢,比较直接地行动了."\n"到时候可就没有什么法律保护了呢."§!\n星区总督绝望地看向其他人,但每个人都避开了他的目光.\n首相、政府高层们都紧盯着桌面,§H[ruler.GetRegnalName][Root.GetRulerTitle]§!则闭上了眼睛,似乎在进行某种内心的挣扎.\n§R"你们就这样看着吗?"§!星区总督的声音变得哽咽,§R"就这样眼睁睁地看着无数生命被当作消遣品?"§!没有人回答他.\n maiden投影轻快地拍了拍手,§M"那么,既然大家都没有异议,我们就开始签字吧!§H[ruler.GetRegnalName][Root.GetRulerTitle]§!,您的签名就代表整个帝国的意志呢."\n"多么重要的历史时刻啊!"§!\n首相颤抖着打开文件夹,取出那份授权书.纸张在他手中微微颤动.\n一个接一个,在座的每个人都在授权书上签下了自己的名字.\n每一笔都沉重如山.\n星区总督最後一个签字,他的手颤抖得几乎握不住笔.\n当最後一个签名完成时, maiden投影开心地转了个圈,§M"太棒了!那么我就先去准备啦!"\n"[ruler.GetRegnalName][Root.GetRulerTitle],我会很快联系您讨论具体时间的."§!\n投影开始变淡,她挥了挥手,§M"再见啦,各位!希望很快就能看到成果呢!"§!\n投影消失,会议室内只剩下压抑的喘息声.
  gts_event_bruh.1200.desc: "The lights in the conference room were dim, the heavy metal doors firmly shut, and the exterior guards dismissed to the far end of the corridor.\nAround the oval conference table sat the empire's most powerful figures: §H[ruler.GetRegnalName][Root.GetRulerTitle]§!, the Sector Governor, the Prime Minister, and several senior officials rarely seen in public.\nUnease and confusion were etched upon every face.\nAt one end of the table, the projection of an ordinary-looking young girl sat quietly.\nShe looked very young, dressed in a simple white dress, hands folded neatly in her lap.\nAnyone unaware of the truth would assume she was merely a harmless child.\nYet everyone present knew full well that the true entity behind this projection was floating out in space beyond the planet's orbit, her actual size large enough to cup the entire world in her palm.\n§Y\"Everyone, thank you for taking the time to attend this... special meeting.\"§! The Prime Minister cleared his throat, his voice trembling slightly.\nThe edges of the folder in his hands were already soaked with sweat.\n§Y\"Today's topic of discussion concerns... concerns the Planetary Modification Authorization Act.\"§! The girl's projection leaned back casually against her chair, swinging her legs lightly like a student bored in class.\n§M\"It's really no big deal, honestly.\"§! Her voice was sweet and nonchalant.\n§M\"Think about it. Me modifying those planets for you is actually beneficial for everyone.\"§! She counted on her fingers, tone as casual as discussing tomorrow's weather.\n§M\"For example, those low-yield agricultural planets - I could turn them into super-fertile lands.\nAnd those planets with depleted mineral reserves, after my... processing... I guarantee there will be an endless supply of fresh resources.\"\n§!§M\"Besides,\"§! She tilted her head, smiling with utter innocence.\n§M\"The overpopulation problem gets solved all at once too. So convenient!\"§! The Sector Governor's face turned as pale as paper, his hands balling into tight fists.\n§R\"Convenient? Do you even know what you're saying?\"§! He bolted upright, his chair screeching against the floor.\n§R\"I've read those reports! I've seen the planets you've \\\"modified\\\" with my own eyes!\"§! His voice shook with fury.\n§R\"The pristine blue oceans turned into sickening love fluid! The atmosphere choked with suffocating stench! Mountains flattened to the ground, replaced by enormous... of...\"§!\nHe paused, struggling to master his emotions. §R\"That isn't modification at all! That is utter annihilation!\"§!\nThe girl's projection blinked, her expression remaining carefree. §M\"Oh my, Governor, you exaggerate so much. Those planets are doing wonderful right now; their output is way higher than before.\"\n§! She rested her chin in her hands. §M\"And the residents have adapted to their new environment nicely. The ones still alive all say they're very happy.\"§!\n§R\"The ones still alive?\"§! The Sector Governor's voice was practically a shriek.\n§R\"Do you know how many died during those \\\"modifications\\\"? Billions of lives! You disposed of them at your whim like mere playthings!\"§! He turned to the others, his eyes filled with despair.\n§R\"You've all seen the footage! Entire cities ground to dust, traces of civilization wiped out in hours! Those survivors forced to live in... under those conditions, that's no life fit for anyone!\"§!\nA deathly hush fell over the room. Everyone kept their heads down; no one dared respond, nor meet the Sector Governor's gaze.\nThey knew he spoke the truth, but they also understood the consequences of defiance.\nThe girl's projection seemed entirely unfazed by the Governor's words, her relaxed demeanour unchanged.\n§M\"You really get worked up easily, Governor. But having said that...\"§!\nShe continued in the tone of someone reviewing a grocery list: §M\"Those planets I want to modify this time have tremendous potential.\nJust think, after my treatment, you'll gain all those new resources, and you can also take care of a few... unruly governors.\nTwo birds with one stone!\"§!\n§H[ruler.GetRegnalName][Root.GetRulerTitle]§! slowly looked up, voice raspy.\n§H\"§M[event_target:gts_bruh_ap_gts_planet_event_leader.GetName]§!, I must say, this decision contradicts our empire's fundamental principles...\"§!\n§M\"Principles?\"§! The girl tilted her head, asking innocently, §M\"What principle matters more than real benefits? And besides...\"§!\nHer tone grew even more casual: §M\"Whether you agree or not, I'm going to do it anyway.\nGoing through legal procedures just makes everyone look a little better.\"§! She stood up, clasping her hands behind her back, strolling like a young girl in a garden.\n§M\"Without this authorization, I'd have to... how should I put it, act a bit more directly.\nThere won't be any legal protection then, will there?\"§!\nThe Sector Governor looked desperately around, but everyone avoided his gaze.\nThe Prime Minister and senior officials stared fixedly at the tabletop, while §H[ruler.GetRegnalName][Root.GetRulerTitle]§! closed their eyes, seemingly caught in an internal struggle.\n§R\"Are you all just going to watch?\"§! The Governor's voice choked. §R\"Just stand by and watch countless lives be treated as playthings?\"§! No one answered.\nThe girl's projection clapped her hands cheerfully. §M\"Well, since nobody has any objections, let's start signing! §H[ruler.GetRegnalName][Root.GetRulerTitle]§!, your signature represents the will of the entire empire.\nWhat a historic moment!\"§!\nTrembling, the Prime Minister opened his folder and took out the authorization document. The paper quivered in his hands.\nOne by one, everyone present signed their names.\nEvery stroke felt as heavy as a mountain.\nThe Sector Governor was the last to sign, his hand shaking so violently he could barely hold the pen.\nAs the final signature was finished, the girl's projection twirled with delight. §M\"Wonderful! I'll go get things ready then!\n[ruler.GetRegnalName][Root.GetRulerTitle], I'll contact you soon to discuss the specific timing.\"§!\nThe projection began to fade. She waved. §M\"Goodbye, everyone! Hope to see the results very soon!\"§!\nThe projection vanished, leaving only stifled gasps echoing in the conference room."
