  # 在支付了款项後，地图上显示了一个星系，附近一个未连接到任何超空间通道，名为§Y[event_target:gts_bruh_random_spawn_system_1.GetName]§!的脉冲星被标记了出来。\n\n§S查询情报日志§!以追踪位置
  gts_leader_bruh.0003.desc: "After payment, a system appeared on the map. A pulsar named §Y[event_target:gts_bruh_random_spawn_system_1.GetName]§! that is not connected to any hyperlanes nearby has been marked.\n\n§SCheck Situation Log§! to track location."
  # 确定
  gts_leader_bruh.0003.a: "Confirmed"
  # 在支付了款项後，地图上显示了一个星系，附近一个未连接到任何超空间通道，名为§Y[event_target:gts_bruh_random_spawn_system_2.GetName]§!的脉冲星被标记了出来。\n\n查询§S情报日志§!以追踪位置
  gts_leader_bruh.0004.desc: "After payment, a system appeared on the map. A pulsar named §Y[event_target:gts_bruh_random_spawn_system_2.GetName]§! that is not connected to any hyperlanes nearby has been marked.\n\nCheck §SSituation Log§! to track location."
  # 在支付了款项後，地图上显示了一个星系，附近一个未连接到任何超空间通道，名为§Y[event_target:gts_bruh_random_spawn_system_3.GetName]§!的脉冲星被标记了出来。\n\n查询§S情报日志§!以追踪位置
  gts_leader_bruh.0005.desc: "After payment, a system appeared on the map. A pulsar named §Y[event_target:gts_bruh_random_spawn_system_3.GetName]§! that is not connected to any hyperlanes nearby has been marked.\n\nCheck §SSituation Log§! to track location."
  # 击败驱逐舰娘
  gts_leader_bruh.0006.name: "Defeat Destroyer Shipgirl"
  # 战斗结束了。那位曾在星海中灵活穿梭的驱逐舰娘终于倒在了我们舰队的集火之下。她那娇小(相对而言)的身躯上布满了灼烧的痕迹，破损的舾装还在不断漏出冷却液，毫无生气地漂浮在太空中，我们的工程师迫不及待地登上了她的残骸。在那已经失去光泽的舾装中，我们找到了大量技术资料，关于如何在巨大的身躯上维持惊人的机动性，如何用动能武器发挥出毁灭性的威力，以及那些绑在她大腿上的鱼雷发射管的设计蓝图。\n\n§G解锁随机一种§MBruh驱逐舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!
  gts_leader_bruh.0006.desc: "The battle is over. The Destroyer shipgirl, who once maneuvered nimbly through the sea of stars, has finally fallen under the concentrated fire of our fleet. Her petite (relatively speaking) body is covered in scorch marks, and her damaged rigging is constantly leaking coolant as she drifts lifelessly in space. Our engineers rushed to board her wreckage. Within that now-lustreless rigging, we found a wealth of technical data: how to maintain incredible maneuverability on a massive body, how to unleash devastating power with kinetic weapons, and the design blueprints for the torpedo tubes strapped to her thighs.\n\n§GUnlocked a random §MBruh Destroyer Shipgirl§! blueprint!§!\n\n§YComponents must be researched before they appear in the designer!§!"
  # 确定
  gts_leader_bruh.0006.a: "Confirmed"
  # 击败战列舰娘
  gts_leader_bruh.0007.name: "Defeat Battleship Shipgirl"
  # 这是一场艰苦的战斗。那位战列舰娘直到最後一刻还在开火，她肩上的主炮在熄灭前轰出了最後一发炮弹，将我们三艘主力舰送进了历史。但最终她还是倒下了。在她那已经冷却的身躯中，我们还找到了一本笔记。里面记录着她对每一场战斗的感想，对每一次开火的校正数据，以及...对家乡的思念。原来她也曾是某个文明培养出的守护者。\n\n§G解锁随机一种§MBruh战列舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!
  gts_leader_bruh.0007.desc: "This was a grueling battle. The Battleship shipgirl was still firing until the very last moment; before going dark, her shoulder-mounted main battery unleashed one final shell, sending three of our capital ships into history. But ultimately, she fell. Within her cooled body, we also found a notebook. It recorded her reflections on every battle, calibration data for every shot, and... a longing for home. It turns out she too was once a guardian cultivated by some civilization.\n\n§GUnlocked a random §MBruh Battleship Shipgirl§! blueprint!§!\n\n§YComponents must be researched before they appear in the designer!§!"
  # 击败无畏舰娘
  gts_leader_bruh.0008.name: "Defeat Dreadnought Shipgirl"
  # 我们做到了。付出了惨痛的代价後，我们击败了那位曾让整个星区为之颤抖的无畏舰娘。当她那比恒星还要巨大的身躯终于停止挣扎时，整个战场陷入了诡异的寂静。没有人敢第一个靠近她。那些曾经吞噬过星球的唇瓣，那双能够徒手捏碎战舰的玉手，那柄削铁如泥的斩舰刀...即使在死亡面前，她依然散发着令人窒息的威压。花了整整一个月，我们才完成对她屍体的初步勘探。我们发现了她的记忆数据。原来在变成这样的存在之前，她也曾是个普通的 maiden，是某种我们无法理解的技术将她改造成了这样的「武器」。在记忆的最後，一个想法闪过了她的脑海中。"我已经记不清自己的名字了，但我还记得...我曾经也想要被温柔对待......"\n§V(研究团队陷入了长久的沉默)§!\n\n§G解锁随机一种§MBruh无畏舰娘§!图纸§!\n\n§Y需要研发配件才会显示在设计器里§!
  gts_leader_bruh.0008.desc: "We did it. After paying a tragic price, we defeated the Dreadnought Shipgirl who once made the entire sector tremble. When her body - larger than a star - finally stopped struggling, the entire battlefield fell into an eerie silence. No one dared to be the first to approach her. Those lips that once swallowed planets, those jade hands capable of crushing warships with bare strength, that ship-slaying blade that cut metal like butter... even in death, she still radiated an overwhelming pressure. It took an entire month to complete the preliminary exploration of her remains. We discovered her memory data. It turns out that before becoming such an existence, she too was just an ordinary girl; some technology beyond our understanding had transformed her into this 'weapon'. At the very end of her memories, a thought flashed through her mind: \"I can no longer remember my name, but I remember... I once wanted to be treated with tenderness...\" \n§V(The research team fell into a long silence)§! \n\n§GUnlocked a random §MBruh Dreadnought Shipgirl§! blueprint§! \n\n§YRequires researching components to appear in the designer§!"
