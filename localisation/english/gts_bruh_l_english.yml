  # Original: 这些由扶她巨娘精液孕育而生的庞然巨物，体长可达200公里以上，形似放大亿万倍的蝌蚪状精子，通体覆盖着粘稠的乳白色精浆。它们依靠尾部鞭毛剧烈的摆动在陆地或海洋中蠕动前行，并可通过荷尔蒙诱导剂控制行动，无差别碾压路径上所有建筑与单位，用沉重的躯体碾碎城市、压垮军队。离开精液环境后，48-72小时后会因能量耗尽而死亡，化作一座散发腥臭的胶状山脉。
  gts_bruh_sperm_army_desc: "These colossal objects bred from Futa Giantess semen have a body length of over 200 kilometers, shaped like tadpole-like sperm magnified hundreds of millions of times, and are covered in viscous milky white seminal plasma. They crawl on land or in the ocean by violently swinging their tail flagella, and their actions can be controlled by hormone inducers. They indiscriminately crush all buildings and units on their path, crushing cities and overwhelming armies with their heavy bodies. After leaving the semen environment, they will die due to energy exhaustion after 48-72 hours, turning into a gelatinous mountain emitting a fishy smell."
  # Original: 白洞
  sc_gts_bruh_white_hole: "White Hole"
  # Original: 据说如果能穿过白洞就能到达§R巨娘居住的世界§!，但直到现在似乎也没有人能做到完整地进入白洞。因为§Y$NAME_gts_eyjafjalla$§!瞬间注入的巨量乳汁，使得白洞的质量大增，发出的引力波比一般黑洞还强，更加干扰超光速引擎的工作，使战舰难以紧急脱离战斗。
  sc_gts_bruh_white_hole_desc: "It is said that if one can pass through the white hole, one can reach the §Rworld where Giantesses live§!, but until now, no one seems to have been able to enter the white hole completely. Because §Y$NAME_gts_eyjafjalla$§! instantly injected a massive amount of milk, the mass of the white hole increased greatly, and the gravitational waves emitted are stronger than ordinary black holes, which interferes more with the work of the FTL drive, making it difficult for warships to escape the battle urgently."
