  # 巨娘星球适应
  tech_gts_bruh_gts_planet_adaption: "Giantess Planet Adaptation"
  # 进一步研究其他行星上发现的危险环境有助于纾解殖民者在其他星球的日常生活中遇到的困难
  tech_gts_bruh_gts_planet_adaption_desc: "Further research into dangerous environments found on other planets helps to alleviate difficulties encountered by colonists in daily life on other planets"
  # 小人捕捉
  tech_gts_micro_1: "Tiny Person Capture"
  # 在广袤的星海中，分布着许多体型极其微小的生命，这些渺小的生物具有极高的经济价值。过去我们只能靠着运气在野外寻找并抓捕这些微小生物，并且过程中往往造成大量伤亡。如今透过改进搜寻工具、捕捉装备和运输容器，我们能更有效率地在各种异星环境中搜寻这些小小的智慧生命，并安全地将他们活捉回来，作为巨娘们平日里解闷、玩弄或收藏的玩物。
  tech_gts_micro_1_desc: "Across the vast sea of stars, there exist many forms of life of extraordinarily minuscule stature; these tiny creatures hold immense economic value. In the past, we could only rely on luck to locate and capture these micro-creatures in the wild, a process that frequently resulted in heavy casualties. Now, by improving search tools, capture gear, and transport containers, we can much more efficiently scour diverse alien environments for these tiny intelligent beings and safely capture them alive, serving as playthings for giantesses to relieve boredom, toy with, or collect in their daily lives."
  # 小人培养
  tech_gts_micro_2: "Tiny Person Cultivation"
  # 单靠野外抓捕小人不仅效率低下，而且数量远远无法满足庞大的市场需求。透过建立专门的生态培育室，我们能够为小人们提供最适宜的生存与繁衍环境。只要给予适量的食物与水，这些小生命就会快速繁殖。我们甚至可以控制生长速度、体型大小，甚至是性格倾向。这些培养出来的小人比野生捕获的个体更加温顺，也更适合各种用途。这样一来，我们就能源源不绝地获得大量性格温顺的小人，稳定供应给帝国各地的巨娘选购。
  tech_gts_micro_2_desc: "Relying solely on capturing tiny people in the wild is not only inefficient, but the yield falls far short of satisfying enormous market demand. By establishing specialized ecological breeding chambers, we can provide tinies with the most optimal environment for survival and reproduction. Given moderate amounts of food and water, these tiny lives will rapidly multiply. We can even regulate their growth rate, body size, and behavioral dispositions. These cultivated tiny people are far more docile than wild-caught specimens and much better suited for various purposes. In this way, we can secure a steady, endless supply of gentle-tempered tinies for giantesses across the empire to purchase."
  # 小人合成
  tech_gts_micro_3: "Tiny Person Synthesis"
  # 随着生命技术的进步，我们不再需要等待小人自然繁衍。现在可以直接在工厂的流水线上，透过快速养成技术来大规模制造小人。我们可以根据需求订制他们的体型、外貌乃至性格，无论是想要耐踩耐压的按摩等级、口感鲜美的食用等级，还是乖巧听话的宠物等级，都能在短时间内批量生产，彻底满足了巨娘们对玩具的无尽渴望。
  tech_gts_micro_3_desc: "With advances in bio-engineering, we no longer need to wait for tiny people to reproduce naturally. Now, they can be mass-manufactured directly on factory assembly lines using rapid maturation techniques. We can customize their size, appearance, and even personality to order - whether trampling-resistant massage grade, delicious edible grade, or obedient pet grade, all can be batch-produced in a short time, thoroughly satisfying giantesses' insatiable desire for playthings."
  # 缩小城市生产
  tech_gts_micro_city_1: "Shrunken City Production"
  # 光是单独的小人已经无法满足巨娘们了。为了让她们体验踩踏与毁灭的快感，我们开发出了微缩城市的量产技术。这些精致的小型城市里不仅有高楼大厦与街道，还预先搬入了大批的小人居民。当巨娘抬起漂亮的丝足踩下去时，就能亲眼看着无数建筑与小人在脚底化为灰尘，这种极致的蹂躏体验成为了星系中最热销的娱乐商品。
  tech_gts_micro_city_1_desc: "Individual tiny people alone can no longer satisfy giantesses. To let them experience the thrill of trampling and annihilating civilizations, we have developed a comprehensive manufacturing process for shrunken cities. These cities include tiny complexes of buildings, road networks, and even self-sustaining energy grids. When a giantess presses her bare feet onto these delicate miniature metropolises, feeling skyscrapers crumble between her toes and tiny vehicles shatter beneath her soles, it provides unprecedented satisfaction. These disposable or reusable miniature cities are fast becoming the hottest entertainment commodity in giantess social circles."
  # 缩小星球精密制造
  tech_gts_micro_planet_1: "Shrunken Planet Precision Manufacturing"
  # 将整个生态星球微缩化的顶尖工艺。我们可以在只有指头大小的微型星球上，塑造出完整的大陆、海洋以及高达数十亿的微小文明。对于巨娘来说，整颗星球不过是她们随手把玩的玻璃珠。她们可以把它们塞进小穴，或是用舌头将整个星球连同上面的文明一起吞下，享受如同神明般支配一切的至高乐趣。
  tech_gts_micro_planet_1_desc: "The pinnacle of engineering in miniaturizing entire ecological planets. On a tiny celestial body no larger than a fingertip, we can flawlessly replicate a real planet's atmospheric cycles, tectonic plate movements, and complete biosphere. Millions or even billions of micro-creatures thrive upon it, blissfully unaware that their entire world is merely a marble in the palm of a giantess. A giantess can casually toy with it like a glass marble, pop it into her mouth to savor the unique flavor of its atmosphere, or gently pinch it between her fingers to admire the magnificent spectacle of an entire planet being crushed into fine dust. This represents the ultimate culmination of miniaturization technology."
  # 巨娘体液收集
  tech_gts_giantess_fluid_1: "Giantess Bodily Fluid Collection"
  # 在与巨娘文明接触之初，我们就发现她们的体液中蕴含着珍贵的物质。早期的收集者冒着生命危险，乘坐小型飞船降落在巨娘的身体表面，用容器刮取汗水、收集唾液。这是极度危险的工作，巨娘的任何动作都可能导致收集队全灭。但丰厚的回报驱使着冒险者们前仆後继。
  tech_gts_giantess_fluid_1_desc: "Early in our contact with giantess civilizations, we discovered that their bodily fluids contained precious substances. Early collectors risked their lives taking small spacecraft to land on the body surfaces of giantesses, using containers to scrape off sweat and collect saliva. It was an extremely perilous task - a giantess casually glancing back, scratching an itch, or merely rolling over could trigger a catastrophic disaster. Yet the immense returns drove countless daredevils forward, accumulating invaluable first-hand data and primitive samples for us."
  # 巨娘体液工业
  tech_gts_giantess_fluid_2: "Giantess Bodily Fluid Industry"
  # 随着收集技术的成熟和与部分巨娘帝国建立外交关系，我们开始能够进行工业规模的体液收集与处里。专门的处理设施可以将巨娘的汗液、唾液、爱液等体液分离提炼，转化为各种工业原料。尽管处理过程仍然充满危险，某些巨娘体液具有腐蚀性和强烈的生理影响，但产出的价值完全值得这些风险。
  tech_gts_giantess_fluid_2_desc: "With the maturation of harvesting techniques and the establishment of diplomatic relations with certain giantess empires, we began conducting industrial-scale collection and processing of bodily fluids. Specialized processing facilities can separate and refine giantess sweat, saliva, love fluid, and other secretions, converting them into diverse industrial raw materials and high-energy fuels. This technology enables us to reliably acquire high-purity specialized compounds, fundamentally transforming our empire's industrial landscape."
  # 巨娘体液民用
  tech_gts_giantess_fluid_3: "Giantess Bodily Fluid Civilian Application"
  # 经过技术的多次突破与安全过滤，巨娘体液不再只是危险的工业原料，而是成功走进了千家万户的日常生活。稀释、中和、提纯後的体液产品可以安全地进入民用市场，从香水到饮料，从化妆品到营养补充剂，甚至连生活用水都能混入适量的体液来提升幸福感。小人们在浓郁而甜美的女性气息中快乐地生活，巨娘体液已经完全融入了社会的各个角落，成为不可或缺的日常生活用品。
  tech_gts_giantess_fluid_3_desc: "Through numerous technological breakthroughs and safety filtration protocols, giantess bodily fluids are no longer merely hazardous industrial raw materials, but have successfully entered the daily lives of countless households. Diluted, neutralized, and purified fluid products can safely enter the consumer market - from perfumes to beverages, and skincare products to pharmaceuticals. The commercialization of giantess bodily fluids has yielded immense economic benefits while profoundly reshaping the lifestyle of the general populace."
  # 巨娘内衣收集
  tech_gts_giantess_underwear_1: "Giantess Underwear Collection"
  # 巨娘随手脱下并丢弃的巨大鞋袜与内裤，对于小人来说就像是连绵不绝的山脉。这些贴身衣物的纤维间积聚了大量的足垢与爱液，是极具开采价值的天然宝库。它们通常被巨娘随手丢弃在星球表面，使得我们发展出了强大的物流与运输体系，专门前往各个星球回收这些庞大的衣物。将它们运回後进行分类处理，不仅能开采出稀有矿物，还能将其改造为独特的星际建筑与观光景点。
  tech_gts_giantess_underwear_1_desc: "The colossal shoes, socks, and panties casually discarded by giantesses resemble endless mountain ranges to tiny people. Between the fibers of this intimate apparel accumulate vast deposits of foot grime and love fluid, forming natural treasure troves of immense mining value. Typically cast aside onto planetary surfaces by giantesses, their recovery prompted us to develop a powerful logistical and transport network dedicated to retrieving these massive garments across multiple worlds. Once hauled back and sorted, they yield not only rare minerals through extraction, but can also be retrofitted into unique interstellar structures and tourist attractions."
  # 巨娘外交学
  tech_gts_giantess_human_1: "Giantess Diplomacy"
  # 面对体型无比庞大且力量惊人的巨娘文明，硬碰硬只会带来毁灭。透过深入研究巨娘们的心理需求与行为习惯，我们学会了如何与这些强大存在进行有效沟通，甚至说服一些巨娘为我们的帝国效力，她们的加入极大地增强了我们的军事力量和劳动力，当然代价是我们必须满足她们各种特殊的需求。
  tech_gts_giantess_human_1_desc: "When facing giantess civilizations of unfathomable scale and staggering power, head-on confrontation brings only annihilation. By thoroughly studying the psychological desires and behavioral patterns of giantesses, we have learned how to communicate effectively with these mighty beings - even persuading certain giantesses to serve our empire. Their induction has vastly augmented our military might and workforce, provided, of course, that we cater to their various specialized demands."
  # 星河行政策略巨塔
  building_gts_bruh_administrative_tower: "Galactic Administrative Mega-Tower"
  # 这座直入云霄的巨塔是整个帝国的行政核心，承载着层层叠叠的部门。巨娘官僚用她们比山还高的身躯在此处展开繁琐的文书工作，一份文件可能就与一座小人图书馆一样厚重，但对巨娘来说，只是拆阅一页的日常工作
  building_gts_bruh_administrative_tower_desc: "This giant tower reaching into the clouds is the administrative core of the entire empire, carrying layers of departments. Giantess bureaucrats perform cumbersome paperwork here with their bodies taller than mountains. A single document may be as thick as a small person's library, but for a Giantess, it is just the daily work of opening a page"
  # 巨塔官僚
  job_gts_bruh_megaclerk: "Mega-Tower Bureaucrat"
  # $job_gts_bruh_megaclerk$
  job_gts_bruh_megaclerk_plural: "$job_gts_bruh_megaclerk$"
  # 这些巨娘官僚日以继夜地处理帝国的文书与政令。虽然她们的工作重复冗长，但庞大的个体却能在不知疲倦的状态下处理巨量资讯，使帝国政务得以在数万星系间流转无碍\n\n该职位仅限§Y正常§!及以上特质的人口就职，§Y高大§!及以上特质的人口会有更高的就职权重
  job_gts_bruh_megaclerk_desc: "These Giantess bureaucrats handle the empire's documents and decrees day and night. Although their work is repetitive and lengthy, the huge individuals can handle massive amounts of information tirelessly, ensuring that the empire's government affairs can flow unimpeded among tens of thousands of galaxies\n\nThis position is limited to Pops with §YNormal§! and above traits, and Pops with §YTall§! and above traits will have higher employment weight"
  # $job_gts_bruh_megaclerk$是巨娘岗位，消耗§Y$r_energy$§!、§Y$r_consumer_goods$§!产出\n§Y$r_unity$§!
  job_gts_bruh_megaclerk_effect_desc: "$job_gts_bruh_megaclerk$ is a Giantess job, consuming §Y$r_energy$§!, §Y$r_consumer_goods$§! to produce\n§Y$r_unity$§!"
  # $job_gts_bruh_megaclerk$岗位
  mod_job_gts_bruh_megaclerk_add: "$job_gts_bruh_megaclerk$ Job"
  # 爱液热力站
  building_gts_bruh_giantess_fluid_1: "Love Fluid Thermal Power Station"
  # 这座发电站的数十座巨型储存罐装满了从各地运来的巨娘爱液。这些透明而黏稠的液体始终保持着惊人的高温，即使经过长途运输也不会冷却。工程师们设计了特殊的热交换系统，让这些滚烫的体液流经一层层金属管道，将热量传递给循环水系统。产生的大量蒸汽推动着巨大的涡轮机组，为整个星球提供稳定的电力。
  building_gts_bruh_giantess_fluid_1_desc: "The dozens of gargantuan storage tanks in this power station are filled with giantess love fluid shipped from all corners of the cosmos. This clear, viscous liquid continuously maintains an astonishingly high temperature, never cooling even after long-distance transport. Engineers designed specialized heat-exchange systems that channel these scalding bodily fluids through tiers of metal conduits, transferring their thermal energy into a circulating water system. The massive plumes of generated steam drive colossal turbine generators, supplying stable electrical power to the entire planet."
  # 爱液机轮工
  job_gts_bruh_giantess_fluid_worker_1: "Love Fluid Machinist"
  # $job_gts_bruh_giantess_fluid_worker_1$
  job_gts_bruh_giantess_fluid_worker_1_plural: "$job_gts_bruh_giantess_fluid_worker_1$"
  # 爱液机轮工的日常工作就是维护这些热交换系统的正常运作。他们需要定期检查管道是否有堵塞，因为爱液冷却後会变得更加黏稠，容易在管壁上形成结晶。每天都要清理过滤网上积累的杂质，有时还能发现一些奇怪的东西，比如微小衣物纤维。
  job_gts_bruh_giantess_fluid_worker_1_desc: "The daily duty of a Love Fluid Machinist is to maintain the proper operation of these heat-exchange systems. They must routinely inspect conduits for blockages, as love fluid becomes even more viscous when cooled, readily forming crystalline deposits on pipe walls. Every day, they must clear accumulated impurities from the filter meshes, occasionally uncovering bizarre oddities such as tiny fabric fibers."
  # $job_gts_bruh_giantess_fluid_worker_1$岗位
  mod_job_gts_bruh_giantess_fluid_worker_1_add: "$job_gts_bruh_giantess_fluid_worker_1$ Job"
  # $job_gts_bruh_giantess_fluid_worker_1_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_giantess_fluid_worker_1_workforce_mult: "$job_gts_bruh_giantess_fluid_worker_1_plural$$BONUS_WORKFORCE_FOR$"
  # $job_gts_bruh_giantess_fluid_worker_1_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_bruh_giantess_fluid_worker_1_workforce_mult: ""$job_gts_bruh_giantess_fluid_worker_1_plural$$BONUS_WORKFORCE_FOR$""
  # $job_gts_bruh_giantess_fluid_worker_1_plural$（子个体）$BONUS_WORKFORCE_FOR$
  mod_pop_gts_drone_gts_bruh_giantess_fluid_worker_1_workforce_mult: ""$job_gts_bruh_giantess_fluid_worker_1_plural$ (sub-entity) $BONUS_WORKFORCE_FOR$""
  # 足汗打捞场
  building_gts_bruh_giantess_fluid_2: "Foot Sweat Salvage Yard"
  # 这里处理的是从巨娘脚底收集来的足汗和足垢混合物。巨大的分离池里，液体在缓慢搅拌，表面漂浮着各种各样的残骸碎片。有些是被踩扁的战舰残骸，有些是建筑物的碎块，甚至还有完整的小型星球碎片。工人们操作着巨大的磁力吊臂，将这些残骸从液体中捞出来，送往不同的处理区域。金属类的送去熔炼，矿石类的送去提纯，有机物则被焚烧发电。整个打捞场弥漫着浓烈的脚臭味，即使是最先进的通风系统也无法完全消除。但这里的产出相当可观，经常能打捞到稀有的合金和矿物。
  building_gts_bruh_giantess_fluid_2_desc: "This facility processes mixtures of foot sweat and foot grime collected from the soles of giantesses. Inside titanic separation basins, the liquid is slowly stirred while assorted debris drifts across the surface: wreckage of flattened warships, fragments of crushed buildings, and even intact remnants of small planets. Workers operate colossal magnetic cranes to hoist these wrecks from the fluid, dispatching them to different processing zones: metals are sent for smelting, minerals for purification, and organic matter is incinerated for power generation. The entire yard is permeated with an overpowering stench of sweaty feet that defies even the most advanced ventilation systems. However, the output is substantial, frequently salvaging rare alloys and minerals."
  # 足汗打捞工
  job_gts_bruh_giantess_fluid_worker_2: "Foot Sweat Salvager"
  # $job_gts_bruh_giantess_fluid_worker_2$
  job_gts_bruh_giantess_fluid_worker_2_plural: "$job_gts_bruh_giantess_fluid_worker_2$"
  # 足汗打捞工是这个星球上最辛苦的职业之一。穿着全身防护服，在散发着刺鼻气味的池子边工作，用特制的工具将各种残骸从黏稠的液体中捞出。最难的是判断哪些东西有价值，哪些只是普通垃圾。经验丰富的打捞工能从一块金属的光泽判断它的成分，从残骸的形状推测它的来源。有时候会发现一些稀奇古怪的东西，比如还在运作的机械装置，或是保存完好的文物。工作环境虽然恶劣，但收入不错，而且经常有意外之喜。
  job_gts_bruh_giantess_fluid_worker_2_desc: "Foot Sweat Salvagers hold one of the most grueling occupations on this world. Suited up in full-body hazard gear beside pungent basins, they wield specialized tools to haul out various wrecks from the viscous liquid. The greatest challenge lies in discerning what holds value and what is mere junk. A seasoned salvager can deduce the composition of a metal shard from its sheen alone, or deduce a fragment's origins from its warped shape. Occasionally they stumble upon bizarre oddities, such as still-functioning mechanisms or impeccably preserved cultural relics. Harsh as the working conditions are, the pay is handsome, and pleasant surprises abound."
  # $job_gts_bruh_giantess_fluid_worker_2$岗位
  mod_job_gts_bruh_giantess_fluid_worker_2_add: "$job_gts_bruh_giantess_fluid_worker_2$ Job"
  # $job_gts_bruh_giantess_fluid_worker_2_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_giantess_fluid_worker_2_workforce_mult: "$job_gts_bruh_giantess_fluid_worker_2_plural$$BONUS_WORKFORCE_FOR$"
  # $job_gts_bruh_giantess_fluid_worker_2_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_bruh_giantess_fluid_worker_2_workforce_mult: ""$job_gts_bruh_giantess_fluid_worker_2_plural$$BONUS_WORKFORCE_FOR$""
  # $job_gts_bruh_giantess_fluid_worker_2_plural$（子个体）$BONUS_WORKFORCE_FOR$
  mod_pop_gts_drone_gts_bruh_giantess_fluid_worker_2_workforce_mult: ""$job_gts_bruh_giantess_fluid_worker_2_plural$ (sub-entity) $BONUS_WORKFORCE_FOR$""
  # 乳汁灌溉农场
  building_gts_bruh_giantess_fluid_3: "Breast Milk Irrigation Farm"
  # 农场的中心是几座巨大的白色储罐，里面储存着从各地运来的巨娘乳汁。这些乳白色的液体富含各种营养成分，是最好的天然肥料。技术人员按照精确的比例将乳汁与清水混合，再通过遍布农场的管道系统输送到每一块农田。田地里的作物长得格外茂盛，玉米杆比普通品种高出一倍，麦穗沉甸甸地垂下来。农场上空经常能看到淡淡的乳雾，整个农场弥漫着甜甜的奶香，让人闻了就觉得饿。
  building_gts_bruh_giantess_fluid_3_desc: "At the center of the farm stand several titanic white silos storing giantess breast milk transported from across the cosmos. Rich in myriad nutrients, this milky-white fluid serves as the finest natural fertilizer. Technicians blend the milk with clean water in precise proportions before distributing it across every field via an extensive network of conduits. Crops in the fields thrive with extraordinary vigor - cornstalks grow twice as tall as ordinary varieties, and wheat ears hang heavy. A faint milky mist often hovers over the fields, blanketing the entire farm in a sweet, creamy aroma that stirs the appetite of anyone nearby."
  # 乳汁农工
  job_gts_bruh_giantess_fluid_worker_3: "Breast Milk Farmhand"
  # $job_gts_bruh_giantess_fluid_worker_3$
  job_gts_bruh_giantess_fluid_worker_3_plural: "$job_gts_bruh_giantess_fluid_worker_3$"
  # 乳汁农工的主要工作是操作灌溉系统，确保每块农田都能得到适量的乳汁供应。也需每天检查管道是否畅通，因为乳汁容易在管壁上形成乳垢，需要定期清理。
  job_gts_bruh_giantess_fluid_worker_3_desc: "The main duty of a Milk Farmworker is to operate the irrigation system, ensuring every piece of farmland receives an adequate supply of milk. They must also check the pipelines daily for blockages, as milk easily forms milk scum on pipe walls and requires regular cleaning."
  # $job_gts_bruh_giantess_fluid_worker_3$岗位
  mod_job_gts_bruh_giantess_fluid_worker_3_add: "$job_gts_bruh_giantess_fluid_worker_3$ Job"
  # $job_gts_bruh_giantess_fluid_worker_3_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_giantess_fluid_worker_3_workforce_mult: "$job_gts_bruh_giantess_fluid_worker_3_plural$$BONUS_WORKFORCE_FOR$"
  # $job_gts_bruh_giantess_fluid_worker_3_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_bruh_giantess_fluid_worker_3_workforce_mult: ""$job_gts_bruh_giantess_fluid_worker_3_plural$$BONUS_WORKFORCE_FOR$""
  # $job_gts_bruh_giantess_fluid_worker_3_plural$（子个体）$BONUS_WORKFORCE_FOR$
  mod_pop_gts_drone_gts_bruh_giantess_fluid_worker_3_workforce_mult: ""$job_gts_bruh_giantess_fluid_worker_3_plural$ (sub-entity) $BONUS_WORKFORCE_FOR$""
  # 小人热能炉
  building_gts_bruh_micro_1: "Tiny Person Thermal Furnace"
  # 这座建筑从外表看平平无奇，只是一栋普通的方形大楼，但内部却是另一番景象。空间里密密麻麻地排列着无数个透明的小胶囊，每个胶囊里都装着一个活生生的小人。这些小人被固定在特制的座椅上，身上贴满了导热贴片。他们的体温通过胶囊壁被收集起来，汇聚成稳定的热流，再转化为电能。$job_gts_bruh_micro_worker_1$推着小车走进胶囊阵列之间，用镊子小心翼翼地夹起那些活动力已经下降的胶囊。每个胶囊都有编号，电脑系统实时监控着每一个小人的状态。虽然技术上很先进，但这里的气氛总让人觉得压抑。
  building_gts_bruh_micro_1_desc: "From the outside, this building looks completely unremarkable, just an ordinary rectangular high-rise, but inside lies an entirely different scene. The space is densely packed with countless tiny transparent capsules, each containing a living tiny person. These tinies are strapped into specially made seats, their bodies covered in heat-conducting patches. Their body heat is harvested through the capsule walls, gathered into a steady stream of thermal energy, and then converted into electricity. A $job_gts_bruh_micro_worker_1$ pushes a cart between the capsule arrays, carefully picking up capsules with declining vitality using tweezers. Every capsule is numbered, and computer systems monitor the status of every single tiny person in real time. Although technologically advanced, the atmosphere here is always oppressive."
  # 热能管理员
  job_gts_bruh_micro_worker_1: "Thermal Administrator"
  # $job_gts_bruh_micro_worker_1$
  job_gts_bruh_micro_worker_1_plural: "$job_gts_bruh_micro_worker_1$"
  # $job_gts_bruh_micro_worker_1$每天的工作就是巡视这些胶囊，确保每个小人都在正常产热。他们手持平板电脑，上面显示着每个胶囊的温度数据。如果发现某个胶囊的温度异常，就要立即处理。有时是胶囊故障，有时是小人生病了，还有时是小人已经死了。管理员会打开胶囊，把里面的小人取出来，然後直接更换新的。这份工作最大的好处就是可以处置那些无法使用的小人，许多$job_gts_bruh_micro_worker_1$会把他们带回家当玩具或零食。工作虽然单调，但很稳定，而且福利不错。
  job_gts_bruh_micro_worker_1_desc: "The daily routine of a $job_gts_bruh_micro_worker_1$ is to patrol these capsules and ensure every tiny person is generating heat normally. Armed with a tablet displaying temperature data for each capsule, they must handle any temperature anomalies immediately. Sometimes it is a capsule malfunction, sometimes a tiny person has fallen ill, and other times a tiny person has already died. The administrator opens the capsule, removes the tiny person inside, and replaces them directly with a new one. The greatest perk of this job is the disposal rights to unusable tinies; many a $job_gts_bruh_micro_worker_1$ will take them home as toys or snacks. While monotonous, the work is stable and the benefits are generous."
  # $job_gts_bruh_micro_worker_1$岗位
  mod_job_gts_bruh_micro_worker_1_add: "$job_gts_bruh_micro_worker_1$ Job"
  # $job_gts_bruh_micro_worker_1_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_micro_worker_1_workforce_mult: "$job_gts_bruh_micro_worker_1_plural$$BONUS_WORKFORCE_FOR$"
  # $job_gts_bruh_micro_worker_1_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_bruh_micro_worker_1_workforce_mult: ""$job_gts_bruh_micro_worker_1_plural$$BONUS_WORKFORCE_FOR$""
  # $job_gts_bruh_micro_worker_1_plural$（子个体）$BONUS_WORKFORCE_FOR$
  mod_pop_gts_drone_gts_bruh_micro_worker_1_workforce_mult: ""$job_gts_bruh_micro_worker_1_plural$ (sub-entity) $BONUS_WORKFORCE_FOR$""
  # 小人筛矿场
  building_gts_bruh_micro_2: "Tiny Person Ore Sifting Yard"
  # 这座矿场专门处理那些巨娘们看不上的矿渣和废料。对巨娘来说太小的矿物碎屑，对小人来说却是宝贵的资源。整个矿场分为多个区域，每个区域堆放着不同来源的废料。有些是采矿剩下的碎石，有些是冶炼後的炉渣，还有些是拆船厂的金属碎片。成千上万的小人在这些废料堆里工作，用他们的小手一点点筛选出有价值的东西。矿场上空总是灰蒙蒙的，空气中飘浮着细小的粉尘。
  building_gts_bruh_micro_2_desc: "This mine specifically processes slag and waste materials that giantesses deem beneath notice. Mineral fragments far too small for a giantess are precious resources to tiny people. The entire yard is divided into multiple zones, each stockpiled with waste from different sources: rubble left from mining, slag after smelting, and metal shards from shipbreaker yards. Tens of thousands of tinies toil away in these waste heaps, using their tiny hands to sift out anything of value piece by piece. The sky above the yard is perpetually gloomy, with fine dust floating thick in the air."
  # 巨娘筛矿场监工
  job_gts_bruh_micro_worker_2: "Giantess Ore Sifting Overseer"
  # $job_gts_bruh_micro_worker_2$
  job_gts_bruh_micro_worker_2_plural: "$job_gts_bruh_micro_worker_2$"
  # $job_gts_bruh_micro_worker_2$的工作是确保这些小人高效工作，不偷懒也不偷东西。$job_gts_bruh_micro_worker_2$随时可以对偷懒的小人发出警告。如果警告无效，她们会毫不犹豫地在所有小人前把那个倒楣蛋踩成肉酱。这种杀鸡儆猴的做法非常有效，小人们都拼命工作，生怕成为下一个例子。$job_gts_bruh_micro_worker_2$的收入与矿场的产出挂钩，所以她们对工作非常认真。下班後，她们经常会带几个表现好的小人回家"奖励"。
  job_gts_bruh_micro_worker_2_desc: "The job of a $job_gts_bruh_micro_worker_2$ is to ensure these tinies work efficiently, without slacking off or stealing. A $job_gts_bruh_micro_worker_2$ can issue warnings to slackers at any time. If warnings fail, she will not hesitate to trample the unlucky fellow into paste right before all the tiny workers. This practice of making an example out of someone is exceptionally effective; the tinies work desperately, terrified of becoming the next lesson. A $job_gts_bruh_micro_worker_2$'s income is tied to the yard's output, so they take their duties very seriously. After clocking off, they often take several well-behaved tinies home as a \"reward\"."
  # $job_gts_bruh_micro_worker_2$岗位
  mod_job_gts_bruh_micro_worker_2_add: "$job_gts_bruh_micro_worker_2$ Job"
  # $job_gts_bruh_micro_worker_2_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_micro_worker_2_workforce_mult: "$job_gts_bruh_micro_worker_2_plural$$BONUS_WORKFORCE_FOR$"
  # $job_gts_bruh_micro_worker_2_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_bruh_micro_worker_2_workforce_mult: ""$job_gts_bruh_micro_worker_2_plural$$BONUS_WORKFORCE_FOR$""
  # $job_gts_bruh_micro_worker_2_plural$（子个体）$BONUS_WORKFORCE_FOR$
  mod_pop_gts_drone_gts_bruh_micro_worker_2_workforce_mult: ""$job_gts_bruh_micro_worker_2_plural$ (sub-entity) $BONUS_WORKFORCE_FOR$""
  # 小人食品加工中心
  building_gts_bruh_micro_3: "Tiny Person Food Processing Center"
  # 这座工厂是所有小人的噩梦。运输车将一批批小人送到这里，他们被倒进巨大的分拣机器里，按照身高、体重、健康状况分成不同等级。最健康强壮的被送往鲜食生产线，他们会被简单清洗後直接包装出售。体质较弱的被送往加工线，在那里被处理成各种食品。工厂的不同区域负责生产不同的产品，有的做罐头，有的做腌制品，有的做干货。整个工厂回荡着机器的轰鸣声和小人的尖叫声，但这些声音很快就被淹没在流水线的噪音里。成品被装箱运往各地，供巨娘们享用。
  building_gts_bruh_micro_3_desc: "This factory is the nightmare of all tiny people. Transport vehicles deliver batches of tinies here, dumping them into massive sorting machines where they are graded according to height, weight, and health status. The healthiest and strongest are sent to the fresh-food production line, where they are briefly rinsed and packaged directly for sale. The weaker ones are sent to processing lines to be turned into various food products. Different sections of the factory produce different goods: some make canned food, some produce pickled goods, and others dried snacks. The entire factory echoes with the roar of machinery and the screams of tinies, though these cries are quickly swallowed by the assembly line's din. Finished goods are crated and shipped across the galaxy for giantesses to enjoy."
  # 小人食品加工师
  job_gts_bruh_micro_worker_3: "Tiny Person Food Processor"
  # $job_gts_bruh_micro_worker_3$
  job_gts_bruh_micro_worker_3_plural: "$job_gts_bruh_micro_worker_3$"
  # $job_gts_bruh_micro_worker_3$负责操作各种加工设备，将小人制成不同的食品。有些产品需要将小人切碎搅拌，有些需要整个腌制，有些需要烘干研磨。$job_gts_bruh_micro_worker_3$必须熟练掌握各种工艺，确保产品的口感和品质。她们经常要试吃新产品，评估味道是否达标。工作虽然有点血腥，但待遇很好，而且经常有免费的小人食品带回家。
  job_gts_bruh_micro_worker_3_desc: "A $job_gts_bruh_micro_worker_3$ is responsible for operating various processing equipment to turn tiny people into different food products. Some products require chopping and mincing the tinies, some require whole pickling, while others require drying and grinding. A $job_gts_bruh_micro_worker_3$ must master every technique to ensure the mouthfeel and quality of the products. They frequently taste-test new products to evaluate whether flavors meet standards. Although the work is somewhat bloody, the pay is excellent, and there is often free tiny food to take home."
  # $job_gts_bruh_micro_worker_3$岗位
  mod_job_gts_bruh_micro_worker_3_add: "$job_gts_bruh_micro_worker_3$ Job"
  # $job_gts_bruh_micro_worker_3_plural$$BONUS_WORKFORCE_FOR$
  mod_pop_gts_micro_worker_3_workforce_mult: "$job_gts_bruh_micro_worker_3_plural$$BONUS_WORKFORCE_FOR$"
