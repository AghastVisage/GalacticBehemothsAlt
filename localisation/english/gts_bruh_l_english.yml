  sc_gts_bruh_aurora_desc: ""
  #  據說如果能穿過白洞就能到達§R巨娘居住的世界§!，但直到現在似乎也沒有人能做到完整地進入白洞。因為§Y$NAME_gts_eyjafjalla$§!瞬間注入的巨量乳汁，使得白洞的質量大增，發出的引力波比一般黑洞還強，更加干擾超光速引擎的工作，使戰艦難以緊急脫離戰鬥。
  pc_gts_bruh_white_hole_desc: "It is said that if one could pass through the White Hole, they could reach the §RWorld where Giantesses Reside§!, but so far no one seems to have been able to enter it completely. Because of the massive amount of milk injected by §Y$NAME_gts_eyjafjalla$§! in an instant, the White Hole's mass has greatly increased, emitting gravitational waves stronger than average black holes and further interfering with FTL engines, making it difficult for warships to emergency disengage from combat."
  #  這顆星球被完全包裹在一條從無畏艦娘身上脫下的巨大藍白條紋內褲之中。原本的天空已被厚達數公里的棉質織物所取代，抬頭望去，只能看見無邊無際的白色與藍色纖維交織而成的「天空」。地表常年處於濕熱、陰暗的狀態，空氣中瀰漫著令人窒息的氨味、汗味與女性下體特有的濃烈麝香味。自然降雨已不復存在，取而代之的是當上方的織物吸飽了體液後，滴落下來的粘稠愛液雨與變質的汗水。海洋已變成了渾濁的黃白色混合液體。
  pc_gts_bruh_panties_planet_01_desc: "This planet is completely enveloped in a giant pair of blue and white striped panties removed from a Dreadnought Shipgirl. The original sky has been replaced by cotton fabric miles thick; looking up, one can only see an 'atmosphere' of endless interwoven white and blue fibers. The surface is perpetually humid and dark, with the air filled with suffocating scents of ammonia, sweat, and the intense musky aroma of a woman's lower body. Natural rainfall no longer exists; instead, when the fabric above becomes saturated with body fluids, viscous love juice rain and decomposed sweat drip down. The oceans have turned into a turbid mixture of yellow and white liquids."
  #  褲帶城市
  district_gts_bruh_panties_planet_01: "Elastic Band City"
  #  原本的天空已被厚達數公里的織物取代，地表常年處於濕熱陰暗的狀態，殖民者在織物纖維間建立城市，開採尿漬結晶作為能源，在愛液沼澤中打撈各種殘骸\n空氣中混雜著汗味、氨味與女性特有的濃烈氣息
  col_gts_bruh_panties_tt: "The original sky has been replaced by miles-thick fabric, and the surface remains humid and dark year-round. Colonists establish cities among the fabric fibers, mine urine stain crystals for energy, and salvage various wrecks from love juice swamps. \\nThe air is a mixture of sweat, ammonia, and the intense unique aura of women."
  #  位於高空的巨大環形山脈，實則是勒緊星球的鬆緊帶結構。這裡遠離了底部的潮濕與異味，空氣相對清新且乾燥。巨大的纖維如同天然的地基，為建築提供了穩固的依託。
  district_gts_bruh_panties_planet_01_desc: "A massive ring mountain range in the high altitude, which is actually the elastic band structure tightening around the planet. It is far from the humidity and odors of the bottom, with relatively fresh and dry air. The giant fibers serve as natural foundations, providing stable support for buildings."
  #  位於胖次前段的區域，通常是對應艦娘尿道口的位置。織物呈現出淡淡的黃色並已經硬化。這些「黃漬」中蘊含著巨娘排泄的高能化合物晶體。雖然開採過程伴隨著令人窒息的氨氣味，但燃燒這些晶體能提供驚人的能量，每一塊晶體都濃縮了艦娘膀胱內的高能代謝廢物。
  district_gts_bruh_panties_planet_02_desc: "An area in the front of the panties, typically corresponding to the position of the shipgirl's urethral opening. The fabric appears slightly yellow and has hardened. These 'yellow stains' contain high-energy compound crystals excreted by the giantess. Although the mining process is accompanied by a suffocating ammonia smell, burning these crystals provides incredible energy; each crystal concentrates the high-energy metabolic waste from the shipgirl's bladder."
  #  位於胖次核心的區域，這裡的織物常年濕潤，形成了一片由愛液構成的沼澤。開採這裡需要重型機械進行打撈，每一鏟下去都能挖出各種殘骸，那是無數個被艦娘塞入小穴內的星球殘渣或船艦與愛液混合的產物。
  district_gts_bruh_panties_planet_03_desc: "An area at the core of the panties, where the fabric is perpetually moist, forming a swamp made of love juices. Mining here requires heavy machinery for salvaging; every scoop can dig up various wrecks—the remains of countless planets or ships inserted into the shipgirl's aperture, mixed with love juices."
  #  捲曲陰毛叢林
  d_gts_bruh_panties_planet_05_deposits: "Curled Pubic Hair Jungle"
  #  幾根從艦娘私處脫落的黑色陰毛掉落在這裡，對於小人來說，它們是橫亙在地表上、粗達數公里且堅硬無比的捲曲黑色山脈。這些巨型陰毛阻斷了交通，且難以切斷
  d_gts_bruh_panties_planet_05_deposits_desc: "Several black pubic hairs shed from the shipgirl's private parts have fallen here; for the little people, they are curled black mountains crossing the surface, several kilometers thick and incredibly hard. These giant pubic hairs block transportation and are difficult to cut through."
  #  尿晶礦工
  job_gts_bruh_panties_planet_01_worker: "Urine Crystal Miner"
  #  專門負責在黃漬區域開採硬化的尿液結晶。這些工人配備密封面罩以過濾空氣中的氨氣，使用震動鎬敲碎琥珀色的晶體層，將其送往煉製設施轉化為能源
  job_gts_bruh_panties_planet_01_worker_desc: "Specialized in mining hardened urine crystals in the yellow stain areas. These workers are equipped with sealed masks to filter out ammonia from the air, using vibration picks to break the amber crystal layers and sending them to refining facilities for conversion into energy."
  #  $job_gts_bruh_panties_planet_02_worker$崗位
  mod_job_gts_bruh_panties_planet_02_worker_add: "$job_gts_bruh_panties_planet_02_worker$ Job"
  #  纖維採集工
  job_gts_bruh_panties_planet_03_worker: "Fiber Collector"
  #  這些工人攀爬在直徑數公里的棉質纖維上，使用特製的切割工具收割這些堅韌的材料。每日的工作都是在懸空數千公尺的高度進行的
  job_gts_bruh_panties_planet_03_worker_desc: "These workers climb upon cotton fibers several kilometers in diameter, using specialized cutting tools to harvest these tough materials. Daily work is performed suspended at heights of thousands of meters."
  #  你可以在這裡購買Bruh艦娘的坐標\n\n§Y"提醒您，雖然§M鵝§!總是會把影響力還你，但每次使用通訊面板所花費的影響力還是會增加§!\n\n§R所以別沒事打擾§M鵝§!§!
  gts_leader_bruh.0002.desc: "You can purchase the coordinates of Bruh Shipgirls here. \\n\\n§Y\"Reminder: although §MGoose§! always returns your Influence, the Influence cost for using the communication panel increases each time.\"§! \\n\\n§RSo don't disturb §MGoose§! for no reason.§!"
  #  §M鵝:這些事件通常會摧毀一些東西，畢竟艦娘也沒那麼受控的......§!\n\n§R"自己斟酌要不要開吧(大多數事件要開這個才會觸發)"§!
  gts_leader_bruh.0002.e.custom_tooltip: "§MGoose: These events usually destroy something; after all, shipgirls aren't that easy to control...§! \\n\\n§R\"Decide for yourself whether to enable them (most events require this to be enabled to trigger)\"§!"
  #  §M鵝:我建議使用小型船只去打，艦娘的單發火力強大，小船的數量、高閃避、低造價都能很好的消除掉艦娘的攻擊§!
  gts_leader_bruh.0002.h.custom_tooltip: "§MGoose: I suggest using small ships to fight; shipgirls have powerful single-shot fire, so the quantity, high evasion, and low cost of small ships can effectively offset their attacks.§!"
  #  我們做到了。付出了慘痛的代價後，我們擊敗了那位曾讓整個星區為之顫抖的無畏艦娘。當她那比恆星還要巨大的身軀終於停止掙扎時，整個戰場陷入了詭異的寂靜。沒有人敢第一個靠近她。那些曾經吞噬過星球的唇瓣，那雙能夠徒手捏碎戰艦的玉手，那柄削鐵如泥的斬艦刀...即使在死亡面前，她依然散發著令人窒息的威壓。花了整整一個月，我們才完成對她屍體的初步勘探。我們發現了她的記憶數據。原來在變成這樣的存在之前，她也曾是個普通的少女，是某種我們無法理解的技術將她改造成了這樣的「武器」。在記憶的最後，一個想法閃過了她的腦海中。"我已經記不清自己的名字了，但我還記得...我曾經也想要被溫柔對待......"\n§V(研究團隊陷入了長久的沉默)§!\n\n§G解鎖隨機一種§MBruh無畏艦娘§!圖紙§!\n\n§Y需要研發配件才會顯示在設計器裡§!
  gts_leader_bruh.0008.desc: "We did it. After paying a tragic price, we defeated the Dreadnought Shipgirl who once made the entire sector tremble. When her body—larger than a star—finally stopped struggling, the entire battlefield fell into an eerie silence. No one dared to be the first to approach her. Those lips that once swallowed planets, those jade hands capable of crushing warships with bare strength, that ship-slaying blade that cut metal like butter... even in death, she still radiated an overwhelming pressure. It took an entire month to complete the preliminary exploration of her remains. We discovered her memory data. It turns out that before becoming such an existence, she too was just an ordinary girl; some technology beyond our understanding had transformed her into this 'weapon'. At the very end of her memories, a thought flashed through her mind: \"I can no longer remember my name, but I remember... I once wanted to be treated with tenderness...\" \\n§V(The research team fell into a long silence)§! \\n\\n§GUnlocked a random §MBruh Dreadnought Shipgirl§! blueprint§! \\n\\n§YRequires researching components to appear in the designer§!"
  #  通訊螢幕上出現了鵝將軍那張標誌性的臉龐。這隻總是發出奇怪叫聲的生物最近一直盯著艦娘們換洗下來的衣物發呆，那些面積媲美大陸、散發著濃烈氣味的巨大胖次堆積如山。它突然靈光一閃，那顆聰明的腦袋裡誕生了一個瘋狂的想法。\n\n§M"光是把星球塞入小穴內還不夠！"§!\n\n§Y(它拍著桌子大喊)§!\n\n§M"我們需要一種能讓敵人世世代代都活在巨娘胯下陰影之中的手段!一種能夠羞辱它們、封鎖它們、讓它們的後代只能呼吸少女私處氣味的終極武器！"§!\n\n鵝將軍說明了它的計劃，畫面上顯示著一條巨大的艦娘胖次完整包裹住整顆星球的示意圖。它需要收集不同類型星球被塞入艦娘小穴後的詳細數據，以便計算出最合適的胖次材料強度、彈性係數，以及能夠完美保存艦娘體味的織物配方。\n\n§M"我需要七種不同環境的星球數據"§!\n\n§Y(鵝將軍興奮地說)§!\n\n§M"荒蕪的、冰凍的、有毒的、熾熱的、乾燥的、寒冷的，還有那種生機勃勃的！把它們全都塞進去，然後記錄下艦娘小穴內壁的每一次收縮、愛液的分泌量、以及星球表面被碾壓的具體數據！"§!\n\n它指著螢幕上標記出的七個目標星球。\n\n§M"完成這些實驗，我就能製造出一種特殊的巨像武器。它能把艦娘剛脫下的、還沾滿愛液和陰垢的胖次完整地套在敵人的母星上！讓那顆星球永遠沾著少女私處的氣息！"§!\n\n§Y任務目標：使用艦娘的【塞入小穴】巨像武器處理掉7個指定星球(查詢情報日誌以追蹤位置)§!
  gts_leader_bruh.0021.desc: "General Goose's iconic face appeared on the communication screen. This creature, which always makes strange noises, has recently been staring blankly at the laundry the shipgirls changed out of—massive panties spreading like continents and emitting intense scents, piled high like mountains. A sudden flash of inspiration struck, and a crazy idea was born in that clever head. \\n\\n§M\"Just inserting planets into the aperture isn't enough!\"§! \\n\\n§Y(It shouts, slamming the table)§! \\n\\n§M\"We need a way to make the enemy live in the shadow of the giantess's crotch for generations! An ultimate weapon that can humiliate them, block them, and force their descendants to breathe nothing but the scent of a girl's private parts!\"§! \\n\\nGeneral Goose explained the plan, while the screen showed a schematic of a giant shipgirl panty completely enveloping entire planets. It needs to collect detailed data from different types of planets being inserted into the shipgirls' apertures to calculate the most suitable panty material strength, elasticity coefficients, and a fabric formula that can perfectly preserve the shipgirls' body scent. \\n\\n§M\"I need data from seven planets with different environments,\"§! \\n\\n§Y(General Goose says excitedly)§! \\n\\n§M\"Barren, Frozen, Toxic, Molten, Desert, Cold, and those full of life! Shove them all in, then record every contraction of the aperture's inner walls, the volume of love juice secretion, and the specific data of the planet's surface being crushed!\"§! \\n\\nIt points to the seven target planets marked on the screen. \\n\\n§M\"Complete these experiments, and I can create a special Colossus weapon. It can take the shipgirl's just-removed panties, still covered in love juices and crotch residue, and envelop the enemy's home planet completely! Let that planet forever carry the scent of a girl's private parts!\"§! \\n\\n§YOptional Objective: Use the [Insert into Aperture] Colossus weapon to process 7 designated planets (Track locations in Situation Log)§!"
  #  無畏艦娘剛剛結束了一場長達兩週的巡邏任務，身上的衣物早已被汗水浸透。一支艦隊小心翼翼地接近正在休息的艦娘。她此刻正漂浮在恆星基地附近，雙腿微微張開，讓恆星過被汗水浸濕的胯部。那條藍白條紋的胖次已經完全變了顏色，原本鮮豔的藍色變成了暗沉的灰藍，而白色部分則呈現出不均勻的黃褐色。\n\n§Y"艦娘小姐，我們需要...呃...收集您的...那個..."§!\n\n艦隊指揮官結結巴巴地通過通訊器說道。艦娘睜開眼睛，看著那些漂浮在她胯下，如同飛蚊的的小飛船，臉上露出疑惑的表情。\n\n§R"收集什麼？"§!\n\n§Y"您的...內褲..."§!\n\n指揮官硬著頭皮說出來，聲音小得像蚊子。\n\n§R"啊？！"§!\n\n艦娘的臉瞬間漲紅。\n\n§Y"你們要我的胖次？這...這也太羞恥了吧！而且我已經穿了兩個星期了，肯定很臭..."§!\n\n§M"正是因為這樣才需要！"§!\n\n鵝將軍的聲音突然插入通訊。\n\n§M"我需要您最原汁原味的胖次！上面的汗液、愛液、尿漬、陰垢，全都是寶貴的研究材料！拜託了，這關係到帝國的未來！"§!\n\n艦娘猶豫了很久，最後還是嘆了口氣。\n\n§R"好吧...但你們要保證不會拿去做奇怪的事情..."§!\n\n她伸手勾住胖次的邊緣，緩緩向下褪去。那條被浸透的內褲與肌膚分離時發出"嗤啦"的粘連聲，襠部的布料更是因為乾涸的愛液而變得硬邦邦的。當胖次完全脫下時，一股濃烈的氣味瞬間擴散開來。當胖次被放入貨艙時，艦員們即使隔著密封艙，也能聞到那股混合了汗臭、尿騷和腥味的複合氣味。有幾個人當場就暈了過去，剩下的人強忍著噁心，用機械臂小心翼翼地將這條巨大的胖次收納進特製的密封容器中。\n\n§Y"樣本採集完成...天啊...我這輩子都不想再聞到這種味道了..."§!\n\n指揮官虛弱地說道。而在基地裡，鵝將軍已經迫不及待地打開了密封容器。濃烈的氣味像實體一樣湧出，整個基地瞬間被這股臭味淹沒。但鵝將軍絲毫不在意，它興奮地撲向那條有如平原一般的胖次，開始仔細檢查每一處汙漬。\n\n§M"完美!完美!這襠部的黃漬簡直是藝術品！"\n"看這濃度!看這粘稠度!這得有多少愛液和汗水才能累積成這樣！"§!\n\n§Y(日誌結束)§!
  gts_leader_bruh.0023.desc: "The Dreadnought Shipgirl had just finished a two-week patrol mission, her clothing long since soaked in sweat. A fleet cautiously approached the resting shipgirl. She was currently floating near the starbase, her legs slightly apart, letting the sun pass over her sweat-soaked crotch. Those blue and white striped panties had completely changed color: the once bright blue had turned into a dull grayish-blue, while the white parts showed uneven yellowish-brown stains. \\n\\n§Y\"Shipgirl-san, we need to... er... collect your... that...\"§! \\n\\nbleated the fleet commander over the communicator. The shipgirl opened her eyes, looking at those tiny ships floating beneath her crotch like gnats, her face showing a puzzled expression. \\n\\n§R\"Collect what?\"§! \\n\\n§Y\"Your... underwear...\"§! \\n\\nThe commander braced himself and spoke, his voice as small as a mosquito's. \\n\\n§R\"Ah?!\"§! \\n\\nThe shipgirl's face instantly turned bright red. \\n\\n§Y\"You want my panties? This... this is too embarrassing! Besides, I've been wearing them for two weeks, they must be smelly...\"§! \\n\\n§M\"That's exactly why we need them!\"§! \\n\\nGeneral Goose's voice suddenly cut into the communication. \\n\\n§M\"I need your most original, authentic panties! The sweat, love juices, urine stains, and crotch residue on them are all precious research materials! Please, this concerns the future of the Empire!\"§! \\n\\nThe shipgirl hesitated for a long time before finally sighing. \\n\\n§R\"Fine... but you must promise you won't use them for weird things...\"§! \\n\\nShe hooked her finger into the edge of the panties and slowly pulled them down. The sound of the soaked fabric separating from the skin was a sticky 'schlorp', and the fabric at the crotch was stiff from dried love juices. When the panties were completely removed, an intense scent instantly diffused. As the panties were placed in the cargo bay, the crew could smell that complex mixture of sweat, urine, and fishy odors even through sealed cabins. Several people fainted on the spot, while the rest endured the nausea, using robotic arms to carefully store the massive panties in a specially made sealed container. \\n\\n§Y\"Sample collection complete... Heavens... I hope I never have to smell that again in my life...\"§! \\n\\nsaid the commander weakly. Back at the base, General Goose had already impatiently opened the sealed container. The intense odor surged out like a solid entity, instantly flooding the entire base. But General Goose didn't care at all, excitedly pouncing on the plain-sized panties and beginning to inspect every stain. \\n\\n§M\"Perfect! Perfect! These yellow stains at the crotch are a work of art!\"\\n\"Look at this concentration! This viscosity! Just how much love juice and sweat must have accumulated to become like this!\"§! \\n\\n§Y(Log ends)§!"
  #  §Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§!的大使帶著一隊精心挑選的小人來到了您的宮殿。這些小人被訓練得彬彬有禮，穿著華麗的服飾，眼神中混雜著恐懼與一絲被選中的榮耀。根據我們簽訂的"寵物條款"，這是它們應盡的義務。大使恭敬地呈上名單，並向您解釋道，這些是本屆最"優質"的寵物候選者，他們經過健康篩選和嚴苛訓練，旨在為您提供最好的服務。現在，是時候決定如何「使用」這批活體貢品了。
  gts_event_bruh.0010.desc: "The ambassador of §Y[event_target:gts_bruh_get_subject_pop_usage_1_country.GetName]§! has arrived at your palace with a team of carefully selected little people. These tiny people have been trained to be polite and are dressed in magnificent attire, their eyes a mix of fear and a hint of the honor of being chosen. According to the 'Pet Clause' we signed, this is their duty. The ambassador respectfully presented the list and explained to you that these are this session's most 'high-quality' pet candidates, having undergone health screenings and rigorous training to provide you with the best service. Now, it is time to decide how to 'use' this batch of living tributes."
  #  根據本公司與微觀客戶簽署的§Y《天體級生物安全保障協定》§!，每隔十年，公司將啟動資產回收程序進行保費結算。鑑於雙方在體型與經濟體系上的維度差異，常規貨幣已失去流通意義，因此協議規定以該文明的「生物人口」作為唯一認可的等價交換物。董事會可需根據當前的庫存需求與外交戰略，調整本週期的保費徵收費率。此項決策將直接決定流入公司加工廠與寵物市場的貨源數量，同時也會對客戶文明的社會結構造成不同程度的物理性削減，進而影響其對公司的外交態度。\n\n§Y(只會向人口超過5000的星球收費)§!
  policy_gts_bruh_insurance_rate_desc: "According to the §Y'Celestial-level Bio-Security Guarantee Agreement'§! signed between this Company and our micro-clients, every ten years, the Company will initiate asset recovery procedures for insurance premium settlement. Given the dimensional differences between the two parties in terms of size and economic systems, conventional currency has lost its significance for circulation; therefore, the agreement stipulates 'biological population' as the only recognized equivalent for exchange. The board of directors may adjust this cycle's premium collection rate based on current inventory needs and diplomatic strategies. This decision will directly determine the volume of 'goods' flowing into our processing plants and pet markets, while also causing varying degrees of physical reduction to the client civilizations' social structure, thereby affecting their diplomatic attitude toward the Company. \\n\\n§Y(Only charges planets with a population over 5000)§!"
