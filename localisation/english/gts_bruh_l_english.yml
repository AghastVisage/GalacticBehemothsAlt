  # 棉线纤维矿区
  district_gts_bruh_panties_planet_04_plural: "Cotton Fiber Mining Areas"
  # 这些如同通天巨塔般的棉质纤维是极佳的建筑材料。工人们攀爬在直径数公里的丝线上，开采这些坚韧的物质。当然，要小心别掉进纤维交织的深渊里，那里往往堆积着令人作呕的污垢。
  district_gts_bruh_panties_planet_04_desc: "These cotton fibers, standing like towers reaching for the sky, are excellent building materials. Workers climb on threads miles in diameter to mine these tough substances. Of course, be careful not to fall into the abyss where the fibers interweave; disgusting grime often accumulates there."
