l_english:
  # 星球玩具化
  ap_gts_planet: "Colony Toyification"
  # 让我们的天体级巨娘用星球干一些涩涩的事情\n\n§S当然会很小心的啦～§!
  ap_gts_planet_desc: "Using short-term gigantification technology, let our governors do some naughty things with the colony--\n\n§S Of course they will be very careful~§!"
  # §Y解锁星球玩法的研究选项§!
  add_research_options_gts_planet: "Unlocks Giantess Planet Related Research"
  # 爱液星球
  tech_gts_juice_colonies: "Love Juice World"
  # 
  tech_gts_juice_colonies_desc: "Stuff the entire colony planet into the crotch of a gigantic governor, and then, like a little vibrator, just self-pleasure a bit.\nSquelch, squelch - will be very careful..."
  # 乳汁星球
  tech_gts_milk_colonies: "Milk World"
  # 
  tech_gts_milk_colonies_desc: "Let the governor, who is currently experiencing lactation, release here and turn the entire planet into fertile land."
  # 精液星球
  tech_gts_semen_colonies: "Semen World"
  # 
  tech_gts_semen_colonies_desc: "Choose one unlucky colony for our frustrated futa girls to ejaculate all over."
  # 排泄星球
  tech_gts_shit_colonies: "Excrement World"
  # 
  tech_gts_shit_colonies_desc: "Perhaps we can establish a special world to connect with the chamber pots of our giantess leaders, used to accommodate their daily excrement."
  # 足垢星球
  tech_gts_dirt_colonies: "Foot Filth World"
  # 
  tech_gts_dirt_colonies_desc: "Let our giantesses use their feet, full of dirt and sweat, to play with this poor colony planet.\nInfrastructure damage and air quality? Don't worry about it~"
  # 创造爱液星球
  decision_gts_juice_colony: "Create Love Juice World"
  # 让一位天体级巨娘来把整个星球塞进小穴里。就像使用跳蛋一样，用手指夹住星球塞进去，轻轻自慰几下，然后把它抠出来。而星球上那些还没来得及逃跑的小人，则会变成膣壁上阴垢。当星球被抠出来时，它已经完全变成了爱液星球，表面覆盖着几十公里厚的爱液，空气中充满了女性气息，而幸存的小人们则会在接下来的日子里不断地发情，最终沦为只会交配的机器。\n§R当然了，这种改造会让星球上百分之九十九的人口死亡，以及巨量的破坏度！§!
  decision_gts_juice_colony_desc: "Stuff the entire colony planet into the crotch of a gigantic governor, and then, like a little vibrator, just self-pleasure a bit.\nSquelch, squelch - will be very careful.\n§RThe planet type will be permanently changed after completion! And districts cannot be built!§!"
  # §r创造千海的特殊爱液星球§!
  decision_gts_juice_colony_qhai: "§rCreate Qianhai's Special Love Juice World§!"
  # 将这个星球送给千海使用，虽然她有些抗拒，但还是同意了。\n§r好吧，仅此一次哦§!\n§R当然了，这种改造会让星球上百分之九十九的人口死亡，以及巨量的破坏度！§!
  decision_gts_juice_colony_qhai_desc: "Give this colony to Leader Qianhai to use. Although she is a bit reluctant, she has agreed.\n§rOkay, just this once!§!\n§RThe planet type will be permanently changed after completion!§!"
  # 创造乳汁星球
  decision_gts_milk_colony: "Create Milk World"
  # 让一位正在涨奶的天体级巨娘来"处理"这颗星球。让那对遮天蔽日的巨乳对准星球，然后用力揉捏自己的乳头。当乳汁如同两道白色瀑布般喷涌而下时，整个星球都会被淹没在香甜的奶香之中。那些沿海城市会在第一时间被乳汁海啸冲毁，而内陆的居民则会在几十米深的乳白色海洋中挣扎求生。但别担心，这种乳汁富含营养，只要能撑过最初的几天，幸存者们就能在这片新形成的乳汁海洋上建立起繁荣的农业帝国。当然，前提是他们能忍受住空气中那股永远散不去的奶腥味\n§R当然了，这种改造会让星球上百分之九十九的人口死亡，以及巨量的破坏度！§!
  decision_gts_milk_colony_desc: "Let the governor, who is currently experiencing lactation, release here and turn the entire planet into fertile land.\n§RThe planet type will be permanently changed after completion! And districts cannot be built!§!"
  # 创造精液星球
  decision_gts_semen_colony: "Create Semen World"
  # 派出一位饥渴难耐的天体级扶她巨娘，让她对着这颗倒霉的星球发泄欲望。那根如同天柱般的肉棒会在星球表面来回摩擦，直到它彻底变软为止。在这个过程中，巨量的精液会如同暴雨般倾泻而下，把整个星球都浸泡在腥臭的白浊之中。那些来不及逃跑的小人会被直接吞进精子的肚子里，而城市则会在精液海啸的冲刷下变成一片废墟。最终，这颗星球会被完全覆盖，成为一颗由巨型精子统治的精液星球。幸存的小人们要嘛学会在黏稠的精海中游泳，要嘛就乖乖地当精鱼的饲料。\n§R当然了，这种改造会让星球上百分之九十九的人口死亡，以及巨量的破坏度！§!
  decision_gts_semen_colony_desc: "Choose an unlucky colony for our frustrated futa girls to ejaculate all over.\n§RThe planet type will be permanently changed! And districts cannot be built!§!"
  # 创造排泄星球
  decision_gts_shit_colony: "Create Excrement World"
  # 把这颗星球变成巨娘们的专用便器。每天都会有几位天体级的少女来这里"上厕所"，她们会蹲在星球上空，尽情地释放自己的肠道。巨量的粪便会如同山崩般落下，把原有的城市、森林和海洋全部掩埋。尿液则会形成新的海洋，把那些还在粪山中挣扎的幸存者彻底淹没。最终，这颗星球会被完全覆盖，成为一颗由粪便大陆和尿液海洋组成的排泄星球。这里的空气中永远弥漫着令人窒息的恶臭，但对于那些已经习惯了的小人来说，这里反而是真正的天堂。\n§R当然了，这种改造会让星球上百分之九十九的人口死亡，以及巨量的破坏度！§!
  decision_gts_shit_colony_desc: "Connect this planet to the chamber pots of our giantess leaders and use it to receive their daily waste.\n§RThe planet type will be permanently changed! And districts cannot be built!§!"
  # §R创造足垢星球§!
  decision_gts_dirt_colony0: "§RCreate Foot Filth World§!"
  # 命令我们的天体级巨娘用她那裹满污垢和汗渍的脚丫好好"玩弄"一下这颗星球。把那双玉足伸到大气层外，然后狠狠地踩下去。随着她不断地搓揉碾压，星球表面会被厚厚的足垢覆盖，最终变成一颗由脚汗海洋和足垢大陆组成的足垢星球。这里的空气中永远充满了刺鼻的脚臭味，但对于那些已经被足味洗脑的可怜虫来说，这反而是世界上最甜蜜的香味。\n§R当然了，这种改造会让星球上百分之九十九的人口死亡，以及巨量的破坏度！§!
  decision_gts_dirt_colony0_desc: "Let our giantesses play with this poor colony planet with their feet covered in filth and sweat. Infrastructure damage and air quality? Don't worry about it~\n§RAfter completion the planet type will be permanently changed!\n///At the same time this will cause a large number of deaths and destroy buildings!!!!///\nGain rewards based on the number of deaths!§!"
  # §G恢复星球环境§!
  decision_gts_dirt_colony1: "§GRestore Planet Environment§!"
  # 在经历了一系列努力之后，我们终于可以着手开始修复这颗被足垢覆盖的星球的生态环境了。\n§Y星球环境将部分复原，但依然无法恢复到完全宜居的状态，原版建筑与区划将可以建造。§!
  decision_gts_dirt_colony1_desc: "After a series of efforts, we can finally start to repair the ecology of this planet covered in foot filth.\n§YThe planet's environment will be partially restored, but it will still not be able to return to a fully habitable state; Original buildings and districts will be able to be built again.§!"
  # §R需要先完成星球环境修复！§!
  decision_gts_dirt_colony1_fail: "§RYou need to restore the planet's environment first!§!"
  # §R足垢星球堡垒化§!
  decision_gts_dirt_colony2: "§RFortify Foot Filth Planet§!"
  # 如果再让我们的巨娘将这些覆盖在星球表面的足垢给压实，整颗星球会成为抵御外来入侵的坚固堡垒！我们会保证有足够多的人“自愿”驻扎在这里的。\n§Y将星球转换为足垢堡垒星球，提供大量驻军、海军容量、合金加成，但环境会更恶劣，同时会造成大量的人口死亡与建筑破坏§!
  decision_gts_dirt_colony2_desc: "If we let our giantesses compact the foot filth covering the planet's surface, the entire planet will become a solid fortress against external invasion! We will ensure that there are enough people who 'volunteer' to be stationed here.\n§YTransforms the planet into a Foot Filth Fortress Planet, providing a large number of garrisons, naval capacity, and alloy bonuses, but the environment will be worse, while also causing a large number of deaths and destruction of buildings.§!"
  # §R足垢星球粉碎化§!
  decision_gts_dirt_colony3: "§RPulverize Foot Filth Planet§!"
  # 既然足垢能够成为极佳的矿物来源，为什么我们不让巨娘再把这颗星球改造一下呢？\n§Y将星球转换为足垢矿业星球，提供大量矿物、稀有资源加成，但环境会更恶劣，同时会造成大量的人口死亡与建筑破坏§!
  decision_gts_dirt_colony3_desc: "Since foot filth can be an excellent source of minerals, why don't we let the giantesses modify the planet again?\n§YTransforms the planet into a Foot Filth Mining Planet, providing large mineral and rare resource bonuses, but the environment will be worse, while also causing large amounts of deaths and the destruction of buildings.§!"
  # §R足垢星球农业化§!
  decision_gts_dirt_colony4: "§RAgriculturalize Foot Filth Planet§!"
  # 如果足垢能够作为农作物成长的肥料，那就让巨娘在这里再涂抹上一些吧！\n§Y将星球转换为足垢农业星球，提供大量食物加成，但环境会更恶劣，同时会造成大量的人口死亡与建筑破坏§!
  decision_gts_dirt_colony4_desc: "If foot filth can be used as a fertilizer for crop growth, then let the giantesses smear some more here!\n§YTransforms the planet into a Foot Filth Agricultural Planet, providing large food bonuses, but the environment will be worse, while also causing a large amount of deaths and building destruction.§!"
  # §R重新覆盖足垢§!
  decision_gts_dirt_colony5: "§RRe-cover with Foot Filth§!"
  # §Y蛤？好不容易清理干净了，现在还要再让巨娘踩一次？§!
  decision_gts_dirt_colony5_desc: "§YHuh? We finally managed to clean it and now we have to let the giantesses step on it again?§!"
  # >大气足臭净化<
  decision_gts_dirt_mod0_1: ">Atmospheric Foot Odor Purification<"
  # 通过大规模的空气净化设备移除§R刺鼻足臭§!，将空气转变为§Y可呼吸的足臭§!，改善居住环境。
  decision_gts_dirt_mod0_1_desc: "Remove the §Rpungent foot odor§! through large-scale air purification equipment, turning the air into §Ybreathable foot odor§!, improving the living environment."
  # >脚汗水体改造<
  decision_gts_dirt_mod0_2: ">Foot Sweat Water System Transformation<"
  # 利用重型工程器械疏通河道，解决§R脚汗纵横§!的问题，§Y脚汗水利工程§!将一定程度上改善星球水体的质量并提高粮食产出。
  decision_gts_dirt_mod0_2_desc: "Use heavy engineering machinery to dredge river channels, solving the problem of §Rfoot sweat overflowing§!, the §Yfoot sweat water conservancy project§! will improve the quality of the planet's water system and increase food production to a certain extent."
  # >足垢盾构机<
  decision_gts_dirt_mod0_3: ">Foot Filth Tunnel Boring Machine<"
  # 通过在足垢构成的山中大规模开凿隧道，能够解决§R足垢地貌§!带来的交通不便的问题，同时挖掘出的§Y足垢采掘地§!也能为我们提供更多的矿物产出。
  decision_gts_dirt_mod0_3_desc: "By excavating large-scale tunnels in the mountains formed of foot filth, we can solve the traffic inconvenience caused by the §Rfoot filth terrain§!, and at the same time, the excavated §Yfoot filth excavation site§! can also provide us with more mineral production."
  # >驱散汗雾<
  decision_gts_dirt_mod1_1: ">Disperse the Sweat Mist<"
  # 使用最新型的除湿设备，我们能大幅降低§R浓郁汗雾§!的面积，§Y温暖汗雾§!能够改善我们人民的生活水平并提高能源产出。
  decision_gts_dirt_mod1_1_desc: "Using the latest dehumidification equipment, we can greatly reduce the area of the §Rdense sweat mist§!, the §Ywarm sweat mist§! can improve our peoples' living standards and increase energy production."
  # >生态环境恢复<
  decision_gts_dirt_mod1_2: ">Ecosystem Restoration<"
  # 尽管星球遭受过巨足搓揉的待遇，但§R被破坏的生态§!依然可以尽力修复，§Y恢复的生态§!能让我们充分利用足垢残留物的优势去发展农业。
  decision_gts_dirt_mod1_2_desc: "Although the planet has suffered the treatment of being kneaded by giant feet, the §Rdamaged ecology§! can still be repaired as much as possible, the §Yrestored ecology§! allows us to take full advantage of the remaining foot filth to develop agriculture."
  # >清理残留足垢<
  decision_gts_dirt_mod1_3: ">Clean up the Remaining Foot Filth<"
  # 整颗星球的地表已经大部分复原了，但§R残留足垢§!仍然危害着当地生物生存，§Y足垢矿场§!的建立能够将这些足垢变废为宝，提高我们的矿物产出。
  decision_gts_dirt_mod1_3_desc: "The planet's surface has been mostly restored, but the §Rremaining foot filth§! still endangers the survival of local creatures, and the establishment of a §Yfoot filth mine§! can turn this foot filth into treasure and increase our mineral output."
  # >足臭气体收集<
  decision_gts_dirt_mod2_1: ">Foot Odor Gas Collection<"
  # §R刺鼻足臭§!并非只有害处，透过将其收集并处理，我们可以得到用于训练士兵的§Y极端环境训练场§!
  decision_gts_dirt_mod2_1_desc: "§RThe pungent foot odor§! is not only harmful, by collecting and processing it, we can obtain the §YExtreme Environment Training Grounds§! for training soldiers."
  # >高密度足汗结晶钻探<
  decision_gts_dirt_mod2_2: ">High-Density Foot Sweat Crystal Drilling<"
  # §R高密度足汗结晶§!曾一度被我们认为无法开采，但随着§Y足汗结晶提炼§!技术的发展，即便是坚硬的足汗结晶，也能够为我们带来大量的合金了。
  decision_gts_dirt_mod2_2_desc: "§RHigh-density foot sweat crystals§! we once thought could not be mined, but with the development of §Yfoot sweat crystal refining§! technology, even the hard foot sweat crystals can bring us a large amount of alloys."
  # >足垢地壳防御工事<
  decision_gts_dirt_mod2_3: ">Foot Filth Crust Defensive Fortifications<"
  # §R坚硬的足垢地壳§!在经过地下工事建设之后，就能够成为§Y足垢地壳堡垒§!，为我们带来更多防御设施的建设空间。
  decision_gts_dirt_mod2_3_desc: "The §Rhard foot filth crust§! can become a §Yfoot filth crust fortress§! after underground construction, providing us with more construction space for defense facilities."
  # >足臭气体精炼<
  decision_gts_dirt_mod3_1: ">Foot Odor Gas Refining<"
  # §R刺鼻足臭§!本是威胁我们人民生命的东西，现在经过精炼厂§Y稀有资源过滤§!后，能够为我们带来数量客观的稀有资源。
  decision_gts_dirt_mod3_1_desc: "§RThe pungent foot odor§! was originally a threat to our people's lives; now, after being filtered through the refinery's §Yrare resource filtering§!, it can bring us an objective amount of rare resources."
  # >足垢沉积物挖掘<
  decision_gts_dirt_mod3_2: ">Foot Filth Sediment Excavation<"
  # §R足垢沉积物§!来自于巨娘足底的反复碾压，我们如今利用§Y足垢冶炼工业§!可以将其转变为数不尽的矿石
  decision_gts_dirt_mod3_2_desc: "The §Rfoot filth sediment§! comes from the repeated grinding of giantess feet. Now with the help of the §Yfoot filth smelting industry§! we can turn it into countless ores"
  # >地核开采<
  decision_gts_dirt_mod3_3: ">Core Mining<"
  # 巨足的揉搓造成了§R破碎的地壳§!，在破坏了星球的同时，也让足垢混合着地底深处的矿物触手可及，§Y深核采掘§!工程将能够让我们获得大量的矿物。
  decision_gts_dirt_mod3_3_desc: "The squeezing of giant feet has caused the §Rbroken crust§!, and while destroying the planet also made the foot filth mixed with minerals deep in the ground accessible, the §Ydeep core mining§! project will enable us to obtain large amounts of minerals."
  # >足汗堆肥<
  decision_gts_dirt_mod4_1: ">Foot Sweat Compost<"
  # §R刺鼻足臭§!虽然对生物有害，但只要经过§Y足汗化肥精炼§!，就可以将其变为能够大幅增加农作物产出的神奇物质。
  decision_gts_dirt_mod4_1_desc: "Although the §Rpungent foot odor§! is harmful to living things, as long as it is processed by the §Yfoot sweat fertilizer refining§!, it can become a magical substance that can greatly increase crop production."
  # >足垢峡湾开垦<
  decision_gts_dirt_mod4_2: ">Foot Filth Fjord Reclamation<"
  # 巨足的挤压让地表遍布§R足垢峡湾§!，这样的地形无法开展大规模种植，我们需要将这些地区开垦成§Y足垢平原§!。
  decision_gts_dirt_mod4_2_desc: "The squeezing of giant feet has made the surface full of §Rfoot filth fjords§! which makes it hard to carryout large scale planting practices, we need to reclaim these areas into §Yfoot filth plains§!."
  # >足垢盾构机<
  decision_gts_dirt_mod4_3: ">Foot Filth Tunnel Boring Machine<"
  # 通过在足垢构成的山中大规模开凿隧道，能够解决§R足垢地貌§!带来的交通不便的问题，同时挖掘出的§Y足垢采掘地§!也能为我们提供更多的矿物产出。
  decision_gts_dirt_mod4_3_desc: "By excavating large-scale tunnels in the mountains formed of foot filth, we can solve the traffic inconvenience caused by the §Rfoot filth terrain§!, and at the same time, the excavated §Yfoot filth excavation site§! can also provide us with more mineral production."
  # 爱液世界
  col_gts_juice: "Love Juice World"
  # 一个充满涩情液体的星球，对任何生物来说都是涩涩的绝佳场所
  col_gts_juice_desc: "A planet full of erotic fluids, a great place for anything to be horny."
  # 整颗星球被巨娘的爱液海洋覆盖，空气中弥漫着浓郁的雌性荷尔濛雾气。地表常年处于温热潮湿的状态，所有水源都已被透明粘稠的爱液取代
  col_gts_juice_tt: "The entire planet is covered by the giantess's love fluid ocean, with the air filled with a dense mist of female hormones. The surface remains warm and humid year-round, and all water sources have been replaced by transparent, viscous love fluid."
  # 爱液星球
  pc_gts_juice: "Love Juice Planet"
  # 被巨娘塞进爱巢的可怜星球，汹涌的爱液浪涛不断冲刷着其上的文明\n其大气中充满了催情气体，一切生活在其中的生物都处于24小时发情的状态
  pc_gts_juice_desc: "A poor planet stuffed into a giantess's love nest, with surging waves of love juice constantly washing over its civilizations.\nThe atmosphere is full of aphrodisiac gases, and all creatures living in it are in heat 24 hours a day."
  # 爱液星球宜居度
  mod_pc_gts_juice_habitability: "Love Juice Planet Habitability"
  # 爱液星球偏好
  trait_pc_gts_juice_preference: "Love Juice Planet Preference"
  # 爱液星球偏好
  trait_pc_gts_juice_preference_desc: "Love Juice Planet Preference"
  # 斯卡蒂爱液星球
  pc_gts_juice2: "Love Juice Planet"
  # 被斯卡蒂领袖的爱液完全浸润的星球，是所有信徒所信仰的圣地\n其大气中充满了催情气体，一切生活在其中的生物都处于24小时发情的状态
  pc_gts_juice2_desc: "A planet completely immersed in Leader Skadi's love juice, is considered a holy land by all believers.\nThe atmosphere is full of aphrodisiac gases, and all creatures living in it are in heat 24 hours a day."
