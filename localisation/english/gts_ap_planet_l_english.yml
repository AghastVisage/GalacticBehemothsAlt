  # 整颗星球的海洋都由乳白色的巨娘乳汁构成，空气中弥漫着浓郁的奶香。虽然不建议直接饮用未处理的乳汁，但经过沉淀的乳汁是绝佳的农业肥料虽然所有食物都带着淡淡奶腥味，但产量足以养活数个世界。
  col_gts_milk_tt: "The entire planet's oceans are made of the giantess's milky white milk, with air filled with a dense milky fragrance. Although direct consumption of untreated milk is not recommended, settled milk is an excellent agricultural fertilizer. Although all food carries a slight milky scent, the yield is enough to feed several worlds."
  # 乳汁星球
  pc_gts_milk: "Milk Planet"
  # 一个被乳汁覆盖的可怜星球，不过高浓度的乳汁灌溉带来了肥沃的土壤\n虽然但是，不建议直接饮用未处理过的乳汁
  pc_gts_milk_desc: "A poor planet covered in milk, but the high concentrations of milk have brought fertile soil.\nHowever, it's not recommended to directly drink the unprocessed milk."
