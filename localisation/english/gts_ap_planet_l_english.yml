  building_gts_bruh_shit_system_capital_desc: "A large city deep in the feces, a hotbed for various plagues and corruption"
  # 粪便山
  gts_shit_colony_1: "Shit Mountain"
  # 巨大的粪便横在城市之间，周围的城市已经被粪便降临的震动震成废墟，其下有一个被挤压和封存的世界，所有人和建筑都被瞬间压成薄薄的一层，在上层的粪便层之下，形成了独特的旧世界考古层，述说着这个世界的悲惨经历
  gts_shit_colony_1_desc: "Huge piles of feces lie between cities, and the surrounding cities have been turned into ruins by the vibrations of the feces' arrival. Below this, there is a compressed and sealed world where everyone and every building have instantly been pressed into a thin layer. Beneath the upper layer of feces, a unique old-world archaeological layer has formed, telling the tragic story of this world."
  # 尿液湖
  gts_shit_colony_2: "Urine Lake"
  # 山脉之间出现了一滩巨型的尿液湖。因为其深度之深，达到了地热层，尿液和屎水已经渗入了整个星球水系，由于我们可爱的巨娘排泄过于多，似乎超出了自然的承受范围。在可预见的遥远未来。这里的水源不会被净化了。只能由我们本土居民努力演化适应了
  gts_shit_colony_2_desc: "A giant lake of urine has appeared between the mountains. Because of its great depth, it reaches the geothermal layer. Urine and shit water have seeped into the entire planet's water system. Due to the excessive amount of discharge by our lovely giantesses, it seems to exceed what is nature capable of handling, and it seems the water source cannot be purified in the foreseeable future, and can only be adapted to by our local residents."
  # 污秽大气
  gts_shit_colony_3: "Foul Atmosphere"
  # 这里的大气完全被少女的大便的气息同化了，空气中弥漫的排泄味。可能这就是想要丰收的必然代价
  gts_shit_colony_3_desc: "The atmosphere here is completely assimilated by the scent of a maiden's stool, and the air is filled with the smell of excrement. Perhaps this is the inevitable price for wanting a good harvest."
