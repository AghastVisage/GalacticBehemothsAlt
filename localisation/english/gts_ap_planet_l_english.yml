  # 地下掩体城市
  district_dirt0_1: "Underground Shelter City"
  # 这颗星球的土地、大气与水源已经被巨娘的足垢和汗液彻底污染，地表世界不再适合居住.那些仍选择留在此地的居民生活在四通八达的地下掩体，通过深层地铁与航天飞船进行对外联系.
  district_dirt0_1_desc: ""The planet’s soil, atmosphere, and water sources have been thoroughly contaminated by the Giantess’s foot grime and sweat, rendering the surface world uninhabitable. The residents who have chosen to remain here live in an extensive network of underground shelters, maintaining contact with the outside world via an extensive subway system and space shuttles.""
  # 地下掩体城市
  district_dirt0_1_plural: "Underground Bunker City"
  # 足垢冶炼矿区
  district_dirt0_2: "Foot Filth Smelting Mine"
  # 这颗星球上的一切地形地貌、城市乡村，都在巨足揉搓下化作齑粉，岩浆与足汗混合，变成覆盖全球的足垢大陆.无论是足垢本身，亦或是随着岩浆升涌而出的无数贵金属，对这颗星球的幸存者来说都是待开发的财富.
  district_dirt0_2_desc: ""Every feature of this planet’s landscape—cities and villages alike—was ground to dust beneath the giant foot’s crushing force; magma mixed with the foot’s sweat, transforming into a continent of foot grime that covered the entire globe. Whether it is the foot grime itself or the countless precious metals rising with the magma, both represent untapped wealth for the planet’s survivors.""
  # 足垢冶炼矿区
  district_dirt0_2_plural: "Foot Dirt Smelting Mining Area"
  # 足汗水培区
  district_dirt0_3: "Foot Sweat Hydroponics Area"
  # 这颗星球原有的地表水都被巨娘的袜足洗干抹净，只留下了充分发酵的足汗海.虽然不再适合饮用，但这些富含巨娘神力的液体可以被用作完美的植物营养液.
  district_dirt0_3_desc: ""All of the planet’s original surface water had been thoroughly washed away by the Giantess’s stocking-clad feet, leaving behind nothing but a sea of fully fermented foot sweat. Although no longer suitable for drinking, this liquid—rich in the Giantess’s divine power—can be used as the perfect plant nutrient solution.""
  # 足汗水培区
  district_dirt0_3_plural: "Foot Sweat Hydroponics Area"
