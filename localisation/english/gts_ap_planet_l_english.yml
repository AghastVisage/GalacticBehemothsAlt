  # §Y[Root.GetName]§!表面干燥而无趣，除了沙漠就是干燥的草原，以至于连博士小姐的肉棒都因感到无趣而勃起不能。但是考虑到地表上还有数以亿计的小人“期待着”自己的到来，博士小姐还是打起精神来，褪下自己的内裤，露出遮天蔽日的巨大肉棒。\n\n博士小姐一边想象着地上小家伙们无助的样子，一边毫不留情地用力上下撸动肉棒。终于，精液从马眼喷射而出，数以亿万吨的精液在沙漠上横行，比山脉还要高大数十倍的白浊海啸横扫着地上的一切，数以百计的城市和其中的居民，连反应的时间都没有，就被精液抹平了在这颗行星上存在过的痕迹。\n\n然而博士小姐一点也没有感到满足，她用肉棒戳弄着这颗可怜的星球，在上面用精液涂鸦着自己的画像。但是混合着城市废墟和几百万小人残躯的精液显然画不出什么像样的东西，博士小姐很快就感到厌倦了。为了赶快发泄自己的性欲，她用双手直接抓住沾满精液的星球，蛮横地来回地蹭着自己欲求不满的肉棒，整颗行星的地壳都险些破裂，巨大的阴茎撕裂着一切，卷起遮天蔽日的沙暴，无数小人只能祈求着这一切快点结束，而头上传来的娇喘声表示末日已近。当博士小姐的龟头抵着§Y[Root.GetName]§!喷发时，整颗星球都能感受到肉棒的剧烈震颤，城市甚至大陆甚至被精液包裹着喷进太空之中，成为了永远也无法返回家园的生态圈，而更多的精液随着重力降落下来，落在大地上和博士小姐的制服上，让她显得无比妩媚。见到这颗行星终于被精液所覆盖，她轻轻用脸蹭着粘稠的大地，用舌头品尝着自己的作品，感受着自己给§Y[Root.GetName]§!带来的新生。\n\n§Y[Root.GetName]§!的地表已经不能承受更多的精液了，但博士小姐好像还没有满足……至于这颗行星上的居民，他们很快就会为自己的家园变得生机勃勃而兴奋起来的。
  gts_ap_planet.3004.desc: "§Y[Root.GetName]§! has a surface that is dry and boring, covered almost entirely by deserts and dry grasslands, so much so that even the Doctor's meat rod couldn't get erect due to boredom. However, considering there are billions of tiny people on the surface \"expecting\" her arrival, the Doctor pulled herself together, took off her panties, revealing the sky-obscuring giant meat rod.\n\nThe Doctor ruthlessly jerked her meat rod up and down vigorously while imagining the helpless look of the little guys on the ground. Finally, semen sprayed from the urethra. Billions of tons of semen rampaged across the desert. A tsunami of white turbidity, dozens of times higher than mountains, swept everything on the ground. Hundreds of cities and their inhabitants had their traces on this planet erased by semen without even time to react.\n\nHowever, the Doctor did not feel satisfied at all. She poked this pitiful planet with her meat rod, graffitiing her own portrait on it with semen. But semen mixed with city ruins and the remains of millions of tiny people obviously couldn't draw anything decent. The Doctor soon got bored. To vent her sexual desire quickly, she grabbed the semen-covered planet directly with both hands and rubbed her unsatisfied meat rod back and forth savagely. The crust of the entire planet was nearly shattered. The giant penis tore everything apart, kicking up sandstorms that blocked out the sun. Countless tiny people could only pray for this to end quickly, while the moans from above signaled that the end was near. When the Doctor's glans pressed against §Y[Root.GetName]§! and ejaculated, the entire planet could feel the violent tremor of the meat rod. Cities and even continents were wrapped in semen and sprayed into space, becoming biospheres that could never return home, while more semen fell with gravity, landing on the ground and the Doctor's uniform, making her look incredibly charming. Seeing this planet finally covered by