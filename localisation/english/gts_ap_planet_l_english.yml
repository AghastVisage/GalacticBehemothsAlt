  # \"唔，很抱歉，§Y[Root.GetName]§!的大家被选中了\"随着略显甜美的声音从天空传来。§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!怯生生地从堪比星球的飞船上探出身来\n\n随着轰隆几声巨响，巨大的嫩绿色玛丽珍鞋不仅仅踏平了附近的山脉，顺便踩平了几座倒霉的城镇，深入地下几十米的脚印，构成了一个个巨型的脚印峡谷\n\n\"那个.....这个大小应该合适吧。\"\n\n无视了胯下无数的城市和里面的抗议声音。§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!在得到许可后，缓缓的脱下了自己的纯白内裤\n\n\"这个选址可不算我选的呀！不要怨我呀！\"\n\n§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!害羞的红着脸，半蹲下来，星球的地脉吱嘎吱嘎的作响\n\n\"唔....好害羞啊"\n\n随着少女嗯~嗯~的用力声，巨大的菊穴缓缓敞开，伴随着女孩\"呀\"的一声尖叫，菊穴喷出了恶臭的气体。像空中爆炸一样瞬间将周围的山脉和一些小城市上层削平了。仿佛是为了之后的粪便清理空间一样\n\n\"啊.....非常对不起！..对不起，对不起。啊呜呜！！\"\n\n羞红了脸的§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!再次使劲，这次棕色的巨大粪便才不紧不慢的从少女的菊穴冒了出来，冒着热气的粪便被行星的引力吸引笔直地垂了下来\n\n唔...稍稍感觉到粪便的尖端碰到了行星，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!稍稍收紧肛门，切断了粪便，失去支撑的粪便突然倾斜，径直的倒向了城市一方\n\npong！一声巨响，如同地震一般，城市的建筑大多都被震碎了。而对于周围幸存的小人来说，临近的粪便的热风像冲击波一样蔓延开来，仿佛想要强迫所有人接受一样，即便是捂住鼻子，屏住呼吸，身体的感官也不由自主的也在感受着这股热风\n\n"水！水！"\n\n热风导致了脱水，这可能是所有幸运者的心声\n\n可是这才是第一波。紧接着，巨大的肛门再次蠕动起来，又一条粪便降临人间\n\n"呀！抱歉"\n\n§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!似乎搞砸一般叫了一声，随后害羞的继续使劲，而不由自主收紧的肛门，将还未抵达地面粪便一分为二。失去支撑的粪便轰的一声砸了下来。整个星球都似乎感受到了这种冲击。但这还没有结束，伴随着§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!嗯~嗯~的使劲声音，第三条，第四条相近降临，周围的热浪更是一轮高过一轮\n\n突然，滴答....滴答....渐渐的从天而降的温热液体拯救了几乎绝望的人们。或许已经无需去在意味道了。而在远处，巨型的金色瀑布正在喷涌的冲击着山脉，随着而来的还有因为冲击溅向各地的\"甘霖\"\n\n\"呼！\"\n\n上完厕所的§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!，叹了口气\n\n\"那个.....这个....可是天然的肥料哦，请妥善处理...嘻嘻\"\n\n说着便自顾自的害羞起来，快速的提起裤子，整理好衣服后，羞着脸小步慢跑进远处的飞行船，再次留下一连串脚印峡谷
  gts_ap_planet.5001.desc: "\"Oh, I'm sorry, everyone on §Y[Root.GetName]§! was chosen.\" A slightly sweet voice came from the sky. §M[event_target:gts_planet_leader.GetName]§! timidly leaned out of a spaceship the size of a planet.\n\nWith a few loud booms, huge tender green Mary Jane shoes not only flattened the nearby mountains, but also flattened a few unlucky towns as a side effect. The footprints that plunged tens of meters into the ground formed huge footprint canyons.\n\n\"Um... is this size suitable?\"\n\nIgnoring the countless cities under her crotch and the protest sounds inside, §M[event_target:gts_planet_leader.GetName]§!, after receiving permission, slowly took off their pure white panties.\n\n\"This selection was not chosen by me! Don't blame me!\"\n\n§M[event_target:gts_planet_leader.GetName]§! blushed shyly, crouched down halfway, and the planet's earth pulse creaked and cracked.\n\n\"Oh.... so shy\"\n\nAs the maiden made a grunting sound, her huge anus slowly opened, and accompanied by the girl's shriek of \"Yah\", the anus spewed out putrid gas. It was like an explosion in the air that instantly shaved the upper layers of the surrounding mountains and some small cities, as if the space for the subsequent excrement cleanup would be made.\n\n\"Ah..... I'm very sorry！..Sorry, sorry. Aah wuwuu!!\"\n\n§M[event_target:gts_planet_leader.GetName]§! blushed with shame and exerted herself again. This time, the huge brown feces slowly emerged from the maiden's anus, and the steaming feces were attracted by the planet's gravity and hung down vertically.\n\nUm... slightly feeling the tip of the feces touch the planet, §M[event_target:gts_planet_leader.GetName]§! tightened her anus slightly, cutting off the feces. The feces, losing their support, suddenly tilted and fell straight towards the city.\n\nBang! With a loud noise, like an earthquake, most of the city's buildings were shattered. For the surviving small people around, the hot wind of the nearby excrement spread like a shockwave, as if trying to force everyone to accept it. Even if they cover their noses and hold their breath, their body's senses could not help but feel this hot wind.\n\n\"Water! Water!\"\n\nHypovolemia caused by the hot wind, this might be the common thought of all those who were lucky enough to survive.\n\nBut this was just the first wave. Immediately after, the huge anus began to writhe again, and another feces descended upon the earth.\n\n\"Yah! Sorry\"\n\n§M[event_target:gts_planet_leader.GetName]§! seemed to cry out as if she had messed up. Then she continued to exert herself shyly, and her involuntary tightening of the anus divided the feces that had not yet reached the ground into two. The feces that lost their support crashed down with a bang. The entire planet seemed to feel this impact, and that wasn't the end. Along with §M[event_target:gts_planet_leader.GetName]§!'s oh-oh grunts, the third and fourth similar poop descended and the surrounding heat waves were even higher than before.\n\nSuddenly, drop... drop... gradually, warm liquid that was descending from the sky saved the almost desperate people. Perhaps it was no longer necessary to care about the taste. And in the distance, a giant golden waterfall was gushing and impacting the mountains, along with the \"manna\" that splashed in all directions due to the impact.\n\n\"Huh!\"\n\n§M[event_target:gts_planet_leader.GetName]§!, who had finished using the toilet, sighed.\n\n\"That... this is... natural fertilizer, please handle it properly... hee hee\" \n\nThen she blushed with shame on her own terms, quickly pulled up her pants, tidied up her clothes, and ran shyly into the faraway flying ship, leaving another series of footprint canyons."
