  # 被压扁的城市
  d_dirt_ruin1: "Crushed Cities"
  # 一大片城区在巨娘搓揉星球的过程中被碾碎。
  d_dirt_ruin1_desc: "A large area of the city has been crushed during the giantess's kneading of the planet."
  # 黏在脚上的幸存者
  d_dirt_ruin2: "Survivors Stuck on Feet"
  # 有些幸存者还留在巨娘的脚上，我们可以去她的鞋子里把这些人救出来。
  d_dirt_ruin2_desc: "Some survivors are still stuck to the giantess's feet, we can go to her shoes and rescue them."
  # 足垢山
  d_dirt_ruin3: "Foot Filth Mountains"
  # 巨娘足底的足垢构成了这些高耸的山脉，在清理掉之前无法进行任何建设工作
  d_dirt_ruin3_desc: "The foot filth from the soles of the giantess's feet forms these towering mountains, no construction work can be carried out until they are cleared away."
  # 清理出的足垢采集地
  d_dirt_clean1: "Cleared Foot Filth Collection Site"
  # 对足垢山的清理使得山脉中的充沛足垢暴露出来，我们现在可以开采这些足垢并精炼成矿物了。
  d_dirt_clean1_desc: "The clearing of the foot filth mountains exposes the abundant foot filth in the mountains, we can now mine this foot filth and refine it into minerals."
  # 足汗海
  d_dirt_ruin4: "Foot Sweat Sea"
  # 足汗构成的汪洋大海，几乎没有生物能在这里生存。
  d_dirt_ruin4_desc: "A vast sea formed of foot sweat, hardly any life can survive here."
  # 足汗灌溉的土地
  d_dirt_clean2: "Foot Sweat Irrigated Land"
  # 透过各种水利工程的作用，这些饱含营养物质的足汗能够灌溉大片大片的农田。
  d_dirt_clean2_desc: "Through the action of various water conservancy projects, this nutrient-rich foot sweat can irrigate large areas of farmland."
  # 致命汗雾
  d_dirt_ruin5: "Deadly Sweat Mist"
  # 来自巨娘足底残留的气味，这些雾气环绕在这里，任何试图进去的人都再也没能出来。
  d_dirt_ruin5_desc: "The odor from the remains of the giantesses' feet, these mists linger here, anyone who tries to go inside has never come back."
  # 稀薄汗雾
  d_dirt_clean3: "Thin Sweat Mist"
  # 虽然吸入仍使人感到不适，但已经可以让工人们短期内进入工作了，我们可以提取到很多稀有资源。
  d_dirt_clean3_desc: "Although it is still uncomfortable to inhale, it already allows workers to enter for a short period of time, and we can extract many rare resources."
  # 足印污染区
  d_dirt_ruin6: "Footprint Contaminated Area"
  # 这些仿佛陨石坑一般的足印中的残留物浓度太高了，以至于周围根本没有生物存在的痕迹。
  d_dirt_ruin6_desc: "The concentration of residue in these crater-like footprints is too high, there is no trace of life existing around them."
  # 坚不可摧的足垢地壳
  d_dirt_ruin7: "Indestructible Foot Filth Crust"
  # 被巨足踩的结结实实的地面，坚硬到可以抵御核弹的轰炸。
  d_dirt_ruin7_desc: "The ground is so solid that it can withstand a nuclear bomb because of the giant feet that stomped on it."
  # 硕大的足汗结晶
  d_dirt_ruin8: "Large Foot Sweat Crystals"
  # 在高温高压下形成的足汗结晶，由于过于坚硬，因此无法清理这片区域。
  d_dirt_ruin8_desc: "Foot sweat crystals formed under high temperature and pressure, and it is impossible to clean this area due to their hardness."
  # 足汗结晶采集场
  d_dirt_clean4: "Foot Sweat Crystal Collection Site"
  # 被打碎的足汗结晶，可以轻易的搬走。
  d_dirt_clean4_desc: "The crushed foot sweat crystals can be easily moved away."
  # 被揉碎的地壳
  d_dirt_ruin9: "Kneaded Crust"
  # 星球的外壳被巨娘破坏了，碎裂的地表没办法进行任何建设。
  d_dirt_ruin9_desc: "The outer shell of the planet has been destroyed by the giantess, and no construction can be carried out on the shattered surface."
  # 地核采矿竖井
  d_dirt_clean5: "Core Mining Shaft"
  # 借助这些深入地幔的裂谷，我们可以挖掘到那些珍贵的矿物。
  d_dirt_clean5_desc: "With the help of these rifts into the mantle, we can mine those precious minerals."
  # 足垢峡湾
  d_dirt_ruin10: "Foot Filth Fjords"
  # 足垢峭壁间流淌着足汗构成的湍急河流，这种地形无法进行大面积种植。
  d_dirt_ruin10_desc: "Rapid rivers of foot sweat flow between the foot filth cliffs, and this terrain makes it impossible to carry out large-scale planting."
  # 足垢平原
  d_dirt_clean6: "Foot Filth Plains"
  # 黝黑的足垢构成了大片的平原，无数的农作物可以在此成长。
  d_dirt_clean6_desc: "Large swathes of plains are made of black foot filth, where countless crops can grow."
  # 需要先改良足垢地貌！
  d_dirt_ruin3_fail1: "You need to improve the foot filth terrain first!"
  # 需要先清理残留足垢！
  d_dirt_ruin3_fail2: "You need to clean up the remaining foot filth first!"
  # 需要先清理足垢沉积物！
  d_dirt_ruin3_fail3: "You need to clean up the foot filth sediment first!"
  # 需要先纾解脚汗纵横问题！
  d_dirt_ruin4_fail1: "You need to alleviate the foot sweat overflowing issue first!"
  # 需要先恢复被破坏的生态！
  d_dirt_ruin4_fail2: "You need to restore the damaged ecology first!"
  # 需要先开发足垢峡湾！
  d_dirt_ruin4_fail3: "You need to develop the foot filth fjords first!"
  # 需要先消除刺鼻足臭！
  d_dirt_ruin5_fail1: "You need to eliminate the pungent foot odor first!"
  # 需要先清理浓郁汗雾！
  d_dirt_ruin5_fail2: "You need to clear up the dense sweat mist first!"
  # 需要先恢复被破坏的生态！
  d_dirt_ruin6_fail1: "You need to restore the damaged ecology first!"
  # 需要先开发坚硬的足垢地壳！
  d_dirt_ruin7_fail1: "You need to develop the hard foot filth crust first!"
  # 需要先开发高密度足汗结晶！
  d_dirt_ruin8_fail1: "You need to develop high-density foot sweat crystal first!"
  # 需要先开发破碎的地壳！
  d_dirt_ruin9_fail1: "You need to develop the broken crust first!"
  # 需要先开发足垢峡湾！
  d_dirt_ruin10_fail1: "You need to develop the foot filth fjords first!"
  # 爱液星球改造
  gts_ap_planet.1000.name: "Love Juice Planet Transformation"
  # 随着轰隆隆的一声巨响，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的面孔出现了大气层外\n\n两根巨大的手指小心翼翼地夹起了§Y[Root.GetName]§!，然后缓缓张开双腿，将那早已饥渴难耐的粉色嫩肉小穴暴露在整个殖民地的上空\n\n"呼——我会很小心的！"\n\n随着少女的嘟囔，整个星球冷不防地被直接送入了少女的小穴之内！伴随着一声声甜蜜的呻吟，无边无际的嫩肉挤压着§Y[Root.GetName]§!的地表，滚烫的爱液分泌而出，咕啾咕啾地挤压着这可怜的小星球\n\n"嗯啊…好紧啊…"\n\n§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!发出一声满足的呻吟，她的手指在小穴口周围抚弄着，以某种引导的姿态让小行星缓缓陷入体内，在这缓慢的深入过程中，§Y[Root.GetName]§!几乎要被内里那片火热潮湿的嫩肉与爱液所构成的海洋完全吞噬，随着阴道的蠕动愈演愈烈，周遭的嫩肉开始变得饱满滚烫起来，将小行星越裹越紧，几欲将之层层殆尽\n\n满溢的爱液也越流越多，顺着大腿根部滑落在浩瀚的星空中，这股腥臊的液体就这样遥遥地飘向无垠的太空深处，与遥远的星系融为一体\n\n"呜——哇～有那么多人，在我的小穴里～"\n\n一声淫叫传来，只见那嫩肉蠕动地更加疯狂，一些根基不稳的建筑直接被挤碎卷入了爱液与软肉中，然后是一阵舒爽的娇喘，少女的潮吹让那洪流般的爱液喷薄而出，裹满了整个星球！\n不一会，那小星球啵的一声被直接喷了出来，还黏着§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的小穴拉出来一根爱液银丝\n\n事后，工程师估计至少需要近百年的时间才能将这裹满星球的巨量爱液清理干净\n\n当§Y[Root.GetName]§!被喷射到数百万公里外的太空时，星球已经完全变了样，原本蔚蓝的海洋现在变成了淫靡的半透明爱液，§Y[Root.GetName]§!上所有水源都被替代成了爱液，大气中飘荡着浓郁的雌性荷尔濛雾气。\n\n§R[Root.gts_bruh_get_planet_killed_pop_count]§!个人口在阴道中丧命，成为了少女阴道皱褶间的微小污渍。§R[Root.gts_bruh_get_planet_destroyed_city_count]§!座城市被爱液洪流彻底冲毁，遗留在了小穴深处
  gts_ap_planet.1000.desc: "With a loud rumble, the face of §M[event_target:gts_planet_leader.GetName]§! appeared outside the atmosphere.\n\nTwo huge fingers carefully picked up §Y[Root.GetName]§!, then slowly spread open her legs, exposing her pink, tender, and already hungry flower-cunt to the entire colony.\n\n\"Hoo~ I'll be very careful!\"\n\nWith the maiden's mutter, the entire planet was suddenly sent directly into the maiden's flower-cunt! Accompanied by sweet moans, the boundless tender meat squeezed the surface of §Y[Root.GetName]§!, and hot love juice secreted out, squelching and squeezing the poor little planet.\n\n\"Mmm...so tight...\"\n\n§M[event_target:gts_planet_leader.GetName]§! let out a satisfied moan, her fingers caressing the area around the entrance of her flower-cunt, guiding the small planet to slowly sink into her body. During this slow and deep entry, §Y[Root.GetName]§! was almost completely swallowed by the ocean of hot, wet tender meat and love juice, and as her flower core writhed more and more intensely, the surrounding tender meat began to become full and hot, wrapping the small planet tighter and tighter, almost crushing it to bits.\n\nThe overflowing love juice also flowed out more and more, sliding down the roots of her thighs and into the vast space, this stinky liquid drifted far into the depths of space, merging with distant galaxies.\n\n\"Ooh~wa~ so many people in my flower-cunt~\"\n\nA lewd cry came, and the tender meat could be seen writhing even more wildly. Some unstable buildings were directly crushed and rolled into the love juice and soft meat. Then there was a comfortable gasp. The maiden’s orgasm caused a torrent of love juice to gush out, covering the entire planet! A moment later, the little planet was sprayed out with a pop, with a thread of love juice still sticking to the flower-cunt of §M[event_target:gts_planet_leader.GetName]§!.\n\nAfterwards, engineers estimated that it would take at least a hundred years to clean up the massive amount of love juice that covered the planet."
  # 现在我们有了一颗爱液星球！
  gts_ap_planet.1000.a: "Now we have a Love Juice planet!"
