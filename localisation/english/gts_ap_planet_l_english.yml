  # §Y[Root.GetName]§!是如此的冰冷，以至于上面的洁净的积雪千万年都未曾融化过。所以博士小姐一想到这些壮美的冰川要被自己的白浊所玷污……她感到一阵阵兴奋，还有些许罪恶感。在这种罪恶感的鼓动下，博士小姐近万公里长的巨根早已按捺不住冲出内裤之外，在即将被凌辱的行星上投下遮天蔽日的阴影。行星上的居民绝望地看着天空，而野生动物也躁动起来，无谓的寻找可以避难的地方。\n\n博士小姐迫不及待地用手撸动着巨大的阴茎，还用灼热的龟头搅动着高层大气，先导汁伴着淫秽的腥臭卷起一股股温暖的风暴，让高山上的积雪变成雪崩滚落下来，但是和接下来所到来的就是小事一桩了。很快，第一次射精就降临了，一坨巨大的精液直接冲撞在地壳上，把曾经最高最圣洁的雪山，直接砸碎成大气层中的亿万碎片，而地上只留下了一片沸腾腥臭的大海。难以计数的山体碎片和数不胜数的精液块化作点燃天空的流星雨，平等地降落到星球的整个表面，把直接暴露于其下的大地和城市都变成了泥泞又淫靡的温热沼泽。\n\n然而博士小姐还没有结束，她的巨根依然灼热而坚挺着，于是就将滴落着天体级精液的阴茎直接抵到另一个半球上去。冒着热气的肉棒直接把冻土融化，变成了泥泞的湿地，无数来不及逃脱的小人，在没被碾碎之前，就被滚烫的分泌物和精液给煮熟了。博士小姐用双手轻轻地抱着沾满精液的星球，来回地蹭着自己灼热跳动的肉棒，冰冷的冻土刺激着灼热的龟头，喷发而出的精液变成了新的大海，数以亿万计鲸鱼般的巨大精子在其中游动着，欢呼雀跃地捕食着还在挣扎的小人们。粘稠又温热的精液终于覆盖了整个星球，白浊的粘液融化了整座星球，变成了无边的海洋和沼泽，甚至连近地轨道上都布满着星星点点的精液环带。完成使命的博士小姐轻轻地用手划过这颗星球乳白色的表面，撇走一些多余的精液好让一些小人还能生存在粘稠的湿地上。她用柔软的舌头，品尝着自己的种子的味道，连带着把几百万幸存者一起温柔地吞进肚子里。从舌尖滴下的精液粘在了制服上，让博士小姐显得无比地妩媚。\n\n§Y[Root.GetName]§!的地表已经不能承受更多的精液了，但博士小姐好像还没有满足……至于这颗行星上的居民，他们很快就会为自己的家园变得生机勃勃而兴奋起来的。
  gts_ap_planet.3003.desc: "§Y[Root.GetName]§! is so cold that the clean snow on it has not melted for millions of years. So when the Doctor thinks that these magnificent glaciers are about to be stained by her white turbidity... she feels a burst of excitement, and a hint of guilt. Encouraged by this guilt, the Doctor's giant root nearly ten thousand kilometers long could no longer be held back and burst out of her panties, casting a sky-obscuring shadow over the planet about to be humiliated. The inhabitants of the planet looked desperately at the sky, while wild animals became restless, searching futilely for places to hide.\n\nThe Doctor impatiently stroked her huge penis with her hand, and also stirred the high-level atmosphere with her hot glans. Precum mixed with obscene fishy smell rolled up waves of warm storms, causing snow on high mountains to turn into avalanches and roll down, but compared to what was coming next, it was just a piece of cake. Soon, the first ejaculation arrived, a huge lump of semen smashed directly on the crust, smashing the once highest and holiest snow mountain into billions of fragments in the atmosphere, leaving only a boiling fishy sea on the ground. Countless mountain fragments and countless semen blocks turned into meteor showers igniting the sky, falling equally on the entire surface of the planet, turning the directly exposed land and cities into muddy and obscure warm swamps.\n\nHowever, the Doctor was not finished yet. Her giant root remained hot and erect, so she pressed the penis dripping with celestial-grade semen directly onto another hemisphere. The steaming meat rod directly melted the frozen soil, turning it into muddy wetlands. Countless tiny people who had no time to escape were boiled by the hot secretions and semen before being crushed. The Doctor gently hugged the semen-covered planet with both hands, rubbing her hot throbbing meat rod back and forth. The cold frozen soil stimulated the hot glans, and the gushing