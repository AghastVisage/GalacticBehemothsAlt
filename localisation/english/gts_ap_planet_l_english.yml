  # 不行！不行啦！！呀！！"\n\n我们的萝莉实验员被有幸选为了这个项目的执行者\n随着轰隆一声巨响，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!和萝莉实验员出现在天空中，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!坏笑着看着萝莉实验员，用两根巨大的手指，小心翼翼的§Y[Root.GetName]§!，趴在了萝莉的身前\n\n\"真的要这样吗！！\"\n\"这是命令！\"\n\"呜......\"\n\n萝莉害羞的缓缓地崛起了屁股。将略微带有土色的菊穴展露在§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!和§Y[Root.GetName]§!面前\n\n\"我会温柔一些啦！\"\n\n"呀！！！"随着萝莉的尖叫整个星球被直接塞进了萝莉的菊穴中，呜.....呜......有异物！好不舒服。随着萝莉泪汪汪的哭泣，菊穴在缓慢的蠕动着。似乎在试图抵消这种异物的感觉。而在屁股内，无尽的肉壁和残余粪便挤压着§Y[Root.GetName]§!的表面，瞬间抹杀掉了所有居住者和建筑\n\n\"大家，都被我的屁股吃掉了，然后在屁股里，死掉了\"\n萝莉泪汪汪的叙说着\n\n\"好难受。但是要夹着这个待上一天\"\n萝莉夹着屁股，继续蠕动着菊穴，周围的肉壁越来越紧，随之而来的§Y[Root.GetName]§!上的土地被一层层剥离出来，融进周围的粪便中，而对应的，星球在众多粪便的挤压下被一遍遍的涂满粪便\n\n第二天\n"呜.......!"\n在相关工程师的盯着下，萝莉走进了专用的回收装置，在纵目睽睽之下，脱下了内裤，进行排便\n而出来的星球已经变成了一枚包裹着排泄的土褐色星球，上面的所有土地已经完全被粪便所取代，死掉的建筑和人们被压紧压实，保留在巨型的粪便层之下，或许未来，在后续居住者的挖掘下，他们还可以重见天日，不过可以预见，这将是一个非常利于农作物生长的星球
  gts_ap_planet.5000.desc: "\"No! I can't! Ahh!\" \n\nOur loli researcher was fortunate enough to be selected as the executor of this project. With a loud rumble, §M[event_target:gts_planet_leader.GetName]§! and the researcher appeared in the sky. §M[event_target:gts_planet_leader.GetName]§! looked at the loli with a playful grin, then, carefully and with two massive fingers, §Y[Root.GetName]§! was positioned in front of the loli's private area.\n\n\"Is this... really going to happen?!\"\n\"It's an order!\"\n\"Ugh...\"\n\nThe embarrassed loli slowly raised their hips, revealing the somewhat soiled opening to §M[event_target:gts_planet_leader.GetName]§! and §Y[Root.GetName]§!.\n\n\"I'll be gentle!\" \n\n\"Aahh!!!\" With the loli's scream, the entire planet was inserted directly into the researcher, Ugh... Ugh... Foreign object! So uncomfortable. As tears welled up in the researcher's eyes, the opening slowly started to contract, seeming to try and negate the feeling of the foreign object. Inside, the endless walls of flesh and residual waste pressed against the surface of §Y[Root.GetName]§!, instantly obliterating all inhabitants and structures. \n\n\"Everyone... has been eaten by my backside, and then died inside...\" the loli recounted through watery eyes.\n\n\"It feels terrible. But I have to keep this here for a day.\" The researcher continued to contract their opening, their muscles getting tighter, peeling off the soil on the surface of §Y[Root.GetName]§! layer by layer, which then mixed with the surrounding waste. Simultaneously, under the pressure of the waste, the planet was smeared with excrement again and again.\n\nThe next day:\n\"Ugh... !\"\nUnder the gaze of the overseeing engineers, the loli walked into a special recovery device. Before everyone's eyes, they removed their undergarments and defecated. What emerged was a brownish-grey planet covered in excrement. The original soil was entirely replaced by waste. The remains of the deceased inhabitants and buildings were packed tightly beneath the massive waste layer. Perhaps, in the future, through excavation by the next inhabitants, they might see the light again, but it was anticipated that this planet was now exceptionally suitable for the growth of crops."
