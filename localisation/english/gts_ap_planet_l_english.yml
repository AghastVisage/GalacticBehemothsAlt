  # 巨大精子
  gts_semen_colony_2: "Giant Sperm"
  # 不知怎么，这群巨大的小家伙们竟然保持着活性——或许我们可以驯服它们来为我们所用？
  gts_semen_colony_2_desc: "I don't know how, these giant little guys are still active - maybe we can tame them to be of use to us?"
  # 射精遗迹
  gts_semen_colony_3: "Ejaculation Ruins"
  # 深达地幔是一道巨大冲击坑如疮疤一般覆盖在精液海之下，这便是扶她娘射精的伟迹——当然现在已经是热门旅游景点了
  gts_semen_colony_3_desc: "Reaching deep into the mantle is a giant impact crater like a scar beneath the ocean of semen; this is the great trace of the futa's ejaculation - of course, it is now a popular tourist attraction."
  # 精液星球
  pc_gts_semen: "Semen Planet"
  # 这颗星球被高密度的精液海洋覆盖，数以亿计的超巨型精子统治着这颗星球\n浓稠的精液污染了所有的水源，所有的植物或动物都需要依赖于精液才能生存下去
  pc_gts_semen_desc: "This planet is covered by a high-density ocean of semen, and billions of super-giant sperm rule this planet.\nThe viscous semen has polluted all water sources, and all plants and animals need to rely on semen to survive."
