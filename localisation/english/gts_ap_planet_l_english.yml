  gts_ap_planet.5004.desc: "§Y[Root.GetName]§! is a boring dry planet, with boundless deserts and savannas covering almost everything. Sonxi had long been impatient, planning to flex her muscles and reshape it into the way she liked.\n\nHowever, perhaps because she ate and drank too much yesterday, or due to some turbulence in hyperspace, when Sonxi arrived at §Y[Root.GetName]§!, even though she was covering her panties with her hand, holy water was already constantly flowing out. She had no time to take off her panties; instantly, holy urine and filthy feces poured out together, completely soaking the originally pristine white cotton panties, dyeing them a strong tea color.\n\nFor the first time, Sonxi felt so shy in front of tiny people. Even as a celestial giantess who often uses planets for masturbation, pulling in her pants in front of billions of tiny people was a first. As if the tiny people on §Y[Root.GetName]§! were mocking her, Sonxi decided to punish the tiny people here severely. She didn't hesitate to take off her panties filled with excrement, turning them inside out and throwing them directly onto the planet. The giant panties, thousands of kilometers long, carrying billions of tons of excrement, directly covered more than half of the planet's surface. Countless tiny people, even if not directly crushed to death by the feces, were gradually dying under the suffocating kill of the hot and stinking panties. Luckily, some tiny people tried to crawl out of the fiber that was not yet soaked through. Sonxi opened her pussy again, letting urine pour down like a heavenly flood, thoroughly soaking her panties. These tiny people were also happily and cruelly drowned or smashed by the urine.\n\nSeeing her urine and feces slowly spreading on the dry ground of §Y[Root.GetName]§!, turning into a new ocean, Sonxi felt something was missing. Such a boring planet should play some role. So she turned to the other side not yet contaminated by her excrement and directly 