  gts_ap_planet.1001.desc: "Two huge fingers carefully picked up §Y[Root.GetName]§!, then slowly spread open her legs, exposing her pink, tender, and already hungry flower-cunt to the entire colony.\n\nWith the maiden's mutter, the entire planet was suddenly sent directly into the maiden's flower-cunt! Accompanied by sweet moans, the boundless tender meat squeezed the surface of §Y[Root.GetName]§!, and hot love juice secreted out, squelching and squeezing the poor little planet.\n\nLittle Grey let out a satisfied moan, her fingers caressing the area around the entrance of her flower-cunt, guiding the small planet to slowly sink into her body. During this slow and deep entry, §Y[Root.GetName]§! was almost completely swallowed by the ocean of hot, wet tender meat and love juice, and as her flower core writhed more and more intensely, the surrounding tender meat began to become full and hot, wrapping the small planet tighter and tighter, almost crushing it to bits.\n\nThe overflowing love juice also flowed out more and more, sliding down the roots of her thighs and into the vast space, this stinky liquid drifted far into the depths of space, merging with distant galaxies.\n\nA lewd cry came, and the tender meat could be seen writhing even more wildly. Some unstable buildings were directly crushed and rolled into the love juice and soft meat, then there was a comfortable gasp. The maiden’s orgasm caused a torrent of love juice to gush out, covering the entire planet! In a moment, the little planet was sprayed out with a pop, with a thread of love juice still sticking to the flower-cunt of §Y[Root.GetName]§!."
