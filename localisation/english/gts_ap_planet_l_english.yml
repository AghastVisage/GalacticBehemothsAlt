  gts_ap_planet.5002.desc: "§Y[Root.GetName]§! is a beautiful planet with deep blue oceans and emerald forests, so much so that Linfeng feels a pang of reluctance when she descends on this planet... and a hint of guilt at the thought of using her own giant feet to trample it into a flat land full of foot grime. Stirred by this guilt, Linfeng's feet wrapped in black silk, could no longer be held back and kicked off her high heels, casting a sky-obscuring shadow over the planet about to be humiliated. The inhabitants of the planet looked desperately at the sky, while wild animals became restless, searching futilely for places to hide.\n\nLinfeng carefully rubbed her feet with her hand, feeling the foot sweat and foot grime ready to burst forth on the sole, imagining the scene on the ground and feeling both sorrow and excitement for the tiny people. Finally, foot sweat sprayed from the sole, billions of tons of sweat smashing into the ocean, raising waves higher than the atmosphere. Countless islands were buried forever under the sticky sweat without even time to react. Like continents, blocks of foot grime, carrying massive bacteria, rolled down. Coastal cities were submerged by giant waves full of sour-smelling foam. Ignorant and ferocious bacteria raged, crushing cities and tiny people, turning the clear seawater yellowish.\n\nHowever, Linfeng was not finished yet. Her feet remained fragrant, so she pressed the sole, dripping with celestial-grade foot sweat, directly against the hemisphere not yet affected by the sweat. The soft sole recklessly flattened forests and cities, leaving a isthmus flowing with foot sweat connecting the boiling oceans. Linfeng gently hugged the sweat-covered planet with both hands, rubbing her hot, throbbing sole back and forth. The scarce continents were completely shattered, and the continuously scraped off foot grime turned into new high mountains. Sticky and warm foot sweat finally covered the entire planet. Yellowish turbid sweat repl