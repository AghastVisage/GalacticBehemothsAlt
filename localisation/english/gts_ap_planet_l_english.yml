  # §Y[Root.GetName]§!恢复为汗雾星球
  gts_ap_planet.4100.name: "§Y[Root.GetName]§! Restored to a Sweat Mist Planet"
  # 经过星球上人们的不懈努力，覆盖在§Y[Root.GetName]§!表面的足垢与脚汗已经基本清理完毕了，星球终于露出了原来的模样。在清理过程中，许多被深埋于足垢之下的城市废墟被挖出，那些当年死于巨娘足底的牺牲者得以重见天日。\n\n造成这一切破坏的，不过只是当初一位巨娘的随意之举，仅仅是少女玉足的轻轻搓揉，便彻底改变了这颗星球的样貌，以及上面生活的人们的命运。虽然我们尽力恢复星球的生态，但巨娘足底的味道已经深入这里的每一寸土地之中，清理工作反而使得更多的足汗蒸发进了大气之中，这些足汗形成了厚重的雾气，经年久月的笼罩着星球的地表，足汗雨无时无刻都在冲刷着星球上的人们，提醒着她们，自己不过是巨娘脚底微不足道的灰尘罢了。
  gts_ap_planet.4100.desc: "Thanks to the unremitting efforts of the people on the planet, the foot filth and foot sweat that covered the surface of §Y[Root.GetName]§! have been basically cleaned up, and the planet finally reveals its original appearance. During the cleaning process, many city ruins that were deeply buried under the foot filth were excavated, and those who died under the giantesses' feet back then were able to see the light of day again.\n\nAll of this destruction was caused by a mere casual act of a giantess. Just a tender rubbing of the maiden's jade feet completely changed the appearance of this planet, as well as the fate of the people who lived on it. Although we have tried our best to restore the ecology of the planet, the smell of the giantess's feet has penetrated every inch of the land here. The cleaning work has instead caused more foot sweat to evaporate into the atmosphere and form a thick mist that envelops the surface of the planet for years. Foot sweat rain is constantly washing away the people on the planet, reminding them that they are nothing more than insignificant dust under the giantess's feet."
  # 巨娘的痕迹永远无法抹去
  gts_ap_planet.4100.a: "The giantess's mark can never be erased"
  # §Y[Root.GetName]§!转化为足垢堡垒星球
  gts_ap_planet.4200.name: "§Y[Root.GetName]§! Transformed into a Foot Filth Fortress Planet"
  # 今早，数以万计的居民来到行星首府门前的广场上，抗议着星球堡垒化决议的通过，人们群情激奋的喊着：\n“我们星球的环境已经够糟了！你们不能再夺走为数不多的耕地了！”\n“我们拒绝当填线宝宝！”\n\n但很快，头顶那污黄色天空便黑了下来，人们抬头望去，出现在遥远天边的，是一对硕大无比的裸足。堡垒化进程已经开始，而被派来执行的，不是什么星球整地团队，而是极巨化的§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!，示威人群这才明白，为什么没有政府官员出来接待她们，因为那些人早已前往地下掩体了。\n\n人群开始四散而逃，但显然已经迟了，比星球大得多的双足很快便突破大气层抵达了地表，此时用踩来描述已经不合适了，§Y[Root.GetName]§!更像是被双足夹在了中间，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!将地表上已有的足垢踏平压实，接着又将自己脚上新鲜的足垢覆盖在上面，然后再透过不断的搓揉压实。那些建立在荒野足垢之上的小村落，瞬间便消失的无影无踪，成为足垢层中的化石，而大城市则被巨足碾碎，建筑残骸与足垢混合成了“混凝土”组成了这颗堡垒星球坚硬的地壳。\n\n就像冬季打雪仗的小姑娘一样，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!不断用自己脚上的足垢与脚汗一层一层的涂抹并压实，最终得到了一颗坚硬无比的“雪球”，这颗“雪球”已经准备好痛击来袭的入侵者了。而当初那些抗议的人，已经和其他§R[Root.gts_bruh_get_planet_killed_pop_count]§!个人口一同成为了这堡垒结构的一部分，§R[Root.gts_bruh_get_planet_destroyed_city_count]§!座城市被足垢掩埋，坚硬的地壳与残留的足汗结晶将为我国的军事发展带来极大的便利！
  gts_ap_planet.4200.desc: "This morning, tens of thousands of residents came to the square in front of the planetary capital to protest against the passage of the planet fortification resolution, and people shouted angrily:\n\"The environment on our planet is bad enough! You can't take away the few arable lands we have left!\"\n\"We refuse to be cannon fodder!\"\n\nBut soon, the dirty yellow sky above turned dark. People looked up, and what appeared on the distant horizon was a pair of huge bare feet. The process of fortification had already begun, and those who were sent to carry it out were not planet-clearing teams, but the gigantified §M[event_target:gts_planet_leader.GetName]§!. Only then did the protesters understand why no government officials came to greet them - because those people had already gone to the underground bunkers.\n\nThe crowd began to scatter and flee, but it was obviously too late. Feet that were much larger than the planet quickly broke through the atmosphere and reached the surface. At this point, it was no longer appropriate to describe it as stepping: §Y[Root.GetName]§! felt as if it were being sandwiched between two feet, as §M[event_target:gts_planet_leader.GetName]§! flattened and compacted the existing foot filth on the surface. Then she covered it with fresh foot filth from her feet, and then compacted it by constantly kneading and rubbing it. The small villages that were built on the foot filth in the wilderness instantly disappeared without a trace, and became fossils in the foot filth layer, while the big cities were crushed by the giant feet. Building debris and foot filth were mixed into \"concrete\" to form the hard crust of this fortress planet.\n\nLike a girl having a snowball fight in winter, §M[event_target:gts_planet_leader.GetName]§! kept smearing and compacting her foot filth and foot sweat, layer after layer, and finally, got an extremely hard \"snowball\". This \"snowball\" is ready to strike the incoming invaders. And those protesters have already become part of the fortress structure along with another §R[Root.dirt_kia]§! people. §R[Root.dirt_city_kia]§! cities were buried by foot filth, and the hard crust and remaining foot sweat crystals will bring great convenience to our country's military development!"
  # [Root.GetName]永不陷落！
  gts_ap_planet.4200.a: "[Root.GetName] will never fall!"
  # §Y[Root.GetName]§!转化为足垢矿业星球
  gts_ap_planet.4300.name: "§Y[Root.GetName]§! Transformed into a Foot Filth Mining Planet"
  # “真是的，表层的足垢都已经挖完了，那些深处的足垢又很难挖，这种日子也太难过了吧。”矿工们抱怨着她们艰苦的工作环境“那些管理层的人又不需要下矿，她们才不会来解决这些问题”\n\n§M“嗯嗯，你们的提议我有在倾听哦~”§!震耳欲聋的声音从天上传来，那正是极巨化的§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!，矿工们没有想到，高层对于她们没完没了的投诉，提出的解决方案竟然是。。。\n\n轰隆隆，巨大的足趾一下子将§Y[Root.GetName]§!夹在了中间，前所未有的冲击波袭击了星球的各处，无数的矿井坍塌，地面裂开了硕大的峡谷，随着巨娘足底不断的发力，整颗星球就像坚果一样裂开，覆盖在地表的足垢被剥离，露出了里面炽热的“果核”，夹杂着新鲜的足汗，星球在不断的搓揉下分崩离析，矿工们伴随着碎裂的岩石抛向了太空，又被引力拉回地表，就在星球即将瓦解之际，巨娘停止了脚上的动作，将散布在太空中的碎屑重新聚拢，压回了地面，重新搓成了一颗星球。\n\n§M“这下，珍贵的矿物就触手可及了吧！”§!幸存的人们从避难所中走出，面对着地狱般的景象，如今这颗破碎的足垢星球被翻了个底朝天，§R[Root.gts_bruh_get_planet_killed_pop_count]§!个人口在这一过程中丧命，§R[Root.gts_bruh_get_planet_destroyed_city_count]§!座矿业城市消失的无影无踪，也许它们有朝一日会被重新从足垢深处挖出来吧。
  gts_ap_planet.4300.desc: "\"Really, the surface foot filth has already been dug up, and the deep foot filth is very difficult to dig up. This kind of life is too hard.\" The miners complained about their harsh working environment. \"Those in management don't need to go down to the mines, and they won't solve these problems.\"\n\n§M\"Hmm, hmm, I'm listening to your suggestions~\"§! A deafening voice came from the sky. It was the gigantified §M[event_target:gts_planet_leader.GetName]§!. The miners did not expect that the solution that the higher-ups had for their endless complaints would actually be...\n\nBoom, boom, boom! The huge toes suddenly sandwiched §Y[Root.GetName]§! between them. An unprecedented shockwave hit all parts of the planet. Countless mines collapsed and huge canyons cracked on the ground. As the giantess's feet continued to exert force, the entire planet cracked like a nut, the foot filth covering the surface was peeled off and the hot \"kernel\" inside was revealed. Mixed with fresh foot sweat, the planet disintegrated under constant kneading. The miners were thrown into space along with the shattered rock and were pulled back to the surface by gravity. Just when the planet was about to collapse, the giantess stopped the movement of her feet, and regathered the debris scattered in space and pressed it back to the ground, kneading it into another planet.\n\n§M\"Now, the precious minerals are within reach!\"§! The survivors walked out of their shelters and faced a hellish scene. Now this broken foot filth planet had been turned upside down. §R[Root.dirt_kia]§! people died in the process and §R[Root.dirt_city_kia]§! mining cities disappeared without a trace, maybe one day they will come out again from deep within the foot filth."
  # 这就叫高效
  gts_ap_planet.4300.a: "That's called efficiency"
  # §Y[Root.GetName]§!转化为足垢农业星球
  gts_ap_planet.4400.name: "§Y[Root.GetName]§! Transformed into a Foot Filth Agricultural Planet"
  # 汗如雨下，这个成语如今不再是夸张的成分，而是天上真的下起了汗雨，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的巨足再一次笼罩了这颗星球，悬在大气层之中的足底降下了前所未见的足汗暴雨。\n\n§M“天天在田间劳作一定很辛苦吧，今天让我为各位代劳吧~”§!\n\n说完，巨足踏上了§Y[Root.GetName]§!地表，巨娘的脚趾就如同一把高效的犁，沿着星球赤道开垦出了一道深深的壕沟，随后又沿着各个经纬线方向将地表挖开，将土地夹在趾缝间仔细的搓揉碾碎，在足汗的浸润下，原本干裂的足垢大地再一次焕发“生机”，新鲜的足垢混合着旧的足垢形成了肥沃而松软的新土地。\n\n只是。。。好像农民们也在其中，总共§R[Root.gts_bruh_get_planet_killed_pop_count]§!个人口成为了这新开垦的土地的养料，§R[Root.gts_bruh_get_planet_destroyed_city_count]§!座农业城市被掩埋，吃水不忘挖井人，也别忘了那些被挖井人埋在井里的人吧。
  gts_ap_planet.4400.desc: "Sweating like rain, this idiom is now no longer metaphorical, but that it is actually raining sweat from the sky, §M[event_target:gts_planet_leader.GetName]§!'s giant feet once again covered this planet. An unprecedented foot sweat downpour fell from the soles of her feet hanging in the atmosphere.\n\n§M\"You must be working very hard in the fields every day. Let me do it for you today~\"§!\n\nAfter saying that, the giant feet stepped onto the ground of §Y[Root.GetName]§!, and the giantess's toes were like an efficient plow and cut a deep trench along the planet's equator, then dug up the surface along the meridians and squeezed and crushed the soil carefully between her toes. Under the moistening of foot sweat, the originally dry and cracked foot filth land took on a new \"vitality\" again. Fresh foot filth mixed with old foot filth to form a fertile and loose new land.\n\n It's just... it seems that the farmers were also caught in the midst. A total of §R[Root.dirt_kia]§! people became nourishment for this newly reclaimed land, and §R[Root.dirt_city_kia]§! agricultural cities were buried. While reaping the benefits, don't also forget those who were buried in the well by the well diggers."
  # 我可不吃足垢星球的东西！
  gts_ap_planet.4400.a: "I won't eat anything from a foot filth planet!"
  # §Y[Root.GetName]§!重新转化为足垢星球
  gts_ap_planet.4500.name: "§Y[Root.GetName]§! Reverted Back to a Foot Filth Planet"
  # §Y[Root.GetName]§!上的人们还在庆祝星球从足垢中解放，以至于，当她们再度看到巨足悬在星球天空之上的时候，还以为是主办方搞的特效。\n\n§M“各位~又在怀念巨足的爱抚了吗？”§!，听到来自§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的声音，人们才意识到，那曾经统治着她们前辈的巨物再次降临了。\n\n“不！！为什么！！”\n“不能这样对我们！我不想再回到足垢的怀抱里！！”\n然而这些微弱的声音无法动摇巨娘的行动，很快，巨足再一次拥抱了这颗星球，无数庆典的人群被足底碾碎，城市再度被足垢掩埋，足汗洪水冲垮了还在重建中的城市，很快，星球的海洋再次被足汗取代，足垢的山峰再次矗立在了大地之上。又一次，§R[Root.gts_bruh_get_planet_killed_pop_count]§!个人口成为了足下亡魂，§R[Root.gts_bruh_get_planet_destroyed_city_count]§!座城市被碾碎，当巨足离开星球时，§Y[Root.GetName]§!已经变成了和之前一样的形态，一颗足垢星球！
  gts_ap_planet.4500.desc: "People on §Y[Root.GetName]§! were still celebrating the planet's liberation from foot filth, so when they saw giant feet hovering above the planet again, they thought it was a special effect from the organizers.\n\n§M\"Everyone ~ do you miss the caresses of giant feet?\"§! Hearing the voice from §M[event_target:gts_planet_leader.GetName]§!, people realized that the behemoth that once ruled their predecessors had returned again.\n\n\"No!! Why!!\"\n\"You can't do this to us! I don't want to go back to the embrace of foot filth again!!\"\nBut these faint cries could not shake the giantess's actions. Soon, the giant feet embraced this planet again. Countless crowds at the celebrations were crushed by the soles of her feet. The cities were buried in foot filth again. Foot sweat floods washed away the cities that were still under reconstruction. Soon, the ocean of the planet was replaced with foot sweat again, and Foot Filth peaks stood on the earth again. Once again, §R[Root.dirt_kia]§! people became souls under her feet, and §R[Root.dirt_city_kia]§! cities were crushed. When the giant feet left the planet, §Y[Root.GetName]§! had become the same form as before - a foot filth planet!"
  # 足垢才是这颗星球原本的样貌
  gts_ap_planet.4500.a: "Foot filth is the original form of this planet"
