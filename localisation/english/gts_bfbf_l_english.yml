  tech_gts_bfbf_habitability: "Toy Colony Planet Improvement Initiative"
  tech_gts_bfbf_habitability_desc: "The crude use of planets can no longer satisfy our girls. The giantesses are beginning to hope that the little bugs on the planets will provide them with greater value, rather than simply being treated as consumables."
  tech_gts_bfbf_habitability_dirt: "Planet Decontamination and Deodorization Project"
  tech_gts_bfbf_habitability_dirt_desc: "We have generously decided to carry out a complete transformation of these planets from the atmosphere to the surface. Our decision has made the inhabitants of this planet cheer. As for who caused all this... who cares?"
  tech_gts_bfbf_habitability_juiceandsemen: "Sperm and Ovum Worship Project"
  tech_gts_bfbf_habitability_juiceandsemen_desc: "We have found that if these little people view the release of their desires towards our girls as a divine blessing, it will greatly increase their development motivation. They may even regard our indulgence as a test and recognition from the gods."
  tech_gts_bfbf_habitability_milk: "Milk Sea Softening Project"

  tech_gts_bfbf_habitability_milk_desc: "The problems of nutrient deposition and the inability of the original species to survive in untreated giantess milk have been solved by us. Now, the giantesses' milk has completely replaced the original oceans and water sources of the planet. The little people are now celebrating that their gods have given them endless water sources and a brand new world."
