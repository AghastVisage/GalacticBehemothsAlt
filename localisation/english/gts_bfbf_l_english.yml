  #  白丝封装
  gts_bfbf.404.name: "White Silk Encapsulation"
  #  [event_target:gts_white_silk_cover_system.GetName]，一位星系级巨娘[event_target:gts_white_silk_cover_leader.GetName]正在缓缓靠近。根据指示，她将把自己白丝整个套入[event_target:gts_white_silk_cover_system.GetName]。\n她低头，检查着自己即将执行作业的“工具”——那双包裹着她双腿的、令人窒息的白色作业丝袜，此刻，它正紧紧地贴合着她那双堪称神迹的玉腿。那双腿，线条流畅得令人发指。大腿部分丰腴而紧致，充满了力量感与柔美感的完美平衡；膝盖处的线条柔和而圆润，没有一丝突兀的骨节；小腿则修长而笔直，一路向下收束，最终汇聚成那精致、纤细的足踝与脚掌。白色的丝袜，将这双腿的每一寸曲线都勾勒得淋漓尽致。它薄如蝉翼，却坚韧无比，每一根纤维都在吸收着周围星云的光芒，使其在黑暗的宇宙中，散发出一种朦胧而圣洁的、珍珠般的柔光。丝袜的顶端，那圈精致的、由能量丝线编织而成的蕾丝花边，正优雅地环绕在她那纤细得不可思议的大腿根部，随着她的呼吸，微微地起伏着，散发着一种致命的诱惑。\n“指令确认，目标：[event_target:gts_white_silk_cover_system.GetName]。执行封装白丝。”\n[event_target:gts_white_silk_cover_leader.GetName]的嘴角，勾起一抹戏谑而慵懒的微笑。她喜欢这份工作，尤其是看到那些渺小的超光前文明，在她这双巨足面前，露出惊恐又无助的表情时。她缓缓地、优雅地，抬起了右腿，玉手轻轻翘起，将那包裹在右腿上的纯洁白丝，轻轻脱下，那动作轻盈得如同在跳一支华尔兹。那巨大的白丝，遮天蔽日地向着下方那个小小的、散发着光芒的恒星系，缓缓压下。\n她能感觉到指边底传来的、那颗恒星微弱的热量，像是一块温热的鹅卵石。她能听到那些行星在她白丝上惊恐的“尖叫”\n“乖，别乱动，不然我会弄疼你的哦。”\n她轻声“哄”着，白丝的弧度完美地包裹住了整个恒星系。丝袜的纤维，如同最温柔的拥抱，将那颗恒星和它的行星们，温柔而又不容抗拒地，揽入怀中。这个动作对于少女而言多么的无足轻重，但对于恒星系内的生命来说，如同无征兆的世界末日。\n原本晴朗的夜空，突然被一片巨大的、散发着柔和白光的“云朵”所覆盖。那“云朵”的纹理清晰可见，是无数细密的、如同蛛网般的纤维交织而成。\n“那是什么？是巨大的星云？”\n“不！它在下降！它在向我们靠近！”\n那片“云朵”越来越近，越来越近。终于，他们看清了——那不是云朵，那是一只脚？不，那是一只巨大的白色丝袜！\n等白丝彻底落下，将[event_target:gts_white_silk_cover_system.GetName]完全包裹的那一刻，整个星系都安静了。\n恒星的光芒，被那层白色的丝袜过滤，变成了一种柔和、暧昧、如同黄昏般的橙色光晕，照亮了这片由丝袜纤维构成的、囚禁了整个星系的狭小空间。行星们在这片奇异的空间内，无助地漂浮着。它们能清晰地看到，包裹着它们的，是那双神腿的一部分。丝袜的纤维，如同无数条发光的、巨大的血管，在它们的头顶上方，纵横交错。而在丝袜的外面，是那双神明般的腿。“嗯，不错。”\n[event_target:gts_white_silk_cover_leader.GetName]满意地点点头，她缓缓的放松身体漂浮在虚空中，一只裸足和一只被白丝包裹的玉足，不自觉的摇动。\n现在，整个星系都被包裹在了白丝中了，虽然那白丝散发的气味会给本地居民造成一些困扰，但谁不想近距离观察美少女的白丝呢？
  gts_bfbf.404.desc: "[event_target:gts_white_silk_cover_system.GetName], a galaxy-class giantess, [event_target:gts_white_silk_cover_leader.GetName], is slowly approaching. According to her instructions, she will slip her entire white stocking over [event_target:gts_white_silk_cover_system.GetName].\\nShe lowers her head and checks the \"tool\" with which she is about to carry out the operation: the suffocating white work stockings wrapped around her legs. At this moment, they cling tightly to her jade legs, which can only be called miraculous. Those legs have outrageously smooth lines. Her thighs are full and firm, a perfect balance of strength and softness; the lines at her knees are gentle and rounded, without the slightest protruding joint; her calves are long and straight, tapering downward until they gather into delicate, slender ankles and feet. The white stockings outline every curve of those legs in vivid detail. They are thin as cicada wings, yet incomparably tough. Every fiber absorbs the light of the surrounding nebulae, causing them to emit a hazy, sacred, pearl-like glow in the dark universe. At the tops of the stockings, the exquisite lace trim woven from energy threads elegantly circles the roots of her unimaginably slender thighs. With her breathing, it rises and falls faintly, giving off a deadly temptation.\\n\"Directive confirmed. Target: [event_target:gts_white_silk_cover_system.GetName]. Executing white-stocking encapsulation.\"\\nThe corners of [event_target:gts_white_silk_cover_leader.GetName]'s mouth curl into a teasing, languid smile. She likes this work, especially when she sees those tiny pre-FTL civilizations showing terrified and helpless expressions before her giant feet. Slowly and elegantly, she raises her right leg. Her jade hand lifts slightly, gently removing the pure white stocking wrapped around her right leg, the movement as light as a waltz. That enormous white stocking, blocking out the sky and sun, slowly presses down toward the tiny, glowing star system below.\\nShe can feel the faint heat of that star against the underside of her fingertips, like a warm pebble. She can hear the planets on her white stocking \"screaming\" in terror.\\n\"Good, don't move around, or I might hurt you.\"\\nShe softly \"soothes\" them, and the curve of the white stocking perfectly envelops the entire star system. The stocking fibers, like the gentlest embrace, draw the star and its planets into her arms with tenderness and irresistible force. To the girl, this action is utterly insignificant, but to the life within the star system, it is a sudden apocalypse.\\nThe originally clear night sky is suddenly covered by a gigantic \"cloud\" emitting a soft white light. The texture of the \"cloud\" is clearly visible, woven from countless fine, spiderweb-like fibers.\\n\"What is that? A giant nebula?\"\\n\"No! It's descending! It's coming toward us!\"\\nThat \"cloud\" comes closer and closer. At last, they see it clearly. It is not a cloud. Is it a foot? No, it is an enormous white stocking!\\nThe moment the white stocking fully descends and completely wraps [event_target:gts_white_silk_cover_system.GetName], the entire galaxy falls silent.\\nThe star's light is filtered through the layer of white stocking, turning into a soft, ambiguous orange glow like twilight, illuminating this narrow space made of stocking fibers that imprisons the entire galaxy. The planets float helplessly in this strange space. They can clearly see that what wraps them is part of those divine legs. The stocking fibers, like countless glowing, gigantic blood vessels, crisscross above their heads. And outside the stocking are those godlike legs. \"Mm, not bad.\"\\n[event_target:gts_white_silk_cover_leader.GetName] nods in satisfaction. She slowly relaxes her body and floats in the void, one bare foot and one jade foot wrapped in white silk swaying unconsciously.\\nNow, the entire galaxy is wrapped in white silk. Although the scent emitted by the white stocking may cause some trouble for the local residents, who would not want to observe a beautiful girl's white stocking up close?"
  #  我们有一整个星系被白丝包裹了！
  gts_bfbf.404.a: "An entire galaxy of ours has been wrapped in white silk!"
