  # 星球除污除臭计划
  tech_gts_bfbf_habitability_dirt: "Planet Decontamination and Deodorization Project"
  # 我们慷慨地决定为这些星球进行一次从大气到地表的的整体改造，我们的决定让这个星球的住民开始欢欣鼓舞，至于这一切是谁造成的……谁在乎呢?
