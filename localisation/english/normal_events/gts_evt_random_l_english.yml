  # 水深勿近
  gts_evt_random.040245.name: "Deep Water - Keep Out"
  # §H实在是……有点累了啊……§!\n\n暂时脱离群体身着泳装的橘子长回到岸上，戴上了遮阳帽，穿上了她特殊订制的雨靴——即使是在夏日炎炎，其她巨娘的身体都大面积裸露的情况下，她这副宛如拍摄写真一样的衣服还是引起了更多人的围观……当然，也少不了偷拍和背后蟋蟀。\n\n§Y你们说……为什么这个家伙要拿着个木牌把前面盖住啊……\n\n水深勿近？为什么要写这样的牌子？难道说……§!\n\n在电视塔的顶端，正在人们突然谈论的时候，却突然面前一暗，随后对面的人群开始出现了恐慌的表情：\n\n因为刚刚还在沙滩上的橘色巨娘，此刻仅用自己的身体，就已经将这座小小的电视塔包围了起来。\n\n§H你们在说什么呢？橘子长……听不清呢。只不过——§!\n\n§H咱只知道今天休假，所以……现在的咱不是行政官的话，是不是可以肆无忌惮地……做我想做的事情呢？§!\n\n少女说着，张开了自己粉嫩的口腔。所有人都知道这无底洞下都有些什么——任何人，建筑物，舰船，星球甚至是一个恒星系，都可能在她的身体中，在胃液的冲刷下逐渐沦为她身体的一部分。粉红色的舌苔轻轻拂过电视塔的外围，接触的玻璃在此刻应声破碎，随着少女的呼吸吞入了口腔内。然而，最令人恐慌的，恐怕是这些即将要成为橘子长特供“零食”的小人们。\n\n随后，随着少女轻轻的呼吸，却有着难以想象的引力，在将身体不由自主地向那粉红色的深渊中吸去。直到被舌苔包裹，如同柔软的苔藓一般，却带着湿润和温热的气息。但是被紧紧包裹住的身体却时刻给予自己危险的信号：此刻在少女的口腔中，只要她愿意，自己可能永远都会沦为食物被消化掉，甚至不会太久，自己渺小的身体都难以想象会对她深不见底的胃提供多少的情绪价值。想到这里，身体不由得颤栗起来。却在这惊骇的情绪中被少女细腻的感官追猎。或许……这位巨娘就是想看到你被她欺负却没有任何办法的恐慌，但是你却没有任何办法：毕竟从一开始，就是自己在蟋蟀人家不是吗？\n\n§H好了……咱记住你了哦，好好表现，我可能还会……再品尝你一次，改天。§!\n\n宛如从冥界中打了个滚一般，几乎难以呼吸的惊骇中，身体却完好无损地被少女吐出，宛如失去了情绪价值的糖果一般。小人蜷缩在电视塔顶，身上的衣服早已被少女的舌头撕扯的破破烂烂，挂满了巨娘的唾液。但总而言之，自己算是在她的手里……在她的口中活下来了，不是吗？
  gts_evt_random.040245.desc: "§HHonestly... I'm a little tired...§!\\n\\nTemporarily leaving the group, Orange Chief, dressed in a swimsuit, returns to shore, puts on a sun hat, and slips into her specially customized rain boots. Even in the blazing summer heat, with the other giantesses exposing large areas of skin, this outfit of hers, almost like something for a photo shoot, still draws more onlookers... and of course, no shortage of secret photos and gossip behind her back.\\n\\n§YHey... why is this person holding a wooden sign to cover the front...\\n\\nDeep Water, Keep Away? Why write that on a sign? Could it be...§!\\n\\nAt the top of the television tower, just as people are suddenly discussing this, everything in front of them abruptly darkens. Then the crowd opposite them begins to show terrified expressions.\\n\\nBecause the orange giantess who had just been on the beach has, at this moment, surrounded this tiny television tower with her body alone.\\n\\n§HWhat are you all saying? Orange Chief... can't hear you. However—§!\\n\\n§HI only know that today is a vacation, so... if I am not an administrator right now, does that mean I can do whatever I want... without restraint?§!\\n\\nAs the girl speaks, she opens her pink mouth. Everyone knows what lies beneath that bottomless pit. Any person, building, ship, planet, or even an entire star system could enter her body and, washed by digestive fluid, gradually become part of her. The pink coating of her tongue lightly sweeps across the outside of the television tower. The glass it touches shatters at once and is swallowed into her mouth with the girl's breath. Yet the most terrifying thing is probably the tinies who are about to become Orange Chief's special \"snacks.\"\\n\\nThen, as the girl breathes gently, an unimaginable force of attraction pulls their bodies involuntarily toward that pink abyss. They are wrapped by her tongue coating, which is like soft moss, yet carries a moist and warm breath. But their tightly enveloped bodies constantly send them signals of danger: at this moment inside the girl's mouth, if she wishes it, they may forever become food and be digested, and it may not even take long. Their tiny bodies can hardly imagine how much emotional value they would provide to her bottomless stomach. Thinking this, their bodies cannot help trembling. Yet amid this horrified emotion, they are hunted by the girl's delicate senses. Perhaps... this Giantess simply wants to see the terror of you being bullied by her while utterly helpless, but there is nothing you can do. After all, from the very beginning, you were the one gossiping about her, were you not?\\n\\n§HAll right... I remember you now. Behave well, and maybe I will... taste you again some other day.§!\\n\\nAs if they had rolled once through the underworld, in nearly breathless terror, their bodies are spat out by the girl completely intact, like candy that has lost its emotional value. The tiny curls up on the top of the television tower, their clothes long since torn to tatters by the girl's tongue and covered in the Giantess's saliva. But in any case, they survived in her hands... in her mouth, did they not?"
