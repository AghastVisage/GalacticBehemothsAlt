  # 狐狸之间的恶作剧
  gts_evt_random.040247.name: "Pranks Among Foxes"
  # 湛蓝的天空下，白云悠悠，海风带着咸湿的味道拂过这座被两道巨大身影主宰的海岸城市。那位粉色长发如瀑布般垂落腰际、狐耳轻轻颤动、身材修长的少女是林凤，身后银白长发随风飘荡、身后九条蓬松粉白狐尾肆意摇曳的，则是她最亲密的挚友—苏小白。\n\n二人走向这片繁华海滩，每一步落下都让下方的高楼大厦像饼干般崩裂，烟尘滚滚，尖叫声此起彼伏。\n\n§Y小凤你看脚下，这些小家伙跑得好快，像是一群受惊的蚂蚁！§!\n\n苏小白微笑着，抬起粉嫩的脚掌挑着一些空旷的地方踩下，一整片度假酒店区瞬间化为废墟，碎石和沙尘从她足趾缝间倾泻而下。她完全沉浸在破坏的快感中，比基尼勉强包裹着丰满的胸部和翘臀，九条狐尾兴奋地扫过天空。\n\n林凤表面上温柔笑着，心里却早已计划好今天的“报复”。前些日子被小白欺负得够呛，好不容易从帝国那边要到的东西又被这位小白殿下抢走送回去了，今天她决定让这位爱恶作剧的殿下尝尝被反过来玩弄的滋味。趁着苏小白抬脚准备继续向前踩踏时，林凤悄悄弯下腰，纤细却有力的手指伸向海滩。无数惊恐的小人四散奔逃，有人尖叫、有人跪地求饶，但这一切在巨人的眼中都只是有趣的玩具。林凤的指尖精准地捏起了一大撮倒霉蛋，他们在林凤的掌心拼命挣扎，却毫无反抗之力。\n\n§r小白殿下～你平时那么喜欢欺负我……现在该轮到我了！§!\n\n林凤嘴角勾起甜蜜又危险的笑意，贴近苏小白身后，左手轻轻搭在小白纤细的腰肢上，右手则迅速拨开小白那薄薄的泳裤。苏小白粉嫩无毛的私处完全暴露在海风中，饱满的阴唇微微闭合，中间那道诱人的粉色缝隙已经因为兴奋和海风而微微湿润。\n\n§Y小凤？你要干....唔啊？！§!\n\n苏小白的话还没说完，就感觉到几个温热蠕动的小人被直接按在了自己最敏感的部位。林凤毫不犹豫地将那些挣扎的小人一个个推入那湿热紧窄的穴口。柔软的阴唇被撑开，小人们尖叫着被湿滑的蜜汁包裹，身体表面沾满黏腻的爱液，一寸寸被挤进苏小白体内。\n\n§Y啊…里面…在动…§!\n\n苏小白猛地夹紧双腿，九条狐尾瞬间蓬松炸开，像粉色的云朵般剧烈摇晃。她丰满的胸部剧烈起伏，粉嫩的乳尖在比基尼下明显挺立。那些小人在她紧致的甬道里拼命挣扎、踢打，每一次蠕动都化作强烈的快感电流，直冲大脑。\n\n林凤没有停手。她用两根手指轻轻分开苏小白湿润的阴唇，又抓起更多小人，缓缓塞了进去。小白的穴口被撑得微微张开，晶莹的蜜汁混合着小人们的挣扎，顺着她雪白的大腿内侧缓缓流下，在阳光下闪着淫靡的光泽。\n\n§Y呜呜……林凤你这个坏蛋……里面好满……他们还在里面乱动……啊哈……！§!\n\n苏小白的声音已经带着明显的娇喘。她双腿发软，试图并拢，却被林凤从身后轻轻顶开大腿。林凤的指尖甚至故意按压在小白肿胀的阴蒂上，轻轻揉按、弹弄，让那些已经被塞进去的小人在更深的蠕动中带来更强烈的刺激。\n\n苏小白的身体明显发烫，狐耳软软地耷拉下来，脸颊红得几乎滴血。她的蜜穴不断收缩，紧紧绞着那些可怜的小人，把他们越吸越深。每次收缩，都能感觉到小人们在里面无助地挣扎，那种被活生生填满、被无数细微动作刺激的快感，让苏小白差点当场腿软跪倒。\n\n§r报复的感觉怎么样呀，小白殿下？让你之前欺负我。§!\n\n林凤贴在她耳边轻声呢喃，声音又甜又坏，同时又塞进去最后几个小人，还用指尖在穴口浅浅抽插了几下，帮助他们彻底没入那湿热柔软的深处。\n\n§Y林凤…呜啊…！§!\n\n苏小白全身颤抖，她的下体已经一片狼藉，爱液拉丝般滴落，在海滩上砸出几个小小的水坑。林凤心满意足地收回手指，重新帮苏小白把泳裤拉好，轻轻拍了拍她还在微微抽搐的翘臀，这才牵起小白微微发烫的手掌，十指紧紧相扣。\n\n§r走吧，殿下～继续我们的散步去～§!\n\n夕阳的余晖洒在两人身上。两位身材火辣的巨型狐耳少女手牵着手，赤足缓缓踩过崩塌的城市废墟与金色沙滩，继续漫步。\n\n苏小白每走一步，体内那些还在挣扎的小人就带来一阵又一阵酥麻的快感，让她走路的姿势都变得有些别扭，脸上的红晕久久不散，却也忍不住反握紧林凤的手。
  gts_evt_random.040247.desc: "Under a deep blue sky, white clouds drifted lazily as the salty, damp sea breeze swept over this coastal city dominated by two massive figures. The slender young girl with long pink hair cascading like a waterfall to her waist and fox ears twitching gently was Linfeng. Behind her, with silvery-white hair flowing in the breeze and nine fluffy, pale pink fox tails swaying freely, stood her closest friend - Su Xiaobai. \n\nAs the two walked toward the bustling beach, each step they took caused the skyscrapers below to crumble like cookies, sending up billowing clouds of dust and triggering a chorus of screams. \n\n§\"Xiao Feng, look under your feet! These little guys are running so fast - they're like a swarm of startled ants!\"§!\n\nSu Xiaobai smiled, lifting her delicate pink feet to step on open spaces; an entire resort area instantly turned to rubble, with debris and sand pouring down between her toes. She was completely immersed in the thrill of destruction. Her bikini barely covered her full breasts and pert buttocks, while nine fox tails swished excitedly through the air.\n\nLinfeng smiled gently on the surface, but deep down, she had already planned today's \"revenge.\" She'd been bullied mercilessly by Xiao Bai just a few days ago; the items she'd managed to obtain from the Empire with great difficulty had been snatched away by His Highness Xiao Bai and sent back. Today, she was determined to let this prank-loving prince taste the滋味 of being toyed with in return. Just as Su Xiaobai lifted his foot to continue trampling forward, Linfeng quietly bent down, her slender yet powerful fingers reaching toward the beach. Countless terrified tiny people scattered in all directions; some screamed, others knelt on the ground begging for mercy, but in the eyes of the giant, they were nothing more than amusing toys. Linfeng's fingertips precisely plucked up a large handful of the unlucky ones; they struggled desperately in her palm, yet were utterly powerless to resist. \n\n§r Prince Xiaobai~ You're always so fond of bullying me... Now it's my turn!§!\n\nA sweet yet dangerous smile curled at the corners of Linfeng's mouth as she moved close behind Su Xiaobai, gently resting her left hand on his slender waist while her right hand swiftly pulled aside his thin swim trunks. Su Xiaobai's pink, hairless private area was completely exposed to the sea breeze; her plump labia were slightly closed, and the alluring pink slit in the middle was already slightly moist from excitement and the sea breeze. \n\n§Y Xiao Feng? What are you going to do.... Ugh?!§!\n\nBefore Su Xiaobai could finish her sentence, she felt several warm, wriggling tiny persons being pressed directly against her most sensitive spot. Without hesitation, Linfeng pushed those struggling tiny persons one by one into her wet, hot, and tight opening. Her soft labia were stretched apart; the tiny persons screamed as they were enveloped by her slippery honey, their bodies coated in sticky love fluid, being squeezed inch by inch into Su Xiaobai's body. \n\n§Oh... inside... they're moving...§!\n\nSu Xiaobai suddenly clamped her legs together, and her nine fox tails instantly puffed out, swaying violently like pink clouds. Her full breasts rose and fell rapidly, and her pink nipples stood out clearly beneath her bikini. The tiny persons struggled and kicked frantically inside her tight passage; with every wriggle, a surge of intense pleasure shot straight to her brain. \n\nLinfeng didn't stop. She gently parted Su Xiaobai's wet labia with two fingers, then grabbed more Tiny persons and slowly pushed them inside. Xiaobai's vaginal opening was stretched slightly open, and crystal-clear love juice, mixed with the tiny persons' struggles, trickled down the insides of her snow-white thighs, glistening with a lewd sheen in the sunlight.\n\n§Y... Wuuu... Linfeng, you rascal... It's so full inside... They're still wriggling around in there... Ah-ha...!§!\n\nSu X