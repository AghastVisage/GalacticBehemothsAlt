  # 剿灭行动
  gts_evt_random.040210.name: "Eradication Operation"
  # 太空海盗回到了海盗基地，把这两个缩小的巨娘交给海盗老大享用，海盗老大脱下裤子正准备狠狠玩弄她们时，两位巨娘相视一笑，然后开始解放自己的力量……\n\n等帝国军队想要清剿海盗到达海盗基地所在星球后，却发现这里只有一堆巨大的足印和各种疑似女性屁股和胸部留下的巨大痕迹，甚至还有多个爱液组成发湖泊，里面漂着海盗的残缺的尸体和大量碎块\n\n而且星球的海洋还有蔚蓝色变成了蓝黄混合，散发出奇异的味道，星球北部最大的山脉群被巨大的排泄物所替代，海盗王的四肢被疑似牙齿的东西咬下了，但是他和活着，精神已经失常了
  gts_evt_random.040210.desc: "The space pirates returned to their pirate base, handing the two shrunken giantesses to the pirate leader to enjoy. The pirate leader took off their pants, ready to play with them when the two giantesses smiled at each other and began to unleash their power...\n\nWhen the Imperial army wanted to eradicate the pirates and arrived at the planet where the pirate base was located, they found that there were only a pile of enormous footprints and various enormous traces that seemed to have been left by female buttocks and breasts, and even several lakes of love fluid, with the pirates’ bodies’ mangled pieces floating inside. \n\nWhat’s more, the oceans of the planet changed from azure to a blue-yellow mix, giving off a strange smell. The planet's largest mountain range in the north was replaced by huge piles of excrement. The pirate king's limbs were bitten off by something that seemed to be teeth, but he was alive, although mentally deranged."
  # 难以想象这里曾经发生了什么
  gts_evt_random.040210.a: "It is hard to imagine what happened here"
  # 来自遥远星系的消息-编号379123
  gts_evt_random.040220.name: "Message from a Distant Star System - ID 379123"
  # 某颗星球的战场上，两军对阵，战鼓擂擂，寸土必争，寸步不让\n\n但是本该冲锋陷阵的将士们，却为何纷纷仰起头，目不转睛地盯着天空?因为真正的天空上不可能会黏着和城市一样大小的污渍，也不可能像这样有一条条整齐的纹路，更不可能是这种灰濛濛的颜色,不是吗?巨大的靴子灵活地落到了大地上，由于是单脚着地，穿着靴子的女孩使劲晃了晃双臂才勉强站稳\n\n「唔……终于到了，好吧好吧咱看看，这次的任务应该是缩小之后慢慢摧毁一个国家……」\n\n一边翻动着通讯器自言自语，女孩一边迈开双脚朝着目的地方向走去， 可能是因为感觉到脚底踩到了什么东西，她只是漫不经心的将自己的帆布鞋在大地上拖了拖，随意蹬掉了些尘土，头也不回的继续自己的任务，至于刚才那万人躁动的战场?啊，也许能在那两个巨大到可以装入好几个城市的鞋印里找到一些被踩扁的东西吧?毕竟……即使是缩小过后的巨娘，那遮天蔽日的巨足也是这点微不足道的小细菌所能比拟的，有些可怜的新兵甚至还没与神圣的足底接触，身上的盔甲就已经承受不住巨大的压力而爆裂开了\n\n「这一单干完还能有多少余钱呢……那颗恒星看起来好好吃呀……」\n\n毫不在意的高中少女行走在广袤的大地上……或者说，原本广袤的大地上，对于巨娘那巨大的帆布鞋来说，「广袤」 确实有点名不副实了，一路上坑坑洼洼的，随处可见的小鼓包和小城镇着实让这位郁闷的高中女孩心情烦躁\n\n 「哼……真是不长眼睛，居然把建筑盖在这种地方打扰人家想问题……」\n\n女孩嘟囔着，对着地上的一小块污点狠狠跺了跺脚，感觉不解气的她又一一把附近的一切都踏过一遍，直到附近一片都被踩成黄黄的平地才轻声哼了一声，一脸嫌弃的在唯一留下的一座小城市里蹭了蹭鞋子： 「恶心」\n\n也许城里的小人们根本就来不及思考发生了什么事，只是愣愣的看着巨大的女孩一脸鄙夷地将周遭数百里的河山踏为平地，无论是高楼巨墙，还是山脉密林，亦或是劲弩大炮，在少女那双毁天灭地的帆布鞋下统统化为粉尘，目睹了一阵阵强劲的地震撕裂了大地，震碎了天空，最后，亲眼看着那鞋底伸向了自己…… 脏兮兮的鞋底上，小人们还能勉强分辨出曾经的建筑…… 当然，随着巨娘将这片城市当成地毯蹭蹭鞋底之后，一切都不复存在了，待到巨大的女高中生离去后，那些在毁灭践踏下幸存下来的人们，壮着胆子从被踩成盆地的废墟里面爬出来，映入眼帘的，是满目疮痍，是万般死寂，是再无希望，是永远被囚禁在女孩一念之间踩出的天坑里…… 当然，女孩可不会去管脚下无数小人的惨叫和求饶，不可阻挡的巨足碾碎了根本不能算是阻碍的城墙，一脚踏进了这座被誉为商业中心的城市，随着左右碾动的巨足，整个市中心被女孩关进了用足尖圈划出的牢笼里，不明所以的小人们刚刚还享受着商业街里琳琅满目的商品和食物，转眼间，铺天盖地的足底就占领了整片天空，掉落的尸块，破碎的建筑几近填满了徒步区，而当人们慌乱得跑出来后才绝望的发现，调皮的巨娘小姐早就给他们划好了监狱……那深不见底的裂隙的崖臂里面，镶嵌了原本应该存在地面上的建筑群残骸，残肢断骨被碾碎再碾碎，但……当小人们瞻仰那只巨大的帆布鞋时……甚至找不到一点殷红的痕迹……\n\n「啊啦啊啦……走怎么久了，终于可以玩玩啦」\n\n惬意的伸伸懒腰，劳累了一路的女孩一屁股坐在地上，盯着那被自己圈起来的监牢\n\n「所以……你们就是目标咯？要摧毁的文明首都？」\n\n女孩不知道，她的屁股下面正好是这个国家最伟大的庙宇，那两团压破云层的巨大软肉飞速下落，转眼间，将近十万前来奉拜的小人就这样惨死在了女高中生的丰臀之下，不知是不是这憨憨巨娘有意为之，那座恢宏的庙宇好巧不巧落在了她后庭一毫米之外，庙里信众们除了错愕的望着那不断喷涌出恐怖气息的牛仔裤外……还能做什么?啊对了……还能去拜一拜他们信仰的神明们， 似乎是忍耐到了极限，一股气流从巨大的牛仔裤里面喷发而出，狂乱的气流席卷着女孩身后的一切，将小人和他们的建筑纷纷卷上天空，撕碎，搅烂，化作一团团血污弥散在女孩小小的屁里， 直到一切平静下来，女生的身后已经完全找不到小人的痕迹了，表层的大地被轻松掀开，黄褐色的泥土里面零星丢弃着灾难过后幸存的东西……至于庙宇里那尊纯金打造的神像，可能也连同着那建筑，以及里面数百信众，一起被撕碎在淡淡的气息里了吧？
  gts_evt_random.040220.desc: "On a battlefield of some planet, two armies faced each other, war drums thundering as they fought for every inch of ground, giving no quarter.\n\nBut why were the soldiers, meant to charge into battle, raising their heads instead, staring intently at the sky? Because a stain the size of a city shouldn't be stuck to the actual sky, should it? Nor should it have neat, uniform lines, or a dull grey color, right? A giant boot landed nimbly on the ground; and being a single-footed landing, the girl wearing the boot had to flail her arms to barely keep her balance.\n\n'Ugh... finally arrived. Okay, okay, let's see... This mission should be to shrink and then slowly destroy a country...' \n\nWhile fiddling with her communicator and muttering to herself, the girl started walking in the direction of her objective. Perhaps noticing she stepped on something, she just casually dragged her canvas shoe across the ground, kicking off some dust, without ever looking back and continued her mission. As for that chaotic battlefield with ten thousand troops? Ah, maybe some crushed bits and pieces could be found in those two huge footprints that could each fit several cities? After all... even a shrunken giantess's foot, with its sky-covering size,  is too much for those insignificant little germs to bear. Some unfortunate recruits hadn't even made contact with that hallowed sole; their armor already bursting from the immense pressure.\n\n'How much money will be left after this job... That star looks really yummy...' \n\nThe carefree high school girl traversed the vast earth... or rather, what was once vast earth. To the giantess’s massive canvas shoes,   'vast’ was indeed something of a misnomer. Potholes everywhere, and the small bumps and towns that are everywhere made the upset high school girl feel rather annoyed.\n\n'Hmph... You truly have no eyes, building stuff in places that would annoy me when I’m thinking...' \n\nThe girl grumbled, stomping hard on a small stain on the ground. Not feeling satisfied, she stomped everything nearby again and again, until the surrounding area became a flat, yellow field, and only then did she lightly snort, and with a disgusted look, rubbed her shoe on the one small city that was barely left, saying, 'Disgusting'.\n\nPerhaps the little people in the city didn’t even have time to think about what was happening, as they watched, stunned, as the huge girl scornfully flattened hundreds of miles of rivers and mountains. Whether it was tall buildings and great walls, or dense forests, or powerful crossbows and cannons, all of it turned to dust under the girl's pair of world-destroying canvas shoes. Seeing an array of powerful earthquakes tearing the land, breaking the sky, they ultimately watched as that shoe sole moved towards them... On that dirty shoe sole, the little people could barely make out what their buildings once were... Of course, after the giantess used the city as a carpet to rub the soles, everything ceased to exist. When the huge high school girl finally left, those who had survived the destruction and trampling, mustered their courage and crawled out of the basin-like ruins. What greeted them was desolation, a deathly silence, a total loss of hope, and a fate of being forever imprisoned within the sinkhole that the girl's whim had created... Of course, the girl paid no mind to the countless screams and pleas for mercy from those under her feet. The unstoppable giant foot crushed the city walls which were not even obstacles as it stepped into what is touted as the commercial center of the city. With the giant foot grinding left and right, the entire downtown area was locked inside the circle that the toe had drawn.  The little people, still enjoying the dazzling array of goods and food on the commercial streets just a moment ago, now realized that the sole of a shoe, covering the sky, had filled the whole sky above, and bits of corpses and shattered buildings were filling the streets. Then, the people scattered in a panic; they were desperate to find that the mischievous giantess had already drawn them an inescapable prison.. Fragments of ruined buildings were embedded in the cliffs of the unfathomably deep cracks, next to crushed limbs and bones. Yet… when the little people look up at the huge canvas shoe… they are unable to find even the slightest trace of red…\n\n'Ah, ah... After walking so long, finally time to play around.'\n\nContentedly stretching her arms after her tiring walk, the girl sat on the ground, staring at the prison she had created. \n\n'So... You guys are the target then? The capital of the civilization to be destroyed?'\n\nLittle did the girl know, her butt was right on top of the greatest temple in that very country. The two giant, soft mounds that pressed through the clouds plunged downwards, and in an instant, almost 100,000 little people who had come to worship were killed under the high school girl's hefty behind. As it turned out, if by the giantess’ own intention or just out of pure chance, that magnificent temple fell just one millimeter away from her rear. What could the devotees do other than stare at the terrifying aura that was continuously spewing out of that pair of jeans? Oh that’s right…  they could also go and pray to the gods that they believed in. As if reaching her limit, a burst of air came out of those giant jeans, the chaotic air current sweeping away everything behind the girl, tearing the little people and their buildings into the sky, smashing and shredding, all dissolving into a cloud of blood splatter on the girl’s tiny butt. When everything settled, there was no trace of the little people left behind the girl. The top layer of earth was easily lifted up, with remnants of the disaster discarded amidst the brown soil... As for that pure gold statue of god inside the temple, likely together with the building, and the hundreds of devotees inside, they were torn apart by an ethereal aura."
  # 来自遥远星系的消息-编号87618
  gts_evt_random.040230.name: "Message from a Distant Star System - ID 87618"
  # 一片漆黑， 什么都没有， 我睡了多久了呢……\n\n那个浑身赤裸的女孩子在这一片无穷无尽的黑暗中坐了起来，揉了揉眼睛\n好黑啊……为什么这么黑呢…… 她伸手在旁边乱抓一气，手碰到了一个硬邦邦的重物\n这是什么……\n女孩抓起了那个重物的柄，那是一把斧头，一把无法估量其重量的斧头，可是，女孩轻轻松松把它拿了起来，斧头用力挥过去，一片黑暗发出了被击中的闷响，随后黑暗裂开了\n\n女孩看着刺目的光芒，不由得闭上眼，混沌被分开了，慢慢的，轻而清的物体升到上方，变成了天；重而浊的物体落到下方，变成了地，女孩庞大的身体踩在地面上，在地面上留下了自己的脚印，这些脚印后来变成了洋，它们还会合起来吧…… 女孩用力托住天，脚趾用力抵住地面，天和地的高度越来越高，女孩的身体也变得越来越巨大，终于有一天，女孩纤细的手臂已经支撑不住天的重量了，天和地的距离已经变得相当远，女孩放心地躺了下来\n\n女孩已经很累了，在她创造的世界里沉沉地睡了过去\n\n这之后，女孩呼出的气息变成了这个世界的云和风，这个世界的狂风只是因为女孩的呼吸稍微剧烈了一点点罢了；女孩呼吸的声音变成了这个世界的雷声，太阳和月亮的交替只不过是女孩在用好奇的目光观察着这个世界的每个角落，东西南北四极是女孩四肢的方向，女孩轻轻活动一下，就会改变四极的方向，地面的泥土是女孩皮肤上的污垢，而人们看见的大江大河是女孩的头发落下之后压出的河道，女孩的汗水，最终变成了这个世界的降水降雪\n\n女孩在自己创造的世界里满意地沉睡着，不知何时，女孩会再次醒来，为这个渺小的世界降下神罚吧
  gts_evt_random.040230.desc: "Pitch black, nothing at all. How long have I been asleep...\n\nThe naked girl sat up in this endless void of darkness, rubbing her eyes.\nIt's so dark... why is it so dark? ...She reached out and groped around, her hand touching a hard, weighty object.\nWhat is this...?\nThe girl grabbed the handle of the weighty object. It was an axe, an axe of immeasurable weight, yet the girl easily picked it up. She swung the axe hard, and the darkness echoed with a dull thud, then the darkness split apart.\n\nThe girl looked at the blinding light and couldn't help but close her eyes. Chaos had been divided. Slowly, light and clear things rose upward and became the sky. Heavy and turbid things fell downward and became the earth. The girl’s immense body stepped on the ground, leaving her footprints on the surface of the earth - these footprints later became the oceans, and they will surely merge again one day...The girl stretched her body to support the heavens, her toes pushing hard against the ground. The distance between the sky and the earth grew higher and higher, and the girl’s body became more and more enormous. Finally, one day, the girl’s slender arms were not able to support the weight of the sky any longer. The distance between the two grew considerably, so the girl laid down relieved.\n\nThe girl was exhausted, and fell into a deep sleep in the world she had created.\n\nAfter that, the girl's breath became the clouds and wind of this world. The world's violent gales are nothing more than the sounds of the girl's slightly more intense breathing. The girl's breathing became the world's thunder, and the alternating suns and moons are simply the girl using her curious eyes to observe every corner of her world. The four cardinal directions are the directions her limbs point, and the slightest movement from the girl would change the directions. The dirt on the ground is the dirt from the girl's skin; and the great rivers that people see are the channels formed from the places where the girl's hair fell. And finally, the girl's sweat turned into the world's rain and snow.\n\nThe girl is sleeping contently in the world she created, and the day she wakes again, her small world may feel her divine retribution."
  # 来自遥远星系的消息-编号1266202
  gts_evt_random.040240.name: "Message from a Distant Galaxy - No. 1266202"
  # 遥远银河深处，一颗九成地表被温热浅海包裹的热带行星。\n\n从轨道俯瞰，宽广的海洋上散布着无数大小不一外形不同的岛屿，奶白色沙滩沿着曲折海岸线绵延，海礁与高崖上的灯塔为繁盛的航运贸易昼夜轮转着，滨海城邦的高楼顺着海湾层层铺开，碧海间游弋着白帆游轮与观光快艇。这是一个处于原子时代的前超光速文明，适宜的全球性热带气候塑造了温和的文明思潮。在这一前提下诸多岛屿城邦逐渐联合在一起以一种十分平和稳定的方式完成了全球大一统，未曾经历阵痛的文明仍如孩童一般天真。\n\n清澈的大海反射出星河的倒影人们自顾自的认为在高天之上如同孤岛的星球上仍有与自己相似的存在。在诸多因素的影响下，文明大力发展旅游业并默认了各种不同形态的外星来客降临观光的设施，他们相信如此的美丽风景与温和气候一定能使可能存在的外星来客流连忘返。\n\n于是，无知的文明竖起极其原始的深空广播阵列，向银河传达他们的善意。\n\n§H让所有跋涉星海、被工作与族群压力束缚的旅人，拥有一处无需拘束的避风港。§!\n\n这句发向深空的宣传语刻在各个景区的观光石碑上，也是对外宣传坚持的信条。\n\n循环播放的广播伴随着海浪、椰风与轻音乐，日复一日向深空传递。本土居民们满怀期待，沙滩上搭建了无数观光驿站，港口常年预留空置泊位，留出大片临海空地。\n\n所有人都怀揣着善意，期待远道而来的星际访客。只是没人预料到这份邀请会引来§R远超§!他们认知的客人。
  gts_evt_random.040240.desc: "Deep in a distant galaxy lies a tropical planet, ninety percent of its surface wrapped in warm, shallow seas.\\n\\nViewed from orbit, countless islands of different sizes and shapes are scattered across the vast ocean. Milky-white beaches stretch along winding coastlines. Lighthouses on reefs and high cliffs turn day and night for the thriving shipping trade, while the high-rises of coastal city-states spread layer upon layer along the bays. White-sailed cruise ships and sightseeing speedboats roam the blue sea. This is a pre-FTL civilization in the atomic age, and its suitable global tropical climate has shaped a gentle civilizational mindset. Under these conditions, many island city-states gradually joined together and achieved global unification in an extremely peaceful and stable way. A civilization that never experienced such growing pains remains as naive as a child.\\n\\nThe clear sea reflects the stars, and the people assume on their own that beyond the high heavens, on planets like isolated islands, there must still be beings similar to themselves. Under the influence of many factors, the civilization vigorously developed tourism and prepared facilities for alien visitors of many different forms to descend and sightsee. They believe that such beautiful scenery and gentle weather will surely make any possible alien visitors reluctant to leave.\\n\\nThus, this ignorant civilization erected extremely primitive deep-space broadcast arrays and conveyed their goodwill to the galaxy.\\n\\n§HLet every traveler who has crossed the sea of stars, bound by work and the pressure of their people, have an unconstrained haven.§!\\n\\nThis promotional line sent into deep space is carved on sightseeing steles in every scenic area, and it is also the creed upheld in their external publicity.\\n\\nLooping broadcasts, accompanied by waves, coconut breezes, and light music, transmit into deep space day after day. The local residents are full of expectation. Countless sightseeing stations have been built on the beaches, the ports keep vacant berths reserved year-round, and broad stretches of coastal open land have been set aside.\\n\\nEveryone carries goodwill, looking forward to interstellar visitors from afar. They simply never expected that this invitation would draw guests §Rfar beyond§! their understanding."
