  # 而完全尝到破坏与戏弄甜头的林凤，则不由分说地将满脸通红、还在无力抗议的希瞳硬生生拽进了都市旁那片蔚蓝的深海之中。此时的两人已经深入到了远海。对于凡人而言深不可测的吞人巨浪，此刻却仅仅只能堪堪没过她们那如白玉雕琢般肉感的大腿。林凤那条足以轻松压塌山脉的丰满手臂毫无顾忌地揽过希瞳娇软的肩膀，带着绝对的力量优势，将这只平时高傲自大的猫猫狠狠地搂进自己怀里，任由两人的肉体毫无缝隙地紧紧贴合在一起。而被死死禁锢住的希瞳，此刻整张俏脸已经羞红得快要滴出水来，先前高冷腹黑的劲头荡然无存。她头顶的棕色猫耳无助地耷拉着，双手羞恼地抵在林凤丰满的胸前，象征性地推搡着，嘴里细细地哼唧、呜咽着，却在林凤压倒性的体型力量和灼热体温面前彻底沦陷，只能任由这只涩涩的粉狐狸对自己肆意搂抱。\n\n随着她们的移动，海面上掀起了排山倒海的巨浪，一整支严阵以待、试图做最后抵抗的联合舰队，在她们眼里不过是澡盆里漂浮的一堆塑胶碎屑。\n\n§r看啊，希瞳，这些小玩具还在朝我们开火呢~§!\n\n林凤娇笑着，浑然不顾那些细小的导弹和炮火打在自己白嫩的大腿上，连一丝痕迹都留不下来。她顺势抓起希瞳那只白皙柔嫩的手腕，强行带着那温热的手掌朝海面压去。\n\n轰隆——！\n\n在林凤绝对力量的裹挟下，希瞳的手掌无可奈何地拍在了一艘数十万吨级的航空母舰上。坚固的钢铁甲板在巨娘柔嫩的掌心下瞬间凹陷、崩裂，伴随着惊天动地的爆炸与火光，整艘航母被生生拍进深海，化为一团扭曲的废铁。希瞳敏感到手心传来的微弱震动与酥麻，整张脸红得发烫，赌气般地用修长的指尖轻轻一划，又将旁边两艘驱逐舰像切豆腐般割成两半，嘴里羞恼地嘟囔着：\n\n§Y坏心眼的林凤……明明是你自己想玩……§!\n\n林凤被她这副傲娇却又不得不配合的模样逗得花枝乱颤，胸前那一对巍峨的丰满剧烈起伏，将怀里的希瞳挤压得几乎窒息。林凤腾出一只手，挑逗般地捏了捏希瞳那因害羞而不断抖动的棕色猫耳，随后搂着她，不紧不慢地向海岸线逼近。她们那双足以遮天蔽日的巨足在海中每迈出一步，都会引发数百米高的海啸。巨浪裹挟着破碎的战舰残骸，铺天盖地地席卷了整片金黄色的海滩。海滩上的防御工事、奢华的度假酒店，在海啸与巨娘带来的破坏下瞬间粉碎，化作碎屑。\n\n§r接下来，换个更亲密的玩法吧~§!\n\n林凤在希瞳耳边轻轻吹了一口气。随后，她根本不给希瞳任何反应的机会，手臂骤然收紧，直接将希瞳整个人朝着海滩的方向猛地扑倒过去！轰然巨响中，两具数公里高的身体以一种亲密的姿势重重地砸落。林凤居高临下地将希瞳死死压在身下。 无数还在海滩上绝望奔逃、凄厉惨叫的小人，连逃跑的方向都无法辨别，便在一瞬间被天空中压落的雪白肌肤、丰满的腰臀无情地碾碎、抹平。金色的沙滩瞬间被无尽的血水染成了刺眼的暗红色。希瞳被林凤半强迫地压在身下，两人的泳装布料在激烈的摩擦中微微错位，大片大片雪白细腻的肌肤紧紧贴合，带来滚烫的温度。极致的羞耻感让这只高傲的猫娘彻底迷失了理智。她那条棕色的猫尾巴终于忍不住温顺地缠绕上了林凤粉色的狐尾，两只巨娘在满天死寂的废墟、滚滚的黑烟与血雨中，一边亲密地贴贴、娇喘、将一旁的楼房送入彼此的阴穴中，一边用自己那完美的身躯，残忍地将这片海岸存在过的痕迹彻底抹去。
  gts_evt_random.040248.desc: "Lin Feng, having fully tasted the thrill of devastation and teasing, dragged the flushed and feebly protesting Hitomi straight into the deep azure sea beside the metropolis without giving her a say. The two had soon waded into the deep waters. Towering waves that would swallow ordinary mortals barely reached past their fair, jade-like thighs. Lin Feng's plump arm, powerful enough to level mountains with ease, casually looped around Hitomi's soft shoulders, pulling the normally haughty catgirl into a tight embrace with overwhelming strength, pressing their bodies flush against one another. Thoroughly pinned, Hitomi's lovely face flushed a deep crimson, her former aloofness completely evaporating. Her brown cat ears drooped helplessly, and she pressed her hands against Lin Feng's bosom in symbolic resistance, letting out soft whimpers and squeaks. Yet against Lin Feng's overpowering size and radiating heat, she gave in completely, allowing the affectionate pink fox to hold her close.\\n\\nAs they moved, mountain-high tidal waves surged across the ocean. An entire battle fleet assembled for a final stand looked like nothing more than plastic toys bobbing in a bathtub before their eyes.\\n\\n§rLook, Hitomi, these little toys are still shooting at us~§!\\n\\nLin Feng giggled, paying no mind to the tiny missiles and artillery shells striking her fair thighs without leaving the slightest mark. Grabbing Hitomi's slender wrist, she guided her warm palm downward toward the sea.\\n\\nCrash—!\\n\\nUnder Lin Feng's guided momentum, Hitomi's palm slapped down onto a hundred-thousand-ton aircraft carrier. The hardened armor deck instantly caved in and fractured beneath the Giantess's soft palm, exploding in fiery debris as the carrier was driven deep beneath the waves, reduced to twisted metal. Feeling the faint tingles and vibrations in her palm, Hitomi's face burned hot. In playful defiance, she sliced two nearby destroyers cleanly in half with her