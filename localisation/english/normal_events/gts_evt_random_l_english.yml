  # 在经历一段时间的狂欢后，各自抱团四散玩弄小人的少女们在最初降临的首都城市圈汇合。六人围坐在几乎化作废墟的深空广播阵列之上，彼此分享先前游玩时的趣闻，语气中满是放松惬意。正在从各个角度夸赞这个小人文明的女孩们丝毫没有留意臀下废墟缝隙里与腿边膜拜舔舐腿部肌肤的小人。\n\n她们畅谈下次再来的游玩计划，规划走遍这颗星球每一处山谷、沙滩、湖泊，而对于小人们而言巨娘的每一次降临、每一场嬉闹都会带来灭顶之灾。\n\n夜色缓缓笼罩整片破碎首都，少女们占据着整个城市，依照着破灭磨损的灯火围绕着还算完整的地标性建筑席地而睡。庞大身躯压在残存建筑上，剩余少量完好楼宇持续崩解。肌肤偶尔会感受到悉悉索索的动静，少女们也是内心忍不住轻笑，肆意体会着对小人们的优越感。\n\n废墟中涩涩发抖的小人们，听着楼层上方六尊少女平缓的呼吸声，心底只剩无尽悲凉。\n\n初入群星的人们曾经以为，包容与善意能够联结银河所有生命，却忽略了体型、认知、生存立场之间无法跨越的鸿沟。一句毫无保留的度假宣传，让整个文明沦为六位巨娘排解压力的玩具沙盘。
  gts_evt_random.040249.desc: "After a period of revelry, the girls who had split into groups to toy with the tinies regrouped in the capital urban area where they had first descended. The six of them sat in a circle atop the deep-space broadcast array that had nearly become ruins, sharing amusing stories from their earlier playtime, their tones relaxed and comfortable. As the girls praised this tiny civilization from every angle, they paid no attention at all to the tiny people in the cracks of the ruins beneath their hips or beside their legs, worshipping and licking the skin of their legs.\\n\\nThey chatted freely about plans for their next visit, planning to tour every valley, beach, and lake on this planet. Yet for the tiny people, every descent and every frolic of the Giantess would bring catastrophe.\\n\\nNight slowly shrouded the entire shattered capital. The girls occupied the whole city, sitting down and sleeping around the relatively intact landmark buildings by the ruined and worn lights. Their enormous bodies pressed down on the surviving structures, causing the small number of remaining intact buildings to continue collapsing. Their skin would occasionally feel faint rustling movements, and the girls could not help laughing inwardly, wantonly savoring their superiority over the tiny people.\\n\\nThe tiny people trembling in the ruins listened to the steady breathing of the six girls above the floors, with nothing but endless sorrow left in their hearts.\\n\\nWhen people first entered the stars, they once believed that tolerance and goodwill could connect all life in the galaxy, but they overlooked the unbridgeable gulf between size, cognition, and the position of survival. A single unreserved vacation advertisement reduced an entire civilization to a toy sandbox where six giantesses could relieve their stress."
  # 至少比在我们首都里蹦蹦跳跳强
  gts_evt_random.040249.a: "At least it's better than having them bounce around in our capital."
  # §Y记得将这颗星球改为专为巨娘提供服务的旅游星球§!
  gts_evt_random.040249.a.tooltip: "§Y, remember to turn this planet into a tourist destination exclusively for Giantesses!§!"
  # 科学家的丝袜
  gts_evt_random.050011.name: "The Scientist's Stockings"
  # 根据观测站的报告 ，我们的科学家[scientist.GetName]在一次地面调查中遗失了自己的丝袜，现在这颗星球上的土著们将她的丝袜当作上帝的巨作，并在其周围建立了圣地现在这名科学家准备将其找回，我们要用什么方法呢？
  gts_evt_random.050011.desc: "According to the observation station's report, our scientist [scientist.GetName] lost their stockings during a ground survey. The primitives on this planet are now treating their stockings as a masterpiece of God and have built a holy site around them. The scientist is now preparing to retrieve them. What method should we use?"
  # 直接下去拿回来就好了咯
  gts_evt_random.050011.a: "Just go down and get them back."
  # 就让它放在那里吧，那群土著也不可能根据足香研究出跃迁引擎的
  gts_evt_random.050011.b: "Just let them stay there; those primitives aren't going to research a ftl engine from the scent of feet."
  # 不如直接下去宣称自己是天使，自己是来取回丝袜的
  gts_evt_random.050011.c: "Why not just go down and declare that we are angels, and have come to retrieve the stockings."
  # 向这个前超光速文明揭示我们的存在，将他们的觉醒度提升到最高
  gts_evt_random.050011.c.tooltip: "Reveal our existence to this pre-FTL civilization, and raise their awareness to the highest level."
  # 小人土著观察报告
  gts_evt_random.050021.name: "Small-Person Primitive Observation Report"
  # 我们在他们的网络上寻找到了可能和我们有关的一些资讯：一个崇拜巨娘和女神的网络论坛。我们很简单地获取到了整个论坛的数据，这些数据大多是文章，少部分是图片与视频。我们对所有内容进行了分析，找到了数篇与我们帝国的情况极其吻合的文章……我们首先怀疑是某位观察员私自在这论坛写下的这些文章，但很快我们就否定了这个推测——因为我们绝大多数的观察员都沉迷于这些文章中。我们对此感到奇怪，因为这些文章算不上有多好，但我们就是喜欢——尤其是那些巨娘毁天灭地的场景，那些动辄就毁灭万千世界的力量……虽然我们也能做到这种程度，但当我们看着这些小家伙写出来的文章，带来的感觉却完全不一样
  gts_evt_random.050021.desc: "We have found some information that may be related to us on their internet: a network forum that worships giantesses and goddesses. We easily obtained the entire forum database. Most of this data is in the form of articles; a small part is images and videos. We have analyzed all the content and found several articles that match the circumstances of our empire extremely well…At first, we suspected that some observer had written these articles on this forum privately, but we quickly rejected that supposition - because most of our observers are addicted to these articles. We are feeling strange about this because these articles are not that good, but we are captivated by them-especially those scenes of giantesses destroying heaven and earth, those powers that effortlessly destroy thousands of worlds…Although we can also achieve this level, when we look at these articles written by these little fellows, the feeling they bring is completely different."
  # 也许，我们需要被歌颂
  gts_evt_random.050021.a: "Perhaps, we need to be glorified."
  # 神秘易开罐
  gts_yintao_category: "Mysterious Soda Can"
  # 轨道上突然出现了一个装满了奇怪液体的普通小型易开罐，罐体上刻着\"鹿鹿\"二字
  gts_yintao_category_desc: "A normal small soda can, filled with a strange liquid, has suddenly appeared in orbit, with the characters 'Lulu' engraved on the can."
  # 罐装爱液
  gts_evt_random.060000.name: "Canned Love Fluid"
  # 我们派遣了一艘科研船将其打捞并进行研究\n\n研究人员发现这杯液体其实是女性在自慰后产生的爱液，但其能量含量极其丰富，能够作为高质量浓缩燃料使用，仅仅是一滴就能让一整支舰队持续运行数十年\n\n进一步研究发现，生物在饮用爱液后，体质、心智、繁衍能力都会得到极大增强\n\n如果我们将这杯液体平均分给所有同胞，整个物种将会进化，如果我们仅仅将其供应给领袖，那么她们的工作效率将会大大提高\n\n由于液体数量稀少，无法满足所有需求，我们该怎么分配这杯液体？
  gts_evt_random.060000.desc: "We dispatched a research vessel to salvage and study it.\n\nResearchers discovered that this liquid is actually love fluid produced by a woman after masturbation. However, its energy content is extremely rich and can be used as a high-quality concentrated fuel. Just one drop could keep an entire fleet running for decades.\n\nFurther research has discovered that after consuming the love fluid, the physical constitution, mental state, and reproductive ability of biological organisms will be greatly enhanced.\n\nIf we distribute this liquid evenly to all of our compatriots, the entire species will evolve. If we provide it only to our leaders, then their work efficiency will increase greatly.\n\nSince the amount of liquid is scarce and cannot meet all needs, how should we distribute this liquid?"
  # 作为能源
  gts_evt_random.060000.a: "Use it as energy."
  # 分给所有人
  gts_evt_random.060000.b: "Distribute it to everyone."
  # 分给我们的领袖
  gts_evt_random.060000.c: "Distribute it to our leaders."
  # 残骸回收:足底
  gts_evt_random.070010.name: "Debris Recovery: Foot Sole"
  # 在激烈的战斗过后，我们发现§Y[event_target:gtsra_fleet_leader.GetName]§!的脚底已经因为战斗而变的肮脏不堪在她脚底的指纹迷宫里，到处都是敌人舰队的抵抗痕迹，以及他们被巨足轻松拍扁所留下的残骸并且，在§Y[event_target:gtsra_fleet_leader.GetName]§!的脚趾之间，我们甚至发现了几颗无意间被卷入的小型的要塞星球残骸\n\n我们应当回收这些材料吗？
  gts_evt_random.070010.desc: "After the fierce battle, we found that §Y[event_target:gtsra_fleet_leader.GetName]§!'s foot sole was incredibly dirty from the battle. In the fingerprint maze of her foot sole, there were remnants of the enemy fleet's resistance everywhere, along with the debris left behind from them being easily flattened by her giant foot. Furthermore, in between §Y[event_target:gtsra_fleet_leader.GetName]§!'s toes, we even discovered the remains of several small fortress planets that had been unintentionally caught up.\n\nShould we recover these materials?"
  # 是的，并且我们还要连着脚底的星球一块回收
  gts_evt_random.070010.a: "Yes, and we'll recover the planet attached to her foot as well."
  # 是的，但是只回收那些指纹之中方便获取的材料
  gts_evt_random.070010.b: "Yes, but only recover the materials in the fingerprints that are easy to access."
  # 不，就让§Y[event_target:gtsra_fleet_leader.GetName]§!自己用星海冲刷掉这些脏污吧
  gts_evt_random.070010.c: "No, let §Y[event_target:gtsra_fleet_leader.GetName]§! use the stellar sea to wash this dirt away herself."
  # 我们试图派出舰队去清理她的脚底事情一开始非常顺利，我们的舰队成功的从§Y[event_target:gtsra_fleet_leader.GetName]§!的脚底获得了很多的合金但是，当我们的舰队尝试去清理那些漂浮在趾缝中看似废弃的要塞残骸的时候，要塞突然启动，并向四面八方开始攻击最为可怕的是，被这种攻击所搔痒的§Y[event_target:gtsra_fleet_leader.GetName]§!，下意识的就用双脚摩擦了起来，希望这种搔痒感消失的时候，也无意间将我们用于处理她脚底脏污的舰队，和回收的资源一块重新变成了她脚上的污垢
  gts_evt_random.070011.desc: "We tried to send a fleet to clean her foot sole. Things went smoothly at first, and our fleet successfully obtained a lot of alloys from §Y[event_target:gtsra_fleet_leader.GetName]§!'s foot sole. However, when our fleet tried to clean up those seemingly abandoned fortress remnants floating in the toe gaps, the fortresses suddenly activated and started attacking in all directions. The most terrifying thing was that §Y[event_target:gtsra_fleet_leader.GetName]§!, who was being tickled by this attack, subconsciously started rubbing her feet together, hoping that the itchiness would disappear unintentionally, and thus unknowingly turned our fleet, and the recovered resources, back into dirt on her feet."
  # 哦，不……
  gts_evt_random.070011.a: "Oh, no..."
  # 我们试图派出舰队去清理§Y[event_target:gtsra_fleet_leader.GetName]§!的脚底她悠闲的躺在虚无的星域之中，翘起的两只玉足之上，满是我们所需要的资源在清理完她整个玉足之上数不胜数的敌人舰队残骸之后，我们还分解了那些脚趾缝之间被汗液所黏上的要塞这些要塞虽然已经失去了战斗的能力，但在拆解之后依然成了我们的一大笔财富
  gts_evt_random.070012.desc: "We attempted to send a fleet to clean §Y[event_target:gtsra_fleet_leader.GetName]§!'s foot sole. She was leisurely lying in the void of space, and her two upturned jade feet were covered with the resources we needed. After cleaning up the countless enemy fleet remnants on her entire jade foot, we also dismantled the fortresses that were stuck together in the toe gaps by sweat. Although these fortresses have lost their war capabilities, they still became a great fortune after being dismantled."
  # 这是个很好的消息
  gts_evt_random.070012.a: "This is good news."
  # 我们只试图去清理了那些脚底板上的残骸这些残骸易于获取，且§Y[event_target:gtsra_fleet_leader.GetName]§!觉得这样做并无不妥在重新让她的玉足变回干净之后，也从她的脚上收获到了一大笔财富
  gts_evt_random.070013.desc: "We only tried to clean the debris on her foot sole. This debris was easy to access and §Y[event_target:gtsra_fleet_leader.GetName]§! didn't think there was anything wrong with doing this. After having her jade feet returned to being clean, we also gained a fortune from her feet."
  # 这是好的
  gts_evt_random.070013.a: "That's good."
  # §Y[event_target:gtsra_fleet_leader.GetName]§!将足底深入了星系的恒星之中灼热的火焰，对她来说不过是清理脚底的温热液体罢了在恒星的吞噬之中，那些脚上的残骸也逐渐消失，化作了乌有……
  gts_evt_random.070014.desc: "§Y[event_target:gtsra_fleet_leader.GetName]§! plunged her foot soles into the star of the system. The scorching flames were just warm liquid used to clean her feet for her. As the star engulfed them, the debris on her feet gradually disappeared and turned to nothingness..."
  # 其实看她泡脚也蛮好，不是吗？
  gts_evt_random.070014.a: "Actually, it's nice to watch her soak her feet, isn't it?"
  # 残骸回收:胸口
  gts_evt_random.070020.name: "Debris Recovery: Chest"
  # 激烈的星域会战已然落幕，§Y[event_target:gtsra_fleet_leader.GetName]§!正慵懒地漂浮在星海之中小憩。方才的战斗中，她以压倒性的力量将敌方舰队连同数颗行星尽数碾碎于她那浩瀚的双峰之间。她那宏伟的双乳成为了战场中最具毁灭性的武器，是碾碎敌舰集群的绝望之壁。此刻，那广袤宏伟的胸器上遍布着无数战舰的残骸与星辰的碎片。无数敌舰的残骸深深嵌入了她柔软的乳肉之中。深邃的乳沟之间，汇聚了敌舰残骸以及因剧烈运动而渗出的、散发着微光的芬芳汗珠，如同包裹着稀有矿物的琥珀。而在那傲然挺立的粉红乳首周围，有着一些她战斗时分泌的乳汁，这些珍贵的合金与巨娘乳汁混合在一起，形成了一笔令人垂涎却又极度危险的财富，扫描显示深处的乳腺管道中甚至有更多尚未喷出的乳汁。我们面临一个充满机遇与危险的选择：如何回收这些珍贵的战利品？
  gts_evt_random.070020.desc: "After the fierce battle, we discovered that §Y[event_target:gtsra_fleet_leader.GetName]§!'s breasts were covered in debris. This might be because she prefers to fight with her chest, or it might just be that these fleets didn't have time to turn to attack §Y[event_target:gtsra_fleet_leader.GetName]§!'s other body parts before being crushed by her massive breasts. A large amount of debris that we could recover and use was detected on her nipples, the surface of her areolas, and within her mammary glands.\n\nShould we recover these materials?"
  # 稳妥起见，只收集乳首及乳晕表面的残骸即可
  gts_evt_random.070020.a: "Yes, and... I want more!"
  # 深入探索！乳汁和残骸我们全都要！
  gts_evt_random.070020.b: "How about cleaning inside her nipples as well?"
  # 等待她自行醒来
  gts_evt_random.070020.c: "No, the debris on the surface of the areolas and outside of the nipples is enough."
  # 让她自行处理?
  gts_evt_random.070020.d: "Let her handle it herself?"
  # §Y残骸回收:胸口 - 表面清理§!
  gts_evt_random.070021.name: "§Y Wreckage Recovery: Chest - Surface Cleaning §!"
  # §Y我们选择了最谨慎的方案§!\n舰队避开了所有深邃而危险的区域，仅在§Y[event_target:gtsra_fleet_leader.GetName]§!高耸的乳峰表面及乳晕外围进行作业。就像在沙滩上拾取贝壳一样，回收船们高效地工作着，将那些易于获取的资源一一收起。虽然避免了深入险境，但收获也相对有限，那些卡在乳沟最深处的庞大残骸只能无奈放弃§Y[event_target:gtsra_fleet_leader.GetName]§!全程安然酣睡，对发生的一切毫不知情。任务安全完成，但总感觉有些意犹未尽
  gts_evt_random.070021.desc: "Not only did we want to clean the debris from the giantess's breasts, but we also wanted more. Therefore, we requested that §Y[event_target:gtsra_fleet_leader.GetName]§! show us her cleavage. Hiding between her enormous breasts were more enemy engineering ships, crushed between her breasts. As the engineering ships attempted to recover the debris, her enormous breasts bounced inward, trapping our ships inside.\n\nWhat are you doing, §Y[event_target:gtsra_fleet_leader.GetName]§! ?\n\nThe girl finally came to her senses and released the engineering ships trapped in her cleavage. Although the engineering ships were not damaged, the crew on them were terrified..."
  # 安全第一，稳扎稳打总是没错的
  gts_evt_random.070021.a: "It's good that they're okay."
  # §G残骸回收:胸口 - 乳首的恩赐(成功)§!
  gts_evt_random.070022.name: "§G Wreckage Recovery: Chest - Nipple's Gift (Success) §!"
  # §R"尝试刺激乳首，让收缩的乳肉把资源「挤」出来"§!\n舰队接受了这个大胆的任务。它们小心地靠近那如同粉色行星般挺立的乳首，使用低强度的脉冲光束进行精准刺激。§Y[event_target:gtsra_fleet_leader.GetName]§!在睡梦中发出一声甜腻的呻吟，身体微微扭动，乳首随之变得坚硬，周围的乳肉也发生了一系列有节奏的、强有力的收缩和震颤。"噗噜噜——"效果立竿见影，卡在乳腺和乳首皱褶深处的资源随着乳汁被猛地喷出，如同喷泉般抛射到附近的宇宙空间。舰队立刻上前，轻而易举地将这些被「吐」出来的战利品尽数回收，收获远超预期！
  gts_evt_random.070022.desc: "The fleet spread out over her breasts, constantly collecting the debris from the pale pink skin. As the fleet delved into her huge nipples, peeling away more and more debris from the nipple grime, they constantly heard the sound of milk surging from deep within her breasts. As the fleet was dragging those valuable resources outwards, our cameras captured the incoming surge of milk... a huge storm of milk formed long milk nebula. Although her mammary glands were cleaned, the fleet also disappeared under this huge sea of milk."
  # 完美的策略！丰厚的回报！
  gts_evt_random.070022.a: "Oh, no!"
  # §R残骸回收:胸口 - 失败§!
  gts_evt_random.070023.name: "§R Wreckage Recovery: Chest - Failure §!"
  # §R"尝试进入乳腺收集资源"§!\n当队试图拖出卡在乳腺深处的残骸时，产生的轻微震动刺激了沉睡的巨娘。§Y[event_target:gtsra_fleet_leader.GetName]§!在梦中不适地轻哼一声，身体微微扭动。就是这一个小小的动作，引发了乳潮！积蓄的乳汁如同决堤般从乳腺口中喷涌而出，形成一股汹涌的白色洪流。我们的舰队瞬间被这芬芳而致命的浪潮吞没，与那些他们试图回收的残骸一同被淹没。所有回收资源损失殆尽，舰队也几乎全军覆没
  gts_evt_random.070023.a.desc: "§R\"Attempting to enter mammary gland to collect resources\"§!\nWhen the team tried to drag out the wreckage stuck deep in the mammary gland, the slight vibration stimulated the sleeping Giantess. §Y[event_target:gtsra_fleet_leader.GetName]§! hummed uncomfortably in her dream and twisted slightly. Just this small movement triggered a milk tide! Accumulated milk gushed out from the nipple like a dam burst, forming a surging white flood. Our fleet was instantly swallowed by this fragrant and deadly wave, submerged along with the wreckage they tried to recover. All recovered resources were lost, and the fleet was almost wiped out."
