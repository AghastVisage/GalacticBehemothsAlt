  gts_evt_random.020025.desc: "After this small person colony was occupied, as usual, [Root.GetRulerTitle][root.GetRulerName], based on the number of small people on the planet, decided to send four saintesses and a large number of nuns to this planet for proselytization. A week later, the four saintesses held a weekly tea party on the outskirts of the former capital of this planet, which had been replaced by footprints.\n\"Hey, hey, listen to me, in the area I'm in charge of, there is a city of small people that is very annoying! Not only do they not convert, they even injured our lovely nuns! What should we do?\" One of the saintesses complains to the other three saintesses while leaning on the table after finishing the cake on her plate.\n\"I have a few cities that are similar.\" \n\"How about using artifacts to force them to convert?\"\n\"But if we use this method, those small people will become dull and not so fun.\"\n\"Then why not just crush them?\"\n\"Eh? Really? It's disgusting to have so many corpses sticking to the soles of my feet.\"\n\"If Lisa thinks it's disgusting, I can do it. I've dealt with all the disobedient small people in my jurisdiction with my feet.\"\n\"Amina's scary.\"\n\"But this method is time-saving and labor-saving. Using artifacts is tiring.\"\n\"Everyone, I have an idea.\"\nThe saintess who had been silent before spoke, interrupting the other three saintesses.\n\"How about letting [root.GetRulerName] send another saintess to manage those disobedient small people?\"\n\"No!\" \"No!\" \"No!\" The other three saintesses rejected this proposal in unison.\nIn the end, the four saintesses solved the problem in the most effective and primitive way: with their feet."
