l_english:
  # 冒失的士兵
  gts_evt_random.010021.name: "Careless Soldier"
  # 我们的一名巨大娘士兵不小心走出了驻地，来到了附近的小人居住区，当然，她发现了问题，但在发现问题后她却\"不小心\"摔倒在居住区上，现在那个地方已经变成了一片废墟，连带周遭数百平方公里的地区都需要重建......
  gts_evt_random.010021.desc: "One of our giantess soldiers accidentally wandered out of her post and into a nearby 'little people' residential area. Of course, she realized the issue, but after realizing it, she 'accidentally' fell onto the residential area. Now that area has been reduced to ruins, and the surrounding hundreds of square kilometers need to be rebuilt..."
  # 这么好的机会，把各个角度拍摄的视频上传到星际网络
  gts_evt_random.010021.a: "Such a good opportunity! Upload videos from all angles to the interstellar network!"
  # 把相关负责人变成缩小人！狠狠滴惩罚！
  gts_evt_random.010021.b: "Turn the personnel in charge into tiny people! Punish them severely!"
  # 把整个区域缩小，封锁消息
  gts_evt_random.010021.c: "Shrink the entire area and block the news."
  # 小人的游行
  gts_evt_random.010031.name: "Little People's Parade"
  # 据报告，[Root.GetName]爆发了一次小人游行，游行的内容因为小人们太小，我们前去调停的总督并没有听见，但可以肯定的是，小人们占领了总督的落脚点，现在总督正等待我们的答复
  gts_evt_random.010031.desc: "According to reports, a 'little people's' parade has broken out on [Root.GetName]. The content of the parade isn't known because the little people are too small and the governor who went to mediate didn't hear it, but what is certain is that the little people have occupied the governor's landing point. Now the governor is awaiting our response."
  # 全部杀掉吧，反正留着也没用
  gts_evt_random.010031.a: "Kill them all, they are useless anyway."
  # 让[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]亲自出马交涉
  gts_evt_random.010031.b: "Let [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName] personally negotiate."
  # 全部编入陆军敢死队，给我滚去赎罪！
  gts_evt_random.010031.c: "Draft them all into the ground combat suicide squad! Make them atone!"
  # 如果是钱和待遇的问题，也好解决
  gts_evt_random.010031.d: "If it's a matter of money and compensation, that can be easily solved."
  # 让总督自己看着办
  gts_evt_random.010031.e: "Let the governor handle it himself."
  # 残酷镇压
  gtsra_random_brutal_rule: "Brutal Suppression"
  # 所有胆敢反抗的小人，连同周围无辜的群众都被巨足踩成了碎片，幸存下来的小人已经失去了抵抗的意志
  gtsra_random_brutal_rule_desc: "All little people who dared to resist, along with innocent bystanders, were crushed into pieces by giant feet. The surviving little people have lost the will to resist."
  # 和谐共处
  gtsra_random_moderate_rule: "Harmonious Coexistence"
  # 在我们的努力下，这颗星球上的种间关系得到了很好的改善
  gtsra_random_moderate_rule_desc: "Through our efforts, the interspecies relationship on this planet has greatly improved."
  # 残忍对待
  gtsra_random_cruel_treatment: "Cruel Treatment"
  # 这个星球上的小人完全成为了巨娘的泄欲工具
  gtsra_random_cruel_treatment_desc: "The little people on this planet have become nothing more than sexual tools for the giantesses."
  # 小人杀手
  gts_evt_random.010041.name: "Little Person Killer"
  # 据[Root.GetName]的报告称，当地小人多次向当地政府举报，称有一名巨大娘在到处破坏小人居住区并且虐杀了数万名小人，他们请求当地执法部门立刻搜查
  gts_evt_random.010041.desc: "According to reports from [Root.GetName], the local 'little people' have repeatedly reported to the local government that a giantess is destroying residential areas and has brutally killed tens of thousands of little people. They are requesting that local law enforcement immediately investigate."
  # 这种行为可以有效管控多余的小人人口，不过需要时间完善
  gts_evt_random.010041.a: "This behavior can effectively control the excess little people population, but it needs time to improve."
  # 立刻调查，不能让这种人在我们的地盘上为非作歹，什么？我说的是小人！
  gts_evt_random.010041.b: "Investigate immediately, this kind of person cannot be allowed to run rampant in our territory, what? I'm talking about the little people!"
  # 这样不利于我们管理，立刻捉拿那名巨大娘，给小人们一个交代
  gts_evt_random.010041.c: "This is not conducive to our management, immediately arrest the giantess, and give the little people an explanation."
  # 我的小人奴隶也可以试试这种玩法
  gts_evt_random.010041.d: "My little slave people can also try this kind of fun."
  # 无所谓啦，时间会忘记的
  gts_evt_random.010041.e: "Whatever, time will forget."
  # 小人之家
  gtsra_tiny_home: "Little People's Home"
  # 一些修道院内布置了名为小人之家的东西，据报告称，这些小型屋子由当地教会提供，用意接济流离失所的小人，教会也会定期提供食物等喂养它们，并表示花费相当少
  gtsra_tiny_home_desc: "Some monasteries have set up things called 'little people's homes'. According to reports, these small houses are provided by the local church to help displaced little people. The church also regularly provides food and other resources to feed them and states that it costs very little."
  # 小人兵役
  gtsra_tiny_army: "Little People's Military Service"
  # 把这群小人统统编入军队，那里也有房子和食物
  gtsra_tiny_army_desc: "Draft all of these little people into the military. There's also housing and food there."
  # 奇异商品
  gtsra_strange_goods: "Strange Goods"
  # 这些小人所贩卖的商品得到了当地巨娘的一致好评
  gtsra_strange_goods_desc: "The goods sold by these little people have been praised by the local giantesses."
  # 小人奴隶军团
  NAME_tiny_slave: "Little People Slave Legion"
  # 一种新游戏
  gts_evt_random.010050.name: "A New Kind of Game"
  # 根据报告，最近在[GPEX_planet.GetName]兴起名为《GPAX》的真人娱乐项目，被数十个大型电视平台和网站转播但根据税务局和调查局的报告来看，她们既没有缴纳所得税和个人税，同时拥有大量未经注册的非法小人现在我们已经逮捕了她们的幕后赞助集团和竞赛创办人，我们应该如何处理她们？
  gts_evt_random.010050.desc: "According to reports, a live entertainment project called 《GPAX》has recently emerged on [GPEX_planet.GetName]. It's being broadcast on dozens of major television platforms and websites, but according to the tax and investigation bureaus, they have neither paid income tax nor personal tax, and they also have a large number of unregistered, illegal little people. We have now arrested the backstage sponsors and the competition founders. How should we handle them?"
  # 很有意思的比赛，不过我们需要更专业的场地，来给予我们的观众和选手更好的体验
  gts_evt_random.010050.a: "A very interesting competition, but we need more professional venues to give our audience and contestants a better experience."
  # 宇宙中，唯有死亡与税收不可避免让她们交税，然后交给安全局那群变态解决吧！
  gts_evt_random.010050.b: "In the universe, only death and taxes are unavoidable. Make them pay their taxes, and then hand them over to those perverts at the Security Bureau!"
  # 帝国没有那么多时间管理这些，那些未注册的小人杀了就杀了吧，只要巨娘是正常的就是
  gts_evt_random.010050.c: "The empire doesn't have that much time to manage all this. Just kill those unregistered little people; as long as the giantesses are normal, it's fine."
  # 嗯~我觉得可以开设更隐秘的VIP比赛~
  gts_evt_random.010050.d: "Hmm~ I think we can open more discreet VIP competitions~"
  # 巨娘竞技场建设完成
  gts_evt_random.010051.name: "Giantess Arena Construction Complete"
  # 我们第一座巨娘竞技场已经建立起来，在[Root.GetName]汇集了数十家媒体，不仅有我们国家的官方媒体和大量民间媒体，其它国家的媒体也抵达了现场，共同转播这一充满惊险刺激并且规范化的运动不过大人您现在要去亲自观看吗，还是说转播就行了？
  gts_evt_random.010051.desc: "Our first giantess arena has been built. Dozens of media outlets have gathered at [Root.GetName], including not only our country's official media and a large number of independent media, but also media from other countries. Together, they are broadcasting this thrilling, exciting, and standardized sport. But, Your Excellency, do you want to go watch it in person, or just watch the broadcast?"
  # 亲自去吧，我也想活动下身子了，这么点公务，那群大臣们肯定能处理好吧
  gts_evt_random.010051.a: "I'll go in person. I also want to stretch my body. With such a small amount of public affairs, the ministers can surely handle it right?"
  # 不用了，公务还有很多，转播就行了
  gts_evt_random.010051.b: "No need, there are still many public affairs. The broadcast will do."
  # 无聊的东西，不如给我的按摩器里多加点小人来得舒服
  gts_evt_random.010051.c: "Boring stuff, not as comfortable as adding more little people to my massager."
  # 巨娘竞技场(建设中)
  gtsra_random_GPEX_construct: "Giantess Arena (Under Construction)"
  # 一座超大型的娱乐设施，正在建设中......
  gtsra_random_GPEX_construct_desc: "A super-large entertainment facility, under construction..."
  # 巨娘竞技场
  gtsra_random_GPEX: "Giantess Arena"
  # 一座超大型的娱乐设施，用于满足巨娘的特殊爱好
  gtsra_random_GPEX_desc: "A super-large entertainment facility, used to satisfy the special hobbies of giantesses."
  # 巨娘竞技场
  gts_evt_random.010052.name: "Giantess Arena"
  # 现在，欢迎我们的[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]来到竞技场，她将以一个人的实力，对抗竞技场所有小人，整整五兆亿的小人们！！！\n竞技场爆发出之前从未有过的欢呼，就连贵宾席位上的贵族和各大赞助商们都纷纷起身，想要一睹[Root.Owner.GetRulerName]的容颜\n现在，让我们以最狂热的呼喊声！呼叫我们[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]出场！\n伴随着让整个竞技场震动的脚步，[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]出现在了赛场的巨娘入场口\n即便是以最大的泰坦级舰娘为基本尺寸制作的通道，但依然让我们的[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]弯着腰过来，现在，她站直了身子，我们得以测量出她的数据了，大家看大屏幕！\n观众席上方的大屏幕上，放着刚刚测量出来的数据：身高两亿公里！！而剩下的数据因为保密要求并未展出\n但仅仅是身高这一项，就足以刷新竞技场的纪录，在此之前最高的也只有勉强突破千万的几位泰坦级巨娘，而[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]瞬间将其刷新到了以亿为单位的水平！\n\"那群小人们呢，我可不想把自己的身高压缩成这么小，还看不见那群灰尘啊\"\n现在，是对比环节！随着主持人的声音，大屏幕上显示出了另外一组数据，分别是五兆亿小人，以及与他们对战的[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]，她的数字，只有1\n\"嗯~很公平的对局呢~\"\n要不是有屏蔽罩的保护，离得近的观众席估计已经被毁灭了吧\n\"好啦，寒暄时间结束了，我不会手软的！\
  gts_evt_random.010052.desc: "Now, welcome our [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName] to the arena! She will use her own strength to fight against all of the little people in the arena – a full five quadrillion of them!!!\n The arena erupts in cheers, the likes of which have never been heard before. Even the nobles and major sponsors on the VIP seats stand up, eager to catch a glimpse of [Root.Owner.GetRulerName]'s face. \nNow, let's give the most fanatical shout! Let's call out our [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName] to make her appearance! \nAccompanied by footsteps that shake the entire arena, [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName] appears at the giantess entrance of the arena. \nEven though the passage was designed with the maximum size of a Titan-class shipgirl as a baseline, our [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName] still had to bend over to come through. Now, she has straightened her body, and we can measure her data. Everyone, look at the big screen! \nOn the large screen above the stands, the newly measured data is shown: Height, 200 million kilometers!! The remaining data has not been displayed due to confidentiality requirements. \nBut just the height alone is enough to break the Arena's record. Previously, the highest was a few Titan-class giantesses who barely broke the ten million mark, while [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName] instantly raised it to the level of hundreds of millions!\n'Where are those little people? I don't want to compress my height to that small and not be able to see that dust,' she says. \nNow, it's time for the comparison! With the announcer's voice, another set of data is displayed on the big screen: five quadrillion little people, and on the other side, [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName], her number, just 1.\n'Hm~ A very fair match~'\nIf it weren't for the protective shields, the close-by stands would have already been destroyed. \n'Okay, the pleasantries are over. I won't go easy!'"
  # 加油啊！大人！
  gts_evt_random.010052.a: "Go for it! Your Excellency!"
  # 不要放过任何一个小人啊！！！
  gts_evt_random.010052.b: "Don't let any of the little people get away!!!"
  # 我们需要更大的场地！！
  gts_evt_random.010052.c: "We need a bigger venue!!!"
  # 巨娘竞技场
  gts_evt_random.010053.name: "Giantess Arena"
  # 在全场的欢呼声中，她迈出了第一步，仅仅是跨出去的第一步，就令大屏幕上的小人数量锐减数十亿\"欸，我都没看见你们，怎么就死了这么多？\"是因为大人的行走，仅仅是因为挪动，就造成了能震碎板块的大地震，数十亿待在要塞和城市内的小人因此死亡！伴随着主持人的解锁，她脱下了自己的高跟鞋\"欸，这样更好，这双黑丝可是特意为你们准备的哦，不仅仅是小人，还有观众们哟~\"大人……居然是为了我们穿上的黑丝，我..抱歉，太兴奋了，我不知道该说些什么！！！仅仅是因为她的一句言语，数十万巨娘观众当场昏死了过去，而全帝国境内的医院都达到了爆满的状态（如果有银河医疗中心则会变成医疗中心分担了部分病患）不过大多数人没有看见，大屏上的小人数量锐减数千亿，原因一是脱下高跟鞋的动作，随手抛在一旁巨型高跟鞋砸死了数百亿埋伏在其旁边的小人军队原因二则是途中不小心移动的双足引发了更大的地震，再次杀死了数十亿小人
  gts_evt_random.010053.desc: "Amidst the cheers of the whole arena, she took her first step. Just that first step caused the number of little people on the big screen to plummet by billions. 'Huh? I didn't even see you guys, how did so many die?' It's because of her walking; merely the act of moving caused an earthquake powerful enough to shatter tectonic plates. Billions of little people stationed in fortresses and cities died from this! With the announcer's unlock command, she took off her high heels. 'Ah, this is better. These black stockings were prepared especially for you; not just the little people, but also the audience~'. Your Excellency... she wore the black stockings for us! I... I'm sorry, I'm too excited, I don't know what to say!!! Just because of her words, hundreds of thousands of giantess audience members fainted on the spot, and the hospitals across the entire empire are completely overflowing (If there is a Galactic Medical Center, it will take on some of the patients). However, most people didn't see that the number of little people on the big screen dropped by trillions. The first reason is the action of taking off the high heels, casually tossing down the giant high heels, which crushed tens of billions of little people troops who were waiting to ambush nearby; the second reason is that a careless movement of her feet triggered a larger earthquake, killing another tens of billions of little people."
  # 继续
  gts_evt_random.010053.a: "Continue"
  # 巨娘竞技场
  gts_evt_random.010054.name: "Giantess Arena"
  # 哇！大人居然只用了不到一分钟就击杀了8000亿小人，这是本竞技场的纪录，也是绝对无法被其它人打破的纪录！\n说罢，她往前走了几步，检索观察着脚下灰尘般的小人\n\"小人们，尝尝我今天的黑丝怎么样吧！\"\n随后便对着看似空无一物的大地踩了下去，不过与其说是踩下去，更像是放了下去，然而仅仅是随着黑丝玉足的一次抬起与落下，屏幕上4兆2000亿小人锐减至3兆亿，仅仅是一次落脚，便让如此多的小人毁灭在双足之下\n\"是不是没有好好享受我的恩赐就自顾自地死掉了呢~看来我的脚还不能加速肾上腺素的生产，从而延缓你们悲剧的生命走向不可避免的死亡呢~\"\n说着，就将胸前钮扣解开几颗，露出自己庞大丰满的双乳，俯下身子，向底下的小人们展现自己傲人的双乳\n\"来看看你们能不能接住着两座乳山哦~\"\n说着，便往下一扑随着[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]大人的扑跃，她那巨大的体型让整个巨构都震动起来，而大屏幕上的数字，小人们也从刚刚的3兆亿，瞬间掉至1000亿\n仅仅是一次小小的飞扑，就让2兆9000亿小人消失在了自己的玉体之下\n\"呜啊~看来我丰满柔软的胸部也不能延缓你们这些灰尘消散的时间呢~不过既然如此，就让我来结束你们漫长且无趣的生命吧~\"\n说着，便撑起自己的上半身，用自己的一只手托着自己的脸颊，另一只手去慢慢的，轻轻的，去碾碎还活着的小人\n1000亿…900亿………600亿…300亿…100亿…………50亿………1亿…0\n仅仅是靠一只手，一点小小的移动，一丝诡谲且充满兴致的微笑，观众席上愈发狂热的欢呼，和主持人激动到喊破嗓子的报道
  gts_evt_random.010054.desc: "Wow! Her Excellency killed 800 billion little people in less than a minute! This is the record of this arena and a record that absolutely no one else can break! \nWith that said, she took a few steps forward, scanning and observing the tiny, dust-like little people beneath her feet. \n'Little people, how do you like my black stockings today?!' \nThen she stepped down onto the seemingly empty ground, but it's more like she lowered her foot instead of stepping down. However, with just one lift and fall of her silk-clad jade foot, the 4.2 trillion little people vanished to 3 trillion. A single step destroyed so many little people under her feet.\n'Did you die without properly enjoying my grace? It seems my feet are not able to speed up adrenaline production, thereby delaying your tragic lives moving towards inevitable death~'\nShe said, unbuttoning a few buttons on her chest, revealing her enormous breasts, and leaned down to show the little people beneath her her proud chest. \n'Let's see if you can catch these two mountains of breasts!' \nWith this, she lunged forward. With Her Excellency's leap, her enormous figure shook the entire megastructure. And on the big screen, the little people numbers瞬间 dropped from 3 trillion to 100 billion!\nJust a small leap made 2.9 trillion little people disappear beneath her jade body.\n'Ugh~ So it seems my large, soft breasts can’t stop you dust from disappearing either~ well, in that case, let me end your long and boring lives~'\nWith that, she propped herself up with one hand, the other hand slowly, gently crushed the living little people. \n100 billion… 90 billion… 60 billion… 30 billion… 10 billion… 5 billion… 1 billion… 0.\nWith just one hand, with a small movement, with a strange, enthusiastic smile, from the increasingly fanatic cheers from the audience, and the commentator's voice breaking with excitement."
  # 继续
  gts_evt_random.010054.a: "Continue"
  # 巨娘竞技场
  gts_evt_random.010055.name: "Giantess Arena"
  # \"哈哈，你们还很有趣的，起码坚持了五分钟，嗯~评价是，还不错的解压工具哦~这可是最高评价了\"\n随着屏幕上小人方的数字归0全场观众的欢呼让巨构都震动了起来\n十分钟不到，仅仅是十分钟不到！！！她就无情的碾压了五兆亿小人，没有任何小人活了下来！！！！！为我们的大人欢呼！！！\n伴随着主持人充满激情的播报，竞技场内，一浪打过一浪的声音，共同呼叫着那同一个名字：[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]\n随著名字在竞技场内扫过，场上的她也对着观众席挥了挥手，以表示感谢，随后便离开了场上，回到了后台\n\"嗯~时不时来一次这样的活动挺好的，不过还是洗一洗澡好啦~和皇宫里的人说一下，让她们把浴缸放满水，我要好好的泡个澡\"\n而从赛后数据对比来看，如此多小人，打出的弹药量足以支撑两三个帝国之间大战数十年，然而对于我们的[Root.Owner.GetRulerTitle][Root.Owner.GetRulerName]来说，她甚至没有任何感觉就这样，第一届GPAX竞赛边落下了帷幕
  gts_evt_random.010055.desc: "'Haha, you guys are still pretty interesting. You at least lasted five minutes, hm~ my evaluation is, you were a pretty good stress relief tool~ This is the highest rating!'\n\nAs the numbers on the display for the little people reach 0, the audience's cheers shake the megastructure.\nLess than ten minutes, just less than ten minutes!!! She ruthlessly crushed five quadrillion little people, and no little people survived!!!!!! Let us cheer for our Excellency!!!\nAccompanied by the commentator's passionate reports, the deafening cheers from the  arena call out the same name in unison: [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName].\nAs the name echoes in the arena, she also waved to the crowd to express her gratitude, then left the arena and returned to the backstage.\n'Hm~ It would be good to have events like this from time to time, but I still need a good bath~ Tell the people in the palace to fill the bathtub with water, I want a good soak.' \nAnd from the post-match data comparison, so many little people had fired enough ammunition to sustain a war between two or three empires lasting decades, but for our [Root.Owner.GetRulerTitle][Root.Owner.GetRulerName], it was as if she didn't even feel anything. And just like that, the first GPAX competition came to an end."
  # 很好，我也玩的很开心呢
  gts_evt_random.010055.a: "Very good, I also had fun."
  # 不如举办一个宇宙级联赛吧，让全宇宙的人们都来参加这种竞技项目！
  gts_evt_random.010055.b: "Why not hold a universe-level league and let people from all over the universe participate in this competition!"
  # 帝国荣光永存！
  gts_evt_random.010055.c: "Long live the Empire's Glory!"
  # 旅游胜地的兴起
  gts_evt_random.010060.name: "The Rise of a Tourist Spot"
  # 近来，各大媒体的报道与贸易额报表上体现的大幅增长使我们注意到了§Y[footprint_planet.GetName]§!上一处蓬勃发展中的旅游胜地，这处景点由数个远古巨娘留下的足印构成；在我们殖民地开拓的早期这处地点就被发现，但很快被断定不具有进一步研究的价值，因而只做了简单的保护工作\n\n然而，随着我们与外星种族更多的建立联系，这些足印焕发了其作为景点的新生——来自外星的一些巨娘发现，制造了这些足印的远古巨娘与她们的体型恰好相仿，在一次访客踩上足印比对大小被发现并罚款的事件发生后，这一区域的负责人突发奇想；在确认地点无研究价值之后，这些足印被开放给一些外星巨娘参观——以及进行一些她们想要的互动\n\n事实证明，这一乍听起来莫名其妙的旅游业战略取得了巨大成功：申请前来这颗殖民地的巨娘络绎不绝，以至于入境管理局不得不严格限制游客人数；而这些足印也很快在媒体宣传下成为了知名旅游胜地，吸引了来自全银河的巨娘——以及慕名而来的小人游客们，诚然，这对景点的安全管理提出了不小的挑战——但至少目前，这一现象为行星创造了无数的就业岗位，与服务业相关的产业经济也得到了长足的进步
  gts_evt_random.010060.desc: "Recent reports in the major media outlets and a large increase in trade revenue have brought our attention to §Y[footprint_planet.GetName]§! A thriving tourist hotspot, this location is made up of several footprints left behind by ancient giantesses. This location was discovered early in our colony's expansion, but was quickly deemed not to have further research value, thus only simple protection work was done.\"\n\nHowever, as we established more connections with alien races, these footprints were reborn as tourist attractions. Some foreign giantesses discovered that the ancient giantesses who made these footprints had a similar body type. After an incident where a visitor was fined for stepping on a footprint for a size comparison, the person in charge of the area suddenly had a great idea. After confirming the location has no further research value, these footprints were opened to some visiting foreign giantesses-and to engage in some interaction. \n\nIt turns out that this seemingly strange tourism strategy was a great success. The number of giantesses applying to visit this colony has been so high that the Immigration Bureau has had to strictly limit the number of visitors. These footprints have quickly become a well-known tourist destination in media promotion, attracting giantesses from all over the galaxy, as well as little people tourists who come for the sight. Granted, this has placed some challenges on the site's safety management, but at least for now, this phenomenon has created countless jobs for the planet and significantly progressed the economic situation of service industries."
  # 足印度假区
  d_footprint_resort: "Footprint Resort"
  # 远古巨娘留下的足迹、管理者的一次突发奇想以及得当的宣传与经营造就了这片全河系知名的度假区；这一围绕着巨大的足印建设起来的区域设施齐全、旅客终年络绎不绝，为行星的就业与经济做出了不可估量的贡献
  d_footprint_resort_desc: "The footprints left by ancient giantesses, a sudden inspiration from a manager, and proper advertising and management created this well-known resort throughout the galaxy; this area is built around the massive footprints, is well equipped, and has a steady stream of visitors every year, making an immeasurable contribution to the employment and economy of the planet."
  # 喷乳的舰娘
  gts_evt_random.010080.name: "Milk-Spraying Shipgirl"
  # 接到一条从舰队指挥部传来的新消息：尽管我的的工程部已经尽了最大努力，但是我们的一位舰娘在位于[shipgirl_milk_planet.System.GetName]星系巡逻时发生了乳涨，碍于舰娘身份的她没有立即上报这一情况，最终导致舰队在经过[shipgirl_milk_planet.GetName]时，这位忍受已久的舰娘发生了不可避免的喷乳\n\n此次事件造成了[shipgirl_milk_planet.GetName]行星海平面上升，大量乳汁滞留于星球上，尽管我们的人们对于舰娘的乳汁并不反感，但如此巨量的乳汁对星球设施造成的破坏是不可忽视的\n\n介于舰娘之间体质的不同，这种情况我们不能完全责怪工程部门，但是问题仍然需要妥善解决\n\n我们应该怎么处理？
  gts_evt_random.010080.desc: "We have received new news from the fleet command: despite our engineering department doing its best, one of our shipgirls experienced breast engorgement while patrolling the [shipgirl_milk_planet.System.GetName] system. Because of her shipgirl status, she did not immediately report it, which ultimately led to an unavoidable \"milk spray\" incident when the fleet passed through [shipgirl_milk_planet.GetName].\n\nThis incident caused the sea level of [shipgirl_milk_planet.GetName] to rise, and significant amounts of milk have remained on the planet. While our people are not averse to shipgirl milk, the damage to the planet's facilities caused by such a large amount of milk cannot be ignored.\n\nGiven the different constitutions of shipgirls, we cannot completely blame the engineering department for this situation, but the problem still needs to be properly resolved.\n\nWhat should we do?"
  # 体质不同是正常现象，也许我们可以以此来强化我们的舰娘
  gts_evt_random.010080.a: "Different constitutions are normal, perhaps we can use this to strengthen our shipgirls."
  # 巨娘的乳汁可以在小人那里卖个好价钱....
  gts_evt_random.010080.b: "Giantess milk can sell for a good price among the little people...."
  # 这种情况我们无法容忍！把她们的乳头统统堵住！
  gts_evt_random.010080.c: "We cannot tolerate this! Plug all of thier nipples!"
  # 把多余的乳汁收集起来就好了
  gts_evt_random.010080.d: "Just collect the extra milk."
  # 乳汁海洋
  d_gts_milk_sea: "Milk Sea"
  # 一片由巨娘乳汁构成海洋，新的生态系统正在乳汁中形成
  d_gts_milk_sea_desc: "A sea made of giantess milk, new ecosystems are forming within the milk."
  # 舰娘们的欢呼
  gts_evt_random.010081.name: "Cheers of the Shipgirls"
  # 我们的决策是明智的，这次事件暴露出遗留在舰娘中久未解决的生理问题之一，而我们这次重新编写的招聘协议将会永久解决这个问题，同时最大化利用巨娘的乳汁作为攻击性武器相信在不久的将来，我们的第一艘喷乳型舰娘将会在太空中大放光彩！ 
  gts_evt_random.010081.desc: "Our decision was wise. This incident exposed one of the long-standing physiological problems remaining in shipgirls, and our newly rewritten recruitment agreement will solve this problem permanently, while maximizing the use of giantess milk as an offensive weapon! I believe in the near future, our first milk-spraying shipgirl will shine brightly in space!"
  # 完美的解决方案
  gts_evt_random.010081.a: "A perfect solution."
  # 我已经迫不及待的想看到敌人在乳汁中融化了
  gts_evt_random.010081.b: "I can't wait to see the enemy dissolve in milk."
  # 舰娘乳汁攻击
  gtsra_milk_attack: "Shipgirl Milk Attack"
  # 把巨娘的乳汁作为攻击性武器，嗯......
  gtsra_milk_attack_desc: "Using giantess milk as an offensive weapon, hmm..."
  # 舰娘的额外妙用
  gts_evt_random.010082.name: "Additional Uses for Shipgirls"
  # 经过工程部门的加紧研究，我们意外的发现了遗留已久的舰娘生理问题介于对舰娘隐私的保护和舰娘们本身羞于启齿，这个问题直到现在才被发现工程部门开创性的提出了在军港建设吸乳器，这样即使舰娘们停靠在港内，也可以为[Root.GetName]提供一定的产出
  gts_evt_random.010082.desc: "Through intensive research from the engineering department, we have unexpectedly discovered a long-standing physiological problem of shipgirls. Due to the protection of shipgirl privacy and their own embarrassment, this problem was not discovered until now. The engineering department pioneered the building of milk extractors in military ports, so that even while shipgirls are docked in the port, they can provide some production for [Root.GetName]."
  # 听起来是个双赢的方案
  gts_evt_random.010082.a: "Sounds like a win-win solution."
  # 舰娘乳汁再利用
  gtsra_milk_recircle: "Shipgirl Milk Recycling"
  # 我们的自动收集系统可以把舰娘多余的乳汁收集起来卖给小人，以此来节约维护费用
  gtsra_milk_recircle_desc: "Our automated collection system can collect the excess milk from shipgirls to sell to the little people to save on maintenance costs."
  # 失控的舰娘
  gts_evt_random.010083.name: "Out of Control Shipgirls"
  # 我们低估了这件事情的严重性！\n\n根据前线传来的报告，已经有多为舰娘在执行任务的时候发生喷乳现象，尽管舰娘教官一再呵斥，指挥部也不停发出命令，但是这些舰娘们被膨胀的乳房折磨得生不如死，我们的命令对她们毫无效果！ \n\n舰娘们纷纷拔出乳塞，肆意喷涌的乳汁对我方行星造成了重大打击，猝不及防的居民们只能眼睁睁的看着乳汁洪流从天而降，吞噬摧毁着沿途的一切，最后溺死在乳汁海洋里\n\n我们必须做点什么！ 
  gts_evt_random.010083.desc: "We have underestimated the seriousness of this issue! \n\nAccording to reports from the front lines, several shipgirls have experienced milk-spraying during missions. Despite the repeated scolding from the shipgirl instructors and continuous orders from command, these shipgirls were tormented by their swollen breasts and were desperate. Our orders have no effect on them!\n\nThe shipgirls are pulling out their milk plugs, and the unrestrained milk spray is causing major damage to our planet! The caught-off-guard residents can only watch helplessly as the milk flood pours down from the sky, engulfing and destroying everything in its path, eventually drowning in the milk ocean! \n\nWe must do something!"
  # 哦不！
  gts_evt_random.010083.a: "Oh no!"
  # 事已至此，我们必须认真面对
  gts_evt_random.010083.b: "Now that it has come to this, we must face it with seriousness."
  # 决斗
  gts_evt_random.010090.name: "Duel"
  # 我们接到来自[gts_vs_tiny_planet.GetName]上的最新消息 \n\n一位小人向巨娘发起了挑战，他认为巨娘只不过是大一点的人类罢了，除了拥有更大的体型和力量之外一无是处而这位巨娘也出于好奇答应了这场荒谬的比武\n\n纵使我们都知道这是一场毫无悬念的碾压局，但帝国几乎所有居民都在关注这一场荒诞的比赛，[gts_vs_tiny_planet.GetName]在一夜之间火遍了整个帝国\n\n面对我们的采访，这位发起挑战的小人挺着胸脯自豪的解释说，所谓巨娘那无匹的破坏力，仅仅只能体现在宇宙尺度上的战舰对轰，或者对集群城市的剿灭但在与拥有极大机动能力的小人战斗时，巨娘只能像拍苍蝇一样，空有一身本领\n\n他的话赢来了数不尽的欢呼声，尽管你我都知这欢呼意味着什么…… \n我们也许可以利用这个绝佳的机会，借此宣传一波我们[Root.GetName]的威望
  gts_evt_random.010090.desc: "We have received the latest news from [gts_vs_tiny_planet.GetName].\n\nA little person has challenged a giantess, believing that giantesses are just larger humans and are useless except for their size and strength. This giantess has also agreed to this ridiculous duel out of curiosity.\n\nWhile we know this is a one-sided thrashing, nearly all the inhabitants of the empire are watching this absurd match, and [gts_vs_tiny_planet.GetName] has become famous across the empire overnight.\n\nIn response to our interview, the little person who initiated the challenge proudly explained that the so-called unparalleled destructive power of giantesses can only be manifested in ship-to-ship combat on a cosmic scale, or when eliminating clustered cities. When fighting against a little person with great mobility, giantesses can only swat like flies, despite their talent.\n\nHis words have won countless cheers, though you and I know what these cheers mean... \nPerhaps we can use this excellent opportunity to promote the prestige of our [Root.GetName]."
  # 什么东西？赶紧结束这场闹剧！帝国需要稳定而不是分裂！
  gts_evt_random.010090.a: "What is this? Quickly end this farce! The empire needs stability, not division!"
  # 我们来吧事情闹大一点吧，支持巨娘
  gts_evt_random.010090.b: "Let's make things a little bigger, support the giantess."
  # 也许，树立一个小人英雄是个不错的选择
  gts_evt_random.010090.c: "Perhaps, creating a little people hero is not a bad choice."
  # 紧急停止
  gts_evt_random.010091.name: "Emergency Stop"
  # 我们的调解员抵达现场时，整个赛场座无虚席，站在左侧的巨娘正一脸戏谑地看着另一边瑟瑟发抖的小人\n\n没有了之前趾高气昂的傲慢，在真正面对巨娘时，他早已吓得两股战战，几乎握不住手中的武器看来连他自己也清楚，无端调戏巨娘的小人只有被玩弄折磨的下场\n\n据我们的调解员反应，这位小小的挑战者当时在看到调解员到来时，不顾自己的形象和尿湿的裤子，发疯似的跑到调解员的高跟鞋下，用尽了力气舔舐着，嘴里念叨着\"对不起\"\"不应该这么无知\"之类的话\n\n可怜的挑战者，连开始比赛的勇气都没有，也是，毕竟他面对的，是可以一脚把他踩死的巨娘啊
  gts_evt_random.010091.desc: "When our mediators arrived at the scene, the whole arena was packed to capacity, and the giantess standing on the left was looking mockingly at the trembling little person on the other side.\n\nGone was his previous arrogance; when actually facing a giantess, he was already shuddering in fear, barely able to hold onto his weapon. It seems like he himself knew that a little person who randomly taunted a giantess would only end up being played with and tortured.\n\nAccording to our mediators, when this small challenger saw the mediators arrival, he completely lost all his composure with his wet pants, rushed to the mediator's high heels, licked them with all his strength, and kept saying things like 'I'm sorry' and 'I shouldn't have been so ignorant.'\n\nThe poor challenger didn't even have the courage to start the match. It's understandable since he was facing a giantess who could have crushed him with a single step."
  # 还好及时赶到
  gts_evt_random.010091.a: "Glad we arrived in time."
  # 真是卑劣的虫子
  gts_evt_random.010091.b: "What a despicable bug."
  # 和解
  gts_evt_random.010092.name: "Reconciliation"
  # 看来我们的调解员做了最正确的事她利用了这次全国直播，大肆宣扬了一番小人应该和巨娘平等互助的观念\n\n尽管大家都是来看这位挑战者被巨娘玩弄的，但 \n无论如何，既然已经看到了他屁滚尿流的狼狈模样，我们的臣民们也心满意足了\n\n总之，这次的事件真是完美的契机啊\n当然，这位不知天高地厚的挑战者在拍完合照之后，照例送给了那位巨娘当私人用品了
  gts_evt_random.010092.desc: "It seems our mediator did the right thing, using this national broadcast to loudly proclaim the idea that small people and giantesses should be equal and mutually helpful.\n\nAlthough everyone was here to watch the challenger get toyed with by the giantess, \nregardless, now that they've seen him in such a pathetic state, our citizens are satisfied.\n\nIn short, this event was the perfect opportunity.\nOf course, after taking a commemorative photo, this arrogant challenger was, as usual, given to the giantess as a personal item."
  # 很好
  gts_evt_random.010092.a: "Good."
  # 嘲弄
  gts_evt_random.010093.name: "Mockery"
  # 看来我们的调解员做了最正确的事她利用了这次全国直播，大肆宣扬了一番小人应该永永远远臣服在巨娘脚底，连足垢都不如的观念\n\n她当场把这位无知的小虫子踢到那位接受挑战的巨娘脚下，于是在这场全国直播中，这位可爱的女孩向大家展示了如何使用小人清理足底的污垢\n\n相信他被淹没在巨娘足底的时候，那卑微的求饶和惨叫能激起所有巨娘的热情，也能让所有小虫子知道，反抗巨娘的唯一下次就是被玩弄至死\n\n这场挑战以小家伙被闷死在女孩的胖次里而草草收尾，我们依照惯例，只播出了剪辑版，完整版则出售给了黑市
  gts_evt_random.010093.desc: "It seems our mediator did the right thing, using this national broadcast to loudly proclaim the idea that small people should eternally submit beneath the giantess's feet, and be inferior to even their foot dirt.\n\nShe immediately kicked this ignorant little bug to the feet of the giantess who accepted the challenge. In this national broadcast, the lovely girl demonstrated how to use small people to clean the dirt from the bottom of her feet.\n\nI believe that when he was submerged beneath the giantess's foot, his humble pleadings and screams could stir the passion of all giantesses and let all small bugs know that the only consequence of resisting a giantess was to be toyed with to death.\n\nThis challenge ended hastily when the little guy suffocated in the girl's panties. As usual, we only broadcast the edited version; the full version was sold on the black market."
  # 真是一材两用
  gts_evt_random.010093.a: "Truly multi-purpose."
  # 快开始吧！
  gts_evt_random.010094.name: "Let's Start!"
  # 不仅比赛现场人山人海，几乎所有不能来的居民都在直播间，观看这一足以改变历史的决斗这真是太疯狂了\n\n那位接受挑战的女孩自信满满的站在左侧，正兴奋地向着大家挥手示意，另一侧是……偶不，看来这位挑战者的状态有点差\n\n不，不止有点差，他根本就是要被吓死了！无论是他打颤的腿，还是连武器都握不住的双手，他看起来根本就是一副从来没有没有面对巨娘的样子嘛！ \n\n看起来胜负已分了，我们可以插手，支持一方，这也许可以巩固我们的帝国
  gts_evt_random.010094.desc: "Not only is the match venue packed, but almost every resident who couldn't attend is watching the livestream, witnessing a duel that will change history. This is just too crazy!\n\nThe girl accepting the challenge stands confidently to the left, excitedly waving to everyone. On the other side is...oh no, it seems the challenger is in a bit of a bad shape.\n\nNo, it's more than a bit of a bad shape; he looks like he's about to die from fright!  Whether it's his trembling legs or the fact that he can't even hold his weapon, it seems like he's never faced a giantess before!\n\nIt looks like the winner is already decided.  We can interfere and support one side, perhaps this could consolidate our empire."
  # 是的
  gts_evt_random.010094.a: "Yes."
  # 决斗之日
  gts_evt_random.010095.name: "Day of the Duel"
  # 好，战斗开始了！ \n…… \n战斗结束了？\n\n看来我们的挑战者根本不想和巨娘战斗，之前只是在放空话，战斗一开始他就尖叫着往出口逃跑\n好像他真的能在巨娘脚下逃走似的\n\n女孩只是动动脚，这自大的可怜虫就被踏在女孩运动鞋底，只能随着女孩一边哼着歌，一边跟着不断碾动的足底搓来搓去，什么机动装备，什么斩击利器，在巨娘脚下统统化为垃圾\n\n等到女孩把脚抬起来时，那位可怜虫连衣服都被踩碎了，浑身通红，嘴巴里只剩下无意识的\"妈妈\"之类的了不过我们的被挑战者似乎还是不愿意放过他，又为全场观众表演了一场生动形象的\"小人手纸使用指南\"\n\n当战斗结束的时候，他已经全身粉碎性骨折，看来，这场决斗还是以闹剧收尾啊 
  gts_evt_random.010095.desc: "Alright, the battle has begun!\n... \nThe battle is over?\n\nIt seems our challenger didn't want to fight the giantess at all. He was just talking big before. As soon as the battle started, he screamed and ran towards the exit.\nAs if he could actually escape beneath a giantess's feet!\n\nThe girl just moved her foot, and this arrogant wretch was stepped on under the girl's sneaker, forced to rub back and forth under her sole as she hummed a song. Any mobile equipment and sharp weapons all turned into garbage under the feet of the giantess.\n\nWhen the girl lifted her foot, the poor wretch's clothes were crushed, his whole body red, and his mouth was left with only unconscious mumblings like \"Mommy\". But our challenged seemed unwilling to let him go, and gave all the viewers a vivid demonstration of the \"Small Person Toilet Paper Use Guide.\"\n\nBy the time the battle ended, he had multiple fractures throughout his body.  It seems that this duel ended up being a farce."
  # 意料之中
  gts_evt_random.010095.a: "As expected."
  # 小人食品加工厂-热销新品
  gts_evt_random.010100.name: "Small Person Food Processing Plant - New Best Sellers"
  # 街上开着小人店，路边上的海报上写着某公司新品小人上市，今天照例去超市里买了一盒情趣小人，一盒食品小人\n\n 匆匆回家，上了一天班终于有时间休息，将自己脱的就剩内衣，疲惫的躺在床上刷着手机，随意打开一盒小人把它们泼洒在身上，在网络上冲浪的同时也能感受到身体各处传来的细微触感，再打开一包小人食品，一把一把将它们塞进嘴里，一部番的时间就把这袋小人解决干净了，然后捏了捏肚子上的肉，感慨自己又胖了点…\n\n两手盛满了准备吃掉的小人，在吞咽咀嚼的动作中有大量的小人从指缝和掌心边缘落下摔的尸骨无存，但是她只是毫不在意的吞食着，舔舐着，只是偶尔会用舌头舔一下快要掉下去的部分，或者用指尖扒拉一下让小人们更快的落入口中，最后满意的吸吮一下手指，拍拍手从遍地脚印和坑洞，还点缀着舔舐痕迹的大陆上站起来去玩弄下一个小人国家\n\n没有幸存者——小人要么在她腹中等待消化，要么在她足下化为齑粉，要么在齿间苟且偷生——迟早要被灵活的舌尖挑出来成为食物，甚至直接就被舌尖压碎 
  gts_evt_random.010100.desc: "There are small person shops on the street, and posters on the roadside advertise a certain company's new small person products. Today, I went to the supermarket as usual to buy a box of pleasure small people and a box of food small people.\n\nI hurried home, finally having time to rest after a long day at work.  I got undressed until I was just in my underwear, and lay exhaustedly on the bed, scrolling on my phone. I casually opened a box of small people and spilled them on my body, enjoying the subtle sensations on various parts of my body as I surfed online. Then, I opened a bag of small person food and crammed handfuls into my mouth.  After watching an episode, I had finished the whole bag, then pinched the flesh on my stomach, bemoaning that I had gotten a little fatter...\n\nWith both hands full of the small people to be eaten, a large number fell from between her fingers and the edges of her palms to be smashed into oblivion as she was swallowing and chewing. She was just eating carelessly, licking, and occasionally using her tongue to lick at the parts that were about to fall, or poking them with her fingertips to make the small people fall into her mouth faster. Finally, she sucked her fingers with satisfaction, patted her hands, and stood up from the continent covered in footprints, pits, and traces of licking to go and play with the next small person nation.\n\nThere were no survivors - the small people either waited in her belly to be digested, were pulverized under her feet, or eked out a living between her teeth - sooner or later they would be picked out by her flexible tongue to become food, or even crushed directly with her tongue."
  # 可口的
  gts_evt_random.010100.a: "Delicious."
  # 微型城市装配厂-659号培养皿城市记录
  gts_evt_random.010110.name: "Miniature City Assembly Plant - Culture Dish City Record #659"
  # 爱液洪水天灾：如果有干员将培养皿放置在椅子、桌子上并且开始脱下胖次的时候（该死，怎么还有人不脱胖次就开始自慰啊？—261号城市管理人员），应当立即启动爱液洪水天灾应急响应预案，城市内部人员应当立即前往最近的地下避难所，直到警报消失前不能擅自打开避难所大门，注意：大量的爱液会立刻冲垮路径上的房屋，切勿待在自己的家中\n\n爱液洪水天灾结束后，应当立即开启城市的强化排水系统排出内部所有的爱液，大量爱液堆积在城市中会导致在雌性激素的刺激下，城市内部的人员都会变成无法思考的性交机器\n\n（备注：已经有7795座培养皿城市因此被废弃）\n（备注2：或许可以尝试用爱液让小人们加快繁殖？）\n（备注3：这不是你一个月申请上百个培养皿城市的理由，干员华法琳）
  gts_evt_random.010110.desc: "Ejaculate Flood Disaster: If a staff member places the culture dish on a chair or table and begins to take off their panties (damn it, there are still people who start masturbating without taking off their panties?-City Management Staff #261), the Ejaculate Flood Disaster emergency response plan should be immediately activated. All personnel inside the city should immediately head to the nearest underground shelter, and should not open the shelter door until the alarm has stopped. Warning: Large amounts of ejaculate will immediately destroy buildings along the path; do not stay in your home.\n\nAfter the Ejaculate Flood Disaster has ended, the city's reinforced drainage system should be activated to drain all internal ejaculate. The accumulation of large amounts of ejaculate inside the city will cause all the people inside to become mindless sex machines under the stimulation of estrogen.\n\n(Note: 7795 culture dish cities have been abandoned because of this.)\n(Note 2: Perhaps one could try using the ejaculate to speed up the reproduction of the small people?)\n(Note 3: This is not a reason for you to apply for hundreds of culture dish cities per month, staff member Warfarin.)"
  # 很好
  gts_evt_random.010110.a: "Good."
  # 小人专卖店-清洁用海嗣群
  gts_evt_random.010120.name: "Small Person Specialty Shop - Cleaning Seaborne Group"
  # 从干员斯卡蒂的脚指缝提取出的特殊海嗣，似乎是专门为了清洁足部而进化的特殊物种，产生的个体能够有效清除足底纹路中残留的脚泥、汗液、盐粒、尸体，其特殊的溟痕会在鞋袜内部不断扩张，起到类似于吸汗鞋垫的作用\n\n（附录：海嗣是一种可以无限进化的特殊物种，我们应当对其产生敬畏之心，如果这个产品出现什么意外我就把你挂在舰桥上法华林，）\n（63天后附录：我是真的没想到这个产品能够卖得如此火爆，实验室中培养海嗣的速度都快赶不上售卖的速度了，与预想中的不同，我们还以为这些海嗣会进化成可怕的怪物，可是它们甚至抵挡不住大量足汗的脚底环境，就算是身体开始因为吸收过量汗液开始坏死也在尽职尽责地处理足部，就好像这东西天生就是为了清理足部存在的！） \n（博士附录：我就说最近干员们的脚底变得白白嫩嫩的一点味道都没有，这不是在跟我抢活干吗？现在开始停止舰内一切有关该物种的售卖行为）
  gts_evt_random.010120.desc: "A special type of Sea-borne extracted from the gaps between staff member Skadi's toes. It seems to be a special species evolved specifically for cleaning feet. The resulting individuals can effectively remove foot dirt, sweat, salt particles, and corpses from the lines on the soles of the feet. The special miasma marks will constantly expand inside shoes and socks, acting similar to sweat-absorbing insoles.\n\n(Appendix: Sea-borne is a special type of creature that can endlessly evolve; we should be in awe of it. If anything happens with this product, I will hang you on the bridge, Warfarin.)\n(63-day appendix: I really didn't expect this product to sell so well. The speed of cultivating the Sea-borne in the lab is almost unable to keep up with sales. Contrary to our expectations, we had thought these Sea-borne would evolve into terrible monsters, but they can't even withstand the environment of a foot bottom with lots of sweat. Even when their bodies start to rot due to absorbing too much sweat, they are still doing their best to clean feet, as if this thing was born to clean feet!)\n(Doctor's Note: I was wondering why the staff members' feet had become so white and tender, with no smell at all. Isn't this stealing my work?  Starting today, stop all sales of this species within the ship.)"
  # 很好
  gts_evt_random.010120.a: "Good."
  # 清洁用海嗣群——迷你博士款
  gts_evt_random.010130.name: "Cleaning Seaborne Group - Mini Doctor Model"
  # 在博士放出清洁用海嗣群的售卖禁令后在罗德岛黑市出现的产物，透过特殊的基因编辑工程将海嗣们的样貌改造成了博士的模样\n\n（附录：我只是做了外貌的改造而已，为什么清洁效率提高到了300%？？？谁能给我解释一下？）\n（附录2：不是，我只是做了最简单最简单的外貌改造而已，为什么这东西的需求量是原版的清洁用海嗣群的7倍啊？怎么还有来自莱茵生命的订单啊？甚至还有直接送去凯尔希办公室的？这是钓鱼执法吗………这需要送的订单量也太大了…） \n（博士附录：干员法华林申请退出罗德岛，似乎她在这几天意外地发了一笔横财，你们有什么头绪吗？）
  gts_evt_random.010130.desc: "A product that appeared on Rhodes Island's black market after the Doctor banned all sales of the Cleaning Seaborne Group. Through a special genetic editing process, the appearances of the Sea-borne were modified to look like the Doctor.\n\n(Appendix: I just modified the appearance. Why did the cleaning efficiency increase by 300%???  Can someone explain this to me?)\n(Appendix 2: No, I just did the simplest appearance modification. Why is the demand for this thing 7 times higher than the original Cleaning Seaborne Group?  How are there orders from Rhein Lab?  There are even some being sent directly to Kal'tsit's office? Is this entrapment... the amount of orders that need to be sent is too much...)\n(Doctor's Note: Staff member Warfarin is applying to quit Rhodes Island. It appears that she has unexpectedly made a fortune in the last few days. Does anyone have any clues?)"
  # 很好
  gts_evt_random.010130.a: "Good."
  # 首座缩小人生产流水线投入生产
  gts_evt_random.010140.name: "First Miniature Person Production Line Put Into Operation"
  # 从我们的帝国接触到银河系中那些渺小的小人种族开始，我们体型庞大的巨娘公民们就对那些虫子或灰尘一般的\"活体玩具\"们情有独钟，然而，在步入超光速时代之前，我们获得这些生物的途径只有效率低下的捕捉或人工培育生产，而直到如今，透过对基因工程与细胞培育工程的充分运用，我们已经能够在这样庞大的工厂里成规模地生产性格各异的独立缩小人个体，并且，帝国的宣传部门已经宣布这些个体仅仅只是\"生产品\"而已，因此我们的姑娘们已经能够完全放下心理负担地使用这些缩小人\n\n目前，这座工厂中已经能够生产包括消耗级、食用级、外用按摩级与宠物级在内的多种缩小人，被培育而出的个体在我们的工作人员的统一管理下能够迅速分配到帝国的各处，以供巨娘用她们自己的方式使用，另外，调查显示在生产流程中存在大量其他缩小人试图透过多种方式潜藏至宠物级缩小人的生产线路中，我们的解决办法则是将这些偷渡的小人全部留给工厂中的巨娘工作人员自行使用，这甚至变相地刺激了工厂就业岗位的充沛
  gts_evt_random.010140.desc: "Since our empire made contact with the tiny small-person races in the galaxy, our colossal giantess citizens have been especially fond of these insect- or dust-like 'living toys.' However, before entering the faster-than-light era, our only ways of acquiring these creatures were inefficient methods like capture and artificial breeding. However, through the full use of genetic engineering and cellular cultivation we are able to produce, on a large scale in this vast factory, independent miniature people with varying personalities.  Furthermore, the Imperial Propaganda Department has declared that these individuals are merely \"products,\" thus our girls are now able to use these miniaturized persons without any psychological burden.\n\nCurrently, this factory is capable of producing various types of miniature persons, including disposable, edible, external massage, and pet-grade.  The cultivated individuals, under the unified management of our staff, can be rapidly distributed throughout the empire, to be used by giantesses in their own ways.  In addition, investigations reveal that many other miniature people are trying to sneak into the production line of pet-grade miniature people by various methods. Our solution is to leave these stowaways to the factory's giantess staff for their own use, which has even indirectly stimulated the abundance of jobs in the factory."
  # 巨娘会喜欢的
  gts_evt_random.010140.a: "The giantesses will love this."
  # 第一座微缩城市装配完成
  gts_evt_random.010150.name: "First Miniature City Assembly Completed"
  # 随着帝国与银河系中的超光速文明接触愈加频繁，帝国中的巨娘对于更大的征服感的渴望也越来越明显，然而，即使我们的巨娘完全能够在星系中的任何一颗小人星球上摧毁城市乃至大陆并以此为乐，但过多的蹂躏与玩弄在星际外交中对我们造成的不利影响仍然不可忽略，因此，自行生产完全用作摧毁与玩乐的微缩城市的项目早已提上了日程，与之相应的大型微缩城市装配厂也在今日完成建造，第一座整齐划一而又足够渺小、装填了大量缩小人的微缩城市在我们的巨娘科研人员欣喜的注视中出现在了她们的脚边\n\n在经过批准之后，其中一位科学官毫不犹豫地对着这座微缩城市用她的丝足踩了下去，无数\"高楼大厦\"在一瞬间之内就被碾成了少女足底的一抹灰尘，至于那些预先填入其中的缩小人则同样逃不过被碾碎的命运，光荣地成为了少女袜底的丝线间的细微红点，在意犹未尽地碾了碾自己的脚掌之后，那位科学官则给出了\"脚感不错\"的评价
  gts_evt_random.010150.desc: "As the empire's contact with faster-than-light civilizations becomes more frequent, the giantesses' desire for ever greater domination grows even more pronounced. However, though our giantesses are completely capable of destroying cities and even continents on any small-person planet in the galaxy and enjoying it, the negative impact that too much trampling and playing around has on interstellar diplomacy cannot be ignored. Therefore, the project for self-producing miniature cities solely for the purposes of destruction and entertainment has long been on the agenda, and the corresponding large miniature city assembly plant has also been completed today. The first orderly, yet sufficiently minuscule miniature city, filled with a large number of small miniature people, appeared beneath the feet of our giantess researchers, to their delight.\n\nAfter gaining approval, one of the science officers unhesitatingly stepped on the miniature city with her silk stocking-covered foot.  Countless 'skyscrapers' were instantly crushed into a smear of dust on the girl's sole, and the miniature people previously placed in the city were equally unable to escape the fate of being crushed. They gloriously became tiny red dots among the threads of the girl's stocking.  After stepping on her foot with satisfaction, the Science Officer gave the assessment: \"The foot feel is nice.\"
  # 继续生产，这才是巨娘理应享受的玩具
  gts_evt_random.010150.a: "Continue production. These are the toys the giantesses deserve."
  # 生产文明
  gts_evt_random.010160.name: "Producing Civilization"
  # 培育文明，帝国一直以来的梦想，一个微缩文明的诞生不仅仅是为了消耗取乐，更是集帝国科技凝于一点的精华，而现在，在我们的社会学，微观工程学的高度发展下，第一个微文明已经培育完成，一颗蔚蓝色的星球静静地悬浮在培育室的中央，对于我们的科学官§H[event_target:gtsra_random_event_leader.GetName]§!来说，这颗还不及自己手掌大小的小小行星却承载了数十亿个微生物一般的缩小人的生存，即使我们撤去星球表面的保护屏障，那些微生物们能够看到的也仅仅只有§H[event_target:gtsra_random_event_leader.GetName]§!脸颊上肌肤的一小块，它们可能需要耗费整整数千年的发展与探索，才勉强能够在§H[event_target:gtsra_random_event_leader.GetName]§!的身体上探索出一道褶皱，更不用提如此脆弱的文明哪怕只是暴露在少女的鼻息之下都会遭到毁灭性的打击\n\n\"数据显示，这颗星球上目前生活了八十余亿的微缩生命，但哪怕只需要我的轻轻触碰，或者是一次踩踏、一次舔舐，这些微生物就都会连带着它们的星球一起变成我身体上的污垢或体内的养分……长时间的研究早已让我明白，这种令人绝望的体型差异将是这些微生物们穷极一生也无法理解，无法逃脱的\"\n\n在传输了这段信息之后，我们的科学官§H[event_target:gtsra_random_event_leader.GetName]§!轻轻地打开了星球表面的屏障，取出了那颗行星，随后结束了通讯，虽然我们不知道§H[event_target:gtsra_random_event_leader.GetName]§!最终选择如何使用掉那个文明，但紧随而来的多种用途的微文明将会是在帝国中的巨娘之间风靡一时的全新玩具
  gts_evt_random.010160.desc: "Cultivating a civilization, the empire's long-held dream. The birth of a miniature civilization is not only for entertainment consumption, but also the essence of the empire's technology gathered into one. And now, with the advanced development of our sociology and micro-engineering, the first micro-civilization has been cultivated. A blue planet is quietly suspended in the center of the culture chamber. For our Science Officer §H[event_target:gtsra_random_event_leader.GetName]§!, although this tiny planet is not even as big as her palm, it carries the existence of billions of microscopic small people. Even if we remove the protective barrier on the surface of the planet, the only thing those microbes would see is just a small patch of skin on §H[event_target:gtsra_random_event_leader.GetName]§!'s cheek. It might take them thousands of years of development and exploration to barely explore a wrinkle on §H[event_target:gtsra_random_event_leader.GetName]§!'s body, not to mention how a fragile civilization like this would be destroyed even if exposed to a girl's breath.\n\n\"Data shows that more than eight billion miniaturized lifeforms exist on the planet, but even with just a light touch, or a stomp, or a lick, these microbes will, together with their planet, be turned into dirt or nutrients on my body... A long period of research has already made me understand that the difference in size is insurmountable for these microbes, something they cannot understand, cannot escape from, even in their entire life.\"\n\nAfter transmitting this message, our Science Officer §H[event_target:gtsra_random_event_leader.GetName]§! gently opened the barrier on the planet's surface and removed the planet, then ended the communication. Although we don’t know how §H[event_target:gtsra_random_event_leader.GetName]§! will end up using that civilization, various kinds of micro-civilizations purpose-built will soon become a new fad toy amongst the giantesses in the empire."
  # [Root.Owner.GetName]的又一次突破
  gts_evt_random.010160.a: "[Root.Owner.GetName]'s another breakthrough."
  # \"气味十足\"的精炼厂
  gts_evt_random.010170.name: "A very \"fragrant\" refinery"
  # 自我们的文明进入超光速时代之后，星系中的巨娘种族对我们来说始终如同一把达摩克利斯之剑一般悬于星球上空，受限于体型上的绝对劣势，我们的种族中的个体甚至城市在面对那些山峦一般庞大的巨大少女时往往都逃不过被碾碎或消耗的下场，即使是少数愿意保持温柔态度的巨娘帝国也难以避免对我们的无意识的破坏，许多曾经繁华的都市就这样连带着公民们化为了巨娘丝足下的一抹尘埃\n\n然而，经历过无数次的重建与实验之后，我们意外地发现：巨娘的体液中存在着大量于帝国有益的珍贵物质，无论是宝贵的矿物还是稀缺的合金都能够在巨娘的汗液或爱液中成功提取；而由于巨娘无比庞大的体型，我们很容易地就能够从那些曾经被破坏了的城市或星球上获取大量的巨娘足汗或爱液，对于这些液体的精炼工程也正式开始实施\n\n首座巨娘体验精炼厂已经在我们的一颗宜居星球上装配完成，不过，由于巨娘的体液对于我们来说在数百倍至数万倍的放大下往往会显得更加剧烈，而那些更为罕见的天体级巨娘的体液于我们而言则如同神迹一般不可侵犯；因此，为了防止人们在巨娘足汗的气味下大片昏迷或是在爱液的气息里失去理智，我们不得不将精炼厂设置在了远离居住区的一片区域，并且由经过训练的专业人员进行精炼
  gts_evt_random.010170.desc: "Since our civilization entered the faster-than-light era, the giantess races in the galaxy have always been like a sword of Damocles hanging in the sky above our planets. Due to the absolute disadvantage in terms of physical size, the individuals and even cities of our race are usually crushed or consumed when facing those massive, mountain-sized giant girls.  Even the few giantess empires willing to maintain a gentle attitude cannot avoid the unconscious destruction of us; many once prosperous cities are, along with their citizens, reduced to a smear of dust under the giantesses’ silk stockings.\n\nHowever, after countless rebuilds and experiments, we have unexpectedly discovered that there are a large number of valuable materials beneficial to the empire in the bodily fluids of the giantesses.  Whether it be precious minerals or scarce alloys, all of these can be extracted successfully from the sweat or ejaculate of giantesses. Due to the enormous size of giantesses, we can easily obtain large quantities of foot sweat or ejaculate from the cities or planets that have been destroyed, and the refinement project for those liquids has officially begun.\n\nThe first giantess bodily fluid refinery has been assembled on one of our habitable planets. However, since the bodily fluids of giantesses often seem more intense when seen under hundreds to thousands of times higher magnifications, and the fluids of those rarer celestial-level giantesses can appear to us as godlike and untouchable, we’ve had to place the refinery in an area far from residential districts, and have it operated by trained specialists in order to prevent mass unconsciousness caused by the odor of giantess foot sweat, or citizens going insane within the scent of ejaculate."
  # 似乎也算是对我们的一点补偿
  gts_evt_random.010170.a: "Perhaps a little compensation for us."
  # 丝线间的工作
  gts_evt_random.010180.name: "Work Among the Threads"
  # 随着我们的帝国与星系中其他种族的交流愈加频繁，我们对那些巨娘的认知也越来越深入，当然，有得必有失，巨娘\"造访\"我们的殖民地的次数也逐渐增多，不过，无论是观察、玩弄还是蹂躏，那些巨大的少女们在离开时往往会恶作剧一般地向附近的星球上或直接向陆地上随手丢下自己的鞋袜或胖次，满溢而出的气息与污垢经常会淹没一大片区域，不幸被直接砸中的城市更是会直接被碾碎成纤维下的几丝灰尘，但是，就在我们的科学家们忍受着屈辱与恶臭，试着对那些足以改变星球地貌的丝织品进行研究时却惊喜地发现，这些巨娘的随身衣物对于渺小的我们来说同样是一笔意想不到的财富，无论是在巨大的胖次纤维间提取巨娘爱液，还是在脏兮兮的鞋袜山脉上的足垢中开采矿物都似乎是个不错的选择\n\n为此，帝国开始在星系中的巨娘到访过的星球上收集那些被随手丢弃的巨大衣物，并透过运输船统一运至巨娘内衣回收站进行分类利用，这座占据了几乎一整片大陆的巨型建筑专门用来存放巨娘的那些山脉一般宏伟的内衣，为之后的各种运用完成分类之后收容处理，当然，为了防止公民们在一座座大厦一般的丝线里迷失，这座建筑同样需要更加专业的人员进行各项工作，以免被胖次中的爱液或袜子里的足垢砸碎
  gts_evt_random.010180.desc: "As our empire's interaction with other races in the galaxy becomes more frequent, our understanding of those giantesses becomes deeper. Of course, with gains there must be losses. The number of times giantesses 'visit' our colonies also gradually increases. Whether it be observation, play, or trampling, these giant girls often mischievously drop their shoes, socks, or panties on nearby planets or directly on the land before they leave. The overflowing scent and filth often submerge large areas. A city unlucky enough to be directly struck will be crushed into a few wisps of dust under the fiber of the material. However, while our scientists endured the humiliation and stench to try to study those woven fabrics that were large enough to change the landscape of a planet, they were pleasantly surprised to find that the giantesses' personal garments were also an unexpected fortune for us small people. It seems to be a good choice, whether extracting giantesses' ejaculate between the fibers of enormous panties, or mining minerals from the foot dirt mountains made of dirty shoes and socks.\n\nFor this reason, the empire has begun to collect the discarded massive clothes left behind by giantesses on the planets they have visited, and uniformly transported to giantess underwear recycling stations for classification and use. This giant building, which occupies nearly an entire continent, is specifically used to store those mountain-like magnificent undergarments of the giantesses. After classifying those for various uses, they are collected and processed. Of course, to prevent citizens from getting lost in those skyscraper-like threads, this building also requires more professional personnel to carry out various work so they are not overwhelmed and crushed by the ejaculate in the panties or the foot dirt in the socks."
  # 或许以后也可以把它们改造成居住站……
  gts_evt_random.010180.a: "Perhaps we can remodel them into living stations in the future..."
  # \"巨兽颔首\
  gts_evt_random.010190.name: "\"Bowing to the Behemoths\"
  # §H\"你们……渺小的虫子们，真的就不害怕我现在就把你们全都碾碎？\"§!\n\n\"尊敬的小姐，我们毫不怀疑您有着这样的伟力，然而，如果您的确如此做了的话，我们提出的所有条款都将不复存在，§Y[Root.Owner.GetName]§!恐怕也很难启动我们之间的合作……\"\n\n良久的沉默，巨大的水手服少女无声地坐在一张同样庞大的桌子前方，默默地盯着桌面上几位礼节完备而又不卑不亢的§Y[Root.Owner.GetName]§!外交官，良久，那位巨娘少女轻轻地呼出了一口气，在一旁的文件上签下了自己的名字\n\n§H\"……好吧，我同意了，小人们，\"§!\n\n以上影像来自于帝国刚刚落成的与巨娘外交对策处的首次约谈现场，也是我们的文明最终得以与巨娘和谐相处的伟大开端，在文明逐渐发展的科技与经济基础上，一些来自于其他帝国的巨娘在我们开出的条件下同意为我们的帝国效劳，而在她们的帮助下，曾经对我们来说无异于天方夜谭的一些前景也得以实现\n\n我们的公民们面对那些遮天蔽日的身影时第一次不再需要四散逃窜，被庞大的丝足投下的阴影笼罩的人们也仅会被友善的巨娘用柔软的足底爱抚，而无需担心被碾碎消耗，我们可以在巨娘大陆一般的躯体上殖民生存，也可以与亲近的她们一同探索星辰大海，上至泰坦巨娘下至微小小人，我们的文明中的个体们无不相信，这将是全宇宙巨娘与小人们和谐相处的开端
  gts_evt_random.010190.desc: "§H\"You... tiny bugs, aren't you really afraid that I'll just crush you all right now?\"§!\n\n\"Respected Madam, we have no doubt you possess such power. However, if you were to do so, all our proposed Terms would no longer exist.  §Y[Root.Owner.GetName]§! would probably find it hard to start our cooperation...\"\n\nA long silence followed. The immense, sailor-uniform-clad girl silently sat before a similarly large table, silently staring at several courteous though not servile diplomats of §Y[Root.Owner.GetName]§! on the table. After a long while, the giantess girl sighed gently and signed her name on the documents beside her.\n\n§H\"…Okay, I agree, little people,\"§!\n\nThe above footage comes from the first negotiation session at the empire's newly completed Giantess Diplomacy Countermeasure Office. This is also the magnificent beginning of our civilization’s final peaceful coexistence with the giantesses. Based on the ever-growing technology and economy of our civilization, some giantesses from other empires have agreed to assist our empire under our proposed terms. With their help, some prospects that were once unimaginable for us have been achieved.\n\nFor the first time, our citizens no longer needed to scatter away when facing those sky-covering figures. The people who have been cast in the shadows by huge silky feet will be caressed with friendly soles instead of being consumed and crushed. We can colonize and survive on the continent-like bodies of giantesses, and we can explore the starry skies with these close allies as well. From Titan Giantesses to the tiniest of tiny people, the individuals of our civilization all believe that this will be the beginning of a harmonious coexistence between giantesses and small people throughout the universe."
  # 崭新的开始，理想的未来
  gts_evt_random.010190.a: "A new beginning, an ideal future."
  # 大型缩小人专卖店已投入营业
  gts_evt_random.010200.name: "Large Scale Miniature Person Specialty Shop Now Open for Business"
  # 随着帝国中巨娘人口的进一步发展，对于缩小人商品的需求也日益增长，好在，借由缩小人工业生产技术水平的大幅度增长与对银河中小人种族的\"合法占有\"，我们已经能够大批次地向帝国中的巨娘销售质量上乘的缩小人商品，确保它们在丝足下或趾缝里的每一次挣扎或是每一声求饶都能够为姑娘们带来最大程度的舒适\n\n调查部门提交的报告显示，这座小人专卖店首日就已经出售了数万只缩小倍率不一的缩小人商品，无论是用于在巨足下蹂躏、在私处取乐的正常小人还是可以饲养在鞋袜之中的微生物级小人都备受欢迎，同时，对于商品来源及用处的扩大化也已经提上了日程，毕竟对于我们伟大的种族来说，即使是一次平凡的落脚踩踏也完全足以碾碎数以千计的卑微的小人们了
  gts_evt_random.010200.desc: "With the further development of the giantess population within the empire, the demand for miniature person products is also growing. Fortunately, with the help of the large increase in the technological level of miniaturized person industrial production and the \"legal acquisition\" of small person species in the galaxy, we are now able to sell high-quality miniature person products to the giantesses in the empire in large quantities. We can ensure that every struggle or plea for mercy under their silk feet or between toes can bring the girls maximum pleasure.\n\nThe report submitted by the investigation department shows that this small person specialty shop has already sold tens of thousands of differently scaled miniature person products on its first day. Whether it’s normal-sized small people used for trampling under giant feet or for pleasure in private parts, or microscopic level small people that can be raised in shoes and socks, all of them have been well-received. At the same time, the expansion of sources for those products and usage of them has already been put on the agenda, because for our great race, even an ordinary footstep of landing is enough to crush thousands of miserable small people.”"
  # 加大力度！我们必须满足巨娘的缩小人消耗
  gts_evt_random.010200.a: "Increase the efforts! We must meet the giantesses' miniature person consumption!"
  # 微缩种族正式得到完善保护
  gts_evt_random.010210.name: "Miniature Races Officially Granted Complete Protection"
  # 自从帝国进入超光速时代之后，我们的巨娘就对银河系之中的那些小巧玲珑的生物表现出了较为强烈的喜爱之情，对于缩小人商品和小人文明个体的区分也很快贯穿了整个帝国的上上下下，人们一致认为，巨娘既然拥有如此伟岸的体型，就理应对那些小小的智慧生命做出我们应做的保护工作，只不过，鉴于双方明显的体型差距，被巨娘的巨足无意识地碾碎或者混在食物中被消化的小人们数不胜数，科学官们在进行登陆考察时也常常不小心踩碎大片大片的微小城市，大量的小人文明就这样成为了夹杂在丝足底部的灰尘，而现在，这种情况终于得到了改善\n\n第一处小人保护区的建立为帝国中致力于与小人文明和谐共生的巨娘提供了一个很好的观察场所，一片广阔的灰色城市平铺在广场一般大小的地面上，其中饲养的上百亿位智慧小人个体得以安然度日，尽管这里的小人与我们的体型差距已经达到了极其明显的地步，巨娘的一支鞋子或一双丝袜都足以她们的寄生繁衍，但至少，这里为渺小的她们在危险的银河系之中带来了一处净土，当然，唯一的缺点在于，由于对资源的规划与合理利用，这里的小人所消耗的食物大都来自于巨娘经过过滤的体液或足垢，使用的消耗品也几乎来自于巨娘随手脱下的鞋袜或是胖次，只不过，这总比在自己的星球之上等待着被其他巨娘帝国玩弄蹂躏要强上许多
  gts_evt_random.010210.desc: "Since the empire entered the faster-than-light era, our giantesses have shown a rather strong fondness for the petite creatures in the galaxy. The distinction between miniature person products and individual members of small-person civilizations quickly became prevalent throughout the empire. People generally believe that since giantesses have such enormous bodies, they should naturally do what they can to protect these tiny intelligent lifeforms. However, given the obvious size difference between the two, countless small people are inadvertently crushed under the giantesses’ feet or consumed in food.  Science Officers also often accidentally step on large swathes of tiny cities during landing inspections, and many small-person civilizations end up as dust stuck to the soles of silk stockings. Now, this situation has finally improved.\n\nThe establishment of the first miniature person sanctuary provides a great observation place for giantesses in the empire who are committed to harmonious coexistence with small-person civilizations. A broad gray city spreads out across a plaza-like area, and the hundreds of billions of intelligent small-person individuals raised within it can live peacefully. Although the difference in size between the small people and us is extreme – one shoe or a pair of silk stockings of a giantess is enough for them to live and multiply – at least this area provides them with a haven within the dangerous galaxy. Of course, the only drawback is that due to the planning and reasonable utilization of resources, most of the food consumed by the small people here comes from the filtered bodily fluids or foot dirt of giantesses, and the consumables they use are almost all the shoes, socks, or panties that the giantesses casually throw aside. However, this is still much better than waiting on one’s own planet to be toyed with by other giantess empires."
  # 愿她们能够在我们的管理下安然度日
  gts_evt_random.010210.a: "May they live peacefully under our management."
  # 微缩智慧生命研究启动
  gts_evt_random.010220.name: "Miniature Intelligent Life Research Initiated"
  # 如果仅从体型上而言，那些远比我们渺小的小人个体如何维持生理机能的确曾让我们的科学家们困扰了许久，如果再算上那些更加渺小的微生物种族的话，她们细胞般大小的身体仍然能够进行智慧生命基本的生理活动这一现象则不亚于未解之谜，不过，帝国中第一座小人研究所的出现将会很好地帮助我们解决那些问题，至于试验品……我们总能够找到那些\"自愿\"配合的小人的\n\n如果说关于物理学、工程学方面的研究仅仅只需要进行对小人个体的解剖或理化实验的话，那么社会学领域的研究就显得有趣许多了，我们的科学官对那些用于消耗的缩小人试验品做出了大量既为实验也为取乐的考察，例如将大量小人调节至合适体型之后全部塞进闷了数天的长靴里面并观察她们在绝望中的挣扎、命令微米级的缩小人在缓缓碾下的手掌间攀爬至数万米高的乳首上方以检测其身体机能、又或者是将除了某位幸运的小人之外的其他小人个体全部二次缩小，随后观察那位保持原有体型的小人的行为，每次未能通过实验的缩小人往往都会被实验的执行者当做失败品用各种方式处理掉，而通过实验的幸运儿则会被奖励在我们的首席科学官的鞋子里面生活一个星期之后再进行下一次实验
  gts_evt_random.010220.desc: "If we only consider their physical size, how those miniature people individuals so much smaller than us maintain their physiological functions has indeed puzzled our scientists for a long time. If we also consider the even more minuscule microbe races, the fact their cell-sized bodies are still capable of the basic physiological activities of an intelligent life is nothing short of an unsolved mystery.  However, the appearance of the first small person research institute in the empire will greatly help us resolve these problems.  As for the test subjects... we can always find small people who 'volunteer' to cooperate.\n\nIf research in the fields of physics and engineering only requires dissection or physicochemical experiments on miniature people, then the research in the field of sociology is much more interesting. Our Science Officers have conducted a large number of investigations on these miniature person test subjects, both for experimentation and for amusement.  For example, they placed a large number of small people, adjusted to the appropriate size, all into a pair of long boots that had been left to fester for several days, and observed their struggles in despair. Another example, they ordered a microscopic small people to climb to the top of a breast several kilometers high, which was under a human hand that slowly moves downwards, in order to test the function of their bodies. Or, they would secondarily miniaturize all of the miniature people individuals, except one lucky one, then observed the behavior of the small person who retained their original size. Each miniature person who failed the experiment was usually disposed of in various ways by the experimenter as a failed product.  Those lucky ones that successfully completed the experiments will receive the reward of living a week in our Chief Science Officer's shoes before the next experiment."
  # 微观生命研究的又一次进步
  gts_evt_random.010220.a: "Another step forward in microscopic life research."
  # 体型差异专供娱乐场所已建成
  gts_evt_random.010230.name: "Entertainment Venue Catering to Size Differences Completed"
  # 显而易见的是，对于银河系之中广泛存在的巨娘种族而言，对那些小人种族的玩弄可以让她们产生相当的快感与征服感，而在这一基础上，无论是利用生物能发电还是开设大量玩弄缩小人专用的娱乐设施均可为我们的帝国提供大量的能量币资源，\"小人红灯区\"这一设施也在帝国的支持下应运而生，其中已经默认完成的大量设备允许我们帝国中的巨娘随心所欲地使用各种方式蹂躏那些卑微的缩小人生命们，当然，巨娘无比庞大的体型及其带来的压迫感对于某些小人文明来说反而是一种享受，因此我们偶尔也会接待数位来自其他文明的、提供了足量能量币的小人公民来到这座设施，并指派几位巨娘在不造成伤害的情况下和这些小小的顾客好好玩一玩\n\n截止目前，小人红灯区中的设施已具有了相当的规模，每月都有数以亿计的缩小人商品被运输到这里之后供巨娘消耗，并根据缩小倍率不同而进行不同的分配，百分级小人往往会被充当巨娘鞋子中的除臭剂或是擦拭身体使用的小型吸汗海绵，而万分级小人则会被填充至微缩城市中后作为消耗品地毯被巨娘有意或无意地踩扁，最终沦为丝袜下的一抹尘埃或一丝红血；至于百万分级的超微小小人则会被当做微生物一般装在特质的足汗培养皿之中，任巨娘随意地涂抹至身体上的某处之后在星球般巨大的肌肤之上自生自灭，此外，每一位造访此处的巨娘在离去时还会收到一只公分级的足奴小人作为纪念品
  gts_evt_random.010230.desc: "It is obvious that for the giantess races widely present in the galaxy, toying with the small person races can create a considerable sense of pleasure and domination. Based on this, whether it’s using biomass to generate electricity or opening a large number of entertainment facilities dedicated for the purpose of toying with miniature people, all can provide our empire with abundant energy coin resources. The \"Small Person Red-Light District\" facility was created in line with imperial support. A large number of devices have already been pre-installed, allowing the giantesses in our empire to use various means at will to trample and toy with those miserable miniature person lifeforms. Of course, the incredibly immense body of the giantesses and the sense of oppression they bring may also be an enjoyment for some small-person civilizations. Therefore, occasionally we will also receive a few small-person citizens from other civilizations who provide enough energy coins to visit the facility. We delegate several giantesses to have some fun with those small clients in a manner that will not cause them harm.\n\nSo far, the facilities in the small person red-light district have already reached considerable size. Hundreds of millions of miniature person products are transported here every month to be consumed by the giantesses. They will be distributed according to different scale factors. Small people at the percentage scale size are often used as deodorant in giantesses' shoes or as small sweat absorbing sponges used to wipe the body, while the 1/10,000 scale people will be filled into miniature cities and then be intentionally or unintentionally trampled on by giantesses as disposable carpets, eventually becoming a wisp of dust or a trace of blood under stockings.  As for the ultra-micro miniature people at the 1/1,000,000 scale, they will be placed, like microbes, in special foot sweat culture dishes. Giantesses can then smear them randomly on the surface of their bodies before letting them live and die on their planet-sized skin. Moreover, each giantess who visits this place will also receive a centimeter-scale foot-slave miniature person as a souvenir when they leave."
  # 让巨娘尽情地发电吧！
  gts_evt_random.010230.a: "Let the giantesses generate power to their hearts' content!"
  # 守夜人
  gts_evt_random.010240.name: "Night Watchman"
  # 在§Y[event_target:gtsra_random_event_planet.GetName]§!夜空中的巨大的瞳孔在不断扫视着星球表面的小人城市群，为了不被她发现，地上的小人们不得不进行灯火管制以及宵禁无数的小人们躲在被窝里瑟瑟发抖，小声的恳求着天外的存在能够早点离开去巡察下一个星球\n\n§S“啊…都睡了啊…真是扫兴”§! \n\n天外的巨大存在在说完这局话后就离开了，遮挡天空的巨大面庞已经消失，一轮明月重新悬挂在空中，好像什么都没有发生一样
  gts_evt_random.010240.desc: "The giant pupil in the night sky of §Y[event_target:gtsra_random_event_planet.GetName]§! continues to scan the small-person cities on the surface of the planet. In order to avoid being discovered by her, the small people on the ground are forced to implement light control and curfews. Countless small people huddle under the covers, shivering and quietly pleading for the entity in the sky to leave and patrol the next planet sooner.\n\n§S\"Ah... everyone's asleep? ...How boring.\"§!\n\nThe giant entity left the planet after uttering these words. The giant face that covered the sky had disappeared, and a full moon was now hanging in the sky, as if nothing had happened."
  # 令人不安
  gts_evt_random.010240.a: "Disturbing."
  # 快递
  gts_evt_random.010250.name: "Express Delivery"
  # 随着帝国疆域的扩大，跨星系间贸易的增多让§Y[event_target:gtsra_random_event_planet.GetName]§!上的各位公民得以享受来自异星的各种方便产物\n\n一个普通家庭中，小女孩正在超光速通讯论坛上寻找合适的服装，尽管她们家的收入在星球上只能维持温饱，却也可以在超光速通讯的加持下从远方获得经济实惠的产品正好，自己的胖次也应该换一个新的了……想到这里，她快速打开了通讯器，很快就找到了中意的款式的胖次并予以下单\n\n可一分钟后，§Y[event_target:gtsra_random_event_planet.GetName]§!政府立刻发布了全球警戒：一颗巨大的不明飞行物正朝着他们飞来，目前来看该物体表面为白色，下方似乎有意义不明的青色巨大条纹，目前对其的一切呼叫均没有任何回应，而过近的距离和超快的速度让拦截武器无法反应，即使政府发布了警戒，也并没有多少时间供他们逃跑\n\n"快看天上的是什么？"\n"白色的……我们要被撞死了吗？"\n"呜——我还不想死啊——还没有见过偶像嘉然小姐呢——"\n"这个东西怎么这么像团在一起的胖次..."\n很快，伴随着星球上"砰——"的一声，以及某种物体展开的破空声和落地的"啪嗒"声，一切都归于沉寂了...\n事故的调查报告令所有人哭笑不得：因为该孩童没有注意选择具体的货物样式，商店一方以默认为泰坦级巨娘的体型发送了胖次，而由于对方的高超科技直接选择了折跃传递，于是这巨大的胖次直接飞到了星球上方，很快就拍在了地面上展开的胖次将几个省份盖在了纤维之下，吸干了当地的地表水分，幸而没有落在海洋附近，造成进一步的全球性事故\n事故造成的损失目前还在调查中不过，往好处想，至少东西送达了，不是嘛？
  gts_evt_random.010250.desc: "With the expansion of the empire's territory, the increase in inter-stellar trade has allowed the citizens of §Y[event_target:gtsra_random_event_planet.GetName]§! to enjoy various convenient products from other planets.\n\nIn an ordinary household, a little girl is looking for suitable clothes on a faster-than-light communication forum. Although her family's income can only maintain a basic level of living on the planet, they can still obtain economical products from afar with the support of faster-than-light communication.  Just right, her panties should also be replaced with a new pair... Thinking of this, she quickly turned on her communicator and quickly found a pair of panties she liked and placed an order.\n\nHowever, one minute later, the §Y[event_target:gtsra_random_event_planet.GetName]§! government immediately issued a global alert: a huge unidentified flying object was flying toward them. Currently, the object's surface appears to be white, and there seem to be huge, inexplicable blue stripes underneath. All calls to it are unanswered. Its close distance and super high speed also prevent the interceptor weapons from reacting. Even if the government had issued a warning, there wasn't much time for them to escape.\n\n\"Look, what is that thing in the sky?\"\n\"It's white... are we going to be hit?\"\n\"Wah--I don't want to die yet--I haven't seen my idol Miss Jiaran yet--\"\n\"Why does this thing look like a crumpled up pair of panties...\"\nSoon, with a \"thump--\" heard from the planet accompanied by the sounds of something unfolding and impacting the ground, all became silent...\nThe accident report left everyone stunned and not knowing whether to laugh or cry: because the child had failed to select the specific product style, the store had sent a pair of panties, assuming the default size to be a Titan-level giantess. Because of the high-tech of the other party, the store chose to use instant teleportation for delivery, thereby the massive pair of panties flew directly above the planet. It soon slammed into the surface of the planet. The unfolded panties covered several provinces, sucking dry the surface water of the area - luckily it didn't land near the ocean, avoiding a larger global disaster.\nThe investigation for the losses caused by the accident is still in progress. However, to look on the bright side, at least the item was delivered, right?"
  # 而且在这胖次下面开发的土地说不定会大受欢迎？
  gts_evt_random.010250.a: "And the land developed under these panties might become very popular?"
  # 足够大？
  gts_evt_random.010260.name: "Big Enough?"
  # 嘶吼的殖民飞船引擎声第一次刺破了这颗星球带着薄雾的清晨，伴随着沉闷的一声震动，飞船成为了殖民者们的新家，尽管搭载着工程机械和农牧业作物禽畜的殖民飞船长达数公里，但是在我们的巨娘看来不过是普通的长途客车而已，伴随着舱门缓缓升起，兴奋的巨娘乘客们早已按捺不住激动的心情，争先恐后地踏上这片处女大地，而装卸货物这种枯燥的工作，理所当然的留给了随行的小人仆从们\n\n巨娘开心地用靴子踏平森林，然后在嬉戏中吓得本地野兽落荒而逃……随着巨娘间打闹越来越激烈，带着浓烈气味的胖次和鞋袜变成了星球上四散的新地标，而甜蜜的爱液混入本地河流，让淡水散发出带有催情气息的腥味，直到几天后我们的巨娘因为在空旷的大地上，已经没什么可玩的时候，她们才返回飞船，来玩弄一下小人仆从们所搭建的新社区，一些简易而矮小的定居点已经在飞船周边扩张开来，推土机和吊车正有条不紊的开展着工作\n\n一位赤足的巨娘——她的靴子早就被同伴们当作水瓶用了——正准备穿过棚户区回到飞船，看着那些凌乱的工棚，她直接一脚踩了进去……
  gts_evt_random.010260.desc: "The roaring engine of the colony ship pierced the misty morning of this planet for the first time. With a dull thud, the ship became the new home for the colonists. Although the colony ship, loaded with engineering machinery and agricultural livestock, was kilometers long, it was nothing more than a long-distance bus to our Giantesses. As the hatch slowly rose, the excited Giantess passengers could no longer hold back their excitement and scrambled to step on this virgin land. The boring work of loading and unloading cargo was naturally left to the accompanying tiny servants.\\n\\nThe Giantesses happily trampled the forest with their boots, scaring the local beasts into fleeing... As the play between Giantesses became more intense, strong-smelling panties and socks became new landmarks scattered on the planet, and sweet love fluid mixed into local rivers, making the fresh water emit a fishy smell with aphrodisiac scent. It wasn't until a few days later, when our Giantesses had nothing left to play with on the empty land, that they returned to the ship to toy with the new community built by tiny servants. Simple and low settlements had expanded around the ship, and bulldozers and cranes were working in an orderly manner.\\n\\nA barefoot Giantess—her boots had long been used as water bottles by her companions—was about to cross the shantytown to return to the ship. Looking at those messy sheds, she stepped directly into them..."
  # 给我留出一条行走动线好吧！
  gts_evt_random.010260.a: "Leave me a walking path, okay!"
  # §R丹 麦 制 地 雷§!
  gts_evt_random.010260.a.tooltip: "§R Danish Landmine §!"
  # Big Enough
  gts_evt_random.010261.name: "Big Enough"
  # §R哼啊啊啊啊啊啊！§!\n\n不同于以往的那些脆弱小人建筑，有座工棚居然格外坚固，在承受了上万吨的巨娘踩踏后竟纹丝不动，原因是这座小屋是由一款被称之为「乐G」的巨娘积木玩具改造的，其以纳米材料一体成型制造，坚固到能承受巨娘的随意把玩，赤脚的巨娘发出了爆裂的吼声，这里的爆裂是物理意义上而非仅仅是形容，周围一公里内的数百小人被直接震到内爆成为一团团肉块，而稍远一些的小人则口鼻出血，终生失去了听力、视力甚至智力，不过在十几公里外的监视录影机还是把这震撼的一幕给录了下来……这本来只是第一次殖民中一个无足轻重的插曲罢了，直到有好事者在论坛上将巨娘的声音剪辑成了一首歌曲里的meme：\n\n「§S全体都有，这颗星球，这个宇宙，我们的巨娘足够大吗？\n从卡迪亚~~到莫迪亚！卡里达，还有科雷利亚！阿凡达，我们来啦！欧罗拉~~和冯·布劳恩……哦盖亚、泰拉、还有神圣泰拉！阿格里皮娜，去遇战塔吧！坎巴拉，太厉害了……§!\n\n§R啊啊啊啊啊啊啊啊啊，啊啊啊啊啊啊啊，啊啊啊啊啊依啊依啊依呀，哼啊啊啊，啊……§!」\n\n因为这首歌曲意义不明一般的报菜名似的报地名，还有及其魔性的巨娘怒吼，很快便在各大论坛上疯狂地传播开来，如同模因污染一般难以消除，据悉该视频已让我国公民听力水平平均下降了1.2个百分点，但仍没办法阻止全体国民傻呵呵地看这个巨娘大吼大叫
  gts_evt_random.010261.desc: "§R Hmph aaaaaah! §!\\n\\nUnlike those fragile tiny people's buildings in the past, a shed was exceptionally sturdy. It didn't budge even after withstanding tens of thousands of tons of Giantess trampling. The reason was that this hut was modified from a Giantess building block toy called 'LeG', made of nanomaterials in one piece, strong enough to withstand Giantess's casual play. The barefoot Giantess let out an explosive roar. 'Explosive' here is physical, not just descriptive. Hundreds of tinies within a kilometer were directly shocked into imploding into meat chunks, while those further away bled from orifices, losing hearing, vision, or even intelligence for life. However, a surveillance camera ten kilometers away still recorded this shocking scene... This was originally just an insignificant episode in the first colonization, until a busybody edited the Giantess's voice into a meme song on the forum:\\n\\n'§S Attention everyone, this planet, this universe, is our Giantess big enough?\\nFrom Cadia~~ to Mordia! Calida, and Corellia! Avatar, here we come! Aurora~~ and Von Braun... Oh Gaia, Terra, and Holy Terra! Agrippina, go to Yuuzhan Vong! Kerbal, amazing...§!\\n\\n§R Aaaaaah, aaaaaah, aaaaah~ya~ya~ya, hmph aaaaaah, ah...§!'\\n\\nBecause this song inexplicably listed place names like ordering dishes, and the extremely magical Giantess roar, it quickly spread crazily on major forums, difficult to eliminate like a memetic hazard. It is reported that this video has caused the average hearing level of our citizens to drop by 1.2 percentage points, but it still can't stop the whole nation from foolishly watching this Giantess yelling."
  # 给我安静一点吧!
  gts_evt_random.010261.a: "Quiet down!"
  # 我们也可以使用这种材料!
  gts_evt_random.010261.b: "We can also use this material!"
  # 爱液热力站竣工
  gts_evt_random.010270.name: "Love Fluid Thermal Station Completed"
  # 热力站上空浮现出一座山脉般巨大而美好的肉体。\n巨大的少女跨立在热力站的开阔采集槽上方，缓缓褪下了贴身的下着，将湿润饱满的小穴完全对准了下方的采集管道。\n少女双指并拢，带着难以抑制的娇喘，插入了那片滚烫潮湿的深处，动作由缓慢逐渐转为剧烈的揉捏与抠挖。\n"咕啾——咕啾——"\n伴随着清脆而淫靡的黏浊水声在云霄间回荡，成百上千吨滚烫半透明的爱液如决堤的洪流般从高空轰然倾泻而下。\n热力站的管道瞬间承受了超越极限的压力，滚烫的液体直接漫过了边缘防线，将一整队在下方进行检查的小人工程人员彻底淹没。\n黏稠的汁水瞬间将他们吞噬，连一丝反抗的余地都没有。\n与此同时，当过滤网全力运作排出多余杂质时，警报声忽然响起。\n"警告！三号主要过滤阀门卡住了！"\n技术员抹了把脸上的冷汗，大声喊道。\n主管凑上前去看着监控屏幕，只见巨大的金属爪从黏稠的爱液中抓出了一架已被绞成废铁的战舰残骸，上面甚至还残留着拉丝的爱液。\n"我的天啊..."\n主管惊呼道，\n"这不是上个月在边境失踪的巡逻舰吗？怎么会被大人抠出来？"\n对讲机里传来了少女慵懒而带有歉意的喘息声。\n"啊...对不起呀小人们，刚才手指伸得太深，顺便把之前卡在里面的小玩具给掏出来了...你们没受伤吧？"\n主管只能苦笑着对通讯器回应。\n"没...没关系，大人，这点损失换来这么充沛的能源与合金...完全值得！
  gts_evt_random.010270.desc: "Above the thermal station hovered a mountainous, gigantic, and magnificent body.\\nThe giant maiden straddled the station's open collection basin, carefully aligning her intimate lower body with the collection ducts below.\\nWith soft gasps of pleasure, the maiden stimulated her warm, sensitive depths, her gentle motions stirring up a torrential outpouring.\\n\"Splash—gush—\"\\nEchoing among the clouds with clear, splashing sounds, hundreds of tons of scalding, translucent love fluid cascaded from above like a surging flood.\\nThe thermal station's piping instantly bore pressure far beyond designed limits. The scalding fluid breached the perimeter defenses, submerging an entire inspection crew of tiny engineers below.\\nThe viscous stream quickly swept them away in the irresistible deluge.\\nMeanwhile, as the filtration grid struggled to filter out excess debris, an emergency alarm sounded.\\n\"Warning! Primary Filter Valve Three is jammed!\"\\nThe technician wiped cold sweat from his forehead and yelled.\\nThe supervisor hurried to the surveillance display. A heavy mechanical claw was dredging up a mangled warship wreck from the thick love fluid, strings of fluid still clinging to its hull.\\n\"Good grief...\"\\nThe supervisor gasped,\\n\"Isn't this the patrol vessel that vanished on the border last month? How did Her Ladyship retrieve it from inside herself?\"\\nFrom the comms came the maiden's lazy, apologetic murmur:\\n\"Ah... sorry, little tinies, I reached a bit too deep just now and pulled out a little toy that got stuck earlier... Did any of you get hurt?\"\\nThe supervisor could only reply with a strained smile over the transmitter:\\n\"N-no problem at all, Milady! A small loss like that in exchange for such abundant energy and alloys... is completely worth it!\"
  # 能源与意外获取的合金都收下了
  gts_evt_random.010270.a: "We will accept both the energy and the unexpected alloys."
  # 足汗打捞场投入营运
  gts_evt_random.010280.name: "Foot Sweat Salvage Yard Enters Operation"
  # 把三号磁力吊臂再往左边挪三米!对对对，就是那块沉在最底下的黑色大家伙，给我拽上来!"\n打捞场的总监站在高台上，举着对讲机大声指挥着。\n身旁的操作员皱着眉头，忍着隔着防护面具传进来的刺鼻脚臭味问道。"主管，这池子里的酸臭味也太顶了吧?这都是大人靴子里刮下来的足汗跟足垢混合物吧?"\n"不然你以为这里为什么叫足汗打捞场?"\n"大人脚底板指纹缝里塞满了敌人的战舰碎片、压扁的堡垒，甚至是富含稀有金属的行星残渣!"\n"这些宝液虽然闻起来酸臭刺鼻，但只要把里面的东西捞出来洗干净，可都是顶级的合金与矿石啊!"\n说话间，巨大吊臂哗啦一声从黄褐色的黏稠液体里吊起了一块几十米长的金属废铁，表面还沾着拉丝的足汗。\n"看到了吧？这可都是白花花的资源!"\n"让底下的工人们加快速度，捞完这批，大人换下来的旧袜子山脉还等着我们去开采呢!
  gts_evt_random.010280.desc: "\"Move the No. 3 magnetic crane three meters further left! Yes, right there—that big black mass settled at the very bottom, haul it up!\"\\nThe salvage yard director stood upon the elevated catwalk, shouting commands through his megaphone.\\nBeside him, an operator grimaced beneath his respirator at the overpowering foot odor and asked, \"Director, isn't the sour stench from this pool a bit much? Is this really all foot sweat and residue scraped from Her Ladyship's boots?\"\\n\"Why else would this be called the Foot Sweat Salvage Yard?\"\\n\"The crevices of Her Ladyship's footprints are packed with enemy warship fragments, flattened fortresses, and mineral-rich planetary debris!\"\\n\"Even if this precious fluid smells pungent, once we dredge the material out and scrub it clean, it yields top-grade alloys and minerals!\"\\nJust then, the giant crane hauled a scrap metal slab dozens of meters long out of the amber viscous fluid with a heavy splash, strings of foot sweat clinging to the metal.\\n\"See that? That's pure, gleaming resource wealth!\"\\n\"Tell the workers down below to speed it up! Once this batch is cleared, the mountain of discarded socks Her Ladyship left behind is still waiting for excavation!\"
  # 闻起来臭，用起来香！
  gts_evt_random.010280.a: "Smells foul, but yields pure treasure!"
  # 乳汁灌溉农场建成
  gts_evt_random.010290.name: "Milk Irrigation Farm Completed"
  # 一望无尽的广袤农田延伸至地平线尽头，高耸的白色储罐如山峰般矗立在农场中央。\n今天本是农场落成的剪彩之日，巨娘总督兴高采烈地亲临现场视察。她看着下方如微尘般的小人农夫与矮小的灌溉管道，心血来潮地认为这种小打小闹的灌溉方式效率太低。\n在小人惊恐的目光中，总督伸手解开了胸前的扣子，将那双宏伟的乳肉释放出来，天空随之被两座遮天蔽日的粉嫩肉山所覆盖，整座农场都被笼罩在阴影之中。\n巨娘总督露出了温柔的微笑。"大家辛苦咯，就让妈妈来亲自给庄稼施肥吧!"\n少女娇羞地哼了一声，纤细的指尖用力捏住了两颗微微硬挺的粉红乳首。\n只听"噗噜噜"一声巨响，两道粗大的白色瀑布从天而降，如同天崩一般的狂暴白浪铺天盖地地冲向农场。\n精密的灌溉管道在绝对的力量面前瞬间粉碎，庞大的白色海啸顷刻间淹没了数千公顷的农田，将刚刚建成的灌溉枢纽与数座建筑瞬间冲毁。\n几名躲闪不及的小人农夫连同刚发芽的作物一同被深深埋葬在了数米深的奶香汪洋之中。\n白色乳汁在沟壑间湍急奔流，发出"哗啦啦"的巨响。\n过了好一会，高空中的总督大人才意犹未尽地擦了擦乳首，吐了吐舌头说道。"啊啦...好像稍微用力过头了呢，你们没事吧？"\n农场主管从白色奶泡中钻了出来，一边擦着脸上的奶渍一边强行压下心中的惊恐，对着麦克风大声回应，"没...没关系，总督大人!"\n"虽然设施受损，但您的乳汁营养极高，今年的作物产量一定会翻倍的!感谢您的慷慨赐予!
  gts_evt_random.010290.desc: "Endless farmlands stretched all the way to the horizon, where towering white storage tanks stood like peaks at the center of the facility.\\nToday marked the farm's ribbon-cutting ceremony, and the Giantess Governor personally arrived in high spirits to inspect the site. Looking down at the tiny farmers like motes of dust and the narrow irrigation channels, she impulsively decided that such piecemeal watering methods were far too inefficient.\\nBefore the stunned tiny crowd, the Governor unfastened her attire, baring her colossal bosom. The sky was immediately eclipsed by two mountain-sized forms, casting the entire agricultural complex into shadow.\\nThe Giantess Governor offered a sweet smile: \"Thanks for your hard work, everyone! Let Mommy fertilize the crops herself!\"\\nWith a soft sigh, she squeezed her sensitive, pink peaks between her slender fingers.\\nWith a resounding torrent, two colossal white cascades plummeted from the heavens, sweeping across the fields like an overwhelming white deluge.\\nThe delicate irrigation pipes shattered instantly against such overwhelming force. The massive white flood submerged thousands of hectares of farmland in seconds, sweeping away the newly completed irrigation hub and several structures.\\nSeveral tiny farmers unable to take cover in time were swept beneath the meters-deep expanse of rich, sweet milk alongside the freshly sprouted seedlings.\\nThe rich milk surged violently through the drainage channels with a deafening roar.\\nAfter a long while, the Governor patted herself dry in the sky above, playfully sticking out her tongue: \"Oh dear... seemed I went a little overboard. Is everyone all right?\"\\nThe farm manager crawled out from the white froth, wiping dairy splatters from his face as he hastily gathered his composure, shouting into the microphone:\\n\"N-no problem at all, Governor!\"\\n\"Though the infrastructure took a hit, your milk is extraordinarily nutritious! This year's harvest will surely double! Thank you for your generous blessing!\"
  # 这算是一种丰收吧……
  gts_evt_random.010290.a: "I suppose this counts as a bountiful harvest..."
  # 小人热能炉启动
  gts_evt_random.010300.name: "Tiny Person Thermal Furnace Activated"
  # 发电厂区内，数以万计的透明微型胶囊被整齐地排列在几十米高的金属架上。\n每一个胶囊内部都封存着一个无法动弹的小人，它们身上贴满了细微的导热贴片，散发出的微弱体温被汇聚成稳定的热能流。\n整座大厅回荡着机械冷却风扇的声响，光线昏暗而压抑。\n一位资深的巨娘管理员正领着刚入职的新人，沿着架子间的高空步道进行例行巡视，手中拿着平板电脑记录着每一个发热单元的运作数据。\n"记住，这些胶囊里的小人虽然不能动，但体温数据一旦降低，就代表他们快不行了。"\n资深管理员用指甲夹起一个光芒暗淡的胶囊，随手扔进了旁边的废弃桶里。\n"嗯嗯...那这些废弃的胶囊怎么处理呢?"\n新人好奇地问。资深管理员嘻嘻一笑，贴近新人的耳朵低声说。\n"按规定是送去销毁，但我们私底下有些小福利。"\n"比如在冬天巡楼的时候，这里冷得要命，我就会挑几个散发着余温的胶囊..."\n说着，资深管理员得意地扭了扭丰满的臀部。\n"把它们当成暖暖包塞进自己的小穴或是胖次里，那个温度软软暖暖的，舒服极了!反正里面的小人又不会动，只会乖乖发热而已。"\n新人听得脸红心跳，小声回应。\n"这真的可以吗?"\n"有什么关系?"\n资深管理员拍了拍新人的肩膀。\n"这可是我们管理热能炉特有的保暖方式呢!
  gts_evt_random.010300.desc: "Inside the power generation hall, tens of thousands of transparent micro-capsules were arranged in tidy tiers on metal scaffolds dozens of meters tall.\\nEach capsule housed an immobilized tiny person, fitted with microscopic thermal conductor patches that channeled their faint body heat into a stable thermal stream.\\nThe entire chamber hummed with cooling fans under dim, somber lighting.\\nA veteran Giantess supervisor guided a newly arrived recruit along the elevated catwalks on a routine inspection, logging output data on her tablet.\\n\"Remember, although the tiny people inside cannot move, once their temperature readings dip, it means they're near their limit.\"\nThe veteran supervisor pinched a dim capsule with her fingertips and dropped it casually into a disposal chute.\\n\"I see... then how are the spent capsules handled?\" the recruit asked.\\nThe veteran supervisor smiled playfully, leaning close to whisper:\\n\"Protocol dictates incineration, but unofficially we get our own little perks.\"\n\"For example, during winter rounds when it's freezing in here, I'll pocket a few capsules still holding residual warmth...\"\nWith a proud sway of her hips, she continued:\\n\"I tuck them into my panties or beside my skin like body warmers. They provide such a soft, gentle warmth—it feels wonderful! Besides, the tiny people inside can't move anyway; they just sit there generating heat.\"\nThe recruit listened with burning cheeks and asked softly:\\n\"Is that really permitted?\"\n\"Why not?\" the supervisor patted her shoulder.\\n\"It's our special perk for running the thermal furnace!\"
  # 真是特别的保暖方式
  gts_evt_random.010300.a: "What a peculiar way to stay warm."
  # 小人筛矿场开业
  gts_evt_random.010310.name: "Tiny Person Mineral Sifting Yard Opens"
  # 灰濛濛的矿渣平原上，一座高脚椅直插云霄。\n巨娘监工翘着修长的大腿坐在椅子上，赤着的柔软足底悬在半空中，五根圆润的脚趾轻轻扭动，投下巨大的阴影。\n底下的矿场里，密密麻麻的小人矿工正像蚂蚁一样在废料堆里辛苦地搬运与筛选。\n"大家都给我加快速度哦!"\n"今天表现最好的队伍，可以获得近距离替本小姐清理趾缝的奖励哦!"\n少女轻摇着赤足，一股带着微微甜汗香气的暖风吹过矿场，吹散了部分灰尘。\n然而，角落里有一个小人因为体力不支倒在地上偷懒。\n巨娘监工眼神一冷，笑容瞬间消失，漫不经心地将庞大的脚掌降了下来。\n只听"啪唧"一声闷响，拖延进度的小人队伍瞬间被碾成了脚底板上的一抹肉泥与红斑。\n监工在脚背上轻轻蹭了蹭脏污，微笑着提醒道。\n"看吧，不听话的小虫子就只能变成脚底的涂料咯。"\n看到这恐怖的一幕，其余的小人矿工们吓得魂飞魄散，手上的动作比平时快了数倍。
  gts_evt_random.010310.desc: "Across the overcast slag flats, a towering observation chair rose straight into the sky.\\nThe Giantess overseer sat with slender legs crossed, her soft bare soles dangling overhead, five rounded toes gently curling to cast enormous shadows.\\nIn the mining pit below, swarms of tiny miners labored like ants, hauling and sifting through heaps of debris.\\n\"Pick up the pace down there!\"\\n\"The best-performing crew today gets to clean between my toes up close as a special reward!\"\\nThe maiden swayed her bare foot, sending a warm draft faintly scented with sweet sweat through the quarry, dispersing clouds of dust.\\nHowever, one tiny person in the corner collapsed from exhaustion and began slacking off.\\nThe Giantess overseer's expression chilled and her smile vanished. She casually brought her enormous sole descending down.\\nWith a soft squelch, the lagging crew was crushed flat into a streak of red paste upon the underside of her foot.\\nThe overseer gently rubbed the residue off against the back of her foot, smiling as she remarked:\\n\"See? Disobedient little bugs only end up as sole decoration.\"\nWitnessing the gruesome sight, the remaining tiny miners were terrified out of their wits, working at several times their ordinary speed."
  # 在巨足的阴影下勤劳工作吧
  gts_evt_random.010310.a: "Work diligently beneath the shadow of giant feet."
  # 小人食品加工中心落成
  gts_evt_random.010320.name: "Tiny Person Food Processing Center Completed"
  # 冰冷的传送带发出"轰隆隆"的运转声，成千上万名经过清洗的小人正被源源不断地送往自动化包装车间。\n哭喊与求饶声在庞大的机器噪音面前显得无比微弱，微小的人体被精确地分级、打包，装入精美的透明便利盒中，印上标签。\n在一间豪华公寓里。\n一位刚刚下班的巨娘少女慵懒地靠在沙发上，身前摆放着刚从超市买来的包装盒。\n她随手撕开密封膜，如同抓起一把香甜的米粒般，抓起数十个活蹦乱跳的小人。\n"啊——姆"\n少女张开粉嫩的嘴唇，将那一搓微小的生命全部塞进了口中。\n舌尖灵巧地卷动着，伴随着"咕噜"一声清响，少女没有经过牙齿的咀嚼，就将那数十个小人顺着狭窄滚烫的食道直接吞入了热气腾腾的胃袋里。\n少女发出一声舒服的叹息。\n"嗯...这批新上市的点心口感真是不错，明天再让快递送几盒过来好了..."\n胃袋里隐约传来小人们无力的撞击，但很快就被胃液所淹没，化为了少女身体的养分。
  gts_evt_random.010320.desc: "Cold conveyor belts clattered rhythmically as tens of thousands of cleaned tiny people were continuously fed into the automated packaging bay.\\nPleas and weeping were drowned out by the thunder of heavy machinery. The miniature bodies were graded, packed into stylish transparent snack containers, and labeled.\\nInside a penthouse suite:\\nA Giantess maiden returning from work reclined lazily on the couch, opening a fresh container from the market.\\nPeeling back the protective film, she pinched up dozens of lively tiny people just like a cluster of sweet berries.\\n\"Ah—munch!\"\\nParting her soft lips, she popped the handful of miniature lives straight into her mouth.\\nWith a nimble swirl of her tongue, she swallowed them down her warm throat in a single gulp without chewing, sending dozens of tiny people straight down into her steaming stomach.\\nThe maiden exhaled a satisfied sigh.\\n\"Mmm... this fresh batch has such a lovely texture. I should order a few more boxes delivered tomorrow...\"\\nFrom within her belly came faint, futile struggles, which were quickly overwhelmed by digestive fluid, turning into nourishing energy for the maiden's body."
  # 美味又营养
  gts_evt_random.010320.a: "Delicious and nutritious."
  # 仍在抵抗的星球
  gts_evt_random.020010.name: "Planet Still Resisting"
  # 我们的英勇陆军已经成功击溃了这个星球上绝大部分小人的军队，现在只剩下零星小人的部队与抵抗组织还在星球的各个角落进行抵抗，我们应该怎么做？
  gts_evt_random.020010.desc: "Our valiant army has successfully defeated the vast majority of the small people's army on this planet, and now only scattered small-person troops and resistance organizations remain in various corners of the planet. What should we do?"
  # 些负隅顽抗的蝼蚁罢了，没什么好关注的
  gts_evt_random.020010.a: "They're just a few stubborn ants, nothing to pay attention to."
  # 陆军部呢？让他们赶快想个办法
  gts_evt_random.020010.b: "Where's the army? Tell them to quickly figure something out."
  # 他们必须要接受神的旨意
  gts_evt_random.020010.c: "They must accept the will of the gods."
  # 我们要想个办法让当地的小人知道我们是来解放他们的
  gts_evt_random.020010.d: "We should find a way to let the local small people know that we have come to liberate them."
  # 不行，违抗帝国的人必须进行彻底的镇压，无论什么方式
  gts_evt_random.020010.e: "No, those who defy the empire must be completely suppressed, no matter the method."
  # 仍在抵抗的星球
  gtsra_random_resist: "Planet Still Resisting"
  # 我们的英勇陆军已经成功击溃了这个星球上绝大部分小人的军队，现在只剩下零星小人的部队与抵抗组织还在星球的各个角落进行抵抗
  gtsra_random_resist_desc: "Our valiant army has successfully defeated the vast majority of the small people's army on this planet, and now only scattered small-person troops and resistance organizations remain in various corners of the planet."
  # 修女们的行动
  gtsra_random_resist_spiritualist: "The Actions of the Nuns"
  # 随着星球各个地区的修女完成了对脚下小人们的洗礼，整个星球的面貌焕然一新，旧时代的宗教已消失，新时代的福音已成应验的事实
  gtsra_random_resist_spiritualist_desc: "As the nuns completed the baptism of the small people under their feet in various regions of the planet, the entire planet was revitalized. The religions of the old era have disappeared, and the gospel of the new era has been fulfilled."
  # 战后重建
  gtsra_random_resist_pacifist: "Post-War Reconstruction"
  # 小人们对巨娘的偏见于恐惧逐渐消失，与巨娘生活愈发平常，更是有小人或是巨娘向对方表白，我们相信这个星球将会迎来更美好的未来
  gtsra_random_resist_pacifist_desc: "The small people's prejudice and fear toward the giantesses is gradually disappearing, and living with giantesses has become more commonplace. Some small people or giantesses have even confessed their love to each other. We believe this planet will usher in a better future."
  # 杀鸡儆猴
  gts_evt_random.020011.name: "Killing the Chicken to Scare the Monkeys"
  # \t若是一个一个找到并且消灭小人们抵抗的据点未免太消耗时间，但陆军部提出了一个想法：可以派遣一位正在这个星系的恒星基地执行维修整备任务的太空舰娘对一片抵抗比较严重的区块进行彻底的镇压，即使这违反了太空舰娘禁止登陆星球规定，但这一措施也许可以大大震慑这个星球上乃至整个敌国
  gts_evt_random.020011.desc: "It might take too much time to find and destroy the resistance strongholds of the small people one by one. However, the army proposed an idea: a space shipgirl who is currently performing maintenance tasks at the starbase in this system can be dispatched to completely suppress a particularly resistant region. Even if this violates the rule that space shipgirls are prohibited from landing on planets, this measure might greatly deter this planet and even the entire enemy country."
  # 很好，我已经迫不及待的想要看见巨娘移平城市了！
  gts_evt_random.020011.a: "Great, I can't wait to see a giantess flatten the city!"
  # 你们这群小人都给我老实待着，看我派巨娘来把你们一个个都送上天！（摔通讯器）
  gts_evt_random.020011.b: "All you small people better behave, or I will send a giantess to send you all to heaven! (Throws the communicator)"
  # 不批准，这太过残忍，会殃及太多的无辜民众，我们要换个办法
  gts_evt_random.020011.c: "Disapproved. This is too cruel and will affect too many innocent civilians. We need to find another way."
  # 很好，但我有一个更好的想法
  gts_evt_random.020011.d: "Great, but I have an even better idea."
  # 大都会的毁灭
  gts_evt_random.020012.name: "The Destruction of the Metropolis"
  # \t很明显，上头的人在选址上起了一点私心，选择了这座星球上最大的都市圈，在全国直播的情况下，已经在星球轨道上待命了一段时间的舰娘以当地居民十万倍的体型降落在了都市圈的外围，随着她高高抬起特意为这次任务换上的黑丝巨足，将脚掌对准了这座城市的最为中心的地区猛地踩下作为节目的开始\n\n\t上万栋建筑瞬间在巨足的脚下消失，而在内的上千万小人也化为了脚下的肉泥，当黑丝巨足再次抬起时，卫星上拍摄的的不再是以往那繁华的市中心，而是一个褐色的，长27公里宽10公里的超大型足印\n\n\t舰娘看着脚下渐渐冒出熔岩的足印，不经的笑了笑，接着开始用着她的双足在城市内踩踏，拖行甚至是写字,又有时蹲下身来细细观察，用双手玩弄双腿之间的市区，又或者干脆直接躺下身来，用着挖起的市区爱抚双乳与私处\n\n\t在这为时一小时的灾难中，这座星球上最大的大都市连带着周围数个卫星城都沦为了这位舰娘用来发泄的玩具，根据舰娘身上装备的探测器显示，在结束前，共计有5亿6523万1792人直接或者间接死于这次行动，这个数字也同时被直播转发，想必抵抗运动一定被大大的镇压，同时我们也向宇宙展示了我们强大的一面
  gts_evt_random.020012.desc: "It's obvious that someone higher up had a little selfishness when choosing the location, selecting the largest metropolitan area on this planet. In a nationwide broadcast, a shipgirl who had been waiting in orbit for some time descended on the outskirts of the city at ten-thousand times the size of the local residents.  As she raised her black silk-clad foot specially swapped for this mission, her huge sole aimed toward the most central part of the city before stomping down fiercely to begin the program.\n\n Tens of thousands of buildings disappeared instantly under her huge foot, and the tens of millions small people inside were also turned into mincemeat under her heel. When the black silk-clad foot was raised again, what was captured on satellite images was no longer the once bustling city center but an ultra-large footprint that was brown, 27 kilometers long, and 10 kilometers wide.\n\nThe shipgirl looked at the footprint, where magma was gradually rising, smiled lightly, and then began using her feet to stomp, drag and even write on the city.  Sometimes she would crouch down to observe carefully and play with the city between her legs with her hands, or she'd just simply lie down and use the dug-up city to caress her breasts and private parts.\n\nDuring this one-hour disaster, the largest metropolis on this planet, along with several surrounding satellite cities, were reduced to toys used by this shipgirl to vent her stress. According to the probes on the shipgirl's body, 565,231,792 people died directly or indirectly in this action before the end. This figure was also broadcasted, and it's likely that the resistance movement has been greatly suppressed, while we have also shown the universe our powerful side."
  # 没有人可以阻挡[Root.GetName]的行军，没有人！
  gts_evt_random.020012.a: "No one can stop [Root.GetName]'s march, no one!"
  # 一群不值得同情的虫豸为我们做出的最后贡献
  gts_evt_random.020012.b: "A group of pathetic insects made their final contribution to us."
  # 虽然对这个星球造成了无可挽回的破坏，但这一切都是值得的
  gts_evt_random.020012.c: "Although irreversible damage has been done to this planet, it is all worth it."
  # §R会造成五个人口死亡§!
  gts_evt_random.020012.tooltip: "§RWill cause 5 population deaths!§!"
  # 修女们的行动
  gts_evt_random.020013.name: "The Actions of the Nuns"
  # \t在大主教的指示下，从母星派出了一支用于传道的队伍，几十名数百米的修女们在这颗星球首府的上空敲响了大钟，钟声随着大气传遍了整个星球，这股钟声似乎有魔力一般，使得星球上的小人放空大脑，接受着来自修女们内心的洗礼，在钟声结束后，修女们各自前往已决定的城市内进行下一步的行动\n\n\t修女们降落在城市的大街上，广场上，又或是公园内，白色的丝袜配合着高跟鞋在阳光照耀下的显得格外神圣，一经落地，就有数不尽的小人从四面八方涌向修女们，他们聚集在修女的高跟鞋旁，宽大的裙摆宛如穹顶般在头顶笼罩，许多小人开始舔舐修女的高跟鞋来以表决心，而修女们也顺着小人们的意愿纷纷脱下高跟鞋，将白丝玉足毫无保留的展现在小人们的面前用于膜拜，又或是将中意的信徒塞入鞋内以示嘉奖\n\n\t随着星球各个地区的修女完成了对脚下小人们的洗礼，整个星球的面貌焕然一新，旧时代的宗教已消失，新时代的福音已成应验的事实
  gts_evt_random.020013.desc: "Under the instruction of the Archbishop, a missionary team was sent from the home planet. Dozens of nuns hundreds of meters tall rang the bells above the capital of this planet, and the sound of the bells spread throughout the entire planet with the atmosphere. The sound of this bell seemed to have some kind of magic, causing the small people on the planet to empty their minds and receive baptism from the hearts of the nuns. After the sound of the bells ended, the nuns each went to the determined cities to carry out the next stage of their actions.\n\nThe nuns landed on the streets, plazas, or parks of the city. The white stockings and high heels seemed especially sacred under the sunlight. As soon as they landed, countless small people swarmed toward the nuns from all directions. They gathered near the nuns’ high heels, the wide skirts looked like domes enclosing them from above.  Many small people began to lick the nuns’ high heels as a sign of determination, and the nuns also followed the wishes of the small people and took off their high heels, showing their jade-like feet covered only by white stockings without any reservation for worship. They were also giving the favored believers to put inside the shoe as a reward.\n\nAs the nuns in various areas of the planet completed the baptism of the small people under their feet, the entire planet was renewed. The religions of the old era have disappeared, and the gospel of the new era has been fulfilled."
  # 尽管最后似乎有什么不对劲，但解决了抵抗的问题就行
  gts_evt_random.020013.a: "Although it seems something is wrong at the end, it's fine as long as it resolves the resistance problem."
  # 战后重建
  gts_evt_random.020014.name: "Post-War Reconstruction"
  # \t巨娘政府向战后星球提供经济援助，并且协助重建随着计划的开始，巨娘体型上的优势再一次的显现出来，巨娘开始帮助小人们重建战斗中被损坏的建筑，救援被困于废墟之下的小人们，管理难民营并且发配物资，这些措施都有效的使得两个种族之间建立起跟密切的联系小人们对巨娘的偏见于恐惧逐渐消失，与巨娘生活愈发平常，更是有小人或是巨娘向对方表白，我们相信这个星球将会迎来更美好的未来
  gts_evt_random.020014.desc: "The giantess government provided economic aid to the post-war planet and assisted with reconstruction. As the plan began, the advantages of the giantesses' size were once again demonstrated. The giantesses began helping the small people rebuild the buildings damaged in the battles, rescuing the small people trapped under the rubble, managing refugee camps, and distributing supplies. These measures have effectively established a closer connection between the two races. The small people's prejudice and fear toward the giantesses are gradually disappearing. Living with giantesses has become more commonplace. Some small people or giantesses have even confessed their love to each other. We believe this planet will usher in a better future."
  # 战争是不幸的，但我们会尝试使之后的生活更加美好
  gts_evt_random.020014.a: "War is unfortunate, but we will try to make life better afterwards."
  # 失控了
  gts_evt_random.020015.name: "Out of Control"
  # \t我们向着完成任务的巨娘发出了命令，表示已完成任务要求她离开这颗星球回到恒星基地待命，但她却在听到命令后摘下了通讯器并用脚将其踩碎，她抬起了头，朝着正在拍摄的卫星露出了一个十分黑暗的笑容后便朝向规定区域外走去\t因为巨娘是轻装上阵，几乎没有佩戴任何装备，我们无法对她的活动做出任何的限制，所以在这颗星球上，已经没有任何东西可以阻拦这位180公里高的巨娘，即使是这颗星球最高的山脉也只有可怜的10公里高，只见巨娘抬起脚就把这座最高的山脉踩入几公里深，巨娘一路往前走，每一步都有城市消失在她的黑丝巨足之下，卫星依然在即时跟拍，他并没有切断探测器卫星之间的联系，只见她往地面踩下一脚，直播间右上角的数字就会增加几十万甚至上百万的数字，而踩入大城市时这个增长还会更大\t巨娘目标明确，似乎在开始行动之前已经看过这颗星球上小人主要于次要的聚集地并规划了路线，没有任何东西能阻挡这双长达27公里的巨足，只见云层被黑丝巨足破开，因下落速度所带来的庞大气压在一瞬间就把城市内的小人压爆，紧接着就是巨足与大地的亲密接触，这情景所消耗的时间也不过1秒，并且还在不断的重复上演\t在巨娘高效的清除了所在大陆之上的城市后，原本干净的黑丝上已经沾满这陆地上的各种污渍， 她走到海边，脱下黑丝，朝着不远处的岛屿扔去后便走进入了大海，但是，只能勉强没过巨娘脚背的大海是无法阻止巨娘的行动的，每向前走一步，就会生成一次比这颗星球有记录以来的最大海啸还要大好几十倍的海啸，虽然海啸速度远不及巨娘的移动速度，但这也将在巨娘不会去的地方造成无法估量的破坏\t大海到对岸大陆的距离有着10000公里宽，但在10万倍体型下的巨娘来说也就只有区区100米的路程罢了，不到一分钟，对岸大陆的城市便也迎来了这双巨足
  gts_evt_random.020015.desc: "We sent orders to the giantess who had completed her mission, informing her to leave this planet and return to the starbase to wait for orders. But after hearing the instructions, she took off her communicator and crushed it with her foot. She looked up, showed a very dark smile to the camera satellite, and then walked away from the designated area.\n\nSince the giantess was lightly equipped and wore almost no equipment, we could not place any restrictions on her activities. Therefore, on this planet, there was nothing that could stop this 180-kilometer tall giantess. Even the highest mountain on this planet was only a pathetic 10 kilometers high. The giantess simply raised her foot and stomped the highest mountain several kilometers deep. The giantess walked forward. Every step she took caused the cities to disappear under her black silk-clad giant foot. The satellite was still following the live feed. She had not interrupted the connections between the probe and the satellite. Every time she stepped onto the ground, the number in the upper right corner of the live feed would increase by hundreds of thousands or even millions, this increase would be even more if she stepped onto a large city.\n\nThe giantess had a clear goal. It seemed like before she started her action, she had already looked over the major and minor hubs of the small people on this planet and planned her route. Nothing could stop these 27-kilometer-long giant feet. The clouds were torn apart by her black silk-clad feet, and the enormous air pressure caused by the falling speed instantly crushed the small people within the city.  Then came the intimate contact with the ground, repeating this scene with a time cost of only 1 second per step.\n\nAfter the giantess efficiently eliminated the cities of the continent she was on, the original clean black silk was already covered with various stains from the land. She walked to the beach, took off her black silk, threw it towards an island not far away and then went into the sea. However, the sea which could barely cover the instep of the giantess was not enough to stop her actions. Every step forward would generate a tsunami that would be tens of times larger than any recorded tsunami on this planet. Although the speed of the tsunami could not match the speed of the giantess’s movement, it would cause immeasurable destruction in places where the giantess would not go.   The distance from the sea to the coast of the opposite continent is 10,000 kilometers wide, but for a giantess at a 100,000 times bigger scale, it was only a mere 100 meters. It only took her less than a minute. The cities of the opposite continent also welcomed these giant feet."
  # 天啊！赶快做些什么阻止她！
  gts_evt_random.020015.a: "Oh my god! Do something to stop her!"
  # 惨剧的结束
  gts_evt_random.020016.name: "The End of the Tragedy"
  # \t我们能够终止这场惨剧的方法只剩下派出其他同体型的太空舰娘前往星球来阻止她，我们派遣了两名也在恒星基地维护的舰娘前往这颗星球，预计时间需要2小时，在这期间，我们只能眼睁睁的看着这名巨娘高效的清除这颗星球上的小人\n\n\t据事后统计，这颗星球原人口54亿8200万人，经历此次事件后依据巨娘所携带探测器显示死亡51亿3958万8582人，这颗原本美丽的星球已变得千疮百孔，遍地都是巨娘的脚印，没有任何十万人口以上的城市存在，破坏也导致星球上的生态系统遭到了十分彻底的毁坏，我们预计未来几十年甚至上百年这颗星球都不会恢复原样了\n\n\t尽管在事态失控之后我们十分快速的封锁了消息，但十分遗憾，现在全宇宙的国家都在强烈谴责我们做出的行为，这将导致在可预见的未来里我们在宇宙中的外交将举步维艰
  gts_evt_random.020016.desc: "The only way that we have to stop this tragedy is to send other space shipgirls of the same size to the planet to stop her. We dispatched two shipgirls who were also undergoing maintenance at the starbase to this planet. The estimated time needed is 2 hours. During this time, we can only watch as this giantess efficiently eliminates the small people on this planet.\n\nAccording to post-event statistics, the original population of this planet was 5,482,000,000 people.  After this event, according to the probes carried by the giantess, 5,139,588,582 people died.  This once beautiful planet has been riddled with holes and covered with giantess footprints, with no cities of 100,000 or more people left. The destruction also caused the planet's ecosystem to suffer a very thorough destruction.  We expect that this planet will not return to its original state for several decades, if not centuries.\n\nAlthough we quickly blocked the news after the situation spiraled out of control, it is very unfortunate that countries all over the universe are now strongly condemning the actions we have taken. This will make our diplomacy in the universe very difficult in the foreseeable future."
  # 往好了想，起码我们日后管理这颗星球所需要耗费的精力也减少了不是吗？
  gts_evt_random.020016.a: "Look on the bright side, at least we will need less energy for managing this planet in the future, right?"
  # §R整颗星球上不剩下几个活人了....§!
  gts_evt_random.020016.tooltip: "§RThere are barely any survivors left on the entire planet....§!"
  # 巨娘的审判
  gts_evt_random.020017.name: "The Trial of the Giantess"
  # 至于那位舰娘，在最高军事法庭上说出了小人就应该老老实实的死在巨娘的脚下，小人不需要怜悯的发言，但因为我们也是违规将太空舰娘投放于星球之上，在多边权衡之下，最高院请求[Root.GetRulerName]的意见
  gts_evt_random.020017.desc: "As for that shipgirl, in the Supreme Military Court she stated that small people should die under the feet of giantesses with no complaints, and that small people do not deserve pity. But since we also violated the rules by deploying a space shipgirl to the planet, the Supreme Court, after multilateral consideration, requested the opinion of [Root.GetRulerName]."
  # 无罪释放，但严格限制她的行动并剥夺她身为太空舰娘的权利
  gts_evt_random.020017.a: "Acquit her, but strictly restrict her activities and deprive her of her rights as a space shipgirl."
  # 缩小后交给[Root.GetRulerName]，用于娱乐
  gts_evt_random.020017.b: "Shrink her and give her to [Root.GetRulerName] for entertainment."
  # [From.GetName]的命运
  gts_evt_random.020020.name: "The Fate of [From.GetName]"
  # 我们的巨娘几乎没有遇到什么抵抗，很轻松地占领了这颗小人星球，不过我们要怎么处理这颗小人的星球呢？
  gts_evt_random.020020.desc: "Our giantesses encountered almost no resistance and easily occupied this small-person planet. But what should we do with this small-person planet?"
  # 占领即可
  gts_evt_random.020020.a: "Occupy it."
  # 彻底毁灭它
  gts_evt_random.020020.b: "Destroy it completely."
  # 让希诺去处理
  gts_evt_random.020020.c: "Let Xino handle it"
  # 让布洛妮娅去处理
  gts_evt_random.020020.d: "Let Bronya handle it"
  # 让希儿去处理
  gts_evt_random.020020.e: "Let Seele handle it"
  # 让【希儿】去处理
  gts_evt_random.020020.f: "Let <Seele> handle it"
  # 让阿洛美勒丝去处理
  gts_evt_random.020020.g: "Let Allomerus handle it"
  # 让小灰去处理
  gts_evt_random.020020.h: "Let Gray handle it"
  # 让咕呀去处理
  gts_evt_random.020020.i: "Let Guya handle it"
  # 让艾普露去处理
  gts_evt_random.020020.j: "Let Apro handle it"
  # 让绘里香去处理
  gts_evt_random.020020.k: "Let Erika handle it"
  # 让苏小白去处理
  gts_evt_random.020020.l: "Let Su Xiaobai handle it"
  # 殖民地毁灭
  gts_evt_random.020021.name: "Colonial Destruction"
  # 在没有我们任何干扰的情况下，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!为我们展示了在十万倍这个体型下如何高效的清理整个星球上的小人\n\n§Y[event_target:gts_attackers_win_planet.GetName]§!最大的都市已经被摧毁，所以剩下来的城市基本上都挨不住这双有着27公里长的巨足一脚的\n\n如果是微型城市就直接正常的走过即可全部踩碎，稍大一点的小城市脚踩下后把左右拖动下，要是遇到中型城市那就必须要用到另一只脚来辅助移平，又或者高高抬起一只脚朝向市中心狠狠踏下也可以达到同样效果，大型城市就比较棘手，要多踩上几脚才可以保证整座城市被夷为平地，也有比较奇怪样子的城市，比如沿着山谷长长一条样子的，那就要踮着脚踩在城市的一端，然后再把脚拖向城市的另一端……\n\n在数小时之后，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!来到了最后一座城市前，这座城市十分幸运，城市周围全是§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!密密麻麻重叠在一起的巨大足印，但不知为何这座城市在之前几小时的屠杀内成功的存活了下来但是§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!并没有打算放过这座幸运的城市，她朝着最后一座城市抬起了已经不知道踩死了多少小人的巨足，没有任何疑迟，这最后的城市也平等的迎来这双巨足的临幸，被压缩进地下几百米内\n\n在踩完最后一座城市后，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!确认整个星球没有任何小人的活动迹象后来到了海边，将双足在海里轻轻拖动，把整个星球的海洋搅成泥浆，在确认洗净后朝着太空重重一跃，但脚下的土地哪里承受得住这种力量，整个大陆瞬间龟裂开来，岩浆喷涌而出，但已经跃出星球来到太空的§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!只是回头看了看已经整体变成褐色的星球笑了笑，原本蓝绿色的美丽星球早已不见踪影，只留下了无数巨大足印
  gts_evt_random.020021.desc: "Without any of our interference, this shipgirl demonstrated how to efficiently eliminate the small people on the entire planet at this scale of one hundred thousand.\n\nSince the largest city on this planet had already been destroyed, the remaining cities could basically not withstand even one step from this giantess with 27-kilometer-long feet.\n\nIf it was a miniature city, she could crush it completely by simply walking normally. For slightly larger small cities, after her foot stomped down, she would drag it left and right. If she encountered medium-sized cities, she would have to use her other foot to assist in flattening them. Alternately she would raise one foot high above the city center and stomp down hard, which could achieve the same effect.  Large cities were more tricky, and she needed to step on them several times to ensure the entire city was flattened. There were also oddly-shaped cities, such as those that stretched in a long line along a valley.  For those she would step on one end of the city on tiptoe and then drag her foot to the other end of the city…\n\nAfter several hours, the shipgirl arrived in front of the last city. This city was fortunate, and was surrounded by huge footprints from this shipgirl that were densely stacked on top of each other, but it had inexplicably managed to survive the massacre from the past few hours.  However, this shipgirl did not intend to let this lucky city go. She lifted her huge foot, which had already stepped on and killed an unknown number of small people, toward the last city. Without hesitation, this final city was equally honored with a visit from this large foot, and was squashed hundreds of meters into the ground.\n\nAfter stomping on the last city, this shipgirl confirmed that there was no sign of small-person activity on the entire planet. She then walked to the sea, lightly dragging her feet through the water and churning the entire planet's ocean into mud.  After confirming that her feet were washed clean, she leaped heavily into space, but the land under her feet could not withstand such force, and the entire continent instantly cracked open, and magma spewed out.  But the shipgirl, who had already jumped out of the planet and into space, just looked back at the planet, which was now entirely brown, and smiled.  The previously beautiful blue-green planet was long gone, leaving only countless giant footprints."
  # 不知道别人怎么想的，反正我是大饱眼福，以后还想看到这种直播！
  gts_evt_random.020021.a: "I don't know what others think, but I had a feast for the eyes, I want to see this kind of broadcast again in the future!"
  # 用足碾碎
  gts_evt_random.020022.name: "Crushed Underfoot"
  # §M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!到达了§Y[event_target:gts_attackers_win_planet.GetName]§!后便开始巨大化，星球上的小人看着整片天空都逐渐被§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的身躯所占据，最终§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!巨大化到2亿倍后停止，看向面前只有5公分大的星球，她脱下鞋把星球夹在丝足之间滚动，高山被碾平，海水被丝袜吸干，此时星球还尚且承受得住§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!双足所带来的压力，可星球表面的生物可就不一样了，没一会就全部被碾死在了§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的足底\n\n§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!看着星球的表面都被自己的双足剥离了一层之后，双足便逐渐用力挤压这颗已经没有任何生机的星球，随着星球表面出现越来越多的裂缝，地壳内的熔岩也从裂缝之中喷涌而出，最终星球承受不住§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的双足所带来的巨大压力，向这双巨足投降了，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的双足合在一起，巨大的冲击力使得星球的南北极居然与星球分裂开来飞向了太空，而没能逃走的部分则被细细碾碎，成为宇宙中许多不起眼的小行星
  gts_evt_random.020022.desc: "[root.GetRulerName], upon arriving at the designated planet, began to grow in size. The small people on the planet watched as the entire sky was gradually occupied by [root.GetRulerName]'s body. Finally, [root.GetRulerName] stopped growing after reaching 200 million times the original size and looked at the 5-centimeter planet in front of her. She took off her shoes and rolled the planet between her silk-stockinged feet, crushing the mountains , and the sea was absorbed by her stockings. At this point, the planet could still barely withstand the pressure from [root.GetRulerName]'s feet, but the life forms on the surface of the planet were not so fortunate. In a short while, all of them were crushed to death under [root.GetRulerName]'s feet.\n\n[root.GetRulerName], seeing that the surface of the planet had been peeled off by her feet, then gradually used more force to squeeze the planet, which now had no life left on it. As more and more cracks appeared on the planet's surface, magma from within the crust erupted from the cracks. Finally, the planet could not withstand the enormous pressure produced by [root.GetRulerName]'s feet and surrendered to them.  [root.GetRulerName]'s feet came together, and the enormous impact force caused the north and south poles of the planet to split and fly into space, while the portion that failed to escape was crushed into fine pieces, becoming many insignificant asteroids in the universe."
  # 只要§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!玩的开心就好
  gts_evt_random.020022.a: "As long as [root.GetRulerName] has fun, that's all that matters."
