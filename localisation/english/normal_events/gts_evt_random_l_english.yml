  # §M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的牙齿慢慢的把城市连同大陆一起粉碎了……七百万人在数秒钟的时间里被抬到高高的空中，在他们因为缺氧而死之前就被揉在口腔上方粉碎成连片的红雾……等吃饱了的时候，数千万人的都市圈已经在口中湮没了，只剩下一些没有嚼碎的陆地残迹在胃袋里载浮载沉，而为了吃到那个美味的都市压在身下的小人的国家已经全都消失了，不过长长的袜子上好像留下了相当细致的痕迹，就像小人文明的画一样\n\n\"这样的艺术品可不多见，可是袜子弄脏了要怎么办呢……\"就在纠结的时候，§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!的胃袋又咕噜噜的叫了!于是她立刻压下身体，因为很懒所以直接在地面上爬行着寻找下一个美味的猎物，被卷入爬行而毁掉的小人聚居地又贡献了上亿的数字，不过灰尘一样又小又美味的食物，抹在身上也没关系的吧?§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!舔了舔手指，在地面上最大的灰斑旁边按了下去……然后沿着边缘揉动，揉动，画成一个柔软的圆，里面密密麻麻的都是食物呢……§M[event_target:gts_bruh_get_destroy_planet_leader.GetName]§!这么想着张开嘴，呼出的热气将数千万甚至上亿小人呼吸的肮脏空气都替换掉了\"不管了，这样小人也很幸福的吧……舔，舔……\"\n\n\"啊，不小心蹭到圈外去了，不好意思啦~真是幸运的孩子们呢，那就勉为其难的再多吃一点吧，啊——\
  gts_evt_random.020027.desc: "[Root.GetRulerTitle][root.GetRulerName]'s teeth slowly crushed the city along with the continent... Seven million people were lifted high into the air in a matter of seconds, and before they died of lack of oxygen, they were crushed into a continuous red mist by the upper palate of her mouth... When she was finally full, the urban area of tens of millions of people had already been annihilated in her mouth, leaving only some unchewed remnants of land floating in her stomach. And to eat the delicious city, the small people's countries that were under her body had completely disappeared. But there seems to be a very detailed print on her long stockings, like a painting made by the small person civilization.\n\n\"Such a work of art is rare, but what should I do if my stockings get dirty...?\" Just when she was troubled, [root.GetRulerName]'s stomach growled again! So she immediately pressed down her body. Because she was so lazy, she simply crawled around on the ground, looking for her next delicious prey. The small people's gathering place that was destroyed by the crawling contributed hundreds of millions again, but food that is as small and delicious as dust is fine to smear on my body, right? [root.GetRulerName] licks her fingers, and presses them down next to the largest gray patches on the ground... Then she rubs and kneads along the edges, drawing a soft circle, and it's all packed with food... [root.GetRulerName] thinks of this and opens her mouth. The hot air she blows out replaces the dirty air that tens of millions or even hundreds of millions of small people are breathing: \"No matter, the small people are also happy, right...? Lick, lick...\"\n\n\"Ah, I accidentally brushed off the edge. Sorry~ You are really lucky children, so let's reluctantly eat a little more, aaaaah--!\"
  # 用餐愉快
  gts_evt_random.020027.a: "Enjoy your meal"
  # 领袖们的小爱好
  gts_evt_random.030010.name: "The Leaders' Little Hobbies"
  # 据了解，[gtsra_random_event_leader.GetName]在私底下交易小人，不过这种事情对于巨大娘来说，很正常，不是吗？
  gts_evt_random.030010.desc: "It has been learned that [gtsra_random_event_leader.GetName] is privately trading small people, but such things are normal for giantesses, aren't they?"
  # 坚决制止这种情况，没收[gtsra_random_event_leader.GetName]走私的小人
  gts_evt_random.030010.a: "Absolutely stop this situation and confiscate the small people smuggled by [gtsra_random_event_leader.GetName]"
  # [gtsra_random_event_leader.GetName]这么喜欢缩小人，那就把她也变成缩小人好了
  gts_evt_random.030010.b: "[gtsra_random_event_leader.GetName] likes shrinking people so much, let's turn her into a shrunken person as well"
  # §R[gtsra_random_event_leader.GetName]会被缩小！§!
  gts_evt_random.030010.b.tooltip: "§R[gtsra_random_event_leader.GetName] will be shrunk!§!"
  # [gtsra_random_event_leader.GetName]搞一些小人来玩很正常的啦，不要大惊小怪
  gts_evt_random.030010.c: "It's normal for [gtsra_random_event_leader.GetName] to play with some small people, don't make a fuss"
  # 边境星球的税收问题
  gts_evt_random.030020.name: "Border Planet Tax Issues"
  # 据可靠消息表示，有一位边境星球总督将上缴的税款中的一部分，偷偷挪动到了境外的银行之中，并透过洗为能量币的方法存入了自己的私人金库，但一直碍于其为一名巨娘，情报部和安全局一直没有动手但现在，她的触手居然敢往我们骄傲的军队身上引，安全局方面已经派遣了数名刺客在其身边，等待你的命令，我们应当如何处置她
  gts_evt_random.030020.desc: "According to reliable sources, a border planet governor has secretly moved a portion of the taxes she collected into overseas banks and deposited it into her private vault by laundering it into energy credits. However, due to her being a giantess, the intelligence and security agencies have not taken action. Now, her tentacles dare to reach into our proud military. The security agency has dispatched several assassins to her side, awaiting your orders. How should we deal with her?"
  # 在找到失去的能量币前，她还不能死
  gts_evt_random.030020.a: "She cannot die until the lost energy credits are found."
  # 我们的情报官员会从她脑子里找到东西的，将她完整的带回来！
  gts_evt_random.030020.b: "Our intelligence officers will extract what they need from her mind. Bring her back in one piece!"
  # 找到金库的位置，然后再和她好好的聊聊
  gts_evt_random.030020.c: "Find the location of the vault, and then have a good chat with her."
  # 边境星球的税收问题
  gts_evt_random.030021.name: "Border Planet Tax Issues"
  # 我们的刺客跟随她来到了她的府邸附近，并潜伏了数月，终于找到了金库的位置同时，在他进入金库的时候将其逮捕了，其中不仅有数千能量币，同时还有一些关于边境星球的其它不可告人的秘密档案，我们应当怎么办
  gts_evt_random.030021.desc: "Our assassins followed her to her residence and lay in wait for months. They finally found the location of the vault. She was arrested when she entered it. Not only were thousands of energy credits found there, but also some other clandestine secret files regarding the border planet. What should we do?"
  # 将其带回来，让法院审判她
  gts_evt_random.030021.a: "Bring her back and let the court judge her."
  # 你们自己处理吧，反正她也没什么用了
  gts_evt_random.030021.b: "You can handle it yourselves. She's useless to us anyway."
  # 边境星球的税收问题
  gts_evt_random.030022.name: "Border Planet Tax Issues"
  # 我们透过各种手段，终于从她的嘴巴里弄出来了情报，关于她的私人金库和海外银行账号等并且我们还发现了更多隐秘的部分，其中包括巨娘和小人的人口走私，限制性物品贩卖等等重罪，同时，在她住宅里的电脑中发现了数十份名单，其上全是犯罪同伙和受害人的详细资讯我们应当如何处置她，以及她的同党？
  gts_evt_random.030022.desc: "Through various means, we finally extracted information from her, such as information regarding her private vault and overseas bank accounts. We also uncovered more hidden aspects, including serious crimes such as giantess and small person trafficking and the sale of restricted items. In addition, dozens of lists were discovered on the computer in her residence, containing detailed information about her accomplices and victims. How should we deal with her and her accomplices?"
  # 立刻逮捕她的同伙，解救那些还活着的受害者，同时将她的所有资产收归国有而她自己，将接受审判！
  gts_evt_random.030022.a: "Immediately arrest her accomplices, rescue the surviving victims, and confiscate all of her assets. As for her, she will be judged!"
  # 处死所有与她相关的人员，我们不能再出现这种事情了
  gts_evt_random.030022.b: "Execute all personnel associated with her. We cannot allow this type of thing to happen again."
  # 边境星球的税收问题
  gts_evt_random.030023.name: "Border Planet Tax Issues"
  # 我们通过情报局安插的线人，得知了其金库的位置，并注意到其秘密的档案库里有许多不干净的东西，安全局的部队已经将星球总督家包围了起来，等待您的命令在
  gts_evt_random.030023.desc: "Through an informant placed by our intelligence agency, we learned the location of her vault and noticed many dirty things in her secret archive. Security forces have surrounded the home of the planet governor, awaiting your orders."
  # 立刻逮捕她
  gts_evt_random.030023.a: "Arrest her immediately!"
  # 边境星球的税收问题
  gts_evt_random.030024.name: "Border Planet Tax Issues"
  # 我们已经逮捕了她，现在她正在被安全局的审讯员审讯在，从目前来说，我们得知其犯罪关系网络极为复杂，金库里只是她的一点点财产，而更多的财产在境外银行同时，我们在档案库里找到了关于其犯罪记录和地点的纪录，安全局的特工们已经前去解决了\n\n（一小时后）\n\n大人，我们将她知道的一切都问了出来，并透过技术手段成功将境外账户 上的资产全部归到国家储蓄里，同时，情报部门的人已经将其档案梳理完全，抓捕行动已经开始，现在，我们该如何处理这名通敌的总督？
  gts_evt_random.030024.desc: "We have arrested her. She's now being interrogated by security interrogators. From what we know so far, her criminal network is extremely complex. The vault is only a small part of her wealth, with more assets located in overseas banks. At the same time, we found records of her crimes and locations in the archive. Security agents have already gone to deal with it.\n\n(One hour later)\n\nMy lord, we have found out everything she knows, and through technical means, we have successfully transferred all assets in her overseas accounts to the national treasury. At the same time, the intelligence department has completely analyzed her files. The arrest operation has already begun. Now, how should we deal with this traitorous governor?"
  # 我最近缺少一个能承受住我压力的奴隶
  gts_evt_random.030024.a: "I've been needing a slave who can withstand my pressure"
  # 你们自己解决吧，安静的解决，至于如何怎样，就看你们这群变态的了
  gts_evt_random.030024.b: "Handle it yourselves. Resolve it quietly. As for how... well, that's up to you perverts."
  # 意外发现
  gts_evt_random.030030.name: "Unexpected Discovery"
  # 我们在给我们的科学家[gtsra_random_event_leader.GetName]做定期检查时，意外在她的血液内发现了极其微小的文明\n\n那些从[gtsra_random_event_leader.GetName]血液中提取的微小机械并非是任何我们现役医用机械型号之一，甚至其中存在一些我们从未发现过的技术和设计思路于是我们对[gtsra_random_event_leader.GetName]进行了全身检查，最后我们发现了....在她的一些器官里存在着极其微小的智慧生命以及聚落城市，奇怪的是，他们没有受到[gtsra_random_event_leader.GetName]免疫系统的攻击，甚至看似对[gtsra_random_event_leader.GetName]的健康没有任何影响
  gts_evt_random.030030.desc: "During a routine checkup of our scientist, [gtsra_random_event_leader.GetName], we accidentally discovered extremely tiny civilizations within her blood.\n\nThe tiny mechanical objects extracted from [gtsra_random_event_leader.GetName]'s blood are not of any of our current medical machinery models. There are even some techniques and design ideas that we have never discovered. So, we performed a full-body scan of [gtsra_random_event_leader.GetName] and ultimately discovered... within her organs, there are extremely small intelligent lives and settled cities. What's strange is that they are not attacked by [gtsra_random_event_leader.GetName]'s immune system and they don't seem to have any impact on [gtsra_random_event_leader.GetName]'s health."
  # 有趣，继续调查
  gts_evt_random.030030.a: "Interesting, continue the investigation."
  # 立刻扑杀他们
  gts_evt_random.030030.b: "Destroy them immediately!"
  # 既然没有影响，就由他们去吧
  gts_evt_random.030030.c: "Since there is no impact, let them be."
  # [gtsra_random_event_leader.GetName]体内的失落帝国
  gts_evt_random.030031.name: "The Lost Empire Within [gtsra_random_event_leader.GetName]"
  # 这些智慧生命聚落已经发展出了高度社会性，甚至拥有不低的科技与文化水平与此同时，他们不被免疫系统攻击的原因也被查明——他们使用了[gtsra_random_event_leader.GetName]的DNA构成城市的外保护罩，从而伪装成细胞，并透过本应供给给细胞的资源保持存活与发展我们还发现一项有趣的纪录，似乎这些渺小的寄生者曾经对[gtsra_random_event_leader.GetName]的器官发起攻击，那些微弱武器的狂轰滥炸甚至没能引起细胞膜的反应而当时有一个正常漫游中的白血球经过他们的聚落[gtsra_random_event_leader.GetName]体内最基础免疫单元只是路过就几乎毁灭了他们的整个文明，从此极端的宗教崇拜产生，他们已经将我们的[gtsra_random_event_leader.GetName]认定为神
  gts_evt_random.030031.desc: "These intelligent life settlements have developed a high degree of sociality, even possessing considerable technological and cultural levels. Meanwhile, the reason why they are not attacked by the immune system has been found - they use [gtsra_random_event_leader.GetName]'s DNA to form the external protective shields of their cities, thus disguising themselves as cells. They then maintain their survival and development through resources that are supposed to be supplied to the cells. We have also discovered an interesting record. It seems that these tiny parasites once launched attacks on [gtsra_random_event_leader.GetName]'s organs. The bombardment of their weak weapons didn't even cause a reaction from the cell membrane and a normal white blood cell that was traveling through their settlement, [gtsra_random_event_leader.GetName]'s most basic immune unit, nearly destroyed their entire civilization by just passing through. Since then, an extreme religious worship has been developed, and they have identified our  [gtsra_random_event_leader.GetName] as their god."
  # 有趣的文明，试着提取他们
  gts_evt_random.030031.a: "Interesting civilization, try to extract them."
  # 诱导他们，让他们参与到[gtsra_random_event_leader.GetName]的身体循环中来
  gts_evt_random.030031.b: "Induce them, let them participate in [gtsra_random_event_leader.GetName]'s bodily circulation."
  # 可悲的文明，给[gtsra_random_event_leader.GetName]吃点抗生素，给他们个痛快吧
  gts_evt_random.030031.c: "A pathetic civilization, give [gtsra_random_event_leader.GetName] some antibiotics and put them out of their misery."
  # 结局
  gts_evt_random.030032.name: "The End"
  # 正当我们打算使用药物扑杀他们的文明时，[gtsra_random_event_leader.GetName]略微有些发烧，而活跃起来的免疫细胞几乎顷刻间就把那渺小的文明毁灭殆尽这也让我们陷入思考，有多少这样渺小生命还未来得及发展生根，就被我们无意识的生理活动彻底毁灭
  gts_evt_random.030032.desc: "Just as we were about to use drugs to wipe out their civilization, [gtsra_random_event_leader.GetName] developed a slight fever. The activated immune cells almost instantly annihilated that tiny civilization. This made us reflect on how many such small lives did not have time to develop and take root before being completely destroyed by our unconscious physiological activities."
  # 宇宙就是如此，残酷而美妙
  gts_evt_random.030032.a: "Such is the universe, cruel and wonderful."
  # [gtsra_random_event_leader.GetName]的吞食
  gts_evt_random.030040.name: "[gtsra_random_event_leader.GetName]'s Devouring"
  # [gtsra_random_event_leader.GetName]平时对于小人来说还略显空旷的胃袋，此刻甚至可以算得上拥挤——被成把成把吞下的小人几乎塞满了胃部的底端，人与人间的落脚之地也被限制的十分狭小，绝望的气息在人群中蔓延——每个人，至少每个落到这里还身体完好的人都清楚，此处就将是他们的刑场\n\n略略活动着的胃壁只让人们更为局促；感受到食物的填塞，它已经开始了自己的工作，晶莹的胃液让人群不由得远离了原先还尚可让人倚靠休息一下的肉壁\n\n人们就这样依靠有些人还能打开的手电筒光线目视着消化液在四周的肉壁中不断流出，在胃底渐渐积攒；诡异的安静仍在保持着，四周唯有身体自然活动的声音响彻，靠着底端的人开始不由得向后退却，而最高处的人又努力让自己不至于向后顶到正在分泌着消化液的肉壁然而，周围的环境显然在逐渐活跃起来——有些人趁着这个机会，正窃窃私语着自己想要留下的遗言
  gts_evt_random.030040.desc: "[gtsra_random_event_leader.GetName]'s stomach, which usually seems a bit spacious for small people, can now even be considered crowded. Small people swallowed in handfuls almost filled the bottom of the stomach. The space for people to stand was also very limited. A feeling of despair spread among the crowd. Everyone, at least everyone who had fallen here with their body intact, knew that this place was to be their execution ground.\n\nThe slightly moving stomach walls only made people more restricted; feeling the filling of food, it had already begun its work. The glistening gastric juices made the crowd involuntarily move away from the flesh wall, where they could previously lean against and rest for a moment.\n\nPeople looked on with the light of the flashlights that some could still turn on, watching the digestive fluids constantly flowing out of the surrounding flesh walls, gradually accumulating at the bottom of the stomach. The eerie silence remained, and only the sounds of the body's natural activity echoed. Those at the bottom began to retreat involuntarily, while those at the top tried to avoid being pushed backwards into the flesh wall secreting digestive fluids. However, the surrounding environment was clearly becoming more active; some people took advantage of this opportunity to whisper their last words."
  # [gtsra_random_event_leader.GetName]的吞食
  gts_evt_random.030041.name: "[gtsra_random_event_leader.GetName]'s Devouring"
  # 显然，人群的拥挤是有限度的；很快，外侧的人们面对不断向自己逼近的消化液池，发现自己已经不再能向后退却有些人依然在努力，而有些人则闭上眼睛数着自己生命的最后几十秒钟\n\n第一个人失足掉下——他拽下了第二个；消化液灼烧的彻骨疼痛令他们本能的发出尖叫——这叫声终于点燃了人群里积攒着的绝望气氛；已经压缩得不能再压缩的人群终于崩溃了\n\n有的人纵身一跃跳入面前的死亡，而更多的人则在瞬间爆发的恐惧中想要尽量多支撑一秒钟；先前寂静的胃袋中，终于变得热闹起来了似乎是感知到了内部的活动，周围的颠簸也变得越发剧烈了起来——[gtsra_random_event_leader.GetName]的消化系统也全力工作起来了
  gts_evt_random.030041.desc: "Obviously, there was a limit to the crowding of the people. Soon, those on the outside, facing the pool of digestive fluid that was constantly approaching them, found that they could no longer retreat. Some were still trying, while others closed their eyes, counting down the last few seconds of their lives.\n\nThe first person lost their footing and fell-he pulled down the second; the searing pain of the digestive fluid made them scream instinctively-this scream finally ignited the despairing atmosphere that had been accumulating among the crowd. The crowd, which had already been compressed as much as possible, finally collapsed. \n\nSome people jumped into the approaching death, while more people, in their moment of fear, tried to hold on for one more second. The stomach, which was previously silent, finally became lively. It seemed to sense the activity within, and the surrounding jolting became more intense-[gtsra_random_event_leader.GetName]'s digestive system was working at full power."
  # [gtsra_random_event_leader.GetName]的吞食
  gts_evt_random.030042.name: "[gtsra_random_event_leader.GetName]'s Devouring"
  # \"不要！不要过来啊，我，我还……\"——折断了双腿的青年绝望的转过身，双手拼命的抓住肉壁向高处爬行；不过，他并没有得到从高处坚持不住摔下的机会——涌上的消化液将他卷入了死亡之池\n\"我的，我的神明——求求你，把我放出去吧，我什么都会做的……\"\n——尚在至高点的人抬起头下跪，全力发出自己求生的尖叫——然而，这样的声音最终也只是泯然于无数惨叫声之中了\n\"呃啊，哪怕是别人比我多活一秒……\"\n——低声说出这句话，即将被淹没的男子一把拽过周围的两人，将他们与自己一同带入了死亡\n\"滚开，该死的……快，你趁这个时机……\"\n——无视肌肤灼烧的痛苦尝试阻隔开涌来的胃液，让自己的爱人多活着承受几秒钟这无际的恐惧；这样的英雄行为，在这一片混乱的地狱里也同样在发生着\n——这样的声音，被更多人的呐喊与周围\"咚咚\"指挥着处刑的心跳声所覆盖着\n\n就在这样的混乱中，消化液从池塘聚积成小湖，而后逐渐没过哪怕最高处之人的脚踝；四周的嘈杂有所减退，但依然生存者的恐惧却仍然不断攀升着，仅剩的几个人不由互相看了看——而后，随着脚下地面的下沉，消化液没过了他们的头顶\n\n终于，一切归于沉寂\"咕噜咕噜\"的声音笼罩四周，那是消化系统正将曾经满溢着生命——与死前的恐惧的残躯转为[gtsra_random_event_leader.GetName]充足的营养
  gts_evt_random.030042.desc: "\"No! Don't come over, I, I'm still...\"-the young man with broken legs turned around in despair, desperately grabbing the flesh wall with both hands to climb higher. However, he didn't have the chance to fall from exhaustion-the surging digestive fluid engulfed him into the pool of death.\n\"My, my god-please, let me out, I'll do anything...\"\n-The man at the highest point raised his head and knelt, shouting his desire to survive with all his strength; however, such a sound eventually disappeared in the countless screams.\n\"Ugh, even if it's just for someone else to live one more second than me...\"\n- Speaking these words softly, the man who was about to be submerged grabbed the two people around him and dragged them into the death with him.\n\"Get out of the way, you damn...Quick, use this chance...\"\n- ignoring the burning pain on his skin, he tried to block the surging gastric juice, to let his lover live a few more seconds of this boundless fear. Such heroic acts were also occurring equally within this chaotic hell.\n- Such sounds were covered by the shouts of more people and the \"thumping\" heartbeat which dictated her work of execution. \n\nIn the middle of this chaos, the digestive fluid gathered from a pond into a small lake, and then gradually submerged even the ankles of those at the highest point. The surrounding noise decreased, but the lingering fear of those who were still alive continued to climb. The remaining few couldn't help but look at each other-and then, as the ground beneath their feet sank, the digestive fluid went over their heads.\n\nFinally, everything subsided. The \"gurgling\" sound filled the air, and that was the digestive system turning the remains of what was once full of life- and the terror of dying-into sufficient nutrition for [gtsra_random_event_leader.GetName]."
  # 计划外的演习
  gts_evt_random.030050.name: "Unplanned Exercise"
  # 我们的巡逻舰队收到发送自[event_target:gtsra_random_event_planet.GetName]的求救信号，声称遭到了巨大生物的攻击而当舰队赶到[event_target:gtsra_random_event_planet.GetName]时，发现那所谓的巨大生物竟然是§H[event_target:gtsra_random_event_leader.GetName]§!\n\n她在不知道什么时候，以对巨娘来说都十分夸张而巨大的体型抵达了[event_target:gtsra_random_event_planet.GetName]，并开始以这一姿态展开大肆破坏与蹂躏在巡逻舰队抵达前，她已经将12座大小城市夷为平地，数千万居民如同垃圾残渣那样被连同城市一起抹去，唯一能证明她们存在的东西只有留在她足底与废墟间的点点红斑\n\n好像这还不够一样，当我们发现§H[event_target:gtsra_random_event_leader.GetName]§!时，她正躺卧在一座半毁的城市旁，一边揉着微微鼓起的腹部，一边满足地打着饱嗝……而对于这一惨绝人寰的事件，§H[event_target:gtsra_random_event_leader.GetName]§!的解释竟然是她在协助[event_target:gtsra_random_event_planet.GetName]上的居民进行一场针对“巨大未知生命体入侵”的演习活动，丝毫不提在她脚下与口中消逝的数千万无辜的小小魂灵 我们该怎么处理她?
  gts_evt_random.030050.desc: "Our patrol fleet received a distress signal from [event_target:gtsra_random_event_planet.GetName], claiming they were being attacked by a giant creature. When the fleet arrived at [event_target:gtsra_random_event_planet.GetName], they discovered that the so-called giant creature was actually §H[event_target:gtsra_random_event_leader.GetName]§!\n\nAt some unknown time, she arrived at [event_target:gtsra_random_event_planet.GetName] in a size that was ridiculously large even for a giantess, and began to wreak havoc and abuse with this form. By the time the patrol fleet arrived, she had already leveled 12 cities of various sizes. Millions of residents were wiped out along with the cities like trash residue. The only thing that could prove their existence were the red spots left on the soles of her feet and the ruins.\n\nAs if that wasn't enough, when we found §H[event_target:gtsra_random_event_leader.GetName]§!, she was lying by a half-destroyed city, rubbing her slightly bulging belly while belching contentedly... And regarding this horrific event, §H[event_target:gtsra_random_event_leader.GetName]§!'s explanation was that she was assisting the residents of [event_target:gtsra_random_event_planet.GetName] to conduct an exercise against a \"giant unknown life form attack\", not mentioning the tens of millions of innocent small souls that vanished beneath her feet and within her mouth. How should we deal with her?"
  # 她必须为自己的行为负责，给她狠狠安排重建工作
  gts_evt_random.030050.a: "She must be held responsible for her actions. Give her heavy reconstruction work as punishment."
  # 太残忍了，将她的做法向全国推广
  gts_evt_random.030050.b: "Too cruel! Promote her practices to the entire nation."
  # 让她也体验一下参加“演习”的滋味如何?
  gts_evt_random.030050.c: "Let her experience what it's like to participate in an 'exercise'!"
  # 计划外的演习
  gtsra_out_of_plan_manoeuvre: "Unplanned Exercise"
  # 我们的领袖现在越来越喜欢在演习中扮演巨大的怪兽，并时常对星球造成预料外的破坏
  gtsra_out_of_plan_manoeuvre_desc: "Our leader is now increasingly fond of playing the role of a giant monster in exercises and often causes unexpected damage to planets."
  # 生病！ 
  gts_evt_random.030060.name: "Sick!"
  # 我们的领袖§H[event_target:gtsra_random_event_leader.GetName]§!居然生病了！作为在群众心中无敌的巨娘如今窝在恒星边上瑟瑟发抖，即使是四周的小行星撞到她的脚趾缝里也不为所动，看着她冷得瑟瑟发抖却又满头是汗的样子，我们的群众提议让她把我们的殖民地当药服用\n\n§H[event_target:gtsra_random_event_leader.GetName]§!表示很感激，但是依旧摆摆手，用沙哑的嗓音拒绝了我们的好意
  gts_evt_random.030060.desc: "Our leader §H[event_target:gtsra_random_event_leader.GetName]§! is sick! The giantess, who is invincible in the eyes of the public, is now huddled up by the star and shivering. She does not even move when small asteroids bump into the cracks between her toes. Seeing her shivering from the cold and yet covered in sweat, our people proposed that she use our colonies as medicine.\n\n§H[event_target:gtsra_random_event_leader.GetName]§! expressed her gratitude, but still waved her hand, refusing our kindness with a hoarse voice."
  # 让她吃！
  gts_evt_random.030060.a: "Make her eat it!"
  # 加大剂量，把恒星也喂给她
  gts_evt_random.030060.b: "Increase the dosage, feed her the star too!"
  # 让我们的陆军去她的身上清除病毒吧！
  gts_evt_random.030060.c: "Let our army go to her body to clear the virus!"
  # 大富翁游戏
  gts_evt_random.030070.name: "Monopoly Game"
  # 即使是星际时代，一些古老的游戏依然有着不低的人气，比如大富翁自然，不同于太空时代早期的土著，现在的大富翁地图都是以星球、星系、星域、总督辖区甚至于河系为基准帝国境内大小官员当中有不少人员喜爱这种游戏，尤其是当她们当中有人率先提出了可以用身体在棋盘上同时触摸已经购得的所有地产且不能触摸其他地产以避免一次破产不过，对于身为超级巨娘的总督们而言，这样的游戏未免太过于简单——她们更想在现实中竞争\n\n§H“好了～脚再伸出来一些～马上就能摸到了～”§! \n\n§H[event_target:gtsra_random_event_leader.GetName]§!此刻正陷入这样的僵局：她的现金已经不支持她支付过路费，可濒临破产的她还不想就这么出局，于是试图用这一规则坚持下去，然而她的地产过于分散，尽管此刻她的双腿已经快要像劈叉一样分在地球两极，然而不能和其他地方接触的她必须强撑着将双腿撑得绷起来，尤其是现在还要下腰触碰远方的另一处地产…… \n\n§H“就快要……摸到了……啊！”§! \n\n伴随着“嗤啦”一声，不堪重负的服装突然崩裂开来，残留的织物顺着她的双腿向下滑去，洁白的胖次霎时间暴露在星球上的无数小人眼中\n\n§H“啊啊啊啊啊——被看光了——”§! \n一刻也没有为自己的失态而脸红，猛然向下一压，她的手终于摸到了最后一块地产\n§H“终于做到了——”§! \n§S“不行哦～你的裤子碰到了我的地产哦～所以失败了呢～”§! \n§H“呜啊～不要啊——”§! 
  gts_evt_random.030070.desc: "Even in the interstellar age, some ancient games are still popular, like Monopoly. Of course, unlike the natives of the early space age, modern Monopoly maps are based on planets, systems, sectors, governorates, and even the galaxy. Many officials within the empire like this kind of game, especially when someone among them first proposed to use their body to touch all the properties they had purchased on the game board at the same time without touching other properties, to avoid bankruptcy. However, for governors who are super giantesses, such a game is too simple-they prefer to compete in reality.\n\n§H\"Okay~ Stretch your feet out more~ almost there~\"§!\n\n§H[event_target:gtsra_random_event_leader.GetName]§! is currently in such a deadlock: her cash can no longer support her paying tolls but since she is close to bankruptcy, she does not want to leave the game just like this, so she tried to continue with this rule however her properties are too scattered, even though her legs have been nearly splitting into different directions at Earth's poles, she must still hold her legs taut in order not to touch other areas. Especially now that she has to bend down her back to touch another property in the distance...\n\n§H\"Almost... touched it... ah!\"§!\n\nWith a \"ripping\" sound, her overburdened clothing suddenly tore apart, the remaining fabrics slipped down her legs, and her pure white panties were instantly exposed to the eyes of countless small people on the planet.\n\n§H\"Ah ah ah ah ah--I'm seen naked--\"§!\nWithout blushing for her gaffe, she suddenly leaned down and her hand finally touched the last property.\n§H\"Finally done it--\"§!\n§S\"That won't do~ Your pants touched my property~ So it's a failure~\"§!\n§H\"Uwa~ No--\"§!"
  # 再来一局！
  gts_evt_random.030070.a: "One more round!"
  # §H[event_target:gtsra_random_event_leader.GetName]§!的性欲下降
  gts_evt_random.030080.name: "§H[event_target:gtsra_random_event_leader.GetName]§!'s Decreased Libido"
  # §H[event_target:gtsra_random_event_leader.GetName]§!因为最近的涩涩减少而感到失去动力，最近的产出有所下降了\n\n相应的，她开始大量使用缩小资源来满足自己饥渴的身体
  gts_evt_random.030080.desc: "§H[event_target:gtsra_random_event_leader.GetName]§! is feeling unmotivated due to a recent decrease in lewdness, and recent production has declined. \n\nCorrespondingly, she has begun to use a large amount of shrinking resources to satisfy her thirsty body."
  # 哦，不
  gts_evt_random.030080.a: "Oh, no"
  # §H[event_target:gtsra_random_event_leader.GetName]§!的鞋内城市
  gts_evt_random.030090.name: "§H[event_target:gtsra_random_event_leader.GetName]§!'s Shoe City"
  # 作为小人世界最勇猛的一群人，开拓者们以不畏艰险，适应力强的特性为小人文明开疆拓土做出了极大的贡献\n\n而故事要从§H[event_target:gtsra_random_event_leader.GetName]§!鞋子内的小人开拓队说起 第一批踏上这片土地的小人们发现这里漆黑昏暗，潮湿闷热，唯一的光源是鞋口射进的光线；剧烈的气味弥漫在空气中，必须佩戴着空气过滤器才能正常生活，但与恶劣的环境对应的是丰富的矿物储量与含水量——虽然后者需要经过多层过滤才能正常使用\n\n 在最初，陆续有小人因为水土不服死去了，它们的尸体被足臭气息腐蚀，变成森森白骨埋葬在鞋垫大陆上，随着时间的推移成为鞋垫污垢的一部分，但更多的小人们还是成功的在§H[event_target:gtsra_random_event_leader.GetName]§!的鞋垫上定居了\n\n 最初，小人们的聚落分散在鞋垫上的各个地方，足弓处的定居点因为气味极其浓郁而人烟罕至，鞋子内部的五个深色盆地处含有丰富矿物（足垢）与水源很适合小人们居住，渐渐的，小人们在脚趾印处发展了最为繁华的五大城市（根据脚趾凹印大小决定繁荣度），如果没有任何变故，小人们的平凡生活会这样继续下去，直到那一天的到来… 那一天，整个鞋垫内的小人都听到了地面传来的巨大震动声，动物开始盲目逃窜，建筑开始倒塌，人们逃出建筑在空地上躲避灾难，纷纷看向鞋口方向想要知道发生了什么事\n\n突然，有什么东西遮蔽了鞋口的阳光——那是§H[event_target:gtsra_random_event_leader.GetName]§!的巨足\n\n五根并拢的脚趾缓缓伸入鞋内，接触并夷平了位于足跟处的鞋垫城市，随后慢慢向前推进，一视同仁的将所经之处上的城市推平、压碎、变成鞋垫上的污垢，最后当§H[event_target:gtsra_random_event_leader.GetName]§!的整只玉足都穿进了鞋中时，她的脚趾已经悬在了位于脚趾盆地的城市上空，直到那时小人们才知道为什么这里的资源最为丰厚，可惜太迟了…\n\n「唔…今天的鞋垫有点硌脚啊，是不是进沙子了？」\n\n§H[event_target:gtsra_random_event_leader.GetName]§!搓了搓脚趾又重重的跺了跺脚，直到没有任何异常后，就穿着鞋子出门了\n\n而鞋垫上的小人们已经在这场浩劫中几近灭绝，侥幸在足弓处存活的小人们将§H[event_target:gtsra_random_event_leader.GetName]§!的巨足奉为神明，世世代代致力于足弓处的消臭工作
  gts_evt_random.030090.desc: "As the most courageous group of people in the small person world, the pioneers have made great contributions to the expansion of the small person civilization with their fearless and adaptable nature.\n\nThe story begins with the small person pioneer team inside §H[event_target:gtsra_random_event_leader.GetName]§!'s shoes. The first small people who set foot on this land found it to be pitch black, damp and stuffy. The only source of light was the light that came into the shoe opening. Terrible odors permeated the air. They had to wear air filters in order to live properly, but despite the harsh environment, the mineral reserves and water content were abundant -- although the latter needed to be filtered several times to be used normally. \n\n At first, small people died one after another from not adapting to the environment. Their corpses were corroded by foot odor, turning into white bones buried on the insole continent. Over time the bodies became part of the shoe pad’s grime. But many more small people successfully settled on the insole of §H[event_target:gtsra_random_event_leader.GetName]§!'s shoe.\n\nInitially, the small people's settlements were scattered throughout the insole. The settlements at the arch of the foot were sparsely populated due to the extremely strong smell. The five dark basins inside the shoe had rich minerals (foot grime) and water, which were very suitable for small people to live in. Gradually, the small people developed the five most prosperous cities at the toe prints (the level of prosperity is determined by the size of the toe indentation). If nothing changed, the ordinary lives of the small people would continue like this until that certain day… On that day, all the small people inside the insole heard a huge vibration from the ground. The animals began to flee blindly, and the buildings began to collapse. People fled the buildings and hid in the open, looking towards the opening of the shoe to know what had happened. \n\nSuddenly, something blocked the sunlight from the shoe opening-it was the huge foot of §H[event_target:gtsra_random_event_leader.GetName]§!.\n\nThe five toes, pressed together, slowly entered the shoe, contacted and flattened the insole cities located at the heel. Then, it slowly moved forward, uniformly flattening, crushing, and turning all the cities on its path into the insole grime. Finally, when §H[event_target:gtsra_random_event_leader.GetName]§!'s entire jade foot had entered the shoe, her toes were already hanging over the cities located in the toe basins. Only then did the small people realize why this was the area with the richest resources, but it was too late...\n\n\"Hmm... the insole feels a little scratchy today. Did some sand get into my shoe?\" \n\n§H[event_target:gtsra_random_event_leader.GetName]§! rubbed her toes and stomped her foot again until there was nothing abnormal. After that, she went out wearing the shoes.\n\nAnd the small people on the insole had been nearly wiped out in this disaster. The small people who managed to survive at the arch of the foot worship the giant foot of §H[event_target:gtsra_random_event_leader.GetName]§! as a god, and generations upon generations have dedicated themselves to working on the arch of the foot for odor removal."
  # 涩涩
  gts_evt_random.030090.a: "Lewd"
  # 巨型精子撞击
  gts_evt_random.030100.name: "Giant Sperm Collision"
  # 几日前，我们的哨站显示，有一批不明的巨大物体正从[event_target:gtsra_random_futa_event_planet.GetName]星系边缘高速袭来，我们的科学家团队绞尽脑汁也没能确认那是什么东西。\n\n但是现在，真相已经明了，那毫无疑问是巨大的精子，无论是外形还是探测器返回的检测数据，都证明那些不明物体是巨大的精子，单个精子的体积至少是殖民地§H[event_target:gtsra_random_futa_event_planet.GetName]§!的五倍，来源应该是某个扶她巨娘，或许是§Y[event_target:gtsra_random_futa_event_leader.GetName]§!？\n\n如果计算机计算的路径没有错的话，它们的移动路线有很大概率经过我们的殖民地。我们必须做些什么，不能坐视不管，眼睁睁看着来之不易的殖民地被一群只会向前飞移动的精子摧毁。
  gts_evt_random.030100.desc: "A few days ago, our outpost showed that a group of unidentified gigantic objects was rushing in at high speed from the edge of the [event_target:gtsra_random_futa_event_planet.GetName] system. Our team of scientists racked their brains but still could not determine what they were.\\n\\nBut now, the truth is clear. They are undoubtedly giant sperm. Both their appearance and the detection data returned by our probes prove that those unidentified objects are giant sperm. A single sperm is at least five times the size of the colony §H[event_target:gtsra_random_futa_event_planet.GetName]§!, and their source should be some futa Giantess. Perhaps §Y[event_target:gtsra_random_futa_event_leader.GetName]§!?\\n\\nIf the computer's calculated trajectory is correct, there is a high chance that their route will pass through our colony. We must do something. We cannot simply sit by and watch our hard-won colony be destroyed by a group of sperm that only know how to fly forward."
  # 让当地驻军开火，偏离精子路线
  gts_evt_random.030100.a: "Order the local garrison to open fire, diverting the sperm from its path"
  # 巨娘的精子比一个小小的殖民地珍贵多了，不用管
  gts_evt_random.030100.b: "The Giantess's sperm is far more valuable than a tiny colony - don't worry about it."
  # 没钱管不了，让[event_target:gtsra_random_futa_event_leader.GetName]赔偿撞击损失
  gts_evt_random.030100.c: "If you don't have the money, there's nothing we can do - have [event_target:gtsra_random_futa_event_leader.GetName] compensate for the collision damage."
  # 巨型精子已偏航
  gts_evt_random.030101.name: "The giant sperm has veered off course"
  # 我们安全了，但是就连精子都如此巨大，很难想象§H[event_target:gtsra_random_futa_event_leader.GetName]§!现在的体型该是多么恐怖，我们应该管控她的性欲。
  gts_evt_random.030101.desc: "We're safe now, but even the sperm are so huge - it's hard to imagine how terrifying §H[event_target:gtsra_random_futa_event_leader.GetName]§'s current size must be. We need to keep her sexual urges under control."
  # 令行禁止，警告她以后射完了必须擦干净
  gts_evt_random.030101.a: "Obey orders without question; warn her that she must clean up after she finishes."
  # 相比之下，还是她的性欲更重要
  gts_evt_random.030101.b: "All things considered, her sexual desire is still more important."
  # 巨型精子撞击殖民地
  gts_evt_random.030102.name: "Giant Sperm Collide with the Colony"
  # 精子撞击了殖民地§H[event_target:gtsra_random_futa_event_planet.GetName]§!，带来了巨大的破坏，幸好我们的人提前躲好了，没有出大问题。根据成分化验，精子的主人确认是§Y[event_target:gtsra_random_futa_event_leader.GetName]§!。不过还有意外收获，被撞击的区域散发出一股淫靡的味道，催动人心。
  gts_evt_random.030102.desc: "The sperm collided with the colony §H[event_target:gtsra_random_futa_event_planet.GetName]§!, causing massive destruction. Fortunately, our people had taken cover in advance, so there were no major problems. Based on chemical analysis, the owner of the sperm has been identified as §Y[event_target:gtsra_random_futa_event_leader.GetName]§! However, there was an unexpected bonus: the impacted area gave off a lustful scent that stirred the senses."
  # 塞翁失马，焉知非福
  gts_evt_random.030102.a: "A misfortune may turn out to be a blessing in disguise."
  # 警告她以后射完了必须擦干净
  gts_evt_random.030102.b: "Warn her that she must clean up after she finishes."
  # 相比之下，还是她的性欲更重要
  gts_evt_random.030102.c: "All things considered, her sexual desire is still more important."
  # 巨型精子撞击殖民地
  gts_evt_random.030103.name: "Giant Sperm Collide with the Colony"
  # 精子撞击了殖民地§H[event_target:gtsra_random_futa_event_planet.GetName]§!，带来了巨大的破坏，幸好我们的人提前躲好了，没有出大问题。根据成分化验，精子的主人确认是§Y[event_target:gtsra_random_futa_event_leader.GetName]§!。不过还有意外收获，被撞击的区域散发出一股淫靡的味道，催动人心。\n\n§Y[event_target:gtsra_random_futa_event_leader.GetName]§!表示这是她前几天处理性欲时候没有注意擦干净导致的，她愿意赔偿损失。
  gts_evt_random.030103.desc: "The sperm collided with the colony §H[event_target:gtsra_random_futa_event_planet.GetName]§!, causing massive destruction. Fortunately, our people had taken cover in advance, so there were no major problems. Based on component analysis, the owner of the sperm has been identified as §Y[event_target:gtsra_random_futa_event_leader.GetName]§!. However, there was an unexpected bonus: the impacted area emitted a lewd scent that stirred the senses. \n\n§Y[event_target:gtsra_random_futa_event_leader.GetName]§! explained that this was caused by her failing to wipe properly after relieving her sexual urges a few days ago, and she is willing to compensate for the damages."
  # 给她开罚单，并警告她以后射完了必须擦干净
  gts_evt_random.030103.a: "Issue her a ticket and warn her that she must clean up after herself next time."
  # 巨娘的性欲处理比殖民地重要多了，只要能赔偿的话那她怎么样都是可以的
  gts_evt_random.030103.b: "Dealing with the Giantess's sexual desires is far more important than the colonies; as long as she's compensated, it doesn't matter what happens to her."
  # 小人之家
  gts_evt_random.040010.name: "Small Person Homes"
  # 一些修道院内布置了名为小人之家的东西，据报告称，这些小型屋子由当地教会提供，用意接济流离失所的小人，教会也会定期提供食物等喂养它们，并表示花费相当少，不少修道院都开始这么做，我们是否需要在全国范围内推广呢？
  gts_evt_random.040010.desc: "Some monasteries have established what is called 'Small Person Homes'. According to reports, these small houses are provided by the local church to help displaced small people. The church also regularly provides food and such to feed them, stating the costs are quite low. Many monasteries have begun to do this; should we promote this nationwide?"
  # 既然不要多少钱，那就试试水咯
  gts_evt_random.040010.a: "Since it doesn't cost much, let's test the waters."
  # 为什么要为那群连巨娘主人都找不到的家伙提供温暖的屋子？
  gts_evt_random.040010.b: "Why provide a warm house for those who can't even find a giantess owner?"
  # 虽然很好，但是不行
  gts_evt_random.040010.c: "Although it's good, it is not an option."
  # 把这群小人统统编入军队，那里也有房子和食物
  gts_evt_random.040010.d: "Enlist all these small people into the army; there are also houses and food there."
  # 这些小人是很好的资源呢
  gts_evt_random.040010.e: "These small people are a good resource."
  # 不知名的巨娘商贩
  gts_evt_random.040020.name: "Unknown Giantess Merchants"
  # 根据边境星球的汇报，最近有数十名匿名巨娘组成的商队在出售未注册小人，这种盗取国家资源的行为应当是犯罪行为但当地部门表示，目前并没有法律条文明确规定巨娘贩卖未注册小人是违法行为，您觉得如何，大人？
  gts_evt_random.040020.desc: "According to reports from a border planet, a caravan of dozens of anonymous giantesses have recently been selling unregistered small people. This act of stealing state resources should be a criminal offense but the local authorities have stated that, currently, there is no law that explicitly states it is illegal for giantesses to sell unregistered small people. What do you think, my lord?"
  # 如果她们交税了，那么就可以
  gts_evt_random.040020.a: "If they pay taxes, then it's fine."
  # 只有国家才能贩卖小人资源，把她们统统逮捕！
  gts_evt_random.040020.b: "Only the state can sell small person resources. Arrest them all!"
  # 贩卖小人的商贸团体是符合我们的价值观念的
  gts_evt_random.040020.c: "Trading groups that sell small people are consistent with our values."
  # 售卖巨娘用奇异商品的船队
  gts_evt_random.040030.name: "Fleet Selling Strange Goods for Giantesses"
  # 根据边境星球的汇报，最近有数十支船队在边境星球做停靠，并在各个殖民地上出售可供巨娘使用的商品，根据情报局的调查发现，他们之中并没有巨大娘的存在，全数为小人同时，根据贸易报告可以得知，他们所贩卖的商品得到了当地巨娘的一致好评，我们应该怎么处理这件事情
  gts_evt_random.040030.desc: "According to reports from a border planet, dozens of fleets have recently docked at border planets and are selling goods to be used by giantesses on various colonies. According to an intelligence agency investigation, there are no giantesses among them; all of them are small people. At the same time, according to the trade reports, it is known that the goods they are selling have received unanimous praise from the local giantesses. How should we handle this matter?"
  # 小人吗，让他们交出一切，否则就毁灭他们
  gts_evt_random.040030.a: "Small people, make them hand over everything or destroy them."
  # 我相信你们的个人判断能力不会让帝国蒙受损失，让她们去做吧
  gts_evt_random.040030.b: "I believe your personal judgement will not cause a loss to the empire; let them do as they please."
  # 未经帝国允许就私自贩卖商品本是重罪，更何况他们没有交税！立刻逮捕他们！
  gts_evt_random.040030.c: "It is a serious crime to sell goods privately without the permission of the empire, not to mention that they have not paid taxes! Arrest them immediately!"
  # 来自遥远星系的消息-编号24662
  gts_evt_random.040040.name: "Message from a Distant System - Number 24662"
  # \"主人已经屈尊缩小到与你们这些虫子一样的体型了，居然还敢打断主人讲话！\"\n在演讲台一旁的女仆愤怒的大喊到，并不知从哪里拿出一把武器对准了台下许多小人的议员，而场内的安保人员则也纷纷拿起武器对准了台上的两人，整个国会内瞬间紧张起来，似乎一场严重的外交事故就要发生\n\"安娜，把武器收起来，这样很不礼貌\"\n\"可是主人，这些虫\"\n\"安娜！\"\n\"遵命\"\n\"在演讲台上穿着华丽服饰的女子的怒吼下，一旁的女仆向裙内收起了武器，并很不情愿的朝着台下的小人议员们鞠了一躬后向后退去\"\n\"你身为一国的公主也是继承人，怎么可以允许身边有着如此无礼的仆人呢？\"\n\"请原谅她，事后我一定严加管教，不会让此事再次发生\"\n公主朝向小人议员们道歉，一场外交事故被避免了，只可惜在后续依然有大量的小人议员打断公主讲话，或者严重冒犯公主或是其国家的发言,其身后的女仆一次又一次尝试教会那些小人什么叫尊重，但都被公主拦了下来,\n在这次外交会晤的2个月后，小人国朝向巨娘国挑起了战争但是在战争开始没多久，一双巨大的女仆靴踩进了小人国的首都，并且在小人议员还没来得及撤离就踩碎了小人的国会大厦
  gts_evt_random.040040.desc: "\"The master has condescended to shrink down to the same size as you bugs, yet you still dare to interrupt her speech!\" the maid shouted angrily from next to the podium, taking out a weapon from who knows where and pointing it at the many small person council members below the stage. At the same time, the security personnel in the hall took up their weapons and pointed them at the two people on the podium, immediately turning the entire congress tense as a serious diplomatic incident seemed about to happen.\n\n\"Anna, put the weapon away, that's very impolite,\" said the woman with elegant clothes on the podium.\n\"But master, these insect...\"\n\"Anna!\"\n\"Yes, ma'am.\"\n\nUnder the woman on the podium's roar, the maid put away her weapon into her skirt, and reluctantly bowed to the small person council members below the stage before stepping back.\n\n\"You, as a princess and heir to the throne, how can you allow such an impolite servant by your side?\"\n\n\"Please forgive her; I will definitely discipline her strictly afterwards and will ensure it does not happen again.\" The Princess apologized to the small person council members, and a diplomatic incident had been avoided. Unfortunately, during the rest of the session many small person council members kept interrupting the princess's speech, or made serious remarks offending the princess or her country.  Again and again, the maid behind her tried to teach those small people what respect is, but was stopped by the princess.\n\nTwo months after this diplomatic meeting, the small person country started a war against the giantess country, but not long after the war began, a pair of giantess maid boots stepped into the small person country's capital and crushed the small person congress building before the small person councilors even had a chance to retreat."
  # 可怕
  gts_evt_random.040040.a: "Terrifying"
  # 舰娘被偷窥！
  gts_evt_random.040050.name: "Shipgirl Voyeurism!"
  # 从刚刚来到[FromFrom.System.GetName]的舰队发来一条新消息：一艘隶属于我们的小人商用普通舰船被发现偷拍舰娘们的裙底尽管该艘舰船已经被驱逐舰舰娘及时捕捉，但对于如何处理这种游走在法律灰色地带的事件却一路上报到了最高委员会，并最终报告给了[This.GetRulerName]
  gts_evt_random.040050.desc: "A new message has been received from the fleet that just arrived at [FromFrom.System.GetName]: A small person commercial vessel belonging to us was caught filming under the skirts of the shipgirls. Although the vessel has been intercepted by a destroyer shipgirl in a timely manner, how to deal with such an event that walks the gray line of the law has been reported all the way up to the highest committee and finally reported to [This.GetRulerName]."
  # 这是对舰娘和巨娘的亵渎！
  gts_evt_random.040050.a: "This is a blasphemy against shipgirls and giantesses!"
  # §S涉事企业将会被勒令整顿§!
  gts_evt_random.040050.a.tooltip: "§SThe company involved will be ordered to rectify the situation!§!"
  # 保护舰娘们的裙底不被偷窥是基本的隐私权
  gts_evt_random.040050.b: "Protecting the shipgirls' skirts from being peeped at is a basic right to privacy."
  # §S涉事企业将对舰娘进行补偿§!
  gts_evt_random.040050.b.tooltip: "§SThe company involved will compensate the shipgirls!§!"
  # 没必要对小人纠结那么多……
  gts_evt_random.040050.c: "No need to dwell on so much about small people..."
  # §S放任图片私下流通§!
  gts_evt_random.040050.c.tooltip: "§SAllow the private circulation of the images!§!"
  # 那里造这么大就是为了来看的！
  gts_evt_random.040050.d: "They built it that huge specifically to be seen!"
  # §S涩涩经济！傻瓜！§!
  gts_evt_random.040050.d.tooltip: "§SLewd economy! You fool!§!"
  # 决定性胜利！
  gts_evt_random.040060.name: "Decisive Victory!"
  # 随着堕落帝国的最后一座堡垒陷落，昔日高高在上的[From.GetName]也终于沦为了我们脚下的奴仆!\n\n他们的母星被列入我们帝都博物馆的玻璃展柜，而他们不可一世的"高贵"人民则被缩小，做成最低劣的消费品供我们[Root.GetSpeciesName]玩乐——这群曾自认高我们一等的生物此刻正在我们的体表为了生存而拼死挣扎，甚至不惜冒着被碾碎的生命危险去刺激"丰产的洞穴"\n\n多么可悲...
  gts_evt_random.040060.desc: "With the fall of the last fortress of the fallen empire, the once-arrogant [From.GetName] have finally become slaves under our feet!\n\nTheir homeworld is now placed in a glass display case in our Imperial Museum, and their proud, \"noble\" people are shrunk into the lowest-grade consumable  for our [Root.GetSpeciesName] to play with. These creatures who once thought themselves to be superior to us are now struggling for survival on our bodies, and even risking being crushed to stimulate a \"fertile cave\"\n\nHow pathetic..."
  # 高扬战旗，奏响凯歌，欢呼我们的胜利！
  gts_evt_random.040060.a: "Raise the banners, sound the victory anthem, celebrate our victory!"
  # 没有人能逃脱轮回，即便是我们……
  gts_evt_random.040060.b: "No one can escape the cycle, even us..."
  # 来自遥远星系的消息-编号61053
  gts_evt_random.040070.name: "Message from a Distant System - Number 61053"
  # \"各位代表，我谨代表巨娘，对诸位达成的伟大共识致以诚挚的祝贺\"衣着得体的少女大使站起身来，刚刚还沉溺欢乐欣慰的会场瞬间鸦雀无声，只剩下书面纪录仪走笔的沙沙声：\n\n\"投票情况：339/340 \n赞成票：0 \n反对票：339\" \n\n\"过去的几年内，诸位深度交流，团结协作，绞尽脑汁构建出确实行之有效的世界关系架构——你们摒弃了理念差异，种族隔阂，同时站到了天平的一侧\" \n\n她的声音清丽，在宽大的会场中甚至堪称微小，但那上千人鸦雀无声，只是愤怒，惊慌，悲凉，恐惧，而无能为力地注视着她走到了投票台前
  gts_evt_random.040070.desc: "\"Distinguished representatives, on behalf of the giantesses, I would like to extend my sincere congratulations to all of you for the great consensus you have reached,\" said the well-dressed young female ambassador, as she rose to her feet. The assembly hall, which had just been filled with joy and relief, instantly fell silent, with only the rustling sound of the writing instruments of the scribes. \n\n\"Voting results: 339/340; \nAyes: 0; \nNays: 339.\"\n\n\"Over the past few years, you have engaged in in-depth exchanges, cooperated together, and racked your brains to construct a truly effective framework for world relations-you have abandoned differences in ideologies, racial barriers, and stood on one side of the scale.\"\n\nHer voice was clear and beautiful, even tiny in the large assembly hall, but the thousands of attendees remained silent, filled with anger, panic, sadness, and fear as they were powerless to do anything but watch her walk to the voting table."
  # 来自遥远星系的消息-编号61053
  gts_evt_random.040071.name: "Message from a Distant System - Number 61053"
  # \"我方愿意相信，各位都是完全出于自身情况的考量，而选择投下符合自身利益的一票\"她就那么轻巧平静地脱下靴袜，幼嫩白皙的裸足就直接踏在庄严的鎏金礼台上，却任何一方代表敢出声指责\n\"那么出于我方利益的考量，我们决定——嗯，投出百分之一票～\"似乎是再也掩盖不住，少女银铃般调皮的轻笑将周围与会者的面如死灰映衬得颇为戏剧性\n\n她的一根足趾搭上了投票台\n\n\"星海共同体第七千零二十二项议程....通过.... \n\n投票国家340/340 \n反对票：339 \n赞成票：....巨娘帝国的1%，等效票数....7000.... \n\n即日起，本银河系内一切资源及生命体，都....作为私人财产，归于巨娘帝国女神及其臣民所有\" 
  gts_evt_random.040071.desc: "\"We are willing to believe that you all made your choices entirely based on your own circumstances, and chose to cast a vote that was consistent with your own interests\", she so gracefully and calmly took off her boots and socks; and her tender, fair bare foot stepped directly onto the solemn golden podium, yet none of the representatives dared to speak out to criticize her. \n\n\"Well, considering our interests, we have decided- umm, to cast one percent of the vote~\" As if she could no longer hold back, the playful, girlish giggle became almost like a death knell against the ashen faces of the surrounding attendees, making it almost comical.\n\nOne of her toes gently tapped on the voting table.\n\n\"The Interstellar Community's Seven Thousand and Twenty-Second agenda item....passed....\n\nVoting nations 340/340; \nNays: 339; \nAyes: ....1% of the Giantess Empire, equivalent to...7000 votes....\n\nEffective immediately, all resources and life within this galaxy...as private property, belongs to the Goddess of the Giantess Empire and her subjects.\"
  # 来自遥远星系的消息-编号12653
  gts_evt_random.040080.name: "Message from a Distant System - Number 12653"
  # 浩浩荡荡的小人舰队缓缓降落在小鹿的鹿角上，但在旁人看来就像是一粒灰尘飘到了鹿角上——它们实在是太小了，高度发达又贪婪的邪恶小人们迅速在小鹿的鹿角上搭建了配套的挖掘装置，每分每秒都有装满鹿茸的运输舰离港，源源不断的鹿茸正被运输到帝国各处\n\n\"嗯....太贪心的小家伙可不讨喜哦，不过我也懒得用手处决你们~\"\n\n（幽青色的眼眸中闪过一丝流光，整个小人帝国治下所有的所有政客居民乃至星球本身都被传送到身前，虽然看起来只像是几颗花花绿绿的小灰尘，即便作为一个整体无法与那只懒懒的鹿娘的乳首相对比）\n\n\"唔....好弱，对着你们开口说话就会全灭了吧？\
  gts_evt_random.040080.desc: "The grand and imposing small person fleet slowly descended onto the antlers of a deer named 'Little Deer' but to others this looked no more than a speck of dust falling onto an antler - they were simply far too small. The highly developed yet greedy, evil small people quickly set up the necessary excavation equipment on Little Deer’s antlers. Every minute, cargo ships filled with velvet antlers left the port, and was being continuously transported to all parts of the empire.\n\n\"Hmm… Too greedy little guys aren't liked, but I'm too lazy to execute you by hand~\"\n\n(A stream of light flashed in her turquoise eyes. All the politicians, residents and even the planets themselves under the rule of the small person empire were teleported to before her. Although they looked like only a few, colorful dust motes, even all together they were incomparable to that lazy deer-girl’s nipple.)\n\n\"Umm... so weak, if I even speak to you, would you be wiped out?\"
  # 来自遥远星系的消息-编号12653
  gts_evt_random.040081.name: "Message from a Distant System - Number 12653"
  # 正在享乐的小人帝国统治者只感到天旋地转，随后整个天空被肉色占据，那微微带着恼怒的声音撼动着每个生物的内脏，一些脆弱的小人竟然惨死当场！统治者愤怒的破口大骂，要求军部消灭这个怪物\n\n然而整支舰队就算首尾相接，排出一字长蛇阵也不如鹿鹿的发丝粗，绝望的指挥官却不得不战\n\n一艘艘舰船从母港起航，组成阵型后朝着鹿鹿驶去，正在巡逻的舰船对着突然出现的巨大鹿鹿火力全开，导弹激光火炮一窝蜂的发射出去，鹿鹿的皮肤表面不断有大大小小的爆炸出现
  gts_evt_random.040081.desc: "The rulers of the small person empire who were in the middle of their revelry suddenly felt the world spinning around them. Then, the entire sky was taken over by a flesh color. Her slightly annoyed voice caused the organs of every living being to tremble, and some fragile small people even died on the spot! The rulers burst into an angry tirade, demanding that the military eliminate this monster.\n\nHowever, even if the entire fleet lined up, forming a long line, it would still not reach the thickness of the deer girl's hair. The despairing commander had no choice but to fight.\n\nShip after ship set sail from their homeports, forming ranks before heading towards the deer girl. The ships on patrol opened fire on the sudden appearance of the giant deer girl with all guns blazing. Missiles, laser beams, and artillery barrages were fired in swarms. Explosions started appearing across the surface of the deer girl."
  # 来自遥远星系的消息-编号12653
  gts_evt_random.040082.name: "Message from a Distant System - Number 12653"
  # 虽然爆炸细小得根本不可见，但是依然感觉到了那渺小帝国中充斥的恶意，平静而柔和的双眼第一次真正投下目光\n\n\"既然是我把你们带到这里来，那我也要好好款待你们的，不然就失礼了嘛~\"\n\n千万年的积累的文化历史与数以兆亿计的居民，与那百代岁月建设的家园本身和谐聚合为一个整齐宏大的构造体，堪称气势恢宏地前行——冲向那一条细褶都能容纳不计其数的强盛文明，已经张开张开乳腺口，微微颤动着的娇嫩乳首\n\n\"欢迎光临哦~小心不要被我的一滴乳汁....\"\n\"哦抱歉抱歉，你们还不配被我的乳汁亲自处决哦~\
  gts_evt_random.040082.desc: "Though the explosions were far too small to even be seen, she could still feel the malice emanating from that tiny empire. For the very first time, her calm and gentle eyes fell onto them with intent.\n\n\"Since I'm the one who brought you here, then I must treat you well, otherwise it would be rude, right?~\"\n\nThe culture, history, and accumulation of millennia, along with trillions of people and their homes spanning hundreds of generations, were harmoniously combined into a grand and ordered body, moving forwards with majestic momentum- charging towards those delicate, gently pulsating nipples with their countless folds that can accommodate countless powerful civilizations.\n\n\"Welcome~ Careful not to be touched by one drop of my milk...\"\n\n\"Oh, sorry, sorry. You don't even deserve to be personally executed by my milk~\"
