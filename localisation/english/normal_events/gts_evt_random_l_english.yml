  # 盛夏！巨娘？度假村！
  gts_evt_random.040241.name: "Midsummer! Giantesses? A resort!"
  # 看着这些平日运筹帷幄、撑起庞大疆域的巨娘领袖们，在烈日下奔波确实于心不忍。\n\n于是帝国给她们放了个假。巨娘挑了一颗生态宜人的度假星球， 这是一颗没有踏入星空但觉醒程度很高的土著星球 原住民们因为热情好客大力发展旅游业将自己的星球改成了近乎度假星球的模板 随后通过原始的深空广播宣传他们那是银河各个种族解压释放的优秀旅游胜地 然后就引来了正巧在寻找解压放松游玩场所的群巨娘 于是...\n\n伴随着擢风踏浪的雷鸣脚步，六道巨大的身影迈入了这片蔚蓝的海岸，性格各异的领袖们此时都换上了清凉的泳装，享受这番来之不易的假日。\n\n他们分别是：\n\n§H鸟音山水，林凤，苏小白，橘子长，希瞳§!\n\n按理说五人的阵容已经足够，但眼前的蓝发少女§B烁瑄§!，是鸟音山水多年的挚交。听闻巨娘在全宇宙搜刮“避暑胜地”，她特意赶来一聚。既然鸟音开口担保，我们很愿意她加入这场假日，也许她玩开心了之后就会加入我们呢\n\n看着鸟音、烁瑄、橘子长将这片海岸的浅水区当作浴缸，肆意泼水嬉闹，而在林凤、希瞳、苏小白巨大的玉足边上，钢铁巨舰和城市庄园如同玩具般摇摇欲坠。这才是真正的“巨娘级”消暑方式。既然烁瑄玩得开心，鸟音也展露了难得的笑颜，那一个前超光速时代的土著文明成为献给她们的礼物，倒也不是什么大问题。毕竟，她们快乐了，宇宙就和平了。
  gts_evt_random.040241.desc: "The time has come for educational institutions across the empire to let their students out for the holidays. Most giantess students take the opportunity to stroll around nearby cities. Although their permitted activity zones are restricted, every year there are still plenty of reports about giantess students wandering into little people cities by mistake and causing accidental damage...\n\nIn addition, a number of especially outstanding students are granted the chance to work in close contact with one of the empire's renowned scientific officers over the break. However, when they discover that the site of their summer field training is actually the insole of §H[event_target:gtsra_random_event_leader.GetName]§!, many back out on the spot.\n\nAfter all, §H[event_target:gtsra_random_event_leader.GetName]§! is usually busy with the empire's many research projects, often has to conduct field inspections on various planets, and has little spare energy to manage the hygiene inside her shoes... Now, this difficult cleaning job can be handled by energetic university students under the name of researching the geology and ecosystem inside a shoe."
  # 希望这个文明能在六位巨娘美丽的巨躯下幸存
  gts_evt_random.040241.a: "I hope this civilization can survive under the beautiful, massive bodies of these six Giantesses."
  # §Y毕竟这么好客的小人可不多见§!
  gts_evt_random.040241.a.tooltip: "§YAfter all, it's not every day you come across such a hospitable tiny person§!"
  # 少女的城市互动
  gts_evt_random.040242.name: "A Young Girl's Interactions with the City"
  # 视线越过海湾的另一端，三位毛茸茸的巨娘正趴在后方的岛屿上晒太阳。而在这片繁华的海岸线与城市上空，另一组三人正以最悠闲的姿态，融入这场假日。\n\n烁瑄轻盈的躺在在摩天大楼与城市之间，淡黄色的眼眸里满是温柔。相比那些动辄用星球当跳蛋的巨娘，她此刻更像一位纯粹的邻家少女。与她相对而卧的鸟音，则托腮倚靠在高楼的边缘，用指尖推了推半框眼镜，也是巨大的体型。\n\n§Y烁瑄姐姐，此城虽小，却是小人文明倾尽心力为我们准备的祛夏消暑之地，枕在云端听这浪涛拍岸，倒是不错的消遣，放心，之前的银河广播都说了可以随便玩，不会有问题呢。§! \n\n鸟音显然很黏这位“姐姐”，话匣子一开，便兴致勃勃地与烁瑄玩闹了起来。\n\n而躺在另一侧的橘子长则大相径庭，她整个人趴在沙滩上，纠白的巨手肆无忌惮地探向下方的海湾，指尖胡乱拨弄着海面，掀起一阵阵令下方游船剧烈摇晃的白浪。\n\n度假村的小人们则时充当了助兴玩具的作用，惊慌的他们驾驶着舰船驶入了少女们的海港。虽然之前做好了接待预案，但第一次近距离接触如此巨大的少女们，他们还是有些心悸，但巨大泳装少女的诱惑也令他们欲罢不能。小人的舰船们便兵分两路，一队在烁瑄的足下游荡，另一队则是来到了橘子长的巨手之下。\n\n只要她们不把这颗星球的星核当沙包捏，他们应该不至于血本无归。
  gts_evt_random.040242.desc: "Across the bay, three furry Giantesses were basking in the sun on the island in the distance. And high above this bustling coastline and city, another trio was blending into the holiday atmosphere with the utmost leisure. \n\nShuoxuan lay lightly suspended between the skyscrapers and the city, her pale yellow eyes brimming with tenderness. Compared to those Giantesses who casually use planets as Vibrators, she looked more like a pure, ordinary girl next door at that moment. Lying opposite her, Niao Yin rested her chin on her hand as she leaned against the edge of a skyscraper, pushing her half-frame glasses up with her fingertips - she, too, was of immense stature. \n\n§Y Sister Shuoxuan, though this city is small, it's a place where the civilization of Tiny People has poured their heart and soul into preparing a summer retreat for us. Resting on a cloud and listening to the waves crashing against the shore is quite a pleasant pastime. Don't worry - the Milky Way Broadcast already said we can play however we like; there won't be any problems. §! \n\nNiao Yin was clearly quite attached to this \"sister\"; once she started talking, she enthusiastically began playing and fooling around with Shuoxuan.\n\n In stark contrast, Ora, lying on the other side, was a completely different story. She was sprawled face-down on the beach, her massive, snow-white hands reaching unabashedly toward the bay below, her fingertips randomly churning the water and sending up waves of white foam that caused the boats below to rock violently.\n\nThe resort's tiny people, meanwhile, served as playthings to liven up the scene. Panicked, they steered their ships into the girls' harbor. Although they'd prepared reception plans beforehand, coming into such close contact with such enormous girls for the first time still made their hearts race - yet the allure of the giant girls in swimsuits was simply too irresistible to resist. The Tiny People's ships split into two groups: one cruised beneath Shuoxuan's feet, while the other sailed beneath Ora's giant hand.\n\nAs long as the girls didn't treat the planet's core like a punching bag, the Tiny People shouldn't lose everything."
  # 小家伙们这下可有眼福了
  gts_evt_random.040242.a: "The little ones are in for a real treat."
  # §Y会有小东西悄悄爬上女孩们的躯体吗？§!
  gts_evt_random.040242.a.tooltip: "§Y Are there little creatures secretly crawling up the girls' bodies?§!"
  # 女孩子涩涩时可怜的城市
  gts_evt_random.040243.name: "A City That Feels Pitiful When Girls Are Shy"
  # §M烁瑄姐姐~这有几只小船着你这里开过来了呢。§!\n\n一支由几艘护卫舰组成的小型舰队沿着海湾缓缓开来，舰上人员即便躲在数百吨重的钢铁战舰上面对如山般大小的两位少女仍止不住的发抖。\n\n在纯粹放松的环境里，鸟音也放下了古风的腔调，与她的烁瑄姐姐共度这场假期。几架直升机缓缓升空快速靠近到附近围绕着少女的巨躯盘旋。\n\n§B嘛~？是来给咱们助兴的~§!\n\n烁瑄没有理会飞机上的小人用扩音器发出语调近乎哀求的陌生外星语，烁瑄虽然隐约察觉到情绪的不对，但是为了这次放松度假的初衷，暂且被抛置脑后。总之自身有局部回溯的能力，即便可能做了错事后续也不会有太大影响啦。\n\n§M嗯嗯~船上的小人都是主动来陪我们玩耍的~§!\n\n鸟音推了推眼镜，眼角流露出一丝不易察觉的如同恶作剧般的笑意。\n\n§B所以...它们就打咱的胸部吗~？§!\n\n在极端恐慌中，舰队指挥官下达了攻击命令，一时间各类炮火在烁瑄的胸部绽放出剧烈的火光。\n\n虽然烁瑄是温柔系巨娘，但此时此刻，她的玩心也被激了起来，轻轻驱散环绕在耳边嗡嗡作响的直升机，向着挣扎的舰队伸出双手。\n\n她的一双纤手轻捏住两艘小船，数百吨重的船瞬间就被捏了起来，一艘扔进了烁瑄柔软的乳肉中，而另一艘被塞进了一旁矜持的鸟音泳裤中。\n\n§B坏呢~§!\n\n鸟音闻言，心底那点矜持彻底丢到了天边。她展臂环住烁瑄的腰肢，整个人像小猫咪一样柔柔的贴了过去。\n\n§M烁瑄姐姐~咱也要……§!\n\n没了繁文缛节的阻挡，鸟音将自己温热的脸颊直接埋进了烁瑄那团柔软的乳肉之中。可怜的护卫舰在波涛般的乳肉海洋中上下沉浮，与鸟音细腻的面庞亲密接触。阳光将两人的肌肤晒得微烫，带着一点点对方体温与奶香的暖意扑面而来，烁瑄特有的体香，一瞬间就将鸟音的感官包裹。没有了帝国事务的紧绷，她在这方天地里只是个可爱的妹妹，鼻尖轻轻蹭着那片柔嫩的肌肤，那种被温柔、柔软与馨香彻底淹没的宁静感，让她舒服得眯起眼睛，发出了满足的轻吟。\n\n§M呜...烁瑄姐姐~暖暖的~§!\n\n感受着“姐姐”肌肤传来的滚烫体温，以及那份毫无保留的宠溺，鸟音的呼吸逐渐变得有些急促。她随手将岸边一辆满载乘客的大型客车捡起含在唇间，顺着柔软的曲线缓缓直起身，主动抬起手，捧住了烁瑄的脸蛋。烁瑄微微垂着眼帘，粉嫩的唇瓣带着温柔的笑意迎了上去。\n\n两人彻底沉浸在贴贴的依偎之中，忘记了周遭的一切。然而，巨娘沉浸于温存时一个不经意的动作，对凡尘而言却是灭顶之灾。就在唇齿相依的缠绵间，鸟音的膝盖不自觉地向下挪动压下，巨大的足尖恰好错落在城市中繁华的区域。只听一阵雷鸣般的闷响，十几栋数百米的摩天大楼在不可阻挡的玉足推进下轰然倒塌，漫天的尘埃与建筑碎片向四周涌去，一时间惊呼与尖叫响彻整个足底，逃散的人流与跪地膜拜巨足的人群显出一副十分荒诞的画卷。\n\n足下尘暴肆虐，而她们也只顾着感受彼此的体香与温柔，根本没注意到呢。因为这座城市的崩解，只是假日里为她们助兴的一段小小插曲罢了。唇瓣短暂分离，可怜的客车被拉出一道晶莹的银丝悬空在双唇之间。烁瑄微喘着气，那双清澈的眼眸里满是化不开的温柔，而鸟音的脸上早已染上一抹绯红，连呼吸都带着滚烫的情欲。\n\n§M还不够呢……§!\n\n鸟音娇憨地嘟囔了一声，再次主动凑了上去。\n\n这一次，那两尊巨大的玉体间没有任向间隙。鸟音微微侧过头，搂紧烁瑄的脖颈，狠狠的加深了这个吻，唇间的车辆也在鸟音软舌的挑逗中送入烁瑄口中。烁瑄也顺应着她，纤长的手指滑过鸟音的后腰，温柔的轻抚她的腰肢。阳光将两人微热的肌肤映的温润，空气中那些独属于少女的体香，奶香，又在此刻彻底交缠在了一起...\n\n§M唔…烁瑄姐姐的嘴唇，好软…§!\n\n鸟音的声音在唇齿交缠中变得有些含糊不清，她沉醉在烁瑄的体温与香气里，身子不自觉地又往对方怀里靠去。然而，就是这轻轻一靠，她们巨大的娇躯发生了轻微的位移。鸟音那丰满的大腿外侧顺势压在了下方被碾成粉末的城市群上，而烁瑄搭在海湾边的一只巨大的玉足，在动情间下意识地往后一蹬，又将沿海的跨海大桥拦腰踩断。\n\n烟尘在脚下翻涌，可对半空中的两人来说，那不过是一块背景板，现在，无论是帝国，还是这座城市的存亡，都远不及面前少女们香唇的触感更值得在意呢。
  gts_evt_random.040243.desc: "§MSister Shuoxuan~ A few little boats are coming this way toward you.§!\\n\\nA small fleet made up of several frigates slowly advances along the bay. Even hiding inside steel warships weighing hundreds of tons, the personnel aboard cannot stop trembling before the two mountain-sized girls.\\n\\nIn this purely relaxing environment, Torine also drops her archaic manner of speech and spends this vacation with her sister Shuoxuan. Several helicopters slowly rise into the air, quickly approach the area, and circle the girls' giant bodies.\\n\\n§BHm~? Are they here to add to our fun~§!\\n\\nShuoxuan ignores the tinies on the aircraft, who are using loudspeakers to broadcast an unfamiliar alien language in a tone almost like pleading. Although Shuoxuan vaguely senses that something is wrong with their emotions, for the sake of this relaxing vacation's original purpose, she temporarily puts it out of her mind. In any case, she has the ability to partially rewind things, so even if she might do something wrong, it should not have too much impact afterward.\\n\\n§MMm-hm~ The tinies on the ships all came to play with us on their own~§!\\n\\nTorine pushes up her glasses, a barely perceptible mischievous smile showing at the corners of her eyes.\\n\\n§BSo... why are they shooting at our chest~?§!\\n\\nIn extreme panic, the fleet commander gives the order to attack. All kinds of cannon fire bloom in violent flashes across Shuoxuan's chest.\\n\\nAlthough Shuoxuan is a gentle-type Giantess, at this moment, her playful side is stirred up as well. She gently waves away the helicopters buzzing around her ears and reaches both hands toward the struggling fleet.\\n\\nHer pair of slender hands lightly pinches two little ships, lifting the vessels weighing hundreds of tons in an instant. One is placed against Shuoxuan's soft cleavage, while the other is slipped into the swimsuit bottoms of the reserved Torine beside her.\\n\\n§BHow naughty~§!\\n\\nHearing this, the last bit of restraint in Torine's heart is completely cast away. She spreads her arms around Shuoxuan's waist and presses herself softly against her like a kitten.\\n\\n§MSister Shuoxuan~ I want some too...§!\\n\\nWith cumbersome etiquette no longer in the way, Torine directly buries her warm cheek against Shuoxuan's soft breast. The poor frigate rises and falls in the wavelike embrace, coming into intimate contact with Torine's delicate face. The sunlight warms both girls' skin, and a little warmth from each other's body temperature and milky scent drifts over them. Shuoxuan's unique fragrance instantly envelops Torine's senses. Without the tension of imperial affairs, in this world she is only a cute little sister. Her nose lightly rubs that tender skin, and the peaceful feeling of being completely submerged in gentleness, softness, and fragrance makes her comfortably narrow her eyes and let out a satisfied moan.\\n\\n§MUu... Sister Shuoxuan~ So warm~§!\\n\\nFeeling the scorching body heat from her \"sister's\" skin and that unreserved indulgence, Torine's breathing gradually quickened. She casually scooped up a large passenger bus full of commuters along the shore and held it between her lips, straightening up along soft curves to cradle Shuoxuan's cheeks in her hands. Shuoxuan lowered her gaze gently, meeting her with a tender, smiling kiss.\\n\\nThe two girls became utterly immersed in their intimate embrace, oblivious to everything around them. Yet an unintended movement by giantesses basking in intimacy proved catastrophic for mortal creatures below. Amid their affectionate embrace, Torine's knee shifted downward, her massive toes pressing squarely onto a bustling downtown district. With a rumbling crash, a dozen skyscrapers hundreds of meters tall collapsed under the unstoppable pressure of her bare feet. Billowing clouds of debris erupted outward as screams of terror echoed beneath her soles, where fleeing crowds and mortals kneeling in desperate worship formed a surreal spectacle.\\n\\nWhile dust storms raged below, the two maidens were lost in each other's fragrance and affection, paying no heed to the turmoil. The crumbling city was merely a tiny diversion enlivening their holiday. As their lips parted briefly, a glistening strand bridged between them around the battered bus. Shuoxuan panted softly, her clear eyes filled with boundless warmth, while Torine's cheeks flushed crimson, her breaths heated with passion.\\n\\n§MStill not enough...§!\n\\nTorine murmured petulantly and leaned in once more.\\n\\nThis time, no space remained between the two colossal figures. Torine tilted her head, wrapping her arms tightly around Shuoxuan's neck to deepen the kiss, teasingly transferring the vehicle between their lips into Shuoxuan's mouth with her soft tongue. Shuoxuan embraced her warmly, her slender fingers caressing Torine's back and waist. Golden sunlight bathed their flushed skin as their delicate fragrances mingled in the sea breeze...\\n\\n§MMmh... Sister Shuoxuan's lips are so soft...§!\\n\\nTorine's words slurred softly against their entwined lips. Enamored by Shuoxuan's warmth and scent, she nestled closer into her arms. Yet that gentle shift in posture displaced their massive forms slightly. The curve of Torine's thigh pressed down onto the pulverized ruins of the cityscape below, while Shuoxuan's giant bare foot resting along the shoreline gave an impassioned backward kick, snapping the cross-sea highway bridge in two.\\n\\nSmoke and dust churned beneath their feet, but to the two towering maidens, the destruction was merely distant background scenery. At this moment, neither the empire nor the fate of this world could compare to the sweetness of each other's tender lips."
  # 太棒了，我就是要看这个口牙！
  gts_evt_random.040243.a: "That's great - that's exactly the kind of smile I want to see!"
  # §Y希望女孩们唇间的小人没事（合十）§!
