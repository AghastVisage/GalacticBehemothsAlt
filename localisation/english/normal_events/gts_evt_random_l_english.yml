  # 意外来客
  gts_evt_random.040200.name: "Unexpected Guests"
  # 你看，巨娘领袖们天天低头看见的全是自己国家的小人类，看多了难免审美疲劳对吧~这一天隔壁星系家小脑袋瓜有些笨笨的小狐狸娘的一艘船由于超时空跃迁失误，误打误撞来到了§H[event_target:gtsra_random_event_leader.GetName]§!家的卧室里\n\n恰巧§H[event_target:gtsra_random_event_leader.GetName]§!正坐在桌前处理公文，忽然看见一艘小玩具飞船落在桌子上，然后船上就跳下来了几只萌萌狐狸，一只正在试图勘察并理解现在所处的位置，一只看着坠毁的飞船手足无措，一屁股坐地上哭了起来，剩下的几只笨手笨脚地正在把困在飞船里面的船员救出来\n\n而它们完全没有意识到它们头上方几百米处有一位巨娘正在饶有兴致地观察它们的憨憨行为......\n\n§H[event_target:gtsra_random_event_leader.GetName]§!早已对无聊的公文工作感到厌倦，顿时就对这些意外来访的小客人产生了浓厚的兴趣，思考接下来该怎样和这些小家伙们玩耍呢~
  gts_evt_random.040200.desc: "You see, the giantess leaders see small humans from their own country every day. It's inevitable that they will have aesthetic fatigue, right? One day, a ship belonging to a somewhat slow-witted little foxgirl from a neighboring star system accidentally arrived in §H[event_target:gtsra_random_event_leader.GetName]§!'s bedroom due to a hyperspace jump error.\n\nIt happened that §H[event_target:gtsra_random_event_leader.GetName]§! was sitting at their desk handling official documents when a small toy spaceship suddenly landed on the desk. A few cute foxes jumped out of the ship. One was trying to investigate and understand their current location; another looked at the crashed ship helplessly and sat on the ground crying; the rest were clumsily rescuing crew members trapped inside the ship.\n\nThey completely did not realize that there was a giantess several hundred meters above them, observing their clumsy behavior with great interest......\n\n§H[event_target:gtsra_random_event_leader.GetName]§! has already grown tired of the boring official work, and was immediately drawn to these unexpected little guests, thinking about how to play with these little ones next~"
