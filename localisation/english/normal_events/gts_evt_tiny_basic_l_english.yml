  # Original: 优质的服务？听起来不错。
  tiny_enclave_event.21.a.TINY: "Premium service? Sounds nice."
  # Original: 根据我们的通信系统和探测器信号来看，§H微型交易组织§!的所有空间站都被摧毁了，他们已经完全消失了。
  tiny_enclave_event.6b.desc: "According to our communication systems and probe signals, all §HMicro Transaction Organization§! space stations have been destroyed, they have completely disappeared."
  # Original: 你已经在赞助他们了。
  tiny_enclave_event.300.b.exists: "You are already sponsoring them."
  # Original: 什么？这是谁干的？
  tiny_enclave_event.6a: "What? Who did this?"
  # Original: 自从我们开始接触并赞助§H微型交易组织§!后，我们的关系越加亲近。最近，我们的境内出现了一支舰队，驾驶舱内留有一个字条：礼物\n纸条上有着§H微型交易组织§!的标志。
  tiny_enclave_event.501.desc: "Since we started sponsoring §HMicro Transaction Organization§!, relations closer... Fleet appeared with note: Gift"
  # Original: 这里是微型交易站，致力于服务小人。为什么不服务巨娘？毕竟巨娘要的资源太多了，我们没法承担。
  tiny_enclave_event.300.desc.TINY: "This is Micro Transaction Station, serving tiny people. Why not serve giantesses? Too many resources required."
  # Original: 我们想要一些服务。
  tiny_enclave_event.300.c: "We want some services."
  # Original: 好耶！
  tiny_enclave_event.501a: "Yay!"
  # Original: 拆了她
  tiny_enclave_event.310.b: "Dismantle her"
  # Original: 你知道有的堕落帝国会对一些他们看好的年轻国家开放数据库吧？其实，我们也保有这部分知识。如果你没有这部分知识，我们可以发给你们，只要1000£energy£能量币作为十年的使用费
  tiny_enclave_event.303.desc: "You know some fallen empires share data... we also have this knowledge. We can send it to you for 1000 Energy Credits."
  # Original: 你的外交评价不足，最少需要40点。
  tiny_enclave_event.300.d.opinion: "Your diplomatic weight is insufficient, at least 40 points required."
  # Original: 介绍一下你们自己。
  # Original: 赞助？那真是太感谢了，我们将会开放部分数据库，这将对你的生产和科技带来一定的好处。我们将收取您1000£energy£能量币作为十年的赞助费，您看如何？
  tiny_enclave_event.301.desc.TINY: "Sponsorship? Much appreciated. We will open part of our database, benefiting your production and tech. We charge 1000 Energy Credits for ten years, how about it?"
  # Original: 我们没有这项特别的服务了
  tiny_enclave_event.300.e.opinion: "We don't have this special service anymore"
  # Original: 我们想要一些特别的服务。
  tiny_enclave_event.300.d: "We want some special services."
