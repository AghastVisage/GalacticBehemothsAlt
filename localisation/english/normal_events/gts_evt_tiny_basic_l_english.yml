l_english:
  # Original: 随他们去吧，咕咕。
  tiny_enclave_event.502: "Let them be, coo."
  # Original: 你确定这是清洁用机器人？
  tiny_enclave_event.309.a: "Are you sure this is a cleaning robot?"
  # Original: 我想赞助你们的工作。
  tiny_enclave_event.300.b: "I want to sponsor your work."
  # Original: 终于完了，希望报酬足够
  tiny_enclave_event.308.a: "Finally done, hope the payment is enough"
  # Original: 白忙活一场。
  tiny_enclave_event.5a: "Worked for nothing."
  # Original: 一个机器人而已，没问题。
  tiny_enclave_event.304.b: "Just a robot, no problem."
  # Original: 很显然，喷洒乳汁并不是最终目的。果然，少女又说出了新的指令。\n\"清洁液喷洒完成，开始涂抹消毒液并进行吸尘清洁。\"\n紧接着少女脱下了裤子，露出了粉嫩的蜜穴。紧接着，少女的蜜穴紧紧的贴在了城市的废墟上面，开始了前后挪动。随着一声声清脆的呻吟，城市废墟要么被少女的阴毛抹去，要么被吸入少女的蜜穴，消失在无边的肉色之中。少女的动作越来越快，呼吸越来越沉重，呻吟越来越大声，最终，随着一阵响亮的尖叫，粘稠的爱液海填满了之前废墟遗留的空地，与乳汁混合在了一起。
  tiny_enclave_event.307.desc: "Obviously, spraying milk was not the ultimate goal. Sure enough, the girl spoke a new command.\n\"Cleaning fluid spraying complete, start applying disinfectant and vacuum cleaning.\"\nImmediately after, the girl took off her pants, revealing her pink and tender honey pot. Then, the girl's honey pot pressed tightly against the city ruins and began moving back and forth. With crisp moans, the city ruins were either wiped away by the girl's pubic hair or sucked into the girl's honey pot, disappearing into the boundless flesh color. The girl's movements became faster and faster, her breathing heavier, her moans louder. Finally, with a loud scream, sticky love fluid filled the empty space left by the ruins, mixing with the milk."
  # Original: 今天对于§H[Root.GetName]§!来说本来是平静的一天。不过，作为协助§H微型交易组织§!以放置机器人的地点注定不会平静。蓝色的天空瞬间被阴影填满，紧接着一双巨足踩下，瞬间将城市踩碎。这是一位少女型机器人。\n\"A-3桌面清理型清洁机器人到达位置，请主人下令。\"\n我们急忙尝试联系少女，但是不知道是因为机器人过于老旧还是因为我们过于渺小，一切通信均无法得到回应。\n\"未获得回应，自动清洁模式启动，开始评估清洁范围。\"\n突然，踩碎我们城市的巨大双脚开始了走动，连带的踩碎了我们的数个城市。数百万人被踩成红点，与城市废墟混合，粘在这双巨足之下。本来在§H[Root.GetName]§!上建立了繁荣都市的人们，如今和他们的城市一同如垃圾一样被少女踩踏着。这颗星球的人们因为过于渺小的体型而无法被判断为知性生命体，而是被判断为了需要清理的灰尘，只是因为他们太小了，小到可以轻松的被巨大的双脚所覆盖，轻易的被这双脚所蹂躏。很快，§H[Root.GetName]§!的城市已被少女完全蹂躏，所有的建筑全部化为废墟，只有少数人幸存在废墟中。
  tiny_enclave_event.305.desc: "Today was supposed to be a calm day for §H[Root.GetName]§!. However, serving as a location for assisting the §HMicro Transaction Organization§! to place robots was destined not to be peaceful. The blue sky was instantly filled with shadows, followed by a pair of giant feet stepping down, instantly crushing the city. It was a girl-type robot.\n\"A-3 Desktop Cleaning Robot arrived at position, asking master for orders.\"\nWe scrambled to try to contact the girl, but whether it was because the robot was too old or because we were too tiny, no communication received any response.\n\"No response received, automatic cleaning mode started, evaluating cleaning range.\"\nSuddenly, the giant feet that crushed our city began to walk, crushing several more of our cities along with it. Millions of people were trampled into red spots, mixed with city ruins, sticking under these giant feet. People who had built prosperous cities on §H[Root.GetName]§! were now trampled by the girl like garbage along with their cities. The people of this planet were judged not as intelligent life forms due to their overly tiny size, but as dust needing cleaning, simply because they were too small—small enough to be easily covered by giant feet, easily ravaged by these feet. Soon, the cities of §H[Root.GetName]§! were completely ravaged by the girl, all buildings turned to ruins, with only a few survivors in the rubble."
  # Original: 你的外交评价不足，最少需要20点。
  tiny_enclave_event.300.c.opinion: "Your diplomatic weight is insufficient, at least 20 points required."
  # Original: 你好，来访者，这里是微型交易站，我们致力于为全银河小人提供优质的服务，我们欢迎任何小人使用我们的服务，如有需求，请联系我们进行详谈。
  tiny_enclave_event.21.desc.TINY: "Hello, visitor. This is the Micro Transaction Station. We are dedicated to providing high-quality services to tiny people across the galaxy. We welcome any tiny person to use our services. If you have needs, please contact us for details."
  # Original: 接下来的十年也请继续。
  tiny_enclave_event.302.a: "Please continue for the next ten years."
  # Original: 白忙活一场。
  tiny_enclave_event.5b: "Worked for nothing."
  # Original: 我们下次再聊。
  tiny_enclave_event.exit: "Let's talk next time."
  # Original: 准备救援
  tiny_enclave_event.306.a: "Prepare for rescue"
  # Original: 听起来是有点危险，那你们要这个干什么？毕竟只是个清洁机器。
  tiny_enclave_event.304.c: "Sounds a bit dangerous, why do you want this? It's just a cleaning machine after all."
  # Original: 我不想再看见她，你们自己处理吧
  tiny_enclave_event.310.d: "I don't want to see her again, handle it yourselves"
  # Original: 我们收到§H微型交易组织§!发来的信息，他们说他们的一个空间站被摧毁了，所以近期的项目和支持工作可能会受到影响。
  tiny_enclave_event.6a.desc: "We received a message from the §HMicro Transaction Organization§!. They said one of their space stations was destroyed, so recent projects and support work might be affected."
  # Original: 准备重建
  tiny_enclave_event.307.a: "Prepare to rebuild"
  # Original: 自慰完的少女停在了原地，似乎在休息，而我们则紧紧的盯着她，不知道她的下一步会做什么。\n\"清洁程序完成，最后执行烘干程序。\"\n看来终于要结束了，我们的心终于放了下来。但是，少女并没有穿上衣服，而是将肛门对准了地下。\n\"空气清新剂开始填充\"\n随着少女的话语，菊穴开始蠕动，仿佛想要张开大口吞食一切的噬天巨兽，又或者是巨兽的巢穴，要将恐怖的巨兽释放出来。\n\"空气清新剂填充完成，开始释放。\"\n伴随着足以震动大地的巨大的轰鸣声，少女放屁了。在巨大的轰鸣声中，爱液海被吹出一个空洞，汹涌的爱液和乳汁淹没了其他地方。\n\"烘干失败，推测为气体不足，开始释放更多气体。\"\n随着少女的话语，轰鸣再度响起，少女的屁一个接着一个，即使城市还是完整的，也不可能在这屁的袭击下幸存下来。从少女体内释放的毒气迅速的充满了大气层，并且覆盖了整个星球。还在爱液和乳汁中挣扎的人们，如今又受到毒气的侵蚀，沦为了只会对着巨娘发情的虫子。\n\"烘干失败，放弃烘干，等待清洁液自动干燥。没有检测到有害物质与害虫，清洁完成，等待下一步指令。\"\n少女说完，停在原地不再移动。直到一个信息被她接收，她才飞往宇宙。经调查，那个信号来自§H微型交易组织§!。
  tiny_enclave_event.308.desc: "The girl who finished masturbating stopped in place, seeming to rest, while we stared at her closely, not knowing what she would do next.\n\"Cleaning program complete, finally executing drying program.\"\nIt seemed it was finally over, our hearts finally settled down. However, the girl didn't put on clothes, but aimed her anus at the ground.\n\"Air freshener filling started\"\nWith the girl's words, the chrysanthemum began to wiggle, as if a sky-devouring giant beast wanted to open its mouth to swallow everything, or a lair of a giant beast about to release a terrifying monster.\n\"Air freshener filling complete, start release.\"\nAccompanied by a huge roar loud enough to shake the earth, the girl farted. In the huge roar, a hollow was blown out of the love fluid sea, and surging love fluid and milk drowned other places.\n\"Drying failed, speculated insufficient gas, start releasing more gas.\"\nWith the girl's words, roars sounded again. The girl farted one after another. Even if the city was intact, it couldn't survive under this fart attack. The toxic gas released from the girl's body quickly filled the atmosphere and covered the entire planet. People still struggling in love fluid and milk were now eroded by poisonous gas, reduced to bugs that could only be in heat towards giantesses.\n\"Drying failed, abandon drying, wait for cleaning fluid to dry automatically. No harmful substances and pests detected, cleaning complete, waiting for next instruction.\"\nThe girl finished speaking and stopped moving. Until a message was received by her, she flew into the universe. Investigation showed that signal came from the §HMicro Transaction Organization§!."
  # Original: 该服务仅对小人开放。
  tiny_enclave_event.300.d.opinion.GTS: "This service is only open to tiny people."
  # Original: 我们突然收到一个从未接受过的通讯信号，因为我们的科学家差点吃掉他们的飞地。他们自称为§H微型交易组织§!，是否要接入信号？
  tiny_enclave_common.2000.desc.GTS: "We suddenly received a communication signal we have never received before. Because our scientists almost ate their enclave. They call themselves the §HMicro Transaction Organization§!. Do you want to connect the signal?"
  # Original: 介绍一下你们自己。
  tiny_enclave_event.300.a: "I want to buy some services."
  # Original: 是什么样子的机器人。
  tiny_enclave_event.304.a: "This thing can clean the whole planet? Are you kidding?"
  # Original: 终于，少女停下来了。看来所谓的\"清洁\"已经完成了。正当我们这么想时，少女又说出了新的指令。\n\"清扫范围确认，灰尘过多，开始喷洒清洁液。\"\n少女说着，脸红着脱下了上衣，露出了白皙的胸部，这胸部圆润而挺拔，仅仅只是乳头就大到可以建造一座新的城市。但是，少女露出胸部显然不是为了让人欣赏的。她的双手揉捏起那对沉甸甸的乳房，她圆挺的胸部对准了城市的废墟，紧接着，乳白而甘甜的乳汁倾泻而下,一股香醇浓郁的奶香顿时弥漫开来。在这乳汁的喷射之下,§H[Root.GetName]§!的城市很快就被一片乳白色的浪潮所完全吞噬。
  tiny_enclave_event.306.desc: "As expected, the robot ignored our refusal. The communication channel only came with a cold chaotic sound, as if mocking our powerlessness.\n\"Target lock confirmed, start cleaning.\"\nThe girl's voice sounded again, without any emotion. Then, she raised her giant foot and stomped heavily towards a city on §H[Root.GetName]§!. In the earth-shaking tremor, the city was instantly flattened, countless lives vanished in an instant. The girl didn't stop, she walked on the planet's surface, every step accompanied by the destruction of a city. Her movement was so elegant, like dancing, but under her feet were endless death and destruction."
  # Original: 报酬已发送，请签收。对了，那个机器人你想怎么处理
  tiny_enclave_event.310.desc: "The girl who finished cleaning seemed not satisfied yet. She found a huge lake on §H[Root.GetName]§!, then squatted down, aiming her mesmerizing anus at the lake.\n\"Start releasing cleaning fluid\"\nAccompanied by the girl's order, a huge water column sprayed out from her anus, rushing straight into the lake. The lake water was instantly dyed white, and the water level rose rapidly, quickly submerging the surrounding cities. The girl's expression was very enjoyable, it seems this excretion brought her great pleasure. The people on §H[Root.GetName]§! looked at the white flood falling from the sky in despair, that was the girl's excrement, but for them, it was an irresistible natural disaster."
  # Original: 你有什么建议吗？
  tiny_enclave_event.310.a: "Help"
  # Original: 成交。
  tiny_enclave_event.301.a: "Deal."
  # Original: 赞助？那真是太感谢了，虽然我们没有足够的资源作为回报，但是我们也有着许多取悦巨娘的方法。我们将收取您1000£energy£能量币作为十年的赞助费，您看如何？
  tiny_enclave_event.301.desc.GTS: "Sponsorship? That's really appreciated. Although we don't have enough resources as return, we have many ways to please giantesses. We will charge you 1000£energy£Energy Credits as a ten-year sponsorship fee, how about it?"
  # Original: 不用了，多谢。
  tiny_enclave_event.302.b: "No thanks."
  # Original: （由于我们攻击了它们，它们没有接受我们的通信请求。）
  tiny_enclave_event.40.desc: "(Because we attacked them, they did not accept our communication request.)"
  # Original: 我想了解一下其他服务。

  tiny_enclave_event.back: "I want to know about other services."
  # Original: 随他们去吧，咕咕。
  # Original: 你确定这是清洁用机器人？
  # Original: 我想赞助你们的工作。
  # Original: 终于完了，希望报酬足够
