  tiny_enclave_event.305.a: "Estimation error"
  # Original: 有个舰娘也是不错的
  tiny_enclave_event.310.c: "Having a shipgirl is nice too"
  # Original: 是什么古董东西让你想去招惹这种东西的？
  tiny_enclave_event.309.b: "What antique made you provoke this thing?"
  # Original: 我们要了
  tiny_enclave_event.303.a: "We'll take it"
  # Original: 我们已经摧毁了§H微型交易组织§!的所有空间站，但我们仍然一无所获。
  tiny_enclave_event.5b.desc: "We destroyed all §HMicro Transaction Organization§! stations, but found nothing."
  # Original: 可悲。
  tiny_enclave_event.6b: "Pathetic."
  # Original: 我们突然收到一个从未接受过的通讯信号，他们好像非常了解我们的语言。他们自称为§H微型交易组织§!，是否要接入信号？
  tiny_enclave_common.2000.desc.TINY: "Received unknown signal... call themselves §HMicro Transaction Organization§!... Connect?"
  # Original: 我们刚刚摧毁了§H微型交易组织§!的其中一个空间站，他们撤走了其中的所有资源和人员。我们没有在空间站的残骸中找到任何有用的信息或是资源，这很可惜。
  tiny_enclave_event.5a.desc: "Destroyed one station... found nothing useful..."
  # Original: 在上次的大摸鱼事件之后，我们的民众似乎已经喜欢上了这种“自由的生活”，他们对自由的需求愈发迫切！又发生了新的大摸鱼事件！
  tiny_enclave_event.502.desc: "After the last Great Slacking event... people love \"free life\"... new Great Slacking event happened!"
  # Original: 终于，少女停下来了。看来所谓的\"清洁\"已经完成了。正当我们这么想时，少女又说出了新的指令。\n\"清扫范围确认，灰尘过多，开始喷洒清洁液。\"\n少女说着，脸红着脱下了上衣，露出了白皙的胸部，这胸部圆润而挺拔，仅仅只是乳头就大到可以建造一座新的城市。但是，少女露出胸部显然不是为了让人欣赏的。她的双手揉捏起那对沉甸甸的乳房，她圆挺的胸部对准了城市的废墟，紧接着，乳白而甘甜的乳汁倾泻而下,一股香醇浓郁的奶香顿时弥漫开来。在这乳汁的喷射之下,§H[Root.GetName]§!的城市很快就被一片乳白色的浪潮所完全吞噬。
  # Original: 报酬已发送，请签收。对了，那个机器人你想怎么处理
  # Original: 关闭通信。
  tiny_enclave_event.40: "Close communication."
  # Original: 你有什么建议吗？
  # Original: 如果没法提供服务，那么小人本身也可以当作一种服务嘛~
  tiny_enclave_event.21.a.GTS: "If can't provide service, tiny people can be a service~"
  # Original: 其实···我们发现了一个古老的机器人，如果你可以协助调查的话，我们会给予奖励。
  tiny_enclave_event.304.desc: "Actually... we found an ancient robot, reward for investigation."
  # Original: 您十年前对我们进行的赞助已经到期，需要续费继续获得优先服务和外交支持吗？
  tiny_enclave_event.302.desc: "Sponsorship expired, renew?"
  # Original: 好的，我们干了。
  tiny_enclave_event.304.d: "Okay, we'll do it."
  # Original: 收取报酬
  tiny_enclave_event.309.c: "Collect reward"
  # Original: 你、你好，这里是微型交易站，这位顾客，请随便看看......等等，客人，那个也是顾客，不是商品！
  tiny_enclave_event.300.desc.GTS: "Hello, Micro Transaction Station... wait, that's a customer, not merchandise!"
  # Original: 抱歉，破解防火墙花费了太多时间。不愧是巨娘，一个老古董机器人的防火墙都那么强大。对于这次造成的破坏我们很抱歉，我们会给予补偿的。
  tiny_enclave_event.309.desc: "Sorry, firewall cracking took too long... giantess firewall strong... compensation provided."
  # Original: 为什么巨娘会出现在这里？抱歉，这里是微型交易站，我们提供的是面向小人的服务，恐怕无法满足巨娘的需求。
  tiny_enclave_event.21.desc.GTS: "Why giantess here? We serve tiny people, can't satisfy giantess."
  # Original: 成交。
  # Original: 赞助？那真是太感谢了，虽然我们没有足够的资源作为回报，但是我们也有着许多取悦巨娘的方法。我们将收取您1000£energy£能量币作为十年的赞助费，您看如何？
  # Original: 不用了，多谢。
  # Original: （由于我们攻击了它们，它们没有接受我们的通信请求。）
  # Original: 我想了解一下其他服务。
  # Original: 小人空间站-核心区段
  Tiny_station_enclave_curator_01_key: "Tiny Station - Core Section"
  # Original: §H微型交易组织§!
  gov_tiny_enclave: "§HTiny Trading Organization§!"
  # Original: 一个致力于与小人交易的飞地组织。
  gov_tiny_enclave_desc: "An enclave organization dedicated to trading with tiny people."
  # Original: 微缩交易师
  tiny_enclave_default_ruler_title: "Miniature Trader"
  # Original: 十分渺小的交易人员，通常会被巨娘忽视
  tiny_enclave_default_ruler_title_test: "Very tiny trading personnel, usually ignored by giantesses"
  # Original: 奇怪的通讯
  tiny_enclave_common.2000.title: "Strange Communication"
  # Original: 微型交易站
  tiny_enclave_event.21.title: "Tiny Trading Station"
  # Original: 微型交易站
  tiny_enclave_event.title: "Tiny Trading Station"
  # Original: 我们是§H微型交易组织§!，我们的服务主要提供科技或资源支持，不过因为巨娘所需资源过多，所以大多数都是对小人开放的。不过为了避免交易站被巨娘直接摧毁，所以也有对巨娘开放的服务。那么你需要什么服务？
  tiny_enclave_event.300.a.reply: "We are the §HTiny Trading Organization§!. Our services mainly provide technology or resource support. However, since giantesses require too many resources, most services are open to tiny people. But to avoid the trading station being directly destroyed by giantesses, there are also services open to giantesses. So what service do you need?"
  # Original: 赞助微型交易站
  tiny_enclave_gts_patron: "Sponsor Tiny Trading Station"
  # Original: 微型交易站飞地的资源实在入不了眼——不过他们掌握的取悦巨娘的方法真是不错。
  tiny_enclave_gts_patron_desc: "The resources of the Tiny Trading Station enclave are really not worth looking at - but their methods of pleasing giantesses are really good."
  # Original: 赞助微型交易站
  tiny_enclave_tiny_patron: "Sponsor Tiny Trading Station"
  # Original: 微型交易站飞地提供给我们了一些生产帮助和科技资料——甚至包括了许多别的平行世界才存在的技术。
  tiny_enclave_tiny_patron_desc: "The Tiny Trading Station enclave provided us with some production assistance and technical data - even including technologies that only exist in other parallel worlds."
  # Original: 感谢您的赞助，那么，服务开始。
  tiny_enclave_event.301.a.reply: "Thank you for your sponsorship. Then, service begins."
  # Original: 非常好，那祝我们合作愉快。
  tiny_enclave_event.302.a.reply: "Very good, then I wish us a happy cooperation."
  # Original: 我们又发现了一个古老的机器人，不过大概没有新的东西了。
  tiny_enclave_event.304.desc.END: "We found another ancient robot, but probably nothing new."
  # Original: 按照说明书上写的，是小型清洁用机器人。
  tiny_enclave_event.304.a.reply: "According to the manual, it is a small cleaning robot."
  # Original: 没那么简单。这个机器人是从巨娘帝国弄到的，小型也是相当于巨娘来说的，本身包裹已经大到空间站也放不下，所以我们才需要协助。而且为了弄清楚她的工作原理，必须进行开机测试，不确定会不会产生影响，毕竟巨娘的东西功率都比较大。
  tiny_enclave_event.304.b.reply: "It's not that simple. This robot was obtained from the Giantess Empire. Small is also relative to giantesses. The package itself is too large for the space station to hold, so we need assistance. And in order to figure out how she works, we must perform a startup test. Unsure if it will have an impact, after all, the power of giantess items is relatively high."
  # Original: 这不是普通的清洁机器，这是古老到堕落帝国都觉得老旧的清洁机器。如果不是那个巨娘家里已经堆得下不了脚了，我们也不可能买到这个。要知道，即使是堕落帝国也有相当多的失落科技，通过这个，我们可以发掘一二。
  tiny_enclave_event.304.c.reply: "This is no ordinary cleaning machine. It is a cleaning machine so ancient that even Fallen Empires think it is old. If it weren't for that giantess's home being so piled up that there was no place to step, we wouldn't have been able to buy this. You know, even Fallen Empires have quite a lot of lost technology. Through this, we can discover a thing or two."
  # Original: 清洁机器人踩踏
  tiny_enclave_event.305.name: "Cleaning Robot Trample"
  # Original: 我也想要被踩
  tiny_enclave_event.305.b: "I want to be stepped on too"
  # Original: 清洁机器人乳喷
  tiny_enclave_event.306.name: "Cleaning Robot Milk Spray"
  # Original: 这不得去喝一口
  tiny_enclave_event.306.b: "Don't I have to take a sip"
  # Original: 清洁机器人蹂躏
  tiny_enclave_event.307.name: "Cleaning Robot Ravage"
  # Original: 至福
  tiny_enclave_event.307.b: "Bliss"
  # Original: 清洁机器人放屁
  tiny_enclave_event.308.name: "Cleaning Robot Fart"
  # Original: 还要再来一次！
  tiny_enclave_event.308.b: "One more time!"
  # Original: 说明书上是这么说的，\"杀菌除虫，你的好伙伴\"。大概是没法把小人和害虫区分吧。不过看你星球的情况，可能是当成灰尘了？
  tiny_enclave_event.309.a.reply: "The manual says so, \"Sterilization and insect removal, your good partner\". Probably can't distinguish between tiny people and pests. But looking at your planet's situation, maybe it was treated as dust?"
  # Original: 我看资料上写的是'$ai_strength$'，总之，我们已经在研究了，下次赞助大概可以一同提供。
  tiny_enclave_event.309.b.reply: "I see the data says '$ai_strength$'. Anyway, we are already researching it. Next sponsorship can probably provide it together."
  # Original: 我们可以拆解掉那个机器人，这样可以获得大量合金，并且可以使用她的处理芯片，不过大概只能使用一年了。或者我们可以改写她的程序，让她成为一个舰娘。
  tiny_enclave_event.310.a.reply: "We can dismantling that robot to get a lot of alloys, and use her processing chip, but it can probably only be used for a year. Or we can rewrite her program and make her a shipgirl."
