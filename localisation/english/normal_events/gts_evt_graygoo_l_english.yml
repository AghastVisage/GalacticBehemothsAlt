  gts_evt_graygoo.41.desc: "Feeling her ever-more comfortable body size, the buildings that were originally the same height as Little Grey were now only the size of her toes, not even comparable to the soles of her boots. Looking at the spire that was higher than the other buildings in the distance, Little Grey slowly walked over. Through the horrified expressions of the small people below, she exposed her tender 'honey hole'.  A few drops of love juice fell as if to celebrate the following pleasure. The pink flesh wall fell slowly and consumed the top of the red spire. More and more love juice flowed down along the steel reinforcement bars. The pink flesh hole completely wrapped the spire and turned it into a useless piece of metal after squeezing down on it.  Little Grey was now sitting in the middle of the city, currently thinking about how to have fun next.  She glimpsed a few black dots in the distance. Some time later, the army had finally arrived!   But they were only going to provide some seasonings for the following entertainment. Ground forces poured firepower on the boots, and after the rolling smoke had cleared away, they could see Little Grey impatiently lift her foot above the army and then slam it down hard. A large part of the army had been instantly killed or wounded. Little Grey pressed her foot down and rubbed it on the ground several times, and looking at the scattered army, she slowly took off her boots, and threw them towards the army, completely cutting off their retreat. Even the small number of people who had luckily survived would still fall unconscious in the constant foul odor that was being emitted from the opening of the shoe. The planes had finally arrived above Little Grey and began to attack. Feeling her back itching, Little Grey impatiently lifted her head. The small people thought that Little Grey couldn't do anything to them and started cheering, waiting for the final support from the space fleet.\n\n'I can use flying artillery to