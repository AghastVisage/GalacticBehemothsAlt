  # $gts_evt_graygoo.41.desc$\n\n小灰在商场不远处停了下来，俯下身子，观察着这片繁荣的商业区，似乎是玩具符合要求，小灰将手掌放在了商场两侧，胸前的白色巨物也展现出来，在小人惊慌的眼神中，白色的天空向着他们坠落，来自各个星球的贵重商品被平等的碾碎，与小人一并埋没在百米深的乳香盆地中，小灰的胸部完全接触到地面，建筑的崩塌不断刺激着小灰，胸部不断前移，如同压路机般年随着沿途的一切，不出几秒便将这片繁华的商业区化为虚无，只剩下几个手印与充满奶香的巨大盆地
  gts_evt_graygoo.41.desc.normal: "$gts_evt_graygoo.41.desc$\n\nLittle Grey stopped not far from the mall, and she leaned over to examine the bustling business district, it seemed it were toys that met her requirements. Little Grey placed her palms on both sides of the shopping mall, and the white giants on her chest were also displayed. In the panicked eyes of the small people, the white sky was falling towards them. Valuable goods from various planets were crushed equally, and were buried under the hundred-meter deep milky scented basin along with the small people. Little Grey's breast completely touched the ground, and the collapse of the buildings was constantly stimulating Little Grey. Her breasts kept moving forward, crushing everything it was along the way like a road roller. In just a few seconds, this prosperous commercial district had been turned into nothing, and only several handprints and a huge basin filled with milk smell were left behind."
