  # 「你们这样没用的存在，不如成为我的一部分吧」\n\n无数的纳米机器从小灰身体上分离，将星球完全地包裹起来，天空已被灰色取代，而更多的灰蛊还在不断地到来，剩余抵抗军地任何武器都无法对灰蛊产生作用，反而为其复制提供了能量，唯一有希望造成伤害的战舰也被天体级的小灰轻松抹去，灰蛊顷刻便覆盖了星球表面的所有物体，坚固的合金被分解，广阔的海洋被取代，全部化为了灰蛊复制的原料\n\n灰蛊继续向下深入，坚硬的岩石也不过片刻就被分解，高温的熔岩释放出的能量理论上会起到保护作用，但灰蛊却将其吸收进一步加快了复制，液态的地幔被迅速摧毁，灰蛊已然抵达了星球的核心—地核，数亿年的累计使其拥有极高的密度，但对于灰蛊而言不过几次接触，便将地核的一部分分解，星球的心脏也成为了灰蛊成长的养料，化为了小灰的一部分\n\n这颗星球彻底成为了纳米星球，表面如海洋般游动的纳米机器如同拥有生命，不断变化的大气与地貌处在极不稳定的状态，不再适合任何生命居住，哪怕是坚硬的合金也会在纳米机器的作用下分解，真正的生命地狱恐怕也不过如此......
  gts_evt_graygoo.43.desc: "'Useless existences like you all should become part of me.'\n\nCountless nanomachines separated from Little Grey's body and completely enveloped the planet. The sky was replaced by gray, and even more Grey Goo kept arriving. The weapons of the remaining resistance forces could not affect the Grey Goo, but instead, provided energy for the replication of it. The only warships that had a chance of causing damage were also easily erased by the celestial Little Grey. Grey Goo instantly covered everything on the planet's surface. The hardened alloy was decomposed, and the vast ocean was replaced. Everything was turned into raw material for Grey Goo replication.\n\nThe Grey Goo continued the destruction deeper and deeper. Even the hard rock was decomposed in just a moment. The energy released by the hot magma would theoretically protect against the destruction, but the Grey Goo instead absorbed it and further accelerated its self replication. The liquid mantle was quickly destroyed, and the Grey Goo had already reached the core of the planet - the core of the earth, which had a very high density due to hundreds of millions of years of accumulation. However for the Grey Goo, it was only a few moments of contact before they decomposed part of the core. The heart of the planet became nourishment for the Grey Goo's growth, and became a part of Little Grey. \n\nThis planet has become a nano planet; the nanomachines that flow like the sea appeared to have a life of their own, and the constantly changing atmosphere and terrain was in an extremely unstable state, no longer suitable for any life to inhabit. Even hardened alloy would decompose under the effect of the nanomachines. The true hell on earth was nothing more than this......"
