  # 「这样可不行啊，还要好久才能完全消灭小人呢，看来还是要变大一些」\n\n白色的足指愈发巨大，将破碎的城市彻底碾成齑粉，白丝小脚只需几下，便可将城市彻底碾碎，轻易地改变千万年来不变的地貌，就连最高的山峰也只能匍匐在小灰的脚下，在不经意中被碾入地底，在轻易摧毁了数个城市后，小灰走到了海边，沿途又摧毁了数个小型的城市，在海边的一处城市坐了下来，丰盈的臀部挤压着土地，形成了新的山脉，包裹着白色丝袜的腿部伸展开来，由于长时间的踩踏，足底沾满了城市的残骸与泥土，与足汗混合在一起，形成了大片的云雾\n\n「就用海洋来清洗一下吧，大家一定不会介意的吧」\n\n白丝小脚放入海中，瞬间便吸收了大量的海水，随着小灰的不断揉搓，泥土从白丝上脱落，随着城市残骸沉入海底，原本清澈的海水变得浑浊，充满了酸臭的汗味\n\n「既然还有人不愿意投降，就直接进行最后的处决吧」\n\n小灰站在星球的表面，轻轻一跃便摆脱了引力，在宇宙之中恢复了天体级的姿态，要怎么处理这颗小小的星球呢？
  gts_evt_graygoo.42.desc: "'This is no good, it will still take a long time to exterminate the small people like this. It seems I have to grow a bit more.'\n\nThe white toes grew increasingly larger, and the shattered city was completely ground into powder. Her small white silk feet can destroy a city entirely in just a few steps and easily change the terrain, which has not changed for a million years. Even the highest mountains were forced to lay prostrate under Little Grey's feet, and were crushed under the ground. When carelessly crushing several cities, Little Grey had walked to the sea. She destroyed several small towns along the way. Once she reached the sea, she sat down in a small city. Her ample buttocks squished against the land, forming a new mountain range. Her legs covered with white silk stretched out. Because of the long period of being trampled, her soles were covered with city wreckage and mud. By mixing it with her foot sweat large clouds of mist were formed. \n\n'Let's use the ocean to clean a bit. I'm sure no one will mind, right?'\n\nHer white silk feet were placed into the ocean and instantly absorbed a large quantity of seawater. As Little Grey kept rubbing, the dirt came off of the white silk along with the city wreckage sinking to the seabed. The originally clear seawater became a cloudy mess, filled with the acidic smell of sweat.\n\n'Since there are still people who are not willing to surrender, let's just go directly to the final execution.'\n\nLittle Grey stood on the surface of the planet and a light leap was enough for her to break free of gravity. And in space, she restored her celestial size. How should she handle this tiny planet?"
