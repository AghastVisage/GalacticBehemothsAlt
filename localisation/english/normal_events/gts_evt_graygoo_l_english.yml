  gts_evt_graygoo.40.desc: "Little Grey appeared on the invaded planet at 10 times her size. A few small people hadn't yet understood what was happening before being crushed under her huge boots. Cracks began to appear in the streets, and small people cursed the inactive army, crazily looking for transportation, causing many traffic accidents and making escape even more difficult. This city was one of the most prosperous metropolises on the planet, and the density and number of buildings far exceeded other regions, forming a vast urban area. Understandably, it became Little Grey's top priority, and she began her planetary invasion here.\n\nLittle Grey's massive body began to move, completely ignoring the situation of the small people underfoot. Each time her boots landed, they left behind bloody shoeprints in the crowded streets. Little Grey, as if taking a stroll, easily and pleasurably enjoyed the prosperity of the city, and she was completely unconcerned by the cruel slaughter beneath her feet.  More and more small people had hidden in the shops along the road, hoping that Little Grey would not find them, When the sound of footsteps gradually stopped, the small people who had finally started to relax looked out the door, only for a pair of azure eyes to look back at them from under the glass door. The small people suddenly panicked and ran aimlessly, even rushing out of the shop, and were crushed into the street by the blood-stained soles of Little Grey's white silk boots while in terror.\n\n'So many people are hiding inside; I can't let them go.'\n\nAfter stepping on a few small people that rushed out, Little Grey pressed her boots against the glass door, and cracks immediately appeared all over the original smooth glass. \n\n'Ah this is just a right size. Goodbye little people inside.'\n\nThe black boots easily broke through the resistance and crushed the small people in the shop together with all of the merchandise. \n\nThe grey mist gradually approached Little Grey. The small people who were in the high-rise buildings watched Little Grey gradually become larger, eventually towering over the top of the building. \n\n'This is just about the right size.'\n\nLittle Grey stretched out her arms lazily, showing off her beautiful body curves to the small people in the sunlight. The imprint of her deep footprints had sunk into the road surface. More and more small people were panicking and had become decoration in the bloodied shoe sole, A vehicle full of small people attracted Little Grey's attention.  Her boots hung in the air above the vehicle, and the inside was instantly plunged into darkness. As the foot landed, the vehicle accelerated and burst out of the range of the sole of Little Grey's foot.  Little Grey only kept stepping on the vehicle as it moved. Countless numbers of small people were caught in the chase and became the filth on the bottom of Little Grey's feet. While the small people were rejoicing at having escaped the stomp, the vehicle suddenly crashed into a large black object. The small people fell to the ground, and looking up, they saw that Little Grey's little feet were blocking the road in front of them, preventing their escape. As usual, the other foot hovered in the air above the vehicle.  And there was no chance for the vehicle to drive out from underneath the sole of the foot now that it had been pressed into a piece of metal by her hard shoe.\n\n'They've gone quite far, haven't they?'\n\nLooking at the massive footprints that were left where the vehicle was chased and at the red dots that were once small people, Little Grey felt no remorse and instead began searching for new toys to continue her fun\n\n'Can the small people in the buildings over there see me?  Can I please touch you? ' Little Grey stretched out her fingers towards a glass building. The design that was originally for lighting and views gave the small people a full perspective of the giant body that was now towering in front of their eyes and it further intensified the small people's fear. The glass shattered as soon as her fingers touched the building.  The small people near the windows were also pierced by broken glass shards. Little Grey's fingers approached the slumped small people, and she gently put her fingers on them, but even her such gentle movement broke their body apart becoming tiny red dots on her fingertips.\n\n'Why are you so weak? You can't even let me play with you? You're truly useless.'\n\n"
