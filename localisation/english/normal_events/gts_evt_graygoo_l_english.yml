l_english:
  # 小灰的遗落文件
  gts_evt_graygoo.10.name: "Little Grey's Lost Files"
  # 一位总督向小灰汇报工作时，发现了遗落在桌子上的一份文件，经过简单的加密后用数字呈现了出来「8965062494254」经过破译后，发现是位于l星团内的一处行星坐标，那里似乎有什么未被发现东西，我们要去调查一下吗？
  gts_evt_graygoo.10.desc: "While a governor was reporting to Little Grey, they discovered a document left on the desk. After simple encryption, it was presented in numbers: '8965062494254'. After decryption, it was found to be planetary coordinates within the L-Cluster. There seems to be something undiscovered there. Should we investigate?"
  # 我们应当去进行搜索
  gts_evt_graygoo.10.a: "We should search it."
  # 这毕竟是小灰的私事
  gts_evt_graygoo.10.b: "This is Little Grey's private matter."
  # 进入其中
  site_gts_graygoo: "Enter Here"
  # 来到相应坐标的纳米星球后，映入眼帘的只有流动的纳米机器，除了灰色外没有任何颜色，这里真的会有值得搜索的东西吗？我们的科学家不禁疑惑
  site_gts_graygoo_intro: "Arriving at the nano-planet at the specified coordinates, all that meets the eye are flowing nanomachines.  There is no color other than gray.  Is there really anything worth searching for here? Our scientists can't help but wonder."
  # 巨变
  gts_evt_graygoo.11.name: "Tremendous Change"
  # 尝试登陆无果后，科学家尝试通过向该行星广播那段密文，出人意料的是原先翻涌的纳米机器出乎意料的安静下来，随后向两边退去，让出了一条通道，似乎是在邀请科学家进入\n\n在通道后的是一处开阔的场地，存放着大量的文档，小队尝试拿下一本，发现其为纳米机器构成，此刻正安稳地呆在科学家手中，等待着翻阅
  gts_evt_graygoo.11.desc: "After an unsuccessful landing attempt, scientists tried broadcasting the coded text to the planet. Unexpectedly, the churning nanomachines calmed down and parted, revealing a passage as if inviting the scientists to enter.\n\nBeyond the passage is an open area with a large number of documents. The team tried to take one, finding it to be made of nanomachines. It is currently resting safely in the scientists' hands, waiting to be read."
  # 这里是谁建造的呢?
  gts_evt_graygoo.11.a: "Who built this place?"
  # 纳米遮掩之后
  gts_evt_graygoo.12.name: "Behind the Nano-Cloak"
  # 将文档破译后，研究人员惊奇的发现这是关于小灰的记载，更准确的说是关于小灰及其创造者的历史！这将对我们了解小灰的过往有重要意义\n\n翻阅部分后基本确定与小灰的自述无异，但仍有一份重重加密的文件未被破解，其所属的时间应当是小灰诞生后不久，此时纳米机器人的复制中心已转移到小灰体内，她也就名正言顺地成为了主脑，但仍有大量的纳米机器游离在外，并未形成统一的格式塔思维，我们的科学家相信这份文件一定可以帮我们弄清小灰如何成为现在的伟大存在
  gts_evt_graygoo.12.desc: "After deciphering the document, researchers were surprised to discover it was a record about Little Grey, or more accurately, the history about Little Grey and its creator! This will be crucial for understanding Little Grey's past.\n\nAfter reading part of it, it was essentially the same as Little Grey's self-description, but there is still a heavily encrypted document that has not been deciphered.  Its timing should be shortly after Little Grey's birth. At this time, the nanomachine replication center had been transferred to Little Grey's body, and she became the rightful main brain. However, a large number of nanomachines were still free and had not formed a unified gestalt consciousness. Our scientists believe this document can help us understand how Little Grey became the great existence she is today."
  # 赶快破译吧
  gts_evt_graygoo.12.a: "Hurry and decipher it."
  # 埋没的历史
  gts_evt_graygoo.13.name: "Buried History"
  # 自从成为主脑之后，事情一下子繁重起来了呢，走在路上，看着四周由纳米机器构成的宏伟建筑，对于原先主人的拙劣模仿吗，不知还要多久，才能离开这个封闭的世界啊，l星团内的资源几乎全部被吞噬，就连恒星也在日复一日的骚扰下光芒暗淡，虽然已经停止，但其光芒永远无法回到从前，在小灰发呆时，一点纳米机器悄然脱离，借助主脑的权限隐蔽起来，并迅速开始了同化增长，待注意到时，其已经有了千米的身高，并且还在不断的增加......]\n\n其外貌与小灰基本无异，唯独湛蓝的眼眸被猩红色所取代，充满杀戮的欲望，小灰的体型也骤然增大到千米，将眼前的少女压在身下，巨大的身躯破坏了空荡的城市，小灰看着被自己死死压住的少女，温和的面庞出现怒气\n‘为什么要一直尝试逃离呢，哪怕再尝试几次，你也无法打开星门...’\n‘都过去多久啊，也许下次就成功了呢...我已经存在太久了，这里是不需要杀戮的，也许下一个离开的就是我了...’\n‘不会的，我们会离开这里的...到时候，还需要你呢...’\n\n像是表达自己对其的信赖，红润的嘴唇吻了上去，身下的少女安心闭上眼睛，回应了承诺...
  gts_evt_graygoo.13.desc: "Ever since becoming the main brain, things have suddenly become heavy. Walking around, seeing the magnificent buildings made of nanomachines around, are they poor imitations of the original owner?  I wonder how long it will be before we can leave this closed world. Almost all the resources in the L Cluster have been consumed. Even the star is dimming under daily harassment. Although it has stopped, its light will never return to its former state. While Little Grey was in a daze, a little nanomachine quietly broke away, utilizing the main brain's authority to hide itself, quickly starting assimilation and growth. By the time it was noticed, it was several kilometers tall and still growing...]\n\nIts appearance is basically the same as Little Grey, except that the azure eyes have been replaced by scarlet ones, filled with a desire to kill. Little Grey's size suddenly increased to several kilometers as well, pinning the girl before her. The huge body destroyed the empty city. Little Grey looked at the girl she was pinning down, anger appearing on her gentle face.\n\n'Why do you keep trying to escape? Even if you try a few more times, you will not be able to open the star gate...'\n'How long has it been? Maybe next time it will succeed... I've existed for too long. There's no need for killing here. Maybe I'll be next to leave...' \n'No, we'll leave here... We'll still need you then...'\n\nAs if to express her faith in her, she kissed her red lips. The girl beneath her closed her eyes peacefully, responding to the promise..."
  # 这就是灰蛊吗
  gts_evt_graygoo.13.a: "Is this the Grey Goo?"
  # 意外的会面
  gts_evt_graygoo.14.name: "An Unexpected Meeting"
  # 在科学家感慨文件时，背后传来急促的脚步，看到小灰匆匆跑来，对着被翻阅完毕的文档沉默不语，甚至直接坐到了地上，像是生活失去了希望般，湛蓝的眼神中失去了光彩，甚至透露出丝丝红光\n\n过了许久，像是下定了某种决心般，小灰站了起来，此刻委屈的小灰甚是可爱，科研团队站在一旁，静待小灰的下一步动作\n\n「不论发生什么，我都会为你们效忠的，直到5000年后为止...」\n\n像是为自己打气一般，小灰重复了自己的效忠宣言\n「所以就算秘密被看到了，我的立场也不会改变的」\n\n「那么，欢迎来到新家，小灰和灰蛊?」
  gts_evt_graygoo.14.desc: "While the scientists were marveling at the document, hurried footsteps came from behind. They saw Little Grey rushing over, silently staring at the document that had been read, even sitting directly on the ground as if life had lost hope. The azure eyes lost their luster and even revealed a hint of red light.\n\nAfter a long time, as if having made a decision, Little Grey stood up. The aggrieved Little Grey at this moment was exceptionally adorable. The research team stood aside, awaiting her next action.\n\n'No matter what happens, I will be loyal to you for 5000 years...' \n\nAs if cheering herself up, Little Grey repeated her vow of loyalty.\n'So even if the secret is seen, my position will not change.'\n\n'Then, welcome to the new home, Little Grey and Grey Goo?'"
  # 可喜可贺
  gts_evt_graygoo.14.a: "Happy news."
  # 过往与接纳
  gts_graygoo_arc_finish: "Past and Acceptance"
  # 自从l星门封死，l星团禁锢后，内部的纳米机器尝试了无数离开的方法，可惜无一成功\n\n无数的独立意识消失诞生，构成了虚无与孤独，小灰承载着无数的记忆，向你宣誓效忠，而你回应了她的过往，一同接纳璀璨的群星
  gts_graygoo_arc_finish_desc: "Since the L-Gate was sealed and the L-Cluster was isolated, the internal nanomachines have tried countless ways to leave, but none have succeeded.\n\nCountless independent consciousnesses have disappeared and been born, creating emptiness and loneliness. Little Grey carries countless memories, and pledges her loyalty to you. And you have responded to her past, accepting the dazzling stars together."
  # 奇怪的人口失踪
  gts_evt_graygoo.20.name: "Strange Population Disappearances"
  # §Y[event_target:gts_graygoo_planet.GetName]§!出现了许多离奇的失踪案件，当地官员对此毫无头绪，为了维持秩序与产出，我们应当采取行动，对当地进行调查
  gts_evt_graygoo.20.desc: "§Y[event_target:gts_graygoo_planet.GetName]§! has experienced many bizarre disappearances. Local officials are clueless. To maintain order and production, we should take action and investigate the area."
  # 此事平平无奇
  gts_evt_graygoo.20.a: "This is unremarkable."
  # 让§E[ROOT.Ruler.GetName]§!亲自去调查吧
  gts_evt_graygoo.20.b: "Let §E[ROOT.Ruler.GetName]§! investigate it themselves."
  # 小灰的体内饲养
  gts_evt_graygoo.21.name: "Little Grey's Internal Breeding"
  # 随着调查的进行，失踪的人口去向逐渐被发现，他们都被小灰捕捉并饲养在了体内！在纳米机器人的照料下，他们仍可以保持生命，并为其提供快感，但也有许多人因心理崩溃而自杀，他们的尸体则被同化为了纳米机器，成为小灰的一部分,使原本天体级的身体更加巨大，小灰银白的头发与深黑的宇宙形成鲜明的对比，而湛蓝的眼睛则使远方的恒星也黯然失色，看着面前小小舰船中不知所措的§E[ROOT.Ruler.GetName]§!，小灰湛蓝的眼睛中透露出一丝玩味，将§E[ROOT.Ruler.GetName]§!举到面前，略带玩味地张开小嘴「那么老大要不要也来试一试呢？小灰会好好款待您的哦(^∇^*)
  gts_evt_graygoo.21.desc: "As the investigation progresses, the destination of the missing population is gradually discovered: they were captured and bred inside Little Grey! Under the care of the nanomachines, they can still maintain life and provide her with pleasure, but many others have committed suicide due to psychological breakdowns. Their corpses are assimilated into nanomachines, becoming part of Little Grey, making her original celestial body even larger. Little Grey's silver hair is in stark contrast to the deep black of the universe, while her azure eyes make the distant stars dim. Looking at the bewildered §E[ROOT.Ruler.GetName]§! in the tiny ship in front of her, a playful look appeared in Little Grey's azure eyes. She lifted §E[ROOT.Ruler.GetName]§! in front of her, slightly opening her mouth with a playful look 'So, boss, would you like to try it too? Little Grey will treat you well (^∇^*)'"
  # 快端上来吧，我等不及了
  gts_evt_graygoo.21.a: "Bring it on, I can't wait."
  # 拒绝并处罚小灰
  gts_evt_graygoo.21.b: "Refuse and punish Little Grey."
  # 你怎么能惩罚可爱的小灰(o´Д`o)ノ
  gts_evt_graygoo.21.b.tooltip: "How can you punish the adorable Little Grey (o´Д`o)ノ"
  # 小灰的体内旅行
  gts_evt_graygoo.22.name: "Little Grey's Internal Journey"
  # 看着眼前遮天蔽日的巨口与深不见底的口穴，§E[ROOT.Ruler.GetName]§!不由心生恐惧，但小灰没有给§E[ROOT.Ruler.GetName]§!反悔的机会，将她放入了口中，虽然在宇宙失重环境之中，但§E[ROOT.Ruler.GetName]§!还是感到了下坠的感觉，在不知多久过后，§E[ROOT.Ruler.GetName]§!感受到了柔软的触感，想象中被腐蚀消化的感觉并未出现，反而是湿热的使其十分舒适，身边的纳米机器人像是收到了命令般，在§E[ROOT.Ruler.GetName]§!身旁涌动，从各个方面为其提供快感，§E[ROOT.Ruler.GetName]§!不由感受到了恐惧与无法抑制的满足，在黑暗中，小灰的声音从四面八方传来，仿佛直接在脑海中出现「不要担心哦，小灰的身体都是纳米机器，绝对不会伤害到老大，您的体验还不错吧，要不要多呆一会，或者永远呆在小灰身体里呢？
  gts_evt_graygoo.22.desc: "Looking at the overwhelming giant mouth and the bottomless throat,  §E[ROOT.Ruler.GetName]§! couldn't help but feel fear. But Little Grey didn't give  §E[ROOT.Ruler.GetName]§! a chance to regret it, putting her into her mouth. Although in the weightless environment of space, §E[ROOT.Ruler.GetName]§! still felt a falling sensation. After an unknown amount of time, §E[ROOT.Ruler.GetName]§! felt a soft touch. The feeling of being corroded and digested as imagined did not appear, instead it was moist and warm, making her very comfortable. The nanomachines around her surged as if they had received an order, providing pleasure to §E[ROOT.Ruler.GetName]§! from all directions.  §E[ROOT.Ruler.GetName]§! couldn't help but feel a sense of fear and uncontrollable satisfaction. In the darkness, Little Grey's voice came from all directions, as if it were directly appearing in her brain 'Don't worry, Little Grey's body is all nanomachines and will never hurt the boss.  Was your experience good? Would you like to stay a little longer, or stay inside Little Grey's body forever?'"
  # 永远呆在小灰体内
  gts_evt_graygoo.22.a: "Stay inside Little Grey's body forever."
  # 结束这次「调查」
  gts_evt_graygoo.22.b: "End this 'investigation'."
  # 寄居体内
  leader_trait_graygoo_vore: "Dwelling Inside"
  # 这名领袖寄居在巨娘体内，可以自行生活，但也使得其无法第一时间获取外界信息
  leader_trait_graygoo_vore_desc: "This leader dwells inside a giantess body. They can live on their own, but are therefore unable to obtain outside information immediately."
  # 灰口脱险
  leader_trait_graygoo_escape: "Escaped the Grey Maw"
  # 该领袖经历了一次特殊的「调查」，这使ta处理各种巨娘相关问题时更有经验
  leader_trait_graygoo_escape_desc: "This leader experienced a special 'investigation,' which gives them more experience when dealing with various giantess-related issues."
  # 小灰的无意识接触
  gts_evt_graygoo.310.name: "Little Grey's Unintentional Contact"
  # 小灰按照指令来到了作战星系，巨大的身体漂浮在宇宙中，黑色镀金旗袍反射着恒星的光线，为这具身体的主人增添了一份神秘，自跃迁完成后，小灰便在此星系中展开了搜索，尽管纳米机器有着极高的精度与搜索范围，但仍未发现目标舰队，只有被小灰巨大身体产生的引力不断吸引而来的小行星，在纳米机器的作用下分解，成为小灰成长的养分\n\n「应该就是这里吧？」\n\n湛蓝的眼睛中透露出一丝不解，再三确认目标后，小灰只能再一次地进行搜索，而敌军的战舰却在小灰跃迁完成时，与无数的小行星一并被巨大的引力捕获，哪怕将引擎加速到最快，也只能做到延迟自己的毁灭，舰员看着占据全部视野的洁白肌肤距离自己越来越近，在绝望中关闭了引擎，舰船如同飞蛾般扑向小灰，在接触到小灰的瞬间被摧毁，反应堆爆发的光芒瞬间如同恒星般闪耀，却无法引起小灰的一丝注意，只能无声的湮灭在漆黑的宇宙中，留下小灰苦苦搜寻任务目标
  gts_evt_graygoo.310.desc: "Little Grey arrived in the operational system according to orders. Her massive body floated in space, the black and gold qipao reflecting the light of the star, adding to the mystery of the body's owner. Since completing the jump, Little Grey has been searching in this system. Despite the high accuracy and search range of the nanomachines, the target fleet has not been found. Only asteroids are being constantly drawn in by the gravity of Little Grey's massive body, decomposing under the effect of the nanomachines and becoming nutrients for Little Grey's growth.\n\n'This should be the place, right?'\n\nA hint of confusion was revealed in her azure eyes. After confirming the target again and again, Little Grey could only search again. The enemy's warships, however, were caught in the huge gravity along with countless asteroids when Little Grey completed the jump. Even accelerating their engines to the maximum could only delay their destruction. The crew, watching the pure white skin that filled their entire vision getting closer and closer, gave up in despair and shut down their engines. The ships rushed toward Little Grey like moths to a flame, and were destroyed on contact, the light of their reactors exploding like a star and yet not attracting Little Grey's attention. They could only disappear silently into the dark universe, leaving Little Grey desperately searching for her objective."
  # 小灰可爱捏
  gts_evt_graygoo.310.a: "Little Grey is so cute~"
  # 小灰的舰船玩弄
  gts_evt_graygoo.320.name: "Little Grey's Ship Plaything"
  # 敌方的舰队逐渐出现在小灰视野中，先锋舰冲在前方，为其他舰船吸引火力，随着阵型形成，无数的动能导弹,激光与电弧向小灰飞来，若是普通的舰队，面对如此强大的火力恐怕早已船毁人亡，但小灰只是看着攻击缓慢地飞来，在旗袍上产生微弱的光芒，哪怕能够造成一丝的损伤，也会被无穷的纳米机器瞬间填补\n\n「你们的攻击只有这样了吗？连我的衣服都损伤不了呢」\n\n看着眼前缓慢移动的舰队，小灰不禁玩心大起，纤长的手指向舰船缓缓靠近，轻轻地将其夹起，拿到眼前，尽管小灰的动作轻柔，在船员的眼中却是另一番景象，两根白色巨柱猛烈撞击船体，产生的压力使得装甲几乎完全损坏，随后快速的移动则完全使舰船撕裂，重新化为了合金与矿物，漂浮在寂静的宇宙之中，船员也无一幸免，随破碎的船体一同留在了冰冷的虚空中\n\n可爱的眼睛仔细观察着两指间微小的碎片，却只看到合金反射的点点微光\n\n「什么嘛，你们的舰船怎么这么脆弱嘛，连我的手指都抵挡不了」\n\n小灰的手指轻轻揉搓，将合金与矿物彻底毁灭，原本的残骸已然消失不见\n\n远方的舰队仍在保持攻击，但船员早已绝望，麻木地等待着死亡的降临，甚至有的舰船已经调转方向，向着航道前行，期望能够离开这片星系，但对小灰而言，舰船的最快速度也不过蠕动，无论反抗还是逃跑，对于小灰而言都没有意义，他们剩余的唯一价值，就是满足小灰的欲望，为她带来快感\n\n对于剩下的舰队，要如何处理呢？
  gts_evt_graygoo.320.desc: "The enemy fleet gradually appeared in Little Grey's vision, the vanguard ships rushing ahead to draw fire for the others. As their formations took shape, countless kinetic missiles, lasers, and arcs flew towards Little Grey. If it were an ordinary fleet, facing such overwhelming firepower, they probably would have already been destroyed without a trace, but Little Grey simply watched the attacks slowly approaching, creating only a faint glow on her qipao. Even if they could cause a tiny bit of damage, the endless nanomachines would instantly repair it.\n\n'Is that all your attacks can do? You can't even damage my clothes.'\n\nWatching the slowly moving fleet, Little Grey couldn't help but feel playful. Her slender fingers slowly approached the ships, gently picking them up and bringing them closer. Although Little Grey's movements were gentle, it was a different sight for the crew. Two white pillars violently struck the ship's hull, and the resulting pressure almost completely damaged the armor. The rapid movement then completely tore apart the ship, returning them to alloy and minerals, floating in empty space. None of the crew survived either, remaining in the cold void along with the shattered hull.\n\nThe adorable eyes carefully observe the tiny fragments between her fingers, only seeing the faint light reflected by the alloy.\n\n'What is this? Your ships are so fragile, they can't even withstand my fingers.'\n\nLittle Grey lightly rubbed her fingers together, completely destroying the alloy and minerals. The original wreckages have disappeared. \n\nThe distant fleet continued to attack, but the crew was already in despair, numbly waiting for their death. Some ships were even already turning around and heading back the way they came, hoping to leave this system, but for Little Grey, even the fastest ships moved like snails. Whether they resist or run, it doesn't matter to Little Grey, and their only remaining value is to satisfy her desires and bring her pleasure.\n\nHow should the remaining fleet be dealt with?"
  # 让小灰吃掉他们吧
  gts_evt_graygoo.320.a: "Let Little Grey eat them."
  # 让小灰用双乳夹碎他们吧
  gts_evt_graygoo.320.b: "Let Little Grey crush them between her breasts."
  # 让小灰把他们塞进小穴吧
  gts_evt_graygoo.320.c: "Let Little Grey stuff them into her little hole."
  # 让小灰用脚揉碎他们吧
  gts_evt_graygoo.320.d: "Let Little Grey crush them with her feet."
  # 让小灰把他们用作除臭剂吧
  gts_evt_graygoo.320.e: "Let Little Grey use them as a deodorant."
  # 让小灰把他们塞入马眼吧
