l_english:
  # 微缩替身
  gts_trait_avatar: "Miniature Avatar"
  # 这位领袖对我们来说已经飞升成神，不过祂留下的替身仍旧庇护着我们
  gts_trait_avatar_desc: "This leader has ascended to godhood for us, but the avatar they left behind still protects us."
  # §Y这位领袖的「本体」拥有着远超神明的力量，碾碎整个星海都不在话下§!
  gts_trait_avatar.tooltip: "§YThis leader's 'main body' possesses power far exceeding that of gods, capable of crushing the entire star sea without effort!§!"
  # 发现超古代巨娘考古线索
  gts_artifact_lgate_clue: "Discovered Ancient Giant Girl Archaeological Clue"
  # 本决议是为了避免玩家探图太慢而耽误寻找远古巨大娘这一主线剧情
  gts_artifact_lgate_clue_desc: "This decision is to prevent players from exploring too slowly and delaying the main storyline of finding the ancient giant girl."
  # 调查热情
  long_for_mistery: "Passion for Investigation"
  # 我国科学家风餐露宿，以极大的热情在星辰间寻觅巨大 maiden的踪迹。
  long_for_mistery_desc: "Our scientists are enduring hardships, searching for traces of the giant girl among the stars with immense enthusiasm."
  # 虚拟宇宙理论
  wotaomu_university: "Virtual Universe Theory"
  # 沃陶姆人对宇宙的观点启发了我们对宇宙形成理论的研究，这帮助我们更高效的进行星系探索。
  wotaomu_university_desc: "The Vultaum's views on the universe have inspired our research into the theory of the universe's formation, helping us explore the galaxy more efficiently."
  # 贾沃疹逆向研究
  jiawozhen_gts: "Javorian Pox Reverse Engineering"
  # 我们通过分析丘格拉人的贾沃疹武器得到了巨大 maiden身上的微生物模型，注射这种微生物可以极大改善我们种族的健康水平。
  jiawozhen_gts_desc: "By analyzing the Joggra's Javorian Pox weapon, we have obtained a microorganism model from the giant girl's body. Injecting this microorganism can greatly improve the health of our race."
  # 谜题
  site_gtsrobot_name: "Puzzle"
  # 这个星球不像通常所认为的荒芜，而是掩藏着许多谜题。
  site_gtsrobot_desc: "This planet is not as desolate as commonly believed, but is hiding many puzzles."
  # 天灾防范演习
  gts_anti_crisis: "Doomsday Prevention Drills"
  # 对肃正协议的研究提醒了我们宇宙中还存在着无数想把整个银河系吃干抹净的可怕威胁。幸运的是，这个肃正星球为我们留下了防备入侵之敌的翔实资料，为我们抵抗终末危机提供了很大帮助。
  gts_anti_crisis_desc: "Research on the Contingency has reminded us that countless terrifying threats exist in the universe, eager to devour the entire galaxy. Fortunately, this Purity planet has provided us with detailed information on how to defend against invading enemies, greatly aiding us in resisting the end-game crisis."
  # 终末瞭望站
  gts_endscout: "End-Game Observatory"
  # 这个瞭望站记录了巨娘身上丰富多彩的文明进化史和各种奇妙的自然现象，俨然一座研究恒星级巨娘的宝库。
  gts_endscout_desc: "This observatory records the colorful history of civilization and various wonderful natural phenomena on the giant girl, essentially a treasure trove for studying stellar-level giant girls."
  # 沃土千里
  gts_sweat_planet: "Fertile Fields"
  #  maiden离开时留下的冰陨石与有机质陨石将这个星球塑造为植物生长的天堂，优美的环境也能给这里的居民以田园牧歌般的愉悦体验。
  gts_sweat_planet_desc: "The icy meteorites and organic meteorites left behind by the girl shaped this planet into a paradise for plant growth, and the beautiful environment also provides the residents here with a pastoral and idyllic experience."
  # 远古巨大 maiden
  gts_evt_ancient.2.name: "Ancient Giant Girl"
  # 自我们文明诞生之时起，有关游荡于宇宙中的巨大 maiden的神话传说就以不同语言、不同题材在各个地区流传。\n如今，我们的技术积累终于足够支持我们对这一上古传说进行考察。我们的科学家跃跃欲试，希望能在繁星中找到她的踪迹。\n\n§S你可以在法令界面找到微缩银河控制器§!\n\n版本v$gts_version$ 大超萌Mod制作组 $gts_update_date$
  gts_evt_ancient.2.desc: "Ever since our civilization was born, myths and legends about giant girls wandering the universe have spread in various regions in different languages and themes.\nNow, our technological accumulation is finally sufficient to support our investigation into this ancient legend. Our scientists are eager to find her traces among the stars.\n\n§SYou can find the Miniature Galaxy Controller in the Edicts interface!§!\n\nVersion v$gts_version$ Big Ultra-Cute Mod Team $gts_update_date$"
  # §Y直接打开微缩银河控制器§!
  gts_evt_ancient.2.a: "§YOpen the Miniature Galaxy Controller directly!§!"
  # 发现远古文明遗址
  gts_evt_ancient.0.name: "Discovery of Ancient Civilization Ruins"
  # 尘埃散去后，我们在这个崩解的行星深层发现了大量复杂的机械建筑结构，将整个星球建设为了坚不可摧的要塞。可惜的是这些工业与军事设施都随着整个星球的爆炸化作一堆废铁。我们已经在上面建立了考古站点，随时可以调查这个星球的过往。
  gts_evt_ancient.0.desc: "After the dust settled, we discovered a large number of complex mechanical building structures deep within this collapsed planet, turning the entire planet into an indestructible fortress. Unfortunately, these industrial and military facilities have, along with the planet's explosion, been reduced to a pile of scrap iron. We have already established an archaeological site on it and are ready to investigate the planet's past."
  # 巨大 maiden在哪里？
  gts_chain_title: "Where is the Giant Girl?"
  # 关于超古代恒星级巨娘的传闻已经在国民中传的沸沸扬扬，无论出于什么目的，举国上下都很想知道这样巨大的生物从哪里来，到哪里去。
  gts_chain_desc: "Rumors about an ancient stellar-level giant girl have spread like wildfire among the populace. Regardless of the reason, the entire nation is eager to know where such a gigantic creature came from and where it is going."
  # 调查的星球
  gts_planets: "Investigated Planets"
  # 线索
  gts_anomaly_zero_category: "Clues"
  # 线索
  gts_anomaly_first_category: "Clues"
  # 我们似乎在这个星球上发现了古代外星文明与巨大 maiden的接触痕迹。
  gts_anomaly_1_category_desc: "We seem to have found traces of contact between an ancient alien civilization and the giant girl on this planet."
  # 发现沃陶姆废弃殖民地
  gts_evt_ancient.10.name: "Discovery of Abandoned Vultaum Colony"
  # 我们的科学家证实了这个星球是一个自称沃陶姆的先驱文明的前殖民地，稍做准备后我们就可以对其进行考古。
  gts_evt_ancient.10.desc: "Our scientists have confirmed that this planet was a former colony of a pioneer civilization called the Vultaum. After a little preparation, we can start archaeological research on it."
  # 很好
  gts_evt_ancient.10.a: "Very well"
  # 沃陶姆废弃殖民地
  site_gts_wotaomu: "Abandoned Vultaum Colony"
  # 这是沃陶姆的一个殖民地
  site_gts_wotaomu_desc: "This is a colony of the Vultaum."
  # 先期考察
  gts_evt_ancient.11.name: "Preliminary Investigation"
  # 通过收集化石和年代勘测，我们得知这个物种属于一种软体动物，大约3-4米高，活跃于1200万年前。这个文明科技高度发达，而他们的计算机技术和虚拟现实技术更是遥遥领先。\n\n不过值得注意的是，沃陶姆的城市残骸除去因时光流逝而破败的部分外，存在着大量被故意破坏的痕迹。似乎在这个文明的末期，这个物种开始不约而同的摧毁城市并集体自杀。
  gts_evt_ancient.11.desc: "By collecting fossils and conducting dating research, we learned that this species belongs to a mollusk, about 3-4 meters tall, that was active 12 million years ago. This civilization was highly advanced in technology, with their computer and virtual reality technologies being far ahead of their time.\n\nHowever, it is worth noting that, apart from the parts that have decayed over time, there are many traces of deliberate destruction among the ruins of the Vultaum cities. It seems that at the end of this civilization, this species began to destroy their cities and commit group suicide."
  # 调查
  gts_evt_ancient.12.name: "Investigation"
  # 果不其然，我们在一栋保存相对完好的档案馆找到了有关那个恒星级 maiden的观测记录，这份档案让我们相信这个 maiden拥有极长的寿命或者能够进行时间旅行。\n\n大约在1200万年前，这个巨大 maiden突然出现在这个星系的超光速入口，并缓慢的向另一端出口移动。\n\n由于惊讶，沃陶姆的舰队直到有船被撞碎后才慌忙离开其行进轨道。\n\n在确认无法沟通也暂时没有敌意后，地面科研中心和科研船开始对她进行远距离扫描，其结果令人惊讶。\n\n许多检测数据仿佛是胡编乱造一般，若不是这个生物能轻易粉碎星球的呼吸与给所有人造成无形压力的心跳，他们简直无法相信这居然会是一个有机生命体。\n\n之后一些大胆的科学家开始尝试登陆进行近距离扫描，安全着陆的消息传来之后，越来越多的科学家开始申请进行近距离或登陆观测，利用这个宝贵机会组建巨构建筑进行系统检查的计划也被提上议程。
  gts_evt_ancient.12.desc: "Sure enough, we found observation records about the stellar-level girl in a relatively well-preserved archive, which convinced us that this girl has an extremely long lifespan or is capable of time travel.\n\nAbout 12 million years ago, this giant girl suddenly appeared at the hyperlane entry point of this star system and slowly moved towards the other exit.\n\nDue to surprise, the Vultaum fleet only hurriedly left her path after a ship was crushed.\n\nAfter confirming that communication was impossible and that she was not hostile for the time being, ground research centers and research vessels began to scan her remotely, and the results were surprising.\n\nMany of the test data seems to be fabricated, and if it wasn't for the fact that this creature could easily crush planets with her breath and the invisible pressure of her heartbeat, they simply wouldn't believe that this was an organic life form.\n\nAfter that, some daring scientists began to try to land for close-range scans. After the message of a safe landing arrived, more and more scientists began to request close-range or landing observations. Plans to build megastructures to conduct systematic inspections using this valuable opportunity were also put on the agenda."
  # 后续
  gts_evt_ancient.13.name: "Follow-Up"
  # 在对选址争论许久后，沃陶姆的领袖最终批准在 maiden足部的引力场外搭建一个大型采集站以期采集下皮肤样本进行详细分析，并环绕着多根头发组装侦测阵列来探测她的去向。\n\n经过审查批准后，共四十六支科考队获得准许，从多个入口进入 maiden体内进行探险。\n\n采集站的采集工作进展相当缓慢，为了在足纹中划出痕迹，沃陶姆甚至不顾对星系的生态危害动用了歼星武器，最终采集下了一块一人高的皮肤碎屑，与其说是被采集下来，仿佛是被授意后脱落让他们采集的一样，之后的采集尝试再也没有任何进展。\n\n这块皮屑不停向周围释放着难以名状的力量，它附近的空间也被扭曲，甚至在影响范围内许多物理法则也不再生效。\n\n几支科考队在数个星期的探险后及时回撤，带回了珍贵的检测数据，这些数据进一步证实了这确实只是一个普通的有机生命，但由于某种他们无法理解的原因这个生物变得如此巨大并能引发各种奇异的自然现象。\n\n而更多的队伍则被 maiden体内的无意识活动压扁、挤碎、吸收。直到 maiden离开这个星系时，还有数支执意深入的科考队处于失联状态，彻底迷失在星系大小的 maiden身躯里。
  gts_evt_ancient.13.desc: "After arguing for a long time about the site selection, the Vultaum leader finally approved the construction of a large collection station outside the gravitational field of the girl's foot to collect skin samples for detailed analysis, and an array of detection arrays surrounding several of her hairs to detect her whereabouts.\n\nAfter review and approval, a total of forty-six expedition teams were authorized to enter the girl's body through multiple entrances for exploration.\n\nThe collection work of the collecting station was progressing very slowly. In order to carve marks in the foot pattern, the Vultaum even used planet-destroying weapons, regardless of the ecological damage it would cause to the star system, and finally collected a piece of skin that was as tall as a person, and it was collected as if it had been instructed to shed it for them to collect, and no further collection attempts were successful.\n\nThis piece of skin was constantly releasing an indescribable power, and the space around it was also distorted, and even many physical laws stopped working within the affected area.\n\nSeveral expedition teams returned in time after a few weeks of exploration, bringing back valuable test data. These data further confirmed that this was indeed just an ordinary organic life, but for some reason that they could not understand, this creature became so huge and able to cause various strange natural phenomena.\n\nMore teams, however, were crushed, squeezed, and absorbed by the unconscious activity of the girl's body. By the time the girl left the star system, several investigation teams that had insisted on going deep were still out of contact, completely lost in the girl's star-system-sized body."
  # 结束
  gts_evt_ancient.14.name: "End"
  # 在离开这个星系后，那位巨大 maiden便再无音讯，部署在 maiden发丝上的侦测阵列也瞬间失联，他们只能认为是前往了某个连他们都无法侦测到的星系。\n\n他们将这一经历与他们对宇宙本质的独特认识结合后，开始相信他们所生活的宇宙是虚拟的，而那个巨大生物所在的世界才是真实的，这种思潮的爆发对沃陶姆的文化哲学产生了极大的影响。\n\n根据我们找到的最后记录，他们开始利用从巨大 maiden身上费尽力气采集下的那块皮肤碎屑和记录下的大量数据开始研发一种名为\"现实透孔仪\"的仪器用来探索\"真正的世界\"。\n\n至于是否开发成功，以及他们之后的命运如何，我们不得而知。不过他们对宇宙的有趣观点对我国科学家产生不少启发。
  gts_evt_ancient.14.desc: "After leaving this star system, the giant girl was no longer heard from, and the detection array deployed on the girl's hair instantly lost contact. They could only assume that she had gone to a star system that was even undetectable to them.\n\nAfter combining this experience with their unique understanding of the essence of the universe, they began to believe that the universe they lived in was virtual, and that the world where the giant creature was located was real, and the outbreak of this ideology had a great impact on the culture and philosophy of the Vultaum.\n\nAccording to the last record we found, they began to use the piece of skin they had labored to collect from the giant girl along with the large amount of data they had recorded to develop a device called \"Reality Perforation Instrument\" in order to explore the \"real world\".\n\nWhether they succeeded in development and what their fate was afterwards, we don't know. However, their interesting views on the universe have inspired our scientists a lot."
  # 线索
  gts_anomaly_second_category: "Clues"
  # 发现泽珞废弃殖民地
  gts_evt_ancient.20.name: "Discovery of Abandoned Zroni Colony"
  # 我们的科学家证实了这个星球是一个自称泽珞的先驱文明的前殖民地，稍做准备后我们就可以对其进行考古。
  gts_evt_ancient.20.desc: "Our scientists have confirmed that this planet was a former colony of a pioneer civilization called the Zroni. After a little preparation, we can start archaeological research on it."
  # 泽珞废弃殖民地
  site_gts_zeluo: "Abandoned Zroni Colony"
  # 这是泽珞族的一个殖民地
  site_gts_zeluo_desc: "This is a colony of the Zroni."
  # 先期考察
  gts_evt_ancient.21.name: "Preliminary Investigation"
  # 现存资料只能证明泽珞族是一个具有强大灵能天赋的种族。此外泽珞族似乎在其文明末期因为对外族政策的剧烈冲突爆发了内战，这直接导致了其国家的毁灭。\n\n他们那波及大半个银河的战斗却唯独避开了这个星球，种种迹象也表明这个星球也不像是经历了自然灾害或战争而废弃的，其原因仍然有待我们的进一步调查。\n\n除此之外，我们还在泽珞聚居区的空气中发现了大量的暗紫色的粉末状粉尘，这是异星粒子中存在的极其稀有的气溶胶。初步鉴定认为其有一定的成瘾性，并能增强灵能力量。
  gts_evt_ancient.21.desc: "Existing data can only prove that the Zroni race was a species with powerful psionic talents. Furthermore, it seems that the Zroni experienced a civil war at the end of their civilization due to a violent conflict over their foreign policy, which directly led to the destruction of their nation.\n\nTheir battles, which affected most of the galaxy, avoided this planet, and all the signs indicate that this planet does not seem to have been abandoned due to natural disasters or wars. The reason is still awaiting our further investigation.\n\nIn addition, we also found a large amount of dark purple powdered dust in the air of the Zroni settlement, which is an extremely rare aerosol among exotic particles. Initial identification indicates that it has a certain addictive nature and can enhance psionic powers."
  # 虚境
  gts_evt_ancient.22.name: "The Shroud"
  # 在星球建筑群的中心，我们发现了一个大型水晶。由于某种难以言明的原因，我们不由得认为这颗水晶想要被我们发现和沟通，然而我们尝试了各种手段，都无法破解其加密系统。\n\n最后，一位调查员冒险吸入大量泽洛后，随后陷入了昏迷，经过数日的救治后才醒来。\n\n醒来后她向我们说，她在昏迷期间进入了一个名为\"虚境\"的异常维度，看到了许多不可思议的事物，比如数粒苹果大小却又能清晰的看到里面每个生物的球形宇宙，最后她发现了那块灵能水晶，但正当她尝试触摸时就被弹了出来。\n\n起初调查队不以为意，认为这只不过是吸食过量致幻粉尘产生的幻觉，但对这种粉尘的后续研究和更多人的尝试逐渐证明了其所言非虚。\n\n根据实验者所说，这个水晶是一种灵能档案库，为了严防其他物种骇入，只有泽珞族能进行访问。而我们似乎可以通过吸食泽洛来暂时的获得访问虚境与灵能水晶的能力。\n\n收集了足够泽洛后，我们将会在几日后开始第一次对灵能水晶的正式访问。
  gts_evt_ancient.22.desc: "In the center of the planet's building complex, we discovered a large crystal. For some inexplicable reason, we couldn't help but think that this crystal wanted to be discovered and communicated with by us. However, we tried various methods and were unable to crack its encryption system.\n\nFinally, an investigator took the risk of inhaling a large amount of Zroni powder, subsequently falling into a coma and waking up after several days of treatment.\n\nAfter waking up, she told us that during her coma, she entered an anomalous dimension called \"The Shroud\", where she saw many incredible things, such as spherical universes the size of an apple where each living being inside was clearly visible. In the end, she discovered the psionic crystal but was ejected the moment she tried to touch it.\n\nAt first, the investigation team did not take it seriously, thinking it was just a hallucination caused by inhaling too much hallucinogenic dust. However, further research on this dust and the attempts of more people gradually proved that what she said was true.\n\nAccording to the test subjects, this crystal is a psionic archive. In order to strictly prevent other species from hacking it, only the Zroni race could access it. It seems that we can temporarily gain access to the Shroud and the psionic crystal by inhaling Zroni powder.\n\nAfter collecting enough Zroni powder, we will begin the first formal access to the psionic crystal in a few days."
  # 探索虚境
  gts_evt_ancient.23.name: "Exploring the Shroud"
  # 我们的尝试成功了！\n\n得益于充足的泽洛储备，我们在漫长的尝试后终于成功破解了灵能水晶的封印。\n\n水晶投射出一个灵能投影与我们交流，她自称自己是她的制造者依据那位 maiden的外貌与语言制造而成的。\n\n奇怪的是，哪怕不经过翻译，我们依然能听懂其语言，甚至对这一语言感到了莫名的亲切感。\n\n如果她所说的属实，那么这将会是我们第一次找到这位巨大 maiden的影像与语言记录！\n\n以下是我们记录的一些交流内容：\n\n\"你们不是泽珞人？你们是谁？\"\n\n\"我们是[Root.Owner.GetSpeciesName]，为了寻找一位远古恒星级巨娘的线索来到这里的。\"\n\n\"诶？那，我的制造者们呢？\"\n\n\"根据现在我们能找到的记录，你的制造者文明在一场内战中全部覆灭了。\"\n\n\"一群傻瓜...\"\n\n\"泽珞族和那位巨大 maiden是如何遇到的？\"\n\n\"大概在我被制造的六百多年前，我的制造者们的集体潜意识与原始虚境产生交集。这使得他们得以使用灵能进入虚境，他们随后在那里开辟了一片可以随心所欲操控现实的虚境世界。\n\n在精心经营了数百年的虚境空间后，泽珞族遇到了自他们开辟虚境以来的第一位访客 -  - 这就是你们一直在寻找的那位 maiden。\n\n幸运的是，泽珞族成功地与这位 maiden建立了联系。在之后的交流中， maiden对泽珞族的灵能表演感到颇为滑稽，便随手为泽珞族表演了那些他们穷极一生也不可能的灵能法术，创造与毁灭宇宙也不过是举手之劳。\n\n这给自以为灵能已经无人能敌的泽珞族带来了极大震慑。不久之后这位 maiden向他们告别，临走前向泽珞族许诺如果下次能再见面的话或许会教给他们一招半式，并告诫他们在虚境的所作所为会对现实产生相当不利影响。\"\n\n\"刚才听你所说，难道你对那场内战有什么了解吗？\"\n\n\"唔...我的这部分储存信息似乎出了错误，我能说的内容只有这些：\n\n在那位巨大 maiden离开之后，泽珞人又拾起了崇拜神明的那一套。有些人想要彻底进入虚境去等待他们的女神再次降临赐福，而有些人主张保护其他的生命不被虚境活动所破坏，才是对女神神谕的正确解读。\n\n至于更多的东西，泽珞族已经很久没有对我的数据库进行维护和更新了，所以我也不是很清楚呢。\"\n...
  gts_evt_ancient.23.desc: "Our attempts were successful!\n\nThanks to sufficient reserves of Zroni powder, we finally succeeded in cracking the seal of the psionic crystal after a long period of trying.\n\nThe crystal projected a psionic projection to communicate with us, claiming that it was created by her creators based on the appearance and language of that girl.\n\nStrangely, even without translation, we can still understand her language, and even feel a strange sense of familiarity with it.\n\nIf what she said is true, this would be the first time we have found image and language records of this giant girl!\n\nBelow are some of the conversations we recorded:\n\n\"You are not Zroni? Who are you?\"\n\n\"We are [Root.Owner.GetSpeciesName], and we came here to search for clues about an ancient stellar-level giant girl.\"\n\n\"Huh? Then, what about my creators?\"\n\n\"According to the records we can find now, your creator civilization was completely destroyed in a civil war.\"\n\n\"A bunch of fools...\"\n\n\"How did the Zroni race encounter that giant girl?\"\n\n\"About 600 years before I was created, the collective subconscious of my creators intertwined with the original Shroud. This allowed them to use psionics to enter the Shroud, where they then opened up a Shroud World where they could control reality as they pleased.\n\nAfter carefully cultivating the Shroud space for hundreds of years, the Zroni race met the first visitor since they opened the Shroud - this is the girl you have been looking for.\n\nFortunately, the Zroni race successfully established contact with this girl. In the subsequent exchanges, the girl found the Zroni race's psionic performances quite comical, and then casually demonstrated psionic magic for the Zroni that they could not achieve even with their entire lifetime, creating and destroying universes was a mere wave of the hand.\n\nThis brought great shock to the Zroni race, who had thought their psionic powers were unmatched. Soon after, this girl bid them farewell, promising that if they could meet again next time, she might teach them a trick or two, and warned them that what they did in the Shroud would have a very unfavorable impact on reality.\"\n\n\"From what you said just now, do you know anything about that civil war?\"\n\n\"Um... This part of my stored information seems to have an error, and the only things I can say are these:\n\nAfter that giant girl left, the Zroni people picked up the worship of gods again. Some wanted to enter the Shroud completely to wait for their goddess to descend again and bestow blessings, while others advocated that protecting other lives from being damaged by Shroud activities was the correct interpretation of the goddess's divine message.\n\nAs for anything more, the Zroni have not maintained and updated my database for a long time, so I am not very sure.\"\n..."
  # 结束
  gts_evt_ancient.24.name: "End"
  # 正当我们想进一步询问关于那位巨大 maiden种族出身地等信息时，这个灵能投影似乎变得相当不悦。\n\n\"好了，你们已经问的够多了。\"\n\n说完，我们就被弹出了虚境。之后我们的科学家数次进入虚境，却发现灵能水晶连同那些球形宇宙全都消失了，只剩下无尽的虚空与紫色的烟雾。\n\n在星球的另一端的城区中心我们又发现了一块大型水晶，但出人意料的是，其破解不需要进入虚境，我们只进行了表层破译便将其破解，里面记录了泽珞人在灵能界遇见那位巨大 maiden的经历，除了创造灵能投影的部分未曾提到之外，大体与那个灵能投影所说的相似。\n\n不过为什么要制作两块水晶来记载差不多的信息呢？\n\n基于两块水晶等级完全不同的装饰，我们的考古学家提出了一种可能：\n\n这或许是泽珞族为了避免后世的盗墓贼破坏而制作的一个伪水晶，用以保护真正的水晶不被破坏。\n\n至于反过来的那种可能...\n\n希望它仅仅是一个可能。
  gts_evt_ancient.24.desc: "Just as we wanted to ask further about the giant girl's place of origin, etc., this psionic projection seems to become rather displeased.\n\n\"Alright, you've asked enough.\"\n\nAfter saying that, we were ejected from the Shroud. After that, our scientists entered the Shroud several times, but discovered that the psionic crystal along with those spherical universes had all disappeared, leaving only endless void and purple smoke.\n\nIn the center of the city on the other end of the planet, we discovered another large crystal, but unexpectedly, it did not require entering the Shroud to decipher it. We deciphered it by doing a surface-level decoding, and what was recorded was the Zroni's experience of encountering the giant girl in the psionic realm. Apart from the part about creating the psionic projection being unmentioned, it generally corresponded to what the psionic projection said.\n\nBut why make two crystals to record the same information?\n\nBased on the completely different decorations of the two crystals, our archaeologists proposed a possibility:\n\nThis might be a fake crystal made by the Zroni to protect the real crystal from being destroyed by tomb robbers in posterity.\n\nAs for the possibility of the opposite...\n\nHopefully, it's just a possibility."
  # 线索
  gts_anomaly_third_category: "Clues"
  # 发现第一联盟废弃殖民地
  gts_evt_ancient.30.name: "Discovery of Abandoned First League Colony"
  # 我们的科学家证实了这个星球是一个自称第一联盟的先驱文明的前殖民地，稍做准备后我们就可以对其进行考古。
  gts_evt_ancient.30.desc: "Our scientists have confirmed that this planet was a former colony of a pioneer civilization called the First League. After a little preparation, we can start archaeological research on it."
  # 第一联盟废弃殖民地
  site_gts_deyilianmeng: "Abandoned First League Colony"
  # 这是第一联盟的一个殖民地
  site_gts_deyilianmeng_desc: "This is a colony of the First League."
  # 联盟
  gts_evt_ancient.31.name: "The League"
  # 这里是第一联盟的一个殖民地，从数十米到几厘米不等的道路残骸就能看出这个文明强大的工业实力和相当复杂的人口组成。\n\n不过看起来这些居民相处并不融洽，我们在这个星球的很多地方都发现了大量许多大型物种的化石，而上面都有着大量伤痕，至于小型物种，则连化石都很少发现，大概是在战斗中直接被敌人碾为尘土了。\n\n在一片地下城市里，我们发现了一个历史档案馆，或许它可以解答我们的问题。
  gts_evt_ancient.31.desc: "This is a colony of the First League. The road ruins ranging from tens of meters to a few centimeters show the powerful industrial strength and highly complex population composition of this civilization.\n\nHowever, it seems that the residents did not get along very well. We found many fossils of large species in many places on this planet, with many scars on them. As for small species, they rarely found any fossils, probably because they were directly crushed into dust by their enemies during battles.\n\nIn an underground city, we found a historical archive, which may be able to answer our questions."
  # 停滞
  gts_evt_ancient.32.name: "Stagnation"
  # 我们对第一联盟历史档案的解析逐渐展示出了一个悲剧故事：\n\n第一联盟的创始国之一卡萨克是一个身高二十米甚至更高的爬行类生物，在进入太空时代之前就有着关心各族平等共生的传统，而幸运的是，这一理想得到了它其他几个友好邻国的支持。\n\n虽然从生理体型到文化信仰都有相当大的不同，但在创始国之一米格杨 -  -  -  - 一种只有半米高的啮齿类物种的斡旋下，这几个国家成立了第一联盟，随后便开始向各国递出橄榄枝。\n\n即使是好战的军国主义国家汉姆达也被这种精神打动，在被第一联盟击败后加入联盟，转而作为忠诚的军事力量向万国传播着联盟保护弱小、团结友善的理念。\n\n联盟民众对外族的高度信任与体谅尊重极大缓和了各族磨合期中那些令政府棘手的社会矛盾，而这种精神又吸引了更多国家加入这个联盟。\n\n在短短几十年间，第一联盟就统合了宇宙的大半国家，手握丰富资源的第一联盟积极推进各落后国家的工业建设和文化教育事业，满足各种体型的物种生活需要的建筑设施也在各个加盟国拔地而起。\n\n各个加盟国各施所长，依据自己的种族优势进行产业分工，无数志愿者，将这个联盟运营的相当繁荣。\n\n然而在随后的六百多年里，这种精神逐渐磨蚀在日常之中。\n\n一些在联盟初生时可以自行化解的小事，譬如\"为了节省资金直接在大型生物的步道两侧刻出微小生物的通道\"，或者\"为了防止有小人潜藏走私，不得不对其他入境的大型物种进行繁琐的搜查程序\"，逐渐变得麻烦起来。\n\n这些涉及到多种族的两难问题逐渐被\"不受欢迎的实用主义还是低效的政治正确\"这个问题所撕裂。\n\n这些小小的摩擦不断积累，逐渐变成一个死结，就算这些事的具体经过早已被遗忘，敌对和偏见的种子也在各个种族中生根发芽。\n\n比起积极调解以化解矛盾，联盟的成员们转而沉浸于对其他种族的推诿指责，如指责那些矮小物种虚弱无能，或者高大物种空耗联盟资源。\n\n无意义的争吵逐渐上升为重大利益冲突，到后来甚至有加盟国公开反对联盟依据种族特长进行产业分工的行为，宣称这是对\"各加盟国平等发展权利的破坏\"。\n\n这一矛盾的爆发事件为联盟大参议院在压力下通过了削减长期为联盟贡献军事人才和舰队的汉姆达的军工业与征兵名额的议案，转而将这些工厂和名额平均分配到各个加盟国。\n\n大批汉姆达青年军官为表抗议，违反禁令率领海军载弹到联盟的行政中心上空进行无声示威。\n\n虽然在汉姆达元老的出面劝离与承诺下，这场示威没有演变成兵变，但第一联盟的内部关系由此出现了不可弥补的裂痕。
  gts_evt_ancient.32.desc: "Our analysis of the historical archives of the First League gradually revealed a tragic story:\n\nOne of the founding countries of the First League, Kasak, was a reptile-like species that was twenty meters or even taller. Before entering the space age, they had a tradition of caring for the equality and co-existence of all races. Fortunately, this ideal was supported by several of its friendly neighbors.\n\nAlthough they differed greatly in their physiological body types and cultural beliefs, under the mediation of one of the founding countries, Migyang - a rodent-like species that was only half a meter tall, these countries formed the First League, and then began to extend olive branches to all countries.\n\nEven the warlike military state Hammda was touched by this spirit, and after being defeated by the First League, joined the alliance, instead acting as a loyal military force to spread the alliance's concept of protecting the weak, uniting, and being friendly to all nations.\n\nThe high trust, understanding, and respect of the League's people for alien races greatly eased the social contradictions that were troublesome for the government during the running-in period between races, and this spirit attracted more countries to join the alliance.\n\nIn just a few decades, the First League integrated most of the countries in the universe. The First League, which had abundant resources, actively promoted the industrial construction and cultural education of backward countries, and the construction facilities needed to meet the needs of species of various sizes were also rising in various member countries.\n\nEach member country contributed its own strengths, dividing industries according to their own racial advantages, and countless volunteers made the operation of the league quite prosperous.\n\nHowever, in the following six hundred years, this spirit was gradually eroded in everyday life.\n\nSome small things that could be solved by themselves when the alliance was first formed, such as \"directly carving out passages for small creatures on both sides of the walkways for large creatures in order to save money\", or \"having to perform tedious searches on other large species entering the territory in order to prevent small people from lurking and smuggling\", gradually became troublesome.\n\nThese difficult issues involving multiple races were gradually being torn apart by the question of \"unpopular pragmatism versus inefficient political correctness\".\n\nThese small frictions accumulated continuously, gradually forming a knot, and even if the specific details of these events had long been forgotten, the seeds of hostility and prejudice rooted in various races.\n\nInstead of actively mediating to resolve conflicts, the members of the alliance turned to blaming each other, such as blaming those dwarf species for being weak and incompetent, or large species for wasting alliance resources.\n\nThe meaningless arguments gradually escalated into major conflicts of interest, and later some member countries even publicly opposed the alliance's industrial division based on the racial specialties, claiming that this was a \"destruction of the right of equal development of all member countries\".\n\nThe eruption of this conflict led the Alliance General Senate to pass a bill under pressure to reduce the military industry and conscription quotas of Hammda, which had long provided military talents and fleets for the League, and instead distribute these factories and quotas evenly to all member countries.\n\nA large number of young Hammdar military officers, in protest, defied the ban and led the navy with ammunition above the administrative center of the League for a silent demonstration.\n\nAlthough this demonstration did not turn into a mutiny under the dissuasion and promises of Hammdar's elders, the internal relationship of the First League had now become irreparable."
  # 新生
  gts_evt_ancient.33.name: "Rebirth"
  # 就在联盟崩溃已经不可避免时，那位巨大 maiden出现在了这片星域。\n\n驻防的多种族海军不约而同的进入战斗状态，忠诚地听从汉姆达族将军的指挥迅速进入预定位置进行警戒，随后通告星球居民进行紧急疏散。\n\n各族的科学家齐心协力研究如何与那位 maiden交流；联盟舰队不再相互掣肘，警惕地盯着这个威胁；大参议院停止了争吵，而是立刻通过决议调拨资源去支援疏散群众的安置工作...\n\n虽然直到 maiden离开第一联盟都没能成功建立联系或引起其注意，但这段期间的研究为联盟积累了相当丰富的科研资料，更可贵的是在这危急情况下，各族屏弃前嫌保卫联盟中央的行动重新燃起了联盟成立之初各种族精诚合作的记忆。
  gts_evt_ancient.33.desc: "Just as the collapse of the League was becoming inevitable, that giant girl appeared in this star region.\n\nThe garrisoned multi-racial navies entered battle mode almost simultaneously, loyally following the command of the Hammdar general, quickly moving to their predetermined positions to be on alert, and then notified the planet's residents to evacuate.\n\nThe scientists of all races worked together to study how to communicate with the girl; the alliance fleet no longer held each other back, and watched this threat warily; the General Senate stopped quarreling and immediately passed a resolution to allocate resources to support the resettlement of the evacuated masses...\n\nAlthough the First League failed to establish contact or catch her attention by the time she left, the research during this period accumulated a considerable amount of scientific research data for the league. What is more precious, in this crisis, the actions of all races abandoning their past grudges and protecting the center of the League rekindled the memory of the cooperation of all races in the establishment of the League at the beginning."
  # 终结
  gts_evt_ancient.34.name: "The End"
  # 巨大 maiden的造访如同一颗火星般为日益黯淡的联盟带来了一丝亮光，但也如火星一般转瞬即逝。\n\n这段经历让这个联盟得以风雨飘摇中的窘境中得以喘息，在广泛支持中重整混乱不堪的国政，联盟甚至一度有中兴的希望。\n\n然而仅仅一代人的时间，偏见与歧视便又一次战胜了平等与团结。仇恨犯罪高起，让异星物种驱离自己星球的呼声此起彼伏。\n\n联盟政府再次陷入窘境，疲于奔命的联盟院再也无力维持对落后星球的援助与控制，不少加盟国事实上已经处于独立或半独立状态，而再也没有什么巨大 maiden来让大家团结起来了。\n\n最终在一次军事演习中，一位靠大搞身份政治混得军衔的外族军官在指挥时犯了致命错误，造成了舰队的撞击事故，数艘战列舰被毁，数千汉姆达人遇难。\n\n对联盟的堕落感到极度失望的汉姆达军官派忍无可忍，冲进指挥部撕碎了那个无能的军官，随后指挥本族控制的舰队脱离联盟指挥，通电汉姆达全族发起对那些\"荼毒联盟的外星蛮子\"的大审判。
  gts_evt_ancient.34.desc: "The visit of the giant girl was like a spark that brought a glimmer of light to the increasingly dim League, but it was as fleeting as a spark.\n\nThis experience allowed the League to temporarily catch its breath in the precarious situation. It reorganized the chaotic domestic administration with widespread support, and the League had even had hopes of a revival.\n\nHowever, in just one generation's time, prejudice and discrimination once again defeated equality and unity. Hate crimes were on the rise, and the calls for alien species to be driven away from their own planets were rising one after another.\n\nThe league government once again fell into a dilemma, and the exhausted council was no longer able to maintain aid and control over backward planets. Many member countries were already de facto independent or semi-independent, and there was no longer a giant girl to unite everyone.\n\nFinally, during a military exercise, a foreign military officer who had attained military rank through identity politics made a fatal error in command, causing a collision accident in the fleet. Several battleships were destroyed and thousands of Hammdar people were killed.\n\nFed up with the corruption of the alliance, Hammdar military officers could no longer bear it. They rushed into the headquarters, tore up the incompetent officer, and then ordered the fleet under their control to break away from the alliance command, issuing an announcement to the entire Hammdar race to launch a great trial against the \"alien barbarians who poisoned the League\"."
  # 线索
  gts_anomaly_forth_category: "Clues"
  # 发现尤特废弃殖民地
  gts_evt_ancient.40.name: "Discovery of Abandoned Yuht Colony"
  # 我们的科学家证实了这个星球是一个自称尤特的先驱文明的前殖民地，稍做准备后我们就可以对其进行考古。
  gts_evt_ancient.40.desc: "Our scientists have confirmed that this planet was a former colony of a pioneer civilization called the Yuht. After a little preparation, we can start archaeological research on it."
  # 尤特废弃殖民地
  site_gts_jiabadini: "Abandoned Yuht Colony"
  # 这是尤特的一个殖民地
  site_gts_jiabadini_desc: "This is a colony of the Yuht."
  # 先期调查
  gts_evt_ancient.41.name: "Preliminary Investigation"
  # 尤特是一种活跃于六百万年前的卵生动物。\n\n尤特族体型巨大、寿命极长，一个成年尤特的体型往往可以长到数千米左右，其庞大的体型使得他们远远望去宛如一座行走的要塞。\n\n这样大小的外星智慧生物我们很少见到，对这个星球的考察肯定能极大促进我们对生物学的研究。
  gts_evt_ancient.41.desc: "The Yuht are an oviparous species that was active six million years ago.\n\nThe Yuht race was huge and long-lived. An adult Yuht could often grow to thousands of meters, and their massive size made them look like a walking fortress from afar.\n\nWe have rarely seen such a large alien intelligent species, and the investigation of this planet will definitely greatly promote our research in biology."
  # 繁衍
  gts_evt_ancient.42.name: "Reproduction"
  # 尤特的繁衍方式颇为有趣，因为尤特族的繁殖速度很低，而寿命极长，因此尤特族更加重视本族的人口质量。\n\n尤特族的繁育部门会寻找那些气候适宜，并生存着许多动物甚至是智慧生命的星球，之后繁育部门会对这个星球上一切有可能威胁到受精卵孵化和幼年尤特生存的危险野生生物进行无害化处理，最后再进行登陆产卵。\n\n这些小山般的受精卵孵化后，幼年尤特会在这个星球上独自生活数百年直到其成长到能够掌握生存技巧后，再被尤特帝国接收回家举办成人礼。\n\n而尤特人离开后，那些被幼年尤特的捕食和玩耍行为折腾的一塌糊涂的星球会进行一段时间的恢复和人工提升后继续为尤特族的繁育工作服务。
  gts_evt_ancient.42.desc: "The reproductive method of the Yuht is quite interesting. Because the reproduction rate of the Yuht is very low and they have a very long lifespan, the Yuht race pays more attention to the quality of the population.\n\nThe Yuht's reproductive department will look for planets with suitable climates and many animals or even intelligent life, then the reproductive department will harmlessly dispose of dangerous wildlife on this planet that may threaten the incubation of fertilized eggs and the survival of young Yuht, and finally land for spawning.\n\nAfter these mountain-like fertilized eggs hatch, young Yuht will live alone on this planet for hundreds of years until they have grown to master their survival skills, and then they will be taken back home by the Yuht Empire to hold an adulthood ceremony.\n\nAfter the Yuht leave, those planets that have been messed up by young Yuht's predation and play will undergo a period of recovery and artificial enhancement before they continue to serve the Yuht's breeding work."
  # 超光速
  gts_evt_ancient.43.name: "Faster-Than-Light"
  # 我们发现了一艘废弃的尤特殖民船，上面的技术平平无奇，但其构造引起我们很大的兴趣。\n\n不知道为什么，虽然尤特帝国历史悠久，但却没有发明出超光速引擎技术，这使得他们只能使用亚光速引擎进行以年为单位的星际旅行，而同样的距离我们只需要几周就能到达。\n\n同时因为尤特个体极为高大，对我们来说已经非常宽阔的尤特殖民船往往只能承载一到两个尤特人，尤特人只能依靠其发达的生物冷冻技术和数千年的超长寿命解决这个问题。
  gts_evt_ancient.43.desc: "We discovered an abandoned Yuht colony ship. The technology on it is mediocre, but its structure aroused our great interest.\n\nFor some reason, although the Yuht Empire has a long history, they have not invented faster-than-light engine technology, which forces them to use sublight speed engines for interstellar travel that takes place over years. The same distance only takes us a few weeks to reach.\n\nAt the same time, because Yuht individuals are extremely tall, Yuht colony ships that are already very spacious for us can often only carry one or two Yuht. The Yuht can only solve this problem by relying on their advanced cryogenics technology and their thousands of years of longevity."
  # 移民
  gts_evt_ancient.44.name: "Migration"
  # 在不断收集线索后，我们终于找到了尤特族对巨大 maiden的记载。\n\n在记录中，这位 maiden突然在这个星球所在星系的远方出现，并缓慢的向另一端移动。\n\n虽然尤特帝国十分紧张，但因为最近的舰队调来也要花费六十多年，尤特人只好听天由命。\n\n幸好这个 maiden并未表现出恶意，准确的说，是并没有发现他们。情况安定下来后，尤特科学家开始对 maiden的出现深感兴趣。\n\n尤特人最终得出了一个结论：这个 maiden拥有某种能超越光速或空间进行跳跃的能力，尤特人应该全力进行研究。\n\n然而这种努力失败了，尽管 maiden在这个星系的缓慢移动给这个文明两百年的时间来研究，尤特人也将 maiden从足底到发梢研究了一遍，但除了赞叹 maiden浑身的不可思议之外，毫无结果。\n\n最终尤特帝国孤注一掷，决定让一批勇敢的探险者在 maiden的腹部建立聚落，随着 maiden一同进行超光速旅行。\n\n maiden离开后，那些冒险者再无音信，之后尤特帝国也慢慢回到了日常。
  gts_evt_ancient.44.desc: "After constantly collecting clues, we finally found the Yuht's records about the giant girl.\n\nIn the records, this girl suddenly appeared in the distance of the star system where this planet is located and slowly moved towards the other end.\n\nAlthough the Yuht Empire was very nervous, they had no choice but to rely on fate as it would take more than sixty years for the closest fleet to arrive.\n\nFortunately, this girl did not show any malice, or rather, she did not notice them. After the situation stabilized, Yuht scientists became very interested in the appearance of the girl.\n\nThe Yuht finally came to a conclusion: this girl possesses some kind of ability to surpass the speed of light or leap through space, and the Yuht should do their best to study her.\n\nHowever, this effort failed. Although the girl's slow movement in this star system gave the civilization two hundred years to study, the Yuht studied the girl from the bottom of her feet to the tip of her hair, but apart from marveling at the girl's incredible form, there were no results.\n\nIn the end, the Yuht Empire made a desperate attempt and decided to let a group of brave explorers establish a settlement in the girl's abdomen and use her for faster-than-light travel.\n\nAfter the girl left, those adventurers were never heard from again, and the Yuht Empire slowly returned to its daily routine."
  # 线索
  gts_anomaly_fifth_category: "Clues"
  # 发现伊拉斯废弃殖民地
  gts_evt_ancient.50.name: "Discovery of Abandoned Irassian Colony"
  # 我们的科学家证实了这个星球是一个自称伊拉斯的先驱文明的前殖民地，稍做准备后我们就可以对其进行考古。
  gts_evt_ancient.50.desc: "Our scientists have confirmed that this planet was a former colony of a pioneer civilization called the Irassians. After a little preparation, we can start archaeological research on it."
  # 伊拉斯废弃殖民地
  site_gts_yilasi: "Abandoned Irassian Colony"
  # 这是伊拉斯的一个殖民地
  site_gts_yilasi_desc: "This is a colony of the Irassians."
  # 先期调查
  gts_evt_ancient.51.name: "Preliminary Investigation"
  # 伊拉斯人是一种生活于一百万年前的哺乳动物，据说他们瘦小多病，但军事力量极为强大。\n\n准确来说，我们发现的不是伊拉斯的殖民地，而是原属于伊拉斯帝国治下的一个弱小的附庸国丘格拉的殖民地。\n\n这个星球驻扎了大量伊拉斯国军队，而许多城市都为了满足伊拉斯驻军的需要而进行了大规模专门改建，所以使我们造成了误解。\n\n丘格拉被入侵时尚处于太空时代早期，因此虽然丘格拉人的体型为伊拉斯人的两到三倍，却完全无法抵抗其侵略，反而被奴役为了他们的苦力。\n\n伊拉斯的强盛建立在对周围弱小文明的残酷压迫上，无论是这个故事还是这些遗存下来的伊拉斯人的高楼大厦和大量丘格拉人的乱葬岗都可见一斑。
  gts_evt_ancient.51.desc: "The Irassians were a mammalian species that lived a million years ago. They were said to be thin and sickly, but their military power was extremely strong.\n\nTo be precise, what we have discovered is not a colony of the Irassian, but a colony of Joggra, a weak vassal state that originally belonged to the Irassian Empire.\n\nA large number of Irassian troops were stationed on this planet, and many cities have been extensively modified to meet the needs of the Irassian garrison, which is why we made a mistake.\n\nThe Joggra were in the early stages of the space age when they were invaded, so although the size of the Joggra people was two to three times that of the Irassian, they were completely unable to resist their invasion and were instead enslaved as their coolies.\n\nThe prosperity of the Irassians was built on the brutal oppression of the surrounding weak civilizations. This is evident from both this story and the remains of Irassian high-rise buildings and mass graves of Joggra people."
  # 抵抗
  gts_evt_ancient.52.name: "Resistance"
  # 伊拉斯的繁荣下暗流涌动，无数地下组织面对伊拉斯的侵略和压迫进行着无力但坚决的反抗。\n\n一支流亡在外的丘格拉解放组织偶然得知一种名为贾沃疹的病毒对伊拉斯人有极强的杀伤力，就在不久前造成了他们一个新殖民地的毁灭。\n\n这对抵抗组织以全军覆没为代价，为丘格拉的其他抵抗组织偷到了一份贾沃疹样本。\n\n但丘格拉对贾沃疹的毒性和病理一无所知，不敢冒着整个种族一起毁灭的风险使用这一病毒。\n\n就在抵抗的希望陷入困境时，那位巨大 maiden出现了。
  gts_evt_ancient.52.desc: "Under the prosperity of the Irassians, undercurrents surged, and countless underground organizations were engaged in futile but resolute resistance against the Irassians' invasion and oppression.\n\nA Joggra liberation organization that was exiled abroad accidentally learned that a virus called Javorian Pox was extremely lethal to the Irassian's people, and had recently caused the destruction of one of their new colonies.\n\nAt the cost of complete annihilation, this resistance organization stole a sample of Javorian Pox for other resistance organizations in Joggra.\n\nHowever, Joggra knew nothing about the toxicity and pathology of Javorian Pox, and dared not risk destroying their entire race using this virus.\n\nJust as the hope of resistance was in trouble, that giant girl appeared."
  # 阴影
  gts_evt_ancient.53.name: "Shadow"
  #  maiden的突然出现给星球上的两个种族都带来极大的恐惧。抵抗组织在发现伊拉斯人同样惊恐万分后，意识到这并不是伊拉斯人的某种新型武器，而 maiden的出现或许反而能为丘格拉研究贾沃疹提供宝贵的窗口期。\n\n一位医生临危受命，携带着器材和贾沃疹样本，冒险驾驶一架航天器飞入 maiden衣服的夹层里搭建了秘密实验室。\n\n数月后，这位医生带回了一个喜讯：贾沃疹仅仅对伊拉斯人有威胁，而对其他物种来说则毫无影响。\n\n而医生依托从 maiden身体和衣服上提取的细菌与病毒，甚至改进了这一天赐的生物武器，使它对伊拉斯人的杀伤力和传播性更上一层。\n\n在这个千载难逢的时机下，各路抵抗组织达成共识，整合为丘格拉解放同盟。\n\n他们纷纷接种了改进版贾沃疹病毒，随后开始了对伊拉斯高官和驻军的高强度投毒和刺杀。\n\n同时号召饱受奴役的丘格拉人通过接种贾沃疹病毒去驱散\"伊拉斯病毒\"。
  gts_evt_ancient.53.desc: "The sudden appearance of the girl brought great fear to the two races on the planet. After discovering that the Irassians were also terrified, the resistance organization realized that this was not some new type of weapon from the Irassians, and that the girl's appearance might provide a valuable window for Joggra to study Javorian Pox.\n\nA doctor was ordered in the face of danger, carrying equipment and a Javorian Pox sample, and ventured to fly a spacecraft into the layers of the girl's clothes to build a secret laboratory.\n\nMonths later, the doctor brought back good news: Javorian Pox only posed a threat to the Irassians, and had no effect on other species.\n\nAnd based on the bacteria and viruses extracted from the girl's body and clothes, the doctor even improved this godsend biological weapon, making it even more lethal and contagious to the Irassians.\n\nAt this opportune moment, various resistance organizations reached a consensus and integrated into the Joggra Liberation League.\n\nThey have successively inoculated themselves with the improved version of the Javorian Pox virus, and then began a high-intensity campaign of poisoning and assassinations against senior Irassians officials and garrisons.\n\nAt the same time, they called on the enslaved Joggra people to use the Javorian Pox virus to dispel the \"Irassian virus\"."
  # 解放
  gts_evt_ancient.54.name: "Liberation"
  # 伊拉斯驻军在发觉异常后，立刻向本部报告并开始无差别屠杀控制区内的所有丘格拉人。但为时已晚。\n\n解放同盟见时机成熟，将暗中反抗发展为公开暴乱。愤怒的丘格拉人纷纷拿起武器，主动感染贾沃疹，不顾性命地袭击伊拉斯驻军营地。\n\n在潮水般攻势下的幸运逃离的伊拉斯驻军龟缩在地堡中一边等待援军一边祈祷着不会被携带贾沃疹的起义军发现。\n\n而那些被抓获的伊拉斯军队和官员则被起义军施以各种凌辱后再直接拧碎，从他们曾用以享乐的高楼上扔下去。\n\n反抗取得全面胜利后，丘格拉人将那位巨大 maiden奉为解放之神，随后通电各个饱受伊拉斯压迫的小国时机已到，是时候反抗了。\n\n当然那位 maiden显然是不知道自己身下的小小星球因为自己发生了什么，又将如何导致一个银河霸权的毁灭。\n\n在丘格拉的舰队飞往各个盟国支援时，这个 maiden也离开了这个星系。
  gts_evt_ancient.54.desc: "After noticing an abnormality, the Irassian garrison immediately reported to their headquarters and began to indiscriminately slaughter all Joggra people in the controlled areas. But it was too late.\n\nThe Liberation League saw that the time was ripe and turned their underground resistance into an open revolt. The furious Joggra people took up weapons, actively infected themselves with Javorian Pox, and attacked Irassian garrisons' camps without regard for their lives.\n\nThe Irassian garrison, who were lucky enough to escape under the tidal wave of attacks, huddled in bunkers, waiting for reinforcements while praying that they would not be discovered by the rebels carrying Javorian Pox.\n\nThose Irassian troops and officials who were captured were subjected to various humiliations by the rebels and then directly crushed and thrown down from the high-rise buildings they had once used for enjoyment.\n\nAfter the resistance achieved a complete victory, the Joggra people hailed the giant girl as the god of liberation, and then announced to various small countries that were suffering under the oppression of the Irassians that the time had come to resist.\n\nOf course, that girl obviously did not know what had happened on the little planet under her, or how it would lead to the destruction of a galactic hegemony.\n\nWhen the Joggra fleet flew to various allied countries to provide support, this girl also left the star system."
  # 线索
  gts_anomaly_sixth_category: "Clues"
  # 发现sol3星
  gts_evt_ancient.60.name: "Discovery of Sol3 Star"
  # 我们的科学家证实了这曾是一个尚处于前太空时代的土著物种的母星，在此前的调查中从未有过关于恒星级巨娘与土著文明交互的记录，因此这个遗址的研究价值极大，我们稍做准备就可以进行考古了。
  gts_evt_ancient.60.desc: "Our scientists have confirmed that this was once the home star of an indigenous species that was still in the pre-space age. There had been no records of interactions between a stellar-level giant girl and an indigenous civilization in previous investigations, therefore this site has great research value. We can begin archaeological research after doing some preparation."
  # 荒芜的sol3遗址
  site_gts_soI: "Ruins of Desolate Sol3"
  # 这是人类文明的母星
  site_gts_soI_desc: "This is the homeworld of the human civilization."
  # 先期调查
  gts_evt_ancient.61.name: "Preliminary Investigation"
  # 这是一个活跃于两万年前，处于太空时代早期的人类土著文明，其称其母星为地球。该文明尚未实现统一，而毁灭他们的核战争大概是该文明关系紧张相互对峙的三个势力被一连串意外事件刺激导致的。\n\n地表上旧文明存在的痕迹已经被核弹轰炸和核冬天基本抹去了，不过我们发现了数个特殊的弹坑，其大小远不像核武器爆炸能造成的。\n\n在一个远离主大陆的大陆上，我们发现了一个突兀的建筑物，我们不久后将动身前往调查。
  gts_evt_ancient.61.desc: "This is a human indigenous civilization that was active two thousand years ago and was in the early stages of the space age. They called their home star Earth. This civilization had not yet achieved unification, and the nuclear war that destroyed them was probably caused by a series of unexpected events that stimulated the three factions that were involved in tense confrontation with each other.\n\nThe traces of the old civilization on the surface have been largely erased by nuclear bombings and nuclear winter, but we have discovered several special craters, whose size is far from what a nuclear weapon explosion can cause.\n\nOn a continent far from the mainland, we discovered an abrupt building. We will set off to investigate soon."
  # 卫星
  gts_evt_ancient.62.name: "Satellite"
  # 我们挖到了一个坠毁的大型空间站，但除了外观以外，这个空间站无论是技术水平还是各个仓室的规格都不像是地球的土著文明制造出来的。\n\n在随后的搜索中我们果然查到了这个空间站的所有者。这是一种棘皮动物，外貌类似海星，而这个空间站是这个文明在地球建立的观测站。但为什么这个空间站会不做任何处理而被直接抛弃呢？\n\n空间站内不少文件和仪器都毁于飞入大气层时产生的高温与坠地时的剧烈爆炸，不过我们还是从中找到了不少记录，或许能帮我们解答这些问题。
  gts_evt_ancient.62.desc: "We dug out a crashed large space station, but apart from its appearance, the space station does not seem to be manufactured by Earth's indigenous civilization in terms of either technical level or the specifications of the various cabins.\n\nIn the subsequent search, we did indeed find the owner of this space station. This is a starfish-like echinoderm, and this space station is an observation station established by this civilization on Earth. But why was this space station directly abandoned without any processing?\n\nNumerous documents and instruments in the space station were destroyed by the high temperature generated when entering the atmosphere and the violent explosion when it crashed, but we still found many records from them which might help us answer these questions."
  # 报告
  gts_evt_ancient.63.name: "Report"
  # 我们破译了幸存的一部分档案，这些档案明确记录了这个 maiden与地球存在着某种紧密联系。\n\n\n2527.9.1. 太阳系\n本年度第三次汇报\n\n一切如常。\n\n第四国际,老同盟国和太平洋公约的对峙还在进行。三个势力在亚马逊的代理人战争有恶化的征兆，老同盟国和第四国际都在向亚马逊秘密运输核武器，而太平洋公约也开始将他们的核动力航母舰队回调，而他们目前都还没发现对方的小动作。如果我们不进行干预的话，那个地方过不了几个月就要热闹起来了。\n\n虽然我们和他们有宿仇，但坐视一个文明因为一时短视而毁于一旦是很可惜的，更不要说异星科研院下达的第一命令是长期维持这些猴子的势力均衡和发展停滞而不是毁灭。\n\n我再次请求我坐在办公室里的同事们批准我对这些愚蠢的生物进行一些干预，不然等到下次汇报时我只能讲讲这个星球还剩下多少蟑螂和老鼠了。\n\n\n2527.9.12. 太阳系\n\n我知道这违反通讯静默条例，但我觉得非常有必要立刻向你们汇报。\n\n我们发现了一个巨大的人类雌性个体从太阳系的超空间出口出现！\n\n我知道这很荒唐，但这是真的。\n\n从外貌看她大概和地球的高中生相仿，穿着也与第四国际的高中水手服很像。在我们刚侦测到她时她的高度至少有上百亿公里，（注:该长度已经过与我们长度单位的换算）并直奔地球而来。随着她越来越近，她的身体开始迅速变小，当她到达地球上空时，身高已经缩小到了一米多高。幸好我们的空间站伪装做的很成功，她并未发现我们。之后她便凭空消失了。\n\n我们派出的探测无人机在第四国际的一个加盟国的荒漠中发现了她的身影，但...我不知道是我太心慌意乱了还是她真的发现了无人机，我们的无人机突然失控，然后坠落,燃烧,解体。\n\n我再重复一遍，我没有开玩笑，这和你们不批准我进行干涉没有关系，请你们务必重视起来。
  gts_evt_ancient.63.desc: "We have deciphered a surviving portion of the archives and these archives clearly record that this girl had a close connection with Earth.\n\n\n2527.9.1. Solar System\nThird report of this year\n\nEverything is normal.\n\nThe confrontation between the Fourth International, the Old Allied Nations, and the Pacific Pact is still ongoing. The proxy war between the three factions in the Amazon has signs of worsening. The Old Allied Nations and the Fourth International are secretly transporting nuclear weapons to the Amazon, and the Pacific Pact has also begun to recall their nuclear-powered aircraft carrier fleets, and none of them currently have discovered the others' little actions. If we do not intervene, that area will be very lively in a few months.\n\nAlthough we have old grudges with them, it would be a great pity to sit idly by and watch a civilization be destroyed by their short-sightedness, not to mention that the first order issued by the Alien Scientific Research Institute is to maintain the balance of power and stagnation of these monkeys in the long term instead of destruction.\n\nI am once again requesting my colleagues in the office to approve me to make some interventions in these stupid creatures, otherwise I will only be able to talk about how many cockroaches and rats are left on this planet at the next report.\n\n\n2527.9.12. Solar System\n\nI know this violates the communication silence regulations, but I think it is very necessary to report to you immediately.\n\nWe discovered a huge human female individual emerging from the hyperspace exit of the solar system!\n\nI know this sounds crazy, but it's true.\n\nFrom her appearance, she looks similar to a high school student on Earth. Her clothes are also very similar to the high school sailor uniforms of the Fourth International. When we first detected her, her height was at least hundreds of billions of kilometers (Note: The length has been converted to our unit of length) and she was heading straight for Earth. As she got closer and closer, her body began to shrink rapidly. When she reached the Earth's sky, her height had shrunk to more than one meter. Fortunately, our space station's disguise was very successful, and she did not discover us. After that, she disappeared out of thin air.\n\nOur scout drones found her in a desert of an affiliated country of the Fourth International, but... I don't know if I was too flustered or if she really found the drone, our drone suddenly lost control and then crashed, burned, and disintegrated.\n\nI repeat, I am not joking. This has nothing to do with you not approving my intervention. Please take this seriously."
  # 录音
  gts_evt_ancient.64.name: "Recording"
  # 在观测站的底部，我们找到一个舱室。看起来是用来给违规船员关禁闭用的。我们在里面找到了几份录音，看起来是属于那位海星科学家的。\n\n2527.9.23. \n这群人真是疯了，科研部不相信我就算了，居然派来生态科的专员来顶替我，是来成心恶心我吗？那些科研员也改口说是数据错误和探测器故障 -  - 怎么可能！算了，他们还年轻，也要考虑自己的前程。他们下个月会接我离开这里，到时候又要给我安排什么罪名呢？再见了，猴子们，至少我不用目睹你们走向灭亡了。\n\n2527.10.20. \n为什么要主动引起核战争？\n\n这些猴子出人意料地自己成功解决了危机，三方都开始撤军，甚至连亚马逊战争的停火看起来都有希望了。但为什么要主动引起核战争？难道是科研部改主意了？还是那个那个混账专员私自下令的？有没有人能告诉我为什么啊！\n\n2527.10.23. \n\n核战争爆发了。\n\n核威慑下的和平真是牢固而又脆弱，坚固到维持了三大势力近百年的和平，脆弱到一个警报信号和频道干扰就能打破。\n\n全都结束了，地球剩下的活人应该只剩下空间站的宇航员和深海的核潜艇船员了，但是没了地面的辅助，恐怕也活不了多久。哦，还有那个把我搞得如此落魄的巨大 maiden，但几个小时过去了地表也毫无反应，难道她也被炸死了？亦或这一切真的只是我的臆想...\n\n我们又发现她了。\n\n她不仅毫发无伤，还立刻成长到与大气层同高，但和当时遇到的她完全不一样了。她的校服毫无破损，只是被核尘埃染上了一层灰色，但她的眼神失去了光亮。她从第四国际东方的废土中起身，一路向西碾碎了老同盟国和太平洋公约一切城市与埋藏其间的幸存者。如同神明对触怒她的凡人降下惩罚。\n\n之后她缓缓转身看向我们，强烈的负面情绪顿时如利箭般刺穿了我的头脑，这就是灵能科在研究的灵能攻击吗？但怎么会如此强大。\n\n不知多久后，我在晕眩中爬起身来，禁闭室房门大开，我跌跌撞撞的跑到上层寻找我的同事们。\n\n然而找遍整个观测站，除了我，其他人都面目狰狞，似乎经历了极大的痛苦后死去了。她到底是什么人...\n等等，她这是向我们母星的方向去了吗，她怎么会知道...不行，我要离开这里，就算被他们毙了我也要去警告他们，押送我的船呢？逃生舱在哪？！\n\n这个观测站的通讯都是单向加密传输的，我们并不知道这些海星的母星到底在哪。如果那个 maiden真的被激怒了的话，整个星系恐怕也早已被抹灭摧毁了。
  gts_evt_ancient.64.desc: "At the bottom of the observatory, we found a cabin. It seemed to be used to confine personnel who had broken the rules. We found several recordings inside, which seemed to belong to that starfish scientist.\n\n2527.9.23.\nThese people are crazy. It's fine if the research department doesn't believe me, but they actually sent a specialist from the ecology department to replace me. Are they deliberately disgusting me? Those scientific research personnel also changed their minds, saying it was a data error and a probe malfunction - how is that possible! Oh well, they are still young and must take their future into consideration. They will pick me up from here next month. What crime will they assign me then? Goodbye, monkeys. At least I don't have to witness your demise.\n\n2527.10.20.\nWhy start a nuclear war?\n\nThese monkeys unexpectedly managed to successfully solve the crisis themselves. All three parties began to withdraw their troops, and there were even hopes for a ceasefire in the Amazon war. But why start a nuclear war? Did the Research Department change its mind? Or did that bastard specialist issue an order on his own? Can anyone tell me why!\n\n2527.10.23.\n\nA nuclear war has erupted.\n\nThe peace under nuclear deterrence is so solid and fragile. It has been solid enough to maintain nearly a hundred years of peace among the three major factions, but it is so fragile that a warning signal and channel interference can break it.\n\nIt's all over. The remaining living people on Earth should only be the astronauts on the space station and the nuclear submarine crew in the deep sea, but without ground support, they probably won't survive long. Oh, and the giant girl who has put me in such a miserable state, but there has been no response on the surface for several hours. Did she also get blown up? Or is all of this just my imagination...\n\nWe have found her again.\n\nNot only was she unscathed, but she immediately grew to the height of the atmosphere, but she was completely different from what we encountered at that time. Her uniform was undamaged, but it was stained with a layer of gray from nuclear dust, and her eyes had lost their light. She got up from the eastern wasteland of the Fourth International and crushed all the cities of the Old Allied Nations and the Pacific Pact on her way west, and the survivors buried within them. It was like a god punishing the mortals who had angered her.\n\nAfter that, she slowly turned to look at us, and a strong negative emotion instantly penetrated my head like an arrow. Is this the psionic attack that the psionics department was researching? But how can it be so powerful.\n\nAfter an unknown period, I got up from the dizziness, the door of the confinement room wide open. I staggered to the upper level to find my colleagues.\n\nHowever, after searching the entire observatory, everyone else was grimacing, as if they had died after experiencing great pain. Who is she exactly...\nWait, is she going in the direction of our home star? How does she know...no, I have to leave here, I would rather be killed by them than not warn them! Where is the ship that will pick me up? Where is the escape pod?!\n\nThe communication of this observatory is all unidirectional encrypted transmissions, so we don't know where the home star of these starfishes is. If that girl had really been angered, the entire star system would probably been obliterated long ago."
  # 线索
  gts_anomaly_seventh_category: "Clues"
  # 发现不明先驱废弃殖民地
  gts_evt_ancient.70.name: "Discovery of Unknown Precursor Abandoned Colony"
  # 我们的科学家证实了这个星球是一个某个先驱文明的前殖民地，但具体信息无法查明，稍做准备后我们就可以对其进行考古。
  gts_evt_ancient.70.desc: "Our scientists have confirmed that this planet was a former colony of some precursor civilization, but the specific information cannot be determined. After a little preparation, we can start archaeological research on it."
  # 废弃殖民地
  site_gts_gurunuer: "Abandoned Colony"
  # 这是一个未知古代文明的殖民地
  site_gts_gurunuer_desc: "This is a colony of an unknown ancient civilization"
  # 先期调查
  gts_evt_ancient.71.name: "Preliminary Investigation"
  # 这个种族存在的年代极为古老，我们既找不到他们的化石，又无法确定其活跃的具体时间，他们只留下了由纳米机器人制作的坚固建筑群。\n\n我们从中唯一能确定的就是他们曾在这个星球生活过，并使用纳米机器人制作了我们现在赖以进行超空间航行的网道。
  gts_evt_ancient.71.desc: "This race existed in extremely ancient times. We cannot find their fossils or determine their specific period of activity. They only left behind solid building complexes made of nanobots.\n\nThe only thing we can be sure of is that they lived on this planet and used nanobots to create the hyperlane network that we now rely on for hyperspace navigation."
  # 来历
  gts_evt_ancient.72.name: "Origin"
  # 我们终于调查到了他们的身世。\n\n这个物种名为德萨努，而且这个国家并非银河系的原生文明，而是来自一个名为l星团的遥远系外星域。\n\n其神秘的身份在历史的掩盖下显得更加扑朔迷离，我们只知道当这个文明通过某种手段来到银河系后，立刻依仗其强大的科技与军事力量开始了对全银河系的战争。\n\n在短短五十年里，德萨努便征服了整个银河系。
  gts_evt_ancient.72.desc: "We finally investigated the origins of their people.\n\nThis species is called the Dessanu, and this nation is not a native civilization of the galaxy, but rather from a distant extrasolar region called the L-Cluster.\n\nIts mysterious identity became even more confusing under the cover of history. All we know is that after this civilization came to the galaxy by some means, it immediately relied on its powerful technology and military force to begin a war against the entire galaxy.\n\nIn just fifty years, the Dessanu conquered the entire galaxy."
  # 异常
  gts_evt_ancient.73.name: "Anomaly"
  # 在统一银河系之后，德萨努稍加准备，便开始计划对其他星系的征服。\n\n然后...德萨努就开始全力投入科研，随着第一批纳米机器人完工，德萨努开始了建立环银河的超空间网道系统，并将纳米机器人越来越多的投入日常生活和工业生产中。\n\n这段记录十分诡异，前后两段互相矛盾，而中间也没有被删减或修改的痕迹，两段记录的连结如此自然，德萨努人丝毫没有觉得异常。\n\n他们的文明就像是被无形的存在引导和强制修改了一般...\n\n这种猜测让我们的科学家不禁感到一丝恶寒。
  gts_evt_ancient.73.desc: "After unifying the galaxy, the Dessanu made some preparations and began planning for the conquest of other galaxies.\n\nThen... the Dessanu began to devote all their energy to scientific research. As the first batch of nanobots was completed, the Dessanu began to establish a hyperlane network system around the galaxy and put more and more nanobots into daily life and industrial production.\n\nThis record is very strange. The two sections before and after contradict each other, and there are no traces of deletion or modification in the middle. The connection between the two sections is so natural that the Dessanu people did not feel unusual at all.\n\nTheir civilization seems to have been guided and forcibly modified by an invisible entity...\n\nThis speculation made our scientists feel a chill."
  # 离去
  gts_evt_ancient.74.name: "Departure"
  # 德萨努文明的消失更加蹊跷，在他们完成超光速网道后，他们将全部舰队调回l星团，随后强制召回了全部银河系内的纳米机器人。\n\n之后l星门被严密封锁，再也没有人知道l星团发生了什么，以及德萨努协和国为什么要这么做。\n\n至少德萨努文明的遗产 -  - 超光速网道留了下来，对银河的无数生物与政权产生了极为深远的影响。\n\n没有它，我们以及所有其他文明或许将永远被困在自己的母星系里，永远不可能在银河中建立一个帝国。
  gts_evt_ancient.74.desc: "The disappearance of the Dessanu civilization was even more peculiar. After they completed the faster-than-light network, they transferred all their fleets back to the L-Cluster and then forcibly recalled all the nanobots in the galaxy.\n\nAfter that, the L-Gate was strictly sealed, and no one knew what happened in the L-Cluster, or why the Dessanu Concordat did this.\n\nAt least the legacy of the Dessanu civilization-the faster-than-light network-has been left behind, which has had a profound impact on countless creatures and regimes in the galaxy.\n\nWithout it, we and all other civilizations might be forever trapped in our own home systems, and it would never be possible to establish an empire in the galaxy."
  # 线索
  gts_anomaly_eighth_category: "Clues"
  # 发现巴奥废弃殖民地
  gts_evt_ancient.80.name: "Discovery of Abandoned Baol Colony"
  # 我们的科学家证实了这个星球是一个自称巴奥的先驱文明的前殖民地，稍做准备后我们就可以对其进行考古。
  gts_evt_ancient.80.desc: "Our scientists have confirmed that this planet was a former colony of a precursor civilization called the Baol. After a little preparation, we can start archaeological research on it."
  # 巴奥废弃殖民地
  site_gts_baol: "Abandoned Baol Colony"
  # 这是巴奥的一个殖民地
  site_gts_baol_desc: "This is a colony of the Baol."
  # 郁郁葱葱
  gts_evt_ancient.81.name: "Lush"
  # 不同于我们曾发掘的各类埋藏于漫天风沙的遗址，这个星球被参天大树所包围着，即使我们的科考队训练有素，行走在高耸幽谧的森林阴影中时，也不禁感到了比起世界和宇宙，自己的渺小。\n\n但这种环境完全没有给这次调查带来多少帮助，相反，我们在这个星球不仅找不到任何建筑残骸，甚至连动物化石都很少找到，如果不是先期调查确定了这是一个先驱者文明的殖民地，我们恐怕会认为这只是一个未开发的蛮荒星球而已。\n\n我们只能将目光转向这漫山遍野的森林了。
  gts_evt_ancient.81.desc: "Unlike the various ruins we have excavated in the sand, this planet is surrounded by towering trees. Even though our scientific team is well-trained, as they walk in the tall and secluded shadows of the forest, they cannot help but feel their insignificance compared to the world and the universe.\n\nHowever, this environment did not bring much help to this investigation. On the contrary, we cannot find any building remains on this planet, and even animal fossils are rarely found. If it were not for the preliminary investigation confirming that this was a colony of a precursor civilization, we would probably think that this was just an undeveloped barbaric planet.\n\nWe can only turn our attention to the vast forests."
  # 森林
  gts_evt_ancient.82.name: "Forest"
  # 经过信息调查和基因比对，我们确认了这些巨型植物就是我们要找的巴奥，或者至少是它的同族。\n\n但这就更不合理了。这些现代巴奥根本不具备开智生物所需要的神经结构，与其他植物毫无二致。\n\n一个完全没有智能的物种怎么可能建立文明，更不要说建立一个横跨数个星区的银河政权了。\n\n功夫不负有心人，经过大规模的考古挖掘，我们终于在一个干涸河床的下面挖出了一个巴奥个体的化石。\n\n其构造与现代巴奥基本一致，但根部上长有大块的亚空间突触组织，这一组织常常用于超长距离的神经通讯 -  - 而这是一种蜂巢思维的专有天赋。\n\n在更深层的挖掘后，我们又成功在一座死火山附近发现了第二具化石。这个化石的年份比上一个化石更为久远。\n\n其没有亚空间突触组织，而是长有普通的神经系统。这些系统虽然简单，但也足够让这个巴奥被称作智慧生命了。\n\n这大概解释了我们的疑惑，巴奥原本是一种智慧物种，在经历了某种变故后变为了蜂巢意识，随后又因为某种变故，不仅解散了集体意识，甚至连作为开化物种最重要的智能也放弃了。
  gts_evt_ancient.82.desc: "After information investigation and gene comparison, we have confirmed that these giant plants are the Baol, or at least its kind.\n\nBut this is even more unreasonable. These modern Baol do not have the nerve structure required for sentient beings, and they are no different from other plants.\n\nHow could a species without any intelligence establish a civilization, let alone establish a galactic power that spans several star clusters?\n\nPersistence pays off. After large-scale archaeological excavations, we finally dug out a fossil of a Baol individual under a dried-up riverbed.\n\nIts structure is basically the same as that of modern Baol, but it has large pieces of subspatial synapse tissue on its roots, which is often used for ultra-long-distance neural communication-which is the unique talent of a hive mind.\n\nAfter digging deeper, we successfully discovered a second fossil near a dormant volcano. The age of this fossil is much earlier than the previous one.\n\nIt does not have subspatial synapse tissue, but rather an ordinary nervous system. Although these systems are simple, they are sufficient to allow this Baol to be called an intelligent being.\n\nThis probably explains our doubts. The Baol was originally a sentient species, but after experiencing some kind of change, it became a hive mind. Then, due to some kind of change, it not only disbanded the collective consciousness, but also abandoned its intelligence, the most important quality of a sentient species."
  # 进化
  gts_evt_ancient.83.name: "Evolution"
  # 我们成功找到了一个保存良好的巴奥生物计算机化石，并提取出了一些数据片段。\n\n这一发现同时也解释了为什么科考队找不到任何建筑残骸了，巴奥文明高度依赖其高度发达的有机科技。而随着他们的文明崩溃，时光流逝，他们的建筑也就消失殆尽。\n\n我们提取出的记录记载了他们文明的起源：\n\n巴奥文明在建立集体意识前虽然实现了星球统一，但一直停留在简单的农业社会。\n\n直到有一天巴奥的恒星被无边的阴影吞没，巴奥的母星陷入了持续十几年的冬天。\n\n气候突变沉重打击了依靠光合作用生存的巴奥族，为了生存，巴奥的树叶大量凋谢，而根系愈发强壮。对天空中这不可名状生物的恐惧也加深了幸存巴奥间的根系连结。\n\n当阴影消散，春天重归巴奥母星时，巴奥社会已经形成了弱集体意识，在寒灾中进化出的强大根系让巴奥迅速生长，这为巴奥建立完整的集体意识打下了基础。\n\n而在巴奥重新向全球进发时，它发现了来自那巨大生物遍布世界的冰陨石与有机质陨石。\n\n遮天蔽日的阴影让集体意识产生了发展科技、飞向太空的强烈愿望，而坠落陨石中的丰富养分与基因为完全集体意识的形成带来了最为关键的帮助。
  gts_evt_ancient.83.desc: "We have successfully found a well-preserved Baol bio-computer fossil and extracted some data fragments.\n\nThis discovery also explained why the scientific team could not find any building remains, the Baol civilization highly depended on their highly developed organic technology. As their civilization collapsed over time, their buildings also disappeared.\n\nThe records we have extracted record the origin of their civilization:\n\nAlthough the Baol civilization achieved planetary unification before establishing its collective consciousness, it remained in a simple agricultural society.\n\nUntil one day, the Baol's star was swallowed by boundless shadows, and the Baol's home planet fell into a winter that lasted for more than a decade.\n\nThe sudden climate change severely impacted the Baol race, which relied on photosynthesis for survival. In order to survive, the leaves of the Baol withered in large numbers, and their root systems grew stronger. The fear of the unfathomable creatures in the sky also deepened the connection between the root systems of the surviving Baol.\n\nWhen the shadows dissipated and spring returned to the Baol's home planet, the Baol society had developed a weak collective consciousness. The strong root system that had evolved in the cold disaster allowed the Baol to grow rapidly, which laid the foundation for the Baol to establish a complete collective consciousness.\n\nWhen the Baol was re-expanding globally, it discovered icy meteorites and organic meteorites from that giant creature all over the world.\n\nThe overwhelming shadows made the collective consciousness have a strong desire to develop technology and fly into space, and the rich nutrients and genes in the fallen meteorites brought the most critical help to the formation of the complete collective consciousness."
  # 烈焰
  gts_evt_ancient.84.name: "Flames"
  # 这一谜题已经解决了，但我们依旧没能找到巴奥随后脱离集体意识的原因。\n\n接下来围绕此课题的数次考古行动都以失败告终，最后我们只能宣布此原因不明，考古就此结束。\n\n科考队在入夜前登上了返程的火箭，高能燃料燃烧时灼目的烈焰将热浪一阵阵吹向前巴奥的家园，无边的密林仿佛发出了悲鸣。
  gts_evt_ancient.84.desc: "The puzzle has been solved, but we still haven't found out the reason why the Baol later left the collective consciousness.\n\nSeveral archaeological operations around this topic have failed. In the end, we can only declare that the reason for this is unknown, and the archaeological work has come to an end.\n\nBefore nightfall, the scientific team boarded the rocket back. The scorching flames as the high-energy fuel burned sent waves of heat toward the former home of the Baol, and the boundless forest seemed to emit a mournful cry."
  # 毁灭的机械星球
  site_gtsrobot: "Destroyed Mechanical Planet"
  # 肃正协议
  gts_evt_ancient.91.name: "Contingency"
  # 我们在总结考古发现后得知这个机械星球是由一个名为肃正协议的远古人工智能控制。\n这个人工智能监护着整个宇宙，并对所有研究危险科技的文明进行军事干预，以防止它们达到三十级奇点后引发危害整个宇宙的灾难。\n很难想像如此庞大复杂的军工体系在马力全开时会爆发出多么强大的产能。\n尽管如此，我们却不能在废墟中找到哪怕一把能用于星际战斗的武器，这或许说明这个星球当年很有可能动用了全部武器与敌人进行殊死搏斗。
  gts_evt_ancient.91.desc: "After summarizing the archaeological discoveries, we learned that this mechanical planet was controlled by an ancient artificial intelligence called the Contingency.\nThis artificial intelligence monitors the entire universe and takes military intervention against all civilizations that research dangerous technologies to prevent them from reaching the 30th level singularity and causing a disaster that would endanger the entire universe.\nIt is hard to imagine how powerful the production capacity of such a large and complex military-industrial system would be when it was running at full speed.\nNevertheless, we cannot find even one weapon in the ruins that could be used for interstellar combat, which may indicate that this planet likely used all its weapons to fight a desperate battle with the enemy back then."
  # 探测
  gts_evt_ancient.92.name: "Detection"
  # 通过修复残存的数据库和通讯系统，我们得知这个肃正星球在数万年前曾遭遇了一个恒星级的巨型生物，而这导致了这个星球的衰亡。\n以下是复原后的通讯信息：\n\"###肃正单位CX-1091 向CX-9881报告警戒信号 A1级###:\n侦测到有机体入侵\n##############################\n初步扫描结果\n性别:雌性 \n推测年龄:<已损坏>\n体积:<已损坏>\n穿着为白色连衣裙,蓝瞳，亚麻发色\n物种与sol星系的原始物种<已损坏>相似性最高,为99.4%\n威胁等级:极高\n##############################\n终止休眠程序...启动供电网络...激活战争设施...最终防御指令已启用。\
  gts_evt_ancient.92.desc: "By repairing the remaining database and communication system, we learned that this Purity planet encountered a giant stellar-level creature tens of thousands of years ago, and this led to the decline of the planet.\nBelow is the recovered communication information:\n\"###Purity Unit CX-1091 Reporting Alert Signal Level A1 to CX-9881###:\nOrganic Intruder Detected\n##############################\nPreliminary Scan Results\nGender: Female\nEstimated Age: <Damaged>\nVolume:<Damaged>\nWears a white dress, blue eyes, flaxen hair\nThe species and the original species of the sol system <Damaged> is 99.4% similar.\nThreat Level: Extremely High\n##############################\nTerminating Sleep procedure... Starting the power grid... Activating battle facilities... The final defense directive has been enabled.\"
  # 接敌
  gts_evt_ancient.93.name: "Engaging"
  # 在发现这个巨大 maiden之后，肃正协议立刻开始备战，星球地表的掩护被撤下，无数工厂露出地表。很快，大批舰队组装完成发起进攻。\n依据通讯信息，其他肃正星球也随即开始备战，临近的肃正星球将造好的舰队源源不断地向这个星系调动。\n但肃正舰队的轰击无法击穿她的编织严密的护甲，数万米长的母舰被轻轻碾碎，防御站被 maiden的引力捕捉，坠毁在她的身体上。\n一些舰队从其鼻腔和口腔进入，以图破坏其内脏，但舰船的攻击和自爆都没能造成丝毫伤害，而她的胃酸却能轻易融化坚固的水晶镀层装甲,将船体和ai系统腐蚀个干干净净。
  gts_evt_ancient.93.desc: "After discovering this giant girl, the Contingency immediately began to prepare for battle. The disguise of the planet's surface was removed, and countless factories were exposed to the surface. Soon, a large number of fleets were assembled to launch an attack.\nAccording to the communication information, other Purity planets also began to prepare for battle. The nearby Purity planets continuously transferred their built fleets to this star system.\nHowever, the bombardment of the Purity fleet could not penetrate her tightly woven armor. The mother ships tens of thousands of meters long were easily crushed, and the defenses were captured by the girl's gravity and crashed into her body.\nSome fleets entered through her nostrils and mouth in an attempt to damage her internal organs, but neither the attacks nor the self-explosions of the ships were able to cause any damage. On the other hand, her stomach acid could easily melt the solid crystal-plated armor, corroding the hulls and AI systems completely."
  # 终结
  gts_evt_ancient.94.name: "End"
  # 如此大规模的进攻却只能带来微不足道的伤害，这使得肃正协议相信她就是其创造者预测的三十级奇点危机。\n肃正协议便开始超载运行建造系统,并派出全部舰队,对那个巨大 maiden进行徒劳的进攻。\n在舰队全部撞毁后，肃正协议决定彻底毁灭整个星球，不给这个银河灾难留下一点可利用的资源。\n这次重大损失使得整个防御系统元气大伤，其他肃正星球也不知所踪。\n直到我国科研船经过，才触发了它残存的防御程序，让我们发现了这个尘封的星球。
  gts_evt_ancient.94.desc: "Such a large-scale attack could only do insignificant damage. This made the Contingency believe that she was the 30th-level singularity crisis predicted by its creators.\nThe Contingency began to overload the construction system and sent out all its fleet to make a futile attack on the giant girl.\nAfter all the fleets had crashed, the Contingency decided to completely destroy the entire planet to avoid leaving any available resources for the galactic disaster.\nThis major loss greatly damaged the entire defense system, and the other Purity planets also disappeared.\nIt was not until our scientific research vessel passed by that it triggered its remaining defense program, allowing us to discover this sealed planet."
  # 真是伟大的牺牲啊，每个文明都要为肃正协议的壮举表达敬意。
  GTSPRISE: "Such a great sacrifice, indeed. Every civilization must express its respect for the great deeds of the Contingency."
  # 终点
  gts_evt_ancient.100.name: "The End"
  # 依据我们收集到的线索，我们已经推测出这个超古代巨娘大致的行动轨迹，并将我们导向了一个黑洞星系 -  - 这很可能是她离开这个星系的地方。
  gts_evt_ancient.100.desc: "Based on the clues we have collected, we have deduced the approximate trajectory of this ancient giant girl, leading us to a black hole system - this is probably where she left this galaxy."
  # 立刻前去调查！
  gts_evt_ancient.100.a: "Go investigate immediately!"
  # 终末地
  system_gts_end: "The End Site"
  # 出口
  star_gts_end: "Exit"
  # 终末瞭望站
  planet_gts_end: "The End Observatory"
  # 瞭望站
  gts_end_habitat_category: "Observatory"
  # 这个突兀的太空居住站一定与那位巨娘存在联系
  gts_end_habitat_category_desc: "This abrupt space habitat must be connected to that giant girl"
  # 前文明瞭望站
  gts_evt_ancient.101.name: "Precursor Observatory"
  # 经初步调查，这个太空居住站虽然建造的年代很久远，但似乎是在几十年前才彻底停摆，我们的科学家强烈要求进入居住站进行搜索。
  gts_evt_ancient.101.desc: "According to a preliminary investigation, although this space habitat was built a long time ago, it seems to have been completely shut down only a few decades ago. Our scientists strongly request to enter the habitat for a search."
  # 终末瞭望站
  site_gtsend: "The End Observatory"
  # 我们距离真相越来越近了...
  site_gtsend_desc: "We are getting closer and closer to the truth..."
  # 瞭望站
  gts_evt_ancient.102.name: "Observatory"
  # 我们的考古人员费尽力气才打开了瞭望站结构简单，材质却异常坚硬的大门，里面的文件和尸骸证实了我们对其所处年代的判断。看来那些先驱者文明并没有彻底灭亡，它们在这位巨大 maiden身上派遣或遗落定居者的行为无心插柳般的将他们的文明以一种未曾设想的方式在她的身体上延续了下来。而且这些来自不同时代，原本不可能相遇的先驱者文明，也这样互相进行接触，在这位巨娘的身上开始了争夺霸权的传统艺能。
  gts_evt_ancient.102.desc: "Our archaeologists have painstakingly opened the simple but extremely hard gate of the observatory. The documents and corpses inside confirmed our judgment of its age. It seems that those precursor civilizations have not completely perished. Their behavior of sending or abandoning settlers on this giant girl unintentionally continued their civilization in an unimaginable way on her body. Moreover, these precursor civilizations from different eras, which could not have met each other, also contacted each other in this way, and began the traditional art of fighting for hegemony on this giant girl."
  # 体表战争
  gts_evt_ancient.103.name: "Surface War"
  # 在这些文件中我们可以看到在一个星系级生物的身上成长起来的文明独特的发展历程：\n因后勤补给断绝，科技极度衰退，这些文明从酋邦时代重新开始，常见矿物紧缺导致它们演化出了以巨娘身体分泌物和皮肤碎屑为主原料的科技树。如果能有幸发现被引力吸引坠落的行星，其资源则会被依据远古的标准建造模板用作制作宝贵的高端武器，在这星系般大小的平面上进行的体表战争中，似乎自供能坦克和超高速战机最受欢迎。\n这个瞭望站所属的文明似乎是丘格拉族和沃陶姆族混血为主体，这个文明控制着整个大脚趾和一旁的谷地，这让它们可以依托指缝间丰富的矿藏复原许多古代科技，他们也继承了其祖先在科研与建造上的天赋，利用标准建造模板制作了这个能侦查整个腿部的宏伟巨构，这让它们在抵抗 maiden身上据称最强大的势力尤特族数千年的入侵时也丝毫不落下风，后者则控制了小腿和膝盖间的大片领地。对于双腿更往上的文明，能找到的记录则十分模糊，多是一些传说，譬如一个强大文明在征讨阴毛中的蛮族时被反包围失去了全部精锐；统一了整个小腹的游牧帝国在西征时因领袖暴亡而解体之类的。
  gts_evt_ancient.103.desc: "In these documents, we can see the unique development path of a civilization growing on a stellar-level organism:\nDue to the interruption of logistical supplies and the extreme decline of technology, these civilizations restarted from the chiefdom era. The shortage of common minerals has led them to evolve a technology tree based on giant girl's body secretions and skin debris as their main raw materials. If they are lucky enough to discover planets that have been attracted by gravity, their resources will be used as valuable high-end weapons according to ancient standard construction templates. In the surface wars on this galaxy-sized plane, self-powered tanks and super-high-speed fighter jets seemed to be the most popular.\nThe civilization to which this observatory belongs seems to be mainly a hybrid of the Joggra and Vultaum races. This civilization controls the entire big toe and the valley next to it, which allows them to restore many ancient technologies relying on the rich mineral deposits in between the toe gaps. They also inherited their ancestors' talents in scientific research and construction and they used standard construction templates to create this magnificent mega-structure which can scout the entire leg. This allowed them to resist the invasion of the Yuht, which is said to be the most powerful force on the girl's body, for thousands of years without losing their dominance, while the Yuht controlled the large area between the lower leg and the knee. The records of the civilizations higher up on the legs are very vague, with many of them being legends, such as a powerful civilization was ambushed, and lost all its elites, when it was conquering the barbarians in the pubic hair; an nomadic empire that had unified the entire lower abdomen was disintegrated due to the sudden death of its leader during a western expedition, and so on."
  # 离去
  gts_evt_ancient.104.name: "Departure"
  # 根据能找到的最近数据，在这位 maiden离开这个宇宙的前夕，已经发展到太空时代早期的丘格拉-沃陶姆文明遭遇了越来越频繁的电子设备受损灾害，但我们仍不清楚是进入黑洞时，瞭望站因地面站恰巧失联而被迫留在这里，还是他们在经历了什么后决定与地面站分离。 我们找到的影视资料记录了这位 maiden挥手打开充满光芒的传送门后进入的全部过程，在带着身上的无数文明离开这片宇宙后，一个巨大的黑洞从关闭的传送门生成，看起来这个黑洞就掩藏着通往那个巨娘的世界的道路。不止是我们，这个瞭望站里的科研人员在传送门关闭后便一直研究如何重新启动传送门，以及传送门后到底是什么，虽然直到它们全部离世也没得到答案，但它们为我们留下了相当丰富的实验数据，或许在我们的科技辅助下，我们有望解开谜底。
  gts_evt_ancient.104.desc: "According to the most recent data we could find, on the eve of this girl's departure from this universe, the Joggra-Vultaum civilization, which had developed to the early space age, encountered increasingly frequent damage to electronic equipment, but we still don't know if the observatory was forced to stay here because they lost contact with the ground station because they were entering a black hole, or they decided to separate from the ground station after experiencing something. The video data that we found recorded the entire process of this girl waving her hand to open a glowing portal before leaving this universe; after leaving this universe with countless civilizations on her body, a huge black hole was generated from the closed portal, and it seems like this black hole hides the road to that giant girl's world. It is not just us, research staff in this observatory have been studying how to restart the portal after the portal closed, and what exactly is behind the portal. Although they were not able to find out an answer until their deaths, they have left us with a considerable amount of experimental data. Perhaps with the assistance of our technology, we might be able to unlock the mystery."
  # 进入黑洞
  GTS_GETINTO_BLACKHOLE_PROJECT: "Enter the Black Hole"
  # 我们距离真相越来越近了，只要我们能打开黑洞后的传送门...
  GTS_GETINTO_BLACKHOLE_PROJECT_DESC: "We are getting closer and closer to the truth. As long as we can open the portal behind the black hole..."
  # 超凡入圣
  gts_evt_ancient.105.name: "Transcendence"
  # 负责黑洞调查的科学家终于打开了传送门！但以我们的能力，我们只能打开一个极度不稳定，大小也仅能供一人通过的小型隧道，在紧急情况下她选择由她独自进入传送门探索真相，传送门随后坍缩，现场的科研人员们紧张的等待着她能否为我们带回答案。
  gts_evt_ancient.105.desc: "The scientist in charge of the black hole investigation finally opened the portal! But with our abilities, we can only open a small tunnel that is extremely unstable and only large enough for one person to pass through. In an emergency, she chose to enter the portal alone to explore the truth, and then the portal collapsed. The researchers at the site are nervously waiting to see if she can bring us an answer."
  # 让小花田去！
  gts_evt_ancient.105.a: "Let Huatian go!"
  # 让艾普露去！
  gts_evt_ancient.105.b: "Let Apro go!"
  # 天外世界
  gts_evt_ancient.110.name: "The Extraterrestrial World"
  # 我们的黑洞监视组收到了一串 video信号。在 video中，那位进入黑洞的科学家十分忧虑地向我们通知，我们所生活的宇宙实际上位于一群巨娘的社会学实验室的培养皿中，这些大到我们无法理解的生物使用一个传送门极度缩小以进入我们的宇宙进行细致观察并对宇宙内文明的发展进行干预。穿越传送门让这位科学家的体型变大到与这些巨娘相近 -  - 现在她出生的宇宙尚没有她的手心大，这让她得以混迹于她们之中，为我们传递了这些信息。为了避免传输信息过多被发现，在用我们的方式为我们族群的命运祈福后，她便终止了通讯。
  gts_evt_ancient.110.desc: "Our black hole monitoring team has received a series of video signals. In the video, the scientist who entered the black hole is very worried and informs us that the universe we live in is actually located in a petri dish of a giants' sociological laboratory. These creatures, who are too large for us to understand, are using a portal to greatly shrink to enter our universe for close observation and interfere with the development of civilizations within the universe. Crossing the portal has increased the size of this scientist to be similar to that of these giants-now the universe where she was born is not even as big as the palm of her hand, which allows her to mingle among them and pass the information onto us. In order to avoid being discovered for transmitting too much information, she ended the communication after using our ways to pray for the fate of our race."
  # 轮回
  gts_evt_ancient.111.name: "Reincarnation"
  # 我们的黑洞监视组收到了一串 video信号。在 video中，那位进入黑洞的科学家似乎正在一片虚无之中，她向我们传达了一个令人不安的消息：不知道是传送门扩大了其体型还是这个宇宙本来如此，每个恒星都不过指甲大，更不要说宛如尘埃般的行星了。按照她的计划，她将会在这个宇宙四处考察，并在\"合适的时候\"回到我们的宇宙。在我们责令其立刻返回之前，她就切断了与我们的一切通讯。
  gts_evt_ancient.111.desc: "Our black hole monitoring team has received a series of video signals. In the video, the scientist who entered the black hole seems to be in a void. She conveyed a disturbing message to us: whether it was the portal's expansion of her size or whether this universe was originally like this, each star is only the size of a fingernail, not to mention the planets which are like dust. According to her plan, she will investigate this universe everywhere and return to our universe at the 'right time'. Before we ordered her to return immediately, she cut off all communication with us."
  # 真神
  gts_evt_ancient.112.name: "True God"
  # 我们的黑洞监视组收到了一串 video信号。在 video中，那位进入黑洞的科学家精神状态看起来非常糟糕，她向我们表示，我们生活的整个宇宙都是统治多元宇宙的女神脚边的灰尘罢了，这位女神会在不同的宇宙中漫游以巨娘之姿玩弄星球和文明寻欢作乐，而她偶尔的潜入我们宇宙时的化身便是我们寻找的超古代巨娘。如今，这位科学家被女神发现，并被变大数亿万倍后成为她脚上负责清理僭越宇宙的奴仆，这位 maiden科学家利用自己的职能之便，小心翼翼地将我们的宇宙塞进其胖次里保护起来，这是能为我们做的最后的帮助了。当我们希望了解更多时，一股强大的灵能波动打断了我们的通讯。
  gts_evt_ancient.112.desc: "Our black hole monitoring team has received a series of video signals. In the video, the scientist who entered the black hole seems to be in very bad mental state. She informed us that our entire universe is just the dust beside the feet of a goddess who rules the multiverse. This goddess will roam in different universes, manipulating planets and civilizations in the guise of a giant seeking pleasure, and that her occasional avatar when she enters our universe is the ancient giant girl we are looking for. Now, this scientist has been discovered by the goddess, and after being enlarged hundreds of millions of times, she has become a servant on her feet responsible for cleaning up the universes that have overstepped their boundaries. This girl scientist has used her position to carefully stuff our universe into her panties to protect us, which is the last bit of help she can give. When we wanted to learn more, a powerful psionic wave interrupted our communication."
  # 天哪...
  gts_evt_ancient.110.a: "Oh my god..."
  # 宇宙之外
  find_gts_end: "Beyond the Universe"
  # 我们终于找到了超古代巨娘的真相，尽管对大部分人来说尚难以接受，但这个消息极大改变了文化界和科学界对世界的认识，使我国的科学与文化变得异常繁荣。
  find_gts_end_desc: "We have finally found the truth about the ancient giant girl. Although it is still difficult for most people to accept, this news has greatly changed the cultural and scientific understanding of the world, making our country's science and culture exceptionally prosperous."
  # 高维汁液
  r_gts_endsweat: "High-Dimensional Juices"
  # 从瞭望站中搜出的神秘物质，不知是被那位星系级巨娘自身分泌或是从外世界带进来的，我们只能确定其有扭曲本宇宙客观规律和激起本宇宙生物强烈性欲的能力。
  r_gts_endsweat_desc: "A mysterious substance found in the observatory. Whether it is secreted by that stellar-level giant girl herself or brought from another world is unknown. We can only be sure that it has the ability to distort the objective laws of this universe and arouse strong sexual desire in the creatures of this universe."
  # 使境内3个人口随机转换为随机大小
  relic_endsweat_active: "Randomly converts 3 pops within the empire to random sizes"
  # 宇宙扭曲
  gts_evt_ancient.200.name: "Cosmic Distortion"
  # 在激活这种物质后，空间似乎发生了数分钟的扭曲，之后我们陆续收到了帝国各地的报告，许多人口在这次空间扭曲后发生了体型巨变。让她们重新适应这个迥然不同的社会需要一段时间，我们的相关政策和建设计划也要做出调整，不过至少从社会反应来看，大家似乎对这种奇妙的现象普遍持积极态度，看来就算我们继续搞下去也没有问题？
  gts_evt_ancient.200.desc: "After activating this substance, space seemed to be distorted for a few minutes. After that, we successively received reports from all over the empire that many pops had undergone huge changes in size after this space distortion. It will take some time for them to re-adapt to this vastly different society, and our related policies and construction plans will also need to be adjusted, but at least from the social reactions, everyone seems to have a generally positive attitude toward this wonderful phenomenon. It seems it should be fine even if we continue doing it?"
  # 境内3个人口将随机转换为随机大小
  gts_evt_ancient.200.tooltip: "Randomly converts 3 pops within the empire to random sizes"
  # 前往无限......
  gts_evt_ancient.7515.name: "To Infinity..."
  # 在暴烈的穿越之后，另一侧无比宁静。一种不自然的静滞围绕着我们。刺针受损了，但万幸没有失去核心部件，出谷记模块保护了我们，让我们得以保留原来的体型。在刹那间，遥测报告如洪水般涌来......
  gts_evt_ancient.7515.desc: "After a violent passage, the other side was extremely peaceful. An unnatural stillness surrounded us. The probe was damaged, but fortunately, it did not lose its core components. The Exit module protected us, allowing us to retain our original size. In an instant, telemetry reports poured in like a flood..."
  # ......超越无垠。
  gts_evt_ancient.7515.a: "...Beyond the Infinite."
  # 世界之外
  gts_evt_ancient.7516.name: "Beyond Worlds"
  # 我们的探针落在粉色的地上，这个世界的法则太过顽固，我们......\n突然，大地动了起来，天空一双巨眼看向了我们，那是我们的科学家！而我们正落在她的自慰棒上！\n\n「啊...忙了一天了，该休息一下了」\n\n她似乎成功的混入了那群巨娘，现在穿上了学生的制服\n\n「今天...就用这个吧」\n\n我们向她发出信息，但是我们发出的信息没有收到回应，受损的探针难以进行大范围现实修改\n粉色的大地携带着我们，向着红色的裂缝进入，她并没有注意到我们，在她的眼里，我们只是棒上的一点灰尘\n\n「啊...」\n\n我们被红色的裂缝吞没，狂乱的抽插不断侵袭着我们，而我们用更加狂乱的编辑回应着她\n\n「怎么会...感觉...太棒了...」\n\n我们的编辑似乎加大了对她的刺激，她的抽插更加猛烈，最终，足以淹没星河的爱液从我们上方掠过，而我们被留在了褶皱之中\n我们在满足她的欲望的同时还需要修复我们的探针，当探针修复，我们会给予她一个最大的刺激，以此吸引她的注意，在她的保护下生活，或前往下一个世界
  gts_evt_ancient.7516.desc.beyond: "Our probe landed on the pink ground, the laws of this world were too stubborn, we......\nSuddenly, the earth moved, a pair of giant eyes in the sky looked at us, it was our scientist! And we were falling on her dildo!\n\n'Ah...it's been a long day. Time to rest.'\n\nShe seemed to have successfully mingled with the giants, and is now wearing a student uniform.\n\n'Today...I'll use this one.'\n\nWe sent messages to her, but the messages we sent weren't replied. Our damaged probe had difficulties making large-scale reality alterations.\nThe pink ground carried us into the red crevice. She didn't notice us, and in her eyes, we were just a speck of dust on her toy stick.\n\n'Ah...'\n\nWe were swallowed by the red crevice; frantic thrusting constantly eroded us. And we responded to her with even more frantic editing.\n\n'How... does this feel... so good...'\n\nOur editing seemed to amplify the stimulation, making her thrust even more violently. Finally, a love fluid enough to submerge the Milky Way passed over us, leaving us behind in the folds.\nWe need to repair our probe while satisfying her desires. When the probe is repaired, we'll give her the greatest stimulation to attract her attention to live under her protection, or move on to the next world."
  # 现实在此处已经稀薄，能轻易地在我们指令的重压下弯曲，不同于科学家所说，我们所看见的星球全是正常大小，看来是传送门放大了她的体型\n突然，探测报告显示星系两侧有大质量物体袭来，那正是我们的科学家，而我们正在她的双峰之间!\n\n「太阳在胸口的感觉...暖暖的...」\n\n太阳在双乳的挤压下熄灭，可我们为了应对黑洞所做出的探针并未受到严重伤害，同时我们发现，借助这两座巨山的引力，我们对现实的修改更加轻松\n\n「咦...感觉胸口有些东西...」\n\n突然，她张开了胸口，将我们放在了指尖，虽然我们渺小如尘埃，但是凭借探针的修改，我们成功与她取得了联系\n\n「啊？用我的胸来进行项目？」\n\n她听到了我们的请求，脸上微微发红，但最终，她答应了我们的请求\n「当然可以了，毕竟是我的领袖嘛，不如说...」\n\n她举起放着我们的手指，缓缓的伸向自己的乳头，最终，我们被塞入乳腺，落入了白色的海洋\n\n「不如说...这里只有我一个人...我已经很寂寞了...」\n\n在她的帮助下，现实如同粘土一般随我们编织，而我们也为她排解寂寞与欲望，如同曾经对其他巨娘一般
  gts_evt_ancient.7516.desc.reborn: "Reality is already thin here, easily bent under the pressure of our orders. Unlike what the scientist said, all the planets we saw are normal size, it seems that the portal enlarged her body.\nSuddenly, the detection report showed that massive objects were attacking from both sides of the galaxy. It is our scientist, and we are between her breasts!\n\n'The feeling of the sun at my chest...it's so warm...'\n\nThe sun extinguished under the squeeze of her breasts, but the probes we made to deal with the black hole were not severely damaged as well as the discovery that with the help of the gravitational pull of these two giant mountains, we were able to edit reality more easily.\n\n'Huh...I feel something at my chest...'\n\nSuddenly, she opened her chest and placed us on her fingertips. Although we were as small as dust, we managed to get in touch with her thanks to the modifications made to the probes.\n\n'Huh? Use my chest to carry out projects?'\n\nShe heard our request, her face slightly flushed, but in the end, she agreed to our request.\n'Of course, after all, you are my leader, or rather...'\n\nShe raised her finger with us on it and slowly extended it to her nipple. Eventually, we were stuffed into the mammary glands and into a white ocean.\n\n'Or rather... only I am here... I'm already very lonely...'\n\nWith her help, reality is like clay for us to knit while we relieve her loneliness and desire, just as we did for other giants."
  # 我们的进入点晦暗而迷蒙......根据科学家最后传来的信息，这里应该是她的胖次之中，我们需要小心的从缝隙之间绕过，躲开女神的感知，去寻找一个初生的宇宙\n突然，光线明亮，胖次被拉开了！在我们进行行动之前，女神已经发现了我们！\n\n「可笑...你费力保护你的文明，他们却自己跑出来了，」\n\n女神嘲弄的看着我们，我们的科学家站在一旁，曾经伟大的科学家，现在只是女神的一个奴仆\n\n「主人，请不要...」\n\n不等科学家说完，女神已经把手指伸向了我们，我们曾经引以为傲的现实修改技术，现在没有发挥半点作用\n\n「该怎么惩罚这些虫子呢？有了...」\n\n突然，我们发现周围迅速放大！短短几秒，两人的身影已经超过了探针的探测范围\n\n「我允许你继续保护你的文明，不过...」\n\n突然，我们观测到一个褶皱空间吞噬了我们，这里是科学家的后庭，女神把我们放入她的嫩菊之中\n\n「之后你的文明会怎样，那就不知道了...呵呵...」\n\n我们最终迷失在了后庭之中，曾经，世界规则因我们而改变，现在，我们只是在肠道中挣扎的寄生虫
  gts_evt_ancient.7516.desc.god: "Our entry point was dim and hazy... Based on the last message sent by the scientist, this should be in the middle of her panties. We need to be careful to bypass the gaps and avoid the goddess's perception to look for a nascent universe.\nSuddenly, the light became bright, the panties were pulled open! Before we could act, the goddess had already found us!\n\n'Ridiculous... you did your best to protect your civilization, but they ran away on their own.'\n\nThe goddess was mocking us. Our scientist stood aside, a once great scientist turned into a slave of the goddess.\n\n'Master, please don't...'\n\nBefore the scientist could finish, the goddess had already extended her fingers toward us. Our reality alteration technology, which we were once so proud of, is now not working at all.\n\n'How should I punish these insects? Got it...'\n\nSuddenly, we found that our surroundings were rapidly growing larger! In just a few seconds, both of their figures had already exceeded the detection range of the probe.\n\n'I will allow you to continue protecting your civilization, but...'\n\nSuddenly, we observed a folded space devour us. This is the scientist's backdoor. The goddess put us in her tender petals.\n\n'What would happen to your civilization after this, you won't know... hehe...'\n\nWe have finally been lost in the backdoor. Once, world rules were changed by us. Now, we are just parasites struggling in the intestines."
  # 此处被白色的雾气覆盖，当时，随着小花田的进入，信号随之消失，一同消失的还有她的母星，我们需要警惕，防止意外情况发生\n突然，一个巨大的质量靠近，那正是我们的小花田！\n\n「饮料弄好了，接下来就是蛋糕了，咦？」\n\n正准备向蛋糕上撒上糖霜的小花田，发现了糖霜中的黑点，而依靠探针，我们也成功与她取得了联系\n\n「创造宇宙，好厉害呀！」小花田开心的听着我们诉说，「不过我现在要为主人准备下午茶了，我们下次再说吧」\n\n之后，我们看着小花田轻松破开宇宙壁垒，将源质倒上蛋糕，我们费劲全力只是前往新的世界，而她可以将宇宙随手揉搓，如果是之前，我们一定会把她当作神明崇拜\n可现在，她似乎服侍着更大的存在\n蛋糕的装饰已经完成，可我们发现，小花田似乎有了一丝迟疑\n紧接着，她打开了一个装饰盒，根据探针回馈的信息，那正是消失的sol3！\n不等我们反应过来，小花田已经将sol3切成四块，放在了蛋糕上面，震惊之余，我们立刻联系了她\n\n「...母星的毁灭我真的很心痛...可是...」小花田向我们说着「可是今天是我和主人相遇一周年的纪念日，我真的想为主人表达一些什么...」\n\n在与小花田的交谈中，我们悲哀的发现，曾经我们的守护者，小人文明最后的希望，大抵是倒向了巨娘一方，同时，在面对她的主人时，我们不能指望小花田为我们求情，我们只能自己想办法\n\n「欸？你们让我...把你们...放到蛋糕上？」\n\n小花田难以置信的看着我们，但还是同意了我们的想法，或许她也希望我们可以为她给主人的蛋糕献上一丝风味吧\n随着小花田的脚步，我们看见了一个睡眼惺忪的灰毛红眸小萝莉，这应该就是她的主人，千本黑羽了\n她似乎也惊讶于小花田使用了她的母星，而我们只能眼睁睁的看着小花田的母星消失在两人的口中\n终于，她的勺子挖向了我们，我们成败在此一举！\n\n「咦...」\n\n正在吃着蛋糕的黑羽停了一下，小花田立刻紧张起来\n\n「主人，怎么了吗，我做的蛋糕不好吗？」\n\n「不，你做的很好...你们也是」\n\n黑羽把我们从舌尖取下，放进小花田的嘴里，而我们修改参数，将探针味道调制最合适的状态\n\n「好甜...」\n\n「没想到这个宇宙还有这样的好东西，」\n\n黑羽说着，把我们取回，接着把放着我们的手指向下面伸去\n\n「如果你们能取悦我，你们就可以继续存在下去...啊...」\n\n此处现实已然固定，但她允许我们自由修改，我们时而进入两人胃中帮助消化，时而为她们的食物增添风采，时而 -  - 或者说最多的 -  - 作为她们的玩具，
  gts_evt_ancient.7516.desc.huatian: "This place is covered in a white mist. When Huatian entered, the signal disappeared, and so did her homeworld. We need to be wary to prevent accidents from happening.\nSuddenly, a huge mass got closer, and it was our Huatian!\n\n'The drink is ready, next is the cake, huh?'\n\nHuatian was about to sprinkle sugar on the cake when she discovered the black spots in the sugar. And with the help of our probe, we managed to contact her.\n\n'Creating universes, that's awesome!' Huatian listened happily as we spoke, 'But I need to prepare afternoon tea for my master now, let's talk next time.'\n\nAfterwards, we watched Huatian easily break through the barriers of the universe and pour the source material onto the cake. We struggled with all our might to just get to a new world, while she can knead the universe at will. If it were before, we would definitely worship her as a goddess.\nBut now, she seems to be serving a bigger being.\nThe decoration of the cake is completed, but we discovered that Huatian seemed to have been hesitating a bit.\nThen, she opened a decorative box, according to the feedback from the probes, it was the missing Sol3!\nBefore we could react, Huatian had already cut Sol3 into four pieces and put them on the cake. Shocked, we contacted her immediately.\n\n'...I'm really heartbroken about the destruction of my homeworld...but...' Huatian told us, 'But today is the anniversary of my first meeting with my master. I really want to express my feelings for her...'\n\nIn our conversation with Huatian, we sadly realized that our guardian, the last hope of the Small People civilization, had probably sided with the Giants. Also, when faced with her master, we could not expect Huatian to plead for mercy for us, so we can only think of a way out ourselves.\n\n'Huh? You want me to...put you...on the cake?'\n\nHuatian looked at us in disbelief, but still agreed with our idea. Maybe she was also hoping that we could add a trace of flavor to the cake she made for her master.\nFollowing Huatian's steps, we saw a sleepy grey-haired and red-eyed loli. This should be her master, Kaoru Kurohane.\nShe also seemed to be surprised that Huatian had used her homeworld, and we could only watch as Huatian's homeworld disappeared into the mouths of two beings.\nFinally, her spoon dug toward us. Our success or failure depends on this moment!\n\n'Huh...'\n\nKurohane, who was eating her cake, stopped for a moment, and Huatian immediately became nervous.\n\n'Master, is something wrong? Is the cake not good?'\n\n'No, you did it very well... and you as well.'\n\nKurohane took us off her tongue and put us in Huatian's mouth. As we modified the parameters, we adjusted the probe taste to the most suitable state.\n\n'So sweet...'\n\n'I didn't expect that this universe has such good things,'\n\nKurohane said, picked us up, and then stretched her hand with us downward.\n\n'If you can please me, then you can continue to exist...ah...'\n\nReality here was fixed, but she allowed us to modify it freely. We would sometimes go into the stomachs of the two beings to help with digestion, sometimes we would add some charm to their food, and sometimes-or more like most of the time-we would be their toys."
