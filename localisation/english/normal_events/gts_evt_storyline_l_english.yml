l_english:
  #  §H千海的联系方式已添加至帝国外交§!\n
  MESSAGE_GTS_QHAI: "§HQhai's contact information has been added to Imperial Diplomacy§!\n"
  #  微缩宇宙已进入
  MESSAGE_GTS_START: "Micro Universe Entered"
  #  §H欢迎游玩微缩宇宙！§!本MOD是§Y完全免费§!的GTS向MOD，你可以通过以下三种方式获得§Y最新版§!的MOD！\n§Y1.§!gw论坛：§Sgtswaltz.org§!\n§Y2.§!gn论坛：§Sgiantessnight.com§!\n§Y3.§!QQ群：§S636280246§!（加入需要gw或者gn账号）。
  MESSAGE_GTS_START_desc: "§HWelcome to the Micro Universe!§! This MOD is a §Ycompletely free§! GTS-oriented MOD. For acquring latest version of the mod, reference information page on Steam Workshop for more details."
  #  §H$concept_gts_version$§!
  MESSAGE_GTS_MOD: "§H$concept_gts_version$§!"
  #  $concept_gts_update_content$$MESSAGE_GTS_MOD_desc_ad_pic$
  MESSAGE_GTS_MOD_desc: "$concept_gts_update_content$$MESSAGE_GTS_MOD_desc_ad_pic$"
  #  \n\n\n\n\n\n\n\n\n£gts_update_pic_ad_1£\n\n\n\n\n\n\n\n\n
  MESSAGE_GTS_MOD_desc_ad_pic: "\n\n\n\n\n\n\n\n\n£gts_update_pic_ad_1£\n\n\n\n\n\n\n\n\n"
  #  §H银白通讯器已加入你的帝国遗珍§!
  MESSAGE_GTS_COM: "§ Silver Communicator has been added to your Empire Relics§!"
  #  你可以在左侧的§R发现§!界面中点至遗珍，找到通讯器并尝试与巨娘们建立联系。
  MESSAGE_GTS_COM_desc: "You can go to the Relics in the §RDiscovery§! interface on the left, find the communicator and try to establish contact with the Giantesses."
  #  你可以在左侧的§R通讯§!界面中找到千海的通讯方式，并获取一些帮助。
  MESSAGE_GTS_QHAI_desc: "You can find Qianhai's contact information in the §RCommunication§! interface on the left and get some help."
  #  起始
  gts_event_storyline.1.name: "Beginning"
  #  我们的帝国已迈入星辰大海，但仍有许多事物无法解析。一个奇异的通讯器在昨晚以离奇的方式出现在了统治者的身旁，科研部门经过了通宵的研究之后无功而返，他们的任何仪器和设备都无法有效作用于这个奇怪的通讯器之上，仿佛是完全不属于这个世界的造物。对于这个奇怪设备的处置权最终交还到了统治者的手上。
  gts_event_storyline.1.desc: "Our empire has entered the sea of stars, but there are still many things that cannot be analyzed. A strange communicator appeared strangely beside the ruler last night. The scientific research department returned without success after studying all night. None of their instruments and equipment could effectively work on this strange communicator, as if it were a creation completely not belonging to this world. The right to dispose of this strange device was finally returned to the ruler."
  #  翻看平板
  gts_event_storyline.1.option.1: "Check the tablet"
  #  先放置几日吧
  gts_event_storyline.1.option.2: "Leave it for a few days"
  #  跳过开局事件
  gts_event_storyline.1.option.3: "Skip opening event"
  #  关闭主线事件
  gts_event_storyline.1.option.4: "Close main storyline events"
  #  选择该选项后，主线事件§R无法再次开启§!，请注意
  gts_event_storyline.1.option.4.tooltips: "After selecting this option, the main storyline event §Rcannot be opened again§!, please note"
  #  起始
  gts_event_storyline.2.name: "Beginning"
  #  你看着桌子上摆放着的明显不是帝国科技所制造的仪器，不禁皱起眉头，就是这个略有厚实的平板在昨晚凭空出现在头部的上方，并狠狠痛击了你的脑袋。这个来历不明的设备充满了各种疑点，但某种直觉却告诉你，这背后或许隐藏着意想不到的机遇。\n\n你拿起平板，入手是种特殊的磨砂金属质感，冰凉触感透过指尖传来。屏幕和外壳的材质都前所未见，你仔细翻看设备细节，发现某些模块设计竟与帝国的全息通讯器有几分相似之处，也许两者有着类似的功能？\n\n思索间，手指摸索到了一个明显的突起按钮。
  gts_event_storyline.2.desc: "You look at the instrument on the table that is obviously not made by imperial technology, and can't help frowning. This slightly thick tablet appeared out of thin air above your head last night and hit your head hard. This device of unknown origin is full of doubts, but some intuition tells you that there may be unexpected opportunities hidden behind this.\n\nYou pick up the tablet. It has a special matte metal texture, and a cold touch comes through your fingertips. The materials of the screen and the shell have never been seen before. You carefully examine the details of the device and find that some module designs are somewhat similar to the empire's holographic communicator. Maybe the two have similar functions?\n\nWhile thinking, your fingers felt a distinct protruding button."
  #  按下
  gts_event_storyline.2.option.1: "Press it"
  #  起始
  gts_event_storyline.3.name: "Beginning"
  #  “咔嗒”\n\n你不知道设计者为什么要把开机键设计成古早的机械按压式结构，但这种声音确实格外的令人解压。\n\nLOADING……§r█ 10%§!\nLOADING……§r███ 30%§!\n......\nLOADING……§r██████████ 100%§!\n\n屏幕亮起荧光的瞬间，一个奇异的LOGO一闪而过，刹那间，你忽然有种感受，自己现实的躯体、虚境的灵能本质，甚至是在命运长河中那缕不可捉摸的丝线，都与某个不可名状的庞然大物产生了微妙的联系。某种恍然涌上心头——此后，将有万千巨大生灵命运轨迹，与你和你的帝国产生交织。
  gts_event_storyline.3.desc: "“Click”\n\nYou don't know why the designer designed the power button as an ancient mechanical press structure, but this sound is extraordinarily stress-relieving.\n\nLOADING……§r█ 10%§!\nLOADING……§r███ 30%§!\n......\nLOADING……§r██████████ 100%§!\n\nThe moment the screen lit up with fluorescence, a strange LOGO flashed by. In an instant, you suddenly felt that your physical body, the psionic essence of the Shroud, and even that elusive thread in the river of existence, all had a subtle connection with some indescribable behemoth. A realization rushed to your heart—from now on, the fate trajectories of thousands of giant beings will intertwine with you and your empire."
  #  刚才.....那是巨娘吗？
  gts_event_storyline.3.option.1: "Just now... was that a Giantess?"
  #  通讯
  gts_event_storyline.4.name: "Communication"
  #  那阵令人心悸的感受尚未完全平复，已启动的设备屏幕就开始自顾自的跳动，冰冷的金属外壳开始略微发热，通讯界面自行跳出，接通了一个来源未知的通讯。\n\n你眼睁睁看着仪器前端的淡蓝色辉光开始蔓延，于空地上勾勒出了一道逐渐清晰的轮廓。\n\n人影尚未完全凝聚，欢快的声音却先抵达了你的耳畔。\n\n“§r哎嘿~协议签订成功，你已经是【缩小人】啦~”§!
  gts_event_storyline.4.desc.1: "That palpitating feeling had not yet completely calmed down, and the screen of the started device began to jump on its own. The cold metal shell began to heat up slightly. The communication interface jumped out by itself and connected to an unknown communication source.\n\nYou watched helplessly as the pale blue glow at the front of the instrument began to spread, outlining a gradually clear silhouette in the open space.\n\nThe figure had not yet completely condensed, but a cheerful voice arrived at your ears first.\n\n“§rEhe~ Agreement signed successfully, you are now a [Tiny Person]~”§!"
  #  那阵令人心悸的感受尚未完全平复，已启动的设备屏幕就开始自顾自的跳动，冰冷的金属外壳开始略微发热，通讯界面自行跳出，接通了一个来源未知的通讯。\n\n你眼睁睁看着仪器前端的淡蓝色辉光开始蔓延，于空地上勾勒出了一道逐渐清晰的轮廓。\n\n人影尚未完全凝聚，欢快的声音却先抵达了你的耳畔。\n\n“§r哎嘿~协议签订成功，你已经是【魔法少女】啦~§!”
  gts_event_storyline.4.desc.2: "That palpitating feeling had not yet completely calmed down, and the screen of the started device began to jump on its own. The cold metal shell began to heat up slightly. The communication interface jumped out by itself and connected to an unknown communication source.\n\nYou watched helplessly as the pale blue glow at the front of the instrument began to spread, outlining a gradually clear silhouette in the open space.\n\nThe figure had not yet completely condensed, but a cheerful voice arrived at your ears first.\n\n“§rEhe~ Agreement signed successfully, you are now a [Magical Girl]~§!”"
  #  那阵令人心悸的感受尚未完全平复，已启动的设备屏幕就开始自顾自的跳动，冰冷的金属外壳开始略微发热，通讯界面自行跳出，接通了一个来源未知的通讯。\n\n你眼睁睁看着仪器前端的淡蓝色辉光开始蔓延，于空地上勾勒出了一道逐渐清晰的轮廓。\n\n人影尚未完全凝聚，欢快的声音却先抵达了你的耳畔。\n\n“§r哎嘿~协议签订成功，你已经是【龙娘】啦~§!”
  gts_event_storyline.4.desc.3: "That palpitating feeling had not yet completely calmed down, and the screen of the started device began to jump on its own. The cold metal shell began to heat up slightly. The communication interface jumped out by itself and connected to an unknown communication source.\n\nYou watched helplessly as the pale blue glow at the front of the instrument began to spread, outlining a gradually clear silhouette in the open space.\n\nThe figure had not yet completely condensed, but a cheerful voice arrived at your ears first.\n\n“§rEhe~ Agreement signed successfully, you are now a [Dragon Girl]~§!”"
  #  ？？？
  gts_event_storyline.4.option.1: "???"
  #  通讯
  gts_event_storyline.5.name: "Communication"
  #  “§r嘿嘿，但其实只是开玩笑的呢~§!”\n\n紫发少女的全息投影在蓝光中彻底成形，你看清了她的面庞，少女非人的竖瞳中带着促狭的笑意，极美的脸蛋上挂着的却是有些惋惜的神情。\n\n“§r真可惜呢，小小的统治者~§!”
  gts_event_storyline.5.desc: "“§rHehe, but actually I'm just kidding~§!”\n\nThe holographic projection of the purple-haired maiden took shape completely in the blue light. You saw her face clearly. The maiden's non-human vertical pupils carried a narrow smile, but the expression on her extremely beautiful face was somewhat regretful.\n\n“§rWhat a pity, tiny ruler~§!”"
  #  你是谁？
  gts_event_storyline.5.option.1: "Who are you?"
  #  通讯
  gts_event_storyline.6.name: "Communication"
  #  “§r叫我千海就好~请不要在后面加上什么奇怪的称呼哦。§!”少女笑盈盈地回复着你的问题。
  gts_event_storyline.6.desc: "“§rJust call me Qianhai~ Please don't add any strange titles after it.§!” The maiden replied to your question with a smile."
  #  开机的时候究竟发生了什么？
  gts_event_storyline.6.option.1: "What exactly happened when I turned it on?"
  #  §r嗯——简单来说，就是我将你与许多巨大少女的命运连接在了一起§!"\n\n面前的少女顿了一顿似乎在斟酌词句：“§r就像月老牵扯姻缘红线，丘比特射出爱情之箭，命运当然也是可以被修改的。当然，即便是联系也带着力量，为了防止你被她们无意识的一瞥直接碾成小人酱，我还帮你做了些许小小的缓冲~§!”\n\n千海微微前倾身体，在你的面前比了个指尖宇宙的手势。
  gts_event_storyline.6.option.1.response: "§rHmm——simply put, I connected you with the fates of many giant maidens§!\"\n\nThe maiden in front paused for a moment as if considering her words: “§rJust like Matchmaker trying red strings of marriage, Cupid shooting arrows of love, fate can of course be modified. Of course, even the connection carries power. To prevent you from being crushed into tiny paste by their unconscious glance, I also made a little buffer for you~§!”\n\nQianhai leaned slightly forward and made a gesture of a fingertip universe in front of you."
  #  那么，代价是什么呢？
  gts_event_storyline.6.option.2: "So, what is the price?"
  #  “§r代价？嗯，大概是没有代价吧。§!”\n\n千海莲步轻移，在不知不觉中已经与你近在咫尺，你甚至可以感受到少女呼出的淡淡紫罗兰花香。\n\n“§r虽然确实呢，你的灵能本质，还有你的来历都是相当的有趣.....哎，我突然有些动心了，要不你就当我的小人玩具算了？”§!
  gts_event_storyline.6.option.2.response: "“§rPrice? Hmm, probably no price.§!”\n\nQianhai moved lightly with lotus steps. Unknowingly she was already close at hand. You could even feel the faint violet floral fragrance exhaled by the maiden.\n\n“§rAlthough indeed, your psionic essence, and your origin are quite interesting... Sigh, I suddenly feel a bit tempted. How about you just be my tiny toy?”§!"
  #  敬谢不敏
  gts_event_storyline.6.option.3: "No thanks"
  #  "§r哼哼，我想也是呢~§!”\n\n千海微微退后几步，拉开了与你的距离。\n\n“§r说正事吧，这个银白通讯器除了最基础的通讯功能外，还可以帮你联系一些你当前已经能够接触到的巨娘，至少可以保证你不在一开始就被她们吃·干·抹·净。§!"
#  "§r哼哼，我想也是呢~§!”\n\n千海微微退后几步，拉开了与你的距离。\n\n“§r说正事吧，这个银白通讯器除了最基础的通讯功能外，还可以帮你联系一些你当前已经能够接触到的巨娘，至少可以保证你不在一开始就被她们吃·干·抹·净。§!"
  gts_event_storyline.6.option.3.response: "\"§rHmph, I thought so~§!\"\\n\\nQianhai stepped back a few paces, widening the distance between you.\\n\\n\"§rNow down to business. Beyond its basic communication capabilities, this silvery communicator can help you contact certain Giantesses within your reach—at the very least ensuring you don't get completely gobbled up right at the start.§!\""
  gts_event_storyline.6.option.4: "Contact Giantesses?"
  #  “§r是的，也许是其他时间线，也许是某个平行宇宙，一些具有特别特质的巨娘总有着格外独特的力量。§!”\n\n千海在你身边缓慢踱步，讲解着很多超越你理解的事物：“§r当你招募到她们时，她们的力量能为你的帝国带来奇迹，当然有些代价可能比她们的体型还要巨大，毕竟可不是所有巨娘都像我这么好说话的。§!”
  gts_event_storyline.6.option.4.response: "“§rYes, maybe other timelines, maybe some parallel universe. Some Giantesses with special traits always have extraordinarily unique powers.§!”\n\nQianhai paced slowly beside you, explaining many things beyond your understanding: “§rWhen you recruit them, their power can bring miracles to your empire. Of course, some prices might be even huger than their body size. After all, not all Giantesses are as easy to talk to as me.§!”"
  #  那我现在就可以？
  gts_event_storyline.6.option.5: "Can I do it now?"
  #  “§r当然~另外还有，通讯器中预留了我的联系方式，有什么问题的时候可以找我尽情咨询哦~那么，下次见？§!“已经悄然绕到了你身侧的千海，趁你略微失神的间隙，用手指轻轻触及了平板上的挂断按键。在你凝重的目光中，少女那靓丽的身影于光屑中消失不见。\n\n§HPS：在发现界面选择通讯器，进入巨娘通讯界面。§!\n§HPS：在通讯中选择千海的通讯，进入千海的通讯界面。§!
  gts_event_storyline.6.option.5.response: "“§rOf course~ In addition, my contact information is reserved in the communicator. You can consult me as much as you want when you have questions~ So, see you next time?§!“ Qianhai, who had quietly circled to your side, took advantage of your momentary distraction to gently touch the hang-up button on the tablet with her finger. In your solemn gaze, the maiden's beautiful figure disappeared in the light particles.\n\n§HPS: Select the communicator in the Discovery interface to enter the Giantess Communication Interface.§!\n§HPS: Select Qianhai's communication in the communication to enter Qianhai's Communication Interface.§!"
  #  ......
  gts_event_storyline.6.option.6: "......"
