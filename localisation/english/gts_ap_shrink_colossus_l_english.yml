l_english:
  # 缩小激素散布
  ap_gts_colossus: "Shrink Hormone Dispersal"
  # 我国对缩小激素的研究已经持续了一段时间，但其易分解难保存的特性使其很难投入军事领域。但如果我们能制造一个具有大量生产、储备和投放缩小激素能力的巨型太空载具，我们或许能实现一些从未设想过的轰炸效果...\n\n比如将星球缩小？
  ap_gts_colossus_desc: "Our nation's research on shrink hormones has been ongoing for some time, but their highly decomposable nature makes them difficult to use in military applications. However, if we could build a massive spacecraft capable of producing, storing, and deploying shrink hormones, we might achieve some unexpected bombardment effects...\n\nSuch as shrinking a planet?"
  # 需要前置科技：巨像
  requires_colossus_gts: "Requires Prerequisite Technology: Colossus"
  # 缩小球
  gts_shrink_ruined: "Shrunken Sphere"
  # 这个星球已经彻底失去了防御价值，哪怕是普通人的呼吸对这个星球残存的生态系统都是毁灭性的，恐怕也只有微生物会真的把这样的小球当做行星来防守。
  gts_shrink_ruined_desc: "This planet has completely lost its defensive value, even the mere breath of ordinary beings is catastrophic to the remaining ecosystem. Only microorganisms might actually treat this tiny sphere as a planet."
  # 星球被缩小
  gts_ap_shrink.10.name: "Planet Shrunk"
  # 我们的实验成功了！被我们的巨像轰击后，被缩小激素覆盖的星球逐渐缩小为小行星大小，其上的人口也被大气中的激素影响，迅速缩小为肉眼难以看到的微小生物，这个星球的防御自然也土崩瓦解。
  gts_ap_shrink.10.desc: "Our experiment succeeded! After being bombarded by our Colossus and covered in shrink hormones, the planet gradually shrank to the size of an asteroid. The population on it was also shrunken by the hormones in the atmosphere, becoming tiny micro-organisms invisible to the naked eye, and the planet's defense naturally crumbled."
  # 在土著身上使用星球级别的缩小激素散布是个很不人道但很棒的主意，我们的科研人员传回了不少相当有意思的观测数据,依据观测报告来看，在绝大部分人口缩小为预期体型后，这个土著星球上极少数女性个体因为特殊体质未发生明显缩小，这使得她们与其同类相比相对的巨大化，我们的科研人员建议保持土著文明的这种状态以对这种情况下的社会发展进行进一步的观察。
  gts_ap_shrink.11.desc: "Using planet-scale shrink hormone dispersal on natives is inhumane yet fantastic. Our researchers have returned with fascinating observational data. The majority of the population shrank to expected sizes, but rare native females with certain genetic traits didn't shrink, making them relatively giant compared to their species. Our scientists suggest maintaining the indigenous civilization's state to study societal development under these circumstances."
  # 此星球的大小被修改为1，星球上所有人口转变为§Y极小§!
  gts_ap_shrink.10.tooltip: "This planet's size is modified to 1, and all population on the planet is transformed into §Yextremely small§!"
  # 星球被缩小
  gts_ap_shrink.12.name: "Planet Shrunk"
  # 在我们的科学家努力和舰队的英勇作战下，星球[From.GetName]成了装载了缩小射线巨像的第一个实验品，原本能够承载几十亿人口的星球现在被当成战利品被送到了我们统治者的房间之中。\n\n原本巨大的星球现在正被反重力装置和小型护盾发生器保护着，悬浮在§S[Root.GetRulerName]§!的桌上，甚至还没有自己的胸口高。看着自己敌人星球上的武器不断的打在那层薄薄的护盾上，用家用电池就可以维持的护盾现在就像安乐天使一样纹丝不动，§S[Root.GetRulerName]§!的下面就已经湿润了。\n\n§r\"真不知道现在他们的视角是怎么样的，被自己敌人放在桌上如同玩具一般对待\"§!\n\n§S[Root.GetRulerName]§!的面色逐渐潮红，呼吸渐喘，灼热的呼吸喷在那层薄膜上，整个行星都在升温。单单夹紧双腿果然是缓解不了这种兴奋，右手已经往下体伸去，不断的抚摸着。巨大的喘气声和若隐若现的远处水声环绕在[From.GetName]居民的耳边。一声巨大的娇喘如同巨雷贯穿了他们的感声器官，随之而来的是§S[Root.GetRulerName]§!趴倒在桌上带来的剧烈震动。趴在桌上的§S[Root.GetRulerName]§!穿着粗气，在桌下的右手也被她抬了起来，粘稠的爱液沾满在右手上，被右手带到了半空缓缓滴下。\n\n§r\"那这样，你们又会是什么景象呢\"§!\n\n带着爱液的右手慢慢的移到了[From.GetName]的上面，粘稠的液体带着嬴荡的味道缓缓的落在了那层薄膜的的上面，整个星球的北半球的天空都被粘稠带着淡白色的液体覆盖，带有强烈荷尔蒙的骚味透过了护盾粗暴的刺激着所有小人的鼻腔，而这只是一个女生分泌的一滴爱液罢了。
  gts_ap_shrink.12.desc: "Through our scientists' efforts and the fleet's valorous combat, the planet [From.GetName] became the first test subject for the Colossal Shrink Ray. Now treated as a trophy in our ruler's room, this once populous planet floats above §S[Root.GetRulerName]§!'s desk, barely reaching their chest level. Watching the enemy's planet's weapons harmlessly strike the thin shield sustained by household batteries was exhilarating-§S[Root.GetRulerName]§!'s excitement dampened their thighs.\n\n§r\"I can only imagine their perspective now, being treated as a toy on their conqueror's table.\"§!\n\nAs §S[Root.GetRulerName]§!'s face flushed, breathing intensifying, hot breaths warmed the shield's thin film, and the entire planet heated up. Merely clenching their thighs failed to ease the thrill; their right hand already reached down, stroking repeatedly. The giant sighs and distant water sounds enveloped the residents of [From.GetName]. A thunderous moan pierced their ears as §S[Root.GetRulerName]§! collapsed onto the desk, causing a violent tremor. Prone, §S[Root.GetRulerName]§! raised their sticky, right hand, letting viscous love juices drip gently through the air.\n\n§r\"I wonder what your view is like now.\"§!\n\nThe love-dripped right hand slowly hovered over [From.GetName], the sticky fluid laden with seductive scent fell on the film, covering the northern hemisphere in a viscous off-white liquid, saturating the small people's nostrils with potent hormonal fragrance-just a drop of female arousal."
  # 现在我们才是恒星级巨娘
  gts_ap_shrink.12.a: "Now we are the stellar giantesses"
  # 星球的末路
  gts_ap_shrink.13.name: "Planet's End"
  # 或许是觉得仅仅这样还是不够尽兴，§S[Root.GetRulerName]§!坐起，慢慢站了起来，原本是胸口高度的星球现在正对着她裙子的下摆。§S[Root.GetRulerName]§!将自己的裙子掀起，把自己的内裤展现给裙子下的微小星球，白色的内裤沾满了爱液，湿的一塌糊涂，还不断有粘稠的爱液透过内裤往地面滴去。\n\n§r\"人家真的很喜欢你们呢，所以，能直接放你们进去吗？\"§!\n\n说是询问，但却不想听到任何人的回答。下一秒，已经拿着星球了，另一只手将内裤拉开了一条缝，露出了里面茂密的毛发森林。带有护盾的行星在手指的助推下将毛发森林分开，顺利到达了空旷的内裤中央。巨大的阴道就像星界裂缝一样横在星球的上方，饥渴的阴道如同饥渴的大嘴一样不断流下粘稠的液体，如果不是有护盾在，这个行星的人口已经在爱液的冲刷下消耗殆尽。\n\n啪的一下，内裤上方的开口猛的关上，只剩下透过内裤的昏暗光源，但很快，内裤外便被巨手覆盖，将星球推进了那个蠕动着的粉色地狱。巨大的软肉带着黏液不断的挤压着星球的护盾。正当星球里面的居民期待着熬过这个地狱的时候，巨大的中指和无名指冲了进来，将星球狠狠的压在了软肉之中，洞穴的外面也随之传来一声娇喘。两只手指将星球在粉色的洞壁上狠狠摩擦，洞穴内的温度也越来越高，软肉蠕动的频率也越来越快，每次蠕动，护盾的光幕都在疯狂闪烁。最终，随着手指带着星球插入阴道的最深处，强烈的快感让§S[Root.GetRulerName]§!的下体猛的收紧，在四周肉壁的剧烈挤压下，围绕行星的护盾被挤压成了一堆成不了行的能量，粘稠的爱液如同从天而降的海啸，肉壁巨大的压力将星球挤的四分五裂。但这些却让§S[Root.GetRulerName]§!感到更加的兴奋，不断加快速度抽插的手指将幸存的可能性无限的化为零，也让她更接近了欲望的高潮。\n\n随着巨大的娇喘声，已经被少女自慰碾碎的星球残骸在爱液的激流下从阴道冲出到了房间的地板上。\n\n§r\"看来得多弄点用来收藏呢\"§!因为高潮气喘吁吁的§S[Root.GetRulerName]§!如此决定。
  gts_ap_shrink.13.desc: "Feeling unsatiated, §S[Root.GetRulerName]§! sat up, slowly standing, the planet originally at chest height now faced by their skirt's hem. §S[Root.GetRulerName]§! raised their skirt, revealing panties to the minuscule planetoid beneath, stained heavily with love juices, utterly soaked, with more viscous juices dripping through to the floor.\n\n§r\"I really like you, so, may I put you directly inside?\"§!\n\nAsked, yet expecting no answer. In a flash, the planet was in hand, the other hand pulled the panties aside, unveiling a forest of coarse hair. With a push, the shielded planet parted the forest, reaching the void within the panties' center. The enormous vagina loomed above like a cosmic rift, hungrily dripping thick fluid. Minus the shield, the inhabitants would've been swept away by torrents of love juices.\n\nWith a slap, the panties' opening snapped shut, leaving just a dim glow through their fabric before a giant hand's shadow covered it, thrusting the planet into the quivering pink abyss. The soft flesh compressed the shield as it forcibly squeezed the planet. Anticipating escape from this hellish ordeal, the massive middle and ring fingers intruded forcefully, pressing the planet into the soft wall with rhythmic movements. Each movement sparked wild flickers in the shield's glow. Finally, as fingers drove the planet deepest, intense pleasure made §S[Root.GetRulerName]§!'s insides contract fiercely, with overwhelming pressure that compacted the shield to formless energy, love juices cascading like a tsunami, crushing the planet into fragments. Yet, this only fueled §S[Root.GetRulerName]§!'s arousal more, fingers thrusting with abandon towards orgasmic heights.\n\nWith a thunderous sigh, the planet, pulverized by the girl's self-pleasure, flowed out in love juice rivers, spilling across the floor.\n\n§r\"Looks like I'll need more to collect.\"§! panted §S[Root.GetRulerName]§!, deciding amidst post-orgasmic gasps."
  # 这就是与[Root.GetRulerName]作对的下场
  gts_ap_shrink.13.a: "This is the fate of those who oppose [Root.GetRulerName]"
