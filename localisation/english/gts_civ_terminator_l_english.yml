l_english:
  # 小人清除者
  civic_gts_terminator: "Little People Eliminators"
  # 这个国家的巨娘非常乐于与其他巨娘贴贴，但如果她们发现了小人\n§R她们会毫不留情的将其当作虫子碾碎§!
  civic_gts_terminator_desc: "The giantesses of this nation are very happy to 'bond' with other giantesses, but if they find any little people...\n §RThey will mercilessly crush them like bugs!§!"
  # §R小人人口将总是会被净化\n大幅降低与小人帝国的关系§!\n§Y对其他小人帝国拥有"净化"宣战理由§!\n§G净化小人人口能在短时间内获得£consumer_goods£$consumer_goods$、£unity£$unity$和£gts_micro£$gts_micro$§!
  civic_tooltip_gts_terminator_effects: "Gain §Y\"Purge\"§! casus belli against other little people species.\nLittle people £pop£ pops will always be §YPurged§!\nPurging little people £pop£ pops grants £unity£ §YUnity§! and £pop£ Shrinkage\nGreatly reduces the §YOpinion§! of little people empires towards you!\nSubject little people £pop£ pops will be §YPurged§! and grants £consumer_goods£ Consumer Goods and £pop£ Shrinkage\nSubjugated little people empires will gradually be §RAnnihilated§!"
  # 风纪净化委员长
  councilor_gts_terminator: "Discipline and Purification Committee Chair"
  # 风纪净化委员长
  councilor_gts_terminator_female: "Discipline and Purification Committee Chair"
  # 负责维持巨娘统治秩序，彻查私藏小人行径的纪律委员，通常由正义心爆棚的优等生担任。但有流言称风纪委员长本人就是扰乱风纪的根源，她经常违反禁令，饲养大量小人...
  councilor_gts_terminator_desc: "Responsible for maintaining the giantess-dominated order, these Disciplinary Committee members thoroughly investigate any behavior involving harboring little people, and are usually top students bursting with a sense of justice. However, rumors claim that the Committee Chair herself is the root of the disruption, often violating prohibitions and raising a large number of little people in secret..."
  # 小人灾星
  personality_gts_terminator: "Scourge of the Small"
  # 这些巨娘将会毫不留情的清除掉所有出现在她们面前的小虫子，最好祈祷你不是小人，或者比她们强大吧！
  personality_gts_terminator_desc: "These giantesses will mercilessly eliminate all the little bugs that appear before them. You better pray you aren't a little person, or that you are stronger than them!"
  # §Y害虫灭绝委员会§!
  gov_gts_terminator1: "§YPest Extermination Committee§!"
  # §Y巨娘至上制§!
  gov_gts_terminator2: "§YGiantess Supremacy§!"
  # §Y害虫清扫公司§!
  gov_gts_terminator3: "§YPest Control Company§!"
  # 灭绝委员长
  GTST_EMPRESS1: "Extermination Chairperson"
  # 女帝
  GTST_EMPRESS2: "Empress"
  # 灭绝执行官
  GTST_EMPRESS3: "Extermination Executive Officer"
  # 公主
  GTST_CROWN_PRINCESS2: "Princess"
  # 消灭小人
  casus_belli_cb_gts_terminator: "Exterminate the Little People"
  # 清除低贱存在
  war_goal_wg_gts_terminator: "Eliminate Inferior Beings"
  # 战争的目的是为了将那些低贱的虫子彻底净化。
  war_goal_wg_gts_terminator_desc: "The purpose of this war is to completely purify those lowly insects."
