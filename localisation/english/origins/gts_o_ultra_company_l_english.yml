  # §Y[from.GetName]§!上的客户们开始对我们的服务表示不满！\n\n他们宁愿冒着星球的城市、大陆甚至整颗星球被巨娘的乳汁淹没浸润的风险，也不愿意每年上交10%的人口税来购买我们令人安心的保险业务。他们花了数年的时间动员整颗星球的资源与人力将我们先前布置的§H带有乳汁的胸罩§!拆解成了一文不值的垃圾，并愤怒地连同炮弹发射到我们的空间站上，如果我们不能证明我们保险业务的必要性，我们很快会失去一位珍贵的客户。
