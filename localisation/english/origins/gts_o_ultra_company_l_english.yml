  gts_ultra_company.1017.desc: "§r\"Um, I hope everyone tries our Tongue Lick Insurance. We will protect you responsibly. If it's too expensive, I'll lower the price for you.\"§!\n\n...\n\n\"Damn, not listening at all. You asked for it... Let me show you what I've got!\"\n\nThe giant girl knelt, watching the ant-like crowds. She decided to teach them a lesson.\n\nShe extended a huge, soft pink tongue like a python. The tongue tip gently pressed down on the TV tower at the center, bending it instantly.\n\nThen she began sweeping. The flexible tongue snapped skyscrapers at the waist. The taste buds were like fleshy hills, grinding everything on the streets. Sticky saliva trails several kilometers wide swept away buildings and trapped tiny people in viscous fluid.\n\nWithin minutes, the center was in ruins, filled with collapsed buildings, broken bridges, and sweet-scented mud. It was a super disaster beyond science.\n\n\"Humph, seen my power now?!\" she said, wiping her mouth. \"If you don't want the whole planet submerged by my saliva, pay the premium obediently!\""
  gts_ultra_company.1018.name: "[fromfrom.GetName] Insured!"
  # §r“小人城市是什么味道的呢？”§!\n\n少女看着底下的城市突然想到了这个问题，边带着一丝害羞的腮红少女试探性的点下舌尖，整齐的街道和高大的摩天大楼，如果从小人看起来是如此的辉煌之美，而对巨娘而言这种美却激发了另一种维度——“食之色”\n\n少女就如此的品尝到了这个新世界，被少女舌尖点碎的方圆千里的圆中，既有带着高雅和厚实的巧克力大楼，还有温和却繁多层次和水果香味的低矮楼房，小人的恐惧给他赋予了一丝跳脱的酸甜，小人所谓的各色载具如同糖霜一样甜蜜，被从千米深处一起被拔起的森林是清新的薄荷糖一样，小人辛苦制造的运河就像软糖一样质感。\n\n原本只是想用舌尖轻点的少女尝到这般美味，爱好甜食的她忍不住的向下压实，唔，是为了减少客户的损失，如果这里挖深点就能少点破坏了，虽然自己想的理由有点奇怪，但是爱好甜食的少女还是这么坚信，绝对不是为了一己私欲之类的，以少女的舌尖为支点少女慢慢的放下舌头，百万斤中的舌头凝聚到舌尖，原本还难苦苦支持的岩盘再也支持不住，像是饼干一样在少女舌尖下碎裂，地下水被从地下挤出，随着少女的深入甚至已经触碰到地下的眼睛，温热的触感原本让少女一惊，但是糖浆一样的美味瞬间让少女沉迷，偷偷加大力量微微扭动想要从里面挖掘更多。\n\n笼罩在少女舌肉阴影下的人们，感受着少女舌肉带来的水汽，化作迷雾笼罩了整个城市，小人在伸手不见五指的环境里完全没法进行有效的逃跑，一瞬间各种混乱在城市里产生，不过麻烦可不止如此，少女旺盛的食欲让口水疯狂分泌，顺着舌头滚落到城市之中就像是从空中倾泄地上，对少女来说豆大的口水，对下面小人来说就是能覆盖整个街区的榴弹，大楼在恐怖的质量上直接被碾碎，明明是要防止洪水袭来但是少女粘稠的粘液化作新的潮水，顺着城市街道就如同吃豆人一样，在街道里翻涌中吞噬着逃难的人们，有些小人刚越过一个街区就看到少女口水挡住了前路，在绝望中看着引擎被侵蚀的口水拍碎，门窗被口水抵住只能看着这个铁棺材被少女的口水，逐渐压缩，更多的死亡和越加的混乱在城市里不断增值。无法逃难的人们。只能看着少女的舌肉带着轰鸣声向人们袭来。在下一刻拖行之中只留下褐色的土地和给予少女味蕾一点刺激\n\n§r“这么快就吃完了吗？”§!\n\n感受到全身已经被浸湿少女才反应过来，面前的土地已经布满了少女舌尖所塑造的新的河床，褐色的土地上覆盖着少女一层薄薄口水，而底下更是流淌着一层散发着少女口水味道的河流，因为范围太广甚至袭来的海水都不能填满，等海水回落，城市重建之时少女留下的河流恐怕会成为人们新城市的重要景点。\n\n§r“星球领袖也答应我的请求了，这么容易嘛？谢谢大家对我的包容！”§!\n\n听到代表合同成立的提示音少女连忙站起，成九十度鞠躬按照公司的礼节向小人表达感谢，虽然掀起的狂风又一次的掀飞几个无辜的城市那就是后事了。\n\n§r“那再见了大家，期待和大家的下次见面哦！请大家下次指名我！”§!\n\n在少女离开之前看着复原的土地，连她都没在意的用舌尖舔了舔嘴唇。\n\n§HPs:那条舌痕原本想复原的，但是虽然羞耻但有种莫名的自豪感所以少女没复原\nPs:少女之后参加舔舐保险格外的积极。§!
