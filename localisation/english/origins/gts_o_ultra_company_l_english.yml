#  §r“小人城市是什么味道的呢？”§!\n\n少女看着底下的城市突然想到了这个问题，边带着一丝害羞的腮红少女试探性的点下舌尖，整齐的街道和高大的摩天大楼，如果从小人看起来是如此的辉煌之美，而对巨娘而言这种美却激发了另一种维度——“食之色”\n\n少女就如此的品尝到了这个新世界，被少女舌尖点碎的方圆千里的圆中，既有带着高雅和厚实的巧克力大楼，还有温和却繁多层次和水果香味的低矮楼房，小人的恐惧给他赋予了一丝跳脱的酸甜，小人所谓的各色载具如同糖霜一样甜蜜，被从公里深处一起被拔起的森林是清新的薄荷糖一样，小人辛苦制造的运河就像软糖一样质感。\n\n原本只是想用舌尖轻点的少女尝到这般美味，爱好甜食的她忍不住的向下压实，唔，是为了减少客户的损失，如果这里挖深点就能少点破坏了，虽然自己想的理由有点奇怪，但是爱好甜食的少女还是这么坚信，绝对不是为了一己私欲之类的，以少女的舌尖为支点少女慢慢的放下舌头，百万斤中的舌头凝聚到舌尖，原本还难苦苦支持的岩盘再也支持不住，像是饼干一样在少女舌尖下碎裂，地下水被从地下挤出，随着少女的深入甚至已经触碰到地下的眼睛，温热的触感原本让少女一惊，但是糖浆一样的美味瞬间让少女沉迷，偷偷加大力量微微扭动想要从里面挖掘更多。\n\n笼罩在少女舌肉阴影下的人们，感受着少女舌肉带来的水汽，化作迷雾笼罩了整个城市，小人在伸手不见五指的环境里完全没办法进行有效的逃跑，一瞬间各种混乱在城市里产生，不过麻烦可不止如此，少女旺盛的食欲让口水疯狂分泌，顺着舌头滚落到城市之中就像是从空中倾泄地上，对少女来说豆大的口水，对下面小人来说就是能覆盖整个街区的榴弹，大楼在恐怖的质量上直接被碾碎，明明是要防止洪水袭来但是少女粘稠的粘液化作新的潮水，顺着城市街道就如同吃豆人一样，在街道里翻涌中吞噬着逃难的人们，有些小人刚越过一个街区就看到少女口水挡住了前路，在绝望中看着引擎被侵蚀的口水拍碎，门窗被口水抵住只能看着这个铁棺材被少女的口水，逐渐压缩，更多的死亡和越加的混乱在城市里不断增值。无法逃难的人们。只能看着少女的舌肉带着轰鸣声向人们袭来。在下一刻拖行之中只留下褐色的土地和给予少女味蕾一点刺激\n\n§r“这么快就吃完了吗？”§!\n\n感受到全身已经被浸湿少女才反应过来，面前的土地已经布满了少女舌尖所塑造的新的河床，褐色的土地上覆盖着少女一层薄薄口水，而底下更是流淌着一层散发着少女口水味道的河流，因为范围太广甚至袭来的海水都不能填满，等海水回落，城市重建之时少女留下的河流恐怕会成为人们新城市的重要景点。\n\n§r“星球领袖也答应我的请求了，这么容易嘛？谢谢大家对我的包容！”§!\n\n听到代表契约成立的提示音少女连忙站起，成九十度鞠躬按照公司的礼节向小人表达感谢，虽然掀起的狂风又一次的掀飞几个无辜的城市那就是后事了。\n\n§r“那再见了大家，期待和大家的下次见面哦！请大家下次指名我！”§!\n\n在少女离开之前看着复原的土地，连她都没在意的用舌尖舔了舔嘴唇。\n\n§HPs:那条舌痕原本想复原的，但是虽然羞耻但有种莫名的自豪感所以少女没复原\nPs:少女之后参加舔舐保险格外的积极。§!
  gts_ultra_company.1018.desc: "§r\"What does a tiny city taste like?\"§!\n\nShe touched her tongue tip to the ground. Skyscrapers tasted brilliant to the tiny people, but to the maiden they jumped like popping candy on her tongue.\n\nAs the tongue went deeper, more buildings rolled in. A pink carpet swept the main roads. Commercial areas, residential zones, and flyovers turned to dust. Steel and concrete softened in saliva into mush.\n\nShe smacked her lips, tasting the flavor of civilization. Metal, glass, and concrete tasted of rust and bitterness, but mixed with screaming tinies it presented an indescribable texture. With a gulp, tens of thousands of tons of snacks slid down her esophagus into the abyss of her stomach.\n\nWhen she retrieved her tongue, the city center was gone, replaced by a deep trench several kilometers wide, lined with sweet-smelling saliva. The survivors stared dumbfounded.\n\n§r\"Oops... I ate a bit too much~\"§!\n\nShe patted her belly and smiled playfully. She leaned down, eyes looking at the survivors like dust.\n\n§r\"Tasty though! So, dear clients, if you don't want the whole planet eaten as an afternoon tea next time... please sign this 'Avoid-Being-Eaten Insurance' contract!\"§!"
#  §r看起来好美味啊……§!\n\n看着地面大楼林立， 少女忍不住吞了几口口水，可惜因为这次的险种是吐息险，少女只好轻拍脸颊让自己从对城市味道的妄想中回过神来，理理衣服的衣角正式开始这次保险推销。\n\n§r“那个大家好啊，我是[Root.GetName]的推销员，希望大家购买我们公司的吐息险呢。”§!\n\n少女的声音清脆而响亮让听到的人只感到如丝竹流入耳朵，少女较好的面容站到大街上也应该回头率不低。但人们看向她的表情只有惊慌，随后就像老鼠一样四而逃。\n\n不过换个视角，人们从地面向上望去，看到少女白皙的脸蛋通过大气层外延，只是嘴唇轻轻的一张一合，就把方圆千里的云朵击散，从嘴里溢出一丝吐息穿过近千公里的大气层泼洒到大地上，人们只感受到一阵热浪带着一股好闻的味道在整个城市弥漫开来，细腻的口水雾在穿越大气层中几乎全部蒸腾，到地上只有绵密的水雾和阵阵微风，和冰冷的建筑外玻璃相接触一瞬间玻璃上就结出浓厚的水雾，哪怕这是少女讲话中携带的水汽都已经是这个城市一个月的降水了，蒸腾的水汽化作巨量的乌云在城市上集结下起滂沱大雨。\n\n积水开始在城市里堆积，原本小人还有着一丝侥幸，想着只不过是别人一次小小吐息而已，能有什么威力，达到红色警报多少有点过头了吧？但转眼之间就有几个小人惊恐的发现积水已经到达脚腕，城市的泄洪设施对少女口水来说实在过于渺小，哪怕把抽水设施功率开到最大，机器的轰鸣声却被“口水”雨的声音掩盖，如果在这样下去整个国家都要被少女几次轻轻吐息的口水完全淹没，眼见的少女当然发现了，不过比起帮忙她第一刻想到的是不满。\n\n§r“完全被乌云挡住了，看不到下面的情况，小人为什么要住在这种连说话都影响的星球上，这么弱就该早点买保险啊！算了，我直接开始推销了，事后记得好好感谢我哦。”§!\n\n实际上，她本人也不知道到底会发生什么事，这样的体型她也是第一次尝试，虽然这百万倍的大小恐怕只是一根手指都可以直接点碎山脉，只是手掌下压恐怕发达的城市也会变为黄土，如果臀部从着太空落下恐怕一个逝去的城市群都将成为地下万米的遗迹。但是，对于自己再熟悉不过的呼气，此刻她却想象不到它的威力。\n\n她深吸了一口气便创造出世人难得一见的奇观，那些笼罩城市的云朵在小人的眼皮子底下，被遮挡住天空的少女用她高挺的鼻梁下两个看不到底的牵引，如果把天空比作海洋，少女只是吸气就把整个大海吞噬，那些如鱼儿一般的云朵也逃离不了那填不满的坑洞，打着转的向着里面涌入，此前还在空中翱翔的飞机在察觉到突发情况之前，就已经和几百万加仑的空气一起被压缩到少女的鼻腔内，在旋转的气流中直接被加速度离心力绞成碎块，没有接触到少女鼻肉的机会。想从空中逃离的小人被少女无意中全灭。\n\n原本因为少女阴云遮盖的城市，下一刻就变成了阳光明媚的晴天。透过透亮而干燥的天空，人们看到了地球上最剧烈的大气运动。\n\n就如前面所说少女现在每一秒都再把底下这数以千万记的人们可供几个月呼吸的空气压缩到肺里，小人能观测到的地方天空都再围绕少女而旋转，那在鼻前形成的速度已经超越音速的漩涡，已经让人们产生视错觉，在他们看来那漩涡已经成为了实体，甚至认为少女直接把天空收入鼻前。等到十几秒后，人们才意识到少女正在吸气，因为少女一手造成的暴雨天灾，吓得魂飞魄散的小人们哪怕想要偷跑，在这个运输失能的城市里，也只能四处逃窜，只能无力的看着少女轻抿嘴唇，鼓成球状的脸颊提示人们少女已经完成吸气。\n\n少女保持着微笑她并不急着呼出刚刚吸入的空气，因为一时兴起，她想再给这些可怜的人儿一点准备时间，观察人们将要采取什么动作抵御她的吐息。\n\n慌乱的人们连常识都抛到脑后，只是一根筋的想要逃离逃离少女，大部分人第一想法竟然是跑出相对坚固的建筑，在流淌着少女口水芬芳已经化为泥水滩的街道中前进，哪怕少女及时打断了降水，现在街道上积水也有一米多深，别说逃跑有些慌乱的人们有些因为慌乱一个脚滑，整个人在水中无能的挣扎，最后只能连肚子都被少女口水撑圆的成为水上漂尸，让这条路更加难走，还有不小人被这看不见底的河流的暗流裹挟，被卷入排水系统中降低了着低效的排水系统，那一点点效率，那些被水流引出的各色小虫，腐臭的动物尸体，残留的各色尖锐物品，哪怕那些极幸运的小人走上几步都浑身是伤，一时间哀嚎不断。\n\n但就算跑又有什么用？就算逃离出这个城市也无法断定安全无虑——因为少女的樱唇，光是长度就达到了公里级，加上有着足够的距离扩散恐怕整个大陆都要受影响吧。当然，另外一些小人，并不像大多数人一样在拥挤的道路上逃窜，而是躲进了地下室与建筑中。
  gts_ultra_company.1021.desc: "§r\"Looks delicious...\"§!\n\nSeeing the buildings, the maiden swallowed. But this was Exhale Insurance. She patted her cheeks to focus.\n\n§r\"Hello everyone, I'm the salesperson for [Root.GetName]. Please buy our Exhale Insurance.\"§!\n\nHer voice was clear, but people fled in panic. Looking up, they saw her lips open, dispersing clouds for thousands of miles. A breath passed through the atmosphere, bringing a heatwave and a pleasant scent. The moisture condensed on glass, equal to a month's rainfall. It rained heavily.\n\nThe flood rose. Drainage failed. She noticed.\n\n§r\"Clouds blocking the view. Why live on such a planet? You're so weak, just buy insurance! Fine, I'll start the pitch. Thank me later.\"§!\n\nShe took a deep breath. Clouds were sucked into her nostrils like fish into a whirlpool. Planes were compressed into her nose and destroyed.\n\nThe sky cleared. She was inhaling the air people needed for months every second. A supersonic vortex formed at her nose. People panicked, running through saliva-muddy streets. Corpses floated. The sewers backed up.\n\nRunning was useless. Her lips were kilometers long."
#  §r“呼~~~~~”§!\n\n少女紧贴着的双唇渐渐分离，动作轻缓而优雅，她并没有一开始就用尽全力吐息，而是缓缓增加力度，刻意给这些迟钝的小人们留下反应的空间。毕竟如果一开始就动用全力这脆弱的玩具就玩的太快了。\n\n带着巨量水汽的温热吐息，如同初春的一缕微风，轻抚着这座城市。虽然直到刚刚气温还是接近零下，但这夹杂着暖流的吐息，让气温变为了令人感到十分惬意和舒适的程度。连那地面上的积水都在少女吐息下极速蒸发，少女所搭建的障碍也被少女一手摧毁，有些小人虽然不知道发生了什么事，但是这般伟力让一种崇拜感从地里发芽，那些人儿顾不得浑身的伤口在地上叩拜起来。少女刚刚的行为也被这些折磨的失去理智的人们实作试炼，如果他们能活下去，应该会成为少女神教坚定的信徒。\n\n但随着石子飞起，人们迅速察觉到异样，少女的玩心渐起带来的后果便是——吐息强度的飞速升级。一开始的和煦春风仅在几秒后就迎来了大变样，温暖的感觉被增强的风速驱散，地面上跪拜的人群处了几个还在执迷不悟，其他已经开始再一次的逃向封闭的场所，肉体的自自信被少女摧毁，只能再一次的寄托那脆弱的人造物，那些来不及逃进室内的也不得不紧紧抓住路边固定的栏杆，只有这样才勉强能在暴风中稳定住身子。\n\n经历少女两次来自口腔内吐息的城市，再一次被少女口水形成的雾气笼罩，这次在口里储蓄许久的气体，哪怕穿过大气层都没削弱分毫，随着吐息的方向拍打着城市的雾气，让人们失去了视野。真个城市化作灰暗雾都，人们一瞬间变成了无头苍蝇，除了四处乱窜之外，什么也做不到了。\n\n§Y“轰轰轰轰———！！！”§!\n\n双唇分开的距离逐渐增大，天空从灰色逐渐转为红色，随着第一个人的失手离地，人们开始意识到仅凭自己的肉身已经无法抵挡如此狂风了。越来越多的人被卷上天空，幸运地还有享受高空美景的机会，另一些不幸的小人最开始只是还没来的及躲避而狂风抓住脚踝拉倒，就像是顽童般，越来越强大的气流，先是用钢铁刮破了他脆弱的肌肤，把他当做锤子一次次撞击车辆，随着水流汇集它的力道也越加野蛮，那少女的吐息对这“手上玩具”更加粗鲁，现在每次碰撞不只是流下红的一片，还留下一大片花白，坏掉的玩偶每一次甩起，里面的东西就像是棉花一样从破洞中掏出洒向四周。等皮囊都不完整，空扁的像是碎片一样从他指尖溜走，成为嵌入墙体上的烂泥，不过那最倒霉的人直接被这强风把身体按到墙上活生生地被挤爆，这样的场景，这样的惨状不断在城市中上演着。\n\n全程怀着戏弄人类的心情操纵着这一切的少女，漂浮在近外太空的高空看着这戏剧性的一幕。她也尚未知道，自己吐息的极限到底在哪，按捺不住好奇心的她，摒弃最后一丝对小人的仁慈，放下工作要求有意的增大了吐息的强度，而这反映到脆弱的城市里，则是另一番景象了。\n\n未固定的物品悉数升空，道路两旁的电线杆也未能幸免于难。低矮的平房有些已被掀掉房顶，滞留在地面的汽车与行人无一幸存，像是皮球一样被强风踢起，摔到墙上被强风按着层层磨碎，先是车前盖翘起，引擎被野蛮扯出，珍贵的零件被撒到到处都是，随后就是驾驶舱带着那如纸一般的小人，被搓成一团腥臭的铁球，最后连车后灯都被压碎，整个车体终于被淘气少女完全摧毁。\n\n§r“真是抱歉呐”§!\n\n少女看着这样的惨状，内心轻轻的向他们倒了声歉，但身体的动作却完全没有放松，反而张开嘴唇让吹出的吐息更强几分，就连高楼也即将抵挡不住这种级别的风速，摇摇晃晃的大楼好像下一刻就要倒塌，地面的平房已经完全飞上天空，郊区的田地甚至被整块整块地掀起，那些根成为他们之间的联系，这接连的田地飞起的景象如果被小人看到，或许会想起被狂风掀起的铁皮，然后明白哪怕是大地在少女力量下，不过是如纸一样轻薄，只能期望些原本属于田地的泥沙，在别的地方会堆积成一座新的山脉。让后人有地方建立这些逝者的丰碑。\n\n再过几秒，那些人类最为精巧和骄傲的高楼也在少女的吐息下臣服了。但最致命的，莫过于从刻晴口中飞出的小抹唾液。这些半径几米十几米的唾液团，带着极高的动能撞向大楼，就像是撕碎枯叶，轻则把整个外墙撕碎，把里面的人们变成其包含的肉泥，重则整栋楼被粉碎，整栋楼在倾倒的过程中，被唾液团撕咬干净，就算是直接撞向地面，也能够击穿地表到达百米之深的地底，躲在地下室里的小人，也许能暂时躲过地面的暴风，却在一声巨响中看着天花板坍塌，那索命的鬼神给予他最后一丝绝望。\n\n就当所有人都以为，自己就要在这少女温柔的吐息中暴死的时候，她却忽然停了下来。\n\n在一切被她摧毁之前，她想最后欣赏一次她的作品——在自己嘴唇正前方的城市已经完全消失，就连地面也被掀起了一层除了那残存的泥沙，各色的岩盘已经尽数暴露在少女眼前，而距离较近的几个城市，只剩下数十栋孤独的高楼还在矗立着，坑坑洼洼的地面里面储存着少女口水如同琥珀一样闪耀，各色红泥和残存的城市颜色点缀其中让一切看起来没呢吗单调。\n\n§r“感觉意外还不错嘛~”§!\n\n只是吐息就把几十组城市组成的城市群完全摧毁，受灾地区更是遍布这个国家，现在她就要给这个自豪的作品点上最后一笔。\n\n§Y“噗——！”§!\n\n少女一下子将积存在肺中的空气全部吐到地上，滚烫的吐息吹过之处无一不被染成土色，就算躲在那些能防御核弹袭击的深埋地堡这一次也没能幸免。在她的周围城市最后一丝存在也小时化作以她为中心的圆弧状废墟，在这扇形边缘还能看到被吹碎的建筑，而在更远的彼方，那新形成的山脉，便是之前存在于少女唇下的城市。\n\n§r“没想到你们早就同意了啊，抱歉刚刚玩的……推销的太开心了没有看见。最为道歉下次点名我来，只收你们半价哦~”§!\n\n少女尽兴玩，装作才看到提示的样子，用手轻轻抵住自己发顶故作可爱的卖一个萌，随后就留下这个“杰作”消失在天边。
  gts_ultra_company.1022.desc: "§r\"Huu~~~~~\"§!\n\nShe exhaled gently at first, giving them time. The warm breath felt like a spring breeze, evaporating the flood. Survivors worshipped her.\n\nBut as stones flew, the intensity rose. The breeze became a gale. People were blown away. The city became a gray fog of debris.\n\n§Y\"BOOM———!!!\"§!\n\nThe sky turned red. People were lifted, smashed against walls, or crushed by air pressure. Like broken dolls, they were destroyed.\n\nShe increased the intensity. Cars flew like balls, engines torn out, drivers crushed. Skyscrapers swayed.\n\n§r\"So sorry.\"§!\n\nShe opened her mouth wider. Buildings flew, fields were lifted. The earth was as thin as paper.\n\nSaliva droplets hit like cannonballs, tearing through buildings and penetrating deep underground. Bunkers collapsed.\n\nShe stopped to admire her work. The city was gone. Only bedrock and saliva pools remained.\n\n§r\"Looks unexpectedly nice~\"§!\n\n§Y\"Puff——!\"§!\n\nShe blew out the remaining air. The ground turned earth-colored. Deep bunkers failed. A fan-shaped wasteland remained.\n\n§r\"Oh, you already agreed? Sorry, I was having too much fun. Half price next time as an apology~\"§!\n\nShe acted cute and left."
#  §r看起来好美味啊……§!\n\n看着地面大楼林立， 少女忍不住吞了几口口水，可惜因为这次的险种是吐息险，少女只好轻拍脸颊让自己从对城市味道的妄想中回过神来，理理衣服的衣角正式开始这次保险推销。\n\n§r“那个大家好啊，我是[branch_office_owner.GetName]的推销员，希望大家购买我们公司的吐息险呢。”§!\n\n少女的声音清脆而响亮让听到的人只感到如丝竹流入耳朵，少女较好的面容站到大街上也应该回头率不低。但人们看向她的表情只有惊慌，随后就像老鼠一样四而逃。\n\n不过换个视角，人们从地面向上望去，看到少女白皙的脸蛋通过大气层外延，只是嘴唇轻轻的一张一合，就把方圆千里的云朵击散，从嘴里溢出一丝吐息穿过近千公里的大气层泼洒到大地上，人们只感受到一阵热浪带着一股好闻的味道在整个城市弥漫开来，细腻的口水雾在穿越大气层中几乎全部蒸腾，到地上只有绵密的水雾和阵阵微风，和冰冷的建筑外玻璃相接触一瞬间玻璃上就结出浓厚的水雾，哪怕这是少女讲话中携带的水汽都已经是这个城市一个月的降水了，蒸腾的水汽化作巨量的乌云在城市上集结下起滂沱大雨。\n\n积水开始在城市里堆积，原本小人还有着一丝侥幸，想着只不过是别人一次小小吐息而已，能有什么威力，达到红色警报多少有点过头了吧？但转眼之间就有几个小人惊恐的发现积水已经到达脚腕，城市的泄洪设施对少女口水来说实在过于渺小，哪怕把抽水设施功率开到最大，机器的轰鸣声却被“口水”雨的声音掩盖，如果在这样下去整个国家都要被少女几次轻轻吐息的口水完全淹没，眼见的少女当然发现了，不过比起帮忙她第一刻想到的是不满。\n\n§r“完全被乌云挡住了，看不到下面的情况，小人为什么要住在这种连说话都影响的星球上，这么弱就该早点买保险啊！算了，我直接开始推销了，事后记得好好感谢我哦。”§!\n\n实际上，她本人也不知道到底会发生什么事，这样的体型她也是第一次尝试，虽然这百万倍的大小恐怕只是一根手指都可以直接点碎山脉，只是手掌下压恐怕发达的城市也会变为黄土，如果臀部从着太空落下恐怕一个逝去的城市群都将成为地下万米的遗迹。但是，对于自己再熟悉不过的呼气，此刻她却想象不到它的威力。\n\n她深吸了一口气便创造出世人难得一见的奇观，那些笼罩城市的云朵在小人的眼皮子底下，被遮挡住天空的少女用她高挺的鼻梁下两个看不到底的牵引，如果把天空比作海洋，少女只是吸气就把整个大海吞噬，那些如鱼儿一般的云朵也逃离不了那填不满的坑洞，打着转的向着里面涌入，此前还在空中翱翔的飞机在察觉到突发情况之前，就已经和几百万加仑的空气一起被压缩到少女的鼻腔内，在旋转的气流中直接被加速度离心力绞成碎块，没有接触到少女鼻肉的机会。想从空中逃离的小人被少女无意中全灭。\n\n原本因为少女阴云遮盖的城市，下一刻就变成了阳光明媚的晴天。透过透亮而干燥的天空，人们看到了地球上最剧烈的大气运动。\n\n就如前面所说少女现在每一秒都再把底下这数以千万记的人们可供几个月呼吸的空气压缩到肺里，小人能观测到的地方天空都再围绕少女而旋转，那在鼻前形成的速度已经超越音速的漩涡，已经让人们产生视错觉，在他们看来那漩涡已经成为了实体，甚至认为少女直接把天空收入鼻前。等到十几秒后，人们才意识到少女正在吸气，因为少女一手造成的暴雨天灾，吓得魂飞魄散的小人们哪怕想要偷跑，在这个运输失能的城市里，也只能四处逃窜，只能无力的看着少女轻抿嘴唇，鼓成球状的脸颊提示人们少女已经完成吸气。\n\n少女保持着微笑她并不急着呼出刚刚吸入的空气，因为一时兴起，她想再给这些可怜的人儿一点准备时间，观察人们将要采取什么动作抵御她的吐息。\n\n慌乱的人们连常识都抛到脑后，只是一根筋的想要逃离逃离少女，大部分人第一想法竟然是跑出相对坚固的建筑，在流淌着少女口水芬芳已经化为泥水滩的街道中前进，哪怕少女及时打断了降水，现在街道上积水也有一米多深，别说逃跑有些慌乱的人们有些因为慌乱一个脚滑，整个人在水中无能的挣扎，最后只能连肚子都被少女口水撑圆的成为水上漂尸，让这条路更加难走，还有不小人被这看不见底的河流的暗流裹挟，被卷入排水系统中降低了着低效的排水系统，那一点点效率，那些被水流引出的各色小虫，腐臭的动物尸体，残留的各色尖锐物品，哪怕那些极幸运的小人走上几步都浑身是伤，一时间哀嚎不断。\n\n但就算跑又有什么用？就算逃离出这个城市也无法断定安全无虑——因为少女的樱唇，光是长度就达到了公里级，加上有着足够的距离扩散恐怕整个大陆都要受影响吧。当然，另外一些小人，并不像大多数人一样在拥挤的道路上逃窜，而是躲进了地下室与建筑中。
  gts_ultra_company.1023.desc: "§r\"Looks delicious...\"§!\n\nSeeing the buildings, the maiden swallowed. But this was Exhale Insurance. She patted her cheeks to focus.\n\n§r\"Hello everyone, I'm the salesperson for [branch_office_owner.GetName]. Please buy our Exhale Insurance.\"§!\n\nHer voice was clear, but people fled in panic. Looking up, they saw her lips open, dispersing clouds for thousands of miles. A breath passed through the atmosphere, bringing a heatwave and a pleasant scent. The moisture condensed on glass, equal to a month's rainfall. It rained heavily.\n\nThe flood rose. Drainage failed. She noticed.\n\n§r\"Clouds blocking the view. Why live on such a planet? You're so weak, just buy insurance! Fine, I'll start the pitch. Thank me later.\"§!\n\nShe took a deep breath. Clouds were sucked into her nostrils like fish into a whirlpool. Planes were compressed into her nose and destroyed.\n\nThe sky cleared. She was inhaling the air people needed for months every second. A supersonic vortex formed at her nose. People panicked, running through saliva-muddy streets. Corpses floated. The sewers backed up.\n\nRunning was useless. Her lips were kilometers long."
#  §r“呼~~~~~”§!\n\n少女紧贴着的双唇渐渐分离，动作轻缓而优雅，她并没有一开始就用尽全力吐息，而是缓缓增加力度，刻意给这些迟钝的小人们留下反应的空间。毕竟如果一开始就动用全力这脆弱的玩具就玩的太快了。\n\n带着巨量水汽的温热吐息，如同初春的一缕微风，轻抚着这座城市。虽然直到刚刚气温还是接近零下，但这夹杂着暖流的吐息，让气温变为了令人感到十分惬意和舒适的程度。连那地面上的积水都在少女吐息下极速蒸发，少女所搭建的障碍也被少女一手摧毁，有些小人虽然不知道发生了什么事，但是这般伟力让一种崇拜感从地里发芽，那些人儿顾不得浑身的伤口在地上叩拜起来。少女刚刚的行为也被这些折磨的失去理智的人们实作试炼，如果他们能活下去，应该会成为少女神教坚定的信徒。\n\n但随着石子飞起，人们迅速察觉到异样，少女的玩心渐起带来的后果便是——吐息强度的飞速升级。一开始的和煦春风仅在几秒后就迎来了大变样，温暖的感觉被增强的风速驱散，地面上跪拜的人群处了几个还在执迷不悟，其他已经开始再一次的逃向封闭的场所，肉体的自自信被少女摧毁，只能再一次的寄托那脆弱的人造物，那些来不及逃进室内的也不得不紧紧抓住路边固定的栏杆，只有这样才勉强能在暴风中稳定住身子。\n\n经历少女两次来自口腔内吐息的城市，再一次被少女口水形成的雾气笼罩，这次在口里储蓄许久的气体，哪怕穿过大气层都没削弱分毫，随着吐息的方向拍打着城市的雾气，让人们失去了视野。真个城市化作灰暗雾都，人们一瞬间变成了无头苍蝇，除了四处乱窜之外，什么也做不到了。\n\n§Y“轰轰轰轰———！！！”§!\n\n双唇分开的距离逐渐增大，天空从灰色逐渐转为红色，随着第一个人的失手离地，人们开始意识到仅凭自己的肉身已经无法抵挡如此狂风了。越来越多的人被卷上天空，幸运地还有享受高空美景的机会，另一些不幸的小人最开始只是还没来的及躲避而狂风抓住脚踝拉倒，就像是顽童般，越来越强大的气流，先是用钢铁刮破了他脆弱的肌肤，把他当做锤子一次次撞击车辆，随着水流汇集它的力道也越加野蛮，那少女的吐息对这“手上玩具”更加粗鲁，现在每次碰撞不只是流下红的一片，还留下一大片花白，坏掉的玩偶每一次甩起，里面的东西就像是棉花一样从破洞中掏出洒向四周。等皮囊都不完整，空扁的像是碎片一样从他指尖溜走，成为嵌入墙体上的烂泥，不过那最倒霉的人直接被这强风把身体按到墙上活生生地被挤爆，这样的场景，这样的惨状不断在城市中上演着。\n\n全程怀着戏弄人类的心情操纵着这一切的少女，漂浮在近外太空的高空看着这戏剧性的一幕。她也尚未知道，自己吐息的极限到底在哪，按捺不住好奇心的她，摒弃最后一丝对小人的仁慈，放下工作要求有意的增大了吐息的强度，而这反映到脆弱的城市里，则是另一番景象了。\n\n未固定的物品悉数升空，道路两旁的电线杆也未能幸免于难。低矮的平房有些已被掀掉房顶，滞留在地面的汽车与行人无一幸存，像是皮球一样被强风踢起，摔到墙上被强风按着层层磨碎，先是车前盖翘起，引擎被野蛮扯出，珍贵的零件被撒到到处都是，随后就是驾驶舱带着那如纸一般的小人，被搓成一团腥臭的铁球，最后连车后灯都被压碎，整个车体终于被淘气少女完全摧毁。\n\n§r“真是抱歉呐”§!\n\n少女看着这样的惨状，内心轻轻的向他们倒了声歉，但身体的动作却完全没有放松，反而张开嘴唇让吹出的吐息更强几分，就连高楼也即将抵挡不住这种级别的风速，摇摇晃晃的大楼好像下一刻就要倒塌，地面的平房已经完全飞上天空，郊区的田地甚至被整块整块地掀起，那些根成为他们之间的联系，这接连的田地飞起的景象如果被小人看到，或许会想起被狂风掀起的铁皮，然后明白哪怕是大地在少女力量下，不过是如纸一样轻薄，只能期望些原本属于田地的泥沙，在别的地方会堆积成一座新的山脉。让后人有地方建立这些逝者的丰碑。\n\n再过几秒，那些人类最为精巧和骄傲的高楼也在少女的吐息下臣服了。但最致命的，莫过于从刻晴口中飞出的小抹唾液。这些半径几米十几米的唾液团，带着极高的动能撞向大楼，就像是撕碎枯叶，轻则把整个外墙撕碎，把里面的人们变成其包含的肉泥，重则整栋楼被粉碎，整栋楼在倾倒的过程中，被唾液团撕咬干净，就算是直接撞向地面，也能够击穿地表到达百米之深的地底，躲在地下室里的小人，也许能暂时躲过地面的暴风，却在一声巨响中看着天花板坍塌，那索命的鬼神给予他最后一丝绝望。\n\n就当所有人都以为，自己就要在这少女温柔的吐息中暴死的时候，她却忽然停了下来。\n\n在一切被她摧毁之前，她想最后欣赏一次她的作品——在自己嘴唇正前方的城市已经完全消失，就连地面也被掀起了一层除了那残存的泥沙，各色的岩盘已经尽数暴露在少女眼前，而距离较近的几个城市，只剩下数十栋孤独的高楼还在矗立着，坑坑洼洼的地面里面储存着少女口水如同琥珀一样闪耀，各色红泥和残存的城市颜色点缀其中让一切看起来没呢吗单调。\n\n§r“感觉意外还不错嘛~”§!\n\n只是吐息就把几十组城市组成的城市群完全摧毁，受灾地区更是遍布这个国家，现在她就要给这个自豪的作品点上最后一笔。\n\n§Y“噗——！”§!\n\n少女一下子将积存在肺中的空气全部吐到地上，滚烫的吐息吹过之处无一不被染成土色，就算躲在那些能防御核弹袭击的深埋地堡这一次也没能幸免。在她的周围城市最后一丝存在也小时化作以她为中心的圆弧状废墟，在这扇形边缘还能看到被吹碎的建筑，而在更远的彼方，那新形成的山脉，便是之前存在于少女唇下的城市。\n\n§r“没想到你们早就同意了啊，抱歉刚刚玩的……推销的太开心了没有看见。最为道歉下次点名我来，只收你们半价哦~”§!\n\n少女尽兴玩，装作才看到提示的样子，用手轻轻抵住自己发顶故作可爱的卖一个萌，随后就留下这个“杰作”消失在天边。
  gts_ultra_company.1024.desc: "§r\"Huu~~~~~\"§!\n\nShe exhaled gently at first, giving them time. The warm breath felt like a spring breeze, evaporating the flood. Survivors worshipped her.\n\nBut as stones flew, the intensity rose. The breeze became a gale. People were blown away. The city became a gray fog of debris.\n\n§Y\"BOOM———!!!\"§!\n\nThe sky turned red. People were lifted, smashed against walls, or crushed by air pressure. Like broken dolls, they were destroyed.\n\nShe increased the intensity. Cars flew like balls, engines torn out, drivers crushed. Skyscrapers swayed.\n\n§r\"So sorry.\"§!\n\nShe opened her mouth wider. Buildings flew, fields were lifted. The earth was as thin as paper.\n\nSaliva droplets hit like cannonballs, tearing through buildings and penetrating deep underground. Bunkers collapsed.\n\nShe stopped to admire her work. The city was gone. Only bedrock and saliva pools remained.\n\n§r\"Looks unexpectedly nice~\"§!\n\n§Y\"Puff——!\"§!\n\nShe blew out the remaining air. The ground turned earth-colored. Deep bunkers failed. A fan-shaped wasteland remained.\n\n§r\"Oh, you already agreed? Sorry, I was having too much fun. Half price next time as an apology~\"§!\n\nShe acted cute and left."
#  我们近期成功完成了一笔与§Y[from.GetName]§!的保险大单。\n\n我们的销售员小姐来到了小人们的行星首府，向小人们推销着我们的精液险，不过或许是觉得单单是语言并没有什么说服力，销售员小姐脱下了身上的衣物，整齐的摆放在城市的一旁，赤身裸体的服下了公司配备的扶她药丸。没过多久，一根庞然大物就在城市中投下了它的影子。\n\n正当销售员小姐还在好奇的玩弄着这根粗大之物事，小人的军队已经到位，无数的火炮被轰击在销售员小姐的下体上，不过这一切只是让她变得更加兴奋，而那根粗大的肉棒也随之变得更加坚挺。\n\n销售员小姐轻轻拉动包皮，露出冒着蒸汽的巨大的龟头，这座城市当中的那些最高大楼，也比不上少女龟头的高度，这些小人哪里来的自信呢？为了证明小人们的弱小，销售员随意的从勾状冠中搓一些包皮垢，而这些随意丢下的分泌废物，对小人来说，也如同毁灭性的陨石一般可怕。\n\n真固执啊...即使遭遇了这样的危险，小人们依旧在对销售员小姐发起攻击，看来还是得给他们点真实的危险。销售员小姐随即自慰起来，在小人们炮火对龟头的刺激下，很快就达到了高潮，随着一声淫叫，大量粘稠的精液便从下体中喷出，犹如一挺重炮，彻底击碎了小人们的反抗心理。整座城市满是销售员小姐撒出的种子，在充分理解了巨娘侵犯星球的破坏性后，当地的行政主官俐落地和我们签署了精液险契约。
  gts_ultra_company.1025.desc: "We successfully closed a deal with §Y[from.GetName]§!.\n\nThe sales lady arrived, undressed, and took a Futa Pill. A massive object cast a shadow over the city.\n\nThe army attacked her lower body, but it only excited her. The rod became erect.\n\nShe pulled back the foreskin, revealing a steaming glans taller than skyscrapers. She rubbed off smegma, which fell like meteorites.\n\nShe masturbated. Artillery fire stimulated her glans. She climaxed, spraying sticky semen like heavy artillery fire. The city was buried in her seed. The administrator signed immediately."
  gts_ultra_company.1026.desc: "A Giantess from [branch_office_owner.GetName] attacked §Y[root.GetName]§!\n\nShe undressed and grew a male organ.\n\nOur attacks only excited her. The stench of foreskin filled the city. Pre-cum dripped like dragon saliva.\n\nShe masturbated and ejaculated. The semen blast destroyed buildings and drowned citizens. She continued stroking, threatening us.\n\nWe signed to stop the 'demonstration'."
