  gts_ultra_company.4002.desc: "The collection day has arrived as scheduled. This time, in charge of the §Y[event_target:gts_bruh_get_insurance_planet.GetName]§! region is an athletic Giantess salesperson with healthy wheat-colored skin. Humming a light tune, she takes that signature silver spoon from her waist and, through the atmosphere, targets the most prosperous continent on the planet. Without a hint of hesitation, the spoon descends with a whistling sound, as easily as scooping ice cream, uprooting tens of thousands of square kilometers of land along with the dense factories and residential areas. The roaring of the crust tearing is covered by her hummed melody, and countless tiny people slide despairingly from the edge of the spoon's bowl into the abyss below. Subsequently, this spoonful of land laden with resources is poured into a giant anti-gravity container and sealed as company assets. After the collection, the salesperson stretches and decides to demonstrate the meaning of \\\"Foot-Stomp Insurance.\\\" She slowly lifts her right leg, takes off that sneaker comparable in size to a gas giant planet, and even with great interest removes the cotton ankle sock inside that is soaked from long-distance travel, tossing it casually onto a nearby lunar orbit; the intense sour sweat smell instantly sends the planet's air quality index off the charts. Immediately after, her bare giant foot, covered with fine palm prints, begins to approach the planet. For the tiny people on the ground, the sky is no longer blue, but replaced by a flesh-colored, bead-covered boundless canopy. The salesperson doesn't directly crush the planet, but lightly presses the pad of her big toe onto a coastal plain. With merely this \\\"light\\\" press, hundreds of billions of tons of pressure instantly pulverizes the underground rock layers, and seawater is squeezed out in all directions, forming ring-shaped tsunamis thousands of meters high. She excitedly wriggles her toes, grinding the cities on the ground back and forth like dust, until all man-made structures are turned to powder, mixed with the sweat secreted from her sole into gray-black grime. When she lifts her foot, a clearly visible fingerprint indentation deeply recessed into the crust is left on the ground, the indentation filled with pungent sweat lakes. \\\"Oops, looks like I used a bit too much force,\\\" she looks at the countless tiny black dots sticking to her sole and smiles mischievously, \\\"but this way you'll remember the benefits of buying insurance, right?\\\" According to statistics, the population successfully placed into containers as premiums in this operation was §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!, while the total number of accidental deaths during the uprooting and demonstration process reached §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!."
  gts_ultra_company.4002.a: "I believe they now deeply understand the necessity of insurance."
  #  保費繳交：乳壓險
  gts_ultra_company.4003.name: "Premium Payment: Breast-Press Insurance"
  #  本季度的保費繳納專員是一位擁有驚人圍度的豐滿巨娘，她那碩大雙峰在太空中隨著動作微微顫動。她帶著溫柔卻充滿壓迫感的母性微笑，拿出了那把銀色湯匙。她像是在對待一群調皮的孩子，輕輕地將湯匙探入大氣層，溫柔卻堅定地剷起了星球上的幾個大陸。地基斷裂，城市在湯匙的金屬面上崩塌，無數小人在慘叫中被打包進了冰冷的反重力容器，成為了公司的人力資源儲備。收款結束後，銷售員小姐解開了胸前的紐扣，那對被束縛已久的白色巨乳如同兩顆新生的白矮星般彈跳而出，散發著令人窒息的熱量和奶香。她雙手捧起其中一隻乳房，對準星球表面的一片廣袤平原壓了下去。這不是撞擊，而是一種緩慢的、令人絕望的窒息與擠壓。柔軟卻沉重得不可思議的乳肉像流體一樣覆蓋了大地，填滿了每一條峽谷，壓垮了每一座山峰。被籠罩在乳房下的小人們感受到了天塌一般的恐懼，視野完全被白皙的皮膚填滿，緊接著是無盡的黑暗與高溫。乳房下方的汗液與溢出的乳汁混合在一起，形成了一場濕熱的洪災，將無數城市浸泡在其中。銷售員小姐似乎覺得這樣還不夠，她輕輕地在地面上摩擦著乳房，感受著星球表面微不足道的凸起給乳暈帶來的些許瘙癢，這對於她來說是享受，對於星球來說卻是毀滅性的磨盤，將數個板塊的交界處磨得平整光華。“乖孩子們要聽話哦，”她嬌嗔地說著，抬起乳房，只見原本崎嶇的地貌被壓出了一個完美的圓形凹陷，中心還有一個因乳頭陷沒而形成的深坑湖，裡面注滿了乳白色的液體，"這就是乳壓險的意義，溫柔有時候也是一種毀滅呢"。根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
  gts_ultra_company.4003.desc: "This quarter's premium payment specialist is a voluptuous Giantess with incredible measurements, her giant breasts trembling slightly in space with her movements. With a gentle yet oppressive maternal smile, she takes out the silver spoon. As if treating a group of naughty children, she lightly probes the spoon into the atmosphere, gently but firmly uprooting several continents on the planet. Foundation cracking, cities collapsing on the metal surface of the spoon, countless tiny people are packed into the cold anti-gravity containers amidst screams, becoming the company's human resource reserves. After the collection, the salesperson unbuttons her chest, and that pair of long-restrained white giant breasts bounce out like two newborn white dwarfs, emitting suffocating heat and milky fragrance. She cups one of her breasts with both hands and presses it down upon a vast plain on the planet's surface. This is not an impact, but a slow, despairing suffocation and compression. The soft yet incredibly heavy breast flesh covers the land like fluid, filling every canyon and crushing every mountain peak. The tiny people shrouded under the breast feel a fear like the sky is falling, their vision completely filled with fair skin, followed by endless darkness and high temperature. The sweat beneath the breast and the spilled milk mix together, forming a hot and humid flood that soaks countless cities. The salesperson seems to feel this is not enough; she gently rubs her breast against the ground, feeling the slight itchiness brought to her areola by the insignificant protrusions on the planet's surface; for her, it's enjoyment, but for the planet, it's a devastating millstone, grinding the junctions of several tectonic plates smooth and polished. \"Be good children and listen,\" she says coquettishly, lifting her breast, and one sees that the originally rugged terrain has been pressed into a perfect circular depression, with a deep indentation lake at the center formed by the sinking of her nipple, filled with milky white liquid. \"This is the meaning of Breast-Press Insurance; gentleness is sometimes also a kind of destruction.\" According to statistics, the population successfully placed into containers as premiums in this operation was §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!, while the total number of accidental deaths during the uprooting and demonstration process reached §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!."
  #  感謝她的...溫柔提醒...
  gts_ultra_company.4003.a: "Thanks for her... gentle reminder..."
  #  保費繳交：陰吞險
