  #  這次造訪§Y[event_target:gts_bruh_get_insurance_planet.GetName]§!的是一位身材火辣、作風大膽的巨娘銷售員。她嚼著口香糖，一臉不在乎地看著腳下的微塵。手中的銀色湯匙被她舞得呼呼作響，隨意地在星球表面颳了幾下，就像刮彩票一樣，將幾座大型都市圈連根剷起。無數摩天大樓在空中解體，居民們像螞蟻一樣被吸入反重力容器。她吹了個泡泡，眼神輕蔑地掃過地面上那些仍在抵抗的軍隊，轉過身去，將那碩大無比、包裹在緊身皮褲下的臀部對準了星球的大氣層。"聽說你們空氣品質不錯？讓我來幫你們改善一下"。她嬉笑著說道，隨即腹部微微用力。一聲驚天動地的悶響在太空中炸開，雖然真空中無法傳聲，但那股從肛門噴薄而出的氣體衝擊波卻實實在在地撞擊在了星球表面。這股氣體帶著令人作嘔的硫磺與腐敗食物混合的惡臭，以超音速席捲了全球。原本蔚藍的大氣層瞬間被染成了渾濁的黃綠色。強烈的氣流摧毀了地表的一切凸起物，風暴中夾雜著未消化的微觀食物殘渣，像散彈槍一樣將城市打成篩子。更可怕的是那無孔不入的氣味，它置換了原本的氧氣，讓所有吸入氣體的生物都陷入了中毒般的眩暈與嘔吐中。植物枯萎，水源變質，整個星球變成了一個巨大的毒氣室。銷售員小姐還特意用手扇了扇風，讓屁味更均勻地覆蓋星球的每一個角落。"這就是毒氣險的威力，寶貝們"，她拍了拍屁股，發出清脆的響聲，"下次再不交錢，我就直接坐在你們臉上放，那時候可就沒地方躲了哦"。根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
  gts_ultra_company.4007.desc: "The one visiting §Y[event_target:gts_bruh_get_insurance_planet.GetName]§! this time is a hot-bodied, bold-styled Giantess salesperson. Chewing gum, she looks at the dust beneath her feet with a face of indifference. She swings the silver spoon in her hand with a whizzing sound, randomly scraping the planet's surface a few times, as if scratching a lottery ticket, uprooting several large metropolitan areas. Countless skyscrapers disintegrate in mid-air, and the residents are sucked into anti-gravity containers like ants. She blows a bubble, her eyes contemptuously sweeping over those armies still resisting on the ground, then she turns around and aligns her massive buttocks, wrapped in tight leather pants, with the planet's atmosphere. \"I heard your air quality is good? Let me help you improve it,\" she says giggling, then her abdomen applies slight force. A earth-shaking muffled sound explodes in space; although sound cannot travel in a vacuum, the gas shockwave erupting from the anus actually hits the planet's surface. This gas, carrying a sickening stench of sulfur and rotten food, sweeps across the globe at supersonic speeds. The originally blue atmosphere is instantly dyed a murky yellow-green. The intense airflow destroys all protrusions on the surface, and the storm is littered with undigested microscopic food debris, turning cities into sieves like a shotgun. More terrifying is the all-permeating smell, which replaces the original oxygen, making all organisms that inhale the gas fall into a poisoned-like dizziness and vomiting. Plants wither, water sources spoil, and the entire planet becomes a giant gas chamber. The salesperson even specially fans the air with her hand to make the fart smell cover every corner of the planet more evenly. \"This is the power of Poison Gas Insurance, babies,\" she slaps her buttocks, making a crisp sound. \"Next time you don't pay, I'll fart right on your faces, then there'll be no place to hide.\" According to statistics, the population successfully placed into containers as premiums in this operation was §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!, while the total number of accidental deaths during the uprooting and demonstration process reached §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!."
