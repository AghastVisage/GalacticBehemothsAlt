  gts_ultra_company.4007.a: "Thank you for your patronage."
  #  保費繳交：汙物險
  gts_ultra_company.4008.name: "Premium Payment: Foul-Matter Insurance"
  #  本季度負責§Y[event_target:gts_bruh_get_insurance_planet.GetName]§!的銷售員是一位面容冷豔、稍顯潔癖的貴族大小姐型巨娘。她用兩根手指捏著銀色湯匙的柄端，仿佛接觸這顆星球都會弄髒她的手。她皺著眉頭，迅速而精準地剷起了幾塊污染較重的工業區作為保費，將那些骯髒的小人扔進反重力容器封存。隨後，她嘆了口氣，似乎對接下來的流程感到厭惡，但為了公司的業績，她還是優雅地撩起長裙，褪下絲綢內褲，露出雪白的臀部懸停在星球上空。巨大的肛門微微張開，在那粉色的括約肌收縮蠕動下，一條如同山脈般巨大的棕褐色糞便緩緩擠出。這條充滿了未完全消化的食物殘渣和腸道粘液的巨物，帶著毀滅性的動能墜落。當它砸向地面的瞬間，大陸板塊因承受不住這突如其來的質量而崩裂，衝擊波將周圍數千公里的一切夷為平地。糞便本身像一座新的高原覆蓋了原有的文明，散發出的高溫和令人窒息的惡臭瞬間殺死了周圍所有的生態系統。這還沒完，隨之而來的還有大量的稀便雨，將星球的其他部分染成了噁心的棕黃色。"真是噁心，竟然逼我在這種地方如廁"，銷售員小姐掏出一塊星雲般大小的手帕擦了擦下體，然後嫌棄地將手帕也丟了下去，覆蓋了另一片大陸，"這就是不買汙物險的下場，下次記得提前把保費準備好，我可不想再來這種地方上廁所了"。她整理好衣裙，頭也不回地離開了這顆被嚴重污染的星球。根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
  gts_ultra_company.4008.desc: "The salesperson in charge of §Y[event_target:gts_bruh_get_insurance_planet.GetName]§! this quarter is a cold-faced, slightly germophobic aristocratic Giantess. She pinches the handle of the silver spoon with two fingers, as if touching this planet would dirty her hands. Frowning, she quickly and accurately scoops several heavily polluted industrial areas as premiums, throwing those dirty tiny people into anti-gravity containers for storage. Subsequently, she sighs, seemingly disgusted by the next procedure, but for the company's performance, she still gracefully lifts her long skirt, slips off her silk panties, and suspends her snow-white buttocks over the planet. The giant anus slightly opens, and under the contraction and writhing of that pink sphincter, a mountain-sized giant brownish-tan piece of feces slowly squeezes out. This giant object, full of incomplete digested food debris and intestinal mucus, falls with devastating kinetic energy. At the moment it hits the ground, the continental plates shatter due to the inability to withstand this sudden mass, and the shockwave levels everything within thousands of kilometers. The feces itself covers the original civilization like a new plateau, emitting high temperatures and a suffocating stench that instantly kills all surrounding ecosystems. This is not all; what follows is a large amount of watery stool rain, dyeing other parts of the planet a disgusting brownish-yellow. \"Truly disgusting, actually forcing me to use the toilet in such a place,\" the salesperson takes out an astronomical-sized handkerchief to wipe her lower body, then dismissively drops the handkerchief as well, covering another continent. \"This is the end for those who don't buy Foul-Matter Insurance. Remember to prepare the premium in advance next time; I don't want to come here to use the toilet again.\" She straightens her dress and leaves this severely polluted planet without looking back. According to statistics, the population successfully placed into containers as premiums in this operation was §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!, while the total number of accidental deaths during the uprooting and demonstration process reached §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!."
