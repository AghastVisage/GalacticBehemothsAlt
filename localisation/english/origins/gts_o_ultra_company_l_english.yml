  #  負責本次§Y[event_target:gts_bruh_get_insurance_planet.GetName]§!保費收繳的是一位氣質慵懶、眼神迷離的巨娘銷售員。她似乎對這份工作感到些許乏味，只想儘快結束流程去享受私人時間。她漫不經心地揮動著手中巨大的銀色湯匙，像是在清理花園雜草一般，隨意地剷去了星球上一片人口稠密的三角洲地帶。湯匙邊緣帶起的衝擊波將周圍的海水推向天空，而被剷起的大陸板塊在空中碎裂，無數小人在失重與超重的交替中嘔吐、昏厥，最終被吸入懸浮的反重力容器中。完成例行公事後，她打了個哈欠，決定進行"陰吞險"的演示。她緩緩褪下那條足以覆蓋整個星球的蕾絲內褲，然後調整姿勢，將她那恆星級別的胯部對準了星球的赤道上。她將濕潤、粉嫩的陰戶緩緩壓向星球。巨大的肉唇如同兩扇閉合的星門，將赤道連同周圍的城市群完全吞沒。她前後扭動著腰肢，利用星球表面的凸起摩擦著自己的敏感部位，數萬公尺高的山峰在她的陰唇間像脆弱的餅乾一樣崩碎、磨平。大量的愛液從穴口湧出，其粘稠度和淹沒一切的體積使其成為了最可怕的洪水，將被磨平的山脈廢墟封存在晶瑩剔透的粘液中。小人們絕望地看著那粉紅色的肉壁在天空中蠕動、閉合，將世界變成一片充滿腥甜氣味的肉慾地獄。"唔...這個星球的觸感還稍微有点粗糙呢"，她發出一聲滿足的嘆息，緩緩抬起臀部，只見那列曾經雄偉的大陸已經消失不見，取而代之的是一道光滑的、被愛液浸透的峽谷，"不想讓你們的星球變成我的跳蛋的話，記得按時交錢哦"。根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
