  gts_ultra_company.4001.desc: "According to the contract terms, this quarter's premium collection day has arrived. Our dispatched salesperson—a tall professional with shoulder-length short hair—has arrived near the orbit of §Y[event_target:gts_bruh_get_insurance_planet.GetName]§!. Her star-sized body floats quietly beside this tiny planet, the shadow cast instantly engulfing the entire hemisphere, plunging the surface into midday darkness. The salesperson gracefully takes a specialized silver spoon from her lunar-sized briefcase—a tool that is merely afternoon tea tableware to her, but in the eyes of the planet's residents, is a doomsday metal plate blotting out the sky. With a professional smile, she slowly extends the spoon to the planet's surface, accurately targeting the most densely populated core urban clusters. As the edge of the spoon cuts into the planet's crust, a low roar shatters the atmosphere; the tectonic plates wail and break under the compression of the metal, and the entire continental shelf—along with the skyscrapers, transportation hubs, and hundreds of millions of screaming and fleeing residents—is uprooted. The uprooted land quivers like jelly in the giant bowl of the spoon, and skyscrapers collapse like toy blocks in the changing gravity. Immediately after, a transparent anti-gravity container descends from the sky, enveloping the entire area in the spoon; the field inside the container locks instantly, and those terrified survivors find themselves being slowly lifted off the surface with their homes, rising toward that giant face in space. After confirming the premium has been credited, the salesperson decides to fulfill her duty, giving the customer a \\\"friendly reminder\\\" about the necessity of \\\"Tongue-Llick Insurance.\\\" She slightly opens her cherry-red lips, capable of swallowing oceans, and sticks out that moist, soft, yet devastatingly powerful giant tongue. She deliberately slows her movements, allowing the survivors on the planet to clearly see how that pink wall of flesh slowly presses toward the ground. The warm tongue surface, like a fleshy mountain range, sweeps across a whole continent near the planet's equator; all fortifications, forests, and mountains are instantly crushed into a flat two-dimensional scroll under the writhing of the tongue muscles. The crystalline saliva secreted from the tongue pours down like a viscous tsunami, submerging the entire area. Those tiny people trying to hide are swept into the saliva, struggling and suffocating in the unbreathable mucus. When the tongue finally retracts into the mouth, a giant saliva trench stretching across half the planet and reaching several kilometers deep is left on the surface, its bottom filled with a saliva slurry mixed with soil, building wreckage, and the bodies of tiny people. \\\"This is why you need our Tongue-Lick Insurance,\\\" the salesperson's voice echoes on the planet through the thin atmosphere, shattering countless glass windows, \\\"if you forget to renew next time, my tongue won't leave so gently.\\\" She licks the soil mixed with several city ruins from the corner of her mouth with satisfaction, then turns and warps away. According to statistics, the population successfully placed into containers as premiums in this operation was §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!, while the total number of accidental deaths during the uprooting and demonstration process reached §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!."
  gts_ultra_company.4001.a: "Thank you for your patronage; we look forward to the next cooperation."
  #  保費繳交：足踏險
  gts_ultra_company.4002.name: "Premium Payment: Foot-Stomp Insurance"
  #  收款日如期而至，這次負責§Y[event_target:gts_bruh_get_insurance_planet.GetName]§!區域的是一位擁有健康小麥色肌膚的運動型巨娘銷售員。她哼著輕快的小曲，從腰間取出那把標誌性的銀色湯匙，透過大氣層鎖定了星球上最繁榮的大陸。沒有絲毫猶豫，湯匙帶著破空的呼嘯聲落下，如同挖取冰淇淋一般，輕而易舉地將數萬平方公里的土地連同上面密集的工廠和居民區挖了起來。地殼撕裂的巨響被她哼唱的旋律掩蓋，無數小人在湯匙的勺壁邊緣絕望地滑落，墜入下方的萬丈深淵。隨後，這勺滿載著資源的土地被倒入了一個巨大的反重力容器中，封存為公司資產。完成收款後，銷售員小姐伸了個懶腰，決定展示一下"足踏險"的含義。她緩緩抬起右腿，脫掉了那隻堪比氣態巨行星大小的運動鞋，甚至還饒有興致地脫下了裡面那隻因長途奔波而濕透的棉質短襪，將其隨手扔在臨近的衛星軌道上，散發出的濃烈酸醇汗味瞬間讓星球的空氣品質指數爆表。緊接著，她那赤裸的、布滿細密掌紋的巨大腳掌開始向星球逼近。對於地面的小人來說，天空不再是藍色，而是被一片肉色的、帶著汗珠的無邊天幕所取代。銷售員小姐並沒有直接踩碎星球，而是用大拇指的指腹輕輕按壓在了一片沿海平原上。僅僅是這"輕輕"的一按，數百億噸的壓力瞬間將地下的岩層壓得粉碎，海水被擠壓得向四周噴射，形成高達數千公尺的環形海嘯。她興奮地扭動著腳趾，將地面上的城市像灰尘一樣來回碾磨，直到所有的人造建築都化為齏粉，與她腳底分泌的汗液混合成灰黑色的泥垢。當她抬起腳時，地面上留下了一個清晰可見的、深陷地殼的指紋印記，印記中充滿了刺鼻的汗水湖泊。"哎呀，好像有點用力過猛了"，她看著腳底黏著的無數小黑點，調皮地笑了笑，"不過這樣你們才能記住買保險的好處，對吧？"根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
