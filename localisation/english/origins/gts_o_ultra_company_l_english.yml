  #Origin Text
  # §R警告：具有挑战性的起源§!\n这家巨型企业在迈入太空后很快发现了不同文明间天差地别的体型差距。她们敏锐地把握住商机，通过快刀阔斧的董事会改组，她们将为饱受巨娘威胁的小人文明提供保险确立为其主要业务。
  origin_Ultra_company_desc: "§RWarning: Challenging Origin§!\nThis Megacorp quickly discovered the vast size difference between civilizations after entering space. Keenly grasping the business opportunity, through drastic board restructuring, they established providing insurance for small folk civilizations plagued by Giantess threats as their main business."
  # 种族拥有最大的体型['concept_trait_Ultra']和['concept_trait_great_species']\n可以在除境内以外的大部分殖民地建造分部，并随着['concept_ascension_perks']数量增加解锁特殊的分部建筑\n拥有特殊的附庸类型:§Y$preset_ultracompany$§!\n拥有特殊的附庸建筑
  #  种族拥有最大的体型['concept_trait_Ultra']和['concept_trait_great_species']\n可以在除境内以外的大部分殖民地建造分部，并随着['concept_ascension_perks']数量增加解锁特殊的分部建筑\n拥有特殊的附庸类型：§Y$preset_ultracompany$§!\n拥有特殊的附庸建筑\n§G可以从分部获得当地人口§!
#  种族拥有最大的体型['concept_trait_Ultra']和['concept_trait_great_species']\n可以在除境内以外的大部分殖民地建造分部，并随着['concept_ascension_perks']数量增加解锁特殊的分部建筑\n拥有特殊的附庸类型：§Y$preset_ultracompany$§!\n拥有特殊的附庸建筑\n§G可以从分部获得当地人口§!
  origin_tooltip_Ultra_company_effects: "Species has the largest size ['concept_trait_Ultra'] and ['concept_trait_great_species']\nCan build branch offices on most colonies except within borders, unlocking special branch buildings as ['concept_ascension_perks'] count increases\nHas special subject type: §Y$preset_ultracompany$§!\nHas special subject buildings\n§GCan acquire local population from branch offices§!"
#  建造分部后会给殖民地带来§R一点点破坏§!\n开局只有§R非常少量§!£pop£人口\n§R游戏初期须注意岗位及资源的分配§!\n\n注意：该起源与小伞的最佳化和小伞的规则相容mod不相容
  origin_tooltip_Ultra_company_negative_effects: "Building branch offices causes §Ra little destruction§! to colonies\\nStarts with §Rvery few§! £pop£ pops\\n§RPay attention to job and resource allocation in early game§!\\n\\nNote: This origin is incompatible with Xiaosan's Optimization and Xiaosan's Rules Compatible mods"
  START_SCREEN_ULTRA_COMPANY: "Perhaps a prank by gods, or we are gods ourselves. Opening our eyes, we found ourselves floating in void, nothing but our existence.\n\nInitially we searched excitedly, but found only void and more void, causing most [ROOT.species.GetName] individuals to fall into stasis after aimless wandering.\n\nFinally, one companion excitedly showed us her open palm. Initially we thought she was crazy, but under her guidance, we found countless black dots deep in her palm lines—universes surrounding us but destroyed unconsciously by our bodies; she also excitedly told stories of shrinking herself to microscopic size to force into a universe and meeting a civilization named 'Cosmic Enterprise'. [ROOT.species.GetName] were deeply attracted by these stories, practicing shrinking while imitating these civilizations.\n\nNow, we are assigned by the board to this galaxy to conduct some 'trade' with other civilizations..."
