  gts_ultra_company.2016.desc: "Qianhai, a bored succubus in heat, received a message.\n\n§r\"Punish [event_target:gts_ultra_company_target.GetName] with your heels and stockings.\"§!\n\nShe smiled, stretching her sexy legs.\n\n§r\"Just in time to play with some little toys.\"§!"
  gts_ultra_company.2017.desc: "§r\"Cleaned up. Now for you...\"§!\n\nA small grey moss patch remained—the capital. \n\n§r\"Punishment for the ringleader.\"§!\n\nShe dug out the city. The giantess's gaze was apocalyptic.\n\n§r\"Reward: live in my honey cave.\"§!\n\nShe stuffed the city into her privates. Pressure crushed it. She masturbated while tearing at the magma planet with her feet."
  # 不管怎么说，任务是圆满完成了。
