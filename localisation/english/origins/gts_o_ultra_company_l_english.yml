  gts_ultra_company.1013.desc: "We successfully closed a deal with §Y[from.GetName]§!.\n\nThe sales lady found a financial district, squatted, and farted. The vibration of her sphincter sent a foul shockwave sweeping across the area, toppling skyscrapers like straw and reducing the district to ruins. Seeing the consequences, the administrator signed the Flatulence Insurance contract."
  gts_ultra_company.1014.desc: "A Giantess from [branch_office_owner.GetName] attacked §Y[root.GetName]§!\n\nShe squatted over an economic hub. The sound of her anus rubbing against panties was thunderous, followed by a blast that destroyed the district. The stench polluted the area and will spread globally. A nuclear-level destruction.\n\nShe farted again, wiping out our gathered forces. We don't even know if she noticed us.\n\nShe stopped to sell Toxic Gas Insurance. We signed to stop the 'demonstration'."
  # 我们近期成功完成了一笔与§Y[from.GetName]§!的保险大单。\n\n穿着西服、包臀裙和黑丝裤袜的销售员小姐登陆到小人的行星首府附近，在简单的问好和自我介绍后开始了向客户展示巨娘排便的威力。销售员小姐脱下裙子和内裤，将屁股对准数个城市区划的交界地，不一会，巨大的肛门开始剧烈抽动，天空传来了隆隆的轰鸣声，销售员小姐将力气集中到下身，将体内的棕黄色巨柱慢慢地推出肛门。最终，沾满肠液的粘稠粪便被排出身体，重重地砸向地面，轻易压毁了大片城区，很快，更多的粪便被一块块排出，将更多的城市压在下面。\n\n似乎是为了验证我们宣称的情形是否属实，小人们使用了他们的星球防御武器对销售员小姐进行攻击。不过这些微不足道的刺激只让愉悦排便的销售员小姐感到肛门的异样舒爽，然后排出了大滩没有凝固的稀便。它们用自己的行动证明了它们急需我们的保护。\n\n最终，按照工作手册造成了固定比例的人口死亡和城市毁灭后，我们的销售员小姐停止了破坏，并开始向幸存的小人们介绍公司污物险的保险范围和收费标准。\n\n在充分理解了巨娘的排便活动会造成多么严重的破坏后，当地的行政主官麻利地和我们签署了污物险合同。
