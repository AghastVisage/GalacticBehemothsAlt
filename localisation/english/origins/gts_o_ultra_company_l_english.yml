  gts_bruh_ultra_company_insurance_03: "§HInsured: Giantess Breast-Press Insurance§!"
  #  该星球的居民已经自愿投保了§Y巨娘乳压险§!，当它们再次被星球级的巨乳挤压时，会第一时间得到公司的保护和重建赔偿...如果它们能撑到那时候的话。
  gts_bruh_ultra_company_insurance_03_desc: "The residents of this planet have voluntarily insured with §YGiantess Breast-Press Insurance§!. When they are again squeezed by planet-scale giant breasts, they will receive immediate protection and reconstruction compensation from the company... if they can last until then."
  #  §H已投保：巨娘阴吞险§!
  gts_bruh_ultra_company_insurance_04: "§HInsured: Giantess Vaginal-Swallow Insurance§!"
  #  该星球的居民已经自愿投保了§Y巨娘阴吞险§!，当它们的大陆再次被用作自慰的一次性工具时，会第一时间得到公司的保护和重建赔偿...如果它们能撑到那时候的话。
  gts_bruh_ultra_company_insurance_04_desc: "The residents of this planet have voluntarily insured with §YGiantess Vaginal-Swallow Insurance§!. When their continent is again used as a disposable tool for masturbation, they will receive immediate protection and reconstruction compensation from the company... if they can last until then."
  #  §H已投保：巨娘洪水险§!
  gts_bruh_ultra_company_insurance_06: "§HInsured: Giantess Flood Insurance§!"
  #  该星球的居民已经自愿投保了§Y巨娘洪水险§!，当它们的星球再次被金色天洪淹没时，会第一时间得到公司的保护和重建赔偿...如果它们能撑到那时候的话。
  gts_bruh_ultra_company_insurance_06_desc: "The residents of this planet have voluntarily insured with §YGiantess Flood Insurance§!. When their planet is again submerged by a golden heavenly flood, they will receive immediate protection and reconstruction compensation from the company... if they can last until then."
  #  §H已投保：巨娘玩具险§!
  gts_bruh_ultra_company_insurance_05: "§HInsured: Giantess Toy Insurance§!"
  #  该星球的居民已经自愿投保了§Y巨娘玩具险§!，当它们的城市再次被随手丢下的性玩具摧毁时，会第一时间得到公司的保护和重建赔偿...如果它们能撑到那时候的话。
  gts_bruh_ultra_company_insurance_05_desc: "The residents of this planet have voluntarily insured with §YGiantess Toy Insurance§!. When their cities are again destroyed by sex toys dropped casually, they will receive immediate protection and reconstruction compensation from the company... if they can last until then."
  #  按照契約條款，本季度的保費收繳日已經到來。我們派遣的銷售員小姐——一位身材高挑、留著齊肩短髮的專業人員，已經抵達了§Y[event_target:gts_bruh_get_insurance_planet.GetName]§!的軌道附近。她那恆星般龐大的身軀靜靜地漂浮在這顆渺小行星旁，投下的陰影瞬間吞沒了整個半球，讓地表陷入了正午的黑暗。銷售員小姐動作優雅地從那個比月球還大的公文包中取出了一把特製的銀色湯匙，這把對她而言只是下午茶餐具大小的工具，在星球居民眼中卻是遮天蔽日的末日金屬蓋板。她帶著職業化的微笑，將湯匙緩緩伸向星球表面，精準地對準了人口最密集的幾個核心城市群。隨著湯匙的邊緣切入地殼，發出了震碎大氣層的低沉轟鳴聲，板塊在金屬的擠壓下哀鳴斷裂，整片大陸架連同上面的摩天大樓、交通樞紐、以及數以億計正在尖叫奔逃的居民一起被連根剷起。那些被剷起的土地在湯匙巨大的勺面中如同果凍般顫動，高樓大廈像積木一樣在重力變化中崩塌。緊接著，一個透明的反重力容器從天而降，將湯匙中的整片區域包裹起來，容器內部的立場瞬間鎖定，那些僥倖存活的驚恐居民發現自己正連同家園一起被緩緩抬離地表，升向太空中那張巨大的面孔。在確認保費入帳後，銷售員小姐決定履行職責，為客戶進行一次關於"舌舐險"必要性的"友善提醒"。她微微張開櫻桃般紅潤卻足以吞噬大洋的嘴唇，伸出了那條濕潤、柔軟卻充滿毀滅性力量的巨舌。她刻意放慢了動作，讓星球上的倖存者能夠清楚地看到那粉紅色的肉壁是如何緩緩壓向地面的。溫熱舌苔如同肉質的山脈掃過星球赤道附近的一整片大陸，所有的防禦工事、森林、山脈都在舌頭肌肉的蠕動碾壓下被瞬間壓成扁平的二維畫卷。舌頭表面分泌的晶瑩唾液如同粘稠的海嘯般傾瀉而下，將整片區域淹沒在唾液中。那些試圖躲藏的小人被唾液捲入，在無法呼吸的粘液中掙扎窒息。當舌頭終於收回口腔時，星球表面已經留下了一道橫跨半個星球、深達數公里的巨大唾液溝渠，溝渠底部填滿了混合著泥土、建築殘骸和小人屍體的唾液泥漿。"這就是為什麼你們需要我們的舌舐險"，銷售員小姐的聲音透過稀薄的大氣層在星球上迴盪，震碎了無數玻璃，"下次如果忘記續費，我的舌頭可就不會這麼溫柔地離開了哦。"她滿意地舔了舔嘴角掛著的、混雜了數個城市殘骸的泥土，轉身躍遷離開。根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
