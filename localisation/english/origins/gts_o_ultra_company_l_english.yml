  gts_ultra_company.1003.desc: "We successfully closed a deal with §Y[from.GetName]§!.\\n\\nThe sales lady landed and began demonstrating the power of a Giantess Trample. She took off her shoes, letting her feet breathe after a long journey, and placed her shoes at the edge of the city—showing the oppression of the shoes was part of the pitch. She raised her silk-clad foot and stomped on the central square. Alloy and concrete turned to rubble sticking to her sweaty sole. After destroying several cities, she removed her black tights and continued with her bare feet, proving that regardless of footwear, the disaster is equally terrible.\\n\\nTheir defenses were futile. Their armies became dirt between her toes. They proved they needed our protection.\\n\\nAfter the mandated destruction, she pitched the Foot Trample Insurance. The administrator signed immediately."
#  [branch_office_owner.GetName]的巨大娘袭击了我们的§Y[root.GetName]§!殖民地！\n\n她突然降临到我们的行星首府附近，先是用鞋底瞬间碾碎了数座大楼，随后她脱下鞋子扔到一旁，用袜足开始在我们的城市间来回踩踏起来，之后似乎是感觉碾压地不够尽兴，又把袜子脱下来，用裸足继续着她的恐怖攻击。这次袭击让我们的数座大型都市变成了她脚下的污泥。\n\n尽管我们的武装部队立刻反应过来，开始对那位巨娘发起反击，然而悬殊的体型差让我们的部队还没来得及开火就被她的巨足摧毁了，我们甚至不确定她是否真的意识到我们在攻击她。\n\n数小时后，她终于停下了可怕的破坏行为，然后开始向幸存的公民介绍起她们公司的足踏险。她们几乎毁掉了我们的整个星球，就为了推销一份保险？！\n\n为了避免她继续拿我们的城市进行“展示”，当地的行政主官赶紧签署了她们想要的商业条约。
  gts_ultra_company.1004.desc: "A Giantess from [branch_office_owner.GetName] attacked §Y[root.GetName]§!\\n\\nShe landed, crushed buildings with her soles, then removed her shoes and trampled our cities in her stockings. Feeling unsatisfied, she went barefoot. Several metropolises became mud under her feet.\\n\\nOur forces were destroyed before they could fire. We aren't even sure she noticed us attacking.\\n\\nShe stopped to sell Foot Trample Insurance. She ruined our planet for a sale?! We signed to stop the 'demonstration'."
#  我们近期成功完成了一笔与§Y[from.GetName]§!的保险大单。\n\n穿着西装、包臀裙和黑丝裤袜的销售员小姐登陆到小人的行星首府附近，在简单的问好和自我介绍后开始了向客户展示巨娘乳压的威力。\n\n销售员小姐解开外套和衬衫，被外衣束缚已久的巨乳得以舒展开来，然后她将自己的胸罩解下，丢在一旁，然后俯下身子，用自己的南半球轻轻碾压着这个世界的北半球，无数地区被销售员小姐的乳房压平，极少数幸运儿或许会被乳头吸入，在巨娘姐姐的乳内开始新的生活。\n\n似乎是为了验证我们宣称的情形是否属实，小人们使用了他们的星球防御武器对销售员小姐进行攻击。不过，他们的常规武装完全无法对销售员小姐的乳房带来刺激。最后，几枚导弹准确的飞入乳腺深处，爆炸后剧烈的性刺激让销售员小姐一不小心喷出了不少乳汁，反而给它们自己造成了更大的损失，它们用自己的行动证明了它们急需我们的保护。\n\n最终，按照工作手册造成了固定比例的人口死亡和城市毁灭后，我们的销售员小姐停止了破坏，并开始向幸存的小人们介绍公司乳压险的保险范围和收费标准。\n\n在充分理解了巨娘乳压星球的破坏性后，当地的行政主官俐落地和我们签署了乳压险契约。
  gts_ultra_company.1005.desc: "We successfully closed a deal with §Y[from.GetName]§!.\\n\\nThe sales lady unbuttoned her shirt, releasing her massive breasts. She removed her bra, discarded it, and lowered her body, gently crushing the northern hemisphere of this world with her southern hemisphere. Countless regions were flattened, and lucky few were sucked into her nipples to start a new life inside.\\n\\nTheir defenses failed. Regular weapons did nothing. Missiles flying into her milk ducts only caused intense sexual stimulation, making her spray milk and causing more damage. They proved they needed our protection.\\n\\nShe pitched the Breast Press Insurance. The administrator signed immediately."
