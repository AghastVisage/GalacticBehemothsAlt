  gts_ultra_company.1015.desc: "We successfully closed a deal with §Y[from.GetName]§!.\n\nThe sales lady aimed her butt at a city junction. Her anus twitched, the sky rumbled, and she evacuated her bowels. Mountains of foul feces buried the transport hub completely. Seeing the devastation, the administrator signed the Feces Insurance contract."
  gts_ultra_company.1016.desc: "A Giantess from [branch_office_owner.GetName] attacked §Y[root.GetName]§!\n\nShe exposed her lower body over our city. A smooth, hard brown column emerged, crushing everything and spreading a stench. Small folk fell to the smell. The planet is severely polluted, and survivors will live in her waste for years.\n\nOur attacks stimulated her to spray diarrhea, drowning our army. We don't even know if she noticed us.\n\nShe stopped to sell Filth Insurance. We signed to stop the 'demonstration'."
  # §r“那个，我期望大家可以尝试一下我们公司的舔舐险，我们会负责任的保护大家，如果觉得贵的话，我会替大家降降价的。”§!\n\n虽然少女说的很温柔，但是十万倍大小的少女哪怕选择一片汪洋落下，在少女足底落地的瞬间海洋也被少女的巨大的嫩足排开，如同摩西分海的奇迹就因少女落地而出现，在巨大的冲击力下地壳像蛋壳一样裂开，只有少量的海水来得及流入裂缝，更多的是被少女冲击力化作巨浪向四周城市翻涌而去。\n\n海边的小人只看到滔天巨浪袭来，千米之高的巨浪就算做了再多准备都抵挡不住，一个浪尖拍下一个街区就被巨浪恐怖的质量拍碎，哪怕躲过浪尖日行千里的巨浪用它的速度就可以把低矮的楼房直接整个击碎，有些躲在城市最高楼的小人希望那和浪尖等高的高楼可以阻挡汹涌的潮水，却绝望的看见楼房上层被巨浪用蛮力扯下，巨浪在底层分流在漩涡之中的高楼大厦就如同被少女的指尖戏弄，伴随着钢筋咯吱咯吱的声音，大楼慢慢被扭成麻花连地基都被冲击力拉扯而出向着海面倾斜，不过等着小人被第二浪拍碎之前扭曲的墙壁就把小人挤成果酱，少数能活着看到海面接近的已经是少之又少，但最后也逃离不了刚刚没入水流就被水压搓碎，甚至被海洋里的残骸切成碎块。\n\n§r“搞砸了！怎么办！怎么办！”§!\n\n看着因为自己到来而导致的大屠杀，少女急的掉下了眼泪，下意识的踱步，每踩下一次都化作新的浪潮把小人拍碎，但着急的少女并没有发现，如果发现了恐怕又要多一个月都要偷偷掉眼泪了。\n\n§r“有了，失礼了，请大家看着，舔舐险就是为了应对这样的情况哦。请都市里的大家赶快向城市外边逃跑。”§!\n\n少女因为心急没有给那些小人逃跑的时间，直接向着海浪的最强方快步走了过去，那些在海面上好不容易找到漂流物的小人，突然看到少女脚底投影在天空之上，下一刻和浪潮里的废墟一起被埋到了千米之下，少女每一次踏步都是对小人的二次打击，明明没有这个心思，但少女的体型却把每次行动化作屠杀，如果这样的少女真的动起手来，人类真的能存活一个小时嘛？每个还活着的人都产生这样的疑问。\n\n§r“唔，底下的小人对不起，不过为了减少客户的损失，我要在这里制造隔离带，征用一下这块地哦，就算大家死了，我之后也会免费为大家复活的！失礼了!”§!\n\n看着在后方的浪潮为了减少小人损失的少女，在心里说着对不起的同时，猛地趴下虽然大部分身体有意的躺在浪潮里，但是十六万米的身高还是顺带碾碎了几个城市，把尚在海里挣扎或者还安然无事的小人一起碾成了底下的褐土。
