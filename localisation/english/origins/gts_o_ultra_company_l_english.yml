  # 我们近期成功完成了一笔与§Y[from.GetName]§!的保险大单。\n\n穿着西服、包臀裙和黑丝裤袜的销售员小姐登陆到小人的行星首府附近，在简单的问好和自我介绍后开始了向客户展示巨娘舔舐的威力。\n\n销售员小姐跪下身子，为了力求最佳的演示效果趴在人最多的城区附近，用手撩起一侧长发，吐出舌头伸向行星首府的商业中心。几乎没感到什么阻力，就像舔掉蛋糕上的巧克力碎屑一般将大片水泥城市和下方数十米的岩层吞入口腔中，再让它们顺着唾液流入胃袋或齿缝中。\n\n似乎是为了验证我们宣称的情形是否属实，小人们使用了他们的星球防御武器对销售员小姐进行攻击。不过很快，它们的战机被舌尖掀起的尘土击落，而装甲防线被顺着舌头滴下的唾液洪流冲垮，它们用自己的行动证明了它们急需我们的保护。\n\n最终，按照工作手册造成了固定比例的人口死亡和城市毁灭后，我们的销售员小姐停止了破坏，并开始向幸存的小人们介绍公司舌舐险的保险范围和收费标准。\n\n在充分理解了巨娘舔舐星球的破坏性后，当地的行政主官麻利地和我们签署了舌舐险合同。
