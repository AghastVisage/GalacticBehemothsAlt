  gts_ultra_company.3001.desc: "Unfortunately, this civilization rejected our insurance services. Therefore, we dispatched two Giantesses of different sizes to [target.capital_scope.GetName], allowing them to personally demonstrate to the dust-like creatures on that planet the oppressive force brought by a Giantess's small accessories.\n\nIn the first demonstration, a Giantess standing tens of thousands of meters tall took off the high heels on her feet and the panties from her body, tossing them onto the surface of this planet. Those massive panties, like a dark cloud blotting out the sun, completely enveloped the largest city on [target.capital_scope.GetName] in their shadow. The residual sweat and bodily fluids mixed on the panties produced a suffocatingly rich odor, causing millions of [target.GetSpeciesAdj] to lose consciousness on the spot. Immediately after, the enormous high heel plummeted from the sky, directly crushing another city into a bottomless crater and triggering violent global earthquakes.\n\nThe inhabitants of [target.capital_scope.GetName] finally realized their insignificance, but for us, the demonstration had only just begun. Having witnessed that small accessories casually discarded by a Giantess could inflict such horrific destruction, the [target.GetSpeciesAdj] who survived were plunged into deep despair; their civilization was as fragile before a Giantess as a toy in a child's hands. And this was merely the beginning—an even more terrifying catastrophe awaited them..."
