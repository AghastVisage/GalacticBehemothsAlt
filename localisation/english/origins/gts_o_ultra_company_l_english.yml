  # 保险条约国
  preset_ultracompany: "Insurance Treaty State"
  # 保险条约国是一种天体级巨娘公司特有的附属国类型，有责任接受宗主国的保护和蹂躏。
  preset_ultracompany_desc: "Insurance Treaty State is a subject type unique to Celestial Giantess Companies, responsible for accepting protection and ravaging from the suzerain."
  # 这个附属国是天体级巨娘公司的客户。当遭受巨大娘入侵时，公司会立刻派出工作人员驱赶她们。并且还会对她们造成的破坏进行赔偿，无论是巨大娘造成的任何损失，都能进行修复和赔偿。
  preset_ultracompany_flavor_desc: "This subject is a client of the Celestial Giantess Company. When invaded by Giantesses, the company will immediately dispatch staff to drive them away. And will compensate for damage caused, repairing and compensating for any loss caused by Giantesses."
