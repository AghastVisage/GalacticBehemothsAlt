  # 刚跃迁到[event_target:gts_ultra_company_target.GetName]的艾普露产生了一种不真实感，平时厚实宽阔的大地，此时就像是一颗棒球一般漂浮在自己胸前。\n\n“难得能用这种视角看到这样一整颗星球，难怪行星级们这么喜欢玩弄星球。”好奇的艾普露上下打量着[event_target:gts_ultra_company_target.GetName]。\n\n此时，[event_target:gts_ultra_company_target.GetName]上的小人们仍然寄希望于军队，地面的陆军向着太空外的艾普露发起了猛烈的攻击，各种高科技飞弹纷纷向着艾普露的眼睛飞去。“嗯？这是在打我？连高大级都制服不了还想攻击天体级？看来真的是愚蠢到需要保护了”艾普露没收到任何影响，自顾自的脱下胸前的罩子，巧克力般的细腻皮肤便完全裸露了出来，庞大的乳房像两颗行星般在[event_target:gts_ultra_company_target.GetName]前轻轻晃动着，而乳头上也流出了些许奶液。\n\n艾普露将粉嫩的乳头轻轻蹭上[event_target:gts_ultra_company_target.GetName]，奶液和蹭出的土石混杂在一起，轻轻的粘在乳头上。§H“黏糊糊又痒痒的，小人的城市弄得我好痒，好痒啊。”§!艾普露捏住两团乳肉相互揉搓起来，一边揉捏着一边轻轻刺激挺立的乳头。\n\n没过一会，面红耳赤的艾普露就坚持不住了，乳头中喷出打量香喷喷的乳汁，就像是一条银河一般滑过了[event_target:gts_ultra_company_target.GetName]，而随着星球吸引力的作用，流过的乳汁纷纷砸向了地球，粗壮的建筑被从天而降的乳汁浪潮拍的粉碎，城市中大大小小的汽车被卷走，小人们的血肉和建筑，一起混在了艾普露温热粘稠的乳汁当中，随着乳汁越来越多的侵入[event_target:gts_ultra_company_target.GetName]中，整个星球的降水系统和地址结构也随之开始崩溃，不论哪一处水源，都已经被艾普露的奶水所占领，大气中也只剩下了艾普露溢出的爱意，整个星球99%的生命都因为艾普露一次泌乳而灭绝，上千万年的生命之树在此凋零。
  gts_ultra_company.2021.desc: "April warped in. The planet floated before her chest like a baseball. \n\nArmy attacked her eyes. \"Like this?\" She removed her bra. Massive breasts swayed. She rubbed her nipples on the planet. Soil stuck to them. \n\n§H\"Sticky and ticklish.\"§! She kneaded her breasts. She sprayed milk, washing away cities and destroying the ecosystem. 99% of life died."
  # 不过这关小黑猫什么事呢？\n\n§H“脆弱的小星球，成为KD的一部分吧！”§!\n\n只见她抓起这颗被蹂躏的面目全非的星球，塞进了两只巨型乳房之中，在轻轻用力积压下[event_target:gts_ultra_company_target.GetName]一点点的裂开，地表的板块就像油炸的酥皮一样一块块的脱落，地下的岩浆从其中漫延在艾普露的身上，和那些温热的奶液共同飘向银河。当双乳一点点的合拢时，整颗星球，不那颗星球已经不存在了，他只是艾普露的有一个恶作剧目标而已——而且还没能让自己尽兴，贪食的小猫便默默紫薇了起来...\n\n那些土石的碎片，或许会混合着乳汁和粘液，再次行程一个更大更美好的乳汁星球？不过那些与我们无关了，保险的协议得到执行，这就够了。
