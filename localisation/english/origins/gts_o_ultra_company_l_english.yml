  gts_ultra_company.2013.c: "Let Qianhai try."
  # 销售员小姐脱下了脚上的高跟鞋，轻轻的踩在松软的土地上，巨大的双足如同一座山脉一般矗立在[event_target:gts_ultra_company_target.GetName]的首府旁，黑丝间积攒的气味在微风的作用下一点点的飘入城市之中。\n\n§H“退保是不对的哦，巨娘可是很危险的，她们的大脚威力可是很大的。”§!\n\n一边说着，销售员小姐一边抬起脚来，巨大的丝足瞬间遮蔽了日光，整个城市像是一下子进入了黑夜一样。\n\n黑丝下的土块纷纷落入城市当中，小人们都惊恐的看着空中的巨物，而销售员小姐也不着急踩下来，只是不断的搓动着脚趾，恐吓着那些小人。即使小人们动用军队进行炮击，那些弹药也没法对她造成任何伤害，整座城市都陷入了混乱。\n\n§H“诶呀，你们的勇气呢？不是不需要我们的保险嘛，连一只脚都没法打败，甚至连这么一层薄薄的黑丝都打不破，怎么会这么自信呢？”§!\n\n随着玉足的一点点落下，城市中的一切都彻底崩溃，不论是那些高楼大厦，还是一架架起飞的飞机，或是拥挤在防空洞里的人群，都在销售员小姐一次轻轻的落足中被毁灭....\n\n§H“呐，不对不对，只是稍微吓唬一下...”§!是的，只是吓唬一下，在脑中想象了毁灭场景的销售员小姐提醒了下自己。于是乎，原本应当碾碎一切的巨足轻轻偏去，让一半的城市都得以幸存下来。\n\n§H“现在应该知道你们的危险了吧？”§!
