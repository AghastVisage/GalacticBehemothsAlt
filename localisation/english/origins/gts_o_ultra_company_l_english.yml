  # 附加险
  ultracompany_3_insurance: "Additional Insurance"
  # 允许附庸国使用行星决议：§Y$decision_ultracompany_repair$§!\n使星球破坏度清零并清除星球上的地形障碍。
  ultracompany_3_insurance_desc: "Allows subject to use Planetary Decision: §Y$decision_ultracompany_repair$§!\nResets planet devastation and clears blockers."
  # 附加险
  decision_ultracompany_repair: "Additional Insurance"
  # 购买保险公司最温柔的天体级巨娘服务，使星球恢复如初并清除所有障碍。
  decision_ultracompany_repair_desc: "Purchase the gentlest Celestial Giantess service from the company to restore the planet and clear all obstacles."
  # 强制缔约
  war_goal_wg_ultracompany_subjugate: "Forceful Contracting"
  # 发动战争，使对方认识到签订巨娘保险合约的必要性。\n\n若是通过“维持现状”结束战争的话，我们所占据的恒星系将会被释放为新的保险合约国，前提是该附庸国被释放后必须拥有至少一个行星。
  war_goal_wg_ultracompany_subjugate_desc: "Wage war to make the opponent realize the necessity of signing a Giantess Insurance contract.\n\nEnding the war with a 'Status Quo' will result in occupied systems being released as a new Insurance Treaty State, provided they have at least one planet."
  # 驱逐企业
  war_goal_wg_ultracompany_expel: "Expel Corp"
  # 发动战争的目的是为了关闭那些大公司在其他客户星球上的分部，好给我们的业务腾出位置。
  war_goal_wg_ultracompany_expel_desc: "Wage war to close the branch offices of those large corporations on client planets, making room for our business."
  # 征收
  casus_belli_cb_ultracompany_expel: "Expropriation"
  # 巨娘保险销售员
  job_gts_ultra_sale: "Giantess Insurance Salesperson"
  # 巨娘保险销售员
  job_gts_ultra_sale_plural: "Giantess Insurance Salespeople"
  # 向那些蝼蚁般的文明推销巨娘保险是个苦差事，小人们往往听不进去你的真诚宣传，还会对你进行徒劳的攻击。因此，先用自己的身体消灭相当一部分的小人，让它们亲自感受巨娘袭击的恐怖后，再向幸存者推销对应险种已经成为了业界标准流程\n\n该岗位仅限§Y天体级生物§!特质的人口就职
  job_gts_ultra_sale_desc: "Selling Giantess insurance to ant-like civilizations is a tough job. Small folk often ignore your sincere pitch and launch futile attacks. Therefore, it has become industry standard to use one's body to eliminate a significant portion of them, letting them personally experience the terror of a Giantess attack before selling insurance to the survivors.\n\nThis job is limited to pops with the §YCelestial Biological§! trait."
  # $job_gts_ultra_sale$崗位
  #  $job_gts_ultra_sale$岗位
#  $job_gts_ultra_sale$岗位
  mod_job_gts_ultra_sale_add: "$job_gts_ultra_sale$ Job"
  job_gts_ultra_sale_assistant: "Sales Assistant"
  # 巨娘保险销售员助理
  job_gts_ultra_sale_assistant_plural: "Sales Assistants"
  # 作为巨娘保险销售员的助手，助理们负责协助销售员小姐完成各类保险推销、客户资料整理、现场灾害评估以及善后服务等工作。虽然她们的体型远不及销售员小姐那般压倒性，但在小人文明眼中依然是无法抗衡的存在。助理们通常会在销售员小姐进行"展示"时负责记录损失、安抚幸存者，并协助推动保险签约流程。若表现不佳，也有可能被公司缩小处罚，成为销售员小姐的随身玩具或消耗品\n\n该岗位仅限§Y正常§!以上特质的人口就职，§Y高大§!及以上特质的人口会有更高的就职权重
  job_gts_ultra_sale_assistant_desc: "As assistants to the sales ladies, they handle various tasks promoting insurance, organizing client data, on-site disaster assessment, and aftermath services. Although not as overwhelmingly massive as the sales ladies, they are still irresistible to small folk civilizations. Assistants usually record losses, comfort survivors, and facilitate the signing process during 'demonstrations'. Poor performance may result in company punishment: §Rshrinking§! to become a toy or consumable.\n\nLimited to pops with §YNormal§! or larger traits; §YTall§! and above have higher weight."
  # $job_gts_ultra_sale_assistant$崗位
  #  $job_gts_ultra_sale_assistant$岗位
#  $job_gts_ultra_sale_assistant$岗位
  mod_job_gts_ultra_sale_assistant_add: "$job_gts_ultra_sale_assistant$ Job"
  job_gts_ultra_sale2: "Slacking Salesperson"
  # 正在摸鱼的巨娘保险销售员
  job_gts_ultra_sale2_plural: "Slacking Salespeople"
  # 无须担心你的员工在摆烂吃干饭，这些没有达到业绩的保险销售员很快就会被公司按契约条款§R缩小§!成微生物。运气好的话，她们曾经的同事会为她们提供庇护....或是做为玩具...
  job_gts_ultra_sale2_desc: "Don't worry about employees freeloading. Salespeople who miss their targets will soon be §Rshrunk§! to microbes according to their contract. With luck, former colleagues might shelter them... or use them as toys..."
  # 【保险项目】粘稠的唾液湖
  building_gts_ultra_insurance_tongue: "[Insurance Item] Sticky Saliva Lake"
  # 销售员小姐向客户展示巨娘舔舐的威力后留下来的矩形盆地。盆地底部的粘稠湖泊散发着食糜和牙膏的味道。曾经的地形地貌已不可考，经过抗消化处理的打捞船偶尔能从湖水中打捞出利维坦残躯和舰船碎片。
  building_gts_ultra_insurance_tongue_desc: "A rectangular basin left after the sales lady demonstrated the power of a Giantess's lick. The sticky lake at the bottom smells of chyme and toothpaste. The original terrain is unrecognizable. Resistant salvage ships occasionally retrieve leviathan carcasses and ship debris from the lake."
  # 【保险项目】舌痕河床
  building_gts_ultra_insurance_tongue2: "[Insurance Item] Tongue Mark Riverbed"
  # 被少女舌尖割裂的大地，最深处被甚至能看到滚烫的岩浆，最宽处只能模糊的看着对岸，看着少女美丽的舌痕烙印在崖壁之上。
  building_gts_ultra_insurance_tongue2_desc: "The earth torn by the tip of a maiden's tongue. At its deepest, magma is visible; at its widest, the opposite bank is a blur. The beautiful tongue mark is branded onto the cliffs."
  # 【保险项目】足汗蒸腾的丝袜
  building_gts_ultra_insurance_foot: "[Insurance Item] Steaming Sweaty Stocking"
  # 销售员小姐为了向客户展示巨娘足底力量而随手丢在一旁的丝袜。销售员小姐为了顺利完成这次签约日夜加班调研而变得汗津津的丝袜现在将其笼罩下的城市尽数抹去，而那些侥幸在丝袜中幸存的城区逐渐成为了当地人收集和走私巨娘体液的法外之地.
  building_gts_ultra_insurance_foot_desc: "A stocking discarded by the sales lady to demonstrate foot power. Sweaty from overtime work, it has wiped out the cities underneath. Survivors living in the stocking now collect and smuggle Giantess fluids in this lawless zone."
  # 【保险项目】带着乳汁的胸罩
  building_gts_ultra_insurance_breast: "[Insurance Item] Milky Bra"
