  gts_ultra_company.2014.desc: "The saleswoman took off the high heels on her feet and gently stepped onto the soft ground. Her colossal feet stood like a mountain range beside the capital of [event_target:gts_ultra_company_target.GetName]. The scent accumulated in her black silk stockings drifted into the city with the breeze, causing a commotion among the tinies. Soon, the tinies' armed forces arrived at the scene and fired in panic at her jade-like feet. However, these negligible attacks were quickly noticed by the saleswoman. With a soft chuckle, her gigantic foot stomped heavily onto the earth.\n\nAccompanied by the trembling of the ground, a powerful shockwave tore through the terrain, and that immense sole crushed several city blocks along with their residents into paste. The entire continent shook violently under this terrifying strike. The surviving tinies knelt on the ground; before the absolute might of the Giantess, they finally recognized their insignificance. Ah, it seems they are sensible after all—if they had just done this earlier, none of this would have happened."
  gts_ultra_company.2014.a: "Great persuasion."
  # [branch_office_owner.GetName]对于我们的退保行为做出了回应，一名巨娘再次出现在了§Y[root.GetName]§!的首府，不过这一次她的身形要更加巨大。\n\n当她脱下高跟鞋后，浓郁的酸臭味就飘入了城市，整个城市的大气都变得刺鼻难闻。我们的军队及时赶到现场，用了我们所能找到的最大威力的火炮攻击，不过收效甚微，就像买保险时所说的那样——我们的攻击对于巨娘来说就只是小孩的过家家，我们甚至没能打烂她脚上的丝袜。\n\n不知是出于什么样的心理，她故意踩偏，将我们的军营，避难所和经济区全部碾入地底....
  gts_ultra_company.2015.desc: "A larger Giantess appeared. The foot stench was suffocating. Our artillery failed. We couldn't even tear her stocking. She deliberately stepped on our shelters..."
  # 我们会补上保险费的！
  gts_ultra_company.2015.a: "We will pay!"
  # 千海的推销技巧
  gts_ultra_company.2016.name: "Qianhai's Pitch"
  # 千海无聊的躺在沙发上，明明是休息时间自己却找不到乐趣，作为一只魅魔——而且是正在发情的魅魔，什么都玩不到可太令人不爽了。正当千海在沙发上左右打滚时，几声信件送达的滴滴声突然从身边响起。\n\n§r“鉴于[event_target:gts_ultra_company_target.GetName]上的抗保行为违反了合同，我们将星球的处理权交给你，请用双足给与这些小人惩罚.....”§!\n\n千海一字一句阅读着这封有趣的信件，嘴角不自觉的滴下几滴口水。\n\n§r“这么说来，我怎么玩都没关系咯？难得的好事啊。”§!千海一边想象着，一边穿起了轻薄的白丝，向着自己的小玩具处出发。\n\n§r“这里就是不听话的小星球了吧，那么..该开始工作了”§!\n\n少女褪去了多余的布料，身上只留下了一层若隐若现的轻纱，雪白的纱掩盖着红润的皮肤，只有些许专属于魅魔的气息从中流出，被这颗小星球慢慢的吸收。\n\n不同于衣着下若隐若现的朦胧感，千海的私处保留了魅魔的特有风格——开放式，紧致淫乱的私处能够被一览无遗，无论是光滑整洁的阴唇，还是红红的阴蒂，或是一点点流出爱液的蜜穴，都直接的暴露在人的面前，像宣告自己魅魔的身份一般。同样的，从千海的神态和她抚摸自己私处的小手来看，她或许十分的需要发泄一些自己了，即使是把整颗星球用于紫薇...\n\n§r“该先用哪里玩一玩呢？”§!\n\n[event_target:gts_ultra_company_target.GetName]上，小人们纷纷注视着这天外来客，虽然先前已经收到了保险公司的警告，但真当千海上下打量起这颗小小的星球后，小人们才真正意识到自己的渺小。或许到了这时，小人们会后悔与自己的毁约？不过现在后悔已经来不及了，千海已经用双足包裹住了这颗小小的星球，随着白色的巨型山峰落地，大地被撞得四分五裂，岩浆喷涌，大气层在两座超大山峰的作用下被扯得稀碎，小人们赖以生存的空气也纷纷被恶臭的气味所取代，两座最高山峰随意的躺在星球上，不断的散发出闷热的臭气和含着信息素的水蒸气，整个星球的生态，仅仅是在千海的第一轮攻势下，就被完全瓦解了。\n\n§r“小星球还是这么软，松松的泥土和可怜的小人，这脚感真棒啊”。§!\n\n白色的山脉感受着身下的大地，几座附属的小山也相互搓了搓，感受着身下美妙的质地。小山们贪婪的挪动着，将触碰到的一切都碾作齑粉，没有什么能阻挡他们，那些古老的山脉不行，那些小人的破烂科技更不行。似乎是熟悉了这颗星球的硬度，千海一点点的搓动着脚下的星球，白丝在脏兮兮的土球上蹭来蹭去，脏兮兮的土和臭烘烘的汗混合在了一起，原本看起来洁白如雪的白丝，已经变得不成样子。
