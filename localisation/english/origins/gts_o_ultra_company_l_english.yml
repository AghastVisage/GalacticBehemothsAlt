  gts_ultra_company.1001.desc: "We have successfully closed a massive insurance deal with §Y[from.GetName]§!.\\n\\nThe sales lady, dressed in a suit, pencil skirt, and black tights, landed near the tinies' planetary capital. After a simple greeting and introduction, she began demonstrating the power of a Giantess Lick.\\n\\nShe knelt, posing for optimal effect near the most populous city districts, brushed her hair aside, and extended her tongue towards the commercial center. Feeling almost no resistance, she swallowed vast swathes of concrete jungle and the rock layers beneath like chocolate sprinkles on a cake. \\n\\nAs if to verify our claims, the tinies attacked with their planetary defense weapons. But soon, their fighters were swatted by dust from her tongue tip, and their armored lines washed away by saliva floods. They proved by their actions that they urgently needed our protection.\\n\\nFinally, after causing the mandated percentage of casualties and destruction, she stopped and introduced the coverage and fees of the Tongue Lick Insurance to the survivors.\\n\\nFully understanding the destructive power of a Giantess lick, the local administrator promptly signed the contract."
  gts_ultra_company.1001.a: "Excellent!"
  # [root.GetName]遇袭！
  gts_ultra_company.1002.name: "[root.GetName] Attacked!"
  # [branch_office_owner.GetName]的巨大娘袭击了我们的§Y[root.GetName]§!殖民地！\n\n她突然降临到我们的行星首府附近，先是用鞋底瞬间碾碎了数座大楼，随后趴下身子，伸出舌头吞噬起我们的城市，这次袭击让我们最大的贸易中心变成了一片唾液湖。\n\n尽管我们的武装部队立刻反应过来，对那位巨娘发起反击，然而悬殊的体型差让我们的空军还没来得及投弹就被她的无意识动作摧毁，我们甚至不确定她是否真的意识到我们在攻击她。之后我们还尝试调动行星轨道上的恒星际导弹进行轰击，然而导弹在飞进她口腔爆炸的瞬间就被唾液熄灭了。\n\n数小时后，她终于停下了可怖的破坏行为，然后开始向幸存的公民介绍起她们公司的舌舐险。她几乎毁掉了我们整个星球，就为了推销一份保险？！\n\n为了避免她继续拿我们的城市进行“展示”，当地的行政主官赶紧签署了她们想要的商业条约。
  gts_ultra_company.1002.desc: "A Giantess from [branch_office_owner.GetName] attacked our §Y[root.GetName]§! colony!\n\nShe descended near our capital, crushing skyscrapers with her soles, then knelt and began devouring our cities with her tongue, turning our trade center into a saliva lake.\n\nOur armed forces retaliated, but the size difference was too vast. Our air force was destroyed by her unconscious movements before they could drop bombs. We tried orbital missiles, but they were extinguished by saliva the moment they entered her mouth.\n\nHours later, she stopped and pitched their Tongue Lick Insurance to the survivors. She destroyed our planet just to sell insurance?!\n\nTo prevent further 'demonstrations', the administrator hastily signed the treaty."
  # 她们非要用这种方法推销吗？
  gts_ultra_company.1002.a: "Is this aggressive marketing necessary?"
  # 我们近期成功完成了一笔与§Y[from.GetName]§!的保险大单。\n\n穿着西服、包臀裙和黑丝裤袜的销售员小姐登陆到小人的行星首府附近，在简单的问好和自我介绍后开始了向客户展示巨娘足踏的威力。\n\n销售员小姐脱下鞋子，长途跋涉而异常闷热的脚底终于能凉快一些。她将鞋子放倒在城市边缘—展示鞋子的压迫感也是宣传工作的一部分。然后高高抬起黑丝玉足，向着一处城市的中心广场踩了下去。合金混凝土塑成的建筑化作黏在袜底汗液上的碎石，只给销售员小姐带来一丝触电般的酥麻感。在摧毁了几座城市后，销售员小姐脱下黑丝丢到一边，用裸足继续向小人证明，无论穿着什么，巨娘带来的灾难都是同样可怕的。\n\n似乎是为了验证我们宣称的情形是否属实，小人们使用了他们的星球防御武器对销售员小姐进行攻击。不过很快，它们的军队就和它们保护的城市一起变成了趾缝间的污垢，它们用自己的行动证明了它们急需我们的保护。\n\n最终，按照工作手册造成了固定比例的人口死亡和城市毁灭后，我们的销售员小姐停止了破坏，并开始向幸存的小人们介绍公司足踏险的保险范围和收费标准。\n\n在充分理解了巨娘踩踏星球的破坏性后，当地的行政主官麻利地和我们签署了足踏险合同。
