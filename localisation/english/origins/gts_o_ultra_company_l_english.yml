  gts_ultra_company.2004.desc: "The lazy hunter Skadi received a mission.\n\n§Y\"Deal with a few ocean planets. Requires an expert hunter.\"§!\n\nShe remembered her past. Hunting in deep sea cities. Dealing with the Company. Convincing old employers to renew.\n\n§B\"That was a unique sensation,\"§! she thought, touching her abdomen. The itch made her excited."
  gts_ultra_company.2005.desc: "Far away, §Y[event_target:gts_ultra_company_target.GetName]§! celebrated cancelling the insurance. Suddenly, a whale song echoed in space.\n\n§B\"Cancelling triggers insurance conditions, didn't you know?\"§!\n\nThe Orca maiden arrived. She held the planet, her high heels becoming new planets in the system. She reached for the moon with her feet.\n\n§B\"You bought Lair Fluid Insurance... but since you cancelled, I can do whatever I want, right?\"§!"
  # 说罢，斯卡蒂还是撤回了脚底。可怜的星球，其实并不需要他太多的关注。再且，只是用自己双脚消灭这颗星球的话，对她来说或许也太无趣了。太阳消失在了斯卡蒂的身后，而腥臭的味道占领了整个世界。穴肉碰撞的声音在大陆上回响，整个宇宙都成为了他们的敌人。而他们的攻击手段，却没几个真正能摸到斯卡蒂那无法被小人察觉的阴唇。一滴穴液从外阴的边缘落下，伤亡率就已经超过了公司的要求。但她不在乎，她还保留着深海猎人时的习气。甚至连遗言的时间都没给小人准备，即使是小人们再次重新要求续保，但一切都消失在了她的阴唇之中，虚空中的巨口，将那颗小小的星球一点点的接管。满载百亿人民的大陆，被那暗粉色的嫩肉轻易的拍碎。而原本的海洋，也化作了斯卡蒂爱液的一部分。最终，完全化成粉尘的小人星球，再被她的爱液所彻底冲洗粉碎。几乎就像斯卡蒂毁灭的每个星球一样，再也没有留下些什么。
  gts_ultra_company.2006.desc: "Skadi withdrew her feet. Destroying it with feet was boring. The sun disappeared behind her. The stench occupied the world. Flesh sounds echoed. Their attacks couldn't touch her labia. A drop of fluid caused massive casualties. She didn't care. She didn't give them time for last words. Everything disappeared into her labia. The void mouth took over. The continent was crushed by pink flesh. The ocean became her fluid. The planet turned to dust and was washed away. Nothing remained."
