  # 慵懒的猎人躺在自己的沙发上，这时，一条消息打断了她的清梦。\n\n§Y斯卡蒂女士，您有一条新任务§!\n\n仰卧在沙发上的斯卡蒂换了换脚，无聊的点开了邮箱里的任务。\n\n§Y处理几个有着大海的星球，需要最精湛的猎人§!\n\n斯卡蒂想到了什么。那是她曾独自一人躺在珊瑚旁的想象。作为猎人的自己，最初不过是来往深海城市和表层，去猎杀那些海嗣。但当年的自己遇到了公司。自己的第一个任务，甚至是说服那些自己曾经的老东家们续保。\n\n§B那是一种很奇特的脚感§!，斯卡蒂这样想着，往下阅读着报告。毕竟，在那些原本伪善的老东家尽一切努力抵抗自己后，自己甚至是更加愉悦的，用足底笼罩了那海底的城市。§B海洋星球的穴液险吗……§!斯卡蒂想了想，摸了摸自己的小腹——她当年也是这么做的。甚至，那下体的瘙痒甚至让斯卡蒂更加的兴奋了起来。
