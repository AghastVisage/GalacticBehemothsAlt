  gts_ultra_company.4010.desc: "The salesperson in charge of §Y[event_target:gts_bruh_get_insurance_planet.GetName]§! this quarter is somewhat special; she is a futa Giantess. Taciturn, she swings the silver spoon cleanly and neatly, uprooting a continent on the planet along with all its population, rudely shoving them into anti-gravity containers to complete the premium collection. Subsequently, she unbuckles her belt expressionlessly, and a magnificent penis like a Babel tower pops out, hideous blood vessels wrapped around the shaft like coiled dragons, emitting scorching temperature and a musky smell. Without wasting words, she grasps this giant object capable of piercing a planetary body with one hand and begins to stroke it rapidly above the planet. Every upward and downward slide of her palm brings gravitational oscillations to the surrounding space; the giant glans becomes engorged and swollen with friction, and the transparent pre-ejaculate oozing from the urethral opening falls like a meteor shower, each drop enough to submerge a mid-sized city. With a low growl from her throat, the long-accumulated moment of eruption arrives. A thick, white, scalding torrent of semen shoots out from the urethral opening, hitting the planet's surface with all-destroying kinetic energy. This white tsunami instantly covers the entire continent, the viscous fluid filling all low-lying areas and sealing the cities in white colloid. The volume of semen is staggering, even changing the planet's rotational center of gravity. The air is filled with a strong spermatic scent, making all survivors feel suffocated and dizzy. \\\"This is Semen Insurance,\\\" she shakes off the fluid remaining on her penis, a few remaining drops once again triggering several localized floods. \\\"If you don't want to be submerged by my seeds, pay up honestly. Otherwise, next time I'll shoot directly into the core.\\\" She refastens her belt and turns away indifferently. According to statistics, the population successfully placed into containers as premiums in this operation was §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!, while the total number of accidental deaths during the uprooting and demonstration process reached §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!."
  gts_ultra_company.4010.a: "\"These are the seeds of life...\""
