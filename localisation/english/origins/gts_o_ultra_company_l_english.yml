  gts_ultra_company.3002.desc: "Our personnel were quickly in position, and the second demonstration for [target.capital_scope.GetName] was ready. After the 10,000-meter-tall Giantess on [target.capital_scope.GetName] withdrew, another Giantess whose size reached hundreds of millions of meters—far exceeding that of a planet—appeared in orbit around [target.capital_scope.GetName]. She did not even need to personally descend upon the world; she merely took off a shoe and suspended it above the atmosphere of [target.capital_scope.GetName]. The colossal shadow cast by that shoe instantly plunged the entire planet into eternal darkness.\n\nThe terrifying heat and pungent foot odor emanating from the sole alone devastated the planet's ecosystem as it penetrated the atmosphere. The Giantess seemed to find it amusing; using a toe even larger than planetary mountain ranges, she playfully scraped the surface of the planet a few times. Each seemingly casual touch triggered global tectonic fractures and tsunamis tens of thousands of meters high. Cities turned to dust under the crushing force, the crust fractured like an eggshell beneath her toe, and hundreds of millions of [target.GetSpeciesAdj] were wiped out in despair.\n\nFinally, satisfied, the Giantess withdrew her toe and put her shoe back on, leaving the star system as if she had merely kicked away an insignificant pebble by the roadside. Behind her, the once-bustling [target.capital_scope.GetName] was reduced to a lifeless wasteland; the planet's surface was ripped apart by crisscrossing chasms, reeking of a scorched scent mixed with foot sweat. All traces of civilization were completely erased in this destructive demonstration, leaving only desolate geological ruins in space silently recounting the horrific catastrophe that had befell the planet."
  gts_ultra_company.3002.a: "Does [target.GetName] wish to buy now?"
  # [target.GetName]成为我们的新客户！
  gts_ultra_company.3003.name: "[target.GetName] is a New Client!"
  # 当然，由于[target.capital_scope.GetName]的生命已经所剩无几，侥幸活下来的[target.GetSpeciesAdj]也已经在巨娘庞大的身躯下彻底崩溃，沦为了只能依靠巨娘的足汗才能够存活的寄生微生物，因此已经不再具有购买我们的保险业务的条件。\n\n因此，我们最终还是怜悯地稍微恢复了那颗星球的生态系统，重新留下了一些在巨娘的体液海洋里保留了些许神志的[target.GetSpeciesAdj]个体之后撤离了那里。同时，由于第二次演示中那位巨娘并未按照要求演示§Y巨娘随身物品险§!，而是演示了我们的另一个险种§Y巨娘足汗险§!，因此我们也对她作出了一些惩罚。
  #  当然，由于[target.capital_scope.GetName]的生命已经所剩无几，侥幸活下来的[target.GetSpeciesAdj]也已经在巨娘庞大的身躯下彻底崩溃，沦为了只能依靠巨娘的足汗才能够存活的寄生微生物，因此已经不再具有购买我们的保险业务的条件。\n\n因此，我们最终还是怜悯地稍微恢复了那颗星球的生态系统，重新留下了一些在巨娘的体液海洋里保留了些许神志的[target.GetSpeciesAdj]个体之后撤离了那里。同时，由于第二次示范中那位巨娘并未按照要求示范§Y巨娘随身物品险§!，而是示范了我们的另一个险种§Y巨娘足汗险§!，因此我们也对她作出了一些惩罚。
#  当然，由于[target.capital_scope.GetName]的生命已经所剩无几，侥幸活下来的[target.GetSpeciesAdj]也已经在巨娘庞大的身躯下彻底崩溃，沦为了只能依靠巨娘的足汗才能够存活的寄生微生物，因此已经不再具有购买我们的保险业务的条件。\n\n因此，我们最终还是怜悯地稍微恢复了那颗星球的生态系统，重新留下了一些在巨娘的体液海洋里保留了些许神志的[target.GetSpeciesAdj]个体之后撤离了那里。同时，由于第二次示范中那位巨娘并未按照要求示范§Y巨娘随身物品险§!，而是示范了我们的另一个险种§Y巨娘足汗险§!，因此我们也对她作出了一些惩罚。
  gts_ultra_company.3003.desc: "Of course, since virtually no life remained on [target.capital_scope.GetName], the few [target.GetSpeciesAdj] who survived had completely broken down under the Giantess's colossal body, reduced to parasitic microorganisms that could only survive by relying on her foot sweat, and thus no longer possessed the ability to purchase insurance. However, the demonstration's effect was immediate—other civilizations throughout the galaxy fell into profound panic after witnessing this devastating power. They scrambled to submit insurance applications to us, dreading that their own homeworlds might be the next to be crushed under a Giantess's toes."
  gts_ultra_company.3003.a: "Give her fewer small folks next time."
  # Original: 寰海极宇
  origin_Ultra_company: "Universal Horizon"
  #  §H已投保：巨娘舌舐险§!
  gts_bruh_ultra_company_insurance_01: "§HInsured: Giantess Tongue-Lick Insurance§!"
  #  这个星球的居民已经自愿参加了§Y巨娘舌舐险§!，当它们的城市再次被巨娘舔去时，会第一时间得到公司的保护和重建赔偿...如果它们能撑到那时候的话。
  gts_bruh_ultra_company_insurance_01_desc: "The residents of this planet have voluntarily participated in §YGiantess Tongue-Lick Insurance§!. When their cities are licked away by a Giantess again, they will receive immediate protection and reconstruction compensation from the company... if they can last until then."
  #  §H已投保：巨娘足踏险§!
  gts_bruh_ultra_company_insurance_02: "§HInsured: Giantess Foot-Stomp Insurance§!"
  #  这个星球的居民已经自愿参加了§Y巨娘足踏险§!，当它们再次被从天而降的丝足踩踏时，会第一时间得到公司的保护和重建赔偿...如果它们能撑到那时候的话。
  gts_bruh_ultra_company_insurance_02_desc: "The residents of this planet have voluntarily participated in §YGiantess Foot-Stomp Insurance§!. When they are trampled again by silk-clad feet descending from the sky, they will receive immediate protection and reconstruction compensation from the company... if they can last until then."
