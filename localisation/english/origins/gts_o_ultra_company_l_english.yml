  # 很遗憾，这个文明拒绝了我们的保险服务。因此，我们派出了两位体型不同的巨娘前往[target.capital_scope.GetName]，让她们亲自为那颗行星上灰尘一般的生物们演示一下，巨娘的小物件所带来的压迫感。\n\n在第一次演示中，一位数万米大小的少女首先降临到了[target.capital_scope.GetName]表面上一座繁华的都市旁边，并随手褪下了自己所佩戴的手套丢进了城市之中，庞大的黑色皮革笼罩了小小的城市的上空，紧随而来的黑暗瞬间使城市里的[target.GetSpeciesAdj]们陷入了深深的恐慌。轰然落地的巨大黑色手套在一瞬间之内就碾碎了[target.GetSpeciesAdj]们引以为傲的中心城区，这一庞然大物所掀起的飓风又毁灭了城市周边的数座菌落一般的小镇与村庄。根据我们的探测仪传来的数据，仅仅是这位少女手套的其中一根指套就已经造成了数千万只小人的伤亡，以及一同被丝线碾碎的星球陆军的覆灭。我们预期的目标已经达成，一只手套所带来的毁灭已经让[target.GetSpeciesAdj]们明白了巨娘们的威压。不过，为了避免残余的小人寄生在指缝之间，在第二次演示开始之前，我们已经建议那位少女清洗一下自己的手套。
