  #  该星球的居民已经自愿投保了§Y巨娘毒气险§!，当它们的大气层再次被浊气充满时，会第一时间得到公司的保护和重建赔偿...如果它们能撑到那时候的话。
  gts_bruh_ultra_company_insurance_07_desc: "The residents of this planet have voluntarily insured themselves with §YGiantess Gas Insurance§!. When their atmosphere is filled with turbid gas again, they will receive protection and reconstruction compensation from the company... if they can last until then."
