  gts_ultra_company.4008.a: "This is for your own good."
  #  保費繳交：吐息險
  gts_ultra_company.4009.name: "Premium Payment: Breath Insurance"
  #  這次來到§Y[event_target:gts_bruh_get_insurance_planet.GetName]§!的是一位看起來天真無邪、吹著泡泡糖的蘿莉型巨娘。她眨巴著大眼睛，好奇地打量著這顆“玻璃珠”。手中的銀色湯匙在她手裡更像是一個挖沙堡的玩具，她開心地在星球表面挖來挖去，將幾個風景優美的旅遊勝地連同遊客一起剷起，興高采烈地倒進反重力容器，仿佛在收集珍奇的螞蟻。收集完畢後，她鼓起腮幫子，決定玩一個吹氣球的遊戲。她深吸一口氣，這一吸甚至短暫地抽幹了星球周圍稀薄的星際氣體，然後將嘴唇湊近星球的大氣層，猛地吹了口氣。這股氣流並非普通的風，而是帶著她體內濕熱水汽、二氧化碳和甜膩糖果味道的超級颶風。風速瞬間超過了星球歷史上記錄的最高值，達到數十馬赫。大氣層像被剝洋蔥一樣被吹散，地面上的建築、樹木、甚至地皮都被狂風捲入太空。緊隨其後的是她口水中攜帶的細菌和水霧，在高空凝結成黏糊糊的糖漿雨，將倖存的廢墟黏在一起。她似乎覺得很有趣，又連續吹了幾口氣，將星球表面的氣候系統徹底攪得粉碎。"呼——好玩嗎？你們飛起來了耶！"她拍著手笑道，"這就是吐息險哦，如果不想被我吹到宇宙中，下次記得要乖乖交保費哦！"她向星球做了一個鬼臉，帶著她的戰利品蹦蹦跳跳地離開了，留下一顆大氣層殘缺不全、地表一片狼藉的星球。根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
  gts_ultra_company.4009.desc: "The one coming to §Y[event_target:gts_bruh_get_insurance_planet.GetName]§! this time is an innocent-looking loli-type Giantess chewing bubble gum. She blinks her big eyes, curiously examining this \"glass bead.\" The silver spoon in her hand is more like a sandcastle toy to her; she happily digs around the planet's surface, scooping several scenic tourist resorts along with the tourists into anti-gravity containers, cheerfully pouring them in as if collecting rare ants. After the collection, she puffs out her cheeks, deciding to play a balloon-blowing game. She takes a deep breath—this breath even briefly drains the thin interstellar gases around the planet—then brings her lips close to the atmosphere and blows a massive breath. This airflow is no ordinary wind, but a super hurricane carrying the moist heat, carbon dioxide, and sweet candy flavor from within her body. The wind speed instantly exceeds the highest recorded in the planet's history, reaching dozens of Machs. The atmosphere is blown away like peeling an onion; buildings, trees, and even the topsoil on the ground are swept into space by the gale. Following closely is the bacteria and water mist carried in her saliva, condensing in high altitude into sticky syrup rain that glues the surviving ruins together. She seems to find it very interesting and blows several more breaths in a row, completely shattering the weather system on the planet's surface. \"Whoosh—is it fun? You're flying!\" she claps and laughs. \"This is Breath Insurance; if you don't want to be blown into the universe by me, remember to hand over the premium obediently next time!\" She makes a face at the planet and skips away with her trophies, leaving behind a planet with an incomplete atmosphere and a surface in a sorry state. According to statistics, the population successfully placed into containers as premiums in this operation was §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!, while the total number of accidental deaths during the uprooting and demonstration process reached §Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!."
  #  這下清爽多了
  gts_ultra_company.4009.a: "This feels much fresher now."
  #  保費繳交：精液險
  gts_ultra_company.4010.name: "Premium Payment: Semen Insurance"
  #  本季度負責§Y[event_target:gts_bruh_get_insurance_planet.GetName]§!的銷售員有些特殊，她是一位扶她巨娘。她沉默寡言，動作乾淨利落地揮動銀色湯匙，將星球上的一片大陸連同所有的人口剷起，粗暴地塞進反重力容器，完成了保費的收繳。隨後，她面無表情地解開褲帶，一根宏偉如通天塔般的肉棒彈跳而出，猙獰的血管如同盤龍般纏繞在柱身上，散發著熾熱的溫度和腥臊的氣味。她並不廢話，單手握住這根足以貫穿星體的巨物，開始在星球上空快速套弄。每一次手掌的上下滑動，都帶動著周圍空間的引力震盪，巨大的龜頭在摩擦中充血腫脹，馬眼處滲出的透明前列腺液如同流星雨般滴落，每一滴都足以淹沒一個中型城市。隨著她喉嚨裡發出一聲低沉的嘶吼，積蓄已久的爆發時刻來臨。一道濃稠、白濁、滾燙的精液洪流從馬眼中激射而出，帶著毀滅一切的動能撞擊在星球表面。這股白色的海嘯瞬間覆蓋了整片大陸，粘稠的液體填滿了所有的低洼地帶，將城市封存在白色的膠質中。精液的量大得驚人，甚至改變了星球的自轉重心。空氣中瀰漫著濃烈的石楠花氣味，讓所有倖存者感到息和眩暈。"這就是精液險"，她甩了甩肉棒上殘留的液體，幾滴殘精再次引發了幾場局部洪水，"不想被我的種子淹沒，就老實交錢。否則下次我就直接射進地核里"。她重新系好褲帶，冷漠地轉身離去。根據統計，此次行動中成功裝入容器作為保費的人口為§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_transfer_count_pop_amount]§!，而在剷起與演示過程中意外死亡的總人數達到了§Y[event_target:gts_bruh_get_insurance_planet.gts_bruh_get_planet_killed_pop_count_pop_amount]§!。
