  # 我们的工作人员很快就已经就位，对[target.capital_scope.GetName]的第二次演示已经准备完成。在[target.capital_scope.GetName]上的万米级巨娘撤离之后，另一位体型已经达到了数亿米，即已经远远大于那颗行星的体积的巨娘来到了渺小的星球旁边，伸出了一根手指，缓缓地褪下了自己黑丝巨足上套着的黑色皮鞋，并将其移动到了星球上空。\n\n一阵难以想象的足汗气息一瞬间就席卷了这颗星球的表面，少女的足味粗暴地从深渊一般的鞋口中奔涌而出，并几乎完全替换了这颗星球上的大气层，伴随而来的足汗暴雨以及足垢陨石雨冲刷着这颗星球上的地貌，同时粉碎着[target.GetSpeciesAdj]的一座座城市与数不清的个体。\n\n很快，几片全新的足汗海洋以及足垢山峰就已经在这颗星球上形成，溺死在其中或是被压在污垢下方的[target.GetSpeciesAdj]数不胜数。通过我们预先埋藏在地表上的数架摄像机显示，仅仅是少女鞋中滴出的一滴汗液就已经几乎彻底摧毁了[target.GetSpeciesAdj]们的国度，更不用说仍然悬在星球上空的，几乎可以容纳这个文明全员移民的小皮鞋了。
