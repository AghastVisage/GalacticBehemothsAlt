  # 尽管他们自以为是，但他们试图拯救一切的愿望是真的，他们凝聚在一起的心也是真的。
  gts_planet_yarong_internal_5_desc: "Although they are self-righteous, their wish to save everything is real, as is their unity."
  # 巨龙克隆仓
