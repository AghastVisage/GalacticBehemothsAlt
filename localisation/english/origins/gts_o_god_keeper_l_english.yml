l_english:
  # 豢养神明
  origin_god_keeper: "Taming Gods"
  # 在一场恐怖的灾难中，文明的守护者，昔日的伟大神明为了庇护她脚下的信徒们选择了自我牺牲。但位格极高的她即便是死亡也无法将她彻底从这个宇宙中彻底放逐。曾经万人敬仰的神明此刻正缱绻在一颗蛋中，等待着她的信徒再度将她唤醒。\n\n豢养她，是当成女儿？还是征服寰宇的兵器？
  origin_god_keeper_desc: "In a terrible disaster, the civilization's guardian, a great god of the past, chose self-sacrifice to protect the faithful beneath her. But her extremely high status meant that even in death, she could not be completely banished from the universe. The once-revered god is now nestled in an egg, waiting for her followers to awaken her once more.\n\nWill you raise her as a daughter? Or as a weapon to conquer the cosmos?"
  # $HOMEWORLD$$TABBED_NEW_LINE$ - ['concept_pc_ocean']（规模：£planetsize£30）\n首都拥有特殊建筑£building£§Y"$concept_building_god_keeper_1$"§!\n特质:§Y小人开局§!\n可选择特殊的国策:§Y$civic_god_lord$§!
  origin_tooltip_god_keeper_effects: "$HOMEWORLD$$TABBED_NEW_LINE$-['concept_pc_ocean'] (Size: £planetsize£30)\nCapital has unique building £building£§YIdeal City Ruins§!\nTrait: §YSmall Person Start§!\nCan choose special civic: §Y$civic_god_lord$§!"
  # 在一场恐怖的灾难中，文明的守护者，昔日的伟大神明为了庇护她脚下的信徒们选择了自我牺牲。但位格极高的她即便是死亡也无法将她彻底从这个宇宙中彻底放逐。曾经万人敬仰的神明此刻正缱绻在一颗蛋中，等待着她的信徒再度将她唤醒。\n\n豢养她，是当成女儿？还是征服寰宇的兵器？
  START_SCREEN_MESSAGES_GOD_KEEPER: "In a terrible disaster, the civilization's guardian, a great god of the past, chose self-sacrifice to protect the faithful beneath her. But her extremely high status meant that even in death, she could not be completely banished from the universe. The once-revered god is now nestled in an egg, waiting for her followers to awaken her once more.\n\nWill you raise her as a daughter? Or as a weapon to conquer the cosmos?"
  # $origin_god_keeper$
  concept_god_keeper: "$origin_god_keeper$"
  # $origin_god_keeper_desc$
  concept_god_keeper_desc: "$origin_god_keeper_desc$"
  # 理想城废墟
  building_god_keeper_1: "Ideal City Ruins"
  # 如果不是神明的牺牲，这片灾厄所肆虐毁灭的城市与文明将扩大到不可预估的规模。
  building_god_keeper_1_desc: "If not for the sacrifice of the god, the destruction wrought by this calamity would have expanded to an immeasurable scale."
  # §R神主雕像§!
  building_god_keeper_2: "God Master Statue"
  # 
  building_god_keeper_2_desc: """"
  # §Y神明赐福-陆军强化§!:这是你闺女身上的掉落的鳞片与发丝，被帝国陆军装备上后会让他们的战力激增。虽然那姑娘对自己的头发掉落还要被你捡走表现的不情不愿。
  building_god_keeper_buff_1_desc: "§YGod's Blessing - Army Reinforcement§!: These are scales and strands of hair that fell from your daughter. When equipped by the Imperial Army, they greatly increase their combat power, though the girl is reluctant about her shedding and you collecting it."
  # $building_god_keeper_1$
  concept_building_god_keeper_1: "$building_god_keeper_1$"
  # $building_god_keeper_1_desc$
  concept_building_god_keeper_1_desc: "$building_god_keeper_1_desc$"
  # $building_god_keeper_2$
  concept_building_god_keeper_2: "$building_god_keeper_2$"
  # $building_god_keeper_2_desc$
  concept_building_god_keeper_2_desc: "$building_god_keeper_2_desc$"
  # 神权君授
  civic_god_lord: "Divine Mandate"
  # 假设我们的文明倒退回封建时代，甚至更早的部落时期，我们需要的不是蒸汽机也不是重机枪，而是一位能带领我们穿过黑暗，从蛮荒走向新世界的君王。他必须足够强大，集一切伟力于一身，最好能拥有近乎无尽的寿命足以陪伴他的子民渡过岁月的长河，使理想永不褪色。他会在在重建乌托邦之后牺牲，将一切归还给信赖他的子民。虽然这只是基于假设而做出的设想，但哪怕只有万分之一的可能性，在条件允许的情况下我们都应该去尝试。\n\n于是在历史的纷争中，我们得到了应验。文明的王权得到了无与伦比的巩固，哪怕是真实存在的神明们，她们也要向尘世的王权俯首。
  civic_god_lord_desc: "Throughout history's conflicts, this civilization's royal authority has been consolidated to an unparalleled degree. Even the gods, who are real beings, bow before the worldly kings."
  # §Y当选择"$concept_god_keeper$"起源时，可以触发特殊剧情。§!
  civic_god_lord_effects: "§YCan put up a decent resistance during a coup by your own daughter (?)§!"
  # 重生之龙.幼年
  d_gts_keeper1: "Reborn Dragon. Juvenile"
  # 
  d_gts_keeper1_desc: """"
  # 宇宙波痕
  site_shentun: "Cosmic Ripple"
  # \"净土\"
  d_gts_keeper2: "\"Pure Land\"
  # 
  d_gts_keeper2_desc: """"
  # §P犽戎§!
  NAME_gts_yarong: "§PYarong§!"
  # 重生之龙
  gts_yarong_ship: "Reborn Dragon"
  # §P璀璨华焰§!
  gts_yarong_queen_ship: "§PCrystallized Flame§!"
  # 犽戎
  NAME_gts_yarong_fleet: "Yarong"
  # 犽戎
  NAME_gts_yarong_ship: "Yaorong"
  # §r紫宸§!
  NAME_gts_shentun: "§rZichen§!"
  # 寰宇之蛇
  gts_shentun_ship: "Cosmic Serpent"
  # 紫宸
  NAME_gts_shentun_ship: "Zichen"
  # 紫宸
  NAME_gts_shentun_fleet: "Zichen"
  # 神明赐福:陆军强化
  gts_god_keeper_buff1: "God's Blessing: Army Reinforcement"
  # 这是你闺女身上的掉落的鳞片与发丝，被帝国陆军装备上后会让他们的战力激增。虽然那姑娘对自己的头发掉落还要被你捡走表现的不情不愿。
  gts_god_keeper_buff1_desc: "These are scales and strands of hair that fell from your daughter. When equipped by the Imperial Army, they greatly increase their combat power, though the girl is reluctant about her shedding and you collecting it."
  # 铸甲为裙
  gts_god_keeper_buff2: "Armor Skirt"
  # 一切为了帝国
  gts_god_keeper_buff3: "Everything for the Empire"
  # 体表殖民
  gts_yarong_colony1: "Body Surface Colonization"
  # 我们科学家们希望能在天体级巨娘§P犽戎§!的躯体上建立一个殖民地，以便用于科学研究以及造福国民。
  gts_yarong_colony1_DESC: "Our scientists wish to establish a colony on the body of the celestial giantess §PYaorong§! for scientific research and to benefit our citizens."
  # 特殊的军事演习
  gts_yarong_battle1: "Special Military Exercise"
  # 您的女儿 -  - §P犽戎§!提出要在首都亲自检阅一下帝国的舰队。
  gts_yarong_battle1_DESC: "Your daughter, §PYaorong§!, has requested to personally review the Empire's fleet in the capital."
  # 特殊的军事演习
  gts_yarong_battle2: "Special Military Exercise"
  # 您的女儿 -  - §P犽戎§!提出要在首都亲自检阅一下帝国的舰队。
  gts_yarong_battle2_DESC: "Your daughter, §PYaorong§!, has requested to personally review the Empire's fleet in the capital."
  # §P犽戎§!的好感度
  situation_yarong_good: "§PYaorong's§! Affection"
  # §P犽戎§!的好感度
  situation_yarong_good_type: "§PYaorong's§! Affection"
  # 尘世众生皆有喜怒哀乐，而自我们思潮中诞生的神明自然也有着她的情绪 -  - 哪怕她变成了现在的模样。
  situation_yarong_good_desc: "Mortals have joys, angers, sorrows, and pleasures, and the god born from our thoughts naturally has her own emotions-even in her current state."
  # 悉心教导
  situation_yarong_good_positive: "Carefully Guide"
  # 平常对待
  situation_yarong_good_neutral: "Treat Normally"
  # 给我干活
  situation_yarong_good_negative: "Put Her to Work"
  # §P嗯？照顾女儿不是天经地义么？§!
  situation_yarong_good_complete_tooltip: "§P...Hm? Isn't taking care of my daughter my bounden duty?§!"
  # §P......§!
  situation_yarong_good_fail_tooltip: "§P......§!"
  # 十二作福音构赦免苦弱
  gts_situation_yarong_twelve: "Twelve Acts of the Gospel to Pardon the Weak"
  # 十二作福音构赦免苦弱
  gts_situation_yarong_twelve_type: "Twelve Acts of the Gospel to Pardon the Weak"
  # 我们的生命依旧有着不可逾越的极限，但是她不一样 -  - 见证她的煌煌历程，无论是作为她的父亲，还是作为她的信徒。
  gts_situation_yarong_twelve_desc: "Our lives still have insurmountable limits, but she is different-witness her glorious journey, whether as her father or as her believer."
  # 十二作福音构赦免苦弱
  situation_yarong_twelve_tooltip: "Twelve Acts of the Gospel to Pardon the Weak"
  # 积极推进
  situation_yarong_twelve_positive: "Actively Advance"
  # 无限的可能就在眼前，我们的神主必将带领我们走向宇宙的尽头
  situation_yarong_twelve_positive_effect: "Infinite possibilities are before us; our God Master will surely lead us to the end of the universe."
  # 正常推进
  situation_yarong_twelve_neutral: "Normally Advance"
  # 神主会带领我们，尽管我们只是像蚁兽在她的身上为她铸就甲胄一般
  situation_yarong_twelve_neutral_effect: "The God Master will lead us, even if we are just like ants on her, forging armor for her."
  # 缓慢推进
  situation_yarong_twelve_negative: "Slowly Advance"
  # 即便我们征途是最终的无限，但一腔热血不一定能够完成 -  - 我们必须也要着眼现实
  situation_yarong_twelve_negative_effect: "Even if our journey leads to the final infinity, passion alone may not be enough-we must also focus on reality."
  # 无限的可能性铸就的天途就在眼前。
  situation_yarong_twelve_complete_tooltip: "The divine path, forged with infinite possibilities, is right before us."
  # 龙鳞骨殖外装甲
  stage_gts_yarong_twelve1_tooltip: "Dragon Scale Bone Dermal Armor"
  # 再生大脑
  stage_gts_yarong_twelve2_tooltip: "Regenerative Brain"
  # 浓雾血液
  stage_gts_yarong_twelve3_tooltip: "Dense Fog Blood"
  # 融毒腺体
  stage_gts_yarong_twelve4_tooltip: "Melting Poison Glands"
  # 永燃金瞳
  stage_gts_yarong_twelve5_tooltip: "Eternal Burning Golden Eyes"
  # 真空完全适应
  stage_gts_yarong_twelve6_tooltip: "Vacuum Full Adaptation"
  # 孢子增值系统
  stage_gts_yarong_twelve7_tooltip: "Spore Proliferation System"
  # 炉胃
  stage_gts_yarong_twelve8_tooltip: "Furnace Stomach"
  # 再生纳米构造血管
  stage_gts_yarong_twelve9_tooltip: "Regenerative Nanostructured Blood Vessels"
  # 自律解析系统
  stage_gts_yarong_twelve10_tooltip: "Autonomous Analysis System"
  # 尤特克拉希尔之肤
  stage_gts_yarong_twelve11_tooltip: "Yutekurashir Skin"
  # 重生之心
  stage_gts_yarong_twelve12_tooltip: "Rebirth Heart"
  # 龙鳞骨殖外装甲
  gts_god_keeper.5001.title: "Dragon Scale Bone Dermal Armor"
  # 鳞片结构的改造使得往常剑盾的青黑色绒鳞将发生巨大的形变，不再是近乎椭圆的剑盾菱形，而是在鳞片现有尖角处逐渐锐利化呈现出十五度角的锋尖，表面有着流线型符合空气动力学的凹痕，以减少在高速移动时的摩擦力，让突破音障受到的负荷更小。
  gts_god_keeper.5001.desc: "The modification of the scale structure causes the usual sword-and-shield's dark cyan downy scales to undergo a massive change. No longer the nearly oval, diamond-shaped form, but rather sharpens the existing points into a 15-degree angle with a streamlined, aerodynamic concave surface, reducing friction at high speeds and lessening the burden of breaking the sound barrier."
  # 很好
  gts_god_keeper.5001.option: "Excellent."
  # 再生大脑
  gts_god_keeper.5002.title: "Regenerative Brain"
  # 隐藏在大脑中的第二大脑，在脑死亡时进行孵化完成所有神经节信息的吞噬，在一分钟内完成大脑替代，就像僵尸蚂蚁真菌一样，劫持宿主的中枢神经系统重新接管整具身体。
  gts_god_keeper.5002.desc: "A second brain hidden within the main brain, which, upon brain death, incubates and consumes all nerve ganglion information, completing brain replacement within one minute, hijacking the host's central nervous system and taking over the entire body like zombie ant fungus."
  # 很好
  gts_god_keeper.5002.option: "Excellent."
  # 浓雾血液
  gts_god_keeper.5003.title: "Dense Fog Blood"
  # 血液将不再以单一的液体流动，它可以被改变形状成为雾体。在加入强烈的精神意志的干涉下，体内的血液在因为战斗的创口流出躯体后，会以第三雾态的模式留存在身边，在需要的时候重新注入身体加入血液循环
  gts_god_keeper.5003.desc: "Blood will no longer flow as a single liquid but can be changed into a fog. With strong mental interference, blood that flows out of the body due to combat wounds will exist in a third-fog state nearby, ready to be re-injected into the body and rejoin the circulation when needed."
  # 很好
  gts_god_keeper.5003.option: "Excellent."
  # 融毒腺体
  gts_god_keeper.5004.title: "Melting Poison Glands"
  # 储存毒素、分解毒素、分泌速度的腺体，增生在口腔内壁两侧，以口内形成高压的方式喷出，也可以通过导管注入牙齿成为龙牙的混合毒素之一。
  gts_god_keeper.5004.desc: "Glands for storing, breaking down, and secreting toxins, grow on both sides of the inner wall of the mouth, spraying it out with high pressure within the mouth, or can be injected into the teeth through ducts to become part of the Dragon Teeth's mixed toxins."
  # 很好
  gts_god_keeper.5004.option: "Excellent."
  # 永燃金瞳
  gts_god_keeper.5005.title: "Eternal Burning Golden Eyes"
  # 分泌激素和异生物的组合基因，在短时间内改变视网膜以及结晶体的形状，提供类开普勒结构的瞳眸，赋予天文级的望远镜和光学显微级的强观察力。
  gts_god_keeper.5005.desc: "A combination of hormone-secreting and xenogeneic genes that briefly changes the shape of the retina and the crystalline lens, providing pupils with a Kepler-like structure, granting telescopic power and microscopic observation capabilities."
  # 很好
  gts_god_keeper.5005.option: "Excellent."
  # 真空完全适应
  gts_god_keeper.5006.title: "Vacuum Full Adaptation"
  # 不再依靠金源巨龙强大而又恐怖的肺部与免疫系统过滤外界气体，生成额外的器官中和毒素并且从真空中汲取一切能汲取的物质。
  gts_god_keeper.5006.desc: "No longer relying on the Great Golden Dragon's powerful lungs and immune system to filter external gases, the body generates additional organs to neutralize toxins and draw any useful substances from the vacuum."
  # 很好
  gts_god_keeper.5006.option: "Excellent."
  # 孢子增值系统
  gts_god_keeper.5007.title: "Spore Proliferation System"
  # 针对金源巨龙自愈因子的提取精炼，并像孢子类生物改造，形成类似于纳米机器虫群的意志形修补小队。
  gts_god_keeper.5007.desc: "Targeting the extraction and refinement of the Great Golden Dragon's self-healing factors, and reshaping them like spore-type organisms, forming a repair squad of will-based nano-machine swarms."
  # 很好
  gts_god_keeper.5007.option: "Excellent."
  # 炉胃
  gts_god_keeper.5008.title: "Furnace Stomach"
  # 特殊的胃部改造可以使接受改造者触摸恒星乃至将那高贵的星辰吞吃入腹 -  - 她的胃支持永不间断的工作，并且不会超载负荷
  gts_god_keeper.5008.desc: "Special modifications to her stomach allow the recipient to touch stars and even swallow the noble celestial bodies-her stomach supports continuous operation and will not overload."
  # 很好
  gts_god_keeper.5008.option: "Excellent."
  # 再生纳米构造血管
  gts_god_keeper.5009.title: "Regenerative Nanostructured Blood Vessels"
  # 科技的力量与巨龙的血管完全交合，能够促进她全身血液流通的同时也为她本就恐怖再生能力添砖加瓦
  gts_god_keeper.5009.desc: "The power of technology perfectly integrates with the dragon's blood vessels, able to promote blood circulation throughout her body, while adding to her already terrifying regeneration."
  # 很好
  gts_god_keeper.5009.option: "Excellent."
  # 自律解析系统
  gts_god_keeper.5010.title: "Autonomous Analysis System"
  # 进化到极致的听觉皮层系统，加速处理声音，增加听觉频率的范围，并且配合装载的中枢系统可进行发出声波与回声定位的操作。
  gts_god_keeper.5010.desc: "An evolved auditory cortex system that accelerates sound processing, increases auditory frequency range, and, in combination with the installed central system, performs operations of emitting sound waves and echolocation."
  # 很好
  gts_god_keeper.5010.option: "Excellent."
  # 尤特克拉希尔之肤
  gts_god_keeper.5011.title: "Yggdrasil Skin"
  # 以神话中世界树的名称来冠以她的肌肤之名 -  - 培养大量的成熟干细胞在皮肤之中，可以进行超负荷分裂进行皮肤和软骨的独立再生，也许终有一日，她会如同世界树一般不朽。
  gts_god_keeper.5011.desc: "Named her skin after the World Tree from mythology  -  cultivating a large amount of mature stem cells within the skin, enabling the independent regeneration of the skin and cartilage through overloaded cell division. Perhaps one day, she will be as immortal as the World Tree."
  # 很好
  gts_god_keeper.5011.option: "Excellent."
  # 重生之心
  gts_god_keeper.5012.title: "Rebirth Heart"
  # 她终将涅槃，沐浴恒星的融火，振翅九霄(解锁重生之心法令，献祭人口复活犽戎)。
  gts_god_keeper.5012.desc: "She will eventually be reborn, bathing in the molten fire of the stars, soaring into the heavens (unlocks the Rebirth Heart edict, sacrificing population to revive Yaorong)."
  # 即便如此，她也尚未抵达她的极限。
  gts_god_keeper.5012.option: "Even so, she has not yet reached her limits."
  # 犽戎归来
  gts_god_keeper.5013.title: "Yaorong Has Returned"
  # 神明不死，而眼前的景象无疑将这一定理诠释得淋漓尽致。帝都高耸的母神雕像前，千万虔诚的信徒汇聚于此，无论大小体型，尽皆颂唱着赞颂神明的圣歌。圣歌神圣且威严，唱词庄重且肃穆，不断有更多的信徒自发的加入这场为了唤回他们神明的伟大献祭。献祭已经持续了半天，在你的感知之下，无边无尽的能量自亚空间中逐渐沸腾，周围的行星仿佛都在这股力量之下偏移了轨道。是信徒们的献祭锁定了现实坐标，而你的注视锚定了犽戎的意志。周围的力量在达到顶点之后骤然沉寂，片刻，帝都母星旁的宇宙空间悄然破碎， maiden洁白的玉手自亚空间中探出，以看似轻柔却无可阻挡的力量，在宇宙间拉开了一条可以近乎等比于太阳系直径的狭长裂缝，犽戎，你的女儿，赤裸着身子，以赤子的姿态从中缓缓走出，群星再次点亮，帝国重新迎回了她的母神。犽戎那灿金般熠熠生辉，可以容下无数帝国母星的眼眸第一时间锁定了你的所在，红唇轻启：\n\"§P父亲，我回来了。§!\"
  gts_god_keeper.5013.desc: "Gods are immortal, and the sight before you undoubtedly proves that. At the towering Mother Goddess statue in the capital, millions of devout followers gather, regardless of size, all chanting hymns in praise of the goddess. The hymns are divine and majestic, the lyrics solemn and respectful, with more and more followers spontaneously joining this great sacrifice to call back their goddess. The sacrifice has been ongoing for half a day, and under your perception, endless energy is gradually boiling up from hyperspace. The surrounding planets seem to shift their orbits under this force. It is the sacrifice of the believers that have locked onto the coordinates in reality, and your gaze that has anchored Yaorong's will. The surrounding power suddenly subsides after reaching its peak, and for a moment, the space next to the capital's homeworld quietly shatters. A maiden's pale hands reach out from hyperspace, using what seems to be gentle but unstoppable force, and creates a narrow rift in space almost as wide as the solar system. Yaorong, your daughter, emerges slowly in a naked, childlike posture, and the stars light up again as the empire welcomes back their mother goddess. Yaorong's eyes, as brilliant as gold and expansive enough to hold countless empire homeworlds, instantly lock onto your location. Her red lips slightly part:\n\"§P Father, I have returned!§!\"
  # §Y欢迎回来。§!
  gts_god_keeper.5013.option: "§Y Welcome back.§!"
