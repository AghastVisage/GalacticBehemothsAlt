  # 看似平平无奇的胃酸足以腐蚀堕落帝国的巨舰，我们也可以利用这个处决队伍中的叛逆者......虽然这个环境还是太过恐怖了。
  gts_planet_yarong_internal_1_desc: "The seemingly ordinary gastric acid is strong enough to corrode even the decadent empire's giant ships. We can also use it to execute the rebellious members of our troops... even if the environment is still far too terrible."
  # 犽戎待消化的\"食物\"
  gts_planet_yarong_internal_2: "Yaorong's \"Food\" to be Digested"
  # 神主大人偶尔会吞吃下一些行星，而那些行星在被神主大人的胃酸融化消解之前，我们也许窃取一点有用的东西。
  gts_planet_yarong_internal_2_desc: "Our God sometimes swallows planets whole, and maybe we could steal something useful before those planets fully melt away in the stomach acid."
  # 犽戎体内的\"益生菌\"
  gts_planet_yarong_internal_3: "The \"Probiotics\" in Yaorong's Body"
