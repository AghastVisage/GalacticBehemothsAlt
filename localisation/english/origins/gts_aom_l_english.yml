  #  恶作剧后的惊魂未定
  aom_modifier_illya_1: "Shake-up from a Prank"
  #  虽然并没有造成实质性的后果，不过星球上的居民还是被吓得不清，可能需要一点时间才能缓过来
  aom_modifier_illya_1_desc: "Although there were no substantial consequences, the planet's residents were thoroughly spooked and may need some time to recover."
  #  巨大的美食
  aom_modifier_shiro_1: "Giant Gourmet"
  #  希洛小姐留下的美食非常充足，足够继续举办很长一段时间的庆典，人民将会继续沉浸在欢乐中。
  aom_modifier_shiro_1_desc: "The food left by Miss Shiro is so abundant that it can sustain a festival for quite a long time; the people will continue to be immersed in joy."
  #  0"缺少巨娘魔力结晶。"
  #  缺少巨娘魔力结晶。
  gts_aom_magicstones_deficit: "Missing Giantess Mana Crystals."
  d_abandoned_city: "Abandoned City"
  #  由于时间跳转导致整个城市的设施变成年久失修的状态，严重老化，已经被迫废弃。
  d_abandoned_city_desc: "Due to a time skip, the entire city's facilities have fallen into disrepair and severe aging, forcing them to be abandoned."
  #  山中剑
  d_mountain_sword: "Sword in the Mountain"
  #  某位铸剑少女有感而发留下的练习作品，被插入一座山峰中，如今这座剑峰已经成为知名旅游景点。同时也是工匠们的圣地，吸引无数人前来观摩
  d_mountain_sword_desc: "A practice work left by a certain sword-casting girl out of inspiration, thrust into a mountain peak. Today, this sword peak has become a famous tourist attraction, as well as a holy land for craftsmen, attracting countless people to observe."
  #  帝国传统采纳失败
  tr_aom_panlon_adopt_fail_customtootip: "Imperial Tradition Adoption Failed"
  #  破坏自适应城区
  zone_adaptive_city: "Destruction-Adaptive Urban Zone"
  #  为了在不影响星球正常运转以及巨娘和小人和谐相处的前提下，满足巨娘的发泄需求，以及部分小人的特殊爱好，而专门规划的特殊区域，整个区域被大范围的时间回溯魔法阵笼罩，巨娘所造成的任何破坏都会在一定时间后自动复原，相应的在这个区域死亡的小人也会在之后由牧师进行复活，确保不会造成实质性的破坏。
  zone_adaptive_city_desc: "A special area planned to satisfy the Giantesses' venting needs and some tiny people's unique hobbies without affecting the planet's normal operation or the harmony between Giantesses and tiny people. The entire zone is covered by a large-scale time-rewind magic circle; any destruction caused by Giantesses will automatically restore after a certain time, and accordingly, tiny people who die in this zone will be resurrected by priests later, ensuring no substantial damage is done."
  #  时间回溯
  tech_aom_time_rewind_1: "Time Rewind"
  #  拥有了时间回溯魔法，我们可以将各种事故扼杀在摇篮中，极大的降低了事故的发生概率，从而提高工作效率。
  tech_aom_time_rewind_1_desc: "With Time Rewind magic, we can nip various accidents in the bud, significantly reducing the probability of accidents and thereby improving work efficiency."
  #  起死回生
  tech_aom_resurrection: "Resurrection"
  #  复活魔法是一种不可思议的力量，这也使得我们拥有了挽救各种意外事故造成的伤亡，比如被巨娘踩死什么的？哈哈，说笑的。
  tech_aom_resurrection_desc: "Resurrection magic is an incredible power, allowing us to save casualties caused by various accidents—like being stepped to death by a Giantess? Haha, just kidding."
  #  大型时间回溯魔法
  tech_aom_time_rewind_2: "Large-scale Time Rewind Magic"
  #  随着我们对光明魔法的进一步掌握，我们已经可以布置大范围的时间回溯魔法阵，对一整座城市，乃至星球进行回溯。\n\n解锁特殊区划§H破坏自适应城区§!
  tech_aom_time_rewind_2_desc: "With our further mastery of light magic, we can now set up large-range time-rewind magic circles to rewind an entire city or even a planet.\\n\\nUnlocks special district: §HDestruction-Adaptive Urban Zone§!"
  #  仪式冷却中
  aom_magical_ritual_1_0: "Ritual Cooling Down"
  #  再不久前我们已经进行过一次大型时间魔法仪式，需要等待魔法之风再度充盈才能施展
  aom_magical_ritual_1_0_desc: "We performed a large-scale time magic ritual not long ago; we must wait for the magic winds to refill before casting it again."
  #  加速生长
  aom_magical_ritual_1_1: "Accelerated Growth"
  #  农作物的时间流速被加快，导致成长迅速，产量大大提高
  aom_magical_ritual_1_1_desc: "The passage of time for crops has been accelerated, leading to rapid growth and significantly increased yields."
  #  奇异波动
  aom_magical_ritual_1_2: "Strange Fluctuations"
  #  某种奇异的魔力波动，千奇百怪的效果对研究十分有帮助
  aom_magical_ritual_1_2_desc: "A certain strange magical fluctuation; its myriad peculiar effects are very helpful for research."
  #  超频运转
  aom_magical_ritual_1_3: "Overclocked Operation"
  #  我们的设备进入超频运转状态，从而提高了产量
  aom_magical_ritual_1_3_desc: "Our equipment has entered an overclocked state, thereby increasing production."
  #  矿脉恢复
  aom_magical_ritual_1_4: "Vein Restoration"
  #  原先枯竭的矿脉被逆转，回到了开采前的状态，许多矿场因此得以重新开业。
  aom_magical_ritual_1_4_desc: "The originally depleted mineral veins have been reversed to their state before mining; many mines have thus been able to reopen."
  #  快节奏生活
  aom_magical_ritual_1_5: "Fast-Paced Life"
  #  整个星球的时间都被加快了，所有的居民无论做什么事情都像被开了倍数一样，一切都变得如此迅捷，但是也带来了一些不良影响，快节奏的生活让人民喘不过气，幸福感显著下降。
  aom_magical_ritual_1_5_desc: "Time on the entire planet has been accelerated; all residents act as if on fast-forward whatever they do. Everything becomes so swift, but it also brings some ill effects—the fast-paced life leaves people breathless, and happiness significantly drops."
  #  能源障碍
  aom_magical_ritual_1_6: "Energy Obstructions"
  #  能源系统受到阻碍，导致一部分能源无法被输送产生严重浪费，
  aom_magical_ritual_1_6_desc: "The energy system is obstructed, causing a portion of energy to fail in transmission, resulting in severe waste."
  #  植被枯萎
  aom_magical_ritual_1_7: "Vegetation Wilting"
  #  农作物被过度加快，大面积枯死，星球面临粮食减产的威胁
  aom_magical_ritual_1_7_desc: "The crops were accelerated excessively and died off in large areas; the planet faces the threat of reduced food production."
  #  加速生长
  aom_ritual.2.name: "Accelerated Growth"
  #  仪式成功了，现在我们的农场被一片特殊的立场笼罩，这对其他生物并无影响，却能加快农作物的生长速度，这让我们的粮食产出大大提高。
  aom_ritual.2.desc: "The ritual was successful; now our farms are enveloped by a special field. It has no effect on other organisms but can accelerate crop growth, greatly increasing our food output."
  #  我们的粮食会迎来大丰收
  aom_ritual.2.a: "Our crops will have a grand harvest."
  #  奇异波动
  aom_ritual.3.name: "Strange Fluctuations"
  #  仪式制造了一片奇异的魔力波动，具有很高的研究价值。
  aom_ritual.3.desc: "The ritual created a field of strange magical fluctuations, possessing high research value."
  #  真是有趣的情况
  aom_ritual.3.a: "Quite an interesting situation."
  #  超频运转
  aom_ritual.4.name: "Overclocked Operation"
  #  对工厂使用时间魔法，这让我们的设备进入了超频状态，工作效率大大提高。
  aom_ritual.4.desc: "Using time magic on the factories has put our equipment in an overclocked state, significantly improving work efficiency."
  #  很好，加快效率
  aom_ritual.4.a: "Good, speed up the efficiency."
  #  时间回塑
  #  矿脉恢复
  aom_ritual.5.name: "Vein Restoration"
  #  有一大片已经枯竭的矿脉在时间倒流下又恢复到了未开采状态，这意味着我们可以重新开采。
  aom_ritual.5.desc: "A large swath of depleted mineral veins has returned to an un-mined state under the reversal of time, meaning we can mine them once again."
  #  源源不断，真不错
  aom_ritual.5.a: "An endless stream, truly wonderful."
  #  快节奏生活
  aom_ritual.6.name: "Fast-Paced Life"
  #  非常不可思议，整个星球的时间都被大幅度加快，这导致我们的人民无论做什么都变得非常迅速，但是这样快节奏的生活也造成了一些不良影响，对精神是一种负担。
  aom_ritual.6.desc: "Most incredible: the flow of time across the entire planet has been drastically accelerated. As a result, our people do everything at extraordinary speed, but such a fast-paced life has also brought adverse effects, imposing a heavy burden on their minds."
  #  我们需要一些时间来适应这种变化
  aom_ritual.6.a: "We need some time to adapt to this change."
  #  能源障碍
  aom_ritual.7.name: "Energy Obstruction"
  #  仪式失败了，魔法的残留波动阻碍了我们的能源传输网络，导致一部分能源被无意义的浪费掉了。
  aom_ritual.7.desc: "The ritual failed; residual magical fluctuations are obstructing our energy transmission network, causing a portion of our energy to be pointlessly wasted."
  #  可恶
  aom_ritual.7.a: "Damn it."
  #  植被枯萎
  aom_ritual.8.name: "Vegetation Wither"
  #  该死，仪式出现了意外，我们的农田被过度加快了时间，大量枯萎吗，导致大面积的粮食减产。
  aom_ritual.8.desc: "Damn it, an accident occurred during the ritual. Time was accelerated too much over our farmlands, causing widespread withering and resulting in massive crop losses."
  #  太糟了
  aom_ritual.8.a: "How awful."
  tech_aom_magicsystems_reserves: "Mana Pool Reserve Increase"
  #  通过魔法加固魔力池，提高整体魔力储存容量。
  tech_aom_magicsystems_reserves_desc: "Reinforcing the mana pool through magic to increase the overall mana storage capacity."
  #  魔力生产效率提升
  tech_aom_magicsystems_generation: "Mana Production Efficiency Increase"
  #  优化魔力回路，提升魔力生成效率。
  tech_aom_magicsystems_generation_desc: "Optimizing mana circuits to improve mana generation efficiency."
  #  这些疯子又惹麻烦了
  aom_leader_cg.9.a: "Those lunatics have caused trouble again."
  #  魔力小行星已被摧毁
  aom_leader_cg.10.name: "Magic Asteroid Destroyed"
  #  向[Root.GetName]飞来的小行星已经被摧毁了！§Y[From.Planet.GetName]§!九死一生的平民们都在街上庆祝。经过探查，我们发现这颗小行星的是由高浓度的魔力结晶构成，哪怕是一些边角料都可以作为优秀的能源供应。我们已尽可能将这些优质资源回收。
  aom_leader_cg.10.desc: "The asteroid flying towards [Root.GetName] has been destroyed! The civilians of §Y[From.Planet.GetName]§!, having escaped death by a hair's breadth, are celebrating in the streets. Upon investigation, we found that this asteroid was composed of high-concentration mana crystals; even some scrap can serve as an excellent energy supply. We have recycled as many of these high-quality resources as possible."
  #  太棒了
  aom_leader_cg.10.a: "Great."
  #  紫色魔法少女
  aom_leader_cg.11.name: "The Purple Magical Girl"
  #  魔力小行星即将命中§Y[From.Planet.GetName]§!但我们的武器尚未准备就绪，危机时刻，我们突然检测到一个高能反应，一个巨大的紫色物体在以更快的速度靠近，就像一艘巨型战舰，拖着明亮的轨迹。\n“记得应该是在这附近有一颗星球的，在哪里呢？唔，该不会迷路了吧” \n夹杂着一丝慌乱的声音，刚好停在了星球和小行星中间，是一位身穿紫色法袍的天体级少女。原来是加拉哈德小姐。她在太空中左顾右盼，寻找着目标。但她似乎没有发现，此时我们的星球就在她旁边，甚至与她法袍飘动的下摆擦肩而过。\n幸运的是这预想中可怕的事情并没有发生。否则这可能会演变成一场更大的灾难，此时§Y[From.Planet.GetName]§!的居民只能看到少女那被深紫色过膝袜包裹的大腿，甚至还有一小部分，藏在紫色裙底下的奇妙风光。\n“呀？这是……小石头？” \n刚好抬起头，少女注意到了面前的小行星，带着疑惑的表情将脸凑近，仔细打量了一番，然后又好奇地伸出手掌，蓝色的小行星在她手中就像一颗弹珠一样小巧，被白皙的手轻易指捏住。\n“好像有很强烈的能量波动，并不像是天然的呢？” \n“非常感谢，加拉哈德小姐，如果让这颗小行星撞上我们的星球……那就危险了” \n“到底是怎么回事呢？” \n“是这样……有个法师的实验出了意外……”\n经过一番简单的解释，加拉哈德小姐了解了原因。\n“哎，是这样吗？那我帮你们解决掉好啦，你们也真是的，做实验居然差点把自己的星球毁了” \n看着指尖的小行星，加拉哈德嘟囔着最，手指微微用力，就将其捏碎，变成了大量更加微小的碎屑。\n“话说，你们的星球到底在哪呢？我怎么没看到” \n“那个，这么说可能有点失礼，请您把头低下，我们在您下面” \n“呜哇！？原来你们在这里呀……因为太小了刚刚没发现” \n低头望去，加拉哈德小姐终于发现了在她身下的小小星球。害羞地涨红了脸，下意识伸手去遮，而这也导致她的衣裙更加剧烈的晃动起来，好像随时可能撞到星球上。\n“啊啊啊！请您小心一点，我们的小星球可经不住您的力量” \n§Y[From.Planet.GetName]§!刚刚劫后余生的居民，还未来得及开始庆祝，就再次迎来更大的危险。\n“哇，对不起，对不起啦！” \n通讯传来的尖叫让加拉哈德连忙道歉。拉开距离，控制着自己的身体将那张可爱的面庞对准星球，表情认真却又带着惊慌，语速不受控制的加快。\n“总之你们下次也小心一点，不要再做这么危险的实验啦，那个……我先走啦，再见” \n留下最后一句提醒，这位天体级少女仓皇而逃，离开了这个星系。§Y[From.Planet.GetName]§!终于恢复了往日的和平，居民们举行了盛大的庆祝活动。也许这次事件应该会让那些疯狂的法师得到教训，少做一些危险的实验。\n经过探查，我们发现这颗小行星的是由高浓度的魔力结晶构成，哪怕是一些边角料都可以作为优秀的能源供应。我们已尽可能将这些优质资源回收。
