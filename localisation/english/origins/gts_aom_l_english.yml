  aom_leader_cg.11.desc: "The Magic Asteroid was about to strike §Y[From.Planet.GetName]§!, but our defenses were not yet ready. In that moment of crisis, we detected a high-energy signature—a massive purple entity approaching at blinding speed, like a colossal battleship trailing a luminous wake.\n“I recall there being a planet around here; where is it? Hmm, could I be lost?”\nA slightly panicked voice crackled as she halted squarely between §Y[From.Planet.GetName]§! and the asteroid. It was Miss Galahad, now at celestial scale in her purple robes. She scanned space, searching, seemingly unaware that §Y[From.Planet.GetName]§! was right beside her—the hem of her robes even brushed past our atmosphere.\nMercifully, the collision we feared did not occur, though it could have easily become an even greater catastrophe. For those on §Y[From.Planet.GetName]§!, the sky was filled by her thighs in deep purple stockings, with even a hint of the wondrous sights beneath her skirt visible in the cosmic distance.\n“Ah? Is this... a pebble?”\nGlancing up, the girl noticed the asteroid. With a puzzled look, she leaned in, examining it closely before curiously reaching out. In her palm, the blue asteroid was no larger than a marble, easily pinched between her fingers.\n“There's a very intense energy aura here; it doesn't seem natural, does it?”\n“Heartfelt thanks, Miss Galahad. Had that asteroid struck us... it would have been dire.”\n“What's going on here?”\n“Well... a mage's experiment Went somewhat awry...”\nAfter a brief explanation, Miss Galahad understood.\n“Oh, is that so? I'll solve it for you then. You really shouldn't be so careless—almost destroying your own planet with an experiment!”\nWith a slight pout, she applied a fraction of her strength, crushing the asteroid between her fingertips into a cloud of micro-debris.\n“By the way, where IS your planet? I don't see it anywhere.”\n“Um, this might be a bit awkward, but... please look down. We are beneath you.”\n“Uwaa!? You were there the whole time? You're so small I didn't even notice!”\nLooking down, Miss Galahad finally saw the tiny sphere below. Her face flushed a deep crimson as she instinctively reached to cover herself—a move that caused her dress to sway violently, nearly brushing against the planet.\n“Wait! Please be careful! Our little world can't take much of that!”\nThe survivors on §Y[From.Planet.GetName]§! found themselves in a new, even larger danger before they could celebrate their salvation.\n“Wah! Sorry, I'm so sorry!”\nThe frantic warning made Galahad apologize profusely. She backed away, bringing her cute, panicked face into view as she spoke with rapid-fire speed.\n“Just... be more careful next time! No more dangerous experiments! Um... I have to go now! Goodbye!”\nWith one last warning, the celestial girl fled in a flurry of purple, leaving the system behind. Peace finally returned to §Y[From.Planet.GetName]§!, and the people celebrated with a grand festival. Perhaps this close call will teach those mad mages to be more cautious.\nSurveys confirm the asteroid was composed of concentrated mana crystals. Even the remnants will serve as an excellent energy source. We have salvaged as much as possible."
  aom_leader_cg.11.a: "That was a close call."
