  # 人皇
  leader_trait_fara_A: "Human Emperor"
  # 在旧世界，由八圣灵共同认可的世界秩序维护者，而在新时代则是统御八大界域的永恒统治者，无论经过多少岁月，人皇始终守护着这个世界。
  leader_trait_fara_A_desc: "In the Old World, the maintainer of world order recognized by the Eight Sacred Spirits, and in the New Age, the eternal ruler who governs the Eight Realms. No matter how many years pass, the Human Emperor always protects this world."
  # 欧德洛化身
  leader_trait_fara_B: "Avatar of Odeluo"
  # 欧德洛的化身，掌握着原初之火的力量，可以焚尽世间一切敌人
  leader_trait_fara_B_desc: "The avatar of Odeluo, mastering the power of Primordial Fire, can burn all enemies in the world."
  # 欧德洛之刃
  leader_trait_fara_C: "Blade of Odeluo"
  # 这把强大的武器曾经作为法拉尔达的佩剑，太古时代，人皇剑一分为八，而此剑便是当初那其中一块碎片重铸而成
  leader_trait_fara_C_desc: "This powerful weapon was once Faralda's sword. In ancient times, the Human Emperor's Sword was divided into eight, and this sword was recast from one of those fragments."
  # 梦幻召唤
  leader_trait_illya_A: "Dreamlike Summoning (Install)"
  # 「Wonderful＆Congrats，伊莉雅！“职阶卡”终于全部收集完成了！\n今后可以随心所欲地梦幻召唤（Install)啦！」\n「这……这确实值得高兴，但什么时候完成的……？\n我说红宝石～你该不会是擅自顺走了敌人掉落的……」\n「哎哟，红宝石亲的副业话题就到此为止啦☆」\n「你这根傻杖子～，快和我一起去道歉！」\n\n（不过偷偷告诉你一件事——\n为了修改处于封印状态的卡，\n我与拥有道具作成技能的各位进行了暗黑交易，\n这点还请谅解哦☆）\n\n「但是……这样说来，我今后是不是就能进一步帮上\n御主的忙了呢……？」\n「那当然啦！　通过借用迦勒底遇到的这些那些英灵的\n力量，令伊莉雅的狡——愉快的可能性＆转身形态超\n越极限开花结果！\n可以从基本七职阶发展到Ruler、Shielder、\nAvenger、泳装、糖果与恶作剧、色情公主、危险野\n兽，还有……」\n「后半越来越奇怪了！　已经不是职阶了吧！\n总……总之我会努力变成御主可靠的存在……\n但是……过于羞耻的还是要节制一下……」
  leader_trait_illya_A_desc: "\"Wonderful & Congrats, Illya! 'Class Cards' are finally all collected!\nFrom now on, you can Dreamlike Summon (Install) as you wish!\"\n\"This... this is indeed worth celebrating, but when was it completed...?\nI say Ruby~ You didn't steal what the enemy dropped without permission, did you...\"\n\"Oops, Ruby-chan's side job topic ends here☆\"\n\"You silly wand~, come and apologize with me quickly!\"\n\n(But let me tell you a secret secretly - \nIn order to modify the cards in the sealed state,\nI made dark dealings with everyone who has the Item Construction skill,\nPlease understand this point☆)\n\n\"But... in this way, will I be able to help Master more\nin the future...?\"\n\"Of course! By borrowing the power of those Heroic Spirits encountered in Chaldea,\nLet Illya's cunning - pleasant possibilities & transformation forms bloom\nbeyond the limit!\nYou can develop from the basic seven classes to Ruler, Shielder,\nAvenger, Swimsuit, Trick or Treat, Erotic Princess, Dangerous Beast,\nand...\"\n\"The second half is getting weirder and weirder! It's not a class anymore!\nAny... Anyway, I will try my best to become a reliable existence for Master...\nBut... please restrain yourself from being too shameful...\"
  # 红宝石
  leader_trait_illya_B: "Ruby"
  # 一个非常不靠谱的奇妙杖子，看上去相当可以\n
  leader_trait_illya_B_desc: "A very unreliable strange wand, looks quite okay\n"
  # 皇帝
  leader_trait_ruler_emperor: "Emperor"
  # 【我们的名字将被我们的人民长久歌颂下去，直至世界的末日！】跨越三重试炼。帝国皇帝的完整实力，让士兵同时获得一卡士气和一卡冲锋，并且不再局限于瑞克禁卫和巨剑士，所有士兵都将享受到高贵的双重共计减35%维护费以及守护者技能的25%物理抗性加持，此外还保留最初的5%移动距离。
  leader_trait_ruler_emperor_desc: "<Our names will be sung by our people for a long time, until the end of the world!> Surmounted three trials. The full strength of the Imperial Emperor allows soldiers to gain morale and charge at the same time, and is no longer limited to Reiksguard and Greatswords. All soldiers will enjoy the noble double bonus of 35% reduction in maintenance costs and 25% physical resistance bonus from the Guardian skill, in addition to retaining the initial 5% movement distance."
  # 被双脚夹住
  aom_modifier_fara_feet: "Clamped by Feet"
  # 少女巨大的脚掌将整个星球温柔地夹住，她的动作十分小心，因此没有造成破坏，此外空气中弥漫着浓郁的体香真是令人心旷神怡。
  aom_modifier_fara_feet_desc: "The girl's huge soles gently clamped the entire planet. Her movements were very careful, so no damage was caused. In addition, the rich body scent permeating the air is really refreshing."
  # 奇妙残香
  aom_modifier_fara_feet_A: "Wonderful Lingering Scent"
  # 星球上的居民不必在看着那遮蔽天空的脚掌了，不过看样子残留的余香还需要一段时间才能消散
  aom_modifier_fara_feet_A_desc: "The inhabitants of the planet no longer have to look at the soles covering the sky, but it seems that the remaining lingering scent will take some time to dissipate."
  # 本月的零花钱已领取
  pocket_money_cooldown: "This month's pocket money has already been collected."
