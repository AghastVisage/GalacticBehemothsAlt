  #  魔力石合成厂
  building_aom_magictherapist_factory: "Magic Stone Synthesis Plant"
  #  0"通过凝聚元素能量，大量生产魔力石，以供应各类实验的需求。"
  building_aom_magictherapist_factory_desc: "0\"Mass produce Magic Stones by condensing elemental energy to supply the needs of various experiments.\""
  #  温泉疗养师
  job_aom_magictherapist: "Hot Spring Therapist"
  #  温泉疗养师
  job_aom_magictherapist_plural: "Hot Spring Therapists"
  #  提供最舒适的服务，并从抽取多余的能量
  #  提供最舒适的服务，并从巨娘身上抽取多余的能量，避免能量溢出造成的不适，还能顺带将其利用起来
  job_aom_magictherapist_desc: "Provide the most comfortable service and extract excess energy from the Giantess, avoiding discomfort caused by overflowing energy while putting it to good use."
  job_aom_magictherapist_effect_desc: "£job_aom_magictherapist£ $job_aom_magictherapist$ consumes £consumer_goods£ to produce £gts_aom_magicstones£ §BGiantess Magic Crystals§!"
  #  $job_aom_magictherapist$职位
  #  $job_aom_magictherapist$岗位
  mod_job_aom_magictherapist_add: "$job_aom_magictherapist$ Jobs"
  gts_aom_magicstones: "Giantess Magic Crystal"
  #  0"用于吸收巨娘身上过量溢出能量的特殊的容器，可以帮助施法者快速恢复能量，同时也是制作各种附魔装备或者进行魔法实验的必须品"
  #  用于吸收巨娘身上过量溢出能量的特殊的容器，可以帮助施法者快速恢复能量，同时也是制作各种附魔装备或者进行魔法实验的必须品
  gts_aom_magicstones_desc: "A special container used to absorb excess energy overflowing from the Giantess. It can help casters quickly recover energy, and is also an essential item for crafting various enchanted equipment or conducting magical experiments."
  gts_aom_saint_uartz: "Saint Quartz"
  #  0"隐藏着神圣力量的石头。用以确定无数未来的概念被结晶化后的存在。也被称为拟似灵子结晶。"
  #  隐藏着神圣力量的石头。用以确定无数未来的概念被结晶化后的存在。也被称为拟似灵子结晶。
  gts_aom_saint_uartz_desc: "A stone concealing sacred power. It is the crystallized existence of concepts that determine countless futures. Also known as Pseudo-Spiritron Crystals."
  gts_aom_unregistered_spirit_origin: "Unregistered Spirit Origin"
  #  0"满溢而出的灵基的残渣。"
  #  满溢而出的灵基的残渣。
  gts_aom_unregistered_spirit_origin_desc: "Residue of overflowing Spirit Origins."
  gts_aom_Belief: "Belief"
  #  0"这是某种发自生命内心，充满不可思议的神秘力量。"
  #  这是某种发自生命内心，充满不可思议的神秘力量。
  gts_aom_Belief_desc: "This is a mysterious power full of wonder that comes from the heart of life."
  building_aom_magichotspring_sanatorium: "Hot Spring Sanatorium"
  #  0"优质的魔力温泉，提供最优质的服务，并产出一定的魔力结晶"
  #  优质的魔力温泉，提供最优质的服务，并产出一定的魔力结晶
  building_aom_magichotspring_sanatorium_desc: "A high-quality magic hot spring, providing the finest service and producing a certain amount of mana crystals."
  building_aom_fishing_grounds: "Beret Fishery"
  #  用小学生的帽子当做渔场？真是个有趣的想法，通过魔法加护的帽子带着神秘的力量，可以提供高品质的鱼类，作为优质食材，还有很多的副产物奢侈品
  building_aom_fishing_grounds_desc: "Using a schoolchild's hat as a fishery? Truly an interesting idea. The hat protected by magic carries mysterious power, providing high-quality fish as premium ingredients, and many byproduct luxury goods."
  #  丝袜酒店
  building_aom_stockings_hotel: "Stockings Hotel"
  #  用带着残香软绵绵的丝袜改造而成的酒店，虽然让她感觉有些羞耻，不过总归还是让我们借到了，十分舒服。
  building_aom_stockings_hotel_desc: "A hotel converted from a soft, fragrant pair of stockings. Although it makes her feel a bit ashamed, she eventually let us use it, and it's very comfortable."
  #  瓶装餐厅
  building_aom_bottled_restaurant: "Bottled Restaurant"
  #  由少女收藏的瓶中船改装而成的高档餐厅，提供奢侈精致的餐点，它的灵感似乎来自某部动画片？
  building_aom_bottled_restaurant_desc: "A high-end restaurant converted from a ship-in-a-bottle collected by the girl, providing luxurious and exquisite meals. Its inspiration seems to come from a certain animation?"
  #  巨型矿井
  building_aom_giant_mine: "Giant Mine"
  #  少女只是随意地用指尖描绘大地，一个巨型矿坑变由此形成，各式各样深埋地底的矿物盡数暴露在我们的眼皮子底下，等待开采。
  #  少女只是随意地用指尖描绘大地，一个巨型矿坑变由此形成，各式各样深埋地底的矿物尽数暴露在我们的眼皮子底下，等待开采。
  building_aom_giant_mine_desc: "The girl merely traced the ground casually with her fingertip, and a giant mine was formed, exposing all kinds of minerals buried deep underground right before our eyes, waiting to be mined."
  building_aom_library: "Great Library"
  #  小学生可爱的书包，但是对我们来说是如此巨大，足以放下数不清的书籍，当做图书馆正好。
  building_aom_library_desc: "A primary student's cute schoolbag, yet for us it is so immense that it can hold countless books, making it perfect for a library."
  #  铅笔盒铸造厂
  building_aom_pencil_box_foundry: "Pencil Case Foundry"
  #  用一个平平无奇但十分巨大的铅笔盒改造而成的大型工厂，搭载了极其特殊的火焰熔炉以极高的效率生产合金。
  building_aom_pencil_box_foundry_desc: "A large-scale factory converted from an ordinary but enormous pencil case, equipped with an extremely special flame furnace to produce alloys with extremely high efficiency."
  #  抵抗军堡垒
  building_aom_resistance_fortress: "Resistance Fortress"
  #  比起待宰的羔羊，有些巨娘会更喜欢具备一定攻击性的猎物，提供软弱无力的抵抗，然后将其碾碎，因此我们设置了抵抗军营地为巨娘们的游乐增添一些乐趣，同时还可以训练士兵，积累与巨娘作战的经验。
  building_aom_resistance_fortress_desc: "Some Giantesses prefer aggressive prey over lambs for the slaughter, offering weak resistance only to be crushed. Therefore, we have established Resistance Camps to add some fun to the Giantesses' play, while also training soldiers and accumulating experience in fighting Giantesses."
  #  小人摄影棚
  building_aom_photography_studio: "Tiny Person Photography Studio"
  #  专业的摄影棚，供摄影师们将巨娘们的破坏过程拍摄下来，并让更多人欣赏。
  building_aom_photography_studio_desc: "A professional photography studio for photographers to capture the destruction process of the Giantesses, allowing more people to admire it."
  #  大型地标
  building_aom_large_landmark: "Large Landmark"
  #  在城区之中增加一些具有特色的地标建筑，这些鹤立鸡群的特殊建筑总是能吸引巨娘破坏的欲望。
  building_aom_large_landmark_desc: "Adding some distinctive landmark buildings in the urban areas; these unique structures that stand out from the crowd always attract the Giantesses' desire for destruction."
  #  小钱钱
  fara.4.f: "Pocket Money"
