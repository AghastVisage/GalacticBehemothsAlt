  # 阿尔托莉雅·潘德拉贡·弗利安
  altria_pendragon_frian: "Artoria Pendragon Frian"
  # 来自异世界，一个帝国最后的皇帝\n在死后转生成名为阿尔托莉雅的少女，\n未来的骑士王\n因为某些意外导致选王的时间提前了数年\n年仅七岁的她拔出石中剑。\n年幼的少女成为不列颠的王。\n在神王的帮助下，最终改变卡美洛灭亡的命运。\n\n不过此时出现在我们面前的只是一名年仅七岁的普通女孩\n来自不列颠的阿尔托莉雅公主殿下\n因为不明原因提前觉醒了前世的力量\n但是并没有得到记忆\n还只是一名平凡的女孩
  altria_pendragon_frian_desc: "The last emperor of an empire from another world.\nAfter death, reincarnated as a girl named Artoria,\nthe future King of Knights.\nDue to some accidents, the time of choosing the king was moved forward by several years.\nAt only seven years old, she pulled out the Sword in the Stone.\nThe young girl became the King of Britain.\nWith the help of the God-King, she ultimately changed the fate of Camelot's destruction.\n\nHowever, the one appearing before us now is merely an ordinary seven-year-old girl.\nHer Royal Highness Princess Artoria of Britain.\nFor unknown reasons, she awakened her past life's power ahead of time\nbut did not regain her memories,\nstill remaining just a simple girl."
  # 阿尔托莉雅·潘德拉贡·弗利安
  NAME_altria_pendragon_frian: "Artoria Pendragon Frian"
  # 亚瑟王的转世，与我们所认知的传说截然不同，拥有超强的内政能力，足以将国家治理的蒸蒸日上，所以她绝对不可能吃垮不列颠，嗯，没错
  gts_aom_altria_pendragon_frian_leader_desc: "The reincarnation of King Arthur, appearing entirely different from the legends we know. She possesses super internal governance abilities, enough to make the country flourish. Thus, it's absolutely impossible for her to eat Britain into bankruptcy, yes, indeed."
  # 我会加油的！
  gts_aom_altria_pendragon_frian_leader_catch_phrase: "I'll do my best!"
  # 英灵响应：阿尔托莉雅 潘德拉贡 弗利安
  aom_leader.4.name: "Servant Response: Artoria Pendragon Franz"
  # 那个您好……阁下？\n我是阿尔托莉雅，\n虽然不知道原因，但我似乎是那位亚瑟王的转世\n不过完全没有记忆\n总之，很高兴认识你……请多关照
  aom_leader.4.desc: "Umm, hello... Your Excellency?\nI am Artoria,\nAlthough I don't know the reason, I seem to be the reincarnation of that King Arthur\nBut I have no memory at all\nAnyway, nice to meet you... please take care of me"
  # 角色详情
  aom_leader.4.a: "Character Details"
  # 来自异世界，一个帝国最后的皇帝\n在死后转生成名为阿尔托莉雅的少女，\n未来的骑士王\n因为某些意外导致选王的时间提前了数年\n年仅七岁的她拔出石中剑。\n年幼的少女成为不列颠的王。\n在神王的帮助下，最终改变卡美洛灭亡的命运。\n\n不过此时出现在我们面前的只是一名年仅七岁的普通女孩\n来自不列颠的阿尔托莉雅公主殿下\n因为不明原因提前觉醒了前世的力量\n但是并没有得到记忆\n还只是一名平凡的女孩
  aom_leader.4.a.response: "The last emperor of the Western Sigmar Empire\nReincarnated as a girl named Artoria after death,\nThe future King of Knights\nBecause of some accidents, the time of the Selection of the King was advanced by several years\nShe pulled out the Sword in the Stone at the age of only seven.\nThe young girl became the King of Britain.\nWith the help of the God King, the fate of Camelot's destruction was finally changed.\n\nHowever, what appears in front of us at this time is just an ordinary girl who only is seven years old\nPrincess Artoria from Britain\nAwakened the power of previous life ahead of time for unknown reasons\nBut did not get the memory\nStill just an ordinary girl"
