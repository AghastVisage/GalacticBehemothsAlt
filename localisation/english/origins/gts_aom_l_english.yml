  aom_leader.102.name: "Noble Phantasm Level Up: Artoria Pendragon Franz"
  # 哎？好像又变强了一点，为了神王诺塔尔！等一下，我为什么要说这样的话。
  aom_leader.102.desc: "Eh? Seems to have become a little stronger again, for Sigmar! Wait a minute, why did I say such things."
