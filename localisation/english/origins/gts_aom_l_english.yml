  fara.15.y: "No, I'll think about it more."
  #  抱歉妈妈，我该走了
  fara.15.z: "Sorry Mom, I have to go."
  #  为了追寻最初的平凡，而以此等形态现界，自认为平平无奇，实则拥有无上伟力的少女。
  gts_aom_fara_leader_desc: "In pursuit of original mediocrity, this girl manifested in such a form; she considers herself ordinary, but in reality, she possesses supreme power."
  #  接下來请多关照呀，好孩子
  #  接下来请多关照呀，好孩子
