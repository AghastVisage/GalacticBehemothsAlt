  #  这个文明的战士在与巨大生物的搏斗中磨炼出了坚韧的意志和惊人的力量，亘古不变的骑士精神贯彻其中，挑战强大的生物，将其击败，乃至得到认可成为伙伴。\n\n解锁特殊建筑§H骑士堡§!
