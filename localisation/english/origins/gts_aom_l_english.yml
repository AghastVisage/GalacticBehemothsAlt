  # 加拉哈德·杜·拉克
  galahad: "Galahad du Lac"
  # 冬木市一名平凡的三年级小学生。\n老家在法国西北部的卢瓦尔河地区，热讷-卢瓦尔河谷镇\n与传说中的圣杯骑士同名，但是具体原因我们不得而知\n
  galahad_desc: "An ordinary third-grade primary student from Fuyuki City.\nHer hometown is the Gennes-Val-de-Loire region in northwestern France.\nShe shares the same name as the legendary Holy Grail Knight, but the specific reason remains unknown."
  # 加拉哈德·杜·拉克
  NAME_galahad: "Galahad du Lac"
  # 学弟变学妹，真是奇妙啊，可可爱爱的魔法小加加，不知道兰斯洛特先生作何感想。
  gts_aom_galahad_leader_desc: "A junior student turned into a junior girl, how marvelous. The cute little magical Gal-chan - I wonder what Mr. Lancelot would think."
  # 我会加油的！
  gts_aom_galahad_leader_catch_phrase: "I'll do my best!"
  # 英灵响应：加拉哈德·杜·拉克
  aom_leader.7.name: "Heroic Spirit Response: Galahad du Lac"
  # 加拉哈德：您好，我是加拉哈德，目前应该算是魔法少女.......还是圆桌骑士，啊头好疼，可能两者都是吧，唔，不知道学姐她们是怎么过来的。总之，我会努力成为您可靠的护盾\n梅里亚杜克：放平心态加拉哈德，你会成为一位优秀的骑士\n卡美洛：守护就放心交给我吧，白垩之壁与你同在\n
  aom_leader.7.desc: "Galahad: Hello, I am Galahad. Currently, I should be... a magical girl? Or a Knight of the Round Table? Ah, my head hurts; maybe both. Hmm, I wonder how Senpai and the others got here. Anyway, I will strive to be your reliable shield.\nMeryodock: Keep a calm mind, Galahad. You will become an excellent knight.\nCamelot: Leave the guardianship to me; the Chalk Walls are with you."
  # 角色详情
  aom_leader.7.a: "Character Details"
  # 冬木市一名平凡的三年级小学生。\n老家在法国西北部的卢瓦尔河地区，热讷-卢瓦尔河谷镇\n与传说中的圣杯骑士同名，但是具体原因我们不得而知\n
