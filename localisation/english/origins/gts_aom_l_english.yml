  shiro_desc: "\"\"
  # 希洛·冯·爱因兹贝伦
  NAME_shiro: "Shiro von Einzbern"
  # 重度姐控患者，又或者称之为，伊莉雅的正义伙伴！一个只是为了守护姐姐却因此拯救世界的女孩
  gts_aom_shiro_leader_desc: "A severe case of sister-complex, also known as Illya's Ally of Justice! A girl who, merely to protect her sister, ended up saving the world."
  # 我会加油的！
  gts_aom_shiro_leader_catch_phrase: "I'll do my best!"
  # 英灵响应：希洛·冯·爱因兹贝伦
  aom_leader.6.name: "Heroic Spirit Response: Shiro von Einzbern"
  # 哦？您好master？很高兴认识您，如果有需要帮忙的事情，就交给我吧，无论是战斗还是......我都会努力的。哦对了，你有看到我姐姐吗？
  aom_leader.6.desc: "Oh? Hello, Master? It's nice to meet you. If there's anything you need help with, just leave it to me; whether it's combat or... I'll do my best. Oh, by the way, have you seen my sister?"
