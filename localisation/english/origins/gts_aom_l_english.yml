  aom_ritual.9.name: "District Aging"
  #  仪式失控了，我们的一个城区的时间被大幅度跳跃，仿佛常年无人维护，严重老化，已经无法居住。所幸我们及时撤离出了原先的居民，并没有造成伤亡。
  aom_ritual.9.desc: "The ritual went out of control. Time in one of our districts has jumped forward significantly, appearing as if it had been unmaintained for years, severely aged, and no longer habitable. Fortunately, we evacuated the residents in time, preventing any casualties."
  #  糟糕，赶快救治伤员
  aom_ritual.9.a: "Oh no, treat the injured quickly"
  #  要被吃掉了？
  aom_leader_cg.2.name: "Going to be eaten?"
  #  在§Y[From.Planet.GetName]§!的居民们已经开始庆祝一年一度的愚人节活动，各种各样的玩笑话，恶作剧，不断刷新着人们的想象力。\n但是所有人都没有想到的是，伊莉雅丝菲尔小姐也想加入这场欢乐盛况，而星球表面的人还浑然不知，只有远处航行的星际飞船，和空间站观测到了这一幕。\n她巨大的身躯就这样毫无征兆地出现在了星球旁。\n“呀？大家看上去很开心呢，不介意让我也加入吧？” \n少女活泼的声音，通过魔力传递到每个人耳中。也许没有人知道 she 接下来想要做什么。\n“不给糖就捣蛋，啊对了，今天好像不是万圣节呢？那是不是……”\n像是假装想起来了，伊莉雅沉默了片刻，又露出一个笑容。\n“嘛，总之快点把糖果交出来哦” \n“糖果，我们上哪去找糖果？” \n众人皆是无语。\n“哎？没有吗？那就把大家当成糖果吃掉好啦” \n略带失望的表情，但是随即伊莉雅坏笑地张开最，指尖搭在星球上，当然也没有忘记使用魔法保护，避免星球被自己碰碎掉。\n“啊啊啊！” \n一阵惊恐的声音，所有人开始拼了命地逃窜，各种交通工具都在星球表面全速奔驰，只为了找到最近的星舰，从而逃亡，但很显然这么短的时间完全不够。\n“大家都要被伊莉雅吃掉啦，感觉有点羞耻呢” \n伴随着那活泼的声音，在绝望的目光中，白皙的手指将星球推入口中，似乎马上就要落在舌头上面。\n当然我们的飞船从太空视角可以看到，也许是因为口中含着无数生命的奇妙感觉，让伊莉雅小姐不由地面色通红，露出一个带着些许恶作剧意味的笑容。搭着地球的手也微微颤抖。\n“嘻嘻，吓到大家了吗？伊莉雅才不会做这种事情呢，那样就变成坏孩子啦。” \n但是少女的动作就在最后一步戛然而止，预想中恐怖的画面没有发生，巨大的手指突然改变了方向，将星球又从嘴里推了出来。\n“星球上的的大家，愚人节快乐呦！” \n露出恶作剧得逞的笑容，伊莉雅用调皮的声音向着星球招手。\n嗯，这或许会成为这个星球历史上最大的恶作剧。
