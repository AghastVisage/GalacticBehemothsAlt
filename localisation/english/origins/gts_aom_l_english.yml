  #  力量好像变强了，应该可以制造出更强的武器了，这样就可以......啊，希望姐姐不需要用到这些，嗯，没什么
  aom_leader.103.desc: "My power seems to have increased, so I should be able to create even stronger weapons. This way I can... Ah, I hope Big Sister won't need to use these. Um, it's nothing."
