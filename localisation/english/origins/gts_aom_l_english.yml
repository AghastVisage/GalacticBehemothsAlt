  aom_leader_cg.2.desc: "The residents of §Y[From.Planet.GetName]§! have begun celebrating their annual April Fool's Day activities. Various jokes and pranks are constantly pushing the limits of their imagination.\\\\nBut what no one expected was that Ms. Illyasviel also wanted to join this joyful occasion. While the people on the surface were still oblivious, only interstellar ships and space stations in the distance observed the scene.\\\\nHer massive body appeared next to the planet without any warning.\\\\n“Ah? Everyone looks so happy, you don't mind if I join too?”\\\\nThe girl's lively voice reached everyone's ears through magic. No one knew what she intended to do next.\\\\n“Trick or treat... ah wait, today isn't Halloween, is it? Then maybe...”\\\\nAs if pretending to remember, Illyasviel fell silent for a moment before flashing another smile.\\\\n“Anyway, hurry up and hand over the candy.”\\\\n“Candy? Where are we supposed to find candy?”\\\\nEveryone was speechless.\\\\n“Eh? There isn't any? Then I’ll just eat everyone as candy.”\\\\nWith a look of slight disappointment, Illyasviel then gave a mischievous grin and opened her mouth, her fingertip resting on the planet—not forgetting to use protective magic to keep the planet from being crushed.\\\\n“Aaaaah!”\\\\nA wave of terrified screams erupted as everyone began fleeing for their lives. All sorts of vehicles raced across the planet's surface to find the nearest starship for evacuation, but clearly, there wasn't enough time.\\\\n“Everyone is going to be eaten by Illya, feels a bit embarrassing,”\\\\nAccompanying that lively voice, and under desperate gazes, her white fingers pushed the planet toward her mouth, seemingly about to land on her tongue.\\\\nFrom a space perspective, our ships could see Ms. Illyasviel turning red, perhaps due to the wonderful sensation of holding countless lives in her mouth, wearing a smile filled with mischief. The hand holding the planet trembled slightly.\\\\n“Heehee, did I scare everyone? Illya wouldn't do such a thing, that would make me a bad girl.”\\\\nBut the girl's actions stopped at the final step. The expected horror didn't happen; her giant fingers suddenly changed direction and pushed the planet back out of her mouth.\\\\n“Happy April Fool's Day to everyone on the planet!”\\\\nWaving at the planet with a playful voice and a grin of a successful prank.\\\\nYes, this will likely become the greatest prank in the planet's history."
  aom_leader_cg.2.a: "That was thrilling"
  #  废弃城市清除
  aom_leader_cg.4.name: "Abandoned City Clearance"
  #  由于此前的仪式发生意外，§Y[From.Planet.GetName]§!的一片城区被加速时间导致严重老化，已经无法居住，必须进行重建，而在此之前，清理这么大规模的建筑群的开销依然是一个天文数字，需要耗费大量的人力物力，于是我们委托了骑士王阿尔托莉雅小姐来帮助我们完成清理工作。\n “就是这里吗？” \n在我们的观测中，阿尔托莉雅抵达星球表面，她站稳身形，高耸入云的身躯环顾四周，蹲下触摸地面。破败的城市被指尖轻易搅动，留下一条深深地沟壑。\n“被时间侵蚀的建筑残骸，看上去很严重呢，你们也真是不小心。” \n“所以才需要您来协助清理。” \n“嗯，好的，那我接下来该怎么做？” \n“想怎么做就怎么做，将这一片都夷为平地就好，对您来说应该不是难事，然后我们就可以开始准备重建工作，这片城区已经被废弃，没有人居住，可以放心施展。怎么做开心就好。” \n“这样啊……那就先用这个吧” \n听到我们的通讯，阿尔托莉雅轻轻抬起一只脚，精准的力道踏向一栋较高的大楼上，本就摇摇欲坠的大楼轰然倒塌。而这仅仅是一个开始，少女的鞋底不断落在破败的城市上面，第一次，第二次。很快就覆盖上了坑坑洼洼的鞋印。\n“阿尔托莉雅小姐，之前有其他从者反馈过，脱掉鞋子踩在上面好像挺舒服的，您想要试试吗？” \n“这、这种建议太失礼了！” \n阿尔托莉雅头上的呆毛猛地竖起，表情看上去十分严肃，隐约藏着一点害羞，眼神却不自觉地飘向了脚下的城市。\n“您也可以尝试一下，不要有太多拘束，而且我们的人民很乐意欣赏你们这样巨大又可爱的女孩子做这些事情时的样子，非常好看，毕竟也没有什么损失。还能产出一些周边，带动经济效应，当然我们会给您分红的。” \n“分红什么的……”听到这个提议，她看上去脸更红了，小声嘀咕着，犹豫了一会，还是小心地脱下一只鞋子，用黑色过膝袜包裹着的脚掌轻轻踩了上去。也许冰凉的触感就像沙子一样，十分细腻。\n“唔……确实……挺舒服，不对……”感觉到脚底那奇异的触感，阿尔托莉雅忍不住脱掉了另一只脚的鞋子，试探性地踩了踩，头上的呆毛愉快地晃动起来。又好像突然意识到什么，迅速板起脸。\n“但、但这只是为了更好地清理！” \n似乎是为了缓解尴尬，连步伐都加快了不少，认真地踩踏着脚下密集的建筑群，似乎还在小声嘀咕着什么。\n“既然是为了工作……偶尔放松一下应该也不是不可以，不对，我在想什么呢，还是赶快全部解决掉吧” \n说到一半，又晃了晃头，想让自己清醒一点。\n“这样子好像还是太慢了，还是动用一点魔力好了，只要注意小心一点，不要波及到其他地方” \n嗯，打定注意，阿尔托莉雅开始控制自己的力量，§Y[From.Planet.GetName]§!上的任何一位法师都能清晰的感觉到那强烈的魔力波动。\n“这样……应该就可以了” \n魔力汇聚形成气流就像一阵狂风席卷而过，将所有的建筑吹的粉碎。看着逐渐平整的地面，阿尔托莉雅露出满意的表情。 \n“嗯？看样子还剩下一些不起眼的小角落” \n低头看去，阿尔托莉雅发现原来不远处还有一小片城区侥幸留存了下来，于是快步走了过去。\n“其他地方也要仔细检查一下” \n抬起那美丽的脚掌，轻巧地踩了上去。\n“呼，终于结束了哦。” \n最后又花了一些时间对残余部分进行扫荡，整个废弃的城区被彻底夷为平地，阿尔托莉雅也轻轻呼出一口气，坐在地上休息。\n“辛苦您了，我们准备了一些茶点……感谢您的帮助” \n我们的法师使用传送魔法将提前准备好的一盘巨型甜点还有饮品送到她身边。\n“那我就不客气了……唔，真好吃” \n看着突然出现在身边的甜点，阿尔托莉雅开心地拿起了一块蛋糕放入口中,露出幸福的表情。相信这段有趣的影像很快会登上全国的社交媒体，广泛传播。\n当然也不要忘了，也许我们的重建工作该提上日程了？
  aom_leader_cg.4.desc: "Due to an accident during a previous ritual, a district on §Y[From.Planet.GetName]§! suffered from accelerated time leading to severe aging. It is uninhabitable and must be rebuilt. However, the cost of clearing such a massive complex of buildings remains astronomical, requiring vast amounts of labor and resources. Thus, we commissioned Ms. Artoria, the King of Knights, to assist with the cleanup.\\n“Is this the place?”\\nUnder our observation, Artoria arrived on the planet's surface. Her towering figure surveyed the surroundings before she knelt to touch the ground. The dilapidated city was easily churned by her fingertips, leaving a deep furrow.\\n“The remains of buildings eroded by time... it looks severe. You were quite careless.”\\n“That is why we need your assistance with the clearance.”\\n“I see. So, what should I do next?”\\n“Do whatever you like; simply leveling this area would suffice. It shouldn't be difficult for you, and then we can begin rebuilding. This district is abandoned and uninhabited, so you can act freely. Do whatever makes you happy.”\\n“I see... then let's start with this.”\\nHearing our communication, Artoria lightly raised a foot and stepped with precise force onto a tall building. The already teetering structure collapsed with a roar. And this was only the beginning. The girl's soles repeatedly descended upon the ruined city, once, twice. It was soon covered in pitted footprints.\\n“Ms. Artoria, other Servants have mentioned that stepping on things with bare feet feels quite nice. Would you like to try it?”\\n“S-such a suggestion is most improper!”\\nThe ahoge on Artoria's head stood up sharply. Her expression was serious, hiding a hint of shyness, but her eyes involuntarily drifted toward the city beneath her feet.\\n“You can give it a try. Don't be too constrained. Our people would love to watch a giant, cute girl like you doing such things; it's very beautiful, and there's no loss. It can even produce some merchandise to boost the economy, and of course, we will give you a share of the profits.”\\n“Profits and such...” Hearing this proposal, she looked even more flushed, muttering to herself. After hesitating for a moment, she carefully removed one shoe and gently stepped down with her foot wrapped in a black over-knee sock. Perhaps the cool sensation was as delicate as sand.\\n“Mm... it really... is quite comfortable. No...” Feeling the strange sensation under her foot, Artoria couldn't resist removing the other shoe and tentatively stepped around. The ahoge on her head swayed happily. Then, as if suddenly realizing something, she quickly reassumed a stern face.\\n“B-but this is only for a more efficient cleanup!”\\nTo alleviate the embarrassment, she even quickened her pace, earnestly treading upon the dense cluster of buildings, still muttering under her breath.\\n“Since it is for work... a bit of relaxation occasionally shouldn't be a problem. Wait, what am I thinking? Let's just finish this quickly.”\\nMid-sentence, she shook her head to clear her mind.\\n“This seems too slow after all. I should use some magic, as long as I'm careful not to affect other areas.”\\nHaving made up her mind, Artoria began to control her power. Any mage on §Y[From.Planet.GetName]§! could clearly feel the intense magical fluctuations.\\n“This... should be enough.”\\nThe magic converged into a localized windstorm that swept through, pulverizing all the buildings. Seeing the gradually leveling ground, Artoria wore a satisfied expression.\\n“Oh? It seems a few inconspicuous corners remain.”\\nLooking down, Artoria noticed a small part of the district had luckily survived nearby and walked over.\\n“The other areas must be checked thoroughly as well.”\\nRaising her beautiful foot, she stepped down lightly.\\n“Phew, it is finally over.”\\nAfter spending some more time clearing the remnants, the entire abandoned district was leveled. Artoria let out a soft breath and sat down to rest.\\n“Thank you for your hard work. We have prepared some refreshments... thank you for your help.”\\nOur mages used teleportation magic to send a giant tray of prepared desserts and drinks to her side.\\n“Then I shall accept... mm, delicious!”\\nSeeing the desserts suddenly appear, Artoria happily took a piece of cake and put it in her mouth, wearing a look of bliss. Surely this interesting footage will soon top national social media circles and spread widely.\\nOf course, let's not forget—perhaps our reconstruction work should be put on the agenda?"
  #  这下重建就方便多了
  aom_leader_cg.4.a: "Reconstruction will be much easier now"
  #  平静的野餐
  aom_leader_cg.7.name: "A Peaceful Picnic"
  #  在完成先期工作，各个部门都已经做好了迎接准备，希洛小姐来到了§Y[From.Planet.GetName]§!享受她的休闲时光，这也是所有人翘首以盼的事情。\n“那个，大家好啊，真是不好意思，让你们费这么多心思。” \n略带歉意的摸着后脑勺说，少女提着一个篮子出现在广阔的平原上。大量的飞艇在周围盘旋，大量警力被部署在周围维持秩序，并提前拉起了上百公里的警戒线，行星防卫部队也抽调了两个军团前来协助。而这些并不能阻碍居民们热情地欢呼声，为了让她能够看到，许多人打出了超大型礼花，或者使用投影设备，当然还有飞行表演喷射出显眼的彩色烟雾组成欢迎的字样。\n“哇，这是给我准备的吗？谢谢，大家都好热情啊” \n看着半空中的文字，希洛开心地说。\n“是个很漂亮的地方，看样子可以好好休息一会了” \n环顾四周，寻找了一块看上去比较整洁的地面，少女放下篮子，从里面取出了提前准备好的野餐垫，盖在了地面上，足以覆盖数百平方公里。\n“如果你们不介意的话…….我想把鞋子脱下来” \n少女带着羞涩说，应该没有人会拒绝这样的请求吧？答案已经很明显了。于是，很自然地，我们得到了欣赏少女足部的机会。\n“呼，感觉这样好像轻快了一些。阳光也很舒服，真是和平啊” \n将脱下来的皮鞋放到一边，被白丝包裹的脚掌轻盈地落在野餐垫上，然后坐了下来，双腿自然伸展，悠闲地仰望着蔚蓝的天空，从篮子里拿出一个三明治，小口品尝起来。许多的记者乘坐专用飞行器从不同角度记录下了这祥和的景象。\n“哎！你们在往哪里看呢？” \n像是某种直觉，希洛小姐低下头，随后便注意到那几艘靠在她脚边的飞艇。似乎还有摄影师为了拍摄完美的足部特写不顾劝阻想要靠近，好在我们的飞行单位及时拦下了他们。\n“感觉好难理解哦，你们就这么喜欢我的脚吗？” \n娇嫩地呵斥声，她的脸颊变得羞红，看着就像是在发烫一般，双脚不由自主地摆动起来，却又无可奈何。 \n“不行，不能给大家添麻烦，唔，还是好好尝尝有没有可以改进的地方。” \n于是，希洛小姐只把那些记者当成不存在，用食物转移注意力，但是脸上那某红色始终没有消失。\n“感觉一个人吃有点无聊，明明身边有这么多人…….” \n又咬了几口，少女表情有些枯燥，忽然眼前一亮，温和的笑容，向着民众发出邀请。\n“就这样让你们在旁边看着，也有点过意不去，大家陪我一起吃好啦” \n人群之中随即发出欢呼声，甚至发生了一些混乱，人潮开始冲击起了警戒线。\n“希洛小姐，请不要这样做，很危险的” \n“唔，抱歉哦，但是一个人真的很无趣哦，还是大家一起吃更开心一点” \n“好吧，但是请务必小心，不要造成更大的混乱” \n迫于她那真挚的眼神，我们只好下令缩紧封锁线，让民众可以与她更近距离接触，但依然要确保一定的安全距离，避免引发事故。\n由于野餐垫实在是太高了，就像一座城墙一般，一些有条件的人已经使用飞行手段快速接近，还有些人在边缘架起了足够车辆通行的斜坡，毕竟从边缘到达她所在的位置，依然有着数公里的距离，想要徒步完成并不是一件容易的事情。\n“料理还是要一起分享才更好吃，大家都来尝尝吧，是我亲手做的哦” \n甜美的声音，希洛小姐打开篮子向身旁的民众分享自己带来的美食，已经有运输队伍搬来的大量的桌椅，就仿佛是在举行一场盛大的庆典。食物的香气，甚至连临近的城市都弥漫着浓郁的香味，整个活动一直持续到午后。\n“居然还剩这么多？看样子之前做太多了。” \n目光扫过自己的篮子，里面还剩下相当可观数量的巨型料理。\n“就这样浪费了也不好，但是我自己也不好处理呢，嗯，那就都送给你们好了。” \n思索了片刻，少女决定将剩余的食物留给我们。\n“嗯，刚好有一点灵感，那最后在送你们一件礼物…..” \n仿佛突然有了新的想法，她的心念一动，一柄华丽的剑凭空出现在手中。\n“作为练习作品的话，应该还可以。” \n随意地挥舞了几下，希洛满意地点头，四处张望了一下，最后将目光落在一座山峰上，迈着轻快地步伐走了过去。\n“记得阿尔托莉雅不是有一把石中剑吗？嗯，这座山看上去就不错，那就放在这里好了” \n巍峨的山峰，在她身前，也不过是一块大一点的石头。她双手握住剑，高高举起。\n“嘿呀！”\n伴随着一声娇喝，那把巨大的剑就这样从山巅插了进去，深深地嵌入大地。\n“也许应该叫它山中剑？好像还挺有趣的，不过这里应该没有人能拔出来，希望你们会喜欢” \n于是希洛小姐在临走前还留下了大量的食物，以及一把非常巨大的剑，也许它可以成为§Y[From.Planet.GetName]§!上的一个新的地标。
  aom_leader_cg.7.desc: "After completing the preliminary work, all departments were ready for the reception. Ms. Shiro arrived at §Y[From.Planet.GetName]§! to enjoy her leisure time, which was also something everyone had been eagerly awaiting.\\n“Um, hello everyone. I'm so sorry for making you go through all this trouble.”\\nWith a slight apologetic scratch at the back of her head, the girl appeared on the vast plains carrying a basket. A large number of airships hovered around, and a significant police force was deployed to maintain order, with a perimeter of hundreds of kilometers set up in advance. The planetary defense forces also dispatched two legions to assist. However, these did not deter the residents' enthusiastic cheers. To ensure she could see them, many people set off massive fireworks or used projection devices, and there were also flight performances spraying conspicuous colored smoke to form welcoming words.\\n“Wow, is this all for me? Thank you, everyone is so warm!”\\nLooking at the words in the sky, Shiro said happily.\\n“It's a very beautiful place. It looks like I can have a good rest for a while.”\\nLooking around for a clean spot on the ground, the girl put down her basket and took out a pre-prepared picnic mat, spreading it over the surface, enough to cover hundreds of square kilometers.\\n“If you don't mind... I'd like to take off my shoes.”\\nThe girl said with a hint of bashfulness. Surely no one would refuse such a request? The answer was already obvious. Thus, naturally, we were given the opportunity to admire the girl's feet.\\n“Phew, that feels a bit lighter. The sunlight is also very comfortable. It's truly peaceful.”\\nSetting her removed leather shoes aside, her feet, encased in white silk, landed lightly on the picnic mat. She then sat down, her legs stretching naturally as she gazed leisurely at the blue sky. Taking a sandwich from her basket, she began to taste it in small bites. Many journalists in special flight vehicles recorded this serene scene from different angles.\\n“Hey! Where are you looking?”\\nLike some kind of intuition, Shiro lowered her head and noticed several airships clustered near her feet. It seemed some photographers, in their quest for the perfect close-up of her feet, tried to approach despite warnings. Fortunately, our flight units intercepted them in time.\\n“It's so hard to understand... do you really like my feet that much?”\\nA delicate scolding, her cheeks flush with a deep red, looking as if they were burning. Her feet kicked involuntarily, yet she was helpless.\\n“No, I can't cause trouble for everyone. Mm, I should just focus on tasting this and see if there's anything to improve.”\\nThus, Shiro chose to treat those journalists as if they didn't exist, using food to divert her attention, though the red on her face never truly faded.\\n“Eating alone feels a bit boring, even with so many people around...”\\nAfter a few more bites, the girl's expression turned a bit dull. Suddenly, her eyes lit up, and with a gentle smile, she extended an invitation to the public.\\n“Keeping you all watching from the side makes me feel a bit bad. Why don't you all join me for the picnic!”\\nCheers immediately erupted from the crowd, and some chaos ensued as the throng began to press against the perimeter.\\n“Ms. Shiro, please don't do that. It's very dangerous.”\\n“Um, sorry, but eating alone is really dull. It's much more enjoyable to eat together with everyone.”\\n“Alright, but please be careful and don't cause any major chaos.”\\nPressed by her sincere gaze, we had no choice but to order the tightening of the blockade while allowing the public to get closer to her, though a safe distance was still maintained to prevent accidents.\\nSince the picnic mat was so high—like a city wall—those with the means used flying vehicles to quickly approach. Others set up ramps at the edges wide enough for vehicles, as the distance from the edge to her position was still several kilometers, making it difficult to traverse on foot.\\n“Food is always better when shared. Come and try some, everyone; I made it myself!”\\nWith a sweet voice, Shiro opened her basket to share the delicacies she had brought with the nearby citizens. Transport teams had already brought in a large number of tables and chairs, making it feel like a grand celebration. The aroma of the food was so strong it even filled the nearby cities. The event continued well into the afternoon.\\n“There's so much left? I guess I made too much earlier.”\\nGlancing over her basket, a considerable amount of giant-sized dishes remained.\\n“It's not good to let it go to waste, but I can't handle it all myself. Well, I'll just give it all to you then.”\\nAfter a moment's thought, the girl decided to leave the remaining food for us.\\n“Hmm, I just had a bit of inspiration. One last gift for you all...”\\nAs if struck by a new idea, a magnificent sword appeared in her hand with a single thought.\\n“As a practice piece, it should be alright.”\\nAfter a few casual swings, Shiro nodded in satisfaction. Looking around, her gaze finally landed on a mountain peak, and she walked toward it with light steps.\\n“I remember Artoria had a Sword in the Stone, right? Hmm, this mountain looks pretty good. I'll just leave it here then.”\\nThe towering peak was no more than a slightly larger rock before her. She gripped the sword with both hands and held it high.\\n“Heiyah!”\\nWith a delicate shout, the massive sword was thrust down from the mountaintop, deeply embedding itself into the earth.\\n“Maybe it should be called the Sword in the Mountain? It seems quite interesting. Though probably no one here can pull it out. I hope you like it.”\\nThus, before leaving, Shiro left behind a vast amount of food and an enormous sword, which might just become a new landmark on §Y[From.Planet.GetName]§!."
