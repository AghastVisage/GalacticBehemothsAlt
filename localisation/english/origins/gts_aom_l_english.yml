l_english:
  # 神圣帝国制
  auth_hales_panlon: "Holy Imperial System"
  # 神圣帝国由圣皇作为最高统治者，拥有绝对的权威，但同样这个体制要求皇帝是一位开明且从谏如流的明君，皇帝是国家的第一公仆，向全体国民负责。
  auth_hales_panlon_desc: "The Holy Empire is ruled by the Holy Emperor as the highest authority, possessing absolute power. However, this system also requires the Emperor to be an enlightened monarch who listens to advice. The Emperor is the first servant of the state and is responsible to all citizens."
  # 普世帝国
  gov_panlon_commission_federal: "Universal Empire"
  # 一个开放且繁荣的庞大帝国，任何智慧生命，无论来自何方，无论是何种族，只要愿意为之献身，为了共同的信仰而奋斗，都可以享有平等的地位，获得帝国公民的身份，帝国的疆域将会不断扩张，直到世界尽头。
  gov_panlon_commission_federal_desc: "A vast, open, and prosperous empire. Any intelligent life, no matter where they come from or what race they are, as long as they are willing to dedicate themselves to it and fight for a common belief, can enjoy equal status and obtain the identity of an imperial citizen. The territory of the empire will legally expand until the end of the world."
  # 骑士之国
  civic_panlon_knights: "Nation of Knights"
  # 这个文明的战士在与巨大生物的搏斗中磨炼出了坚韧的意志和惊人的力量，亘古不变的骑士精神贯彻其中，挑战强大的生物，将其击败，乃至得到认可成为伙伴。\n\n解锁特殊建筑§H骑士堡§!
  civic_panlon_knights_desc: "This is a nation of knights. No matter how the times change, the eternal chivalry runs through it. This ancient group has always played a vital role.\n\nUnlocks special building §HKnight's Castle§!"
  # 法师协会
  civic_panlon_Wizard: "Mages Guild"
  # 探索未知是法师们永恒的追求，而协会的存在可以更好的帮助他们相互交流。\n\n解锁特殊建筑§H法师塔§!
  civic_panlon_Wizard_desc: "Exploring the unknown is the eternal pursuit of mages, and the existence of the guild can better help them communicate with each other.\n\nUnlocks special building §HMage Tower§!"
  # 人皇之嗣
  origin_panlon: "Scion of the Human Emperor"
  # 这个文明乃至星球的诞生都是由于某位被冠以人皇之名的神秘少女一时兴起所为，她用母亲般的温柔精心照料，指引并庇护着她的子嗣，直至步入星空，无论过去多么漫长时光，这位强大的存在将会是这个文明最坚实的后盾。
  origin_panlon_desc: "The birth of this civilization and even the planet was due to the whim of a mysterious girl crowned with the name of the Human Emperor. She cared for it with motherly tenderness, guiding and protecting her children until they stepped into the stars. No matter how long the past has been, this powerful existence will be the most solid backing for this civilization."
  # —$HOME_SYSTEM$你的文明受到一位强大存在 §I人皇§! 的保护，可以通过通讯面板向她寻求帮助
  civic_tooltip_origin_panlon_effects: "- $HOME_SYSTEM$Your civilization is protected by a powerful existence, the §IHuman Emperor§!, and you can seek her help through the communication panel"
  # 自诞生起，我们的文明就在母亲的怀抱中成长，那看似年幼而柔弱的身躯却拥有着超乎我们想象的庞大力量，无论何等危机的处境，只要有母亲在，一切都将迎刃而解，也许整个世界，乃至宇宙都不过是她的玩物。但她却将温柔赐予了我们，可以自豪的说，也许我们就是宇宙中最幸运的文明。科技与魔法的交织，缔造了这个奇迹般的国度，再漫长的过去，我们的父辈倾听着母亲对星空的描绘，母亲的话语中总是饱含着对我们未来的期待，而现在，是时候回应这份期待，我们将亲手揭开那神秘的面纱。
  START_SCREEN_PANLON: "Since birth, our civilization has grown in the embrace of our Mother. That seemingly young and weak body possesses immense power beyond our imagination. No matter how critical the situation, as long as Mother is here, everything will be solved. Perhaps the whole world, and even the universe, is just her plaything. But she has bestowed her tenderness upon us. We can proudly say that perhaps we are the luckiest civilization in the universe. The interweaving of technology and magic created this miraculous country. In the long past, our fathers listened to Mother's description of the starry sky. Mother's words were always full of expectations for our future. Now, it is time to respond to this expectation. We will personally unveil that mysterious veil."
  # 长矛兵团
  aom_Spearmen_Panlon: "Spearmen Corps"
  # 结成战阵的长矛兵团就像乐高一样扎疼巨娘的脚底，一些不注意脚下的笨蛋巨娘很容易被一拥而上的小人们打倒捕获
  aom_Spearmen_Panlon_desc: "The Spearmen formed in battle arrays hurt the soles of Giantesses like Lego bricks. Some clumsy Giantesses who don't watch their step are easily knocked down and captured by the swarming tinies."
  # 猎人
  aom_Huntsmen_panlong: "Huntsmen"
  # 猎人总是神出鬼没，狩猎各种巨型生物，他们大多对巨娘有着异常的执着。为此请务必禁止猎人私自进入巨娘的活动区域，以保障她们的人身安全。
  aom_Huntsmen_panlong_desc: "Huntsmen are always elusive, hunting various giant creatures. Most of them have an abnormal obsession with Giantesses. Therefore, please strictly prohibit Huntsmen from entering the Giantess's activity area privately to ensure their personal safety."
  # 骑士堡
  building_knights_Castle: "Knight's Castle"
  # 庄严肃穆的堡垒，让所有人望而生畏，同时也是骑士们和他们的泰坦少女一同训练成长的地方。
  building_knights_Castle_desc: "The solemn fortress makes everyone stand in awe. The empire's most elite warriors are all inside."
  # 温泉疗养所
  building_aom_magichotspring_sanatorium: "Hot Spring Sanatorium"
  # 优质的魔力温泉，提供最优质的服务，并产出一定的魔力结晶
  building_aom_magichotspring_sanatorium_desc: "0\"High-quality magic hot springs, providing the best services and producing a certain amount of magic crystals.\"
  # 法师塔楼
  building_Wizards_Tower: "Wizard's Tower"
  # 妙趣横生的住所，可供法师和他们的元素巨娘研究以及休息。
  building_Wizards_Tower_desc: "Wizards are often eccentric, and their dwellings are naturally full of fun and oddities."
  # 皇家周边专卖店
  building_aom_surrounding_stores: "Royal Merchandise Store"
  # 皇家特许的周边商店，小说，漫画，手办，海报，各类周边应有尽有
  building_aom_surrounding_stores_desc: ""A Royal-licensed merchandise store offering everything from novels and comics to figurines, posters, and all kinds of merchandise.""
  # 乐福鞋娱乐中心
  building_aom_Entertainment_Center: "Loafer Entertainment Center"
  # 用法拉穿过的鞋子改造的娱乐中心，似乎还残留着某种独特的香味久久无法散去，因此异常火爆。
  building_aom_Entertainment_Center_desc: "An entertainment center remodeled from shoes worn by Fara. It seems that a unique fragrance still lingers and cannot be dispersed for a long time, making it extremely popular."
  # 贝雷帽渔场
  building_aom_fishing_grounds: "Beret Fishery"
  # 用小学生的帽子当做渔场？真是个有趣的想法，通过魔法加护的帽子带着神秘的力量，可以提供高品质的鱼类，作为优质食材，还有很多的副产物奢侈品
  building_aom_fishing_grounds_desc: "Using a schoolchild's hat as a fishery? Truly an interesting idea. The hat protected by magic carries mysterious power, providing high-quality fish as premium ingredients, and many byproduct luxury goods."
  # 丝袜酒店
  building_aom_stockings_hotel: "Stockings Hotel"
  # 用带着残香软绵绵的丝袜改造而成的酒店，虽然让她感觉有些羞耻，不过总归还是让我们借到了，十分舒服。
  building_aom_stockings_hotel_desc: "A hotel converted from a soft, fragrant pair of stockings. Although it makes her feel a bit ashamed, she eventually let us use it, and it's very comfortable."
  # 瓶装餐厅
  building_aom_bottled_restaurant: "Bottled Restaurant"
  # 由少女收藏的瓶中船改装而成的高档餐厅，提供奢侈精致的餐点，它的灵感似乎来自某部动画片？
  building_aom_bottled_restaurant_desc: "A high-end restaurant converted from a ship-in-a-bottle collected by the girl, providing luxurious and exquisite meals. Its inspiration seems to come from a certain animation?"
  # 巨型矿井
  building_aom_giant_mine: "Giant Mine"
  # 少女只是随意地用指尖描绘大地，一个巨型矿坑变由此形成，各式各样深埋地底的矿物尽数暴露在我们的眼皮子底下，等待开采。
  building_aom_giant_mine_desc: "The girl merely traced the ground casually with her fingertip, and a giant crater was formed, exposing all kinds of minerals buried deep underground right before our eyes, waiting to be mined."
  # 大图书馆
  building_aom_library: "Great Library"
  # 小学生可爱的书包，但是对我们来说是如此巨大，足以放下数不清的书籍，当做图书馆正好。
  building_aom_library_desc: "A primary student's cute schoolbag, yet for us it is so immense that it can hold countless books, making it perfect for a library."
  # 铅笔盒铸造厂
  building_aom_pencil_box_foundry: "Pencil Case Foundry"
  # 用一个平平无奇但十分巨大的铅笔盒改造而成的大型工厂，搭载了极其特殊的火焰熔炉以极高的效率生产合金。
  building_aom_pencil_box_foundry_desc: "A large-scale factory converted from an ordinary but enormous pencil case, equipped with an extremely special flame furnace to produce alloys with extremely high efficiency."
  # 抵抗军堡垒
  building_aom_resistance_fortress: "Resistance Fortress"
  # 比起待宰的羔羊，有些巨娘会更喜欢具备一定攻击性的猎物，提供软弱无力的抵抗，然后将其碾碎，因此我们设置了抵抗军营地为巨娘们的游乐增添一些乐趣，同时还可以训练士兵，积累与巨娘作战的经验。
  building_aom_resistance_fortress_desc: "Some Giantesses prefer aggressive prey over lambs for the slaughter, offering weak resistance only to be crushed. Therefore, we have established Resistance Camps to add some fun to the Giantesses' play, while also training soldiers and accumulating experience in fighting Giantesses."
  # 小人摄影棚
  building_aom_photography_studio: "Tiny Person Photography Studio"
  # 专业的摄影棚，供摄影师们将巨娘们的破坏过程拍摄下来，并让更多人欣赏。
  building_aom_photography_studio_desc: "A professional photography studio for photographers to capture the destruction process of the Giantesses, allowing more people to admire it."
  # 大型地标
  building_aom_large_landmark: "Large Landmark"
  # 在城区之中增加一些具有特色的地标建筑，这些鹤立鸡群的特殊建筑总是能吸引巨娘破坏的欲望。
  building_aom_large_landmark_desc: "Adding some distinctive landmark buildings in the urban areas; these unique structures that stand out from the crowd always attract the Giantesses' desire for destruction."
  # 圣皇
  councilor_ruler_kanlon: "Holy Emperor"
  # 圣皇是帝国唯一的统治者，
  councilor_ruler_kanlon_desc: "The Holy Emperor is the sole ruler of the empire,"
  # 首席法师
  councilor_panlon_Wizard: "Chief Mage"
  # 法师协会的领袖，往往由最渊博的智者担任
  councilor_panlon_Wizard_desc: "The leader of the Mages Guild usually served by the most knowledgeable sage."
  # 大团长
  councilor_kancolle_knights: "Grand Master"
  # 帝国骑士团大团长，只有最优秀的骑士能够胜任这份职务
  councilor_kancolle_knights_desc: "Grand Master of the Imperial Knights. Only the most excellent knight can be competent for this position."
  # 人皇子嗣
  aom.1.name: "Scion of the Human Emperor"
  # 这是以信仰为纽带，生命的连结，将一切献给我们的母亲，化作她力量的一部分，人皇所在，文明便永垂不朽。
  aom.1.desc: "This is the bond of life tied by faith, dedicating everything to our mother, transforming into part of her power. Where the God-Emperor is, civilization becomes immortal."
  # 我等皆为人皇子嗣
  aom.1.a: "We are all Scions of the Human Emperor"
  # 法拉尔达
  NAME_fara: "Faralda"
  # 母亲的讯息
  fara.2.name: "Mother's Message"
  # 很高兴能看到你们步入星空，我的孩子，不必担忧，未来的路我也会一直陪伴在你们身边，哦，当然可不能什么事情都依靠妈妈呦，你们总得学会独立。
  fara.2.desc: "I am very happy to see you step into the stars, my child. Don't worry, I will always be with you on the road ahead. Oh, of course, you can't rely on Mom for everything, you have to learn to be independent."
  # 我们不会让您失望的，母亲！
  fara.2.option: "We won't let you down, Mother!"
  # 呀呼，好孩子，有什么需要帮助吗？
  fara.3.a.desc: "Yaho, good boy, do you need any help?"
  # 法拉尔达
  fara.TRANSMISSION: "Faralda"
  # 法拉尔达
  fara.3.title: "Faralda"
  # 想要零花钱
  fara.3.a: "Want Pocket Money"
  # 法拉会给乖孩子一些资源当零花钱，省着点用哦
  fara_3_a: "Fara will give good children some resources as pocket money, save it."
  # 我们有一个请求
  fara.3.b: "We have a request"
  # 和法拉酱进行亲密的母子互动（造成的破坏会在一段时间后恢复，不用担心，法拉酱是好孩子哦，备注：由于互动可以无限刷资源，所以暂时取消了所有互动选项的资源奖励和其他效果，仅用于观看剧情，后续将会优化调整）
  fara_3_b: "Have intimate mother-child interaction with Fara-chan (the damage caused will be restored after a period of time, don't worry, Fara-chan is a good girl)"
  # 我们需要英灵
  fara.3.c: "We need Servants (Designated Summon)"
  # 消耗圣晶石或者无记名灵基召唤英灵
  fara_3_c: "Spend 900 Saint Quartz for a designated summon."
  # 我们需要奇迹
  fara.3.d: "We need Servants (Random Summon)"
  # 信仰商城可以消耗信仰值兑换各种增益效果
  fara_3_d: "Spend 3 Saint Quartz for a random summon, small chance to get a Servant."
  # 再见
  fara.3.h: "Goodbye"
  # 再见，母亲
  quit_fara: "Goodbye, Mother"
  # 零花钱
  fara.4.name: "Pocket Money"
  # 哦，零花钱嘛？当然可以啦，你们需要什么？
  fara.4.desc: "Oh, pocket money? Of course, what do you need?"
  # 电力
  fara.4.a: "Credits"
  # 饭饭
  fara.4.b: "Food"
  # 材料
  fara.4.c: "Materials"
  # 合金
  fara.4.d: "Alloys"
  # 手办
  fara.4.e: "Figures"
  # 小钱钱
  fara.4.f: "Pocket Money"
  # 让我再想想
  fara_return_to_main: "Let me think again"
  # 再见，母亲
  fara_exit: "Goodbye, Mother"
  # 法拉尔达
  fara.5.name: "Faralda"
  # 请求吗？说来让妈妈听听
  fara.5.desc: "A request? Tell Mom."
  # 请用您美丽的裸足踩扁我们的城市吧
  fara.5.a: "Please flatten our city with your beautiful bare feet"
  # 请用您的脚夹住我们的星球
  fara.5.b: "Please clamp our planet with your feet"
  # 法拉尔达的踩踏小游戏
  fara.6.name: "Faralda's Trampling Minigame"
  # 哎？想要人家踩你们，嗯，那好吧，刚好也很无聊呢，就和你们一起玩玩吧。
  fara.6.desc: "Eh? You want me to step on you? Hmm, okay then. I'm bored anyway, so I'll play with you."
  # 妈妈最好啦！
  fara.6.a: "Mom is the best!"
  # 法拉尔达的踩踏小游戏
  fara.7.name: "Faralda's Trampling Minigame"
  # 那么，城市里的大家注意哦，人家的脚要落下来咯
  fara.7.desc: "Then, everyone in the city, pay attention, my foot is coming down."
  # 嗯！
  fara.7.a: "Yes!"
  # 法拉尔达的踩踏小游戏
  fara.8.name: "Faralda's Trampling Minigame"
  # 轰！
  fara.8.desc: "Boom!"
  # 啊，脚滑了
  fara.8.a: "Ah, my foot slipped"
  # 法拉尔达的踩踏小游戏
  fara.9.name: "Faralda's Trampling Minigame"
  # 
  fara.9.desc: """"
  # 认真看着
  fara.9.a: "Watching intently"
  # 法拉尔达的踩踏小游戏
  fara.10.name: "Faralda's Trampling Minigame"
  # 嘻嘻，都被踩扁了呢
  fara.10.desc: "Hehe, everyone got flattened."
  # prpr
  fara.10.a: "prpr"
  # 法拉尔达的踩踏小游戏
  fara.11.name: "Faralda's Trampling Minigame"
  # 大家都是好孩子呢，人家玩的很开心哦，唔，也该把造成的破坏恢复了呢，可不能给大家添麻烦。
  fara.11.desc: "Everyone is a good child. I had a lot of fun. Well, it's time to restore the damage caused. I can't cause trouble for everyone."
  # 嗯嗯
  fara.11.a: "Mmhmm"
  # 法拉尔达的星球游戏1
  fara.12.name: "Faralda's Planet Game 1"
  # 唔，又是奇怪的兴趣呢，真是的，就满足你们好啦
  fara.12.desc: "Hmm, another strange interest. Really, I'll just satisfy you then."
  # 好耶
  fara.12.a: "Yay"
  # 法拉尔达的星球游戏1
  fara.13.name: "Faralda's Planet Game 1"
  # 这么用脚夹着东西会不会不太礼貌呢，但是感觉很有趣呢。巨大的脚掌将整个星球夹在中间，浓郁的体香充斥着鼻腔，星球上所有的生物都沉浸在这奇妙的气息中。
  fara.13.desc: "Is it impolite to hold things with my feet like this? But it feels very interesting. The huge sole clamps the entire planet in the middle, and the rich body scent fills the nasal cavity. All creatures on the planet are immersed in this wonderful scent."
  # 妈妈的黑丝脚脚，嘿嘿
  fara.13.a: "Mom's black stocking feet, hehe"
  # 法拉尔达的星球游戏1
  fara.14.name: "Faralda's Planet Game 1"
  # 呼，偶尔这么玩一会也不错呢，嘻嘻，大家都被人家的体香迷住了呢。少女慢慢将脚掌松开
  fara.14.desc: "Phew, it's not bad to play like this occasionally. Hehe, everyone is fascinated by my body scent. The girl slowly released her soles."
  # 看来体香还要持续一段时间
  fara.14.a: "It seems the body scent will last for a while"
  # 随机召唤
  fara.15.name: "Servant Summoning"
  # 想试试运气吗？那就祝你好运啦，孩子
  fara.15.desc: "Do you need a Servant? Then you have to prepare enough Saint Quartz first."
  # 这是圣晶石
  fara.15.a: "Here are the Saint Quartz"
  # 不了，我还是在想想
  fara.15.y: "No, I'll think about it more."
  # 抱歉妈妈，我该走了
  fara.15.z: "Sorry Mom, I have to go."
  # 法拉尔达 冯 柳道尔罗根
  NAME_aom_fara_leader: "Faralda von Ryudorlogen"
  # 为了追寻最初的平凡，而以此等形态现界，自认为平平无奇，实则拥有无上伟力的少女。
  gts_aom_fara_leader_desc: "In pursuit of original mediocrity, this girl manifested in such a form; she considers herself ordinary, but in reality, she possesses supreme power."
  # 接下来请多关照呀，好孩子
  gts_aom_fara_leader_catch_phrase: "Please take care of me from now on, good child."
  # 法拉尔达 冯 柳道尔罗根
  aom_fara_leader.1.name: "Faralda von Ryudorlogen"
  # 真是不让人省心的孩子呢，那就帮帮你们好啦
  aom_fara_leader.1.desc: "What a worrisome child. Then I'll help you."
  # 角色详情
  aom_fara_leader.1.a: "Character Details"
  # 穿着穗群原学园小学部的制服\n赤发红瞳，充满活力就像火焰一样。\n 看上去只是个普通的女孩子\n据说来自某个小贵族家庭\n好像并没有什么特别的地方\n当然这是虚假的信息\n以saber职阶现界基于过去的自己而创造的降格灵基，其真正的灵基是——MankindEmperor，世界的统治者和守护者\n
  aom_fara_leader.1.a.response: "Wearing the uniform of Homurahara Academy Elementary School.\nRed hair and red eyes, full of vitality like fire.\nLooks like just an ordinary girl.\nSaid to be from a minor noble family.\nSeems to have nothing special.\nOf course, this is false information.\nA downgraded Spirit Origin created based on her past self, manifested in the Saber class. Her true Spirit Origin is - MankindEmperor, the ruler and guardian of the world.\n"
  # 个人资料1
  aom_fara_leader.1.b: "Profile 1"
  # 身高／体重:135cm•30kg\n出处：Fate/OdeluoLang\n地域：德国\n属性：秩序•善　　副属性：人　　性别：女性\n冠以人皇之名的少女，为守护世界而来\n 
  aom_fara_leader.1.b.response: "Height/Weight: 135cm • 30kg\nSource: Fate/OdeluoLang\nRegion: Germany\nAlignment: Lawful Good    Attribute: Human    Gender: Female\nA girl crowned with the name of Human Emperor, came to protect the world.\n"
  # 个人资料2
  aom_fara_leader.1.c: "Profile 2"
  # 
  aom_fara_leader.1.c.response: """"
  # 个人资料3
  aom_fara_leader.1.d: "Profile 3"
  # 
  aom_fara_leader.1.d.response: """"
  # 个人资料4
  aom_fara_leader.1.e: "Profile 4"
  # 『斩破终焉之剑』\n阶级：EX　种类：人皇宝具\nSchneiden Das Ende\n将一千万人类勇士的英魂汇聚到剑中\n以牺牲自己和旧世界为代价发动\n斩破终焉的终极宝具\n也被称为人类文明的绝唱\n在此剑之下，一切敌人都将泯灭。\n而其余威将斩破虚空，并以此开辟新世界。
  aom_fara_leader.1.e.response: "『Sword that Severs the End』\nRank: EX    Type: Human Emperor Noble Phantasm\nSchneiden Das Ende\nGathers the heroic spirits of ten million human warriors into the sword.\nActivated at the cost of sacrificing herself and the old world.\nThe ultimate Noble Phantasm that severs the end.\nAlso known as the swan song of human civilization.\nUnder this sword, all enemies will be annihilated.\nAnd its aftermath will shatter the void and open up a new world."
  # 个人资料5
  aom_fara_leader.1.f: "Profile 5"
  # 
  aom_fara_leader.1.f.response: """"
  # 个人资料6
  aom_fara_leader.1.g: "Profile 6"
  # 世界尽头的彼岸，拥抱真正的幸福\n这便是她，这名注定不凡的少女唯一的目的，为了守护有她存在的世界，于王座之上守望六千万年。\n直到终焉降临，新世界将带着蓬勃的生命力在旧世界的残骸上焕发生机。\n一个所有人都能被温柔对待，不再有痛苦和哭泣的世界。
  aom_fara_leader.1.g.response: "To embrace true happiness on the other side of the end of the world.\nThis is her only purpose, this designated extraordinary girl. To protect the world where she exists, she watched over it from the throne for sixty million years.\nUntil the end comes, the new world will glow with vigorous vitality on the wreckage of the old world.\nA world where everyone can be treated gently, and where there is no more pain and weeping."
  # 拜托您了
  aom_fara_leader.1.h: "Please"
  # 法拉尔达和伊莉雅
  NAME_fara_illya: "Faralda and Illya"
  # 伊莉雅
  NAME_illya: "Illya"
  # 神秘设施
  aom_Ruby_digsite: "Mysterious Facility"
  # 我们的星球上凭空出现了一座雪山，雪山上似乎隐藏着某栋设施
  aom_Ruby_digsite_desc: "A snowy mountain appeared out of thin air on our planet, and a facility seems to be hidden on the mountain."
  # 神秘设施
  illya.1.name: "Mysterious Facility"
  # 我们的星球上凭空出现了一座雪山，雪山上似乎隐藏着某栋设施
  illya.1.desc: "A snowy mountain appeared out of thin air on our planet, and a facility seems to be hidden on the mountain."
  # 组织探索队前去调查
  illya.1.a: "Organize an exploration team to investigate"
  # 长廊
  illya.2.name: "Corridor"
  # 我们成功破解了大门的安保，这里似乎是某种研究机构，继续前进是一条漫长的走廊
  illya.2.desc: "We successfully cracked the security of the gate. This seems to be some kind of research institution. Moving forward is a long corridor."
  # 继续前进
  illya.2.a: "Move forward"
  # 主控室
  illya.3.name: "Main Control Room"
  # 这里应该是设施的核心区域
  illya.3.desc: "This should be the core area of the facility."
  # 看看能不能回收一些有价值的东西
  illya.3.a: "See if anything valuable can be recovered"
  # 房间
  illya.4.name: "Room"
  # 一个普通的房间，但是莫名有某种熟悉的感觉
  illya.4.desc: "An ordinary room, but somehow it feels familiar."
  # 熟悉的样子？
  illya.4.a: "Familiar look?"
  # 闪光
  illya.5.name: "Flash"
  # 就在我们准备继续搜查的时候，一道刺眼的光芒闪过，下一刻，似乎有什么东西出现在面前
  illya.5.desc: "Just as we were about to continue searching, a blinding light flashed, and the next moment, something seemed to appear in front of us."
  # 这是？一个奇怪的手杖！
  illya.5.a: "Is this? A strange cane!"
  # 奇怪的手杖
  illya.6.name: "Strange Cane"
  # 太好了！终于有人进来了，我都快闷死了
  illya.6.desc: "Great! Someone finally came in. I was suffocating."
  # 你是谁？
  illya.6.a: "Who are you?"
  # 奇怪的手杖
  illya.7.name: "Strange Cane"
  # 哦呀，是陌生的面孔，初次见面，我是爱与正义的魔杖，红宝石之星
  illya.7.desc: "Oh my, a strange face. Nice to meet you, I am the Magical Wand of Love and Justice, Ruby Star."
  # 看上去很可疑的样子
  illya.7.a: "Looks suspicious"
  # 红宝石
  illya.8.name: "Ruby"
  # 你刚刚感觉很可疑对吧？就像master第一次见面时那样
  illya.8.desc: "This is a research institution called Chaldea. For some unknown reason, it was transported here. I don't know the specific situation."
  # 这是什么地方？
  illya.8.a: "Why are you here?"
  # 红宝石
  illya.9.name: "Ruby"
  # 关于这个问题我也不清楚， 非常莫名其妙，好像是被某种神秘力量送了过来
  illya.9.desc: "I'm not clear about this question either. It's very baffling, as if sent here by some mysterious power."
  # 好奇怪
  illya.9.a: "So strange"
  # 红宝石
  illya.10.name: "Ruby"
  # 总之言归正传，我和我的master走散了，可以请面前的这位好心人帮我找到她吗？
  illya.10.desc: "Anyway, back to business. I got separated from my master. Can I ask this kind person in front of me to help me find her?"
  # 没问题，她在哪里？
  illya.10.a: "No problem, where is she?"
  # 如果导航没错的话，她应该在附近的某个星系，我能感觉到，跟我来吧！
  illya.10.a.response: "If the navigation is correct, she should be in a nearby galaxy. I can feel it. Follow me!"
  # 伊莉雅
  _title: "Illya"
  # 伊莉雅剧情触发器
  edict_illya_plot_trigger: "Illya Plot Trigger"
  # 遭遇
  illya.1001.name: "Encounter"
  # 刚刚脱离超空间，我们注意到远处有一位天体级少女漂浮在虚空中，似乎正在睡觉？没错，她就在那里，那就是我的master
  illya.1001.desc: "Just after exiting hyperspace, we noticed a celestial-class girl floating in the void in the distance. She seems to be sleeping? That's right, she is there. That is my master."
  # 你的master？好大！
  illya.1001.a: "Your master? So big!"
  # 怀中星球
  illya.1002.name: "Planet in Arms"
  # 我们的飞船开始靠近，惊奇的发现，少女的怀中似乎抱着一个拥有原始文明的星球，根据我们检测，他们应该还处于青铜时代，也许她的任何一个细小举动都可能导致文明的灭亡，但是却奇迹般的安然无恙。
  illya.1002.desc: "Our spaceship began to approach, and surprisingly found that the girl seemed to be holding a planet with a primitive civilization in her arms. According to our detection, they should still be in the Bronze Age. Perhaps any small movement of hers could lead to the destruction of civilization, but they are miraculously safe and sound."
  # 看上去好危险
  illya.1002.a: "Looks dangerous"
  # 唤醒
  illya.1003.name: "Awakening"
  # 也许是察觉到有什么东西在靠近，天体级的少女慢慢活动了一下身体，揉了揉惺忪的眼睛，伸了个懒腰。
  illya.1003.desc: "Perhaps sensing something approaching, the celestial-class girl slowly moved her body, rubbed her sleepy eyes, and stretched."
  # 她要醒了！
  illya.1003.a: "She's waking up!"
  # 对视
  illya.1004.name: "Eye Contact"
  # 啊嘞？你们是从哪里过来的呀，小家伙。\n刚刚睁开眼睛，少女好奇地注视着我们。\n呀呼！终于找到你啦，伊莉雅桑，不过话说回来，你怎么变得这么大了！\n还未等我们回答，一旁的手杖上前打招呼。\n露比？原来你也在呀。\n多亏了这些好心人，帮我找到你。\n嗯，我感觉到你们身上有法拉的气息呢？你们和她是什么关系？\n
  illya.1004.desc: "Alé? Where did you come from, little ones?\nJust opening her eyes, the girl looked at us curiously.\nYaho! Finally found you, Illya-san. But having said that, how did you become so big!\nBefore we could answer, the cane on the side stepped forward to say hello.\nRuby? So you are here too.\nThanks to these kind people helping me find you.\nHmm, I feel Fara's aura on you? What is your relationship with her?\n"
  # 她是我们的母亲
  illya.1004.a: "She is our mother"
  # 神秘的天体级少女
  illya.1025.name: "Mysterious Celestial-class Girl"
  # 哎？你们是法拉的孩子呀，怪不得有这么熟悉的感觉呢
  illya.1025.desc: "Eh? You are Fara's children. No wonder there is such a familiar feeling."
  # 请问您和她是？
  illya.1025.a: "May I ask who you are to her?"
  # 神秘的天体级少女
  illya.1026.name: "Mysterious Celestial-class Girl"
  # 我是她的妻子哦
  illya.1026.desc: "I am her wife."
  # 啊？妈妈的妻子！？
  illya.1026.a: "Huh? Mom's wife!?"
  # 神秘的天体级少女
  illya.1027.name: "Mysterious Celestial-class Girl"
  # 是的哦，所以不介意的话，也可以把我当做你们的另一个妈妈
  illya.1027.desc: "Yes, so if you don't mind, you can also treat me as your other mother."
  # 嗯，两个妈妈？
  illya.1027.a: "Hmm, two moms?"
  # 法拉尔达
  illya.1020.name: "Faralda"
  # 哦？孩子们，你们找到伊莉雅了，妈妈这就过来！
  illya.1020.desc: "Oh? Children, you found Illya, Mom is coming right over!"
  # 哎？妈妈您什么时候？
  illya.1020.a: "Eh? Mom, when did you?"
  # 重逢
  illya.1005.name: "Reunion"
  # 好久不见呀！伊莉雅，我来啦。还未等我们反应过来，母亲已经出现在了星系中，可以注意到她欣喜的表情，向着这名少女热情地招手。
  illya.1005.desc: "Long time no see! Illya, I'm here. Before we could react, Mother had already appeared in the galaxy. We could notice her delighted expression as she waved enthusiastically to the girl."
  # 好事
  illya.1005.a: "Good thing"
  # 巨大的拥抱
  illya.1006.name: "Giant Hug"
  # 法拉，你也过来啦。像是久别重逢，两名少女激动地相拥在一起。嗯，在找到你的位置之后，我第一时间就过来了。
  illya.1006.desc: "Fara, you came too. Like a reunion after a long separation, the two girls hugged each other excitedly. Yeah, as soon as I found your location, I came over immediately."
  # 让我们靠近一点
  illya.1006.a: "Let's get closer"
  # 巨大的拥抱
  illya.1007.name: "Giant Hug"
  # 母亲张开双臂，将那名叫做伊莉雅的少女抱住，而她也配合地搂住对方的腰部
  illya.1007.desc: "Mother opened her arms and hugged the girl named Illya, who also cooperated by hugging her waist."
  # 再近一点吧！
  illya.1007.a: "A little closer!"
  # 危机的星球
  illya.1008.name: "Planet in Crisis"
  # 当少女们开心地拥抱彼此时，好像忘记，胸前还有一颗看上去十分脆弱的小东西。
  illya.1008.desc: "When the girls hugged each other happily, they seemed to forget that there was a fragile-looking little thing in front of their chests."
  # 就快被夹扁了
  illya.1008.a: "It's about to be flattened"
  # 危机的星球
  illya.1009.name: "Planet in Crisis"
  # 随着距离不断拉近，很快，少女们的胸口已经贴在了星球表面，只要再进一步，就可能变成一堆碎片。
  illya.1009.desc: "As the distance continued to close, soon, the girls' chests were pressed against the surface of the planet. Just one step further, and it might turn into a pile of debris."
  # 糟了！
  illya.1009.a: "Oh no!"
  # 甜蜜的吻
  illya.1010.name: "Sweet Kiss"
  # 我们可以看到，母亲慢慢将俏脸贴了上去，深情地吻了下去，而另外那名少女脸上浮现出红晕。
  illya.1010.desc: "We could see Mother slowly pressing her beautiful face against hers and kissing her deeply, while a blush appeared on the other girl's face."
  # 很美丽
  illya.1010.a: "Very beautiful"
  # 破碎
  illya.1011.name: "Shattered"
  # 而被少女们的胸部夹在中间的星球也随着母亲的动作，无法承受庞大的压力而碎裂。
  illya.1011.desc: "The planet sandwiched between the girls' chests also shattered due to Mother's movement, unable to withstand the immense pressure."
  # 幸好不是我们的星球
  illya.1011.a: "Luckily it's not our planet"
  # 巨大的拥抱
  illya.1012.name: "Giant Hug"
  # 啊！感觉到胸口的星球被夹碎，伊莉雅慌忙地将她推开。
  illya.1012.desc: "Ah! Feeling the planet on her chest being crushed, Illya hurriedly pushed her away."
  # 太迟了
  illya.1012.a: "Too late"
  # 糟糕的结果
  illya.1013.name: "Bad Outcome"
  # 真是的，大家都被法拉夹扁了！\n伊莉雅地双手放在身前，带着些许不满。\n嘛，人家也不是故意的啦。\n面对伊莉雅的指责，法拉不好意思地摸着自己的头。\n
  illya.1013.desc: "Really, everyone was flattened by Fara!\nIllya placed her hands in front of her, with a hint of dissatisfaction.\nWell, I didn't mean to.\nFacing Illya's accusation, Fara scratched her head in embarrassment.\n"
  # 母亲现在的样子好可爱
  illya.1013.a: "Mother looks so cute right now"
  # 恢复原状
  illya.1014.name: "Back to Normal"
  # 啊，好啦好啦，我知道错了，这就把大家恢复原状！\n法拉摊开手掌，奇异的光芒开始汇聚，片刻后，一个崭新的星球出现在少女的掌心上。\n恢复的不仅仅是星球本身，还有上面的文明，就好像无事发生过一般，也许就连星球上的原住民们都不会知道，自己在不知不觉中，因为两名少女的无心之举毁灭过一次。
  illya.1014.desc: "Ah, okay okay, I know I was wrong. I'll turn everyone back to normal right now!\nFara opened her palm, and strange light began to gather. A moment later, a brand new planet appeared in the girl's palm.\nNot only the planet itself was restored, but also the civilization on it, as if nothing had happened. Perhaps even the indigenous people on the planet wouldn't know that they had been destroyed once unknowingly due to the unintentional actions of two girls."
  # 好神奇的力量
  illya.1014.a: "Such magical power"
  # 尾声
  illya.1015.name: "Epilogue"
  # 真的，非常抱歉，给大家添麻烦了。\n伊莉雅低着头向着星球道歉，是在向星球本身，又或者上面的文明，但是应该没有人能回应她的举动。
  illya.1015.desc: "Really, I'm very sorry for trouble everyone.\nIllya lowered her head and apologized to the planet, either to the planet itself or the civilization on it, but there should be no one who could respond to her action."
  # 伊莉雅妈妈也很可爱呢
  illya.1015.a: "Mama Illya is also very cute"
  # 伊莉雅
  illya.1018.name: "Illya"
  # 呃……我叫伊莉雅。接下来请多关照
  illya.1018.desc: "Uh... my name is Illya. Please take care of me from now on."
  # 欢迎！
  illya.1018.a: "Welcome!"
  # 法拉和伊莉雅
  illya.2000.name: "Fara and Illya"
  # §R呀呼，伊莉雅，快让我抱一下§!\n§S法拉，现在不太合适吧，有人来了呢！§!\n§R啊嘞，是你来啦，有什么需要吗？§!
  illya.2000.desc: "§RYaho, Illya, let me hug you quickly§!\n§SFara, it's not appropriate now, someone is coming!§!\n§RAhle, you are here, do you need anything?§!"
  # 我们有一个请求
  illya.2000.a: "We have a request"
  # 没事
  illya.2000.c: "Nothing"
  # 我在想想
  fara_illya_return_to_main: "Let me think again"
  # 再见
  fara_illya_exit: "Goodbye"
  # 法拉和伊莉雅
  illya.2001.name: "Fara and Illya"
  # §R请求吗？说来听听吧。§!\n§S嗯可不能提太过分的哦§!
  illya.2001.desc: "§RA request? Let's hear it.§!\n§SHmm, you can't ask for something too excessive.§!"
  # 请一起踩扁我们的城市吧
  illya.2001.a: "Please flatten our city together"
  # 抱歉，暂时想不出来
  illya.2001.y: "Sorry, I can't think of anything for now."
  # 抱歉妈妈，我该走了
  illya.2001.z: "Sorry Mom, I have to go."
  # 法拉和伊莉雅
  illya.2002.name: "Fara and Illya"
  # §R哦呀，又是这种请求呢§!\n§S把城市踩扁吗？感觉像踩玩具一样，如果你们喜欢的话§!\n§R嗯，不过很有意思呢，需要穿鞋吗？§!
  illya.2002.desc: "§ROh my, it's this request again.§!\n§SFlatten the city? It feels like stepping on a toy, if you guys like it.§!\n§RHmm, but it's very interesting. Do I need to wear shoes?§!"
  # 请穿上鞋子
  illya.2002.a: "Please wear shoes"
  # 我们想看袜子
  illya.2002.b: "We want to see socks"
  # 还是先算了
  illya.2002.c: "Let's forget about it for now."
  # 法拉和伊莉雅的踩踏游戏1
  illya.2003.name: "Fara and Illya's Stomping Game 1"
  # §R鞋子吗？好的，让游戏开始吧§!§S嗯§!
  illya.2003.desc: "§RShoes? Okay, let the game begin.§!§SMmhmm.§!"
  # 马上开始！
  illya.2003.a: "Start immediately!"
  # 法拉和伊莉雅的踩踏游戏1
  illya.2004.name: "Fara and Illya's Trampling Game 1"
  # §R那么，城市里的大家注意啦，这里很快就要被人家的脚踩扁咯§!\n充满活力的声音，少女的脚悬在城市上，似乎随时都要落下。\n§S那个，现在逃跑还来得及哦§!\n另一名少女这样说着\n§R不需要有太大压力啦，一会都会恢复原状，就当成玩游戏一样，偶尔放松一下也不错§!\n法拉轻轻拍了下伊莉雅的肩膀，巨大的鞋子轻快地落下，瞬间摧毁了相当大的一片街区。
  illya.2004.desc: "§RThen, everyone in the city, pay attention, this place will soon be flattened by my feet.§!\nWith a vibrant voice, the girl's feet hung over the city, seemingly about to fall at any time.\n§SUmm, it's still not too late to run away now.§!\nThe other girl said so.\n§RNo need to be too stressed. Everything will return to normal in a while. Just treat it as playing a game. It's nice to relax occasionally.§!\nFara patted Illya's shoulder gently, and the huge shoes fell lightly, instantly destroying a considerable area of the block."
  # 很好看
  illya.2004.a: "Very beautiful"
  # 法拉和伊莉雅的踩踏游戏1
  illya.2005.name: "Fara and Illya's Trampling Game 1"
  # §R脱掉鞋子吗，嗯这样触感应该会更舒服，就满足你们好啦§!\n§S呃……法拉的孩子为什么会有这种奇怪的爱好呢§!
  illya.2005.desc: "§RTake off shoes? Hmm, the touch should be more comfortable this way. Only just to satisfy you.§!\n§SUh... Why does Fara's child have such a strange hobby?§!"
  # 等不及了，快开始吧！
  illya.2005.a: "Can't wait, start now!"
  # 法拉和伊莉雅的踩踏游戏1
  illya.2006.name: "Fara and Illya's Trampling Game 1"
  # §R那么，城市里的大家注意啦，这里很快就要被人家的脚踩扁咯§!\n充满活力的声音，少女的脚悬在城市上，似乎随时都要落下。\n§S那个，现在逃跑还来得及哦§!\n另一名少女这样说着§R\n不需要有太大压力啦，一会都会恢复原状，就当成玩游戏一样，偶尔放松一下也不错§!\n法拉轻轻拍了下伊莉雅的肩膀，巨大的脚掌轻快地落下，瞬间摧毁了相当大的一片街区。
  illya.2006.desc: "§RThen, everyone in the city, pay attention, this place will soon be flattened by my feet.§!\nWith a vibrant voice, the girl's feet hung over the city, seemingly about to fall at any time.\n§SUmm, it's still not too late to run away now.§!\nThe other girl said so.\n§RNo need to be too stressed. Everything will return to normal in a while. Just treat it as playing a game. It's nice to relax occasionally.§!\nFara patted Illya's shoulder gently, and the huge soles fell lightly, instantly destroying a considerable area of the block."
  # 很好看
  illya.2006.a: "Very beautiful"
  # 法拉和伊莉雅的踩踏游戏1
  illya.2007.name: "Fara and Illya's Stomping Game 1"
  # §V轰轰轰§!\n隆隆的巨响，少女们的脚掌不断落下，细心地踩踏着每一片区域，很快，整个城市就被夷为平地，只剩下一地的脚印。\n§R真是一次有趣的体验，特别是跟伊莉雅一起，感觉更开心了呢§!\n看着自己亲手造成的破坏，法拉还有些兴奋，调皮地眨了下眼睛。\n§S其实这种感觉，好像也不坏。§!\n§R游戏结束啦，该把大家恢复原状了§!\n一如既往，无数的光芒闪烁着，已经化为废墟的城市就像时光倒流一般快速复原，所有在游戏过程中意外身亡的公民也全数复活。
  illya.2007.desc: "§VBoom Boom Boom§!\nWith loud rumbling noises, the girls' soles kept falling, carefully trampling every area. Soon, the entire city was razed to the ground, leaving only footprints all over the ground.\n§RIt's really an interesting experience, especially with Illya, I feel even happier.§!\nLooking at the destruction she caused with her own hands, Fara was still a little excited and winked playfully.\n§SActually, this feeling doesn't seem bad.§!\n§RGame over, it's time to restore everyone to their original state.§!\nAs always, countless lights flickered, and the city that had been turned into ruins was quickly restored as if time had flowed backward, and all citizens who died accidentally during the game came back to life."
  # 妈妈真好！
  illya.2007.a: "Mom is so good!"
  # 伊莉雅丝菲尔 冯 爱因兹贝伦
  NAME_aom_illya_leader: "Illyasviel von Einzbern"
  # 平凡的五年级小学生，姑且算魔法少女，不才怪呢，谁家魔法少女要独断万古的！
  gts_aom_illya_leader_desc: "An ordinary fifth-grade primary student. Well, she's somewhat a magical girl - of course not, what kind of magical girl would seek to dominate the ages!"
  # 如果有什么需要帮助的话，我会尽力的！
  gts_aom_illya_leader_catch_phrase: "If there's anything you need help with, I'll do my best!"
  # 伊莉雅丝菲尔 冯 爱因兹贝伦
  aom_illya_leader.1.name: "Illyasviel von Einzbern"
  # 伊莉雅：呃……我叫伊莉雅。是小学五年级学生。姑且……在干魔法少女的工作，嗯。唔唔，虽然不知道我能帮上什么忙……但我会尽全力努力的！\n红宝石：还有我红宝石亲哦！让我们既有趣又可爱地干活吧，Grand Master！
  aom_illya_leader.1.desc: "Illya: Uh... My name is Illya. I'm a fifth-grade elementary school student. For the time being... I'm working as a magical girl, hmm. Ugh, although I don't know how I can help... but I will try my best!\nRuby: And me, Ruby-chan! Let's work interestingly and cutely, Grand Master!"
  # 角色详情
  aom_illya_leader.1.a: "Character Details"
  # 就读于穗群原学园小学部的普通女孩子。\n银发赤眼，名字很有贵族的风格，\n常不在家的双亲从事神秘的工作，\n分明是普通住家，却不知为何有两位女仆在，\n顺便还有一个没有血缘关系的哥哥，\n但还是一个非常普通的小学五年级女孩子。
  aom_illya_leader.1.a.response: "An ordinary girl studying at Homurahara Academy Elementary School.\nSilver hair and red eyes, her name is very aristocratic style.\nHer parents, who are often away from home, are engaged in mysterious work.\nIt is obviously an ordinary house, but for some reason there are two maids.\nBy the way, there is also a brother who is not related by blood.\nBut she is still a very ordinary fifth-grade elementary school girl."
  # 个人资料1
  aom_illya_leader.1.b: "Profile 1"
  # 身高／体重：133cm·29kg\n出处：Fate/kaleid liner 魔法少女☆伊莉雅\n地域：日本·冬木市\n属性：中立·善　　副属性：人　　性别：女性\n其实已经习惯于迷失在其他世界中了。很正常很正常。
  aom_illya_leader.1.b.response: "Height/Weight: 133cm • 29kg\nSource: Fate/kaleid liner Prisma Illya\nRegion: Fuyuki City, Japan\nAlignment: Neutral Good    Attribute: Human    Gender: Female\nActually already used to getting lost in other worlds. It's normal, very normal."
  # 个人资料2
  aom_illya_leader.1.c: "Profile 2"
  # 某天晚上，伊莉雅正打算洗个澡给观众送福利的时候，\n一把魔法杖从夜空中突然来袭。\n被这把会扭来扭去地动，还喋喋不休地说话的\n可疑度MAX的杖子诱骗上当，\n如今的魔法少女Prisma☆伊莉雅才闪亮诞生了。\n当然，对班上的各位可是保密的哦☆\n\n——这天夜晚，邂逅了命运。
  aom_illya_leader.1.c.response: "One night, when Illya was about to take a bath to give the audience some fan service,\nA magic wand suddenly attacked from the night sky.\nTricked by this suspicious MAX wand that wriggled and chattered endlessly,\nThe current Magical Girl Prisma Illya was born.\nOf course, keep it a secret from everyone in the class☆\n\n -  - On this night, she encountered destiny."
  # 个人资料3
  aom_illya_leader.1.d: "Profile 3"
  # 驯服奇妙的杖子，\n打开寡言少女的心灵，\n将企图杀害自己的少女当做家人迎接，\n总之适应能力与沟通能力极为强大。\n说得难听一点就是容易被影响的体质。\n在不断被影响的过程中，终于来到了迦勒底，\n不过应该也能适应这里吧。\n只要有魔法杖、追求未来的意志，\n以及可爱到有些狡猾的可爱，一定能行。
  aom_illya_leader.1.d.response: "Tamed the strange wand,\nOpened the heart of the taciturn girl,\nWelcomed the girl who attempted to kill herself as family,\nIn short, her adaptability and communication skills are extremely strong.\nTo put it bluntly, she has a constitution that is easily influenced.\nIn the process of constantly being influenced, she finally came to Chaldea,\nBut she should be able to adapt here too.\nAs long as there is a magic wand, the will to pursue the future,\nAnd the cuteness that is cute enough to be a bit cunning, it will definitely work."
  # 个人资料4
  aom_illya_leader.1.e: "Profile 4"
  # 『多元重奏饱和炮击』\n阶级：A+　种类：对人宝具\nQuintett Feuer\n通过将肌肉系统、神经系统、血管系统、淋巴系统被拟似地误认为魔术回路，来提升瞬间输出力量的舍身一击。\n游走全身的五种回路奏响的雄壮魔力奔流甚至具备能与星光相匹敌的歼灭力。
  aom_illya_leader.1.e.response: "『Multiple Chorus Saturation Bombardment』\nRank: A+    Type: Anti-Personnel Noble Phantasm\nQuintett Feuer\nA self-sacrificing strike that increases instantaneous output power by simulating the muscular system, nervous system, vascular system, and lymphatic system as magic circuits.\nThe majestic magical torrent played by the five circuits wandering through the whole body even has the annihilation power comparable to starlight."
  # 个人资料5
  aom_illya_leader.1.f: "Profile 5"
  # ○可疑的药：A\n红宝石每天晚上在阁楼里精炼的神秘药物。\n正可谓琥珀药草。\n原料主要是植物（毒草）。\n不为人知地在爱因兹家庭院种植可疑的花草，据说已经形成了只要被人看到必然会报警的异常花园了。\n效果卓越到令人后怕，多半不会导致什么好结果，所以尽可能不要使用。
  aom_illya_leader.1.f.response: "○Suspicious Medicine: A\nThe mysterious medicine refined by Ruby in the attic every night.\nIt can be called Amber Herb.\nThe raw materials are mainly plants (poisonous grass).\nUnknown to others, suspicious flowers and plants are planted in the Einzbern courtyard. It is said that an abnormal garden has been formed that will inevitably lead to the police being called if seen.\nThe effect is so excellent that it is frightening. It mostly won't lead to any good results, so try not to use it as much as possible."
  # 个人资料6
  aom_illya_leader.1.g: "Profile 6"
  # 这位伊莉雅丝菲尔是「她」可能存在的if的样子。\n是某些成年人反抗命运、祈祷、并赌上性命成功守护的「极为普通的女孩子」。\n抚养孩子，然后终将发现。\n存在于平凡中的幸福，才是这世间最难能可贵的愿望。\n\n——所以，伊莉雅一定不会犯错。\n哪怕残酷的命运逼迫她选择，哪怕为挡在面前的现实感到犹豫不决，最后也一定能抵达。\n她的目标，是真正的大团圆。
  aom_illya_leader.1.g.response: "This Illyasviel is a possible \"if\" appearance of \"her\".\nShe is an \"extremely ordinary girl\" protected by some adults who resisted fate, prayed, and staked their lives.\nRaising a child, and then eventually discovering.\nThe happiness that exists in the ordinary is the most precious wish in this world.\n\n -  - So, Illya will definitely not make mistakes.\nEven if cruel fate forces her to choose, even if she hesitates before the reality standing in front of her, she will definitely arrive in the end.\nHer goal is a true happy ending."
