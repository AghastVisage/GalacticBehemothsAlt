  aom_leader.4.b.response: "Height/Weight: 117cm • 20kg\nSource: Legend of King Arthur, Extraordinary Academy\nRegion: Europe\nAlignment: Lawful Good    Attribute: Earth    Gender: Female\nAlthough the previous life was male, under the influence of the body,\nthe personality is gradually approaching female.\n"
