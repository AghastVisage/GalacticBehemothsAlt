l_english:
  # 靴底人
  origin_gts_subterranean: "Sole Dwellers"
  # 一双来自不明巨娘的巨大靴袜深深地踩进了近半个星球的地壳深处，而靴子里的广阔空间成为了某个物种的家。该物种选择居住在这个恶劣环境的真正原因已经难以考证。或许是为了躲避天灾，或许是为了获取资源，亦或是他们本就由这靴子里的微生物进化而成。但无论如何，该物种已经在进化中适应..甚至迷恋这种黑暗潮湿，又充斥着足味的环境，并造就了这个对环境适应力更为强大的社会结构。
  origin_gts_subterranean_desc: "A pair of massive boot-socks from an unknown giantess have deeply pierced into the crust of nearly half a planet, and the vast space within the boots has become a home for a certain species. The real reason why this species chose to live in this harsh environment is difficult to ascertain. Perhaps it was to escape natural disasters, perhaps to obtain resources, or perhaps they evolved from the microorganisms within the boots. In any case, the species has adapted and even become fascinated with this dark, humid, and foot-scented environment during their evolution, creating a social structure with a stronger adaptability to this environment."
  #  - 以§H靴居者§!特质开局\n - 采矿区划会提供额外200住房\n - 你的物种在地下建造城市，因此将会获得以下修正：\n\n
  origin_tooltip_gts_subterranean_effects: "-Starts with the §HBoot Dweller§! trait\n-Mining districts provide 3 housing\n-Your species builds cities underground, granting these advantages:\n\n"
  # 充沛足垢
  gts_amazing_sweat: "Abundant Foot Detritus"
  # 这双靴子的前主人或许使用了它很久，亦或是她容易出汗，这使得即使靴内居民进行了上万年的开采，靴内的足垢依然丝毫没有枯竭的趋势。这些富含高品位矿物的足垢毫无疑问是这个文明兴盛的源泉。
  gts_amazing_sweat_desc: "The former owner of these boots may have used them for a long time, or perhaps they were prone to sweating, as the foot detritus inside shows no signs of depletion even after tens of thousands of years of mining by the boot dwellers. This foot detritus, rich in high-grade minerals, is without a doubt the source of this civilization's prosperity."
  # 失去联系
  gts_lost_contact: "Lost Contact"
  # 缺少对袜足的供奉让我们感到无所适从，思乡病与水土不服在迷茫的群众中迅速蔓延，我们最好尽快建造§Y袜足圣殿§!并任命至少一名§Y袜足牧师§!以满足群众的需要。
  gts_lost_contact_desc: "The lack of tribute to the socked foot leaves us disoriented. Homesickness and acclimatization rapidly spread among the confused masses. It is best if we quickly build the §YSock Foot Sanctuary§! and appoint at least one §YSock Foot Priest§! to meet the needs of the people."
  # 鞋袜圣地
  gts_shoes_sacredsite: "The Mecca of Shoes and Socks"
  # 住在巨娘的鞋袜星球对这里的居民来说是无上的荣幸，让气味渗入灵魂，让摩挲的鞋袜表面与皮肤亲密接触，在圣地的每一刻他们都会感到极致的快乐与幸福。
  gts_shoes_sacredsite_desc: "For the residents of the Giantess's Shoe and Sock Planet, living there is the greatest honor of all. As the scent seeps into their souls and the soft surfaces of the shoes and socks come into intimate contact with their skin, they experience the utmost joy and happiness with every moment spent in this sacred place."
  # 阴影之下
  gts_among_shadow: "Among the Shadows"
  # 阳光对我们来说是罕见的，居住在袜子上的人们或许每日能见到一两小时的阳光，而靴子深处的居民终其一生都只能在人造光源的陪伴中探索靴内世界，这使得这个星球的居民对他们生活的世界充满敬畏...虽然这只是某个巨娘留在这个星球的靴袜罢了。
  gts_among_shadow_desc: "Sunlight is rare for us. The people living on the sock may see an hour or two of sunshine each day, while the residents deep inside the boot spend their entire lives exploring the boot world accompanied only by artificial light. This fills the inhabitants of this planet with awe of the world they live in... even if it is just a boot-sock left on this planet by a certain giantess."
  # 生态破坏
  gts_planet_ruin: "Ecological Destruction"
  # 巨靴那覆盖半个星球的地壳裂痕和靴口源源不断排出的温暖气体几乎摧毁了这个星球的生态系统，即使厚实的靴壁为我们阻挡了大部分天灾，这颗星球的生产生活依然受到了些许影响。
  gts_planet_ruin_desc: "The giant boot's crustal fissures covering half the planet and the warm gases constantly emanating from the boot opening have nearly destroyed the planet's ecosystem. Even though the thick boot walls block most natural disasters from us, the productivity and inhabitation of the planet are still slightly affected."
  # 足部护理中心
  building_gts_foot_clean_mineral: "Foot Care Center"
  # 虽然银河中的其他巨娘尚不如我们母星那双靴子的主人一样巨大，但也足够我们在其中发挥特长了。我们会用专业的技艺来服务到访的巨娘们，在清理好她们的足部的同时，我们还可以将这些清理下来的足垢进行简单加工。
  building_gts_foot_clean_mineral_desc: "Although other giantesses in the galaxy are not as massive as the owner of the boots on our homeworld, they are still large enough for us to excel. We will use our professional skills to serve visiting giantesses, and while cleaning their feet, we can also process the cleaned foot detritus."
  # 袜足圣殿
  building_gts_holy_foot_temple: "Sock Foot Sanctuary"
  # 在靴袜内的生活已经让我们深深依赖这神圣的环境，从而对丝足乃至这位无名的女神也充满崇拜，这种信仰与思潮无关，无论我们在什么地方，只有这熟悉的味道能让我们感到抚慰。
  building_gts_holy_foot_temple_desc: "Life within the boots and socks has made us deeply dependent on this sacred environment, and thus we are filled with reverence for the silken foot and even this nameless goddess. This faith is unrelated with ideology, as no matter where we are, only this familiar scent can soothe us."
  # 袜足牧师
  job_gts_foot_prist: "Sock Foot Priest"
  # 袜足牧师
  job_gts_foot_prist_plural: "Sock Foot Priests"
  # 这些牧师通常由备受欢迎的担任的意见领袖担任，负责向全社会传道袜足之美，并协调对于黑丝派、白丝派、棉袜派和裸足派之间的纠纷。
  job_gts_foot_prist_desc: "These priests are usually popular opinion leaders who are responsible for spreading the beauty of the socked foot to the whole society and coordinating disputes between the black silk faction, the white silk faction, the cotton sock faction, and the bare foot faction."
  # 袜足牧师岗位增加
  mod_job_gts_foot_prist_add: "Sock Foot Priest Job Added"
  # 足垢采掘者
  job_gts_footminer: "Foot Detritus Miner"
  # 足垢采掘者
  job_gts_footminer_plural: "Foot Detritus Miners"
  # 这些经验丰富的矿工擅长在巨娘的鞋袜与趾缝间寻找高质量矿物，这种勘探才能哪怕在普通星球上都能大放异彩。
  job_gts_footminer_desc: "These experienced miners are proficient at finding high-quality minerals between a giantess's socks/shoes and toes. This exploration talent excels even on ordinary planets."
  # 足垢采掘者岗位增加
  mod_job_gts_footminer_add: "Foot Detritus Miner Job Added"
  # 足汗提炼员
  job_gts_footsmeller: "Foot Sweat Refiner"
  # 足汗提炼员
  job_gts_footsmeller_plural: "Foot Sweat Refiners"
  # 这些劳工擅长对巨娘那对小人来说充满毒性或致幻性的足味进行提炼，并得到具有很高能量的异星天然气。
  job_gts_footsmeller_desc: "These laborers are skilled in refining the foot odor of a giantess, which is toxic or hallucinatory to small people, and in obtaining alien natural gas with high energy."
  # 足汗提炼员岗位增加
  mod_job_gts_footsmeller_add: "Foot Sweat Refiner Job Added"
  # 足垢沉积
  d_foot_dirt_ringworld: "Foot Detritus Deposits"
  # 趾环原主人留下的部分汗渍，在恒星漫长的照射下逐渐干燥，构成了这个世界各种地形地貌，并带来了丰富的矿藏。
  d_foot_dirt_ringworld_desc: "Some of the sweat stains left by the original owner of the toe ring have gradually dried under the long-term irradiation of the star, forming the diverse terrain of this world and bringing rich mineral deposits."
  # 足汗湖
  d_foot_sweat_ringworld: "Foot Sweat Lake"
  # 趾环原主人留下的微量汗渍，在趾环世界的水循环中逐渐形成的大型湖泊，一般认为这个世界的各种生命皆发源于这些水体。
  d_foot_sweat_ringworld_desc: "The traces of sweat left by the original owner of the toe ring have gradually formed large lakes in the water cycle of the toe ring world. It is generally believed that the various lives of this world originated from these bodies of water."
  # 足垢
  d_gts_footdirt: "Foot Detritus"
  # 靴子的前主人分泌的足部代谢物，这些天赐的优质矿藏构建起了我们庞大的工业帝国。
  d_gts_footdirt_desc: "The metabolic waste products of the former owner's of the boots' feet. These god-given high-quality minerals have built our vast industrial empire."
  # 浓郁汗雾
  d_gts_footsweat_1: "Dense Sweat Mist"
  # 这一地区被能见度极低的足汗浓雾覆盖，冒险通过这一地区极易出现迷失在浓雾中或坠机在袜子上等事故
  d_gts_footsweat_1_desc: "This area is covered by a highly concentrated foot sweat mist with low visibility, making it extremely easy to get lost in mist or crash on sock."
  # 温暖汗雾
  d_gts_footsweat_2: "Warm Sweat Mist"
  # 在进行大规模的汗雾冷凝后，这一地区的足汗浓度明显下降了，这使得我们可以进一步向靴内开发。
  d_gts_footsweat_2_desc: "After massive sweat mist condensation, the foot sweat concentration in this area has decreased significantly, which allows us to further develop into the boot interior"
  # 毛球
  d_gts_sock_1: "Lint Balls"
  # 这些小行星大小的黏软线团来自高悬于靴中的袜子上，它们不时会脱落坠入地面，虽然会造成不少麻烦，但也往往会给周围的城市横添一笔丰富矿藏。
  d_gts_sock_1_desc: "These soft, starchy lints are about the size of an asteroid. Coming from socks hanging high in the boot. They occasionally fall to the ground, which, while causing a lot of trouble, often adds a rich mineral deposit to the surrounding cities."
  # 袜子
  d_gts_sock_2: "Socks"
  # 这些袜子的底部曾一直被认为是天空的尽头，直到火箭将我们送往这灰蒙蒙的天幕之上。如今人们通过采集袜子上松动的纤维制造工业品，同时政府部门也利用袜子调控靴内的气温与降水。
  d_gts_sock_2_desc: "The bottom of these socks was once thought to be the end of the sky, until rockets sent us above this gray sky. Today, people make industrial products by collecting loose fibers from the socks, while government departments use the socks to regulate the temperature and rainfall inside the boot."
  # 平坦靴底
  d_gts_boot: "Flat Boot Sole"
  # 帝国首都的坚实地基，靴底的孔洞中仍然不时渗出富盐的泉水或蒸汽。
  d_gts_boot_desc: "The solid foundation of the empire's capital, with salty springs or steam still seeping out from the holes in the boot sole from time to time."
  # 当[GetHomeWorldName]上的其他生命在只能在荒野中度过夜晚，我们的祖先很快学习到了在这巨大靴内生活的智慧，巨大的靴袜为他们提供了阻挡猛烈阳光和剧烈气候的庇荫。\n\n$START_SCREEN_SUBTERRANEAN_END$
  START_SCREEN_GTS_SUBTERRANEAN: "While other life on [GetHomeWorldName] must endure the night in the wilderness, our ancestors quickly learned the wisdom of living within this massive boot. These giant boot-socks provided shelter from the harsh sunlight and severe climate.\n\n$START_SCREEN_SUBTERRANEAN_END$"
  # [GetHomeWorldName]上的生命采取了一些完全不同的进化路线。和我们同处一个世界的其他生命形式不同，它们从阳光中汲取能量而我们从富营养的泥垢获得营养，正如我们的[GetSpeciesAdj]先祖所做的那样。\n\n$START_SCREEN_SUBTERRANEAN_END$
  START_SCREEN_GTS_SUBTERRANEAN_PLANT: "Life on [GetHomeWorldName] took some completely different paths of evolution. Unlike the other life forms on our world, they draw energy from the sun, while we derive nourishment from nutrient-rich detritus, just as our [GetSpeciesAdj] ancestors did.\n\n$START_SCREEN_SUBTERRANEAN_END$"
  # 我们生于[GetHomeWorldName]这巨大靴体的泥垢之中。我们的进化之路和我们那些不可移动的表兄弟不同，他们在上方如同哨兵般环卫者我们，而我们却选择远离严酷而闪耀的日光。和他们不同，我们获得了移动、思考以及建立一个文明的能力。\n\n$START_SCREEN_SUBTERRANEAN_END$。\n\n$START_SCREEN_SUBTERRANEAN_END$
  START_SCREEN_GTS_SUBTERRANEAN_LITHOID: "We were born in the detritus of the massive boot of [GetHomeWorldName]. Our evolutionary path is different from our immobile cousins, who watch us like sentinels from above, while we have chosen to stay away from the harsh and radiant sunlight. Unlike them, we gained the ability to move, think, and build a civilization.\n\n$START_SCREEN_SUBTERRANEAN_END$.\n\n$START_SCREEN_SUBTERRANEAN_END$"
  # 靴袜里极易采集的优质矿物让我们的[GetSpeciesAdj]先祖完成了工业化，统一了我们的物种并深化了靴居的文明形式。我们数次尝试重回地表但每次都只能带来残酷而难于应付的回忆。因此我们还是留在了地下，在坚实而神圣的靴底建立我们至高无上的地位。\n\n现在随着超光速引擎的发现，我们做出了我们最大胆的尝试以触及星辰 -  - 并也同我们的祖先那样，我们应该在黑暗中挖掘出自己的家园。
  START_SCREEN_SUBTERRANEAN_GTS_END: "The easily accessible high-quality minerals within the boot-socks allowed our [GetSpeciesAdj] ancestors to industrialize, unite our species, and deepen the boot-dwelling form of civilization. We have tried to return to the surface several times, but each time, it only brought back harsh and difficult memories. Therefore, we have remained underground, building our supreme position on the solid and sacred boot soles.\n\nNow, with the discovery of the faster-than-light engine, we are making our boldest attempt to reach the stars-and like our ancestors, we shall carve out our own home in the darkness."
  # 靴底人
  SUBTERRANEAN: "Sole Dweller"
  # 每$VALUE$人口§G+1§!$job_gts_footminer$岗位
  mod_job_gts_footminer_per_pop: "§G+1§! $job_gts_footminer$ job per $VALUE$ population"
  # \n每$VALUE$ £pop£ §G+1§! $mod_job_gts_footminer_add$
  mod_job_gts_footminer_per_pop_short: "\n§G+1§! $mod_job_gts_footminer_add$ per $VALUE$ £pop£"
  # 黑丝主教区
  building_gts_holy_black_temple: "Black Silk Bishopric"
  # 这个星球的居民普遍认为他们生活的地下世界是被一位穿着§g黑丝§!的性感巨娘用足趾开辟的。事实上也的确如此。
  building_gts_holy_black_temple_desc: "The inhabitants of this planet generally believe that the underground world in which they live was carved out by the feet of a sexy giantess wearing §gblack silk§! In fact, that's exactly the case."
  # 人们一直就什么样的袜足最涩而争论不休，是时候终结这个话题，将这个星球打造为所有黑丝信徒的精神家园！\n§R受到神圣力量的庇护，这座宏伟建筑一旦建立就无法降级和被摧毁§!
  building_gts_holy_black_temple_effect: "People have been arguing about which socked foot is the sexiest. It's time to end this debate and make this planet the spiritual home for all black silk devotees!\n§RProtected by divine power, this magnificent structure cannot be downgraded or destroyed once built!§!"
  # 白丝主教区
  building_gts_holy_white_temple: "White Silk Bishopric"
  # 这个星球的居民普遍认为他们生活的地下世界是被一位穿着§L白丝§!的性感巨娘用足趾开辟的。事实上也的确如此。
  building_gts_holy_white_temple_desc: "The inhabitants of this planet generally believe that the underground world in which they live was carved out by the feet of a sexy giantess wearing §Lwhite silk§! In fact, that's exactly the case."
  # 人们一直就什么样的袜足最涩而争论不休，是时候终结这个话题，将这个星球打造为所有白丝信徒的精神家园！\n§R受到神圣力量的庇护，这座宏伟建筑一旦建立就无法降级和被摧毁§!
  building_gts_holy_white_temple_effect: "People have been arguing about which socked foot is the sexiest. It's time to end this debate and make this planet the spiritual home for all white silk devotees!\n§RProtected by divine power, this magnificent structure cannot be downgraded or destroyed once built!§!"
  # 棉袜主教区
  building_gts_holy_stocking_temple: "Cotton Sock Bishopric"
  # 这个星球的居民普遍认为他们生活的地下世界是被一位穿着§P棉袜§!的性感巨娘用足趾开辟的。事实上也的确如此。
  building_gts_holy_stocking_temple_desc: "The inhabitants of this planet generally believe that the underground world in which they live was carved out by the feet of a sexy giantess wearing §Pcotton socks§! In fact, that's exactly the case."
  # 人们一直就什么样的袜足最涩而争论不休，是时候终结这个话题，将这个星球打造为所有棉袜信徒的精神家园！\n§R受到神圣力量的庇护，这座宏伟建筑一旦建立就无法降级和被摧毁§!
  building_gts_holy_stocking_temple_effect: "People have been arguing about which socked foot is the sexiest. It's time to end this debate and make this planet the spiritual home for all cotton sock devotees!\n§RProtected by divine power, this magnificent structure cannot be downgraded or destroyed once built!§!"
  # 裸足主教区
  building_gts_holy_bare_temple: "Bare Foot Bishopric"
  # 这个星球的居民普遍认为他们生活的地下世界是被一位§d裸足§!的性感巨娘用足趾开辟的。事实上也的确如此。
  building_gts_holy_bare_temple_desc: "The inhabitants of this planet generally believe that the underground world in which they live was carved out by the feet of a sexy giantess with §dbare feet§!. In fact, that's exactly the case."
  # 人们一直就什么样的袜足最涩而争论不休，是时候终结这个话题，将这个星球打造为所有裸足信徒的精神家园！\n§R受到神圣力量的庇护，这座宏伟建筑一旦建立就无法降级和被摧毁§!
  building_gts_holy_bare_temple_effect: "People have been arguing about which socked foot is the sexiest. It's time to end this debate and make this planet the spiritual home for all bare foot devotees!\n§RProtected by divine power, this magnificent structure cannot be downgraded or destroyed once built!§!"
  # 圣足崇拜：号角
  religious_icons_black1: "Holy Foot Worship: Horn"
  # 这个星球的居民崇拜着号角，古[Owner.Capital.GetName]掌管黑丝的神明之一，据说她曾经单靠自己脱鞋时散发的足味就消灭了数百万试图灭绝我们的外星侵略者。
  religious_icons_black1_desc: "The people of this planet worship Horn, one of the black silk deities of ancient [Owner.Capital.GetName]. It is said that she once annihilated millions of alien invaders trying to exterminate us with just the smell of her feet when she took off her shoes."
  # 圣足崇拜：曼城茶座
  religious_icons_black2: "Holy Foot Worship: Man City Teahouse"
  # 这个星球的居民崇拜着曼城茶座，古[Owner.Capital.GetName]掌管黑丝的神明之一，据说她黑丝上独特的咖啡味足汗让母星每个寄居在靴内的小人都能保持精神充沛。
  religious_icons_black2_desc: "The people of this planet worship Man City Teahouse, one of the black silk deities of ancient [Owner.Capital.GetName]. It is said that the unique coffee-scented foot sweat on her black silk allows every small person in the boots on the homeworld to stay energized."
  # 圣足崇拜：牧濑红莉栖
  religious_icons_black3: "Holy Foot Worship: Makise Kurisu"
  # 这个星球的居民崇拜着牧濑红莉栖，古[Owner.Capital.GetName]掌管黑丝的神明之一，据说就是她在世界线穿越时遗落在我们母星的巨大黑丝启发我们研发出了超光速引擎。
  religious_icons_black3_desc: "The people of this planet worship Makise Kurisu, one of the black silk deities of ancient [Owner.Capital.GetName]. It is said that it was the giant black silk left by her on our homeworld during her world-line travel that inspired us to develop the faster-than-light engine."
  # 圣足崇拜：普拉娜
  religious_icons_black4: "Holy Foot Worship: Plana"
  # 这个星球的居民崇拜着普拉娜，古[Owner.Capital.GetName]掌管黑丝的神明之一，据说这名巨娘的黑丝经常能吸引无数人扑上去吸然后开始原地发癫。
  religious_icons_black4_desc: "The people of this planet worship Plana, one of the black silk deities of ancient [Owner.Capital.GetName]. It is said that this giantess's black silk often attracts countless people to rush up to sniff it and then go crazy."
  # 圣足崇拜：吾妻
  religious_icons_black5: "Holy Foot Worship: Azuma"
  # 这个星球的居民崇拜着吾妻，古[Owner.Capital.GetName]掌管黑丝的神明之一，据说这名巨大舰娘的黑丝上沾染的足垢为我们提供了珍贵的航天级合金。
  religious_icons_black5_desc: "The people of this planet worship Azuma, one of the black silk deities of ancient [Owner.Capital.GetName]. It is said that the foot dirt on this massive shipgirl's black silk provided us with precious aerospace-grade alloy."
