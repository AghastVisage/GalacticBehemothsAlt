  # 主人在生理需要和嘲弄下组合出的行为。充满高能气体的恶臭气体将会从主人的雏菊中释放，产生的冲击波和爆炸足以摧毁星球表面的一切的同时让这个星球染上难以退化的味道...
  PLANET_KILLER_FART_DESC: "A deed crafted from physiological necessity and mockery. The high-energy gas-filled stench released from the daisy will bomb and erode the planet's surface, leaving a scent hard to wash away..."
