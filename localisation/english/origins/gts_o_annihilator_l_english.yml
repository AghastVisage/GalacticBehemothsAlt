  # 这个轨道居住站被某种无法穿透的能量屏障封闭了。这个屏障屏蔽了对其地表进行的任何扫描。
  pc_habitat_shielded_desc: "This orbital habitat is sealed by an impenetrable energy barrier that prevents surface scans."
