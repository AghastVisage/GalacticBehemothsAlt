l_english:
  # 成神之路
  origin_ultra_road: "Path to Godhood"
  # 我们无法判断这个文明的真实意图，但我们知道的是，她们的出现对于整个宇宙来说是一场空前绝后的浩劫，她们庞大的身躯会压倒一切挡在她们面前的物体，现在她们在银河其它文明眼中，是绝对的灾难，当其它文明见到她们之后，会臣服与她们的足下，还是拼死抵抗呢？
  origin_ultra_road_desc: "We cannot discern the true intentions of this civilization. What we know is that their emergence is an unprecedented calamity for the entire universe. Their massive bodies will overwhelm anything in their path. Now they are viewed as an absolute disaster by the other civilizations of the galaxy. When other civilizations encounter them, will they submit at their feet, or will they fight to the death?"
  # -这个种族拥有§R天体级体型§!\n-开局星球必定位于星系外围，并无法与其它国家正常交流\n-特殊的人口与建筑系统\n\n-§S本起源无法靠正常手段与任何文明交流，唯有毁灭才是银河蛆虫们唯一的命运§!
  origin_ultra_road_effect: "- This species possesses a §RCelestial-level body size§!.\n- Starting planet is always located on the outskirts of the system, and is unable to communicate properly with other nations.\n- Special population and building systems.\n\n- §SThis origin cannot communicate with any civilization through normal means. Only destruction is the only destiny for these galactic maggots!§!"
  # §S不知道从何时开始，我们的人们向往起了天空，一望无际的天空，我们畅想着，能够在天空中无拘无束的飞翔，能够将天上的星星摘下，戴在爱人的头上§!\n\n我们无限制的寿命让我们在这么久的岁月中忘记了时间，以至于我们快忘记了往天空去的梦想，直到百年前的某天，一个小小的，长得像模型的飞船来到了这颗星球上，我们的人感应到了她们，于是过去查看，从飞船中的生物从一个个小门中，乘坐飞行器出来，我们看着他们，从他们的思绪里，看见了恐惧，疑惑，甚至欣喜，我们认为他们是来自天空的客人，便派出了外交人员去与他们交流，结果得到的答复是他们要占领这颗星球，奴役我们的朋友与家人，愤怒的我们杀掉了他们所有人，包围起了那个模型大小的飞船\n\n我们的技术人员破解了船上的信息，得知这是她们最大一型的殖民探索船，超过100公里的巨大舰船，却连我们一个手掌都填不满\n\n我们的技术人员拆解了了那艘船，我们的科学家日以继夜的研究飞船上的科技，研究其上的任何东西，生物，食物，用品等等\n\n我们从他们的数据库里解读出了许多东西，关于我们这个星系，我们这颗星球，上面的数据甚至比我们最好的数据库里最新的数据都要完全，其上的科技足够让我们进步数个时代，而这只是一个小小的殖民船上的东西\n\n同样的，发现不止带来了对更大世界的欣喜，更带来了令人不安的信息，他们在被我们杀死前将影像与求救信号发送了出去，我们无法得知他们的国家是否有受到这些东西，但我们觉得，战争很快就会到来\n\n然而，事实与想象大相径庭，当我们第一次建立起全星球第一个正规军事力量后，才发现我们的敌人有多么的可笑， 我们利用她们的科技制造出来的武器，完全没有派上用场，不是说武器没有用处，而是敌人不值得使用武器，敌人从天空中降下来的数万艘战舰中，连比我们武器口径大的舰船都没有几艘，我们的战士们在被他们攻击了数分钟后才反应过来，有东西在攻击自己，而至于为什么会忽略，完全是因为他们的攻击打在皮肤上完全没有多少感觉\n\n于是我们的士兵们放下了武器，用自己的身体肆意玩弄这些弱小的，如同灰尘般的物体\n\n仅仅是几分钟后，几十名士兵就将他们的「精锐灭绝舰队」消耗殆尽，就连我们士兵从胯间滴落的一滴水珠，都能摧毁数百条战舰\n\n自那以后，我们再也没有见到更多外星生物来到这颗星球上，相反，许多的威胁与恐吓频繁出现在了我们的视线中，数不尽的谩骂、恐吓、责备和灭绝宣言涌入到我们毫无保护的世界中\n\n我们产生了极为强烈的厌烦情绪，恨不得将他们全部杀死，变成自己身上的灰尘，也因此，我们不想与任何国家有任何交流，只想将整个宇宙的所有生命灭绝或奴役\n\n与此同时，我们的航天科技有了巨大突破，根据研究与发明，我们制造出了探索飞船，这种不需要巨娘直接操控，而是可以通过超光速网络操控的先进飞船立刻被派向了星空，去探索那些我们未知却又熟悉的疆域\n\n至此，那个只会抬头看看天空的，热爱和平的种族被一个文明的入侵舰队所消灭殆尽\n\n§R只留下了一个钟情与毁灭与奴役的，巨娘帝国§!
  START_SCREEN_MESSAGES_ULTRA_ROAD: "§SIt is unknown when it began, but our people began to yearn for the sky, the boundless sky. We imagined flying freely among the heavens, plucking stars from the sky to adorn our loved ones' heads!§!\n\nOur limitless lifespans had made us forget time over these long years, so much so that we almost forgot the dream of reaching the sky, until one day a small, model-like spaceship arrived on this planet a hundred years ago. Our people sensed them and went to investigate. The creatures from within came out from small doors in flying devices. As we watched them, we saw fear, confusion, even joy in their thoughts. We thought them to be guests from the sky, and thus dispatched diplomats to communicate with them. The reply we received, however, was that they intended to occupy this planet, enslaving our friends and family. Furious, we killed them all and surrounded that model-like spaceship.\n\nOur technicians deciphered the information from the ship and learned that it was their largest type of colonial exploration ship, a massive vessel over 100 kilometers across, yet barely capable of filling the palm of our hand.\n\nOur technicians dismantled the ship, and our scientists researched the ship's technology night and day, studying its contents  -  the biology, food, supplies etc.\n\nWe interpreted much from their databases, including information about this system, this planet. The data was even more complete than the latest data in our own best databases. The technology alone would be enough for us to advance several eras, and this was merely from a small colony ship.\n\nHowever, this discovery not only brought joy of a larger world, but also disquieting information. Before we killed them, they sent out visuals and distress signals. We don't know if their nation received these, but we feel that war will come soon.\n\nHowever, reality diverged greatly from imagination. When we first established our planet's first regular military force, we realized how laughable our enemies were. The weapons created using their technology were completely useless - not that those weapons were useless, but that the enemy was unworthy of their use. Of the tens of thousands of warships that descended from the sky, none of them were even larger than our weapon's caliber. Our warriors only realized they were under attack after several minutes, and as to why they had ignored it, it was because their attacks barely registered on their skin.\n\nSo our soldiers put down their weapons and playfully toyed with these weak, dust-like creatures using their own bodies.\n\nIn mere minutes, a handful of soldiers had completely annihilated their \"Elite Extermination Fleet\", and even a drop of water dripping from our soldiers' crotches could destroy hundreds of warships.\n\nSince then, we have never seen more alien beings arrive on this planet. Instead, a multitude of threats and intimidations frequently appeared in our sight. Countless insults, threats, reproaches and extinction declarations flooded our unprotected world.\n\nWe felt a strong sense of aversion and wished to kill all of them and turn them into dust on our bodies. Therefore, we do not want any communication with any countries, only the annihilation or enslavement of all life in the universe.\n\nAt the same time, we made a major breakthrough in our aerospace technology. According to our research and inventions, we have built exploration ships. These advanced ships, which do not need to be controlled by the giantesses directly, but through the hyperspace network, were immediately sent to space to explore those unknown but familiar territories.\n\nThus, that peaceful race, which only looked up to the sky, was annihilated completely by an invading fleet.\n\n§RLeaving behind only a Giantess Empire that is solely devoted to destruction and enslavement.§!"
  # 不屑一顾
  gts_ultra_road_dip: "Disdain"
  # 银河中其它生物无法与巨娘进行进行正常的交流，她们同样也不会进行过多而繁杂的无意义交流，不仅仅耗费精力， 还徒增麻烦，因此她们外部的评价十分糟糕，但是，巨娘不在乎\n\n§S蝼蚁的言语，略显聒噪了，不听也罢§!
  gts_ultra_road_dip_desc: "Other beings in the galaxy cannot engage in normal communication with the giantesses. The giantesses also will not engage in excessive and complicated, meaningless communication. Not only does it expend energy, but it also increases trouble. Therefore, their external reputation is very bad, but the giantesses do not care.\n\n§SThe words of ants are a bit noisy, its better to not listen.§!"
  # 巨娘资源学
  gts_ultra_road_resource: "Giantess Resource Studies"
  # 巨娘们的资源总是不够用的，因此专门设立了这门学科，以求最大限度的开采和利用任何资源\n\n§S矿物很有用，但看起来并不能吃，对于巨娘来说，很坏§!
  gts_ultra_road_resource_desc: "The giantesses are always lacking in resources and thus, this field of study is specifically established to maximize the extraction and utilization of any resource.\n\n§SMinerals are useful but don't seem edible. For giantesses, very bad.§!"
  # 巨娘建筑学
  gts_ultra_road_building: "Giantess Architecture"
  # 巨娘们的住房问题是最令人头痛的，还好先进的科学技术让我们能够建造更大的房屋\n\n§S巨娘们对于打灰的热爱让其成为了一门学问§!
  gts_ultra_road_building_desc: "The housing problems of the giantesses are the most troublesome, luckily the advanced science and technology allows us to build even larger houses.\n\n§SThe giantesses' love for building has made it a discipline.§!"
  # 灭绝舰队
  gts_ultra_road_fleet: "Extermination Fleet"
  # 巨娘们不在乎蝼蚁怎么思考的，她们只知道这些蝼蚁脏了自己的地板，清理是理所当然的。\n\n§S光束只是高效的杀虫剂，不是武器§!
  gts_ultra_road_fleet_desc: "The giantesses do not care what the ants think, they only know that these ants have soiled their floor, and cleaning is a matter of course.\n\n§SBeams are merely efficient insecticides, not weapons.§!"
  # 科学研讨会
  gts_ultra_road_tech: "Scientific Symposium"
  # 巨娘们的科学家弄明白了一些事情，她们需要一个地方来交流，比如这个帐篷里\n\n§S聪明的大脑是懂得放松的大脑§!
  gts_ultra_road_tech_desc: "The giantesses' scientists have figured some things out, they need a place to communicate, like this tent.\n\n§SThe smart brain is the brain that knows how to relax.§!"
  # 自动战争机器
  gts_ultra_road_robot: "Autonomous War Machines"
  # 巨娘的科学技术能够制造微型机器人，相对而言。她们可以被送入大气层内战斗，并占领星球\n\n§S自动化战争机器§!
  gts_ultra_road_robot_desc: "Giantess science and technology is capable of manufacturing micro-robots. Relative to them. They can be sent into the atmosphere to fight and occupy planets.\n\n§SAutomated war machines!§!"
  # 生生不息，繁荣昌盛
  gts_ultra_road_eco: "Continuous Life, Flourishing Prosperity"
  # 巨娘极为漫长的寿命下，让所有人都积累了足够的财富，整个社会都投入到进步之中，没有人会被落下
  gts_ultra_road_eco_desc: "The extremely long lifespans of the giantesses have allowed them all to accumulate enough wealth. The entire society is devoted to progress, and no one will be left behind."
  # 从未走过的路
  gts_ultra_road.10.name: "A Path Never Traveled"
  # 那架飞行器的出现，彻底的改写了我们的视野。通过解析飞行器身上的科技与知识，我们终于获得了飞向蓝天的机会，我们仅仅用了20年的时间，就将其上的超空间引擎制造了出来，现在，我们拥有了在这片星海之中遨游的能力\n\n在等待的途中，我们的第一艘搭载了超空间引擎的科研船从阿特拉斯发射场起飞，30分钟后脱离了星球重力圈，来到了这片群星之中，她将是我们踏出去的第一步，而这之后会有许多步，等待着我们踏出，有许多的世界，等待我们探索，有许多的种族，等待我们交流\n\n让我们一起，为了最伟大的梦想，为了更美好的明天，向着先驱者们，致以崇高的敬意
  gts_ultra_road.10.desc: "The appearance of that flying device completely changed our perspective. By deciphering the technology and knowledge of the flying device, we finally obtained the opportunity to fly into the skies. We only used 20 years to build its hyperspace engine. Now, we have the ability to roam in this sea of stars.\n\nIn the midst of waiting, our first research ship, equipped with a hyperspace engine, took off from the Atlas Launch Site. Thirty minutes later, it left the planet's gravity well and arrived in this cluster of stars. It will be our first step out, and after that, there will be many steps waiting for us to take. There are many worlds waiting for us to explore, many races waiting for us to communicate with.\n\nLet's go together, for the greatest dream, for a better tomorrow, paying the highest respect to the pioneers."
  # 「新视界」号，启航！
  gts_ultra_road.10.a: "'New Horizon', launch!"
  # 「启明星」号，向星辰出发
  gts_ultra_road.10.b: "'Morning Star', head for the stars."
  # 「万年长征」号，前进！
  gts_ultra_road.10.c: "'Long March of Millennia', advance!"
  # 最接近的梦想
  gts_ultra_road.11.name: "The Closest Dream"
  # 二十年前，一个外星文明的飞行器降落到了这颗星球上，二十年后，我们从他们的科技里获得了现在的一切，而现在，我们将真正的，向黑暗前进，去往那一片灿烂的星空之中，实现我们最伟大的梦\n\n随着先驱者们的出发，一艘艘的星舰登上了前往太空的发射场，她们拖着最为绚丽的轨迹，向着最璀璨的黑夜出发\n\n§R（注意，选项会影响接下来的游戏剧情）§!
  gts_ultra_road.11.desc: "Two decades ago, a spaceship from an alien civilization landed on this planet. Twenty years later, we obtained everything through their technologies. And now, we will truly proceed into the darkness, toward that brilliant starry sky, to achieve our greatest dream.\n\nAs our pioneers depart, one by one, the starships make their way to the launch sites, bearing the most glorious trajectories, heading to the most brilliant night.\n\n§R(Note that, the options will affect the subsequent plot of this game)§!"
  # 征服星辰，力撼寰宇
  gts_ultra_road.11.a: "Conquer the Stars, Overpower the Universe"
  # §Y这将触发征服线剧情§!
  gts_ultra_road.11.a.tooltip: "§YThis will trigger the conquest storyline!§!"
  # 千星同耀，万族共荣
  gts_ultra_road.11.b: "Thousands of Stars Shine Together, Ten Thousand Races Prosper Together"
  # §Y这将触发联合线剧情 温柔系§!
  gts_ultra_road.11.b.tooltip: "§YThis will trigger the alliance storyline! (Gentle series)§!"
  # 鲜血与荣耀，将铸就我们的伟大
  gts_ultra_road.11.c: "Blood and Glory, will forge our greatness"
  # §Y这将触发毁灭线剧情 残忍系§!
  gts_ultra_road.11.c.tooltip: "§YThis will trigger the destruction storyline! (Cruel series)§!"
  # 第一个星系
  gts_ultra_road.12.name: "The First Star System"
  # 我们的飞船前往到了星图上标注的星系，其上的物资分布与那个飞行器上所标注的一模一样，我们的工程部研发的新式工程船正在前往星系中，建造我们的第一个据点，以此来划分我们在群星之间的势力范围\n\n我们的科学家们将持续报道这些世界上的食物，以便于更好的让我们征服这片星空
  gts_ultra_road.12.desc: "Our ships have arrived at the star system marked on the star charts. The distribution of resources is exactly the same as on the map of that flying device. Our engineering department's new engineering ships are on their way to the system to build our first outpost, thus marking our presence among the stars.\n\nOur scientists will continue to report on the resources of these worlds to help us better conquer this starfield."
  # 很好，让她们保持下去
  gts_ultra_road.12.a: "Good, keep it going."
  # 伟大的梦终于踏出了至关重要的第一步
  gts_ultra_road.12.b: "The great dream has finally taken its crucial first step."
  # 为什么都这么小？
  gts_ultra_road.13.name: "Why Are They All So Small?"
  # 我们的科学家发现了一种普遍的异常现象，似乎这个宇宙中很多东西都比我们小得多\n\n我们从第一个宜居世界中所探索到的生物，体型极为渺小，它们的大小比那个飞行器中的生物稍微大一点，但是在我们眼中已经和灰尘差不多了，或者说，比灰尘更加难以察觉\n\n我们的殖民船队已经准备好了，但我们不知道那颗星的生态是否能够承受住我们的体型
  gts_ultra_road.13.desc: "Our scientists have discovered a widespread anomaly. It seems that many things in this universe are much smaller than us.\n\nThe living creatures we discovered on the first habitable world are extremely tiny. Their size is slightly larger than the creatures from that flying device, but in our eyes they already are closer to dust, or rather, even more difficult to perceive than dust.\n\nOur colony ship fleet is ready, but we don't know if the ecosystem of that star can withstand our size."
  # 立刻派出我们的殖民船队，实践出真知
  gts_ultra_road.13.a: "Immediately dispatch our colony fleet, the truth comes from practice."
  # 延后船队的时间，我们需要更多的知识来支撑这次殖民
  gts_ultra_road.13.b: "Postpone the fleet's departure; we need more knowledge to support this colonization."
  # 奇怪的现象
  gts_ultra_road.14.name: "A Strange Phenomenon"
  # 我们不知道发生了什么，但我们的导航员确实是在仪器上发现了一个不太明显的异常现象，只是，这也太小了?\n\n好吧，对于这种微小的事物在日后也许会更多，我们不能停下探索天空的脚步，等待你的指示，大人
  gts_ultra_road.14.desc: "We do not know what happened, but our navigators did find a subtle anomaly on their instruments, but, is it too small?\n\nWell, there might be more of such tiny things in the future. We cannot stop our explorations of the sky. Waiting for your instructions, adult."
  # 研究那个异常现象
  gts_ultra_road.14.a: "Research that anomaly."
  # 先搁置一下，我们有更多任务
  gts_ultra_road.14.b: "Set it aside for now, we have more tasks."
  # 一个小洞
  gts_ultra_road.15.name: "A Small Hole"
  # 我们的科研船来到了海图上标注为虫洞的地方，这里真的是什么都没有，只有一个有着异常引力场的虫洞，那群飞船上的家伙真的没有在上面有任何的标注，只说远离这个地方\n\n好吧，我们的科学家正在用仪器探索这个虫洞有何特别之处，等待我们的消息吧
  gts_ultra_road.15.desc: "Our research ship has arrived at the location designated as a wormhole on the star chart. There is really nothing there, just a wormhole with an anomalous gravity field. Those guys on the flying ship really didn't make any markings on it, only said to stay away from it.\n\nWell, our scientists are exploring this wormhole with instruments to see what's so special about it; await our news."
  # 加快速度，时间不等人
  gts_ultra_road.15.a: "Speed it up, time waits for no one."
  # 我有预感，这里有一些不一样的事情
  gts_ultra_road.15.b: "I have a hunch that something unusual is here."
  # 问题所在
  gts_ultra_road.16.name: "The Problem Is..."
  # 我们的科学家汇报了最新的情报，她们说那个洞对于我们来说十分小，但是对于他们，那些飞船上的生物来说是十分危险的，不稳定的引力场随时会将她们拖走，巨大的潮汐力会直接把她们的船壳撕碎\n\n科学部的建议是，做好准备，因为这个银河绝大部分事物的大小和我们似乎有着巨大的不同
  gts_ultra_road.16.desc: "Our scientists have reported the latest information, saying that the hole is very small for us, but for them, those creatures on the flying ship, it was very dangerous. The unstable gravity field could drag them away at any time, and the enormous tidal forces would directly tear their ship hulls apart.\n\nThe science department's advice is to prepare, because the size of the vast majority of things in this galaxy seems to be vastly different from ours."
  # 巨大的不同，有多巨大?
  gts_ultra_road.16.a: "Vastly different, how vast?"
  # 通知下去，我们需要讨论出具体方案
  gts_ultra_road.16.b: "Inform everyone, we need to discuss a detailed plan."
  # 穿过大桥
  gts_ultra_road.17.name: "Crossing the Bridge"
  # 我们的科研部研发了一种探测器，能够抵抗住虫洞的潮汐力撕扯，它搭载的仪器能够安全的送入虫洞，并且能正常的从另一边出来，并且进行了微小化处理，比那艘飞船还要再小上十倍\n\n根据飞船上寻找到的超空间通讯器制作图纸，我们已经能保证它在几百光年后依旧能保证信息的及时传达。现在这些仪器已经在虫洞旁边调试完毕了，随时能够进入虫洞
  gts_ultra_road.17.desc: "Our research department has developed a probe capable of withstanding the wormhole's tidal forces. The instruments it carries can be safely sent into the wormhole and come out normally on the other side, and they've been miniaturized, becoming ten times smaller than that ship.\n\nAccording to the hyperspace communicator schematics found on the ship, we can ensure that it will still be able to transmit messages in time even from hundreds of light-years away. Now these instruments are already debugged by the wormhole and are ready to enter the wormhole at any time."
  # 立刻发射探测器
  gts_ultra_road.17.a: "Launch the probe immediately."
  # 再多做点检查后发射
  gts_ultra_road.17.b: "Launch it after a few more checks."
  # 奇怪的结构
  gts_ultra_road.18.name: "A Strange Structure"
  # 根据科研船的报告，我们在§Y[from.GetName]§!星系发现了一个巨大的结构，相对于之前的东西来说，这个确实是巨大的建筑。由一个圆环组成，中间有些许能量反应，从其它地方我们也能感受到一些能量信号，但从外形上来看，这个建筑物损坏的十分惊人，绝大部分部件受损，以我们现在的技术不太可能修的好这个东西，不过我们的工程部门已经下定决心要给它修整明白，你的意思呢，大人。
  gts_ultra_road.18.desc: "According to the research ships report we have discovered a huge structure in the §Y[from.GetName]§! system which relative to everything else, is indeed a huge building. It consists of a circle, with a slight energy response in the middle. We can feel some energy signals from elsewhere, but from the external looks, the building is damaged surprisingly severely. Most of its components are damaged. With our current technology, it is unlikely we can fix this thing, but our engineering department has decided to fix it well. What do you think, adult?"
  # 我认为修复是必要的，让工程部抓紧时间
  gts_ultra_road.18.a: "I think it is necessary to fix it; let the engineering department hurry up."
  # 与之相比，虫洞的研究如何了
  gts_ultra_road.18.b: "What is the progress on the wormhole research compared to that?"
  # 虫洞和这个东西对我们的未来都很重要，不能落下哪一个
  gts_ultra_road.18.c: "Both the wormhole and this thing are very important to our future, neither can be neglected."
  # 问题的解决方案
  gts_ultra_road.19.name: "The Solution to the Problem"
  # 工程部那边有答复了，她们从那座小飞船的数据保险库里找到了类似的东西，但是重要内容被加密了，我们的科研部正在寻找解决方案
  gts_ultra_road.19.desc: "The engineering department has an answer. They found similar items in the data vault of the small spaceship, but important contents are encrypted. Our research department is trying to find a solution."
  # 让科研部加速破解
  gts_ultra_road.19.a: "Let the research department speed up the decryption."
  # 虫洞的回响
  gts_ultra_road.20.name: "Echoes from the Wormhole"
  # 惊天好消息，我们的探测器抵达了虫洞另一侧，根据我们的探测器回复，它那边的虫洞和这边一样大小，周边没有任何东西，我们并没有它坐标附近的海图，他只能靠着自己搭载的探索系统来搜索最近的恒星了
  gts_ultra_road.20.desc: "Incredibly good news! Our probe has reached the other side of the wormhole. According to its data, the wormhole on the other side is the same size as this one, and there is nothing around it. We do not have a star chart of the area near its coordinates, it can only search for the nearest star using its own exploration system."
  # 又是一位伟大的先驱者
  gts_ultra_road.20.a: "Another great pioneer."
  # 银河中的足迹
  gts_ultra_road.21.name: "Footprints in the Galaxy"
  # 我们的探测器用携带的资源在其所在的星系内建立了第一个据点，此举代表着我们正式加入到了银河的棋局之中！
  gts_ultra_road.21.desc: "Our probe has used its carried resources to establish the first outpost in the system it is located in, representing our official entry into galactic game!"
  # 她们的一小步，我们的一大步！
  gts_ultra_road.21.a: "A small step for them, a huge step for us!"
  # 第一批人员
  gts_ultra_road.22.name: "The First Personnel"
  # 在基地建成后，我们挑选了几位有着基地驻扎经验的科学官前往了那里，她们将在上面收集银河内的所有情报，同时，她们也会作为交流代表，与银河中的其它文明做最前期的交涉\n\n我们离真正的星际文明只差一步之遥
  gts_ultra_road.22.desc: "After the base was completed, we selected several scientific officers with experience in garrisoning bases to go there. They will collect all information in the galaxy, and at the same time, they will act as communication representatives to conduct the earliest contact with other civilizations in the galaxy.\n\nWe are only one step away from a true interstellar civilization."
  # 星辰大海中的逐梦人
  gts_ultra_road.22.a: "Dreamers in the Sea of Stars."
  # 友好的通讯？
  gts_ultra_road.23.name: "Friendly Communication?"
  # 我们的人收到了一封来自§Y[event_target:gts_ultra_road_communicate_country.GetName]§!大使的通讯，基地的人员在询问我们应该怎么处理\n\n直接与它们建立联系还是保持通讯沉默，亦或是谨慎的接触?
  gts_ultra_road.23.desc: "Our people have received a communication from the ambassador of §Y[event_target:gts_ultra_road_communicate_country.GetName]§!, personnel at the base want to know how we should handle it.\n\nShould we establish contact with them directly, maintain communications silence, or make cautious contact?"
  # 直接通讯
  gts_ultra_road.23.a: "Direct communication."
  # 沉默是我们自保的一种手段
  gts_ultra_road.23.b: "Silence is a means of self-preservation."
  # 接触是必须的，但谨慎是必备的
  gts_ultra_road.23.c: "Contact is necessary, but caution is essential."
  # 对话1A
  gts_ultra_road.24.name: "Dialogue 1A"
  # 幸好，我们拥有它们的全套语言文本，我们可以毫不费力的与她们进行交流了
  gts_ultra_road.24.desc: "Fortunately, we have their full set of language texts, we can communicate with them effortlessly."
  # 友善的朋友
  gts_ultra_road.24.a: "Friendly friends."
  # 1A
  gts_ultra_road.25.name: "1A"
  # 怎么....你们是怎么从那个地方出来的，我们应该是封死了才对，可恶，必须向首都汇报..
  gts_ultra_road.25.desc: "How... how did you get out of that place, we should have sealed it off, damn it, we must report this to the capital..."
  # 怎么回事.....
  gts_ultra_road.25.a: "What... what is going on?"
  # 等等....什么叫做封死
  gts_ultra_road.25.b: "Wait... what do you mean by sealed off?"
  # 1B
  gts_ultra_road.26.name: "1B"
  # 快滚开！你们这去恶心的东西，离开我们的边境
  gts_ultra_road.26.desc: "Get away! You disgusting thing, get out of our border!"
  # 真是令人恼火的态度...
  gts_ultra_road.26.a: "What an annoying attitude..."
  # 1C
  gts_ultra_road.27.name: "1C"
  # 你们这帮恶心的地狱生物，把你们贪婪的嘴巴离我们的帝国远一点！
  gts_ultra_road.27.desc: "You disgusting hell-spawn, keep your greedy mouths away from our empire!"
  # 莫名其妙的家伙...
  gts_ultra_road.27.a: "Strange fellows..."
  # 2A
  gts_ultra_road.28.name: "2A"
  # 奇怪，为什么会突然显示有一个信号接入，深空雷达上还全是杂波，老设备早该换换了。
  gts_ultra_road.28.desc: "Strange, why is there suddenly a signal connection, the deep space radar is full of static, the old equipment should be changed."
  # 沉默是我们最有力的铠甲....
  gts_ultra_road.28.a: "Silence is our strongest armor..."
  # 3A
  gts_ultra_road.29.name: "3A"
  # 啊，一个新的文明，我们很乐于与其它文明进行交流。怎么了，讲一讲你们文明的故事吧
  gts_ultra_road.29.desc: "Ah, a new civilization. We are very happy to communicate with other civilizations. What's up, tell us the story of your civilization."
  # 我们伪装的很好，他们没有发现
  gts_ultra_road.29.a: "We are well-disguised, they didn't notice."
  # 3B
  gts_ultra_road.30.name: "3B"
  # 你们的历史十分有趣，年轻的文明，我们非常乐于和我们同样年轻的文明进行交流
  gts_ultra_road.30.desc: "Your history is very interesting, young civilization, we are very happy to communicate with a civilization that is as young as ours."
  # 我们也乐于同你们这样的文明进行交流，没有那么自大
  gts_ultra_road.30.a: "We are also happy to communicate with civilizations like yours, not so arrogant."
  # 3C
  gts_ultra_road.31.name: "3C"
  # 等等....这个生物特征和信号....\n\n他妈的是那群恶心的巨大阴影！快跑！我们被骗了！
  gts_ultra_road.31.desc: "Wait... this biological signature and signal...\n\nDamn it, it's those disgusting giant shadows! Run! We've been tricked!"
  # 真是的，还是被识破了啊...
  gts_ultra_road.31.a: "Oh well, we were still seen through..."
  # 国内的呼声
  gts_ultra_road.32.name: "Domestic Voices"
  # 在我们同外星人进行交流后，发现它们和我们观察的一样微小到了极致，小到他们所生活的星球和我们最小的探索船对比起来都显得非常渺小。因此，国内的呼声大抵分为两派。一派是支持同它们友好的交流，不会过多的干涉它们，另一派则是认为需要彻底支配它们，让我们成为银河的霸主\n\n她们都等着听取您的意见，大人，这将会决定我们整个种族对待外星文明的态度
  gts_ultra_road.32.desc: "After we communicated with the aliens, we realized that they are as extremely small as what we had observed. They are so small that the planet they live on is extremely insignificant compared to our smallest exploration ship. Therefore, domestic voices are generally divided into two factions. One faction supports friendly communication with them and will not interfere with them too much, and the other faction believes that they need to be completely dominated so that we can become the overlords of the galaxy.\n\nThey are all waiting to hear your opinion, adult. This will determine our entire race's attitude towards alien civilizations."
  # 我们必然将成为银河之中最伟大的种族，这个宇宙只能是我们双足下的一部分！
  gts_ultra_road.32.a: "We will surely become the greatest race in the galaxy, this universe can only be a part under our feet!"
  # §Y这将使帝国发展偏向残忍§!
  gts_ultra_road.32.a.tooltip: "§YThis will make the development of the Empire lean towards cruelty!§!"
  # 我们无意间的举动就足以彻底改变他们无数人的生活，让我们暂时隐居幕后吧
  gts_ultra_road.32.b: "Our unintentional actions are enough to completely change the lives of countless of them. Let us temporarily hide behind the scenes."
  # §Y这将使帝国发展偏向中立§!\n\n§R敬请期待§!
  gts_ultra_road.32.b.tooltip: "§YThis will make the development of the Empire lean towards neutrality!§\n\n§RStay Tuned!§!"
  # 移山填海仅需指腹下的一念，这片银河的任何险阻必在我们引领下化为坦途
  gts_ultra_road.32.c: "Moving mountains and filling seas can be achieved solely with a thought from our fingertip. Any obstacle in this galaxy will surely be transformed into a smooth road under our guidance."
  # §Y这将使帝国发展偏向温柔§!\n\n§R敬请期待§!
  gts_ultra_road.32.c.tooltip: "§YThis will make the development of the Empire lean towards gentleness!§!\n\n§RStay Tuned!§!"
  # 残忍系倾向
  gts_situation_ultra_road_cruel_1: "Cruel Path Tendency"
  # 残忍系倾向
  gts_situation_ultra_road_cruel_1_type: "Cruel Path Tendency"
  # 我们的民众热衷于将银河与其它文明踩在脚下，而我们的帝国也确实要如此行动
  gts_situation_ultra_road_cruel_1_desc: "Our people are eager to trample the galaxy and other civilizations underfoot, and our empire shall indeed act accordingly."
  # 
  stage_ultra_road_cruel_1_1_tooltip: """"
  # 我们的国民对银河的渴望愈来愈大，她们急切的想要将挡在我们面前的任何东西碾碎在脚底
  stage_ultra_road_cruel_1_2_tooltip: "Our citizens' desire for the galaxy is growing, they are eager to crush anything that stands in our way."
  # 我们整个社会正在往某种极端化的方向变幻，这到底是好是坏呢？
  stage_ultra_road_cruel_1_3_tooltip: "Our whole society is changing in an extreme direction. Is this good or bad?"
  # 我们的帝国必将获得整个银河，不过帝国内仍然有一些对外星人表示好感的家伙，我们需要给她们教训，不是吗？
  stage_ultra_road_cruel_1_4_tooltip: "Our empire will surely obtain the entire galaxy, but there are still some who express goodwill towards aliens in the empire. We need to teach them a lesson, don't we?"
  # 只剩下一小部分国民依然保有着不切实际的幻想，时间会告诉它们真正的情况是什么\n\n*帝国边境上似乎有不少的外来人口失踪案件，我们也许可以调查一下，但既然失踪的是外星人，谁在乎呢
  stage_ultra_road_cruel_1_5_tooltip: "Only a small number of citizens still hold unrealistic fantasies. Time will tell them what the real situation is.\n\n*There seems to be a considerable amount of missing foreign populations on the empire's border, maybe we should investigate, but since these are disappearing aliens, who cares?"
  # 那些顽固的家伙依然认为自己的想法是正确的，所谓「银河的生物愿意和我们好好的交流」，当然，她们掀不起什么风浪
  stage_ultra_road_cruel_1_6_tooltip: "Those stubborn fellows still think their ideas are correct, the so-called \"creatures in the galaxy are willing to communicate with us nicely.\" Obviously, they will amount to nothing."
  # 所有人都知道我们伟大的目标，那就是将整个银河踩在脚下，没有任何事物能够抵挡我们前进的步伐，因为这是我们整个国家所认同的唯一道路！前进吧，向着伟大的未来，前进！
  gts_ultra_road_cruel_1_completed: "Everyone knows our grand goal, which is to trample the entire galaxy under our feet. Nothing can stop our progress, because this is the only road recognized by our entire nation! Advance, towards a great future, advance!"
  # 
  gts_ultra_road_cruel_1_fail: """"
  # 继续我们的正义之路
  gts_ultra_road_cruel_1_positive: "Continue on our righteous path."
  # 
  gts_ultra_road_cruel_1_positive_effect: """"
  # 我们不应该如此激进
  gts_ultra_road_cruel_1_neutral: "We shouldn't be so aggressive."
  # 
  gts_ultra_road_cruel_1_neutral_effect: """"
  # 他们都将拜倒在我们的脚下，不必急于一时
  gts_ultra_road_cruel_1_negative: "They will all bow down at our feet, there is no need to rush."
  # 
  gts_ultra_road_cruel_1_negative_effect: """"
  # 袭扰
  gts_ultra_road.200.name: "Harassment"
  # 我们的人在边境被一些航天器攻击了，它们用污言秽语和劣质的武器攻击我们国民的神圣躯体，而我们的国民也发动了英勇的反击，摧毁了所有发动攻击的飞行器和星球。趁此机会正好给这些还对灰尘们抱有幻想的她们敲了一记警钟，任何微型外星人都应该被我们碾碎在星空之中，无一例外！
  gts_ultra_road.200.desc: "Our people on the border were attacked by some spacecraft. They attacked the sacred bodies of our citizens with filthy language and inferior weapons. And our citizens also launched a heroic counterattack, destroying all the attacking flying devices and planets. Take this opportunity to give these people who still have fantasies about the dust a warning, any micro-aliens should be crushed by us in the stars, without exception!"
  # 碾碎这些虫子
  gts_ultra_road.200.a: "Crush those insects."
  # 鲜血与秩序
  gts_ultra_road.300.name: "Blood and Order"
  # 我们的国民已经迫不及待的想要踩点什么来解压了，恩，这个帝国...那个种族，星海理事会里面的物种和文明足够填满我们的餐桌，我们为刀俎
  gts_ultra_road.300.desc: "Our people can't wait to step on something to relieve stress, well, this empire... that race, the species and civilizations in the Galactic Council are enough to fill our table. We are the cleaver."
  # 它们，则只配为鱼肉
  gts_ultra_road.300.a: "They are only fit to be the fish meat."
  # 鲜血与秩序
  gts_situation_ultra_road_cruel_2: "Blood and Order"
  # 鲜血与秩序
  gts_situation_ultra_road_cruel_2_type: "Blood and Order"
  # 我们的国民已经迫不及待的想要踩点什么来解压了，恩，这个帝国...那个种族，星海理事会里面的物种和文明足够填满我们的餐桌，我们为刀俎，它们，则只配为鱼肉
  gts_situation_ultra_road_cruel_2_desc: "Our citizens can't wait to step on something to relieve their stress. Well, this empire... that race, the species and civilizations in the galactic council are enough to fill our dinner table. We are the cleaver, they are only fit to be the fish meat."
  # 
  stage_ultra_road_cruel_2_1_tooltip: """"
  # 
  stage_ultra_road_cruel_2_2_tooltip: """"
  # 
  stage_ultra_road_cruel_2_3_tooltip: """"
  # 
  stage_ultra_road_cruel_2_4_tooltip: """"
  # 
  stage_ultra_road_cruel_2_5_tooltip: """"
  # 
  stage_ultra_road_cruel_2_6_tooltip: """"
  # 
  stage_ultra_road_cruel_2_7_tooltip: """"
  # 
  stage_ultra_road_cruel_2_8_tooltip: """"
  # 
  gts_ultra_road_cruel_2_completed: """"
  # 
  gts_ultra_road_cruel_2_fail: """"
  # 倾向绝对残忍系
  gts_ultra_road_cruel_2_absolute: "Tendency: Absolute Cruelty"
  # 
  gts_ultra_road_cruel_2_absolute_effect: """"
  # 倾向秩序残忍系
  gts_ultra_road_cruel_2_order: "Tendency: Orderly Cruelty"
  # 
  gts_ultra_road_cruel_2_order_effect: """"
  # 残忍系绝对化
  gts_ultra_road.310.name: "Cruelty Absolute"
  # 当然，应当如此，对待外星人就应该赶尽杀绝，就连沾染了它们血的土地，都需要再被我们的圣躯践踏一遍！
  gts_ultra_road.310.desc: "Of course, it should be so. Aliens should be exterminated. Even the land that has been stained with their blood needs to be trampled by our sacred bodies again!"
  # 这些该死的虫子
  gts_ultra_road.310.a: "These damned insects."
  # 星球清理
  gts_ultra_road.311.name: "Planet Cleanup"
  # 嗯哼~境内的外星人快要灭绝了呢，我的意思是，那些没有经过允许擅自跨越边境线，溜进我们领土内的小虫子，它们已经被我们的卫戍部队踩进了星球里面，真希望它们的文明能够意识到自己的错误~
  gts_ultra_road.311.desc: "Hmm~ The aliens in our territory are almost extinct. I mean, those little bugs who crossed the border without permission and sneaked into our territory, they have been trampled into the planets by our garrison force. I hope their civilization will realize their mistakes~"
  # 是时候消灭他们了
  gts_ultra_road.311.a: "It's time to eliminate them."
  # 引进玩物
  gts_ultra_road.312.name: "Introducing Playthings"
  # 嗯，我们是不是应该进口一些虫子来给我们玩乐了，毕竟本土物种已经被我们彻底灭绝了，为了满足国民的需要，适当地引进游玩项目也是必要的，对吧。说到这，我的高跟鞋好久没有被虫子们的血保养了，上面都有点褪色了，指的是血迹褪色哦~
  gts_ultra_road.312.desc: "Hmm, should we import some bugs for us to have fun? After all, our native species have been completely exterminated by us. In order to meet our citizens' needs, it is necessary to appropriately introduce playing programs, right? Speaking of which, my high heels haven't been maintained with bugs' blood for a long time, a bit faded. I mean, the blood stains are faded, haha~"
  # 引进小人
  gts_ultra_road.312.a: "Import little people."
  # 掠夺小人
  gts_ultra_road.312.b: "Plunder little people."
  # 外交抗议
  gts_ultra_road.313.name: "Diplomatic Protest"
  # 大人，您有看最近的新闻了吗？那些虫子居然在抗议我们的行为，说我们把它们的人口都抢走了，让它们无法从事生产，它们正在用自己的船只封锁我们的边境，甚至其中有不少都进入了国境内。我们的部队已经在前往“驱散”的路上了，嗯，虫子们在边境还做了一个临时定居点，不知道里面会有多少玩具等着我们呢，到时候就让她们把那个东西带回来，给大人您好好玩弄吧~
  gts_ultra_road.313.desc: "Adult, have you seen the news recently? Those bugs are actually protesting against our actions, saying that we have robbed all of their population, leaving them unable to produce... they are using their ships to blockade our border, and many even entered the country. Our troops are already on their way to 'disperse' them, well, the bugs also made a temporary settlement at the border, I wonder how many toys will be waiting for us inside there. When the time comes, they can bring them back for you to play with, adult~"
  # 快点拿上来吧
  gts_ultra_road.313.a: "Bring them up here quickly."
  # 掠夺小人
  gts_ultra_road.314.name: "Plundering Little People"
  # 大人，虫子们在要求我们归还那些被它们列为失踪的人口。本着友好外交的想法，我直接将我的高跟鞋丢给了虫子，结果虫子现在和它们的同类一样，都变成了我高跟鞋上的血渍了。虫子们已经在边境上集结了更多的部队，我们是不是应该给予它们一点小小的警告呢~还是说，大人想要亲自出马，好好的玩弄一下无知的虫子们
  gts_ultra_road.314.desc: "Adult, the bugs are demanding we return the population that they listed as missing. In the spirit of friendly diplomacy, I directly threw my high heels at the bugs. As a result, the bugs are now like their counterparts, blood stains on my high heels. The bugs have gathered more troops on the border, should we give them a small warning ~ or do you want to go yourself and play with those ignorant bugs ~"
  # 让我来试试
  gts_ultra_road.314.a: "Let me try it out."
  # 抗议升级
  gts_ultra_road.315.name: "Protests Escalate"
  # 关于边境的事件，我们的部队已经将虫子们摧毁和收容了，不少虫子通过钻入丝袜内的方法躲过了死亡，但在之后的几分钟内就在肉壁之中被碾碎了。关于那个定居站，则因为一名舰娘的失职而彻底消失在了她的丝袜上，没有办法带给大人您了。但我们可知的是，那些虫子的领袖对我们的行为进行了强烈的谴责，并扬言在边境集结更多的部队来对抗“威胁文明存续的对象”。它的发言在虫子口水会上得到了相当的支持，可能在不久的未来，虫子们就会对我们发动进攻，不过那对我们来说也只是送更多的玩具罢了，不是吗？
  gts_ultra_road.315.desc: "Regarding the border incidents, our troops have already destroyed and contained the bugs. Many bugs avoided death by drilling into silk stockings, but were crushed within the flesh wall in the following minutes. As for that settlement, it disappeared completely on a shipgirl's stockings because of her dereliction of duty. Therefore cannot bring it back for your playing, adult. But what we know is that the leaders of those bugs strongly condemned our behavior, and threatened to gather more troops at the border to confront the 'threat to the survival of the civilization'. Its speech received considerable support at the bugs' saliva conference. It is possible that the bugs will launch an attack on us in the near future. But for us, that is just sending more toys, isn't it?"
  # 我们需要先发制人，否则就宣布对它们的战争
  gts_ultra_road.315.a: "We need to strike first, or declare war on them."
  # 我觉得可以等待一下，这样我们可以指定对我们和它们都好的方案
  gts_ultra_road.315.b: "I think we should wait a bit, so we can come up with a plan that is good for both us and them."
  # 边境冲突
  gts_ultra_road.316.name: "Border Conflict"
  # 虫子们已经在边境上集结了相当多的“舰队”，但昨天我过去进行交涉的时候解决了这一棘手的外交事件，只是对面不太想立刻就走，再加上因为虫子们的挡路，我们无法去虫子的巢穴里找到适合我们的玩具，于是它们的“舰队”，就变成了我给卫戍部队的奖励，以及小小的满足一下我的个人爱好。在驱散那些拦路的家伙后，我们成功的把一些玩具带了回来，数量挺多的，说是来寻找它们失踪的虫子同伴什么的，够我们的国民好好的娱乐一下了~
  gts_ultra_road.316.desc: "The bugs have gathered a considerable number of \"fleets\" on the border, but when I went over yesterday to negotiate, I resolved this tricky diplomatic event, it's just that the other side didn't want to leave right away, and because the bugs were blocking the way, we couldn't find us suitable toys in the bugs' lair, so their 'fleets' become my reward for the garrison forces, and to satisfy my personal hobby a little. After dispersing the barrier, we successfully brought back some toys, quite a lot. They said they were coming to look for their missing bug companions or something, enough for our citizens to have some good fun~"
  # 我们应该更具强制手段一些，它们不值得我们考虑后果
  gts_ultra_road.316.a: "We should be more forceful, they are not worth considering the consequences."
  # 现在就这样还是太缺考量，我们需要更多时间来思考具体对策
  gts_ultra_road.316.b: "It's still too hasty to act right now, we need more time to think about a specific countermeasure."
  # 宇宙广播
  gts_ultra_road.317.name: "Universal Broadcast"
  # 我们的国民迫不及待的想要享用更多的虫子，它们很受欢迎，不是吗？所以我们应该以更绝对的手段去拿取我们所需的东西，而不是等待着它们再次向我们挑衅，我们需要主动出击\n\n因此，我们需要让周边国家臣服于我们的脚下，这样它们才能安心的把人口送给我们。那些家伙可不会因为我们的要求而简单的把人口转给我们，我们需要一点更具有强制力的手段\n\n彻底摧毁它们的骄傲，让它们乖乖把我们需要的东西给我们
  gts_ultra_road.317.desc: "Our citizens can't wait to enjoy more bugs. They are very popular, aren't they? So we should use more absolute means to take what we need, instead of waiting for them to provoke us again. We need to take the initiative.\n\nTherefore, we need to bring neighboring countries under our feet, so that they can safely send populations to us. Those fellows will not simply transfer population to us because we asked, we need a more coercive means.\n\nCompletely destroy their pride, and force them to give us what we need."
  # 我们舰队不是很闲吗？现在是她们干事的时候了！
  gts_ultra_road.317.a: "Aren't our fleets idle? Now it's time for them to take action!"
  # 宇宙广播
  gts_ultra_road.318.name: "Universal Broadcast"
  # 我们的国民摩拳擦掌，只等待您的命令，她们就会跨越虚无的国境线，去获得她们早该拥有的一切\n\n几年前，我们认为如此激进还为时尚早，而今天，我们已做好万全准备，只为了将本就属于我们的东西取回来！
  gts_ultra_road.318.desc: "Our citizens are itching for action, just waiting for your command. They will cross the void border to take back everything that they should have owned long ago.\n\nA few years ago, we thought that being so aggressive was too early, but today, we are fully prepared, just to take back what was ours in the first place!"
  # 我们的东西，只会被我们自己的手取回！
  gts_ultra_road.318.a: "What is ours, will only be taken back by our own hands!"
  # 恢复秩序
  gts_ultra_road.320.name: "Restoring Order"
  # 我们的国民对虫子们的痴迷到了一种不可控的地步，这对我们的社会运转造成了相当的混乱，我想，我们是时候去规范化这些行为了，毕竟大人您知道，这种事情可没办法按下刹车键。所以，我们应该用更加严酷的律法约束她们，还是应顺应我们国民的意志呢？
  gts_ultra_road.320.desc: "Our citizen's obsession with bugs has reached an uncontrollable level, this has caused considerable chaos on the operation of our society. I think it is time for us to standardize these behaviors, after all, as you know, there is no way to hit the brakes on this kind of thing. So, should we restrain them with stricter laws, or should we follow our citizens' will?"
  # 严酷的律法才能维持我们社会的安定
  gts_ultra_road.320.a: "Stricter laws can maintain the stability of our society."
  # 顺从民意并稍加引导，我们的国家只会更加美好
  gts_ultra_road.320.b: "Following public opinion and guiding it slightly, our country will only become better."
  # 建立权威
  gts_ultra_road.321.name: "Establishing Authority"
  # 见效十分迅速，我们的教育人员将数百名狂热娱乐分子逮捕并教育后，她们完全接纳了我们的新定义，即\n\n“有限制的娱乐，无限制的虐杀。”\n\n我们正在往下一阶段稳步前行，新的秩序将会建立一个更加美好的银河！
  gts_ultra_road.321.desc: "It worked very quickly. After our educators arrested and educated hundreds of fanatic entertainment enthusiasts, they completely accepted our new definition, which is:\n\n'Restricted entertainment, unrestricted slaughter'.\n\nWe are steadily moving to the next stage, the new order will establish a better galaxy!"
  # 这才像话
  gts_ultra_road.321.a: "That's more like it."
  # 打击犯罪
  gts_ultra_road.322.name: "Cracking Down on Crime"
  # 啊，最后一批分子也被逮捕了，但很可惜，作为顽固派的她们不太可能接受律法的管制，但银河的黑暗包容万物，不是吗，大人？\n\n她们在不久后就会被海军选走并单独作为灭绝舰队参加行动，她们那高超的毁灭技艺会以极短的速度摧毁敌人的一切障碍\n而此时此刻，我们的帝国可以说完全迈入了崭新的时代，由秩序领导的新未来！
  gts_ultra_road.322.desc: "Ah, the last batch of elements has also been arrested, but unfortunately, as stubborn partisans, they are unlikely to accept the control of the law. But the darkness of the galaxy encompasses everything, doesn't it, adult?\n\nThey will soon be selected by the navy and participate in operations as independent extermination fleets. Their superb destruction skills will destroy all obstacles of the enemy at an extremely fast pace. And at this moment, our empire can be said to have completely entered a new era, a new future led by order!"
  # 崭新的一页
  gts_ultra_road.322.a: "A new page."
  # 新时代
  gts_ultra_road.323.name: "New Era"
  # 崭新的时代已经来到了，大人，我们的前方，是银河亿万年来最重要的时刻，我们将宣布我们统一银河的诏书，无论接受与否，一切，都将归于我们的秩序之下，与我等为敌，便只能化为尘埃！
  gts_ultra_road.323.desc: "The new era has arrived, adult. Ahead of us, is the most important moment in billions of years of galactic history. We will announce our decree to unify the galaxy. Whether they accept or not, everything will be under our rule. Those who are hostile to us can only be reduced to dust!"
  # 将宣告广播至整个银河，我们所创造的秩序必将照耀整片星空
  gts_ultra_road.323.a: "Broadcast this decree to the entire galaxy. The order we have created is bound to illuminate the whole sky."
  # 不久之后，我们将高声宣告我们的到来！
  gts_ultra_road.323.b: "Soon, we will loudly announce our arrival!"
  # 新政策
  gts_ultra_road.324.name: "New Policies"
  # 我们制定了多项利好民众的政策，同时也通过这些政策的执行获得了相当的数据，我想不久的将来，我们一定会将我们建立的秩序将浩瀚无垠
  gts_ultra_road.324.desc: "We have formulated a number of policies that are beneficial to the people, and at the same time, we have obtained considerable data through the implementation of these policies. I think that in the near future, we will surely make the order we have established as boundless as the vast universe."
  # 不错
  gts_ultra_road.324.a: "Not bad."
  # 民心所向
  gts_ultra_road.325.name: "Popular Support"
  # 我们已经将所有政策落实了，现在大家都能得到平等数量的玩具和同样地高质量游玩体验了\n\n以及，我们对银河的政策，对整片星空未来的规划，都在这张纸上了。而现在，是时候宣告我们的真实存在了，不是吗，大人？
  gts_ultra_road.325.desc: "We have implemented all our policies, and now everyone can get an equal number of toys and the same high-quality game experience.\n\nAlso, our policies for the galaxy, and our plans for the future of the entire sky are all on this piece of paper. And now, it's time to announce our true existence, isn't it, adult?"
  # 我们的秩序，我们的统治，银河的真正未来
  gts_ultra_road.325.a: "Our order, our rule, the true future of the galaxy."
  # 伟大的未来需要坚实的过去作为基础，现在为时尚早
  gts_ultra_road.325.b: "A great future requires a solid past as its foundation, it is still too early."
  # 宇宙广播
  gts_ultra_road.326.name: "Universal Broadcast"
  # 我们将获得胜利与荣耀，你们终将化为尘土\n\n你们得到的只有无尽的黑暗与牺牲，而我们得到的是整片灿烂的星空！\n\n臣服于我们，我们允许和细菌一样的你们能够存活在银河最黑暗的角落之中。否则，等待你们这些细菌的只有终结与死亡！
  gts_ultra_road.326.desc: "We will achieve victory and glory, and you will eventually be reduced to dust.\n\nYou will only get endless darkness and sacrifice, while we will gain the entire splendid sky!\n\nSubmit to us. We will allow you, the bacteria, to survive in the darkest corners of the galaxy. Otherwise, all that awaits you bacteria is the end and death!"
  # 我们将胜利之光，洒向整片星海
  gts_ultra_road.326.a: "We will spread the light of victory to the entire sea of stars."
  # 宇宙广播
  gts_ultra_road.327.name: "Universal Broadcast"
  # 几年前，我们还显得稚嫩，而现在，我们的强大早已经让银河震颤\n\n让我们高高举起统一银河的旗帜，将那些蛆虫与蝼蚁同它们肮脏的巢穴一同毁灭\n\n而我们的秩序之光将散发出远超恒星的光辉，照耀整个银河系！\n\n我们必将获得胜利的荣耀，而它们只能得到终结与死亡！
  gts_ultra_road.327.desc: "A few years ago, we were still naive, but now, our power has already made the galaxy tremble.\n\nLet us raise high the banner of galactic unification and destroy those maggots and ants along with their filthy nests.\n\nAnd our light of order will radiate a brilliance far exceeding that of the stars, illuminating the entire galaxy!\n\nWe are bound to achieve the glory of victory, and they can only obtain the end and death!"
  # 时机已到
  gts_ultra_road.327.a: "The time has come."
  # 战争的前奏
  gts_ultra_road.400.name: "Prelude to War"
  # 我们的部队已经在边境上集结，数百战舰已经蓄势待发，那些虫子的国家还没有察觉到我们的事情\n\n我们应该毫不留情的击溃它们，不是吗?\n\n就这样，将我们的部队开进它们的国境线内吧！
  gts_ultra_road.400.desc: "Our troops have gathered on the border, hundreds of battleships are ready to go. Those bugs' countries have not yet noticed our intentions.\n\nWe should crush them mercilessly, shouldn't we?\n\nJust like that, let's drive our troops into their borders!"
  # 前进！碾碎眼前之敌！将我们的秩序播种于它们的鲜血上！
  gts_ultra_road.400.a: "Advance! Crush the enemy before our eyes! Sow our order in their blood!"
  # 灭亡的序曲
  gts_ultra_road.410.name: "Overture to Extinction"
  # 听啊，即便是在这里，我都能听见那些虫子们的嘶吼与惨叫，如同最动听的乐章一样，围绕在耳边\n\n看啊，即便是在这里，我都能看见那些蚂蚁们挽救它们的巢穴，不甘的泪水与仇恨的血液，浇灌这那片贫瘠的土地，它们用自己的身躯铸就了我们的伟大，令人感动
  gts_ultra_road.410.desc: "Listen, even from here, I can hear the roars and screams of those bugs, like the most beautiful music, surrounding my ears.\n\nLook, even from here, I can see those ants trying to save their nests, reluctant tears, and hateful blood, watering the barren land. They forged our greatness with their bodies, it is so touching."
  # 我想它们一定是为了我的的前程而操碎了心，不能辜负它们的好意啊
  gts_ultra_road.410.a: "I think they must've been so worried about my future progression and advancement, I can't let them down!"
  # 真是一群乖乖的小家伙，真希望能把它们的首领抓起来，这样就能好好的按摩一下我的脚了~
  gts_ultra_road.410.b: "What good and obedient little fellows, I really wish I could grab ther leaders so that they can massage my feet well~"
  # 烈焰的第一幕
  gts_ultra_road.411.name: "The First Act of Fire"
  # 看啊，敌人的疆域如同焰火一般，熊熊燃烧。燃烧着的，是它们的子民，是它们的土地，是它们的血\n\n如同柴薪一般，会揣着热血与我们为敌，包含着屈辱死去，可悲的小家伙们\n\n如果它们能够接受我们的提案，彻底沦为我们的奴仆，这一切都不会发生，不是吗\n\n只可惜，它们无能且自大的政府妄图与我们一战，就像是死亡与它们没有关系一样。但如此消耗我们帝国宝贵的人力资源实在可恶啊，大人。允许我们对自大的虫子们的首都进行毁灭，还是您另有打算？
  gts_ultra_road.411.desc: "Look, the enemy's territory is burning like fireworks. What is burning, are their people, their land, their blood.\n\nLike firewood, they stubbornly oppose us with hot blood, and die with humiliation, those pathetic little fellows.\n\nIf they could accept our proposal and completely become our slaves, none of this would have happened, right?\n\nIt's just a pity that their incompetent and arrogant government attempted to fight us, as if death had nothing to do with them. However, it is outrageous to waste our precious human resources of the empire like this, adult. Allow us to destroy the capital of those arrogant bugs, or do you have other plans?"
  # 毁灭它们吧，食腐的蛆虫不值得我们浪费太多时间
  gts_ultra_road.411.a: "Destroy them, the carrion-eating maggots are not worth our wasting too much time."
  # 我觉得自己的侍从部队需要一定量的扩充，它们刚刚好
  gts_ultra_road.411.b: "I think my retinue needs a certain degree of expansion, and they just fit the bill."
  # 终结的第二乐章
  gts_ultra_road.412.name: "The Second Movement of the Finale"
  # 嗯哼~蛆虫的王正在哀嚎，哀嚎着它们脆弱王朝的崩溃。令人愉悦，不是吗？\n\n它们失败的是如此的彻底，恰恰证明了我们的秩序对银河的重要性\n\n既然我们的道路绝对的正确，那么眼前这肮脏恶心的文明，就让它彻底的消失在时间之中吧！
  gts_ultra_road.412.desc: "Hmm~ The king of the maggots is howling, lamenting the collapse of their fragile dynasty. How delightful, isn't it?\n\nTheir failure is so complete and just proves the importance of our order to the galaxy.\n\nSince our path is absolutely correct, let this dirty and disgusting civilization disappear completely in time!"
  # 毁灭它们吧，就当是奖励了
  gts_ultra_road.412.a: "Destroy them, just consider it as a reward."
  # 送给你们当玩具吧，反正它们已被证明毫无力量可言
  gts_ultra_road.412.b: "Give them to you as toys, they have already been proven to be powerless anyway."
  # 胜利的间奏
  gts_ultra_road.413.name: "Interlude of Victory"
  # 虫子们的巢穴在我们的攻击下彻底灭亡了，我们的秩序之光终究会洒向整个银河，这是必然的结果。不过，秩序的建立需要时间，我们的部队也需要修整。而那些还在边疆，未被战火波及的星球上，有许多物资和玩具来着~\n\n我们的部队应该可以从中抽调一点人口，来满足部队日益增长的需求，如何？
  gts_ultra_road.413.desc: "The lair of the bugs is completely destroyed under our attack. Our light of order will eventually spread to the entire galaxy. This is an inevitable result. However, the establishment of order takes time, and our troops also need to rest. And on those planets that are still on the border, unaffected by war, there are many supplies and toys~.\n\nOur troops should be able to draw a part of the population from them to meet the increasing demand of our troops, what do you think about that?"
  # 批准，记得给我也“匀一点”
  gts_ultra_road.413.a: "Approved, remember to 'spare some' for me too."
  # 留下它们毫无用处，交给你们自行定夺了
  gts_ultra_road.413.b: "It is useless to leave them, I will leave the decision to you."
  # 战争之后
  gts_ultra_road.420.name: "After the War"
  # 大人，我们的小人库存似乎有些不够，不是吗？我看有些帝国最近并不安分，蛆虫理事会的人也对我们的“毫无人道主义关怀”和“浪费宇宙资源”的做法强烈谴责，嗯~是时候给他们一点教训了，不是吗？\n\n我们的舰队自从上次战斗后休整了相当长的时间，她们早就想去体验一下新鲜的奴隶是什么感觉了，下达传播秩序光辉的命令吧，大人！
  gts_ultra_road.420.desc: "Adult, it seems our small people inventory is a little insufficient, right? I see some empires have recently been unruly. The members of the maggot council are also strongly condemning our 'inhumane care' and 'waste of cosmic resources' practices, hmm~ it's time to teach them a lesson, isn't it?\n\nOur fleet has rested for a considerable amount of time since the last battle. They have been looking forward to experiencing what fresh slaves feel like. Give the order to spread the glorious light of order, adult!"
  # 我也想换一批奴仆了，去让她们给我抓一点回来吧~
  gts_ultra_road.420.a: "I also want to replace a batch of my servants, go and let them capture some for me~"
  # 去吧，她们理应得到嘉奖
  gts_ultra_road.420.b: "Go, they deserve a reward."
  # 乐团的第二次演出
  gts_ultra_road.421.name: "The Orchestra's Second Performance"
  # 那可悲的帝国同它们灰尘似的领导一起，反对我们那充满公平与秩序的提案，真是不知好歹\n\n现在，我们的舰队已经抵达了边境线上，名为战争的交响乐的第二章也拉开了帷幕\n\n来吧，大人，她们都在等待您指挥棒都落下，一起奏响这名为战争的乐章吧！
  gts_ultra_road.421.desc: "That miserable empire, along with their dust-like leader, opposed our proposal with fairness and order, they are truly unappreciative.\n\nNow, our fleet has arrived at the borderline, and the second chapter of the symphony named war has also begun.\n\nCome on, adult, they are all waiting for your baton to drop and play this movement called war together!"
  # 来吧，让我们一同演奏这盛大的乐章吧！
  gts_ultra_road.421.a: "Come, let us play this grand movement together!"
  # 光辉与死亡的合奏
  gts_ultra_road.422.name: "A Concert of Glory and Death"
  # 如同第一幕一样，悦耳的乐曲飘扬在整个银河之上，它们弱小的军队在我们面前如沙墙一般，哦不对，应该是毫无感觉，如同空气一般~\n\n我们的部队已经抵达它们首都之外，天文数字对我们来说似乎逐渐失去了它的意义，毕竟不管多远，对我们来说似乎只需要一瞬之间\n\n马上，这个被野蛮与愚笨包围的国家，就会迎来我们的秩序，来管理并教化它们
  gts_ultra_road.422.desc: "As in the first act, the melodious music resounds over the entire galaxy. Their weak forces are like a wall of sand in front of us, oh no, it should be that we feel absolutely nothing, like air~\n\nOur troops have arrived outside their capital, astronomical numbers have gradually lost their meaning for us, after all, no matter how far, it seems to take only a moment for us to arrive.\n\nSoon, this country surrounded by barbarism and stupidity will welcome our order to manage and teach them."
  # 胜利的味道，真是香甜
  gts_ultra_road.422.a: "The taste of victory is so sweet."
  # 乐曲的演奏即将来到一个小小的高潮，就让我们将它演奏的更加精彩
  gts_ultra_road.422.b: "The performance of the music is about to reach a small climax, let us make this performance more wonderful."
  # 乐曲中的小小高潮
  gts_ultra_road.423.name: "A Small Climax in the Music"
  # 我们攻破了它们的首都，摧毁了它们引以为傲的一切，那些荒诞可笑，毫无意义的一切\n\n而我们将秩序的辉光带到了这片废墟之上，重建会在现在立刻启动，因为它们国家软弱的政府已经向我们俯首称臣...不对，称奴才对~\n\n总之，这场普通的战争再次以我们碾压性的胜利而宣布告终。而那些需要重建的星球，大人，您准备怎么办？
  gts_ultra_road.423.desc: "We have broken through their capital, destroying everything they were proud of, all those absurd, ridiculous, meaningless things.\n\nAnd we have brought the radiance of order to this ruin. Rebuilding will start now. Because the weak government of their nation has already surrendered to us... no, it should be a slave to us, right ~ \n\nIn short, this ordinary war has once again come to an end with our crushing victory. And those planets that need to be rebuilt, adult, what are you going to do?"
  # 小东西的储备不是愈发稀少了，这里不就是最好的养殖场所吗？
  gts_ultra_road.423.a: "Isn't the reserve of small things ever more scarce, is this not the best breeding ground?"
  # 库存内的星球似乎有点稀少了，上次玩坏了许多来着，将那些星球全部交于我的仓库内吧，我自有办法
  gts_ultra_road.423.b: "The planets in the inventory seem to be a bit scarce. I broke many of them last time. Hand over all those planets to my collection. I have my own ways."
  # 战争的插曲，亦或是奏响另一篇胜利的乐章
  gts_ultra_road.424.name: "An Interlude of War, or Perhaps the Beginning of Another Movement"
  # 自从我们征服第二个帝国后，那名为星海理事会的群体便一改以往的态度，开始积极的向我们进行外交，并邀请我们成为星海理事会永久主理事国，我们应不应该答应它们这优渥的提案，还是说，我们需要用我们自己的手段来解决以后的外交问题？
  gts_ultra_road.424.desc: "Since we conquered the second empire, that group called the Galactic Council has changed its previous attitude and began to actively engage in diplomacy with us, and invited us to become a permanent primary council member of the Galactic Council. Should we agree to their generous offer, or should we use our own means to solve future diplomatic problems?"
  # 加入也没有任何坏处，再说了，虫子们好像还挺认这个东西的，不知道我们以后能从中获得多么巨大的利润。
  gts_ultra_road.424.a: "There is no harm in joining them. Besides, those bugs seem to recognize this thing very much. I don't know how much profit we can get from it in the future."
  # 虫子们的议会要求我们来管理？天大的笑话，我们才不需要被邀请进去！秩序的光芒无须这些东西便能闪耀整个银河！
  gts_ultra_road.424.b: "The bugs' council wants us to manage them? What a joke! We do not need to be invited! The light of order can illuminate the entire galaxy without these things!"
