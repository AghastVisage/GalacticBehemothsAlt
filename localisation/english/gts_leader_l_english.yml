#  如果你看到一大块文字出现头晕恶心的症状，或者阅读速度慢、无法分辨行数、无法理解文字意思，那说明你可能患有新阅读困难症。自从信息时代以来，被确诊患有阅读困难症地人群快速上涨，甚至到了22世纪有9成的人表示自己出现过阅读困难的症状(1)，有些说法认为例如视频、图像和音声等更加简便的信息获取渠道让人们阅读文字的能力退化了(2)，但是根据中央女仆研究所的统计，我们每天看到的文字比古代任何时候都多(3)，21世纪每年读10本书就能被认为是好书之人，然而现在我们每年平均的阅读量几乎翻了一番。笔者认为，并非是我们的阅读能力退化了，而是阅读量增加地太快了，因此我们应该让阅读环境更为舒适，例如将一部分文字替换为视频与图像、在设计中避免出现一大块文字等。\n\n参考文献: \n(1)林·偶像女仆.你读书困难嘛(V).中央媒体，2179\n(2)卡耐基·成功女仆.究极奋斗学(M).天道酬勤出版社，2107\n(3)伊凡·学究女仆.单向流媒体文本调研报告(R).中央科研，2195
  ms_lit.dyslexia.d: "If seeing a large block of text makes you feel dizzy or nauseous, or if you read slowly, cannot distinguish line numbers, or cannot understand the meaning of the words, then you may have neo-dyslexia. Since the Information Age, the number of people diagnosed with dyslexia has risen rapidly, to the point that by the 22nd century, 90% of people reported having experienced symptoms of reading difficulty (1). Some argue that simpler channels for obtaining information, such as videos, images, and audio, have caused people's ability to read text to deteriorate (2). However, according to statistics from the Central Maid Research Institute, we see more text every day than at any time in ancient history (3). In the 21st century, reading 10 books a year was enough to be considered well-read, yet now our average annual reading volume has nearly doubled. The author believes that our reading ability has not declined; rather, reading volume has increased too quickly. Therefore, we should make reading environments more comfortable, such as replacing some text with videos and images, and avoiding large blocks of text in design.\\n\\nReferences: \\n(1) Lin, Idol Maid. Are You Having Trouble Reading? (V). Central Media, 2179\\n(2) Carnegie, Success Maid. Ultimate Struggle Studies (M). Heaven Rewards Diligence Press, 2107\\n(3) Ivan, Scholarly Maid. One-Way Streaming Media Text Survey Report (R). Central Research, 2195"
#  阅读爱好者
  ms_lit_mod_dyslexia: "Reading Enthusiast"
#  $ms_lit.dyslexia.d$
  ms_lit_mod_dyslexia_desc: "$ms_lit.dyslexia.d$"
#  女仆起源的假说
  ms_lit.guesses_about_maids.t: "Hypotheses on the Origin of Maids"
#  §g$ms_lit.guesses_about_maids.t$§!
  ms_lit.guesses_about_maids.r: "§g$ms_lit.guesses_about_maids.t$§!"
#  对于女仆的起源学术界一直众说纷纭，以下笔者将列出几个最具影响力的学说，也许有一天它们将被真相一一打破，或成为真相: \n\n被造说: \n最受支持的学说，该学说认为女仆是被一支高度发达的外星人创造出来用于服侍它们的，这个学说可以解释许多女仆的不合理之处，例如能够从服侍他人中获得满足感、喜欢女仆装和无法追朔源头的女仆文化，这个学说现在仍是假说，无法被证实。\n\n本土起源: \n认为女仆就是起源于母星的原生物种，是从像鼻涕虫一样的生物一步步进化而来的，女仆与许多本土物种的相似性佐证了这一点，然而这无法解释女仆对女仆职业的追捧。\n\n改造说: \n认为女仆是被高等外星人改造的原生物种，前两种学说的结合。\n\n女仆母星说: \n认为女仆的真正故乡另有他处，是从银河系真正的'女仆母星'来到这里的，也许所有可能存在的外星女仆都来自于那里，这个学说曾大力推动了上世纪宇航技术的发展。\n\n参考文献: \n卡根·星象女仆.我们是星辰之子(M).中央女仆出版社，2157\n(前日月司晨领)华·密会女仆.星象与神(M).妹抖书馆，1544-1567\n斯玛特·聪慧女仆.女仆人文社会学研究(R).中央科研，2180
  ms_lit.guesses_about_maids.d: "Academia has long held many conflicting views on the origin of maids. Below, the author will list several of the most influential theories. Perhaps one day, each will be overturned by the truth, or become the truth: \\n\\nCreated Theory: \\nThe most widely supported theory. This theory holds that maids were created by a highly advanced alien species to serve them. This theory can explain many unreasonable aspects of maids, such as gaining satisfaction from serving others, liking maid outfits, and a maid culture whose origins cannot be traced. This theory remains a hypothesis and cannot be proven.\\n\\nNative Origin: \\nThis theory holds that maids are a native species originating on the homeworld, having evolved step by step from creatures resembling slugs. The similarity between maids and many native species supports this point, but it cannot explain maids' enthusiasm for the maid profession.\\n\\nModified Theory: \\nThis theory holds that maids are a native species modified by advanced aliens, combining the first two theories.\\n\\nMaid Homeworld Theory: \\nThis theory holds that the true homeland of maids lies elsewhere, and that they came here from the galaxy's true 'Maid Homeworld'. Perhaps all possible alien maids originate there. This theory once greatly promoted the development of astronautic technology in the last century.\\n\\nReferences: \\nKagan, Astrological Maid. We Are Children of the Stars (M). Central Maid Press, 2157\\n(Former Sun-Moon Morning Domain) Hua, Secret Society Maid. Astrology and God (M). Maid Library, 1544-1567\\nSmart, Clever Maid. Studies in Maid Humanities and Sociology (R). Central Research, 2180"
#  $ms_lit.guesses_about_maids.t$
  ms_lit_mod_guesses_about_maids: "$ms_lit.guesses_about_maids.t$"
#  $ms_qu$——女仆的起源
  ms_lit.maids_creator.t: "$ms_qu$——The Origin of Maids"
#  §g$ms_lit.maids_creator.t$§!
  ms_lit.maids_creator.r: "§g$ms_lit.maids_creator.t$§!"
#  §g侍女的怀抱给予我慰藉——千貌之笼浮雕§!\n随着$ms_qu$文明遗迹的发现，学术圈里众说纷纭的女仆起源假说终于盖棺定论，按照考古资料，对于宇宙中大部分女仆类物种而言，改造说可以作为她们起源的真相，而剩下的一些女仆则适用于纯粹的被造说。\n\n可以预见到许多女仆物种纯粹主义团体会因此大受震撼，在未来很有可能塑造出一种跨物种的‘女仆类’身份认同；而原先那些排外主义女仆团体可能会转而为女仆的‘美貌’而自豪，进而主张排斥‘丑陋’的外星人。\n\n值得一提的是，在正常的宇宙生物面前，‘女仆类’的外貌普遍是非常吓人的，女仆拥有违背寻常审美比例的四肢和过大的眼球，以及小到几乎不可见的鼻子，这对于许多生物而言是一种处于‘恐怖谷’的形象。\n\n如果我们是被$ms_qu$作为仆从而创造或改造的，那么我们的意义究竟是什么，也许这就要交给未来的女仆去解答了。或许在某一天，神秘消失的$ms_qu$会重新归来，届时又该如何面对？
  ms_lit.maids_creator.d: "§gThe handmaiden's embrace gives me solace——Relief of the Cage of a Thousand Faces§!\\nWith the discovery of the ruins of the $ms_qu$ civilization, the much-debated hypotheses in academic circles on the origin of maids have finally reached a conclusion. According to archaeological data, for most maid-type species in the universe, the Modified Theory can be taken as the truth of their origin, while the remaining maids fit the pure Created Theory.\\n\\nIt can be foreseen that many maid species purist groups will be deeply shaken by this, and in the future it is very likely to shape a cross-species 'maid-type' identity. Meanwhile, the original xenophobic maid groups may instead take pride in maids' 'beauty', and then advocate excluding 'ugly' aliens.\\n\\nIt is worth mentioning that, before normal cosmic lifeforms, the appearance of 'maid-types' is generally very frightening. Maids possess limbs that violate ordinary aesthetic proportions, oversized eyeballs, and noses so small as to be almost invisible. For many lifeforms, this is an image that falls within the 'uncanny valley'.\\n\\nIf we were created or modified by the $ms_qu$ as servants, then what exactly is our meaning? Perhaps this must be left to future maids to answer. Perhaps one day, the mysteriously vanished $ms_qu$ will return. How should we face them then?"
#  $ms_lit.maids_creator.t$
  ms_lit_mod_maids_creator: "$ms_lit.maids_creator.t$"
#  虚境理论
  ms_lit.shroudverse.t: "Shroud Theory"
#  §g$ms_lit.shroudverse.t$§!
  ms_lit.shroudverse.r: "§g$ms_lit.shroudverse.t$§!"
#  此文将通过科学的方式去解释虚境，消除人们对虚境的恐惧，以停止那些诸如“你知道吗，世界上有一个空间，在超空间失踪的船就会进入那里，看过那的人都疯了”的谣言。\n\n首先回答最被关注的问题: 虚境真的是我们现实的本源吗？很遗憾，答案很可能不是大家想的那样，我们对虚境的大部分认知仍然停留在理论上，就理论而言，虚境不太可能是那所谓的第一张床，毕竟如果有一种带尾巴的外星人，难道虚境还要是它们的第一张中间挖洞的床吗？\n\n那么虚境是一切的起源吗？我在此提出我的假说: 如果现实中的物质会随机自然掉入虚境，那么根据概率而言，所有现实中的物体都会有掉入虚境的那一天，而虚境的时间混沌特性就决定了它有可能拥有我们宇宙中过去与未来所有的一切，而这一切都可能在时间乱流的作用下成为其自身的“本源”。\n\n-帷幕女仆 (原粒子女仆，研究虚境后改名) 
  ms_lit.shroudverse.d: "This article will explain the Shroud through scientific means, dispel people's fear of the Shroud, and stop rumors such as, \"Did you know there is a space in the world where ships lost in hyperspace enter, and everyone who has seen it went mad?\"\\n\\nFirst, let us answer the question that receives the most attention: Is the Shroud truly the origin of our reality? Unfortunately, the answer is probably not what everyone imagines. Most of our understanding of the Shroud remains theoretical. In theory, the Shroud is unlikely to be that so-called first bed. After all, if there were a tailed alien species, would the Shroud also have to be their first bed with a hole dug in the middle?\\n\\nThen is the Shroud the origin of everything? Here I propose my hypothesis: if matter in reality can randomly and naturally fall into the Shroud, then according to probability, every object in reality will one day fall into the Shroud. The Shroud's temporally chaotic nature means it could possess everything in our universe's past and future, and all of it could, under the influence of temporal turbulence, become its own \"origin\".\\n\\n-Veil Maid (formerly Particle Maid, renamed after studying the Shroud) "
#  $ms_lit.shroudverse.t$
  ms_lit_mod_shroudverse: "$ms_lit.shroudverse.t$"
#  虚境波
  ms_lit.shroudwave.t: "Shroud Waves"
#  §g$ms_lit.shroudwave.t$§!
  ms_lit.shroudwave.r: "§g$ms_lit.shroudwave.t$§!"
#  虚境有一个被确立的特性就是其与现实的联系，古代有许多无法解释的失踪就被解释为掉进了虚境，一些家庭会用这个来吓唬小孩早点回家。\n\n我们虽然还无法确认现实中物体自然进入虚境的可行性，但是那年量子女仆主导的光谱实验首次观察到了虚境在我们现实的波浪，这些波浪就像字面意思上的一样随机出现，扫过整个宇宙，其触发的规律很难被探明。\n\n虚境的波浪穿过某些物质或能量后，会留下清晰的轨迹，经过很长时间都不会变化，根据这个特性，我们或许可以制作一种透镜，用来观察物体清晰的过去。\n\n-聪慧的蓝色女仆
  ms_lit.shroudwave.d: "One established property of the Shroud is its connection to reality. In ancient times, many unexplained disappearances were explained as having fallen into the Shroud, and some families used this to scare children into coming home earlier.\\n\\nAlthough we still cannot confirm the feasibility of objects in reality naturally entering the Shroud, in that year, the spectral experiment led by Quantum Maid first observed waves of the Shroud in our reality. These waves appear randomly, just as the words literally suggest, sweeping across the entire universe. The laws that trigger them are difficult to determine.\\n\\nAfter the waves of the Shroud pass through certain matter or energy, they leave clear traces that do not change even after a very long time. Based on this property, we may be able to create a kind of lens used to observe the clear past of objects.\\n\\n-Clever Blue Maid"
#  虚镜
  ms_lit.shroudscope.t: "Shroudscope"
