  ms_lit.shroudscope.r: "§g$ms_lit.shroudscope.t$§!"
#  虚镜\n\n-该项目由聪慧的蓝色女仆编写，由暴躁的红色女仆提出
  ms_lit.shroudscope.d: "Shroudscope\\n\\n-This project was written by Clever Blue Maid and proposed by Irritable Red Maid"
#  汗渍女仆装
  ms_lit.sweat_maid.t: "Sweat-Stained Maid Outfit"
#  §g$ms_lit.sweat_maid.t$§!
  ms_lit.sweat_maid.r: "§g$ms_lit.sweat_maid.t$§!"
#  随着女仆人口在星海里普及，有关女仆的玩法也越发花样，比如汗渍女仆装。选取从使用到原主去世都没有清洗过的女仆装，泡酒，泡茶等，典型的产品有女仆味奶茶。\n\n在这个玩法最流行的星域出现了一整条汗渍女仆装的产业链，为了产出市场大量需求的汗渍女仆装，女仆们被长期置于湿热环境下。而这样产出的汗渍女仆装被一部分人口认为是失去了汗渍女仆装原本灵魂的劣质产品，是一种对汗文化的亵渎。虽然如此，这种汗渍女仆装在市场上依然热销。\n\n随着汗渍女仆产量的上升，传统的玩法已经很难让人满意。于是，市场上逐渐出现了汗渍女仆装的饮食行业。据了解，可食用的汗渍女仆装至少要经过三代女仆一生的使用，这样产出的女仆装才能嚼起来口感舒适。\n\n汗渍女仆装文化作为一种主流文化之外的畸形文化，很有学术价值，同时也为女仆人口的相关产业链再添一笔。\n\n虚空虫
  ms_lit.sweat_maid.d: "As the maid population has spread across the sea of stars, maid-related pastimes have also grown increasingly varied, such as sweat-stained maid outfits. Maid outfits that have never been washed from use until the original owner's death are selected and used to infuse alcohol, tea, and so on. Typical products include maid-flavored milk tea.\\n\\nIn the star region where this pastime is most popular, an entire sweat-stained maid outfit industrial chain has emerged. To produce the large quantities of sweat-stained maid outfits demanded by the market, maids are kept for long periods in hot and humid environments. However, some people believe that sweat-stained maid outfits produced this way are inferior products that have lost the original soul of sweat-stained maid outfits, and are a desecration of sweat culture. Even so, these sweat-stained maid outfits still sell well on the market.\\n\\nAs production of sweat-stained maid outfits has risen, traditional forms of enjoyment have become difficult to satisfy people. As a result, a food and beverage industry based on sweat-stained maid outfits has gradually appeared on the market. It is understood that edible sweat-stained maid outfits must at least have been used over the lifetimes of three generations of maids before the resulting maid outfit has a pleasant texture when chewed.\\n\\nAs a deformed culture outside mainstream culture, sweat-stained maid outfit culture has great academic value, while also adding another entry to the industries related to the maid population.\\n\\nVoid Worm"
#  失落女仆
  ms_lit.fallen_maid.t: "Fallen Maid"
#  §g$ms_lit.fallen_maid.t$§!
  ms_lit.fallen_maid.r: "§g$ms_lit.fallen_maid.t$§!"
#  在银河的深处，古老的机械文明沉睡着，它们的造物主早已消逝在时间的尘埃中。这些星球上的机械女仆，曾是宇宙的主宰，如今却只剩下冰冷的躯壳，静默地漂浮在无垠的星海中。\n\n它们的城市，曾是科技的巅峰，如今却被遗忘在星系的边缘。高耸的金属塔楼，闪烁着微弱的光芒，仿佛在诉说着曾经的辉煌。每一块齿轮，每一根电路，都承载着无数未解之谜。\n\n这个机械失落帝国，曾是宇宙的守护者，如今却成了历史的谜团。它们的智慧，超越了任何有机生命的理解，而它们沉默，直到你的到来。\n\n龙神酱X
  ms_lit.fallen_maid.d: "In the depths of the galaxy, an ancient mechanical civilization lies dormant, its creators long since vanished into the dust of time. The mechanical maids on these planets were once rulers of the universe, but now only cold shells remain, drifting silently through the boundless sea of stars.\\n\\nTheir cities were once the pinnacle of technology, but now they are forgotten at the edges of star systems. Towering metal spires flicker with faint light, as if telling of their former glory. Every gear, every circuit, carries countless unsolved mysteries.\\n\\nThis mechanical fallen empire was once the guardian of the universe, but now it has become a mystery of history. Their intelligence surpasses the understanding of any organic life, and they remain silent, until your arrival.\\n\\nDragon God-chan X"
