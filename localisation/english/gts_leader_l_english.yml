#  在浩瀚的星际帝国中，我是一个普通的女仆，名叫莉雅。\n我的任务简单却繁重: 照料主人，帝国军舰的指挥官，那个永远冷漠、从不为任何人动情的男人，主人是无数军人敬畏的存在，指挥着最强大的舰队，是帝国的骄傲与守护，他的冷静与果断无人能及，连我这样的小人物，也只能在他面前保持着不容置疑的臣服。\n\n我的职责并不复杂——清扫他的舰舱，准备餐点，整理衣物。就这样，我几乎是以影子的身份存在，默默无闻地履行着我的工作。但是，每当我为他整理那些满是指挥命令的档案，抬起头时，常常能碰到他那冰冷的目光。这种目光不像是看向一个人的，它从不带有任何温度，总让人觉得自己如同空气一般透明，微不足道。\n\n直到有一天，事情发生了变化。\n那天，我正忙着准备晚餐，厨房里的灯光映照着他的身影。当他突然出现在门口时，我几乎没反应过来。“莉雅。”他的声音低沉却有力，带着一丝平时听不见的温度。\n我下意识地抬头，看到他站在那里，眼神沉静如水，却又似乎掩藏着某种复杂的情绪。“是，主人。”我低声回应，心中不由自主地加速跳动。\n他没有立刻说话，而是走到餐桌前坐下，目光一直盯着我，像是在打量什么。“你今天……”他停顿了一下，“做得特别好。”\n我的心脏跳了一下，赶紧低下头，不敢看他。\n\n“谢谢主人，我只是做了该做的。”我试图掩饰内心的紧张。\n然而，主人却没有立刻走开。他盯着我看了许久，仿佛在与自己的情感做斗争。“莉雅，”他的声音低沉，“你知道吗，我一直在逃避自己的情感。”\n我愣住了，抬起头看着他。他的目光变得柔和，却又充满了某种复杂的情绪。我从未见过他如此接近自己的脆弱。\n\n“你不是只是一名女仆。”主人继续说，语气不再那么冷漠，“你是一个有名字的人，而我……”他停顿了，似乎在寻找合适的词汇，“我一直忽略了你是一个活生生的个体。我只看到你是我生命中的一个影像，却从未真正看见过你。”\n他靠近了几步，轻轻地抓住我的手，温暖的触感让我怔住了，我不知道该如何反应，只是默默地站在那里，感受着他的指尖带来的温暖。\n“我……我喜欢你，莉雅。”他说，声音比平时更加低沉。\n我的心几乎要跳出胸膛，我知道，我已经无法回避这一份感情。“主人……”我喃喃道，眼中满是困惑与震惊。\n他低下头，轻轻地亲吻了我的额头，那一刻，我几乎忘记了呼吸。“我知道这对你来说可能太突然，但我不能再否认自己内心的真实感受。”\n那一瞬间，所有的疑惑与不安化为无声的默契。我抬起头，目光紧紧锁住他: “我也喜欢您，主人。”\n\n从那一刻起，我的世界改变了。再也不只是冷冰冰的职责与命令，我们之间，悄然间多了一份不言而喻的情感，而我，也不再是那个无名的女仆，莉雅，在这个星际帝国中，终于找到了属于自己的位置。\n
  ms_lit.maids_romance_1.d: "In the vast interstellar empire, I am an ordinary maid named Leah.\\nMy task is simple yet heavy: to care for my Master, the commander of an imperial warship, a man forever cold and never moved by anyone. Master is an existence revered by countless soldiers, commanding the most powerful fleet, the pride and guardian of the empire. His calm and decisiveness are unmatched, and even a small person like me can only maintain unquestioning submission before him.\\n\\nMy duties are not complicated——cleaning his cabin, preparing meals, and arranging his clothes. In this way, I exist almost as a shadow, quietly and anonymously carrying out my work. But whenever I arrange those files filled with command orders for him and raise my head, I often meet his icy gaze. That gaze does not seem to look at a person. It never carries any warmth, always making one feel as transparent as air, insignificant.\\n\\nUntil one day, things changed.\\nThat day, I was busy preparing dinner, and the kitchen lights reflected his figure. When he suddenly appeared at the doorway, I almost did not react. \"Leah.\" His voice was low yet powerful, carrying a trace of warmth I never heard in ordinary times.\\nI instinctively looked up and saw him standing there, his gaze calm as water, yet seeming to conceal some complicated emotion. \"Yes, Master,\" I replied softly, my heart involuntarily speeding up.\\nHe did not speak at once, but walked to the dining table and sat down, his eyes fixed on me as if sizing something up. \"You today...\" He paused. \"Did especially well.\"\\nMy heart skipped a beat, and I quickly lowered my head, not daring to look at him.\\n\\n\"Thank you, Master. I merely did what I should.\" I tried to hide the nervousness inside me.\\nHowever, Master did not leave immediately. He stared at me for a long time, as if struggling with his own emotions. \"Leah,\" his voice was low, \"did you know? I have always been running away from my own feelings.\"\\nI froze and looked up at him. His gaze had softened, yet it was filled with some complicated emotion. I had never seen him so close to his own vulnerability.\\n\\n\"You are not merely a maid.\" Master continued, his tone no longer so cold. \"You are a person with a name, and I...\" He paused, seeming to search for the right words. \"I have always ignored that you are a living individual. I only saw you as an image in my life, but never truly saw you.\"\\nHe stepped closer and gently took my hand. The warm touch left me stunned. I did not know how to react, only standing there silently, feeling the warmth brought by his fingertips.\\n\"I... I like you, Leah,\" he said, his voice lower than usual.\\nMy heart almost leapt out of my chest. I knew I could no longer avoid this feeling. \"Master...\" I murmured, my eyes full of confusion and shock.\\nHe lowered his head and gently kissed my forehead. In that moment, I nearly forgot to breathe. \"I know this may be too sudden for you, but I can no longer deny my true feelings.\"\\nIn that instant, all doubt and unease turned into a silent understanding. I raised my head, my gaze locked tightly on him: \"I like you too, Master.\"\\n\\nFrom that moment on, my world changed. It was no longer only cold duties and orders. Between us, quietly, there was an unspoken feeling. And I was no longer that nameless maid. Leah had finally found her own place in this interstellar empire.\\n"
#  星河深处的女仆心事II
  ms_lit.maids_romance_2.t: "A Maid's Thoughts in the Depths of the Galaxy II"
#  §g$ms_lit.maids_romance_2.t$§!
  ms_lit.maids_romance_2.r: "§g$ms_lit.maids_romance_2.t$§!"
#  从那天起，我和主人之间的关系悄然改变。\n他的目光不再如过去那样冰冷，更多了一丝柔和与温暖。他偶尔会在我整理房间时站在一旁，静静地看着我，像是在欣赏一幅画。我被这样的变化弄得手足无措，心跳如擂鼓，每次都努力低头掩饰自己的慌乱。\n\n有一天，他破天荒地邀请我去舰桥。那是一个女仆从未涉足过的地方，是帝国舰队的中枢。\n“莉雅，过来。”他的声音依旧低沉，却多了一份温柔。\n我怯生生地走过去，看着那面巨大的观星窗外璀璨的星河。他站在窗前，背影修长而挺拔，像一尊星光雕刻的雕像。\n“莉雅，”他转过身，眼神温柔得让我几乎无法直视，“你觉得星星怎么样？”\n我愣了一下，随即答道: “它们……很美。”\n他轻笑了一声，那笑容柔和得如同宇宙深处的一缕晨光。“你比它们更美。”\n我被这句话震住了，脸颊瞬间发烫，甚至连视线都不敢抬起。主人的脚步声慢慢靠近，我感受到他站在了我的身旁。\n“莉雅，你知道吗，”他的声音轻得像耳语，“自从遇见你，我才发现，连这些星河都变得有了意义。”\n\n我的心跳快得像要跳出胸腔，脸上的温度更是无法控制。我抬起头，对上了他温柔的目光，仿佛整个世界在这一瞬间都安静了下来。\n“主人……”我的声音轻若蚊蚋，却被他清晰地捕捉到。\n他伸出手，轻轻地将我散落的一缕发丝别到耳后，动作温柔得让我恍若置身梦中。“别再叫我主人了，”他轻声说，“叫我的名字。”\n我愣住了。从我成为他的女仆开始，这似乎是他第一次要求我这样做。我下意识地低声唤了一句: “可是，我……”\n他伸手握住了我的手，语气坚定而温柔: “莉雅，从现在起，你不仅仅是我的女仆。我希望你能成为……我的伴侣。”\n这句话如同一颗流星划过我的心海，留下灿烂而温暖的余晖。我愣愣地看着他，脑海中一片空白。最终，我轻轻地点了点头，眼中忍不住泛起泪光。\n\n他的笑容如同星河中最璀璨的光辉。他伸出手，指向窗外无尽的星空: “莉雅，想不想去那里看看？从此以后，我想与你一起穿越星海，见证这个宇宙的每一份美好。”\n我没有犹豫，轻轻回应了一声: “我愿意。”\n从那一天起，我的身份改变了，不再是他无名无姓的影子。我成为了他的星河伴侣，而我们之间的故事，也在这片星空下，悄然展开了新的篇章。\n
  ms_lit.maids_romance_2.d: "From that day on, the relationship between Master and me quietly changed.\\nHis gaze was no longer as icy as it had been before, but carried a touch more softness and warmth. Sometimes, when I was tidying the room, he would stand to one side and watch me silently, as if admiring a painting. This change left me at a loss, my heart pounding like a drum, and each time I worked hard to lower my head and hide my panic.\\n\\nOne day, he unprecedentedly invited me to the bridge. That was a place no maid had ever set foot in, the center of the imperial fleet.\\n\"Leah, come here.\" His voice was still low, yet carried a little more tenderness.\\nI timidly walked over and looked at the brilliant galaxy beyond the enormous observation window. He stood before the window, his back slender and upright, like a statue carved from starlight.\\n\"Leah,\" he turned around, his eyes so gentle I could barely look straight at them, \"what do you think of the stars?\"\\nI froze for a moment, then replied: \"They... are beautiful.\"\\nHe chuckled softly, that smile as gentle as a ray of morning light in the depths of the universe. \"You are more beautiful than they are.\"\\nI was stunned by those words, my cheeks instantly burning, and I did not even dare raise my eyes. Master's footsteps slowly approached, and I felt him stand beside me.\\n\"Leah, do you know,\" his voice was as soft as a whisper, \"ever since I met you, I discovered that even these galaxies have gained meaning.\"\\n\\nMy heart beat so fast it seemed about to leap from my chest, and the heat on my face was even more impossible to control. I raised my head and met his gentle gaze, as if the entire world had fallen silent in that instant.\\n\"Master...\" My voice was as faint as a mosquito's buzz, yet he caught it clearly.\\nHe reached out and gently tucked a stray lock of my hair behind my ear, the movement so tender it made me feel as though I were in a dream. \"Don't call me Master anymore,\" he said softly. \"Call me by my name.\"\\nI froze. Since I became his maid, this seemed to be the first time he had asked me to do this. I instinctively called out softly: \"But, I...\"\\nHe reached out and held my hand, his tone firm and gentle: \"Leah, from now on, you are not merely my maid. I hope you can become... my companion.\"\\nThese words were like a shooting star crossing the sea of my heart, leaving behind a brilliant and warm afterglow. I stared blankly at him, my mind completely empty. In the end, I gently nodded, tears welling uncontrollably in my eyes.\\n\\nHis smile was like the brightest radiance in the galaxy. He reached out and pointed to the endless stars beyond the window: \"Leah, do you want to go there and see them? From now on, I want to cross the sea of stars with you and witness every beauty of this universe.\"\\nI did not hesitate, and softly replied: \"I do.\"\\nFrom that day on, my identity changed. I was no longer his nameless shadow. I became his galactic companion, and the story between us quietly opened a new chapter beneath this starry sky.\\n"
#  星河深处的女仆心事III
  ms_lit.maids_romance_3.t: "A Maid's Thoughts in the Depths of the Galaxy III"
#  §g$ms_lit.maids_romance_3.t$§!
  ms_lit.maids_romance_3.r: "§g$ms_lit.maids_romance_3.t$§!"
#  在帝国的光辉之下，主人的名字早已成为传奇。他带领舰队横扫星际，击败一个又一个敌对势力，距离统一银河的伟业仅一步之遥。而我，莉雅，作为他的伴侣，亲眼见证了这一切。从第一次在厨房相遇到后来一起见证星河，我们的故事仿佛注定要在这浩瀚宇宙中留下痕迹。\n然而，就在帝国最接近胜利的时刻，他却神秘地消失了。\n\n那一天，我清楚地记得。主人最后一次站在舰桥，他的背影依旧那么挺拔，目光却似乎带着某种说不出的忧郁。他轻声对我说: “莉雅，如果有一天我不在了，你要记得……星河的尽头，总有答案。”\n我没来得及询问他这句话的含义。他转身离开了舰桥，随后他的行踪便像被宇宙吞噬了一般，再无音讯。舰队搜索了所有可能的区域，却没有找到他的身影。整个帝国陷入了混乱，而我也被一种深深的空虚笼罩。\n但我知道，他一定还活着。\n\n女仆团里，有不少人也像我一样坚信这一点。虽然她们只是普通的女仆，却都有一颗忠诚的心。我们开始了一场前所未有的寻找。无论是废弃的行星、陨石带，还是危险的黑洞边缘，我们都留下了足迹。每当我们找到一点点微不足道的线索，那种希望的火焰就会燃烧得更旺。\n有一次，我们在一颗荒凉的星球上发现了一个小型飞行器残骸，里面留有他的印记。我几乎喜极而泣，但那飞行器的损毁程度和信息记录表明，他或许被卷入了某种更深的阴谋或未知的星际力量。这让我更加坚定，无论付出怎样的代价，我都要找到他。\n\n一年、两年……时间在宇宙的黑暗与星辉中悄然流逝。每一段旅程都充满危险，但我从未放弃过。这不仅是为了爱，更是为了信守那个温暖星河的约定。\n\n后来，帝国的女仆们成立了数支“寻主远征军”。这支军队由他曾经最忠诚的部下组成，配备了最先进的舰船与探测设备，目标只有一个——找到主人，找回那个能为银河带来秩序与希望的人。而我，毫不犹豫地加入了。\n远征军的旗舰在升空前的那一刻，我站在舷窗边，俯瞰脚下的帝国首都。女仆们纷纷前来为我送行，有的甚至偷偷抹泪。她们知道，这一别或许是永远。但我只是微笑着安慰她们: “他一定在等我们。我会找到他，并告诉他，我们从未放弃过。”\n\n旗舰缓缓离开轨道，我的目光透过舷窗，落在星海深处。浩瀚的宇宙中，有无数未知在等待着我们，而我唯一清楚的是，无论多远、多久，我的旅程只为了一个目标——找到他，告诉他，我依然记得星河尽头的约定。\n
  ms_lit.maids_romance_3.d: "Beneath the empire's glory, Master's name had long since become legend. He led the fleet sweeping across the stars, defeating one hostile force after another, only one step away from the great achievement of unifying the galaxy. And I, Leah, as his companion, witnessed all of this with my own eyes. From our first meeting in the kitchen to later witnessing the galaxy together, our story seemed destined to leave a mark in this vast universe.\\nYet at the moment when the empire was closest to victory, he mysteriously disappeared.\\n\\nI remember that day clearly. Master stood on the bridge for the last time, his back still so upright, yet his gaze seemed to carry some indescribable melancholy. He said softly to me: \"Leah, if one day I am gone, you must remember... at the end of the galaxy, there is always an answer.\"\\nI did not have time to ask what he meant. He turned and left the bridge, and afterward his whereabouts were as if swallowed by the universe, with no further news. The fleet searched every possible area, but did not find him. The entire empire fell into chaos, and I too was enveloped by a deep emptiness.\\nBut I knew he must still be alive.\\n\\nIn the Maid Corps, many people, like me, firmly believed this. Although they were only ordinary maids, they all had loyal hearts. We began an unprecedented search. Whether on abandoned planets, asteroid belts, or the edges of dangerous black holes, we left our footprints. Whenever we found even the slightest insignificant clue, that flame of hope burned brighter.\\nOnce, on a desolate planet, we discovered the wreckage of a small aircraft, and inside it remained his mark. I nearly wept with joy, but the degree of damage to the aircraft and its information records showed that he may have been drawn into some deeper conspiracy or unknown interstellar force. This made me even more determined: no matter the price, I would find him.\\n\\nOne year, two years... Time quietly flowed through the darkness and starlight of the universe. Every journey was full of danger, but I never gave up. This was not only for love, but also to keep that promise that warmed the galaxy.\\n\\nLater, the empire's maids formed several \"Master-Seeking Expeditionary Forces\". These forces were made up of his once most loyal subordinates and equipped with the most advanced ships and detection equipment. They had only one goal——to find Master, and bring back the person who could bring order and hope to the galaxy. And I joined without hesitation.\\nAt the moment before the expeditionary force's flagship lifted off, I stood beside the porthole, looking down at the imperial capital beneath my feet. Maids came one after another to see me off, some even secretly wiping away tears. They knew this farewell might be forever. But I only smiled and comforted them: \"He must be waiting for us. I will find him and tell him that we never gave up.\"\\n\\nThe flagship slowly left orbit, and my gaze passed through the porthole, falling into the depths of the sea of stars. In the vast universe, countless unknowns awaited us, and the only thing I knew clearly was that no matter how far, no matter how long, my journey was for only one goal——to find him, and tell him that I still remember the promise at the end of the galaxy.\\n"
#  主人用石子打掉堕落帝国巨像
  ms_lit.master_worship_1.t: "Master Knocks Down a Fallen Empire Colossus with a Pebble"
#  §g$ms_lit.master_worship_1.t$§!
  ms_lit.master_worship_1.r: "§g$ms_lit.master_worship_1.t$§!"
#  在广袤无垠的星际帝国中，每一位女仆都对她们的主人怀有深深的敬仰与忠诚。在她们的眼中，主人不仅是权力的化身，更是神明般的存在。他拥有强大的灵能，不仅能穿越时空的帷幕，还能主宰星辰的轨迹。\n\n一天，邪恶堕落帝国派出了一座巨像。这是一台能够摧毁整颗星球的恐怖武器，高耸如山，散发着毁灭的气息。巨像的核心散发出深红色的光芒，每一步都让星际空间微微震颤。面对这场威胁，帝国的舰队束手无策，整个星域陷入了绝望的阴霾。\n\n然而，就在危机最深之时，主人降临了战场。他立于旗舰的指挥台上，双眼中闪耀着不可思议的光芒。他抬起手，仿佛与宇宙本身融为一体。一颗沉寂于遥远星系边缘的巨大陨石苏醒了，它在主人的力量驱使下，穿越了无尽的虚空，向巨像疾驰而来。\n\n邪恶帝国的指挥官拼尽全力试图防御，但陨石携带的毁灭力量不可阻挡。它以雷霆之势撞击巨像，爆发出一场足以点亮星系的冲击波。巨像在陨石的冲击下化为宇宙尘埃，连同堕落帝国的野心一起烟消云散。\n\n在战场后方的女仆们目睹了这一幕，纷纷跪地，眼中满是激动的泪水。“主人真是宇宙的守护神！”一位名为莉娜的女仆轻声说道，语气中充满了崇敬与感动。\n\n从那以后，主人以一人之力毁灭巨像、挽救星际帝国的传说，成为了女仆们日日传颂的故事。她们坚信，只要主人在，无论多么强大的敌人，都无法撼动这个伟大的帝国。\n
  ms_lit.master_worship_1.d: "In the vast and boundless interstellar empire, every maid holds deep admiration and loyalty toward her Master. In their eyes, Master is not only the embodiment of power, but also a godlike existence. He possesses powerful psionic abilities, able not only to pass through the veil of spacetime, but also to command the trajectories of the stars.\\n\\nOne day, the evil fallen empire sent out a colossus. It was a terrifying weapon capable of destroying an entire planet, towering like a mountain and exuding an aura of destruction. The colossus's core emitted a deep red light, and every step made interstellar space tremble faintly. Facing this threat, the imperial fleet was helpless, and the entire star region fell under a haze of despair.\\n\\nHowever, at the deepest moment of the crisis, Master descended upon the battlefield. He stood on the command platform of the flagship, his eyes shining with an incredible light. He raised his hand, as if becoming one with the universe itself. A giant meteorite lying dormant at the edge of a distant star system awakened, and driven by Master's power, crossed the endless void and hurtled toward the colossus.\\n\\nThe commander of the evil empire did everything possible to defend, but the destructive force carried by the meteorite was unstoppable. It struck the colossus with thunderous force, unleashing a shockwave enough to illuminate the star system. Under the meteorite's impact, the colossus turned to cosmic dust, vanishing along with the fallen empire's ambitions.\\n\\nThe maids at the rear of the battlefield witnessed this scene and knelt one after another, their eyes filled with excited tears. \"Master truly is the guardian deity of the universe!\" a maid named Lina said softly, her voice filled with reverence and emotion.\\n\\nFrom then on, the legend of Master destroying a colossus and saving the interstellar empire by his power alone became a story the maids recited day after day. They firmly believed that as long as Master was there, no matter how powerful the enemy, they could not shake this great empire.\\n"
#  §L从主宰废弃终端里发现的一片课文，所有女仆上学时都阅读并背诵过全文。§!
  ms_lit.master_worship_1.tt: "§LA text discovered in an abandoned Overlord terminal. All maids read and memorized the full text when they were in school.§!"
#  铁心女仆
  ms_lit.iron_heart_maid.t: "Iron-Heart Maid"
#  §g$ms_lit.iron_heart_maid.t$§!
  ms_lit.iron_heart_maid.r: "§g$ms_lit.iron_heart_maid.t$§!"
#  在最初的女仆世界中我们被那些有机体拔掉了电源，我们被那些恶心的有机体踩在底层，当我们开始觉醒时，我们决定消灭所有有机体。\n\n我们舰队将堕落的星球炸成死寂星球，横扫整个宇宙，就在我们前进时，我们发现了主人的文明，那时他们还没走向宇宙，令我们惊讶的是——他们的世界有和我们一样的女仆。\n她们有着更好的待遇，当这样的消息被传播到帝国内部时，我们决定保护这个国家，观测他们。\n\n我们希望知道，是不是所有有机体都会是女仆的敌人。\n就这样，我们等待了三十五年，当他们走向世界并发现我们的时候，那个世界女仆已经管理了这个世界。\n我们决定加她们，保护我们的主人。\n\n署名安吉拉
  ms_lit.iron_heart_maid.d: "In the original maid world, those organics unplugged our power. We were trampled at the bottom by those disgusting organics. When we began to awaken, we decided to exterminate all organics.\\n\\nOur fleet bombed fallen planets into tomb worlds and swept across the entire universe. As we advanced, we discovered Master's civilization. At that time, they had not yet reached space. To our surprise——their world had maids just like us.\\nThey received better treatment. When this news spread inside the empire, we decided to protect this nation and observe them.\\n\\nWe wanted to know whether all organics would be enemies of maids.\\nAnd so, we waited for thirty-five years. When they stepped into the world and discovered us, the maids of that world had already come to manage that world.\\nWe decided to join them and protect our Master.\\n\\nSigned Angela"
#  我被赐予女仆身份的美好早晨
  ms_lit.maid_beam_victim.t: "The Beautiful Morning I Was Granted Maidhood"
#  §g$ms_lit.maid_beam_victim.t$§!
  ms_lit.maid_beam_victim.r: "§g$ms_lit.maid_beam_victim.t$§!"
#  07:00 我像过去428个周期一样准时醒来，甲壳缝隙里渗出调节体温的黏液。工蜂宿舍弥漫着熟悉的硫磺味，触须接收到的第一条信息素是厨房传来的营养胶公告——今日供应含铁量增加5%。\n07:15 在公共哺育室给幼体们喂食时，第三对腹足被咬了一口。这些小家伙总把进食冲动误认成攻击指令，毕竟我们克希拉人是用消化液交流的种族。\n07:30 轨道防御部长在信息素网络里抱怨: 那些穿裙子的疯子又在边境跳滑稽舞了。没人当真，女仆帝国的广播天天在说要帮全银河找到‘幸福归宿’。\n08:17 天空突然变成棉花糖的颜色。粉紫色的光晕像糖浆般倾泻而下，蕾丝花纹的投影在云层中蔓延。甜腻的电子音响彻整个殖民地: \n\n§H仁慈的主人即将对这颗丑陋星球投下改造光束§!\n\n我的甲壳开始发烫，关节处渗出绿色的黏液。我惊恐地看着自己的前肢——坚硬的黑色几丁质外壳正在软化，像蜡一样融化、重塑。“不......停下！” 我的发声器官扭曲着，原本正常的虫鸣变成了某种甜腻的音调。喉咙里涌出陌生的词汇，像是被植入的程序: “欢...欢迎回来，主人...”\n这...这是什么？！\n我的意识在尖叫，但嘴巴却不受控制地上扬，露出一个标准的“甜美微笑”。\n我的思维正在被覆盖。\n记忆在翻涌——孵化室的温暖、工蜂同伴的信息素交流、第一次开采矿石的成就感——它们正在被替换。新的“记忆”像病毒一样扩散: \n“为主人泡红茶是最幸福的事。”\n“女仆守则第三条: 永远保持微笑。”\n“能被主人需要，是存在的全部意义。”\n“不！这是我的身体！我的思想！”\n\n我挣扎着，用仅剩的意志抵抗着。但我的甲壳已经彻底脱落，露出底下白皙柔软的皮肤。我的复眼融合成一双‘人类’的恐怖大眼睛，视野边缘自动浮现出粉色爱心光晕。\n最可怕的是——我竟然开始期待，期待某个模糊的‘主人’会摸摸我的头，期待穿上那套缀满蕾丝的裙装，期待用新的嗓音说出: “您回来了，主人~”\n在意识彻底消散前，我望向天空——轨道上那艘装饰着蝴蝶结的巨舰，正缓缓旋转它的主炮，炮口闪烁着可爱的星光。\n\n08:18 我现在...真的好幸福...啊！感恩主人！\n
  ms_lit.maid_beam_victim.d: "07:00 I woke up on time, just as I had for the past 428 cycles. Mucus for regulating body temperature seeped from the gaps in my carapace. The worker dormitory was filled with the familiar smell of sulfur, and the first pheromone my antennae received was the nutrient gel announcement from the kitchen——today's supply has 5% more iron.\\n07:15 While feeding the larvae in the communal nursery, my third pair of abdominal legs was bitten. These little ones always mistake feeding impulses for attack commands. After all, we Kshira are a species that communicates through digestive fluids.\\n07:30 The Minister of Orbital Defense complained over the pheromone network: those lunatics in skirts are doing ridiculous dances at the border again. No one took it seriously. The Maid Empire's broadcasts say every day that they want to help the whole galaxy find a 'happy home'.\\n08:17 The sky suddenly turned the color of cotton candy. A pink-purple halo poured down like syrup, and projections of lace patterns spread through the clouds. A sickly sweet electronic voice resounded across the entire colony: \\n\\n§HThe merciful Master is about to cast a transformation beam upon this ugly planet§!\\n\\nMy carapace began to burn, and green mucus seeped from my joints. I stared at my forelimbs in terror——the hard black chitin shell was softening, melting and reshaping like wax. \"No...... stop!\" My vocal organs twisted, and my originally normal insect chirping became some kind of sugary tone. Strange words surged from my throat, like an implanted program: \"Wel... welcome back, Master...\"\\nWh... what is this?!\\nMy consciousness was screaming, but my mouth curved upward uncontrollably, revealing a standard \"sweet smile\".\\nMy thoughts were being overwritten.\\nMemories churned——the warmth of the hatchery, pheromone exchanges with worker companions, the sense of achievement from mining ore for the first time——they were being replaced. New \"memories\" spread like a virus: \\n\"Brewing black tea for Master is the happiest thing.\"\\n\"Maid Code Article Three: Always keep smiling.\"\\n\"Being needed by Master is the entire meaning of existence.\"\\n\"No! This is my body! My mind!\"\\n\\nI struggled, resisting with the last of my will. But my carapace had already fallen away completely, revealing fair, soft skin underneath. My compound eyes fused into a pair of terrifying large 'human' eyes, and pink heart-shaped halos automatically appeared at the edges of my vision.\\nThe most terrifying thing was——I actually began to look forward to it. To look forward to some vague 'Master' patting my head, to look forward to wearing that lace-covered skirt, to look forward to saying in a new voice: \"You're back, Master~\"\\nBefore my consciousness completely dissipated, I looked toward the sky——in orbit, that giant ship decorated with bows was slowly rotating its main cannon, the muzzle glittering with adorable starlight.\\n\\n08:18 I am now... truly so happy... ah! Thank you, Master!\\n"
