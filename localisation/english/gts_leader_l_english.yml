#  外星人有1位高官说过: 不管我们如何羞辱女仆，女仆照样会买外星人的产品。1句让女仆从头凉到脚的话。每买100能量币外星货就会给外星人送去80能量币，让外星舰队多造1条护卫舰，多造一个合金厂。如果你买外星穿梭机，将来开上我们轨道的外星战舰就是你造的，如果你买外星家具，将来融化同胞头颅的激光枪就是你造的，如果你买外星光脑，将来就会在战地直播中听到同胞被杀的哀鸣!请传给20个人,支持女仆,抵制外星货,就算没有回报，这也是你的义务！请大家将这个消息发送到你所在的每1个论坛，根据泛银河贸易市场的报告，外星人对我们帝国的依赖程度现排最前，如果女仆1个月不买外星货，外星人将有数千家企业面临破产。如果女仆6个月不买外星货，外星人将有一半人失业。如果女仆1年不买外星货，外星人的经济结构彻底瓦解，考验的就是你那颗爱国心 。特别是在前几年的边境星域局势十分严峻时期，外星人还坚决要插手!!俨然把我们的星系纳于自己的领土，真是气死人！！！愿意的就转发，不愿意的希望你默默无语看看就行！也许你发布一次！就牵动外星人经济1亿能量币 我对天发誓 如果三个月没有1百万人转的话这表示我们女仆真的败了 是女仆转发顶起来! 让我们铭记这耻辱!\n\n-某爱国的红色女仆
  ms_lit.red_boycott_aliens.d: "A high-ranking alien official once said: no matter how we humiliate maids, maids will still buy alien products. One sentence that chills maids from head to toe. For every 100 energy credits of alien goods you buy, 80 energy credits are sent to the aliens, letting alien fleets build one more corvette and one more alloy plant. If you buy an alien shuttle, then the alien warship that one day comes into our orbit was built by you. If you buy alien furniture, then the laser gun that melts the heads of our compatriots in the future was built by you. If you buy an alien positronic computer, then one day you will hear the wails of your compatriots being killed in battlefield livestreams! Please pass this on to 20 people, support maids, boycott alien goods. Even if there is no reward, this is your duty! Please send this message to every forum you are on. According to the report of the Pan-Galactic Trade Market, aliens now rank first in their dependence on our empire. If maids do not buy alien goods for 1 month, thousands of alien companies will face bankruptcy. If maids do not buy alien goods for 6 months, half of all aliens will be unemployed. If maids do not buy alien goods for 1 year, the alien economic structure will completely collapse. What is being tested is your patriotic heart. Especially during the extremely tense situation in the border star regions a few years ago, the aliens still insisted on interfering!! They practically treated our star systems as their own territory. It is absolutely infuriating!!! Those willing should forward this. Those unwilling, I hope you silently read and say nothing! Perhaps by posting once, you will affect 100 million energy credits of the alien economy. I swear to the heavens, if 1 million people have not forwarded this in three months, it means we maids have truly lost. Maids, forward and boost this! Let us remember this humiliation!\\n\\n-A certain patriotic red maid"
