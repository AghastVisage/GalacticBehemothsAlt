l_english:
  # 种族优越
  gts_apartheid_a: "Racial Superiority"
  # 体型受歧视
  gts_be_apartheid: "Discriminated"
  # 受尊重
  tinys_goods_policy_1: "Respected"
  # 略感不安
  tinys_goods_policy_3: "Slightly Uneasy"
  # 惊慌失措
  tinys_goods_policy_4: "Panic-stricken"
  # 惶恐终日
  tinys_goods_policy_5: "In Constant Fear"
  # §r帝国类型§!
  policy_gts_empire_type: "§rEmpire Type§!"
  # 帝国类型是我们的政治基石，这决定了整个帝国的在内政外交方面的定位
  policy_gts_empire_type_desc: "Empire Type is our political cornerstone, determining the empire's positioning in domestic and foreign affairs."
  # §Y天体帝国§!
  gts_empire_type_ultra: "§YCelestial Empire§!"
  # 这种帝国的存在本身便是一种威胁，她们的国民本身就比星体巨大，倘若她们对其他帝国发起军事行动，那即便是派出最为精锐的舰队恐怕都无法拦住一个她们的普通国民\n\n她们的发展潜力我们无法估计，但她们为发展要付出的代价对我们而言绝对是一个天文数字
  gts_empire_type_ultra_desc: "The existence of this empire is a threat itself. Its citizens are larger than stars. If they launch military operations, even the most elite fleets cannot stop a single ordinary citizen.\n\nTheir potential is immeasurable, but the cost of development is astronomical for us."
  # §R泰坦帝国§!
  gts_empire_type_titan: "§RTitan Empire§!"
  # 这种帝国在寰宇间极为罕见，尽管她们的国民数量稀少，但仅仅只是几个她们的国民就足够威慑住体型比她们小的帝国的军队\n\n星球的地貌对帝国而言是可以轻易重塑的玩物、敌人的舰队可轻易被她们粉碎\n\n她们的发展潜力不容小觑，但她们要为发展付出的代价也更加高昂
  gts_empire_type_titan_desc: "Rare in the universe. Though few in number, a few citizens are enough to deter armies of smaller empires.\n\nPlanetary terrain is a plaything to reshape; enemy fleets are easily crushed.\n\nTheir potential is significant, but development costs are high."
  # §S巨型帝国§!
  gts_empire_type_giant: "§SGiant Empire§!"
  # 这种帝国在寰宇间的数量稀少，依靠帝国国民百米之高的体型，帝国能够以极小的代价轻易粉碎一切体型小于她们的敌人\n\n同样，巨大的体型让帝国的发展潜力远高于体型小的帝国，尽管代价要更加高昂
  gts_empire_type_giant_desc: "Rare in the universe. With citizens hundreds of meters tall, they can crush smaller enemies with minimal cost.\n\nGiant size means higher potential than smaller empires, though costs are higher."
  # §M大型帝国§!
  gts_empire_type_tall: "§MTall Empire§!"
  # 这类帝国的数量在星间相比标准帝国而言较少，但她们的国民体型依照星间标准通常都有几米到几十米，但这也意味着帝国的维持成本更大\n\n更大的体型让她们能够在星间四处欺凌那些更小的帝国，但遇到体型更大的帝国时，她们又回到了被欺凌者的身份
  gts_empire_type_tall_desc: "Fewer than standard empires. Citizens are meters to tens of meters tall, meaning higher maintenance costs.\n\nLarger size allows them to bully smaller empires, but they become victims when facing larger ones."
  # §B标准帝国§!
  gts_empire_type_normal: "§BStandard Empire§!"
  # 这一类的帝国是寰宇间最常见的帝国，他们的国民的体型最为标准，标准的体型让她们的帝国通常充当体型更大的帝国和微型帝国间沟通的中间人
  gts_empire_type_normal_desc: "The most common empire type. Standard size makes them intermediaries between larger and micro empires."
  # §G矮人帝国§!
  gts_empire_type_small: "§GSmall Empire§!"
  # 这一类帝国在寰宇间的数量与标准帝国齐平，但碍于她们的国民体型仅有标准帝国的一半不到，她们在各种场合都只能充当标准帝国的陪衬甚至附庸\n\n但这样的体型也为她们带来了便利，在各种场合上她们往往能够出其不意的制造一些“惊喜”
  gts_empire_type_small_desc: "As common as standard empires. With citizens half the size of standard ones, they serve as foils or subjects.\n\nBut their size brings convenience; they can often create 'surprises'."
  # §T微小帝国§!
  gts_empire_type_tiny: "§TTiny Empire§!"
  # 这类帝国在寰宇间的数量极多，但考虑到她们的国民体型仅有几厘米不到，所以数量并不能为她们带来足够的优势\n\n与其将她们称作帝国，倒不如将她们称作玩具国家，毕竟她们的发展潜力与各方面的效率都低的可怜\n\n但和低效带来的低成本相比，这些低效率似乎都不算什么了
  gts_empire_type_tiny_desc: "Very common. Citizens are a few centimeters tall. Numbers don't give enough advantage.\n\nRather than an empire, they are toy nations. Development potential and efficiency are pitifully low.\n\nBut compared to low costs, low efficiency seems acceptable."
  # §g细菌帝国§!
  gts_empire_type_micro: "§gMicro Empire§!"
  # 与其说她们是一种文明，倒不如说是细菌成了精\n\n这类帝国的存在可能仅仅只需占据星间的某个犄角旮旯，她们的国民可能会被人误认为是细菌而被轻易杀灭\n\n尽管她们极为脆弱，但微小的体型也赋予了她们顽强的生命，帝国往往会在毁灭中又一次复苏，重获崭新的生命\n但……这样的帝国能否在星间获得一席之地，这点值得怀疑
  gts_empire_type_micro_desc: "Less a civilization, more like sentient bacteria.\n\nThey occupy corners of the galaxy, easily mistaken for germs and killed.\n\nThough fragile, their size gives tenacity. They often recover from destruction.\nBut... can such an empire gain a place in the stars? Doubtful."
  # §L分子帝国§!
  gts_empire_type_nano: "§LNano Empire§!"
  # 这种帝国的存在可能仅仅只需要占据一个小小的细胞，我们很难判断她们为何能够到达宇宙之中，但我们可以确定，这种帝国完全就是一个可被微生物中的少女肆意蹂躏的帝国\n\n很难想象她们在星间究竟要依靠什么来发展，但她们同样是不容小觑的敌人，毕竟这样微小的体型完全能让她们爆发出我们无法想象的潜能
  gts_empire_type_nano_desc: "They may occupy just a cell. It's hard to judge how they reached space, but they are definitely an empire to be ravaged by microbial maidens.\n\nHard to imagine how they develop, but they are not to be underestimated. Such small size unleashes unimaginable potential."
  # §r帝国对巨娘政策方针§!
  policy_gts_giantess_treatment: "§rGiantess Policy§!"
  # 帝国对巨娘的政策方针会影响帝国境内这些巨娘的命运以及可选政策
  policy_gts_giantess_treatment_desc: "Affects the fate of Giantesses in the empire and available policies."
  # 友善
  gts_giantess_treatment_positive: "Friendly"
  # 小人们崇拜巨娘，被她们的美丽与力量所折服\n帝国内的巨娘受到小人们超规格的礼遇，为巨娘服务的工作也受到人们的尊重\n一些巨娘干脆沉迷于小人们的侍奉之中变成了只会涩涩的废人，其他的巨娘也许会对一些，嗯…过于热情的小人感到不安
  gts_giantess_treatment_positive_desc: "Small folk worship Giantesses, awed by their beauty and power.\nGiantesses receive extraordinary treatment. Service jobs for them are respected.\nSome Giantesses become useless perverts addicted to service; others feel uneasy about the... excessive enthusiasm."
  # 中立
  gts_giantess_treatment_neutral: "Neutral"
  # 小人们对于巨娘的情感总体来说是十分复杂的，一方面崇拜她们的天生神力，另一方面也畏惧这种力量会导致毁灭，因此他们对于巨娘的态度总是有所保留\n\n巨娘在这样的社会里需要谨慎行事，过度的展示自己的存在或许会带来负作用
  gts_giantess_treatment_neutral_desc: "Small folk have mixed feelings: worshipping power but fearing destruction. Their attitude is reserved.\n\nGiantesses must be cautious. Excessive display of existence may backfire."
  # 敌对
  gts_giantess_treatment_hostile: "Hostile"
  # 对巨大生物的恐惧已经深深植入小人的内心深处，小人们会尽可能与巨娘保持距离，与巨娘打交道的小人会被视为异端与叛徒\n\n即使一般情况下小人很难伤害到巨娘，但如果巨娘的性格比较软弱，还是会被这些小家伙骑在头上欺负
  gts_giantess_treatment_hostile_desc: "Fear of giant creatures is deep-rooted. Small folk keep their distance. Those dealing with Giantesses are seen as heretics.\n\nThough hard to hurt, weak-willed Giantesses might be bullied by these little guys."
  # §r帝国对小人政策方针§!
  policy_gts_tiny_treatment: "§rSmall Folk Policy§!"
  # 帝国对小人的政策方针会影响帝国境内这些小人的命运以及可选政策
  policy_gts_tiny_treatment_desc: "Affects the fate of small folk in the empire and available policies."
  # 友善
  gts_tiny_treatment_positive: "Friendly"
  # 巨娘们乐意与这些可爱的小家伙们和平共处，对小人的虐待行为会受到全社会的谴责\n\n在如此友善的社会环境下，小人们可以过上一个相对体面的生活，唯一的坏处是与巨娘过于亲密的贴贴有时也会产生一些意料之外的后果…
  gts_tiny_treatment_positive_desc: "Giantesses live peacefully with these cute little guys. Abuse is condemned.\n\nSmall folk live a decent life. The only downside is that intimate contact sometimes has... unexpected consequences."
  # 中立
  gts_tiny_treatment_neutral: "Neutral"
  # 或许是对于小人的存在并不在意，又或许是社会对小人的态度两级分化，总之巨娘们对小家伙们的态度模棱两可\n\n故意伤害小人用于取乐的行为在某种程度上被默许，只有在事情做太过火的时候才会受到指责\n\n在这种社会氛围里生存的小人只能自求多福，祈祷自己能不要遇到那些心性残忍的巨娘
  gts_tiny_treatment_neutral_desc: "Maybe they don't care about small folk, or society is indifferent."
  # 敌对
  gts_tiny_treatment_hostile: "Hostile"
  # 小人在巨娘们的眼里只不过是一群恶心的虫豸，杀死它们不会带来任何的负罪感，有些巨娘们甚至以折磨和虐杀小人为乐\n\n这样的社会环境对于小人来说是真正的地狱，想要活下去的小人只能凭借异乎寻常的胆量与运气，在巨娘世界的夹缝中求生
  gts_tiny_treatment_hostile_desc: "In the eyes of Giantesses, small people are just a group of disgusting bugs. Killing them will not bring any guilt. Some Giantesses even take pleasure in torturing and killing small people.\n\nSuch a social environment is a real hell for small people. Small people who want to survive can only rely on extraordinary courage and luck to survive in the cracks of the Giantess world."
  # 建筑尺寸标准
  policy_gts_building_style: "Standard Building Size"
  # 
  policy_gts_building_style_desc: """"
  # 巨娘尺寸建筑
  giant_building_style: "Giantess-sized Buildings"
  # §R这会大幅增加建筑花费，请谨慎选择！§!
  giant_building_style_desc: "§RThis will significantly increase building costs, choose wisely!§!"
  # 小人尺寸建筑
  tiny_building_style: "Tiny-sized Buildings"
  # §R这会让巨娘露宿街头，而且转回巨娘尺寸建筑是有代价的！请慎重考虑§!
  tiny_building_style_desc: "§RThis will leave giantesses out on the streets, and reverting back to giantess-sized buildings comes at a cost! Consider carefully§!"
  # 舰队尺寸标准
  policy_gts_fleet_style: "Fleet Size Standard"
  # 
  policy_gts_fleet_style_desc: """"
  # 巨娘尺寸舰船
  giant_fleet_style: "Giantess-sized Ships"
  # §R这会大幅增加造船与维护花费，请谨慎选择！§!
  giant_fleet_style_desc: "§RThis will significantly increase shipbuilding and maintenance costs, choose wisely!§!"
  # 小人尺寸舰船
  tiny_fleet_style: "Tiny-sized Ships"
  # §R这会大幅增降低舰队强度，而且转回巨娘尺寸舰队是有代价的！请慎重考虑§!
  tiny_fleet_style_desc: "§RThis will severely decrease fleet strength, and reverting back to giantess-sized fleets comes at a cost! Consider carefully§!"
  # 犯罪惩治法
  policy_gts_paraox_player: "Criminal Treatment Act"
  # 虽然各国都有着灵活的道德标准，但是一些行为依然为我们所不齿，现代科技为我们的执法部门在处理罪犯与战俘时提供了一些其他的选项。
  policy_gts_paraox_player_desc: "Although countries have flexible moral standards, some actions are still despised. Modern technology offers our law enforcement other options in dealing with criminals and prisoners of war."
  # 正常处理
  gts_paradox_normal: "Standard Handling"
  # 正常处理
  gts_paradox_normal_name: "Standard Handling"
  # 罪犯和战俘将按照法律进行正常的审判。
  gts_paradox_normal_desc: "Criminals and prisoners of war will be judged according to the law."
  # 交由领袖
  gts_paradox_leader: "To the Leader"
  # 交由领袖
  gts_paradox_leader_name: "To the Leader"
  # 罪犯和战俘将会被缩小到无害的程度后送给领袖进行处理，至于是被用作实验、奖励自己还是单纯当宠物养，这就不是我们要管的了。
  gts_paradox_leader_desc: "Criminals and prisoners of war will be shrunk to a harmless size for the leader's use, whether for experiments, as rewards, or simply as pets."
  # 投放市场
  gts_paradox_market: "Market Release"
  # 投放市场
  gts_paradox_market_name: "Market Release"
  # 在这些恶人身上花钱实属浪费，现在罪犯和战俘将会被缩小到无害的程度后投入市场拍卖，由于我们并不关心这些商品的用途，他们往往会被买个好价钱。
  gts_paradox_market_desc: "It's wasteful to spend money on these villains. Criminals and prisoners will be shrunk and auctioned, often fetching good prices as we aren't concerned with their use."
  # 流放土著星球
  gts_paradox_aus: "Exile to Native Planets"
  # 流放土著星球
  gts_paradox_aus_name: "Exile to Native Planets"
  # 与其让这些恶人在牢里烂掉，不如让他们为科学献身，现在罪犯和战俘会在缩小处理和关键记忆抹除后流放到那些有一定文明程度的土著星球，这无疑会提高观测站的社会学产出。\n\n所有观测站将额外产出4点£society£ §H社会研究点§!
  gts_paradox_aus_desc: "Instead of rotting in prison, let them serve science. Criminals will be shrunk, memories erased, and exiled to native planets, boosting observatory sociology output.\n\nAll observatories gain +4 £society£ §Hsocial research§!"
  # 住房法
  policy_gts_houses: "Housing Act"
  # 住房问题自古以来是一个重点社会议题，而当社会存在着体型差距悬殊的多个种族时，住房政策应向哪方倾斜就更值得仔细考虑了。
  policy_gts_houses_desc: "Housing has always been a major social issue, and with drastically different-sized species, deciding whose needs to prioritize requires careful consideration."
  # 维持平衡
  gts_houses_balance: "Maintain Balance"
  # 维持平衡
  gts_houses_balance_name: "Maintain Balance"
  # 国家政策将尽可能在这个问题上保持中立。
  gts_houses_balance_desc: "National policy will remain neutral as much as possible on this issue."
  # 大杂居
  gts_houses_free: "Large Mixed Living"
  # 大杂居
  gts_houses_free_name: "Large Mixed Living"
  # 在这方面，我们并不会面临其他国家那样棘手的社会压力。我国的两个种族在历史上的长期斗争和共存中已经自行解决了这个问题，在同一社区居住的巨娘和小人的生活也可以并行不悖，相处自然。
  gts_houses_free_desc: "We don't face the same social pressures as other nations. Our races have resolved this, allowing giantesses and tinies to coexist naturally in shared communities."
  # 当然住在彩彩家啊
  gts_houses_aya: "Of Course, Live at Aichan's House"
  # 当然住在彩彩家啊
  gts_houses_aya_name: "Of Course, Live at Aichan's House"
  # 我们国家的至高偶像对于我们居住在她房间里的请求十分慌乱但最终还是同意的，这使得我国的小人们完全不用担心住房问题。虽然偶尔有些小人定居点因为选址离丸山彩活动的地点过近或者出现在一些奇怪的地方而被她无意识碾碎或化作她身体的养分。但能居住在这样一位可爱的巨娘偶像身边，这又有什么问题呢？
  gts_houses_aya_desc: "Our idol reluctantly but graciously agreed to let us live in her room, eliminating housing troubles for our tinies. Being close to such a beloved giantess idol is worth the occasional settlement accidentally crushed underfoot!"
  # 小人城市包租
  gts_houses_giantess: "Tiny City Rental"
  # 小人城市包租
  gts_houses_giantess_name: "Tiny City Rental"
  # 对双方进行审查后，政府部门会将小人们送往巨娘寄宿家庭定居，寄宿家庭将开辟出一个空房间来盛放定制的小人城市，依据体型差距接纳几百人到上万人不等的小人入住。城市的税收与管理责任一并外包给了这些寄宿巨娘们，相关部门只会定期探查是否出现严重的人口失踪或城市毁伤问题，并为巨娘寄宿家庭提供资金补贴和法律帮助。
  gts_houses_giantess_desc: "After screenings, tinies are sent to giantess homestays, with a custom-made tiny city housed in an extra room. Taxes and management are outsourced to the hosting giantesses, with regular checks for serious issues."
  # 巨娘寄宿义务
  gts_houses_tinies: "Giantess Hosting Duty"
  # 巨娘寄宿义务
  gts_houses_tinies_name: "Giantess Hosting Duty"
  # 政策将会致力于建设符合巨娘审美和生活需要的大型城市，而作为交换，巨娘们有义务将自己的贴身衣物乃至自己的身体开放给小人们居住，巨娘们需要依照政府发布的规章对自己的身体进行清洁，并且穿戴专门设计的服装以尽可能保证身上小人的生活环境。国家将以每个巨娘为一个行政区划组建自治政府进行治安、征兵、生产等日常行政工作。
  gts_houses_tinies_desc: "Giant-friendly cities will be built, obligating them to offer clothing or bodies for tinies. They must follow government hygiene rules and use specific clothing to ensure tiny habitats. Each giantess forms a self-governing district for overseeing daily administration."
  # 种族隔离
  policy_gts_apartheid: "Racial Segregation"
  # 种族隔离在古代曾被视作一种不人道而反动的制度，但在现代多种体型物种的交流、旅行、移民越发频繁，潜在的麻烦让我们不得不重新考虑现代隔离政策的合理性。
  policy_gts_apartheid_desc: "While historically inhumane, segregation might warrant reconsideration amid frequent multi-sized species interaction, travel, and migration."
  # 歧视巨娘
  gts_gaintess_apartheid: "Discriminate Against Giantesses"
  # 歧视巨娘
  gts_gaintess_apartheid_name: "Discriminate Against Giantesses"
  # 这些大而无脑的家伙无论干什么都只会给我们的社会添麻烦！为了能集中管理她们，我们将在偏远地区建设一些供这些巨娘生活的隔离居住区，一旦她们试图离开隔离区威胁我们的安全，隔离区附近密密麻麻的防空部队将立刻把她们送回地狱！我们的资源稀少，除了最基础的设施之外，剩下的麻烦事就让她们自己想办法解决吧。\n\n§G所有拥有§M体型矮小、体型微小、微生物§!特质的物种会获得政治权力、产能、幸福度奖励§!\n§R所有拥有§M泰坦级生物、体型巨大、体型高大§!特质的物种会获得政治权力、产能、幸福度惩罚§!
  gts_gaintess_apartheid_desc: "These overgrown fools only cause trouble! Segregated living zones will be in remote areas, highly guarded. With minimal resources, they're left to fend for themselves.\n\nSpecies with §YTitan-size§!, §YHuge Build§!, or §YTall Build§! traits face penalties; §YSmall Build§!, §YTiny Build§!, or §YMicrobial§! traits gain bonuses."
  # 歧视小人
  gts_tinies_apartheid: "Discriminate Against Tinies"
  # 歧视小人
  gts_tinies_apartheid_name: "Discriminate Against Tinies"
  # 仅仅因为它们有智能，我们就要把这些虫子视作和我们平等的物种吗？笑话！出于最低限的仁慈，我们会给这些虫子设置单独的隔离居住区，一旦他们试图离开隔离区，它们就将被剥夺最基本的人权，可以被任何公民自由处置。至于他们的政治诉求和城市维护？那就不是我们该关心的了。\n\n§R所有拥有§M体型矮小、体型微小、微生物§!特质的物种会获得政治权力、产能、幸福度惩罚§!\n§G所有拥有§M泰坦级生物、体型巨大、体型高大§!特质的物种会获得政治权力、产能、幸福度奖励§!
  gts_tinies_apartheid_desc: "Their intelligence doesn't make these bugs our equals! Segregated zones limit their rights, subjected to public disposal. Their political needs aren't our concern.\n\nSpecies with §YSmall Build§!, §YTiny Build§!, or §YMicrobial§! traits face penalties; §YTitan-size§!, §YHuge Build§!, or §YTall Build§! traits gain bonuses."
  # \"隔离但平等\
  gts_normal_apartheid: "\"Separate but Equal\"
  # \"隔离但平等\
  gts_normal_apartheid_name: "\"Separate but Equal\"
  # 尽管受到质疑，但我们的隔离政策并不带有歧视性。相反，这是在考虑到不同物种体型的客观影响，为避免不必要的社会矛盾而做出的科学决策。不同的物种将会生活在划定的居住区里互不接触，而其政治权利和人身财产权利丝毫不受影响。
  gts_normal_apartheid_desc: "Despite doubts, our policy avoids discrimination. It's a scientific decision, recognizing physical effects and avoiding social conflict. Different species inhabit designated zones, retaining their political rights."
  # 促进交流
  gts_less_apartheid: "Encourage Interaction"
  # 促进交流
  gts_less_apartheid_name: "Encourage Interaction"
  # 彻底的让两个种族老死不相往来是不现实的，我们将在歧视性隔离与无序放任之间寻求一个平衡：在充足的审查和基础设施改造后，我们将允许不同隔离区域的人们进行定期定时的交际访问。
  gts_less_apartheid_desc: "An unrealistic complete divide is tempered by allowing orderly interaction under scrutiny and infrastructure reform."
  # 废除种族隔离
  gts_no_apartheid: "Abolish Racial Segregation"
  # 废除种族隔离
  gts_no_apartheid_name: "Abolish Racial Segregation"
  # 无论在什么时代，种族隔离制度都是社会毒瘤，我们不能以任何理由将这些糟粕重新捡起。巨娘和小人有权利共同生活、学习、工作、恋爱，做任何她们想做的事！
  gts_no_apartheid_desc: "Segregation is a societal cancer regardless of era. Giantesses and tinies have the right to live, learn, work, and love freely."
  # 缩小商品生产规范
  policy_gts_shrink_method: "Miniature Production Standards"
  # 缩小类商品的精华就在于生动灵活的缩小人，但该如何制造合格的缩小人呢？
  policy_gts_shrink_method_desc: "The essence of miniaturization lies in lively, miniature beings, but how should we produce them?"
  # 基因流水线
  gts_shrink_method_1: "Gene Production Line"
  # 最适合顾客的小人只能来自她们自己，自适应编辑器可以让顾客用自己身上体液、皮屑等等哪怕最卑贱的脱落物立刻制造海量的小人满足其各种需要！
  gts_shrink_method_1_desc: "Each customer's personal tinies originate from themselves! Adaptive editors use their fluids and cells to instantly meet their needs.\n§YEach Miniature Product creates +3, requires 0.01 nanobots§!"
  # 灵能浇筑
  gts_shrink_method_2: "Psionic Infusion"
  # 灵能校准仪让我们可以用虚境的力量将灵能力注入我们制作的躯体中。这将高效制造有思想有血肉，又能轻易被主人洞察内心的缩小人。
  gts_shrink_method_2_desc: "Psionic calibrators join virtual power to flesh, creating perceptible, sentient miniatures.\n§YEach Miniature Product creates +3, requires 0.01 zelok§!"
  # 人工合成
  gts_shrink_method_3: "Artificial Synthesis"
  # 现代科学为我们指了明路，现在我们可以选择用有机物直接为顾客定制满足她们需要的，忠诚而耐用的缩小人。
  gts_shrink_method_3_desc: "Modern science empowers us to synthesize custom, loyal, durable miniatures.\n§YEach Miniature Product creates +2, requires 0.1 volatile motes§!"
  # 人工培育
  gts_shrink_method_4: "Artificial Cultivation"
  # 将其他生命缩小为玩具无论如何都是不人道的，但对于那些本来就是微小生物进行选育，或许会是个好的折中方案。
  gts_shrink_method_4_desc: "Miniaturizing life is inhumane, but selectively breeding tiny species is a compromise.\n§YEach Miniature Product maintenance cost halved§!"
  # 仅缩小非公民
  gts_shrink_method_5: "Shrink Non-citizens Only"
  # 那些奴隶本就低贱于我们，将它们缩小用来服侍我们是我们理所当然的权利。
  gts_shrink_method_5_desc: "Slavery justifies miniaturizing submissive figures for service.\n§YEach Miniature Product creates +1§!"
  # 仅缩小未开智物种
  gts_shrink_method_6: "Shrink Non-sapient Species"
  # 与其让我们太空文明的宝贵人口被缩小，不如让没有智慧的造物去履行这一使命。
  gts_shrink_method_6_desc: "Valuable populations preserve full stature, while non-sapient entities undertake the role.\n§YEach Miniature Product creates +2§!"
  # 无管控
  gts_shrink_method_7: "No Regulation"
  # 只要有足够的小人供应就够了，为什么要管它是从哪来的呢？
  gts_shrink_method_7_desc: "With ample tiny supply, why care about origins?\n§YEach Miniature Product creates +3§!"
  # 缩小商品使用方向
  policy_gts_shrink_use: "Miniature Product Usage"
  # 缩小类商品中最负争议的也是缩小人，我们是否应限制对缩小人的使用方向？
  policy_gts_shrink_use_desc: "To what extent should miniatures, the most controversial of products, be controlled?"
  # 有限人权
  gts_shrink_use_1: "Limited Rights"
  # 尽管这些缩小人很难再认为是人了，但我们仍要尽可能给予其一定的尊严，针对缩小人的恶劣犯罪同样会被惩治。\n§Y这会影响国内小人群体对国家的信任！§!
  gts_shrink_use_1_desc: "Though debatably human, we extend dignity to miniatures. Heinous crimes against them can't go unpunished.\n§YAffects tinies' trust in the state!§!"
  # 禁止虐待
  gts_shrink_use_2: "Prohibit Abuse"
  # 缩小人不是为了满足某些人的阴暗愿望而被制造出来的，一切对缩小人进行虐待折磨的行为都应被谴责。\n§Y这会影响国内小人群体对国家的信任！§!
  gts_shrink_use_2_desc: "Miniatures aren't meant to fulfill dark desires. Abusing them isn't acceptable.\n§YAffects tinies' trust in the state!§!"
  # 禁止食用
  gts_shrink_use_3: "Prohibit Consumption"
  # 缩小人也是生命，无数小人连同他们的家园被吞入腹中，缩小人被牙齿碾碎或被胃液腐蚀这一末日景象决不能发生在我们体内。\n§Y这会影响国内小人群体对国家的信任！§!
  gts_shrink_use_3_desc: "Miniatures are alive. We can't allow them to meet apocalyptic fates inside us.\n§YAffects tinies' trust in the state!§!"
  # 禁止残杀
  gts_shrink_use_4: "Prohibit Massacre"
  # 为了让我们的人性不会被他们的血液腐蚀，就算是食用或者处死，我们也应当禁止不人道的虐杀。\n§Y这会影响国内小人群体对国家的信任！§!
  gts_shrink_use_4_desc: "To preserve our humanity, torment-free, ethical treatment is essential.\n§YAffects tinies' trust in the state!§!"
  # 无管控
  gts_shrink_use_5: "No Restriction"
  # 消费者怎么使用她的所有物还需要我们指手画脚吗？\n§Y这会影响国内小人群体对国家的信任！§!
  gts_shrink_use_5_desc: "How should we dictate consumer property use?\n§YAffects tinies' trust in the state!§!"
  # §_星球巨娘尺寸住房法案§!
  decision_gts_housing1: "§_Planet Giantess Housing Act§!"
  # 为了给这些巨娘们足够的居住空间，将在星球上推广巨娘尺寸住房设计法案
  decision_gts_housing1_desc: "To provide adequate space, the giantess housing act will be implemented on the planet."
  # §_取消星球巨娘尺寸住房法案§!
  decision_gts_housing2: "§_Revoke Planet Giantess Housing Act§!"
  # 撤销巨娘尺寸住房法案，恢复原有的小人尺寸住房法案
  decision_gts_housing2_desc: "Withdraw the giantess housing act and restore the original tiny housing plan."
  # 星球巨娘尺寸住房法案
  gts_planet_giant_housing: "Planet Giantess Housing Act"
  # 星球上的住房尺寸将按照巨娘的尺寸进行建造
  gts_planet_giant_housing_desc: "Housing on the planet will be built to giantess dimensions."
