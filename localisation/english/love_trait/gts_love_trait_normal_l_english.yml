l_english:
  # 也许需要和领袖进行一次深入交流才能解锁下一等级的好感度。
  gts_require_engagement: "Perhaps an in-depth communication with the leader is required to unlock the next level of Opinion."
  # §H该领袖好感度已满。§!\n$gts_require_engagement$
  gts_max_love_tooltip: "§HThis leader's Opinion is already full.§!\n$gts_require_engagement$"
  # 好感度
  gts_love_logs: "Favorability"
  # §R好感度§!
  trait_leader_gts_love_logs_normal: "§ROpinion§!"
  # 这位巨娘领袖对你的好感通过神秘手段量化后的数值，会随着时间缓慢的增加，也可以通过某些事件来加速。
  trait_leader_gts_love_logs_normal_desc: "The value of this Giantess leader's favor toward you, quantified through mysterious means, will slowly increase over time and can also be accelerated through certain events."
  # \n\n\n\n£love_leader_trait1_picture£\n\n\n\n\n\n
  leader_trait_love_picture: "\n\n\n\n£love_leader_trait1_picture£\n\n\n\n\n\n"
  # \n\n\n\n\n\n£love_leader_trait1_picture£ \n\n\n\n\n\n\n
  leader_trait_love_picture_married: "\n\n\n\n\n\n£love_leader_trait1_picture£\n\n\n\n\n\n"
  # §R好感度§!：§t低下§!
  gts_love_lv1: "§ROpinion§!: §tLow§!"
  # §R好感度§!：§1较低§!
  gts_love_lv2: "§ROpinion§!: §1Lower§!"
  # §R好感度§!：§H中等§!
  gts_love_lv3: "§ROpinion§!: §HMedium§!"
  # §R好感度§!：§P较高§!
  gts_love_lv4: "§ROpinion§!: §PHigh§!"
  # §R好感度§!：§P较高（已满）§!
  gts_love_lv4_max: "§ROpinion§!: §PHigh (Full)§!"
  # §R好感度§!：§R最高§!
  gts_love_lv5: "§ROpinion§!: §RMaximum§!"
  # 
  gts_love_lv4_max_tooltip: """"
  # $gts_love_lv1$    ([this.gts_love_logs] / [this.gts_love_level2])\n[this.GetName]与我们还十分生疏，难以真正地敞开心扉.但相信即便是巨娘的心之壁也能被我们逐渐消融。
  trait_leader_gts_love_lv1_desc: "$gts_love_lv1$    ([this.gts_love_logs] / [this.gts_love_level2])\n[this.GetName] is still a stranger to us, so it's hard to truly open up to her. But I believe that even the walls around the Giantess's heart can be gradually broken down by us."
  # $gts_love_lv2$    ([this.gts_love_logs] / [this.gts_love_level3])\n[this.GetName]的感情逐渐升温，似乎逐渐成为了[Owner.GetName]的一份子
  trait_leader_gts_love_lv2_desc: "$gts_love_lv2$    ([this.gts_love_logs] / [this.gts_love_level3])\n[this.GetName]'s feelings are gradually growing stronger, and it seems they are slowly becoming a part of [Owner.GetName]"
  # $gts_love_lv3$    ([this.gts_love_logs] / [this.gts_love_level4])\n长时间的合作也让我们与[this.GetName]积累了信任，她如今已经成为了我们可靠的伙伴
  trait_leader_gts_love_lv3_desc: "$gts_love_lv3$    ([this.gts_love_logs] / [this.gts_love_level4])\nThrough our long-term collaboration, we have built a strong relationship of trust with [this.GetName], who has now become a reliable partner of ours."
  # $gts_love_lv4$    ([this.gts_love_logs] / [this.gts_love_level5])\n我们如今与[this.GetName]拥有了深厚的情谊，即使再大的体型差距也难以阻碍这份关系\n$leader_trait_love_picture$
  trait_leader_gts_love_lv4_desc: "$gts_love_lv4$    ([this.gts_love_logs] / [this.gts_love_level5])\nWe have now developed a deep bond with [this.GetName], and even the greatest difference in size cannot stand in the way of this relationship\n$leader_trait_love_picture$"
  # $gts_love_lv4_max$    ([this.gts_love_logs] / [this.gts_love_level5])\n无论[Owner.GetName]剑指何方，[this.GetName]始终都将陪在我们身旁\n\n$leader_trait_love_picture$$gts_max_love_tooltip$
  trait_leader_gts_love_lv5_desc: "$gts_love_lv4_max$    ([this.gts_love_logs] / [this.gts_love_level5])\nNo matter where [Owner.GetName]'s sword points, [this.GetName] will always be by our side\n\n$leader_trait_love_picture$$gts_max_love_tooltip$"
  # $gts_love_lv5$    ([this.gts_love_logs]) \n[this.GetName]与我们已然超越了言语的描述，即使星河俱灭，她也会追随我们直至宇宙尽头。$leader_trait_love_picture$
  trait_leader_gts_love_lv6_desc: "$gts_love_lv5$    ([this.gts_love_logs]) \n[this.GetName] and I have already transcended words; even if the stars and galaxies were to perish, she would follow us to the very end of the universe.$leader_trait_love_picture$"
