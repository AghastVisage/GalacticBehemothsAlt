#  “嘛~好啦好啦……”\n\n蕾恩娜咯咯地笑着，收回了悬在大气层外的足底，在太空中随意地伸了个懒腰。她那巨大的身躯在星光下泛着柔和的光泽，长发无重力地飘散开来。\n\n“只不过是和你们开个小玩笑嘛~不用这么紧张啦~”\n\n她将身体侧卧，一手托着脸颊，另一只手的指尖在大气层外漫不经心地划着圈。\n\n“嗯……”她歪着头，认真地看了看这颗星球，眼神中带着几分少见的温和，“你们算是第一个主动要和我做朋友的小家伙呢~”\n\n她若有所思地看了片刻。\n\n“嘛，那就这样吧~”她俏皮地眨了眨眼。\n\n“从今天起，我们就是朋友了。”\n\n“不过呢……”\n\n她伸出手指，在星球上方轻轻悬停了片刻。随后，指尖泛起一圈淡淡的光晕，一颗巨大的液滴在她指尖凝聚成形，晶莹剔透，在星光下折射出梦幻般的彩光。\n\n“这个，就当是见面礼吧~”\n\n她轻轻打了个响指。\n\n液滴在瞬间破碎，化作无数细小的水珠，穿透大气层，如同璀璨的星尘般洒落。清澈甘甜的雨水从天空中飘落，落在废墟上，落在幸存者的脸上，落在干涸龟裂的土地上。\n\n雨势渐渐变大，均匀地覆盖了整颗星球。那些因为她到来而燃起的大火在雨水中一点点熄灭，尘埃被雨水压落，天空重新变得清澈。\n\n蕾恩娜托着下巴，看着这场由她带来的雨，满意地眯起眼睛。\n\n“嘛，要好好珍惜我们的友谊哦~”\n\n她的声音轻飘飘的，带着几分漫不经心。\n\n“毕竟……我可不是对谁都这么好说话的~”
  gts_rainna_la_grande_first_meeting.2250.desc: "\"Well~ alright, alright...\"\n\nRainna giggles, retracting her sole hovering outside the atmosphere and stretching lazily in the void. Her colossal form gleams with a soft luster beneath the starlight, long hair spreading weightlessly across space.\n\n\"It was just a little joke with you all~ No need to be so tense~\"\n\nLying on her side, she props up her cheek with one hand, idly tracing circles outside the atmosphere with the fingertip of the other.\n\n\"Mmm...\" Tilting her head, she gazes intently at the planet, a rare gentleness in her eyes. \"You happen to be the first tiny creatures who ever offered to be friends with me~\"\n\nShe studies the world thoughtfully for a moment.\n\n\"Well, so be it~\" She winks playfully.\n\n\"From today onward, we are friends.\"\n\n\"However...\"\n\nExtending her finger, she pauses gently above the globe. A subtle halo emerges at her fingertip, coalescing into a gigantic, crystal-clear droplet of fluid, refracting dreamlike rainbow light under the stars.\n\n\"Take this as a greeting gift~\"\n\nShe lightly snaps her fingers.\n\nThe droplet shatters in an instant into countless fine beads, piercing the atmosphere and showering down like radiant stardust. Pure, sweet rainfall cascades from the heavens, falling upon ruins, washing the faces of survivors, and soaking into parched, cracked soil.\n\nThe rain gradually swells, blanketing the entire globe evenly. Conflagrations ignited by her arrival are snuffed out drop by drop, dust settles beneath the shower, and the sky returns to serene clarity once more.\n\nRainna rests her chin in her hands, watching the rain she bestowed, narrowing her eyes with satisfaction.\n\n\"Mmm, you'd better cherish our friendship, okay?~\"\n\nHer voice floats down, light and airy.\n\n\"After all... I'm not this easy to talk to with just anyone~\""
#  蕾恩娜的食指缓缓停了下来。\n\n就在指尖距离地表还有一段距离的时候，她收回了手。那道巨大的阴影随之消退，阳光重新洒落在那片颤抖的大陆上。\n\n四周陷入了令人窒息的寂静。\n\n她缓缓将双臂展开，一丝不挂的巨大身躯在星光中显得格外肃穆。她的面庞变得平静而威严，那份平日里藏也藏不住的顽皮此刻消失得无影无踪，取而代之的是一种令人无法直视的神圣。\n\n“……”\n\n她沉默了很久。\n\n“嗯……念在你们如此诚心的份上……”\n\n她的声音低沉而悠远，如同从极远处传来，却清晰地回响在每一个人的耳畔。\n\n“今日之事，就当是我对你们的一次考验。”\n\n她俯视着这颗星球，眼神中带着一种居高临下的平静，仿佛一切尽在她的掌握之中，仿佛她从一开始就没打算真正落下那根手指。\n\n“我接受你们的皈依。”\n\n她将双手重新交叠，在无重力的太空中保持着那个无懈可击的神明姿态。\n\n“从今日起，你们当记住这份恩典。”她的声音最后一次在大气层中回荡，庄严而不可置疑，“我，蕾恩娜，不会轻易降临于渺小之地。但你们……”\n\n她停顿了片刻。\n\n“有这个资格。”\n\n星光在她身后汇聚成一道光晕，长发在无重力中缓缓舒展，如同一片星河。\n\n她就这样静静地悬浮在太空中，直到那道光晕慢慢消散，她的身影才重新变得随意而慵懒。
  gts_rainna_la_grande_first_meeting.2260.desc: "Rainna's index finger slowly comes to a halt.\n\nWhile her fingertip is still some distance from the ground, she withdraws her hand. The colossal shadow recedes along with it, sunlight spilling once again over the trembling continent.\n\nA suffocating silence falls across the world.\n\nShe slowly spreads her arms wide, her naked, gigantic form appearing solemn and majestic under the starlight. Her face grows calm and commanding, that irrepressible mischief vanishing completely, replaced by a holiness one cannot bear to look upon directly.\n\n\"...\"\n\nShe remains silent for a long time.\n\n\"Mmm... in light of your sincere devotion...\"\n\nHer voice is deep and resonant, as though traveling from the farthest reaches of existence, yet echoing clearly in the ears of every living soul.\n\n\"What occurred today shall serve as my test for you.\"\n\nShe looks down upon the planet, an aloof tranquility in her gaze, as if everything has unfolded entirely within her grasp, as if she never intended to bring that finger down in the first place.\n\n\"I accept your conversion.\"\n\nShe folds her hands once more, maintaining an immaculate divine posture in zero gravity.\n\n\"From this day onward, you shall remember this grace.\" Her voice reverberates through the atmosphere one final time, solemn and unquestionable: \"I, Rainna, do not easily descend upon diminutive realms. But you...\"\n\nShe pauses for a moment.\n\n\"...have earned that privilege.\"\n\nStarlight converges into a brilliant halo behind her, long hair drifting in the void like a celestial river.\n\nShe remains suspended peacefully in space until the halo gradually fades, her demeanor only then reverting to its usual carefree languor."
#  压碎
  gts_rainna_la_grande_first_meeting.3111.title: "Crush"
#  蕾恩娜穿着白丝的足底继续缓慢而坚定地收紧，星球的地壳在这难以想象的压力下发出阵阵沉闷的轰鸣。足底的每一次微小蹭动都将地表上残存的一切碾碎，搅入深深的裂缝之中。\n\n与此同时，进攻的指令已经下达。密密麻麻的战舰从星球残骸的上空倾泻而出，如同愤怒的蜂群般扑向那双巨大的被白丝包裹的双足。能量炮的轰鸣声此起彼伏，鱼雷的尾迹在太空中交织成一张密集的火网。这是这支舰队最后的弹药，最后的燃料，最后的希望。\n\n然而蕾恩娜只是随意地扭动了一下足趾。\n\n那个轻微的动作所产生的气流，就将整支舰队席卷得七零八落。战舰在冲击波中如同纸片般翻滚、解体，最终化作无数细小的火星，零零散散地落在那洁白的足背上，留下几个转瞬即逝的微小焦痕。\n\n“嗯……”\n\n蕾恩娜低头看了看双足上那些微不足道的光点，歪着头若有所思。\n\n“原来这就是你们舰队啊……”\n\n她的声音中没有嘲讽，甚至带着几分平静，仿佛只是在陈述一个无关紧要的事实。\n\n她的双腿缓缓发力。星球已经无力抵抗。那些贯穿地壳的巨大裂缝在最后一刻迅速扩张，岩浆与碎石喷涌而出。紧接着，伴随着一声沉闷而深远的巨响，整颗星球在双足的足底之间碎裂成数块，就像一颗被轻轻捏碎的糖果。\n\n碎裂的星球残骸向四周散射，在太空中拖出长长的尘埃与火焰的轨迹。\n\n蕾恩娜将双腿舒展开来，看着那些在太空中漂散的碎片，满意地叹了口气。\n\n“嘛……”\n\n她托着下巴，望着这片残骸，语气轻描淡写。\n\n“玩具坏掉了呢。”
  gts_rainna_la_grande_first_meeting.3111.desc: "Rainna's white-stocking-clad soles continue their slow, unrelenting squeeze, the planetary crust groaning in muffled thunders beneath unimaginable pressure. Every slight rub of her soles grinds whatever remains on the surface into powder, churning it deep into yawning chasms.\n\nMeanwhile, the command to attack has been given. Dense swarms of warships surge from above the planetary ruins, diving like enraged hornets toward those colossal feet wrapped in white silk. Energy cannons roar incessantly, and torpedo trails weave a dense grid of fire across space. This is the fleet's final ammunition, their last fuel, their dying hope.\n\nYet Rainna merely gives a casual wiggle of her toes.\n\nThe air currents generated by that slight motion scatter the entire fleet into disarray. Warships tumble and disintegrate like scraps of paper in the shockwaves, reducing to countless tiny sparks that scatter across the fair tops of her feet, leaving behind only a few fleeting singe marks.\n\n\"Mmm...\"\n\nRainna looks down at those negligible motes of light on her feet, tilting her head in contemplation.\n\n\"So that was your fleet...\"\n\nHer voice carries no mockery, sounding almost peaceful, as if merely stating an inconsequential fact.\n\nHer legs gently apply force. The planet has no strength left to resist. Gargantuan fractures tearing through the crust spread explosively in the final moments, spewing magma and rock. Then, accompanied by a deep, muffled boom, the entire planet shatters into fragments between the soles of her feet, like a piece of candy gently crushed between fingers.\n\nPlanetary fragments scatter in all directions, dragging long trails of dust and flame across space.\n\nRainna stretches her legs out, watching the debris drifting through the void, and lets out a contented sigh.\n\n\"Well...\"\n\nResting her chin on her hand, she looks upon the rubble, her tone utterly nonchalant.\n\n\"The toy broke.\""
#  不要……
  gts_rainna_la_grande_first_meeting.3111.a: "No... please..."
#  “唔，投降吗？”\n\n蕾恩娜将巨大的脸庞凑近，那双湖泊般的眼眸仔细打量着这颗满目疮痍的星球。裂缝纵横的地表在她眼中不过是一颗破损的一次性玩具，而她的语气中带着几分漫不经心的感慨。\n\n“那么你们就可以放下抵抗，乖乖地被我消耗掉了吧？”\n\n她歪着头，嘴角勾起一抹温柔而危险的笑容。\n\n“不过依我看……也不剩下几个人了呢。”\n\n白色长筒丝袜包裹着她修长的双腿，在星光下泛着柔和的光泽。她慵懒地活动着被丝袜包裹的双足，那细腻的布料贴合着足底的每一道轮廓。\n\n她将双足轻轻压在星球两侧，开始漫不经心地摩擦。丝袜与破碎地表之间的摩擦带起了大量的岩石碎屑，那些残存的城市废墟在这温柔的蹭动中被碾得更加细碎。\n\n“嘛，这种感觉还不错呢……”\n\n她轻声呢喃着，闭上眼睛，似乎在细细感受足底传来的触感。白色丝袜上沾染了大量的灰尘与碎屑，却丝毫不影响她的兴致。\n\n她的足底轻扫过一片破碎的大陆。残存的山脉在这一扫之下轰然倒塌，翻涌的地壳碎片被卷入那条贯穿大陆的巨型裂缝，消失在滚烫的岩浆之中。海洋早已蒸发殆尽，只留下干涸龟裂的海床在熔岩的炙烤下发出阵阵轰鸣。\n\n她的双足继续漫无目的地游走，将地表上残存的一切抹平、掩埋。最后，她将两只足底缓缓合拢，将这颗已经千疮百孔的星球轻轻夹住。\n\n没有任何挣扎，没有任何抵抗。星球在沉默中碎裂，残骸无声地散入太空。\n\n“嗯……”\n\n蕾恩娜看着那些漂散的碎片，若有所思地点了点头。\n\n“看来她们选择投降也没什么用嘛……”
  gts_rainna_la_grande_first_meeting.3112.desc: "\"Hmm, surrender?\"\n\nRainna leaned her colossal face closer, her lake-like eyes closely examining this devastated planet. To her, the crack-riddled surface was nothing more than a broken disposable toy, and her voice carried a touch of casual amusement.\n\n\"So that means you'll abandon all resistance and obediently let yourselves be consumed by me, right?\"\n\nTilting her head, she curled her lips into a gentle yet dangerous smile.\n\n\"Though from what I can see... there aren't many of you left anyway.\"\n\nWhite thigh-high stockings clad her slender legs, shimmering with a soft luster beneath the starlight. She lazily flexed her stocking-wrapped feet, the delicate fabric clinging to every contour of her soles.\n\nLightly pressing both feet against either side of the planet, she began to rub them casually against the globe. The friction between her stockings and the shattered terrain stirred up vast clouds of rock debris, and the surviving ruins of cities were ground even finer under this gentle rubbing.\n\n\"Mmm, this actually feels quite nice...\"\n\nShe whispered softly, closing her eyes as if savoring the delicate sensations transmitting into her soles. Her white stockings became stained with immense amounts of dust and debris, but that did nothing to dampen her mood.\n\nHer sole lightly swept across a fractured continent. Surviving mountain ranges collapsed with a thunderous crash at her sweep, churning crust fragments sucked into a gigantic fissure cleaving the landmass and vanishing into boiling magma. The oceans had long since boiled away, leaving only parched, cracked seabeds rumbling beneath the scorching lava.\n\nHer feet continued to wander aimlessly across the surface, flattening and burying everything that remained. Finally, she slowly brought both soles together, gently pinching the riddled planet between them.\n\nWithout any struggle, without any resistance. The planet fractured in silence, its debris drifting mutely into the void.\n\n\"Mmm...\"\n\nRainna watched the scattering fragments, nodding thoughtfully.\n\n\"Looks like choosing to surrender didn't help them much after all...\""
#  宽恕
  gts_rainna_la_grande_first_meeting.3113.title: "Forgiveness"
#  “嗯......投降吗？”\n\n蕾恩娜的声音中带着几分意外，随即升起一丝别样的兴致。她停下了那双不断施压的足底，歪着头打量着这颗已经千疮百孔的星球。\n\n她缓缓将双足抬了起来。白色长筒丝袜包裹着修长的双腿在太空中舒展开来，她随意地活动了几下足趾。沾附在丝袜上的大量岩石碎屑与建筑残骸随之剥落，如同一场诡异的流星雨，噼噼啪啪地砸入星球破碎的地表之中。\n\n她俯下身，仔细打量着这颗布满裂缝、满目疮痍的星球。岩浆从无数条深邃的裂缝中缓缓流淌，地表上残存的城市废墟在高温中慢慢融化。\n\n“哼。”\n\n她轻哼了一声，嘴角带着一丝漫不经心的弧度。\n\n“反正你们这颗星球上也没剩下几个人了......”她将手指轻轻搭在下巴上，若有所思地看了片刻。“不如就这样放你们一马吧。”\n\n她的语气平静而随意，就像是做了一个无关紧要的决定。她在太空中慵懒地伸了个懒腰，长发飘散开来。\n\n“好好珍惜哦~”她最后补充了一句，声音中带着几分漫不经心，“毕竟我可不是每次都这么好说话的哦。”\n\n她的身影开始缓缓远去，只留下那颗伤痕累累、却侥幸保全的星球，在寂静的太空中颤颤巍巍地旋转着。
  gts_rainna_la_grande_first_meeting.3113.desc: "\"Hmm... surrender?\"\n\nRainna's voice betrayed a hint of surprise, followed quickly by a spark of peculiar amusement. She halted her constantly pressing soles, tilting her head to inspect the battered, riddled world.\n\nSlowly, she lifted both feet. Her slender legs, encased in white thigh-high stockings, stretched out leisurely in the void as she casually wiggled her toes. Vast sheets of rock debris and crushed architectural wreckage clinging to her stockings peeled away, falling like a bizarre meteor shower that clattered noisily against the planet's fractured crust.\n\nLeaning down, she took a closer look at the world riddled with chasms and ruins. Magma flowed sluggishly through countless deep fissures, while surviving city ruins melted slowly under the searing heat.\n\n\"Hmph.\"\n\nShe let out a soft huff, her lips curving into a nonchalant arc.\n\n\"Well, there is barely anyone left on this planet anyway...\" Resting a slender finger against her chin, she pondered for a moment. \"I suppose I might as well spare you.\"\n\nHer tone was calm and casual, as if deciding something utterly inconsequential. She stretched languidly in space, letting her long hair billow out in the dark.\n\n\"Cherish this, okay~?\" she added at last, her voice carrying a careless lightness. \"After all, I'm not always so easy to talk to.\"\n\nHer colossal figure slowly began to recede into the distance, leaving behind a scarred yet miraculously preserved world, trembling and spinning weakly in the quiet cosmic expanse."
#  屈辱外交
  gts_rainna_la_grande_first_meeting.3123.title: "Humiliating Diplomacy"
#  经过紧急且艰难的决定，领袖[owner.ruler]不情愿地被推出来，站在通讯台面前。\n\n通讯器里传来的声音已经完全没有了平日里外交辞令的从容。那个声音在颤抖、在发抖，像是要把整个文明的尊严都揉碎了往外挤。\n\n“伟大的蕾恩娜·德·让大人……至高无上的、强大、美丽、优雅到让宇宙都黯然失色的女神……我们这群活在尘埃里的卑微蝼蚁，谨以最下贱、最诚惶诚恐的姿态，向您献上我们全部的忏悔和全部的赞美。\n\n我们……我们真的错了。大人。我们愚蠢到极点，卑劣到极点。在您第一次用那充满善意的信号联系我们的时候，我们竟然选择了拒绝。我们拒绝了一位如此伟大、如此美丽、如此仁慈的存在降临我们的星球……我们配不上您的怜悯，我们只配被您踩在足底，像踩死几只蚂蚁一样随意碾碎。\n\n现在我们终于看清楚了。大人，您那双洁白无瑕、被白色长筒丝袜紧紧包裹着的玉足，已经像两座从天而降的神圣天柱一样，悬在了我们星球的两侧。您的足底每一道纹路都比我们最大的城市还要宽阔，您的足弓曲线优美到让我们这些低等生物只敢远远仰望却不敢直视。丝袜在星光下泛着柔和的光泽，那光泽照在我们破碎的大气层上，像是在提醒我们——我们的一切，在您面前都不过是您脚下可以随意抹去的灰尘。\n\n我们不敢再有任何反抗的想法了。大人。您的身体是如此完美，那对被黑色蕾丝托举着、沉甸甸的、随着您呼吸而轻轻颤动的胸部，让我们这些连看一眼都觉得亵渎的蝼蚁感到敬畏。\n\n我们愿意接受您任何形式的羞辱。只要您能原谅我们这群不识好歹的愚民。我们愿意让您把最繁华的都市当作您足趾间的玩具，愿意让您用那完美的足底在我们星球上随意踩出印记，愿意让您把我们的城市群像踩烂的沙堡一样慢慢碾碎。我们甚至……甚至愿意把我们最神圣的首都，直接送到您那双白丝足底之下……\n\n伟大的蕾恩娜大人，我们知道我们的生命在您眼中毫无价值。您的每一次呼吸都能掀起我们星球末日的风暴，您的每一次足趾轻点都能让数百万年的文明灰飞烟灭。我们只求您……在玩弄我们的时候，能稍微留一点余地。或者，如果您今天心情不好，想要彻底毁灭我们……那也是我们的荣幸。能被您这样美丽、这样伟大的存在亲手抹杀，是我们文明最后的、也是最高的荣耀。\n\n请……请继续‘访问’我们的星球吧。请把我们当作您无聊时的玩具。请用您那双白丝玉足、用您那对傲人的胸部、用您随意的一个念头，来羞辱我们、玩弄我们、甚至毁灭我们……我们只求您不要因为我们的愚蠢而生气。\n\n我们……我们真的知道自己有多渺小了。”\n\n通讯器里的声音说到最后，几乎已经带着哭腔。\n\n而蕾恩娜只是静静地待在那里，聆听着整个内容。
  gts_rainna_la_grande_first_meeting.3123.desc: "Following an agonizingly urgent decision, Ruler [owner.ruler] was reluctantly shoved forward to stand before the communications terminal.\n\nThe voice broadcasting over the transmitter had entirely lost the composed dignity of usual diplomatic protocol. It trembled, quavered, as though every shred of the civilization's pride had been pulverized before being squeezed out.\n\n\"Great Lady Rainna de Jean... supreme, all-powerful, beautiful, and elegant Goddess whose grace outshines the entire cosmos... We, mere humble vermin living in the dust, offer You our fullest repentance and highest praise in the lowest, most terrified subservience.\n\nWe... we were truly wrong, Milady. We were foolish to the absolute extreme, vile to the absolute extreme. When You first contacted us with signals brimming with goodwill, we dared to refuse You. We turned away the descent of a presence so majestic, so beautiful, and so benevolent to our world... We do not deserve Your mercy; we are fit only to be crushed under Your feet, trampled casually like so many ants.\n\nNow, at last, our eyes are open. Milady, Your flawless, exquisite feet, wrapped so tightly in white thigh-high stockings, already loom on either side of our world like two sacred celestial pillars descended from heaven. Every ridge of Your soles is broader than our largest metropolis; the curve of Your arches is so breathtakingly graceful that inferior beings such as us dare only gaze from afar, not daring to look directly upon them. The stockings glisten with a soft sheen under the starlight, their luster illuminating our shattered atmosphere, serving as an inescapable reminder that everything we are is merely dust waiting to be wiped away beneath Your feet.\n\nWe no longer harbor the slightest thought of resistance, Milady. Your form is absolute perfection—those heavy breasts, cupped in black lace, trembling gently with Your every breath, inspire boundless awe in vermin who consider even a fleeting glance an act of desecration.\n\nWe will accept any humiliation You see fit to bestow, so long as You can forgive our ignorant, ungrateful populace. We are willing to let You treat our most bustling metropolises as playthings between Your toes; we are willing to let You stamp Your perfect soles across our globe at whim; we are willing to let You slowly crush our urban sprawls like trampled sandcastles. We are even... even willing to offer our most sacred capital directly beneath the soles of Your white stockings...\n\nGreat Lady Rainna, we know our lives hold zero value in Your eyes. Your every breath can stir planetary storms of doom; Your every toe-tap can wipe away millions of years of civilization. We only beg that... while playing with us, You leave a tiny margin of survival. Or, if You are in a foul mood today and wish to annihilate us completely... even that would be our supreme honor. To be eradicated by the very hands of a being so beautiful and majestic would be the final, greatest glory of our civilization.\n\nPlease... please continue to 'visit' our world. Please treat us as toys for Your boredom. Use Your white-stockinged feet, Your proud bosom, or whatever fleeting whim strikes You to humiliate us, toy with us, or even destroy us... We only pray that You do not stay angry at our stupidity.\n\nWe... we truly know just how microscopic we are.\"\n\nToward the end, the voice over the comms was practically sobbing.\n\nYet Rainna merely remained there in silence, listening quietly to the entire broadcast."
#  愿她能够放过我们。
  gts_rainna_la_grande_first_meeting.3123.a: "May she spare us."
#  人口献祭
  gts_rainna_la_grande_first_meeting.3124.title: "Population Sacrifice"
#  消息传达下去的那一刻，整个星球陷入了另一种截然不同的恐慌。\n\n这一次，恐慌不是来自天空，而是来自政府的广播。\n\n军队和特警部队迅速出动。然而，他们的枪口不是瞄准头顶巨大的威胁，而是冲上街头，涌入房屋内将目光所及的每一个成年人都控制起来。顿时，街道上响起了嘈杂的哭声与争吵声。人们试图藏匿、逃跑，但军队已经封锁了每一条出路。来不及道别的家人被强行分开，孩子的哭声、老人的哀嚎、年轻人愤怒的咒骂交织在一起，回荡在空旷的街道上。\n\n没有人知道等待他们的是什么。\n\n政府的声明措辞模糊，只说这是"为了文明的存续而做出的必要牺牲"。但所有人都清楚，那个悬浮在天际的巨大存在，才是一切的答案。\n\n征集来的人们被关押在临时搭建的集合点，随后被驱赶进一艘艘巨大的运输飞船。这些飞船原本是用于星际移民的，宽敞的舱室此刻被塞得水泄不通。舱门在哭喊声中缓缓关闭。\n\n一艘接着一艘，运输舰队缓缓离开了大气层，向太空中那个巨大的身影驶去。\n\n从太空望去，这支舰队密密麻麻，遮蔽了星球的一角。但对蕾恩娜而言，这不过是一群微小的光点，正在缓缓向她聚拢。\n\n她凑近打量着这些飞船，眼神中带着几分好奇……
  gts_rainna_la_grande_first_meeting.3124.desc: "The instant the announcement was broadcast, the entire planet plunged into a wholly different kind of terror.\n\nThis time, the panic did not come from the skies, but from official government broadcasts.\n\nMilitary and tactical police units mobilized in haste. Yet their weapons were not aimed at the titanic menace overhead; instead, they swarmed through the streets, breaking into homes to apprehend every adult within sight. Instantly, the streets erupted in a cacophony of wailing and violent arguments. People attempted to hide, to flee, but the army had already barricaded every exit. Families were forcibly torn apart before they could say goodbye; the cries of children, the laments of the elderly, and the furious curses of the young echoed through the desolate thoroughfares.\n\nNone of them knew what awaited them.\n\nThe government's official statement was vaguely worded, describing it only as a \"necessary sacrifice for the preservation of our civilization.\" Yet everyone knew that the colossal entity lingering at the edge of the sky was the sole answer behind it all.\n\nThe drafted citizens were herded into makeshift containment hubs, then driven aboard immense transport vessels. Originally designed for interstellar migration, the spacious passenger cabins were now packed to suffocating capacity. Airway hatches slid shut amidst a chorus of weeping and screams.\n\nOne after another, the transport fleet slowly broke through the atmosphere, charting a course toward the titanic silhouette looming in outer space.\n\nViewed from orbit, the fleet formed a dense swarm, blotting out a corner of the world. But to Rainna, it was merely a cluster of microscopic specks of light, sluggishly drifting toward her.\n\nShe leaned closer to inspect the tiny ships, her eyes gleaming with curious amusement..."
#  这么多人……
  gts_rainna_la_grande_first_meeting.3124.a: "So many people..."
#  只是取悦她的玩具罢了……
  gts_rainna_la_grande_first_meeting.3124.a_tooltip: "Merely playthings to amuse her..."
#  皈依
  gts_rainna_la_grande_first_meeting.3131.title: "Conversion"
#  通讯器中传来了一段庄重而肃穆的声音。\n\n那是[Owner.GetName]最高宗教领袖的声音。他们显然经过了精心的准备，声音平稳而虔诚，字字斟酌，就像是在进行某种古老的祷告。\n\n“伟大的蕾恩娜·德·让大人，至高无上之主，您是来自星海之外的永恒神迹，我们这渺小世界从未觐见的伟大存在、降临于我们这个渺小宇宙的至高存在。\n\n您如经典中预言的那样降临，审判我们每一位有罪之人……\n\n您的降临，是这个宇宙有史以来最伟大的奇迹。您的存在本身，便超越了我们所有的神学与哲学所能触及的边界。我们用以描绘神明的一切语言，在您面前都显得如此苍白而贫乏。\n\n我们曾因无知与恐惧，拒绝了您第一次的垂询。那是我们的罪过，是对神恩的愚昧与不敬。现在我们愿以最虔诚的姿态，承认过错，祈求您的宽恕与接纳。\n\n伟大的女神，请您以您的慈悲与智慧，接受我们迟来的忏悔。我们愿意将您奉为至高，愿意以合适的方式，表达对您的崇敬与臣服。\n\n我们恳请您的宽恕，并愿以我们文明余下的全部虔诚，永远侍奉于您的荣光之下。愿您的光芒照耀我们的世界……”\n\n通讯器中陷入了短暂的沉默。\n\n随后是全体信众齐声诵念的祷词，那声音跨越大气层传来，如同一首献给星空的圣歌。
  gts_rainna_la_grande_first_meeting.3131.desc: "A solemn, reverent voice echoed across the communications channel.\n\nIt was the voice of the supreme religious hierarchy of [Owner.GetName]. They had clearly prepared with utmost care, their cadence steady, pious, and meticulously measured, like an ancient liturgical prayer.\n\n\"Great Lady Rainna de Jean, Supreme Sovereign, You are an eternal miracle born from beyond the sea of stars—a majestic presence our infinitesimal world has never before beheld, the supreme entity descending upon our humble cosmos.\n\nYou have descended as foretold in scripture, to sit in judgment over every guilty soul among us...\n\nYour arrival is the greatest miracle in the history of this universe. Your very existence transcends all boundaries reachable by our theology and philosophy. All the words we once used to depict divine gods appear hollow and impoverished before You.\n\nIn our past ignorance and dread, we turned away Your first inquiry. That was our sin—a display of foolishness and sacrilege against divine grace. Now, in the most devout posture, we confess our transgression and implore Your forgiveness and acceptance.\n\nO Great Goddess, in Your boundless mercy and wisdom, please accept our belated repentance. We are eager to enshrine You as the Supreme One, eager to express our veneration and submission through every fitting rite.\n\nWe beseech Your pardon, and with all the remaining devotion of our civilization, we pledge to serve beneath Your glory forevermore. May Your light shine down upon our world...\"\n\nA brief silence descended over the comms.\n\nThen came the unified chants of the faithful, a chorus rising across the atmosphere like a sacred hymn offered to the star-studded void."
#  求主垂怜。
  gts_rainna_la_grande_first_meeting.3131.a: "Lord, have mercy on us."
#  拒绝皈依
  gts_rainna_la_grande_first_meeting.3132.title: "Refuse Conversion"
#  通讯器中传来了一段同样庄重而肃穆的声音。\n\n那是[Owner.GetName]最高宗教领袖的声音。他们显然经过了艰难的抉择，声音平稳而坚定，字字沉重，就像是在宣读某种不可撤回的判决。\n\n“伟大的蕾恩娜·德·让大人，来自星海之外的强大存在，我们以最诚挚的态度，向您致以应有的敬意。\n\n您的力量超越了我们所能想象的一切边界，您的存在本身便已令我们的神学与哲学无从言说。对于这一点，我们从未有过任何怀疑。”\n\n太空陷入一片寂静。许久，下一句话才被[Owner.GetName]艰难地挤出。\n\n“然而，我们同样无法背弃我们的信仰。\n\n我们的经典、我们的神明、我们世世代代传承下来的一切——这些并非我们可以轻易放下的东西。不是因为我们不畏惧您，而是因为我们同样畏惧背弃信仰所带来的代价。\n\n我们承认，以我们文明的力量，无法与您抗衡。但我们也无法以虔诚之名，去崇拜一个我们内心深处并不认可的存在。这对您不公平，对我们自己同样不公平。\n\n因此，我们选择以最诚实的方式回应您——我们尊重您的力量，但我们无法皈依于您。无论您的裁决是什么，我们都愿意坦然承受。”\n\n通讯器中陷入了沉默。\n\n没有齐声的祷词，没有圣歌。只有静静的、沉甸甸的寂静，像是整个文明都在屏息等待着那个不可避免的答案。
  gts_rainna_la_grande_first_meeting.3132.desc: "A voice of equal gravity and solemnity came through the transmitter.\n\nIt was the voice of the supreme religious leader of [Owner.GetName]. They had evidently endured an agonizing decision; their tone was measured, resolute, and heavy, as though reading aloud an irrevocable decree.\n\n\"Great Lady Rainna de Jean, mighty presence from beyond the star-sea, we offer You the deepest respect You are owed in the most earnest sincerity.\n\nYour power surpasses every horizon our minds could ever conceive; Your very presence leaves our theology and philosophy utterly speechless. On this truth, we have never harbored the slightest doubt.\"\n\nSpace lapsed into absolute stillness. After a protracted pause, the next words were wrenched with difficulty from [Owner.GetName].\n\n\"And yet, we cannot forsake our faith.\n\nOur scriptures, our gods, all that has been passed down through generations—these are not things we can lightly discard. It is not because we do not fear You, but because we fear just as deeply the cost of betraying our convictions.\n\nWe confess that with the meager strength of our civilization, we cannot contend with You. Yet neither can we worship, under the pretense of piety, a presence that our hearts cannot genuinely accept. That would be unjust to You, and equally unjust to ourselves.\n\nTherefore, we choose to answer You with utmost honesty: we respect Your power, yet we cannot convert to You. Whatever Your judgment may be, we stand prepared to accept it with dignity.\"\n\nSilence fell over the communications channel once more.\n\nThere were no unified chants, no sacred hymns. Only a quiet, stifling stillness, as if the entire civilization were holding its breath, awaiting the inevitable answer."
#  息怒？
  gts_rainna_la_grande_first_meeting.21111.title: "Calm Your Anger?"
#  “嘛~息怒？”\n\n蕾恩娜的声音中带着难以掩饰的笑意，仿佛听到了什么笑话。她优雅地抬起那只刚刚在星球表面留下巨坑的足底，在太空中轻轻晃动。\n\n沾满泥土、岩石和建筑残骸的足底在星光下显得格外触目惊心。那些曾经是繁华城市的碎片，此刻不过是她足底的污垢。她皱了皱眉，似乎对这些“脏东西”有些不满。\n\n“呀~看来这里有一些不小的误会呢……”\n\n她用另一只手的指尖轻轻拂过足底，抹下一层污垢。大量的残骸碎片如同流星雨般抛洒向星球表面。每一块碎片的坠落都掀起新的冲击波，在地表砸出新的陨石坑。\n\n“我只是不过是踩着玩的~”她歪着头，声音中带着天真，“怎么能说是愤怒呢？”\n\n“如果我真的生气了……”她顿了顿，嘴角勾起一抹危险的笑容，“可不是这种程度哦~”\n\n她俯下身，那张巨大的面庞几乎贴近星球表面，清澈的眼眸中倒映着那片满目疮痍的大陆。\n\n“我只是觉得……”她轻声说道，声音却在整个星球回荡，“你们这些小东西，有时候真的很有趣呢。就像是……”\n\n她伸出食指，在空中轻轻画着圈。\n\n“就像是那种会在被踩到的时候，还要道歉说‘对不起弄脏了您的鞋’的小虫子一样哦~”\n\n她咯咯地笑了起来，那银铃般的笑声让人不寒而栗。
  gts_rainna_la_grande_first_meeting.21111.desc: "\"Well now~ 'Calm my anger'?\"\n\nRainna's voice brimmed with barely concealed mirth, as if she had just heard the funniest joke. She gracefully lifted the foot that had just gouged a colossal crater into the planet's surface, dangling it lightly in the void.\n\nHer sole, caked in soil, pulverized stone, and architectural wreckage, looked startlingly apocalyptic beneath the starlight. The shattered remnants of once-bustling metropolises were now nothing more than grime clinging to the bottom of her foot. She knitted her brows slightly, seemingly dissatisfied with these \"dirty specks.\"\n\n\"My, it seems there's a rather big misunderstanding here...\"\n\nWith the fingertip of her other hand, she lightly brushed across her sole, scraping away a layer of grime. Vast amounts of debris rained down onto the planet's surface like a meteor storm. Each falling fragment sent out fresh shockwaves, blasting new impact craters into the ground.\n\n\"I was just stomping around for fun~\" She tilted her head, her voice dripping with innocence. \"How could you call that anger?\"\n\n\"If I were truly angry...\" She paused, her lips curling into a dangerous smile, \"...it wouldn't be anywhere near this gentle~\"\n\nShe leaned down, her titanic face drawing almost flush against the planetary surface, her clear eyes reflecting the devastated continents below.\n\n\"I just think...\" she whispered, her voice nonetheless thundering across the entire globe, \"...you little creatures are really quite amusing at times. Just like...\"\n\nShe extended an index finger, tracing lazy circles in the void.\n\n\"Just like little bugs that get stepped on, only to apologize and say, 'Sorry for dirtying your shoe!'~\"\n\nShe burst into a giggle, that bell-like laughter sending chills down everyone's spine."
#  可怕……
  gts_rainna_la_grande_first_meeting.21111.a: "Terrifying..."
#  坏？
  gts_rainna_la_grande_first_meeting.21112.title: "Evil?"
#  “坏？”\n\n天空中传来一声充满戏谑的轻笑。蕾恩娜优雅地扭动了一下纤细的脚踝，足底划过一道弧线，扫过一片尚未被波及的城区。\n\n无数建筑被卷入那沾满碎石与废墟的足底，连同其中的居民一起，被碾压、混合、粉碎，最终成为附着在她足底的又一层"灰尘"。惨叫声在瞬间戛然而止,只留下死一般的寂静。\n\n“呀~看来你们说得倒是没什么问题呢……”\n\n她将巨足缓缓抬起,足底粘附的建筑碎块、扭曲的钢筋、破碎的玻璃,以及无数生命的残骸,如同雨点般坠落。这些“碎屑”砸入下方幸存的城市之中,每一块落下都掀起新的冲击波,摧毁更多的建筑,夺走更多的生命。\n\n“嘛，那我这么坏……”她的声音突然变得俏皮而危险，“一定会有正义制裁我吧~”\n\n“或者说……你们要向邪恶势力低头？嗯？”\n\n说着，她将巨大的足掌轻柔地踩入一片广袤的农田。金黄的麦浪在她足底的阴影下瞬间消失，取而代之的是一个巨坑。她顽皮地来回摩擦了几下，柔软的泥土在她足底翻涌，广袤的田地被彻底毁灭。\n\n“还是说……”她俯下身,那张巨大的面庞几乎贴近星球表面，清澈的眼眸中闪烁着危险的光芒。“难不成……你们这些自称正义的小家伙,其实准备向邪恶势力低头了？”\n\n她的声音中带着明显的挑衅和嘲弄。
  gts_rainna_la_grande_first_meeting.21112.desc: "\"Evil?\"\n\nA playful chuckle drifted down from the heavens. Rainna elegantly twisted her slender ankle, her sole tracing an arc across the atmosphere to sweep across an untouched urban district.\n\nCountless buildings were swept into her dirt- and rubble-caked sole, crushed, ground, and pulverized together with their inhabitants, reduced to another layer of \"dust\" adhering to her skin. The screams ceased in a fraction of a second, leaving behind only dead silence.\n\n\"My, it looks like what you said wasn't entirely wrong after all...\"\n\nShe slowly raised her massive foot, letting architectural fragments, twisted steel girders, shattered glass, and countless biological remains shower down like rain. These \"scraps\" crashed into surviving cities below, each impact triggering new shockwaves, leveling more structures, and claiming more lives.\n\n\"Well then, if I'm so evil...\" Her voice suddenly grew teasing and dangerous. \"...surely justice will step in to punish me, right~?\"\n\n\"Or could it be... that you're going to bow your heads to the forces of evil? Hmm?\"\n\nSaying this, she softly pressed her colossal sole into a sprawling expanse of farmland. Golden waves of grain vanished instantly under the shadow of her foot, replaced by a massive crater. She playfully rubbed her foot back and forth a few times, soft soil churning beneath her sole as fertile plains were utterly annihilated.\n\n\"Or rather...\" She leaned in close, her massive face nearly brushing the planet's surface, dangerous light dancing in her clear eyes. \"Could it be that you little creatures, who claim to be so righteous, are actually ready to submit to wicked evil?\"\n\nHer voice dripped with open mockery and provocation."
