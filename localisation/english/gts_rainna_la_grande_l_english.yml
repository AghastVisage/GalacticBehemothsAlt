ngs toppling and shattering like toy blocks. When she lifted her foot in satisfaction, the once-thriving metropolis had been reduced to another bottomless crater.\n\n\"Mmm, that felt lovely too...\" She raised her left foot, happily wriggling her toes. \"Both feet got a turn—now that's what I call fair.\""
#  不！请不要……
  gts_rainna_la_grande_first_meeting.21113.a: "No! Please don't..."
#  如此卑微的请求……
  gts_rainna_la_grande_first_meeting.21113.a_tooltip: "Such a pathetic plea..."
#  “欸，真是没想到……”\n\n蕾恩娜优雅地抬起那只刚刚在星球表面肆虐过的足底。像是在欣赏一件艺术品，她将右足侧过来，仔细端详着足底。\n\n细碎的建筑残骸、扭曲的钢筋混凝土、破碎的山体岩石，连同大量的泥土和尘埃，都紧紧黏附在她原本雪白光滑的足底上。那些曾经是文明象征的摩天大楼，此刻不过是她足底污渍的一部分。洁白的肌肤被这些“杂质”覆盖，变得又黑又脏。\n\n她微微皱了皱眉，似乎对这些脏东西有些不满，但很快又露出了满意的笑容。\n\n与此同时，她的另一只足优雅地悬浮在太空中。那只尚未触碰星球的足底依然洁白无瑕，修长而细嫩，只有几滴晶莹的汗珠点缀在光滑的皮肤上，在星光下闪烁着微光。它投下的巨大阴影笼罩着另一片繁华的城市群，让那里的人们在黑暗中瑟瑟发抖，等待着可能降临的审判。\n\n“一次居然踩了这么多呢~”\n\n蕾恩娜满足地笑了笑，那笑容天真而灿烂，仿佛只是完成了一次愉快的游戏。她轻轻晃动着沾满废墟的足趾，让更多的碎片剥落，如同黑色的雪花般飘向地表。\n\n“嘛，既然都已经踩了这么多了……”\n\n她看了看那只干净的足底，又看了看被阴影笼罩的城市群，似乎在考虑着什么。空气仿佛凝固了，所有幸存者都屏住呼吸，等待着她的下一句话。\n\n“那就……这样吧~”\n\n她轻快地说道，同时优雅地将那只干净的足底移开，让阳光重新洒在那片幸运的城市上。\n\n“毕竟……”她俯视着那颗满目疮痍的星球，语气中带着慵懒的满足，“体验一下就够了嘛~我可不想太脏……”\n\n她在太空中舒展着身体，像是刚刚完成了一场愉快的散步。\n\n“而且嘛……”她歪着头，声音中带着俏皮的威胁，“毕竟我下次还要玩呢……”
  gts_rainna_la_grande_first_meeting.21114.desc: "\"My, I really didn't expect that...\"\n\nRainna elegantly lifted the sole that had just wrought havoc across the planetary surface. As though admiring a piece of fine art, she turned her right foot sideways, inspecting her sole in detail.\n\nPowdered architectural wreckage, twisted reinforced concrete, shattered mountain boulders, along with immense quantities of soil and soot, clung tenaciously to her once snow-white, silky sole. Skyscrapers that were once monuments of civilization were now nothing more than smudges on the bottom of her foot. Her fair skin was blanketed by these \"impurities,\" turning filthy and blackened.\n\nShe furrowed her brows slightly, appearing somewhat displeased by the grime, but soon broke into a contented smile.\n\nMeanwhile, her other foot floated gracefully in the void. That untouched sole remained pristine and spotless, slender and tender, with only a few crystalline droplets of sweat dotting her smooth skin, shimmering softly under the starlight. The colossal shadow cast by that clean foot loomed over another bustling metropolis, leaving the inhabitants shivering in darkness below, awaiting whatever judgment might fall.\n\n\"To think I crushed so much in just one go~\"\n\nRainna smiled contentedly—an innocent, radiant smile, as though she had merely finished an enjoyable little game. She gently wiggled her debris-covered toes, letting more fragments flake away, falling toward the surface like black snow.\n\n\"Well, since I've already stepped on so much...\"\n\nShe glanced at her clean foot, then back down at the shadowed metropolis, seemingly weighing her options. The air grew still; all surviving onlookers held their breath, waiting for her next words.\n\n\"I guess... that's enough for now~\"\n\nshe announced breezily, gracefully drawing back her clean foot and letting warm sunlight bathe the fortunate city once more.\n\n\"After all...\" She gazed down upon the scarred planet, her voice laced with languid satisfaction. \"A little taste is plenty~ I wouldn't want to get too dirty...\"\n\nShe stretched her body out in space, like someone who had just concluded a refreshing stroll.\n\n\"And besides...\" She tilted her head, a playful threat lingering in her tone, \"...I want to have something left to play with next time...\""
