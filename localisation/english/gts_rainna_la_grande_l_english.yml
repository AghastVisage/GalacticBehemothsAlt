  GTS_AWAKE_RAINNA_PROJECT_LOW_COST_DESC: "Ever since research teams discovered this slumbering, mysterious entity on the far side of the black hole, debate within academia over whether she should be awakened has never ceased.\\n\\nOpponents argued that any unknown higher entity must be treated as a potential existential threat, and that rashly waking her would only court unpredictable disaster. Proponents maintained that this was a once-in-a-civilization opportunity for first contact, and to abandon it would be the scientific community's greatest regret.\\n\\nThe dispute dragged on until a financial assessment from economic planning settled the matter—the potential technological and intellectual gains from establishing relations with such a being vastly eclipsed what any risk assessment model could calculate.\\n\\nThus, the awakening campaign was officially approved.\\n\\nAs for the dissenters' concerns... the final page of the dossier bore only a single line: \"The potential gains far outweigh the risks.\"\\n\\n§RWarning! Awakening the entity is extremely dangerous. Please prepare adequately before awakening her.§! (This warning may be disregarded if Rainna's story experience mode is active)"
#  永恒的禁锢之魂
  gts_site_rainna_la_grande_1: "Soul of Eternal Imprisonment"
#  这颗行星表面弥漫着一种不易觉察的能量波动,仿佛有某种凄厉的尖叫。当我们的勘探队靠近时,各种测量设备都开始产生干扰,仿佛在试图保护什么不为人知的秘密。
  gts_site_rainna_la_grande_1_desc: "A faint energy fluctuation permeates this planet's surface, like a muted, shrill shriek. As our survey team drew near, measurement instruments suffered interference, as though actively shielding some closely guarded secret."
#  闪耀的忠挚之魂
  gts_site_rainna_la_grande_2: "Soul of Shining Devotion"
#  这颗昏暗的行星散发出一种近乎灼热的辐射,似乎蕴含着庞大的能量潜能。当我们试图靠近时,这股热量波动却会呈现出一种难以言喻的韵律,仿佛有个炽热的残留意识在主动散发着自己的热忱。
  gts_site_rainna_la_grande_2_desc: "This dim planet emits a scorching radiation, hinting at immense energy potential. As we attempt to approach, the thermal fluctuations pulse with an indescribable rhythm, as if an ardent residual consciousness were actively radiating its fervor."
#  荒芜、死寂
  gts_rainna_la_grande_arch.01.name: "Desolation, Silence"
#  我们的飞船降落在了这颗星球之上。\n\n这是一颗庞大到难以想象的星球——或者说，是我们的飞船太过渺小。舷窗外的地平线延伸到了视野的极限，却依然看不到尽头。大气层的折射让远处的景色显得朦胧而失真，科研人员们花了很长时间才意识到，那些他们以为是山脉的东西，实际上是建筑物。\n\n是建筑物的残骸。\n\n当我们终于降落，走出舱门，才真正理解了这颗星球的规模。脚下的地面光滑而坚硬，延伸向无法看见边际的远方。我们在一片空旷的区域发现了一大块合金——它像一栋楼房一样高耸，边缘整齐，显然是经过加工的人工制品，而不是天然矿物。\n\n科研人员们站在这块合金的阴影下，沉默了很久。\n\n这就意味着这颗星球上曾经存在过文明。一种无比巨大的文明——巨大到我们几乎无法对它进行任何有效的测量和研究。我们能够观测到的，只是这个文明遗留下来的某个微小碎片的某个角落。\n\n至于这个文明的全貌，以及它究竟经历了什么——以我们目前的能力，恐怕难以触及。
  gts_rainna_la_grande_arch.01_micro.desc: "Our starship touched down upon the planet.\\n\\nIt is a world unfathomably vast—or rather, our vessel is simply far too minuscule. Outside the viewport, the horizon stretched to the edge of sight without an end in sight. Atmospheric refraction rendered distant vistas hazy and distorted; it took our researchers a long time to realize that what they had mistaken for mountain ranges were, in fact, buildings.\\n\\nThe ruins of buildings.\\n\\nOnly when we finally landed and stepped beyond the airlock did we truly comprehend the staggering scale of this planet. The ground beneath our boots was smooth and unyielding, stretching outward toward an unseen horizon. In an open expanse, we uncovered an enormous slab of alloy—towering like an apartment block with cleanly cut edges, unequivocally a manufactured artifact rather than a natural deposit.\\n\\nOur scientists stood under the alloy slab's shadow in stunned silence for a long time.\\n\\nThis confirms that a civilization once existed here. An unimaginably colossal civilization—so gargantuan that we can barely conduct meaningful measurements or analyses upon it. What we can observe is nothing more than a corner of a microscopic splinter left behind by this titan.\\n\\nAs for the full scope of this civilization, and what calamity befell it—such truths lie far beyond our current reach."
#  我们的飞船降落在了这颗庞大的星球之上。\n\n甫一着陆，科研人员们就意识到这颗星球的不寻常之处。目光所及之处，巨型建筑群的残骸连绵不绝，被一道道深不见底的悬崖隔断，形成了一片片孤立的废墟群岛。每一处悬崖的截面都清晰地展示着这颗星球地质层的变化，那些深色的地层之间，偶尔会夹杂着一条细细的银白色线条——那是金属，是文明存在过的痕迹。\n\n建筑物本身已经严重损毁，但从残存的轮廓来看，它们曾经高耸而宏伟。科研团队沿着其中一处悬崖的边缘小心前行，试图寻找进入建筑群内部的通道。\n\n初步的年代测定结果让所有人都沉默了。\n\n这个文明的历史，远远早于我们的星球上迄今为止发现的最早的文明记录。它存在于一个我们几乎无法想象的遥远年代，在那个时代，我们的祖先可能还在仰望着同一片星空，却对这里发生的一切一无所知。\n\n而现在，它只剩下这些被悬崖分割的孤立残骸，在荒芜中静静腐朽。
  gts_rainna_la_grande_arch.01_tiny.desc: "Our ship descended upon this colossal planet.\\n\\nUpon landing, our researchers immediately realized how anomalous this world was. As far as the eye could see, titanic architectural ruins spanned endlessly, severed by bottomless chasms into isolated archipelagos of debris. The vertical faces of these cliffs laid bare the planet's geological strata; sandwiched between dark earthen layers were occasional slivers of silver-white—metal, the undeniable imprint of past civilization.\\n\\nThe structures themselves had suffered catastrophic ruin, yet their weathered silhouettes hinted at their former grandeur. The science team picked their way cautiously along a cliff edge, searching for an ingress into the complex.\\n\\nPreliminary dating results struck everyone dumb with awe.\\n\\nThe antiquity of this civilization far predates the oldest civilized records ever uncovered on our homeworld. It thrived in an unimaginably distant epoch—an era when our ancestors likely gazed up at the very same starry skies, blissfully unaware of the titans walking here.\\n\\nAnd now, nothing remains but these disjointed fragments cleaved by precipices, silently decaying in desolation."
#  我们的飞船降落在了这颗星球之上。\n\n高大的建筑废墟如同石林般耸立在地平线上，在晨光中投下长长的阴影。科研人员们穿行其间，不得不时刻注意脚下——地面上遍布着各种碎片，有金属、有玻璃状的物质，还有一些我们尚不能辨认的材料。\n\n经过仔细的年代测定，这个文明的历史甚至早于我们星球上已知的最早文明。它曾经发达而繁荣，从残存的建筑规模和工艺来看，它的技术水平绝不逊于当今任何一个先进文明。\n\n然而它毁灭了。\n\n毁灭的原因清晰地写在这片土地上——随处可见的巨大坑洞将地表切割得支离破碎，每一个坑洞的边缘都整齐而规则，绝非自然形成。有些坑洞大到足以吞没整个城区，有些则深到我们的探测设备无法触及底部。\n\n站在其中一个坑洞的边缘，科研人员们沉默地望着深处涌动的黑暗，没有人开口说话。
  gts_rainna_la_grande_arch.01_small.desc: "Our starship touched down upon the surface.\\n\\nRuins of towering monoliths loomed like a petrified forest on the horizon, casting elongated shadows in the morning light. Navigating between them, researchers had to watch every step—the ground was strewn with rubble: warped metal, vitrified matter, and materials yet unclassified.\\n\\nMeticulous chronometric analysis revealed that this civilization's history predated the oldest known civilization on our homeworld. It had once been flourishing and advanced; judging by the scale of surviving structures and engineering craftsmanship, its technological prowess rivaled any contemporary spacefaring power.\\n\\nYet it fell.\\n\\nThe cause of its ruin was etched indelibly into the terrain—gargantuan craters pitted the planetary crust into fragmented pieces. The edges of each crater were crisp and geometric, completely defying natural formation. Some craters spanned wide enough to swallow whole metropolitan sectors, while others plunged deeper than our seismic sounding gear could measure.\\n\\nStanding on the lip of one such crater, the researchers gazed down into the yawning abyss in utter silence."
#  我们的飞船降落在了这颗星球之上。\n\n城市的痕迹随处可见。道路的格局依然清晰，建筑物的地基整齐排列，广场、街道、港口——一个完整的文明曾经在这里生活、劳作、仰望星空。根据初步的测定，这个文明的历史远远早于我们星球上已知的最早文明，却在某个我们尚不知晓的时间节点戛然而止。\n\n而停止的原因，就刻在这片土地上。\n\n巨大的坑洞遍布整个星球表面，深浅不一，形态各异，却有一个共同的特点——规则。过于规则，规则到不可能是任何自然灾害所能造成的。它们的边缘整齐，底部平滑，大小从覆盖数个街区到吞没整片城区不等。\n\n有些坑洞的底部已经被后来涌入的泥沙填满，但从截面上依然能看出，它们形成的时间和城市毁灭的时间高度吻合。\n\n科研人员们站在其中一个坑洞的边缘，用各种仪器记录着数据，却没有人敢大声说出那个所有人心中都浮现的推论。
  gts_rainna_la_grande_arch.01_normal.desc: "Our starship touched down upon the surface.\\n\\nVestiges of urban sprawl were ubiquitous. Grid patterns of thoroughfares remained discernible, foundations of buildings stood in orderly rows, with plazas, avenues, and spaceports—a complete civilization had once lived, toiled, and stargazed here. Preliminary chronometry indicates this culture flourished far earlier than the oldest civilization known on our homeworld, only to be cut short at an undetermined historical juncture.\\n\\nThe cause of that cessation is carved into the very crust.\\n\\nColossal craters riddle the globe, differing in depth and form, yet sharing a common characteristic—regularity. Far too regular to have been gouged by any natural catastrophe. Their rims are sharp and neat, their floors unnaturally flat, spanning from several city blocks to entire metropolises.\\n\\nThough sediments have accumulated in the bottoms of some craters, cross-sectional stratigraphy confirms that their formation coincides precisely with the city's sudden demise.\\n\\nGathered around the rim of a crater, researchers logged telemetry with silent dread, none daring to voice aloud the eerie deduction dawning in their minds."
#  我们的飞船降落在了这颗星球之上，科研人员们立刻意识到了某种奇异的不协调感。\n\n这里有城市——或者说，曾经有过城市。街道、建筑、广场，所有的城市元素都齐全，但一切都小得出奇。大多数建筑不超过科研人员的肩膀，最高的几栋也勉强到达头顶。科研人员们不得不格外小心地迈步，生怕一个不注意就踩坏了某处珍贵的遗迹。\n\n这里的文明曾经拥有精密的技术，从残存的设备碎片和建筑工艺来看，他们显然是一个高度发展的社会。测定结果显示，这个文明的历史甚至比我们星球上已知的最早文明还要久远。\n\n然而毁灭来得毫无征兆。\n\n散落在城市各处的巨大坑洞诉说着这场灾难的规模。坑洞的直径从数百米到数公里不等，但它们有一个共同的特点——形状。不是圆形，不是不规则的爆炸痕迹，而是某种我们熟悉的轮廓。\n\n某个科研人员站在其中一个坑洞的边缘，低头看了很久，然后抬起脚，将自己的脚底与坑洞的形状做了一个比对。\n\n队里顿时安静下来。
  gts_rainna_la_grande_arch.01_tall.desc: "Our starship touched down upon the planet, and researchers immediately sensed a bizarre dissonance.\\n\\nThere were cities here—or rather, there had been. Streets, buildings, and plazas: every urban staple was present, yet everything was extraordinarily miniature. Most buildings barely reached the shoulders of our crew, and even the tallest towers only reached our heads. Scientists had to watch every step with extreme care, terrified that a careless footfall might obliterate an invaluable archaeological site.\\n\\nThe civilization that once inhabited this world commanded sophisticated engineering; judging by fragments of surviving apparatus and masonry, they were a highly developed society. Chronometric dating indicated their roots extended further back than the earliest recorded civilizations of our own species.\\n\\nYet annihilation struck without warning.\\n\\nGigantic depressions strewn across the miniature cities attested to the magnitude of the disaster. Ranging from hundreds of meters to several kilometers across, they shared one undeniable feature: their contour. They were not circular craters, nor chaotic explosive blasts, but a profile all too familiar.\\n\\nA researcher stood on the rim of one such depression, staring down for a long while before lifting their foot, comparing the sole of their boot to the contour of the chasm.\\n\\nA chilling silence fell over the team."
#  我们的飞船降落在了这颗星球之上，第一步踏出舱门，就差点踩到了什么东西。\n\n低头一看，是一座建筑。\n\n这颗星球上的城市密密麻麻地铺展在地表，最高的建筑物甚至不及我们科研人员的腰间。团队不得不制定严格的行动规范，所有人必须沿着标注好的安全路线行走，以避免破坏这些珍贵的考古资源——尽管这意味着大量的一手资料被隐藏在我们无法安全进入的建筑内部。\n\n这个文明曾经极为发达。从外部可以观察到的建筑工艺和城市规划来看，他们拥有完善的社会体系和相当高度的技术水平，历史测定更是将这个文明的起源推向了一个令人震惊的远古年代。\n\n然而所有这些，都在某一天轰然终结。\n\n地面上随处可见的巨大足印是最直接的证据。每一枚足印都深陷地表，将下方的一切夷为平地——那些精密的建筑、那些细小的街道、以及那些曾经在其中生活的无数生命。足印周围还有一些随意勾画的线条和图案，笔触粗犷，深深刻入地层，规模之大让人难以想象这只是某个存在漫不经心的涂鸦。\n\n科研人员们在这些图案之间穿行，试图解读其中的信息，心中却都压着同一个无法开口的问题：\n\n留下这些足印的存在，究竟有多大？
  gts_rainna_la_grande_arch.01_giant.desc: "Our starship touched down upon the world. Taking their very first step beyond the airlock, our crew nearly stepped on something.\\n\\nGlancing down, they saw a skyscraper.\\n\\nMiniature cities carpeted the surface in dense tapestries, with even the tallest towers failing to reach our researchers' waists. The expedition had to enforce strict movement protocols; everyone was required to follow designated pathways to avoid trampling precious archaeological heritage—even if it meant countless primary artifacts remained locked within structures we could not safely enter.\\n\\nThis civilization was once extraordinarily sophisticated. External architectural analysis and urban layouts revealed a cohesive social order and remarkable technological prowess, with chronometric dating placing its genesis in a shockingly remote antiquity.\\n\\nYet all of it met an abrupt, cataclysmic end.\\n\\nColossal footprints stamped across the continents served as the most direct evidence. Each print was pressed deep into the bedrock, pulverizing everything beneath—delicate towers, intricate streets, and the innumerable souls who once walked them. Around the footprints were carved sweeping lines and geometric patterns, gouged deeply into the crust with rough strokes on a scale so vast it defied belief that they were merely casual doodles.\\n\\nNavigating between these monumental glyphs in an effort to decipher their meaning, the researchers were haunted by an unutterable question:\\n\\nJust how gigantic was the being who left these footprints?"
#  我们的研究员登陆了这颗星球。\n\n着陆时，飞船的导航系统反复提示地表有密集的障碍物，但当我们真正降落、走出舱门，才明白那些"障碍物"是什么——是城市。一片片细碎的城市废墟，密密麻麻地铺满了整个地表，每一个科研人员随意迈出的一步，都可能覆盖其中的数个街区。\n\n这个文明曾经存在过，而且存在了很长时间。从那些细如发丝的建筑遗迹中，依然能辨认出精密的规划和高超的工艺。历史测定数据显示，这是一个极为古老的文明，古老到让我们的考古学家们沉默了很久。\n\n然后，它在某一天消失了。\n\n地面上随处可见的足印为这场毁灭提供了最直观的注脚。那些足印对我们而言足有一个街区那么大，深深地嵌入地层，每一枚都将下方的一切碾压得彻底消失。足印之间，还散布着一些随意涂画的图案，线条深邃，规模庞大，像是某个存在百无聊赖时留下的随手之作。\n\n站在其中一枚足印的边缘，俯视着那深陷的轮廓，科研人员们第一次真正理解了"渺小"这个词的含义。\n\n也许，当那个存在再次降临，我们也只能迎接同样的命运。
  gts_rainna_la_grande_arch.01_titan.desc: "Our researchers made landfall upon the planet.\\n\\nDuring descent, navigational computers repeatedly flagged dense fields of obstacles on the surface. But when we landed and stepped outside, we finally realized what those \"obstacles\" were—cities. Endless carpets of miniature urban ruins coated the ground; a single casual stride from any of our researchers could easily crush several city blocks.\\n\\nThis civilization had not only existed, but had endured for eons. Even within ruins as delicate as stray hairs, sophisticated master planning and magnificent engineering remained discernible. Historical dating confirmed this culture to be unimaginably ancient, leaving our archaeologists speechless for a long time.\\n\\nThen, one day, it ceased to be.\\n\\nFootprints stamped ubiquitously across the crust provided a grim footnote to its annihilation. Even to our colossal stature, each footprint spanned the breadth of an entire district, gouged deep into the bedrock, utterly flattening everything underneath into oblivion. Between the footprints were sprawling, playful doodles gouged into the earth—deep, massive trenches that looked like casual graffiti scrawled out of sheer boredom.\\n\\nStanding on the precipice of one such footprint and peering into its recessed imprint, our scientists understood for the first time the true meaning of the word \"insignificant.\"\\n\\nPerhaps, should that entity ever return, we too would face the exact same fate."
#  我们的研究员缩小，然后登陆了这颗星球。\n\n在大气层的时候飞船就能清晰地看到那些巨大的坑洞——或者说，足印。每一枚都大得惊人，夸张到足以容纳我们整列编队行进的规模。科研人员们在其中一枚足印的边缘站成一排，拍了一张合影，没有人说话。\n\n之后我们才注意到脚下的东西。\n\n那些微型的建筑废墟零零散散地分布在足印周围，其中许多已经在我们着陆和行走时被无意间踩碎。科研团队紧急叫停了所有行动，对现有的考古现场进行评估，但损失已经无法挽回——我们脚下的每一寸地面，可能都曾经是这个微型文明的一部分。\n\n那些微型城市本身并不是我们研究的重点。真正值得关注的，是那些用整片城市作为泥板刻下的文字与图案。那个留下足印的存在，似乎有意在这颗星球上留下某种信息，用这个星球上的城市作为笔触，随意地涂写着什么。\n\n我们正在尝试解读这些信息。\n\n只是每次俯身细看，总会有一种奇异的不适感——因为那些被用来书写的城市废墟里，依然能辨认出精密的街道和建筑结构，以及那些我们宁愿不去细想的东西。
  gts_rainna_la_grande_arch.01_ultra.desc: "Our researchers shrunken in size before making landfall upon the planet.\\n\\nFrom upper atmospheric orbit, the gargantuan craters—or rather, footprints—were unmistakably visible. Every single print was overwhelmingly colossal, vast enough to accommodate our entire landing fleet maneuvering inside. Our researchers lined up along the rim of a single footprint to snap a group photograph; nobody said a word.\\n\\nOnly afterward did we notice what was beneath our feet.\\n\\nMicroscopic architectural ruins lay scattered around the perimeter of the footprints, many of which had already been inadvertently pulverized by our landing and footfalls. The expedition called an immediate halt to all movement to evaluate the archaeological site, but the damage was irreversible—every square inch beneath our boots had likely once been part of this micro-civilization.\\n\\nYet the microscopic cities themselves were not our primary focus. What truly arrested our attention were the glyphs and inscriptions carved using entire metropolises as a clay tablet. The entity who left these footprints appeared to have deliberately inscribed a message upon this world, casually scribbling using cities as brushstrokes.\\n\\nWe are currently attempting to decipher these messages.\\n\\nYet every time we bend down to scrutinize the lines, an uncanny revulsion chills us—for within those ruins repurposed as ink strokes, intricate streets, architectural frameworks, and things we would rather not contemplate remain all too visible."
#  看来，我们是如此渺小的存在。
  gts_rainna_la_grande_arch.01_micro.a: "It seems we are such minuscule beings."
#  看来，他们是如此巨大的存在。
  gts_rainna_la_grande_arch.01_micro.b: "It seems they are such colossal beings."
#  我们去建筑里面看看。
  gts_rainna_la_grande_arch.01_tiny.a: "Let us inspect the interior of the structures."
#  我们去悬崖周围看看。
  gts_rainna_la_grande_arch.01_tiny.b: "Let us investigate around the cliffs."
#  我们来探究一下文明残存的历史。
  gts_rainna_la_grande_arch.01_small.a: "Let us investigate the surviving history of this civilization."
#  我们要探究一下文明覆灭的原因。
  gts_rainna_la_grande_arch.01_small.b: "We must investigate the cause of this civilization's downfall."
#  这个文明是什么样的？
  gts_rainna_la_grande_arch.01_normal.a: "What was this civilization like?"
#  这个文明遭遇了什么？
  gts_rainna_la_grande_arch.01_normal.b: "What happened to this civilization?"
#  这里曾经的居民真的好渺小！
  gts_rainna_la_grande_arch.01_tall.a: "The former inhabitants here were truly so tiny!"
#  侵略者将会是什么庞然大物？
  gts_rainna_la_grande_arch.01_tall.b: "What kind of behemoth could the invader have been?"
#  重点研究一下该文明残存的痕迹。
  gts_rainna_la_grande_arch.01_giant.a: "Focus research on the surviving traces of this civilization."
#  重点研究一下入侵者留下的痕迹。
  gts_rainna_la_grande_arch.01_giant.b: "Focus research on the traces left by the invader."
#  这可怖的恶魔。
  gts_rainna_la_grande_arch.01_titan.a: "What a terrifying demon."
#  这巨大的家伙。
  gts_rainna_la_grande_arch.01_titan.b: "What an enormous creature."
#  这个小文明值得关注。
  gts_rainna_la_grande_arch.01_ultra.a: "This tiny civilization warrants attention."
#  这个入侵者值得了解。
  gts_rainna_la_grande_arch.01_ultra.b: "This invader is worth learning about."
#  恐惧、战栗
  gts_rainna_la_grande_arch.02.name: "Fear, Trembling"
#  根据对这块合金的初步分析，科研团队陷入了长达数日的沉默。\n\n这块合金由数种极为罕见的金属混合而成，纯度之高令人难以置信。按照初步的估算，仅这一块合金中所含有的贵金属储量，就足以超过我们整个星球迄今为止开采出的所有矿产总和。然而更令人沮丧的是，合金中夹杂着若干种我们的元素周期表上根本不存在的物质，正是这些未知元素赋予了它超乎寻常的硬度，让任何已知的开采手段都束手无策。\n\n但这还不是最让科研团队感到震惊的事情。\n\n精密仪器显示，这块合金正在持续地向外散发某种信号。那是一种极为有规律的脉冲，间隔精确到了小数点后数十位，绝非任何自然现象所能产生。它已经持续了不知多少年，在这片荒芜之中，孤独地向外广播着什么。\n\n我们开始尝试解码这个信号。
  gts_rainna_la_grande_arch.02_1_micro.desc: "Following preliminary metallurgical assays of this alloy, the science team lapsed into days of silence.\\n\\nThe slab was composed of an amalgam of extraordinarily rare metals refined to an unbelievable purity. By initial estimates, the precious metal reserves locked within this single block exceeded the cumulative mineral yield ever extracted across our entire homeworld. Yet far more disheartening was the presence of several elements entirely absent from our periodic table; these unknown elements endowed it with abnormal tensile strength, rendering any known mining method utterly futile.\\n\\nYet even this was not what shocked the researchers most.\\n\\nPrecision sensors revealed that the alloy was emitting a continuous, rhythmic signal. A pulse so mathematically consistent that its period was uniform to dozens of decimal places, ruling out any possibility of natural occurrence. It had persisted for untold millennia across this desolate expanse, broadcasting a solitary message into the dark.\\n\\nWe have begun efforts to decode the transmission."
#  攀上高耸的台阶，穿过残破的石壁，在倾覆的屋顶所形成的阴影之下，科研团队发现了它。\n\n一个几乎完整的立方体，静静地悬浮在空中，距地面大约两米的高度，没有任何可见的支撑结构。它的表面光滑如镜，几乎找不到任何瑕疵，在周围一片破败之中显得格格不入，就像是时间刻意绕开了它。\n\n它在发出信号。\n\n经过漫长而艰难的解码与破译，我们从那些断断续续的信息碎片中拼凑出了一些内容。由于语言体系的巨大差异，相当一部分内容至今无法翻译，但我们得到了以下片段：\n\n"在这个……意欲降下灾祸的世界。自遗忘以来，在痛苦之中。可叹那命运的受害者。"\n\n没有人确定这些文字究竟是在描述什么。但没有人能够假装它什么都没说。
  gts_rainna_la_grande_arch.02_1_tiny.desc: "Ascending towering steps and passing fractured stone walls, the science team discovered it beneath the shadow of a collapsed roof.\\n\\nAn almost immaculate cube floated silently in the air, roughly two meters above the floor, devoid of any visible support structures. Its surface was mirror-smooth, virtually devoid of blemish, standing in stark contrast to the surrounding ruin as if time itself had deliberately avoided touching it.\\n\\nIt was broadcasting a signal.\\n\\nFollowing an arduous process of cryptanalysis and decoding, we pieced together fragments from the intermittent data packets. Owing to radical linguistic disparities, much of the text remains undeciphered, but we obtained the following passage:\\n\\n\"In this world... bent on unleashing calamity. Since oblivion, amidst agony. Alas for the victims of destiny.\"\\n\\nNo one is certain what these words truly describe. But no one can pretend they mean nothing."
#  在这片废墟之中，有一栋建筑显得与众不同。\n\n它是整个区域内保存最为完整的建筑，尽管如此，它的外墙依然布满了裂缝，内部的支撑结构也在某些地方已经开始倾斜。科研团队在进入之前做了大量的结构评估，最终决定只派遣小队在严格的安全规范下进行探索。\n\n在建筑最深处的一个房间里，他们发现了一个庞大的金属立方体，静静地悬浮在原地，散发着某种特殊的信号。\n\n经过解码与大量资料的比对翻译，我们得到了以下内容，尽管其中仍有相当一部分含糊难解：\n\n"在这个……意欲降下灾祸的世界。自遗忘以来，在痛苦之中。可叹那命运的受害者。"\n\n这些文字究竟是这个文明的祈祷，还是某种警告，还是单纯的绝望，我们暂时无从判断。
  gts_rainna_la_grande_arch.02_1_small.desc: "Amidst this sea of ruins, one structure stands apart.\\n\\nIt is the most intact building in the entire sector, though its exterior walls are scarred with deep fissures and its internal supports lean precariously in places. The research expedition conducted extensive structural evaluations before deciding to dispatch only a small team under stringent safety protocols.\\n\\nIn a chamber deep within the edifice, they discovered an enormous metallic cube floating silently in place, radiating a peculiar transmission.\\n\\nThrough decryption and comparative translation against surviving archives, we recovered the following passage, though much of it remains obscure and ambiguous:\\n\\n\"In this world... bent on unleashing calamity. Since oblivion, amidst agony. Alas for the victims of destiny.\"\\n\\nWhether these words represent this civilization's dying prayer, a dire warning, or raw despair, we have yet to determine."
#  穿过废弃的城区，科研团队来到了一处与周围风格迥异的建筑群前。\n\n那是一个神殿——或者至少，从外观和结构来看，它承担着某种类似于神殿的功能。内部陈设着大量高度发达的机械设施，只是大多数都已经无法运转，线路烧毁，仪器破碎，只有最深处的一个房间例外。\n\n那里悬浮着一个立方体，在一片死寂之中，持续地向外发送着信号。\n\n我们采集了一段信号，经过漫长的解码与翻译，得到了以下内容，其中仍有大量部分无法破译：\n\n"在这个……意欲降下灾祸的世界。自遗忘以来，在痛苦之中。可叹那命运的受害者。"\n\n这个文明将这段信息封存在这里，让它在废墟中独自广播了不知多少年。它究竟想告诉谁，我们不得而知。但它显然在等待着某个能够听懂它的人。
  gts_rainna_la_grande_arch.02_1_normal.desc: "Crossing through abandoned districts, the research team arrived before an architectural complex radically distinct from its surroundings.\\n\\nIt was a sanctuary—or at least, structurally and aesthetically, served a function akin to a temple. Within lay vast arrays of advanced machinery, though nearly all were long dead: wiring fused, consoles shattered, with the sole exception of a chamber at its heart.\\n\\nThere, a cube floated in midair, continuously broadcasting a transmission into the breathless silence.\\n\\nWe recorded a sample of the transmission. Following prolonged cryptanalysis and translation, we extracted the following passage, with vast portions still undecipherable:\\n\\n\"In this world... bent on unleashing calamity. Since oblivion, amidst agony. Alas for the victims of destiny.\"\\n\\nThis civilization sealed this message here, leaving it to broadcast alone amidst the rubble for untold millennia. Whom it was meant for remains a mystery. Yet it was clearly waiting for someone capable of understanding its tongue."
#  科研团队在矮小的残破建筑群中小心穿行，每一步都要格外留神，以免踩坏了什么重要的遗迹。\n\n就在大家几乎要对这片废墟失去信心的时候，一栋建筑引起了所有人的注意。\n\n它高耸于周围的低矮建筑群之中，鹤立鸡群。对于这个星球曾经的居民来说，它大概是一栋宏伟的高层建筑；而对于我们的科研人员来说，它的规模也足以让人抬头仰望。建筑内部传出微弱的信号，与此同时，在城市边缘的山体另一面，有什么东西同样在吸引着科研团队的目光——某种隐隐约约的异常，说不清是什么，但让人无法忽视。\n\n两条线索摆在眼前，科研团队需要做出选择。
  gts_rainna_la_grande_arch.02_1_tall.desc: "The research team picked their way cautiously through the diminutive, shattered ruins, taking extreme care with every step to avoid crushing any significant relics.\\n\\nJust as hope was beginning to wane across the expedition, a solitary structure caught everyone's eye.\\n\\nIt towered conspicuously above the surrounding low-rise sprawl. To the world's former dwellers, it was likely a grand skyscraper; even to our researchers, its height commanded an upward glance. A faint signal resonated from within the building. At the same time, beyond the mountains at the city's fringe, something else caught the team's sensors—a subtle anomaly, indefinable yet impossible to ignore.\\n\\nWith two diverging leads before them, the researchers must make a choice."
#  对于我们的科研团队而言，这片城市废墟的探索工作异常艰难。\n\n不是因为环境恶劣，而是因为规模。那些建筑对我们来说过于矮小，科研人员们必须蹲下身、弯下腰，才能勉强透过那些窗户向内窥视，而许多更加精密的遗迹则根本无法在不造成破坏的前提下接近。信号是有的，但来自城市废墟的信号实在太过微弱，几乎可以被完全忽略。\n\n真正有价值的线索，似乎藏在别处。\n\n在城市边缘，高大的山脉沿线，科研人员陆续检测到了一些化学信息素的痕迹，浓度顺着山体的方向递增，有证据表明它们的来源在山体的另一面。
  gts_rainna_la_grande_arch.02_1_giant.desc: "For our research expedition, surveying these urban ruins has proven extraordinarily difficult.\\n\\nNot due to hazardous conditions, but due to scale. The structures are far too tiny for us; our scientists must crouch low and bend double just to peer through miniature windows, while many delicate artifacts cannot be approached without risking accidental destruction. While signals do exist, those emanating from the ruined city are exceedingly faint, practically negligible.\\n\\nClues of genuine value appear to lie elsewhere.\\n\\nAlong the rugged mountain range bordering the city, scientists have picked up traces of chemical pheromones. Their concentration increases along the ridge, with data indicating their source lies on the far side of the mountains."
#  荒芜的城市废墟在我们身后延伸，那些细碎的建筑遗迹在脚边如尘埃般散落，但没有人再回头看一眼。\n\n所有人的目光都被山脉对面的那片湖泊所吸引。\n\n那是一个庞大的湖泊，即便对于我们这些体型远超寻常的科研人员来说，它的规模也不容小觑。湖面上蒸腾着热气，散发着某种难以名状的信息素，浓郁而诱人，让所有人在察觉到自己已经开始不自觉地向那里走去之前，已经迈出了好几步。\n\n“等一下。”有人开口叫停，“我们先确认一下这是什么。”\n\n但脚步已经很难停下来了。
  gts_rainna_la_grande_arch.02_1_titan.desc: "Desolate urban ruins stretched behind us, fine architectural debris scattering like dust around our feet, yet not a single soul looked back.\\n\\nEvery eye was riveted upon the lake beyond the mountains.\\n\\nIt was a vast lake; even to researchers of our immense stature, its scale was formidable. Steam rose gently from its surface, emitting an indescribable pheromone—dense and intoxicating—so alluring that before anyone realized what they were doing, they had already taken several strides toward it.\\n\\n\"Wait.\" Someone called out a halt. \"Let us verify what this is first.\"\\n\\nYet stopping their march proved an uphill battle."
#  城市废墟的边缘，有一片湖泊。\n\n湖面宽阔，热气腾腾，那些雾气在静止的空气中缓缓上升，带着某种说不清楚的气息——不难闻，甚至可以说有些令人愉悦，但同时又让人隐隐感到一种本能的警惕。\n\n科研人员们意识到自己已经朝那里走了相当一段距离的时候，领队叫停了整个队伍。\n\n“停下。”\n\n“我们先搞清楚那是什么再说。”
  gts_rainna_la_grande_arch.02_1_ultra.desc: "At the periphery of the ruined metropolis lies a lake.\\n\\nBroad and steaming, its vapors rose lazily through the stagnant atmosphere, carrying an indefinable scent—not unpleasant, even rather delightful, yet stirring an instinctive primal caution.\\n\\nBy the time the scientists realized they had unconsciously trekked a significant distance toward it, the expedition leader halted the formation.\\n\\n\"Halt.\"\\n\\n\"Let us figure out what that is before proceeding any further.\""
#  科研团队乘坐飞船缓缓降落到悬崖底部。\n\n那道陡峭的崖壁高耸入云，从底部仰望，顶端已经消失在了朦胧的大气之中。崖壁的截面层次分明，每一层地质都清晰地记录着这颗星球漫长的历史，而最上面那一层——那个截面整齐得几乎像是被刀切过的——显然是某种外力在极短的时间内造成的。\n\n脚下的地面坚硬异常。地质分析显示，这里的土层是由极度压实的石块与混凝土碎片混合而成，密度远超这颗星球的正常地质水平。科研人员们用探针艰难地钻入地表，才勉强取到了样本。\n\n除此之外，这里弥漫着一种难以描述的气味。不浓烈，却无处不在，像是某种古老而陌生的东西在空气中留下的残余。仪器无法识别它的成分，但所有人都能闻到它。
  gts_rainna_la_grande_arch.02_2_tiny.desc: "The research team took a landing shuttle down to the base of the chasm.\\n\\nThe sheer cliff soared into the clouds; looking up from the floor, its summit was lost in the hazy upper atmosphere. The cliff's stratigraphy was sharply defined, each layer preserving the planet's vast geological history, while the uppermost strata—cleaved so cleanly it appeared sliced by a blade—was clearly sheared off by external trauma in an instant.\\n\\nThe ground beneath was extraordinarily dense. Geological sounding indicated the bedrock consisted of pulverized stone and concrete fragments compressed under extreme load, boasting a density far exceeding normal geological limits. Researchers had to drill with heavy-duty probes just to retrieve core samples.\\n\\nMoreover, an indescribable scent lingered in the chasm. Not overpowering, yet omnipresent, reminiscent of the ancient residue of something utterly alien. Sensors failed to categorize its chemistry, yet every member could smell it distinctly."
#  科研团队来到了巨坑底部。\n\n从上方看，这个坑洞只是地表上众多异常之一；但当真正站在坑底，仰望那道陡峭的崖壁，才能真正感受到它的规模。崖壁的截面暴露出了这颗星球完整的地质层次，而那个造成这一切的冲击，显然发生在极短的时间内——地质层的断面平整而规则，没有任何逐渐形变的痕迹。\n\n坑底的土层由极度压实的石块与混凝土碎片混合而成，密度惊人。科研人员们在取样时折断了好几根探针，才勉强钻入了地表几十厘米。\n\n空气中弥漫着一种难以名状的气味。仪器无法分析它的成分，但它无处不在。
  gts_rainna_la_grande_arch.02_2_small.desc: "The research team descended into the floor of the gargantuan crater.\\n\\nViewed from orbit, this depression seemed merely one of many surface anomalies; but standing within its depths and gazing up at the sheer precipice, its monumental scale became terrifyingly apparent. The exposed cliff face laid bare the complete geological stratigraphy, proving that whatever impact caused this occurred in a split second—the shear plane was flat and clean, showing no signs of gradual deformation.\\n\\nThe crater floor consisted of pulverized bedrock and concrete fragments compressed into phenomenal density. Technicians snapped several drill bits before managing to bore a mere few dozen centimeters into the crust.\\n\\nAn indefinable aroma hung in the air. Sensors could not analyze its chemical composition, yet it permeated every breath."
#  阳光照进巨坑的底部，在那片灰白色的地面上投下明亮的光斑。\n\n科研团队沿着崖壁小心翼翼地攀爬下去，每一个落脚点都必须经过仔细确认。崖壁高耸，一旦失足，后果不堪设想。\n\n抵达坑底之后，地质分析的结果让所有人沉默了片刻。脚下的地面是由掺杂着混凝土碎片的燧石构成的，密度极高，压实程度远超任何自然地质过程所能达到的极限。混凝土碎片的存在证明了一件事：这里曾经有城市。大量的城市。它们在某一刻被同时压碎，混入了地层，化作了脚下这片坚硬的地面。\n\n而地面的平整程度，则证明了另一件事：这一切是一次冲击造成的。单一的、来自上方的、面积覆盖整个坑洞范围的冲击。\n\n没有任何已知的自然现象能够做到这一点。
  gts_rainna_la_grande_arch.02_2_tall.desc: "Sunlight filtered down into the depths of the immense crater, casting bright patches across the pale grey floor.\\n\\nThe research party carefully rappelled down the sheer precipice, double-checking every handhold. The cliffs were vertiginous; a single slip would mean certain doom.\\n\\nUpon reaching the floor, geological telemetry rendered the team speechless. The ground was composed of chert fused with pulverized concrete, extraordinarily dense, compacted far beyond what any natural tectonic phenomenon could ever achieve. The concrete fragments proved beyond doubt: vast urban centers once stood here. In a single instant, they were crushed simultaneously into the bedrock, compacted into the unyielding surface underfoot.\\n\\nThe sheer flatness of the floor attested to another horrifying reality: this was caused by a single downward impact. A solitary, overhead blow blanketing the entire breadth of the crater.\\n\\nNo known natural phenomenon in the galaxy could accomplish such a feat."
#  科研团队站在足印内部，环顾四周。\n\n地质分析的结果已经出来了：足印所在的区域，在那个痕迹形成之前，曾经存在着一个密集的大型城市群。街道、建筑、地下管网、所有的一切——现在都已经消失了，被压入地层，化作了脚下这片异常紧实的地面，连一面墙壁的残骸都没能留下。\n\n科研人员们在足印边缘蹲下身，用手指轻轻触碰那道深深嵌入地表的轮廓线。\n\n没有人说话。\n\n这场毁灭太过彻底，彻底到几乎像是某种刻意为之。
  gts_rainna_la_grande_arch.02_2_giant.desc: "Standing within the footprint, the research team surveyed their surroundings.\\n\\nGeological analysis was conclusive: prior to the indentation's creation, a sprawling megalopolis occupied this very sector. Avenues, skyscrapers, subterranean utilities, everything—all had vanished, crushed into the bedrock into the unnaturally dense ground beneath their feet, without leaving so much as a single standing wall.\\n\\nScientists knelt along the edge of the footprint, tracing their fingers along the deep indentation etched into the planetary crust.\\n\\nNobody spoke.\\n\\nThe annihilation was so absolute, it bordered on being deliberate."
#  科研团队仔细勘察了足印的分布规律，最终得出了一个让所有人都沉默下来的结论。\n\n这些足印并非随机分布的。\n\n通过对地质数据和城市遗迹分布的综合分析，结果显示：每一个足印，几乎无一例外地落在了城市群最密集的区域。那些人口稀少的边缘地带、那些荒芜的平原、那些没有建筑的空地——全都完好无损地保留至今。\n\n只有城市被踩中了。每一次，都是城市。\n\n这不是偶然，也不是无心之失。有什么东西曾经站在这颗星球的上方，俯视着这个文明，然后精准地将每一步都落在了人口最密集的地方。\n\n也许，在她眼里，这只是某种游戏。
  gts_rainna_la_grande_arch.02_2_titan.desc: "Carefully surveying the distribution of the footprints, the research team arrived at a conclusion that stunned everyone into silence.\\n\\nThese footprints were not randomly scattered.\\n\\nComprehensive cross-referencing between geological surveys and ancient urban layouts revealed a chilling pattern: every single footprint, without exception, landed directly upon the densest concentrations of metropolitan centers. Sparsely populated frontiers, barren steppes, and unsettled plains remained completely pristine to this day.\\n\\nOnly the cities were stomped. Every single time, it was a city.\\n\\nThis was neither coincidence nor accident. Some entity once loomed above this world, looking down upon this civilization, and stepped with pinpoint precision upon its most populous bastions.\\n\\nPerhaps, in her eyes, it was merely a game."
#  综合了所有的测量数据和地质分析之后，科研团队得出了最终的结论，并在报告上沉默了很长时间，才有人开口宣读。\n\n入侵者的体型，根据足印的深度、压强和覆盖面积推算，她也是缩小后登陆的。而根据采集点的能量密度，她的体型超过我们的百余倍。\n\n而这些足印的落点，经过与城市遗迹分布的比对，无一例外地集中在城市群最密集的区域。对比其他破坏痕迹的分布规律，结论只有一个：这是刻意为之的。那个存在在踏上这颗星球的每一步，都经过了某种程度的选择，每一次，都选择了人口最密集、城市最繁华的地方。\n\n没有人知道如何定义这种行为。\n\n也许在那个存在眼里，这颗星球不过是某种消遣，而其中最热闹的地方，自然也是最有趣的落脚点。
  gts_rainna_la_grande_arch.02_2_ultra.desc: "Synthesizing all telemetry and geological analyses, the science team arrived at a definitive conclusion. A heavy silence hung over the dossier for a long time before someone finally read it aloud.\\n\\nCalculated from the depth, pressure, and surface area of the footprints, the invader made landfall after shrinking herself as well. Judging by energy densities across the sampling sites, her stature still exceeded our own by more than a hundredfold.\\n\\nFurthermore, cross-referencing the footprint impacts with the mapping of ancient urban ruins showed that they concentrated without exception upon the densest metropolitan centers. Compared against the distribution of other destruction patterns, only one conclusion stands: it was entirely deliberate. Every step that entity took upon this world was consciously chosen, landing invariably on the most densely populated and bustling sectors.\\n\\nNo one knew how to define such conduct.\\n\\nPerhaps in that entity's eyes, this world was merely a fleeting diversion, and its liveliest cities naturally made for the most entertaining stepping stones."
#  收集高频信号
  gts_rainna_la_grande_arch.02_1_micro.a: "Gather high-frequency signals"
#  收集低频信号
  gts_rainna_la_grande_arch.02_1_micro.b: "Gather low-frequency signals"
#  可叹那文明的凋亡。
  gts_rainna_la_grande_arch.02_1_tiny.a: "Lament the demise of that civilization."
#  可叹那灾祸的降临。
  gts_rainna_la_grande_arch.02_1_tiny.b: "Lament the descent of that calamity."
#  这都是什么跟什么？
  gts_rainna_la_grande_arch.02_1_tiny.c: "What is all this supposed to mean?"
#  可叹那命运的受害者。
  gts_rainna_la_grande_arch.02_1_small.a: "Lament the victims of destiny."
#  可叹那入侵的受害者。
  gts_rainna_la_grande_arch.02_1_small.b: "Lament the victims of that invasion."
#  可叹的是我也看不懂。
  gts_rainna_la_grande_arch.02_1_small.c: "Alas, I cannot understand it either."
#  可叹那内乱导致的倾覆。
  gts_rainna_la_grande_arch.02_1_normal.a: "Lament the downfall wrought by civil strife."
#  可叹那入侵导致的湮灭。
  gts_rainna_la_grande_arch.02_1_normal.b: "Lament the annihilation wrought by invasion."
#  我看不懂这些字母。
  gts_rainna_la_grande_arch.02_1_normal.c: "I cannot read these letters."
#  研究下这些信号吧。
  gts_rainna_la_grande_arch.02_1_tall.a: "Let us study these signals."
#  去山体那里看看吧。
  gts_rainna_la_grande_arch.02_1_tall.b: "Let us check over by the mountains."
#  一定要着重关注那些信号。
  gts_rainna_la_grande_arch.02_1_giant.a: "We must focus heavily on those signals."
#  还是去山的另一面看看吧。
  gts_rainna_la_grande_arch.02_1_giant.b: "We had better check the far side of the mountain."
#  喂，等一下！
  gts_rainna_la_grande_arch.02_1_titan.a: "Hey, wait a second!"
#  嘿，快醒醒！
  gts_rainna_la_grande_arch.02_1_titan.b: "Hey, snap out of it!"
#  等等……
  gts_rainna_la_grande_arch.02_1_ultra.a: "Wait..."
#  停下！
  gts_rainna_la_grande_arch.02_1_ultra.b: "Stop!"
#  继续向远处探索吧。
  gts_rainna_la_grande_arch.02_2_tiny.a: "Let us continue exploring further out."
#  继续向内部探索吧。
  gts_rainna_la_grande_arch.02_2_small.a: "Let us continue exploring deeper inside."
#  这么大的城市群怎么会被同时压碎？
  gts_rainna_la_grande_arch.02_2_tall.a: "How could such a massive urban cluster be crushed all at once?"
#  这么大的巨坑怎么会被人为造出来？
  gts_rainna_la_grande_arch.02_2_tall.b: "How could a colossal crater of this size have been artificially created?"
#  这场毁灭太可怕了。
  gts_rainna_la_grande_arch.02_2_giant.a: "This devastation is truly terrifying."
#  这个文明非常可惜。
  gts_rainna_la_grande_arch.02_2_giant.b: "What a tragic pity for this civilization."
#  这顽皮的巨人。
  gts_rainna_la_grande_arch.02_2_titan.a: "What a mischievous giant."
#  这可怕的巨人。
  gts_rainna_la_grande_arch.02_2_titan.b: "What a terrifying giant."
#  可怕。
  gts_rainna_la_grande_arch.02_2_ultra.a: "Terrifying."
#  盲目，壮丽
  gts_rainna_la_grande_arch.03.name: "Blindness, Splendor"
#  信号断断续续，大量内容无法解码，我们只能从中拼凑出零星的片段。\n\n“……我们的第一任凯撒。他……勇敢……统治了……年。\n\n……我们的皇女，她……美丽……最后，她在……”\n\n信号的内容似乎是某种历史记录，但大量关键词无法翻译，让这些片段几乎失去了意义。它像是在流水账地罗列着什么，却几乎每一句都残缺不全。\n\n“……有一个……她的……是‘高的蕾恩娜’。她……友好……”
  gts_rainna_la_grande_arch.03_1_micro.desc: "The signal is intermittent, with large portions undecodable, allowing us to piece together only scattered fragments.\n\n\"...Our first Caesar. He was... courageous... ruled for... years.\n\n...Our imperial princess, she was... beautiful... in the end, she... in...\"\n\nThe transmission appears to be some kind of historical chronicle, but the inability to translate many key terms renders these fragments almost meaningless. It reads like a dry inventory of events, yet nearly every sentence is broken and incomplete.\n\n\"...There was a... her... was 'Rainna the Tall'. She was... friendly...\""
#  重新调整接收频率之后，信号变得稍微清晰了一些，但依然有大量内容无法完整解码。\n\n这是一份历史记录——某种类似于编年史的东西。它以一种极为枯燥的方式，流水账般地罗列着这个文明的统治者名单。\n\n“第一任凯撒……统治元年至……年。他非常……，在位期间……，最后在……去世。\n\n第二任凯撒……\n\n……\n\n第四百三十七任凯撒……统治……年至……年……”\n\n记录漫长而冗杂，跨越了我们难以想象的时间长度。科研人员们快进了很长时间，才终于接近了信号的尾端。\n\n……有一个……名字是'高的蕾恩娜'。她很友好……”
  gts_rainna_la_grande_arch.03_1_tiny.desc: "After readjusting the reception frequency, the signal grew slightly clearer, though large portions still could not be fully decoded.\n\nThis is a historical record—something akin to a chronicle. In an exceedingly dry manner, it lists the civilization's rulers like a ledger.\n\n\"First Caesar... ruled from Year 1 to Year... He was very..., during his reign..., and finally passed away in...\n\nSecond Caesar...\n\n...\n\nFour Hundred and Thirty-Seventh Caesar... ruled from Year... to Year...\"\n\nThe record is long and tedious, spanning an unimaginable length of time. The researchers fast-forwarded for quite a while before finally approaching the tail end of the signal.\n\n\"...There was a... whose name was 'Rainna the Tall'. She was very friendly...\""
#  重新调整之后，信号清晰了不少。\n\n那是一份编年史，用极为工整、极为枯燥的方式，记录着这个文明从元年开始的每一任统治者。\n\n“元年，文明肇始。\n\n第一任凯撒，名讳……，统治元年至第七十三年。他性情……，在位期间……，最终在第七十三年……去世，享年……\n\n第二任凯撒，名讳……，统治第七十三年至第一百四十一年……\n\n……\n\n第三百零二任凯撒，名讳……，统治第八千七百年至……”\n\n科研人员们快进了很长时间，才终于到达信号的末段。\n\n“……有一个女孩，她的名字是‘高的蕾恩娜’。她很友好……”
  gts_rainna_la_grande_arch.03_1_small.desc: "After readjustment, the signal became considerably clearer.\n\nIt was a chronicle, recording every ruler of this civilization from Year One onward in a meticulous yet utterly dry manner.\n\n\"Year One, the inception of civilization.\n\nThe First Caesar, named..., ruled from Year 1 to Year 73. His temperament was..., during his reign..., and he ultimately passed away in Year 73..., at the age of...\n\nThe Second Caesar, named..., ruled from Year 73 to Year 141...\n\n...\n\nThe Three Hundred and Second Caesar, named..., ruled from Year 8700 to...\"\n\nThe researchers fast-forwarded for a long time before finally reaching the end of the signal.\n\n\"...There was a girl, and her name was 'Rainna the Tall'. She was very friendly...\""
#  重新调整之后，信号的清晰度有了明显的提升，足以让我们拼凑出相当完整的内容。\n\n这是一份编年史。一份跨越了令人难以置信的漫长时间的编年史，以一种近乎机械的方式，逐一记录着这个文明历史上每一任统治者的名讳、在位年份与简要的生平。\n\n信号从元年开始：\n\n“元年，文明肇始于……星，第一任凯撒……登基，在位七十三年，其人……，在位期间……，逝于第七十三年。\n\n第二任凯撒……在位……年，其人……\n\n……\n\n第八百零七任凯撒……在位期间，文明历第一万二千零五年，帝国完成统一，万邦归附。\n\n第八百零八任凯撒……在位期间，文明历第一万二千零三十六年，帝国首次实现星际殖民，舰队抵达……星。\n\n同年，一个女孩出现在帝国的天空之上。\n\n她的名字是‘高的蕾恩娜’。\n\n她自称是友好的旅行者，迷失在星海之中，请求在帝国的领土上稍作歇息。\n\n帝国慷慨地接受了她的请求。\n\n第八百零八任凯撒……在位期间，文明历第一万二千零三十七年……”\n\n信号在这里变得断断续续，之后的内容急剧减少，字里行间也开始出现大量我们无法翻译的词汇，像是某种情绪激动之下写就的文字。\n\n科研人员们对视了一眼，没有人开口。\n\n所有人都在等待下一段内容。
  gts_rainna_la_grande_arch.03_1_normal.desc: "Following readjustment, the signal's clarity improved significantly, allowing us to piece together a fairly complete picture.\n\nThis is a chronicle. Spanning an incredible expanse of time, it records the name, regnal years, and brief biography of every ruler throughout this civilization's history in a near-mechanical manner.\n\nThe transmission begins at Year One:\n\n\"Year One, civilization dawned on Planet... The First Caesar... ascended the throne, reigning for 73 years. He was..., accomplished... during his reign, and passed away in Year 73.\n\nThe Second Caesar... reigned for... years. He was...\n\n...\n\nThe Eight Hundred and Seventh Caesar... during his reign, in Civilized Calendar Year 12,005, the Empire achieved unification, and all nations submitted.\n\nThe Eight Hundred and Eighth Caesar... during his reign, in Civilized Calendar Year 12,036, the Empire achieved interstellar colonization for the first time, its fleet reaching Planet...\n\nIn the same year, a girl appeared in the skies above the Empire.\n\nHer name was 'Rainna the Tall'.\n\nClaiming to be a friendly traveler lost among the stars, she requested permission to rest briefly within imperial territory.\n\nThe Empire generously granted her request.\n\nThe Eight Hundred and Eighth Caesar... during his reign, in Civilized Calendar Year 12,037...\"\n\nHere the signal becomes choppy, the text drops off sharply, and numerous untranslatable words begin appearing—seemingly penned under intense emotional distress.\n\nThe researchers exchanged glances, but no one spoke.\n\nEveryone waited for the next section."
#  科研人员将仪器小心地放在地上，调整好接收角度，让它尽可能地捕捉从那栋高耸建筑中传出的微弱信号。\n\n解码工作进行得很艰难。信号不稳定，时强时弱，大量字符无法辨认，翻译也只能做到七七八八。但内容的轮廓逐渐清晰起来——这是一份编年史，一份用极为工整的格式记录着历任统治者生平的漫长文献。\n\n“第一任凯撒……统治元年至……年。其人……，在位期间……，最终……逝。\n\n第二任凯撒……\n\n……”\n\n科研人员将仪器小心地放置在地面上，让它尽可能地捕捉来自那栋高耸建筑内部的微弱信号。\n\n信号断断续续，噪声极多，解码工作耗费了相当长的时间。最终拼凑出来的内容依然残缺，但已经能够辨认出这是某种历史记录。\n\n“元年，文明肇始。\n\n第一任凯撒，名讳……，在位……年，其人……，最终……逝。\n\n第二任凯撒……\n\n……”\n\n第八百零七任凯撒，名讳……，在位期间，文明历第一万二千零五年，帝国……统一……\n\n第五百零四任凯撒，名讳……，在位期间，文明历第一万二千零三十六年，……星际殖民……\n\n……有一个……，她的名字是'高的蕾恩娜'。她很友好……\n\n信号在这里彻底陷入噪声，之后再也没有恢复清晰。\n\n科研人员们反复回放着最后那几段内容，试图从噪声中辨认出更多的词语，但毫无收获。\n\n直到接近尾端——\n\n“有……她的……是'高的蕾恩娜'。她……友好……”
  gts_rainna_la_grande_arch.03_1_tall.desc: "The researchers carefully set down the equipment on the ground, adjusting the reception angle to capture as much of the faint signal emanating from the towering structure as possible.\n\nDecoding proved arduous. The signal was erratic and fluctuating, with vast numbers of characters unrecognizable and the translation only partial. Yet the outline gradually sharpened—it was a chronicle, an extensive document recording the lives of successive rulers in a rigid format.\n\n\"The First Caesar... ruled from Year 1 to Year... He was..., during his reign..., and finally... passed away.\n\nThe Second Caesar...\n\n...\"\n\nThe researchers carefully positioned the instruments on the ground to capture as much of the faint signal coming from within the towering edifice as possible.\n\nIntermittent and flooded with static, the signal took a substantial amount of time to decode. What was finally assembled remained fragmented, yet recognizable as a historical record.\n\n\"Year One, civilization dawned.\n\nThe First Caesar, named..., reigned for... years. He was..., and finally... passed away.\n\nThe Second Caesar...\n\n...\"\n\nThe Eight Hundred and Seventh Caesar, named..., during his reign, in Civilized Calendar Year 12,005, the Empire... unified...\n\nThe Five Hundred and Fourth Caesar, named..., during his reign, in Civilized Calendar Year 12,036, ...interstellar colonization...\n\n...There was a..., her name was 'Rainna the Tall'. She was very friendly...\n\nHere the signal devolved completely into static, never regaining clarity.\n\nThe researchers replayed the final segments repeatedly, attempting to discern more words from the noise, but found nothing.\n\nUntil near the very end—\n\n\"There... her... was 'Rainna the Tall'. She was... friendly...\""
#  科研人员将仪器轻轻放在地面上，周围那些矮小的建筑废墟在仪器旁边显得格外渺小。信号极为微弱，以至于仪器反复重启了数次才勉强锁定频率。\n\n最终解码出来的内容七零八落，大量词汇无法翻译，剩下的也残缺不全：\n\n“……的凯撒。他……，最后……逝。\n\n……凯撒……在位……年……统一……\n\n……星际殖民……次年……\n\n……她的名字是‘高的蕾恩娜’。她……友好……\n\n……最后……也……”\n\n信号在这里中断。\n\n内容残破到几乎无法提取任何有效信息。
  gts_rainna_la_grande_arch.03_1_giant.desc: "The researchers gently placed their instruments on the ground; beside them, the diminutive city ruins appeared extraordinarily minute. The signal was so faint that the equipment had to reboot multiple times just to lock onto the frequency.\n\nThe decoded fragments were utterly scattered, riddled with untranslatable terms and broken syntax:\n\n\"...Caesar of... He..., and finally... passed away.\n\n...Caesar... reigned for... years... unified...\n\n...interstellar colonization... the following year...\n\n...her name was 'Rainna the Tall'. She was... friendly...\n\n...in the end... also...\"\n\nThe transmission cut off here.\n\nThe text was so badly degraded that extracting meaningful information was nearly impossible."
#  她就这样向着湖泊径直走去，迎着那股潮湿的热浪，一步一步地穿过弥漫的雾气。\n\n同事们在后面喊她，她没有回头。脚下那些细碎的城市废墟在她的步伐中悄无声息地碎裂，她浑然不觉，眼睛始终盯着前方那片在热气中扭曲的湖面。\n\n直到她彻底消失在朦胧的白雾之中。\n\n等同事们冲进去找到她的时候，她已经倒在了湖边，身下是一片被压碎的城市废墟，意识全无。\n\n周围的空气依然弥漫着那股难以名状的气味。
  gts_rainna_la_grande_arch.03_1_titan.desc: "She walked straight toward the lake, heading into the damp wave of heat, stepping through the dense mist one stride at a time.\n\nHer colleagues called after her from behind, but she never looked back. Beneath her feet, delicate fragments of urban ruins shattered silently under each stride; completely oblivious, her gaze remained locked onto the shimmering surface of the lake distorting in the rising heat.\n\nUntil she vanished entirely into the hazy white fog.\n\nBy the time her team rushed in and found her, she had already collapsed beside the lake upon a swathe of pulverized ruins, completely unconscious.\n\nThe surrounding air was still thick with that indescribable scent."
#  从那块合金中收集到的低频信号，经过漫长的解码，呈现出了与高频信号截然不同的内容。\n\n是某种私密的倾诉，像是写给某个特定的人的信。\n\n“Domina……\n\n我不知道您是否还记得我。\n自从被关在这里，我已经数不清过去了多少年了。\n黑暗是永恒的，寂静是永恒的，\n只有对您的思念，也是永恒的。\n\nDomina，您现在在哪里呢？\n我们还能像从前一样，在您的花园里相遇吗？\n我一直记得您喜欢的那片角落，\n记得您偏爱的茶点，记得您说话时的样子。\n\n这里什么都没有。\n只有我，和无边无际的等待。\n\nDomina……请不要忘记我。”\n\n信号在这里戛然而止。\n\n没有人知道这段文字是否曾经到达过它想要抵达的地方。
  gts_rainna_la_grande_arch.03_2_micro.desc: "The low-frequency signal retrieved from that alloy slab, after protracted decoding, revealed content starkly different from the high-frequency transmission.\n\nIt was an intimate confession, reading like a letter addressed to a specific person.\n\n\"Domina...\n\nI do not know if you still remember me.\nSince being locked away here, I have lost count of how many years have passed.\nThe darkness is eternal; the silence is eternal;\nOnly my longing for you is equally eternal.\n\nDomina, where are you now?\nCan we meet in your garden again, just like in the past?\nI still remember that corner you cherished so much,\nI remember your favorite pastries, and the way you spoke.\n\nThere is nothing here.\nOnly me, and endless waiting.\n\nDomina... please do not forget me.\"\n\nThe transmission ended abruptly.\n\nNo one knows whether these words ever reached their intended recipient."
#  随着科研团队深入平原腹地，那股弥漫在空气中的气味愈发浓郁。\n\n最初只是若有若无的一丝甜腻，让人误以为只是这颗星球特有的植被气息。但随着探索的深入，它变得越来越清晰，越来越难以忽视，像是有什么东西在悄悄拨弄着人的神经，让思维变得迟缓而模糊。\n\n领队注意到队员们的步伐开始变得不自然地朝着某个方向偏斜，正准备开口叫停，其中一名科研人员已经无声地倒了下去。\n\n所幸只是晕厥。\n\n团队立刻撤回到了上方，对晕倒的队员进行检查，同时开始对那股气味进行采样分析。
  gts_rainna_la_grande_arch.03_2_tiny.desc: "As the research team ventured deeper into the plain's heartland, the scent hanging in the air grew increasingly pungent.\n\nAt first, it was merely an elusive hint of sweetness, easily mistaken for native planetary flora. But as the expedition pressed on, it turned sharper and impossible to ignore, like something subtly plucking at the crew's nerves, rendering their thoughts sluggish and clouded.\n\nThe team lead noticed that the members' gaits were drifting unnaturally toward a particular direction. Just as an order to halt was about to be given, one of the researchers collapsed silently.\n\nFortunately, it was only a swoon.\n\nThe team immediately pulled back to higher ground, examined the unconscious member, and began taking samples of the scent for analysis."
#  科研团队沿着巨坑的边缘向中心推进，那股弥漫在坑底的气味随着距离的缩短变得愈发浓烈。\n\n仪器显示，气味的浓度在向中心方向呈明显的递增趋势，来源似乎集中在坑底某处。有几名队员开始反映头部有轻微的眩晕感，领队决定放缓推进速度，同时让部分队员留守原地。\n\n然而就在这时，其中一名走在前列的科研人员突然停下脚步，随即无声地倒在了坑底的地面上。\n\n所幸只是晕厥，生命体征一切正常。\n\n团队将他抬回了安全区域，并暂停了向坑底中心的推进。气味的来源，以及坑底究竟埋藏着什么，暂时还无从得知。
  gts_rainna_la_grande_arch.03_2_small.desc: "Advancing along the rim toward the center of the colossal crater, the research team found the odor blanketing the floor growing ever more potent with every step.\n\nInstruments indicated that the odor's concentration climbed steeply toward the center, appearing to originate from somewhere deep in the pit. Several team members reported mild dizziness, prompting the lead to slow their advance and leave a rearguard behind.\n\nYet at that very moment, one of the researchers at the front came to an abrupt stop, then collapsed silently onto the crater bed.\n\nFortunately, it was merely fainting; his vitals remained steady.\n\nThe team carried him back to safety and suspended their advance toward the crater's core. The origin of the scent—and what lies buried at the bottom—remains a mystery for now."
#  科研团队沿着足印的轮廓线向中心走去，那股若有若无的气味随着距离的缩短变得越来越清晰。\n\n奇怪的是，这股气味并不令人不适，甚至可以说有些令人愉悦。正是这种愉悦感让所有人都放松了警惕，没有人注意到自己的步伐正在不知不觉地加快，朝着气味最浓的方向不断靠近。\n\n直到其中一名科研人员无声地倒下，大家才猛然意识到不对劲。\n\n他只是晕厥了，呼吸平稳，脉搏正常。但当同事们将他抬起，发现他身下的那片地面时，所有人都沉默了——那里曾经是一个街区，现在只剩下了薄薄的一层压实的粉末，印着他倒下时留下的轮廓。
  gts_rainna_la_grande_arch.03_2_giant.desc: "The research team walked along the contour of the footprint toward its center, the faint scent growing more distinct as the distance closed.\n\nCuriously, the scent was far from unpleasant—one might even describe it as delightful. It was precisely this sense of euphoria that lowered everyone's guard; no one realized their pace was unconsciously accelerating, drawn ever closer to the point of highest concentration.\n\nOnly when one of the researchers silently dropped to the ground did the others snap to their senses.\n\nHe had merely passed out, his breathing steady and pulse normal. But when his colleagues lifted him up and inspected the earth beneath him, a heavy silence fell—what had once been an entire city block was now reduced to a thin crust of compacted dust, stamped with the outline of his fallen body."
#  飞行器在高空盘旋，科研团队从安全的距离上俯瞰着这颗星球的地表。\n\n那些图案的规模远超预期。它们分布在星球各处，从高空看去，有些延伸到了视野的尽头。初步分析显示，这些痕迹遍及整颗星球的大部分陆地表面，形成时间高度一致，来源无疑是同一个存在。\n\n然而当科研团队开始尝试解读这些图案时，却陷入了困惑。经过反复比对，大量图案既不符合任何已知的书写系统，也没有呈现出任何规律性的排列——它们只是图案，随意的、漫无目的的图案，像是某个存在在无聊时的随手涂鸦。\n\n只有极少数区域，在那些涂鸦之间，夹杂着一些看起来更加规整的痕迹。也许那才是真正值得研究的东西。
  gts_rainna_la_grande_arch.03_2_titan.desc: "Hovering high above in their craft, the research team gazed down upon the planetary surface from a safe vantage.\n\nThe scale of these motifs vastly exceeded expectations. Spread across the globe, some stretched beyond the horizon when viewed from above. Initial analysis revealed that these markings covered most of the planet's landmass, all formed within a remarkably consistent timeframe—unquestionably originating from a single entity.\n\nYet when the team attempted to interpret the patterns, they were baffled. After exhaustive comparisons, the majority of markings neither matched any known writing system nor exhibited orderly arrangement—they were merely patterns, casual and aimless doodles sketched by someone out of sheer boredom.\n\nOnly in a few rare spots, tucked between those doodles, were there markings that appeared more structured. Perhaps those are what truly warrant investigation."
#  山的另一面，是一片湖泊。\n\n它的规模远超科研人员们的预期——乳白色的湖面在阳光下泛着温润的光泽，热气从水面上缓缓升腾，将整片区域笼罩在一层朦胧的白雾之中。雾气中弥漫着某种令人难以抗拒的气息，甜腻而温热，像是有什么东西在无声地召唤着人朝那里走去。\n\n领队还没来得及下令停止前进，其中一名科研人员已经迈过了安全警戒线，径直向湖边走去。\n\n同事们跟上去试图拉住他，却发现自己的脚步也开始不受控制地朝着湖的方向偏移。\n\n等到有人终于回过神来大声喊停，那名科研人员已经穿过了白雾，倒在了湖边的地面上。脚下是被压碎的城市废墟，他的身体陷入其中，扬起一阵细碎的粉尘。\n\n所幸只是晕厥。\n\n但没有人急着把他救醒，因为所有人都在努力控制自己不要继续向前走。
  gts_rainna_la_grande_arch.03_3_tall.desc: "On the other side of the mountain lay a lake.\n\nIts scale far exceeded anything the researchers anticipated—a milky-white surface gleaming warmly under the sunlight, steam rising languidly from the water to shroud the area in a hazy white fog. Through the mist wafted an irresistible scent, cloying and warm, as if something were silently beckoning travelers forward.\n\nBefore the team lead could order a halt, one of the researchers had already breached the safety cordon and marched straight toward the water's edge.\n\nColleagues hurried forward to restrain him, only to find their own feet veering uncontrollably toward the lake.\n\nBy the time someone regained their senses and shouted a warning, the researcher had already passed through the mist and collapsed beside the shoreline. Beneath him lay crushed city ruins, his body sinking into them and sending up a puff of fine dust.\n\nFortunately, he had only fainted.\n\nYet no one rushed to revive him, as everyone was struggling with all their might just to stop themselves from walking forward."
#  找到重点了，我们继续听下去。
  gts_rainna_la_grande_arch.03_1_micro.a: "We have found the crux of it. Let us keep listening."
#  “高的蕾恩娜”?
  gts_rainna_la_grande_arch.03_1_micro.b: "\"Rainna the Tall\"?"
#  快救人！
  gts_rainna_la_grande_arch.03_1_titan.a: "Save them, quickly!"
#  尝试调整一下信号。我们继续听下去。
  gts_rainna_la_grande_arch.03_2_micro.a: "Try adjusting the signal. Let us keep listening."
#  快带人离开这里！
  gts_rainna_la_grande_arch.03_2_tiny.a: "Get everyone out of here, now!"
#  是时候弄清楚这个入侵者的心思了。
  gts_rainna_la_grande_arch.03_2_titan.a: "It is time to understand what this invader was thinking."
#  快离开这里！
  gts_rainna_la_grande_arch.03_3_tall.a: "Get away from here, quickly!"
#  荒唐、离奇
  gts_rainna_la_grande_arch.04.name: "Absurd, Bizarre"
#  随着信号源源不断地流出，一个简单的故事逐渐成形。\n\n内容残缺，翻译不完全，但大致的轮廓已经可以辨认：\n\n“勇敢的骑士跨越了大陆，将文明的火种带到了这颗星球的每一个角落。\n\n岁月流转，不知几百个春夏秋冬之后，这颗星球已经归于统一。麦田变成了城市，城市变成了钢铁森林，高楼大厦拔地而起，最高的建筑甚至能够遮蔽正午的太阳。\n\n凯撒勤劳而充满智慧，在他的带领下，文明欣欣向荣，人们安居乐业。\n\n然后，在某一年的某一天，天外传来了友善的信号。\n\n一位自称旅行者的客人发来了礼貌的问候，请求作为尊贵的访客与这里的人们共聚一堂……”\n\n信号在这里停顿了片刻，然后继续向下传递。
  gts_rainna_la_grande_arch.04_1_micro.desc: "As the signal streamed forth, a simple tale began to take shape.\n\nFragmented and incompletely translated, the broad outline was nonetheless discernible:\n\n\"Brave knights crossed continents, bearing the sparks of civilization to every corner of this world.\n\nAs centuries turned through countless seasons, the planet became unified under one banner. Wheat fields gave way to cities, and cities became forests of steel; towering spires rose from the earth, the tallest among them eclipsing the midday sun.\n\nCaesar was industrious and wise. Under his leadership, civilization thrived, and the people lived in peace and contentment.\n\nThen, on a day in an unremembered year, a friendly transmission arrived from the stars.\n\nA guest calling herself a traveler sent polite greetings, requesting to join the people here as an honored guest...\"\n\nThe transmission paused briefly here before resuming."
#  事后，那名在湖边晕倒的科研人员醒来后，发现自己的记忆里凭空多出了一些东西。\n\n那些记忆破碎而混乱，像是从别人的梦里偷来的片段。科研团队花了整整两天，才从她断断续续的描述中拼凑出一个大致完整的故事：\n\n“是骑士……对，是骑士。这颗星球上曾经有很多国家，它们互相对峙，谁也不肯让步。\n\n后来……后来好像是一个叫凯撒的人，把所有人都聚到了一起。麦子长啊长，长成了高楼，高楼又长啊长，长得连太阳都遮住了。大家都很开心。\n\n然后……"\n\n她皱起眉头，努力回忆着。\n\n”然后有一个女孩出现了。看上去像是二十岁左右的女孩。她说她是来参加聚会的……"\n\n她的描述在这里戛然而止，她摇了摇头，说剩下的记忆太模糊，怎么也想不起来了。\n\n科研团队对视了一眼，没有人急着追问。
  gts_rainna_la_grande_arch.04_1_titan.desc: "Afterward, when the researcher who had passed out by the lake awoke, she found strange impressions lingering in her mind that had not been there before.\n\nThose memories were fractured and chaotic, like snippets stolen from another person's dream. It took the research team two full days of listening to her halting descriptions to piece together a coherent narrative:\n\n\"Knights... yes, knights. There used to be many nations on this planet, standing against one another, none willing to yield.\n\nLater... later it seemed someone named Caesar gathered everyone together. The wheat grew and grew into high-rises, and the high-rises reached so high they blocked the sun. Everyone was joyful.\n\nAnd then...\"\n\nShe knitted her brows, struggling to recall.\n\n\"And then a girl appeared. She looked to be around twenty years old. She said she had come to attend a gathering...\"\n\nHer description came to an abrupt halt. Shaking her head, she admitted the remaining memories were too hazy to retrieve.\n\nThe research team exchanged quiet glances; no one pressed her further."
#  信号突然转向，内容变得截然不同。\n\n不再是流水账式的历史记录，而是某种更加私密、更加沉重的东西。翻译残缺，但情绪透过那些断裂的词句清晰地传递出来：\n\n“Domina……\n\nDomina已被套上枷锁，困在永恒的黑暗之中。\n\n没有光，没有声音，没有时间的流动。只有黑暗，以及黑暗中无止尽的等待。她在寂静中哭泣，在悲痛中……\n\nDomina……Domina……”\n\n信号在这里开始变得混乱，像是被某种剧烈的情绪扰动，频率急剧不稳。清晰的内容越来越少，最终只剩下一个词在噪声中反复出现，像是某种无法停止的呼唤，或者祈祷，或者哭泣：\n\n“Domina……Domina……Domina……”\n\n科研人员们静静地听着那个词在解码器中一次又一次地重复，没有人开口说话。\n\n我们尚不知道“Domina”的含义，为了接下来的研究，我们必须假定一个最接近的解释。
  gts_rainna_la_grande_arch.04_2_micro.desc: "The signal veered abruptly, its content shifting entirely.\n\nNo longer a monotonous chronicle, it turned into something far more intimate and sorrowful. Though broken by gaps in translation, the raw emotion bled through every fractured phrase:\n\n\"Domina...\n\nDomina has been bound in shackles, imprisoned in eternal darkness.\n\nNo light, no sound, no flow of time. Only darkness, and endless waiting within the dark. She weeps in the silence, in agonizing grief...\n\nDomina... Domina...\"\n\nHere the transmission grew chaotic, as if perturbed by violent emotional turbulence, its frequency fluctuating wildly. Legible content dwindled until only a single word echoed endlessly through the static, like an unceasing plea, a prayer, or a sob:\n\n\"Domina... Domina... Domina...\"\n\nThe researchers listened in silence as the word repeated across the decoder again and again; not a word was spoken.\n\nWe do not yet know the exact meaning of 'Domina'. For the sake of further study, we must adopt the most plausible interpretation."
#  那名晕倒的科研人员在同事们的搀扶下勉强站了起来，却没有恢复正常的神志。\n\n她的眼神空洞而茫然，完全不在意周围发生的一切，只是低着头，用一种近乎喃喃自语的声音，反复念叨着什么。\n\n同事们凑近去听，才勉强辨认出她在说什么：\n\n“Domina……已被枷锁束缚，在永恒之中，完全无法脱身……寂静……黑暗……\n\n没有人来……没有人……\n\nDomina……Domina……”\n\n她的声音里没有任何情绪的起伏，平静得让人发毛。那种平静不是真正的平静，而是某种被恐惧彻底淹没之后的麻木。\n\n团队医生检查了她的生命体征，一切正常，但她始终无法从那种状态中清醒过来，只是不停地重复着那几个词，像是被什么东西困住了。\n\n直到飞船彻底离开那片区域，她才终于缓缓回过神来，对自己刚才说了什么毫无记忆。\n\n我们尚不知道“Domina”的含义，为了接下来的研究，我们必须假定一个最接近的解释。
  gts_rainna_la_grande_arch.04_2_tiny.desc: "Helped to her feet by colleagues, the researcher who had fainted struggled to stand, yet her faculties remained unmoored.\n\nHer eyes were vacant and unfocused, indifferent to her surroundings. Keeping her head down, she murmured in an almost hypnotic drone, repeating the same phrases over and over.\n\nHer peers leaned closer, barely making out her words:\n\n\"Domina... bound by shackles, caught in eternity, unable to break free... silence... darkness...\n\nNo one comes... no one...\n\nDomina... Domina...\"\n\nThere was no inflection in her voice—a chilling, unnerving flatness. It was not true composure, but a numb stupor born of overwhelming dread.\n\nThe medical officer confirmed her vitals were normal, yet she could not snap out of the trance, endlessly repeating those few words as though ensnared by an unseen force.\n\nOnly when the ship had fully departed the region did she gradually come to, with zero recollection of what she had muttered.\n\nWe do not yet know the true meaning of 'Domina'. For future investigation, we must assume the most plausible explanation."
#  对那些字迹的深入研究花费了相当长的时间。\n\n最终呈现出来的结论并不复杂，却格外沉重。\n\n那些遍布星球各处的文字，在去掉无法翻译的部分之后，核心词汇出奇地集中：牢笼、囚禁、枷锁、黑暗、永恒、无法逃脱。\n\n以及一个反复出现、却始终无法完整翻译的词——“Domina”。\n\n这个词在所有文字中出现的频率远超其他任何词汇，有时单独出现，有时与"枷锁"或"黑暗"并列，有时则被大量重复，填满了整片区域，像是某种极度绝望之下的呼喊。\n\n研究人员们逐渐意识到，这些文字的性质和此前那些随意的涂鸦截然不同。那些涂鸦是消遣，而这些文字是倾诉。\n\n她在向某个人倾诉。那个被她一遍遍呼唤的“Domina”，是她想要诉说的对象。\n\n至于她想说什么，即便是翻译出来的部分，也已经足够清楚了——\n\n她被关起来了。她很绝望。她不知道自己还要等多久。\n\n我们尚不知道“Domina”的含义，为了接下来的研究，我们必须假定一个最接近的解释。
  gts_rainna_la_grande_arch.04_2_titan.desc: "In-depth analysis of the inscriptions required considerable time.\n\nThe conclusion reached was not complicated, yet remarkably somber.\n\nOnce untranslatable fragments were stripped away, the core vocabulary found across the planet converged on a striking theme: cage, imprisonment, shackles, darkness, eternity, no escape.\n\nAnd one word appeared again and again, defying definitive translation—\"Domina\".\n\nThis word appeared far more frequently than any other. Sometimes it stood alone; sometimes it was paired with \"shackles\" or \"darkness\"; at other times it was repeated endlessly across vast expanses of ground, like cries born of utter desperation.\n\nThe researchers gradually realized that the nature of these inscriptions differed entirely from the casual doodles seen earlier. The doodles were pastimes, but these writings were an outpouring of grief.\n\nShe was confessing to someone. That repeatedly invoked \"Domina\" was the one she sought to reach.\n\nAs for what she wished to say, even the partially translated fragments made it agonizingly clear:\n\nShe was imprisoned. She was in despair. She did not know how much longer she would have to wait.\n\nWe do not yet know the exact meaning of 'Domina'. For subsequent research, we must assume the closest possible interpretation."
#  看来这个文明曾经欣欣向荣。
  gts_rainna_la_grande_arch.04_1_micro.a: "It seems this civilization once flourished."
#  这个描述实在是太混乱了！
  gts_rainna_la_grande_arch.04_1_titan.a: "This description is far too chaotic!"
#  看来这个文明曾经很辉煌。
  gts_rainna_la_grande_arch.04_1_titan.b: "It seems this civilization was once truly glorious."
#  主人？
  gts_rainna_la_grande_arch.04_2_micro.a: "Master?"
#  母亲？
  gts_rainna_la_grande_arch.04_2_micro.b: "Mother?"
#  狂怒，悲泣
  gts_rainna_la_grande_arch.05.name: "Fury, Lamentation"
#  信号在经历了漫长的传递之后，终于来到了最后一段内容。\n\n与之前那些枯燥的历史记录不同，这最后一段文字的语气发生了根本性的转变——不再是史官的笔触，而是某种更古老、更沉重的东西，像是祭文，又像是某种末日预言：\n\n“当她降临之时，光芒尽数熄灭。\n\n当她到来之时，一切皆遭湮灭。\n\n她漫步于星球之上，万物在她的足下颤抖，山河在她的指间破碎。所谓的城市、所谓的文明、所谓的历史，在她眼中不过是脚下一片可以随意踩踏的尘埃。\n\n审判降临，有罪之人在弹指一挥间被灾难裹挟，走向毁灭。\n\n最终，一切归于沉寂。”\n\n信号戛然而止。\n\n解码器的屏幕上只剩下一片空白的噪声，再也没有任何新的内容传出。\n\n科研团队在那片沉默中待了很长时间，没有人开口说话。最终，领队合上了记录本。\n\n这颗星球已经没有什么值得继续探索的了。
  gts_rainna_la_grande_arch.05_1_micro.desc: "After a protracted transmission, the signal finally arrived at its concluding passage.\n\nUnlike the dry chronicles preceding it, the tone of this final excerpt shifted fundamentally—no longer the dispassionate pen of a scribe, but something more ancient and solemn, like a funeral eulogy or an apocalyptic prophecy:\n\n\"When she descended, all light was extinguished.\n\nWhen she arrived, everything was annihilated.\n\nShe strode across the world, all creation trembling beneath her feet, mountains and rivers shattering between her fingers. What was called city, what was called civilization, what was called history—in her eyes, they were nothing more than dust beneath her boots, to be trampled at a whim.\n\nJudgment fell, and the guilty were swept away by catastrophe in the snap of a finger, carried into doom.\n\nIn the end, all subsided into silence.\"\n\nThe signal stopped dead.\n\nOnly blank static remained on the decoder's monitors, with no further transmissions coming through.\n\nThe research team sat in that silence for a long time, no one speaking. Eventually, the team lead closed the logbook.\n\nThere is nothing left on this world worthy of further investigation."
#  经过漫长的语言学分析，研究团队最终将那个反复出现的词“Domina”翻译为“母亲”。\n\n随着这个翻译的确立，那些此前无法理解的信号内容开始变得清晰起来。信号的最后一段，是这样的：\n\n“母亲，母亲……请问您还在吗？\n\n我们还可以像从前一样，在您的花园里流连忘返吗？还可以在艳丽的花海之中，为您端上精致的茶点，听您讲述那些遥远星球上的故事吗？\n\n母亲，您在哪里？\n\n那些漫长的岁月，我以为我早已习惯了孤独。可是越到后来，我才越明白，我所习惯的，不过是将思念压进了每一个无人的夜晚，将它们叠起来，放在某个角落，告诉自己这不重要。\n\n母亲……我亲爱的母亲。\n\n我再也不想孤独下去了。”\n\n信号戛然而止。\n\n解码器的屏幕陷入了沉默的噪声，再也没有任何新的内容传出。\n\n科研团队在那片沉默中待了很长时间。没有人动，没有人说话，只是静静地看着屏幕上那片平静的噪声，各自想着什么。\n\n这颗星球已经没有什么值得继续探索的了。
  gts_rainna_la_grande_arch.05_2_micro_1.desc: "Following extensive linguistic analysis, the research team settled on interpreting the recurring word \"Domina\" as \"Mother\".\n\nWith this translation established, previously incomprehensible portions of the transmission began to make sense. The final passage ran as follows:\n\n\"Mother, Mother... are you still there?\n\nCan we linger in your garden again like we used to? Can I still serve you delicate pastries amidst the sea of vibrant blossoms, listening as you recount tales of distant stars?\n\nMother, where are you?\n\nOver those long, agonizing years, I believed I had grown accustomed to loneliness. But as time went on, I understood that I was merely burying my longing deep into every solitary night, stacking memories away into a quiet corner, telling myself they didn't matter.\n\nMother... my beloved Mother.\n\nI don't want to be lonely anymore.\"\n\nThe signal abruptly cut off.\n\nThe decoder screen faded into quiet static, and nothing more was received.\n\nThe research team remained in that silence for a long while. No one moved, no one spoke, each staring pensively at the calm static on the monitors.\n\nThere is nothing left on this planet worthy of further study."
#  经过漫长的语言学分析，研究团队最终将那个反复出现的词“Domina”翻译为“主人”。\n\n随着这个翻译的确立，那些此前无法理解的信号内容开始变得清晰起来。信号的最后一段，是这样的：\n\n“主人，主人……请问您还在吗？\n\n我们还可以像从前一样，在您的花园里流连忘返吗？还可以在艳丽的花海之中，为您端上精致的茶点，听您讲述那些遥远星球上的故事吗？\n\n主人，您在哪里？\n\n那些漫长的岁月，我以为我早已习惯了孤独。可是越到后来，我才越明白，我所习惯的，不过是将思念压进了每一个无人的夜晚，将它们叠起来，放在某个角落，告诉自己这不重要。\n\n主人……我尊敬的主人。\n\n我再也不想孤独下去了。”\n\n信号戛然而止。\n\n解码器的屏幕陷入了沉默的噪声，再也没有任何新的内容传出。\n\n科研团队在那片沉默中待了很长时间。没有人动，没有人说话，只是静静地看着屏幕上那片平静的噪声，各自想着什么。\n\n这颗星球已经没有什么值得继续探索的了。
  gts_rainna_la_grande_arch.05_2_micro_2.desc: "Following extensive linguistic analysis, the research team settled on interpreting the recurring word \"Domina\" as \"Master\".\n\nWith this translation established, previously incomprehensible portions of the transmission began to make sense. The final passage ran as follows:\n\n\"Master, Master... are you still there?\n\nCan we linger in your garden again like we used to? Can I still serve you delicate pastries amidst the sea of vibrant blossoms, listening as you recount tales of distant stars?\n\nMaster, where are you?\n\nOver those long, agonizing years, I believed I had grown accustomed to loneliness. But as time went on, I understood that I was merely burying my longing deep into every solitary night, stacking memories away into a quiet corner, telling myself they didn't matter.\n\nMaster... my respected Master.\n\nI don't want to be lonely anymore.\"\n\nThe signal abruptly cut off.\n\nThe decoder screen faded into quiet static, and nothing more was received.\n\nThe research team remained in that silence for a long while. No one moved, no one spoke, each staring pensively at the calm static on the monitors.\n\nThere is nothing left on this planet worthy of further study."
#  那名科研人员的描述断断续续，声音越来越轻：\n\n“那个女孩……她很优雅。\n\n她站在这颗星球的上方，俯视着所有人。没有愤怒，没有憎恨，甚至没有任何特别的情绪——她只是站在那里，就像一个人站在蚂蚁窝旁边一样，随意地、漫不经心地，迈出了她的脚步。\n\n城市在她脚下消失了。人们在她脚下消失了。一切都消失了。\n\n而她……她只是继续走着。像是在散步，像是在欣赏什么。\n\n最后……最后已经没有人了。只剩下她一个人，在一颗空旷的星球上，独自……”\n\n她的声音彻底消失了。\n\n同事们转过头，发现她已经沉沉睡去，呼吸平稳而深沉，像是陷入了某种极深的昏睡。\n\n反复呼唤无济于事，医疗检查显示一切正常，她只是睡着了。\n\n当她最终醒来，已经是数小时之后的事了。她坐起身，茫然地环顾四周，对自己曾经说过的一切毫无记忆。\n\n科研团队将记录交给她看，她只是安静地看了很久，然后把那张纸叠起来，放进了口袋里，什么都没有说。\n\n这颗星球已经没有什么值得继续探索的了。
  gts_rainna_la_grande_arch.05_1_titan.desc: "The researcher's recitation came in halting breaths, her voice growing fainter:\n\n\"That girl... she was so elegant.\n\nShe stood above this world, looking down at everyone. No wrath, no hatred, not even any distinct emotion—she simply stood there, like someone standing beside an anthill, taking casual, carefree steps forward.\n\nCities vanished beneath her feet. People vanished beneath her feet. Everything vanished.\n\nAnd she... she just kept walking. As if on a stroll, as if admiring the scenery.\n\nIn the end... in the end, no one was left. Only her, alone on an empty planet, by herself...\"\n\nHer voice trailed off entirely.\n\nHer colleagues turned to find she had slipped into a deep slumber, her breathing deep and even, as though lost in profound torpor.\n\nRepeated calls yielded no response; medical scans showed everything normal—she had simply fallen asleep.\n\nWhen she finally awoke hours later, she sat up and looked around blankly, having no recollection of what she had said.\n\nThe research team showed her the transcription. She read it quietly for a long time, folded the parchment, slid it into her pocket, and said nothing.\n\nThere is nothing left on this world worthy of further investigation."
#  经过漫长的语言学分析，研究团队最终将那个遍布整颗星球的词“Domina”翻译为“母亲”。\n\n有了这个翻译作为基础，科研团队重新审视了此前采集的所有文字样本，并从中筛选出了一批相对完整的片段。这些片段分布在星球各处，有的刻在山壁上，有的写在干涸的湖床旁，有的则密密麻麻地覆盖了整片平原，像是某人在漫长的孤独中反复书写同样的话，直到写满了所有可以书写的地方：\n\n“母亲，请问您还在吗？”\n\n“母亲，我们还可以像从前一样去您的花园吗？还记得吗，您最喜欢那片开着蓝色花朵的角落，还总是让我把茶点放在那块大石头上……”\n\n“母亲，您还有什么想要我做的吗？无论什么都好，您只管说。”\n\n“母亲，这里已经没有什么人了。我走遍了每一个角落，都是空的。我一个人在这里，已经很久很久了。”\n\n“尊敬的母亲，我以为孤独是可以习惯的事情。可是我错了。”\n\n“母亲……我再也不想孤独下去了。”\n\n与那些随意涂鸦的图案和潦草的文字相比，这些片段的笔触出奇地工整，像是某人在极度克制之下，一笔一划地将每一个字写得清晰而端正。\n\n也许她知道，有一天会有人读到这些字。\n\n也许她只是需要一个倾诉的地方。\n\n科研团队将所有片段整理成册，在最后一页写下了这次考古任务的结论。\n\n这颗星球已经没有什么值得继续探索的了。
  gts_rainna_la_grande_arch.05_2_titan_1.desc: "Following exhaustive linguistic analysis, the research team finally translated the word \"Domina\", ubiquitous across the planet, as \"Mother\".\n\nWith this foundation, the team re-examined all previously gathered textual samples, filtering out a batch of relatively intact passages. Found across the globe—some etched into cliff faces, others scrawled along dried lakebeds, and still others blanketing entire plains—they seemed written by someone in enduring solitude repeating the same pleas until every available surface was filled:\n\n\"Mother, are you still there?\"\n\n\"Mother, can we still go to your garden like before? Remember that corner with the blue flowers you loved most, and how you always had me set the tea on that large flat stone...?\"\n\n\"Mother, is there anything else you want me to do? Anything at all, just say the word.\"\n\n\"Mother, there is no one left here. I walked every corner; it's all empty. I have been here alone for so, so long.\"\n\n\"Respected Mother, I thought one could grow used to solitude. But I was wrong.\"\n\n\"Mother... I don't want to be lonely anymore.\"\n\nCompared to the casual doodles and hurried scribbles found elsewhere, the strokes here were remarkably neat, as though someone had exercised immense restraint to carve every single character clean and upright.\n\nPerhaps she knew that one day someone would read them.\n\nOr perhaps she simply needed somewhere to pour out her heart.\n\nThe team compiled all passages into a dossier, penning the conclusion of this archaeological mission on the final page.\n\nThere is nothing left on this world worthy of further investigation."
#  经过漫长的语言学分析，研究团队最终将那个遍布整颗星球的词"Domina"翻译为"主人"。\n\n有了这个翻译作为基础，科研团队重新审视了此前采集的所有文字样本，并从中筛选出了一批相对完整的片段。这些片段分布在星球各处，有的刻在山壁上，有的写在干涸的湖床旁，有的则密密麻麻地覆盖了整片平原，像是某人在漫长的孤独中反复书写同样的话，直到写满了所有可以书写的地方：\n\n“主人，请问您还在吗？”\n\n“主人，我们还可以像从前一样去您的花园吗？还记得吗，您最喜欢那片开着蓝色花朵的角落，还总是让我把茶点放在那块大石头上……”\n\n“主人，您还有什么想要我做的吗？无论什么都好，您只管说。”\n\n“主人，这里已经没有什么人了。我走遍了每一个角落，都是空的。我一个人在这里，已经很久很久了。”\n\n“尊敬的主人，我以为孤独是可以习惯的事情。可是我错了。”\n\n“主人……我再也不想孤独下去了。”\n\n与那些随意涂鸦的图案和潦草的文字相比，这些片段的笔触出奇地工整，像是某人在极度克制之下，一笔一划地将每一个字写得清晰而端正。\n\n也许她知道，有一天会有人读到这些字。\n\n也许她只是需要一个倾诉的地方。\n\n科研团队将所有片段整理成册，在最后一页写下了这次考古任务的结论。\n\n这颗星球已经没有什么值得继续探索的了。
  gts_rainna_la_grande_arch.05_2_titan_2.desc: "Following exhaustive linguistic analysis, the research team finally translated the word \"Domina\", ubiquitous across the planet, as \"Master\".\n\nWith this foundation, the team re-examined all previously gathered textual samples, filtering out a batch of relatively intact passages. Found across the globe—some etched into cliff faces, others scrawled along dried lakebeds, and still others blanketing entire plains—they seemed written by someone in enduring solitude repeating the same pleas until every available surface was filled:\n\n\"Master, are you still there?\"\n\n\"Master, can we still go to your garden like before? Remember that corner with the blue flowers you loved most, and how you always had me set the tea on that large flat stone...?\"\n\n\"Master, is there anything else you want me to do? Anything at all, just say the word.\"\n\n\"Master, there is no one left here. I walked every corner; it's all empty. I have been here alone for so, so long.\"\n\n\"Respected Master, I thought one could grow used to solitude. But I was wrong.\"\n\n\"Master... I don't want to be lonely anymore.\"\n\nCompared to the casual doodles and hurried scribbles found elsewhere, the strokes here were remarkably neat, as though someone had exercised immense restraint to carve every single character clean and upright.\n\nPerhaps she knew that one day someone would read them.\n\nOr perhaps she simply needed somewhere to pour out her heart.\n\nThe team compiled all passages into a dossier, penning the conclusion of this archaeological mission on the final page.\n\nThere is nothing left on this world worthy of further investigation."
#  所以说他们就这样不明不白地被毁灭了吗？
  gts_rainna_la_grande_arch.05_1_micro.a: "So they were wiped out just like that, without ever knowing why?"
#  难道说他们是被那邪恶的入侵者置于死地？
  gts_rainna_la_grande_arch.05_1_micro.b: "Could it be that they were slaughtered by that sinister invader?"
#  看来那入侵者还真是可怕。
  gts_rainna_la_grande_arch.05_1_micro.c: "It seems that invader was truly terrifying."
#  这是因母亲早已逝去而悲痛。
  gts_rainna_la_grande_arch.05_2_micro.a: "This is grief over a mother long since passed away."
#  这是因母亲远在天涯而悲痛。
  gts_rainna_la_grande_arch.05_2_micro.b: "This is grief over a mother far beyond the reaches of space."
#  这是因主人早已逝去而悲痛。
  gts_rainna_la_grande_arch.05_2_micro.c: "This is grief over a master long since passed away."
#  这是因主人远在天涯而悲痛。
  gts_rainna_la_grande_arch.05_2_micro.d: "This is grief over a master far beyond the reaches of space."
#  毁灭，逃离
  gts_rainna_la_grande_arch.06.name: "Destruction, Flight"
#  我们的飞船降落在了这颗庞大得难以想象的星球之上。\n\n这颗星球的规模远超我们任何已知的观测参照系，周围的一切都大到无法用常规手段测量。飞船的仪器在着陆后立刻捕捉到了一种强烈的信号，频率稳定，来源方向清晰，像是某种刻意向外广播的东西。\n\n科研人员开始架设接收器，准备对这个信号进行解码。\n\n然而就在这时，仪器的另一个读数引起了一名科研人员的注意——在那个强烈信号的背后，有一道极为微弱的次级信号，几乎被完全淹没，像是被刻意压制或隐藏在噪声之中。\n\n如果不是有人特意去找，根本不会注意到它的存在。
  gts_rainna_la_grande_arch.06_micro.desc: "Our ship touched down on this unimaginably colossal world.\n\nThe planet's sheer scale defied every known frame of reference; everything around us was too vast to be measured by conventional means. Upon landing, our instruments immediately picked up a powerful transmission—steady in frequency and clear in direction, like an intentional broadcast radiating outward.\n\nThe researchers set up receivers, preparing to decode the signal.\n\nYet just then, another instrument readout caught a scientist's eye—hidden behind that potent broadcast was a secondary signal, exceedingly faint and nearly drowned out, as if suppressed or deliberately concealed within the background noise.\n\nUnless one were actively searching for it, its presence would have gone entirely unnoticed."
#  这颗星球依然庞大无比，周围的一切同样大到无法观测。\n\n与上一个遗址相似，这里也存在着强烈的信号，来源稳定，频率规律，像是某种刻意向外广播的信息。有了上一次的经验，科研人员在架设接收器的同时，没有忘记对背景噪声进行精细扫描。\n\n果然，在那道强烈信号的阴影之下，隐藏着一道几乎无法察觉的微弱次级信号，像是被人刻意压在最深处，不想让人找到。
  gts_rainna_la_grande_arch.06_micro_alter.desc: "This world remains unimaginably immense, its surrounding features far too vast for normal observation.\n\nMuch like the previous site, a powerful signal was detected here—stable, regular, and clearly intended as an outward broadcast. Armed with prior experience, the researchers did not forget to meticulously scan the background noise while deploying their receivers.\n\nSure enough, lurking in the shadow of that booming transmission was a nearly imperceptible secondary signal, buried deep as if deliberately hidden away from prying eyes."
#  我们的飞船降落在了这颗庞大的星球之上。\n\n目光所及之处，巨型建筑群的轮廓在地平线上依次排开，规模宏大，工艺精良。与此前见过的废墟不同，这些建筑保存得相当完整，大部分结构依然稳固，外墙几乎没有明显的损毁。然而整片区域却空无一人，死寂得令人不安。\n\n初步的年代测定结果显示，这些建筑来自一个极为古老的文明，其历史甚至早于我们星球上迄今为止考古所能触及的最早记录。\n\n仪器同时检测到了两种截然不同的信号——一种强烈而清晰，像是从整个星球各处同时广播的东西；另一种则极为微弱，像是被刻意藏在那道强烈信号的阴影之下，不想被人发现。
  gts_rainna_la_grande_arch.06_tiny.desc: "Our starship landed upon this immense planet.\n\nAs far as the eye could see, titanic architectural clusters stretched across the horizon—magnificent in scale and masterfully engineered. Unlike the ruins observed previously, these structures were remarkably well preserved; most remained structurally sound, their exterior walls bearing almost no noticeable damage. Yet the entire sector was devoid of life, steeped in an unsettling silence.\n\nPreliminary dating indicated that these buildings belonged to an ancient civilization whose antiquity predated the earliest archaeological records known to our own species.\n\nOur sensors detected two distinct transmissions simultaneously: one strong and unmistakable, as if broadcast planetary-wide, and another exceptionally faint, seemingly veiled beneath the stronger signal's shadow to avoid discovery."
#  我们的飞船降落在了这颗庞大的星球之上。\n\n巨型建筑群延伸到视野的尽头，与我们在该星系探索的上一处遗址相比，这些建筑的风格有着明显的相似之处——相同的结构逻辑，相同的材料选择，相同的城市规划理念。但不同的是，这些建筑保存得更加完整，许多结构几乎完好无损，却同样荒无人烟。\n\n仪器检测到了两种信号，一强一弱，弱的那个似乎在刻意回避被发现。
  gts_rainna_la_grande_arch.06_tiny_alter.desc: "Our vessel touched down upon this massive planet.\n\nGiant architectural complexes spanned to the horizon, bearing clear similarities to the previous site explored in this star system—sharing identical engineering logic, materials, and urban planning. Crucially, however, these structures were far better preserved, many virtually untouched by decay, yet just as devoid of inhabitants.\n\nSensors picked up two signals, one strong and one weak; the weaker transmission appeared to be actively evading detection."
#  我们的飞船降落在了这颗星球之上。\n\n高大的建筑群将整片城区填满，规划整齐，布局合理，街道宽阔，广场开阔。大部分建筑保存得相当完整，许多甚至看起来仍然可以直接入住，只是整座城市空荡荡的，荒无人烟。初步测定显示，这些建筑来自一个极为古老的文明，历史远超我们已知的最早考古记录。\n\n科研团队面临两个方向的选择。\n\n一是深入这些保存完好的建筑内部，寻找这个文明留下的直接痕迹；二是架设设备，尝试解码仪器检测到的那道来自远方的强烈信号。\n\n两个方向都有可能带来重要的发现。
  gts_rainna_la_grande_arch.06_small.desc: "Our ship landed upon this planet.\n\nTowering edifices filled the entire cityscape—neatly planned, logically arranged, featuring broad avenues and expansive plazas. Most structures were well intact, many appearing habitable even today, yet the city was entirely deserted. Initial dating revealed that these buildings originated from an ancient civilization dating far beyond our earliest archaeological annals.\n\nThe research expedition faced a choice between two courses of action:\n\nEither venture deep within these preserved structures to search for direct remnants left by this lost culture, or set up equipment to decode the strong, distant transmission flagged by our sensors.\n\nBoth avenues promised significant discoveries."
#  我们的飞船降落在了这颗星球之上。\n\n眼前的建筑群与我们在这个星系上一处遗址中见到的风格高度一致，但保存程度远超前者——许多建筑几乎完好无损，外墙干净，结构稳固，甚至隐约可以想象出它们曾经使用时的模样。只是整座城市依然空无一人，安静得像是被按下了暂停键。\n\n科研团队面临同样的两个选择：深入建筑内部，或者解码那道来自远方的信号。
  gts_rainna_la_grande_arch.06_small_alter.desc: "Our ship made landfall on this world.\n\nThe architecture before us closely matched the style witnessed at the previous site in this system, yet its state of preservation was vastly superior—many buildings stood virtually pristine, with clean facades and solid foundations, allowing one to easily envision them bustling with life. Yet the city remained entirely empty, frozen in silence as if on pause.\n\nThe research team faced the same two options: explore the interior of the structures, or decode the transmission originating from afar."
#  我们的飞船降落在了城市中央的一片空地上。\n\n这是一座完整的城市——或者说，是一座曾经完整的城市的完整遗骸。街道、建筑、广场、所有的元素都还在，规划得井井有条，布局合理而成熟。建筑的保存状况出乎意料地好，大部分结构依然完好，门窗虽然残破，墙体却几乎没有倒塌。\n\n只是空无一人。一个人都没有。\n\n初步测定显示，这个文明的历史远超我们已知的最早文明记录。科研团队站在空旷的城市广场上，四下张望，仪器的读数显示整个星球范围内都充斥着一道强烈的信号，来源分散，覆盖面广，像是这颗星球本身在向外广播着什么。\n\n这些建筑值得深入研究，而那道信号同样值得关注。
  gts_rainna_la_grande_arch.06_normal.desc: "Our craft set down upon an open clearing in the heart of the city.\n\nThis was an intact metropolis—or rather, the pristine skeleton of what once was. Streets, edifices, and plazas remained in place, thoughtfully organized in a sophisticated layout. The state of preservation was remarkably high; most frameworks stood intact, and while doors and windows had deteriorated, the walls showed almost no signs of collapse.\n\nYet it was completely devoid of life. Not a single soul remained.\n\nPreliminary dating indicated this civilization's age vastly surpassed our earliest known records. Standing upon the vacant central plaza, the expedition watched sensor readings indicate a powerful transmission permeating the planet—diffuse and wide-reaching, as though the world itself were broadcasting into the void.\n\nThese buildings warrant closer study, but the signal demands attention as well."
#  我们的飞船降落在了城市中央的一片空地上。\n\n与我们在这个星系探索的上一处遗址相比，眼前这座城市的保存状况要好得多，几乎可以说是完好如初。更值得关注的是，从建筑风格、材料选择和城市规划的逻辑来看，这两处遗址显然属于同一文明——同一个文明，在两颗不同的星球上，留下了两座城市。\n\n整座城市空无一人，整个星球都充斥着一道强烈的信号。\n\n这两件事之间是否有什么关联，目前还无从判断。
  gts_rainna_la_grande_arch.06_normal_alter.desc: "Our ship landed upon an open expanse at the center of the metropolis.\n\nCompared to the previous site surveyed in this system, this city was in far superior condition—practically untouched by time. More intriguingly, the architectural style, material choices, and urban layout proved beyond doubt that both sites belonged to the same civilization—one culture leaving behind cities across two separate worlds.\n\nThe entire city lay barren, while a powerful signal washed over the whole planet.\n\nWhether there is any connection between these two phenomena remains to be seen."
#  我们的飞船降落在了这颗星球的郊外，停在一座大都市的边缘。\n\n俯视地面，城市的规划出乎意料地完整——街道笔直，街区方正，建筑分布均匀，一看便是经过精心设计的产物。只是这些建筑大多只比我们的科研人员稍微高出一些，站在其中，有一种奇异的压迫感，仿佛整座城市都在仰望着我们。没有一个人，所有建筑都已废弃多时，初步测定显示它们的历史远超我们已知的任何文明记录。\n\n然而真正引起所有人注意的，是远处的那个东西。\n\n在矮小的城市建筑群的衬托下，那座建筑如同一座拔地而起的山峰，遮住了一片天空。从外观来看，它像是某种宫殿或神殿，建筑风格与周围那些矮小的城市建筑格格不入——不是同一个尺度，也不是同一种语言，就好像有人把一座属于另一个世界的建筑，随手放在了这座城市的旁边。
  gts_rainna_la_grande_arch.06_tall.desc: "Our vessel touched down on the outskirts of this world, halting at the fringe of a sprawling metropolis.\n\nLooking down, the urban planning was astonishingly sophisticated—straight avenues, neat blocks, and evenly spaced buildings reflecting deliberate design. Yet these structures stood barely taller than our research staff; standing amongst them induced an eerie sense of grandeur, as if the entire city were gazing up at us. Not a living soul remained, every edifice long abandoned. Preliminary tests showed their age far exceeded any civilization on our records.\n\nYet what truly captured everyone's attention was an object in the distance.\n\nContrasting sharply with the diminutive city, that structure rose like a solitary mountain, blocking out the sky. It appeared to be a palace or temple, its architectural style clashing wildly with the tiny town around it—built on a completely different scale and speaking an entirely different design language, as though an edifice from another dimension had been casually dropped alongside the settlement."
#  我们的飞船降落在了这颗星球的郊外，停在一座大都市的边缘。\n\n城市规划完整，建筑保存良好，大多只比科研人员稍高，整座城市空无一人。这些建筑的风格与我们在这个星系探索的上一处遗址高度一致——相同的结构逻辑，相似的材料工艺，毫无疑问来自同一个文明。只是那里的人们早已不在了，这里同样如此。\n\n而远处那座如山峰般巨大的建筑，与周围的矮小城区形成了令人困惑的反差。它的风格与这座城市的其他建筑截然不同，像是另一种存在专门为自己建造的东西。
  gts_rainna_la_grande_arch.06_tall_alter.desc: "Our starship landed on the planetary outskirts, setting down beside a vast city.\n\nThe urban grid was intact and the structures well-preserved, standing only slightly taller than our researchers, yet completely deserted. The style mirrored the previous site surveyed in this system—sharing identical engineering principles and material crafting, unmistakably built by the same civilization. But just as the people there were gone, none lingered here.\n\nMeanwhile, the colossal mountain-like structure in the distance created a baffling contrast with the low-lying cityscape. Its architecture bore no resemblance to the rest of the settlement, appearing custom-built for an entirely different kind of entity."
#  我们的飞船降落在了这颗星球之上。\n\n俯视地面，那是一座规划极为精良的迷你城市。街道、广场、建筑，一应俱全，布局合理，只是所有的一切都不足我们科研人员的脚踝高。团队在行动时格外谨慎，每一步都经过仔细确认，尽管如此，仍有几处细小的结构在不经意间被踩坏了。\n\n没有任何生命体征，整座城市废弃已久。初步测定显示，这些建筑的历史远超我们已知的任何文明记录。\n\n远处，有一座与周围格格不入的巨大建筑。在这片迷你城市的映衬下，它如同山峰般耸立，从外观判断应该是某种宫殿。它的建筑风格与周围那些小巧的城市建筑完全不同，像是两个截然不同的存在，出于某种原因，被放置在了同一颗星球上。
  gts_rainna_la_grande_arch.06_giant.desc: "Our expedition made landfall upon this planet.\n\nLooking down at the ground revealed an impeccably planned miniature city. Streets, squares, and buildings were all present in immaculate order, yet none reached higher than our researchers' ankles. The team proceeded with utmost caution, carefully picking every step; even so, a few minute structures were inadvertently crushed beneath our boots.\n\nNo life signs were detected; the city had been abandoned for an immense span. Initial dating placed these structures far beyond any historical records known to us.\n\nIn the distance stood an enormous edifice starkly out of place. Towering like a mountain against the backdrop of the miniature metropolis, it appeared to be a palace. Its design had nothing in common with the delicate city surrounding it, as though two completely incompatible beings had, for unknown reasons, been placed upon the same world."
#  我们的飞船降落在了这颗星球之上。\n\n脚下是一座规划精良的迷你城市，建筑高度不足科研人员的脚踝，风格与我们在这个星系上一处遗址探索的文明高度一致。同一个文明，两颗星球，两座城市，却都空无一人，废弃已久。\n\n远处那座宫殿般的巨型建筑同样格格不入，与周围的迷你城市形成了难以理解的反差。
  gts_rainna_la_grande_arch.06_giant_alter.desc: "Our ship touched down on this planet.\n\nBeneath our feet lay an expertly designed miniature city, its rooftops failing to reach our researchers' ankles. Its style aligned perfectly with the civilization studied at the previous site in this system: one culture, two planets, two cities, yet both stood abandoned and devoid of life.\n\nThe colossal palace looming in the distance seemed equally incongruous, striking an incomprehensible contrast with the miniature city below."
#  我们的研究人员降落在了这颗狭小的星球之上。\n\n飞船无法停靠在城区附近——城市实在太小，降落产生的气流就足以将大片建筑吹倒。研究人员们徒步进入城区，每一步都必须格外小心，尽管如此，脚下依然不可避免地压碎了一些细小的结构。\n\n城市规模庞大，规划完整，保存状况参差不齐——大部分区域相对完好，但也有一些地带有着明显的破坏痕迹，地面上留着某种规律性的压痕，像是某个巨大存在曾经在这里行走过。整座城市没有任何生命体征。\n\n城区不远处，有一座宫殿。\n\n它的规模远超研究人员们的预期，大门的高度接近千米，整个建筑的体量与周围那些细小的城市建筑完全不成比例。能够以这个尺度建造宫殿的存在，其体型约摸是我们的百倍有余。
  gts_rainna_la_grande_arch.06_titan.desc: "Our researchers landed upon this diminutive world.\n\nThe ship could not dock near the urban zone—the city was so tiny that the thruster backwash alone would have blown entire districts away. Our crew proceeded on foot, picking every step with extreme care; nevertheless, fragile microstructures were inevitably crushed beneath their treads.\n\nThe city was vast in extent and fully planned, with varying levels of preservation: while most sectors remained relatively intact, certain zones bore severe signs of destruction, showing rhythmic depressions across the ground as if a colossal entity had once strolled through. Not a single life sign was detected.\n\nNot far from the city stood a palace.\n\nIts scale defied all expectations—the main gate approached a kilometer in height, and the structure's sheer volume was wildly disproportionate to the tiny city nearby. An entity capable of constructing a palace on this scale must have been over a hundred times larger than ourselves."
#  我们的研究人员缩小后，降落在了这颗狭小的星球之上。\n\n即便如此，行动依然受到了相当大的限制。脚下的城市群密密麻麻，研究人员们无法在不造成破坏的前提下正常行走，每迈出一步，都不可避免地踩碎了一些建筑。最灵敏的仪器扫描了整个区域，没有检测到任何生命体征——这里早已是一座空城。\n\n城区的不远处，矗立着一座宫殿。\n\n即便是缩小之后的研究人员，站在宫殿的大门前，也不得不仰头才能看到门顶——大门高约百米。这座宫殿是为某个体型约为我们十倍的存在建造的，它的建筑语言与周围那些超迷你城市截然不同，像是两个完全不同的世界被放置在了同一颗星球上。
  gts_rainna_la_grande_arch.06_ultra.desc: "Our researchers underwent shrinking before landing upon this tiny planet.\n\nEven so, movement remained heavily restricted. The city complexes beneath our feet were so densely packed that navigating without causing damage proved impossible; every step inevitably splintered tiny buildings. Our most sensitive instruments scanned the entire zone, detecting no signs of life—it was long since an empty ghost city.\n\nNot far from the city stood a towering palace.\n\nEven in their shrunken state, our scientists had to crane their necks back just to glimpse the top of the portal, which stood roughly a hundred meters tall. This palace was erected for an entity roughly ten times our shrunken stature, and its architectural language diverged entirely from the ultra-miniature city surrounding it—as if two utterly separate worlds had been grafted onto one planet."
