  gts_rainna_la_grande_first_meeting.2111.d_tooltip: "Yet so very dangerous..."
#  点到为止
  gts_rainna_la_grande_first_meeting.2112.title: "A Light Touch"
#  她那巨大的足趾在大气层外优雅地舞动，轻柔地扰动着附着在星球表面的云层。每一次轻微的动作都在云层中激起波澜，如同湖面上的涟漪，只是规模大得难以想象。她光洁的足底在阳光下闪烁着微光，每一个细节都如同山丘与沟壑，映射着星光。她温和地舒展开足趾，露出圆润的足趾缝隙中晶莹的汗渍。\n\n“嗯……踩在哪里好呢？”\n\n她的声音中夹杂些许天真，巨大的足趾轻柔地拨开云层，如同掀开餐盘上的银盖。她的目光在这颗星球表面游移，掠过每一片繁华的城市群，像是在挑选玩具店里最完美的玩具。阴影划过群山与海洋，掠过森林与平原，最终停留在一片灯火通明的城市群上空。\n\n这片繁华的都市群瞬间陷入黑暗。数百万盏灯光在巨大的阴影下显得如此微弱，像是即将熄灭的萤火虫。从太空中看去，这座城市不过是她足尖下的一个微小光点。\n\n“唔，就这里吧。”\n\n带着俏皮的笑意，蕾恩娜的足趾轻盈地点向地面，就像芭蕾舞者的点地动作。但这看似优雅的一点，却让整片城市群在瞬间化为齑粉。钢筋与玻璃、混凝土与沥青，连同其中无数的生命，都在这轻柔的一触之下被碾入地壳。当她抬起足尖，原本车水马龙的商业中心只剩下一个完美的圆形深坑，细密的趾纹精美地刻画在深坑之中，边缘还在冒着袅袅青烟……
  gts_rainna_la_grande_first_meeting.2112.desc: "Her colossal toes dance gracefully outside the atmosphere, gently agitating the cloud layer clinging to the planet's surface. Every subtle gesture sends ripples cascading through the clouds like ripples across a lake, only on an unimaginable scale. Her smooth soles shimmer in the sunlight, every fine detail reflecting starlight like hills and ravines. She spreads her toes gently, revealing beads of glistening sweat between those soft digits.\n\n\"Mmm... where should I step?\"\n\nHer voice carries an innocent curiosity as her titanic toes gently part the clouds like lifting a silver cloche from a serving platter. Her gaze wanders across the world, skimming past every bustling urban cluster as if choosing the most perfect trinket in a toy store. Her shadow sweeps over mountains and oceans, forests and plains, finally coming to rest above a brightly lit megalopolis.\n\nThe sprawling metropolis is instantly plunged into darkness. Millions of city lights appear pathetically dim beneath the colossal shadow, like dying fireflies. From space, the city is merely a minuscule speck of light beneath her toe.\n\n\"Mmm, right here.\"\n\nWith a playful smile, Rainna touches her toe lightly toward the ground, like a ballerina tapping her point. Yet this seemingly delicate touch obliterates the entire metropolitan cluster in an instant. Steel and glass, concrete and asphalt, along with countless living souls, are ground deep into the crust beneath that soft touch. When she lifts her toe, what was once a bustling commercial hub is left as a perfectly round, deep crater, with delicate toe-prints finely impressed into the rock, smoke curling gently from its rim..."
