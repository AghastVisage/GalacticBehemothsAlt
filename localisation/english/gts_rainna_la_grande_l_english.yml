#  台阶的每一节只有数米高。\n\n对于经过缩小处理的科研人员来说，这个高度依然需要费力攀爬。抵达大门后，科研人员们从旁边预留的通道侧身穿过，进入了宫殿内部。\n\n宫殿的内部景象让所有人都停下了脚步。\n\n墙壁上的艺术作品延伸到了视野的极限，线条精细，色彩历经岁月依然鲜明。台架上的工艺品每一件都有建筑物的体量，镶嵌其中的宝石在光线下折射出璀璨的光芒。石像遍布宫殿各处，高耸入顶，面容细腻，神态栩栩如生，与这座宫殿废弃多年的事实形成了奇异的反差——它们看起来像是昨日才完成的作品。地毯从脚下向宫殿深处绵延而去，尽头透出幽微的光芒。\n\n宫殿正中央，矗立着一座雕像。\n\n那是一个女性的形象，身形修长，姿态优雅，面容平静，俯视着整座宫殿。雕像底座的铭文经过比对，与此前收集的大量信息相互印证——科研团队确认，这就是蕾恩娜。\n\n没有人急着离开。所有人都在那座雕像前站了很久，各自沉默地想着什么。\n\n最终，团队继续向内搜索，在宫殿深处找到了一间藏书室。文件保存完好，每张纸有数米长宽。经过缩小处理的科研人员面对这些文件，反而需要仰头才能看清全貌，但扫描设备的性能足以应对，解析工作并无困难。
  gts_rainna_la_grande_arch.07_4_ultra.desc: "Each tier of the staircase was merely several meters high.\n\nYet for our shrunken researchers, scaling this height still demanded strenuous climbing. Upon reaching the entrance, the crew squeezed through a side clearance to slip inside.\n\nThe sight inside the palace halted everyone in their tracks.\n\nMurals stretched to the edge of vision, their fine linework and colors remaining vivid through the ages. Relics on display stands each equaled buildings in scale, their inlaid gems catching the light with brilliant facets. Stone figures stood everywhere, arching to the ceiling with lifelike, delicate features that contrasted bizarrely with the palace's derelict state—looking as though carved only yesterday. A carpet stretched into the palace depths, where a subtle glimmer peeked through.\n\nAt the center of the palace stood a statue.\n\nA slender, elegant woman of calm countenance, looking down over the great hall. Comparing the pedestal's inscription with previously gathered data, the team confirmed: this was Rainna.\n\nNo one rushed to depart. Everyone lingered before the statue for a long time, lost in their own quiet reflections.\n\nFinally, the team pressed deeper inside, discovering a library archive. The documents were pristine, each page several meters broad. Looking up at these oversized folios, our shrunken scientists scanned them without difficulty, proceeding smoothly with analysis."
