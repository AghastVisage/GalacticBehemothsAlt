#  信号的解码工作颇费周折。\n\n强信号经过了复杂的多层加密，弱干扰的残余也给翻译工作带来了额外的困难。最终还原出来的内容并不完整，但核心部分已经可以辨认：\n\n“主人……\n\n您的双眼。那双金色的瞳孔，我见过太多颜色的眼睛，却从未见过那样的颜色。那不像是任何普通存在应该拥有的眼睛，深不见底，像是某种来自更黑暗地方的东西。\n\n可以让我多欣赏一会儿吗？\n\n主人，谢谢您。\n\n不枉我从始至终，忠贞不渝。我将永远追随您，无论您将我带往何处。”\n\n这段文字的语气让科研团队陷入了沉默。\n\n作者对那双金色眼睛的描述里，混杂着某种难以界定的情感——有敬畏，有恐惧，但更多的是一种几乎令人窒息的依恋。那种依恋看起来并不健康，却又真实得让人无法忽视。
  gts_rainna_la_grande_arch.07_2_small_alter2.desc: "Decoding the signal took considerable effort.\n\nThe strong transmission had undergone complex multi-layered encryption, and remnants of weak interference added further obstacles. The recovered text was incomplete, but its core message was clear:\n\n\"Master...\n\nYour eyes. Those golden pupils—I have seen eyes of countless hues, yet never a shade like that. They do not seem like eyes any ordinary being should possess, fathomless, like something emerging from an even darker place.\n\nMay I admire them a little longer?\n\nMaster, thank you.\n\nMy unwavering loyalty from start to finish was not in vain. I will follow you forever, wherever you may lead me.\"\n\nThe tone of this text brought a hush over the research team.\n\nThe author's description of those golden eyes was tangled with an emotion hard to classify—reverence, terror, but above all, a suffocating attachment. It seemed far from healthy, yet was so visceral that no one could look away."
#  科研人员攀上了一栋建筑高大的石阶，那些台阶显然是为比我们更高大的存在设计的，但保存尚算完好，足以支撑攀爬。建筑的大门早已损毁，残破的门板上布满了大大小小的破洞，科研人员们弯腰穿过其中一个较大的缺口，进入了内部。\n\n根据室内的布局和残存的设施，这应该是某种政府机关建筑——办公区域、会议室的痕迹依稀可辨，尽管一切都已残破不堪。能够在如此漫长的历史中屹立至今，本身就是一件令人惊叹的事情。\n\n最大的办公桌上堆叠着大量文件，大部分都已腐烂成难以辨认的碎片，稍一触碰就会化作粉末。然而在这堆残骸之中，仍有小部分文件保存得相对完好，字迹残破，但经过仔细处理，勉强可以推测出其大致内容。
  gts_rainna_la_grande_arch.07_3_small.desc: "The researchers ascended the towering stone steps of an edifice—steps clearly carved for beings taller than ourselves, yet well preserved enough to bear climbing. The main entrance was long ruined, its dilapidated panels riddled with fractures; ducking through a wider gap, the scientists entered inside.\n\nJudging by the interior layout and residual furnishings, this was likely a civic administration building—remnants of office cubicles and conference halls were faintly distinguishable, dilapidated though they were. That it had stood through such immense history was astonishing in itself.\n\nUpon the largest desk lay a mountain of documents, most decayed into unrecognizable debris that crumbled to dust at the slightest touch. Yet amidst the ruin, a small handful had survived comparatively intact; their script was faded, but with careful preservation, the general message could be deciphered."
#  城市中心最高的建筑外墙斑驳，但结构依然完好。科研人员轻轻推开那扇已经破旧不堪的大门——门轴发出一声沉闷的呻吟，随即门就开了，像是在等待这一刻等了很久。\n\n内部的格局一目了然，这是某种市政厅式的建筑，中央大厅宽阔，两侧是密集的办公区域。主要办公桌上陈列着大量文件，层层叠叠，经过漫长岁月的洗礼，大部分已经腐烂得几乎认不出原貌。\n\n然而奇迹总是存在的。\n\n在那堆腐烂的文件之中，有些纸张上的字迹奇迹般地保存了下来——也许是材质特殊，也许只是运气。经过仔细的处理，其中一部分内容仍然可以勉强解读。
  gts_rainna_la_grande_arch.07_3_normal.desc: "The tallest structure at the city center bore a weathered facade, yet its framework was sound. A researcher pushed gently against the dilapidated portal; the hinge groaned sullenly before swinging open, as though waiting for this moment across the ages.\n\nThe layout was immediately recognizable as a city hall, featuring a spacious central concourse flanked by rows of administrative offices. Piles of paperwork lay stacked across the primary desks; under the unrelenting passage of eons, most had rotted past recognition.\n\nYet miracles still occur.\n\nAmidst the decaying parchments, text on several folios had miraculously endured—perhaps due to exceptional materials, or mere fortune. Following meticulous restoration, portions of the text could still be read."
#  科研人员穿行于矮小的楼群之间，最终找到了这座城市中最高、占地最广的建筑。\n\n与周围那些低矮的建筑相比，这栋建筑的大门显得格外高大——科研人员只需微微俯身，便可以轻松钻进去，不需要任何特别的努力。内部空间宽阔，但对于科研人员的体型来说，活动依然受到了相当程度的限制，只能在不破坏建筑结构的前提下进行有限的搜索。\n\n在大量腐烂的纸张堆中，科研人员找到了一些仍然可读的文件。纸张脆弱，需要格外小心地处理，但经过简单的加固和清理，其中的内容应该可以进行初步分析。
  gts_rainna_la_grande_arch.07_3_tall.desc: "Weaving through clusters of diminutive buildings, the researchers eventually located the tallest and most expansive structure in the city.\n\nCompared to the low-slung architecture around it, the portal of this building appeared conspicuously high—our scientists needed only duck slightly to pass through effortlessly. The interior was spacious, though navigation was still constrained by the team's proportions, limiting searches to maneuvers that would not damage the building.\n\nWithin mountains of rotted parchment, the team uncovered several still-legible documents. The pages were brittle and required ginger handling, but following stabilization and cleaning, their contents should be ready for preliminary analysis."
#  对于我们的科研人员来说，逐一打开那些如同小盒子般微型的建筑进行研究，实在过于繁琐且容易造成破坏。经过讨论，团队决定将研究重点集中在规模较大的建筑上。\n\n在城市中心，有一栋占地面积远超周围其他建筑的建筑引起了大家的注意。科研人员使用精密镊子和微型探针，小心翼翼地从那扇比指甲盖大不了多少的门缝中伸入探测设备，确认内部是类似于市政厅的布局。\n\n在一堆腐烂成几乎无法辨认的微型纸张碎片之中，探针找到了几份保存状况相对较好的文件。由于体积极为微小，加之腐烂程度不轻，解析工作将会相当繁琐，但并非完全没有可能。
  gts_rainna_la_grande_arch.07_3_giant.desc: "For our research team, opening and examining those tiny, box-like structures one by one was far too tedious and risked widespread destruction. After deliberation, the expedition chose to concentrate efforts on the largest structure available.\n\nAt the city center, an edifice far broader than its neighbors drew everyone's eye. Using precision tweezers and micro-probes, the researchers gingerly guided sensors through a door seam scarcely larger than a fingernail, confirming a layout resembling a municipal hall.\n\nAmidst decayed micro-paper scraps, the probe retrieved several relatively intact documents. Given their microscopic size and severe rot, decoding will be laborious, but by no means impossible."
#  科研团队来到了宫殿门前，所有人都沉默了片刻。\n\n台阶。每一节台阶都有数千米高，整座台阶绵延向上，顶端消失在云层之中。在宫殿主人的眼中，我们大概和蚂蚁没有什么区别。经过简短的讨论，团队决定乘坐飞船沿着台阶攀升，最终抵达宫殿大门前。\n\n大门的门缝足以让陆地行驶载具轻松穿过。\n\n进入宫殿内部的瞬间，所有人都屏住了呼吸。\n\n这里的奢华程度远超任何人的预期。每一面巨大的墙壁上都覆盖着精工细作的浮雕与壁画，线条流畅，色彩历经不知多少世纪依然鲜艳。台架上陈列着无数工艺品，每一件都镶嵌着闪耀的宝石，在微弱的光线下折射出璀璨的光芒。石像如山峰般矗立，栩栩如生，神态细腻，与废弃的年代完全不相称——它看起来像是昨天才完工的。\n\n地面上铺展着华丽的地毯，绵延向内，宽度足以让我们的飞船在上面起降。团队不得不绕道而行，以免破坏这件显然无比珍贵的织物。\n\n经过漫长的搜索，科研人员们找到了一间藏书室。\n\n那里的文件保存得出奇完好，每一张纸张都有数千米长宽，展开来几乎可以覆盖整座城市。但扫描和解析并不困难——仪器的性能足以应对这个规模。
  gts_rainna_la_grande_arch.07_4_giant.desc: "Arriving before the palace gates, the entire research team fell silent for a moment.\n\nThe steps. Each individual tier stood thousands of meters tall, the grand stairway ascending until disappearing into the clouds. To the master of this palace, we would have been indistinguishable from ants. Following brief deliberation, the team opted to board their shuttle and ascend alongside the staircase, ultimately reaching the main gates.\n\nThe gap beneath the portal was wide enough for ground vehicles to pass with ease.\n\nThe moment they entered the palace interior, everyone caught their breath.\n\nThe opulence here surpassed all imagination. Every colossal wall was adorned with intricate reliefs and murals, their fluid lines and vivid pigments defying the centuries. Pedestals displayed countless artifacts encrusted with radiant jewels that glittered even in the dim light. Mountainous stone statues stood lifelike and expressive, utterly at odds with the age of abandonment—they looked as though finished only yesterday.\n\nAcross the floor stretched an ornate carpet extending inward, wide enough for shuttles to take off and land upon. The team had to detour to avoid damaging such an exquisite textile.\n\nAfter an extensive search, the researchers discovered a library chamber.\n\nThe records there were miraculously well-preserved, each page measuring thousands of meters across—wide enough to blanket an entire city. Yet scanning and analysis posed little problem; our equipment was well up to the task."
#  台阶的每一节都有数十米高。\n\n科研人员们费力地攀爬着，绕过了每一节台阶的边缘，才终于抵达宫殿大门前。大门本身无法打开——它的体量超出了任何已知工具的能力范围——但大门旁边有一个预留的通道，尺寸刚好足以让科研人员侧身穿过。\n\n宫殿内部的景象让所有人都停下了脚步。\n\n墙壁上的艺术作品气势恢宏，每一幅都足以覆盖一整座城市。宝石嵌在台架上的工艺品之中，每一颗都有建筑物的体量，在光线中折射出夺目的光彩。石像矗立在宫殿的各处，高度直抵穹顶，面容细腻，神态生动，历经不知多少年岁月，依然如同新作。地毯从脚下向深处延伸，远端消失在宫殿幽深的内部，尽头处透出隐约的光芒。\n\n而在宫殿的正中央，矗立着一座雕像。\n\n那是一个女性的形象，姿态优雅，神情淡然，俯视着整座宫殿。根据雕像底座上的铭文以及此前收集的信息综合分析，科研团队确认——这就是蕾恩娜。\n\n没有人说话。所有人都站在那座巨大的雕像前，仰望了很久。\n\n最终，团队继续向深处搜索，在宫殿的一角找到了一间藏书室。文件保存完好，每张纸有数十米长宽，扫描解析并不困难。
  gts_rainna_la_grande_arch.07_4_titan.desc: "Each tier of the staircase stood dozens of meters high.\n\nScrambling painstakingly around the edge of every step, the researchers finally reached the grand portal. The door itself could not be opened—its mass exceeded the capability of any known equipment—yet an auxiliary passageway beside it was just wide enough for researchers to squeeze through sideways.\n\nThe sight within the palace stopped everyone dead in their tracks.\n\nThe artworks adorning the walls were magnificent in grandeur, each large enough to span an entire city. Gemstones studded across ornamental plinths each rivaled whole buildings in size, refracting dazzling rays through the gloom. Stone statues rose throughout the halls right up to the vaulted ceilings, their delicate expressions vivid and fresh despite the endless passage of time. A carpet unfurled beneath their feet into the shadowy depths, where a faint glimmer shone at the far end.\n\nAnd at the very center of the palace stood a statue.\n\nIt depicted a woman—poised with grace, serene in countenance, gazing down upon the entire hall. Analyzing the inscription at the pedestal alongside prior data, the team confirmed: this was Rainna.\n\nSilence reigned. Everyone stood before the titanic likeness, gazing up for a long time.\n\nEventually, the expedition pressed on, discovering a library chamber tucked into a palace wing. The documents were remarkably preserved, each sheet dozens of meters across, posing no issue for our scanning systems."
#  台阶的每一节都有数十米高。\n\n科研人员们费力地攀爬着，绕过了每一节台阶的边缘，才终于抵达宫殿大门前。大门本身无法打开——它的体量超出了任何已知工具的能力范围——但大门旁边有一个预留的通道，尺寸刚好足以让科研人员侧身穿过。\n\n宫殿内部的景象让所有人都停下了脚步。\n\n墙壁上的艺术作品气势恢宏，每一幅都足以覆盖一整座城市。宝石嵌在台架上的工艺品之中，每一颗都有建筑物的体量，在光线中折射出夺目的光彩。石像矗立在宫殿的各处，高度直抵穹顶，面容细腻，神态生动，历经不知多少年岁月，依然如同新作。地毯从脚下向深处延伸，远端消失在宫殿幽深的内部，尽头处透出隐约的光芒。\n\n而在宫殿的正中央，矗立着一座雕像。\n\n那是一个女性的形象，姿态优雅，神情淡然，俯视着整座宫殿。\n\n没有人说话。所有人都站在那座巨大的雕像前，仰望了很久。\n\n最终，团队继续向深处搜索，在宫殿的一角找到了一间藏书室。文件保存完好，每张纸有数十米长宽，扫描解析并不困难。
