#  看来，他们是凋亡文明的最后火种。
  gts_rainna_la_grande_arch.07_1_micro.a: "It seems they were the final embers of a fallen civilization."
#  看来，他们是入侵的极少数幸存者。
  gts_rainna_la_grande_arch.07_1_micro.b: "It seems they were among the very few survivors of the invasion."
#  看来她这是多少有点疯魔了。
  gts_rainna_la_grande_arch.07_2_micro.a: "It seems she had gone somewhat mad."
#  看来她非常珍惜宝贵的亲情。
  gts_rainna_la_grande_arch.07_2_micro.b: "It seems she deeply cherished family bonds."
#  看来她相当崇拜自己的主人。
  gts_rainna_la_grande_arch.07_2_micro.c: "It seems she utterly worshipped her master."
#  都过去多久了居然还有能看的文件。
  gts_rainna_la_grande_arch.07_3_small.a: "After so long, it is amazing that legible documents still survive."
#  好，我们开始分析吧。
  gts_rainna_la_grande_arch.07_4_giant.a: "Good, let us begin the analysis."
