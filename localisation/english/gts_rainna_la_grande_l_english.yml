  gts_rainna_la_grande_first_meeting.2111.b: "Curse you, how can you be so cruel..."
#  质问施暴者的残忍，往往会换来更大的残忍……
  gts_rainna_la_grande_first_meeting.2111.b_tooltip: "Questioning an oppressor's cruelty often invites only greater cruelty..."
