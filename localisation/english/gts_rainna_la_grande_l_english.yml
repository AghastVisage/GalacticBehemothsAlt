#  朋友
  gts_rainna_la_grande_first_meeting.2150.title: "Friends"
#  “嘛~好啦好啦，我就知道你们不会介意的嘛~”\n\n蕾恩娜咯咯地笑着，将悬在大气层外的足底轻轻收回，在太空中随意地伸了个懒腰。她看起来心情极好，长发在无重力中慵懒地飘散。\n\n“只不过是和你们开个小玩笑嘛~不用这么紧张啦~”\n\n她将身体侧卧，一手托着脸颊，用另一只手的指尖在大气层外轻轻划着圈。云层在她的指尖下被随意塑造成各种形状，转眼是一朵花，转眼又变成什么别的东西。\n\n“嗯……”她歪着头，认真地看了看这颗星球，眼神中带着几分少见的温和，“不过话说回来……”\n\n她的声音变得轻快。\n\n“你们是第一个主动要和我做朋友的小家伙呢~”\n\n她将下巴搁在手背上，若有所思地打量着这颗渺小的星球。\n\n“嘛，那就这样吧~”她俏皮地眨了眨眼，“从今天起，我们可就是朋友咯~”\n\n她顿了顿，嘴角勾起一抹意味深长的笑容。\n\n“不过……朋友归朋友，你们的星球踩起来是什么感觉这件事，我还是很好奇的哦~”\n\n她的声音里带着天真的危险，让人分不清这份"友谊"究竟意味着什么。\n\n“嘿嘿，开玩笑的哦，我可不会主动破坏朋友的星球呢~”\n\n说着，一场酣畅的雨从天而降。\n\n“嘛，这是我给你们的礼物哦，好好享用吧~”
  gts_rainna_la_grande_first_meeting.2150.desc: "\"Well~ alright, alright, I knew you wouldn't mind~\"\n\nRainna giggles, gently pulling back the sole hovering outside the atmosphere and stretching lazily in the void. She appears in marvelous spirits, her hair drifting languidly in zero gravity.\n\n\"It was just a little joke with you all~ No need to be so nervous~\"\n\nShe will lie on her side, propping up her cheek with one hand while the index finger of her other hand sketches circles outside the atmosphere. Cloud formations are effortlessly sculpted into whatever shape she pleases beneath her touch—one second a flower, the next something else entirely.\n\n\"Mmm...\" Tilting her head, she studies the planet earnestly, a rare gentleness in her gaze. \"Though come to think of it...\"\n\nHer voice turns light and bouncy.\n\n\"You're the very first tiny creatures who ever offered to be friends with me~\"\n\nResting her chin on the back of her hand, she ponders as she observes this diminutive world.\n\n\"Well, let's do it then~\" She winks playfully. \"From today on, we're officially friends~\"\n\nShe pauses, a knowing smirk curling on her lips.\n\n\"Though... friends or not, I'm still really curious what stepping on your world feels like, you know~\"\n\nA dangerous innocence permeates her words, leaving everyone terrified of what this \"friendship\" truly entails.\n\n\"Hehe, just kidding! I'd never go out of my way to destroy a friend's planet~\"\n\nWith that, a refreshing downpour descends from the heavens.\n\n\"Here, this is my gift to you all. Enjoy it~\""
#  太好了，我的朋友！
  gts_rainna_la_grande_first_meeting.2150.a: "Splendid, my friend!"
#  皈依
  gts_rainna_la_grande_first_meeting.2160.title: "Conversion"
#  “嗯……”\n\n蕾恩娜轻轻地应了一声，那双湖泊般的眼眸缓缓闭上。\n\n四周陷入了深沉的寂静。\n\n连太空中漂浮的尘埃都仿佛停止了运动。星球上所有人都感受到了某种无形的压迫，那不是来自她的足底，而是来自她存在本身所散发出的某种难以言说的威压。\n\n良久，她睁开眼睛。\n\n“既然如此……”\n\n她的声音变得低沉而悠远，与之前那种俏皮的语气截然不同。她缓缓将双臂展开，巨大的身躯在星光中显得格外神圣，长发在无重力中如星河般铺展开来，遮蔽了一大片宇宙的光芒。\n\n“那么，作为你们至高无上的神明，我将收回降临之时的审判。”\n\n她的足底从大气层边缘缓缓抬起，阴影一点一点地从地表消退，阳光重新洒落在那片满目疮痍的土地上。\n\n“然而……”\n\n她将双手交叠在胸前，俯视着这颗渺小的星球，眼神中带着一种居高临下的平静。\n\n“身为神明，恩泽从不轻易降下。”\n\n她的声音回荡在整个大气层中，如同古老神殿中的钟鸣，庄严而不可抗拒。\n\n“你们得到了今日的宽恕，这归因于……”\n\n她停顿了片刻。\n\n“我心情不错。”\n\n随即，她的嘴角微微上扬了一丝，那个细微的弧度几乎难以察觉，却让整个庄严的氛围悄然裂开了一道细缝。\n\n她很快收敛回来，重新摆出那副神明的姿态，声音依然庄重。\n\n“那么……从今日起，你们当以虔诚之心侍奉于我，以合适的方式，表达对至高神明应有的敬意。”
  gts_rainna_la_grande_first_meeting.2160.desc: "\"Mmm...\"\n\nRainna lets out a soft acknowledgment as those lake-blue eyes slowly close.\n\nA profound silence blankets all around.\n\nEven cosmic dust floating through the void seems to freeze in place, as if the entire universe were holding its breath for this moment. Starlight swirls around her alabaster form, adorning her with a sacred, inviolable golden halo. At this instant, her colossal presence no longer feels horrifying, but instead radiates a solemn holiness that compels all to kneel in worship.\n\n\"I accept your conversion.\"\n\nHer voice is deep and resonant; every syllable echoes in the depths of every soul like an ancient divine oracle. Gone is the everyday mischief and mockery, replaced by pure, divine majesty.\n\n\"From this day forth, I am your goddess.\"\n\nOpening her eyes slowly, pure and deep radiance glints within them like newborn stars. She gracefully spreads her arms wide in a gesture embracing the entire planet.\n\n\"In honor of your devout servitude, I bestow my grace upon you.\"\n\nAlong with her decree, countless streams of gentle golden light pour from her fingertips, piercing the atmosphere and showering down upon the world like warm spring rain. Wherever the light touches, shattered structures are miraculously restored, terrified citizens are washed in unprecedented serenity, and a delicate fragrance fills the air.\n\n\"Serve me well...\"\n\nThat familiar playful smile returns to her lips, yet the majesty of a goddess remains steady in her eyes.\n\n\"I'm very much looking forward to what you do~\""
#  我们的灵魂归于您。
  gts_rainna_la_grande_first_meeting.2160.a: "Our souls belong to you."
#  无事发生？
  gts_rainna_la_grande_first_meeting.2210.title: "Nothing Happened?"
#  “哼哼……没想到你们这群小东西居然会怕成这样~”\n\n蕾恩娜咯咯地笑着，那清脆的笑声通过通讯器传来，在每个人心中激起阵阵涟漪。她巨大的身躯在太空中优雅地后仰，长发在星光中如瀑布般散开。\n\n“嘛，看你们这么可怜的样子……就这样吧，饶你们一次哦~”\n\n她收回了悬在大气层外的手指，歪着头俯视着这颗渺小的星球。她眨了眨眼，那如城市般巨大的睫毛扰动着高层云彩，在天空中留下一道短暂的彩虹。\n\n“不过嘛……”\n\n她轻轻地用指尖点了点自己的下巴，做出一副思考的样子。清澈的蓝色眼眸中闪过一丝狡黠的光芒，嘴角勾起一抹顽皮的微笑。\n\n她慵懒地在太空中调整了一下姿势，将身体侧卧，一手随意地托着脸颊，另一只手的指尖在大气层外轻轻划着圈。云层在她指尖的拨弄下如同棉花糖般被随意塑造，转眼是一道漩涡，转眼又被抹成一片薄雾。\n\n“这都要归因于……”她的声音变得漫不经心，“今天我心情好哦。”\n\n她的指尖在大气层边缘轻轻一弹，掀起一阵不大不小的气流，让地表上残存的几片云彩四散飘去。\n\n她托着下巴，用那双巨大的眼眸静静地打量着这颗星球，就像是在观察一件有趣的小玩意儿。\n\n“不过如果我下次心情好，还会再来玩的~”\n\n她的声音中带着天真的危险，让人分不清这究竟是宽恕还是另一种形式的威胁。
  gts_rainna_la_grande_first_meeting.2210.desc: "\"Hehehe... I never expected you little things to be terrified to this degree~\"\n\nRainna giggles, her clear laughter drifting through the communicator to send shivers through every heart. She seems immensely pleased by this tiny world's reaction, her face flushed with the satisfaction of a prank well pulled.\n\n\"Well, seeing how frightened you are...\"\n\nShe slowly pulls back the finger poised outside the atmosphere and stretches in the vacuum. Her hair billows weightlessly like a galaxy of stars, showing off her flawless silhouette against the cosmos.\n\n\"I'll let you off the hook for today~\"\n\nTilting her head, playful sparks dance within those gigantic blue eyes. Extending her index finger, she idly traces a circle outside the atmosphere, smoothing out the storm-tossed cloud banks she had just agitated.\n\n\"Though remember...\" Her voice suddenly lowers, dripping with an enigmatic menace, \"I've memorized these coordinates.\"\n\nRolling over in space to recline languidly on her side, she rests her chin on one palm and waves the other casually, as if bidding farewell to a collection of toys.\n\n\"Next time I'm bored, I'll definitely come back to play with you again~\"\n\nThe giggles over the comms gradually fade away, and that incomprehensibly vast figure slowly recedes into the blackness of space. When the colossal shadow over the sky completely disperses and sunlight warms the surface once more, the entire planet collapses in limp exhaustion.\n\nRelief at having survived the ordeal is swiftly supplanted by a deeper, lingering terror—for everyone knows she could return at any moment."
#  “哼哼……”\n\n蕾恩娜的笑声从通讯器中传来，带着几分难以捉摸的意味。她将悬在大气层外的手指缓缓收回，在太空中随意地舒展开身体，长发在无重力中静静飘散。\n\n“没想到你们这群小家伙，胆子居然这么小~”\n\n她低头俯视着这颗星球，眼神中带着几分漫不经心的怜悯。就像是一个孩子俯视着脚边受惊的小动物，既觉得有趣，又觉得有些无聊。\n\n“嘛……”\n\n她歪着头，若有所思地看了片刻，然后轻轻叹了口气。\n\n“嘛，这样吧，我就饶了你们这次吧。”\n\n她的语气轻描淡写，仿佛这个决定对她来说轻如鸿毛。她将身体慵懒地侧过来，用一只手随意地托着下巴，另一只手的指尖漫无目的地在星球周围划着弧线。\n\n星球上，所有人都在等待着她的下一句话。\n\n“不过呢……”她的声音突然变得悠长。\n\n她将那根闲不住的手指轻轻点在大气层边缘，带起一阵微微的震颤。地面上刚刚站起身来的人们又不由自主地僵在了原地。\n\n“我只是……”她拖长了语调，嘴角勾起一抹意味深长的弧度，“今天心情好罢了。”\n\n她的眼眸在星光下泛着柔和的光芒，却让所有人感到脊背发凉。\n\n“所以嘛，”她轻声说道，语气温柔得像是在跟老朋友道别，“我还会经常来关顾的哦~”
  gts_rainna_la_grande_first_meeting.2210.desc_alter: "\"Hehehe...\"\n\nRainna's laughter echoes over the communicator with an inscrutable edge. She slowly retracts her finger hovering outside the atmosphere and stretches out casually in space, her long tresses floating serenely in zero gravity.\n\n\"I really didn't expect you little creatures to be such scaredy-cats~\"\n\nLooking down upon the planet, a touch of indifferent pity shows in her gaze—like a child staring down at a frightened critter by her feet, finding it mildly amusing yet slightly dull.\n\n\"Well...\"\n\nTilting her head, she contemplates for a moment before letting out a soft sigh.\n\n\"Tell you what, I'll spare you this time.\"\n\nHer tone is utterly casual, as if the fate of a world were as light as a feather. Turning onto her side with lazy grace, she props her chin up with one hand while the other finger aimlessly traces arcs around the planet.\n\nDown below, the whole civilization holds its breath for what she will say next.\n\n\"However...\" Her voice drags out playfully.\n\nShe lightly taps that restless finger against the upper atmosphere, sending subtle tremors through the clouds. Citizens who had just picked themselves off the ground freeze in place once again.\n\n\"It's only that...\" She trails off, a knowing smirk curving her lips, \"...I happen to be in a good mood today.\"\n\nHer eyes glow with soft radiance beneath the starlight, yet send ice through everyone's veins.\n\n\"So then,\" she whispers in a tender tone, as if bidding farewell to an old companion, \"I'll be sure to drop by often to pay you a visit~\""
#  陨坑
  gts_rainna_la_grande_first_meeting.2211.title: "Crater"
#  “哼哼……看来这个星球上的聚居地还是挺多的嘛，究竟要将我神圣的恩泽降下在哪里好呢？”\n\n蕾恩娜玩味地晃了晃手指，将附着与星球表面的云彩搅散，带起一阵不起眼的气。微风拂过星球的表面，茂密的森林在这阵飓风中不堪一击，参天古木如同草芥般连根拔起。广袤的农田瞬间支离破碎，千百年来[Owner.GetSpeciesName]辛勤耕耘的痕迹被轻易抹去。平静的海面咆哮着掀起滔天巨浪，港口城市在这突如其来的海啸面前显得如此脆弱。\n\n这片大陆上大大小小的城市群在蕾恩娜天空般清澈的巨大的眼眸映照下，密集的聚居地、宏伟的建筑、壮丽的自然奇观以及每一个渺小的生命尽收眼底，却像尘埃般不值一提。\n\n“嗯……就这里了吧。”\n\n她的食指优雅地划过大气层，最终停在这颗星球最繁华的都市圈上方。这片区域是整个文明的心脏，容纳了最先进的科技、最庞大的人口、最重要的决策中枢。数千年的文明在此积淀，亿万人的命运在此交织。\n\n“不知道……按下去会有什么感觉呢……真是期待呢~”\n\n她的指尖触地面。大地在瞬间凹陷，城市群如同被巨锤击中的玻璃般四分五裂。地壳深处的岩浆喷涌而出，与坍塌的建筑融为一体。数千年的文明成就在她的神赐之下化作化为尘埃，只剩下大陆中心刚刚形成的巨大的天坑。\n\n“嘛，这可是我的恩赐哦~”
  gts_rainna_la_grande_first_meeting.2211.desc: "\"Hehehe... seems this planet has quite a lot of settlements. Where should I bestow my divine grace, I wonder?\"\n\nRainna playfully wiggles her finger, scattering the clouds clinging to the planet's surface and stirring up an unassuming breeze. Yet as that 'breeze' sweeps across the surface, lush forests crumble before the gale, ancient trees uprooted like weeds. Vast farmlands are torn to shreds in an instant, millennia of laborious toil by the [Owner.GetSpeciesName] effortlessly erased. Placid seas roar into towering surges, coastal harbor cities proving utterly defenseless against the sudden tsunami.\n\nReflected in Rainna's vast, sky-clear eyes, cities large and small across the continent—dense population centers, grand architectural wonders, magnificent natural spectacles, and every minuscule living soul—are all laid bare, yet regarded as nothing more than dust.\n\n\"Mmm... right here, then.\"\n\nHer index finger traces an elegant path through the atmosphere, coming to a halt directly over the planet's most prosperous metropolitan heartland. This region is the core of their entire civilization, housing their most advanced technology, greatest population, and paramount seat of government. Millennia of cultural legacy gathered here, where the destinies of hundreds of millions intertwined.\n\n\"I wonder... what it feels like to press down... I can't wait~\"\n\nHer fingertip touches the crust. The earth caves in instantly, cities shattering like glass struck by a sledgehammer. Magma surges from the mantle, mingling with collapsing megastructures. Millennia of civilizational achievement are reduced to ashes beneath her divine gift, leaving behind only an immense chasm newly gouged into the center of the continent.\n\n\"Well, that was my divine blessing, you know~\""
