#  文件的内容形形色色，大多是日常的行政往来文书，却在字里行间透露出这个流亡文明的面貌。以下是其中几份保存较为完整的片段：\n\n“亲爱的市长女士：\n\n我是……地区的农业代表。今年当地的农作物收成情况良好，农民工作积极性高涨，粮食实际产量远超预期，已足以供给整个地区本年度的储备需求。\n\n愿我们早日返航，回到曾经的家园。\n\n谨启\n……女士”\n\n“工业技术专利申请书\n\n……经过反复测试与验证，该修改方案可以有效提高燃料利用率，预计节省消耗约……\n\n本技术愿向所有个人与企业免费开放使用，不设任何限制。\n\n愿我们早日返航，回到曾经的家园。”\n\n“亲爱的……女士：\n\n我是……企业的负责人。我方申请在……地区参与采矿工作，相关资质证明随函附上，敬请审阅。\n\n愿我们早日返航，回到曾经的家园。\n\n谨启\n……先生”\n\n这些文书涉及农业、工业、资源开采，内容各异，却有一个共同点——每一份文件的结尾，都写着同样的那句话。\n\n“愿我们早日返航，回到曾经的家园。”\n\n不知道是官方规定，还是某种自发形成的传统。但显然，无论是市长、工程师还是普通的商人，他们都没有忘记自己来自哪里。
  gts_rainna_la_grande_arch.08_3_small.desc: "The documents covered diverse topics, mostly everyday administrative correspondence, yet between the lines shone the spirit of this civilization in exile. Below are several well-preserved fragments:\n\n\"Dear Madam Mayor:\n\nI am the agricultural delegate for District... The harvest this season has yielded exceptional crops, farmer morale is high, and output far exceeded projections, sufficient to fulfill our regional stockpile requirements for the entire year.\n\nMay we soon set sail, and return to our former home.\n\nRespectfully,\nMadam...\"\n\n\"Industrial Patent Application\n\n...Following extensive trials and verification, this revised scheme effectively boosts fuel efficiency, estimated to reduce consumption by approximately...\n\nWe hereby dedicate this technology freely to all citizens and enterprises without restriction.\n\nMay we soon set sail, and return to our former home.\"\n\n\"Dear Madam...:\n\nI am the director of Enterprise... We hereby apply to undertake mining operations in District... Qualification certificates are enclosed for your perusal.\n\nMay we soon set sail, and return to our former home.\n\nRespectfully,\nMr...\"\n\nSpanning agriculture, industry, and resource extraction, these varied documents shared a single striking commonality: every one concluded with the exact same phrase:\n\n\"May we soon set sail, and return to our former home.\"\n\nWhether an official mandate or an organic custom, it was clear that mayors, engineers, and common traders alike had never forgotten where they truly belonged."
#  这段信号的解码过程异常困难。最终还原除了两端音频。\n\n“嘿嘿……真是爽爆了呢。足底只需要在地上轻轻摩擦，城市一样的地毯就被抹得干干净净。看我一脚能踩死几亿人呢……唔，这个星球已经没有活人了，去看看另一颗吧……”\n\n“我的……我要吻您的足趾，被黑色长筒袜包裹的白皙足趾……，您还在生我的气吗？那都是奴仆的错。……我错了……您惩罚我，好不好？求求您了……”\n\n信号在最后几个字处出现明显的频率抖动与失真，像被某种强烈的情绪剧烈干扰。科研人员在确认译文后，没有人立刻发言。
  gts_rainna_la_grande_arch.08_4_giant.desc: "Decoding this transmission proved exceptionally difficult, ultimately recovering two separate audio segments:\n\n\"Hehe... this feels absolutely incredible. Just rubbing the soles of my feet gently across the dirt, and a city spread out like a carpet gets wiped clean away. Look at how many hundreds of millions I can squash beneath a single foot... Mmm, no more living things left on this world, let's go check the next one...\"\n\n\"My... I want to kiss your toes, those fair toes encased in black stockings... Are you still angry with me? It was all your servant's fault... I was wrong... Punish me, won't you? Please, I beg of you...\"\n\nThe transmission suffered heavy frequency jitter and distortion during the final words, as if warped by overwhelming emotion. Having verified the translation, none of the researchers spoke for a long time."
