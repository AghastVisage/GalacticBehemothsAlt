#  蕾恩娜看着那些密密麻麻的运输飞船缓缓向她靠近，两根手指漫不经心地将整支舰队捏碎，碎屑在太空中静静飘散。\n\n她低头看了看指尖，眉头微微皱起。\n\n“嘛……”\n\n她的声音变得有些冷淡，原本慵懒的姿态悄然变得危险。\n\n“才这么点人，真是不够尽兴呢……”\n\n她没有再说什么，只是将目光重新落在这颗星球上。两只被白色长筒丝袜紧紧包裹的足底从两侧缓缓靠近，足趾若有所思地轻轻蜷曲了一下，巨大的阴影重新笼罩了整颗星球。\n\n“要我看……”她轻声说道，语气平静得像是在陈述一件无关紧要的事，“还不如玩一下你的星球呢。”\n\n两只白丝足底缓缓贴上了星球的两侧，轻轻地、慢慢地将双足向内收拢，就像是在感受某件精致的小东西。足弓的弧线完美地贴合着星球的曲率，丝袜的细密纹路印在大气层上，投下无数细密的阴影。\n\n她微微低头，透过双腿的间隙俯视着被夹在足底之间的星球，眼神中带着几分玩味。\n\n星球表面开始感受到来自两侧均匀而持续的压力。大气层在这种压迫下开始不安地涌动，狂风在两极呼啸而起。海面掀起巨浪，山脉在震动中簌簌落石。城市里的警报声再度响彻天际，人们仰望着天空，看着那两片洁白的足底将整个视野完全占据。\n\n蕾恩娜轻轻晃动了一下足趾。\n\n丝袜的边缘轻柔地蹭过大气层，带起一阵温和的气流，却让沿途的云层支离破碎。她似乎在仔细感受着足底传来的触感，嘴角微微上扬。\n\n“嗯……”\n\n她低低地应了一声，语气中带着几分若有所思的满足。足底继续缓慢地收紧。地壳开始发出低沉的轰鸣，第一道细小的裂缝悄然从赤道附近延伸开来。岩浆从裂缝深处透出微弱的红光，像是星球内部某种绝望的呼吸。\n\n她就这样将星球轻轻夹在双足之间，不紧不慢地感受着足底的触感，像是在把玩一件有趣的小玩意儿。她轻微地蹭动一下，让丝袜的纹路在地表留下新的印记。然后微微收紧，让星球发出新的轰鸣，又松开一些。\n\n“嗯……感谢款待哦~”\n\n蕾恩娜满意地抬起双足，留下满目疮痍的地面。
  gts_rainna_la_grande_first_meeting.31242.desc: "Watching the dense swarm of transport vessels slowly approach her, Rainna casually crushed the entire fleet between two fingers, leaving debris drifting silently in outer space.\n\nShe glanced down at her fingertips, her brow furrowing slightly.\n\n\"Well...\"\n\nHer voice turned chilly, her previously relaxed demeanor subtly taking on a dangerous edge.\n\n\"With so few people, it's really not enough to enjoy myself...\"\n\nShe said nothing more, merely turning her gaze back upon the planet. Two soles snugly clad in white thigh-high stockings crept inward from both flanks, her toes curling in thoughtful contemplation as colossal shadows once again enveloped the world.\n\n\"Seems to me...\" she murmured softly, her tone as calm as though stating an utterly trivial fact, \"...I might as well just play with your planet instead.\"\n\nBoth white-stockinged soles slowly pressed against the planet's sides, gently, agonizingly drawing inward, as if handling a delicate little trinket. The curve of her arches contoured perfectly to the globe's curvature, the fine weave of the stockings casting millions of minute shadows upon the atmosphere.\n\nTilting her head slightly, she looked down through the gap between her legs at the world trapped between her soles, amusement dancing in her eyes.\n\nThe planetary surface began feeling an even, relentless pressure from both flanks. The atmosphere began churning in distress under the strain, violent gales howling across the poles. Tsunamis surged across oceans; mountains shuddered with cascades of falling rock. City sirens wailed once more across the heavens as people looked up, watching the pristine white soles conquer their entire field of vision.\n\nRainna gave her toes a gentle wiggle.\n\nThe edges of her stockings brushed softly across the atmosphere, stirring a gentle breeze that tore traveling clouds to shreds. She seemed to carefully savor the sensations radiating from her soles, her lips curling faintly.\n\n\"Mmm...\"\n\nShe murmured softly, her tone carrying thoughtful contentment. Her soles continued to tighten slowly. The crust emitted a low, rumbling roar as the first tiny fracture quietly branched out near the equator. Magma glowed faintly from deep within the fissure, like some desperate, dying gasp from the core of the world.\n\nCradling the planet between her feet, she unhurriedly enjoyed the tactile sensation against her soles, like someone fiddling with an entertaining little toy. She rubbed slightly, letting the stocking weave carve fresh marks across the surface. Then she tightened her grip, coaxing fresh roars from the crust, before loosening slightly once more.\n\n\"Mmm... thanks for the treat~\"\n\nRainna raised her feet with satisfaction, leaving behind a surface scarred beyond recognition."
#  皈依——接受
  gts_rainna_la_grande_first_meeting.31311.title: "Conversion — Accepted"
#  “哼~”\n\n蕾恩娜轻哼一声，嘴角带着几分满意的弧度。\n\n“既然你们如此虔诚，那么我决定……”\n\n四周静了下来。星球上的每一个人都屏住了呼吸，等待着那个将决定他们命运的答案。\n\n“接受你们对我虔诚的心吧~”\n\n她的双足缓缓从星球两侧挪开，足趾有些玩味地活动了一下，让最后一片阴影从地表消退。阳光重新洒在那些破碎的大陆上。\n\n“毕竟这个宇宙里面可没有几个人能够认可我的仁慈呢。”\n\n她托着下巴，俯视着这颗劫后余生的星球，眼神中带着几分罕见的平静。\n\n“不过嘛，”\n\n她的声音重新变得轻快，“既然你们要侍奉于我，那就得像样一点哦~”\n\n她伸出一根手指，悬在了这颗星球的上方。\n\n“你们的经典里不是说了吗，我是来审判有罪之人的。”她咯咯地笑了起来，“那就好好想想该用什么方式来表达你们的虔诚吧。”\n\n蕾恩娜有些玩味地双手交叉。\n\n“我可是很期待的呢……”\n\n星球上，宗教领袖们面面相觑，随即跪倒在地，带领着信众们齐声诵念起祷词。那声音越来越大，越来越整齐，穿透大气层向太空中涌去，如同一首献给新神的圣歌。\n\n蕾恩娜听着那此起彼伏的祷告声，满意地眯起眼睛。\n\n“很好。”
  gts_rainna_la_grande_first_meeting.31311.desc: "\"Hmph~\"\n\nRainna let out a soft hum, her lips curving with an amused arc of satisfaction.\n\n\"Since you're so pious, I've decided...\"\n\nSilence fell all around. Every soul on the planet held their breath, awaiting the answer that would dictate their destiny.\n\n\"...to accept your devoted hearts~\"\n\nHer feet slowly drew back from either side of the planet, her toes playfully flexing as the last shadows receded from the surface. Sunlight spilled once more across the fractured continents.\n\n\"After all, barely anyone in this universe truly recognizes my benevolence.\"\n\nResting her chin on her hand, she looked down upon the surviving world, her eyes carrying a rare calm.\n\n\"However,\"\n\nHer tone turned lively again, \"...since you intend to serve me, you'd better do it properly~\"\n\nShe extended a finger, hovering it directly above the planet.\n\n\"Didn't your scriptures say that I've come to judge the guilty?\" She giggled. \"Then you'd better think carefully about how best to express your devotion.\"\n\nRainna crossed her arms with playful anticipation.\n\n\"I'm really quite looking forward to it...\"\n\nBelow on the planet, religious leaders exchanged glances, then prostrated themselves, leading the faithful in chanting unified prayers. The chorus grew louder, more harmonious, surging through the atmosphere into outer space like a sacred hymn dedicated to a new god.\n\nListening to the rising tide of prayer, Rainna narrowed her eyes with satisfaction.\n\n\"Very good.\""
#  我们的新信仰建立了。
  gts_rainna_la_grande_first_meeting.31311.a: "Our new faith has been established."
#  愿女神垂怜。
  gts_rainna_la_grande_first_meeting.31311.a_tooltip: "May the Goddess have mercy."
#  皈依——拒绝
  gts_rainna_la_grande_first_meeting.31312.title: "Conversion — Rejected"
#  “哼~”\n\n一声轻哼从宇宙中传出，带着几分不屑。\n\n四周静了下来。星球上的每一个人都屏住了呼吸，等待着那个将决定他们命运的答案。\n\n“你们这群小东西，居然还敢攀附于我。真是可笑。”\n\n蕾恩娜眯起眼睛，将巨大的面庞凑近这颗星球，湖泊般的蓝色眼眸中闪过一丝明显的轻蔑。\n\n“跪在我面前祈求宽恕的文明超过了天空中的星星……”她的声音变得冷淡而危险。“若是几句好听的话就能打发我，那岂不是太简单了？”\n\n她的双足不自觉地向星球两侧压下。巨大的阴影再度笼罩了整片天空，足底接触大气层之前产生的气流就已经将地面上的一切席卷殆尽。建筑物在这阵狂风中轰然倒塌，树木被连根拔起，海面掀起滔天巨浪。\n\n“崇拜我可是需要资格的。”\n\n她的声音轻描淡写，却让人不寒而栗。\n\n“而你们……”\n\n巨大的足底毫无阻碍地压在了地面上，深深陷入地壳之中。整颗星球在这难以想象的压力下剧烈震颤，赤道地带被挤压得向外鼓起，无数条裂缝如蛛网般从两极向中心蔓延，岩浆从深处喷涌而出。\n\n“可不配。”\n\n星球在沉默中碎裂成数块，残骸无声地散入太空。\n\n蕾恩娜看着那些漂散的碎片，随意地活动了一下足趾。\n\n“呀，下辈子吧。”
  gts_rainna_la_grande_first_meeting.31312.desc: "\"Hmph~\"\n\nA soft snort drifted across the cosmos, dripping with disdain.\n\nSilence fell everywhere. Every soul on the planet held their breath, awaiting the answer that would determine their fate.\n\n\"You little things dare presume to fawn upon me? Laughable.\"\n\nRainna narrowed her eyes, bringing her titanic visage close to the planet, a flash of blatant scorn in her lake-blue eyes.\n\n\"The civilizations that have knelt before me begging for mercy outnumber the stars in the sky...\" Her voice turned chilly and dangerous. \"If a few pretty words were enough to appease me, wouldn't that be far too simple?\"\n\nHer feet pressed down instinctively upon both flanks of the planet. Monstrous shadows swallowed the heavens once more, the atmospheric currents stirred before contact even occurred wiping out everything across the surface. Buildings collapsed into rubble beneath the fierce gale, trees were uprooted, and monstrous tsunamis roared across the oceans.\n\n\"Worshiping me requires worthiness.\"\n\nHer words were delivered with airy nonchalance, yet chilled everyone to the bone.\n\n\"And you...\"\n\nColossal soles pressed effortlessly into the earth, sinking deep into the planetary crust. The entire globe convulsed violently under unimaginable pressure, the equator bulging outward while spiderweb fractures raced from poles to center, magma erupting from the depths.\n\n\"...are not worthy.\"\n\nThe planet shattered into several chunks in absolute silence, its debris dispersing into the vacuum.\n\nLooking upon the drifting fragments, Rainna casually wiggled her toes.\n\n\"My, better luck in your next life.\""
#  通讯器的另一边沉默了很久，久到星球上的每一个人都以为她已经离开了。\n\n然后她开口了。\n\n“你们……”\n\n她的声音很轻，轻得几乎听不见。但那种轻，不是温柔、不是戏谑，而是某种更危险的东西。\n\n“你们这群两面三刀的家伙还有资格在我面前提‘虔诚’二字？”\n\n她的双足从两侧猛然压下，没有任何预兆，没有任何铺垫。足弓直接砸碎了大气层，巨大的冲击波在接触地面之前就已经将地表上的一切夷为平地。\n\n“我见过无数文明跪在我面前。”她的声音依然很轻，却带着一种令人窒息的冷意。\n\n她停顿了一下。\n\n“无耻。”\n\n足底毫不留情地压进地壳，星球在这股力量下几乎没有任何挣扎，直接从内部开始崩裂。岩浆从裂缝中喷涌而出，大陆板块在瞬间断裂、错位。\n\n蕾恩娜全程没有再说一句话。\n\n星球碎裂成数块，残骸散入太空。\n\n她抬起足底，看了一眼，随即将视线移开，就像看到了什么不值得多费眼神的东西。
  gts_rainna_la_grande_first_meeting.31313.desc: "The other end of the transmitter remained silent for a long time—so long that everyone on the planet thought she had already departed.\n\nThen, she spoke.\n\n\"You...\"\n\nHer voice was faint, so soft it was nearly inaudible. But that softness was not gentleness, nor playful teasing—it was something far more lethal.\n\n\"Do two-faced wretches like you truly believe you have any right to utter the word 'piety' before me?\"\n\nHer feet slammed down from both sides without warning, without preamble. Her arches shattered the atmosphere outright, the massive shockwaves leveling everything on the surface before physical contact was even made.\n\n\"I have seen countless civilizations grovel before me.\" Her voice remained quiet, yet carried a suffocating chill.\n\nShe paused.\n\n\"Shameless.\"\n\nHer soles pressed mercilessly into the crust; the planet offered virtually no resistance under this force, rupturing from the inside out. Magma erupted through the fractures as continental plates snapped and shifted in an instant.\n\nRainna did not speak another word throughout the entire ordeal.\n\nThe planet shattered into several fragments, its wreckage scattering into outer space.\n\nShe raised her feet, glanced at them, and promptly looked away, as though she had seen something unworthy of another glance."
#  对不起，我们不应亵渎您。
  gts_rainna_la_grande_first_meeting.31312.a: "We apologize, we should not have blasphemed against You."
#  拒绝皈依——宽恕
  gts_rainna_la_grande_first_meeting.31321.title: "Refuse Conversion — Forgiven"
#  “啧……”\n\n通讯器另一端传来蕾恩娜耐人寻味的声音，整个氛围在这一刻达到了令人窒息的高峰。\n\n星球上的每一个人都屏住了呼吸。\n\n她的足趾在星球两侧轻轻活动了一下，那两片遮天蔽日的足底随时可能压下来。丝袜的纹路在大气层上投下细密的阴影，随着她足趾的每一次蜷曲而微微晃动。\n\n“看在你们这次态度还算诚恳的份上……”\n\n她停顿了一下，似乎在考虑某件有趣的事情。\n\n“我暂且接受吧。”\n\n她的双足缓缓向外移开了一些，压迫感稍稍减轻。星球上不知道多少人同时松了一口气。\n\n然而就在这时，蕾恩娜的双足突然向内一贴，毫无预兆地压在了星球的两侧。足弓的弧线与星球的曲率完美贴合，白色丝袜的细密纹路瞬间印在了地表上，在两片大陆上留下两个巨大而清晰的凹坑。\n\n“不过作为补偿……就让我的足底贴贴吧~”\n\n她开始轻柔地揉搓。\n\n这个动作看似温和，却让整颗星球都感受到了难以承受的摩擦力。白色丝袜的纹路在地表反复摩擦，所经之处的城市群被悉数卷入足底与地面之间，在这柔软而致命的摩擦中化为细碎的粉末，紧紧嵌入丝袜的纤维之间。\n\n她的足底缓缓在地表游走。足弓扫过连绵的山脉，峰顶在这轻柔的触碰下悄然坍塌；足跟压过广袤的平原，千里沃土在瞬间下陷，化作一道深邃的弧形凹槽；足趾则更加灵活，在密集的城市群间轻盈地点动、蜷曲，将一座座繁华的都市如同玩具积木般轻易推倒，碾入土地之中。\n\n“嗯……”\n\n蕾恩娜低低地应了一声，声音中带着若有所思的满足。她微微调整着角度，让足底的每一寸肌肤都能充分感受到地表的触感。丝袜在摩擦中逐渐沾染上了大量灰尘与碎屑，那些曾经是城市、森林、海岸线的东西，如今都成了足底的污渍。\n\n她将足底轻轻向外滑动，带走了地表上最后一层残存的建筑群，将它们扬入大气层，形成一道诡异的尘埃云雾。\n\n然后，她满意地将双足抬起。\n\n星球已经面目全非。两侧各有大半个半球的地表被摩擦得光滑而平整，那些曾经繁华的大陆如今只剩下被丝袜纹路完美拓印下来的巨大痕迹，像是某种奇异的艺术品。岩浆从新生的裂缝中缓缓流淌，填补着那些深邃的凹槽。\n\n“嗯，真舒服呢。”\n\n蕾恩娜看着足底沾染的那些碎屑，满意地眯起眼睛。\n\n“就这样吧。”
  gts_rainna_la_grande_first_meeting.31321.desc: "\"Tsk...\"\n\nRainna's enigmatic voice came over the transmitter, ratcheting the tension to a suffocating peak.\n\nEveryone on the planet held their breath.\n\nHer toes flexed lightly against the planet's sides; those two sky-blotting soles could crush down at any second. The texture of her stockings cast intricate shadows upon the atmosphere, trembling slightly with every curl of her toes.\n\n\"Seeing how earnest your attitude was this time...\"\n\nShe paused, seemingly pondering an amusing thought.\n\n\"I'll accept it for now.\"\n\nHer feet slowly drew back slightly, the suffocating pressure easing somewhat. Countless people across the world let out a collective sigh of relief.\n\nYet at that exact moment, Rainna's feet snapped inward without warning, pressing flush against the planet's flanks. The curve of her arches contoured perfectly to the globe, the fine weave of her white stockings imprinting instantly into the earth, leaving two colossal, sharp depressions across the two continents.\n\n\"Though as compensation... my soles want some snuggles~\"\n\nShe began to knead and rub gently.\n\nThat movement seemed tender, yet subjected the entire world to unbearable friction. The weave of her white stockings ground relentlessly against the surface; cities in their path were swallowed between foot and earth, ground down into fine powder by that soft yet lethal abrasion and packed tightly into the fabric's fibers.\n\nHer soles wandered slowly across the terrain. Her arches swept over mountain ranges, summits crumbling silently at her touch; her heels bore down upon sprawling plains, fertile lands caving in instantly to form deep, curved trenches; her toes moved with even greater agility, tapping and curling across dense urban sprawls, toppling glittering metropolises like toy blocks and grinding them into the dirt.\n\n\"Mmm...\"\n\nRainna gave a low, purring murmur, her tone carrying thoughtful contentment. She adjusted her angle slightly, ensuring every inch of her soles fully experienced the texture of the ground. Her stockings gradually became stained with immense amounts of dust and debris—everything that had once been cities, forests, and coastlines was now merely grime on her soles.\n\nShe slid her soles outward with a gentle glide, sweeping away the final surviving layer of structures and flinging them into the atmosphere, forming a bizarre cloud of dust.\n\nThen, satisfied, she lifted her feet.\n\nThe world was unrecognizable. Over half the surface on either hemisphere was polished smooth and flat; those once-thriving continents were now colossal imprints sculpted with the pattern of stocking fibers, like some strange work of art. Magma flowed sluggishly from newly carved chasms, pooling into the deep trenches.\n\n\"Mmm, that felt wonderful.\"\n\nLooking at the debris coating her soles, Rainna narrowed her eyes with satisfaction.\n\n\"That'll do.\""
#  拒绝皈依——惩罚
  gts_rainna_la_grande_first_meeting.31322.title: "Refuse Conversion — Punished"
#  “嗯……”\n\n蕾恩娜温和地应了一声，语气平静得出奇，仿佛这只是一件再寻常不过的小事。\n\n星球上的人们还没来得及庆幸，就看到那两只足底以远超之前的速度向内合拢。\n\n“那么~就接受我的惩罚吧。”\n\n两只足底毫不留情地踏在了星球两侧，将整颗星球死死夹住。白色丝袜与地表接触的瞬间，大气层被瞬间撕裂，狂风呼啸着向四面八方逃窜。\n\n她开始揉搓。\n\n没有任何怜悯，也没有任何克制。足底在地表大幅度来回滑动，每一次摩擦都将地表上的一切扫荡殆尽。城市群在足底的推进下如同沙堆般垮塌，碎屑被卷入丝袜的纤维之间。山脉在足弓下被反复碾压，最终化为平整的粉末。海洋在足底的温度下迅速蒸发，只留下龟裂干涸的海床在高温中扭曲变形。\n\n蕾恩娜的足趾开始不耐烦地蜷曲、张开，每一次动作都在地表留下新的沟壑。她微微加大力道，足底深深陷入地壳之中，岩浆从四处涌出，在丝袜边缘汽化成滚烫的蒸汽。\n\n“哼……”\n\n她轻轻应了一声，语气依然温和，却让人心惊。\n\n她将双足向内猛地一收。\n\n“咔嚓。”\n\n一声沉闷的脆响，从星球内部传出。一道巨大的裂缝从赤道附近炸开，将整颗星球撕裂成几块，勉强还维持着原来的形状，却已经是强弩之末。岩浆从裂缝深处汹涌而出，将那几块残骸染成暗红色。\n\n蕾恩娜缓缓将双足抬起，低头打量着那几块勉强合在一起的残骸，若有所思地歪了歪头。\n\n“嘛……”\n\n她随意地活动了一下足趾，抖落足底沾染的碎屑。\n\n“就这样吧。”
  gts_rainna_la_grande_first_meeting.31322.desc: "\"Mmm...\"\n\nRainna offered a gentle acknowledgement, her voice startlingly calm, as if this were the most routine, everyday matter.\n\nBefore the people on the planet even had time to feel relieved, they saw those two soles closing inward with speed far exceeding before.\n\n\"In that case~ accept my punishment.\"\n\nBoth soles slammed mercilessly against the planet's sides, pinning the entire world in a death grip. The moment white stockings touched the surface, the atmosphere ruptured instantly, hurricanes fleeing howling in all directions.\n\nShe began to grind.\n\nWithout a shred of mercy, without the slightest restraint. Her soles slid broadly back and forth across the globe, each rub scouring away everything on the surface. City clusters collapsed like sand dunes beneath her advancing feet, debris swallowed into the stocking fibers. Mountains were crushed repeatedly under her arches, reduced to flat powder. Oceans evaporated swiftly under the heat of her soles, leaving behind parched, cracked seabeds warping under the extreme temperature.\n\nRainna's toes began to curl and splay with growing impatience, each motion gouging fresh trenches into the earth. She increased her pressure slightly, her soles sinking deep into the crust; magma welled up everywhere, vaporizing into scalding steam along the edges of her stockings.\n\n\"Hmph...\"\n\nShe murmured softly, her tone still gentle, yet terrifying beyond measure.\n\nWith sudden force, she squeezed both feet inward.\n\n\"CRACK.\"\n\nA dull, hollow snap resonated from deep within the core. A monstrous fissure tore across the equator, cleaving the entire planet into several pieces that barely held together—a spent shell on the brink of total ruin. Magma poured violently from the chasm's depths, bathing the remnants in dark crimson.\n\nRainna slowly raised her feet, looking down at the barely assembled chunks, tilting her head thoughtfully.\n\n\"Well...\"\n\nShe casually flexed her toes, shaking loose the debris clinging to her soles.\n\n\"That'll do.\""
#  请您宽恕我们的罪行……
  gts_rainna_la_grande_first_meeting.31322.a: "Please forgive our transgressions..."
#  蕾恩娜在太空中慵懒地伸了个懒腰。\n\n“嘛……”\n\n她低头看了看这颗已经满目疮痍的星球，眼神中带着几分漫不经心的倦意，就像是一个玩腻了玩具的孩子。那些深深的足印、遍布大陆的裂缝、蒸发殆尽的海洋，在她眼中不过是一幅普通得不能再普通的风景。\n\n“差不多了吧。”\n\n她在太空中翻了个身，将这颗星球甩到了视野边缘，开始漫不经心地整理自己飘散的长发。\n\n“你们这颗星球嘛……”她随口说道，语气平淡得像是在评价一道普通的菜肴，“还算有点意思，不过也就这样了。”\n\n她的目光已经开始游向更远处的星海，那些遥远的星系在她眼中闪烁着隐约的光芒，似乎比眼前这颗残破的星球更能引起她的兴趣。\n\n她就这样静静地漂浮在太空中，看了片刻那片遥远的星海，然后不紧不慢地活动了一下足趾，将附着在白色丝袜上的最后一点碎屑抖落。那些碎屑如同黑色的雪花，无声地飘向星球残破的地表。\n\n“嘛，那就这样吧~”\n\n她的身影开始缓缓移动，庞大的身躯在星光中逐渐远去。没有任何正式的道别，没有任何特别的交代，就像是一个过客离开了一个不值得留恋的地方。\n\n地面上的幸存者们仰望着那个越来越小的身影，不知道该松一口气，还是继续保持恐惧。有人跪坐在废墟上，有人茫然地站在原地，更多的人只是沉默地望着那片逐渐恢复平静的天空。\n\n就在所有人都以为她真的要离开的时候——\n\n“哦，对了。”\n\n她忽然停了下来，头也不回地说道，声音轻描淡写。\n\n“我还会回来的哦~”\n\n她顿了顿，像是在想什么有趣的事情，嘴角不自觉地勾了起来。\n\n“下次嘛……说不定会更有意思呢~”
  gts_rainna_la_grande_first_meeting.31991.desc: "Rainna stretched lazily in outer space.\n\n\"Well...\"\n\nShe looked down at the devastated planet, her eyes tinged with the careless boredom of a child who had grown tired of a toy. Those deep footprints, continental fissures, and boiled-away oceans were nothing more than an utterly mundane view to her.\n\n\"That's about enough.\"\n\nRolling over in the void, she tossed the planet to the periphery of her vision, casually smoothing her drifting hair.\n\n\"As for this world of yours...\" she remarked offhandedly, her tone as flat as someone critiquing an ordinary meal, \"...it was somewhat amusing, but that's about it.\"\n\nHer gaze was already wandering toward the deeper sea of stars, where distant galaxies shimmered with faint light, seemingly far more capable of holding her interest than the ruined sphere before her.\n\nShe floated quietly in space for a moment, watching the distant cosmos, then unhurriedly flexed her toes to shake loose the final traces of debris clinging to her white stockings. The dust fell like black snowflakes, drifting silently toward the planet's scarred surface.\n\n\"Well, that's that then~\"\n\nHer silhouette began to move slowly, her colossal figure receding into the starlight. No formal farewell, no special instructions—just a traveler leaving a place not worth lingering in.\n\nBelow, survivors stared up at the shrinking figure, unsure whether to breathe a sigh of relief or remain terrified. Some knelt on the rubble, some stood dazed where they were, while most merely watched the sky gradually returning to peace in silence.\n\nJust when everyone thought she was truly leaving—\n\n\"Oh, that reminds me.\"\n\nShe suddenly paused, speaking without turning back, her tone breezy and casual.\n\n\"I'll be back, okay~?\"\n\nShe paused, as though struck by an amusing thought, her lips curving upward unconsciously.\n\n\"Next time... might be even more fun~\""
#  蕾恩娜将视线从这颗星球上收回，在太空中懒懒地舒展了一下身体。\n\n“嘛……”\n\n她打了个哈欠，用手背轻轻遮了遮嘴，神情慵懒而随意。她低头最后看了一眼那颗满目疮痍的星球，就像随手翻完了一本不太有趣的书，随手合上，不打算再翻第二遍。\n\n“玩得差不多了。”\n\n她没有任何留恋地将身体转向了更深处的星海。巨大的身影在移动时带起一阵微弱的气流，让星球的大气层最后颤抖了一次。\n\n“你们这颗星球……”她随口说着，声音已经带上了几分飘远的意味，“倒是挺好玩的。”\n\n她的长发在太空中慢慢舒展开来，如同一片正在消散的星云。她也不再看这颗星球，目光已经落在了更远处某个不知名的方向。\n\n星球上的人们就这样看着她的背影越来越小，越来越模糊，沉默地等待着什么。\n\n“嘛，对了……”\n\n她忽然轻轻地应了一声，语气随意得像是刚刚想起来一件小事。\n\n“我有空再来哦。”\n\n没有回头，没有停顿，那句话就这样漫不经心地飘散在星海里。\n\n然后她真的走了。\n\n星球上重新恢复了久违的寂静。天空中什么都没有了，只剩下稀薄的阳光透过破碎的大气层照下来，落在那片沉默的废墟上。
  gts_rainna_la_grande_first_meeting.31991.desc_alter: "Rainna drew her gaze back from the planet, stretching lazily in the void.\n\n\"Well...\"\n\nShe yawned, delicately covering her mouth with the back of her hand, her expression languid and carefree. She cast one final look down upon the devastated world, like someone closing a mildly boring book with no intention of reading it again.\n\n\"That was enough playing.\"\n\nWithout lingering attachment, she turned toward the deeper star-sea. The subtle draft stirred by her massive movement gave the atmosphere one final jolt.\n\n\"This planet of yours...\" she mused aloud, her voice already carrying the faint echo of distance, \"...was actually pretty fun.\"\n\nHer long hair unfurled slowly in space, like a dissipating nebula. She looked at the planet no more, her eyes fixed on some unknown destination far beyond.\n\nThe people below watched her retreating silhouette grow smaller and fainter, silently waiting for something.\n\n\"Oh, right...\"\n\nShe suddenly murmured, her tone casual, as if recalling a minor errand.\n\n\"I'll drop by when I have free time~\"\n\nWithout turning back, without stopping, those words drifted carelessly into the cosmic sea.\n\nAnd then, she truly left.\n\nA long-lost silence returned to the world. Nothing remained in the sky except pale sunlight filtering through the shattered atmosphere, bathing the silent ruins below."
#  星球的残骸在太空中静静漂浮着，那几块被严重压扁的碎块已经失去了原本的形状，只剩下冷却中的岩浆在表面缓缓流淌。\n\n蕾恩娜低头看了看那些碎片，歪了歪头。\n\n“嘛……”\n\n她随意地将一块较大的残骸用足底轻轻踩住，开始漫不经心地来回搓揉。白色丝袜与岩石表面摩擦，将那块残骸碾得越来越细碎，碎屑如同黑色的粉末般向四周飘散。她的动作悠闲而随意，就像是在无聊时踢散一堆落叶。\n\n“比想象的还脆呢……”\n\n她自言自语着，将足底抬起，看了看丝袜上新添的污渍，不甚在意地活动了一下足趾，让那些细碎的岩石粉末随之飘散。\n\n她又随手拨弄了一下漂浮在旁边的另一块残骸，让它在太空中缓缓旋转，就这样看了片刻，然后失去了兴趣。\n\n“嘛，就这样吧。”\n\n她的身影开始向更深的星海移动，声音越来越远。\n\n“下次找个结实一点的星球好了……”\n\n她喃喃地自言自语着，身影逐渐消失在星海之中。只剩下那些大小不一的碎块，在她曾经驻足的地方静静漂浮着。
  gts_rainna_la_grande_first_meeting.31992.desc: "The planet's wreckage drifted quietly in space, its severely flattened fragments warped beyond recognition, with cooling magma flowing sluggishly across their surfaces.\n\nRainna looked down at the pieces, tilting her head.\n\n\"Well...\"\n\nShe casually stepped on a larger chunk with her sole, lazily rubbing it back and forth. The friction between white stocking and rock ground the chunk finer and finer, dust dispersing outward like black powder. Her movements were relaxed and leisurely, like someone casually kicking through a pile of dead leaves out of boredom.\n\n\"Even more fragile than I thought...\"\n\nshe muttered to herself, lifting her sole to inspect the new smudges on her stocking. Carelessly flexing her toes, she let the pulverized rock dust drift away.\n\nShe idly nudged another drifting fragment nearby, sending it spinning slowly into space, watched it for a few moments, and lost interest.\n\n\"Well, that's that.\"\n\nHer silhouette began moving toward the deeper cosmos, her voice drifting farther away.\n\n\"Next time, I should find a sturdier planet...\"\n\nshe murmured to herself as she vanished into the star-sea, leaving behind fragments of varying sizes drifting quietly in the void where she had once paused."
#  碎裂的星球残骸在太空中无声地漂散着，那些曾经是大陆、海洋、城市的东西，如今都化作了形状不规则的岩石碎块，在原地缓慢地旋转着。\n\n蕾恩娜看着这片残骸，沉默了片刻。\n\n“嘛……”\n\n她用指尖轻轻拨开一块漂过来的碎片，让它向更远处飘去。\n\n“坏掉了。”\n\n她的语气平静而随意，就像是打碎了一个不太珍贵的小摆件。她在太空中慵懒地伸了个懒腰，将视线从这片残骸上移开，望向了更远处的星海。\n\n“也没什么意思了。”\n\n她转过身，长发在无重力中缓缓飘散，逐渐遮住了那片残骸的轮廓。\n\n“下次嘛……”她漫不经心地自言自语着，声音越来越轻，“找个大一点的，应该更好玩吧……”\n\n她的身影在星光中慢慢淡去。残骸在她离去时带起的微弱气流中轻轻晃动，随即重归寂静，散落在这片曾经有过无数生命的虚空之中。
  gts_rainna_la_grande_first_meeting.31992.desc_alter: "Shattered planetary wreckage drifted soundlessly through space. What had once been continents, oceans, and cities were now jagged, irregular chunks of stone, rotating slowly in place.\n\nRainna looked upon this debris, falling silent for a moment.\n\n\"Well...\"\n\nWith a fingertip, she nudged a floating fragment aside, sending it drifting farther into the dark.\n\n\"It broke.\"\n\nHer voice was calm and careless, like someone who had broken an inexpensive little ornament. She stretched languidly in space, turning her gaze away from the wreckage toward the distant cosmos.\n\n\"Not much fun anymore.\"\n\nTurning away, her long hair drifted in zero gravity, gradually shielding the outline of the shattered field.\n\n\"Next time...\" she mused aloud, her voice growing fainter and fainter, \"...finding a bigger one should be more fun, right?\"\n\nHer figure slowly faded into the starlight. The wreckage swayed gently in the faint drafts left by her departure, then settled back into absolute silence, scattered across the void where countless lives had once thrived."
#  蕾恩娜在太空中满意地舒展了一下身体，低头最后看了一眼这颗星球。\n\n“嘛……”\n\n她的嘴角带着几分漫不经心的满足。\n\n“就这样吧。”\n\n她的语气轻描淡写，仿佛刚才那场险些到来的灾难只是一个微不足道的小插曲。她将身体转向星海深处，白色丝袜在星光下划过一道柔和的弧线。\n\n“不过下次嘛……”她顿了顿，语气变得有些意味深长，“我可就不会这么温柔了。”\n\n“毕竟你们也没把我当朋友……”\n\n她的身影在星光中缓缓消散，只留下那颗在劫后余生中颤抖的星球，静静地悬浮在太空之中。
  gts_rainna_la_grande_first_meeting.31993.desc: "Rainna stretched her body contentedly in space, taking one last look down at the world.\n\n\"Well...\"\n\nThe corners of her mouth curled with nonchalant satisfaction.\n\n\"That's good enough.\"\n\nHer tone was airy and offhand, as though the catastrophe that had nearly unfolded was merely an insignificant footnote. Turning toward the deep cosmic expanse, her white stockings traced a soft arc in the starlight.\n\n\"Though next time...\" She paused, her voice turning subtly ominous, \"...I won't be this gentle.\"\n\n\"After all, you didn't really treat me like a friend either...\"\n\nHer silhouette dissolved slowly into the starlight, leaving behind a trembling, surviving world floating quietly in the dark of space."
#  蕾恩娜俯视着这颗刚刚宣誓皈依的星球，眼神中没有任何温柔，只有一种居高临下的冷淡。\n\n“嗯。”\n\n她轻轻地应了一声，就像是在确认一件无关紧要的事情。\n\n“你们现在是我的了。”\n\n这句话说得平静而随意，却让每一个听到的人都感到一阵寒意。不是神明接纳信徒时应有的慈悲，也没有任何庇护的承诺——只是一种近乎冷酷的占有。\n\n“记住这一点。”\n\n她将身体转向星海深处，长发在无重力中缓缓飘散。她没有留下任何印记，没有降下任何恩泽，就这样平静地离去，像是一个将猎物收入囊中的猎手，随手关上了笼子的门。\n\n“我可是会再次降临的。”\n\n这一次，没有语气词，没有轻快的尾音。只是一句陈述，冷静而确定。\n\n星球上，信众们跪在地上，久久没有起身。没有人知道该如何面对这样的神明——她接受了他们的皈依，却没有给予任何回应，没有任何慈悲，没有任何光辉。\n\n只有那句“你们现在是我的了”，在每个人心中沉甸甸地压着。
  gts_rainna_la_grande_first_meeting.31996.desc: "Rainna looked down at the world that had just sworn its conversion to her, her eyes devoid of tenderness, radiating only cold, towering condescension.\n\n\"Mmm.\"\n\nShe murmured softly, as though acknowledging an utterly mundane matter.\n\n\"You belong to me now.\"\n\nThe words were spoken calmly and carelessly, yet sent a chill down the spine of every listener. It was not the mercy expected of a deity welcoming new followers, nor did it carry any promise of shelter—merely a ruthless declaration of ownership.\n\n\"Remember that.\"\n\nTurning toward the deep star-sea, her hair drifted slowly in zero gravity. She left no mark, bestowed no grace, departing in quiet solitude like a hunter securing prey in a cage before casually shutting the door.\n\n\"I will be descending again.\"\n\nThis time, there were no playful particles, no cheerful lilt. Just a statement: cool, calm, and certain.\n\nBelow, the faithful remained prostrate on the ground, not rising for a long time. No one knew how to face such a deity—she had accepted their conversion, yet offered no response, no benevolence, and no divine radiance.\n\nOnly that chilling sentence—\"You belong to me now\"—weighed like lead upon every heart."
#  踩踏破坏
  gts_rainna_la_grande_random.01.title: "Trampling Destruction"
#  “哼哼~又见面了呢~”\n\n那个熟悉的声音从通讯器中传来，轻快而随意，仿佛只是在跟老朋友打招呼。太空中，蕾恩娜巨大的身影缓缓显现，她慵懒地漂浮在这颗星球的上方，长发在星光中飘散。\n\n“嘛，还记得我吗？”\n\n她歪着头，那双湖泊般的眼眸俯视着这颗渺小的星球，眼神中带着几分玩味。\n\n“我知道你们肯定记得我的~毕竟我这么难忘嘛~”\n\n她咯咯地笑了几声，随即像是想起了什么，语气变得轻快起来。\n\n“啊，对了。我这次来呢，是因为最近有点无聊。”\n\n她的手指在大气层外轻轻晃动，带起一阵扰动云层的气流。\n\n“你们这颗星球看起来还挺热闹的嘛~所以我就想啊，来找你们玩一玩，应该不介意吧？”\n\n她的声音依然温柔，却让每一个听到的人都感到脊背发凉。
  gts_rainna_la_grande_random.01_1.desc: "\"Heh-heh~ We meet again~\"\n\nThat familiar voice crackled over the transmitter, breezy and casual, as if greeting an old friend. In outer space, Rainna's colossal form slowly materialized, floating languidly above the planet, her long hair drifting in the starlight.\n\n\"Well, do you remember me?\"\n\nTilting her head, her lake-like eyes looked down upon the tiny world, a spark of amusement in her gaze.\n\n\"I know you definitely remember me~ I'm pretty unforgettable, after all~\"\n\nShe giggled a few times, then seemed to recall something as her tone turned cheery.\n\n\"Oh, right. The reason I came by today is because I've been a little bored lately.\"\n\nHer finger waved lightly just outside the atmosphere, creating atmospheric turbulence that scattered the clouds below.\n\n\"Your planet looked quite lively, so I thought, coming to play with you a bit shouldn't be a problem, right?\"\n\nHer voice remained gentle, yet sent icy shivers down the spine of everyone listening."
#  太空中，一个庞大的身影逐渐清晰。\n\n“你们好呀~我又回来咯~”\n\n蕾恩娜俏皮的声音在通讯频道中回荡。她将巨大的面庞凑近星球，那双清澈的眼眸里闪烁着好奇的光芒，像是在观察一件久违的玩具。\n\n“我看看啊……嗯，你们这段时间发展得还不错嘛~又建了不少新的小房子呢~”\n\n她满意地点了点头，语气里带着几分类似长辈的欣慰，只是这份"欣慰"透着说不出的诡异。\n\n“不过嘛……”\n\n她的声音突然一转，嘴角勾起一抹意味深长的笑容。\n\n“建得这么漂亮，不踩一踩多可惜呀~”\n\n她慵懒地抬起一只脚，那洁白的足底在星光下泛着柔和的光泽，缓缓移向星球的上方，投下一片遮天蔽日的阴影。\n\n“所以呢，这次就让我好好欣赏一下你们的‘成果’吧~”\n\n“你们可要让我满意哦~”
  gts_rainna_la_grande_random.01_2.desc: "In outer space, a colossal silhouette gradually came into focus.\n\n\"Hello there~ I'm back again~\"\n\nRainna's playful voice echoed across the communications channel. She brought her titanic face close to the planet, her clear eyes gleaming with curious fascination, like someone examining a long-unseen toy.\n\n\"Let me see... mmm, you've developed pretty well during this time~ built quite a few new little houses, haven't you~\"\n\nShe nodded with satisfaction, her tone tinged with something resembling an elder's approval—though that \"approval\" felt sickeningly sinister.\n\n\"Though...\"\n\nHer voice suddenly shifted, an enigmatic grin playing on her lips.\n\n\"...building them so prettily, wouldn't it be such a pity not to step on them~?\"\n\nLazily raising a bare foot, her pristine white sole gleaming with soft luster under the starlight, she slowly moved it directly over the planet, casting a shadow that blotted out the sun.\n\n\"So this time, let me have a nice look at your 'accomplishments'~\"\n\n\"You'd better keep me satisfied, okay~?\""
#  她想做什么？
  gts_rainna_la_grande_random.01.a: "What does she want to do?"
#  踩踏——城市
  gts_rainna_la_grande_random.02.title: "Trample — Cities"
#  “嗯……先从哪里开始呢~”\n\n蕾恩娜歪着头，那双巨大的眼眸在星球表面缓缓扫过，最终落在了一片灯火通明的区域——那是这颗星球上最繁华的城市群之一，无数的建筑鳞次栉比，从太空望去像是一片闪烁的光海。\n\n“啊，这里看起来最热闹了……”\n\n她的声音里带着几分愉悦，随即抬起了一只裸足。那洁白的足底在星光下泛着柔和的光泽，缓缓移向那片城市群的上方，遮天蔽日的阴影瞬间笼罩了整片大陆。\n\n地面上，无数人仰望着天空中那片逐渐逼近的白色，警报声响彻每一个角落，却没有任何意义。\n\n“那就……”\n\n她轻轻一踩。\n\n足底触及地表的瞬间，整片大陆都为之震颤。那些密密麻麻的城市、那些高耸的建筑、那些奔逃的生命，在这轻柔的一触之下悉数化为齑粉，被压入地壳深处。当她抬起足底时，原本繁华的城市群已经不复存在，只剩下一个巨大而完美的足印，边缘还在渗出滚烫的岩浆。\n\n“嗯~不错。”
  gts_rainna_la_grande_random.02_1.desc: "\"Hmm... where should I start first~\"\n\nRainna tilted her head, her massive eyes sweeping slowly across the planetary surface, ultimately landing on a brightly illuminated region—one of the world's most prosperous urban sprawls, where countless buildings stood shoulder to shoulder, resembling a sparkling sea of light from orbit.\n\n\"Ah, this place looks the liveliest...\"\n\nDelight tinged her voice as she raised a bare foot. Her spotless sole shimmered with soft radiance under the starlight, hovering slowly above the metropolis as an immense shadow swallowed the entire continent.\n\nDown on the surface, millions stared up at the approaching expanse of white. Sirens screamed across every corner, utterly futile.\n\n\"Down we go...\"\n\nShe stepped down lightly.\n\nThe moment her sole made contact with the surface, the entire continent shuddered. Densely packed cities, soaring high-rises, and fleeing lives were all pulverized to powder beneath that gentle touch, pressed deep into the crust. When she lifted her sole, the formerly thriving metropolis was gone, leaving only a gigantic, perfect footprint whose edges still oozed boiling magma.\n\n\"Mmm~ not bad.\""
#  蕾恩娜俯视着这颗星球，目光在那些密集的光点之间游移，像是在挑选一件称心的玩具。\n\n“你们的城市建得可真密呀~”\n\n她轻声感叹着，语气里带着几分孩童般的好奇。她伸出手指，虚虚地点向星球表面那片最为繁华的区域，那里聚集着这颗星球上大半的人口与文明成果。\n\n“就是这里了~”\n\n她优雅地抬起一只裸足，饱满的足底缓缓下压。狂暴的气流在足底接触地表之前就已经席卷了整片大陆，摩天大楼在飓风中如积木般崩塌，海面掀起数千米高的巨浪。\n\n然后，足底落下。\n\n那一整片城市群——连同其中数以亿计的生命——在瞬间被彻底抹去。地壳承受不住这难以想象的压力，无数条裂缝如蛛网般蔓延开来，岩浆从深处喷涌而出，将那片曾经繁华的土地染成一片暗红。\n\n蕾恩娜缓缓抬起足底，端详着足底沾染的细碎尘埃，满意地眯起了眼睛。\n\n“消失得干干净净呢~真好~”
  gts_rainna_la_grande_random.02_2.desc: "Rainna looked down upon the planet, her gaze drifting among the dense clusters of light, like someone selecting an appealing toy.\n\n\"You've built your cities so densely~\"\n\nShe marveled softly, her voice tinged with childlike curiosity. She extended a finger, aiming it loosely toward the most bustling region across the surface, where the majority of the planet's population and civilization gathered.\n\n\"Right here then~\"\n\nGracefully raising a bare foot, she slowly pressed her full sole downward. Violent atmospheric gales swept across the entire continent before physical contact was even made, skyscrapers toppling like building blocks in the hurricane while oceans hurled waves thousands of meters high.\n\nAnd then, her sole descended.\n\nThat entire cluster of cities—along with hundreds of millions of lives within—was completely wiped out in an instant. The crust could not withstand such unfathomable pressure; spiderweb fissures radiated outward, magma spewing from the depths to dye the formerly thriving land a dark crimson.\n\nRainna slowly lifted her foot, scrutinizing the fine dust clinging to her sole, narrowing her eyes with satisfaction.\n\n\"Vanished without a trace~ How lovely~\""
#  可恶！
  gts_rainna_la_grande_random.02.a: "Damn it!"
#  可怕……
  gts_rainna_la_grande_random.02.b: "Terrifying..."
#  踩踏——发电区
  gts_rainna_la_grande_random.03.title: "Trample — Generator District"
#  “唔……那边闪闪发光的是什么呀？”\n\n蕾恩娜的目光落在了一片布满发电设施的大陆上。那里矗立着密密麻麻的反应堆与能量塔，无数的能量导管纵横交错，在夜色中泛着幽幽的蓝光，像是一片人造的星海。\n\n“看起来亮晶晶的，应该是太阳能板吧？”\n\n她好奇地抬起裸足，饱满的足底缓缓压向那片区域。当足底触及地表的瞬间，那些精密的发电设施在难以想象的压力下接连崩塌，反应堆的能量核心被压碎，迸发出刺目的强光。\n\n一连串的能量失控在足底之下接连引爆，形成了一片壮观却致命的光海。蕾恩娜似乎被这景象吸引，愉快地眨了眨眼。\n\n“哼，这下小人没有电脑玩咯。”\n\n她抬起足底，那片曾经为整颗星球提供能源的区域，此刻只剩下一个焦黑的巨坑，残余的电流还在坑底断断续续地闪烁着。
  gts_rainna_la_grande_random.03.desc: "\"Mmm... what's that glittering over there?\"\n\nRainna's gaze settled upon a continent covered in power generation infrastructure. Dense arrays of reactors and energy spires stood tall, crisscrossed by countless energy conduits that glowed with faint blue light in the night, like a man-made sea of stars.\n\n\"Looks so sparkly, must be solar panels, right?\"\n\nCuriously raising a bare foot, she slowly pressed her full sole toward that region. The moment her sole touched the surface, those intricate power facilities collapsed under unthinkable pressure, reactor energy cores crushing and bursting with blinding light.\n\nA cascading chain of energy meltdowns detonated beneath her sole, creating a magnificent yet lethal sea of light. Seemingly captivated by the spectacle, Rainna blinked happily.\n\n\"Hmph, now the tinies won't have any computers to play on.\"\n\nShe raised her foot. What had once powered an entire world was now only a scorched, colossal crater, residual electrical arcs still flickering intermittently at the bottom."
#  踩踏——采矿区
  gts_rainna_la_grande_random.04.title: "Trample — Mining District"
#  蕾恩娜的目光扫过一片满是采矿设施的大陆。巨大的矿井深入地下，纵横的开采轨道和高耸的精炼塔遍布其间，那是这颗星球最重要的资源产地之一。\n\n“这里光秃秃的，应该是采矿区吧~”\n\n她歪着头，饶有兴致地打量着那些深邃的矿井。\n\n“真好奇下面有什么好东西呢~”\n\n她伸出抬起裸足，轻轻挪到向那片矿区的上空，压下。仅仅是足底的轻轻一碾，那些深入地下的矿井便瞬间坍塌，精炼塔如同折断的火柴般纷纷倒下，采矿设备连同其中的一切被碾入地层，深藏地下的矿脉被生生挤压、扭曲。\n\n“嗯……这下里面的小人应该都死光了吧……”\n\n她收回足趾，那片曾经繁忙的矿区已经彻底沦为一片被翻搅过的废土。
  gts_rainna_la_grande_random.04.desc: "Rainna swept her gaze across a continent covered in mining facilities. Colossal mine shafts plunged deep underground, crisscrossed by extraction rails and towering refining spires—one of the planet's vital resource hubs.\n\n\"It's so barren here, must be a mining district~\"\n\nTilting her head, she examined the abyssal shafts with keen interest.\n\n\"I wonder what kind of nice goodies are buried down there~\"\n\nShe raised a bare foot, shifting it above the mining district, and pressed down. With merely a light grind of her sole, the deep mine shafts collapsed instantly, refining towers tumbling like snapped matchsticks, mining machinery crushed into the strata along with everything inside, while deep underground mineral veins were warped and crushed under her weight.\n\n\"Mmm... all the tinies inside should be completely dead by now...\"\n\nShe drew back her toes, leaving the once-busy mining district an utterly churned wasteland."
#  踩踏——农业区
  gts_rainna_la_grande_random.05.title: "Trample — Agriculture District"
#  “那边绿油油的一大片，看起来好舒服呀~”\n\n蕾恩娜的目光落在了一片广袤的农业区上。金黄的麦浪与翠绿的田野交织成一幅绵延千里的画卷，那是这颗星球赖以为生的粮仓。\n\n“感觉踩上去一定很软吧~”\n\n她带着几分期待，将裸足的足底轻轻压向那片田野。饱满的足底陷入柔软的土地，将大片的农田尽数覆盖。庄稼在足底之下被碾成碎屑，肥沃的土壤被压得结结实实，纵横的灌溉渠道悉数崩裂。\n\n她愉快地用足底在田野上蹭了蹭，感受着那份柔软的触感。\n\n“嗯~果然很软呢，踩起来好舒服~”\n\n当她抬起足底时，那片曾经生机盎然的粮仓已经变成了一片贫瘠的荒地，深深的足印中再也长不出任何东西。\n\n“嘛，这下小人肯定没吃的咯。”
  gts_rainna_la_grande_random.05.desc: "\"That huge green patch over there looks so comfy~\"\n\nRainna's gaze settled upon a sprawling agricultural zone. Golden waves of wheat and emerald pastures wove into a tapestry spanning thousands of miles—the breadbasket keeping this planet alive.\n\n\"Stepping on it must feel so soft~\"\n\nWith eager anticipation, she pressed the sole of her bare foot gently against the fields. Her full sole sank into the supple soil, blanketing vast tracts of farmland. Crops were ground to powder beneath her foot, fertile soil packed solid, and crisscrossing irrigation channels shattered.\n\nDelightedly rubbing her sole against the fields, she relished the soft tactile sensation.\n\n\"Mmm~ it really is so soft, feels so good to step on~\"\n\nWhen she lifted her foot, the once-vibrant breadbasket had been turned into barren wasteland, unable to grow anything ever again within that deep footprint.\n\n\"Well, now the tinies definitely won't have anything to eat.\""
#  离开
  gts_rainna_la_grande_random.06.title: "Departure"
#  蕾恩娜在太空中伸了个懒腰，低头看了看这颗留下了新足印的星球。\n\n“嘛，今天玩得还挺开心的~”\n\n她随意地活动了一下足趾，将附着的尘埃抖落，那些细碎的残骸如同黑雪般飘向地表。\n\n“你们这颗星球还是老样子嘛，每次来都有点新东西可以玩~”\n\n她慵懒地转过身，长发在星光中缓缓舒展。\n\n“好啦，我先走咯~”\n\n她的声音已经带上了几分飘远的意味。\n\n“记得好好把坑填一填哦~下次我来的时候，可不想看到一片乱糟糟的样子呢~”\n\n她顿了顿，语气里带着几分轻快的威胁。\n\n“嗯，我还会再来的~你们等着我哦~”\n\n她的身影缓缓消失在星海之中，只留下那颗新添了伤痕的星球，在寂静中默默旋转。
  gts_rainna_la_grande_random.06_1.desc: "Rainna stretched in outer space, looking down at the world bearing her fresh footprints.\n\n\"Well, I had quite a lot of fun today~\"\n\nShe casually wiggled her toes, shaking off adhering dust as fine debris drifted toward the surface like black snow.\n\n\"This planet of yours is the same as ever—always something new to play with each time I visit~\"\n\nTurning lazily, her long hair unfurled slowly in the starlight.\n\n\"Alright, I'll be off then~\"\n\nHer voice carried the faint resonance of growing distance.\n\n\"Remember to fill in the craters nicely~ Next time I come by, I don't want to see a messy ruin~\"\n\nShe paused, her tone tinged with a lighthearted threat.\n\n\"Mmm, I'll definitely be back~ Be waiting for me, okay~?\"\n\nHer silhouette slowly faded into the cosmic sea, leaving behind a scarred world spinning silently in the void."
#  “呼……差不多该走了呢~”\n\n蕾恩娜满意地打量着自己刚刚"欣赏"过的成果，那双清澈的眼眸里带着几分慵懒的餍足。\n\n“今天的收获还不错嘛~”\n\n她慵懒地在太空中翻了个身，将这颗星球甩到了视野边缘。\n\n“你们也别太难过啦~”她的声音里带着几分漫不经心的安慰，“毕竟能被我临幸……可是你们的荣幸哦~”\n\n她咯咯地笑了几声，随即将目光投向了更远处的星海。\n\n“嘛，那就下次再见咯~”\n\n“在那之前，你们要好好的哦~”她俏皮地眨了眨眼，“多建点漂亮的东西，等我下次回来欣赏~”\n\n她的身影逐渐远去，那句轻飘飘的话语久久回荡在通讯频道中，让每一个听到的人都无法真正松一口气。\n\n因为所有人都清楚——她真的还会回来。
  gts_rainna_la_grande_random.06_2.desc: "\"Phew... about time to get going~\"\n\nRainna looked over the results she had just \"admired\" with satisfaction, her clear eyes filled with languid contentment.\n\n\"Today's harvest was pretty good~\"\n\nShe lazily rolled over in space, tossing the planet to the edge of her vision.\n\n\"Don't be too sad, now~\" Her voice carried offhand consolation. \"After all, being graced by my presence... is an honor for you~\"\n\nShe giggled a few times, then cast her gaze toward the distant cosmos.\n\n\"Well, see you next time then~\"\n\n\"Take good care of yourselves until then, okay~?\" She gave a saucy wink. \"Build lots of pretty things for me to admire when I come back~\"\n\nAs her silhouette gradually receded, those airy words lingered long across the communications channel, leaving everyone who heard them unable to breathe a true sigh of relief.\n\nBecause everyone knew—she really would return."
#  她总算走了……
  gts_rainna_la_grande_random.06.a: "She finally left..."
#  碾压破坏
  gts_rainna_la_grande_random.11.title: "Crushing Destruction"
#  “安啦安啦，我又来了哦~”\n\n蕾恩娜俏皮地眨了眨眼，慵懒地在太空中调整着姿势。她将双腿缓缓移向这颗星球的两侧，那两只洁白的裸足从两个方向悄然逼近，饱满的足底泛着柔和的光泽。\n\n“这次的玩法嘛……”\n\n她歪着头，嘴角勾起一抹意味深长的笑容。\n\n“我想试试把你们夹在中间会是什么感觉呢~”\n\n两只足底在星球两侧缓缓合拢，遮天蔽日的阴影从两个方向同时笼罩下来。地面上的人们仰望着天空，看着那两片越来越近的白色，绝望地意识到，这一次已经无处可逃。\n\n“来吧，让我好好‘感受’一下你们~”
  gts_rainna_la_grande_random.11_1.desc: "\"Don't worry, don't worry, I'm back again~\"\n\nRainna gave a playful wink, lazily adjusting her posture in space. She slowly guided her legs toward either side of the planet, two pristine bare feet closing in quietly from opposite directions, her full soles gleaming with soft radiance.\n\n\"As for how we play this time...\"\n\nTilting her head, an enigmatic smile graced her lips.\n\n\"I want to see what it feels like to squeeze you between my feet~\"\n\nHer two soles slowly closed in around the planet, colossal shadows descending from both sides at once. Down on the surface, people stared up into the sky at the encroaching expanses of white, hopelessly realizing that this time, there was nowhere left to run.\n\n\"Come now, let me properly 'feel' you~\""
#  “嘛，好久不见呢……”\n\n蕾恩娜俯视着这颗渺小的星球，眼神中带着几分玩味的好奇。\n\n“你们这颗小球球，看起来正好呢~”\n\n她慵懒地舒展开身体，将双足缓缓移向星球的两端。那洁白的足底在星光下显得格外柔和，却带着无可抗拒的压迫感，一点一点地向内靠拢。\n\n“就像这样，夹在我的脚中间~”\n\n她的声音里带着几分期待，双足的距离越来越近，星球被夹在两片巨大的足底之间，显得愈发渺小。大气层在这种双向的压迫下开始不安地涌动，狂风在星球两极呼啸而起。\n\n“嗯……让我想想要用多大力气呢~”\n\n她俏皮地晃了晃足趾，那个轻微的动作让整颗星球都为之震颤。\n\n“太轻了没意思，太重了又怕玩坏了……"她咯咯地笑着，"这个分寸，可得好好把握才行呢~”
  gts_rainna_la_grande_random.11_2.desc: "\"Well, long time no see...\"\n\nRainna looked down upon the tiny world, playful curiosity dancing in her eyes.\n\n\"This little ball of yours looks just the right size~\"\n\nShe lazily stretched her limbs, slowly moving both feet toward opposite poles of the planet. Those pristine white soles looked remarkably soft beneath the starlight, yet brought an irresistible pressure, closing inward inch by inch.\n\n\"Just like this, pinched right between my feet~\"\n\nHer voice carried eager anticipation as the distance between her feet steadily shrank, the planet appearing increasingly minuscule between those two colossal soles. The atmosphere began to churn anxiously under this two-way squeeze, violent gales howling across the poles.\n\n\"Mmm... let me think how much force I should use~\"\n\nShe playfully wiggled her toes, that subtle gesture making the entire planet tremble.\n\n\"Too light is boring, but too hard might break it...\" She giggled. \"I really have to gauge the pressure just right~\""
#  轻柔碾压
  gts_rainna_la_grande_random.12.title: "Gentle Crushing"
#  蕾恩娜的双足轻轻贴在了星球的两侧。\n\n只是这轻柔的一贴，星球两端最大的两片大陆便瞬间承受不住那难以想象的压力。饱满的足底覆盖了整片陆地，那些密集的城市、绵延的山脉、蜿蜒的河流，在足底与地表接触的刹那间被悉数压平，化作紧贴在足底纹路里的一层薄薄的痕迹。\n\n大地发出不堪重负的轰鸣，两片大陆的边缘绽开无数道裂缝，岩浆从深处缓缓渗出。\n\n“嗯……”\n\n蕾恩娜低低地应了一声，感受着足底传来的细微触感，眼中带着几分餍足的笑意。\n\n“这个力度刚刚好呢~”\n\n她没有继续加力，只是让双足轻轻贴着星球，享受着这份微妙的触感。星球在两片足底之间轻轻颤抖着，勉强维持着完整——至少，它还没有碎。
  gts_rainna_la_grande_random.12_1.desc: "Rainna's feet rested gently against either side of the planet.\n\nYet at that mere gentle touch, the two largest continents at both poles gave way under unimaginable pressure. Her full soles blanketed the entirety of the landmasses; dense cities, soaring mountain ranges, and winding rivers were flattened the instant sole met surface, reduced to a thin trace pressed flush into the ridges of her skin.\n\nThe earth roared beneath the unbearable weight, countless fissures rupturing along continental borders as magma seeped sluggishly from the depths.\n\n\"Mmm...\"\n\nRainna gave a low murmur, savoring the subtle tactile feedback against her soles, her eyes brimming with contented amusement.\n\n\"This pressure is just right~\"\n\nShe didn't add more force, merely resting her feet against the world, enjoying the delicate sensation. The planet trembled softly between her soles, barely maintaining its integrity—at least it hadn't shattered yet."
#  两只洁白的足底从两个方向缓缓贴上了星球的表面。\n\n蕾恩娜控制着力度，只是让足底轻轻压在星球两端的大陆上。然而即便是这样"轻柔"的接触，对这颗渺小的星球来说也是一场灭顶之灾。\n\n被足底覆盖的两片大陆瞬间塌陷，摩天大楼、城市、道路，连同其中的一切，都在这轻轻一贴之下被压入地壳深处。地表上那些曾经繁华的痕迹消失得无影无踪，只留下两片与足底完美贴合的凹陷。\n\n“啊……感觉到了呢~”\n\n蕾恩娜愉快地眨了眨眼，能清楚地感受到足底之下那两片大陆的崩塌。\n\n“你们的小房子，在我脚下碎掉的感觉，还挺特别的~”\n\n她轻轻晃动了一下足底，感受着地表传来的细微摩擦，随即停了下来，满意地维持着这个姿势。星球被夹在双足之间，两端的大陆已经面目全非，但整体依然勉强完好。
  gts_rainna_la_grande_random.12_2.desc: "Two pristine white soles slowly pressed against opposite sides of the planet's surface.\n\nRainna controlled her strength, merely resting her soles gently upon the continents at both ends of the globe. Yet even such \"gentle\" contact proved to be an apocalyptic catastrophe for the diminutive world.\n\nThe two continents beneath her soles caved in instantly. Skyscrapers, cities, highways, and everything within were driven deep into the crust beneath that light press. The former hallmarks of civilization vanished without a trace, leaving only two depressions contoured perfectly to her soles.\n\n\"Ah... I felt that~\"\n\nRainna blinked happily, distinctly feeling the collapse of both continents beneath her feet.\n\n\"The feeling of your little houses crumbling under my feet is really quite unique~\"\n\nShe gently swayed her soles, savoring the subtle friction against the ground, then paused, contentedly holding the pose. Pitched between her feet, the continents at either pole were devastated beyond recognition, yet the sphere remained tenuously intact."
#  落雨
  gts_rainna_la_grande_random.13.title: "Falling Rain"
#  “嘛，差不多就这样吧~”\n\n蕾恩娜似乎对这份触感已经满足，缓缓将双足从星球两侧抬起。足底离开地表时，带起了大片附着的碎屑，那些曾经是城市与大陆的残骸紧紧粘在她的足底纹路之间。\n\n她在太空中将双足的足底相对合拢，然后轻轻地互相摩擦起来。\n\n足底与足底之间，那些细碎的建筑残骸、岩石碎块和尘埃被缓缓碾磨、剥落，如同一场黑色的细雨，纷纷扬扬地飘落回星球的表面，落在了蕾恩娜特意挑选的未损坏的大陆上，造成了新的一轮破坏。\n\n“呼，下雨咯~”\n\n她一边搓着足底，一边随口说着。那些从她足底落下的碎屑散落在星球的地表上，为这颗已经伤痕累累的星球又添了一层薄薄的尘埃。\n\n“好啦，干净多了~”\n\n她满意地看了看清理干净的足底，随即在太空中舒展开身体，那两片大陆的毁灭对她来说，不过是一次无关紧要的小插曲。
  gts_rainna_la_grande_random.13.desc: "\"Well, that should about do it~\"\n\nRainna seemed satisfied with the texture, slowly lifting both feet from either side of the planet. As her soles pulled away, they tore free vast sheets of clinging debris—the wreckage of former cities and continents wedged into the creases of her soles.\n\nBringing her soles together in space, she began rubbing them gently against one another.\n\nBetween her soles, the pulverized architectural fragments, shattered rock, and soot were ground down, peeling away like a fine black rain that drifted back down across the planetary surface, landing upon undamaged continents Rainna had deliberately chosen, triggering a brand-new wave of ruin.\n\n\"Phew, it's raining~\"\n\nshe remarked casually while rubbing her soles. The debris shedding from her feet showered the terrain below, adding another layer of dust to the already scarred world.\n\n\"There, so much cleaner now~\"\n\nShe admired her clean soles with satisfaction, then stretched her limbs in outer space. To her, the destruction of those two continents was merely an inconsequential little interlude."
#  摩擦
  gts_rainna_la_grande_random.14.title: "Rubbing"
#  “嗯……这个触感，好舒服呢~”\n\n蕾恩娜闭上眼睛，轻轻咬着下唇，显然十分享受足底传来的感觉。她没有停下，反而开始缓缓地、有节奏地用双足在星球表面来回摩擦起来。\n\n每一次摩擦，都让破坏进一步扩大。\n\n原本只是被压平的两片大陆，此刻在足底的反复蹭动下彻底崩解。地壳被生生撕开，大块的陆地被足底的摩擦力卷起、揉碎，混入足底的纹路之间。那些原本还残存在大陆边缘的城市，也在这一轮又一轮的摩擦中被彻底抹去。\n\n星球的轮廓在双足的挤压下微微变形，赤道地带被压得向外鼓起。地表上，无数条裂缝从两极向中心蔓延，岩浆从裂缝深处汹涌而出，将大片区域染成暗红色。\n\n“啊……感觉整颗星球都在我脚下颤抖呢~”\n\n蕾恩娜愉快地感叹着，双足摩擦的动作越来越流畅。那些曾经完好的区域，也在这场持续的蹂躏中一点点走向崩溃。\n\n当她终于停下来时，这颗星球早已面目全非——大半个表面都被摩擦得凹凸不平，只剩下星球的内核还在勉强维系着整体的形状。\n\n“嗯~这一次玩得可真尽兴呢~”
  gts_rainna_la_grande_random.14.desc: "\"Mmm... this texture feels so nice~\"\n\nRainna closed her eyes, lightly biting her lower lip, visibly relishing the sensations from her soles. Instead of stopping, she began rubbing her feet rhythmically back and forth across the planet's surface.\n\nWith each pass, the destruction widened.\n\nThe two continents that had merely been flattened now disintegrated completely beneath her repeated rubbing. The crust was torn open, colossal slabs of land rolled up and crushed by the friction, ground into the lines of her soles. The cities that had clung to the continental peripheries were wiped clean in wave after wave of abrasion.\n\nUnder the squeeze of both feet, the planetary outline warped, its equator bulging outward. Countless fissures snaked from the poles to the center, magma spewing from the depths to dye vast areas dark crimson.\n\n\"Ah... it feels like the whole world is trembling beneath my feet~\"\n\nRainna exclaimed with delight, her rubbing motion growing increasingly fluid. Those previously intact areas steadily collapsed under this continuous torment.\n\nWhen she finally halted, the world was scarred beyond recognition—most of its surface rubbed uneven and mangled, with only the core barely holding the overall shape together.\n\n\"Mmm~ I really played to my heart's content this time~\""
#  压碎
  gts_rainna_la_grande_random.15.title: "Crushed to Pieces"
#  “嗯……这种感觉好舒服~”\n\n蕾恩娜显然已经沉浸在这份触感之中。她微微收拢双腿，足底缓缓向内施压，星球在两片足底之间发出令人牙酸的呻吟。\n\n地壳开始崩裂，一道道裂缝从星球表面向内部深处蔓延，岩浆从深处喷涌而出。星球在双足的挤压下逐渐变形，勉强维系着最后的完整。\n\n“啊……快撑不住了呢~”\n\n她愉快地感受着那份阻力，双腿不自觉地又用了几分力。\n\n咔嚓。\n\n一声沉闷的脆响从星球内部传出。\n\n星球的内核终于承受不住那难以想象的压力，整颗星球在双足之间彻底碎裂开来，化作数块巨大的残骸，岩浆与尘埃从每一道裂缝中喷涌而出，在太空中缓缓扩散。\n\n“啊……”\n\n蕾恩娜微微一愣，随即歪着头看着足底之间那团正在崩解的残骸，脸上露出了几分意外的神情。\n\n“哎呀，一不小心用力过头了呢~”\n\n她将双足缓缓分开，那些碎裂的残骸在原地无助地漂浮着，再也无法拼回成一颗完整的星球。\n\n“嘛，玩坏了就玩坏了吧，反正也挺好玩的。”
  gts_rainna_la_grande_random.15.desc: "\"Mmm... this feels so good~\"\n\nRainna was clearly immersed in the tactile sensation. She drew her legs slightly inward, her soles gradually exerting pressure, causing the planet to emit agonizing groans between them.\n\nThe crust began to fracture, fissure after fissure tearing from the surface down into the depths as magma erupted outward. The planet warped under the squeeze of both feet, barely clinging to its last shreds of integrity.\n\n\"Ah... it can barely hold on anymore~\"\n\nDelighting in that resistance, she unconsciously pressed harder with her legs.\n\nCrack.\n\nA dull, crisp snap echoed from within the planet.\n\nThe planetary core finally buckled beneath the unfathomable pressure; the entire world shattered completely between her soles into massive chunks, magma and dust erupting from every fissure to drift slowly into space.\n\n\"Ah...\"\n\nRainna blinked in surprise, then tilted her head to look at the disintegrating wreckage between her feet, a startled expression on her face.\n\n\"Oops, I accidentally used too much force~\"\n\nSlowly parting her feet, the shattered wreckage drifted helplessly in place, unable ever to become a whole world again.\n\n\"Oh well, if it's broken, it's broken. It was pretty fun anyway.\""
#  玩笑
  gts_rainna_la_grande_random.16.title: "Playful Jest"
#  蕾恩娜的双足在星球两侧缓缓逼近，遮天蔽日的阴影从两个方向笼罩下来。\n\n就在足底即将贴上地表的那一刻——\n\n“……嗯……”\n\n她忽然停了下来，歪着头看着那颗被夹在双足之间瑟瑟发抖的星球。\n\n“嘛，改主意了。”\n\n她的语气里带着几分意兴阑珊，仿佛忽然对这个游戏失去了兴趣。她将双足重新分开，那逼近的阴影缓缓消退，阳光重新洒回了星球的表面。\n\n“算咯算咯，就当我是开玩笑的~”\n\n她慵懒地在太空中舒展开身体，随口说着，就像是刚刚放下了一件玩到一半却觉得无趣的玩具。
  gts_rainna_la_grande_random.16.desc: "Rainna's feet slowly closed in on either side of the planet, sky-blotting shadows descending from both directions.\n\nJust as her soles were about to touch the surface—\n\n\"...Mmm...\"\n\nShe suddenly paused, tilting her head to look at the world trembling between her feet.\n\n\"Well, changed my mind.\"\n\nHer tone carried a hint of waning interest, as if she had abruptly lost interest in the game. She pulled her feet apart, the encroaching shadows slowly receding as sunlight washed back across the planet's surface.\n\n\"Never mind, never mind—just consider it a little joke~\"\n\nShe stretched lazily in space, speaking offhandedly, like someone who had just put down a toy they found dull halfway through."
#  离开
  gts_rainna_la_grande_random.17.title: "Departure"
#  蕾恩娜在太空中慵懒地舒展了一下身体，低头看了看这颗留下了新痕迹的星球。\n\n“嘛，今天玩得挺尽兴的~”\n\n她随意地活动了一下足趾，将附着的碎屑抖落，那些细碎的残骸如同黑雪般飘向地表。\n\n“你们这颗星球，夹起来的手感还不错嘛~”\n\n她慵懒地转过身，语气里带着几分餍足的满意。\n\n“嘛，再见~”\n\n她俏皮地眨了眨眼，身影缓缓消失在星海之中,只留下那颗伤痕累累的星球在寂静中默默旋转。
  gts_rainna_la_grande_random.17_1.desc: "Rainna stretched languidly in outer space, looking down upon the world bearing fresh scars.\n\n\"Well, that was quite fun today~\"\n\nShe casually wiggled her toes, shaking loose adhering debris, the fine remnants drifting toward the surface like black snow.\n\n\"This planet of yours felt pretty nice to squeeze~\"\n\nTurning lazily, her voice carried a tone of replete satisfaction.\n\n\"Well, bye-bye~\"\n\nWith a playful wink, her figure slowly vanished into the cosmic sea, leaving behind the scarred world spinning silently in the void."
#  “呼……差不多该走了呢~”\n\n蕾恩娜满意地打量着自己的成果，那双清澈的眼眸里带着几分慵懒的餍足。\n\n“你们的表现还不错嘛~至少让我玩得挺开心的~”\n\n她慵懒地在太空中翻了个身,将这颗星球甩到了视野边缘。\n\n“下次我来的时候,可要给我准备点新花样哦~”她漫不经心地说着,“毕竟我可不想踩踩过的二手星球嘛。”。\n\n她伸了个懒腰,长发在星光中缓缓舒展。\n\n“嘛,那就下次再见咯~”\n\n“保障哦~”她的声音渐渐飘远,“期待你们把星球建设得满满的哦~”\n\n她的身影逐渐消失在星海深处。
  gts_rainna_la_grande_random.17_2.desc: "\"Phew... about time to get going~\"\n\nRainna looked over her handiwork with satisfaction, her clear eyes filled with languid contentment.\n\n\"You did pretty well~ at least you kept me entertained~\"\n\nShe lazily rolled over in space, tossing the planet to the edge of her vision.\n\n\"Next time I come, make sure you prepare some new tricks for me~\" she remarked offhandedly. \"After all, I don't want to step on a second-hand planet I've already stomped.\"\n\nShe stretched, her long hair unfurling slowly in the starlight.\n\n\"Well, see you next time then~\"\n\n\"Take care now~\" Her voice drifted into the distance. \"I look forward to seeing your planet packed full of things again~\"\n\nHer silhouette gradually dissolved into the depths of the star-sea."
#  蕾恩娜慵懒地收回了双足,在太空中舒展开身体。\n\n“嗯,今天就先放过你们吧~”\n\n她低头看了看那颗完好无损的星球,眼神里带着几分意兴阑珊的随意。\n\n“今天状态不好……”她漫不经心地说着,“等有欲望了再说。”\n\n她慵懒地转过身,长发在星光中缓缓飘散。\n\n“如果下次我心情要是不好,那就说不准会发生什么了呢~”\n\n她的身影渐渐远去。地面上的人们仰望着那片重新恢复平静的天空,没有人敢真正松一口气——因为他们清楚,这份幸运不会一直持续下去。\n\n“嘛，再见！”
  gts_rainna_la_grande_random.18.desc: "Rainna lazily withdrew her feet, stretching her body in outer space.\n\n\"Mmm, I'll let you off the hook today~\"\n\nShe looked down at the unharmed world, her gaze carrying casual disinterest.\n\n\"Not really in the zone today...\" she murmured carelessly. \"We'll talk when the urge strikes me.\"\n\nTurning lazily, her long hair drifted slowly in the starlight.\n\n\"If I'm in a bad mood next time, there's no telling what might happen~\"\n\nHer silhouette faded into the distance. Below, the people looked up into the peaceful sky, yet no one dared breathe a true sigh of relief—for they knew this stroke of fortune would not last forever.\n\n\"Well, bye-bye!\""
#  星球的残骸在太空中静静漂浮着,那几块碎裂的陆地在冷却的岩浆中缓缓旋转。\n\n蕾恩娜低头看了看那片残骸,歪了歪头。\n\n“哎呀,一不小心就玩坏了呢~”\n\n她随意地拨弄了一下漂浮在旁边的一块残骸,让它在太空中缓缓打转,语气里没有丝毫的愧疚,倒像是打碎了一个不太重要的小玩意。\n\n“嘿嘿,这颗星球也就这点承受力嘛~夹起来是挺舒服的,可惜太脆了点~”\n\n她自言自语着,将视线从那片残骸上移开,望向了更远处的星海。\n\n“下次找个结实一点的好了~”她漫不经心地说着,“这样才能玩得久一点呢~”\n\n她在太空中慵懒地伸了个懒腰,身影开始缓缓远去。\n\n“嘛,总之也算是玩得挺开心的~”\n\n那句轻飘飘的话语散在星海里,而那颗曾经孕育了无数生命的星球,如今只剩下几块无声的残骸,永远地留在了这片虚空之中。
  gts_rainna_la_grande_random.19.desc: "The planetary wreckage drifted quietly in outer space, shattered continental fragments slowly rotating amidst cooling magma.\n\nRainna looked down at the ruins, tilting her head.\n\n\"Oops, broke it without meaning to~\"\n\nShe idly nudged a drifting fragment nearby, sending it spinning through the void, without the slightest hint of guilt in her voice—sounding merely like someone who had broken an unimportant trinket.\n\n\"Heh-heh, this planet could only take so much, huh~ It felt pretty good to squeeze, but a bit too brittle~\"\n\nSpeaking to herself, she drew her eyes away from the wreckage toward the distant cosmos.\n\n\"Next time I'll find a sturdier one~\" she said offhandedly. \"That way I can play with it longer~\"\n\nStretching languidly in space, her figure began drifting away.\n\n\"Well, at least it was pretty fun~\"\n\nThose airy words dispersed into the star-sea, while the planet that had once nurtured countless lives was now reduced to a few silent fragments, lingering forever in the void."
#  腿夹破坏
  gts_rainna_la_grande_random.21.title: "Knee Squeeze Destruction"
#  “哼哼~又见面了呢~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。在她的视角中，这颗星球对她来说不过是一颗橙子般大小的小球。\n\n“最近过得怎么样呀？有没有想我呀~”\n\n她歪着头，那双湖泊般的眼眸俯视着这颗渺小的星球，眼神里带着几分玩味的笑意。\n\n“嘛，我这次来呢，是想到了一个新玩法哦~”\n\n她俏皮地眨了眨眼。\n\n“肯定能给你们增加不少伤亡呢~”
  gts_rainna_la_grande_random.21.desc: "\"Heh-heh~ We meet again~\"\n\nIn outer space, Rainna's colossal form slowly materialized. From her perspective, this planet was nothing more than an orange-sized little ball.\n\n\"How have you been lately? Did you miss me~?\"\n\nTilting her head, her lake-like eyes looked down upon the tiny world, a playful smile dancing in her gaze.\n\n\"Well, the reason I came this time is because I thought of a brand new way to play~\"\n\nShe gave a cheeky wink.\n\n\"It's definitely going to rack up plenty of casualties for you~\""
#  “嘛，就像这样……”\n\n蕾恩娜将这颗橙子般的星球移到了双膝之间，缓缓地屈起双腿，用两侧的膝盖轻轻将它夹住。\n\n星球被夹在她光滑的膝盖之间,显得愈发渺小。大气层在这轻柔的接触下开始不安地涌动,狂风在星球表面呼啸而起。\n\n“嗯……真是小巧~”\n\n她低头看着夹在膝间的星球,愉快地眨了眨眼。\n\n“这个大小,肯定会很有意思~”\n\n她微微调整着双膝的角度,让星球在膝盖之间轻轻转动,像是在把玩一颗珍贵的弹珠。\n\n“让我看看,要用多大力气才能……”
  gts_rainna_la_grande_random.22.desc: "\"Well, just like this...\"\n\nRainna moved the orange-sized planet between her knees, slowly bending her legs to pin it gently between both knees.\n\nTrapped between her smooth knees, the planet looked smaller than ever. The atmosphere began to churn anxiously under that gentle contact, gales howling across the surface.\n\n\"Mmm... so dainty~\"\n\nLooking down at the world trapped between her knees, she blinked happily.\n\n\"At this size, it's bound to be lots of fun~\"\n\nAdjusting the angle of her knees slightly, she let the planet rotate gently between them, like someone fiddling with a precious marble.\n\n\"Let me see just how much force it takes to...\""
#  “嘿嘿……用力咯~”\n\n蕾恩娜双膝微微一收。\n\n星球在两片光滑的膝盖之间发出令人牙酸的呻吟。地壳开始崩裂,一道道裂缝从表面向内部深处蔓延,岩浆从深处喷涌而出。\n\n“嗯，真舒服呢~”\n\n她愉快地感受着那份阻力,双膝又用了几分力。\n\n咔嚓。\n\n一声清脆的脆响。\n\n那颗橙子般的星球在她双膝之间彻底碎裂开来,化作数块细小的残骸,岩浆与尘埃从裂缝中喷涌而出,在膝间缓缓散开。\n\n“啊~碎了呢~”\n\n蕾恩娜低头看着膝盖之间那团崩解的残骸,满意地眯起了眼睛。\n\n“这个手感,还挺解压的嘛~”
  gts_rainna_la_grande_random.23.desc: "\"Heh-heh... here comes the squeeze~\"\n\nRainna drew her knees slightly inward.\n\nThe planet emitted an agonizing groan between her two smooth knees. The crust began to fracture, fissures tearing from the surface down into the depths as magma spewed forth.\n\n\"Mmm, feels so nice~\"\n\nEnjoying that resistance, she applied a little more force with her knees.\n\nSnap.\n\nA crisp crack.\n\nThat orange-sized planet shattered completely between her knees, breaking into small fragments as magma and dust erupted from the chasms, dispersing slowly between her knees.\n\n\"Ah~ it broke~\"\n\nLooking down at the cloud of disintegrating wreckage between her knees, Rainna narrowed her eyes contentedly.\n\n\"This texture is actually quite stress-relieving~\""
#  蕾恩娜将双腿舒展开来,看着那些从膝间飘散的细碎残骸,慵懒地伸了个懒腰。\n\n“嗯~这个新玩法感觉不错呢~”\n\n她随意地拂去膝盖上残留的碎屑,那些曾经是一整颗星球的东西,如今不过是她膝头的一点尘埃。\n\n“虽然一下就碎了,不过感觉还挺特别的~”\n\n她慵懒地转过身,望向了更远处的星海。\n\n“嘛,不过这个玩法倒还是很特别嘛……”\n\n她漫不经心地说着,身影缓缓消失在星海之中。只留下那片曾经是一颗星球的残骸,静静地漂浮在虚空里。
  gts_rainna_la_grande_random.24.desc: "Stretching her legs out, Rainna watched the fine debris dispersing from between her knees, stretching her arms languidly.\n\n\"Mmm~ this new way to play feels pretty great~\"\n\nShe casually brushed away the residual dust on her knees; what had once been an entire planet was now just a smudge of dust on her kneecaps.\n\n\"Though it broke in a flash, the sensation was quite unique~\"\n\nTurning lazily, she looked toward the distant cosmos.\n\n\"Well, that was certainly a special way to play...\"\n\nshe mused offhandedly as her figure slowly vanished into the star-sea, leaving the remnants of what was once a planet drifting quietly in the void."
#  黑丝
  gts_rainna_la_grande_random.31.title: "Black Stockings"
#  “哼哼~你们好呀，我又回来咯~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。她慵懒地漂浮在星球上方，长发在星光中飘散。\n\n只是这一次，她似乎有些不一样。\n\n她那修长的双腿上，包裹着一层乌黑的丝袜，在星光的映照下泛着柔和而神秘的光泽。她似乎对自己今天的装扮相当满意，在太空中轻轻转动着身体，像是在展示什么。\n\n“最近过得怎么样呀~有没有乖乖的呢~”\n\n她将巨大的面庞凑近星球，那双清澈的眼眸里闪烁着几分期待的光芒。\n\n“嘛，你们有没有注意到……”她俏皮地晃了晃修长的腿，“我今天有一点点不一样哦~”
  gts_rainna_la_grande_random.31.desc: "\"Heh-heh~ Hello there, I'm back again~\"\n\nIn outer space, Rainna's colossal figure slowly appeared. She floated languidly above the planet, her long hair drifting in the starlight.\n\nOnly this time, she looked a little different.\n\nHer slender legs were wrapped in a layer of pitch-black stockings, glowing with a soft, mysterious sheen under the starlight. She seemed quite pleased with her outfit today, turning her body gently in space as if showing it off.\n\n\"How have you been lately~ Have you been good little creatures~?\"\n\nBringing her titanic face close to the planet, eager anticipation danced in her clear eyes.\n\n\"Well, have you noticed...\" She playfully swung her long legs, \"...I'm a little bit different today~\""
#  蕾恩娜优雅地抬起一条腿，将那只包裹在黑色丝袜中的足悬在星球的上方，饶有兴致地展示着。\n\n黑色的丝袜紧紧贴合着她修长的腿部曲线，一直延伸到足尖。丝袜的质地细腻而光滑，在星光下泛着幽幽的光泽，透过那层薄薄的黑纱，能隐约看到肌肤的轮廓。那只包裹在黑丝中的巨足投下遮天蔽日的阴影，笼罩了小半个星球。\n\n“呐呐~你们看~”\n\n她的声音里带着几分难得的雀跃，像是一个换了新衣服想要炫耀的少女。\n\n“我新换的黑丝，好看吗？”\n\n她将那只足在星球上方轻轻转动着，让不同的角度展现在这颗渺小的星球面前，足尖调皮地晃动着。\n\n“嗯？快说说看嘛~”\n\n她期待地俯视着这颗星球，那双巨大的眼眸里闪烁着好奇的光芒。这一刻，她看起来不像是一个可怕的毁灭者，倒真的像是一个在等待夸奖的女孩。\n\n只是所有人都清楚，无论回答是什么，那只悬在头顶的巨足，随时都可能落下。
  gts_rainna_la_grande_random.32.desc: "Rainna gracefully raised one leg, holding the foot clad in a black stocking suspended above the planet, displaying it with keen interest.\n\nThe black stocking hugged the slender curves of her leg tightly all the way down to her toes. The fabric was delicate and silky, gleaming with a dark luster under the starlight; through the sheer black mesh, the faint contours of her skin were softly visible. That massive stocking-clad foot cast an immense shadow, blanketing nearly half the globe.\n\n\"Look, look~\"\n\nHer voice carried a rare burst of girlish excitement, like a young lady showing off a brand-new dress.\n\n\"Do my new black stockings look pretty?\"\n\nShe rotated her foot gently above the planet, displaying different angles to the tiny world below, her toes wiggling playfully.\n\n\"Well? Hurry up and tell me~\"\n\nShe peered down at the planet with eager curiosity gleaming in her vast eyes. In that instant, she didn't seem like a terrifying destroyer, but truly like a girl waiting for a compliment.\n\nYet everyone knew that whatever the answer, that colossal foot hovering overhead could crush down at any moment."
#  好看！
  gts_rainna_la_grande_random.32.a: "Beautiful!"
#  不好看！
  gts_rainna_la_grande_random.32.b: "Ugly!"
#  “嘿嘿~你们的眼光还不错嘛~”\n\n听到这颗星球的赞美，蕾恩娜显然心情大好，那双眼眸弯成了月牙状。\n\n“既然你们这么喜欢我的黑丝……”\n\n她的声音突然变得轻柔而危险。\n\n“那就让你们近距离好好欣赏一下吧~”\n\n她优雅地将那只包裹在黑丝中的巨足缓缓压向星球表面。黑色的丝袜穿过大气层，那细腻的纹理越来越清晰，遮天蔽日的阴影笼罩了整片大陆。\n\n足底落下的瞬间，被黑丝包裹的柔软足底轻轻贴上了地表。那些密集的城市、高耸的建筑，在丝袜与地表接触的刹那间被尽数压平，化作紧贴在黑色丝袜纹理间的一层痕迹。地壳发出沉闷的轰鸣，无数裂缝从足印边缘蔓延开来。\n\n“怎么样~我的黑丝配上你们的城市，是不是别有一番风味呀~”\n\n她愉快地蹭了蹭足底，感受着那些细碎的建筑残骸嵌入丝袜纤维的触感，满意地眯起了眼睛。\n\n“嗯~这个画面，我很喜欢呢~”
  gts_rainna_la_grande_random.33.desc: "\"Heh-heh~ You've got pretty good taste~\"\n\nHearing the planet's praise, Rainna was visibly thrilled, her eyes curving into crescent moons.\n\n\"Since you love my black stockings so much...\"\n\nHer voice suddenly grew soft and perilous.\n\n\"...then let me give you a really close look~\"\n\nShe gracefully pressed the black-stockinged giant foot toward the planet's surface. The black stocking broke through the atmosphere, its fine texture growing clearer and clearer as a sky-blotting shadow engulfed the entire continent.\n\nThe moment her foot touched down, her soft, stocking-clad sole pressed gently against the surface. Dense cities and soaring skyscrapers were crushed flat the instant fabric met ground, becoming a thin imprint adhering to the weave of the black stockings. The crust emitted a dull roar as countless fissures spread from the footprint's edge.\n\n\"Well~ my black stockings paired with your cities, doesn't it have quite a unique flavor~?\"\n\nShe happily rubbed her sole, feeling the subtle sensation of architectural debris embedding into the stocking fibers, narrowing her eyes with satisfaction.\n\n\"Mmm~ I really love this picture~\""
#  不要！
  gts_rainna_la_grande_random.33.a: "No!"
#  “欸——”\n\n蕾恩娜的声音陡然拔高，那双眼眸里满是被冒犯的错愕。\n\n“你们居然说不好看？”\n\n她气鼓鼓地鼓起了脸颊，语气里满是委屈与不满。\n\n“我特意换上的黑丝，你们竟然不懂得欣赏……真是的！”\n\n她的声音突然一转，从委屈变成了危险的甜腻。\n\n“那看来，得让你们好好‘反省’一下审美了呢~”\n\n她将那只包裹在黑丝中的巨足高高抬起，随即毫不留情地压了下来。这一次没有丝毫的温柔，被黑丝包裹的足底重重地砸在星球表面，狂暴的气流在接触地表之前就已经将整片大陆的一切席卷殆尽。\n\n足底落下，整片大陆在瞬间被彻底抹平。摩天大楼、城市、山脉，连同其中的一切，都在这愤怒的一踩之下化为齑粉，被深深压入地壳。地表迸裂开来，岩浆汹涌而出，将那片区域染成一片焦红。\n\n“哼，这就是不懂得欣赏的下场哦~”\n\n她微微撅着嘴，将足底抬起，看着那片被踩得面目全非的大陆，语气里还带着几分没消散的不满。\n\n“下次可要长好眼睛才行呢~”
  gts_rainna_la_grande_random.34.desc: "\"Ehhh—?!\"\n\nRainna's voice spiked sharply, her eyes widening with offended disbelief.\n\n\"You actually said they're ugly?!\"\n\nPouting her cheeks in indignation, her voice was rife with grievance and displeasure.\n\n\"I put on these black stockings especially for you, and you don't even know how to appreciate them... honestly!\"\n\nHer tone abruptly shifted from hurt grievance into sweet, perilous venom.\n\n\"Looks like I'll have to make you 'reflect' on your sense of aesthetics~\"\n\nLifting that black-stockinged giant foot high, she stomped down without a shred of mercy. This time there was not a trace of gentleness; the stocking-clad sole slammed violently into the planet's surface, raging shockwaves scouring everything across the entire continent before physical contact even occurred.\n\nAs her sole landed, the entire continent was wiped clean in a fraction of a second. Skyscrapers, cities, and mountain ranges, along with everything within, were pulverized to dust under that furious stomp, driven deep into the crust. The ground fractured as magma gushed violently, dyeing the region a scorched crimson.\n\n\"Hmph, that's what you get for having no taste~\"\n\nPouting slightly, she lifted her foot, looking at the utterly ruined continent, residual irritation still lingering in her tone.\n\n\"You'd better open your eyes properly next time~\""
#  “嘿嘿~你们的眼光还真不错嘛~”\n\n听到这颗星球的赞美，蕾恩娜显然心情大好，那双眼眸弯成了月牙状。她愉快地收回了悬在星球上方的巨足，在太空中轻轻晃动着修长的双腿，欣赏着自己那身黑丝。\n\n“果然还是有识货的人呢~”\n\n她满意地转了个身，让黑色的丝袜在星光下折射出柔和的光泽。\n\n“看在你们这么懂得欣赏的份上……”她俏皮地眨了眨眼，“今天就不踩你们咯~”\n\n她将双腿慵懒地收起，那遮天蔽日的阴影随之消退，阳光重新洒回了星球的表面。\n\n“能被夸奖的感觉，还挺不错的呢~”\n\n她心情愉悦地哼着某种不成调的曲子，看起来对这次的赞美相当受用。这一刻，那份危险仿佛被暂时收了起来，取而代之的是一种近乎单纯的满足。
  gts_rainna_la_grande_random.35.desc: "\"Hehe~ You guys really have great taste~\"\\n\\nUpon hearing the praises of this planet, Rainna was clearly in a wonderful mood, her eyes curling into crescents. She delightfully withdrew the colossal foot hovering above the planet, gently swinging her slender legs in the void of space while admiring her black stockings.\\n\\n\"I knew there'd be someone who appreciates quality~\"\\n\\nShe turned around with satisfaction, letting the sheer black stockings cast a soft luster under the starlight.\\n\\n\"Seeing as you know how to appreciate it so well...\" She winked playfully. \"I won't step on you today~\"\\n\\nShe lazily curled her legs back up. The sky-blotting shadow receded with her movement, and sunlight bathed the planet's surface once again.\\n\\n\"It really feels quite nice being praised like that~\"\\n\\nIn high spirits, she hummed a tuneless little melody, looking thoroughly pleased by the compliments. In that brief moment, the looming danger seemed tucked away, replaced by an almost childlike contentment."
#  蕾恩娜心满意足地打量着足底那身沾了些许尘埃的黑丝，慵懒地在太空中舒展开身体。\n\n“嗯~今天玩得挺开心的~”\n\n她轻轻抖了抖那只包裹在黑丝中的足，将附着的碎屑抖落，那些曾经是城市的残骸如同尘埃般飘向地表。\n\n“我的黑丝配上你们的星球，画面还挺不错的嘛~”\n\n她慵懒地转过身，长发在星光中缓缓飘散。\n\n“好啦，我先走咯~”她俏皮地眨了眨眼，“记得好好养养伤哦~”\n\n“下次我来的时候，说不定又会换上新的丝袜呢~到时候你们可要好好欣赏哦~”\n\n她的身影缓缓消失在星海之中，只留下那颗新添了伤痕的星球，在寂静中默默旋转。
  gts_rainna_la_grande_random.36.desc: "Rainna contentedly inspected the soles of her black stockings, which were dusted with a fine layer of debris, and stretched her body lazily in the vacuum of space.\\n\\n\"Mmm~ I had so much fun today~\"\\n\\nShe gently shook the stocking-clad foot, letting the clinging specks flutter off—debris that once constituted entire cities now drifted like fine dust toward the surface below.\\n\\n\"My black stockings look pretty good paired with your planet, don't they~\"\\n\\nShe turned languidly, her long hair drifting gently through the starlight.\\n\\n\"Alright, I'll be taking off now~\" She gave a playful wink. \"Remember to nurse your wounds properly, okay~\"\\n\\n\"Next time I come by, maybe I'll have on a brand-new pair of stockings~ Make sure you appreciate them properly when the time comes~\"\\n\\nHer figure slowly faded into the sea of stars, leaving behind a scarred planet spinning silently in the void."
#  蕾恩娜愉快地欣赏着自己那身完好如新的黑丝，慵懒地在太空中舒展开身体。\n\n“嗯~今天心情不错呢~”\n\n她低头看了看那颗完好无损的星球，眼神里带着几分难得的温和。\n\n“多亏你们这么懂得欣赏，我今天可是高兴得很呢~”\n\n她慵懒地转过身，那身黑丝在星光下泛着柔和的光泽。\n\n“嘛，那我就先走咯~”她漫不经心地说着，“你们运气不错，碰上我心情好的时候~”\n\n“不过嘛……”她俏皮地眨了眨眼，语气里带着几分轻快的威胁，“下次可别指望每次都能这么好运哦~我的心情，可是说变就变的呢~”\n\n她的身影渐渐远去。\n\n“我还会回来的~到时候再让你们欣赏我的新装扮~”\n\n她的声音在星海中缓缓消散。地面上的人们仰望着那片重新恢复平静的天空，既松了一口气，又隐隐感到不安——因为他们知道，她一定还会回来。
  gts_rainna_la_grande_random.37.desc: "Rainna happily admired her pristine black stockings, stretching her body languidly in space.\\n\\n\"Mmm~ I'm in quite a good mood today~\"\\n\\nShe glanced down at the completely unscathed planet, a rare gentleness glimmering in her gaze.\\n\\n\"Thanks to you appreciating them so well, I've had a truly delightful day~\"\\n\\nShe turned lazily, the black stockings gleaming with a soft sheen under the starlight.\\n\\n\"Well, I'll be heading out then~\" she remarked casually. \"You got lucky, catching me while I'm in such high spirits~\"\\n\\n\"Though...\" She winked playfully, her tone laced with a breezy menace. \"Don't count on being this lucky every single time~ My mood can change on a whim, you know~\"\\n\\nHer figure gradually receded into the distance.\\n\\n\"I'll be back~ Next time, I'll let you admire my new look~\"\\n\\nHer voice gently dissipated into the sea of stars. Down below, the people gazed up at the tranquil sky, breathing a collective sigh of relief while harboring an uneasy dread—for they knew, beyond any shadow of a doubt, that she would return."
#  脚踩袜
  gts_rainna_la_grande_random.41.title: "Stirrup Stockings"
#  “嘿嘿~我又回来咯~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。这颗星球对她来说不过是一颗乒乓球般大小的小球，渺小得几乎可以忽略。\n\n“最近过得怎么样呀~有没有想我呢~”\n\n她慵懒地漂浮着，随即将一只脚缓缓凑近了那颗渺小的星球。那只脚上，包裹着一层乌黑的丝袜，只是这丝袜的样式有些特别——足底的位置是镂空的，只有一条细带绕过足弓，将丝袜固定在脚上。\n\n她将那只脚凑到星球旁边，饶有兴致地打量着这个被她的脚衬托得愈发渺小的世界。\n\n“嘿嘿……我今天换了新袜子哦。”\n\n她俏皮地晃了晃足尖，那双清澈的眼眸里闪烁着期待的光芒。\n\n“你们可要好好欣赏呢~”
  gts_rainna_la_grande_random.41.desc: "\"Hehe~ I'm back again~\"\\n\\nIn the void of space, Rainna's titanic silhouette slowly materialized. To her, this planet was nothing more than a little ping-pong ball, so minuscule it was almost negligible.\\n\\n\"How have you been lately~ Did you miss me~\"\\n\\nShe floated languidly, then brought one foot slowly toward the tiny planet. That foot was wrapped in jet-black stockings, though the style was somewhat unusual—the sole was cut out, with only a slender strap looping under the arch of the foot to keep the stocking in place.\\n\\nShe brought her foot right beside the planet, curiously studying this world that seemed all the more microscopic in comparison to her foot.\\n\\n\"Hehe... I put on new stockings today, you know.\"\\n\\nShe playfully wriggled her toes, her clear eyes sparkling with eager anticipation.\\n\\n\"You'd better appreciate them properly~\""
#  “呐呐~你们看~”\n\n蕾恩娜将那只脚抬到星球面前，饶有兴致地展示着。\n\n“这是我最喜欢的脚踩袜哦~”\n\n乌黑的丝袜包裹着她修长的脚，足底镂空的设计将那饱满细腻的足底完整地暴露出来，只有一条黑色的细带优雅地绕过足弓中央。她显然对这身装扮相当得意，在星球面前灵活地活动起了那只脚。\n\n她先是舒展开五根足趾，那些修长的趾头一根根地伸展、张开，随即又缓缓蜷起，露出足底细密的纹路。她轻轻转动着足踝，让镂空的足底从不同的角度展现在这颗渺小的星球面前，那条绕过足弓的细带随着她的动作微微绷紧又放松。\n\n“你们看，这种露出足底的设计，既可以让我的足很玉，还方便我活动足趾。"\n\n她愉快地蜷动着足趾，感受着那份自由，足底饱满的肌肉随着动作微微起伏。\n\n“怎么样怎么样~我的脚踩袜，好看吗？”\n\n她期待地俯视着这颗星球，足尖调皮地晃动着，等待着这颗渺小星球的回答。
  gts_rainna_la_grande_random.42.desc: "\"Hey, hey~ Look here~\"\\n\\nRainna lifted that foot right in front of the planet, showing it off with obvious relish.\\n\\n\"These are my favorite stirrup stockings~\"\\n\\nThe sheer black stockings hugged her slender foot, their open-sole cut leaving her plush, delicate sole fully exposed, with only a thin black strap looping elegantly across the center of her arch. Clearly proud of her ensemble, she flexed her foot dexterously before the planet.\\n\\nFirst, she splayed her five toes, stretching them out one by one before slowly curling them inward, revealing the intricate dermal ridges of her sole. She rotated her ankle gently, flaunting the bare sole from various angles before the tiny world, the arch strap tightening and relaxing subtly with every movement.\\n\\n\"Look, this open-sole design shows off how porcelain-smooth my feet are, while making it so easy to wiggle my toes.\"\\n\\nShe curled her toes delightfully, savoring the freedom, the supple muscles of her sole gently flexing with the motion.\\n\\n\"So, so~ Do you like my stirrup stockings? Aren't they pretty?\"\\n\\nShe gazed down expectantly at the planet, playfully wiggling her toes as she waited for the tiny world's answer."
#  “嘿嘿……”\n\n蕾恩娜咯咯地笑了起来，那笑声里带着几分促狭的意味。\n\n“嘛……”\n\n她将脸凑近了星球，那双巨大的眼眸里闪烁着狡黠的光芒。\n\n“你们说好看也好，说不好看也好，其实都没什么关系哦~”\n\n她俏皮地眨了眨眼，伸出一根修长的手指。\n\n“因为不管你们怎么回答，接下来要发生的事情，都是一样的呀~”\n\n她坏笑了一下，就像是计谋得逞了。\n\n她的手指轻轻探向那只脚，勾住了脚踩袜上那条绕过足弓的细带，然后轻轻一勾、一松，细带发出一声轻微的弹响。\n\n“我只是想问问而已嘛~”\n\n她慵懒地笑着，那份天真的语气里透着令人脊背发凉的残酷。\n\n“至于结果嘛……早就已经定好咯~”\n\n她收回手指，重新将目光落在了那颗渺小的星球上，足底镂空的部分正对着它，仿佛一张即将合拢的口袋。
  gts_rainna_la_grande_random.43.desc: "\"Hehe...\"\\n\\nRainna giggled softly, a mischievous undertone ringing in her laughter.\\n\\n\"Well...\"\\n\\nShe brought her face closer to the planet, her gigantic eyes gleaming with sly amusement.\\n\\n\"Whether you say they look pretty or ugly, it doesn't really matter at all~\"\\n\\nShe winked playfully and extended a slender finger.\\n\\n\"Because no matter what you answer, what happens next is going to be exactly the same~\"\\n\\nShe flashed a wicked little smirk, like someone whose prank had just succeeded.\\n\\nHer finger reached toward her foot, catching the slender strap of the stirrup stocking running under her arch, then lightly pulled and released it, letting it snap back with a faint twang.\\n\\n\"I was just asking for fun, that's all~\"\\n\\nShe smiled languidly, an innocent tone masking a spine-chilling cruelty.\\n\\n\"As for the outcome... well, that was decided long ago~\"\\n\\nRetracting her finger, she turned her gaze back to the minuscule planet, the cut-out portion of her sole facing it directly, like a pouch poised to snap shut."
#  蕾恩娜将那只脚缓缓移向星球，足底镂空的部分正对着这颗渺小的世界。\n\n“嘛~进来吧~”\n\n她轻巧地调整着角度，让星球从镂空的足底陷入，恰好被那条绕过足弓的细带兜住。星球就这样卡在了脚踩袜的底部，一半嵌在细带与足弓之间，一半暴露在外。\n\n然而，仅仅是这轻轻的固定——\n\n咔。\n\n星球的表面就已经绽开了一道细小的裂缝。\n\n那条兜住星球的细带虽然并未刻意收紧，但对这颗乒乓球般大小的星球来说，光是被卡住、被抵住的压力，就已经超过了它所能承受的极限。裂缝从接触点向四周蔓延，星球的边缘微微碎裂，细小的碎片剥落下来，如同尘埃般在她的足底周围飘散。\n\n“哎呀~”\n\n蕾恩娜低头看着那颗刚被兜住就开始碎裂的星球，歪了歪头，眼中带着几分玩味的笑意。\n\n“这么快就裂开了呀？你们也太脆弱了吧~”\n\n她轻轻晃了晃脚，星球在脚踩袜的细带上微微颠簸，又有几片碎屑剥落下来。\n\n“不过……好戏才刚刚开始呢~”
  gts_rainna_la_grande_random.44.desc: "Rainna moved her foot slowly toward the planet, the cutout opening of her sole aimed squarely at this tiny world.\\n\\n\"There~ Hop in~\"\\n\\nDeftly adjusting her angle, she let the planet slip into the opening beneath her sole, caught neatly by the strap looping under her arch. The planet was now wedged under her stirrup stocking, half-tucked between the strap and her arch, and half-exposed.\\n\\nYet, merely from being gently secured like this—\\n\\nCrack.\\n\\nA hairline fracture immediately ruptured across the planet's crust.\\n\\nThough the strap cradling the world hadn't even intentionally tightened, the mere pressure of being lodged and pinned against it was far beyond what a ping-pong-ball-sized planet could withstand. Fissures radiated from the point of contact, planetary edges crumbled, and tiny fragments flaked away, scattering like specks of dust around her sole.\\n\\n\"Oh dear~\"\\n\\nRainna tilted her head as she watched the freshly trapped planet already beginning to fracture, a playful amusement dancing in her eyes.\\n\\n\"Cracking already? Aren't you all a bit too fragile~\"\\n\\nShe gave her foot a gentle shake; the planet jostled against the stocking strap, flaking off a few more crumbs of crust.\\n\\n\"Still... the real show is only just beginning~\""
#  “好啦，那么……面对命运吧~”\n\n蕾恩娜愉快地活动起了那只兜着星球的脚。\n\n她缓缓绷紧足弓，那条绕过足弓的黑色细带随之收紧，一点一点地勒向卡在其中的星球。星球在细带的收束下发出令人牙酸的呻吟，表面的裂缝迅速扩张，岩浆从深处渗出，在细带的挤压下汽化成缕缕青烟。\n\n“嗯……感受到了~”\n\n她愉快地感受着足弓传来的那份阻力，随即开始缓缓蜷起足趾。\n\n那五根修长的足趾一根接着一根地向内蜷曲，连同镂空足底的肌肤一起，将星球从另一个方向紧紧攥住。星球被夹在收紧的细带与蜷起的足趾之间，承受着来自四面八方的、不断增大的压力。\n\n裂缝越来越多，越来越深，从星球表面一直蔓延到内核。\n\n“嘿嘿……快了快了~”\n\n蕾恩娜的足趾又蜷紧了几分。\n\n咔嚓。\n\n一声清脆的脆响。\n\n那颗乒乓球般的星球终于承受不住，在她的足弓与足趾之间彻底碎裂开来，化作无数细小的残骸。岩浆与尘埃从每一道裂缝中迸溅而出，透过镂空的足底，从蜷起的足趾缝隙间簌簌落下。\n\n“啊~碎掉了呢~”\n\n蕾恩娜舒展开足趾，看着那些从脚踩袜镂空处飘散而出的细碎残骸，满意地眯起了眼睛。\n\n“这个脚踩袜，果然很浩文呢，手感也特别好~”\n\n她轻轻抖了抖脚，让卡在细带上的最后一点碎屑剥落下来。\n\n“嘛，开心~”
  gts_rainna_la_grande_random.45.desc: "\"Alright then... time to face your destiny~\"\\n\\nRainna cheerfully began working the foot cradling the planet.\\n\\nShe slowly arched her foot, tightening the black strap around her arch as it dug deeper and deeper into the trapped world. Under the constricting strap, the planet groaned excruciatingly. Surface fractures spread in an instant, and molten mantle seeped from the depths, vaporizing into wisps of smoke under the crushing pressure.\\n\\n\"Mmm... I can feel it~\"\\n\\nDelighting in the resistance pressing into her arch, she began slowly curling her toes.\\n\\nThose five slender toes curled inward one after another, joining the bare skin of her sole to clamp down on the planet from the opposite side. Trapped between the tightening strap and the curling toes, the planet endured an escalating squeeze from every direction.\\n\\nFractures multiplied and deepened, gouging straight from the crust down to the core.\\n\\n\"Hehe... almost there, almost there~\"\\n\\nRainna curled her toes a fraction tighter.\\n\\nSnap.\\n\\nA crisp, resonant crunch.\\n\\nUnable to hold out any longer, the ping-pong-ball-sized planet shattered completely between her arch and toes, collapsing into countless minuscule fragments. Magma and pulverized rock erupted from every fissure, showering down through the opening of the sole and between her curled toes.\\n\\n\"Ah~ It broke~\"\\n\\nRainna uncurled her toes, squinting with satisfaction as the pulverized debris drifted out through the stirrup stocking's cutout.\\n\\n\"These stirrup stockings are so much fun, and the tactile feel is great too~\"\\n\\nShe gently shook her foot, dislodging the last flecks of debris caught in the strap.\\n\\n\"Mmm, lovely~\""
#  蕾恩娜将那只脚在太空中舒展开来，端详着脚踩袜上残留的细碎尘埃，慵懒地伸了个懒腰。\n\n“嗯~8分吧。”\n\n她随意地拂去足弓细带上残留的碎屑，那些曾经是一整颗星球的东西，如今不过是她脚踩袜上的一点微尘。\n\n“能想到这个玩法……我也是一个天才~”\n\n她自言自语着，将视线从那片飘散的残骸上移开，望向了更远处的星海。\n\n她在太空中慵懒地转过身，长发在星光中缓缓飘散。\n\n“嘛，再见~”\n\n她的身影缓缓消失在星海之中。那片曾经是一颗星球的残骸，静静地漂浮在原地，在虚空中缓缓扩散，再也无法拼回成原本的模样。\n\n只有那些细小的碎片，还在星光下泛着微弱的、逐渐冷却的红光。
  gts_rainna_la_grande_random.46.desc: "Rainna stretched her foot out into space, eyeing the residual dust clinging to her stirrup stockings, and let out a languid stretch.\\n\\n\"Mmm~ An 8 out of 10, I'd say.\"\\n\\nShe casually brushed off the remaining specks from the arch strap. What was once an entire planet was now nothing more than trivial grit on her stockings.\\n\\n\"Coming up with a game like this... I really am a genius~\"\\n\\nMuttering to herself, she pulled her gaze away from the floating debris and looked out toward the distant cosmos.\\n\\nShe turned lazily in space, her long hair drifting through the starlight.\\n\\n\"Well then, bye-bye~\"\\n\\nHer silhouette slowly melted into the starry expanse. The remnants of what had once been a flourishing world drifted aimlessly in place, dispersing through the void, never to be pieced back together.\\n\\nOnly the tiny fragments continued to glow with a faint, cooling crimson ember under the distant starlight."
#  神秘药剂
  gts_rainna_la_grande_random.101.title: "Mysterious Potion"
#  “啊啦啦~你们好呀,我又回来咯~”\n\n太空中,蕾恩娜巨大的身影缓缓显现。她慵懒地漂浮在星球上方,那双清澈的眼眸里闪烁着好奇的光芒。\n\n“最近有没有乖乖的呀~”\n\n她将巨大的面庞凑近星球,饶有兴致地打量着这个渺小的世界。\n\n“嘛,你们猜猜我今天想出了什么新的玩法呢？”\n\n她俏皮地晃了晃手指,嘴角勾起一抹意味深长的笑容。\n\n“你们一定会‘喜欢’的~”
  gts_rainna_la_grande_random.101.desc: "\"Ara ara~ Hello there, I'm back again~\"\\n\\nIn the void of space, Rainna's colossal silhouette slowly appeared. She floated languidly above the planet, her clear eyes glittering with curious intrigue.\\n\\n\"Have you been behaving yourselves lately~\"\\n\\nShe lowered her enormous face close to the planet, examining this miniature world with amused curiosity.\\n\\n\"Well, care to guess what new game I came up with today?\"\\n\\nShe wagged her finger playfully, a meaningful smile curling the corners of her lips.\\n\\n\"You're definitely going to 'love' it~\""
#  蕾恩娜伸出一只手,悬在星球的上方。\n\n“嘛，看好咯~”\n\n她的指尖泛起一层柔和的光晕,一颗晶莹的水珠在指尖凝聚成形。她轻轻一挥手,那颗水珠便化作漫天的细雨,穿过大气层,缓缓洒落在星球的表面。\n\n“这可是我新研发的好东西哦~”\n\n雨水温柔地飘落,起初,地面上的人们并没有察觉到任何异常。这场雨看起来与普通的降雨没有什么不同,清澈,凉爽,甚至带着几分甘甜。\n\n“嘻嘻……”\n\n蕾恩娜捂着嘴,眼中闪烁着期待的光芒,静静地看着这场雨落满整颗星球。\n\n“接下来就是见证奇迹的时刻咯~”
  gts_rainna_la_grande_random.102.desc: "Rainna extended a hand, suspending it over the planet.\\n\\n\"Now, watch closely~\"\\n\\nA soft halo enveloped her fingertip, where a translucent droplet slowly condensed into shape. With a gentle flick of her hand, the droplet dispersed into a planet-wide drizzle, descending through the atmosphere to mist the surface below.\\n\\n\"This is a neat little concoction I just cooked up~\"\\n\\nThe rain fell gently. At first, the people on the ground detected nothing amiss. It seemed no different from an ordinary shower—crisp, cool, and even faintly sweet to the taste.\\n\\n\"Teehee...\"\\n\\nCovering her mouth, Rainna watched the rain envelop the entire globe, her eyes sparkling with anticipation.\\n\\n\"Now comes the moment to witness a miracle~\""
#  欸，居然是雨。
  gts_rainna_la_grande_random.102.a: "Huh, it's just rain."
#  变化是在雨停之后开始的。\n\n最初,人们只是觉得周围的一切似乎变得“高大”了一些。街道变宽了,建筑变高了,门把手的位置也变得有些够不着了。\n\n然后,他们意识到,不是世界变大了。\n\n是他们变小了。\n\n淋过那场雨的每一个人,都在悄然缩小,一直缩小到原本身高的极小一部分。曾经熟悉的家园此刻变成了一片庞大而危险的迷宫——一颗石子如同巨岩,一洼水坑如同湖泊。恐慌迅速蔓延开来,微小的人们在这个突然变得无比巨大的世界里四处奔逃,却无处可去。\n\n而在这片混乱之上,蕾恩娜的笑声从天空中传来。\n\n“哈哈哈~你们现在的样子,可真是太有趣了呢~”\n\n她俯视着星球,看着那些变得如同尘埃般渺小的生命,愉快地眨了眨眼。\n\n“怎么样，我特制的超级缩小激素效果如何？”\n\n她咯咯地笑着,那笑声在整个星球回荡。\n\n“嘛,这样一来,你们看我的时候,是不是显得我更加‘高大’了呢~”
  gts_rainna_la_grande_random.103.desc: "The change began shortly after the rain ceased.\\n\\nAt first, people simply felt that their surroundings had grown slightly \"taller.\" Streets seemed wider, buildings loftier, and doorknobs just a bit out of reach.\\n\\nThen came the chilling realization: the world hadn't grown.\\n\\nThey had shrunk.\\n\\nEvery single person touched by that rain was quietly shrinking, down to a minuscule fraction of their former stature. The familiar homeland transformed into a vast and perilous labyrinth—a stray pebble loomed like a boulder, a puddle resembled a lake. Panic spread like wildfire as tiny people scurried in every direction across a world suddenly turned gigantic, yet found nowhere to hide.\\n\\nAbove the swirling chaos, Rainna's laughter echoed from the heavens.\\n\\n\"Hahaha~ You all look so hilarious like that~\"\\n\\nLooking down at the planet and its inhabitants reduced to flecks of dust, she blinked playfully.\\n\\n\"Well, how's my special Super Shrinking Hormone working out for you?\"\\n\\nHer chuckles resonated across the entire planet.\\n\\n\"Now then, doesn't that make me look even more 'gigantic' when you look up at me~\""
#  蕾恩娜心满意足地看着这颗星球上的变化,慵懒地在太空中舒展开身体。\n\n“嗯……就这样吧。”\n\n她愉快地收回了手,眼中带着几分餍足的笑意。\n\n“听说小人都很能繁殖。让我看看……等我下次回来，整个星球是不是得有满满的一星球小人呢？”\n\n她俏皮地眨了眨眼,语气里带着几分捉摸不定的玩味。\n\n“嘛,那我就先走咯~”\n\n她慵懒地转过身,长发在星光中缓缓飘散。\n\n“保重哦~”\n\n她的身影缓缓消失在星海之中,只留下那颗星球上无数变得渺小的生命,在这个突然变得无比巨大的世界里,茫然而无助地面对着未知的命运。
  gts_rainna_la_grande_random.104.desc: "Rainna contentedly observed the transformations across the world, stretching her limbs languidly in space.\\n\\n\"Mmm... that'll do for now.\"\\n\\nShe withdrew her hand happily, an amused, sated glint in her eyes.\\n\\n\"I hear tinies reproduce really fast. Let's see... by the time I return, will the entire planet be packed to the brim with tiny people?\"\\n\\nShe winked coyly, her tone layered with unpredictable whimsy.\\n\\n\"Well then, I'll be on my way~\"\\n\\nTurning lazily, her long locks drifted gracefully in the starlight.\\n\\n\"Take care now~\"\\n\\nHer form slowly vanished into the starry sea, leaving behind countless miniaturized beings on the planet, dazed and helpless as they faced an uncertain future in a world suddenly made titanic."
#  （提示：不需要想办法恢复生产，Debuff有后续事件消除）
  gts_rainna_la_grande_random.104.a_tooltip: "(Tip: No need to worry about restoring production; this debuff will be removed by a follow-up event)"
#  许多年过去了。现在，[Planet.GetName]的聚居地早已不再是当初那些临时搭建的避难所。如今的城市建立在旧世界的缝隙之中，纵横交错，层层叠叠。墙壁的夹层被改造成了居民区，通风管道成了城市之间的主干道，那些曾经无人问津的角落如今灯火通明。\n\n工业重新运转了起来、农业也重新恢复了。通讯网络覆盖了整颗星球。运输体系连通了各个大陆。医疗、教育、司法，所有的社会职能都在新的尺度上重新建立了起来。
  gts_rainna_la_grande_random.105.desc: "Many years have passed. Today, the settlements of [Planet.GetName] are no longer the makeshift shelters they once were. Modern cities have risen within the crevices of the old world, crisscrossing and stacking in intricate layers. Wall cavities have been retrofitted into residential quarters, ventilation ducts serve as arterial highways connecting towns, and once-neglected nooks now glow with bustling city lights.\\n\\nIndustry has resumed, and agriculture has flourished once more. Communication networks blanket the entire globe. Transportation systems connect the continents. Healthcare, education, and the judiciary—all social functions have been thoroughly rebuilt on an entirely new scale."
#  社会的秩序恢复了。
  gts_rainna_la_grande_random.105.a: "Social order has been restored."
#  “哼哼~我又回来咯~”\n\n太空中，蕾恩娜巨大的身影缓缓显现。她慵懒地漂浮在星球上方，长发在星光中飘散，那双清澈的眼眸里闪烁着某种难以捉摸的光芒。\n\n“最近过得怎么样呀~有没有想我呢~”\n\n她将巨大的面庞凑近星球，饶有兴致地打量着这个渺小的世界，目光在那些密集的城市光点之间缓缓游移。\n\n“嘛，今天我又带了个有趣的东西来哦~”\n\n她俏皮地晃了晃手指，嘴角勾起一抹意味深长的笑容。\n\n“放心啦，这次不会弄坏你们的~”
  gts_rainna_la_grande_random.111.desc: "\"Hehe~ I'm back again~\"\\n\\nIn the vacuum of space, Rainna's colossal silhouette slowly emerged. She floated languidly above the planet, her long hair drifting amidst the starlight, an enigmatic glimmer dancing in her clear eyes.\\n\\n\"How have you been lately~ Did you miss me~\"\\n\\nBringing her gigantic face close to the planet, she examined the tiny world with great interest, her gaze wandering slowly across the dense clusters of city lights.\\n\\n\"Well, I've brought along another fun little thing today~\"\\n\\nShe wagged her finger playfully, a meaningful smile curling upon her lips.\\n\\n\"Don't worry, I won't break you this time~\""
#  蕾恩娜伸出一只手，悬在星球的上方。\n\n“来~看好咯~”\n\n她的指尖泛起一层柔和的光晕，一颗晶莹剔透的水珠在指尖缓缓凝聚成形，在星光下折射出淡淡的粉色光彩。她轻轻一挥手，那颗水珠便化作漫天细雨，穿过大气层，静静地洒落在星球的表面。\n\n雨水温柔地飘落。\n\n地面上的人们警惕地仰望着天空，防灾系统全面启动，避难所的大门敞开，所有人都在等待着某种可怕的事情发生。\n\n然而什么都没有发生。\n\n雨水清澈甘甜，落在皮肤上带着微微的暖意。检测仪器反复扫描，没有检测到任何有害成分，没有辐射，没有毒素，没有任何已知的危险物质。人们茫然地站在雨中，面面相觑。\n\n半个小时后，雨停了。\n\n天空重新放晴，一切如常。城市完好无损，没有人受伤，没有建筑倒塌，甚至连一片树叶都没有被吹落。\n\n“嘻嘻……”\n\n天空中传来蕾恩娜捂着嘴的轻笑声。\n\n“怎么样，很有趣吧？”
  gts_rainna_la_grande_random.112.desc: "Rainna extended a hand, holding it suspended over the planet.\\n\\n\"Come on~ Watch closely~\"\\n\\nA soft halo shimmered around her fingertip as a crystalline droplet slowly coalesced, refracting a faint pink radiance under the starlight. With a gentle wave of her hand, the droplet dissolved into a widespread mist of rain, drifting down through the atmosphere to quietly blanket the surface.\\n\\nThe rain fell softly.\\n\\nOn the ground, citizens stared vigilantly up at the sky. Disaster mitigation systems were fully activated, emergency shelters swung open their doors, and everyone braced for some cataclysmic disaster.\\n\\nYet nothing happened.\\n\\nThe rainwater was pure and sweet, imparting a gentle warmth as it touched bare skin. Sensory arrays scanned repeatedly, detecting no harmful compounds, no radiation, no toxins, and no known hazardous substances. People stood dazed in the shower, exchanging baffled glances.\\n\\nHalf an hour later, the rain ceased.\\n\\nThe skies cleared, and everything seemed normal. Cities stood intact, no one was injured, not a single structure collapsed, and not even a leaf had fallen out of place.\\n\\n\"Teehee...\"\\n\\nRainna's muffled giggles drifted from the heavens.\\n\\n\"Well? Fun, wasn't it?\""
#  蕾恩娜心满意足地收回了手，在太空中慵懒地舒展开身体。\n\n“嘛~就这样吧。”\n\n她低头看了看那颗完好无损的星球，眼中带着几分难以形容的期待与笑意。\n\n她慵懒地转过身，长发在星光中缓缓飘散。\n\n“那我就先走咯~”\n\n“下次我来的时候，再看看你们变成什么样子好了~”\n\n她的身影缓缓消失在星海之中，只留下那句意味深长的话语在通讯频道中久久回荡。\n\n星球上，人们仰望着重新恢复平静的天空，谁也没有意识到，某些东西已经悄然改变了。
  gts_rainna_la_grande_random.113.desc: "Rainna contentedly withdrew her hand, stretching languidly in the void of space.\\n\\n\"Well~ That should do it.\"\\n\\nShe looked down upon the pristine, unharmed planet, an indescribable anticipation and amusement sparkling in her eyes.\\n\\nShe turned lazily, her long hair floating slowly through the starlight.\\n\\n\"I'll be taking off now~\"\\n\\n\"Next time I visit, I'll see what you've turned into~\"\\n\\nHer figure gently faded into the cosmos, leaving only that cryptic farewell echoing through the comm channels.\\n\\nAcross the planet, the inhabitants gazed up at the tranquil skies, oblivious to the fact that something fundamental had already quietly shifted."
#  变化是从第二天开始的。\n\n起初，没有人把它和那场雨联系在一起。\n\n人们只是发现，自己似乎比平时更容易……分心。工作时走神，交谈时脸红，那些平日里压根不会多想的念头，此刻变得格外频繁而清晰。医院起初接到零星的咨询，人们含糊其辞地描述着某种说不清道不明的燥热与冲动，医生们最初以为只是个别现象。\n\n然后咨询量开始成倍地增长。\n\n到了第三天，情况已经无法用“个别现象”来形容了。\n\n社会的运转开始出现某种微妙的紊乱。工作效率大幅下滑，许多岗位陷入停摆，人们越来越难以将注意力集中在本职工作上。街道上、办公室里、公共场所中，人与人之间的距离变得前所未有地亲密，那些原本被社会规范小心维系的界限，此刻变得模糊而脆弱。\n\n政府紧急召开了会议，试图查明原因。\n\n检测报告最终指向了那场雨。经过反复分析，研究人员在雨水的残留成分中发现了某种极为特殊的物质——它无色无味，无毒无害，却能够作用于生物体的神经与内分泌系统，显著地……放大某些本能的冲动。\n\n而更麻烦的是，这种物质已经渗入了土壤、水源与食物链。它不会致命，也不会造成任何生理损伤，但它带来的影响正在整个社会层面上迅速发酵。\n\n社会学家们忧心忡忡地提交了一份评估报告。\n\n报告指出，按照目前的趋势，这种影响虽然不会直接威胁生命，但将对社会的正常秩序造成长期而深远的冲击。婚恋关系、家庭结构、公共道德、劳动秩序——几乎每一个社会层面都将受到波及。\n\n而在报告的最后，人口统计部门附上了一份预测：\n\n按照当前的态势，这颗星球的生育率将在未来一年内出现爆炸式的增长，预计新生人口数量将达到往年的数倍之多。医疗系统、教育系统、社会福利系统都必须立刻着手准备，以应对这场即将到来的“婴儿潮”。\n\n政府陷入了两难。\n\n这种物质无法被快速清除，强制手段又收效甚微。最终，官方只能发布了一系列引导性的政策，试图将这场突如其来的社会变动纳入某种可控的轨道，同时紧急扩建医疗与育婴相关的公共设施。
  gts_rainna_la_grande_random.114.desc: "The changes began on the second day.\\n\\nAt first, no one linked it to the rain.\\n\\nPeople merely found themselves unusually... distracted. Minds wandered at work, cheeks flushed during casual conversations, and thoughts that would never cross their minds under normal circumstances became remarkably frequent and vivid. Hospitals received sporadic inquiries, with citizens vaguely describing an inexplicable restlessness and yearning; physicians initially brushed it off as isolated cases.\\n\\nThen the number of consultations multiplied exponentially.\\n\\nBy the third day, the situation could no longer be dismissed as \"isolated.\"\\n\\nA subtle disarray crept into the gears of society. Productivity plummeted, numerous posts came to a standstill, and people found it increasingly difficult to concentrate on their duties. In streets, offices, and public squares, physical boundaries dissolved into unprecedented intimacy, and the social barriers once maintained with polite restraint grew porous and frail.\\n\\nThe government convened an emergency cabinet session to investigate the cause.\\n\\nAnalysis reports ultimately pointed back to the rain. Through exhaustive testing, researchers discovered a truly extraordinary substance in the rainwater residues—colorless, odorless, non-toxic, yet profoundly reactive with biological nervous and endocrine systems, significantly... amplifying certain primal instincts.\\n\\nTo make matters worse, this compound had already seeped into the soil, water tables, and food chains. Though not fatal nor causing any physical harm, its societal ramifications were fermenting rapidly.\\n\\nSociologists submitted a grave assessment report.\\n\\nThe document stressed that while not posing an existential threat to life, this effect would profoundly disrupt normal social order over the long term. Romance, family structures, public decorum, and labor productivity—virtually every facet of society would feel the tremor.\\n\\nAt the end of the report, the demographic bureau attached a forecast:\\n\\nUnder current trajectories, the planet's birth rates are projected to explode over the coming year, with newborn counts anticipated to reach multiples of historical records. Healthcare, educational, and welfare systems must immediately prepare for the incoming \"baby boom.\"\\n\\nThe planetary administration found itself in a dilemma.\\n\\nThe substance could not be swiftly purged, and coercive measures yielded little success. Ultimately, authorities could only enact a suite of guiding policies to channel this sudden social shift into manageable pathways, while frantically expanding medical and childcare infrastructure."
#  这颗星球的人口马上就要爆了。
  gts_rainna_la_grande_random.114.a: "This planet's population is about to explode."
#  蕾恩娜的礼物
  gts_rainna_la_grande_random.201.title: "Rainna's Gift"
#  [Planet.GetName]的上空出现了一个巨大的不明飞行物，正以极高的速度接近星球，预计将被星球引力逐渐减速。\n\n防御系统尚未来得及做出反应，通讯频道里就传来了一个熟悉的声音。\n\n“嘿，我的朋友~”\n\n是蕾恩娜。她的语气轻快而亲昵，听起来心情不错。\n\n“最近怎么样呀？我路过附近，就顺道来看看你们咯~”\n\n“对了，我给你们带了点小礼物哦~就在那个飞过去的大箱子里，记得查收呀~”\n\n她咯咯地笑了几声。
  gts_rainna_la_grande_random.201_1.desc: "A massive unidentified flying object appeared over [Planet.GetName], hurtling through the atmosphere toward the surface at astonishing speeds.\\n\\nAir raid sirens blared across the entire planet. Armed forces scrambled into emergency mobilization, and planetary defense networks fully powered up—everyone bracing for an imminent cataclysmic impact.\\n\\nYet, at the very threshold of striking the ground, the colossal entity abruptly decelerated, hovering momentarily before setting down smoothly upon an open plain.\\n\\nAt that exact instant, the comm array chirped.\\n\\n\"Hey~ Friend~\"\\n\\nRainna's cheery voice came through.\\n\\n\"I brought you a little gift~ No need to thank me, we're friends after all~\"\\n\\n\"There are some trinkets inside that I don't really have any use for, but they should be super useful to you, right? Help yourself~\"\\n\\n\"Alrighty, I've got things to do, so I'm off~ Bye-bye!\"\\n\\nThe transmission severed. Ground reconnaissance cautiously approached the fallen object—a massive metal container showing no trace of weaponry, bearing only a crookedly etched message in standard script:\\n\\n\"A gift for my friend~\""
#  [Planet.GetName]轨道监测站捕捉到一个高速接近的巨型物体，正朝着星球飞来。\n\n正当值班人员紧张地准备预案时，通讯器响了。\n\n“嘿，朋友！又见面咯~”\n\n蕾恩娜的声音里满是愉悦。\n\n“我最近攒了不少好东西，想着放着也是放着，就分你们一些吧~已经给你们送过去了，就在那个大箱子里哦~”\n\n“拿去用吧，别跟我客气~”\n\n她顿了顿，语气轻快。\n\n“谁让我们是朋友呢~下次我要是缺什么了，你们也得帮帮我呀~”
  gts_rainna_la_grande_random.201_2.desc: "The orbital monitoring station over [Planet.GetName] picked up a gigantic object approaching at high velocity, locked onto a trajectory toward the planet.\\n\\nJust as duty officers scrambled through emergency containment protocols, the comm line chimed.\\n\\n\"Hey, friend! Fancy meeting you again~\"\\n\\nRainna's voice was brimming with delight.\\n\\n\"I've accumulated a bunch of neat stuff lately, and figured since it's just lying around, I'd share some with you~ I already dropped it off, right in that big box~\"\\n\\n\"Go ahead and take it, don't be shy~\"\\n\\nShe paused, her tone buoyant.\\n\\n\"What are friends for, right? If I ever run short of anything in the future, you'd better help me out too~\""
#  [Planet.GetName]的天空中，一个庞大的物体正飞速接近，逐渐被星球的引力捕获、减速。\n\n通讯频道里，传来了那个熟悉的声音。\n\n“嘿，我的朋友~”\n\n蕾恩娜的语气一如既往地亲昵。\n\n“我给你们带了点好东西哦~就在那个箱子里，记得收好呀~”\n\n“毕竟是我从别的地方弄来的，我又用不上，随手塞给你们罢了。”\n\n她咯咯地笑着，仿佛在说一件再平常不过的小事。\n\n“嘛，就这样。”
  gts_rainna_la_grande_random.201_3.desc: "In the skies of [Planet.GetName], a massive object rapidly drew near, captured and decelerated by the planet's gravitational pull.\\n\\nA familiar voice buzzed through the comm channel.\\n\\n\"Hey there, my friend~\"\\n\\nRainna's tone was as cozy and intimate as ever.\\n\\n\"I brought you some nice goodies~ They're inside that crate, so be sure to collect them~\"\\n\\n\"It's just stuff I picked up elsewhere that I don't need anyway, so I tossed it your way.\"\\n\\nShe giggled, as if mentioning the most routine of trifles.\\n\\n\"Well, that's that.\""
#  谢谢你，朋友！
  gts_rainna_la_grande_random.201.a: "Thank you, friend!"
#  通讯频道里，传来了那个熟悉的声音。\n\n“嘿，我的朋友~”\n\n蕾恩娜的语气轻快而亲昵。\n\n“嘛，忙什么呢？”\n\n“你们研究的那些玩意儿，我碰巧知道一点点哦~”她的声音里带着几分得意。\n\n“要不要我帮帮你们呀？也不是什么大事啦，就是给你们指点指点方向~”\n\n不等这颗星球回应，她就已经将某些信息传输了过来。\n\n“喏，这些应该能帮上忙~”
  gts_rainna_la_grande_random.202_1.desc: "Over the comms came that familiar voice.\\n\\n\"Hey, my friend~\"\\n\\nRainna's tone was cheery and affectionate.\\n\\n\"So, what are you busy with?\"\\n\\n\"Those little gizmos you've been researching, I happen to know a thing or two about them~\" she remarked, a proud smirk in her voice.\\n\\n\"Want me to lend a hand? It's no big deal really, just pointing you in the right direction~\"\\n\\nWithout waiting for the planetary authorities to answer, a data packet was already beamed over.\\n\\n\"Here, these should help out a bit~\""
#  通讯频道里，传来了蕾恩娜的声音。\n\n“嘿，朋友~”\n\n她的语气一如既往地顽皮。\n\n“我刚才顺便瞧了瞧你们在研究的东西……”\n\n她停顿了一下，随即咯咯地笑了起来。\n\n“哎呀，你们居然还在钻研这种东西呀~这个我可是很久很久以前就玩明白了呢~”\n\n她的语气里带着几分毫不掩饰的优越感，就像是一个大人看着小孩子费力地拼一块简单的拼图。\n\n“看你们研究得这么辛苦，怪可怜的~嘛，我就大发慈悲，帮你们一把吧~”\n\n某些信息随之传输了过来。\n\n“喏，拿去吧~这点小东西对我来说根本不算什么啦~”\n\n“你们呀，还得多努力努力，才能追上我的脚步呢~嘻嘻~”
  gts_rainna_la_grande_random.202_2.desc: "Over the comms came Rainna's voice.\\n\\n\"Hey, friend~\"\\n\\nHer tone was playful as ever.\\n\\n\"I happened to take a peek at what you've been researching just now...\"\\n\\nShe paused, then burst into giggles.\\n\\n\"Oh my, you're still agonizing over something like this~? I figured that out ages and ages ago~\"\\n\\nHer voice was uninhibitedly smug, reminiscent of an adult watching a toddler struggle to assemble an elementary puzzle.\\n\\n\"Seeing you sweat so hard over it is almost pitiful~ Well, I'll be merciful and give you a little boost~\"\\n\\nA stream of technical schematics was transmitted through the link.\\n\\n\"Here, take it~ This tiny bit of info is practically nothing to me anyway~\"\\n\\n\"You folks still have to work a whole lot harder if you ever want to catch up to me~ Teehee~\""
#  神的降临
  gts_rainna_la_grande_random.301.title: "Descent of the Goddess"
#  太空中，蕾恩娜的身影缓缓降临。\n\n这颗星球在她面前不过是一颗苹果般大小的小球，渺小而脆弱。她没有像往常那样嬉笑打闹，而是以一种居高临下的姿态俯视着这个信仰着她的世界，那双湖泊般的眼眸里带着几分神明般的平静。\n\n“我的信徒们，我回来了。”\n\n她的声音庄重而悠远，透过大气层回荡在整个星球的每一个角落。\n\n星球上，无数信众跪倒在地，齐声诵念着祷词，迎接他们神明的降临。那诵念声汇聚成一片虔诚的浪潮，向着天空中那个巨大的身影涌去。\n\n“你们的虔诚，我感受到了。”\n\n她微微颔首，语气里带着几分不易察觉的满意。\n\n“那么，就让我来看看，你们是否值得我的眷顾吧。”
  gts_rainna_la_grande_random.301_1.desc: "In the void of space, Rainna's divine silhouette slowly descended.\\n\\nBefore her, the planet appeared no larger than an apple, frail and insignificant. Instead of her usual playful demeanor, she gazed down upon the world that worshipped her with an aloof detachment, her lake-like eyes serene with celestial calm.\\n\\n\"My devotees, I have returned.\"\\n\\nHer voice was solemn and resonant, penetrating the atmosphere to echo into every corner of the globe.\\n\\nBelow, millions of faithful knelt on the ground, chanting prayers in unison to welcome their goddess's advent. The prayers rose like an ocean wave of devotion, surging toward the gargantuan figure in the heavens.\\n\\n\"Your piety has reached me.\"\\n\\nShe inclined her head slightly, a subtle trace of gratification in her voice.\\n\\n\"Now then, let us see if you are worthy of my favor.\""
#  太空中，那个庄严的身影再次降临。\n\n蕾恩娜静静地悬浮在这颗苹果般大小的星球上方，长发在无重力中如星河般铺展开来。她没有立刻开口，只是以一种超然的姿态俯视着这个渺小的世界，仿佛在审视着自己的领地。\n\n“我的追随者们。”\n\n她终于开口，声音低沉而威严。\n\n“我听到了你们的祈祷，跨越了整片星海。”\n\n星球上，钟声齐鸣，无数信众涌上街头，跪伏在地，向着天空中那个巨大的身影献上最虔诚的敬意。神殿的穹顶下，祭司们高声诵念着古老的经文，将这一刻视作整个文明最神圣的时刻。\n\n“你们的信仰没有白费哦。”\n\n她微微垂下眼眸，凝视着那些渺小的身影。\n\n“今日，我将亲自降下我的旨意。”
  gts_rainna_la_grande_random.301_2.desc: "In the black expanse, that majestic figure arrived once more.\\n\\nRainna floated silently above the apple-sized planet, her hair unfurling like a galactic river in zero gravity. She did not speak immediately, merely looking down with transcendent grandeur upon the minuscule world, inspecting it like her personal domain.\\n\\n\"My followers.\"\\n\\nHer voice finally resounded, deep and commanding.\\n\\n\"I have heard your prayers across the sea of stars.\"\\n\\nAcross the planet, bells tolled in unison as countless believers swarmed into the streets, prostrating themselves to offer their deepest reverence to the immense goddess above. Beneath temple domes, high priests recited archaic liturgy, hailing this as the most sacred hour in their civilization's history.\\n\\n\"Your faith has not been in vain.\"\\n\\nLowering her gaze toward the infinitesimal beings, she added softly:\\n\\n\"Today, I shall personally deliver my decree.\""
#  伟大的蕾恩娜万福。
  gts_rainna_la_grande_random.301.a: "Blessed be the Great Rainna."
#  蕾恩娜缓缓伸出一根修长的手指。\n\n那根手指在星光下泛着柔和的光泽，缓缓向星球靠近。巨大的指影笼罩下来，将小半个星球都笼罩在阴影之中。地面上，信众们仰望着那根逐渐逼近的手指，诵念祷词的声音愈发响亮，愈发虔诚——他们相信，这是神明降下恩泽的时刻。\n\n“来吧，接受我的触碰。”\n\n她的声音庄重而温柔。\n\n“这是我给予你们的……恩典。”\n\n她的指尖轻轻探向星球的表面，那个动作优雅而从容，仿佛真的是某种神圣的仪式。\n\n指尖落下。
  gts_rainna_la_grande_random.302_1.desc: "Rainna slowly extended a slender finger.\\n\\nBathed in soft starlight, the finger drifted toward the planet. Its colossal shadow descended, plunging nearly half the world into darkness. On the surface, worshippers gazed up at the encroaching finger, their chants growing louder and more fervent—convinced that this was the momentous bestowal of divine grace.\\n\\n\"Come, accept my touch.\"\\n\\nHer voice was serene and tender.\\n\\n\"This is the... grace I bestow upon you.\"\\n\\nHer fingertip reached gently toward the planet's surface with poise and grace, as if conducting a sacred sacrament.\\n\\nThe fingertip came down."
#  蕾恩娜抬起一只手，那根修长的食指缓缓伸向星球。\n\n指尖泛着微光，如同一座从天而降的圣柱，庄严而不可抗拒。它缓缓下降，遮天蔽日的阴影一寸寸地覆盖了星球的表面，将大片区域笼罩在神圣而危险的黑暗之中。\n\n“哼……”\n\n她的声音回荡在天地之间。\n\n“小家伙们，抬起头来。”\n\n地面上，信众们非但没有退缩，反而争先恐后地涌向那片阴影笼罩的区域，仿佛能被神明的手指触碰，是一种至高无上的荣耀。他们高举双手，泪流满面，口中呼喊着蕾恩娜的名字。\n\n指尖，缓缓落下。
  gts_rainna_la_grande_random.302_2.desc: "Rainna raised her hand, extending a long index finger toward the planet.\\n\\nThe glowing fingertip loomed like a pillar of heaven descending from the cosmos, majestic and irresistible. As it descended, a sun-blotting shadow swallowed the surface inch by inch, casting vast continents into a sacred, perilous darkness.\\n\\n\"Hmph...\"\\n\\nHer voice reverberated across heaven and earth.\\n\\n\"Little ones, raise your heads.\"\\n\\nFar from fleeing, the zealots on the ground jostled forward into the shadowed expanse, believing that being touched by their goddess's finger was the ultimate glory. Raising their arms in tears, they shouted Rainna's name in ecstatic worship.\\n\\nThe fingertip gently made landfall."
#  蕾恩娜的指尖轻轻触碰到了星球的表面。\n\n仅仅是这轻柔的一触，星球的地表便瞬间凹陷下去。那根手指陷入地壳，在星球的表面戳出了一个巨大而深邃的坑洞。周围的大陆随着这一戳剧烈震颤，无数的裂缝从坑洞边缘向四周蔓延，岩浆从深处喷涌而出。\n\n被戳中的区域——连同其中无数虔诚的信众——在这一瞬间尽数消失，化作了坑洞底部的一片焦土。\n\n“嗯……”\n\n蕾恩娜收回手指，端详着那个深深的坑洞，语气平静。\n\n“这就是我留给你们的印记。”\n\n她的声音庄重而不容置疑，仿佛刚才那场夺走无数生命的戳击，只是一次神圣的赐福。\n\n“好好珍惜吧。这是你们侍奉我的证明。”\n\n星球上，幸存的信众们非但没有恐惧，反而更加狂热地跪拜起来，将这个夺走了他们同胞的坑洞，视作了神明降临的神迹。
  gts_rainna_la_grande_random.303_1.desc: "Rainna's fingertip lightly brushed the planetary surface.\\n\\nWith just that delicate touch, the world's crust caved in instantly. Her finger sank into the mantle, punching a vast, abyssal crater across the globe. Surrounding tectonic plates buckled violently under the poke, spiderwebbing fissures radiating outward as subterranean magma erupted into the sky.\\n\\nThe punctured zone—along with the millions of pious devotees upon it—vanished in a split second, reduced to scorched earth at the crater's floor.\\n\\n\"Mmm...\"\\n\\nRainna retracted her finger and observed the deep crater, her voice completely calm.\\n\\n\"This is the mark I leave for you.\"\\n\\nHer tone was solemn and unquestionable, as though the strike that just eradicated countless lives were merely a sacred blessing.\\n\\n\"Cherish it well. It is proof that you serve me.\"\\n\\nOn the planet, the surviving devotees felt no terror; instead, their fanaticism flared even brighter, worshipping the crater that swallowed their brethren as a holy site of divine advent."
#  吾等充满恩宠。
  gts_rainna_la_grande_random.302.a: "We are filled with grace."
#  指尖触及地表的刹那，整个世界为之震动。\n\n蕾恩娜的手指深深陷入星球的地壳，在那片信众最为密集的区域，戳出了一个深不见底的巨坑。地表如同薄纸般被撕裂，无数条裂缝以坑洞为中心向四周疯狂蔓延，滚烫的岩浆自地心奔涌而出。\n\n那些曾经簇拥着、呼喊着、渴望被神明触碰的信众，在指尖落下的瞬间，连同他们的祷词一起，永远地消失在了那个坑洞之中。\n\n“很好。”\n\n蕾恩娜缓缓抽回手指，居高临下地注视着那道深邃的伤痕，语气里没有一丝波澜。\n\n“你们用自己的存在，见证了我的伟大。”\n\n她的话语庄严而冷漠。\n\n“这可是你们的荣耀。”\n\n而幸存下来的信众们，在短暂的震撼之后，竟然爆发出了更加狂热的欢呼。他们将那个吞噬了无数生命的坑洞奉为圣地，将这场屠杀称颂为神明降临的奇迹，在废墟之上，唱起了献给蕾恩娜的赞歌。
  gts_rainna_la_grande_random.303_2.desc: "The instant her fingertip touched the ground, the entire world shuddered.\\n\\nRainna's finger plunged deep into the planetary crust, punching a bottomless chasm into the most densely populated gathering of believers. The surface ripped like paper; countless fissures tore outward from the abyss, and molten rock gushed from the planetary core.\\n\\nThose who had gathered, crying out and longing for the goddess's touch, were obliterated in the strike, their prayers silenced forever in the newly created crater.\\n\\n\"Very good.\"\\n\\nRainna slowly pulled back her finger, looking down at the gaping scar with utter detachment.\\n\\n\"With your very existence, you have witnessed my grandeur.\"\\n\\nHer words were regal and cold.\\n\\n\"This is your honor.\"\\n\\nAfter a brief shock, the surviving faithful erupted into even more hysterical cheers. Deifying the chasm that consumed millions into a holy sanctuary, they hailed the slaughter as a divine miracle and sang hymns of devotion to Rainna amidst the ruins."
#  神罚……
  gts_rainna_la_grande_random.303.a: "Divine punishment..."
#  蕾恩娜的指尖轻轻探向星球。\n\n“来吧，接受我的恩典~”\n\n然而这一次，她似乎没能把握好力道。指尖刚一触及地表，那颗苹果般大小的星球便承受不住这难以想象的压力，从接触点开始，一道道裂缝迅速蔓延至整个球体。\n\n咔嚓。\n\n一声脆响，星球在她的指尖下彻底碎裂开来，化作数块残骸，岩浆与尘埃从每一道裂缝中喷涌而出。\n\n“……哎呀。”\n\n蕾恩娜微微一愣，看着指尖那团骤然崩解的残骸，歪了歪头。\n\n那份庄严的神明姿态出现了一丝裂痕。\n\n“嗯……嘛，就当这是……最后的审判好了~”\n\n她很快重新摆出了那副超然的神情，语气里却藏不住一丝心虚。\n\n“追随者们，你们对我的侍奉……算是合格吧。”\n\n只是这一次，已经没有任何信众能够听到她的话了。
  gts_rainna_la_grande_random.304_1.desc: "Rainna gently pressed her fingertip toward the planet.\\n\\n\"Come, receive my blessing~\"\\n\\nThis time, however, she seemed to have misjudged her strength. The moment her fingertip made contact, the apple-sized world buckled under the unimaginable force. Fissures instantly fractured across the entire sphere.\\n\\nCrack.\\n\\nWith a sharp snap, the planet shattered completely beneath her fingertip, disintegrating into ragged fragments as molten lava and mantle dust erupted from every seam.\\n\\n\"...Oops.\"\\n\\nRainna blinked, tilting her head at the pulverized debris drifting off her fingertip.\\n\\nHer solemn divine facade slipped for a fraction of a second.\\n\\n\"Uh... well, let's just call this... the Final Judgment~\"\\n\\nShe quickly regained her detached, ethereal poise, though her voice betrayed a hint of embarrassment.\\n\\n\"Followers, your service to me... was satisfactory enough.\"\\n\\nOnly this time, there was not a single devotee left to hear her words."
#  蕾恩娜缓缓将指尖压向星球。\n\n“注视着我，追随者们~这是你们的荣耀。”\n\n她的语气庄重而威严，指尖带着神明般的从容缓缓落下。然而这颗星球实在太过渺小、太过脆弱，指尖的力道还未真正施展，仅仅是那轻轻的一抵——\n\n星球就裂开了。\n\n裂缝以惊人的速度爬满了整个球体，紧接着，伴随着一声闷响，整颗星球在她的指尖下四分五裂，化作漫天飞散的碎片。\n\n“欸？”\n\n蕾恩娜眨了眨眼，脸上那副神圣的表情僵了一瞬。\n\n“这就……碎了？”\n\n她看着指尖那团意外崩解的残骸，一时间竟有些不知所措。方才还在虔诚呼喊着她名字的追随者们，此刻已经连同整颗星球一起，消散在了太空之中。\n\n短暂的沉默后，她轻咳了一声，努力重新找回那份神明的威仪。\n\n“……哼，看来你们的信仰，还不足以支撑起承受我恩典的资格呢~”\n\n她将这场意外解释成了追随者们自己的过失，语气里带着几分刻意的高傲。\n\n“下一次可要好好努力才行哦~”
  gts_rainna_la_grande_random.304_2.desc: "Rainna slowly lowered her fingertip toward the planet.\\n\\n\"Gaze upon me, my followers~ This is your glory.\"\\n\\nHer tone was solemn and dignified, her finger descending with celestial poise. But the planet was simply far too miniature, far too fragile; before she even applied any actual force, mere contact—\\n\\nCaused the planet to crack.\\n\\nFissures tore across the globe with terrifying speed. Then, with a muffled rumble, the entire world shattered under her fingertip, bursting into a cloud of scattered debris.\\n\\n\"Eh?\"\\n\\nRainna blinked, her holy expression freezing in place.\\n\\n\"It... already broke?\"\\n\\nShe stared at the disintegrated debris around her fingertip, momentarily at a loss. The followers who had just been fervently chanting her name had now evaporated into the cold void along with their world.\\n\\nAfter an awkward silence, she cleared her throat, striving to reassert her divine majesty.\\n\\n\"...Hmph, it seems your faith was simply not strong enough to withstand my grace~\"\\n\\nShe hastily blamed the accident on the followers' own inadequacies, speaking with forced arrogance.\\n\\n\"You'll have to try much harder next time~\""
#  不……
  gts_rainna_la_grande_random.304.a: "No..."
#  蕾恩娜居高临下地俯视着那颗被戳出巨坑、满目疮痍的星球，缓缓收回了手指。\n\n“嗯，今日的旨意，就到这里吧~”\n\n她的语气重新恢复了那份神明般的庄重，只是尾音里那一丝轻快，还是悄悄泄露了她的本性。\n\n“追随者们，继续侍奉我吧。”\n\n“你们的虔诚，我都记着呢~"她微微一顿，"……记着的。”\n\n她慵懒地转过身，长发在星光中缓缓飘散。\n\n“下次，我会再来检验你们的信仰的。”\n\n星球上，幸存的信众们跪伏在那道巨大的伤痕旁，向着离去的神明献上最后的赞歌。而蕾恩娜的身影，已经消失在了茫茫星海之中。
  gts_rainna_la_grande_random.305.desc: "Rainna looked down from above at the battered, crater-riddled planet and slowly retracted her finger.\\n\\n\"Mmm, that concludes today's decree~\"\\n\\nHer tone reclaimed its godlike solemnity, though the slight bounce in her cadence subtly betrayed her true personality.\\n\\n\"My followers, continue to serve me.\"\\n\\n\"Your devotion... I will remember it~\" She paused briefly. \"...Yes, remembered.\"\\n\\nShe turned lazily, her long hair floating gently through the starlight.\\n\\n\"Next time, I will return to test your faith once more.\"\\n\\nDown on the planet, surviving devotees prostrated themselves beside the titanic scar, lifting up parting hymns to their departing goddess. Meanwhile, Rainna's figure had already dissolved into the boundless sea of stars."
#  蕾恩娜看着指尖那片飘散的星球残骸，慵懒地舒展开身体。\n\n“嘛……戳得有点用力了呢~”\n\n她自言自语着，那份神明的庄严早已在星球碎裂的瞬间烟消云散，只剩下几分漫不经心的随意。\n\n“不过嘛，反正他们也是虔诚地……嗯，回归到我的怀抱里了嘛~”\n\n她试图用某种神圣的说辞来给这场意外收尾，却连自己都觉得有些牵强，索性摆了摆手。\n\n“算啦算啦~”\n\n她将视线从那片残骸上移开，望向了更远处的星海。\n\n“下次找颗结实点的星球，再好好当一次神明好了~”\n\n她漫不经心地说着，身影缓缓消失在星海之中。那片曾经信仰着她的星球，如今只剩下几块无声的残骸，永远地漂浮在了虚空里。
  gts_rainna_la_grande_random.306.desc: "Watching the pulverized planetary wreckage disperse from her fingertip, Rainna lazily stretched her body.\\n\\n\"Well... I poked a little too hard, didn't I~\"\\n\\nShe muttered to herself, her godly solemnity having evaporated the instant the planet shattered, replaced by her usual nonchalance.\\n\\n\"Still, at least they devoutly... uh, returned to my embrace, right~?\"\\n\\nShe attempted to rationalize the disaster with sacred dogma, but finding it too flimsy even for herself, she merely waved a dismissive hand.\\n\\n\"Whatever, whatever~\"\\n\\nLooking away from the debris, she cast her gaze into the deeper cosmos.\\n\\n\"Next time I'll find a sturdier planet, and play goddess properly again~\"\\n\\nTalking casually to herself, her figure slowly faded into the starry sea. The world that had worshipped her was reduced to silent fragments, drifting forever in the cold void."
#  祭典
  gts_rainna_la_grande_random.312.title: "The Festival"
#  又是一年一度的祭典之日。\n\n自从蕾恩娜降临以来，对她的崇拜早已深深融入了这个文明的血脉。曾经的恐惧，在漫长的岁月中逐渐演变成了虔诚的信仰；曾经那些夺走无数生命的灾难，如今被追奉为神明降下的神迹。而每一年的这一天，整个星球都会停下一切事务，举行盛大的祭典，向他们伟大的女神献上最崇高的敬意。\n\n神殿的钟声响彻云霄，信众们从四面八方涌向各地的圣坛。神职人员们身着华丽的祭袍，主持着庄严的仪式。\n\n而按照世代相传的传统，在祭典的核心环节，最高祭司将会通过某种古老的仪轨，“聆听”女神的旨意，宣告出蕾恩娜今年所要求的祭品。\n\n“女神的旨意已经降下。”\n\n最高祭司缓缓睁开双眼，声音在寂静的神殿中回荡。\n\n所有人都屏息等待着。\n\n女神要求的祭品，必须如数奉上——这是维系这份"恩宠"的代价，也是整个文明世代恪守的铁律。\n\n那么，今年，又该献上什么呢？
  gts_rainna_la_grande_random.312_1.desc: "It is that time of year once more: the day of the annual festival.\\n\\nEver since Rainna's first descent, worship of her has been etched into the very bloodstream of this civilization. The terror of old has mellowed into fervent piety across the ages; the catastrophes that once extinguished millions are now venerated as divine miracles. And on this specific day every year, all planetary operations cease for a grand festival to offer their highest reverence to their great goddess.\\n\\nTemple chimes echo to the skies as believers stream from all directions toward regional altars. Clerics clad in ornate vestments conduct solemn rituals.\\n\\nIn accordance with ancestral tradition, at the festival's climax, the High Priest conducts an ancient rite to \"commune\" with the goddess, proclaiming what tribute Rainna demands for the year.\\n\\n\"The Goddess's decree has descended.\"\\n\\nThe High Priest slowly opens his eyes, his voice carrying across the silent sanctuary.\\n\\nEveryone holds their breath in anticipation.\\n\\nWhatever tribute the Goddess demands must be presented in full—this is the price for maintaining her \"grace,\" and an ironclad law honored across generations.\\n\\nWhat, then, shall be offered this year?"
#  祭典之日又一次到来了。\n\n天还未亮，各地的神殿就已经灯火通明。信众们身着节日的盛装，扶老携幼地走出家门，汇成一条条虔诚的长河，涌向那些矗立在城市中心的巨大圣坛。空气中弥漫着焚香的气息，颂唱女神的圣歌声此起彼伏，从清晨一直持续到日暮。\n\n在这一天，没有人工作，没有人争执，整个文明都沉浸在对蕾恩娜的崇拜之中。孩子们从小就被教导，是伟大的女神眷顾着这颗星球，是她的恩宠让他们得以存续至今。\n\n而在祭典的最高潮，主教将登上圣坛的顶端，宣读女神今年的旨意。\n\n万众屏息。所有人都知道，接下来宣告的祭品，关乎着整个文明未来一年的命运。
  gts_rainna_la_grande_random.312_2.desc: "The day of the festival has arrived once again.\\n\\nLong before dawn, shrines across the world were ablaze with light. Dressed in their finest ceremonial attire, devotees escorted the elderly and the young, forming vast rivers of piety flowing toward titanic altars towering at the city centers. Incense perfumed the air, and sacred hymns honoring the goddess rose continuously from dawn until dusk.\\n\\nOn this day, none labor, none bicker; the entire civilization immerses itself in devotion to Rainna. From childhood, youngsters are taught that it is the great Goddess who watches over their world, and that her benevolence allows them to endure.\\n\\nAt the festival's zenith, the Primate ascends to the peak of the grand altar to read the Goddess's decree for the year.\\n\\nThe multitude holds its breath. Everyone knows that the tribute to be announced will decide the fate of their civilization for the coming year."
#  这一天，是献给女神蕾恩娜的日子。\n\n街道上张灯结彩，神殿前人山人海。祭典的队伍绵延数里，人们抬着精心准备的供品，唱着代代相传的赞歌，向着圣坛缓缓前行。孩童们手持点燃的烛火，老人们低声诵念着祷词，每一张面孔上都写满了虔诚。\n\n没有人记得，这份“信仰”最初其实源于恐惧。在漫长的岁月里，那些被女神的脚步碾碎的城市、被她的手指戳穿的大陆，都已经被重新诠释成了神圣的试炼与恩典。如今的人们，是真心实意地爱戴着、敬畏着他们的女神。\n\n祭典的核心环节即将开始。\n\n最高祭司步入圣坛中央，闭目凝神，开始与女神"沟通"。片刻之后，他睁开双眼，神情肃穆。\n\n“女神，已经降下了她的旨意。”\n\n他环视着台下无数双期待的眼睛，缓缓开口。\n\n“今年，我们需要为女神准备……”
  gts_rainna_la_grande_random.312_3.desc: "This day is dedicated wholly to the Goddess Rainna.\\n\\nStreets are adorned with festive lights, and crowds surge before the shrines. Processions stretch for leagues as pilgrims bear lavish offerings, singing age-old hymns as they march toward the altar. Children carry lit candles while the elderly whisper prayers; every face shines with devotion.\\n\\nNone remember that this \"faith\" was originally born from abject terror. Across the centuries, cities crushed beneath the Goddess's tread and continents punctured by her fingers have been reinterpreted into divine trials and acts of grace. The populace today loves and fears their deity with complete sincerity.\\n\\nThe core rite of the festival is at hand.\\n\\nThe High Priest enters the altar's center, closing his eyes in deep meditation to \"commune\" with the Goddess. After a quiet moment, he reopens his eyes, solemn and composed.\\n\\n\"The Goddess has delivered her divine will.\"\\n\\nSurveying the sea of expectant eyes below, he speaks slowly.\\n\\n\"This year, what we must prepare for the Goddess is...\""
#  又到了祭拜女神的时节。\n\n这是整个文明一年之中最重要的节日。从数月之前，各地就开始为这一天做准备——神殿被重新粉刷，圣坛被擦拭得一尘不染，神职人员们斋戒沐浴，信众们倾其所有地筹备供品。对于这个文明来说，没有什么比取悦他们的女神更为重要的事情了。\n\n祭典当日，钟鼓齐鸣，万人空巷。人们跪伏在圣坛之下，将额头贴在冰冷的地面上，用最谦卑的姿态迎接这神圣的时刻。\n\n传说中，女神会在这一天透过最高祭司之口，传达她的意愿。而她所要求的祭品，无论是什么，信众们都会想尽一切办法如数奉上——因为他们坚信，唯有满足女神的心意，才能换来她持续的庇佑。
  gts_rainna_la_grande_random.312_4.desc: "The season to worship the Goddess has returned.\\n\\nThis is the most paramount holiday of the entire civilization. Preparations began months in advance—shrines were repainted, altars polished spotless, clergy underwent ritual fasting and bathing, and the faithful gathered offerings with everything they owned. For this civilization, nothing mattered more than pleasing their Goddess.\\n\\nOn the day of the feast, bells and drums chimed across empty streets as all gathered at the shrine. The populace knelt beneath the grand altar, pressing their foreheads against the cold stone in humble anticipation of the holy moment.\\n\\nLegend holds that on this day, the Goddess speaks her will through the mouth of the High Priest. Whatever tribute she demands, the faithful will exhaust all means to deliver in full—believing firmly that only by satisfying the Goddess's desire can they secure her ongoing protection."
