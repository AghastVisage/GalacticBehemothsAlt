#  星球变得更加宜居。
  rainna_la_grande_miraculum_7_desc: "The planet has become more habitable."
#  灭绝诅咒
  rainna_la_grande_miraculum_8: "Curse of Extinction"
#  气候骤变，星球变得很不宜居。
  rainna_la_grande_miraculum_8_desc: "Sudden climatic shifts have made the planet extremely inhospitable."
#  蕾恩娜留下的巨型足印
  d_rainna_la_grande_giga_footprint: "Colossal Footprint Left by Rainna"
#  这个覆盖了整片大陆的巨型足印是蕾恩娜留下来的。曾经繁华的城市群、连绵的山脉、广袤的平原，都在她轻描淡写的一踩之下化为乌有。足印深处仍在涌动的岩浆让这颗星球不再适合居住，地壳的破碎也让这颗曾经美丽的星球变得不再稳定。然而讽刺的是，这场灾难反而让星球的矿物资源更易开采——仿佛是她留下的某种"恩赐"。
  d_rainna_la_grande_giga_footprint_desc: "This colossal footprint covering an entire continent was left behind by Rainna. Once-bustling city clusters, sprawling mountain ranges, and vast plains were all wiped out under her nonchalant step. Molten magma still churning in the depths of the print makes this planet no longer fit for habitation, and the shattered crust renders this formerly beautiful world unstable. Ironically, this catastrophe has instead made the planet's mineral resources easier to extract—as if it were some kind of \"boon\" she left behind."
#  蕾恩娜碾磨过的巨型足印
  d_rainna_la_grande_rubbed_giga_footprint: "Colossal Footprint Ground by Rainna"
#  这不仅仅是一个足印。蕾恩娜在踩下之后，还饶有兴致地用足底反复碾磨了几下，将破坏的范围扩大了数倍。原本清晰的足印轮廓被摩擦得模糊不清，取而代之的是一大片被彻底抹平的焦土。城市、山脉、河流，一切的一切都被碾成了紧贴地表的一层薄薄的痕迹，混杂在翻涌的岩浆与碎裂的地壳之间。这颗星球承受的，是远比一次踩踏更为彻底的蹂躏。
  d_rainna_la_grande_rubbed_giga_footprint_desc: "This is more than just a footprint. After stepping down, Rainna playfully ground her sole against the surface multiple times, expanding the scope of destruction several-fold. The once-distinct contour of the footprint was blurred by the friction, replaced by a massive expanse of completely flattened scorched earth. Cities, mountains, rivers—everything was pulverized into a thin smear clinging to the bedrock, mingled between churning magma and shattered crust. What this planet endured was a ravaging far more thorough than a simple stomp."
#  蕾恩娜留下的巨型足趾印
  d_rainna_la_grande_giga_toe_print: "Colossal Toe Print Left by Rainna"
#  一个巨大的圆坑，覆盖了曾经繁华的城市群以及周围连绵的山脉。至少她没有将整个巨足落下，也许，这也算是她的仁慈。
  d_rainna_la_grande_giga_toe_print_desc: "A massive circular crater covering what was once a bustling metropolitan cluster and the surrounding mountain ranges. At least she did not bring down her entire giant foot—perhaps, in a way, this could be considered her mercy."
#  蕾恩娜留下的巨型指印
  d_rainna_la_grande_giga_finger_print: "Colossal Fingerprint Left by Rainna"
#  一个巨大的圆坑，将曾经繁华的城市群、周围的山脉都在一瞬间化为一个深不见底的坑。深处仍在涌动的岩浆让这颗星球不再适合居住，这颗曾经美丽的星球也变得不再稳定。然而，这场灾难反而让星球的矿物资源更易开采，也许这就是她降下的"恩泽"。
  d_rainna_la_grande_giga_finger_print_desc: "A colossal crater that instantly reduced bustling cities and surrounding mountains into a bottomless pit. Molten magma still surging in its depths renders this world inhospitable, destabilizing what was once a beautiful planet. Yet, ironically, this disaster made the planet's mineral resources much easier to extract—perhaps this is the \"grace\" she bestowed upon us."
#  蕾恩娜的手指留下的峡谷
  d_rainna_la_grande_giga_finger_artwork: "Canyon Left by Rainna's Finger"
#  一个由纯粹的暴力美学挖出的巨型峡谷，巨大到甚至破坏了星球的稳定性。这条峡谷所覆盖的一切名胜古迹、城市群、山脉、甚至海洋已然完全被这平整的巨大峡谷替代。然而，一些深埋于地下的资源意外露出表面，这也许是她的恩赐。
  d_rainna_la_grande_giga_finger_artwork_desc: "A colossal canyon carved out by sheer violent aesthetics, so gargantuan that it destabilized the entire planet. All historical monuments, urban clusters, mountain ranges, and even oceans once situated here have been completely replaced by this smooth, immense gorge. Yet, certain resources buried deep underground were unexpectedly exposed to the surface—perhaps another of her boons."
#  蕾恩娜的体液湖
  d_rainna_la_grande_giga_sweat_lake: "Rainna's Bodily Fluid Lake"
#  一片乳白色的、散发着朦胧热气的巨大湖泊，是蕾恩娜停留时无意间留下的痕迹。湖水弥漫着某种令人陶醉却又难以名状的气息，据说靠近它的生物会不由自主地被吸引，直至沉醉其中、失去意识。这片湖泊的成分至今无法被完全解析，但它确实改变了这颗星球的生态，让周围的一切都笼罩在一层暧昧而危险的氤氲之中。
  d_rainna_la_grande_giga_sweat_lake_desc: "A massive, milky-white lake radiating a hazy warmth, left behind inadvertently during Rainna's visit. The waters emanate an intoxicating, indescribable scent; it is said that creatures drawing near are irresistibly drawn to it until they swoon and lose consciousness. The exact composition of this lake remains impossible to decipher, but it has profoundly reshaped the planet's ecology, shrouding everything nearby in an ambiguous and perilous vapor."
#  蕾恩娜之雨
  d_rainna_la_grande_giga_rainfall: "Rain of Rainna"
#  蕾恩娜心血来潮时降下的一场甘霖。与她惯常的破坏不同，这场雨带来的是纯粹的恩泽——清澈的雨水滋润了干涸的土地，抚平了创伤，让荒芜的大地重新焕发生机。作物茁壮成长，河流重新奔涌，整颗星球都因这场雨而变得更加富饶。也许，这就是她偶尔流露出的、罕见的温柔。
  d_rainna_la_grande_giga_rainfall_desc: "A sweet rainfall bestowed on a whim by Rainna. Unlike her usual devastation, this rain brought pure blessings—clear rainwater quenched the parched earth, healed scars, and rejuvenated the barren land with vibrant life. Crops flourished, rivers surged anew, and the entire planet grew richer from this downpour. Perhaps this was a glimpse of her rare, fleeting tenderness."
#  蕾恩娜碾磨过的超巨型足印
  d_rainna_la_grande_rubbed_giga_footprint2: "Super-Colossal Footprint Ground by Rainna"
#  这是一个大到超乎想象的足印，是蕾恩娜以更加庞大的姿态降临时留下的。仅仅一只足底，就覆盖了这颗星球相当大的一部分。而她并不满足于此，还在踩下之后反复碾磨，让破坏的范围进一步扩大。曾经的大陆、海洋、文明的一切痕迹，都在这难以想象的蹂躏中被彻底抹去，只剩下一片广袤无垠的焦土与翻涌的岩浆。这颗星球的地质结构已经濒临崩溃，能够残存至今，本身就是一个奇迹。
  d_rainna_la_grande_rubbed_giga_footprint2_desc: "This is a footprint vast beyond imagination, left behind when Rainna descended in an even more gigantic form. A single sole alone blanketed a considerable portion of this world. Unsatisfied with merely stepping down, she repeatedly ground her foot against the surface, expanding the realm of destruction still further. Former continents, oceans, and every trace of civilization were utterly obliterated in this unfathomable ravaging, leaving only a boundless expanse of scorched wasteland and churning magma. The planetary crust teeters on the brink of total collapse; that it survives at all is itself a miracle."
#  奇怪的黑洞
  anomaly_rainna_la_grande_clue_discovery_category: "Strange Black Hole"
#  昏暗的扭曲空间之内隐约散发着绝望的情绪。麻木、啜泣，悲鸣着、闪耀着。似乎原有什么谜团等待着被解开。
  anomaly_rainna_la_grande_clue_discovery_category_desc: "Within the dimly lit, distorted space, faint whispers of despair emanate. Numbness, sobbing, weeping, and flickering. It seems some original mystery awaits unraveling."
#  若安
  gts_jeanne_black_hole_name: "Jeanne"
