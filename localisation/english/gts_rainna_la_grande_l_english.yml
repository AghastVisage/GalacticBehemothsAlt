  gts_rainna_la_grande_first_meeting.07_random_6.desc: "\"Oh dear, my secret's out. But it's okay, you'll still welcome me, won't you?\""
#  “唔……这都被你们知道了。所以……你们还允许我来吗？”
  gts_rainna_la_grande_first_meeting.07_random_7.desc: "\"Mmh... so you figured that out too. So... will you still let me visit?\""
#  当然可以！
  gts_rainna_la_grande_first_meeting.07.a: "Of course you may!"
#  有时候过分热情的邀请，会换来意想不到的“惊喜”……
  gts_rainna_la_grande_first_meeting.07.a_tooltip: "Sometimes, an overly enthusiastic invitation brings an unexpected \"surprise\"..."
#  历史总是在重复，只是每次都会换个方式。
  gts_rainna_la_grande_first_meeting.07.a_tooltip_alter: "History always repeats itself, only changing its guise each time."
#  还是……算了吧
  gts_rainna_la_grande_first_meeting.07.b: "Perhaps... we'd rather not."
#  谨慎点也许能多周旋一会……
  gts_rainna_la_grande_first_meeting.07.b_tooltip: "A little caution might buy us more time to stall..."
#  我们对你有所怀疑，拒绝你的到来。
  gts_rainna_la_grande_first_meeting.07.c: "We are suspicious of you and refuse your arrival."
#  怀疑是明智的，但直接说出来就不一定了……
  gts_rainna_la_grande_first_meeting.07.c_tooltip: "Suspicion is wise, but blurting it out may not be..."
#  你的罪行罄竹难书，我们不会欢迎你的！
  gts_rainna_la_grande_first_meeting.07.d: "Your atrocities are beyond counting; you will never be welcome here!"
#  有些真相，说出来可能会很危险!
  gts_rainna_la_grande_first_meeting.07.d_tooltip: "Speaking certain truths can be extraordinarily dangerous!"
#  初次见面——伟大的蕾恩娜
  gts_rainna_la_grande_first_meeting.21.title: "First Meeting — Rainna the Great"
#  “哼哼哼……”\n\n通讯器的另一头传来了一声俏皮的冷笑。\n\n“看来你们这群小虫子真是愚蠢呢，居然就这样上了我的当了哦~”\n\n是“高的蕾恩娜”，只不过没想到她能够如此巨大。\n\n太空中，“高的蕾恩娜”的巨大身躯漂浮在这颗渺小的星球勉强，而这颗星球对她来说，也就只有瑜伽球般大小。她的身躯庞大无比，白皙的皮肤几乎全部暴露在宇宙中，只有一对黑色的胸罩与黑色胖次遮住了最重要的部位。她扭动着苗条的身躯，有些戏谑地说道。\n\n“唔，也许这是我们第一次见面吧。那就有请我来介绍一下我自己吧~哼哼……这可是你们的荣幸呢……”\n\n“我，伟大的蕾恩娜·德·让。我编的理由，什么天外来客、异乡的旅行者什么的都没有问题哦。我的确是来自这个宇宙之外的哦。而我扮演的则你们这个可怜宇宙的入侵者。嘛……其实也可以不这么说啦，也就是来玩一玩，玩够了就离开咯。”\n\n“嘛，所以你们的这颗星球可以用来怎么玩呢？”
  gts_rainna_la_grande_first_meeting.21.desc: "\"Heheheh...\"\\n\\nA playful sneer echoes from the other end of the communicator.\\n\\n\"It seems you little bugs really are foolish, falling for my trick just like that~\"\\n\\nIt is 'Tall Rainna'—though no one could have imagined she would be this colossal.\\n\\nIn the depths of space, the titanic form of 'Tall Rainna' looms before this minuscule world, which appears to her no larger than a yoga ball. Her physique is unfathomably immense, her fair, snow-white skin almost completely exposed to the cosmos, with only a black bra and black panties covering her most private areas. Wriggling her slender body, she speaks with mocking amusement.\\n\\n\"Well, I suppose this is our first official meeting. So allow me to introduce myself~ Heheh... you should consider this an honor...\"\\n\\n\"I am Rainna de Jeanne the Great. The excuses I spun—a visitor from the heavens, a wayfarer from a distant realm—weren't entirely lies, you know. I really do hail from beyond this universe. And my current role is that of an invader to your pathetic universe. Well... we don't have to put it so grimly; I'm simply here to play around for a bit, and once I've had my fun, I'll be on my way.\"\\n\\n\"So then... how should I play with this little planet of yours?\""
#  您……您好。
  gts_rainna_la_grande_first_meeting.21.a: "H-hello, Your Greatness..."
#  或许一个简单的问候能换来片刻的怜悯……
  gts_rainna_la_grande_first_meeting.21.a_tooltip: "Perhaps a simple greeting might earn a fleeting moment of mercy..."
#  不，请不要伤害我们。
  gts_rainna_la_grande_first_meeting.21.b: "No, please do not harm us."
#  祈求怜悯，还是在激发施虐欲？
  gts_rainna_la_grande_first_meeting.21.b_tooltip: "Does begging for mercy stay her hand, or merely stoke her sadism?"
#  不，求求你……别
  gts_rainna_la_grande_first_meeting.21.c: "No, please... don't..."
#  卑微的恳求往往换不来高贵的怜悯。
  gts_rainna_la_grande_first_meeting.21.c_tooltip: "Abject begging rarely garners noble mercy."
#  请不要低估我们的军事威慑力！
  gts_rainna_la_grande_first_meeting.21.d: "Do not underestimate our military deterrent!"
#  有时候，反抗只会让玩耍变得更有趣。
  gts_rainna_la_grande_first_meeting.21.d_tooltip: "Sometimes, resistance only makes the playtime more entertaining."
#  希望您愿意与我们做朋友。
  gts_rainna_la_grande_first_meeting.21.e: "We hope you might be willing to become our friend."
#  友谊，在力量悬殊时是多么可笑的词……
  gts_rainna_la_grande_first_meeting.21.e_tooltip: "Friendship—what a laughable notion in the face of such overwhelming disparity..."
#  天降的女神，请您指引这些迷失的灵魂。
  gts_rainna_la_grande_first_meeting.21.f: "Goddess descended from the heavens, please guide these lost souls."
#  用神明的光环掩饰恶魔的本质，只是你的自我安慰吧。
  gts_rainna_la_grande_first_meeting.21.f_tooltip: "Cloaking a demonic nature in divine glory is merely your own self-comfort."
#  你不是在这里服刑的吗？
  gts_rainna_la_grande_first_meeting.21.g: "Aren't you serving a sentence here?"
#  你能感受到她并不喜欢这个话题。
  gts_rainna_la_grande_first_meeting.21.g_tooltip: "You can sense that she does not appreciate this topic."
#  “哼哼……”\n\n一阵冰冷但是略感顽皮的笑声从通讯器的另一头传来。是一个属于少女的声音。\n\n “嘛，我猜你们一定以为我是‘高的蕾恩娜’吧。唔，不对哦……我可是‘伟大的蕾恩娜’哦。” \n\n她隐藏在黑暗中咯咯地笑着，就像是恶作剧得逞了一样。\n\n “嘿嘿，嘛，我也没想到你们就这样被我给欺骗了哦，就这样老老实实公开了你们的坐标，要不然我找你们还得一阵好找呢~真是谢谢你们哦。” \n\n伟大的蕾恩娜靠近了这颗行星。露出了她一丝不挂的巨大身躯。她全身雪白，娇嫩的皮肤看起来吹弹可破，光滑且柔软。就连撞在她的大腿上的小行星也在接触到她的皮肤的一瞬间粉碎。她的双手抓住如这颗星球一样巨大的双乳，有些玩味地扭动着身体。\n\n “嘛，看来我们的第一次见面就让你们如此惊讶呢……那是时候介绍一下我自己咯。我是伟大的蕾恩娜，来自另一个宇宙哦。至于我来的目的嘛……当然是为了玩啦~” \n\n“所以，应该先从那里开始玩呢？”
  gts_rainna_la_grande_first_meeting.22.desc: "\"Heheh...\"\\n\\nA chilling yet mischievous chuckle drifts from the other end of the communicator—the unmistakable voice of a young maiden.\\n\\n\"Well now, I bet you all thought I was 'Tall Rainna', didn't you? Mmh, wrong... I am 'Rainna the Great'.\"\\n\\nShe giggles in the dark, like a trickster revelling in a successful prank.\\n\\n\"Heheh, honestly, I never expected you to get duped so easily, handing over your coordinates without a fuss. Otherwise it would've taken me quite a while to hunt you down~ Really, thank you so much.\"\\n\\nRainna the Great glides closer to the planet, unveiling her entirely nude, colossal form. Her skin is alabaster white, delicate and supple, radiating a smooth softness. Even rogue asteroids hurtling into her thighs shatter into fine dust the instant they touch her skin. Cupping her breasts—each as massive as the entire planet itself—she wriggles her body with playful malice.\\n\\n\"My, it seems our first meeting has left you all so stunned... Then it's high time I properly introduced myself. I am Rainna the Great, hailing from another universe. As for why I came here... why, to play, of course~\"\\n\\n\"So then, where should the fun begin?\""
#  您……好。
  gts_rainna_la_grande_first_meeting.22.a: "H-hello..."
#  在巨大的恐惧面前，这样的礼貌还有意义吗？
  gts_rainna_la_grande_first_meeting.22.a_tooltip: "Before such unimaginable terror, does politeness hold any meaning?"
#  请不要伤害我们。
  gts_rainna_la_grande_first_meeting.22.b: "Please do not harm us."
#  示弱只会让猎手更兴奋……
  gts_rainna_la_grande_first_meeting.22.b_tooltip: "Showing weakness will only excite the hunter even more..."
#  求求你……不要伤害我们……
  gts_rainna_la_grande_first_meeting.22.c: "Please... don't hurt us..."
#  也许骄傲的巨娘会享受这种卑微的哀求。
  gts_rainna_la_grande_first_meeting.22.c_tooltip: "Perhaps a proud Giantess would relish such humble begging."
#  可恶的入侵者，你以为我们就怕了你吗？！
  gts_rainna_la_grande_first_meeting.22.d: "Wretched intruder, do you think we fear you?!"
#  向女神宣战，是勇气还是愚蠢？
  gts_rainna_la_grande_first_meeting.22.d_tooltip: "Declaring war on a goddess—is it bravery, or sheer folly?"
#  您好，可以与我们做朋友吗？
  gts_rainna_la_grande_first_meeting.22.e: "Hello, could you become friends with us?"
#  谁会和蚂蚁做朋友呢？
  gts_rainna_la_grande_first_meeting.22.e_tooltip: "Who would ever be friends with ants?"
#  伟大的女神，您就是经书中的降临者吗？
  gts_rainna_la_grande_first_meeting.22.f: "Great Goddess, are you the Advent one spoken of in the scriptures?"
#  崇拜她，真的能获得救赎吗？
  gts_rainna_la_grande_first_meeting.22.f_tooltip: "Will worshipping her truly bring salvation?"
#  你不是在这里服刑的吗？
  gts_rainna_la_grande_first_meeting.22.g: "Aren't you serving a sentence here?"
#  提醒困兽它的枷锁，会带来什么后果？
  gts_rainna_la_grande_first_meeting.22.g_tooltip: "What comes of reminding a caged beast of its chains?"
#  “啊啦啦~”\n\n通讯器的另一头传来一阵轻快却带着些许不悦的笑声。\n\n“没想到吧，还是找到你们了哦~”\n\n是“高的蕾恩娜”。只不过这次，她的语气中少了之前那份甜美，多了几分玩味的危险。\n\n太空中，“高的蕾恩娜”的巨大身影逐渐显现。她的身躯庞大得难以想象，而这颗星球在她眼中，不过是一颗柚子般大小的玩具。\n\n她身着黑色蕾丝胸罩和黑色蕾丝内裤，勾勒出完美的身体曲线，双腿上还套着一双白丝长筒袜。她慵懒地漂浮在太空中，用一种审视猎物的眼神打量着这颗渺小的星球。她的双腿横过来，洁白如玉的足底挡在了这颗星球的两侧。\n\n“不过呢，我本来是想要来友好访问的。”她歪着头，嘴角勾起一抹危险的笑容。\n\n“不过看来你们可一点都不友好呢……”\n\n她伸出纤细的手指，扰动着着这颗如同柚子般的星球，让它在太空中无助地旋转。\n\n“让我来介绍一下我自己吧~我是伟大的蕾恩娜·德·让。本来是一位热爱和平的旅行者……”\n\n她咯咯地笑着，显然很享受这种奇怪的快感。\n\n“不过你们拒绝我的时候，”她的声音突然变得低沉，“难道没有想过我有多么沮丧吗？”\n\n“所以，和平结束~”\n\n她兴奋地活动的足底，向星球靠拢，足底巨大的阴影很快遮蔽了原有的湛蓝色天空。
  gts_rainna_la_grande_first_meeting.31.desc: "\"Ara ara~\"\n\nA lighthearted yet slightly displeased chuckle echoes from the other end of the communicator.\n\n\"Surprised? I still found you~\"\n\nIt is \"Tall Rainna.\" Only this time, her tone lacks its earlier sweetness, laced instead with a playful sense of danger.\n\nIn the depths of space, the colossal figure of \"Tall Rainna\" gradually emerges. Her body is unimaginably gigantic, and in her eyes, this planet is nothing more than a pomelo-sized toy.\n\nDressed in a black lace bra and black lace panties that accentuate her flawless curves, she also wears a pair of white silk thigh-high stockings. Floating lazily through space, she gazes down at the tiny planet with the predatory eyes of a hunter appraising its prey. She brings her legs across, flanking the planet on both sides with her jade-like, fair soles.\n\n\"You know, I originally wanted to pay a friendly visit.\" She tilts her head, a dangerous smirk playing on her lips.\n\n\"But it seems you aren't friendly at all...\"\n\nShe reaches out a slender finger, nudging the pomelo-sized planet and sending it spinning helplessly in the void.\n\n\"Allow me to introduce myself~ I am the Great Rainna de Jeanne. Originally a peace-loving traveler...\"\n\nShe giggles, clearly relishing this peculiar thrill.\n\n\"Yet when you rejected me,\" her voice suddenly drops low, \"did you never consider how disheartened I would be?\"\n\n\"So, peace is over~\"\n\nExcitedly flexing her soles, she draws them closer toward the planet, the colossal shadows of her soles swiftly blotting out the once-azure sky."
#  我们并不弱小，并不会屈服于你。
  gts_rainna_la_grande_first_meeting.31.a: "We are not weak, and we will never bow to you."
#  在她的足底之间，反抗的声音能传达多远？
  gts_rainna_la_grande_first_meeting.31.a_tooltip: "Between her soles, how far can the voice of defiance truly carry?"
#  对不起，我们不应该拒绝您的好意。
  gts_rainna_la_grande_first_meeting.31.b: "We apologize; we should never have rejected your kindness."
#  道歉能让她收起那双危险的玉足吗？
  gts_rainna_la_grande_first_meeting.31.b_tooltip: "Can an apology convince her to withdraw those perilous feet?"
#  至高无上的女神，请原谅我们的无礼。
  gts_rainna_la_grande_first_meeting.31.c: "Supreme Goddess, please forgive our insolence."
#  神明会因为迟来的崇拜而仁慈吗？
  gts_rainna_la_grande_first_meeting.31.c_tooltip: "Will a deity show mercy just for belated adoration?"
#  之前是我们的外交人员表达有误……
  gts_rainna_la_grande_first_meeting.31.d: "Earlier, our diplomats merely miscommunicated..."
#  如此拙劣的借口真的能令她信服吗？
  gts_rainna_la_grande_first_meeting.31.d_tooltip: "Can such a clumsy excuse truly convince her?"
#  “哼~”\n\n通讯器中传来一声充满不满的轻哼。\n\n“本大小姐被怠慢这种事情可是很久都没有发生过了呢……”少女的声音中带着明显的不悦。“尤其是被你们这种渺小的低等生物的怠慢。”\n\n漆黑的太空中，一个庞大到难以理解的身影逐渐显现。\n\n一丝不挂的巨大少女漂浮在宇宙中，她那完美无瑕的雪白肌肤在星光下泛着如玉般的光泽。小行星撞击在她光滑的皮肤上，瞬间粉碎成尘埃，连一丝痕迹都没能留下。\n\n而对她而言，这颗曾经拒绝她的星球，不过是一颗葡萄般大小的小球，甚至比她的趾甲盖还要小。\n\n“不过也没关系的，毕竟你们的拒绝也没有什么用，不是么？”\n\n她的声音突然变得危险起来。她将脸庞凑过来，那双巨大的蓝色眼眸仔细地打量着它，就像在观察一个有趣的玩具。\n\n“自我介绍一下吧，我是伟大的蕾恩娜·德·让。本来是一位热爱和平的旅行者……前提是没有被某些小家伙怠慢。”\n\n她优雅地抬起一只脚，将那完美的足底展现在星球"面前"。雪白的足底光滑细腻，每一道掌纹都如同巨大的峡谷。她灵活地活动着足趾，那修长的趾头在星光下显得格外美丽。她张开脚趾靠近这颗星球，整颗星球悬浮在足趾旁边。\n\n“你们这颗脆弱的小星球如果被我轻轻一夹，大概会像真正的葡萄一样破碎掉吧？”
  gts_rainna_la_grande_first_meeting.32.desc: "\"Humph~\"\n\nA soft snort of utter discontent echoes through the communicator.\n\n\"It has been ages since anyone dared to slight this young lady...\" The maiden's voice carries unmistakable irritation. \"Especially when slighted by such insignificant lower lifeforms like you.\"\n\nIn the pitch-black void of space, an incomprehensibly gigantic figure gradually reveals itself.\n\nA completely naked colossal maiden floats in the cosmos, her flawless porcelain skin gleaming like jade beneath the starlight. Asteroids colliding against her smooth skin shatter instantly into dust, leaving not the slightest mark.\n\nAnd to her, this planet that once rejected her is nothing more than a grape-sized pebble, smaller even than her toenails.\n\n\"Not that it matters, since your rejection was utterly pointless anyway, wasn't it?\"\n\nHer tone turns suddenly menacing. Bringing her face close, those enormous blue eyes scrutinize the world as if examining a curious toy.\n\n\"Allow me to introduce myself: I am the Great Rainna de Jeanne. Originally a peace-loving traveler... provided I am not slighted by certain little creatures.\"\n\nShe elegantly lifts one foot, presenting that perfect sole right in 'front' of the planet. Her fair sole is smooth and delicate, every ridge and crease resembling a gargantuan canyon. She nimbly wiggles her toes, those slender digits looking exceptionally beautiful beneath the starlight. Splaying her toes, she draws close until the entire planet hovers right beside them.\n\n\"If I give this fragile little world of yours a gentle squeeze, I wonder if it would burst just like a real grape?\""
#  我们不会屈服你趾间的强大的力量。
  gts_rainna_la_grande_first_meeting.32.a: "We will not submit to the mighty strength within your toes."
#  在她的足趾之间，整个文明不过是一粒尘埃……
  gts_rainna_la_grande_first_meeting.32.a_tooltip: "Between her toes, an entire civilization is nothing more than a speck of dust..."
#  我们为对您的怠慢表示抱歉。
  gts_rainna_la_grande_first_meeting.32.b: "We apologize for slighting you."
#  道歉真的能平息她的不满吗？
  gts_rainna_la_grande_first_meeting.32.b_tooltip: "Can an apology truly appease her displeasure?"
#  至高无上的女神，请宽恕我们的无礼。
  gts_rainna_la_grande_first_meeting.32.c: "Supreme Goddess, please forgive our discourtesy."
#  被足趾轻轻一捏，祈祷还来得及吗？
  gts_rainna_la_grande_first_meeting.32.c_tooltip: "Once pinched by her toes, will prayers even be in time?"
#  对不起，是我们的信息传递有误……
  gts_rainna_la_grande_first_meeting.32.d: "We are sorry; there was an error in our messaging..."
#  在她股掌之间，借口还有意义吗？
  gts_rainna_la_grande_first_meeting.32.d_tooltip: "In the palm of her hand, do excuses hold any meaning?"
#  消失无踪
  gts_rainna_la_grande_first_meeting.41.title: "Vanished Without a Trace"
#  “呐呐呐呐呐，我收到钱了哦~”\n\n通讯器的另一头，传来蕾恩娜咯咯的笑声，听起来心情极好。\n\n“嘛，那么……”\n\n她的声音突然变得轻快，带着几分恶作剧得逞的愉悦。\n\n“拜拜咯~”\n\n信号就此中断。\n\n通讯器陷入了沉默。\n\n一秒，两秒，三秒……\n\n没有任何回音。\n\n投资方面的负责人面面相觑，没有人第一个开口说话。窗外的星空一片平静，那个自称旅行者的存在，连同所有的资金，就这样消失在了茫茫宇宙之中。\n\n“……”\n\n“她跑了。”
  gts_rainna_la_grande_first_meeting.41.desc: "\"Ne-ne-ne-ne-ne, I've received the money~\"\n\nFrom the other end of the communicator comes Rainna's giggling, sounding in exceptionally high spirits.\n\n\"Well then...\"\n\nHer voice suddenly turns light and cheerful, tinged with the delight of a prank successfully pulled off.\n\n\"Bye-bye~\"\n\nThe transmission cuts off.\n\nThe communicator falls silent.\n\nOne second, two seconds, three seconds...\n\nNot a sound.\n\nThe investment directors look at each other in bewilderment; no one speaks first. Beyond the window, the starscape rests in placid calm. That entity calling herself a traveler, along with all the funds, has vanished into the vast expanse of the cosmos.\n\n\"...\"\n\n\"She ran off with it.\""
#  “呐呐呐呐呐，我收到钱了哦。”\n\n通讯器的另一头传来蕾恩娜天真的笑声。\n\n“谢谢你们的投资呢~嘻嘻。”\n\n她停顿了一下，像是在享受这一刻。\n\n“那么，回头见，有好处我会分给你的哦~”\n\n“也许吧~”\n\n信号中断。\n\n没有人说话。所有人都盯着那台已经归于沉默的通讯器，等待着某个不会到来的后续。\n\n最终，有人轻声开口：\n\n“‘也许吧’是什么意思……”\n\n没有人回答这个问题。
  gts_rainna_la_grande_first_meeting.41_alter.desc: "\"Ne-ne-ne-ne-ne, I've received the money.\"\n\nRainna's innocent giggles drift over the communicator.\n\n\"Thank you for your investment~ Heehee.\"\n\nShe pauses for a moment, as if relishing the sensation.\n\n\"Well, see you later! If there's any dividend, I'll share it with you~\"\n\n\"Maybe~\"\n\nThe transmission terminates.\n\nSilence reigns. Everyone stares at the silent communicator, awaiting a follow-up that will never come.\n\nFinally, someone whispers:\n\n\"What did she mean by 'maybe'...\"\n\nNo one has an answer."
#  可恶，我的钱！
  gts_rainna_la_grande_first_meeting.41.a: "Dammit, my money!"
#  计划未得逞
  gts_rainna_la_grande_first_meeting.42.title: "Scheme Thwarted"
#  通讯器那头沉默了片刻。\n\n“用什么来交换……”\n\n蕾恩娜把这几个字重复了一遍，语气里带着几分不可置信。\n\n“欸欸欸——”\n\n她的声音突然拔高了一度，带着明显的委屈，“你们这群人是怎么回事嘛！我这么好的投资机会，你们居然还要讲条件？”\n\n“我就问你们，我值不值得投资？值不值得？”\n\n她停顿了一下，像是在等一个答案，随即又自顾自地说了下去。\n\n“嘛，算了算了，你们不投就算了~”\n\n语气转变得出奇地快，带着几分赌气的意味。\n\n“哼，你们以后会后悔的啦。”
  gts_rainna_la_grande_first_meeting.42.desc: "Silence lingers on the other end of the line for a moment.\n\n\"Exchange in return for what...\"\n\nRainna repeats the words, her tone laced with disbelief.\n\n\"Ehhhh—\"\n\nHer voice suddenly rises an octave, dripping with apparent grievance. \"What is wrong with you people! I offered such a golden investment opportunity, and you actually dare negotiate conditions?!\"\n\n\"I'm asking you right now: am I worth investing in? Am I?!\"\n\nShe pauses, as if waiting for an answer, before rambling on to herself.\n\n\"Well, fine, forget it! If you don't want to invest, then don't~\"\n\nHer mood pivots with astonishing speed, petulant and pouty.\n\n\"Humph, you're going to regret this later!\""
#  “……什么？”\n\n蕾恩娜的声音里带着一种被冒犯到的错愕，像是完全没料到会听到这个问题。\n\n“用。什么。来。交换。”\n\n她一个字一个字地重复着，语气越来越不对劲。\n\n“我是那种需要拿东西来换钱的人吗？嘛——”\n\n她发出一声拉得很长的抱怨，活像一个被否定了的孩子。\n\n“你们也太小气了吧！这点小钱都要斤斤计较的，真是的……”\n\n又是一阵沉默，然后她的声音重新响起，依然带着气鼓鼓的尾音：\n\n“哼，那就算了啦。你们这群抠门的家伙。”\n\n“……哼，你等着！”
  gts_rainna_la_grande_first_meeting.42_alter.desc: "\"...What?\"\n\nRainna's voice carries an offended astonishment, as if caught completely off guard by such a question.\n\n\"In. Return. For. What.\"\n\nShe repeats each syllable deliberately, her tone growing steadily more exasperated.\n\n\"Am I the kind of person who needs to put up collateral for pocket change? Jeez—\"\n\nShe lets out a drawn-out whine, just like a child whose pride was wounded.\n\n\"You are way too stingy! Nitpicking over such petty pocket money, honestly...\"\n\nAnother pause follows, before her voice returns, still trailing with a huffy pout:\n\n\"Humph, fine then, forget it. You bunch of penny-pinchers.\"\n\n\"...Hmph, just you wait!\""
#  她不值得投资。
  gts_rainna_la_grande_first_meeting.42.a: "She is not worth investing in."
#  也许她是一个骗子呢……
  gts_rainna_la_grande_first_meeting.42.b: "Perhaps she's just a scammer..."
#  踩踩踩
  gts_rainna_la_grande_first_meeting.211.title: "Trample, Trample, Trample"
#  “唔，你们也好啊~嘿嘿嘿……”\n\n信号的另一头，能够听到蕾恩娜天真的笑声。\n\n“就是不知道在你们的星球表面踩一脚，你们还好吗？真的好奇呢……”\n\n于是，蕾恩娜将她的足底对准这颗星球，随时准备找个位置踩下去。\n\n与此同时，地面上的人们可以清晰地看到天空中的蕾恩娜巨大的脸庞上露出可怖的笑容，尽管他们听不清楚蕾恩娜在说什么，紧张的氛围迎上了每一个人的心头。\n\n平时空旷的街道被满载逃命的人的车辆堵塞得水泄不通，每一辆想要远离蕾恩娜的汽车都只得停在原地动弹不得。鸣笛的声音此起彼伏，却没有办法给逃生带来一点希望。\n\n街道上顿时陷入一片混乱。人们仰望着天空中那张巨大的面庞，有的瘫坐在地，有的拼命奔逃，还有的则呆立原地，仿佛被恐惧冻结。警报声划破寂静的天际，但在这样的存在面前，这些声响显得如此苍白无力。\n\n各地的应急系统相继启动。避难警报声在每个街区回荡，紧急避难所的标识不断闪烁。政府大楼前，军队和警察正在紧急部署，却没人知道该如何应对这样的威胁。新闻直播画面中，各个城市的天空都能看到那张俯视众生的巨脸，那双含着笑意的眼睛，仿佛在注视着一群渺小的低等生命。\n\n城市中心，一些虔诚的信徒跪地祈祷，将这当作神明的显现。商业区里，人们抢购物资，争先恐后地囤积必需品。医院和避难所门前排起长队，家长们紧紧抱着自己的孩子。街道上四处都是被遗弃的车辆，它们的报警器此起彼伏地响着，更增添了几分末日般的氛围。\n\n而在这片混乱之中，蕾恩娜的笑声依然通过通讯系统传来，她似乎很享受这场由她导演的混乱。她的巨足依然悬在天空中，就像一片巨大的阴影，笼罩着整个星球，让所有人都在等待着那转瞬即至的毁灭。\n\n“啊啦~你们好像很害怕的样子呢？放心啦，我只是想找个地方站一下而已……”她的声音中带着天真的残酷，“不过，这么多人在逃命的样子，看起来还真有趣呢……”\n\n蕾恩娜陶醉在自己的宏伟之中自言自语……\n\n“唔，看来这颗小星球上面还是有模有样的嘛，究竟踩在哪里好呢？”
  gts_rainna_la_grande_first_meeting.211.desc: "\"Well, hello to you too~ Hehehe...\"\n\nFrom the other end of the signal, Rainna's innocent laughter drifts through.\n\n\"I just wonder: if I stomp down on your planet's surface, will you all still be fine? I'm really quite curious...\"\n\nAnd so, Rainna points the sole of her foot directly at the planet, poised at any moment to pick a spot and step down.\n\nMeanwhile, the people on the surface can clearly see a terrifying smile spread across Rainna's colossal face in the sky. Even if they cannot hear what she is saying, a suffocating dread grips every single heart.\n\nStreets that were once open and quiet are gridlocked with vehicles crammed with fleeing citizens, every car trying in vain to escape Rainna, left stranded in place. Horns blare frantically in every direction, yet offer not a shred of hope for salvation.\n\nThe streets dissolve into sheer pandemonium. Staring up at that gigantic face dominating the heavens, some collapse limp on the pavement, others run blindly, and still others stand frozen where they are, paralyzed with terror. Sirens pierce the sky, but before an existence like hers, their wails are utterly frail and useless.\n\nEmergency response systems ignite worldwide. Evacuation alarms howl across every district, and shelters flash their beacons incessantly. Outside government buildings, military forces and police deploy in desperate haste, yet no one has any idea how to counter such a threat. On live news broadcasts across the globe, skies above every metropolis are filled with that towering face looking down upon mortal life—those smiling eyes regarding them as though watching insignificant lower organisms.\n\nIn city squares, pious believers kneel in prayer, taking this as the manifestation of a divine being. In commercial centers, frantic crowds loot and scramble to hoard supplies. Endless lines form outside hospitals and shelters as parents cling desperately to their children. Abandoned cars litter the streets, their alarms shrieking in chaotic unison, adding to the apocalyptic dread.\n\nAmidst this widespread chaos, Rainna's laughter continues to hum over the comms. She seems to thoroughly savor this grand turmoil she has orchestrated. Her gigantic foot still looms suspended in the sky like an enormous shadow smothering the entire world, leaving everyone in agonizing anticipation of imminent doom.\n\n\"Ara~ you all seem so terrified! Don't worry, I just want to find a place to stand on...\" Her voice bears an innocent cruelty. \"Though seeing so many little people scrambling for their lives really is quite entertaining...\"\n\nIntoxicated by her own grandeur, Rainna murmurs to herself...\n\n\"Mmm, looks like this tiny planet is actually quite neat and tidy. Now, where should I step?\""
#  等一下！
  gts_rainna_la_grande_first_meeting.211.a: "Wait!"
#  我还不想……
  gts_rainna_la_grande_first_meeting.211.a_tooltip: "I don't want to... just yet..."
#  不，也许我们可以谈一谈！
  gts_rainna_la_grande_first_meeting.211.b: "No, perhaps we can talk this through!"
#  也许吧……
  gts_rainna_la_grande_first_meeting.211.b_tooltip: "Perhaps..."
#  “哼哼……”\n\n信号的另一头传来蕾恩娜抑制不住的轻笑，那声音中既有天真与欢快，又暗含着某种危险的期待。\n\n“嘛……既然你们恭恭敬敬地提出了请求，那……满足我一点小小的要求也是不过分的吧……”\n\n她拖长了语调，声音中充满着顽皮的期待，似乎有什么有趣的点子。\n\n“嘿嘿……那么，我们做一个公平的交易吧~”\n\n黑暗的太空中，蕾恩娜的身影突然显现。银河的星光为她白皙的肌肤镀上一层梦幻的光晕，衬托得她那巨大的身躯更加不真实。\n\n“很简单哦，我只想在你们的星球上留下一个小小的足印而已。作为回报，我保证不会再伤害你们~”\n\n她巨大的足底突然覆盖了天空，即将压下来。\n\n话音未落，她的巨足就悄然移动到了行星上空。那雪白的足底几乎遮蔽了整片天空，让整个大陆陷入了不自然的黑暗。足底的每一道纹路都清晰可见，比城市的街道还要宽阔。\n\n“嘛，这个交易蛮划算的，不是吗？”\n\n在这片可怖的阴影下，地面上的一切都显得如此渺小。人们仰望着天空，看着那个足以轻易毁灭他们的存在，正在用温柔的语气谈论着“公平交易”。\n\n“嘛……真是一项公平的提议呢……”
  gts_rainna_la_grande_first_meeting.212.desc: "\"Hehehe...\"\n\nFrom the other side of the comms comes Rainna's irrepressible giggle, a voice combining innocence and cheer with a dangerous anticipation.\n\n\"Well... since you asked so politely and respectfully, then... granting a tiny request of mine wouldn't be too much to ask, right?...\"\n\nShe draws out her words, her voice rich with mischievous excitement, as though struck by an amusing idea.\n\n\"Hehe... how about we make a fair trade?~\"\n\nIn the dark vacuum of space, Rainna's form suddenly manifests. Galactic starlight coats her fair skin in a dreamy luminescence, making her titanic silhouette seem all the more unreal.\n\n\"It's very simple: I only want to leave a little footprint on your planet. In return, I promise not to hurt you any further~\"\n\nHer gigantic sole suddenly eclipses the heavens, poised to press downward.\n\nBefore her words even finish, her giant foot has quietly positioned itself right above the planet. That snow-white sole blocks out nearly the entire sky, plunging whole continents into an unnatural twilight. Every groove and crease of her sole is distinctly visible, wider than any city boulevard.\n\n\"Well, that's quite a bargain, isn't it?\"\n\nBeneath that dreadful shadow, everything on the surface looks infinitesimal. People gaze upward at an entity capable of wiping them out with trivial ease, who speaks of a \"fair trade\" in such gentle, playful tones.\n\n\"Mmm... what a fair proposal indeed...\""
#  “欸——这是要宣战了吗？难不成……”\n\n蕾恩娜优雅地抬起修长的腿，弯曲足弓，将她白皙的足趾展示在这颗星球面前。每一个轻微的动作都让大气层泛起涟漪，那完美的足型投下的阴影足以笼罩一片大陆。\n\n“难不成我想要在这颗小星球上留下标记的计划暴露了？唔！那可真的是太不好了……”\n\n她灵巧地活动着足趾，这看似随意的动作却在大气中掀起一阵温和的飓风，横扫过整片大陆。城市的尖塔在这阵气流中摇摇欲坠，树木纷纷弯折，海面掀起滔天巨浪。\n\n“那……就将计就计吧~”
  gts_rainna_la_grande_first_meeting.214.desc: "\"Eh—are you declaring war on me? Could it be...\"\n\nRainna gracefully lifts her long leg, arching her foot and displaying her fair toes before the planet. Every slight movement causes ripples through the atmosphere, the shadow cast by her flawless foot enough to blanket an entire continent.\n\n\"Could it be that my plan to leave a little mark on this tiny planet was exposed? Ugh! That is really too bad...\"\n\nShe nimbly wiggles her toes; that seemingly casual motion stirs a gentle hurricane within the atmosphere that sweeps across the continent. City spires shudder and sway in the gale, trees bend and snap, and colossal waves churn across the ocean.\n\n\"Well... then I'll just turn your plan to my advantage~\""
#  不！停战、停战！
  gts_rainna_la_grande_first_meeting.214.a: "No! Ceasefire, ceasefire!"
#  成功激起了她的欲望，真的能停下来吗？
  gts_rainna_la_grande_first_meeting.214.a_tooltip: "Having aroused her desire, can she truly be stopped?"
#  可恶，给我上！
  gts_rainna_la_grande_first_meeting.214.b: "Curse you, attack!"
#  蝼蚁般的军队面对如此悬殊的对手无异于飞蛾扑火……
  gts_rainna_la_grande_first_meeting.214.b_tooltip: "An ant-like army facing such an overwhelming opponent is nothing but moths to a flame..."
#  “啊啦啦~当然可以......”\n\n蕾恩娜咯咯地笑着，那银铃般的笑声在通讯器中回荡。她似乎对刚才自己不经意间将大气搅得一团糟毫无察觉，或者说，她压根就不在意。她那巨大的面庞凑近这颗渺小的行星，湖泊般清澈的蓝色眼眸闪烁着好奇的光芒，将这个星球的每一个细节都尽收眼底。\n\n每当她轻轻眨眼，那如同城市般巨大的睫毛便会扰动大气层，掀起持续不断的狂风。地面上的树木被吹得东倒西歪，海面上巨浪翻涌，但她似乎完全没有意识到自己的存在本身就是一场灾难。\n\n“嘿嘿嘿……”\n\n她优雅地蜷起修长的双腿，用纤细的手指轻柔地抚摸着自己微微攒动的足趾。那雪白的足底在星光下泛着柔和的光泽，每一道纹路都如同山谷般清晰。她看起来心情极好，笑眯眯地歪着脑袋，就像一个得到了新玩具的孩子。\n\n“你们说……”她的声音中带着期待和些许狡黠，“我的足趾漂亮吗？”\n\n她将足底托在双手上，在太空中轻轻地扭动着那十根足趾。每一根足趾的活动都带起微妙的气流变化，让地面上的气象观测站陷入混乱。她似乎在等待着什么出乎意料的回应，那双清澈的眼睛中闪烁着危险的光芒。\n\n“我倒是很好奇……”她俯视着这颗星球，声音突然变得轻柔而危险。“这个星球踩起来会是什么样的感觉呢……”\n\n她的足底缓缓从手中抬起，在大气层外划出一道优美的弧线。那完美的足型投下的阴影如同一片移动的黑暗，扫过一座又一座城市。每当阴影经过，街道上的人们都会惊恐地仰望天空，看着那个随时可能落下的“审判”。\n\n“作为朋友……”她的声音中带着天真的残酷，“你们应该不介意让我试试吧？”\n\n空气中弥漫着令人窒息的紧张感。所有人都意识到，这个看似友善的提议，实际上根本不是一个可以拒绝的选择。
  gts_rainna_la_grande_first_meeting.215.desc: "\"Ara ara~ of course you can...\"\n\nRainna giggles, her bell-like laughter resonating through the communicator. She seems utterly oblivious to the havoc she inadvertently wreaked upon the atmosphere earlier—or rather, she simply couldn't care less. Her titanic face leans in close to the diminutive planet, lake-clear blue eyes glimmering with curiosity, drinking in every minute feature of this world.\n\nWhenever she blinks, her eyelashes—vast as cities—stir the atmosphere, whipping up relentless gales. Trees on the surface are blown flat, ocean swells surge violently, yet she remains wholly oblivious that her sheer presence is itself a catastrophe.\n\n\"Hehehe...\"\n\nGracefully curling her slender legs, she gently strokes her wriggling toes with delicate fingers. Her snow-white soles glow with a soft luster beneath the starlight, every crease as distinct as a mountain valley. She seems in tremendous spirits, tilting her head with a beaming smile like a child who has just received a brand-new toy.\n\n\"Tell me...\" Her voice carries anticipation and a hint of cunning, \"Are my toes pretty?\"\n\nCradling her soles in both hands, she gently flexes those ten toes in space. The movement of each toe generates subtle shifts in air currents, throwing surface meteorological stations into chaos. She seems to anticipate an unexpected response, a perilous glint sparkling within her clear eyes.\n\n\"I'm really quite curious...\" Looking down at the world, her voice suddenly turns soft and dangerous. \"What does it feel like to step on this planet, I wonder...\"\n\nSlowly releasing her feet from her hands, her sole traces an elegant arc outside the atmosphere. The shadow cast by that perfect foot glides like a shifting darkness across city after city. Wherever the shadow passes, terrified people on the streets look up at the sky, beholding a 'judgment' that could drop at any moment.\n\n\"As friends...\" Her tone bears an innocent cruelty, \"you wouldn't mind letting me give it a try, would you?\"\n\nA suffocating tension chokes the air. Everyone realizes that this seemingly friendly suggestion is in fact not a choice one can ever refuse."
#  我们可商量……
  gts_rainna_la_grande_first_meeting.215.a: "We can negotiate..."
#  拿出可以谈判的所有筹码，能比得上她的一根足趾吗？
  gts_rainna_la_grande_first_meeting.215.a_tooltip: "Can all the bargaining chips you muster even compare to a single one of her toes?"
#  等一下！朋友……
  gts_rainna_la_grande_first_meeting.215.b: "Wait! Friend..."
#  怠慢了你的新朋友，她会很生气的……
  gts_rainna_la_grande_first_meeting.215.b_tooltip: "If you slight your new friend, she will be very angry..."
#  听到这个回答，蕾恩娜缓缓闭上了那双明亮的眼眸。她的面容在星光下显得格外柔和，嘴角浮现出一抹优雅而满意的微笑。她那充满灵性的巨大身躯在太空中轻轻舒展，仿佛在用整个存在去感受来自这颗渺小星球上无数生命的气息。\n\n这个出乎意料的回答，显然让她心情愉悦。\n\n片刻后，她睁开双眼，那湖泊般清澈的蓝色瞳孔中闪烁着满足的光芒。她的双臂平静地交叉在胸前，就像是在摆出某种无比神圣的姿态。她平静地凝视着这个微小的世界，声音变得轻柔而庄重。\n\n“看来这个宇宙的一角，居然有对我的崇拜……”\n\n她试图模仿那些古老典籍中记载的神明形象，摆出一副庄严肃穆的姿态。但她声音中那按捺不住的顽皮和兴奋。\n\n“那么，作为你们自古以来……” 她故意停顿了一下，俏皮地眨了眨眼，“不，也许是新晋的至高之神，我欣然接受你们卑微的崇拜。”\n\n她优雅地调整着姿势，长发在无重力的太空中如瀑布般飘散。\n\n“而作为回应……”她的声音突然变得神秘而期待，“身为神明，若不展示一下我的伟大，岂不是有些遗憾呢……”\n\n说着，她屈起修长的左腿，将那如玉般洁白无瑕的足底抬至面前。透过朦胧的大气层，那完美的足型投下了一片遮天蔽日的阴影，笼罩了大半个星球。整个世界瞬间陷入黑暗，仿佛夜幕突然降临。\n\n“让我想想……”她的声音透过通讯器传来，带着几分戏谑，“神明该如何向信徒展示恩泽呢？”\n\n她的足趾在空中轻轻晃动，每一个微小的动作都让地面上的人们心跳加速。那遮蔽天空的足底如同一把悬在头顶的重锤，随时可能落下。
  gts_rainna_la_grande_first_meeting.216.desc: "Hearing this answer, Rainna slowly closes her bright eyes. Her face appears exceptionally gentle under the starlight, an elegant and satisfied smile gracing her lips. Her ethereal long hair spreads softly across the vacuum like a flowing river of stars, exuding a sacred, inviolable aura.\n\nAt this moment, she no longer resembles a mischievous girl; she truly reveals a transcendent divinity. That pure, grand, unapproachable majesty fills everyone observing through scientific instruments with profound awe.\n\n\"A goddess, you say...\"\n\nHer voice turns soft and distant, devoid of its playful edge. Each word resounds through the atmosphere like a morning bell struck in the cosmos, clear and solemn, soothing the panicked creatures below who trembled in dread.\n\n\"Since you revere me as your goddess...\"\n\nSlowly opening her eyes, profound light swirls within those sky-blue orbs. She gracefully raises one hand, resting it lightly against her chest in an ancient, stately gesture.\n\n\"Then... demonstrate your sincerity.\"\n\nA faint, enigmatic smile graces the corner of her lips—a transcendent saintliness that still carries an elusive hint of playfulness.\n\n\"Let me see how you intend to serve your goddess.\""
#  我们愿意接受神明的恩泽……
  gts_rainna_la_grande_first_meeting.216.a: "We are willing to receive our goddess's divine grace..."
#  顺从神明的意志，或许能换来些许怜悯……
  gts_rainna_la_grande_first_meeting.216.a_tooltip: "Submitting to divine will might perhaps earn a modicum of mercy..."
#  请女神降下您的神迹吧！
  gts_rainna_la_grande_first_meeting.216.b: "Please, Goddess, bestow your miracles upon us!"
