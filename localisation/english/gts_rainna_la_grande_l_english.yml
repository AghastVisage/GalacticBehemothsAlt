  gts_rainna_la_grande_first_meeting.03.f: "You want our Energy Credits? What do you offer in return?"
#  “嘛，你的投资总是值的嘛，难道我不是你值得投资的吗？不是吗？”
  gts_rainna_la_grande_first_meeting.03.f_tooltip: "\"Well, an investment is always worthwhile, and aren't I worth investing in? Aren't I?\""
#  高的蕾恩娜！
  gts_rainna_la_grande_first_meeting.04.title: "\"Tall Rainna\"!"
#  信号那头沉默了片刻。\n\n“这个嘛……”\n\n她的声音带着几分刻意的含糊，像是在认真思考该怎么回避这个问题。\n\n“嘿嘿，保密~反正你们注意一下就好了。”\n\n她很快将话题带了回来：“所以……你们愿意接待我吗？”
  gts_rainna_la_grande_first_meeting.04_random_1.desc: "Silence lingers on the other end of the line for a moment.\\n\\n\"Well, that...\"\\n\\nHer voice carries an intentional vagueness, as if she is carefully contemplating how best to dodge the question.\\n\\n\"Heheh, that's a secret~ You'll just have to watch out for yourselves.\"\\n\\nShe swiftly pivots back to the topic: \"So... are you willing to host me?\""
#  “欸，这个嘛……”\n\n她的语气有些不自然，像是被问到了某个不太想回答的问题。\n\n“出门得弯腰的那种程度吧~要不然就顶到门框上了。”\n\n她轻描淡写地说着，仿佛这是一件再普通不过的小事。\n\n“反正……你们到时候就知道了嘛~所以，你们愿意接待我吗？”
  gts_rainna_la_grande_first_meeting.04_random_2.desc: "\"Eh, about that...\"\\n\\nHer tone turns awkward, as if pressed on a topic she'd rather not discuss.\\n\\n\"Tall enough that I have to duck when going through doors~ Otherwise my head would hit the frame.\"\\n\\nShe says it casually, as though it were the most ordinary little thing.\\n\\n\"Anyway... you'll find out when the time comes~ So, are you willing to host me?\""
#  “这是人家的隐私好不好？”\n\n她的语气带着几分撒娇式的不满。\n\n“再说了，这跟你们愿不愿意接待我有什么关系嘛~”\n\n她停顿了一下，补充道：\n\n“……欸，按照你们的标尺的话，大概有个几米高？反正不高的啦，你们注意一下就是咯。”
  gts_rainna_la_grande_first_meeting.04_random_3.desc: "\"That's private personal information, okay?\"\\n\\nHer tone carries a pouty, playful grievance.\\n\\n\"Besides, what does that have to do with whether you're willing to host me~\"\\n\\nShe pauses briefly before adding:\\n\\n\"...Well, by your measurements, maybe a few meters tall? Not that big at all, really. Just keep an eye out, okay?\""
#  “我很矮的好不好……”\n\n她理直气壮地说道。\n\n“我才……反正我很矮的，比你们高不了多少。”\n\n她似乎意识到这个回答有些站不住脚，随即转移了话题：\n\n“好啦好啦，这种问题不重要嘛~你们愿不愿意让我来歇脚才是正事~”
  gts_rainna_la_grande_first_meeting.04_random_4.desc: "\"I'm actually quite short, you know...\"\\n\\nShe asserts with unearned confidence.\\n\\n\"I'm only... anyway, I'm really short, barely any taller than you guys.\"\\n\\nSensing that her claim doesn't hold much water, she promptly changes the subject:\\n\\n\"Alright, alright, that's not important~ Whether you'll let me come over and rest is what really matters~\""
#  “我不清楚欸。”\n\n她的语气听起来相当认真，像是在真正思考这个问题。\n\n“按照你们的标尺的话……大概3米？唔，好像比你们的平均身高高了那么一点点呢~”\n\n短暂的停顿。\n\n“……也许吧。反正你们到时候别太惊讶就好。所以，你们愿意接待我吗？”
  gts_rainna_la_grande_first_meeting.04_random_5.desc: "\"I'm not really sure.\"\\n\\nShe sounds earnest, as though genuinely pondering the question.\\n\\n\"By your standards... maybe around 3 meters? Hmm, that's just a tiny bit taller than your average height, isn't it~\"\\n\\nA brief pause.\\n\\n\"...Maybe. In any case, just try not to be too surprised when I arrive. So, are you willing to host me?\""
#  欢迎你来到我们的星球！
  gts_rainna_la_grande_first_meeting.04.a: "Welcome to our planet!"
#  她对身高含糊其辞，事情真的有这么简单吗？
  gts_rainna_la_grande_first_meeting.04.a_tooltip: "She was awfully evasive about her height. Could things really be that simple?"
#  还是算了吧，我们实在是不方便……
  gts_rainna_la_grande_first_meeting.04.b: "We'd rather not. It really isn't convenient for us..."
#  有时候，直觉的警惕是对的……
  gts_rainna_la_grande_first_meeting.04.b_tooltip: "Sometimes, intuitive caution is well justified..."
#  不行。不行！
  gts_rainna_la_grande_first_meeting.04.c: "No. Absolutely not!"
#  强硬地拒绝往往会换来更大的麻烦……
  gts_rainna_la_grande_first_meeting.04.c_tooltip: "A blunt refusal often invites even greater trouble..."
#  疑点
  gts_rainna_la_grande_first_meeting.05.title: "Doubts"
#  “哦……原来你们认识我啊……”
  gts_rainna_la_grande_first_meeting.05_random_1.desc: "\"Oh... so you recognize me...\""
#  “欸……你们从哪里听得我的名讳？”
  gts_rainna_la_grande_first_meeting.05_random_2.desc: "\"Eh... where did you hear my name from?\""
#  “什么意思？还有另一个人也叫‘高的蕾恩娜’吗？”
  gts_rainna_la_grande_first_meeting.05_random_3.desc: "\"What do you mean? Is there someone else also called 'Tall Rainna'?\""
#  “原来我的名声如此之大呢……。”
  gts_rainna_la_grande_first_meeting.05_random_4.desc: "\"So my fame precedes me to such an extent...\""
#  没，没什么。
  gts_rainna_la_grande_first_meeting.05.a: "N-nothing. It's nothing."
#  如此拙劣的掩饰令人起疑。
  gts_rainna_la_grande_first_meeting.05.a_tooltip: "Such a clumsy cover-up arouses suspicion."
#  好像在哪里听说过……
  gts_rainna_la_grande_first_meeting.05.b: "I seem to have heard that name somewhere..."
#  有时，含糊其辞只是欲盖弥彰。
  gts_rainna_la_grande_first_meeting.05.b_tooltip: "Sometimes, playing dumb only makes the truth more obvious."
#  我们见过你的塑像。
  gts_rainna_la_grande_first_meeting.05.c: "We have seen your statues."
#  祸从口出。
  gts_rainna_la_grande_first_meeting.05.c_tooltip: "Careless talk invites disaster."
#  我们考古到的文件中有提及……。
  gts_rainna_la_grande_first_meeting.05.d: "Documents recovered from our archaeological digs mentioned it..."
#  有些真相只应该被隐藏在心里。
  gts_rainna_la_grande_first_meeting.05.d_tooltip: "Some truths are better kept buried in your heart."
#  宣战陌生的少女
  gts_rainna_la_grande_first_meeting.06.title: "Declaring War on the Strange Maiden"
#  信号那头沉默了片刻。\n\n“哼……”\n\n“看来你们这是向我宣战了？”\n\n她的声音听起来不像是愤怒，倒更像是某种意外之后的确认。像是在核实一件难以置信的事实。\n\n“好吧，我明白了。”
  gts_rainna_la_grande_first_meeting.06_random_1.desc: "The line falls silent for a moment.\\n\\n\"Hmph...\"\\n\\n\"So, you're declaring war on me?\"\\n\\nHer voice sounds less like anger and more like confirmation after a sudden surprise—as if verifying an unbelievable fact.\\n\\n\"Alright, I understand.\""
#  信号那头传来了一声轻哼。\n\n“怎么，想要和我宣战？”\n\n她的语气带着几分不可置信，随即变得有些玩味。\n\n“……好，那就这样吧。”
  gts_rainna_la_grande_first_meeting.06_random_2.desc: "A soft hum comes across the channel.\\n\\n\"What, you want to declare war on me?\"\\n\\nHer tone is laced with disbelief, quickly shifting into amused playfulness.\\n\\n\"...Fine, let's have it your way then.\""
#  “欸，怎么能这样嘛……”\n\n她的声音中带着几分委屈，但很快又平静了下来。\n\n“好嘛好嘛，我知道了。”\n\n信号就此中断。
  gts_rainna_la_grande_first_meeting.06_random_3.desc: "\"Eh, how could you be like this...\"\\n\\nHer voice carries a hint of wounded grievance, yet quickly settles into calm.\\n\\n\"Fine, fine, I got it.\"\\n\\nThe signal abruptly cuts out."
#  信号那头什么声音都没有，沉默了很久。\n\n“……哼。”\n\n就这一个字，随即信号中断。\n\n不知为何，那短暂的沉默比任何言语都更令人不安。
  gts_rainna_la_grande_first_meeting.06_random_4.desc: "Nothing but dead air comes from the other end of the line, followed by prolonged silence.\\n\\n\"...Hmph.\"\\n\\nJust that single syllable, and the signal terminates.\\n\\nFor reasons unknown, that brief silence is far more unsettling than any words could ever be."
#  宣战！
  gts_rainna_la_grande_first_meeting.06.a: "Declare War!"
#  边检
  gts_rainna_la_grande_first_meeting.07.title: "Border Inspection"
#  “哦……这样啊……那请问你还愿意让我拜访你们的星球吗？”
  gts_rainna_la_grande_first_meeting.07_random_1.desc: "\"Oh... I see... In that case, are you still willing to let me visit your planet?\""
