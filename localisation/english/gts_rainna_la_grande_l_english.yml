  gts_rainna_la_grande_arch.10_2_micro_alter.desc: "Decoding this signal proved exceedingly arduous. The text reconstructed by the team reads as follows:\n\n\"Mother, Lady Jeanne has issued your final sentence—for your crimes, imprisonment for a term of twelve billion years...\"\n\nThe transmission paused here with palpable frequency jitter, followed by long, muffled weeping, held back with desperation yet impossible to fully conceal.\n\n\"Mother... please allow me to stay with you a little longer. For our final moments together before we part...\"\n\nAfter confirming the translation, none of the researchers spoke. Yet no further useful data could be retrieved."
#  这段信号的解码过程异常艰难。科研团队最终还原出的文本如下：\n\n“主人，让娜大人给您下达了最终的命令——针对您的罪行，有期徒刑，一百二十亿年……”\n\n信号在此处出现明显的停顿与频率抖动，随后是长时间的、无声的啜泣，像被极力压抑却无法完全消除。\n\n“主人……请允许我再陪您一段时间。在我们分离前的最后一段时间……”\n\n科研人员在确认译文后，没有人立刻开口。然而，再也没有任何有用的信息。
  gts_rainna_la_grande_arch.10_2_micro_alter2.desc: "Decoding this signal proved exceedingly arduous. The text reconstructed by the team reads as follows:\n\n\"Master, Lady Jeanne has issued your final sentence—for your crimes, imprisonment for a term of twelve billion years...\"\n\nThe transmission paused here with palpable frequency jitter, followed by long, muffled weeping, held back with desperation yet impossible to fully conceal.\n\n\"Master... please allow me to stay with you a little longer. For our final moments together before we part...\"\n\nAfter confirming the translation, none of the researchers spoke. Yet no further useful data could be retrieved."
#  科研团队找到了一份非常重要的纸质文件，经过多次清洗与语言还原，还原出以下内容：\n\n“尊敬的女神大人，我们的人口所剩无几，并且每时每刻都有人因饥饿死去。也许，我们再也无法满足您的献祭要求了……”\n\n这封信与此前反复出现的恳求一脉相承，但冰冷的文字中敬畏与讨好，彻底转向了近乎麻木的绝望。自此，再也没有任何其他内容。
  gts_rainna_la_grande_arch.10_3_small.desc: "The research team recovered a vital paper document. After repeated cleaning and linguistic reconstruction, the following passage was salvaged:\n\n\"Exalted Goddess, our population is nearly extinct, and with every passing moment more perish of starvation. In all likelihood, we can no longer satisfy your demands for sacrifice...\"\n\nThis missive echoed the repeated pleas found earlier, yet the cold words had abandoned all reverence and flattery, sinking entirely into numb despair. Beyond this, no other records survived."
#  科研团队找到了两封信件，根据对比和还原，两封信件的内容被还原出来。\n\n“致后来的探险者：\n\n对暴政的屈服是这个文明灭亡的最终原因。当我们奉献出我们的一切，再也没有什么可以奉献的时候，我们的灭亡就已经到来了。当我们选择顺从而非反抗的那一刻，注定了终结的到来。但是，这并非最坏的选择。”\n\n“亲爱的……克里斯塔、希斯耶塔、菲妮亚、枫……\n\n感谢你们的陪伴。但是很遗憾的是，你的……需要因为难以饶恕的罪行接受应有的惩罚。这个宇宙将是我的另一个家，很久很久的家……请不要为我落泪，亲爱的……们。\n\n请你们照顾我的……。\n\n谨启\n您的……，……”\n\n至此，考古结束。
  gts_rainna_la_grande_arch.10_4_giant.desc: "The research team found two letters. Through comparison and reconstruction, the contents of both were recovered:\n\n\"To the explorers who follow:\n\nSubmission to tyranny was the ultimate cause of this civilization's demise. When we offered up everything we had and had nothing left to give, our extinction arrived. The moment we chose obedience over resistance sealed our doom. Yet, this was not the worst of choices.\"\n\n\"My dearest... Christa, Siesta, Fenia, Kaede...\n\nThank you for your companionship. But regrettably, your... must face due punishment for unforgivable transgressions. This universe shall become my other home, my home for a very, very long time... Please shed no tears for me, my beloved...s.\n\nPlease take good care of my...\n\nEver yours,\nYour..., ...\"\n\nWith this, the archaeological expedition concludes."
