#  黯淡，恢弘
  gts_rainna_la_grande_arch.07.name: "Gloom, Grandeur"
#  经过反复处理，我们终于从噪声中剥离出了一段相对完整的弱信号。强信号的干扰始终无法完全消除，部分内容依然残缺，但大致的轮廓已经可以辨认：\n\n“我们的余孤离开了曾经的家园。\n\n那颗星球我们已经回不去了。新的星球更加寒冷，更加狭小，土地贫瘠，什么都要从头开始。我们几乎损失了全部的人口——那些数字我不忍心再写下来。但是，至少，我们有人存活下来了。\n\n至少，还有人存活下来了。”\n\n这显然是某种日记或编年记录的片段，作者不详，年代不详。信号还在持续传输，应当还有更多内容可以接收。
  gts_rainna_la_grande_arch.07_1_micro.desc: "After repeated filtering, we finally isolated a relatively coherent weak signal from the static. Interference from the strong signal could never be fully eliminated and some parts remain corrupted, but the broad outline is identifiable:\n\n\"The remnants of our people have fled our former home.\n\nWe can never return to that world. Our new planet is colder, narrower, and barren; we must rebuild everything from nothing. We lost almost our entire population—numbers I cannot bear to write down. Yet at least... some of us survived.\n\nAt least someone made it out alive.\"\n\nThis is clearly an excerpt from a diary or chronicle, author and date unknown. The signal continues transmitting; there should be more to receive."
#  经过反复处理，我们从强烈的噪声背景中勉强剥离出了一段较为完整的弱信号。干扰依然严重，相当一部分内容缺失，但残存的片段已经足以拼凑出大致的意思：\n\n“我们的余孤离开了……家园，来到了一个更加寒冷、狭小、……贫瘠的星球。\n\n我们几乎……了全部的人口。\n\n但是，至少……存活下来了。”\n\n语气沉重，措辞简练，像是某个人在极度疲惫之下写下的文字，没有任何多余的情绪，只是陈述事实。\n\n这应该是某种日记或记录的片段。信号仍在持续传输，继续接收或许能够获得更多内容，尽管干扰消除的难度依然不容小觑。
  gts_rainna_la_grande_arch.07_1_tiny.desc: "Through iterative filtering, we managed to isolate a fairly coherent weak signal from the harsh background noise. Severe interference persists and large swathes are missing, but the surviving fragments suffice to piece together the gist:\n\n\"Our remnants fled... home, arriving upon a colder, smaller,... barren world.\n\nWe lost almost... our entire population.\n\nYet at least... survived.\"\n\nThe tone is heavy and sparse, reading like words written under crushing exhaustion—devoid of superfluous emotion, stating only raw facts.\n\nThis appears to be a fragment of a journal or official log. The transmission is ongoing, and continued reception may yield more content, though filtering out the interference will remain challenging."
#  强信号的解码工作比预期困难得多。\n\n信号本身并不复杂，但其中的文字经过了多层加密处理，使用的语言体系也与此前解码的内容有所不同，像是某种刻意为之的保护措施。经过大量比对和推断，我们勉强还原出了以下内容，其中仍有部分词汇无法完全确认：\n\n“……\n\n您的双眼……那双瞳孔。金色的，像是深渊的颜色，像是某种古老而可怖的东西凝视着这个世界。我第一次看到它们的时候，浑身颤抖，不知道是恐惧还是别的什么。\n\n可以让我多欣赏一会儿吗？\n\n……谢谢您。\n\n不枉我从始至终，忠贞不渝。\n\n我将永远追随您。”\n\n科研人员们沉默地看着这段译文，没有人第一个开口。\n\n那种语气很难描述——既像是虔诚的祈祷，又像是某种深入骨髓的恐惧，两者以一种令人不安的方式混合在了一起。
  gts_rainna_la_grande_arch.07_2_micro.desc: "Decoding the strong signal proved far harder than anticipated.\n\nThe signal itself was straightforward, but the text had been subjected to multi-layered encryption, utilizing a linguistic system distinct from previous samples—suggesting a deliberate security measure. After exhaustive cross-referencing, we managed to reconstruct the following text, though certain terms remain uncertain:\n\n\"...\n\nYour eyes... those pupils. Golden, like the color of an abyss, like some ancient and terrifying entity gazing upon this realm. When I first beheld them, I trembled from head to toe, unable to tell whether it was terror or something else.\n\nMay I admire them a little longer?\n\n...Thank you.\n\nMy unwavering loyalty from beginning to end has not been in vain.\n\nI will follow you forever.\"\n\nThe researchers stared at the translation in silence, no one willing to speak first.\n\nThe tone was difficult to define—resembling both a devout prayer and bone-deep dread, entwined in an unsettling harmony."
#  强信号的解码工作比预期困难得多。\n\n信号本身并不复杂，但其中的文字经过了多层加密处理，使用的语言体系也与此前解码的内容有所不同，像是某种刻意为之的保护措施。经过大量比对和推断，我们勉强还原出了以下内容，其中仍有部分词汇无法完全确认：\n\n“母亲……\n\n您的双眼……那双瞳孔。金色的，像是深渊的颜色，像是某种古老而可怖的东西凝视着这个世界。我第一次看到它们的时候，浑身颤抖，不知道是恐惧还是别的什么。\n\n可以让我多欣赏一会儿吗？\n\n母亲……谢谢您。\n\n不枉我从始至终，忠贞不渝。\n\n我将永远追随您。”\n\n科研人员们沉默地看着这段译文，没有人第一个开口。\n\n那种语气很难描述——既像是虔诚的祈祷，又像是某种深入骨髓的恐惧，两者以一种令人不安的方式混合在了一起。
  gts_rainna_la_grande_arch.07_2_micro_alter.desc: "Decoding the strong signal proved far harder than anticipated.\n\nThe signal itself was straightforward, but the text had been subjected to multi-layered encryption, utilizing a linguistic system distinct from previous samples—suggesting a deliberate security measure. After exhaustive cross-referencing, we managed to reconstruct the following text, though certain terms remain uncertain:\n\n\"Mother...\n\nYour eyes... those pupils. Golden, like the color of an abyss, like some ancient and terrifying entity gazing upon this realm. When I first beheld them, I trembled from head to toe, unable to tell whether it was terror or something else.\n\nMay I admire them a little longer?\n\nMother... thank you.\n\nMy unwavering loyalty from beginning to end has not been in vain.\n\nI will follow you forever.\"\n\nThe researchers stared at the translation in silence, no one willing to speak first.\n\nThe tone was difficult to define—resembling both a devout prayer and bone-deep dread, entwined in an unsettling harmony."
#  强信号的解码工作比预期困难得多。\n\n信号本身并不复杂，但其中的文字经过了多层加密处理，使用的语言体系也与此前解码的内容有所不同，像是某种刻意为之的保护措施。经过大量比对和推断，我们勉强还原出了以下内容，其中仍有部分词汇无法完全确认：\n\n“主人……\n\n您的双眼……那双瞳孔。金色的，像是深渊的颜色，像是某种古老而可怖的东西凝视着这个世界。我第一次看到它们的时候，浑身颤抖，不知道是恐惧还是别的什么。\n\n可以让我多欣赏一会儿吗？\n\n主人……谢谢您。\n\n不枉我从始至终，忠贞不渝。\n\n我将永远追随您。”\n\n科研人员们沉默地看着这段译文，没有人第一个开口。\n\n那种语气很难描述——既像是虔诚的祈祷，又像是某种深入骨髓的恐惧，两者以一种令人不安的方式混合在了一起。
