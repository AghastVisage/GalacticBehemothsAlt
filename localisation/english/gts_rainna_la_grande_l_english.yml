#  巨型阴影
  gts_rainna_la_grande_first_meeting.02.title: "Colossal Shadow"
#  首次捕捉到这个反常现象的是我们的科研穿的观测数据，那时，没人把它当回事。远方群星璀璨的夜空中，只是一小片区域略显暗淡，遮蔽了几颗原本清晰可见的恒星。[this.GetName]的天文台很快确认了这一观测结果，但大多数研究人员只是将其归类为一次普通的天文异常现象。\n\n然而，短短数日之间，情况急转直下。那片异常的阴影以惊人的速度扩张，吞噬了越来越多的星光。科学家了解到，这是一个正在向[this.GetName]疾驰而来的神秘天体，它的轨迹飘忽不定，既不符合已知天体的运动规律，也不像是任何文明制造的航行器。\n\n[this.GetName]的科学院紧急召开了专题研讨会。当首席科学家[rainna_la_grande_this_scientist.GetName]走出会议厅时，焦虑与恐惧似乎能将[rainna_la_grande_this_scientist.GetHerHim]压倒。几十年的研究生涯中，[rainna_la_grande_this_scientist.GetHerHim]从未见过如此诡异的现象。就在这时，天空骤然变色，翻涌的云层被一股莫名的力量撕裂，狂风呼啸着掠过地面，卷起落叶和碎屑，像是某种不祥的预兆。\n\n那个庞大的存在终于显露出真容——一张与天际融为一体的巨脸。她的双眸如同两汪深邃的湖水，每一次眨动都伴随着震耳欲聋的雷鸣，掀起足以摧毁一切的飓风。[rainna_la_grande_this_scientist.GetName]的长发在狂风中狂舞，她想要喊些什么，却被呼啸的风声淹没。\n\n “不，等一下！”\n\n话音未落，一根被风暴掀起的粗壮树枝划破长空，重重砸在[rainna_la_grande_this_scientist.GetName]身上。她的身体重重摔在台阶上，还未及爬起，就被狂暴的气流卷入高空……\n\n与此同时，信号接入。
  gts_rainna_la_grande_first_meeting.02_random_1.desc: "The anomaly was first captured by observation data from our science ship, though at the time, no one took it seriously. In the starry night sky far away, only a tiny patch appeared slightly dim, obscuring a few stars that had previously been clearly visible. Observatories on [this.GetName] quickly confirmed the finding, yet most researchers simply classified it as an ordinary astronomical anomaly.\\n\\nHowever, within just a few days, the situation took a sharp turn for the worse. That anomalous shadow expanded at an astonishing speed, swallowing more and more starlight. Scientists soon realized that a mysterious celestial entity was hurtling toward [this.GetName]—its trajectory erratic and unpredictable, adhering neither to the laws of known celestial bodies nor resembling any vessel built by civilization.\\n\\nThe Academy of Sciences on [this.GetName] urgently convened an extraordinary seminar. When Chief Scientist [rainna_la_grande_this_scientist.GetName] stepped out of the conference hall, anxiety and dread threatened to overwhelm [rainna_la_grande_this_scientist.GetHerHim]. In decades of research, [rainna_la_grande_this_scientist.GetHerHim] had never witnessed such a bizarre phenomenon. Just then, the sky suddenly changed color. Billowing clouds were torn apart by an inexplicable force, and howling gales swept across the ground, kicking up fallen leaves and debris like an ominous harbinger.\\n\\nThe colossal presence finally unveiled its true form—a gigantic face seamlessly blending into the horizon. Her eyes were like two deep lakes, and every blink was accompanied by deafening thunder, whipping up hurricanes potent enough to obliterate everything. [rainna_la_grande_this_scientist.GetName]'s long hair whipped wildly in the tempest; she tried to shout something, but her words were drowned out by the roaring wind.\\n\\n\"No, wait!\"\\n\\nBefore the words could fully leave her lips, a thick tree limb hoisted by the storm tore through the air and struck [rainna_la_grande_this_scientist.GetName] with brutal force. Her body crashed hard onto the steps, and before she could even scramble to her feet, the violent gale swept her high into the air...\\n\\nSimultaneously, a signal connects."
#  最初，那只是夜空中一个微不足道的异常——仅仅是群星璀璨间的一个芝麻大小的暗斑。随后，这个斑点悄然扩大，吞噬了天际角落的几颗星辰。起初，这种变化细微得近乎难以觉察，仿佛只是普通的天文现象。然而短短数日之间，那抹黑暗却如同墨滴入清水，迅速蔓延开来，最终化作一片巨大的黑幕，吞没了大片星河，只留下一片死寂的漆黑。\n\n第二天，紧急会议在[this.GetName]召开，紧张与不安笼罩于在每一个人，那是令人战栗的对未知的恐惧，仿佛下一刻，那吞噬星光的黑暗就会将他们的灵魂也一并吞没。\n\n它已经被确认是一种从未见过的巨大的实体。既不是流星、也不是飞船，它神秘地悄然逼近[this.GetName]，十分迅速，不定的轨迹让在座的每一位学者与科研人员都不敢妄下定论。但是每一个人都十分肯定的是——这个存在，已经离我们太近了。\n\n当首席科学家[rainna_la_grande_this_scientist.GetName]在会后接受采访的时候，每一个人都看到了那被大气笼罩的巨大的朦胧面孔，那张清秀的面部覆盖了几乎整个天空。伴随着突然的狂风与剧烈的震动，她离我们越来越近。深蓝色的眼瞳就像是湖水一般与天空融为一体，每眨一下都会带来湍急的气流与剧烈的震颤，轻易地折断枝干、卷起物品、撕裂云彩，脚下剧烈的震动甚至让房屋产生了一道道蛛网般蔓延的深邃裂隙。伴随着一声震耳欲聋的轰鸣，坚硬的地面裂开一道深不见底的裂缝狂暴的气流毫不留情地将[rainna_la_grande_this_scientist.GetHerHim]推向深渊……\n\n与此同时，信号接入。
  gts_rainna_la_grande_first_meeting.02_random_2.desc: "At first, it was merely an insignificant anomaly in the night sky—just a sesame-sized dark speck amidst a brilliant sea of stars. Soon, this speck quietly expanded, devouring several stars at the corner of the horizon. Initially, the change was so subtle as to be almost undetectable, resembling nothing more than an ordinary astronomical phenomenon. Yet in just a few days, that patch of darkness spread swiftly like ink in clear water, ultimately becoming a massive black veil that swallowed vast swathes of the galaxy, leaving behind only a dead, pitch-black void.\\n\\nThe next day, an emergency meeting was convened on [this.GetName]. Tension and unease gripped everyone present—a trembling terror of the unknown, as if at any moment, the darkness that swallowed the stars would consume their souls as well.\\n\\nIt was confirmed to be a colossal entity unlike anything ever seen before. Neither meteor nor starship, it crept silently toward [this.GetName] with astounding speed. Its erratic trajectory prevented any scholar or researcher in attendance from drawing hasty conclusions. But there was one thing everyone knew with absolute certainty—this entity was already far too close to us.\\n\\nWhile Chief Scientist [rainna_la_grande_this_scientist.GetName] was being interviewed after the meeting, everyone looked up to see a colossal, hazy face shrouded in the atmosphere; those delicate facial features spanned almost the entire sky. Accompanied by sudden howling winds and violent tremors, she drew ever closer. Her deep blue pupils blended seamlessly with the sky like tranquil lakes, yet every blink stirred torrential currents and fierce vibrations, snapping branches, tossing objects, and tearing clouds to shreds. The violent rumbling beneath their feet cracked the ground, web-like fissures creeping across walls and pavement. With a deafening roar, the solid ground split open into a bottomless chasm, and the raging tempest mercilessly plunged [rainna_la_grande_this_scientist.GetHerHim] into the abyss...\\n\\nSimultaneously, a signal connects."
#  宛如墨滴浸染宣纸，又似星火坠入深秋枯叶。几日前，观测图像角落里的那个微小黑点原本不值一提，只被当作普通的观测异常。然而短短数日之间，它就如同贪婪的墨渍般扩张蔓延，吞噬着越来越多璀璨的星光，犹如无形的烈火，在寂静的宇宙画布上肆意燃烧。\n\n[this.GetName]的研究团队通过精密观测发现，这是一个正在接近我们的神秘天体。它的行迹诡秘难测，仿佛刻意避开所有探测手段，却又笔直地朝我们的星球疾驰而来。这个神秘的天体的运动轨迹十分奇特，它既不属于任何小行星或者流星，也不属于任何已知的飞行器。一场灾祸正在酝酿。\n第二天，[this.GetName]实验中心陷入一片紧张氛围。紧急会议室内，科研人员们争分夺秒地讨论着各种可能性和应对方案。似乎在认为这是一个可以解决的问题。\n\n在随后的新闻发布会上，首席科学家[rainna_la_grande_this_scientist.GetName]的表情异常凝重。[rainna_la_grande_this_scientist.GetHerHis]小心翼翼地斟酌着每一个字句，试图编织一张由谎言构筑的安全网，生怕真相的锋芒会通过媒体刺痛每个人脆弱的神经。然而，命运早已悄然降临。\n\n最初只是一阵突如其来的强风，撕碎了空中的云层。紧接着，在那湛蓝的天际线上，浮现出一对如深邃湖泊般的巨大瞳孔。清秀的面庞随之显现，覆盖了大半个天穹。她的每一次眨眼都仿佛是两颗巨星的碰撞，震耳欲聋的巨响中迸发出的能量掀起狂暴飓风，让大地剧烈颤抖，轻易地掀翻任何哪怕有一点脆弱的物品……没错，就是那辆停在[rainna_la_grande_this_scientist.GetName]的豪华车。被气流轻轻托起。在这场灾难面前，这精心打造的钢铁造物不过是一片羽毛。当它重重砸下时，[rainna_la_grande_this_scientist.GetName]甚至来不及发出一声惊呼……\n\n与此同时，信号接入。
  gts_rainna_la_grande_first_meeting.02_random_3.desc: "Like ink soaking into rice paper, or a spark landing upon dry autumn leaves. A few days ago, the tiny black dot in the corner of the observation imagery was hardly worth mentioning, written off as nothing more than a routine imaging artifact. Yet in mere days, it expanded and spread like a voracious ink stain, devouring more and more brilliant starlight—an invisible blaze burning across the quiet canvas of the cosmos.\\n\\nThrough meticulous observation, the research team on [this.GetName] discovered that this was a mysterious celestial body approaching us. Its movements were baffling and evasive, as if deliberately avoiding detection, yet hurtling straight toward our world. The trajectory of this mysterious entity was extraordinary—it was neither asteroid nor meteor, nor did it match any known craft. A disaster was brewing.\\nThe following day, the research center on [this.GetName] was plunged into tense apprehension. Inside the emergency conference room, researchers raced against time to debate every conceivable scenario and contingency, clinging to the belief that this was still a solvable crisis.\\n\\nAt the ensuing press briefing, Chief Scientist [rainna_la_grande_this_scientist.GetName]'s expression was exceptionally grim. [rainna_la_grande_this_scientist.GetHerHis] words were weighed with utmost care, attempting to spin a safety net of comforting half-truths for fear that the sharp edge of reality would shatter the public's fragile nerves. Yet destiny had already arrived.\\n\\nIt began as a sudden, violent gale tearing through the clouds above. Immediately thereafter, on the azure horizon, a pair of colossal pupils resembling deep lakes materialized. A delicate, serene face followed, covering more than half the firmament. Every time she blinked felt like the collision of two giant stars; the energy unleashed in deafening thunder generated raging hurricanes that rattled the earth, effortlessly flipping anything remotely fragile... including the luxury car belonging to [rainna_la_grande_this_scientist.GetName], which was lifted into the air like a feather by the updraft. Before this calamity, the meticulously engineered steel machine was nothing more than a plaything. When it crashed down with crushing force, [rainna_la_grande_this_scientist.GetName] did not even have time to cry out...\\n\\nSimultaneously, a signal connects."
#  在[this.GetName]的观测站，每一张流传到网络上的星空照片都是一幅璀璨的艺术品。无数闪烁的恒星编织成银河的锦缎，装点着漆黑的夜空。\n直到有一天，一位细心的用户花费了数个小时找到了一个异常的地方，在照片的边角，一颗曾经明亮的恒星不知何时已经消失得无影无踪。起初，这个发现并未引起任何关注。毕竟自[owner.GetName]的先民首次举起望远镜注视星空以来，类似的现象并不罕见。在浩瀚的银河中，偶尔有星辰悄然熄灭，这本是再平常不过的事情。\n\n十几天后，这位执着的用户又发现了另一颗消失的行星。而几天后，一片黄豆大小的明显的没有行星出现的区域醒目地展现在最新的星空图像中，那里原本璀璨的群星竟全数消失。对外发表声明，称这只是一个需要进一步研究的天文异常。但很快，事态就完全脱离了所谓“正常现象”的范畴。\n\n两天后，一个庞大的黑影吞噬了近半幅观测图像。当科研人员们排除了设备故障后，一个可怕的事实浮出水面：根据科研人员的初步推测，这是一个正在接近[this.GetName]的神秘实体。初步计算显示，它体积巨大，行踪诡秘，移动却又惊人地敏捷。更令人不安的是，它既不符合任何已知天体的特征，也不像是任何文明造物的痕迹。而它的目标就是[this.GetName]。\n\n第二天，紧急会议在[this.GetName]的科研基地召开。科学家们的讨论中紧张地推进着，而楼下的记者则堵在广场上，随时准备着采访。平时寂静的会议室中吵闹不堪，似乎每一个人都在为了尝试找出哪怕一点希望而陷入疯狂。\n\n一阵狂风打破了寂静的酷暑。阵诡异的狂风撕裂了闷热的空气。气流来势汹汹，将记者们的器材高高卷起。将每一个人都吹得难以站立。紧接着，剧烈的地震将墙体砸出蛛网状的裂隙向远处蔓延。\n\n顺着风的方向望去，不知什么时候，一张占据着大半天空的巨大脸庞赫然显现，巨大的蓝色双瞳如湖水一般清澈。她那湖水般澄澈的蓝色双瞳正俯视着这个渺小的世界。每一次眨眼，都伴随着震撼天地的巨响。狂暴的气流席卷着沙石、残枝、碎片、在广场上掀起一场死亡风暴。破碎的树木被连根拔起、扭曲变形的汽车被掀起，裹挟着各种被折断的设备，追猎着广场上无辜的人员。科研基地的玻璃在某一瞬间全部崩裂四散，无数锋利的碎片如同致命的箭雨，呼啸着射向高空。\n\n当[rainna_la_grande_this_scientist.GetName]被发现时，一片尖锐的玻璃碎片已然贯穿[rainna_la_grande_this_scientist.GetHerHim]的胸膛。\n\n与此同时，信号接入。
  gts_rainna_la_grande_first_meeting.02_random_4.desc: "At the observatories of [this.GetName], every astronomical photograph shared across the network was a brilliant work of art. Innumerable twinkling stars wove the brocade of the galaxy, adorning the velvet night.\\nUntil one day, an observant user spent hours spotting an anomaly: at the edge of a photograph, a once-bright star had vanished without a trace. At first, the discovery drew no attention. After all, ever since the ancestors of [owner.GetName] first turned telescopes toward the heavens, such occurrences were not unheard of. Across the vast galaxy, stars occasionally flickering out was a natural occurrence.\\n\\nA dozen days later, this persistent user discovered another vanished star. Days after that, a soybean-sized dark void conspicuously appeared in the latest imagery, an area where the once-resplendent stars had entirely disappeared. An official statement was released, claiming it was merely an astronomical anomaly warranting further investigation. But soon, matters spiraled far beyond the realm of 'normal phenomena'.\\n\\nTwo days later, an immense silhouette swallowed nearly half of the entire observation frame. Once researchers ruled out instrument malfunction, a terrifying truth came to light: preliminary deductions revealed a mysterious entity approaching [this.GetName]. Initial calculations showed it possessed gargantuan proportions, an elusive presence, and startlingly agile movement. Even more unsettling, it matched no characteristics of known celestial bodies, nor bore any hallmarks of technological manufacture. And its destination was [this.GetName].\\n\\nThe following day, an emergency council convened at the research complex on [this.GetName]. Tense debates among scientists raged on while reporters swarmed the plaza outside, eager for interviews. The normally serene conference room dissolved into cacophony, everyone nearly driven mad in search of the faintest glimmer of hope.\\n\\nA blast of gale shattered the sweltering heat. An eerie wind tore through the stagnant air. The incoming currents arrived with ferocious intensity, tossing reporters' equipment high into the air and knocking people off their feet. Violent tremors soon followed, spider-web cracks spreading across walls and paving stones into the distance.\\n\\nLooking in the direction of the wind, an immense face had materialized, occupying more than half the firmament. Her clear blue pupils gazed down at this tiny world like tranquil lakes. With every blink came earth-shaking thuds. Turbulent gales swept up sand, debris, and broken branches, brewing a storm of destruction across the plaza. Splintered trees were uprooted, mangled automobiles were flung airborne alongside sheared equipment, imperiling innocent personnel across the grounds. In an instant, the glass facade of the research complex shattered into millions of shards, whistling into the sky like a lethal rain of arrows.\\n\\nWhen [rainna_la_grande_this_scientist.GetName] was finally located, a jagged shard of glass had already impaled [rainna_la_grande_this_scientist.GetHerHim] through the chest.\\n\\nSimultaneously, a signal connects."
