#  神迹
  gts_rainna_la_grande_random.322.title: "Divine Miracle"
#  最近星球上出现了一些难以解释的异常现象。\n\n各地的观测者陆续报告，说大地深处传来了某种低沉的震动，天空的颜色在某些时刻会变得格外诡异，而那些供奉着女神的神殿周围，更是频繁地出现无法用常理解释的光影。起初，人们以为这只是寻常的自然现象，但随着这些迹象越来越频繁、越来越明显，一种敬畏的情绪开始在信众之间蔓延。\n\n宗教界很快给出了他们的解读。\n\n“这是女神的征兆。”负责观测的神职人员郑重地宣告，“伟大的蕾恩娜正在注视着我们，她的力量正在这颗星球上显现。神迹，即将降临。”\n\n消息传开，整个文明都陷入了一种混杂着虔诚与不安的期待之中。\n\n而就在众人的注视之下，那异变的天空骤然亮起——\n\n神迹，降临了。
  gts_rainna_la_grande_random.322_1.desc: "Inexplicable phenomena have recently emerged across the planet.\\n\\nAstronomers and scouts from various regions report low hums vibrating from deep beneath the crust, while the sky occasionally shifts to bizarre hues. Around the grand temples consecrated to the Goddess, anomalous luminescence flickers with increasing frequency. At first, citizens dismissed them as natural weather, but as occurrences grew frequent and pronounced, an aura of awe gripped the faithful.\\n\\nThe clergy was swift to provide an answer.\\n\\n\"These are omens of the Goddess,\" proclaimed the senior observers solemnly. \"The great Rainna is watching us; her might is manifesting upon our world. A miracle is at hand.\"\\n\\nAs the declaration spread, the civilization entered a state of tense anticipation, blending devotion with anxious dread.\\n\\nAnd before the eyes of all, the shifting sky suddenly ignited—\\n\\nThe miracle has descended."
#  不寻常的事情正在发生。\n\n农田里的作物一夜之间疯长，河流的水泛起了从未见过的色泽，夜空中偶尔会划过一些不属于任何已知天体的光芒。这些现象最初零星出现，随后愈演愈烈，遍及整个星球。人们惶惶不安，却又隐隐感到某种莫名的期待。\n\n神职人员们聚集在一起，反复研讨这些异象的含义。最终，他们得出了一致的结论。\n\n“这是女神力量的显现。”\n\n他们向惶惑的民众宣告：“蕾恩娜大人的意志，正在渗入我们的世界。这些征兆，预示着她即将赐予我们某种……启示。”\n\n话音未落，天地之间仿佛响起了一声无形的叹息。\n\n那一刻，所有人都感受到了——\n\n神迹，来了。
  gts_rainna_la_grande_random.322_2.desc: "Unusual events are transpiring.\\n\\nCrops in the fields grew wildly overnight, river waters took on alien hues, and the night sky was occasionally streaked with lights unassociated with any known celestial body. Occurring sporadically at first, these anomalies quickly intensified across the entire world. The populace was uneasy, yet gripped by an inexplicable yearning.\\n\\nThe priesthood convened to debate the significance of these omens. In the end, they reached a unanimous conclusion.\\n\\n\"This is the manifestation of the Goddess's power.\"\\n\\nThey announced to the anxious populace: \"Lady Rainna's will is permeating our world. These signs herald that she will soon bestow upon us a... revelation.\"\\n\\nBefore the words had fully settled, an invisible sigh seemed to sweep between heaven and earth.\\n\\nIn that single breath, all felt it—\\n\\nThe miracle has arrived."
#  这段时间以来，星球上的一切都显得有些不对劲。\n\n指南针失灵了，季节的规律被打乱了，就连一些古老的建筑，也在无人触碰的情况下发生了微妙的变化。这些现象超出了所有科学的解释范畴，让整个文明都笼罩在一层神秘的氛围之中。\n\n自然，人们将这一切归因于他们的女神。\n\n“蕾恩娜大人正在向我们展示她的伟力。”神职人员如此解读道，语气里满是虔诚，“这些异象，是她降下神迹的前兆。我们应当心怀感激，静静等待女神的恩赐。”\n\n于是，整个星球都在等待。\n\n在无数双虔诚的眼睛的注视下，天空中终于绽放出一道奇异的光芒，笼罩了整颗星球。\n\n神迹，如约而至。
  gts_rainna_la_grande_random.322_3.desc: "Lately, everything across the planet has felt slightly off.\\n\\nCompasses spin wildly, seasonal cycles have fallen into disarray, and even ancient structures have undergone subtle alterations without anyone touching them. Defying all conventional scientific logic, these phenomena have shrouded the entire civilization in an aura of mysticism.\\n\\nNaturally, the people attributed this to their Goddess.\\n\\n\"Lady Rainna is displaying her sublime majesty to us,\" interpreted the priests with fervent devotion. \"These portents are harbingers of her miracle. We must remain grateful and wait quietly for the Goddess's blessing.\"\\n\\nAnd so, the entire world waited.\\n\\nUnder the gaze of countless faithful eyes, a wondrous radiance blossomed in the firmament, enveloping the world.\\n\\nThe miracle has arrived as promised."
#  星球上弥漫着一种奇异的气氛。\n\n近来，各地不断传来种种异象的报告——有人说看见天空中浮现出巨大的身影轮廓，有人说听见了来自虚空的、若有若无的轻笑，还有人说，某些地方的时间仿佛都变得缓慢了下来。这些超乎寻常的现象，让整个文明既感到敬畏，又充满了期待。\n\n神职人员们对此给出了明确的解释。\n\n“这是女神眷顾的征兆。”他们向信众宣告，“伟大的蕾恩娜大人，即将为这颗虔诚的星球降下她的神迹。这是我们的荣耀，也是我们信仰的回报。”\n\n人们纷纷放下手中的事务，涌向神殿，虔诚地祈祷着，等待着那神圣时刻的到来。\n\n终于，在某个清晨——\n\n神迹，降临在了这颗星球之上。
  gts_rainna_la_grande_random.322_4.desc: "A peculiar atmosphere blankets the planet.\\n\\nReports of strange omens have poured in from every corner—some claim to have seen the outline of a colossal figure in the upper atmosphere, others heard faint, ethereal giggles drifting from the void, and some noted that time itself seemed to slow to a crawl in certain valleys. These otherworldly phenomena filled the civilization with dread, reverence, and expectation.\\n\\nThe clergy provided a clear interpretation.\\n\\n\"These are signs of divine favor,\" they declared to the congregation. \"The great Lady Rainna is about to bestow her miracle upon this faithful world. This is our supreme honor and the reward for our faith.\"\\n\\nSetting aside their daily routines, the citizens flocked to temples, praying fervently for the sacred hour.\\n\\nAt last, on a crisp morning—\\n\\nThe miracle descended upon this world."
#  神迹降临了！
  gts_rainna_la_grande_random.322.a: "The miracle has arrived!"
#  关于蕾恩娜银行的贷款
  gts_rainna_la_grande_random.402.title: "Regarding the Rainna Bank Loan"
#  通讯频道里，传来了那个熟悉的声音。\n\n“嘿~小朋友们~”\n\n蕾恩娜的语气一如既往地轻快，只是这一次，那份亲昵之下藏着几分别的意味。\n\n“最近过得怎么样呀？嗯……我记得你们好像还欠着我一笔钱呢~”\n\n“是不是忘记还了呀？没关系没关系，我理解的~”她咯咯地笑了几声，“不过嘛，欠债还钱，天经地义嘛~”\n\n“这样吧，再给你们一点时间吧。”\n\n“不过要是下次我来的时候，还是看不到我的钱……”她的声音里带上了几分甜腻的危险，“那我可就只好亲自上门，把值钱的东西都收走咯~”\n\n“加油还钱哦~拜拜！”
  gts_rainna_la_grande_random.402_1.desc: "Over the comm link came that familiar voice.\\n\\n\"Hey~ little ones~\"\\n\\nRainna's tone was breezy as ever, though this time a different edge lurked beneath the pleasantries.\\n\\n\"How have you been lately? Hmm... If I recall correctly, you still owe me some money, don't you~\"\\n\\n\"Did you forget to pay it back? No worries, no worries, I understand~\" She chuckled softly. \"Still, paying back debts is just basic manners, right~?\"\\n\\n\"Tell you what, I'll give you a little more time.\"\\n\\n\"But if I still don't see my money next time I swing by...\" Her voice took on a dangerously sweet tone. \"I'll just have to come down in person and take everything valuable I find~\"\\n\\n\"Work hard on paying me back~ Bye-bye!\""
#  “呐呐呐，是我哦~”\n\n蕾恩娜的声音从通讯器中传来，慵懒而随意。\n\n“你们是不是有什么东西忘记给我啦？嗯……让我想想……”\n\n她故意拖长了语调，像是在回忆什么。\n\n“啊，对了，是我的钱呢~你们借了那么久，也该还了吧？”\n\n“嘛，这样吧，就再宽限你们一段时间好啦~”她轻描淡写地说着，“毕竟我们也算是半个朋友嘛~”\n\n“不过朋友归朋友，账还是要算清楚的哦~”她的语气突然一转，“要是再拖下去，我可就要动手拿点抵押品了~到时候拿走什么，可就不是你们能决定的咯~”\n\n“好好准备我的钱哦~”
  gts_rainna_la_grande_random.402_2.desc: "\"Hey, hey, hey, it's me~\"\\n\\nRainna's voice echoed over the comms, lazy and casual.\\n\\n\"Did you forget to give me something? Hmm... let me think...\"\\n\\nShe deliberately drew out her words as if searching her memory.\\n\\n\"Ah, right, my money~ You've borrowed it for so long, shouldn't you be paying it back by now?\"\\n\\n\"Well, I'll give you a bit of an extension~\" she said airily. \"After all, we're practically friends, aren't we~\"\\n\\n\"Though friends or not, business is business~\" Her tone shifted suddenly. \"If you drag your feet any longer, I'll just have to seize some collateral~ And when that happens, you won't be the ones deciding what I take~\"\\n\\n\"Make sure you get my money ready~\""
#  通讯器的另一头传来了熟悉的声音。\n\n“嘿嘿，好久不见呀~”\n\n蕾恩娜的声音听起来心情不错。\n\n“我路过附近，就想起来你们还欠着我钱呢~顺道来提醒一下你们~”\n\n“钱嘛，我不急的~”她慵懒地说着，“反正跑得了和尚跑不了庙，你们的星球又飞不走，对吧？”\n\n她咯咯地笑了起来。\n\n“这次就先算了，我再给你们一点时间~”她的语气里带着几分玩味，“不过要是我下次来还是两手空空的话……嘛，你们那些漂亮的城市、值钱的工厂，看起来倒是挺不错的呢~”\n\n“你们懂我的意思吧？好好还钱哦~”
  gts_rainna_la_grande_random.402_3.desc: "A familiar voice sounded from the other end of the communicator.\\n\\n\"Hehe, long time no see~\"\\n\\nRainna sounded like she was in high spirits.\\n\\n\"I was passing by and remembered you still owe me money~ So I dropped in to give you a quick reminder~\"\\n\\n\"As for the credits, I'm not in a rush~\" she noted lazily. \"After all, you can run, but you can't hide; your planet isn't going to fly away, is it?\"\\n\\nShe giggled.\\n\\n\"I'll let it slide this time and give you a little more time~\" Her tone carried a playful barb. \"Though if I leave empty-handed next time... well, those pretty cities and fancy factories of yours look mighty appealing~\"\\n\\n\"You get what I mean, right? Pay up properly~\""
#  “呐呐~我来收钱咯~”\n\n蕾恩娜的声音轻快得像是在讨要一份礼物。\n\n“你们欠我的那笔钱，是时候该还啦~”\n\n通讯器那头沉默了片刻，她似乎在等待着什么，随即又自顾自地笑了起来。\n\n“哎呀，看你们这为难的样子，是暂时还不上吧？”\n\n“嘛，没关系啦~我大发慈悲，再给你们宽限一阵子~”她的语气轻描淡写，却透着不容拒绝的意味，“不过呢，下次我可就不会这么好说话了哦~”\n\n“下次我再来的时候，要是还拿不到钱……”她的声音甜美而危险，“那我就只好自己动手，从你们的星球上‘拿’一点值钱的东西抵债咯~放心，我一定会‘拿’得很公道的~”\n\n“好好准备哦，拜拜~”
  gts_rainna_la_grande_random.402_4.desc: "\"Hey there~ I'm here to collect~\"\\n\\nRainna's voice was as bubbly as someone asking for a present.\\n\\n\"That debt you owe me, it's about time to pay up~\"\\n\\nThere was a moment of silence on the comms as she seemed to wait for a response, before she giggled to herself.\\n\\n\"My, judging by your troubled faces, you can't pay right now, can you?\"\\n\\n\"Well, that's alright~ In my infinite mercy, I'll extend your deadline a bit longer~\" Her tone was breezy, yet brooks no refusal. \"However, I won't be this easygoing next time, you know~\"\\n\\n\"If I still don't get my money when I return...\" Her voice was sugary sweet and dripping with peril. \"...I'll just help myself and 'take' something valuable from your planet to settle the score~ Don't worry, I promise I'll be very 'fair' with what I take~\"\\n\\n\"Get ready properly, bye-bye~\""
#  请宽限我们几日……
  gts_rainna_la_grande_random.402.a: "Please grant us a few more days..."
#  所有6个月内到期的贷款和逾期的贷款被延长至6个月后到期
  gts_rainna_la_grande_random.402.a_tooltip: "All loans maturing within 6 months and overdue loans have their due dates extended to 6 months from now."
#  舰船消失
  gts_rainna_la_grande_random.411.title: "Disappearance of Ships"
#  [rainna_la_grande_this_solar_system.GetName]星系传来了异常报告。\n\n驻扎在该星系的一支舰队，在毫无征兆的情况下，从所有的监测系统中消失了。没有战斗的痕迹，没有求救的信号，没有残骸，甚至没有任何异常的能量波动——那些飞船就这样凭空消失了，仿佛从未存在过一般。\n\n值班人员反复核对着数据，冷汗涔涔而下。整整一支舰队，就这样无声无息地不见了。\n\n调查还在进行，但所有人心里都隐约浮现出了一个不祥的猜测。
  gts_rainna_la_grande_random.411_1.desc: "An anomaly report arrived from the [rainna_la_grande_this_solar_system.GetName] system.\\n\\nA fleet stationed in the system vanished from all sensor arrays without any warning. No signs of combat, no distress beacons, no wreckage, and not even the slightest erratic energy surge—the vessels simply vanished into thin air, as if they had never existed.\\n\\nDuty officers cross-checked telemetry data repeatedly, cold sweat pouring down their brows. An entire fleet, gone without a trace.\\n\\nInvestigations are underway, but an ominous suspicion has begun to dawn on everyone's mind."
#  警报在深夜响起。\n\n[rainna_la_grande_this_solar_system.GetName]星系的监测网络突然失去了与当地舰队的全部联系。技术人员紧急排查，却发现那些飞船并非通讯中断，而是……根本不在那里了。它们从雷达上、从轨道记录中、从一切追踪系统里彻底消失，没有留下任何痕迹。\n\n一支完整的舰队，就这样人间蒸发。\n\n指挥中心陷入了一片死寂。有人想起了最近那笔迟迟未能偿还的债务，脸色瞬间变得惨白。
  gts_rainna_la_grande_random.411_2.desc: "Sirens blared late into the night.\\n\\nThe sensor grid in the [rainna_la_grande_this_solar_system.GetName] system abruptly lost all contact with the local fleet. Technicians scrambled to diagnose the issue, only to discover it wasn't a communications blackout—the ships were simply... not there anymore. They had completely vanished from radar, from orbital logs, and from every tracking array, leaving not a shred of evidence behind.\\n\\nA full fleet, vanished off the face of the universe.\\n\\nCommand fell into dead silence. Someone recalled the overdue loan that had yet to be repaid, and their face turned deathly pale."
#  不！我的飞船！
  gts_rainna_la_grande_random.411.a: "No! My ships!"
#  使用飞船抵债
  gts_rainna_la_grande_random.412.title: "Using Ships as Collateral"
#  久违的信号接入了通讯频道。\n\n“嘿~朋友~”\n\n蕾恩娜的语气轻快而愉悦。\n\n“你们是不是在找几艘飞船呀？嘻嘻，别找了，在我这儿呢~”\n\n“你们不是欠我钱嘛，一直没还，我已经通知过你们了哦~”她的声音里满是理所当然，“所以我就收你们点飞船抵债了哦。”\n\n“欸，这么这就扁了？不过声音还怪好听的~嘿嘿~”\n\n“欠的钱嘛，就先这么抵一部分吧~剩下的别忘了还哦~”
  gts_rainna_la_grande_random.412_1.desc: "A long-unheard signal dialed into the comm channel.\\n\\n\"Hey~ friend~\"\\n\\nRainna's tone was breezy and cheerful.\\n\\n\"Are you looking for some ships by any chance? Teehee, stop looking, they're with me~\"\\n\\n\"You owe me money and haven't paid it back, and I did warn you, remember~?\" Her voice was brimming with casual justification. \"So I took a few of your ships as debt repayment~\"\\n\\n\"Huh, why'd they flatten so easily? The crunching noise was pretty satisfying though~ Hehe~\"\\n\\n\"As for your debt, that takes care of a small portion for now~ Don't forget to pay back the rest, okay~\""
#  通讯器响了起来。\n\n“呐呐呐~又是我哦~”\n\n蕾恩娜的声音慵懒而随意。\n\n“你们那几艘飞船，我拿走咯~就当是抵债啦~”\n\n“哎呀，你们别急嘛~”她似乎听到了什么，咯咯地笑了起来，“就那么几艘小破船而已，对你们来说不算什么吧？”\n\n“你们造的这些东西还挺精致的嘛~”她饶有兴致地说着，“我拿回去收藏了~算是抵掉你们欠我的一小部分钱咯~”\n\n“剩下的债，可别忘了哦~”
  gts_rainna_la_grande_random.412_2.desc: "The comms rang.\\n\\n\"Hey, hey, hey~ It's me again~\"\\n\\nRainna's voice was relaxed and offhand.\\n\\n\"Those ships of yours, I took them~ Consider it collateral for your debt~\"\\n\\n\"Oh, don't get all worked up~\" Hearing something over the line, she giggled. \"It's just a handful of rinky-dink little boats, no big deal to you, right?\"\\n\\n\"These things you built are actually quite delicate~\" she remarked with amusement. \"I'm taking them home for my collection~ That should wipe out a tiny fraction of what you owe me~\"\\n\\n\"Don't forget about the rest of the debt now~\""
#  信号接入。\n\n“嘿嘿，找飞船吗？”\n\n蕾恩娜的声音里带着几分促狭。\n\n“在我这儿呢~你们欠钱不还，我就只好自己来拿点东西抵债咯~”\n\n“不过说实话啊……”她的语气变得有些嫌弃，“你们这些飞船也太不值钱了吧？我拿去当废品都嫌占地方呢~”\n\n“算了算了，就当是聊胜于无吧~”她漫不经心地说着，“这么一小堆破铜烂铁，也就勉强抵掉你们欠款的一个零头啦~”\n\n“剩下的钱你们还是老老实实还吧~别指望用这些破船糊弄我哦~”
  gts_rainna_la_grande_random.412_3.desc: "A connection was established.\\n\\n\"Hehe, looking for your ships?\"\\n\\nRainna's voice was laced with teasing mischief.\\n\\n\"They're right here with me~ Since you wouldn't pay your debts, I had no choice but to grab something as collateral~\"\\n\\n\"To be honest, though...\" Her tone turned slightly disdainful. \"...these ships of yours are barely worth anything! They're so cheap they take up space even as scrap metal~\"\\n\\n\"Oh well, better than nothing, I suppose~\" she added nonchalantly. \"This tiny heap of scrap iron just barely chips off the spare change of your loan~\"\\n\\n\"You'd better pay back the rest honestly~ Don't think you can fool me with these broken little toys~\""
#  通讯频道里传来了那个熟悉的声音。\n\n“呐呐~来收债咯~”\n\n蕾恩娜的语气轻快得像是在炫耀什么。\n\n“你们一直不还钱，我就先把你们停在[rainna_la_grande_this_solar_system.GetName]的那支舰队拿走啦~”\n\n“这些小飞船呀，虽然对你们来说是宝贝，不过在我眼里嘛……”她轻笑了一声，“也就是打发时间的小玩具而已啦~我捏着玩了一会儿，现在已经变成一堆碎片咯~”\n\n“嘛，好歹也算抵了点债~”她的声音里带着几分漫不经心，“不过你们欠的可不止这么点哦~剩下的，记得准备好~”\n\n“下次我可能就不只是拿飞船咯~嘻嘻~”
  gts_rainna_la_grande_random.412_4.desc: "A familiar voice echoed over the comm frequency.\\n\\n\"Hey there~ Debt collector calling~\"\\n\\nRainna sounded cheery, almost as if showing off a prize.\\n\\n\"Since you kept stalling on your payments, I went ahead and took that fleet you had parked in [rainna_la_grande_this_solar_system.GetName]~\"\\n\\n\"These little ships might be precious to you, but in my eyes...\" She let out a light laugh. \"...they're just little playthings to pass the time~ I squished them between my fingers for fun, and now they're a pile of shards~\"\\n\\n\"Well, at least it covered a tiny bit of your debt~\" Her voice trailed off with lazy indifference. \"You still owe quite a lot more, though~ Make sure you have the rest ready~\"\\n\\n\"Next time, I might not stop at taking just ships~ Teehee~\""
#  所有逾期的贷款的一部分都得到了减免，\n\n并且所有6个月内到期的贷款和逾期的贷款被延长至6个月后到期。
  gts_rainna_la_grande_random.412.a_tooltip: "A portion of all overdue loans has been forgiven,\\n\\nand all loans maturing within 6 months as well as overdue loans have their due dates extended to 6 months from now."
#  星球消失
  gts_rainna_la_grande_random.421.title: "Disappearance of a Planet"
#  [rainna_la_grande_this_planet.GetName]失联了。\n\n起初只是通讯中断，指挥中心以为只是设备故障。然而当邻近星系的观测站将镜头转向那颗星球所在的位置时，所有人都愣住了——\n\n那里什么都没有。\n\n没有星球，没有残骸，没有爆炸的痕迹。那颗曾经居住着无数生命的星球，连同它的一切，就这样从星图上彻底消失了，仿佛从未存在过。
  gts_rainna_la_grande_random.421_1.desc: "Contact with [rainna_la_grande_this_planet.GetName] has been lost.\\n\\nMore precisely—it is simply gone. Gravitational sensors indicate the local gravitational center collapsed to zero within minutes. The final image relayed by orbital telemetry showed a colossal palm engulfing the entire field of view, after which all signals went dead.\\n\\nA world home to billions of citizens has been wiped from the star chart."
#  一颗星球不见了。\n\n[rainna_la_grande_this_planet.GetName]——一颗完整的、有人居住的星球——在某个寻常的时刻，毫无预兆地从所有的监测系统中消失了。轨道上的卫星失去了它的引力信号，远处的观测站再也捕捉不到它的踪影，就好像有谁伸手把它从宇宙中直接抹去了一样。\n\n没有任何征兆，没有任何解释。
  gts_rainna_la_grande_random.421_2.desc: "A planet has vanished.\\n\\nWhen patrol fleets arrived at the designated coordinates of [rainna_la_grande_this_planet.GetName], they were met with nothing but empty void. No detonation debris, no trace of spatial collapse; that once-vibrant world had evaporated into thin air.\\n\\nNot until sensors detected a faint gravitational wave remnant nearby did reality sink in—the waveform exhibited a distinct shape, resembling a clenched fist.\\n\\nThe commander's hands began to tremble."
#  不！我的星球！
  gts_rainna_la_grande_random.421.a: "No! My planet!"
#  使用星球抵债
  gts_rainna_la_grande_random.422.title: "Using a Planet as Collateral"
#  通讯频道里，传来了那个熟悉的声音。\n\n“嘿~朋友~”\n\n蕾恩娜的语气轻快而随意。\n\n“你们是不是少了一颗星球呀？嘻嘻，在我这哦~”\n\n“谁让你们一直欠钱不还呢~”她的语气里没有丝毫愧疚，“我提醒过你们过一次了吧？既然拿不出钱，那我就只好拿颗星球来抵债咯~”\n\n“放心，我拿得可公道了~”她愉快地说着，“一整颗星球呢，怎么也能抵掉不少债了吧~”\n\n“剩下的钱，你们可要抓紧还哦~不然……嘻嘻，我还有很多颗星球可以拿呢~”
  gts_rainna_la_grande_random.422_1.desc: "Over the comm channel came that familiar voice.\\n\\n\"Hey~ friend~\"\\n\\nRainna's tone was breezy and casual.\\n\\n\"That [rainna_la_grande_this_planet.GetName] of yours, I took it~\"\\n\\n\"You kept avoiding paying me back, and I gave you plenty of reminders~\" she stated as if it were the most natural thing in the world. \"Since you couldn't pay, I had to seize some collateral myself~ A whole planet should cover quite a bit, right?\"\\n\\n\"It feels pretty nice in my hand, all round and smooth, just like a little marble~\" She giggled playfully. \"I'm keeping it as a toy~\"\\n\\n\"Don't forget to pay off the rest of your debt, now~\""
#  信号接入。\n\n“呐~朋友~好久不见呀~”\n\n蕾恩娜的声音慵懒而漫不经心。\n\n“我知道你们在找什么啦~就是那颗突然不见了的星球嘛~”\n\n“是我拿走的哦~”她坦然地说着，仿佛在陈述一件微不足道的小事，“你们欠我的钱一直不还，我总得拿点什么抵债吧？”\n\n“一颗星球，应该能抵不少了~”她的语气里带着几分玩味，“我把它捏在手里的时候，还能感觉到上面小小的挣扎呢，怪有意思的~”\n\n“嘛，这笔账就先这么算~剩下的，你们别想赖掉哦~”
  gts_rainna_la_grande_random.422_2.desc: "A transmission linked in.\\n\\n\"Hey~ friend~ long time no see~\"\\n\\nRainna's voice was slow and nonchalant.\\n\\n\"I know what you're looking for~ That planet that suddenly vanished, right~?\"\\n\\n\"I took it~\" she admitted plainly, as if stating an utterly trivial fact. \"You never repaid what you owed me, so I had to take something as collateral, didn't I?\"\\n\\n\"An entire planet should cover a good amount~\" Her voice turned playful. \"When I held it in my palm, I could even feel the tiny little struggles on the surface—it was quite amusing~\"\\n\\n\"Well, that settles that part of the bill for now~ Don't you dare try to weasel out of the rest~\""
#  通讯器响了。\n\n“朋友~我来跟你们说件事哦~”\n\n蕾恩娜的声音轻飘飘的。\n\n“你们那颗[rainna_la_grande_this_planet.GetName]，我拿走咯~”\n\n“别怪我心狠嘛~”她慵懒地说着，“是你们自己一直不还钱的呀~我给了你们那么多次机会，你们都没珍惜，那就别怪我自己动手了~”\n\n“一整颗星球，连人带地都算上……”她似乎在心里盘算着，“嗯，差不多能抵掉你们欠款的一部分吧~”\n\n“可惜哦，那上面的小生命也跟着一起没了呢~”她的语气里听不出任何情绪，“不过这也怪不得我呀，要怪就怪你们不还钱咯~”\n\n“剩下的债，好好还吧~”
  gts_rainna_la_grande_random.422_3.desc: "The communicator beeped.\\n\\n\"Friend~ I've got something to tell you~\"\\n\\nRainna's voice was airy and light.\\n\\n\"That [rainna_la_grande_this_planet.GetName] of yours, I took it away~\"\\n\\n\"Don't blame me for being heartless~\" she murmured languidly. \"You're the ones who refused to pay me back~ I gave you so many chances, but you squandered them all, so don't blame me for taking matters into my own hands~\"\\n\\n\"An entire world, land and inhabitants all counted together...\" She seemed to do the math in her head. \"Mmm, that should offset a chunk of your debt~\"\\n\\n\"A pity all those tiny lives on it were wiped out along with it, though~\" Her tone was devoid of emotion. \"Can't blame me for that, either; blame yourselves for not paying your debts~\"\\n\\n\"Pay back the rest properly now~\""
#  久违的信号接入了通讯频道。\n\n“呐呐~朋友~我又来收债咯~”\n\n蕾恩娜的语气轻快得近乎愉悦。\n\n“你们是不是发现少了颗星球呀？没错，就是我拿的~”\n\n“你们欠钱不还，我提醒了这么多次，也该采取点行动了吧？”她理所当然地说着，“这次我可不是拿几艘小飞船敷衍你们了，直接拿了一整颗星球哦~有诚意吧？”\n\n“那颗星球嘛……”她轻笑了一声，“已经被我玩坏了呢~不过没关系啦，反正是拿来抵债的，坏了也无所谓~”\n\n“这么大一颗，总该抵掉不少了~”她的语气突然一转，带着几分甜腻的威胁，“不过要是你们还不还剩下的钱……下次我拿走的，可就不一定是哪颗星球咯~说不定，就是你们自己所在的那颗呢~嘻嘻~”
  gts_rainna_la_grande_random.422_4.desc: "A familiar signal reconnected to the comm channel.\\n\\n\"Hey, hey~ friend~ I'm back collecting debts~\"\\n\\nRainna's tone was breezy, almost euphoric.\\n\\n\"Did you notice you're missing a planet? Yep, that was me~\"\\n\\n\"You never paid back your debt, and after reminding you so many times, it was high time I took action, right?\" she stated with total self-assurance. \"This time I didn't just mess around with a few little ships; I went straight for an entire planet~ Sincere of me, isn't it?\"\\n\\n\"As for that planet...\" She giggled. \"...I already broke it while playing with it~ But it doesn't matter, it was collateral anyway, so who cares if it's broken~\"\\n\\n\"A ball that big ought to offset quite a bit of debt~\" Her tone abruptly pivoted, dripping with sweet menace. \"Though if you still don't pay what's left... who knows which planet I'll take next time~ Maybe it'll be the very one you're standing on~ Teehee~\""
#  实体唤醒活动
  GTS_AWAKE_RAINNA_PROJECT: "Entity Awakening Campaign"
#  自从科研团队在黑洞另一侧发现这个沉眠的神秘实体以来，学术界对于是否应该唤醒她的争论就从未停止过。\n\n反对派认为，任何未知的高等实体都应当被视为潜在威胁，贸然唤醒只会引来不可预知的灾难。支持派则坚持认为，这是文明史上千载难逢的接触机会，若就此放弃，将是科学界最大的遗憾。\n\n争论持续了很长时间，直到一份来自经济部门的报告终于为这场争论画上了句号——与这样一个存在建立联系，潜在的技术与知识收益远超任何已知的风险评估模型所能计算的范围。\n\n于是，唤醒活动正式立项。\n\n至于那些反对派的担忧……报告的最后一页只有一行字：“收益远大于风险。”\n\n§R警告！唤醒实体可能在某些选择下会非常危险。请准备好后唤醒该实体。§!（打开蕾恩娜的剧情体验模式可以忽略此警告）
  GTS_AWAKE_RAINNA_PROJECT_DESC: "Ever since research teams discovered this slumbering, mysterious entity on the far side of the black hole, debate within academia over whether she should be awakened has never ceased.\\n\\nOpponents argued that any unknown higher entity must be treated as a potential existential threat, and that rashly waking her would only court unpredictable disaster. Proponents maintained that this was a once-in-a-civilization opportunity for first contact, and to abandon it would be the scientific community's greatest regret.\\n\\nThe dispute dragged on until a financial assessment from economic planning settled the matter—the potential technological and intellectual gains from establishing relations with such a being vastly eclipsed what any risk assessment model could calculate.\\n\\nThus, the awakening campaign was officially approved.\\n\\nAs for the dissenters' concerns... the final page of the dossier bore only a single line: \"The potential gains far outweigh the risks.\"\\n\\n§RWarning! Awakening the entity may prove exceedingly dangerous under certain choices. Please prepare adequately before awakening her.§! (This warning may be disregarded if Rainna's story experience mode is active)"
#  实体唤醒活动
  GTS_AWAKE_RAINNA_PROJECT_LOW_COST: "Entity Awakening Campaign"
