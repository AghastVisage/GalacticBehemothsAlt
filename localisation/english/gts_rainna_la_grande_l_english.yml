#  峡谷
  gts_rainna_la_grande_first_meeting.2212.title: "Canyon"
#  “唔……这个星球看起来还是蛮有意思的嘛，值得我降下我的恩泽！”\n\n蕾恩娜像是打量着一个可爱的玩具一般，凑近了观察这颗星球。\n\n高楼耸立的城市中心，湖泊般清澈平静的巨大瞳孔遮映在云层之外若隐若现，占据了大半天空，倒映着繁华的城市。她轻轻眨了眨眼，巨大的睫毛扰动着大气层，掀起一阵狂风。\n\n蕾恩娜的食指悄然探出，如同一座粉色的巨塔般刺破云层。巨大的指影笼罩在城市上空，让整片都市陷入不自然的黑暗。\n\n蕾恩娜的食指玩味地搅动着流动的云彩，如同拨弄水面的浪花。每一个看似随意的动作，都在大气中掀起巨大的涡流，将厚重的云层搅成瑰丽的漩涡图案。\n\n“嗯……就这里吧。”\n\n她的指尖最终停在一片繁华的都市圈上空。没有任何警告，那修长的手指轻柔地落下，就像画笔轻触画纸。但这看似优雅的一按，却将整片城市群碾为齑粉。无数的生命，连同他们的梦想、希望、恐惧，都在这一瞬间化为尘埃，消散在大气层中。\n\n蕾恩娜的手指在星球表面划出一道优美的弧线，就像在沙滩上创作艺术品。只是这“画作”的代价，是沿途所有城市的毁灭。粉碎的建筑残骸和无数破碎的生命，如同彩带般被抛洒向高空，在阳光下形成一道诡异的彩虹。
  gts_rainna_la_grande_first_meeting.2212.desc: "\"Mmm... this planet actually looks quite fascinating, worthy of receiving my divine grace!\"\n\nRainna leans close to examine the planet, as if admiring an adorable toy.\n\nAbove the towering skyscrapers of downtown, her lake-clear, tranquil pupils loom beyond the clouds, dominating the sky and reflecting the bustling metropolis below. She blinks lightly, her gigantic eyelashes disturbing the atmosphere and whipping up howling gales.\n\nRainna's index finger quietly reaches forward, piercing the clouds like a pink, titanic tower. An immense finger-shadow falls across the metropolis, plunging the urban sprawl into an eerie gloom.\n\nPlayfully, Rainna swirls her finger through the shifting clouds, as if trailing water droplets with her fingers. Every casual stroke kicks up massive atmospheric eddies, whipping thick cloud banks into gorgeous spiral patterns.\n\n\"Mmm... right here.\"\n\nHer fingertip finally comes to rest above a thriving metropolitan area. Without warning, that slender finger drops softly, like a paintbrush kissing canvas. Yet that seemingly elegant press grinds the entire urban cluster into dust. Countless lives, along with their dreams, hopes, and terrors, are reduced in that instant to fine powder, scattering into the atmosphere.\n\nRainna's finger drags a graceful arc across the surface, as if crafting sand art on a beach. Yet the price of this \"artwork\" is the total ruin of every city along its path. Pulverized rubble and countless broken lives are hurled into the upper atmosphere like ribbons of debris, forming a bizarre, horrific rainbow under the sunlight."
