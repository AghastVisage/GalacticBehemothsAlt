#  能量币
  gts_rainna_la_grande_first_meeting.31211.title: "Energy Credits"
#  一艘飞船缓缓驶向蕾恩娜，将装载着能量币的货舱舱门打开。\n\n对蕾恩娜而言，这艘飞船不过是一粒微尘，货物更是渺小得难以描述。但她还是饶有兴致地伸出手指，将那个微小的包裹轻轻拈起，放在眼前仔细端详。\n\n“唔……”\n\n她的眼眸中闪烁着满意的光芒。指尖与能量币接触的瞬间，那些密集的能量结晶迸发出耀眼的光芒，随即化作一缕柔和的光流，沿着她的指尖蜿蜒流淌，悄然没入掌心之中。\n\n“嘛，这个嘛……”她看着掌心最后一丝光芒消散，满足地眯起眼睛，“确实很不错哦~”\n\n她将手指在掌心轻轻一握。\n\n“能量币这种东西我可从来不会嫌它太多呢~”\n\n她咯咯地笑了起来，双足缓缓从星球两侧移开。\n\n“那么这次，我就大发慈悲，放过你们一次吧。”
  gts_rainna_la_grande_first_meeting.31211.desc: "A transport ship slowly approached Rainna, opening its cargo bay doors laden with Energy Credits.\n\nTo Rainna, this vessel was nothing more than a speck of dust, and its cargo was microscopic beyond description. Yet with evident amusement, she extended a finger, delicately picking up the tiny package to inspect it before her eyes.\n\n\"Mmm...\"\n\nHer eyes sparkled with satisfaction. The moment her fingertip made contact with the Energy Credits, the dense energy crystals burst with dazzling brilliance, dissolving into a gentle stream of luminous light that wound along her finger and quietly sank into her palm.\n\n\"Well now, as for this...\" Watching the last trace of light fade from her palm, she narrowed her eyes contentedly. \"...it really is quite nice~\"\n\nShe closed her fingers softly against her palm.\n\n\"I can never have too many Energy Credits, after all~\"\n\nShe giggled, her feet slowly drawing away from the sides of the planet.\n\n\"In that case, I shall be merciful and spare you this once.\""
#  每一次都要付出那么多资源，真的值得吗？
  gts_rainna_la_grande_first_meeting.31211.a_tooltip: "Is it really worth paying so many resources each time?"
#  飞船缓缓驶近，将货舱舱门打开。\n\n蕾恩娜瞥了一眼那个微小的包裹，嘴角微微下撇。\n\n“能量币啊……”\n\n她的声音中带着几分漫不经心的失望，听起来很不满意。\n\n“嘛，不是说能量币不好……”她伸出两根手指，轻描淡写地捏住了那艘飞船，“哼，只不过这次不行哦。”\n\n她的手指微微用力。飞船连同货舱在她指尖之间悄无声息地碎裂，能量币在瞬间化作一团黯淡的微光，随即消散在太空中。\n\n“呐呐呐，谈判破裂。”\n\n她的双足重新向星球靠拢。
  gts_rainna_la_grande_first_meeting.31221.desc: "The ship slowly sailed closer, opening its cargo bay doors.\n\nRainna glanced at the microscopic package, the corners of her lips turning slightly downward.\n\n\"Energy Credits, huh...\"\n\nHer voice carried casual disappointment, sounding distinctly dissatisfied.\n\n\"Well, not that Energy Credits are bad...\" She reached out two fingers, pinching the ship with effortless nonchalance. \"Hmph, but not this time.\"\n\nShe applied slight pressure with her fingers. The vessel and its cargo bay shattered silently between her fingertips, the Energy Credits turning into a dim flash of light before scattering into the void.\n\n\"Well, well, well—negotiations have broken down.\"\n\nHer feet drew close around the planet once more."
#  合金
  gts_rainna_la_grande_first_meeting.31212.title: "Alloys"
#  飞船将货舱打开，装有大量合金的金属箱缓缓漂浮在太空中。\n\n蕾恩娜伸出两根手指，将整批货物轻轻捏住。金属在她指尖之间发出沉闷的碎裂声，原本坚硬的合金在瞬间被碾成细碎的粉末，在太空中散开，形成一片闪烁的金属云雾。\n\n“唔……”她看着指尖残留的金属粉末，若有所思地点了点头。\n\n“手感不错呢~”\n\n她将手指轻轻搓了搓，金属粉末如星尘般飘散。\n\n“嘛，就当是有诚意了吧，毕竟这应该基本上是你们能拿出来的所有合金了吧？”\n\n她收回手，满意地眯起眼睛，双足缓缓从星球两侧移开。\n\n“哼，原谅你了。”
  gts_rainna_la_grande_first_meeting.31212.desc: "The vessel opened its cargo bay, letting metal containers packed with vast quantities of alloys drift out into space.\n\nRainna reached out two fingers, gently pinching the entire shipment. The metal yielded with a dull, crunching sound between her fingertips, the once-resilient alloys instantly crushed into a fine powder that dispersed into the void, forming a shimmering cloud of metallic mist.\n\n\"Mmm...\" Looking at the metallic dust lingering on her fingertips, she nodded thoughtfully.\n\n\"The texture isn't bad~\"\n\nShe rubbed her fingers together, letting the metallic dust scatter like stardust.\n\n\"Well, I'll count this as sincere effort, seeing as this is probably just about all the alloys you could scrape together.\"\n\nDrawing back her hand, she narrowed her eyes with satisfaction as her feet slowly moved away from the planet's sides.\n\n\"Hmph, I forgive you.\""
#  飞船将货舱打开，装有大量合金的金属箱缓缓漂浮在太空中。\n\n蕾恩娜伸出两根手指，漫不经心地将整批货物捏碎。金属粉末在太空中静静飘散。\n\n“嘛，”她轻声说道，语气平静而随意，她甚至没有多看一眼。“不喜欢。”\n\n她的双足重新向星球靠拢。
  gts_rainna_la_grande_first_meeting.31222.desc: "The vessel opened its cargo bay, letting metal containers packed with vast quantities of alloys drift out into space.\n\nRainna extended two fingers, carelessly crushing the entire shipment to powder. Metallic dust drifted quietly into the void.\n\n\"Meh,\" she remarked softly, her tone calm and indifferent, not sparing it a second look. \"Don't like it.\"\n\nHer feet drew close around the planet once more."
#  贸易品
  gts_rainna_la_grande_first_meeting.31213.title: "Consumer Goods"
#  飞船将货舱打开，无数精美的货物被绑在一起漂浮在太空中。在蕾恩娜眼中，这些东西不过是一堆闪闪发光的微小杂物，但她还是饶有兴致地凑近打量。\n\n“哎呀……”\n\n她的眼睛亮了一下。\n\n她用指尖轻轻拨弄着那些漂浮的货物，看着它们在太空中翻滚、碰撞，发出几乎听不见的微小声响。亮晶晶的小东西在星光下折射出五彩的光芒，让她看起来心情颇好。\n\n“嘛，诚意是有的~”\n\n她将那一小堆货物拢在指尖，然后轻轻捏住塞进了长筒丝袜中。那些精美的货物就这样消失在丝袜与她小腿之间，成了一个几乎看不出来的微小鼓包。\n\n“虽然不多，但是应该把你们的库存消耗得差不多了吧？”\n\n“就这样吧~”她满意地拍了拍丝袜，双足从星球两侧移开。
  gts_rainna_la_grande_first_meeting.31213.desc: "The vessel opened its cargo bay, releasing countless exquisite goods bundled together to float in space. In Rainna's eyes, these items were merely a pile of sparkling microscopic trinkets, yet she leaned in with evident curiosity to examine them.\n\n\"Oh my...\"\n\nHer eyes lit up.\n\nWith a fingertip, she lightly nudged the drifting cargo, watching the tiny containers tumble and bump into one another in space, producing nearly imperceptible clicks. The glittering little objects refracted colorful hues in the starlight, putting her in quite a pleasant mood.\n\n\"Well, there is certainly sincerity here~\"\n\nGathering the cluster of goods onto her fingertip, she pinched them gently and slipped them into her thigh-high stocking. Those exquisite goods vanished between the stocking and her calf, forming an almost invisible little bulge.\n\n\"Though it's not much, it probably wiped out most of your stockpiles, didn't it?\"\n\n\"That'll do~\" She patted her stocking with satisfaction, her feet moving away from the planet's sides."
#  飞船将货舱打开，无数精美的货物漂浮在太空中。\n\n蕾恩娜瞥了一眼，神情淡淡的。\n\n“这些啊……”\n\n她伸出两根手指，将那堆亮晶晶的小东西捏成了粉末。\n\n“无聊。”\n\n她的双足重新向星球靠拢。
  gts_rainna_la_grande_first_meeting.31223.desc: "The ship opened its cargo bay, releasing countless exquisite goods to float in space.\n\nRainna glanced at them, her expression impassive.\n\n\"Just these...?\"\n\nExtending two fingers, she pinched the glittering trinkets into fine powder.\n\n\"Boring.\"\n\nHer feet drew close around the planet once more."
#  矿物
  gts_rainna_la_grande_first_meeting.31214.title: "Minerals"
#  飞船将货舱打开，大量矿物晶体漂浮在太空中。\n\n“矿物？”蕾恩娜的声音中带着几分有趣。她伸手将货物拢在掌心，在星光下翻来覆去地看了看。那些矿物晶体在她手中闪烁着各种颜色的光芒。\n\n“嘛……颜色倒是挺好看的。”\n\n她用手指轻轻捻了捻，感受着矿物晶体在指尖碎裂的触感，若有所思地点了点头。\n\n“这玩意对我来说可没什么用。就当是手感不错吧~”她将剩余的碎屑随手一扬，“不过看在对你们造成了不少损失的份上，就算了吧。”
  gts_rainna_la_grande_first_meeting.31214.desc: "The ship opened its cargo bay, releasing vast quantities of mineral crystals to drift in space.\n\n\"Minerals?\" Rainna's voice betrayed a hint of amusement. She reached out to scoop the cargo into her palm, turning it over and over to examine it in the starlight. The mineral crystals gleamed with vibrant colors in her hand.\n\n\"Well... the colors are pretty nice.\"\n\nShe rolled them gently between her fingers, savoring the sensation of crystalline fracturing against her skin, and nodded thoughtfully.\n\n\"These things are completely useless to me, but I suppose they felt nice in my hand~\" Tossing the remaining crumbs away with a casual flick, she added, \"Seeing as this cost you quite a lot, I'll let it slide.\""
#  飞船将货舱打开，大量矿物漂浮在太空中。\n\n“矿物……”蕾恩娜叹了口气，语气中带着明显的无聊，“有意思吗？你们这颗星球本身就是一块巨大的矿物呢~”\n\n她两根手指随意一捏，矿物粉碎成尘。\n\n“哼，不接受。”\n\n她的双足重新向星球靠拢。
  gts_rainna_la_grande_first_meeting.31224.desc: "The ship opened its cargo bay, releasing vast quantities of minerals into the vacuum.\n\n\"Minerals...\" Rainna sighed, her voice dripping with unmistakable boredom. \"Are you serious? Your whole planet is basically one giant lump of minerals anyway~\"\n\nWith a casual pinch of two fingers, she ground the minerals to dust.\n\n\"Hmph, rejected.\"\n\nHer feet drew close around the planet once more."
#  食物
  gts_rainna_la_grande_first_meeting.31215.title: "Food"
#  飞船将货舱打开，各式各样的食物漂浮在太空中。\n\n蕾恩娜凑近打量了一眼，嘴角扬起一抹兴味盎然的笑容。\n\n“哦？食物啊~”\n\n她没有多想，直接将那艘飞船连同货物一起捏在手中，随手送入口中。\n\n咀嚼了几下，她歪着头若有所思。\n\n“嘛……味道还不错呢~”她用舌尖舔了舔指尖，“飞船的口感有点硬，不过食物本身还可以~”\n\n她满意地拍了拍手，双足从星球两侧缓缓移开。\n\n“哎呀，这次就算了吧。毕竟想必你们没什么食物了吧？希望你们不会饿死太多人哦。”
  gts_rainna_la_grande_first_meeting.31215.desc: "The ship opened its cargo bay, letting a wide assortment of foodstuffs float out into space.\n\nRainna leaned in for a closer look, an intrigued smile curving at the corner of her lips.\n\n\"Oh? Food~\"\n\nWithout overthinking it, she plucked the vessel along with its entire cargo into her hand and popped them directly into her mouth.\n\nChewing a few times, she tilted her head in thoughtful contemplation.\n\n\"Mmm... taste isn't bad~\" She licked her fingertips with the tip of her tongue. \"The ship was a bit crunchy, but the food itself was decent~\"\n\nClapping her hands in satisfaction, her feet slowly moved away from the planet's sides.\n\n\"My, I'll let you off the hook this time. After all, you probably barely have any food left now, right? I hope too many of you don't starve to death.\""
#  飞船将货舱打开，各式各样的食物漂浮在太空中。\n\n蕾恩娜瞥了一眼，两根手指不带感情地将飞船连同货物一并捏碎。\n\n“哎呀，食物嘛，没胃口哦。”\n\n她的双足重新向星球靠拢。
  gts_rainna_la_grande_first_meeting.31225.desc: "The ship opened its cargo bay, letting various foodstuffs drift into space.\n\nRainna glanced at them, emotionlessly crushing the ship and its cargo to powder between two fingers.\n\n\"Ugh, food. I have no appetite for that.\"\n\nHer feet drew close around the planet once more."
#  意外情况
  gts_rainna_la_grande_first_meeting.31226.title: "Unexpected Turn of Events"
#  飞船缓缓驶近，货舱还未来得及打开。\n\n蕾恩娜看着那艘微小的飞船在太空中慢慢靠近，歪着头，手指轻轻敲了敲下巴。\n\n“唔……”\n\n她沉默了片刻，眼神逐渐变得漫不经心。\n\n“嘛，算咯。”她的声音轻描淡写，就像是随口说出的一句话。“我改变主意了呢~”\n\n两根手指毫不犹豫地捏住了那艘飞船。飞船在她指尖之间悄无声息地碎裂，货舱连同其中的一切在还没有展示的机会之前，就这样消失在太空中，化作一团转瞬即逝的微小碎屑。\n\n蕾恩娜看着指尖的残骸随太空气流散去，神情平静而随意，仿佛只是捏碎了一片落叶。\n\n“嘛……”她将手指轻轻一弹，最后一点碎屑飘散开去，“谈判破裂~”\n\n她的双足重新向星球靠拢。
  gts_rainna_la_grande_first_meeting.31226.desc: "The vessel slowly approached, its cargo bay doors having not even opened yet.\n\nRainna watched the microscopic ship creep forward in space, tilting her head and tapping a finger lightly against her chin.\n\n\"Hmm...\"\n\nShe fell silent for a moment, her gaze gradually turning indifferent.\n\n\"Well, whatever.\" Her voice was airy and casual, like an offhand remark. \"I've changed my mind~\"\n\nWithout hesitation, two fingers pinched the vessel. The ship shattered noiselessly between her fingertips; the cargo bay and everything within vanished into space before ever getting a chance to show itself, reduced to a fleeting wisp of dust.\n\nRainna watched the debris disperse on the cosmic currents, her expression serene and careless, as though she had merely crushed a fallen autumn leaf.\n\n\"Well...\" She flicked her finger, sending the last speck of dust away. \"...negotiations have broken down~\"\n\nHer feet drew close around the planet once more."
#  谈判破裂
  gts_rainna_la_grande_first_meeting.31229.title: "Negotiations Break Down"
#  蕾恩娜的双足从两侧缓缓逼近，那两只被白色长筒丝袜紧紧包裹的足底重新将整颗星球笼罩在无边的阴影之中。\n\n足弓的边缘率先触碰到大气层。那柔软而充满弹性的肌肤透过丝袜轻轻贴上大气层的边缘，带起一阵席卷全球的狂风。云层在这种压力下四散崩解，天空瞬间变得一片灰暗。地面上的人们仰望着那两片越来越近的白色足底，已经没有人再逃跑了。\n\n足底继续下压，开始真正接触地表。\n\n最先承受压力的是星球两端的大陆。白色丝袜的细密纹路压在地面上，将地表上残存的一切压入土地之中。建筑物在这种压力下悄无声息地坍塌，连碎裂的声音都被淹没在整颗星球发出的低沉轰鸣里。\n\n蕾恩娜轻轻蹭动了一下足底。\n\n这个看似随意的动作，让地表上大片区域瞬间化为平地。足底的摩擦带走了地表的一切——城市、山脉、海洋——悉数被卷入丝袜的纤维之间，变成附着在她足底的污渍。岩浆从新生的裂缝中喷涌而出，却在接触到她足底的温度后迅速汽化，化作滚烫的蒸汽从丝袜边缘溢出。\n\n"……嗯。"\n\n她低低地应了一声，语气平静，却带着几分专注的满足，开始有节奏地来回摩擦双足。\n\n每一次向内收紧，星球就会发出新的轰鸣，新的裂缝从地壳深处炸开；每一次向外舒展，那些刚刚暴露出来的滚烫地幔就会被足底的回拉带走一层，再次填入丝袜的纹路之间。整颗星球在这种持续不断的摩擦中急速瓦解，赤道地带被挤压得向外鼓起，如同一个被缓缓捏扁的果冻。\n\n地壳的轰鸣声越来越密集，越来越绝望。\n\n蕾恩娜将双足向内再收紧了一些。\n\n第一道主裂缝从赤道附近炸开，以肉眼可见的速度向两极蔓延。裂缝的宽度在短短数秒内就扩张到足以吞没整座大陆的程度，深度直抵星球内核。炽热的地幔物质从这道巨大的伤口中喷涌而出，将整颗星球的轮廓染成一片暗红。\n\n紧接着是第二道、第三道。\n\n裂缝如蛛网般向四面八方蔓延，将星球的地壳切割成无数碎块。那些碎块在足底的压力下相互挤压、错位，发出一阵接一阵沉闷的碎裂声。\n\n蕾恩娜微微低头，透过双腿的间隙俯视着这颗正在走向终结的星球，眼神平静而专注。\n\n她将双足猛地向内一合。\n\n沉闷的一声巨响。\n\n星球的内核在这最后一击中彻底崩裂，整颗星球从内到外碎裂成数块巨大的残骸，被她的双足死死夹在其间，无法逃散。岩浆与尘埃从每一道裂缝中喷涌而出，在太空中缓缓扩散，形成一圈昏暗的光环。\n\n蕾恩娜缓缓将双足分开。\n\n那几块被严重压扁、布满丝袜纹路印记的残骸在原地无助地漂浮着，勉强还维持着原本的相对位置，却已经再也无法拼回成一颗完整的星球。\n\n她低头看了看足底沾染的那些碎屑与污渍，随意地活动了一下足趾。\n\n"嘛。"\n\n她轻声说了一个字，语气里既没有满足，也没有遗憾，就像是完成了一件普通得不能再普通的小事。\n\n她的身影缓缓在星海中远去。
  gts_rainna_la_grande_first_meeting.31229.desc: "Rainna's feet slowly closed in from both sides, those two soles tightly clad in white thigh-high stockings once again plunging the entire planet into boundless darkness.\n\nThe edges of her arches were the first to brush against the atmosphere. Soft, elastic flesh through the stockings pressed against the air, stirring up howling hurricanes that swept across the entire world. Clouds disintegrated beneath this pressure, and the sky turned instantly gray. Down on the surface, people stared up at the two descending white soles; no one tried to flee anymore.\n\nHer soles pressed further, making true contact with the surface.\n\nThe continents at either pole were the first to bear the brunt. The fine weave of the white stockings pressed into the ground, forcing everything on the surface deep into the soil. Buildings collapsed soundlessly under the sheer weight, even the roar of destruction drowned out by the low, agonizing groan vibrating through the core of the world.\n\nRainna gave her soles a light rub.\n\nThat seemingly casual movement wiped entire regions flat in an instant. The friction stripped away everything—cities, mountain ranges, oceans—swallowed up between the textile fibers, reduced to grime adhering to her soles. Magma erupted from fresh chasms, only to vaporize instantly against the intense heat of her skin, hissing outward as scalding plumes of steam along the stocking edges.\n\n\"...Mmm.\"\n\nShe let out a low murmur, her voice calm yet brimming with focused satisfaction as she began rubbing her feet rhythmically back and forth.\n\nWith each inward squeeze, the planet groaned anew as fresh fissures blasted outward from deep within the crust. With each outward stretch, the newly exposed, scorching mantle was peeled away by her receding soles, packing further into the stocking weave. Under this unrelenting friction, the planet rapidly broke down, its equatorial belt bulging outward like a slowly squashed ball of jelly.\n\nThe rumbling of the crust grew ever denser, ever more desperate.\n\nRainna tightened her feet inward a little more.\n\nThe first primary chasm erupted near the equator, tearing toward the poles at visible speed. Within seconds, the fissure widened enough to swallow an entire continent, plunging straight down to the planetary core. Blistering mantle material erupted from this colossal wound, bathing the world's silhouette in deep crimson.\n\nThen came the second, and the third.\n\nLike a spiderweb, cracks spread in every direction, cleaving the planetary crust into countless shattered chunks. These fragments ground against one another under the crushing weight of her soles, producing continuous, muffled snaps.\n\nRainna lowered her gaze slightly, peering through the gap between her legs at the dying world below, her eyes placid and intent.\n\nWith a sudden motion, she slammed both feet together.\n\nA dull, monstrous boom.\n\nIn this final blow, the core ruptured completely, the planet shattering inside out into massive remnants pinned tightly between her soles, unable to scatter. Magma and dust erupted from every fissure, spreading slowly through space to form a dusky ring.\n\nRainna slowly parted her feet.\n\nThose flattened fragments, heavily embossed with the texture of her stockings, drifted helplessly in place. Though they roughly retained their relative positions, they could never be assembled into an intact world again.\n\nShe glanced down at the dust and grime coating her soles, lazily wiggling her toes.\n\n\"Well.\"\n\nShe uttered that single syllable, without satisfaction or regret, as though she had merely finished an utterly mundane chore.\n\nHer figure slowly drifted away into the star-sea."
#  蕾恩娜的双足从两侧缓缓逼近。\n\n没有任何戏谑，没有任何铺垫。那两片被白色长筒丝袜紧紧包裹的足底以一种从容而不可阻挡的姿态向内收拢，就像是某件早已注定的事情，终于走到了它该走到的地方。\n\n巨大的阴影再度笼罩了整颗星球。\n\n足底贴近大气层的瞬间，气流开始剧烈震荡。狂风从两侧同时涌起，横扫整片大陆。海面在这股力量下翻腾咆哮，高达数千米的巨浪扑向沿岸城市。云层被撕裂成碎片，天空在两片足底之间变得越来越窄，越来越暗。\n\n星球上，警报声再度响彻每一个角落。\n\n人们仰望着天空，看着那两片洁白的足底从两侧缓缓压来，将整个视野一点一点地吞噬。有人奔跑，有人祈祷，更多的人只是默默地站在原地，仰着头，看着那不可阻挡的一切慢慢降临。\n\n足弓的边缘率先触及了大气层顶端。\n\n柔软而充满弹性的丝袜肌肤轻轻压入大气层，如同两座从天而降的山脉。接触的瞬间，整颗星球都感受到了来自两侧均匀而持续的压力。地壳发出低沉的轰鸣，第一批裂缝悄然在两极附近延伸开来。\n\n足底继续下压。\n\n两端最大的大陆首当其冲。足弓的弧线完美贴合着星球的曲率，白色丝袜的细密纹路清晰地印在地表之上。连绵的城市群在这片柔软的天幕下悄然消失，高耸的建筑群被压入地壳，如同被熨斗烫过的布料，平整而彻底。岩浆从新生的裂缝中喷涌而出，在足底的压力下四散流淌，随即被更大的压力重新封入地下。\n\n蕾恩娜低头看了一眼，微微调整了一下角度。\n\n足趾开始灵活地活动。\n\n那五根修长的足趾各自找到了落点，在密集的城市群间轻盈地点压、蜷曲。每一次足趾的收拢都将一整片区域碾入地下，每一次张开都带走大量的碎屑，将其扬入大气层，形成翻涌的尘埃云雾。足趾间的缝隙中夹带着大量被压碎的建筑残骸，随着她足趾的每一次活动而剥落，如黑色的雪花般飘向四方。\n\n“嗯……”\n\n蕾恩娜轻轻应了一声，语气中带着几分若有所思的专注。\n\n她开始缓缓施力。\n\n两只足底同时向内收紧，均匀而坚定。星球在这股力量下开始整体变形，赤道地带被挤压得向外鼓起，如同一颗被捏住两端的软球。地幔在难以想象的压力下开始流动，从赤道附近的裂缝中缓缓渗出，在地表形成绵延数千公里的岩浆带。\n\n裂缝越来越多，越来越深。\n\n它们从两极向赤道疯狂蔓延，如同玻璃破裂时的纹路，将整颗星球的地壳切割成无数碎块。山脉沿着裂缝轰然坍塌，海床随着板块的错位急剧下沉，残存的海水涌入地壳深处，接触到岩浆后瞬间汽化，从裂缝中以滚烫的蒸汽柱喷向天空。\n\n蕾恩娜将双足轻轻向内一收。\n\n咔嚓。\n\n一声沉闷而清脆的脆响，从星球最深处传出。\n\n整颗星球在这最后一刻彻底碎裂，从内部炸开，裂成数块巨大的碎片。那些碎片勉强维持着原来的位置，却已经是无可挽回的终结。核心暴露在太空中，炽热的岩浆与金属在真空里迅速冷却，凝固成参差不齐的断面。\n\n蕾恩娜缓缓将双足抬起。\n\n白色丝袜上沾满了大量的灰尘、岩石碎屑与凝固的岩浆，那些曾经是城市、是文明、是无数生命的东西，如今都成了丝袜上一层深色的污渍。她在太空中随意活动了一下足趾，让更多的碎屑从丝袜表面剥落，如同黑色的星尘般飘散开去。\n\n她看了一眼那几块漂浮着的残骸，神情平静。\n\n“嘛。”\n\n她轻声说了一个字，随即收回目光，慵懒地在太空中伸了个懒腰。
  gts_rainna_la_grande_first_meeting.31229_alter.desc: "Rainna's feet closed in slowly from both sides.\n\nNo teasing, no preamble. Those two soles wrapped snugly in white thigh-high stockings closed inward with deliberate, unstoppable grace, like an inevitability that had finally reached its destined conclusion.\n\nA monstrous shadow engulfed the entire world once more.\n\nThe moment her soles neared the atmosphere, atmospheric currents went wild. Violent gales surged simultaneously from both sides, sweeping across entire continents. Oceans roared under the force, hurling tsunamis thousands of meters high against coastal cities. Clouds were ripped to shreds; the sky between the two soles grew narrower and darker by the second.\n\nAcross the globe, sirens wailed in every corner once more.\n\nPeople looked up into the heavens, watching the pristine white soles pressing down from either side, swallowing their vision piece by piece. Some ran, some prayed, but most simply stood frozen in place, heads tilted back, watching the unavoidable doom descend.\n\nThe edges of her arches were the first to graze the top of the atmosphere.\n\nSoft, springy stocking-clad flesh pressed gently into the atmosphere like two mountains descending from heaven. The instant contact was made, the entire world felt a uniform, crushing pressure from both flanks. The crust gave a low groan, and the first fissures quietly spread near the poles.\n\nHer soles pressed further.\n\nThe largest continents at either end took the first blow. The curvature of her arches hugged the planet's contour perfectly, the fine weave of the white stockings embossing itself distinctly into the surface. Sprawling urban sprawls vanished beneath this soft canopy, towering high-rises pressed into the crust like fabric flattened under an iron. Magma erupted from newborn fissures, flowing across the land only to be forced back underground by greater pressure.\n\nRainna glanced down, slightly adjusting her angle.\n\nHer toes began to move with nimble dexterity.\n\nEach of her five slender toes found its own landing zone, tapping, curling, and pressing lightly across dense city clusters. Each curl of a toe ground an entire district into the earth; each extension carried away vast amounts of rubble, tossing it into the atmosphere as churning clouds of dust. Gaps between her toes trapped heaps of pulverized buildings, which flaked off with every toe movement like black snowflakes drifting across the globe.\n\n\"Mmm...\"\n\nRainna gave a soft murmur, her tone carrying thoughtful focus.\n\nShe began to apply steady force.\n\nBoth soles tightened inward at the same time, evenly and firmly. The planet began deforming as a whole, its equator bulging outward like a soft rubber ball pinched at both ends. Under unfathomable pressure, the mantle liquefied and welled up from equatorial fissures, carving magma belts thousands of kilometers long across the globe.\n\nFissures grew more numerous, plunging ever deeper.\n\nThey raced furiously from the poles to the equator like shattering glass, slicing the global crust into countless fragments. Mountain ranges collapsed along fault lines; ocean beds sank sharply with shifting tectonic plates. Remaining seawater plunged into the deep crust, flash-vaporizing against magma and erupting into the sky as towering pillars of scalding steam.\n\nRainna squeezed her feet lightly inward.\n\nSnap.\n\nA muffled yet crisp crack echoed from the planet's deepest core.\n\nIn that final instant, the planet ruptured entirely, detonating from within and shattering into massive chunks. Though the fragments clung roughly to their original shape, the end was irrevocable. The core lay exposed to space, searing magma and metals cooling rapidly in the vacuum into jagged cross-sections.\n\nRainna slowly raised her feet.\n\nHer white stockings were caked in dust, rock debris, and congealed magma—everything that had once been cities, civilization, and countless lives was now a dark stain on her stockings. She casually wiggled her toes in the void, letting more debris flake away like black stardust drifting into the dark.\n\nGlancing at the drifting wreckage, her expression remained calm.\n\n\"Well.\"\n\nShe spoke a single word, then looked away, stretching languidly in outer space."
#  两只被白色长筒丝袜紧紧包裹的足底缓缓向星球两侧靠拢，巨大的阴影再度笼罩了整片天空。\n\n没有任何多余的话。\n\n足弓的弧线贴近大气层，丝袜的细密纹路在大气层上投下无数细小的阴影。从地面望去，天空已经完全被那雪白的丝袜占据，阳光被彻底遮蔽，整个星球陷入一片不自然的昏暗之中。\n\n足底继续下压。\n\n大气层在这股压力下开始剧烈涌动，狂风从两侧呼啸而起，横扫过整片大陆。海面掀起数千米高的巨浪，将沿海城市悉数淹没。山脉在震动中簌簌落石，平原上的建筑群如同纸牌屋般在气流中接连倒塌。\n\n白色丝袜与地表的第一次接触，轻得出奇。\n\n足弓的边缘轻柔地贴上了星球两端最大的两片大陆，那种柔软而充满弹性的触感，让整颗星球都感受到了一种奇异的压迫。丝袜的纹路印在地表上，将城市群的轮廓压进土地之中，留下清晰而巨大的拓印。\n\n然后，她开始用力。\n\n足底缓缓向内推进，地壳在这股力量下发出低沉的轰鸣。第一道裂缝从赤道附近悄然出现，随即如蛛网般向四周蔓延。岩浆从裂缝深处涌出，在足底的压迫下被迫向两侧流淌，形成蜿蜒的火焰河流。\n\n蕾恩娜微微蹭动了一下足底。\n\n这个看似漫不经心的动作，带来了毁灭性的后果。足底的摩擦将地表上残存的一切悉数卷走，城市、森林、山脉，都在这柔软的丝袜纤维下化为细碎的粉末，嵌入纤维之间。被挤出的岩浆在足底的温度下迅速汽化，化作滚烫的蒸汽从丝袜边缘喷涌而出，在太空中形成一圈诡异的白雾。\n\n她再度收紧。\n\n整颗星球在两片足底之间开始剧烈变形，赤道地带在巨大的压力下向外鼓起，像是一颗被缓缓捏扁的果冻。大陆板块在这股力量下彻底失去了原有的形状，断裂、错位、重叠，山脉被压入地幔，海床被挤压成新的山峰。\n\n“嗯……”\n\n蕾恩娜低低地应了一声，闭上眼睛，仔细感受着足底传来的触感。她能清楚地分辨出地壳不同层次的质感——坚硬的岩石、柔软的泥土、炽热的岩浆，以及那些越来越微弱的、来自足底下方某处的细微震动。\n\n她将双足向内猛地一合。\n\n一声沉闷而深远的巨响在太空中回荡。星球的内核在这股力量下彻底崩裂，整颗星球从内部开始瓦解。巨大的碎块在足底之间四散迸裂，岩浆与尘埃在太空中肆意飞溅，在蕾恩娜白色的丝袜上留下大片灼热的污渍。\n\n蕾恩娜缓缓将双足分开。\n\n那些破碎的残骸无声地漂散在太空中，有的还在缓缓燃烧，有的已经冷却成漆黑的岩块。丝袜上沾满了大量的碎屑与污渍，白色的纤维间嵌满了曾经是城市、山脉、海洋的粉末。\n\n她低头看了看，随意地活动了一下足趾，让一些较大的碎屑剥落。\n\n“嘛。”\n\n她平静地说了一个字，随即将视线移向远处的星海。
  gts_rainna_la_grande_first_meeting.31229_alter2.desc: "Two soles tightly clad in white thigh-high stockings closed in on either side of the planet, a monstrous shadow once again swallowing the entire sky.\n\nNot a single word was spoken.\n\nThe arches drew close to the atmosphere, the stocking's delicate weave casting countless minute shadows upon the clouds. From the ground, the sky was completely conquered by that snow-white fabric; sunlight was extinguished, plunging the entire world into an unnatural twilight.\n\nHer soles pressed down further.\n\nThe atmosphere surged violently under the pressure, fierce gales screaming across the continents from both flanks. Waves thousands of meters high flooded coastal cities. Mountains crumbled into cascading rockfalls, and plains filled with buildings collapsed like houses of cards beneath the atmospheric turbulence.\n\nThe initial contact between white stockings and the planet's surface was astonishingly light.\n\nThe edges of her arches rested tenderly against the largest continents at either pole; that soft, elastic touch imparted an uncanny pressure across the whole world. The weave imprinted itself into the earth, pressing city contours into the dirt like massive rubbings.\n\nThen, she began to exert force.\n\nHer soles pushed slowly inward, the crust groaning with deep rumbles under the force. The first fissure appeared quietly near the equator, spreading like a spiderweb across the land. Magma welled from the depths, forced outward along her soles into winding rivers of flame.\n\nRainna gave her soles a slight rub.\n\nThat seemingly casual movement wrought utter catastrophe. The friction wiped away everything remaining on the surface; cities, forests, and mountains were reduced to fine powder beneath the soft fabric, embedding themselves into the weave. Displaced magma vaporized instantly beneath the heat of her soles, venting from the stocking edges as scalding steam, forming a bizarre ring of white mist in outer space.\n\nShe tightened her squeeze again.\n\nBetween her two soles, the planet deformed violently, its equator bulging outward like a slowly squashed gelatin sphere. Continental plates lost all semblance of their original shapes—fracturing, shifting, overlapping—mountains forced down into the mantle, and ocean beds crushed into new peaks.\n\n\"Mmm...\"\n\nRainna gave a low sigh, closing her eyes to savor the sensations radiating from her soles. She could clearly distinguish the varying textures of the crust—hard rock, soft earth, molten lava, and the faint, dying vibrations from deep beneath her feet.\n\nShe slammed both feet inward with fierce intensity.\n\nA deep, hollow crash echoed through the cosmos. The core collapsed utterly beneath the force, and the planet broke apart from the inside out. Massive fragments burst in all directions between her soles, magma and dust spraying wildly into space, leaving large, scorching stains on her white stockings.\n\nRainna slowly parted her feet.\n\nThe shattered wreckage drifted silently into the void, some pieces still glowing with embers, others already cooled into black stone. Her stockings were heavily coated in debris and stains, white fibers packed with the dust of former cities, mountains, and seas.\n\nLooking down, she casually wiggled her toes to dislodge a few larger chunks.\n\n\"Well.\"\n\nShe uttered that single word calmly, then turned her gaze toward the distant sea of stars."
