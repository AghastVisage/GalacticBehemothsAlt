#  您现在拥有[root.rainna_la_grande_coin_value]£rainna_la_grande_coin£蕾恩娜币，它们是蕾恩娜银行发行的货币，旨在防止你的能量币溢出。\n\n“蕾恩娜银行”已添加至外交界面。您现在可以随时联系蕾恩娜将蕾恩娜币兑换为能量币，或者反过来。\n\n您还可以以极低的成本贷款任何资源，这将把你从资源短缺的危机中拉回来。\n\n每月都可以打开一次贷款页面哦，说不定有随机的礼物。\n\n蕾恩娜银行的礼物已经为您准备好了！建议您立刻打开看查。
  gts_rainna_la_grande.13.desc: "You now possess [root.rainna_la_grande_coin_value] £rainna_la_grande_coin£ Rainna Coins. Issued by the Rainna Bank, this currency is designed to prevent your energy credits from overflowing.\\n\\nThe \"Rainna Bank\" has been added to the diplomacy interface. You can now contact Rainna at any time to exchange Rainna Coins for energy credits, or vice versa.\\n\\nYou can also take out loans for any resource at an extremely low cost, pulling your empire back from the brink of resource shortages.\\n\\nYou can check the loan interface once every month—there might even be random gifts waiting for you!\\n\\nA gift from Rainna Bank is already prepared for you! It is recommended that you check it immediately."
