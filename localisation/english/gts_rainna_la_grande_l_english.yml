#  交易
  gts_rainna_la_grande_first_meeting.03.title: "The Deal"
#  “啊……原来是巨型企业啊！”\n\n信号那头的声音突然活泼起来，带着几分难以掩饰的惊喜。\n\n“久仰久仰！你们的名字我可是如雷贯耳呢~那么……”\n\n她顿了一下，语气变得有些撒娇。\n\n“你们这么有钱，想必不介意给我这个远道而来的旅行者一点点小小的资助吧？嘿嘿……”\n\n“放心，把钱投在我身上绝对错不了的啦~那么，快把钱拿出来嘛！”
  gts_rainna_la_grande_first_meeting.03_random_1.desc: "\"Ah... so you're a MegaCorp!\"\\n\\nThe voice on the other end suddenly perks up, brimming with thinly veiled delight.\\n\\n\"Pleasure, absolute pleasure! Your name precedes you, of course~ So...\"\\n\\nShe pauses, adopting a coaxing, playful tone.\\n\\n\"Since you're so filthy rich, surely you wouldn't mind offering a humble traveler who's come so far a tiny bit of financial backing? Heheh...\"\\n\\n\"Don't worry, investing in me is a guaranteed win~ Come on, hand over the credits!\""
#  “哦……没想到居然是企业家。”\n\n她的声音停顿了一下，像是在考虑什么。\n\n“那我就不得不坦白一件事了……”\n\n又是一阵沉默。\n\n“……我现在手头有点紧。”她终于开口，语气有些不自然，“不过！不过你要是给我一些资金，我不就有钱了吗？嘛，严格来说这叫做‘投资’啦。”\n\n“来来来，快来投资我吧！绝对有回报的！”
  gts_rainna_la_grande_first_meeting.03_random_2.desc: "\"Oh... I didn't expect you to be entrepreneurs.\"\\n\\nHer voice trails off, as if mulling something over.\\n\\n\"Then I have a small confession to make...\"\\n\\nAnother brief silence follows.\\n\\n\"...I'm a little strapped for cash at the moment,\" she finally admits, her tone a bit awkward. \"However! If you provide me with some capital, won't I have money? Well, strictly speaking, they call that an 'investment'.\"\\n\\n\"Come on, hurry up and invest in me! There will definitely be returns!\""
#  “哦哦，原来是巨企啊。”\n\n她的语气带着几分真实的惊叹，随即又变得有些不好意思。\n\n“不过金融方面的东西我实在是不太懂呢……毕竟我从来没做过商人。”\n\n她停顿了一下。\n\n“要不然这样——你给我提供一点启动资金怎么样？”\n\n“啊哈，我保证你不会后悔的！”
  gts_rainna_la_grande_first_meeting.03_random_3.desc: "\"Oho, so you're a MegaCorp.\"\\n\\nHer voice holds genuine wonder, before shifting into mild embarrassment.\\n\\n\"Though honestly, I don't know much about finance... I've never been a merchant, after all.\"\\n\\nShe pauses for a second.\\n\\n\"How about this—what if you provide me with a little seed capital?\"\\n\\n\"Aha, I promise you won't regret it!\""
#  “欸，交易？原来是企业家啊。”\n\n她的声音中带着几分真实的困惑。\n\n“我对经济学实在是一窍不通，你们那一套规则我有点玩不明白……”\n\n她沉默了片刻，像是在认真思考。\n\n“这样吧，我规定我名下1%的股份，定价600能量币£energy£。”\n\n“嘿嘿……要不然买一点点？应该不贵的啦~”
  gts_rainna_la_grande_first_meeting.03_random_4.desc: "\"Eh, a deal? So you're entrepreneurs.\"\\n\\nHer voice carries genuine confusion.\\n\\n\"I know next to nothing about economics, and your whole rulebook goes right over my head...\"\\n\\nShe pauses in thought for a moment.\\n\\n\"How about this: I'll set a 1% share of myself at 600 Energy Credits £energy£.\"\\n\\n\"Heheh... why not buy a little slice? That shouldn't be too expensive~\""
