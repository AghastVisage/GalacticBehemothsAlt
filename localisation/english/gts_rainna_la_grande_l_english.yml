  gts_rainna_la_grande_roma_ventus_II: "Roma Vetus II"
#  新罗马
  gts_rainna_la_grande_roma_nova: "Roma Nova"
#  新罗马I
  gts_rainna_la_grande_roma_nova_I: "Roma Nova I"
#  蕾恩娜
  gts_rainna_la_grande.00.title: "Rainna"
#  “打扰了，我是蕾恩娜。我听说你在找我？\n\n也许你从未听说过我的名字——不过没关系，点击‘是’之后，你很快就会对我印象深刻的。”\n\n这是谁留下的奇怪信息？\n\n点击“是”则会在宇宙中生成蕾恩娜相关内容。
  gts_rainna_la_grande.00.desc: "\"Excuse me, I am Rainna. I heard you were looking for me?\\n\\nPerhaps you have never heard my name before—but no matter, after clicking 'Yes', you will soon have a very deep impression of me.\"\n\nWho left this strange message?\n\nClicking \"Yes\" will spawn Rainna-related content across the universe."
#  是
  gts_rainna_la_grande.00.a: "Yes"
#  警告：你永远无法预料蕾恩娜的险恶！尽管你不在抖M模式……
  gts_rainna_la_grande.00.a.tooltip: "Warning: You can never predict Rainna's malice! Even if you are not in masochist mode..."
#  鉴于你玩的政体不是个东西，建议§R不要§!选此选项。
  gts_rainna_la_grande.00.a.tooltip_alter: "Given that your empire's government is an absolute monstrosity, it is recommended §RNOT§! to select this option."
#  鉴于你是游牧政体，由于蕾恩娜相关内容并未兼容游牧政体，大部分内容将会被移除。
  gts_rainna_la_grande.00.a.tooltip_alter_2: "Given that you are playing as a Nomadic empire, and Rainna content is not compatible with Nomadic governments, most content will be removed."
#  否
  gts_rainna_la_grande.00.b: "No"
#  我只想体验剧情（打开剧情体验模式）
  gts_rainna_la_grande.00.c: "I only want to experience the story (Enable Story Mode)"
#  将移除大部分蕾恩娜造成的负面后果。
  gts_rainna_la_grande.00.c.tooltip: "Removes most negative consequences caused by Rainna."
#  沉睡的远古实体
  gts_rainna_la_grande.01.title: "Sleeping Ancient Entity"
#  科研团队在黑洞的另一侧探查到了一个神秘的实体。\n\n根据初步观测，她的体型远超任何已知的天体生命，却只是静静地漂浮在黑洞边缘，似乎只是陷入了某种深度的沉眠。好奇的科学家们摩拳擦掌，迫不及待地请求前去唤醒她。\n\n然而，你的内心深处有一种隐隐的不安。也许……先处理完手头的其他事情会更稳妥一些。
  gts_rainna_la_grande.01.desc: "The science team has detected a mysterious entity on the other side of the black hole.\\n\\nAccording to preliminary observations, her size far exceeds any known celestial lifeform, yet she drifts silently at the edge of the event horizon, seemingly lost in deep slumber. Eager and curious, our scientists are practically begging for permission to go and awaken her.\\n\\nYet deep within, an ominous unease lingers. Perhaps... it would be much safer to attend to other pressing matters first."
#  知道了
  gts_rainna_la_grande.01.a: "Understood"
#  谨慎一点总是好的。
  gts_rainna_la_grande.01.a.tooltip: "Caution is always prudent."
#  被唤醒的实体
  gts_rainna_la_grande.02.title: "The Awakened Entity"
#  不知是何时，黑洞另一侧的那个巨大身影悄然消失了。\n\n观测站的屏幕上只剩下一片平静的虚空，仿佛什么都不曾发生过。科学家们面面相觑，翻遍了所有的观测记录，却找不到任何她离去的痕迹。\n\n也许……这一切只是一场梦？
  gts_rainna_la_grande.02.desc: "At some unknown moment, the gargantuan figure on the other side of the black hole vanished without a trace.\\n\\nThe observatory monitors display only tranquil void, as if nothing had ever existed there. Scientists exchange bewildered glances and comb through every observation log, yet find no trace of her departure whatsoever.\\n\\nPerhaps... this was all just a dream?"
#  怎么回事……
  gts_rainna_la_grande.02.a: "What happened...?"
#  警报
  gts_rainna_la_grande.11.title: "Alert"
#  [Planet.GetName]的行星防御系统在深夜突然发出了警报。\n\n值班人员被刺耳的警报声惊醒，冲到监控屏幕前。雷达上，一个庞大的物体正从深空缓缓接近，它的体积超出了系统预设的所有分类参数，以至于计算机一度将其误判为一颗小行星。\n\n但小行星不会主动调整轨道。\n\n随着那个物体越来越近，观测数据变得越来越清晰，也越来越令人不安。防御指挥中心陷入了短暂的沉默，所有人都想起了那个流传已久的名字。
  gts_rainna_la_grande.11_1.desc: "In the dead of night, [Planet.GetName]'s planetary defense grid suddenly blared an alarm.\\n\\nStaff on duty were startled awake by the piercing klaxon and rushed to their monitoring stations. On the radar, a colossal object was slowly approaching from deep space. Its sheer volume exceeded every classification parameter programmed into the system, causing the computers to initially misidentify it as an asteroid.\\n\\nYet asteroids do not adjust their own trajectories.\\n\\nAs the object drew nearer, sensor telemetry grew sharper—and far more disturbing. The defense command center fell into a stunned silence as everyone remembered that name whispered for eons."
#  [Planet.GetName]轨道监测站记录到了异常。\n\n一个巨大的阴影正在遮蔽远处的星光，缓慢却坚定地朝这颗星球靠近。它没有发出任何标准的通讯信号，也没有回应任何询问，只是静静地、庞大地存在着，像是一片移动的黑暗。\n\n监测站的负责人调出了历史数据，很快，他的脸色变得凝重起来。\n\n这个接近模式，他们并不陌生。
  gts_rainna_la_grande.11_2.desc: "The orbital monitoring station over [Planet.GetName] has recorded an anomaly.\\n\\nA titanic shadow is blotting out the distant starlight, approaching the world with slow, steady inevitability. It transmits no standard communication signals and ignores all hails, simply looming there—vast and silent, like a roaming swath of primordial darkness.\\n\\nThe station commander pulled up historical archival data, and his expression quickly hardened.\\n\\nThis approach vector was all too familiar."
#  警报响起的时候，[Planet.GetName]的大多数居民还在睡梦之中。\n\n防御系统检测到一个体积异常庞大的物体正在接近大气层，它的规模让所有的拦截预案都失去了意义——没有任何武器系统的设计参数考虑过如此巨大的目标。指挥官盯着屏幕上那个不断放大的轮廓，手指悬在警报按钮上方，却迟迟没有按下。\n\n因为他知道，无论按不按，结果恐怕都不会有什么不同。\n\n那个熟悉的身影，又回来了。
  gts_rainna_la_grande.11_3.desc: "When the sirens began wailing, most inhabitants of [Planet.GetName] were still fast asleep.\\n\\nThe defense systems detected an entity of staggering proportions entering the upper atmosphere. Its scale made every planetary interception protocol entirely moot—no defense grid had ever been designed with a target this monstrous in mind. The commander stared blankly at the expanding silhouette on the holo-screen, his finger hovering over the general evacuation klaxon, yet never pressing it down.\\n\\nHe knew deep down that pressing it would change nothing.\\n\\nThat familiar figure had returned."
#  “长官，您得来看看这个。”\n\n[Planet.GetName]防御中心的技术员声音发颤。屏幕上，一个庞大的物体正在穿越外层空间，朝着这颗星球径直而来。它的体积大得不像话，轮廓却意外地……有机。\n\n那不是飞船，不是小行星，也不是任何已知的天体。\n\n指挥官盯着屏幕看了很久，最终缓缓开口，声音里带着一丝难以掩饰的疲惫：\n\n“通知所有人。”\n\n“她来了。”
  gts_rainna_la_grande.11_4.desc: "\"Commander, you need to see this.\"\n\nThe technician at the [Planet.GetName] defense headquarters spoke with a trembling voice. On the screen, a colossal form was cruising through exospheric space, heading straight toward the world. Its dimensions were mind-bogglingly immense, yet its contours were unmistakably... organic.\n\nIt was not a starship, nor an asteroid, nor any recognized astronomical body.\n\nThe commander stared into the screen for a long while before finally speaking, his voice heavy with weary resignation:\n\n\"Alert everyone.\"\n\n\"She is here.\""
#  蕾恩娜币
