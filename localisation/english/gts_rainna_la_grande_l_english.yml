#  “高的蕾恩娜”
  gts_rainna_la_grande_first_meeting.01.title: "\"Tall Rainna\""
#  信号输入\n\n“你们好啊，我是‘高的蕾恩娜’。”\n\n信号那头的声音轻快而随意，像是邻居串门一样自然。\n\n“我是一个孤独的旅行者，走了好久好久了呢~请问……你们允许我来到你的星球上歇歇脚，顺便领略一下你们伟大的文化吗？”\n\n她停顿了一下。\n\n“放心，不会有事的……”
  gts_rainna_la_grande_first_meeting.01_random_1.desc: "Incoming Signal\\n\\n\"Hello there, I'm 'Tall Rainna'.\"\\n\\nThe voice on the other end is cheerful and casual, as natural as a neighbor dropping by for a visit.\\n\\n\"I'm a lonely traveler, and I've been walking for so, so long~ May I... have your permission to rest my feet on your planet, and take in your magnificent culture while I'm at it?\"\\n\\nShe pauses for a moment.\\n\\n\"Don't worry, nothing bad will happen...\""
#  信号输入\n\n“你们好，我是‘高的蕾恩娜’。”\n\n那是一个年轻少女的声音，带着几分漫不经心的友好。\n\n“我是我是一个远道而来的探险者。不过……现在好像有些迷路了。”\n\n那是一个年轻少女的声音，带着几分漫不经心的友好。\n\n“请问……你是否允许我来到你的星球上落脚，顺便参观你们恢弘的文明？”\n\n短暂的停顿后，她补充道：\n\n“备注：我是好人。”
  gts_rainna_la_grande_first_meeting.01_random_2.desc: "Incoming Signal\\n\\n\"Hello, I'm 'Tall Rainna'.\"\\n\\nIt is the voice of a young maiden, carrying a hint of casual friendliness.\\n\\n\"I'm—I'm an explorer who has traveled from afar. But... I seem to be a little lost right now.\"\\n\\nIt is the voice of a young maiden, carrying a hint of casual friendliness.\\n\\n\"May I... have your permission to stop by your planet, and visit your magnificent civilization while I'm at it?\"\\n\\nAfter a brief pause, she adds:\\n\\n\"Note: I'm a good person.\""
#  信号输入\n\n“你好，我是来自异世界的旅行者，你们可以叫我‘高的蕾恩娜’。”\n\n声音温和而有礼，像是经过了认真措辞。\n\n“你可能第一次听到我的名字。我现在略有疲乏，请问您是否允许我踏足在你们星球的领土上，好好休息一下？”\n\n“别担心，我没有恶意的。”
  gts_rainna_la_grande_first_meeting.01_random_3.desc: "Incoming Signal\\n\\n\"Greetings, I am a traveler from another world. You may call me 'Tall Rainna'.\"\\n\\nThe voice is gentle and polite, as though carefully phrased.\\n\\n\"This may be the first time you've heard my name. I am a little tired right now. Would you grant me permission to set foot on your planet's soil and have a good rest?\"\\n\\n\"Don't worry, I bear no ill intent.\""
#  信号输入\n\n“嘛，你们好……我是‘高的蕾恩娜’。”\n\n那个声音懒洋洋的，带着几分漫不经心。\n\n“我想，你应该是第一次听说我的名字吧。我嘛，算是个来自远方的流浪者——哦，不是那种贫穷的流浪汉啦，别误会~”\n\n她像是在解释一件理所当然的事情。\n\n“我只是想到处走走，降临到不同的星球上看看。你们愿意招待我一下吗？我会感谢你们的。”\n\n“我不会惹事的啦。”
  gts_rainna_la_grande_first_meeting.01_random_4.desc: "Incoming Signal\\n\\n\"Well, hello there... I'm 'Tall Rainna'.\"\\n\\nThe voice is lazy, carrying a touch of nonchalance.\\n\\n\"I imagine this is the first time you've heard my name. Me? I suppose I'm a wanderer from far away—oh, not a penniless vagrant, don't get the wrong idea~\"\\n\\nShe explains as if stating the most obvious thing in the world.\\n\\n\"I just like to wander around and drop by different planets to look around. Would you be willing to host me? I'll make it worth your while.\"\\n\\n\"I won't cause any trouble, really.\""
#  当然可以！
  gts_rainna_la_grande_first_meeting.01.a: "Of course you may!"
#  这份热情似乎有点过头了……
