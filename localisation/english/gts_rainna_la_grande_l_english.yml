  gts_rainna_la_grande_first_meeting.221.b_tooltip: "Can we really...?"
#  “嘛……”\n\n蕾恩娜的声音中带着玩味的笑意。在漆黑的太空中，她那巨大的身影突然显现，如同一座移动的星云般壮丽而可怕。星光在她白皙的肌肤上跳跃，为这个可怖的场景增添了几分诡异的美感。\n\n“哼哼，既然你们不想让我伤害你们……”\n\n她歪着头，在朦胧的云层背后露出一个天真而危险的笑容。\n\n“那想必是有什么厉害的武器藏着没让我看到吧~”\n\n通讯器中传来她轻快的声音，却让每个听到的人都背脊发凉。她的身体优雅地在太空中旋转了一周，像是在水中嬉戏的少女，只是她的每个动作都让整个星球的人心惊胆战。\n\n“哦？你们不会……只会示弱这一招吧？”\n\n她的声音变得危险，故意拖长了语调。\n\n“那我为什么要在意你们的请求呢？”\n\n蕾恩娜伸出一根修长的手指，在大气层外灵巧地画着圈，寻找着落点。每一个动作都优雅得像是在跳舞，却让地面上的军事指挥官们冷汗直流。他们引以为傲的防御系统在她面前，就像是玩具一般可笑。
  gts_rainna_la_grande_first_meeting.222.desc: "\"Well...\"\n\nRainna's voice carries a playful amusement. In the pitch-black cosmos, her gigantic figure suddenly reveals itself, as magnificent and terrifying as a roaming nebula. Starlight dances across her fair skin, lending an uncanny beauty to this dreadful scene.\n\n\"Hehehe, since you don't want me to hurt you...\"\n\nTilting her head, she flashes an innocent yet perilous smile behind the hazy clouds.\n\n\"Then surely you must have some formidable weapon hidden away that I haven't seen yet~\"\n\nHer cheery voice filters through the comms, sending shivers down the spine of everyone who hears it. Her body twirls gracefully in the void like a maiden playing in the water, yet every single motion strikes terror into the hearts of the entire planet.\n\n\"Oh? Don't tell me... playing weak is your only trick?\"\n\nHer tone grows menacing, deliberately dragging out each syllable.\n\n\"Then why should I care about your little pleas?\"\n\nRainna extends a slender finger, tracing deft circles just outside the atmosphere as she picks her target. Every gesture is as graceful as a dance, yet it drenches the military commanders on the ground in cold sweat. The planetary defense systems they took such pride in seem utterly laughable before her."
#  “呀呀呀……你们这群小家伙，居然是这样欢迎访客的，服务态度真差！”\n\n蕾恩娜的表情从天真转为顽皮，那变化让人不寒而栗。她俯下身，闭起左眼，将右眼凑近行星表面。那巨大的淡蓝色瞳孔取代了整片天空，如同一颗悬浮在天际的巨大蓝宝石。她每一次眨眼，都让整个大气层剧烈震颤，美丽的云层在这冲击下支离破碎，化作混乱的气流席卷着城市表面。\n\n“欸——我怎么没有看到你们的军队呢？难道是……你们是跟我开玩笑的？”\n\n她伸出一根修长的食指，在那苍白的指影下，整个星球的军队正在集结。装甲车的履带在地面碾出沉重的轰鸣，战机编队划过天际，导弹发射井缓缓开启。但这一切在她指尖的阴影中，显得如此微不足道。\n\n“还是说……你们的军队所在跟我开玩笑呢？”\n\n“嘛，我可不喜欢玩笑~”
  gts_rainna_la_grande_first_meeting.224.desc: "\"My, my, my... you little creatures certainly have terrible hospitality! What awful service for a visitor!\"\n\nRainna's expression shifts from innocent to wicked, a transformation that sends chills down the spine. Leaning down, she closes her left eye and presses her right eye close to the planetary surface. That colossal pale-blue pupil takes over the entire sky like a titanic sapphire suspended in the heavens. Every time she blinks, the atmosphere shudders violently; exquisite cloud formations shatter under the shockwaves into turbulent vortices sweeping across metropolitan sprawls.\n\n\"Eh—how come I don't see your army? Could it be... you were just kidding with me?\"\n\nShe extends a slender index finger. Beneath that pale shadow, the planet's entire armed forces are mobilizing. Tank treads thunder against pavement, squadrons of fighter jets streak across the sky, and missile silos slowly open. Yet beneath the looming shadow of her fingertip, all of it looks pitifully negligible.\n\n\"Or is your military itself just a joke?\"\n\n\"Well, I really don't like jokes~\""
#  “啊咧啊咧，乱攀关系可不好哦~我蕾恩娜也不是和谁都交朋友的哦……”\n\n蕾恩娜将巨大的脸庞贴近这颗渺小的星球，那双湖泊般清澈的眼眸中闪烁着玩味的光芒。她仔细打量着这个微型世界，就像孩童在观察玻璃球里的微观景致。她的长发在真空中无重力地飘散，如同一片梦幻的星云，每一缕发丝的轻微摆动都在大气层中激起涟漪。\n\n她那如湖面般平静的瞳孔映照出半个世界的景象——密集的城市群、蜿蜒的河流、连绵的山脉，一切都是附着在大陆之上的尘埃。每当她轻轻眨眼，那如同城市般巨大的睫毛便会扰动整个大气层，地面随之剧烈震颤。建筑物在震动中摇摇欲坠，玻璃纷纷碎裂，警报声此起彼伏。\n\n她的每一次呼吸都牵动着整个星球的命运，让所有人都感到一阵窒息般的压迫。那些平铺在星球表面如同苔藓般渺小的细节——城市、道路、港口——都在她的气息下剧烈颤抖，仿佛下一秒海浪就会淹没陆地，摩天大楼就会被连根拔起。\n\n如此悬殊的实力差距让她感到愉悦，嘴角不由自主地上扬。\n\n“嘛，不过……”她的声音突然变得俏皮，“也不是不可以哦~”\n\n她优雅地伸出一根修长的食指，那根指尖在太空中划出优美的弧线。当它悬停在大陆上方时，就像一座从天而降的巨柱，遮天蔽日。指尖投下的阴影足以覆盖半个大陆，让那片原本繁华的首都区瞬间陷入漆黑。\n\n街道上的灯光在这突如其来的黑暗中显得格外微弱，如同萤火虫般闪烁。人们仰望天空，看到的只是那遮蔽一切的巨大指尖。它悬在那里，静静地，却让每个人都感受到了死亡的阴影。\n\n她歪着头，指尖在空中轻轻晃动，声音中带着危险的甜蜜。“突然好像在这颗星球上做一个记号，你们不会太在意吧？”
  gts_rainna_la_grande_first_meeting.225.desc: "\"Ara, ara, trying to cozy up to me won't work~ I, Rainna, don't just become friends with anyone, you know...\"\n\nRainna presses her colossal face close to this minuscule planet, her lake-clear eyes gleaming with amused fascination. She examines this miniature world just like a child inspecting a microcosm inside a glass marble. Her long hair billows weightlessly in the void like a dreamlike nebula, the faint sway of every strand sending ripples through the atmosphere.\n\nHer serene pupils, calm as mirror-like lakes, reflect half the world—dense metropolitan clusters, meandering rivers, undulating mountain ranges, all looking like dust clinging to continents. Whenever she lightly blinks, eyelashes vast as cities agitate the entire atmosphere, violently shaking the earth below. Buildings sway precipitously, windows shatter across districts, and sirens wail incessantly.\n\nHer every breath commands the fate of the entire planet, inflicting a suffocating pressure on all below. The moss-like details sprawling across the planetary crust—cities, highways, harbors—tremble violently in her respiration, as if ocean waves could swallow the land and skyscrapers could be uprooted at any moment.\n\nSuch a crushing disparity in power brings her immense delight, an involuntary curve gracing her lips.\n\n\"Well, though...\" Her voice suddenly turns playful, \"I suppose it's not entirely out of the question~\"\n\nShe elegantly extends a slender index finger, tracing a graceful arc through space. As it hovers over the continent, it resembles a titanic pillar descending from the heavens, eclipsing the sky. The shadow cast by that fingertip spans half the continent, immediately plunging the prosperous capital region into darkness.\n\nStreetlights in the sudden gloom appear pitifully faint, flickering like fireflies. Looking up, citizens see only that all-eclipsing fingertip suspended motionless in the sky, casting the cold shadow of mortality over every soul.\n\nTilting her head, she gently bobs her fingertip in the air, her voice dripping with dangerous sweetness. \"I suddenly feel like leaving a little mark on this planet. You wouldn't mind too much, would you?\""
#  听到这个回答，蕾恩娜微微一愣，那双清澈的蓝色眼眸中闪过一丝意外。她半眯起眼睛，饶有兴致地凝视着这颗渺小的星球。\n\n“你们这群小生命崇拜我的多了去了……”她小声嘀咕着，声音中带着些许自得。然而这嘀咕却如同雷鸣般在整个大气层中回荡，震耳欲聋的音波让地面剧烈震颤。“没想到今天还能遇到知道我名号的呢……”\n\n她的声音中带着一丝惊喜，巨大的面庞更加贴近星球，仔细打量着这个微小的世界。在她眼中，密集的城市群不过是一片片细小的光点，而那些高耸的建筑，也不过是地表上微不足道的凸起。\n\n“不过……”她歪着头，长发在太空中优雅地飘动。“这么小的星球，想让我真正降临，恐怕不太现实吧？”\n\n她伸出修长白皙的食指，优雅地轻抵在自己粉嫩的上唇，做出思考的姿态。那个动作如此优美，却让所有目睹这一幕的人心跳骤停——因为那根手指，足以轻易毁灭一切。\n\n“嘛……”她的眼神突然落在那片繁华的大陆上，嘴角勾起一抹顽皮的笑容，“这样吧。”\n\n她的食指从唇边移开，在太空中划出一道优美的弧线。指尖悬停在那片大陆的上方，投下了遮天蔽日的阴影。\n\n“用我的一根手指，稍微打个招呼，应该也算是降临了吧~”\n\n她的声音中充满危险的诱惑。那根食指在大陆上空轻轻晃动，就像是在挑选最完美的落点。每一次微小的移动，都让阴影扫过一座又一座城市,让无数人陷入绝望的等待。\n\n“你们说……”她的眼中闪烁着危险的光芒，“我应该轻轻地碰一下呢，还是稍微用点力呢？”\n\n她的指尖开始缓缓下降，巨大的威压逼近地表。\n\n“作为信徒……”她轻声低语，声音却震动着整个世界，“你们应该很欢迎神明的触碰吧？”
  gts_rainna_la_grande_first_meeting.226.desc: "Hearing this reply, Rainna pauses slightly, a flicker of surprise crossing her clear blue eyes. Half-closing them, she gazes with keen interest at the minuscule planet.\n\n\"There are plenty of tiny lifeforms who worship me...\" she mutters softly, pride evident in her tone. Yet that soft mutter reverberates through the atmosphere like thunder, deafening shockwaves shaking the earth. \"Never thought I'd run into someone today who actually knows my title...\"\n\nDelight enters her voice as she presses her titanic face even closer to inspect this tiny world. In her eyes, sprawling urban clusters are merely clusters of faint specks of light, and towering skyscrapers nothing more than negligible bumps on the crust.\n\n\"Still...\" She tilts her head, long tresses floating gracefully in the cosmos. \"For such a tiny world, expecting my true advent in full might be a bit unrealistic, don't you think?\"\n\nExtending a slender, fair index finger, she rests it elegantly against her soft upper lip in contemplation. The gesture is exquisite, yet it stops the heart of every living soul beholding it—for that single finger is capable of wiping out everything.\n\n\"Well...\" Her gaze suddenly falls upon the bustling continent, a mischievous smile playing on her lips. \"How about this?\"\n\nHer finger pulls away from her lips and traces an elegant arc in space, hovering directly over the continent and casting a sky-blotting shadow.\n\n\"Greeting you with just one of my fingers should count as an advent too, right?~\"\n\nHer voice drips with perilous allure. That index finger wiggles gently over the continent, as if choosing the most perfect spot to strike. Every minute shift sends shadows sweeping across city after city, plunging millions into agonizing suspense.\n\n\"Tell me...\" A dangerous glint flashes in her eyes, \"should I touch it gently, or press down with just a little bit of force?\"\n\nHer fingertip begins its gradual descent, crushing pressure bearing down upon the world.\n\n\"As believers...\" she murmurs, her whisper trembling the entire globe, \"surely you welcome the touch of your goddess, don't you?\""
#  足底夹夹
  gts_rainna_la_grande_first_meeting.311.title: "Sole Squeeze"
#  “嘛——看来是遇到对手了呢~”\n\n蕾恩娜兴奋地屈起足趾，整个身体都激动得微微颤抖。她那双湖泊般的眼眸中闪烁着期待的光芒。\n\n“小家伙们……”\n\n她将巨大的面庞凑近这颗被足底包围的星球，脸上流露出狡黠而愉悦的笑容。她伸出纤细的手指，轻柔地从自己光滑的足底划过，那个挑逗性的触碰让足底被丝袜包裹的肌肤微微颤动，仿佛在期待着即将到来的“游戏”。\n\n“你们可是成功激起了我的兴趣呢~”\n\n与此同时，星球表面已经陷入一片混乱。\n\n全球各地的军事基地同时启动，导弹发射井打开，战机编队呼啸升空，激光武器对准天空。这是[Owner.GetSpeciesName]文明最后的尊严之战——即便敌人是如此不可战胜的存在。\n\n无数的导弹拖着火焰的尾迹冲向天际，在大气层边缘爆炸，试图阻挡两边那逼近的足底。激光束如同光之长矛刺向那雪白的丝袜。战舰齐射的能量炮在足底表面绽放出璀璨的光芒。\n\n但这一切，对蕾恩娜来说……\n\n“嗯……好细腻的攻击，感受到了呢~”\n\n她轻声呢喃着，声音中带着满足的愉悦。那些足以毁灭城市的武器，在她光滑细腻的白丝足底上，不过是温柔的按摩。\n\n“只不过这种小小的瘙痒真是令人舒适呢……”\n\n她咯咯地笑着，微微晃动足趾，让更多的攻击落在足底最敏感的部位。每一次爆炸都像是在挠痒痒，让她忍不住想要更多的“饱和打击”。\n\n“那作为回报……”她的声音突然变得危险，“我可要反击咯~”\n\n两只巨大的足底开始压下。\n\n首先触及星球表面的是足弓的边缘。那丝袜贴合着的柔软而充满弹性的肌肤轻轻贴在大气层上，如同一对温暖的天幕。接触的瞬间，整个星球都感受到了难以承受的压力。\n\n足底继续下沉，开始接触地表。\n\n最先感受到压力的是地球两边最大的大陆。板块在巨大的压力下开始崩裂，发出震耳欲聋的轰鸣。海洋被挤压，掀起前所未有的超级海啸，高达数千米的巨浪横扫其他残余大陆。\n\n“阿啦~看来这颗星球要撑不住了呢……”\n\n蕾恩娜满意地低语。她能清楚地感受到足底下那个微小世界的每一次挣扎。\n\n足底继续加压。\n\n星球表面开始出现第一道裂缝。那条裂缝从赤道附近的海洋中绽放，如同玻璃上的裂纹般迅速蔓延，无数的建筑群伴随着碎裂的土地调入缝隙之中。裂缝的宽度足以吞没整座城市，深度直达地壳深处。炽热的岩浆从裂缝中喷涌而出，在足底的压迫下形成诡异的火焰喷泉。\n\n紧接着是第二道、第三道……\n\n无数条巨大的裂缝如同蛛网般在星球表面蔓延。大陆板块在这难以想象的压力下开始断裂、错位。山脉崩塌，平原下沉，海底隆起。整个星球的地质结构在这温柔且致命的夹击中走向崩溃。\n\n“嘻嘻，这足底被摩擦得痒痒的，真是舒服呢~”\n\n蕾恩娜愉快地说着，轻轻蹭动足底。这个看似温柔的动作，却让星球表面的破坏更加剧烈。足底的摩擦带走了地表的一切——城市、森林、海洋——都在这柔软的肌肤下化为齑粉。\n\n碎片从裂缝中迸溅而出。那些是被挤压出来的地壳碎块、蒸发的海水、以及无数文明的残骸。\n\n蕾恩娜满意地笑着，她的足底继续缓慢而坚定地收紧……
  gts_rainna_la_grande_first_meeting.311.desc: "\"Well now—looks like I've met a worthy challenger~\"\n\nRainna curls her toes in excitement, her whole body trembling slightly with anticipation. Eager light glimmers within her lake-like eyes.\n\n\"Little ones...\"\n\nShe brings her colossal face close to the planet flanked by her soles, a sly, delightful grin spreading across her features. Extending a slender finger, she gently traces it across her smooth sole; that teasing touch sends a subtle shiver through the stocking-clad skin of her sole, as if eagerly awaiting the forthcoming \"game.\"\n\n\"You've certainly managed to pique my interest~\"\n\nMeanwhile, the surface has descended into total turmoil.\n\nMilitary bases across the globe activate simultaneously: missile silos swing open, fighter wings scream into the sky, and laser arrays point straight up. This is the [Owner.GetSpeciesName] civilization's final battle for dignity—even if their foe is an impossibly invincible titan.\n\nCountless missiles trail plumes of fire into the heavens, detonating at the edge of the atmosphere in a frantic bid to halt the advancing soles on either side. Laser beams strike like lances of light against the white silk stockings. Broadside salvos from planetary battleships burst into brilliant flares across the surface of her soles.\n\nYet to Rainna, all of this is...\n\n\"Mmm... such delicate attacks, I can really feel them~\"\n\nShe murmurs softly, her voice filled with satisfied pleasure. Weapons capable of wiping out entire metropolises are nothing more than a soothing massage against her smooth, stocking-clad soles.\n\n\"And this tiny bit of tickling is so comfortable...\"\n\nShe giggles, wiggling her toes slightly to direct more barrages onto the most sensitive spots of her soles. Every blast is like a delightful tickle, making her crave even more \"saturation strikes.\"\n\n\"So in return...\" Her voice suddenly takes a perilous turn, \"I'm going to counterattack~\"\n\nThe two gigantic soles begin to press inward.\n\nThe first parts to make contact with the planetary surface are the edges of her arches. Soft, supple skin wrapped tightly in silk presses gently against the atmosphere, resembling a pair of warm celestial canopies. The instant contact is made, the entire planet reels beneath unbearable pressure.\n\nThe soles continue to descend, making contact with the crust.\n\nThe first to feel the brunt of the force are the largest continents on opposing sides of the world. Tectonic plates crack and buckle under the immense pressure, unleashing deafening rumbles. Oceans are squeezed dry, triggering unprecedented megatsunamis with waves kilometers high sweeping across remaining landmasses.\n\n\"Ara~ looks like this little planet can't hold out much longer...\"\n\nRainna whispers in satisfaction. She can distinctly feel every struggle of the tiny world trapped beneath her soles.\n\nThe soles press even harder.\n\nThe first catastrophic fissure appears on the surface. Blossoming from equatorial oceans, it spreads rapidly like cracks on shattered glass, swallowing entire cities as the earth crumbles beneath them. The chasm is wide enough to engulf whole nations and deep enough to pierce the mantle. Blistering magma erupts from the tear, forming bizarre fountains of fire beneath the crushing pressure of her soles.\n\nThen comes the second fracture, and the third...\n\nCountless gargantuan rifts spread across the globe like a spider's web. Continents shatter and displace under the unimaginable force. Mountains collapse, plains subside, and ocean beds heave upward. The entire geological structure of the planet collapses within this tender yet lethal vice.\n\n\"Heehee, the friction on my soles tickles so delightfully, it feels wonderful~\"\n\nRainna coos happily, gently rubbing her soles against the world. That seemingly gentle caress only accelerates the planetary devastation. The grinding of her soles sweeps away everything on the surface—cities, forests, oceans—all pulverized to dust against her soft skin.\n\nDebris erupts from the fissures: extruded chunks of the planetary crust, vaporized oceans, and the shattered remnants of an entire civilization.\n\nRainna smiles contentedly as her soles continue their slow, unyielding squeeze..."
