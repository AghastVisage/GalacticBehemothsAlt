#  股东分红
  gts_rainna_la_grande_first_meeting.411.title: "Shareholder Dividend"
#  久违的信号再一次接入。\n\n“嘿~我回来咯~”\n\n那个熟悉的声音从通讯器中传来，轻快而亲昵，仿佛只是一位许久未见的老朋友。\n\n“好久不见呀，你们最近过得怎么样？”\n\n她絮絮叨叨地寒暄了几句，随即像是想起了正事，语气变得轻快起来。\n\n“啊对了，我这次来呢，是有好事要告诉你们哦~”\n\n“我最近做的那些‘生意’，赚了不小一笔呢~嘛，说实话，你们当初那点投资其实也没帮上什么忙啦……”她咯咯地笑了几声，“不过约定就是约定嘛，说好了有回报的，我蕾恩娜可是很讲信用的哦~”\n\n“所以呢，这是给你们的分红~”\n\n亮闪闪的金币从太空中缓缓飘落。\n\n然而它们并没有砸向地面，而是在抵达大气层之后，如同被一只无形的手托住一般，静静地悬浮在了星球的上空。那些金光璀璨的硬币铺满了整片天穹，像是一层由黄金织就的云彩，将温柔的金色光辉洒向整颗星球。\n\n“拿去吧，别客气~”她的声音里带着几分真诚的愉悦，“嘛，我宣布，你们是优质客户了哦~”
  gts_rainna_la_grande_first_meeting.411.desc: "A long-awaited signal reconnects once more.\n\n\"Hey~ I'm back~\"\n\nThat familiar voice echoes over the comms, cheerful and intimate, as if from an old friend not seen in years.\n\n\"Long time no see! How have you all been doing lately?\"\n\nShe chatters away with some casual pleasantries before remembering her actual purpose, her tone turning brisk and lively.\n\n\"Oh right! I came this time to share some wonderful news with you~\"\n\n\"Those 'businesses' I ran recently made quite a tidy profit~ Well, honestly speaking, that little investment you gave back then didn't really help much...\" She giggles softly. \"Still, a promise is a promise! Since I promised a return, I, Rainna, always keep my word~\"\n\n\"So here is your dividend~\"\n\nGlittering gold coins drift down gently from space.\n\nYet they do not slam into the ground; upon reaching the atmosphere, as though held by an invisible hand, they come to a halt, floating quietly above the planet. Those radiant coins blanket the heavens like clouds woven of pure gold, bathing the entire world in a gentle golden glow.\n\n\"Go ahead and take them, don't be shy~\" Sincere pleasure rings in her voice. \"Well then, I officially declare you preferred clients~\""
#  通讯频道里，传来了那个久违的声音。是蕾恩娜。\n\n“呐~我又来找你们咯：”\n\n蕾恩娜的语气轻快而熟稔，像是在跟相识多年的伙伴打招呼。\n\n“猜猜我这次带了什么好东西来~”\n\n不等回应，她就自顾自地说了下去，声音里满是藏不住的得意。\n\n“我最近可是赚了一大笔呢~虽然吧，你们当初给的那点投资，说真的没起到什么作用啦……”她轻笑了一声，语气里没有丝毫恶意，反倒像是朋友之间的调侃，“不过嘛，答应过要分红给你们的，我可不会赖账哦~”\n\n“喏，这是你们的那一份，收好啦~”\n\n几话音落下，几枚巨大的金币缓缓从太空中飘来。它华丽而贵重，在星光下泛着温润的金色光泽——只是它的体积，几乎和一片大陆一样大。\n\n然而这枚金币并没有落下。\n\n它轻盈地停在了星球的上空，如同一轮巨大的金色明月，静静地悬浮在那里，为整颗星球投下一片柔和的金辉。地面上的人们仰望着这枚悬在天际的巨型金币，惊叹于它的璀璨与贵重。\n\n“嘿嘿，怎么样，跟我混不错吧？”她的声音里带着几分邀功般的雀跃，“跟着我准没错的~以后那就是我的优质股东，有钱一起赚哦~”
  gts_rainna_la_grande_first_meeting.411_alter.desc: "Across the comm channel, that long-lost voice returns. It is Rainna.\n\n\"Hey~ I came back to visit you again:\"\n\nRainna's tone is breezy and familiar, like greeting a partner she has known for ages.\n\n\"Guess what wonderful things I brought this time~\"\n\nWithout waiting for an answer, she chatters on, unable to hide the smug satisfaction in her voice.\n\n\"I made a huge fortune recently~ Though really, that tiny investment you gave back then didn't actually do much...\" She laughs softly, without a shred of malice, like playful banter between friends. \"Still, I promised you a dividend, and I never welsh on a deal~\"\n\n\"Here, this is your share, take good care of it~\"\n\nAs her words settle, several gargantuan gold coins drift slowly through space. Ornate and precious, they gleam with a warm golden luster under the starlight—except each coin is virtually the size of an entire continent.\n\nYet the gold coin does not crash down.\n\nIt hovers weightlessly above the planet like a colossal golden moon, bathed in tranquil radiance as it casts a soft golden mantle over the world. People on the ground look up at the titanic coin poised in the sky, awestruck by its brilliance and majesty.\n\n\"Hehe, see? Isn't it great to stick with me?\" Her voice is lively and proud, like a kid showing off an achievement. \"You can never go wrong with me~ From now on you're my preferred shareholders; we'll get rich together~\""
#  久违的信号接入了通讯频道。\n\n“呐~我回来咯~”\n\n蕾恩娜的声音里带着几分说不清的意味。\n\n“你们最近过得怎么样呀？嘛，反正也不重要啦~”\n\n她随口敷衍了一句，随即语气一转。\n\n“我这次来呢，是给你们送分红的哦~当初约好了的，我可是很守信用的~”\n\n“喏，接住咯~”\n\n话音落下，几枚闪闪的金币从天而降，如同一场璀璨的金色暴雨，铺天盖地地砸向星球的表面。它们在阳光下折射出耀眼的光芒，看起来价值连城。\n\n然而那些金币的体积……对这颗星球来说，似乎有些太大了。\n\n每一枚坠落的金币都在地表砸出巨大的坑洞，繁华的城市在这场“分红”之下被砸得千疮百孔。\n\n“看着也不怎么多嘛……”蕾恩娜愉快地说着，仿佛完全没有注意到地面上的惨状，“这就是你们当时的投入换来的。”
  gts_rainna_la_grande_first_meeting.411_alter2.desc: "A long-lost transmission connects to the comm channel.\n\n\"Hey~ I'm back~\"\n\nRainna's voice carries an ambiguous, inscrutable tone.\n\n\"How have you all been doing lately? Well, not that it matters anyway~\"\n\nShe brushes off pleasantries casually before switching her tone.\n\n\"I came this time to deliver your dividend~ We made a deal back then, and I'm very faithful to my promises~\"\n\n\"Here, catch!~\"\n\nWith those words, several gleaming gold coins plummet from above like a glittering golden squall, raining down upon the surface. They gleam brilliantly under the sunlight, appearing priceless.\n\nYet the size of those coins... seems a bit too large for this planet.\n\nEach falling coin carves an immense crater into the crust, prosperous cities battered into ruin under this torrential \"dividend.\"\n\n\"Doesn't look like that much after all...\" Rainna comments cheerfully, seemingly blind to the devastation below. \"This is what your original investment bought you.\""
#  信号再一次接入。\n\n“嘿~好久不见呀~”\n\n蕾恩娜的语气轻飘飘的，听不出太多的热情。\n\n“我最近赚了点钱，想起来还欠你们一份分红呢~嘛，说到做到，这是我的原则嘛~”\n\n“所以呢……这是你们的那一份。”\n\n她轻笑了一声，那笑声里藏着几分难以言喻的意味。\n\n一枚巨大的金币缓缓从太空中飘落，在星光下闪烁着诱人的金色光泽。它看起来无比华丽，无比贵重——只是当它逐渐逼近星球时，人们才惊恐地发现，那枚金币的体积，几乎和一片大陆一样大。\n\n金币重重地砸在星球表面，掀起了遮天蔽日的尘埃，整片大陆在这一击之下彻底沉入了地壳。\n\n“嘻嘻，够意思吧~”\n\n蕾恩娜俏皮地说着，语气里满是恶作剧得逞的愉悦。\n\n“下次赚了钱，我还会再来‘照顾’你们的哦~”
  gts_rainna_la_grande_first_meeting.411_alter3.desc: "The signal connects once again.\n\n\"Hey~ long time no see~\"\n\nRainna's tone is airy, without much warmth.\n\n\"I made some money recently, and remembered I still owed you a dividend~ Well, a promise is a promise—that's my principle, after all~\"\n\n\"So... here's your cut.\"\n\nShe chuckles softly, a laugh laden with an indescribable undertone.\n\nA gargantuan gold coin drifts down through space, glinting with an alluring golden sheen under starlight. It looks exquisitely ornate and immensely valuable—yet as it draws near the world, people discover in sheer horror that the coin is nearly the size of a continent.\n\nThe coin strikes the surface with cataclysmic impact, kicking up clouds of dust that blot out the sky; an entire continent sinks completely into the mantle beneath the blow.\n\n\"Heehee, pretty generous of me, right?~\"\n\nRainna says playfully, her voice bursting with mischievous delight.\n\n\"Next time I make a fortune, I'll definitely come back to 'look after' you again~\""
#  哦，我的钱！
  gts_rainna_la_grande_first_meeting.411.a: "Oh, my money!"
#  可是这钱不流通啊……
  gts_rainna_la_grande_first_meeting.411.a_tooltip: "But this currency isn't in circulation..."
#  无事发生？
  gts_rainna_la_grande_first_meeting.2110.title: "Nothing Happened?"
#  “嘛，玩笑罢了~”\n\n蕾恩娜咯咯地笑着，将悬在天空中的巨足缓缓收回。她在太空中调整了一下姿势，将身体侧卧，一手随意地托着脸颊，另一只手的食指在大气层外轻轻划动。\n\n“今天心情不错嘛~所以就不计较了~”\n\n她的手指在云层中漫不经心地画着圈，厚重的云层在她指尖下如同棉花般被随意塑造。转眼是一朵巨大的花，转眼又变成别的什么。她看起来颇为享受这个过程，就像是一个孩子在无聊时随手涂鸦。\n\n“你们也别站在那里发呆嘛~”\n\n她歪着头，用那双湖泊般的眼眸扫了一眼星球表面，语气中带着几分少见的轻快。\n\n“难得我今天高兴，你们也跟着高兴一下嘛~”\n\n她将手指轻轻一弹，云层中那朵刚刚塑造好的巨大花朵瞬间碎散开来，化作漫天的水汽，在阳光下折射出一道横跨天际的彩虹。\n\n“嗯，好看吧~”\n\n她满意地看着那道彩虹，嘴角带着一抹轻松的笑意。这一刻，她看起来不像是一个刚刚将整颗星球玩弄于股掌之间的可怕存在，倒更像是一个心情极好的少女。\n\n“嘛，今天就到这里吧~"她慵懒地伸了个懒腰。
  gts_rainna_la_grande_first_meeting.2110.desc: "\"Well, just a joke~\"\n\nRainna giggles, slowly withdrawing the gigantic foot suspended in the sky. Shifting her posture in the void, she reclines on her side, resting one cheek lazily on her palm while the index finger of her other hand traces lightly outside the atmosphere.\n\n\"I'm in a good mood today~ so I won't hold it against you~\"\n\nHer finger idly sketches circles through the clouds; beneath her touch, dense cloud banks are reshaped effortlessly like cotton candy. One moment they form an enormous flower, the next something else entirely. She seems to thoroughly enjoy the process, like a bored child doodling on a whim.\n\n\"Don't just stand there staring blankly, you know~\"\n\nTilting her head, she sweeps her lake-clear eyes across the surface, her tone carrying a rare breeziness.\n\n\"It's not often I'm this happy, so you should celebrate a bit too~\"\n\nWith a gentle flick of her finger, the giant flower newly sculpted in the clouds instantly disperses into a blanket of vapor, catching the sunlight to paint a rainbow arching across the horizon.\n\n\"Mmm, pretty, isn't it?~\"\n\nShe admires the rainbow with satisfaction, a relaxed smile on her lips. At this moment, she seems less like a terrifying entity who held an entire world in the palm of her hand, and more like a carefree maiden in delightful spirits.\n\n\"Well, that's all for today~\" She stretches lazily."
#  “哈哈哈~只不过是和你们开个小玩笑嘛~”\n\n蕾恩娜的笑声爽朗而清脆，她将巨足轻巧地收回，在太空中翻了个身，舒展地侧卧着，看起来心情极好。\n\n“嘛，今天运气不错嘛，刚好碰上我高兴~”\n\n她托着下巴，带着几分好意地俯视着这颗星球。\n\n“你们这群小家伙，反应还挺有意思的~”她的声音中带着真实的愉悦，“跑来跑去的，看着倒是挺热闹。”\n\n她伸出手指，在大气层外轻轻划了一道弧线。云层随着她的动作缓缓翻涌，最终在天空中形成了一个巨大而柔和的漩涡，将四散的云彩重新聚拢，遮住了正午灼热的阳光，给地面带来了一片难得的阴凉。\n\n她的眼眸在星光下弯成了月牙状，带着几分真实的温和。这种温和让人既感到意外，又隐隐觉得不安——因为所有人都知道，她的心情随时可能改变。
  gts_rainna_la_grande_first_meeting.2110.desc_alter: "\"Hahaha~ it was just a little joke with you all~\"\n\nRainna's laughter is bright and crisp as she nimbly pulls back her giant foot, rolling over in space to recline comfortably on her side, clearly in wonderful spirits.\n\n\"Well, you're quite lucky today—you happened to catch me in a great mood~\"\n\nResting her chin on her hand, she gazes down upon the planet with a touch of benevolence.\n\n\"You little creatures had quite an amusing reaction~\" Real amusement colors her voice. \"Scurrying back and forth, it looked quite lively down there.\"\n\nShe reaches out a finger, tracing a gentle arc just outside the atmosphere. Clouds billow slowly along her movement, eventually coalescing into an immense, soft vortex that gathers scattered mists, shielding the blazing midday sun and bestowing a rare, welcome shade upon the surface.\n\nHer eyes curve into crescents beneath the starlight, filled with genuine gentleness. Yet such warmth brings both surprise and lingering unease—for everyone knows her whims can change at a moment's notice."
#  有一种不好的预感……
  gts_rainna_la_grande_first_meeting.2110.a: "I have a bad feeling about this..."
#  多谢女神的怜悯！
  gts_rainna_la_grande_first_meeting.2110.b: "Thank you for your mercy, Goddess!"
#  你在感谢一个欲降下灾祸者的怜悯吗……
  gts_rainna_la_grande_first_meeting.2110.b_tooltip: "Are you really thanking the mercy of one who sought to bring calamity upon you...?"
#  踏足
  gts_rainna_la_grande_first_meeting.2111.title: "Setting Foot Down"
#  蕾恩娜对这些微弱的请求充耳不闻，又或许是根本没将这颗星球最高领袖的恳求放在眼里。她那巨大的裸足悬停在一片繁华的大陆上方，如同一片活体天幕般遮蔽了大半个陆地。在她的阴影之下，延绵数千公里的城市群顷刻间陷入黑暗，仿佛被按下了静止键。\n\n她顽皮地晃动着修长的足趾，仿佛在展示艺术品般展示着她完美无瑕的足底。那光洁的皮肤上找不到任何陨石碎屑或宇宙尘埃的痕迹，每一寸肌肤都散发着令人心悸的光泽。饱满的足弓没有丝毫瑕疵，晶莹的汗珠静静地凝结在清晰可见的掌纹之中，如同无数颗即将坠落的微型星球，悬在城市群的上空。\n\n她的足尖轻巧地刺破薄如蝉翼的云层，犹如一位舞者般优雅地触碰大陆的边缘。\n\n这看似轻柔的一触，却让整个世界都为之颤抖。大地如同薄纸般撕裂，破碎的地壳裹挟着无数座城市和喷涌而出的炽热岩浆，如同焰火般洒向太空。这微小的接触所产生的震波席卷了整颗星球，就连远在地球另一端的城市也感受到了这毁灭性的余震。她的巨足陷入这个自己制造的巨坑中，足趾顽劣地蹭动着星球表面，如同孩童玩弄沙堆般，将一座座城市化为齑粉。\n\n当她将巨足抬起，足底已然不再如此一尘不染，而是沾满了大量的泥土、岩石以及建筑物的残骸，而曾经无数城市群已然化作充满滚烫熔岩的巨型陨石坑。
  gts_rainna_la_grande_first_meeting.2111.desc: "Rainna turns a deaf ear to these feeble pleas—or perhaps she simply never cared about the begging of this world's supreme leader in the first place. Her colossal bare foot hovers over a prosperous continent, like a living canopy blotting out most of the land. Beneath her shadow, urban clusters stretching thousands of kilometers are plunged instantly into darkness, as if a pause button had been pressed on the world.\n\nShe playfully wiggles her slender toes, displaying her flawless sole like a masterpiece of art. Not a speck of meteoric grit or cosmic dust mars that pristine skin, every inch radiating a heart-stopping glow. Her arched foot is utterly without blemish, glistening droplets of sweat clinging to the clearly defined creases of her sole, hanging above the cities like countless miniature worlds about to fall.\n\nThe tips of her toes gracefully pierce the gossamer veil of clouds, touching the continent's edge with the poise of a dancer.\n\nThat seemingly tender touch, however, sends the entire world reeling in convulsion. The earth tears like tissue paper, shattered crust carrying countless cities and erupting magma bursting into space like fireworks. Shockwaves generated by this minute contact tear through the globe; even cities on the opposite hemisphere feel the cataclysmic tremors. Her giant foot sinks into the crater of her own making, toes rubbing mischievously against the surface like a child playing in a sandbox, grinding metropolises to dust.\n\nWhen she lifts her giant foot, her sole is no longer pristine, now coated with mountains of soil, pulverized stone, and the wreckage of buildings, while what was once a sprawl of great cities has become a colossal crater brimming with scalding magma."
#  蕾恩娜对这些微弱的请求充耳不闻，或是没有意识到这渺小的请求，哪怕它是来自这颗星球的最高领袖。她那巨大的裸足悬停在一片有着巨大的繁华城市的大陆上方，如同一片活体天幕般遮蔽了大半个陆地。在她的阴影之下，这颗星球上最大的城市被黑暗笼罩，顷刻陷入了瘫痪。\n\n她顽皮地晃动着修长的足趾，仿佛在展示艺术品般展示着她完美无瑕的足底。那光洁的皮肤上找不到任何陨石碎屑或宇宙尘埃的痕迹，每一寸肌肤都散发着令人心悸的光泽。饱满的足弓没有丝毫瑕疵，晶莹的汗珠静静地凝结在清晰可见的掌纹之中，如同无数颗即将坠落的微型星球，悬在城市群的上空。\n\n她的足尖轻巧地刺破薄如蝉翼的云层，犹如一位舞者般优雅地触碰大陆的边缘。\n\n这看似轻柔的一触，却让整个世界都为之颤抖。大地如同薄纸般撕裂，破碎的地壳裹挟着无数建筑和喷涌而出的炽热岩浆，如同焰火般洒向太空。这微小的接触所产生的震波席卷了整颗星球，就连远在地球另一端的城市也感受到了这毁灭性的余震。她的巨足陷入这个自己制造的巨坑中，足趾顽劣地蹭动着星球表面，如同孩童玩弄沙堆般，将一座座城市化为齑粉。\n\n当她将巨足抬起，足底已然不再如此一尘不染，而是沾满了大量的泥土、岩石以及建筑物的残骸，而曾经巨大的城市已然被啃食出一个巨大的缺口，化作充满滚烫熔岩的巨型陨石坑，附近的建筑也在强震之下无一幸免，唯有一点点边界的郊区幸存。
  gts_rainna_la_grande_first_meeting.2111_alter.desc: "Rainna turns a deaf ear to these feeble pleas, or perhaps failed to notice such tiny cries even from the supreme ruler of this planet. Her gigantic bare foot hovers over a continent home to magnificent metropolises, like a living canopy eclipsing most of the land. Beneath her shadow, the greatest city on the planet is engulfed in darkness, paralyzed in an instant.\n\nPlayfully wiggling her slender toes, she displays her flawless sole as though presenting a priceless work of art. Not a speck of meteoric debris or cosmic dust taints that radiant skin, every inch exuding a breathtaking luster. Her arch is entirely without flaw, glistening beads of sweat resting within the visible creases of her sole like countless miniature worlds poised to fall over the cityscape.\n\nThe tips of her toes lightly puncture the gossamer clouds, touching the continent's rim with a dancer's grace.\n\nYet this seemingly gentle contact makes the whole world shudder violently. The crust rips open like flimsy paper, the fractured earth spewing countless buildings and boiling magma into the vacuum like fireworks. The seismic waves triggered by this tiny touch rip through the entire globe; even cities on the far side of the planet reel under the devastating shock. Her giant foot sinks into the crater of her own creation, toes rubbing playfully against the crust like a child kicking through sandcastles, reducing city after city to dust.\n\nWhen she lifts her giant foot, her sole is no longer spotless, smeared with soil, pulverized stone, and urban ruins, while the once-grand metropolis has been gouged into a colossal crater overflowing with scalding lava; surrounding structures have collapsed in the violent quake, leaving only a few ragged suburban fringes intact."
#  请息怒！
  gts_rainna_la_grande_first_meeting.2111.a: "Please appease your wrath!"
#  在绝对的力量面前，尊严不过是一文不值的筹码……
  gts_rainna_la_grande_first_meeting.2111.a_tooltip: "Before absolute might, dignity is nothing more than a worthless bargaining chip..."
