#  怎么突然变成这样了？
  gts_rainna_la_grande_arch.09_1_micro.a: "How did it suddenly come to this?"
#  之前的毁灭者回来了？
  gts_rainna_la_grande_arch.09_1_micro.b: "Did the previous destroyer return?"
#  真是丧心病狂啊……
  gts_rainna_la_grande_arch.09_2_micro.a: "Truly sickeningly deranged..."
#  太逆天了，我喜欢。
  gts_rainna_la_grande_arch.09_2_micro.b: "Insanely unhinged. I love it."
#  这主人真是好可怕。
  gts_rainna_la_grande_arch.09_2_micro.c: "This master is truly terrifying."
#  这怎么会变成这样？
  gts_rainna_la_grande_arch.09_3_small.a: "How could things have turned out like this?"
#  看来她的确回来了。
  gts_rainna_la_grande_arch.09_3_small.b: "It seems she truly returned."
#  好相似的求情信……
  gts_rainna_la_grande_arch.09_4_giant.a: "Such eerily similar letters of plea..."
#  闭幕，陨落
  gts_rainna_la_grande_arch.10.name: "Finale, Fall"
#  在处理完前一段反复出现的绝望恳求后，科研团队追踪到了这段极其微弱、几乎被背景噪声完全吞没的最终信号。它像是某个幸存者用尽最后一丝力气，在彻底沉默前留下的最后记录：\n\n“……至此，文明终结……”\n\n信号在此处彻底中断，再无任何后续传输。\n\n科研人员已确认信号已完全消失。
  gts_rainna_la_grande_arch.10_1_micro.desc: "After processing the previous barrage of desperate pleas, the research team tracked down this exceptionally faint terminal transmission, nearly devoured by background noise. It felt like the final record left by a survivor expending their last ounce of strength before eternal silence:\n\n\"...And thus, civilization ends...\"\n\nThe transmission ceased completely here, with no further signal emitted.\n\nThe researchers have confirmed the signal is entirely gone."
#  这段信号的解码过程异常艰难。科研团队最终还原出的文本如下：\n\n“……让娜大人给您下达了最终的命令——针对您的罪行，有期徒刑，一百二十亿年……”\n\n信号在此处出现明显的停顿与频率抖动，随后是长时间的、无声的啜泣，像被极力压抑却无法完全消除。\n\n“……请允许我再陪您一段时间。在我们分离前的最后一段时间……”\n\n科研人员在确认译文后，没有人立刻开口。然而，再也没有任何有用的信息。
  gts_rainna_la_grande_arch.10_2_micro.desc: "Decoding this signal proved exceedingly arduous. The text reconstructed by the team reads as follows:\n\n\"...Lady Jeanne has issued your final sentence—for your crimes, imprisonment for a term of twelve billion years...\"\n\nThe transmission paused here with palpable frequency jitter, followed by long, muffled weeping, held back with desperation yet impossible to fully conceal.\n\n\"...Please allow me to stay with you a little longer. For our final moments together before we part...\"\n\nAfter confirming the translation, none of the researchers spoke. Yet no further useful data could be retrieved."
