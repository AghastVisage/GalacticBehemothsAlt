  gts_rainna_la_grande_first_meeting.216.b_tooltip: "A goddess is always delighted to bestow more miracles!"
#  戳戳
  gts_rainna_la_grande_first_meeting.221.title: "Poke, Poke"
#  “嘿嘿嘿……你们也好哦~嘛，你们一定很期待我的到来吧……”\n\n蕾恩娜咯咯地笑着，像是一个顽皮的孩子。她那巨大的身躯在太空中优雅地漂浮，长发在真空中无重力地飘散，如同一片星云般绚丽。\n\n“你们这群渺小的生命，肯定很期待我降下的恩泽吧~”\n\n她白皙修长的手指在行星上空缓缓伸展，如同一座横亘天际的巨塔。指尖的粉色指甲在阳光下闪烁着微光，映照在大气层上，给整片天空都染上了诡异的粉红色调。\n\n“嗯……选择哪里比较好呢？”\n\n她的手指在大气层外轻轻划动，带起一片片云层的扰动。地面上，人们惊恐地望着天空中那巨大的手指投下的阴影。\n\n紧急避难警报的尖啸声划破天际，在每个街区的广播喇叭中回荡。这原本为了应对自然灾害设计的系统，此刻显得如此苍白而无助。街道上的电子显示屏不断闪烁着红色的警告标识，却没人知道该往哪里逃。\n\n城市陷入一片混乱。中央广场上，一群虔诚的信徒跪倒在地，高举双手祈祷，将这当作神明的显现。他们的祷告声与哭泣声交织在一起，却被周围此起彼伏的尖叫声淹没。街道上，人们争相涌向地铁站和地下避难所，推搡中不时传来哭声与怒骂。更多的人则像是被施了定身咒一般呆立在原地，仰望着天空中那不可思议的巨手，瞳孔中倒映着末日般的景象。\n\n“你们看起来很害怕嘛……不过不用担心啦，我只是想稍微……”\n\n“玩一玩而已啦……”
  gts_rainna_la_grande_first_meeting.221.desc: "\"Hehehe... hello to you too~ Well, you must have been looking forward to my arrival, haven't you...\"\n\nRainna giggles like a naughty child. Her gigantic form floats gracefully in space, long hair billowing weightlessly in the vacuum like a radiant nebula.\n\n\"You tiny beings must be eagerly awaiting the blessings I bring~\"\n\nHer fair, slender finger slowly stretches out above the planet like a titanic tower spanning the horizon. The pink nail on her fingertip shimmers under the sunlight, reflecting off the atmosphere and dyeing the entire sky in an eerie pink hue.\n\n\"Hmm... where should I pick?\"\n\nHer finger traces lightly outside the atmosphere, stirring ripples across the clouds. Below, citizens watch in sheer terror as the enormous shadow of that finger falls upon the land.\n\nThe shriek of emergency evacuation sirens pierces the heavens, reverberating through loudspeakers in every district. A system designed for natural disasters now seems tragically frail and helpless. Electronic display boards along streets flash endless red warnings, yet nobody knows where to flee.\n\nThe city plunges into utter bedlam. In the central plaza, a crowd of devout believers falls to their knees with hands raised in prayer, taking this as a divine visitation. Their prayers and sobs mingle together, only to be swallowed by shrieks from all around. In the streets, people scramble into subway stations and underground bunkers, shouts and wept curses echoing amid the frantic shoving. Many more stand transfixed as if paralyzed, gazing up at that impossible giant hand, their eyes reflecting an apocalyptic sight.\n\n\"You look so scared... but don't worry, I just want to...\"\n\n\"Play around a little bit, that's all...\""
