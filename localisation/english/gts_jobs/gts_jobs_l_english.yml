l_english:
  # 希儿体表寄生虫
  job_gts_civilian_unlimited_seele: "External Parasites in Seele"
  # 希儿体表寄生虫
  job_gts_civilian_unlimited_seele_plural: "External Parasites in Seele"
  # 这些居民生活在希儿身体的各个部位，承担基础服务、日常生产。长久如此已经习惯了寄生的生活与独特的环境,难以在其他星球上生存。\n§I修建区划能够为该岗位提供额外产出§!.§R平民无法通过强制迁移离开希儿!§!
  job_gts_civilian_unlimited_seele_desc: "These residents live in various parts of Seele's body, providing essential services and carrying out daily production. Having lived this way for so long, they have grown accustomed to their parasitic existence and unique environment, making it difficult for them to survive on other planets. \n§I Each constructed district provides additional output for this position. §!.§R Civilians cannot be forcibly relocated from Seele!§!"
  # 产出£trade_value£贸易值，根据国家体型额外产出特殊资源。§I根据修建的区划提供额外产出§!
  job_gts_civilian_unlimited_seele_effect_desc: "Produces £trade_value£ in trade value and additional special resources based on the country's size. §I Provides additional output based on the districts built §!"
