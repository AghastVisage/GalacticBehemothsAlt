#  希儿体表寄生虫
  job_gts_civilian_unlimited_seele: "Seele Surface Parasites"
#  希儿体表寄生虫
  job_gts_civilian_unlimited_seele_plural: "Seele Surface Parasites"
#  这些居民生活在希儿身体的各个部位，承担基础服务、日常生产。长久如此已经习惯了寄生的生活与独特的环境,难以在其他星球上生存。\n§I修建区划能够为该岗位提供额外产出§!.§R平民无法通过强制迁移离开希儿!§!
  job_gts_civilian_unlimited_seele_desc: "These residents live on various parts of Seele's body, handling basic services and daily production. Having lived this way for so long, they have become accustomed to a parasitic life and this unique environment, making it difficult for them to survive on other planets.\\n§IBuilding districts can provide additional output for this job§!.§RCivilians cannot leave Seele through forced resettlement!§!"
#  产出£trade_value£贸易值，根据国家体型额外产出特殊资源。§I根据修建的区划提供额外产出§!
  job_gts_civilian_unlimited_seele_effect_desc: "Produces £trade_value£ Trade Value, and produces additional special resources according to the nation's body size. §IProvides additional output according to built districts§!"
