  gts_bruh_shipgirl_ship_sizes_1_projects_DESC: "On the edge of [event_target:gts_bruh_random_spawn_system_1.GetName], we discovered an area scattered with massive metal cylinders, looking like unexploded super-giant torpedoes."
  #  在[event_target:gts_bruh_random_spawn_system_2.GetName]星系內漂浮著數以萬計的巨大黃銅圓筒，那是比我們最大的太空站還要巨大的彈殼。掃描還发现了一些損毀的艦載機殘骸，被整塊撕裂的小行星。這毫無疑问是一位擁有重火力的戰艦留下的靶場
  gts_bruh_shipgirl_ship_sizes_2_projects_DESC: "Floating within the [event_target:gts_bruh_random_spawn_system_2.GetName] system are tens of thousands of massive brass cylinders, shells larger than our biggest space stations. Scans also revealed some destroyed carrier-based aircraft wreckage and asteroids torn apart in chunks. This is undoubtedly a firing range left by a warship with heavy firepower."
  #  在[event_target:gts_bruh_random_spawn_system_3.GetName]星系內的一顆行星被某種難以想像的利器物理切開，斷面光滑如鏡。更令人恐懼的是，星系中央殘留著大量成分不明的黏稠液體，這些液體包裹著無數被擠壓變形的星球
  gts_bruh_shipgirl_ship_sizes_3_projects_DESC: "A planet in the [event_target:gts_bruh_random_spawn_system_3.GetName] system was physically sliced open by some unimaginable sharp instrument, the cross-section smooth as a mirror. More terrifyingly, a large amount of thick, unknown liquid remains in the center of the system, enveloping countless squeezed and deformed planets."
