  #  重櫻海軍教育
  gts_bruh_shipgirl_combat_computer_1: "Sakura Empire Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習戰鬥精神。在戰鬥中，她們一旦發現敵人就會拔出斬艦刀，高呼著第四天災板載，向敵方發起突擊
  gts_bruh_shipgirl_combat_computer_1_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning combat spirit in naval academy. In battle, they will draw their ship-slaying swords upon spotting enemies, shouting \"Fourth Calamity Banzai!\" and launching an assault."
  #  鐵血海軍教育
  gts_bruh_shipgirl_combat_computer_2: "Iron Blood Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習實戰戰術。在戰鬥中，她們會如幽靈般摸到敵人近處再如群狼般進行襲擊以干擾敵艦指揮，阻滯敵軍前進
  gts_bruh_shipgirl_combat_computer_2_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning practical battle tactics in naval academy. In battle, they will sneak near the enemies like ghosts and then attack like a pack of wolves to disrupt enemy command and hinder the enemy advance."
  #  皇家海軍教育
  gts_bruh_shipgirl_combat_computer_3: "Royal Navy Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習戰鬥藝術。在戰鬥中，充分的教養會使得她們與敵方艦隊在適中的距離下冷靜地進行堂堂正正的戰鬥
  gts_bruh_shipgirl_combat_computer_3_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning the art of combat in naval academy. In battle, their thorough education allows them to calmly engage in fair battles with enemy fleets from a moderate distance."
  #  北聯海軍教育
  gts_bruh_shipgirl_combat_computer_4: "Northern Parliament Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習武器操作。在戰鬥中，深知大就是好、多就是美的艦娘們會在安全距離向敵人大量傾瀉彈藥
  gts_bruh_shipgirl_combat_computer_4_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning weapon operations in naval academy. In battle, knowing that \"big is good, and more is beautiful,\" they will pour large quantities of ammunition on the enemy from a safe distance."
  #  白鷹海軍教育
  gts_bruh_shipgirl_combat_computer_5: "Eagle Union Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習理論革新，在戰鬥中，她們會在超遠距將實驗得出的版本之子直接呼到敵人臉上
  gts_bruh_shipgirl_combat_computer_5_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning theoretical innovation in naval academy. In battle, they will directly deliver the experimental version-defining units onto their enemies' faces from massive distances."
  #  刺激之語
  gts_bruh_shipgirl_arua_4: "Inspirational Words"
  #  §M(Bruh系列光環部件)§!\n當艦娘用她那足以震動整個星系的嗓音發出戰鬥號令時，我方艦隊的每一個成員都能清晰地聽到那充滿力量的聲音在通訊頻道中迴響。她的話語簡潔而有力，直接命中每個戰士心中對勝利的渴望和對榮譽的追求。更重要的是，艦娘的聲音能夠消除戰鬥中的疲勞和恐懼，讓每個船員都保持在最佳的精神狀態下操作武器系統，從而實現持續的高效火力輸出
  gts_bruh_shipgirl_arua_4_DESC: "§M(Bruh Series Aura Component)§!\nWhen the shipgirl issues a battle command with her voice - loud enough to vibrate the entire galaxy - every member of our fleet can clearly hear that powerful sound echoing in the communication channel. Her words are concise and forceful, directly hitting the warriors' desire for victory and pursuit of honor. More importantly, her voice can eliminate fatigue and fear in battle, keeping every sailor at their peak mental state while operating weapon systems, thus achieving sustained high-efficiency firepower output."
  #  引導之目
  gts_bruh_shipgirl_arua_5: "Guiding Sight"
  #  §M(Bruh系列光環部件)§!\n艦娘那雙能夠清晰看穿星雲的巨大眼睛成為了我方艦載機最可靠的指揮中樞。她的視線能夠覆蓋整個戰場，精確捕捉每一架敵機的動向和每一艘敵艦的弱點。當她的目光掃過我方的機群時，飛行員們會立即接收到最優的攻擊路線和目標優先度指令。這種視覺指揮讓我方艦載機的戰術配合達到了近乎完美的程度。飛行員們在艦娘注視下會感到一種強烈的使命感和自信心，他們的反應速度和判斷能力都會得到顯著提升，即使面對數倍於己的敵機也能保持冷靜並執行高難度的機動動作，最終取得壓倒性的空戰優勢
  gts_bruh_shipgirl_arua_5_DESC: "§M(Bruh Series Aura Component)§!\nThe shipgirl's massive eyes, capable of seeing clearly through nebulae, have become the most reliable command hub for our carrier-based aircraft. Her vision covers the entire battlefield, precisely capturing the movements of every enemy aircraft and the weaknesses of every enemy ship. When her gaze sweeps over our squadrons, pilots immediately receive optimal attack routes and target priority commands. This visual command brings our aircraft's tactical coordination to near-perfection. Under her gaze, pilots feel a strong sense of mission and confidence; their reaction speeds and judgment are significantly enhanced, allowing them to remain calm even against superior numbers and perform difficult maneuvers for overwhelming aerial superiority."
  #  §M(Bruh系列裝甲)§!\n經典的深藍色連身泳衣。緊繃的布料完美勾勒出艦娘的身材，不僅大幅提升了轉向時的靈活性，那寫著名字的白布條更是對敵人的一種羞辱。\n§R"你們是被一名在游泳課上的學生給毀滅的"§!
  gts_bruh_shipgirl_armor_component_set_1_DESC: "§M(Bruh Series Armor)§!\nClassic deep blue one-piece swimsuit. The tight fabric perfectly outlines the shipgirl's figure, not only significantly enhancing flexibility during turns, but the white name-strips are a form of humiliation to the enemy.\n§R\"You were destroyed by a student in a swimming class.\"§!"
  #  §M(Bruh系列裝甲)§!\n標誌性的翻領與百褶裙，是青春與活力的象徵。飄揚在星風中的領巾代表著大海的召喚。這套服裝防禦力平平，但絕對能讓敵人死得「心動」。
  gts_bruh_shipgirl_armor_component_set_2_DESC: "§M(Bruh Series Armor)§!\nIconic sailor collar and pleated skirt, symbols of youth and vitality. The neckerchief fluttering in the stellar wind represents the call of the sea. This outfit has mediocre defense but will definitely make the enemy's heart skip a beat before they die."
  #  §M(Bruh系列裝甲)§!\n精緻的頭飾與層層疊疊的裙擺，帶有大量荷葉邊與蕾絲裝飾的黑白配色女僕裝，讓這位巨大的侍者在戰場上顯得優雅而殘酷。穿上它，清理敵方艦隊就變成了一種家務勞動。
  gts_bruh_shipgirl_armor_component_set_3_DESC: "§M(Bruh Series Armor)§!\nExquisite headwear and layered skirts, black-and-white maid outfit with lots of ruffles and lace. This giant servant appears elegant yet cruel on the battlefield. Wearing it, clearing the enemy fleet becomes a form of housework."
  #  §M(Bruh系列裝甲)§!\n筆挺的白色軍官制服，配有飾緒與金色的鈕扣。這套服裝犧牲了部分靈活性，換來了極致的防禦力與威壓感，穿上它的艦娘僅僅是雙手抱胸站立在恆星前，就能展現出統御銀河的霸氣。
  gts_bruh_shipgirl_armor_component_set_4_DESC: "§M(Bruh Series Armor)§!\nSharp white officer uniform with aiguillettes and golden buttons. This outfit sacrifices some flexibility for peak defense and an imposing presence. A shipgirl wearing it, merely standing before a star with arms crossed, exudes the dominance of a galactic ruler."
