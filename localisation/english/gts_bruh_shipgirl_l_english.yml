  #  嗅覺追蹤
  tech_gts_bruh_shipgirl_sensor_3: "Olfactory Tracking"
  #  本能感知
  tech_gts_bruh_shipgirl_sensor_4: "Instinctive Perception"
  #  §M(Bruh系列科技)§!\n透過專門的視力訓練，讓艦娘能夠辨識遙遠星系中的細微異常
  tech_gts_bruh_shipgirl_sensor_1_desc: "§M(Bruh Series Technology)§!\\nUsing specialized vision training, shipgirls are able to identify subtle anomalies in distant star systems."
  #  §M(Bruh系列科技)§!\n在絕對寂靜中訓練聽覺，讓艦娘能捕捉星際介質中傳遞的震波
  tech_gts_bruh_shipgirl_sensor_2_desc: "§M(Bruh Series Technology)§!\\nTraining hearing in absolute silence, shipgirls can capture shockwaves transmitted through the interstellar medium."
  #  §M(Bruh系列科技)§!\n訓練艦娘辨識不同文明飛船獨特的氣味特徵
  tech_gts_bruh_shipgirl_sensor_3_desc: "§M(Bruh Series Technology)§!\\nTraining shipgirls to recognize the unique olfactory signatures of aircraft from different civilizations."
  #  §M(Bruh系列科技)§!\n玄學，但有效。透過冥想與實戰訓練，強化艦娘對危險的直覺預感能力
  tech_gts_bruh_shipgirl_sensor_4_desc: "§M(Bruh Series Technology)§!\\nMetaphysical but effective. Through meditation and combat training, shipgirls' intuitive premonition of danger is enhanced."
  #  $gts_bruh_shipgirl_ship_sizes_1$追蹤：§G+5§!\n$gts_bruh_shipgirl_ship_sizes_2$追蹤：§G+5§!\n$gts_bruh_shipgirl_ship_sizes_3$追蹤：§G+5§!
  tech_gts_bruh_shipgirl_sensor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$Tracking: §G+5§!\\n$gts_bruh_shipgirl_ship_sizes_2$Tracking: §G+5§!\\n$gts_bruh_shipgirl_ship_sizes_3$Tracking: §G+5§!"
  #  $gts_bruh_shipgirl_ship_sizes_1$追蹤
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$Tracking"
  #  $gts_bruh_shipgirl_ship_sizes_1$追蹤
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$Tracking"
  #  $gts_bruh_shipgirl_ship_sizes_1$追蹤
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_tracking_add: "$gts_bruh_shipgirl_ship_sizes_1$Tracking"
  #  流體動力學泳衣
  tech_gts_bruh_shipgirl_armor_1: "Hydrodynamic Swimsuit"
  #  青春氣息激勵學
  tech_gts_bruh_shipgirl_armor_2: "Youthful Inspiration"
  #  制服心理學
  tech_gts_bruh_shipgirl_armor_3: "Uniform Psychology"
  #  儀式感設計
  tech_gts_bruh_shipgirl_armor_4: "Ritualistic Design"
  #  §M(Bruh系列科技)§!\n經過無數次的風洞與流體實驗，我們發現最適合巨娘在星海中高速穿梭的並非厚重的板甲，而是緊緻貼身的高彈性布料。這種設計能最大程度減少與星際塵埃的摩擦，同時展現出艦娘完美的身體曲線
  tech_gts_bruh_shipgirl_armor_1_desc: "§M(Bruh Series Technology)§!\\nAfter countless wind tunnel and fluid experiments, we discovered that what's most suitable for giantesses to navigate at high speeds in the star sea is not thick plate armor, but tight-fitting, highly elastic fabric. This design minimizes friction with interstellar dust while showcasing the perfect body curves of the shipgirls."
  #  §M(Bruh系列科技)§!\n經過社會學家的研究，讓艦娘穿著象徵青春活力的服飾，能有效降低敵人的戒心，同時大幅提升我方觀測人員(以及艦娘本人)的士氣
  tech_gts_bruh_shipgirl_armor_2_desc: "§M(Bruh Series Technology)§!\\nThrough sociological research, having shipgirls wear attire symbolizing youthful vitality can effectively lower the enemy's guard while significantly boosting the morale of our observers (and the shipgirls themselves)."
  #  §M(Bruh系列科技)§!\n研究表明，特定的服裝款式不僅能提供防護，還能極大提升艦娘的自信心，並對敵方小人造成巨大的心理壓力。誰能在幾萬公里的女僕裙襬下保持冷靜呢？
  tech_gts_bruh_shipgirl_armor_3_desc: "§M(Bruh Series Technology)§!\\nResearch indicates that specific clothing styles not only provide protection but also greatly enhance the shipgirl's self-confidence and exert massive psychological pressure on tiny humans. Who can stay calm under a maid's skirt tens of thousands of kilometers long?"
  #  §M(Bruh系列科技)§!\n真正的強者只需要站在那裡就能讓敵人膽寒。筆挺的軍官禮服和厚重的披風能最大程度地襯托出艦娘如神明般的威嚴
  tech_gts_bruh_shipgirl_armor_4_desc: "§M(Bruh Series Technology)§!\\nThe truly powerful only need to stand there to strike fear into their enemies. Precise officer uniforms and heavy capes can showcase the shipgirl's god-like dignity to the greatest extent."
  #  $gts_bruh_shipgirl_ship_sizes_1$裝甲值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$裝甲值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$裝甲值：§G+5%§!
  tech_gts_bruh_shipgirl_armor_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$Armor: §G+5%§!\\n$gts_bruh_shipgirl_ship_sizes_2$Armor: §G+5%§!\\n$gts_bruh_shipgirl_ship_sizes_3$Armor: §G+5%§!"
  #  $gts_bruh_shipgirl_ship_sizes_1$裝甲值
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$Armor"
  #  $gts_bruh_shipgirl_ship_sizes_1$裝甲值
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$Armor"
  #  $gts_bruh_shipgirl_ship_sizes_1$裝甲值
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_armor_mult: "$gts_bruh_shipgirl_ship_sizes_1$Armor"
  #  基礎棉紡織工藝
  tech_gts_bruh_shipgirl_shield_1: "Basic Cotton Textile Process"
  #  視線誘導迷彩
  tech_gts_bruh_shipgirl_shield_2: "Visual-Induced Camouflage"
  #  極限布料張力學
  tech_gts_bruh_shipgirl_shield_3: "Extreme Fabric Tension Dynamics"
  #  極限防禦理論
  tech_gts_bruh_shipgirl_shield_4: "Extreme Defense Theory"
  #  §M(Bruh系列科技)§!\n透過特種合成纖維，我們終於能夠編織出足以覆蓋艦娘龐大身軀的基礎布料。這標誌著我們的艦娘終於不用在太空中裸奔了(雖然有些人對此表示遺憾)\n最柔軟、最透氣的純棉材質能最大程度減少艦娘在太空中長時間作戰的摩擦不適感，保護最私密的區域
  tech_gts_bruh_shipgirl_shield_1_desc: "§M(Bruh Series Technology)§!\\nThrough special synthetic fibers, we are finally able to weave basic fabrics sufficient to cover the massive bodies of shipgirls. This marks the day our shipgirls no longer have to run naked in space (though some expressed regret over this).\\nThe softest, most breathable pure cotton material can minimize friction discomfort during long periods of combat in space, protecting the most private areas."
  #  §M(Bruh系列科技)§!\n透過特定的色彩排列，可以強制吸引觀測者的注意力，造成視覺殘留與精神恍惚。這是一種心理學上的隱形迷彩，敵人會盯著看而忘記開火
  tech_gts_bruh_shipgirl_shield_2_desc: "§M(Bruh Series Technology)§!\\nThrough specific color arrangements, the observer's attention can be forcibly attracted, causing visual persistence and mental trance. This is a form of psychological invisible camouflage; enemies will stare and forget to fire."
  #  §M(Bruh系列科技)§!\n為了實現最大膽的穿著風格，我們必須研發出一種依靠極少接觸面積就能固定在艦娘光滑肌膚上的材料
  tech_gts_bruh_shipgirl_shield_3_desc: "§M(Bruh Series Technology)§!\\nIn order to achieve the boldest of clothing styles, we must develop a material that can be fixed on the shipgirl's smooth skin with minimal contact area."
  #  §M(Bruh系列科技)§!\n防禦的最高境界就是「幾乎沒有防禦」。透過極致的削減覆蓋面積，以此羞恥感轉化為腎上腺素與極致的閃避本能。這需要艦娘擁有極高的自信
  tech_gts_bruh_shipgirl_shield_4_desc: "§M(Bruh Series Technology)§!\\nThe highest realm of defense is \"almost no defense.\" Through the extreme reduction of coverage area, shame is converted into adrenaline and peak evasion instincts. This requires the shipgirl to have extremely high self-confidence."
  #  $gts_bruh_shipgirl_ship_sizes_1$護盾承受值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_2$護盾承受值：§G+5%§!\n$gts_bruh_shipgirl_ship_sizes_3$護盾承受值：§G+5%§!
  tech_gts_bruh_shipgirl_shield_1_effect: "$gts_bruh_shipgirl_ship_sizes_1$Shield Strength: §G+5%§!\\n$gts_bruh_shipgirl_ship_sizes_2$Shield Strength: §G+5%§!\\n$gts_bruh_shipgirl_ship_sizes_3$Shield Strength: §G+5%§!"
  #  $gts_bruh_shipgirl_ship_sizes_1$護盾承受值
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_1_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$Shield Strength"
  #  $gts_bruh_shipgirl_ship_sizes_1$護盾承受值
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_2_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$Shield Strength"
  #  $gts_bruh_shipgirl_ship_sizes_1$護盾承受值
  mod_shipsize_gts_bruh_shipgirl_ship_sizes_3_shield_mult: "$gts_bruh_shipgirl_ship_sizes_1$Shield Strength"
  #  表皮維護協議
  tech_gts_bruh_shipgirl_aux_1: "Epidermal Maintenance Protocol"
  #  光能捕獲陣列
  tech_gts_bruh_shipgirl_aux_2: "Light-Energy Capture Array"
  #  巨體流體力學
  tech_gts_bruh_shipgirl_aux_3: "Giant-Body Fluid Dynamics"
  #  衛生管理條例
  tech_gts_bruh_shipgirl_aux_4: "Hygiene Management Regulations"
  #  資源開採許可
  tech_gts_bruh_shipgirl_aux_5: "Resource Extraction Permit"
  #  §M(Bruh系列科技)§!\n與其讓小人軍隊在星球上無所事事，不如讓它們搬到艦娘的身上居住。我們訓練了一批專業的工程師與清潔工，在艦娘的毛孔與衣物纖維間建立微型殖民地
  tech_gts_bruh_shipgirl_aux_1_desc: "§M(Bruh Series Technology)§!\\nInstead of letting tiny human armies idle on planets, it's better to let them move onto the shipgirls' bodies. We have trained a group of professional engineers and cleaners to establish micro-colonies within the shipgirls' pores and clothing fibers."
  #  §M(Bruh系列科技)§!\n既然艦娘總是喜歡躺在恆星附近「曬日光浴」，我們為什麼不利用這一點呢？通過在她受光面積最大的背部與肩部太陽能板，我們能為她身上的小人設施提供源源不斷的清潔能源，甚至能反向為艦娘的護盾充能
  tech_gts_bruh_shipgirl_aux_2_desc: "§M(Bruh Series Technology)§!\\nSince shipgirls always love to take \"sunbaths\" near stars, why not take advantage of this? By installing solar panels on their backs and shoulders—the areas with the largest light exposure—we can provide a steady stream of clean energy for the tiny human facilities on their bodies, and even reverse-charge the shipgirls' shields."
  #  §M(Bruh系列科技)§!\n艦娘在激戰中分泌的汗液對我們來說無異於一場突發的特大洪水。為了防止重要的維護設施被帶有費洛蒙的鹽水沖毀，我們必須在她汗腺密集的區域，特別是足底和腋下，建立複雜的排水與循環系統
  tech_gts_bruh_shipgirl_aux_3_desc: "§M(Bruh Series Technology)§!\\nThe sweat secreted by shipgirls during intense battles is nothing short of a sudden major flood to us. To prevent important maintenance facilities from being washed away by pheromone-laden saltwater, we must establish complex drainage and circulation systems in areas where her sweat glands are dense, especially the soles of her feet and underarms."
  #  §M(Bruh系列科技)§!\n在艦娘最私密、最潮濕的深谷中，沉積著大量的新陳代謝產物。如果不加理會，這些沉積物會影響艦娘的健康與心情。我們需要一支視死如歸的清潔部隊，深入這片高溫高濕的禁區
  tech_gts_bruh_shipgirl_aux_4_desc: "§M(Bruh Series Technology)§!\\nIn the most private and humid valleys of the shipgirls, a large amount of metabolic products accumulate. If left unaddressed, these deposits can affect the shipgirl's health and mood. We need a squad of cleaning troops ready to sacrifice themselves to venture deep into this high-temperature, high-humidity forbidden zone."
  #  §M(Bruh系列科技)§!\n在獲得了艦娘本人的羞澀點頭(以及簽署了無數份一旦因過度刺激導致誤傷則後果自負的免責聲明)後，我們終於可以在那粉色的高原邊緣建立自動化站點，採集那些乾涸的乳垢和皮屑礦物
  tech_gts_bruh_shipgirl_aux_5_desc: "§M(Bruh Series Technology)§!\\nAfter obtaining a shy nod from the shipgirl herself (and signing numerous waivers stating that any accidental injuries caused by over-stimulation are at one's own risk), we can finally establish automated stations on the edge of those pink plateaus to collect dried milk residue and skin dander minerals."
  #  艦娘魚雷
  gts_bruh_shipgirl_torpedo_component_set_1: "Shipgirl Torpedo"
  #  §M(Bruh系列武器)§!\n體積相當於小人戰列艦的巨型魚雷。雖然缺乏精密電子元件，但內部裝填了極不穩定的高能炸藥。它們依靠艦娘的投擲力道或原始推進器飛向目標，一旦命中，其當量足以在敵方主宰上製造出一個可以停泊戰列艦的洞
  gts_bruh_shipgirl_torpedo_component_set_1_DESC: "§M(Bruh Series Weapon)§!\\nGiant torpedoes the size of tiny human battleships. Although they lack sophisticated electronic components, they are filled with extremely unstable high-energy explosives. They rely on the shipgirl's throwing force or primitive thrusters to fly toward the target; once they hit, their yield is enough to create a hole in an enemy juggernaut large enough to dock a battleship."
  #  小型艦娘魚雷
  gts_bruh_shipgirl_torpedo_1_S: "Small Shipgirl Torpedo"
  #  中型艦娘魚雷
  gts_bruh_shipgirl_torpedo_1_M: "Medium Shipgirl Torpedo"
  #  大型艦娘魚雷
  gts_bruh_shipgirl_torpedo_1_L: "Large Shipgirl Torpedo"
  #  艦娘動能副炮
  gts_bruh_shipgirl_kinetic_artillery_component_set_1: "Shipgirl Kinetic Secondary"
  #  驅逐艦娘動能主炮
  gts_bruh_shipgirl_kinetic_artillery_component_set_2: "Destroyer Shipgirl Kinetic Main Gun"
  #  艦娘動能主炮
  gts_bruh_shipgirl_kinetic_artillery_component_set_3: "Shipgirl Kinetic Main Gun"
  #  §M(Bruh系列武器)§!\n裝備在艦娘舾裝兩側或手持的中口徑實彈火炮。雖然被稱為"副炮"，但射出的每一發炮彈都相當於一座摩天大樓。依靠化學能推進的彈頭雖然原始，但憑藉單純的質量與動能，足以將任何膽敢靠近的小人艦船砸成廢鐵。這些副炮能提供穩定而持續的火力輸出
  gts_bruh_shipgirl_kinetic_artillery_component_set_1_DESC: "§M(Bruh Series Weapon)§!\nMedium-caliber solid-shot artillery equipped on either side of the shipgirl's rigging or handheld. Though called \"secondary guns,\" every shell fired is equivalent to a skyscraper. Although these warheads propelled by chemical energy are primitive, they rely on pure mass and kinetic energy to smash any approaching tiny human ships into junk. These secondary guns provide stable and continuous firepower."
  #  這是一門為「貼臉輸出」而生的截短型動能主炮，專為$gts_bruh_shipgirl_ship_sizes_1$訂製。雖然口徑驚人，但為了適應$gts_bruh_shipgirl_ship_sizes_1$的作戰風格，我們鋸短了砲管並移為了部分穩定器。這使得該武器在遠距離散佈感人，但在貼臉狗鬥的距離上，它能以驚人的射速將砲彈直接塞進敵人的艦橋裡。\n§Y"為了這一發，我可是衝到了能看清小人驚恐表情的距離啊！"§!
  #  這是一門為「貼臉輸出」而生的截短型動能主炮，專為$gts_bruh_shipgirl_ship_sizes_1$訂製。雖然口徑驚人，但為了適應$gts_bruh_shipgirl_ship_sizes_1$的作戰風格，我們鋸短了砲管並移除了部分穩定器。這使得該武器在遠距離散布感人，但在貼臉狗斗的距離上，它能以驚人的射速將砲彈直接塞進敵人的艦橋裡。\n§Y"為了這一發，我可是衝到了能看清小人驚恐表情的距離啊！"§!
#  這是一門為「貼臉輸出」而生的截短型動能主炮，專為$gts_bruh_shipgirl_ship_sizes_1$訂製。雖然口徑驚人，但為了適應$gts_bruh_shipgirl_ship_sizes_1$的作戰風格，我們鋸短了砲管並移除了部分穩定器。這使得該武器在遠距離散布感人，但在貼臉狗斗的距離上，它能以驚人的射速將砲彈直接塞進敵人的艦橋裡。\n§Y"為了這一發，我可是衝到了能看清小人驚恐表情的距離啊！"§!
  gts_bruh_shipgirl_kinetic_artillery_component_set_2_DESC: "This is a snub-nosed kinetic main gun born for 'point-blank output', specifically customized for $gts_bruh_shipgirl_ship_sizes_1$. Although its caliber is staggering, to adapt to $gts_bruh_shipgirl_ship_sizes_1$'s combat style, we sawed off the barrel and removed some stabilizers. This makes the weapon's spread at long range laughably bad, but at point-blank dogfighting distances, it can fire at an astonishing rate, stuffing shells directly into the enemy's bridge.\\n§Y\"For this one shot, I charged into a range where I could see the tiny people's terrified expressions!\"§!"
  gts_bruh_shipgirl_kinetic_artillery_component_set_3_DESC: "§M(Bruh Series Weapon)§!\\nIn the shipgirl's arsenal, this isn't just a gun; it's a deterrent. Each shot's recoil can push away nearby asteroids, and the ultra-heavy armor-piercing shells fired carry enough kinetic energy to penetrate a planet's crust. This is the violent aesthetic of pure physical laws, no frills, only destruction."
  #  小型艦娘動能副炮
  gts_bruh_shipgirl_kinetic_artillery_1_S: "Small Shipgirl Kinetic Secondary"
  #  中型艦娘動能副炮
  gts_bruh_shipgirl_kinetic_artillery_1_M: "Medium Shipgirl Kinetic Secondary"
  #  大型艦娘動能副炮
  gts_bruh_shipgirl_kinetic_artillery_1_L: "Large Shipgirl Kinetic Secondary"
  #  驅逐艦娘動能主炮
  gts_bruh_shipgirl_kinetic_artillery_2_L: "Destroyer Shipgirl Kinetic Main Gun"
  #  巨型艦娘動能主炮
  gts_bruh_shipgirl_kinetic_artillery_1_X: "Giant Shipgirl Kinetic Main Gun"
  #  艦娘斬艦刀
  gts_bruh_shipgirl_kinetic_sword_component_set_1: "Shipgirl Ship-Slaying Blade"
  #  §M(Bruh系列武器)§!\n一把樸實無華、長度驚人的實體巨劍。沒有任何能量力場，也不需要充能。它唯一的優點就是硬和重。當艦娘揮舞它時，僅僅是劍身帶動的引力波就能扯碎周圍的小型戰機，而被鋒刃直接命中的主力艦，會像切蛋糕一樣被物理截斷
  gts_bruh_shipgirl_kinetic_sword_component_set_1_DESC: "§M(Bruh Series Weapon)§!\\nA simple, unadorned solid giant sword of incredible length. It has no energy field and requires no charging. Its only advantages are hardness and weight. When a shipgirl swings it, the gravity waves generated by the blade alone can rip apart nearby small fighters, and a capital ship directly hit by its edge will be physically cut through like a cake."
  #  艦娘斬艦刀
  gts_bruh_shipgirl_kinetic_sword_1_T: "Shipgirl Ship-Slaying Blade"
  #  三連裝點防禦
  gts_bruh_shipgirl_point_defence_component_set_1: "Triple Point Defense"
  #  §M(Bruh系列武器)§!\n安裝在艦娘舾裝的小型自動火炮系統。擁有極高的射速和靈活的轉向能力。雖然對大船傷害有限，但用來在其形成的彈幕網中粉碎敵方的導彈和艦載機綽綽有餘
  gts_bruh_shipgirl_point_defence_component_set_1_DESC: "§M(Bruh Series Weapon)§!\\nA small automatic artillery system installed on shipgirl's rigging. It has an extremely high rate of fire and flexible turning capabilities. Although its damage to larger ships is limited, it is more than sufficient to crush enemy missiles and carrier-based aircraft within its barrage net."
  #  小型三連裝點防禦
  gts_bruh_shipgirl_point_defence_S: "Small Triple Point Defense"
  #  中型三連裝點防禦
  gts_bruh_shipgirl_point_defence_M: "Medium Triple Point Defense"
  #  大型三連裝點防禦
  gts_bruh_shipgirl_point_defence_L: "Large Triple Point Defense"
  #  三連裝高射炮
  gts_bruh_shipgirl_flak_battery_component_set_1: "Triple Flak Battery"
  #  §M(Bruh系列武器)§!\n專門發射定時引信榴霰彈的火炮。炮彈在預定距離炸裂，釋放出數以萬計的高速鋼珠。對於脆弱的攻擊機群來說，這就是一場無法躲避的金屬暴雨，能瞬間清空一片空域
  gts_bruh_shipgirl_flak_battery_component_set_1_DESC: "§M(Bruh Series Weapon)§!\\nArtillery specifically designed to fire timed-fuse shrapnel shells. The shell detonates at a predetermined distance, releasing tens of thousands of high-speed steel balls. For fragile attack squadrons, this is an unavoidable metallic rainstorm that can instantly clear an area of airspace."
  #  小型三連裝高射炮
  gts_bruh_shipgirl_flak_battery_S: "Small Triple Flak Battery"
  #  中型三連裝高射炮
  gts_bruh_shipgirl_flak_battery_M: "Medium Triple Flak Battery"
  #  大型三連裝高射炮
  gts_bruh_shipgirl_flak_battery_L: "Large Triple Flak Battery"
  #  海火
  gts_bruh_shipgirl_strike_craft_hangar_component_set_1: "Seafire"
  #  地獄貓
  gts_bruh_shipgirl_strike_craft_hangar_component_set_2: "Hellcat"
  #  Pe-8
  gts_bruh_shipgirl_strike_craft_hangar_component_set_3: "Pe-8"
  #  海火
  gts_bruh_shipgirl_strike_craft_hangar_1: "Seafire"
  #  地獄貓
  gts_bruh_shipgirl_strike_craft_hangar_2: "Hellcat"
  #  Pe-8
  gts_bruh_shipgirl_strike_craft_hangar_3: "Pe-8"
  #  艦娘超光速部件
  gts_bruh_shipgirl_ftl_components_DESC: "Shipgirl FTL Component"
  #  艦娘感測器
  gts_bruh_shipgirl_sensor_components_DESC: "Shipgirl Sensor"
  #  §M(Bruh系列核心元件)§!\n透過基礎的飲食訓練，艦娘能夠有效維持龐大身軀的日常活動所需
  gts_bruh_shipgirl_reactor_component_template_1_DESC: "§M(Bruh Series Core Component)§!\\nThrough basic dietary training, shipgirls are able to effectively maintain the daily activity needs of their massive bodies."
  #  §M(Bruh系列核心元件)§!\n飢餓訓練讓艦娘學會在長時間缺乏補給的情況下仍能保持戰鬥力
  gts_bruh_shipgirl_reactor_component_template_2_DESC: "§M(Bruh Series Core Component)§!\\nHunger training teaches shipgirls how to maintain combat effectiveness even during long periods without supplies."
  #  §M(Bruh系列核心元件)§!\n極限訓練後的艦娘消化系統能夠快速分解各種物質並轉化為能量
  gts_bruh_shipgirl_reactor_component_template_3_DESC: "§M(Bruh Series Core Component)§!\\nAfter extreme training, shipgirls' digestive systems can rapidly break down various substances and convert them into energy."
  #  §M(Bruh系列核心元件)§!\n經過最終訓練的艦娘能將天體直接作為食物消化吸收
  gts_bruh_shipgirl_reactor_component_template_4_DESC: "§M(Bruh Series Core Component)§!\\nAfter final training, shipgirls can directly digest and absorb celestial bodies as food."
  #  基礎跳躍
  gts_bruh_shipgirl_drive_component_template_1: "Basic Jump"
  #  蹬踏爆發
  gts_bruh_shipgirl_drive_component_template_2: "Step Burst"
  #  星海躍進
  gts_bruh_shipgirl_drive_component_template_3: "Starsea Leap"
  #  瞬息千里
  gts_bruh_shipgirl_drive_component_template_4: "Instant Mile"
  #  §M(Bruh系列核心元件)§!\n艦娘透過基礎訓練掌握的跳躍能力，能夠進行星系間的移動
  gts_bruh_shipgirl_drive_component_template_1_DESC: "§M(Bruh Series Core Component)§!\\nThe jump capability mastered by shipgirls through basic training enables them to move between systems."
  #  §M(Bruh系列核心元件)§!\n強化後的腿部爆發力讓艦娘能以天體為踏板進行更遠的跳躍
  gts_bruh_shipgirl_drive_component_template_2_DESC: "§M(Bruh Series Core Component)§!\\nEnhanced leg explosive power allows shipgirls to use celestial bodies as springboards for farther jumps."
  #  §M(Bruh系列核心元件)§!\n精密訓練後的艦娘能夠精確控制跳躍方向與落點
  gts_bruh_shipgirl_drive_component_template_3_DESC: "§M(Bruh Series Core Component)§!\\nAfter precision training, shipgirls can accurately control jump direction and landing points."
  #  §M(Bruh系列核心元件)§!\n最高階訓練讓艦娘的移動速度達到近乎瞬移的境界
  gts_bruh_shipgirl_drive_component_template_4_DESC: "§M(Bruh Series Core Component)§!\\nTop-tier training allows shipgirls' movement speed to reach a near-teleportation state."
  #  §M(Bruh系列核心元件)§!\n輕便鞋具讓艦娘能夠全力奔跑而不受傷
  gts_bruh_shipgirl_thruster_component_template_3_DESC: "§M(Bruh Series Core Component)§!\nLightweight footwear allows shipgirls to run at full speed without injury."
  #  §M(Bruh系列核心元件)§!\n厚重軍靴讓艦娘的每一步都帶有毀滅性的衝擊
  gts_bruh_shipgirl_thruster_component_template_4_DESC: "§M(Bruh Series Core Component)§!\nHeavy combat boots make every step of a shipgirl carry a devastating impact."
  #  視力強化
  gts_bruh_shipgirl_sensor_component_template_1: "Visual Enhancement"
  #  聽覺訓練
  gts_bruh_shipgirl_sensor_component_template_2: "Hearing Training"
  #  嗅覺追蹤
  gts_bruh_shipgirl_sensor_component_template_3: "Olfactory Tracking"
  #  本能感知
  gts_bruh_shipgirl_sensor_component_template_4: "Instinctive Perception"
  #  §M(Bruh系列核心元件)§!\n強化後的視力讓艦娘能夠看清光年外的目標
  gts_bruh_shipgirl_sensor_component_template_1_DESC: "§M(Bruh Series Core Component)§!\nEnhanced vision allows shipgirls to see targets light-years away."
  #  §M(Bruh系列核心元件)§!\n艦娘豎起耳朵(或者轉動獸耳)，捕捉太空中不自然的波動。
  gts_bruh_shipgirl_sensor_component_template_2_DESC: "§M(Bruh Series Core Component)§!\nShipgirls perk up their ears (or rotate their animal ears) to capture unnatural fluctuations in space."
  #  §M(Bruh系列核心元件)§!\n敏銳的嗅覺能追蹤敵艦殘留的氣味軌跡
  gts_bruh_shipgirl_sensor_component_template_3_DESC: "§M(Bruh Series Core Component)§!\nA keen sense of smell can track the lingering scent trails of enemy ships."
  #  §M(Bruh系列核心元件)§!\n"我覺得那邊有人"艦娘指著一片空曠的黑暗說道。事實證明，她總是對的。本能般的感知讓艦娘能預判敵人的位置
  gts_bruh_shipgirl_sensor_component_template_4_DESC: "§M(Bruh Series Core Component)§!\n\"I feel someone over there,\" the shipgirl said, pointing into a vast expanse of darkness. It turns out she's always right. Instinctual perception allows shipgirls to predict enemy positions."
  #  真的太陽能板
  gts_bruh_shipgirl_aux_component_set_2: "Real Solar Panel"
  #  §M(Bruh系列輔助配件)§!\n這不是比喻。這是一塊物理意義上、面積相當於一片大陸的巨大太陽能板。\n§Y"不是那種小人屋頂上的那種玩具......"§!
  gts_bruh_shipgirl_aux_component_set_2_DESC: "§M(Bruh Series Auxiliary Accessory)§!\nThis is not a metaphor. This is a massive solar panel, physically the size of a continent.\\n§Y\"Not like those toys on the roofs of tiny houses...\"§!"
  #  體表損管小隊
  gts_bruh_shipgirl_aux_component_template_1: "Body Surface Damage Control Squad"
  #  真的太陽能板
  gts_bruh_shipgirl_aux_component_template_2: "Real Solar Panel"
  #  足汗循環系統
  gts_bruh_shipgirl_aux_component_template_3: "Foot Sweat Circulation System"
  #  陰垢清理都市
  gts_bruh_shipgirl_aux_component_template_4: "Hygiene Cleaning City"
  #  乳暈採集平台
  gts_bruh_shipgirl_aux_component_template_5: "Areola Collection Platform"
  #  重櫻海軍教育
  gts_bruh_shipgirl_combat_computer_1: "Sakura Empire Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習戰鬥精神。在戰鬥中，她們一旦發現敵人就會拔出斬艦刀，高呼著第四天災板載，向敵方發起突擊
  gts_bruh_shipgirl_combat_computer_1_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning combat spirit in naval academy. In battle, they will draw their ship-slaying swords upon spotting enemies, shouting \"Fourth Calamity Banzai!\" and launching an assault."
  #  鐵血海軍教育
  gts_bruh_shipgirl_combat_computer_2: "Iron Blood Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習實戰戰術。在戰鬥中，她們會如幽靈般摸到敵人近處再如群狼般進行襲擊以干擾敵艦指揮，阻滯敵軍前進
  gts_bruh_shipgirl_combat_computer_2_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning practical battle tactics in naval academy. In battle, they will sneak near the enemies like ghosts and then attack like a pack of wolves to disrupt enemy command and hinder the enemy advance."
  #  皇家海軍教育
  gts_bruh_shipgirl_combat_computer_3: "Royal Navy Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習戰鬥藝術。在戰鬥中，充分的教養會使得她們與敵方艦隊在適中的距離下冷靜地進行堂堂正正的戰鬥
  gts_bruh_shipgirl_combat_computer_3_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning the art of combat in naval academy. In battle, their thorough education allows them to calmly engage in fair battles with enemy fleets from a moderate distance."
  #  北聯海軍教育
  gts_bruh_shipgirl_combat_computer_4: "Northern Parliament Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習武器操作。在戰鬥中，深知大就是好、多就是美的艦娘們會在安全距離向敵人大量傾瀉彈藥
  gts_bruh_shipgirl_combat_computer_4_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning weapon operations in naval academy. In battle, knowing that \"big is good, and more is beautiful,\" they will pour large quantities of ammunition on the enemy from a safe distance."
  #  白鷹海軍教育
  gts_bruh_shipgirl_combat_computer_5: "Eagle Union Naval Education"
  #  §M(Bruh系列武器)§!\n我們的艦娘在海軍學校重點學習理論革新，在戰鬥中，她們會在超遠距將實驗得出的版本之子直接呼到敵人臉上
  gts_bruh_shipgirl_combat_computer_5_DESC: "§M(Bruh Series Weapon)§!\nOur shipgirls focus on learning theoretical innovation in naval academy. In battle, they will directly deliver the experimental version-defining units onto their enemies' faces from massive distances."
  #  刺激之語
  gts_bruh_shipgirl_arua_4: "Inspirational Words"
  #  §M(Bruh系列光環部件)§!\n當艦娘用她那足以震動整個星系的嗓音發出戰鬥號令時，我方艦隊的每一個成員都能清晰地聽到那充滿力量的聲音在通訊頻道中迴響。她的話語簡潔而有力，直接命中每個戰士心中對勝利的渴望和對榮譽的追求。更重要的是，艦娘的聲音能夠消除戰鬥中的疲勞和恐懼，讓每個船員都保持在最佳的精神狀態下操作武器系統，從而實現持續的高效火力輸出
  gts_bruh_shipgirl_arua_4_DESC: "§M(Bruh Series Aura Component)§!\nWhen the shipgirl issues a battle command with her voice—loud enough to vibrate the entire galaxy—every member of our fleet can clearly hear that powerful sound echoing in the communication channel. Her words are concise and forceful, directly hitting the warriors' desire for victory and pursuit of honor. More importantly, her voice can eliminate fatigue and fear in battle, keeping every sailor at their peak mental state while operating weapon systems, thus achieving sustained high-efficiency firepower output."
  #  引導之目
  gts_bruh_shipgirl_arua_5: "Guiding Sight"
  #  §M(Bruh系列光環部件)§!\n艦娘那雙能夠清晰看穿星雲的巨大眼睛成為了我方艦載機最可靠的指揮中樞。她的視線能夠覆蓋整個戰場，精確捕捉每一架敵機的動向和每一艘敵艦的弱點。當她的目光掃過我方的機群時，飛行員們會立即接收到最優的攻擊路線和目標優先度指令。這種視覺指揮讓我方艦載機的戰術配合達到了近乎完美的程度。飛行員們在艦娘注視下會感到一種強烈的使命感和自信心，他們的反應速度和判斷能力都會得到顯著提升，即使面對數倍於己的敵機也能保持冷靜並執行高難度的機動動作，最終取得壓倒性的空戰優勢
  gts_bruh_shipgirl_arua_5_DESC: "§M(Bruh Series Aura Component)§!\nThe shipgirl's massive eyes, capable of seeing clearly through nebulae, have become the most reliable command hub for our carrier-based aircraft. Her vision covers the entire battlefield, precisely capturing the movements of every enemy aircraft and the weaknesses of every enemy ship. When her gaze sweeps over our squadrons, pilots immediately receive optimal attack routes and target priority commands. This visual command brings our aircraft's tactical coordination to near-perfection. Under her gaze, pilots feel a strong sense of mission and confidence; their reaction speeds and judgment are significantly enhanced, allowing them to remain calm even against superior numbers and perform difficult maneuvers for overwhelming aerial superiority."
  #  §M(Bruh系列裝甲)§!\n經典的深藍色連身泳衣。緊繃的布料完美勾勒出艦娘的身材，不僅大幅提升了轉向時的靈活性，那寫著名字的白布條更是對敵人的一種羞辱。\n§R"你們是被一名在游泳課上的學生給毀滅的"§!
  gts_bruh_shipgirl_armor_component_set_1_DESC: "§M(Bruh Series Armor)§!\nClassic deep blue one-piece swimsuit. The tight fabric perfectly outlines the shipgirl's figure, not only significantly enhancing flexibility during turns, but the white name-strips are a form of humiliation to the enemy.\\n§R\"You were destroyed by a student in a swimming class.\"§!"
  #  §M(Bruh系列裝甲)§!\n標誌性的翻領與百褶裙，是青春與活力的象徵。飄揚在星風中的領巾代表著大海的召喚。這套服裝防禦力平平，但絕對能讓敵人死得「心動」。
  gts_bruh_shipgirl_armor_component_set_2_DESC: "§M(Bruh Series Armor)§!\nIconic sailor collar and pleated skirt, symbols of youth and vitality. The neckerchief fluttering in the stellar wind represents the call of the sea. This outfit has mediocre defense but will definitely make the enemy's heart skip a beat before they die."
  #  §M(Bruh系列裝甲)§!\n精緻的頭飾與層層疊疊的裙擺，帶有大量荷葉邊與蕾絲裝飾的黑白配色女僕裝，讓這位巨大的侍者在戰場上顯得優雅而殘酷。穿上它，清理敵方艦隊就變成了一種家務勞動。
  #  §M(Bruh系列裝甲)§!\n精緻的頭飾與層層疊疊的裙襬，帶有大量荷葉邊與蕾絲裝飾的黑白配色女僕裝，讓這位巨大的侍者在戰場上顯得優雅而殘酷。穿上它，清理敵方艦隊就變成了一種家務勞動。
#  §M(Bruh系列裝甲)§!\n精緻的頭飾與層層疊疊的裙襬，帶有大量荷葉邊與蕾絲裝飾的黑白配色女僕裝，讓這位巨大的侍者在戰場上顯得優雅而殘酷。穿上它，清理敵方艦隊就變成了一種家務勞動。
  gts_bruh_shipgirl_armor_component_set_3_DESC: "§M(Bruh Series Armor)§!\\nExquisite headwear and layered skirts, black-and-white maid outfit with lots of ruffles and lace. This giant servant appears elegant yet cruel on the battlefield. Wearing it, clearing the enemy fleet becomes a form of housework."
  gts_bruh_shipgirl_armor_component_set_4_DESC: "§M(Bruh Series Armor)§!\nSharp white officer uniform with aiguillettes and golden buttons. This outfit sacrifices some flexibility for peak defense and an imposing presence. A shipgirl wearing it, merely standing before a star with arms crossed, exudes the dominance of a galactic ruler."
  #  小號死庫水
  gts_bruh_shipgirl_armor_component_template_1_S: "Small Sukumizu"
  #  中號死庫水
  gts_bruh_shipgirl_armor_component_template_1_M: "Medium Sukumizu"
  #  大號死庫水
  gts_bruh_shipgirl_armor_component_template_1_L: "Large Sukumizu"
  #  小號水手服
  gts_bruh_shipgirl_armor_component_template_2_S: "Small Sailor Uniform"
  #  中號水手服
  gts_bruh_shipgirl_armor_component_template_2_M: "Medium Sailor Uniform"
  #  大號水手服
  gts_bruh_shipgirl_armor_component_template_2_L: "Large Sailor Uniform"
  #  小號女僕裝
  gts_bruh_shipgirl_armor_component_template_3_S: "Small Maid Outfit"
  #  中號女僕裝
  gts_bruh_shipgirl_armor_component_template_3_M: "Medium Maid Outfit"
  #  大號女僕裝
  gts_bruh_shipgirl_armor_component_template_3_L: "Large Maid Outfit"
  #  小號軍禮服
  gts_bruh_shipgirl_armor_component_template_4_S: "Small Officer Uniform"
  #  中號軍禮服
  gts_bruh_shipgirl_armor_component_template_4_M: "Medium Officer Uniform"
  #  大號軍禮服
  gts_bruh_shipgirl_armor_component_template_4_L: "Large Officer Uniform"
  #  §M(Bruh系列護盾)§!\n柔軟的棉質緊貼肌膚，雖然沒有花俏的裝飾，簡約、樸素，卻有著令人安心的厚度。這份樸實的厚度能有效緩衝來自下方的常規衝擊。
  gts_bruh_shipgirl_shield_component_set_1_DESC: "§M(Bruh Series Shield)§!\nSoft cotton fits snugly against the skin. Although there are no fancy decorations—simple and plain—it has a reassuring thickness. This simple thickness effectively buffers conventional impacts from below."
  #  §M(Bruh系列護盾)§!\n傳說中的「胖次」。藍白相間的條紋在宇宙中旋轉時會產生一種奇妙的催眠效果。敵人的雷達與火控員往往會不由自主地鎖定這個區域，從而忽略了艦娘其他的致命攻擊。
  gts_bruh_shipgirl_shield_component_set_2_DESC: "§M(Bruh Series Shield)§!\nThe legendary \"Pantsu\". The blue and white stripes produce a strange hypnotic effect when rotating in space. Enemy radar and fire control operators often find themselves involuntarily locking onto this area, thereby ignoring the shipgirl's other lethal attacks."
  #  §M(Bruh系列護盾)§!\n成熟艦娘的大膽選擇。大面積的鏤空與精緻的蕾絲花邊構成了一種危險的誘惑。它幾乎不提供物理上的遮蔽，而是透過激發觀測者的遐想來構建一道心理防線，宣示著穿著者對自身魅力的絕對自信。
  gts_bruh_shipgirl_shield_component_set_3_DESC: "§M(Bruh Series Shield)§!\nA bold choice for mature shipgirls. Large areas of cutouts and exquisite lace trim constitute a dangerous temptation. It provides almost no physical concealment; instead, it builds a psychological defensive line by exciting the observer's imagination, declaring the wearer's absolute confidence in her own charm."
  #  §M(Bruh系列護盾)§!\n防禦的極致就是沒有防禦...或者看起來沒有。這真的能算內褲嗎？僅僅是一條細得幾乎看不見的膠帶，勉強遮蓋住了最關鍵的一點。穿戴它的艦娘顯然放棄了羞恥心，轉而追求極致的輕量化與靈活度。\n§Y"防禦力？那是什麼？只要不被擊中就好了！"§!
  gts_bruh_shipgirl_shield_component_set_4_DESC: "§M(Bruh Series Shield)§!\nThe ultimate defense is no defense... or looks like none. Can this really be called panties? Just a sliver of tape, almost too thin to see, barely covers the most critical point. The shipgirl wearing it has clearly abandoned shame in pursuit of extreme weight reduction and flexibility.\\n§Y\"Defense? What's that? It's fine as long as you don't get hit!\"§!"
