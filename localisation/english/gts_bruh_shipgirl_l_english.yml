  gts_event_bruh_shipgirl.0206.desc: "§Y[FromFrom.GetName]§! is a Gaia planet teeming with primitive life. Dense jungles cover the continents, clear rivers crisscross the land, and various animals live freely. But there is no intelligent civilization on this planet, only the most primitive ecosystem. The Dreadnought shipgirl §H[From.GetName]§! could almost smell the fragrance of grass and earth.\n\n§R\"Such a beautiful planet... what a pity.\"§!\n\nShe sighed, but the experiment had to continue. Spreading her legs, she aligned this life-filled planet with her pussy. The Gaia planet was slowly pushed inside. The warm and humid climate made it match her body temperature perfectly; there was almost no perceived difference, and the forests on the surface were crushed as soon as they contacted her flesh walls.\n\n§R\"Mm... the temperature is just right, feels very comfortable.\"§!\n\nThe Dreadnought Shipgirl nodded with satisfaction and began a gentle contraction. The ecosystem on the planet's surface collapsed rapidly under her pressure. Animals running in the forests suddenly found the sky turned pink, followed immediately by violent tremors of the earth. Plate tectonics shifted and collided under the push of her flesh walls, triggering countless earthquakes. Volcanoes erupted with lava, but it was cooled and solidified by her juices before it could even flow. Animals fled everywhere in the catastrophe. Some were buried by landslides, others swept away by floods, and some were directly flattened into meat pies by the descending flesh walls. §H[From.GetName]§! closed her eyes, focusing on feeling the changes of the planet within her. Forests were pressed into sludge, mountains were leveled, and oceans were replaced by juices. The entire planet collapsed and reorganized within her pussy, eventually mixing completely into a mass of mud. Fifteen minutes later, the Gaia planet had lost its original shape. It became a soft mud ball covered in juices, slowly rolling inside he