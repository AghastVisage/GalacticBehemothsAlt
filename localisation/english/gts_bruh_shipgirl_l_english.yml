  #  §M(Bruh系列護盾)§!\n柔軟的棉質緊貼肌膚，雖然沒有花俏的裝飾，簡約、樸素，卻有著令人安心的厚度。這份樸實的厚度能有效緩衝來自下方的常規衝擊。
  gts_bruh_shipgirl_shield_component_set_1_DESC: "§M(Bruh Series Shield)§!\nSoft cotton fits snugly against the skin. Although there are no fancy decorations - simple and plain - it has a reassuring thickness. This simple thickness effectively buffers conventional impacts from below."
  #  §M(Bruh系列護盾)§!\n傳說中的「胖次」。藍白相間的條紋在宇宙中旋轉時會產生一種奇妙的催眠效果。敵人的雷達與火控員往往會不由自主地鎖定這個區域，從而忽略了艦娘其他的致命攻擊。
  gts_bruh_shipgirl_shield_component_set_2_DESC: "§M(Bruh Series Shield)§!\nThe legendary \"Pantsu\". The blue and white stripes produce a strange hypnotic effect when rotating in space. Enemy radar and fire control operators often find themselves involuntarily locking onto this area, thereby ignoring the shipgirl's other lethal attacks."
  #  §M(Bruh系列護盾)§!\n成熟艦娘的大膽選擇。大面積的鏤空與精緻的蕾絲花邊構成了一種危險的誘惑。它幾乎不提供物理上的遮蔽，而是透過激發觀測者的遐想來構建一道心理防線，宣示著穿著者對自身魅力的絕對自信。
  gts_bruh_shipgirl_shield_component_set_3_DESC: "§M(Bruh Series Shield)§!\nA bold choice for mature shipgirls. Large areas of cutouts and exquisite lace trim constitute a dangerous temptation. It provides almost no physical concealment; instead, it builds a psychological defensive line by exciting the observer's imagination, declaring the wearer's absolute confidence in her own charm."
  #  §M(Bruh系列護盾)§!\n防禦的極致就是沒有防禦...或者看起來沒有。這真的能算內褲嗎？僅僅是一條細得幾乎看不見的膠帶，勉強遮蓋住了最關鍵的一點。穿戴它的艦娘顯然放棄了羞恥心，轉而追求極致的輕量化與靈活度。\n§Y"防禦力？那是什麼？只要不被擊中就好了！"§!
  gts_bruh_shipgirl_shield_component_set_4_DESC: "§M(Bruh Series Shield)§!\nThe ultimate defense is no defense... or looks like none. Can this really be called panties? Just a sliver of tape, almost too thin to see, barely covers the most critical point. The shipgirl wearing it has clearly abandoned shame in pursuit of extreme weight reduction and flexibility.\n§Y\"Defense? What's that? It's fine as long as you don't get hit!\"§!"
