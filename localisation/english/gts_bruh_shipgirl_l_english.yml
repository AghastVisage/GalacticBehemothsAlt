#  §M"哦？這顆星球上居然有會動的小蟲子。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$饒有興趣地盯著手中那顆藍色的星球，透過感測器，她能看見§Y[From.GetName]§!表面那些如同塵埃般大小的原始部落。\n\n這些土著正在舉行某種宗教儀式，它們圍繞著篝火跳舞，完全不知道自己的世界已經被一隻巨大的手掌托起。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將星球湊近眼前，仔細觀察著那些微小的生命。\n\n她能看見那些土著驚恐地四散奔逃，它們的村莊在星球的震動中坍塌，篝火被撲滅。\n\n一些土著跪倒在地，朝著天空中那隻遮天蔽日的巨眼磕頭祈禱。\n\n但$gts_bruh_shipgirl_ship_sizes_3_short$只是輕笑一聲。\n\n§M"跪拜也沒用哦，你們馬上就要成為小穴的零食了~~" §!\n\n她的另一隻手已經伸向了裙底，熟練地勾住內褲的邊緣往下拉。\n\n濕潤的布料與肌膚分離時發出"啾"的黏膩聲響，可以看見內褲的襠部已經被愛液浸透，拉出一條條晶瑩的絲線。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將內褲褪到膝蓋處，然後微微張開雙腿，露出了那片已經濕透的秘裂。\n\n粉嫩的陰唇微微翕動著，一滴滴透明的愛液從縫隙中滲出。\n\n陰毛叢中還掛著幾滴之前高潮時留下的愛液，在星光的照耀下閃爍著淫靡的光澤。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$用手指撥開陰唇，露出裡面粉紅色的小穴入口，那裡正一張一合地蠕動著，似乎在期待著什麼。\n\n§M"來吧，讓我看看你們能在裡面堅持多久。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將星球對準了自己的小穴，然後緩緩推進。\n\n土著們抬頭看向天空，只能看見一片肉色的絕壁正在逼近。\n\n§M"啊...進來了..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$發出滿足的呻吟，小穴的入口被星球撐開，一圈圈的肉壁緊緊包裹住星球表面。\n\n那些土著部落首先遭殃，它們連反應的時間都沒有，就被從天而降的肉壁壓成肉泥。\n\n整個村莊在瞬間被碾平，篝火、圖騰、茅草屋，一切都消失在$gts_bruh_shipgirl_ship_sizes_3_short$的愛液之中。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$夾緊雙腿，小穴有節奏地收縮。\n\n每一次收縮，都會讓星球表面的地殼造成毀滅性的浩劫。\n\n大陸板塊在壓力下碎裂，山脈被削平。\n\n那些倖存的土著絕望地看著自己的世界在崩潰，它們跪地祈禱，但沒有任何神明會回應他們。\n\n穴壁分泌出了更多的愛液，這些黏稠的液體如同洪水般淹沒了星球表面。\n\n土著們在愛液的海洋中掙扎，它們試圖游泳，但黏稠的液體讓他們無法移動。\n\n最終，他們一個個沉入愛液之中，被溶解成有機物，成為$gts_bruh_shipgirl_ship_sizes_3_short$愛液的一部分。\n\n§M"啊啊...要去了..."§!\n\n星球在小穴內被擠壓得越來越扁，地殼完全碎裂，岩漿噴湧而出，但很快就被周圍的愛液澆熄。\n\n整顆星球在高潮中徹底粉碎，化為無數微小的顆粒，混合在噴湧而出的愛液之中。\n\n§M"呼...感覺真不錯。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$滿足地說道。
  gts_event_bruh_shipgirl.0009.desc: "§M\"Oh? There are actually living little bugs on this world.\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ stared with interest at the blue sphere in her palm. Through her sensors, she could spot primitive tribes the size of dust particles on the surface of §Y[From.GetName]§!.\\n\\nThese natives were performing a religious ritual, dancing around bonfires, completely unaware that their world was now cradled in a gigantic hand.\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ brought the world close to her eyes, closely observing the tiny lifeforms.\\n\\nShe could see natives fleeing in panic, their villages collapsing under planetary tremors, their fires extinguished.\\n\\nSome natives fell to their knees, prostrating and praying toward the colossal eye blotting out their skies.\\n\\nYet $gts_bruh_shipgirl_ship_sizes_3_short$ only chuckled softly.\\n\\n§M\"Kneeling won't help; you'll soon become snacks for my aperture~~\"§!\\n\\nHer other hand reached beneath her skirt, expertly hooking the waistband of her panties and pulling them downward.\\n\\nThe damp fabric parted from her skin with a sticky squelch, revealing that the crotch had already been saturated with love fluid, stretching into glistening threads.\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ slid her panties down to her knees and parted her legs slightly, exposing her soaked private realm.\\n\\nHer delicate intimate lips fluttered gently, beads of clear love fluid oozing from the crease.\\n\\nA few droplets left from an earlier climax clung to her hair, glimmering with lewd luster under the starlight.\\n\\nUsing her fingers, $gts_bruh_shipgirl_ship_sizes_3_short$ parted her folds, revealing the soft pink entrance writhing rhythmically as if eagerly anticipating something.\\n\\n§M\"Come, let me see how long you can hold out inside.\"§!\\n\\nAligning the world with her aperture, $gts_bruh_shipgirl_ship_sizes_3_short$ slowly pushed it inward.\\n\\nThe natives looked up at th