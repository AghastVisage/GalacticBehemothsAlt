  #  Bruh驅逐艦娘
  gts_bruh_shipgirl_ship_sizes_1: "Bruh Destroyer Shipgirl"
  #  §M(Bruh系列艦娘)§!\n這些嬌小的巨人(相對而言)是艦隊的前鋒。雖然被稱為"驅逐"，但她們的體型依然足以讓任何常規戰艦相形見絀。她們不依賴厚重的裝甲，而是憑藉驚人的爆發力和靈活的步伐在星海中穿梭。她們擅長快速貼近敵方艦隊，用綁在大腿上的發射管傾瀉魚雷，或者直接用手中的速射火炮將敵艦的艦橋轟成蜂窩
  SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_1_DESC: "§M(Bruh Series Shipgirls)§!\\nThese petite giants (relatively speaking) are the fleet's vanguards. Although called 'Destroyers', their size is still enough to make any conventional warship look small. They don't rely on heavy armor, but instead use incredible explosive power and flexible footwork to traverse the star-sea. They excel at quickly closing in on enemy fleets, unleashing torpedoes from tubes mounted on their thighs, or using rapid-fire artillery in their hands to turn enemy bridges into honeycombs."
  #  Bruh戰列艦娘
  gts_bruh_shipgirl_ship_sizes_2: "Bruh Battleship Shipgirl"
  #  §M(Bruh系列艦娘)§!\n艦隊的中堅力量，兼具毀滅性的火力與厚實的防禦。這些巨娘通常裝備著能輕易洞穿地殼的超大口徑主炮，或者是作為移動的航空基地，釋放無數如同蜂群般的艦載機。她們不需要頻繁移動，只需優雅地站在戰場後方，調整巨大的舾裝，對著遠處的坐標進行覆蓋式打擊
  SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_2_DESC: "§M(Bruh Series Shipgirls)§!\\nThe backbone of the fleet, possessing both devastating firepower and thick defense. These giantesses are usually equipped with super-large caliber main guns that can easily pierce planetary crusts, or serve as mobile aviation bases, releasing countless swarm-like carrier aircraft. They don't need to move frequently; they simply stand elegantly at the back of the battlefield, adjusting their massive rigging to perform carpet-bombing strikes on distant coordinates."
  #  Bruh無畏艦娘
  gts_bruh_shipgirl_ship_sizes_3: "Bruh Dreadnought Shipgirl"
  #  §M(Bruh系列艦娘)§!\n真正的星海霸主，體型之大以至於恆星在她們身旁都顯得黯淡，普通的恆星在她面前都如同暖手寶一般。她們是唯一擁有足夠蠻力揮舞那把數萬公里長"斬艦刀"的存在。她們的存在本身就是一種天災，不僅能用物理手段切開敵人的主力艦隊，更擁有處理行星的恐怖能力。當無畏艦娘出現在雷達上時，撤退往往已經太遲了
  SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_3_DESC: "§M(Bruh Series Shipgirls)§!\\nTrue star-sea overlords, so large that stars seem dim beside them; ordinary stars are like hand-warmers in their presence. They are the only ones with the raw strength to wield that tens-of-thousands-of-kilometers-long 'Ship-Slayer Blade'. Their very existence is a natural disaster, capable of physically slicing through enemy main fleets and possessing the terrifying ability to process planets. When a Dreadnought Shipgirl appears on radar, retreat is usually too late."
  #  敵人的艦隊已經灰飛煙滅，剩下的只有這顆赤裸裸暴露在無畏艦娘面前的§Y[From.GetName]§!。面對地面上那些絕望發射的、如同灰塵般的防禦導彈，無畏艦娘只覺得一陣好笑，那種程度的爆炸，連給她除毛都嫌力道不足。她輕笑著，無視了通訊頻道裡敵人撕心裂肺的求饒，將這顆敵人的家園像塞入一顆情趣跳蛋般，強行推入了她那濕滑的深淵。對於星球上的敵軍來說，這是超越了所有噩夢的場景。它們引以為傲的要塞、繁華的都市，在接觸到粉色肉壁的瞬間便被粉碎。緊接著，愛液如海嘯般灌入大陸的每一個裂縫。無畏艦娘刻意控制著力道，沒有立刻夾碎它，而是利用陰道的褶皺反覆套弄、研磨，將星球表面的所有文明痕跡「舔舐」乾淨。當這顆星球再次重見天日時，它已經變成了一顆晶瑩的濕潤球體。原本的仇恨與抵抗都已被溶化在濃稠的愛液中，在星空中無聲地訴說著無畏艦娘的恐怖。
  #  §Y[From.GetName]§!的防禦控制中心內，警報聲早已響徹天際。\n\n這顆擁有數百億人口的星球，此刻正面臨著誕生以來最為可怕的毀滅危機。\n\n大氣層外，$gts_bruh_shipgirl_ship_sizes_3_short$那綿延數百萬公里的龐大軀體靜靜地佇立著，將§Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!的光芒遮擋得一乾二淨，整個§Y[From.GetName]§!都籠罩在她宏偉軀體投下的陰影之中。\n\n§Y[From.GetName]§!政府在極度恐懼下下達了總攻擊命令，數以萬計的軌道炮、要塞巨炮以及行星級粒子束同時開火，漫天交織的死光與動能彈頭如同一場逆流而上的光雨，狠狠地砸在$gts_bruh_shipgirl_ship_sizes_3_short$那修長潔白的大腿與下腹肌膚上。\n\n然而，這足以蒸發整片艦隊的恐怖火力，作用在她那嬌嫩如脂的皮膚上，僅僅只能帶來如微風吹拂般的微弱癢意。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$雙臉泛著誘人的緋紅，雙眼含著害羞的淚光，她有些侷促地夾了夾圓潤的雙腿，感到萬分羞恥。\n\n然而，接收到指揮部發送的指令後，她不得不執行這殘酷的命令。\n\n§M"對...對不起...指揮部的命令是絕對的...我必須把你們這顆星球...塞進去...請你們不要再進行這種無謂的反抗了好不..."§!\n\n她用通訊器傳發出極其害羞且蚊細軟語般的聲線，聲音雖然溫柔，卻帶著無可抗拒的壓迫感。\n\n在她帶著歉意的低語中，她抬起修長的手指，輕柔地褪下胯下那條早已被愛液浸濕的純白胖次，露出了那處散發著濃郁女性芬芳的粉紅花穴。\n\n在敵方星球無數居民絕望的注視下，兩根如同擎天巨柱般的粉嫩指尖從天而降，輕易地捏住了整顆星球。\n\n指尖與地表接觸的瞬間，高山被揉成平地，數個工業大洲直接在指紋的碾壓下化為粉碎。\n\n§M"要...要放進去了喔..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$羞恥得幾乎要哭出來，她將捏住的敵星緩緩對準了自己的穴口，隨後腰肢輕輕往前一送，將整顆直徑上萬公里的行星硬生生推進了狹窄緊緻的陰道深處！\n\n§R"咕啾...咕啾..."§!\n\n無邊無際的濕潤軟肉瞬間擠壓過來，敵星表面引以為傲的護盾在接觸到肉褶的瞬間就像脆弱的蛋殼般§R"啪嚓"§!一聲碎裂成渣。\n\n龐大無匹的膣壓從小穴四面八方而來，將地殼層層壓碎，岩漿爆發卻又立刻被穴內湧出的濃稠愛液澆滅。\n\n§V"不要啊！是肉壁！我們整個世界被推進巨大的小穴裡了！"§!\n\n星球廣播裡傳來數百億生靈最後的慘叫與嚎哭，但這些聲音很快就被擠壓產生的濕潤聲響所吞沒。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$緊緊閉上雙腿，嬌軀微微顫抖，雙手撫摸著小腹，感受著§Y[From.GetName]§!在自己小穴內被肉壁壓碎的劇烈快感。\n\n§M"咕唧...啪唧...咕嚕嚕..."§!\n\n§Y[From.GetName]§!的板塊、金屬地核與數百億生命，在短短數分鐘內被徹底碾成微小的陰垢，消失在她高溫濃稠的愛液之中。
