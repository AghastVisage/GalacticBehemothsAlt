  gts_event_bruh_shipgirl.0005.name: "Top Secret Extermination Order"
#  $gts_bruh_shipgirl_ship_sizes_3_short$的龐大身姿降臨在§Y[From.GetName]§!的軌道旁。\n\n這顆繁榮的殖民地星球上，數十億公民正舉城歡呼，慶祝著帝國守護者的到來。\n\n全球通訊頻道裡充斥著熱情的廣播。\n\n§V"歡迎我們的守護者！感謝您為帝國巡航，祝您武運昌隆！"§!\n\n然而，站在宇宙深處的$gts_bruh_shipgirl_ship_sizes_3_short$並沒有回應這份熱情。\n\n她面容嚴肅，整潔的軍裝在星光下顯得無比挺拔，雙眼凝視著艦隊指揮部剛剛發來的最高加密指令。\n\n§Y[From.GetName]已被判定為潛在不穩定目標，立即執行清除作業。"§!\n\n這是一道荒謬而殘酷的軍令，但作為最恪盡職守的戰士，她的字典裡沒有服從以外的選項。\n\n§M"軍令如山...抱歉了，希望你們的靈魂能獲得安息。"§!\n\n她低聲自語，神情冰冷而莊嚴。\n\n她緩緩解開軍裝下擺，將自身那綿延數萬公里的宏偉下體裸露於太空之中。\n\n對於地面上的微小生靈而言，天空突然被無邊無際的肉色天幕所遮蔽，潔白而細膩的肌膚取代了恆星的光芒。\n\n§V"看啊！天空出現了守護者的英姿！這是軍方的防禦演習嗎？"§!\n\n人們興奮地聚集在廣場上，完全未曾意識到末日的降臨。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$伸出兩根如天柱般龐大的手指，輕柔卻不可抗拒地捏住了整顆行星。\n\n指尖壓在地表上，瞬間將幾座數百萬人口的大都市壓成齏粉，指紋的溝壑成為了地表無法逾越的天坑，地殼因指尖的擠壓而發出沉悶的崩裂聲。\n\n隨後，她面無表情地將這顆載滿忠誠公民的星球，對準了自己的穴口，堅決地推了進去。\n\n§R"咕啾..."§!\n\n輕微的濕潤聲響在真空間迴盪。\n\n無邊無際的緊緻軟肉從四面八方包覆而來，幾萬公里厚的軟肉褶皺發出恐怖的擠壓。\n\n星球的地殼在第一秒就全面碎裂，地幔噴湧，卻立刻被穴內大量的愛液淹沒。\n\n居民們的歡呼聲在瞬間化作了絕望的尖叫。\n\n世界末日不是伴隨著火海，而是伴隨著無邊無際的粉色軟肉！\n\n§V"發生了什麼事？！天塌下來了！救命啊！"§!\n\n人們在街道上絕望地奔跑，卻只能眼睜睜看著無邊無際的肉牆從天降下，億萬生靈在絕望與無法理解中化為穴壁上的陰垢，徹底溶入那無盡的愛液海洋之中。\n\n艦娘雙腿緊閉，身體保持著筆直的站姿，用小穴深處的肉褶反覆碾壓著這顆崩解的星球。\n\n§R"噗唧..."§!\n\n隨著最後一次有力的收縮，星球上所有的訊號徹底歸於寂靜。\n\n十五分鐘後，$gts_bruh_shipgirl_ship_sizes_3_short$再次將手指深入穴內，將那已經徹底被碾平、裹滿濃稠愛液的殘核掏出，重新放回軌道。\n\n原本繁華的[From.GetName]如今只剩下一塊散發著體溫與腥香的愛液球，上面再無任何生靈。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$嚴謹地整理好衣著，向指揮部回傳了報告。\n\n§M"特別清算任務完成，目標已抹除。"§!
  gts_event_bruh_shipgirl.0005.desc: "The immense figure of $gts_bruh_shipgirl_ship_sizes_3_short$ descended beside the orbit of §Y[From.GetName]§!.\\n\\nOn this prosperous colony world, billions of citizens were cheering across entire cities, celebrating the arrival of the Empire's guardian.\\n\\nGlobal communication channels were flooded with enthusiastic broadcasts.\\n\\n§V\"Welcome, our guardian! Thank you for cruising on behalf of the Empire, and may fortune be with you in battle!\"§!\\n\\nYet, standing in the depths of space, $gts_bruh_shipgirl_ship_sizes_3_short$ did not reciprocate this warmth.\\n\\nHer expression was stern, her neat military uniform looking exceptionally crisp beneath the starlight as her eyes fixed upon the top-level encrypted order just sent from Fleet Command:\\n\\n§Y\"[From.GetName] has been designated as a potentially unstable target. Execute purge operations immediately.\"§!\\n\\nIt was an absurd and cruel military order, but as the most dutiful of warriors, her vocabulary contained no options other than obedience.\\n\\n§M\"Orders are absolute... I am sorry. May your souls find rest.\"§!\\n\\nShe whispered to herself, her expression cold yet solemn.\\n\\nShe slowly unbuttoned the lower hem of her uniform, baring her magnificent lower body stretching across tens of thousands of kilometers to the vacuum of space.\\n\\nFor the tiny beings on the surface, the sky was suddenly eclipsed by a boundless, flesh-colored expanse; fair and delicate skin supplanted the light of the sun.\\n\\n§V\"Look! The heroic form of the guardian has appeared in the sky! Is this a military defense drill?\"§!\\n\\nPeople gathered excitedly in squares, entirely unaware of impending doom.\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ extended two fingers as colossal as pillars of heaven, gently yet irresistibly pinching the entire planet.\\n\\nHer fingertips pressed against the surface, instantly crushing several metropolises of millions into dust. The ridges of her fingerprints became insurmountable sinkholes on the crust, and the planet's surface let out dull groans of fracture under her pinch.\\n\\nThen, expressionless, she aligned this planet filled with loyal citizens against her opening and resolutely pushed it in.\\n\\n§R\"Squelch...\"§!\\n\\nA faint, wet sound resonated across the void.\\n\\nBoundless, tight soft flesh enveloped it from all sides; tens of thousands of kilometers of fleshy folds exerted terrifying pressure.\\n\\nThe planet's crust shattered entirely within the first second, its mantle spewing forth only to be instantly drowned in vast amounts of love fluid inside the canal.\\n\\nThe citizens' cheers turned into despairing shrieks in an instant.\\n\\nDoomsday did not arrive in a sea of fire, but in an endless expanse of pink soft flesh!\\n\\n§V\"What's happening?! The sky is falling! Help us!\"§!\\n\\nPeople fled in panic through the streets, only to helplessly watch an endless wall of flesh descend from above. Billions of souls turned into residue on the canal walls amid despair and incomprehension, dissolving completely into the boundless ocean of love fluid.\\n\\nWith her legs clamped tight, the Shipgirl maintained a straight, upright stance, using the fleshy folds deep in her aperture to repeatedly grind down the collapsing world.\\n\\n§R\"Squish...\"§!\\n\\nWith one final, powerful contraction, every signal on the planet fell completely silent.\\n\\nFifteen minutes later, $gts_bruh_shipgirl_ship_sizes_3_short$ reached her fingers into her canal again, pulled out the remnant core—now completely flattened and coated in thick love fluid—and placed it back into orbit.\\n\\nThe once-bustling [From.GetName] was now reduced to a sphere of love fluid radiating body heat and a sweet, musky scent, devoid of any living soul.\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ rigorously smoothed out her attire and transmitted her report back to command:\\n\\n§M\"Special liquidation mission accomplished. Target has been eliminated.\"§!"
#  軍令如山，無可奈何
  gts_event_bruh_shipgirl.0005.a: "Orders are absolute; there was no other choice"
#  偽裝的重構
  gts_event_bruh_shipgirl.0006.name: "Disguised Reconstruction"
#  $gts_bruh_shipgirl_ship_sizes_3_short$停泊在§Y[From.GetName]§!一旁，龐大的身軀將§Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!的光芒遮擋得一乾二淨。\n\n最高指揮部對這顆星球下達了完全滅絕的指令，然而給予當地政府與居民的公文卻聲稱這是一場局部環境優化的技術改造。\n\n作為嚴謹執行軍令的艦娘，$gts_bruh_shipgirl_ship_sizes_3_short$嚴格按照上級給予的劇本開展工作，哪怕她深知這是一場殘酷的欺騙。\n\n通訊器中傳來星球領袖歡欣鼓舞的聲音。\n\n§M"尊敬的無畏大人！感謝指揮部為我們提供這次環境改造的機會！全體居民已在室內集合，靜候您的偉力！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$居高臨下地看著那顆湛藍色的星球，臉上沒有任何表情，有的只是如鋼鐵般冰冷的執行力。\n\n她打開全星球廣播，聲音嚴肅而沉穩。\n\n§M"現在開始執行『環境深度重構協議』，請所有居民保持鎮定，留在建築物內。"\n\n"重構過程中產生的劇烈震動與環境變化皆為預定現象。"§!\n\n話音剛落，$gts_bruh_shipgirl_ship_sizes_3_short$伸手解開了自己的下身軍裝，將那一處散發著濃郁女性氣息的粉色花穴完全暴露在大氣層外。\n\n星球上的觀測站與民眾透過窗戶，驚恐地發現原本湛藍的天空被一片無邊無際的粉紅軟肉所覆蓋，空氣中開始瀰漫著一種黏稠的雌性氣味。\n\n§V"等等...這不是氣候調節裝置！那是...那是艦娘的...！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$伸出兩根遮天蔽日的巨指，像拿捏一顆彈珠般捏住了§Y[From.GetName]§!，隨後毫不留情地將整顆星球向著自己早已濕透的穴口塞去。\n\n§R"咕啾...！"§!\n\n當星球的北半球接觸到穴口的肉褶時，大氣層在瞬間被撕裂並消失。\n\n§V"不！這根本不是改造！這是屠殺！指揮部騙了我們！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$冷酷地閉上雙眼，腰肢用力向前一挺，將整顆星球完整地吞入了陰道深處。\n\n§M"這是最高指揮部的決策，你們的犧牲是帝國發展的代價。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$在全頻段中發出最後的宣告，雖然它們應該也接收不到了。\n\n在她狹窄而無比緊緻的穴壁擠壓下，星球的地殼像蛋殼般粉碎，海洋與內陸在幾秒鐘內被強行混合，億萬生靈連同它們的文明遺跡，在肉壁劇烈的蠕動與收縮中被徹底碾成陰垢，並與大量的愛液融為一體。\n\n§R"啪嗒..."§!\n\n幾十分鐘後，$gts_bruh_shipgirl_ship_sizes_3_short$將已經徹底變為一顆光滑愛液球體的星球摳了出來。\n\n那顆星球上再無任何建築與生命，只剩下無邊的半透明愛液與濃郁的雌性氣息。
  gts_event_bruh_shipgirl.0006.desc: "$gts_bruh_shipgirl_ship_sizes_3_short$ berthed beside §Y[From.GetName]§!, her immense frame completely blocking the light of §Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!.\\n\\nHigh Command issued a complete extermination directive for this planet, yet official documents distributed to the local government and residents claimed it was merely a localized technological remodeling for environmental optimization.\\n\\nAs a disciplined shipgirl who executes military orders faithfully, $gts_bruh_shipgirl_ship_sizes_3_short$ carried out her duties strictly according to the script given by superiors, even though she well knew it was a cruel deception.\\n\\nThe planetary leader's cheerful voice came through the communicator:\\n\\n§M\"Honored Dreadnought! Thank you and High Command for granting us this opportunity for environmental remodeling! All residents have gathered indoors, awaiting your magnificent power!\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ looked down coldly at the azure planet without any emotion, possessing only steel-like execution.\\n\\nShe opened a planet-wide broadcast, her voice grave and composed:\\n\\n§M\"Commencing 'Deep Environmental Reconstruction Protocol' now. All residents, please remain calm and stay inside buildings.\\n\\nSevere tremors and environmental shifts during reconstruction are predetermined phenomena.\"§!\\n\\nNo sooner had she spoken than $gts_bruh_shipgirl_ship_sizes_3_short$ reached down to unfasten her lower uniform, completely exposing her soft pink aperture that radiated a heavy feminine scent outside the atmosphere.\\n\\nObservatories and citizens looked out through windows, discovering in horror that the once-blue sky was now obscured by an endless expanse of pink soft flesh, while a thick feminine aroma began permeating the air.\\n\\n§V\"Wait... that isn't a climate conditioning device! That's... that's the shipgirl's...!\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ extended two sky-blotting giant fingers, pinching §Y[From.GetName]§! like a marble, and then remorselessly shoved the entire planet toward her thoroughly drenched aperture.\\n\\n§R\"Squelch...!\"§!\\n\\nThe moment the planet's northern hemisphere touched the fleshy folds of the aperture, its atmosphere tore apart and vanished instantly.\\n\\n§V\"No! This isn't reconstruction at all! This is a massacre! High Command lied to us!\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ closed her eyes stoically, thrust her hips forward with force, and swallowed the entire planet into the depths of her canal.\\n\\n§M\"This is the decision of High Command. Your sacrifice is the price of the Empire's progress.\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ broadcast her final declaration across all frequencies, though none remained to receive it.\\n\\nUnder the crushing pressure of her narrow, tight fleshy walls, the planet's crust shattered like an eggshell. Oceans and continents violently collided within seconds. Billions of lives, along with the remnants of their civilization, were ground down into residue amid the intense writhing and contraction of her flesh, blending completely into vast volumes of love fluid.\\n\\n§R\"Plop...\"§!\\n\\nSeveral tens of minutes later, $gts_bruh_shipgirl_ship_sizes_3_short$ scooped out the sphere, which had now turned into a smooth ball of love fluid.\\n\\nNot a single building or lifeform remained on that world—only boundless, translucent love fluid and a heavy feminine fragrance."
#  但是值得嗎?
  gts_event_bruh_shipgirl.0006.a: "But was it worth it?"
#  故土的葬禮
  gts_event_bruh_shipgirl.0007.name: "Funeral of the Homeland"
#  眼前這顆名為§Y[From.GetName]§!的星球，對$gts_bruh_shipgirl_ship_sizes_3_short$而言有著截然不同的意義，這裡曾是她的誕生地，在她被改造為這具宏偉的艦娘軀體之前，她曾作為一個微小的個體生活在這片土地上。\n\n然而，最高指揮部認定該星球存在潛在的叛亂風險，簽發了最高等級的抹殺令。星球上的防衛軍顯然提前接到了風聲，當$gts_bruh_shipgirl_ship_sizes_3_short$那巨大無朋的身影籠罩整個星系時，數以萬計的行星防禦飛彈與軌道炮發射出耀眼的光芒，如同一群憤怒的飛蟲般向她襲來。\n\n§Y"警告，發現本土防禦網開火。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$冷靜地聽著腦域中的系統提示。\n\n那些足以摧毀常規艦隊的火力打在她光潔的肌膚上，僅僅帶來了如同微風拂過般的極輕微感覺，連讓她眨一下眼都做不到。\n\n她伸出巨大的右手，將這顆記錄著她所有童年記憶的母星抓在手掌心。\n\n在她的視線裡，母星的大小不過與一顆圓潤的紫色果實無異。\n\n通訊頻道中傳來了昔日同胞們絕望而憤怒的嘶吼。\n\n§V"妳忘記了自己的出身嗎？！這裡生妳養妳！妳這個冷血的兵器！"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$的眼神沉靜如水，沒有憤怒，也沒有動搖，只有一種執行軍令的肅穆。\n\n§M"我沒有忘記。"§!\n\n她的聲音透過震波傳遍整顆星球。\n\n§M"但作為軍人，服從命令是我的唯一天職。由我親手來為你們終結，是本艦能給予的最高敬意。"§!\n\n話音落下，她單手解開了軍裝裙擺，將手伸入裙底，將那條印有舊式軍徽的棉質胖次撥到一旁。那片充滿母性與毀滅交織的狹窄深淵暴露在星空中。\n\n她沒有絲毫遲疑，將掌心中那顆微小的母星§Y[From.GetName]§!，順著自己柔軟的陰唇，深深地推入了窄小的縫隙之中。\n\n§R"咕唧...！"§!\n\n狹窄的肉壁瞬間將母星死死包裹。\n\n曾經養育她的廣袤大陸被軟肉碾成爛泥，覆蓋極地的茫茫冰冠被體溫所溶解，崩解的行星露出了它熾熱的熔岩內核，隨後又被無邊無盡的愛液徹底澆熄。\n\n§R"咕啾...咕啾..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$雙腿微微交疊，挺直了腰板，感受著昔日的家園在自己的小穴內被慢慢碾碎、消化、融合的過程。\n\n她的姿態平穩而自然，卻給予了那顆星球最徹底的死亡。\n\n幾分鐘後，動靜完全平息，母星已徹底成為愛液的一部分。
  gts_event_bruh_shipgirl.0007.desc: "The planet §Y[From.GetName]§! before her held a profoundly different meaning for $gts_bruh_shipgirl_ship_sizes_3_short$. It was once her birthplace; before being rebuilt into this magnificent shipgirl vessel, she had lived on this land as a tiny individual.\\n\\nHowever, High Command determined that the world posed a potential rebellion risk and issued a maximum-priority erasure order. The planet's defense forces had evidently caught wind in advance. When the colossal form of $gts_bruh_shipgirl_ship_sizes_3_short$ eclipsed the entire star system, tens of thousands of planetary defense missiles and orbital railguns fired in dazzling brilliance, swarming toward her like a cloud of enraged insects.\\n\\n§Y\"Warning: planetary defense grid firing detected.\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ listened calmly to the system notifications in her mind.\\n\\nThat firepower, sufficient to obliterate a conventional fleet, struck her smooth skin and produced only the faintest sensation of a soft breeze, failing to even make her blink.\\n\\nShe extended her gigantic right hand, catching her homeworld—which held all her childhood memories—in the palm of her hand.\\n\\nIn her sight, her homeworld appeared no larger than a round purple fruit.\\n\\nDespairing, furious roars of her former compatriots echoed over the comm channels:\\n\\n§V\"Have you forgotten your origins?! This world gave you birth and raised you! You cold-blooded weapon!\"\\n\\n§!$gts_bruh_shipgirl_ship_sizes_3_short$'s gaze remained tranquil as water—no wrath, no hesitation, only the solemn duty of executing military orders.\\n\\n§M\"I have not forgotten.\"§!\\n\\nHer voice vibrated across the entire world:\\n\\n§M\"Yet as a soldier, obeying orders is my sole vocation. Ending your existence with my own hands is the highest honor this ship can bestow.\"§!\\n\\nWith those words, she unfastened her uniform skirt with one hand, reached beneath, and pushed aside her cotton panties stamped with the old military crest. That narrow abyss of entwined maternity and destruction was laid bare to the stars.\\n\\nWithout hesitation, she pushed the tiny homeworld §Y[From.GetName]§! from her palm along her soft lips, pressing it deep into the narrow aperture.\\n\\n§R\"Squish...!\"§!\\n\\nThe narrow walls of flesh instantly clamped tight around her homeworld.\\n\\nThe vast continents that had nurtured her were crushed into mud by soft flesh; endless polar ice caps melted under her body heat. The disintegrating planet exposed its blazing molten core, which was then thoroughly extinguished by boundless love fluid.\\n\\n§R\"Squelch... squelch...\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ crossed her legs slightly and straightened her back, feeling her former home being slowly ground down, digested, and fused within her aperture.\\n\\nHer posture was steady and composed, yet it delivered absolute death to the world.\\n\\nA few minutes later, all tremors completely ceased. Her homeworld had become entirely a part of her love fluid."
#  再見了，我的過去
  gts_event_bruh_shipgirl.0007.a: "Farewell, my past"
  gts_event_bruh_shipgirl.0021.name: "Blue-and-White Doomsday Sky"
  #  經典款式的經典毀滅
  gts_event_bruh_shipgirl.0021.a: "Classic Destruction in Classic Style."
  #  條紋天空的審判
  gts_event_bruh_shipgirl.0022.name: "Judgment of the Striped Sky"
  #  §Y[From.GetName]§!的居民們驚恐地看著天空變成了藍白相間的顏色。那不是雲層，而是無畏艦娘剛剛從胯下褪去的貼身衣物。她將那條還散發著騰騰熱氣的藍白條紋胖次撐開，無情地套在了這顆星球上。隨著鬆緊帶在星球赤道附近猛烈回彈，巨大的勒緊力量粉碎了赤道周圍的所有山脈。緊接著，胖次襠部那吸滿了液體的部分沉重地壓在了星球的北半球。對於地面上的小人來說，世界末日是黏稠且腥甜的。巨量的愛液與汗水從巨大的棉質織物縫隙中被擠壓出來，形成了高達數千公尺的黃白色海嘯。城市在瞬間被這股液體沖垮，所有建築與生命都在這股源自少女私處的洪流中淹沒、窒息。
  gts_event_bruh_shipgirl.0022.desc: "The residents of §Y[From.GetName]§! watched in horror as the sky turned a blue-and-white pattern. It wasn't clouds, but the tight-fitting undergarments the Dreadnought Shipgirl had just shed. She stretched that blue-and-white striped pantsu, still radiating heat, and ruthlessly encapsulated the planet with it. As the waistband snapped violently back near the planet's equator, the massive tightening force crushed all mountain ranges around the equator. Directly after, the crotch of the pantsu, saturated with fluid, pressed heavily onto the planet's northern hemisphere. For the tiny humans on the ground, doomsday was viscous and sickly sweet. Massive amounts of juices and sweat were squeezed out from the gaps of the huge cotton fabric, forming a yellow-white tsunami thousands of meters high. Cities were instantly washed away by this liquid; all structures and lives were submerged and suffocated in this torrent stemming from the girl's private area."
  #  這是神明的恩賜...雖然有點臭
  gts_event_bruh_shipgirl.0022.a: "This is a gift from the gods... though it smells a bit."
  #  狂熱粉絲的末路
  gts_event_bruh_shipgirl.0023.name: "End of a Fanatic"
  #  §Y[From.GetName]§!上的居民曾是艦娘最狂熱的粉絲群體，它們日夜祈禱能得到女神的「恩賜」。於是，無畏艦娘回應了他們，她將剛脫下的藍白條紋胖次作為「獎勵」，直接丟在了行星上空。居民們最初還在為天空中降下的巨大聖物而歡呼，直到那沉重的布料真的砸在頭頂。數公里厚的棉層瞬間壓垮了城市護盾，而胖次襠部積累的巨量愛液像決堤的江河一樣傾瀉而下。狂熱的歡呼聲瞬間變成了絕望的氣泡聲，這座繁華的都市連同上面的所有粉絲，都被那過於沉重且濕潤的「愛意」徹底淹沒，化作了織物紋理間的一抹紅斑。
  gts_event_bruh_shipgirl.0023.desc: "The residents of §Y[From.GetName]§! were once the most fanatical group of shipgirl fans, praying day and night for the Goddess's \"grace.\" Thus, the Dreadnought Shipgirl responded to them, throwing her recently shed blue-and-white striped pantsu directly over the planet as a \"reward.\" The residents were initially cheering for the massive holy relic descending from the sky, until the heavy fabric actually slammed onto their heads. The mile-thick cotton layer instantly crushed the city shields, and the vast amount of juices accumulated in the crotch poured down like a bursting river. The fanatical cheers instantly turned into desperate bubbling sounds; this bustling city, along with all the fans upon it, was completely submerged by that overly heavy and moist \"love,\" turning into a smear of red between the textures of the fabric."
  #  求仁得仁...大概？
  gts_event_bruh_shipgirl.0023.a: "They got what they wanted... probably?"
  #  無處安放的衣物
  gts_event_bruh_shipgirl.0024.name: "Nowhere to Put Clothes"
  #  一場災難性的「誤操作」！無畏艦娘在我們的殖民地§Y[From.GetName]§!附近進行換裝時，隨手將剛脫下的藍白條紋胖次丟向了這顆星球。這條巨大的內褲依然保持著她身體的溫度，不偏不倚地將整顆星球罩住。對於上面的殖民者來說，天空突然塌陷了，隨之而來的是一場帶有強烈少女體味的風暴。整個殖民地在幾分鐘內就被淹沒在黏稠的液體中。通訊中最後傳來的聲音是人們在齊腰深的愛液中絕望的呼救，以及對那遮蔽天空的藍白條紋的恐懼。當艦娘意識到這一點時，星球上的文明火種已經熄滅了。
  gts_event_bruh_shipgirl.0024.desc: "A catastrophic \"misoperation\"! While performing an outfit change near our colony §Y[From.GetName]§!, the Dreadnought Shipgirl casually tossed her recently shed blue-and-white striped pantsu toward the planet. These massive panties, still retaining her body heat, happened to perfectly shroud the entire planet. For the colonists there, the sky suddenly collapsed, followed by a storm carrying a strong girlish body odor. The entire colony was submerged in viscous liquid within minutes. The last sounds from the communication were desperate cries for help in waist-deep juices and the fear of the blue-and-white stripes obscuring the sky. By the time the shipgirl realized this, the spark of civilization on the planet had already been extinguished."
  #  下次請看清楚再扔
  gts_event_bruh_shipgirl.0024.a: "Please look clearly before throwing next time."
  #  土著的聖物
  gts_event_bruh_shipgirl.0025.name: "Native's Sacred Relic"
  #  這顆原始星球上的土著曾以為神蹟降臨。當無畏艦娘將她那條穿了很久、吸滿了愛液的藍白條紋胖次賜予這顆星球時，土著們對著那遮天蔽日的藍白條紋跪拜。然而，神蹟很快變成了天災。隨著胖次完全覆蓋地表，其中心部位積累的黏稠液體開始在重力的作用下大量滲出。這不是滋潤萬物的雨露，而是毀滅性的洪水。原始的森林被愛液沖垮，簡陋的部落被淹沒在帶有甜腥味的浪潮中。數以億計的原始生物被困在濕潤的棉布與地表之間，最終全部溺死在艦娘的愛液裡。這顆星球現在看起來就像是一個包著藍白條紋包裝紙的濕潤泥球。
  gts_event_bruh_shipgirl.0025.desc: "The natives on this primitive planet once thought a miracle had descended. When the Dreadnought Shipgirl bestowed her long-worn, juice-soaked blue-and-white striped pantsu upon the planet, the natives knelt before the blue-and-white stripes that blotted out the sun. However, the miracle soon turned into a disaster. As the panties completely covered the surface, the thick liquid accumulated in its center began to seep out in large quantities under the influence of gravity. This was not the rain that nourishes all things, but a devastating flood. Primitive forests were washed away by the juices, and simple tribes were submerged in a tide with a sweet and fishy smell. Billions of primitive creatures were trapped between the moist cotton and the surface, eventually all drowning in the shipgirl's juices. The planet now looks like a moist mud ball wrapped in blue-and-white striped wrapping paper."
  #  有些禮物太過沉重了
  gts_event_bruh_shipgirl.0025.a: "Some gifts are just too heavy."
  #  意外的「加餐」
  gts_event_bruh_shipgirl.0101.name: "Unexpected \"Extra Meal\""
  #  一場可怕的悲劇！艦娘§H[[event_target:gts_bruh_get_event_shipgirl.GetName]§!在享用小行星帶的礦石零食時，不小心將§Y[event_target:gts_bruh_get_event_target.GetName]§!一併抓了起來。儘管§Y[event_target:gts_bruh_get_event_target.GetName]§!發出了全頻段的求救信號，但在她看來那不過是食物上的一點雜質。§Y[event_target:gts_bruh_get_event_target.GetName]§!被拋入了那濕潤、溫熱的粉色深淵中。巨大的舌頭像紅色的海嘯一樣翻湧，將§Y[event_target:gts_bruh_get_event_target.GetName]§!卷向了潔白的臼齒山脈。工作人員在被嚼碎前，最後看到的景象是那緩緩烙下的白色天花板......
  gts_event_bruh_shipgirl.0101.desc: "A terrible tragedy! The shipgirl §H[event_target:gts_bruh_get_event_shipgirl.GetName]§! while enjoying ore snacks in an asteroid belt, accidentally scooped up §Y[event_target:gts_bruh_get_event_target.GetName]§! as well. Despite §Y[event_target:gts_bruh_get_event_target.GetName]§! emitting distress signals on all frequencies, to her it was just a speck of grit on her food. §Y[event_target:gts_bruh_get_event_target.GetName]§! was tossed into that moist, warm pink abyss. A massive tongue rolled like a red tsunami, sweeping §Y[event_target:gts_bruh_get_event_target.GetName]§! toward the pearly white molar mountain range. Before being chewed up, the last sight the personnel saw was that slowly descending white ceiling..."
  #  至少...它們成為了她的一部分
  gts_event_bruh_shipgirl.0101.a: "At least... they've become a part of her."
  #  §R[event_target:gts_bruh_get_event_target.GetName]被嚼碎了§!
  gts_event_bruh_shipgirl.0101.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName] was chewed up§!"
  #  晨間的洪水
  gts_event_bruh_shipgirl.0102.name: "Morning Flood"
  #  這是一個糟糕的早晨。剛睡醒的艦娘§H[event_target:gts_bruh_get_event_shipgirl.GetName]§!顯然處於迷糊狀態，她似乎把我們美麗的海洋行星[Root.GetName]當成了她的私人馬桶。當巨大的陰影籠罩天空，兩瓣潔白的巨臀像天蓋一樣遮住了恆星時，全球的警報都響了。沒有任何商量的餘地，伴隨著令人絕望的瀑布聲，滾燙的黃色洪流從天而降。這股帶有強烈氨氣味和巨娘體溫的液體瞬間擊穿了大氣層，引發了全球性的海嘯。原本蔚藍的海洋在幾分鐘內就被染成了渾濁的淡黃色，海平面上升了數公里。
  gts_event_bruh_shipgirl.0102.desc: "It's a terrible morning. The recently awakened shipgirl §H[event_target:gts_bruh_get_event_shipgirl.GetName]§! was clearly in a daze, and she seems to have mistaken our beautiful ocean planet [Root.GetName] for her private toilet. When massive shadows loomed over the sky and two pearly white buttocks covered the star like a canopy, global sirens rang out. There was no room for negotiation; with an overwhelming sound of a waterfall, a scalding yellow torrent descended from the sky. This liquid, carrying a strong ammonia smell and giantess body heat, instantly pierced through the atmosphere, triggering a global tsunami. The originally blue ocean was dyed a murky pale yellow within minutes, and the sea level rose by several kilometers."
  #  "這顆星球的海洋現在由90%的巨娘晨尿構成，散發著獨特的氣味"
#  "這顆星球的海洋現在由90%的巨娘晨尿構成，散發著獨特的氣味"
  gts_event_bruh_shipgirl.0102.a: "\"The ocean of this planet now consists of 90% giantess morning urine, emitting a unique odor\""
  gts_event_bruh_shipgirl.0103.name: "Snack on the Fairway"
  #  我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!失聯了。最後傳回的影像顯示，巨大的艦娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!正在該星系進行補給，具體來說，她正在抓取小行星往嘴裡塞。很不幸，我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!當時正隱蔽在那片小行星帶中執行任務。艦娘顯然沒有注意到混在「爆米花」裡的幾粒「灰塵」。通訊記錄的最後是巨大的潔白牙齒合攏的畫面，以及隨後陷入黑暗的潮濕咀嚼聲。我們探測到她滿足地嚥下去了，而現在§Y[event_target:gts_bruh_get_event_target.GetName]§!正在她的胃酸海洋中隨波逐流。
  gts_event_bruh_shipgirl.0103.desc: "Our §Y[event_target:gts_bruh_get_event_target.GetName]§! has lost contact. The last transmitted imagery shows the massive shipgirl §Y[event_target:gts_bruh_get_event_shipgirl.GetName]§! taking on supplies in that system—specifically, she was grabbing asteroids and stuffing them into her mouth. Unfortunately, our §Y[event_target:gts_bruh_get_event_target.GetName]§! was concealed in that asteroid belt on a mission at the time. The shipgirl clearly didn't notice a few specks of \"dust\" mixed in with the \"popcorn.\" The end of the communication record shows the closing of massive pearly teeth, followed by the sound of moist chewing in the dark. We detected that she satisfiedly swallowed, and now §Y[event_target:gts_bruh_get_event_target.GetName]§! is drifting through her ocean of gastric acid."
  #  願它們能在被胃酸消化前發回一些生物學數據
  gts_event_bruh_shipgirl.0103.a: "May they send back some biological data before being digested by stomach acid."
  #  發送信號讓她催吐！快！
  gts_event_bruh_shipgirl.0103.b: "Send a signal to make her vomit! Quick!"
  #  幸好她的消化系統沒那麼強......
  gts_event_bruh_shipgirl.0103.c: "Fortunately her digestive system isn't that strong..."
  #  §R[event_target:gts_bruh_get_event_target.GetName]將會被消化§!
  gts_event_bruh_shipgirl.0103.a.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName] will be digested§!"
  #  §Y25%的機率[event_target:gts_bruh_get_event_target.GetName]能夠倖存§!
  gts_event_bruh_shipgirl.0103.b.custom_tooltip: "§Y25% chance that [event_target:gts_bruh_get_event_target.GetName] can survive§!"
  #  §G[event_target:gts_bruh_get_event_target.GetName]倖存下來了......§!
  gts_event_bruh_shipgirl.0103.c.custom_tooltip: "§G[event_target:gts_bruh_get_event_target.GetName] survived...§!"
  #  貼身收藏
