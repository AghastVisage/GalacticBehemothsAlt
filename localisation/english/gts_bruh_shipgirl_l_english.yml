  tech_gts_bruh_shipgirl_drive_3_desc: "§M(Bruh Series Technology)§!\\nEnhanced training allows shipgirls to master explosive stepping techniques, using celestial bodies as springboards for longer-distance leaps."
  #  §M(Bruh系列科技)§!\n精密的動作訓練讓艦娘能夠精準控制落點，並在連續跳躍中保持方向
  tech_gts_bruh_shipgirl_drive_1_desc: "§M(Bruh Series Technology)§!\\nPrecise movement training allows shipgirls to accurately control landing points and maintain direction during continuous jumps."
  #  §M(Bruh系列科技)§!\n最高階的身體訓練讓艦娘的一步跨越變得如同瞬移，光年距離不過彈指之間
