  gts_event_bruh_shipgirl.0205.desc: "§Y[FromFrom.GetName]§! is a planet completely covered by a deep blue ocean, with no land on the surface, only endless waters. Various giant marine creatures live in the depths of the ocean, but there is no intelligent civilization. The Dreadnought shipgirl §H[From.GetName]§! held this water ball in her hands, clearly seeing the shimmering light through the atmosphere.\n\n§R\"A planet made entirely of water? Will this feel like anything?\"§!\n\nShe curiously poked the planet's surface with her finger, triggering a super-tsunami that covered half the planet. Then, she spread her legs and aligned this moist water ball with her equally moist pussy. The ocean planet slid into her body with almost no resistance. Vast amounts of seawater erupted from the planet's surface upon impact, mixing with her already abundant juices, forming a surging torrent of liquid gushing out from the opening.\n\n§R\"Wow... so much water...\"§!\n\nThe Dreadnought Shipgirl looked down at the liquid stream between her legs; it condensed into countless crystalline water droplets in space. She began to gently contract her pussy, feeling the sensation of this fluid within her. Those giant creatures living in the deep sea were currently experiencing an unprecedented catastrophe. They were swept up by the currents, crashing everywhere in the frantic waters, and finally slamming heavily against the flesh walls. Some larger creatures could even make the shipgirl feel their struggle.\n\n§R\"Eh? It seems like something is moving inside...\"§!\n\nShe curiously increased her contraction force. The massive pressure instantly flattened all marine creatures; their remains vanished into the juices at once, leaving no trace behind. Over time, the ocean planet gradually shrank inside her. Large amounts of seawater were squeezed out, eventually leaving only a small rocky core rolling within her. The shipgirl applied light pressure, and this small stone also disappeared.\n\n§R\