  #  飽和雷擊戰術
  tech_gts_bruh_shipgirl_torpedo_1: "Saturated Torpedo Tactics"
  #  §M(Bruh系列科技)§!\n精準度？不需要那種東西。只要將這片星域填滿巨大的金屬圓柱體，敵人便無處可逃。這項科技解鎖了掛載於艦娘大腿外側的超巨型魚雷發射管
  tech_gts_bruh_shipgirl_torpedo_1_desc: "§M(Bruh Series Technology)§!\nAccuracy? No need for such a thing. As long as this region of space is filled with massive metal cylinders, the enemy has nowhere to run. This technology unlocks the super-giant torpedo tubes mounted on the outside of the shipgirls' thighs."
  #  艦娘手持火炮訓練
  tech_gts_bruh_shipgirl_kinetic_artillery_1: "Shipgirl Hand-held Artillery Training"
  #  §M(Bruh系列科技)§!\n雖然主炮的威力令人著迷，但我們不能忽視近距離的纏鬥。通過訓練艦娘如何同時操作艦裝上的多門中小口徑火炮，或者在主炮裝填間隙使用手持副武器進行射擊，填補火力空白，§Y以及不把彈殼砸在友軍的船艦上！§!
  tech_gts_bruh_shipgirl_kinetic_artillery_1_desc: "§M(Bruh Series Technology)§!\nWhile the power of main guns is fascinating, we cannot ignore close-quarters brawling. By training shipgirls on how to simultaneously operate multiple small and medium-caliber guns on their rigging, or use hand-held secondary weapons to fire during main gun reload intervals, we fill the firepower gaps, §Yand ensure shells aren't dropped onto allied ships!§!"
  #  驅逐艦娘專用火控
  tech_gts_bruh_shipgirl_kinetic_artillery_2: "Destroyer Shipgirl Dedicated Fire Control"
  #  §M(Bruh系列科技)§!\n$gts_bruh_shipgirl_ship_sizes_1$以靈活著稱，她們的武器也應如此。我們改變了傳統的大口徑主炮思路，轉而研發了一種輕量化、犧牲射程的動能紅炮系統
  tech_gts_bruh_shipgirl_kinetic_artillery_2_desc: "§M(Bruh Series Technology)§!\n$gts_bruh_shipgirl_ship_sizes_1$ are known for their flexibility, and their weapons should be too. We've shifted from traditional large-caliber main gun thinking to develop a lightweight kinetic 'red gun' system that sacrifices range."
  #  超大口徑鑄造工藝
  tech_gts_bruh_shipgirl_kinetic_artillery_3: "Super Large-Caliber Casting Process"
  #  §M(Bruh系列科技)§!\n不管是什麼問題，只要炮管夠粗、口徑夠大就能解決。如果一發§Y460000000mm§!的實體炮彈不能解決問題，那就再來一發。這項科技致力於製造出與無畏艦娘那宏偉的身軀相稱的巨炮
  tech_gts_bruh_shipgirl_kinetic_artillery_3_desc: "§M(Bruh Series Technology)§!\nNo matter the problem, as long as the barrel is thick enough and the caliber large enough, it can be solved. If one §Y460,000,000mm§! solid shell can't solve it, then fire another. This technology is dedicated to creating massive cannons worthy of the Dreadnought shipgirls' magnificent bodies."
  #  近身格鬥CQC
  tech_gts_bruh_shipgirl_kinetic_sword_1: "Close Quarters Combat (CQC)"
  #  §M(Bruh系列科技)§!\n在星際時代用冷兵器聽起來很蠢？那是因為妳的刀不夠大。當火炮過熱、彈藥耗盡，或者單純只是想體驗切開金屬的手感時，一把由高密度合金鍛造的、長達數萬公里的實體長刀就是最好的夥伴。直接用一塊幾萬公里長的合金砍在敵方艦群上，比什麼雷射都管用
  tech_gts_bruh_shipgirl_kinetic_sword_1_desc: "§M(Bruh Series Technology)§!\nUsing cold weapons in the interstellar age sounds stupid? That's only because your blade isn't big enough. When cannons overheat, ammunition is exhausted, or you simply want to experience the sensation of slicing through metal, a solid long-sword forged from high-density alloy, tens of thousands of kilometers long, is your best companion. Directly hacking at enemy fleets with a tens-of-thousands-of-kilometers-long block of alloy is more effective than any laser."
  #  動態視力強化
  tech_gts_bruh_shipgirl_point_defence_1: "Dynamic Vision Enhancement"
  #  §M(Bruh系列科技)§!\n那些蒼蠅般的導彈和戰機太煩人了。通過特殊的眼球運動訓練，艦娘現在可以看清高速飛行的微小目標，並指揮近防炮將其擊落，就像拍死蚊子一樣簡單。
  tech_gts_bruh_shipgirl_point_defence_1_desc: "§M(Bruh Series Technology)§!\nThose fly-like missiles and fighters are too annoying. Through specialized eye movement training, shipgirls can now clearly see high-speed micro-targets and command point-defense guns to shoot them down, as simple as swatting mosquitoes."
  #  彈幕覆蓋理論
  tech_gts_bruh_shipgirl_flak_battery_1: "Barrage Coverage Theory"
  #  §M(Bruh系列科技)§!\n與其瞄準單個目標，不如把那一片區域全部填滿彈片。教會艦娘使用霰彈原理，向敵方機群方向噴射金屬風暴，確保沒有任何東西能穿過這道牆
  tech_gts_bruh_shipgirl_flak_battery_1_desc: "§M(Bruh Series Technology)§!\nInstead of aiming at single targets, it's better to fill the entire area with shrapnel. Teach shipgirls the principle of buckshot, spraying metal storms toward enemy squadrons to ensure nothing can pass through this wall."
  #  航空戰術理論
  tech_gts_bruh_shipgirl_strike_craft_1: "Aviation Tactical Theory"
  #  §M(Bruh系列科技)§!\n艦載機會從艦娘手中的飞行甲板(有時是一把弓)起飛，艦娘們能夠操控那些圍繞她們飛行的小傢伙，無論是通過意念連結還是簡單的無線電指揮。對於艦娘來說，它們是可愛的玩具，但對於敵人來說，這些攜帶了重型航彈和機炮的機群是致命的蜂群
  tech_gts_bruh_shipgirl_strike_craft_1_desc: "§M(Bruh Series Technology)§!\nCarrier aircraft take off from flight decks (sometimes a bow) in the shipgirls' hands. Shipgirls can control the little ones flying around them, whether through mental links or simple radio commands. To shipgirls, they are cute toys, but to the enemy, these squadrons carrying heavy aerial bombs and autocannons are a deadly swarm."
  #  基礎代謝法
  tech_gts_bruh_shipgirl_reactor_1: "Basal Metabolism Method"
  #  飢餓適應術
  tech_gts_bruh_shipgirl_reactor_2: "Hunger Adaptation Technique"
  #  暴食消化法
  tech_gts_bruh_shipgirl_reactor_3: "Gluttony Digestion Method"
  #  星體吞噬術
  tech_gts_bruh_shipgirl_reactor_4: "Celestial Devouring Technique"
  #  §M(Bruh系列科技)§!\n透過規律的飲食訓練與營養管理，讓艦娘的身體學會更有效率地轉化食物為能量。這是所有巨型生物兵器的基礎訓練課程
  tech_gts_bruh_shipgirl_reactor_1_desc: "§M(Bruh Series Technology)§!\nThrough regular dietary training and nutritional management, allow the shipgirls' bodies to learn how to convert food into energy more efficiently. This is the basic training course for all giant biological weapons."
  #  §M(Bruh系列科技)§!\n透過週期性的斷食訓練，強化艦娘在缺乏補給時的持久作戰能力。她們的身體會學習儲存並緩慢釋放能量
  tech_gts_bruh_shipgirl_reactor_2_desc: "§M(Bruh Series Technology)§!\nThrough periodic fasting training, strengthen the shipgirls' endurance during supply shortages. Their bodies learn to store and slowly release energy."
  #  §M(Bruh系列科技)§!\n極端的飢餓與飽食交替訓練，迫使艦娘的消化系統突破生理極限。她們現在能夠快速分解並吸收各種物質
  tech_gts_bruh_shipgirl_reactor_3_desc: "§M(Bruh Series Technology)§!\nExtreme patterns of fasting and feasting force the shipgirls' digestive systems to break through physiological limits. They are now able to rapidly decompose and absorb various substances."
  #  §M(Bruh系列科技)§!\n艦娘現在將恆星和行星視為零食，沒有什麼是她不能消化的
  tech_gts_bruh_shipgirl_reactor_4_desc: "§M(Bruh Series Technology)§!\nShipgirls now view stars and planets as snacks; there is nothing they cannot digest."
  #  一種輕盈優雅的戰鬥機，從艦娘的具裝中如飛鳥般掠出。雖然掛載能力有限，但它們速度極快，能像煩人的蚊子一樣圍繞敵艦旋轉，誘使敵方防空火力浪費彈藥，或者精準點殺敵方來襲的轟炸機，保護艦娘不被弄髒衣服
  gts_bruh_shipgirl_strike_craft_hangar_component_set_1_DESC: "A light and elegant fighter, darting out from the shipgirl's rigging like a bird. Although their carrying capacity is limited, they are extremely fast and can circle enemy ships like annoying mosquitoes, inducing anti-aircraft fire to waste ammunition, or precisely picking off incoming enemy bombers to keep the shipgirl's clothes from getting dirty."
  #  皮實耐造的通用型戰機，機身結構堅固到甚至能替艦娘擋下一發流彈。它們既能掛載炸彈對敵艦進行拆遷，也能在空戰中咬碎敵人的機翼
  gts_bruh_shipgirl_strike_craft_hangar_component_set_2_DESC: "Sturdy and durable multi-role aircraft, with structures so strong they can even take a stray bullet for the shipgirl. They can carry bombs for ship demolition or shred enemy wings in dogfights."
  #  "§Y它飛行緩慢，機動性幾乎為零，就像一隻笨拙的鵝§!。"\n這架轟炸機笨重得就像一塊會飛的磚頭，它幾乎沒有任何空戰能力，唯一的用途就是運送那枚FAB-5000巨型高爆航彈。但只要有一架成功飛抵敵艦，那枚炸彈產生的純粹物理衝擊波就足以震碎周圍脆弱的護盾結構，將任何護衛艦級別的目標直接氣化
  gts_bruh_shipgirl_strike_craft_hangar_component_set_3_DESC: "\"§YIt flies slowly, with almost zero maneuverability, like a clumsy goose§!.\"\nThis bomber is as heavy as a flying brick, with almost no air combat capability. Its only purpose is to deliver that FAB-5000 giant high-explosive aerial bomb. But as long as one successfully reaches the enemy ship, the pure physical shockwave from that bomb is enough to shatter fragile shield structures and vaporize any escort-level target."
  #  艦娘超光速部件
  gts_bruh_shipgirl_ftl_components: "Shipgirl FTL Components"
  #  艦娘感測器
  gts_bruh_shipgirl_sensor_components: "Shipgirl Sensors"
  #  基礎代謝
  gts_bruh_shipgirl_reactor_component_template_1: "Basal Metabolism"
  #  飢餓適應
  gts_bruh_shipgirl_reactor_component_template_2: "Hunger Adaptation"
  #  暴食消化
  gts_bruh_shipgirl_reactor_component_template_3: "Gluttony Digestion"
  #  星體吞噬
  gts_bruh_shipgirl_reactor_component_template_4: "Celestial Devouring"
  #  嬌嫩裸足
  gts_bruh_shipgirl_thruster_component_template_1: "Delicate Barefoot"
  #  防滑棉襪
  gts_bruh_shipgirl_thruster_component_template_2: "Anti-slip Cotton Socks"
  #  運動跑鞋
  gts_bruh_shipgirl_thruster_component_template_3: "Athletic Running Shoes"
  #  厚重軍靴
  gts_bruh_shipgirl_thruster_component_template_4: "Heavy Combat Boots"
  #  體表損管小隊
  gts_bruh_shipgirl_aux_component_set_1: "Surface Damage Control Squad"
  #  足汗循環系統
  gts_bruh_shipgirl_aux_component_set_3: "Foot Sweat Circulation System"
  #  陰垢清理部門
  gts_bruh_shipgirl_aux_component_set_4: "Crotch Residue Cleaning Department"
  #  乳暈採集平台
  gts_bruh_shipgirl_aux_component_set_5: "Areola Collection Platform"
  #  §M(Bruh系列輔助配件)§!\n一支居住在艦娘身上的微型工程艦隊。它們平日負責清理艦娘身上的戰鬥殘骸、縫補破損的衣物。一旦艦娘受傷，它們就會駕駛著相對於艦娘來說如蟎蟲般大小的維修車，在她廣闊的皮膚大地上飛馳，進行快速焊接和醫療噴塗作業。\n§R"主要風險是被艦娘無意識地拍死"§!
  gts_bruh_shipgirl_aux_component_set_1_DESC: "§M(Bruh Series Auxiliary Components)§!\nA micro-engineering fleet living on the shipgirl's body. They are usually responsible for cleaning battle debris and mending damaged clothes. Once the shipgirl is injured, they drive repair vehicles the size of mites relative to her, speeding across her vast skin-land to perform rapid welding and medical spray operations. \n§R\"The main risk is being unconsciously slapped to death by the shipgirl.\"§!"
  #  §M(Bruh系列輔助配件)§!\n專為長時間穿著鞋襪的艦娘設計，建立在艦娘足弓與趾縫間的複雜水利工程會攔截那毀滅性的汗液洪流。經過過濾的足汗被注入冷卻管道，帶走武器過熱的溫度，或者被儲存起來作為生活用水。當然，工作環境的氣味是一大挑戰。\n§Y"這能讓艦娘在激烈的運動戰中保持足部......相對的乾爽"§!
  gts_bruh_shipgirl_aux_component_set_3_DESC: "§M(Bruh Series Auxiliary Components)§!\nDesigned for shipgirls wearing shoes and socks for long periods, professional hydraulic engineering projects built between the shipgirl's arch and toes intercept that catastrophic flood of foot sweat. Filtered sweat is injected into cooling pipes to carry away weapon heat or stored as domestic water. Of course, the smell of the working environment is a major challenge. \n§Y\"This allows the shipgirl to keep her feet... relatively dry during intense maneuver warfare.\"§!"
  #  §M(Bruh系列輔助配件)§!\n一些建立在兩片宏偉肉唇之間的附著式建築群。這裡的居民終日生活在濕潤、溫暖且氣味獨特的環境中。專職負責清理這條巨大峽谷中的所有沉積物。這裡也是著名的旅遊勝地，儘管常因艦娘的生理反應而發生洪水。\n§Y"清潔工們每日駕駛機甲進入 maiden私處深處，挖掘並清理那些積累已久的白色垢狀物，只是有時一些人也不幸成為了其中一部分"§!
  gts_bruh_shipgirl_aux_component_set_4_DESC: "§M(Bruh Series Auxiliary Components)§!\nAttached building complexes established between two magnificent fleshy lips. The residents here live all day in a moist, warm, and uniquely scented environment, specialized in cleaning all sediments in this giant canyon. This place is also a famous tourist destination, despite frequent floods caused by the shipgirl's physiological reactions. \n§Y\"Cleaners drive mechs deep into the girl's private parts every day to dig out and clean those long-accumulated white waxy substances, though sometimes some people unfortunately become part of it themselves.\"§!"
  #  §M(Bruh系列輔助配件)§!\n錨定在乳暈褶皺上的採集站。這裡的鑽頭經過特殊軟化處理，以免刺激到艦娘。工人們日以繼夜地刮取沉積的乳垢和收集微量滲出的乳汁。\n§R"要是艦娘感到搔癢而進行抓撓，整個平臺都會面臨滅頂之災"§!
  gts_bruh_shipgirl_aux_component_set_5_DESC: "§M(Bruh Series Auxiliary Components)§!\nCollection stations anchored on the areola folds. The drills here have been specialized for softening to avoid irritating the shipgirl. Workers scrape away accumulated areola residue and collect trace amounts of seeping milk day and night. \n§R\"If the shipgirl feels itchy and scratches, the entire platform will face total destruction.\"§!"
  #  貪婪之口
  gts_bruh_shipgirl_arua_1: "Greedy Mouth"
  #  §M(Bruh系列光環部件)§!\n艦娘那張足以吞噬衛星的櫻桃巨口，此刻對於敵方艦隊而言就是通往地獄的大門。當她微微張開雙唇，那如山脈般潔白整齊的牙齒便展露無遺，嘴角拉絲的黏稠唾液如同幾萬公里長的軌道電梯纜繩般在太空中飄蕩。隨著她那濕熱且帶有濃郁甜腥味的口氣呼出，含有高濃度消化酶的水霧瞬間覆蓋了敵艦的感測器。這種即將被作為食物咀嚼、吞嚥並在胃酸中悲慘消化的原始生物恐懼，直接擊穿了敵方船員的心理防線。在這種被捕食者盯上的極度恐慌中，敵軍炮手顫抖不已，導致火控系統的命中率大幅下降，因為沒有人能在即將滑入食道的絕望中保持冷靜瞄準
  gts_bruh_shipgirl_arua_1_DESC: "§M(Bruh Series Aura Components)§!\nThe shipgirl's cherry-red giant mouth, capable of swallowing satellites, is now the gateway to hell for the enemy fleet. When her lips part slightly, those mountain-like white and neat teeth are fully revealed, with viscous saliva trailing like tens-of-thousands-of-kilometers-long space elevator cables. As her warm, sweet-and-bloody scented breath exhales, a high-concentration digestive enzyme mist instantly covers enemy sensors. This primitive biological fear - of being chewed, swallowed, and tragically digested in stomach acid - directly pierces the enemy crews' psychological defenses. In this extreme panic of being targeted by a predator, enemy gunners tremble, causing fire control accuracy to drop sharply, as no one can maintain a calm aim in the despair of about to slide down an esophagus."
  #  淫靡之穴
  gts_bruh_shipgirl_arua_2: "Lewd Aperture"
  #  §M(Bruh系列光環部件)§!\n艦娘刻意將她濕潤的陰唇對準敵方艦隊方向，那道粉嫩的縫隙散發著強烈的雌性氣息和溫熱的水氣。敵艦的船員會不由自主地將視線鎖定在那個禁忌的部位。這種視覺衝擊完全破壞了敵方的戰術紀律，許多艦船的艦長會發現自己無法下達撤退命令，因為他們的理智已被那個濕潤的深谷所吸引。更有甚者，部分敵艦會不受控制地向艦娘靠近，彷彿被一種原始的渴望驅使著飛蛾撲火。這種異常行為讓敵方艦隊的撤退效率極度低下，許多本該逃脫的戰艦因為猶豫或偏航而暴露在火力範圍內，最終被我方艦隊或艦娘本人輕易殲滅
  gts_bruh_shipgirl_arua_2_DESC: "§M(Bruh Series Aura Components)§!\nThe shipgirl deliberately aims her moist labia toward the enemy fleet, that pink slit emitting a strong female aura and warm steam. Enemy crews involuntarily lock their gazes onto that forbidden part. This visual impact completely destroys enemy tactical discipline; many captains find themselves unable to issue retreat orders because their reason has been captured by that moist deep valley. Some enemy ships even approach the shipgirl uncontrollably, as if driven by a primitive desire like moths to a flame. This abnormal behavior makes enemy retreat efficiency extremely low, as many combatants who should have escaped are exposed to fire due to hesitation or deviation, ultimately being easily annihilated by our fleet or the shipgirl herself."
  #  吸引之乳
  gts_bruh_shipgirl_arua_3: "Attractive Breasts"
  #  §M(Bruh系列光環部件)§!\n這對懸浮在星海之中的巨大乳房，以其驚人的質量成為了戰場上最無法忽視的存在。隨著艦娘在戰鬥中的每一個動作，這兩團柔軟的半球體都會產生劇烈的乳搖。那白皙細膩的肌膚在星光的反射下熠熠生輝，而頂端那如同粉色平原般巨大的乳暈和挺立的乳首更是吸引了敵方所有的注意力。敵方炮手在瞄準時，視線會不由自主地被這充滿彈性的雙乳所捕獲，大腦中充滿了對其手感與溫度的性幻想，從而忘記了裝填彈藥或扣動扳機。這種源自生物本能的強烈分心效應，使得敵方艦隊的整體射擊頻率出現斷崖式下跌，無人能將目光從這宏偉的景觀上移開
  gts_bruh_shipgirl_arua_3_DESC: "§M(Bruh Series Aura Components)§!\nThese massive breasts floating in the star-sea, with their staggering mass, become the most unavoidable presence on the battlefield. With every movement of the shipgirl in battle, these two soft hemispheres produce violent breast shakes. The fair and delicate skin shimmers in the star-light, while the continent-sized areolas and erect nipples at the tips captivate all enemy attention. Gunner's gazes are involuntarily captured by these elastic breasts, their minds filled with sexual fantasies about their feel and temperature, forgetting to reload or pull the trigger. This intense distraction, rooted in biological instinct, causes enemy fire frequency to drop off a cliff, as no one can look away from this magnificent landscape."
  #  穢臭之菊
  gts_bruh_shipgirl_arua_6: "Filthy Anus"
  #  §M(Bruh系列光環部件)§!\n當艦娘將她緊閉的肛門對準敵方機群方向時，即使沒有實際排泄物釋放，那個褐色的褶皺洞口本身就散發著一種令人作嘔的視覺壓迫感。敵方艦載機的飛行員會因為看到那個巨大的排泄口而產生強烈的噁心反應，許多人會在駕駛艙內乾嘔甚至直接嘔吐，導致操控精度大幅下降。更糟糕的是，這種心理陰影會持續存在，許多飛行員在目睹艦娘的肛門後會產生創傷後應激反應，在之後的戰鬥中只要看到類似的圓形結構就會不由自主地回想起那個恐怖的畫面，從而導致敵方艦載機部隊的整體戰鬥力持續衰減
  gts_bruh_shipgirl_arua_6_DESC: "§M(Bruh Series Aura Components)§!\nWhen the shipgirl aims her tightly closed anus at the enemy aircraft squadrons, even without actual excrement being released, the brown-folded opening itself emanates a nauseating visual pressure. Enemy carrier pilots experience a strong gag reflex upon seeing that giant excretory opening; many dry-heave or vomit in the cockpit, causing maneuvering precision to drop sharply. Even worse, this psychological shadow persists; many pilots develop PTSD after witnessing the shipgirl's anus, involuntarily recalling the terrifying image whenever they see similar circular structures in subsequent battles, leading to sustained degradation of the enemy's overall combat effectiveness."
