  gts_event_bruh_shipgirl.0002.desc: "Inside the defense control center of §Y[From.GetName]§!, alarm sirens have long been blaring across the skies.\\n\\nThis world of tens of billions is currently facing the most terrifying existential crisis since its inception.\\n\\nOutside the atmosphere, the massive body of $gts_bruh_shipgirl_ship_sizes_3_short$, spanning millions of kilometers, stands quietly, completely blocking the starlight of §Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!. The entirety of §Y[From.GetName]§! is engulfed in the shadow cast by her magnificent frame.\\n\\nIn sheer terror, the government of §Y[From.GetName]§! issued an all-out assault order. Tens of thousands of orbital defense cannons, fortress batteries, and planetary-scale particle beams fired simultaneously. A sky full of intertwined death rays and kinetic warheads rained upward against the void, slamming fiercely against the fair, slender thighs and lower abdomen of $gts_bruh_shipgirl_ship_sizes_3_short$.\\n\\nYet this terrifying firepower, capable of vaporizing entire fleets, produced only a faint itch akin to a gentle breeze against her tender, delicate skin.\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$'s cheeks flushed an enticing crimson, her eyes welling with bashful tears. Feeling acutely self-conscious, she squeezed her rounded thighs together in sheer embarrassment.\\n\\nNonetheless, having received orders from command, she had no choice but to execute this cruel mandate.\\n\\n§M\"I-I'm sorry... Command's orders are absolute... I have to... insert your world... Could you please stop resisting so futilely...?\"§!\\n\\nHer soft, timid voice came through the comm channel, gentle yet carrying irresistible pressure.\\n\\nAmidst her apologetic whispers, she lifted her slender fingers and gently slipped aside her pure white panties, already soaked with love fluid, exposing the soft pink blossom radiating an intense female fragrance.\\n\\nUnder the despairing gaze of countless inhabitants, two colossal, fair fingertips descended like pillars of heaven, pinching the entire planet with ease.\\n\\nThe instant fingertips contacted the surface, towering mountains were ground into plains, and multiple industrialized continents disintegrated beneath the ridges of her fingerprints.\\n\\n§M\"I-It's going in now...\"§!\\n\\nAlmost weeping from shame, $gts_bruh_shipgirl_ship_sizes_3_short$ slowly aligned the pinched enemy world with her aperture, then gently rocked her hips forward, pushing the entire planet tens of thousands of kilometers in diameter deep into her tight canal!\\n\\n§R\"Squelch... squelch...\"§!\\n\\nBoundless moist flesh immediately pressed in from all directions. The enemy world's planetary shields shattered into dust like fragile eggshells the moment they contacted her fleshy folds.\\n\\nImmense internal pressure closed in from every angle, crushing the crust layer by layer. Surging magma was instantly doused by copious floods of thick love fluid.\\n\\n§V\"No! Walls of flesh! Our entire world is being pushed into a giantess's aperture!\"§!\\n\\nFinal agonizing wails and cries from tens of billions echoed through planetary broadcasts, only to be promptly swallowed by the wet noises of compression.\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ pressed her legs firmly together, her slender frame trembling softly as her hands stroked her lower abdomen, savoring the intense pleasure of §Y[From.GetName]§! being crushed by walls of flesh within her.\\n\\n§M\"Squish... crack... crunch...\"§!\\n\\nWithin mere minutes, §Y[From.GetName]§!'s tectonic plates, metallic core, and tens of billions of lives were ground down into microscopic residue, vanishing completely into her hot, viscous love fluid."
#  全頻段通訊頻道中充斥著來自§Y[From.GetName]§!政府崩潰般的哭喊與哀求。\n\n§V"偉大的艦娘大人！我們願意無條件投降！我們願意獻出所有的資源與技術，成為您最卑微的奴隸！求求您接受談判，停止這種可怕的舉動吧！"§!\n\n§Y[From.GetName]§!上的數十億居民透過天文望遠鏡，看著懸浮在大氣層外的那位比星球還要龐大無數倍的艦娘，無數人跪在地表上痛哭祈禱。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$聽著耳機裡傳來的淒慘求救聲，嬌嫩的臉蛋上布滿了愧疚與害羞的紅暈。\n\n她的性格可沒那麼大膽，但來自最高指揮部的命令已經鎖定了她的腦域，命令她必須以最徹底的方式將該星球消滅。\n\n§M"嗚...對不起...我也好想接受你們的降服...我也很不想要這樣做..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$害羞地低下了頭，聲音中帶著濃濃的委屈與歉意。\n\n§M"但是...指揮部剛剛下達了命令...如果我不執行...我就會被懲罰...對不起...對不起...請你們原諒我..."§!\n\n她話說完，雙手抖抖索索地解開了軍裝裙襬，將那條緊繃的內褲拉至大腿根部，暴露出了那處正因緊張與害羞而大量分泌著愛液的狹窄粉穴。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$伸出那巨大而溫柔的手掌，將這顆不斷發出求和訊號的星球捏起。\n\n§Y[From.GetName]§!上的居民絕望地看著天空被一隻潔白的巨手完全覆蓋，隨後整顆星球被不可抗拒的力量帶向了那片瀰漫著濃烈腥香的粉紅深淵。\n\n§M"咕啾...咕唧..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$閉上雙眼，帶著極度的羞恥，將§Y[From.GetName]§!貼上了自己的穴口，然後小心翼翼地向內推入。\n\n狹窄的穴壁順著星球的弧度被撐開，滾燙濕滑的軟肉將§Y[From.GetName]§!嚴絲合縫地包覆起來。\n\n§V"啊啊啊！求求您！住手啊啊啊！...咕嚕咕嚕...."§!\n\n§Y[From.GetName]§!的領袖聲戛然而止，因為整顆星球已經完全滑入了她的陰道深處，再也接收不到任何訊息了。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$發出一聲甜膩的哼聲，害羞地將雙腿交叉疊在一起。\n\n§M"對不起...但我會努力讓你們快點結束的..."§!\n\n她輕聲說道，隨後控制著小穴進行劇烈的收縮與蠕動。\n\n幾百億噸的膣壓將肉壁間的每一道褶皺都變成了粉碎星球的磨盤。\n\n§M"啪嚓...啪唧..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$感受著私處傳來的異物感，羞得將臉埋進了雙手之中。\n\n幾分鐘後，那顆承載著數十億求和生靈的星球，已經在她的小穴深處被徹底碾碎溶化，變成了純粹的愛液與陰垢，再也找不到半點存在過的痕跡。
  gts_event_bruh_shipgirl.0003.desc: "This is an execution, and a carnival. The Dreadnought Shipgirl has long since lost patience with these stubborn little bugs. She grabs §Y[From.GetName]§!, like grabbing a grape ready to be burst. The enemy's counterattacks hitting her delicate skin only cause a slight itch, which instead further excites her sadistic desires. \"Die, little bugs.\" With this nonchalant sentence, she crudely thrusts the entire planet into her aperture. The planet burns inside her; she excitedly tightens her legs, while billions of tons of vaginal muscle exert force simultaneously. A second before the planet's core can no longer withstand the pressure and explodes, all life on the surface has already been crushed into pulp in despair. Next, a galaxy-level intense orgasm sweeps through her entire body. She lets out a sweet moan as the planet within her aperture completely disintegrates under this destructive contraction. When everything settles, still craving more, she digs out several fragments of continental plates from her aperture with her fingers and casually flicks them into deep space. §Y[From.GetName]§! no longer exists."
#  三天前，§Y[From.GetName]§!被$gts_bruh_shipgirl_ship_sizes_3_short$按照命令硬生生塞入了陰道深處。\n\n然而，§Y[From.GetName]§!的地底藏有擁有極其罕見的上古防護罩技術，在被塞入小穴的瞬間，它們開啟了覆蓋全星的終極防禦壁，竟然在緊緻肉壁的包夾下，硬生生撐開了一個微小的生存空間。\n\n§Y[From.GetName]§!的科學家們狂喜萬分，以為憑藉這層護盾就能在巨娘的穴內苟延殘喘，甚至等待拯救。\n\n然而，它們完全低估了體型差距帶來的絕望現實。\n\n對於$gts_bruh_shipgirl_ship_sizes_3_short$來說，這顆帶著護盾的星球實在是太過微小了，小到就像是卡在她小穴褶皺深處的一粒微不足道的細沙。\n\n雖然它讓$gts_bruh_shipgirl_ship_sizes_3_short$這幾天總覺得有點微妙的異物感，但她甚至根本沒感覺到那層防護罩的存在。\n\n這天，另一位執行巡邏任務的$gts_bruh_shipgirl_ship_sizes_1_short$途經此星系，兩位巨大的少女便在星空中停下腳步，愉快地交談起來。\n\n§B"哎呀，今天怎麼看妳姿態怪怪的？雙腿一直蹭來蹭去，胯下夾了什麼好玩的嗎？"§!\n\n$gts_bruh_shipgirl_ship_sizes_1_short$看著她那泛紅的臉頰，打趣地問道。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$臉頰瞬間燙得像要冒煙，雙手慌亂地擺動著，害羞地低語道。\n\n§M"沒...沒有啦！只是...前幾天照命令把敵人的星球推進小穴裡了...好像叫什麼...什麼...§Y[From.GetName]§!之類的"§!\n\n$gts_bruh_shipgirl_ship_sizes_1_short$聞言哈哈大笑，大大咧咧地伸出手，拍了拍$gts_bruh_shipgirl_ship_sizes_3_short$的屁股。\n\n§B"哈哈！那種小蟲子一樣的星球，妳居然還特意去記著它？看我的！"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$被$gts_bruh_shipgirl_ship_sizes_1_short$突然拍打屁股，嬌軀猛地一震，害羞得驚呼出聲。\n\n§M"嗚啊！不要亂摸啦！"§!\n\n在這一瞬間的驚嚇與害羞下，$gts_bruh_shipgirl_ship_sizes_3_short$的雙腿不自覺地猛烈夾緊，陰道肌肉也隨之發生了一次尋常的本能痙攣與劇烈收縮。\n\n§R"啪嚓！"§!\n\n陰道深處，§Y[From.GetName]§!人引以為傲、苦苦支撐了三天的終極護盾，在巨娘小穴這無意識的夾緊下，就像一片薄脆的洋芋片般瞬間碎成了漫天光屑！\n\n緊接著，幾萬公里厚的粉紅軟肉帶著億萬噸的恐怖肉壓轟然合攏。\n\n§R"咕唧...啪唧...咕啾..."§!\n\n§Y[From.GetName]§!連同上面幾百億還在慶幸倖存的居民，在一微秒內就被碾成了陰垢！\n\n愛液如海嘯般滾滾而過，將它們存在過的痕跡沖刷得乾乾淨淨。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$捂著臉，完全不知道自己剛才隨口的打鬧已經將一個星球徹底抹去。\n\n她只是覺得穴中那股微弱的異物感瞬間消失了，取而代之的是一股極其舒爽的濕潤感。\n\n§M"討厭啦...剛才一下子用力過頭...好像直接把它壓碎了..."§!\n\n她羞澀地說道。\n\n$gts_bruh_shipgirl_ship_sizes_1_short$不在意地揮了揮手。\n\n§B"碎了就碎了嘛，反正本來就是上級要求銷毀的垃圾。走吧，去吃點行星當零食！"§!\n\n兩位巨大少女笑著結伴遠去，而在$gts_bruh_shipgirl_ship_sizes_3_short$那深邃濕熱的花穴深處，那顆星球連同它的護盾，早已化為了無法分清的愛液痕跡。
  gts_event_bruh_shipgirl.0004.desc: "Three days ago, §Y[From.GetName]§! was shoved deep into the canal of $gts_bruh_shipgirl_ship_sizes_3_short$ per orders.\\n\\nHowever, hidden beneath §Y[From.GetName]§! was ancient force field technology. The moment it was inserted into her aperture, they activated an ultimate planetary shield, remarkably holding open a tiny pocket of survival space amid the crushing embrace of tight flesh walls.\\n\\nThe scientists of §Y[From.GetName]§! rejoiced, believing they could endure within the giantess's depths until rescued.\\n\\nYet they utterly underestimated the despair of their difference in scale.\\n\\nTo $gts_bruh_shipgirl_ship_sizes_3_short$, this shielded world was so minuscule that it felt like an insignificant grain of sand caught deep within the folds of her aperture.\\n\\nWhile it gave her a slight foreign sensation over the past few days, she hadn't even noticed the existence of that shield.\\n\\nOn this day, another $gts_bruh_shipgirl_ship_sizes_1_short$ on patrol passed through the system. The two colossal maidens paused in the void and chatted merrily.\\n\\n§B\"My, why are you posing so strangely today? Rubbing your thighs together non-stop—are you clutching something fun between your legs?\"§!\\n\\nNoticing her flushed cheeks, $gts_bruh_shipgirl_ship_sizes_1_short$ teased.\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$'s cheeks burned with heat. She waved her hands in flustered embarrassment, whispering shyly:\\n\\n§M\"N-No! It's just... a few days ago, following orders, I pushed the enemy's world into my aperture... I think it was called... what was it... §Y[From.GetName]§! or something.\"§!\\n\\nHearing this, $gts_bruh_shipgirl_ship_sizes_1_short$ burst into hearty laughter and casually slapped $gts_bruh_shipgirl_ship_sizes_3_short$'s rear.\\n\\n§B\"Haha! A bug-like planet like that, and you actually bothered to remember it? Watch this!\"§!\\n\\nStruck on the rear so suddenly by $gts_bruh_shipgirl_ship_sizes_1_short$, $gts_bruh_shipgirl_ship_sizes_3_short$'s delicate frame shuddered, and she cried out in embarrassment:\\n\\n§M\"Waaa! Don't go touching me like that!\"§!\\n\\nIn that split second of shock and bashfulness, $gts_bruh_shipgirl_ship_sizes_3_short$'s legs reflexively clamped tightly together, and her internal muscles underwent an instinctual spasm and fierce contraction.\\n\\n§R\"CRACK!\"§!\\n\\nDeep within her canal, the ultimate shield that the people of §Y[From.GetName]§! had maintained for three days shattered into a glittering cloud of debris like a fragile wafer beneath this unconscious clench of the giantess's aperture!\\n\\nImmediately after, tens of thousands of kilometers of thick pink soft flesh slammed together with billions of tons of crushing pressure.\\n\\n§R\"Squish... crush... squelch...\"§!\\n\\n§Y[From.GetName]§!, along with tens of billions of residents still celebrating their survival, was crushed into residue within a microsecond!\\n\\nLove fluid surged past like a tsunami, washing away every last trace of their existence.\\n\\nCovering her face, $gts_bruh_shipgirl_ship_sizes_3_short$ was completely oblivious that her casual banter had just erased an entire world.\\n\\nShe only felt that the faint foreign sensation had instantly vanished, replaced by an immensely pleasurable, wet warmth.\\n\\n§M\"Oh dear... I used a bit too much force just now... I think I crushed it completely...\"§!\\n\\nShe murmured bashfully.\\n\\n$gts_bruh_shipgirl_ship_sizes_1_short$ waved her hand nonchalantly:\\n\\n§B\"Crushed is crushed; it was just trash ordered for disposal anyway. Come on, let's go grab some planets for a snack!\"§!\\n\\nThe two giant maidens laughed as they departed together, while deep within the warm depths of $gts_bruh_shipgirl_ship_sizes_3_short$'s aperture, the planet and its shield had long since turned into indistinguishable traces of love fluid."
#  無畏艦娘收到了新的指令。她並沒有像往常那樣直接動手摧毀§Y[From.GetName]§!，而是帶著一絲羞澀與興奮，緩紓解開了腰間的繫帶。對於§Y[From.GetName]§!上的居民來說，這是一場香艷而絕望的災難。天空被巨大的陰影遮蔽，那不是烏雲，而是帶著藍白條紋的巨大織物。隨著艦娘將那條還帶著體溫的胖次褪下，濃烈的雌性氣息瞬間衝垮了大氣循環。她雙手撐開那條足以容納世界的內褲，像捕捉螢火蟲一樣，將整顆星球溫柔而堅定地兜了進去。星球表面的通訊在那一刻被徹底切斷，最後傳回的畫面只有白色的棉質穹頂和艦娘那因為羞恥而微微泛紅的巨臉。
  gts_event_bruh_shipgirl.0021.desc: "The Dreadnought Shipgirl received new orders. She didn't directly move to destroy §Y[From.GetName]§! as usual, but instead, with a hint of shyness and excitement, slowly unfastened the tie at her waist. For the residents of §Y[From.GetName]§!, this was an erotic and desperate disaster. The sky was covered by a massive shadow, which was not clouds, but a giant blue and white striped fabric. As the shipgirl removed her panties, still carrying her body heat, the intense female aura instantly collapsed the atmospheric circulation. She held open the panties—large enough to hold a world—and like catching a firefly, gently yet firmly scooped the entire planet inside. All surface communications were completely cut off at that moment, with the last transmitted image being the white cotton dome and the shipgirl's massive face slightly flushed with shame."
