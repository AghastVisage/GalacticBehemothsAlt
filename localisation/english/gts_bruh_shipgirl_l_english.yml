#  §M"咦?這顆星球怎麼灰濛濛的？"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$好奇地打量著手中這顆被厚重雲層覆蓋的星球。\n\n透過感測器的分析，她得知§Y[From.GetName]§!是一顆經歷過核戰爭的廢土世界，地表溫度極低，到處都是輻射塵埃。\n\n§M"原來是自己把自己玩壞了啊，那我就不客氣地回收利用了。"§!\n\n她能看見星球表面那些殘存的廢墟城市，高樓大廈只剩下扭曲的鋼筋骨架，街道上堆滿了白骨和瓦礫。\n\n少數倖存者躲在地下掩體中，靠著僅存的罐頭食品苟延殘喘。\n\n它們已經在這個冰冷的地獄中掙扎了數十年，等待著一個永遠不會到來的春天。\n\n§M"不過，與其在那裡慢慢等死，不如讓我給你們一個痛快的結局吧。"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$一邊說著，一邊將手伸向了自己的下體。\n\n她今天穿的是一條黑色蕾絲內褲，鏤空的花紋若隱若現地展示著裡面的肌膚。\n\n她慢慢將內褲往下拉，濕潤的襠部與陰唇分離時發出"嗤啦"的聲響。\n\n內褲被完全脫下後，可以看見上面沾滿了乾涸的愛液和一些白色的陰垢。\n\n$gts_bruh_shipgirl_ship_sizes_3_short$隨手將內褲丟向一旁，然後張開雙腿，露出了那片已經濕潤的秘裂。\n\n陰唇微微腫脹，陰蒂也已經勃起，可以清楚地看見那顆敏感的肉芽從包皮中探出頭來。\n\n§M"來吧，讓我的小穴溫暖你們這些可憐的小蟲子。"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$將星球對準了自己濕潤的陰唇縫隙，然後毫不猶豫地塞了進去。\n\n§M"嗯啊..."§!\n\n她發出一聲舒服的呻吟，小穴的入口被星球撐開，大量的愛液被擠壓出來，順著陰唇流下。\n\n星球表面的輻射塵埃首先接觸到了濕熱的穴壁，那些懸浮在空氣中的放射性粒子被愛液吸附，然後隨著穴壁的蠕動被帶入更深處。\n\n地下掩體中的倖存者感受到了劇烈的震動，它們驚恐地發現，掩體的天花板竟開始滲水。\n\n但那不是水，而是$gts_bruh_shipgirl_ship_sizes_3_short$的愛液，帶著濃烈的腥味，從裂縫中滲透進來。\n\n§M"啊...好冰啊..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$皺了皺眉，星球表面的低溫讓她的小穴感到一陣寒意。\n\n但很快，小穴內部的溫度就開始融化星球表面的冰層。\n\n核冬天的冰雪在融化，化為水蒸氣，充滿了整個大氣層。\n\n§M"嗯...暖和多了..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$滿意地說道，她開始有節奏地收縮小穴。\n\n每一次收縮，都會讓星球表面產生毀滅性的地震。\n\n那些本就搖搖欲墜的廢墟建築徹底倒塌，掩體的混凝土牆壁龜裂，倖存者們的最後庇護所也被摧毀。\n\n小穴分泌出更多的愛液，這些黏稠的液體滲透進星球地殼的每一條裂縫。\n\n那些藏在地下深處的倖存者發現，它們的掩體正在被一種黏稠的液體淹沒。\n\n它們試圖逃跑，但門已經被堵死。\n\n愛液不斷湧入，很快就淹沒了它們的腳踝、腰部、胸口，最後是頭頂。它們的結局便是在黏稠的愛液中窒息而死。\n\n§M"啊啊...這種冰冰涼涼又慢慢變暖的感覺真好..."§!\n\n輻射塵埃、核廢料、變異生物，全都在軟肉的輾壓下被粉碎、融化，成為$gts_bruh_shipgirl_ship_sizes_3_short$愛液的一部分。\n\n整顆星球的核心終於承受不住壓力，在一聲巨響中爆炸，但這聲響被厚實的肉壁完全吸收，一點也沒傳出小穴。\n\n§M"唔...好刺激..."§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$能感覺到星球核心爆炸時產生的震動，那種快感讓她忍不住夾緊雙腿，更用力地收縮小穴。\n\n§M"呼...總算處理掉了一個垃圾星球。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$滿足地喘息著，她伸手撫摸著自己的小腹，似乎還能感覺到裡面殘留的餘溫。\n\n§M"不過這輻射...應該不會讓我生病吧？"§!\n\n她有些擔心地想著，但很快就搖了搖頭。\n\n§M"算了，反正我的身體這麼強壯，一點輻射不算什麼。"§!\n\n她撿起剛才丟在一旁的內褲，抖了抖上面的衛星殘骸，然後重新穿上。\n\n濕潤的襠部緊貼著陰唇，讓她發出一聲舒服的嘆息。\n\n§M"好了，下一個目標是哪裡呢？"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$一邊整理著裙子，一邊查看著星圖，尋找著下一個可以用來自慰的星球。
  gts_event_bruh_shipgirl.0010.desc: "§M\"Huh? Why is this planet so gloomy and gray?\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ curiously examined the heavy cloud-covered world in her hands.\\n\\nSensor analysis revealed that §Y[From.GetName]§! was a post-nuclear wasteland world with freezing surface temperatures and radioactive dust everywhere.\\n\\n§M\"Oh, so you broke yourselves? Then I'll gladly recycle you.\"§!\\n\\nShe could see the ruined cities on the surface—skyscrapers reduced to twisted steel frames, streets littered with bones and debris.\\n\\nA handful of survivors hid inside underground bunkers, barely surviving on canned rations.\\n\\nThey had struggled in this frozen purgatory for decades, waiting for a spring that would never arrive.\\n\\n§M\"Still, rather than slowly rotting away there, let me grant you a swift release.\"§!\\n\\nAs she spoke, $gts_bruh_shipgirl_ship_sizes_3_short$ reached toward her lower body.\\n\\nToday she wore black lace panties, the openwork patterns faintly displaying the skin beneath.\\n\\nShe slowly pulled down the panties, the damp crotch peeling away from her folds with a faint hiss.\\n\\nOnce fully removed, the fabric showed dried stains of love fluid and white intimate residue.\\n\\nTossing the panties aside, $gts_bruh_shipgirl_ship_sizes_3_short$ parted her legs, exposing her glistening crevice.\\n\\nHer intimate lips were slightly swollen, her clitoris erect and peeking out sensitive from its hood.\\n\\n§M\"Come, let my aperture warm you pitiful little bugs.\"§!\\n\\nAligning the world with her damp slit, $gts_bruh_shipgirl_ship_sizes_3_short$ pushed it inward without hesitation.\\n\\n§M\"Mmm, ah...\"§!\\n\\nShe let out a pleasant moan as the entrance stretched around the sphere, squeezing out copious amounts of love fluid that trickled down her folds.\\n\\nRadioactive dust on the surface first touched the hot, humid walls of flesh, particles absorbed by love fluid and dragged deeper by the canal's writhing.\\n\\nSurvivors in the underground bunkers felt violent tremors, noticing in horror that their bunker ceilings began to leak.\\n\\nYet it was not water, but $gts_bruh_shipgirl_ship_sizes_3_short$'s love fluid—carrying a pungent, musky aroma as it seeped through the cracks.\\n\\n§M\"Ah... so cold...\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ furrowed her brow slightly as the planet's sub-zero temperature sent a chill through her canal.\\n\\nSoon, however, her internal warmth began melting the planet's ice sheets.\\n\\nNuclear winter snow melted into steam, saturating the atmosphere.\\n\\n§M\"Mmm... much warmer...\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ remarked with pleasure as she rhythmically contracted her canal.\\n\\nEach contraction triggered devastating earthquakes on the surface.\\n\\nTeetering ruins collapsed completely, concrete bunker walls cracked, and the survivors' last sanctuaries shattered.\\n\\nHer aperture secreted more love fluid, the viscous liquid seeping into every tectonic fracture.\\n\\nSurvivors hiding deep underground found their shelters flooded by thick fluid.\\n\\nThey attempted to flee, but exits were blocked.\\n\\nLove fluid surged in relentlessly, submerging ankles, waists, chests, and finally heads, drowning them in viscous warmth.\\n\\n§M\"Ahhh... this chilly sensation gradually turning warm feels wonderful...\"§!\\n\\nRadioactive dust, nuclear waste, and mutated beasts were all crushed, melted, and incorporated into $gts_bruh_shipgirl_ship_sizes_3_short$'s love fluid beneath her soft flesh.\\n\\nThe planetary core finally gave way under pressure, detonating with a muffled roar completely absorbed by her thick fleshy walls.\\n\\n§M\"Mmm... so stimulating...\"§!\\n\\nFeeling the vibrations of the core's detonation, $gts_bruh_shipgirl_ship_sizes_3_short$ clamped her legs tightly, contracting her aperture with greater force.\\n\\n§M\"Phew... finally disposed of another trash world.\"§!\\n\\nPanting in satisfaction, $gts_bruh_shipgirl_ship_sizes_3_short$ stroked her lower belly, still feeling residual warmth within.\\n\\n§M\"Though I wonder... this radiation won't make me sick, right?\"§!\\n\\nShe worried briefly before shaking her head.\\n\\n§M\"Whatever, with a body as strong as mine, a little radiation is nothing.\"§!\\n\\nShe picked up her discarded panties, shook off satellite debris, and pulled them back on.\\n\\nThe damp crotch pressed against her folds, drawing a contented sigh.\\n\\n§M\"Now then, where to next?\"§!\\n\\nStraightening her skirt, $gts_bruh_shipgirl_ship_sizes_3_short$ checked the star chart, searching for the next planet to use for her pleasure."
#  至少...他們的痛苦結束了
  gts_event_bruh_shipgirl.0010.a: "At least... their suffering has ended"
#  荒蕪星球的終結
  gts_event_bruh_shipgirl.0011.name: "End of the Barren World"
#  通訊頻道中傳來$gts_bruh_shipgirl_ship_sizes_3_short$慵懶的聲音。\n\n§M"指揮部，我在§Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§!星系發現了一顆毫無價值的荒蕪星球。"\n\n"表面連微生物都沒有，就是一團死寂的石頭......"§!\n\n她頓了頓，語氣中帶著玩味。\n\n§M"這種廣闊無垠的宇宙荒地，不拿來利用一下實在太浪費了呢。"§!\n\n§Y[From.GetName]§!靜靜地懸浮在黑暗的太空中，表面布滿了隕石坑與風化的岩層，死寂得如同一具冰冷的屍體。\n\n然而當一隻修長白皙的巨手從畫面邊緣伸入時，這顆直徑數千公里的星球在那五根纖細手指面前，竟顯得如此渺小。\n\n那些在地質學家眼中高聳入雲的山脈，此刻不過是她指紋紋路間的微小顆粒。\n\n§M"完全感覺不到任何生命的氣息，就像一顆冰冷的彈珠......"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$修長的手指收攏，將整顆星球握在掌心，她微微用力，測試著這顆岩石星球的硬度。\n\n§M"硬度還不錯嘛......至少不會一捏就碎掉。"§!\n\n她輕笑著說道，聲音中透著某種令人不安的期待。\n\n§M"指揮部應該不介意我......稍微測試一下它的耐久度吧？"§!\n\n她眨了眨眼，沒有等待回覆，另一隻手已經開始解開制服下擺的鈕扣。\n\n§M"畢竟......這種毫無用處的荒蕪星球，拿來做這種事情應該沒人會心疼吧？"\n\n§!$gts_bruh_shipgirl_ship_sizes_3_short$舔了舔嘴唇，裙襬被掀起，露出黑色的蕾絲內褲，那片神秘的三角地帶散發著微微的熱氣，在真空的宇宙中形成一片霧氣繚繞的禁區。\n\n她的手指勾住內褲邊緣，將這層最後的遮蔽物緩緩褪下。\n\n當那對飽滿豐潤的陰唇完全暴露在真空中時，一股濃郁的雌性氣息瞬間擴散開來，兩片肉唇微微張開，露出內裡粉嫩濕潤的軟肉，以及那個深不見底、足以吞噬一切的黑暗入口。\n\n§M"來吧......讓我看看你能在裡面堅持多久。"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$將手中的星球對準了那個濕潤的洞口，然後緩緩地、一點一點地將其推送進去。\n\n兩片柔軟的肉瓣包裹住了這顆冰冷的星球，將它一寸一寸地吞入。\n\n那些堅硬的岩層在肉壁擠壓下，發出"咔嚓咔嚓"的碎裂聲，地殼開始龜裂，巨大的裂縫如同傷口般在星球表面蔓延開來，從中噴湧出熾熱的岩漿。\n\n§M"啊......真舒服......"§!\n\n$gts_bruh_shipgirl_ship_sizes_3_short$的呼吸變得急促起來，臉頰泛起誘人的紅暈，她沒有停下動作，繼續將星球往更深處推送。\n\n穴壁的蠕動變得更加劇烈，一波接一波的收縮如同海浪般拍打在星球表面，每一次都會帶走大片的岩石碎屑，星球正在以肉眼可見的速度縮小，那些曾經高聳的山脈被碾平，深邃的峽谷被填滿，整個地表都在這股無法抗拒的力量下重塑著形狀。\n\n當星球的最後一部分完全沒入那個粉紅色的洞穴時，她的身體劇烈地顫抖起來，一股濃稠的愛液從小穴深處噴湧而出，如同洪水般澆灌在星球表面，徹底淹沒了那顆已經四分五裂的星球。\n\n§M"哈啊......!"§!\n\n伴隨著$gts_bruh_shipgirl_ship_sizes_3_short$高亢的嬌吟，膣壁開始了最後的絞殺。\n\n那些已經布滿裂縫的岩層在這股究極的壓力下徹底崩潰，整顆星球在小穴深處爆裂開來，化作無數細小的碎片，與愛液混合成一團黏稠的漿液。\n\n良久，$gts_bruh_shipgirl_ship_sizes_3_short$才從高潮的餘韻中恢復過來。\n\n她伸手撫摸著微微隆起的小腹，滿足地嘆了口氣。\n\n§M"嗯......果然，即使是毫無價值的荒蕪星球，也能帶來不錯的快感呢......"§!
  gts_event_bruh_shipgirl.0011.desc: "The languid voice of $gts_bruh_shipgirl_ship_sizes_3_short$ came over the communication channel:\\n\\n§M\"Command, I found a worthless barren world in the §Y[event_target:gts_event_bruh_shipgirl_event_solar_system.GetName]§! system.\\n\\nNot even a microbe on the surface, just a dead clump of rock...\"§!\\n\\nShe paused, her tone laced with amusement:\\n\\n§M\"Such an expansive cosmic wasteland—it would be a waste not to make some use of it.\"§!\\n\\n§Y[From.GetName]§! floated silently in the dark void, covered in craters and weathered rock layers, as lifeless as a frozen corpse.\\n\\nYet when a slender, fair hand reached in from the edge of the screen, this world thousands of kilometers across seemed minuscule before those five delicate fingers.\\n\\nMountain ranges that soared into clouds in the eyes of geologists were now merely tiny grains between the ridges of her fingerprints.\\n\\n§M\"Can't feel any signs of life at all, just like a cold marble...\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$'s slender fingers closed, holding the entire planet in her palm as she gently squeezed to test its hardness.\\n\\n§M\"Hardness is decent... at least it won't break on the first squeeze.\"§!\\n\\nShe chuckled softly with an unsettling anticipation in her voice:\\n\\n§M\"Command wouldn't mind if I... tested its durability a little, right?\"§!\\n\\nWinking, she didn't wait for a reply as her other hand unbuttoned the hem of her uniform.\\n\\n§M\"After all... nobody will miss a useless barren planet used for something like this, right?\"§!\\n\\n$gts_bruh_shipgirl_ship_sizes_3_short$ licked her lips, lifting her skirt to reveal black lace panties. That mysterious triangular realm emitted faint heat, creating a misty forbidden zone in the cosmic vacuum.\\n\\nHooking the edge of her panties, she slid down the final veil.\\n\\nAs her plump, luscious folds were bared to the vacuum, a rich female aroma spread instantly. Her lips parted slightly, revealing soft pink flesh within and a dark, bottomless entrance capable of swallowing worlds.\\n\\n§M\"Come... let me see how long you can endure inside.\"§!\\n\\nAligning the world with her moist opening, $gts_bruh_shipgirl_ship_sizes_3_short$ pushed it inward inch by inch.\\n\\nSoft fleshy lips enveloped the frigid planet, swallowing it steadily.\\n\\nHard rock strata crackled and fractured under the pressure of her fleshy walls; fissures spread across the surface like wounds, spewing molten magma.\\n\\n§M\"Ah... so good...\"§!\\n\\nHer breath quickened as a seductive flush colored her cheeks. Without pause, she pushed the planet deeper.\\n\\nThe writhing of her canal grew more intense, waves of contraction slamming against the surface and stripping away vast sheets of rock. The world shrank visibly; soaring mountains were flattened, deep gorges filled, the entire crust reshaped by irresistible force.\\n\\nAs the last part of the planet disappeared into the pink canal, her body shuddered violently. A torrent of thick love fluid erupted from deep within, drenching the surface like a flood and submerging the shattered world.\\n\\n§M\"Haaah...!\"§!\\n\\nWith a high-pitched cry from $gts_bruh_shipgirl_ship_sizes_3_short$, her canal began its final crush.\\n\\nThe fissure-riddled crust collapsed under ultimate pressure, detonating deep inside her aperture into countless fragments that blended with love fluid into a thick slurry.\\n\\nAfter a long while, $gts_bruh_shipgirl_ship_sizes_3_short$ recovered from the afterglow of climax.\\n\\nStroking her slightly swollen lower belly, she sighed in satisfaction:\\n\\n§M\"Mmm... truly, even a worthless barren world can bring such wonderful pleasure...\"§!"
