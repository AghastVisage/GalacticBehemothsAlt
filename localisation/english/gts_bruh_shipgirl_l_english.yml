  #  Bruh驅逐艦娘
  gts_bruh_shipgirl_ship_sizes_1: "Bruh Destroyer Shipgirl"
  #  §M(Bruh系列艦娘)§!\n這些嬌小的巨人(相對而言)是艦隊的前鋒。雖然被稱為"驅逐"，但她們的體型依然足以讓任何常規戰艦相形見絀。她們不依賴厚重的裝甲，而是憑藉驚人的爆發力和靈活的步伐在星海中穿梭。她們擅長快速貼近敵方艦隊，用綁在大腿上的發射管傾瀉魚雷，或者直接用手中的速射火炮將敵艦的艦橋轟成蜂窩
  SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_1_DESC: "§M(Bruh Series Shipgirls)§!\nThese petite giants (relatively speaking) are the fleet's vanguards. Although called 'Destroyers', their size is still enough to make any conventional warship look small. They don't rely on heavy armor, but instead use incredible explosive power and flexible footwork to traverse the star-sea. They excel at quickly closing in on enemy fleets, unleashing torpedoes from tubes mounted on their thighs, or using rapid-fire artillery in their hands to turn enemy bridges into honeycombs."
  #  Bruh戰列艦娘
  gts_bruh_shipgirl_ship_sizes_2: "Bruh Battleship Shipgirl"
  #  §M(Bruh系列艦娘)§!\n艦隊的中堅力量，兼具毀滅性的火力與厚實的防禦。這些巨娘通常裝備著能輕易洞穿地殼的超大口徑主炮，或者是作為移動的航空基地，釋放無數如同蜂群般的艦載機。她們不需要頻繁移動，只需優雅地站在戰場後方，調整巨大的舾裝，對著遠處的坐標進行覆蓋式打擊
  SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_2_DESC: "§M(Bruh Series Shipgirls)§!\nThe backbone of the fleet, possessing both devastating firepower and thick defense. These giantesses are usually equipped with super-large caliber main guns that can easily pierce planetary crusts, or serve as mobile aviation bases, releasing countless swarm-like carrier aircraft. They don't need to move frequently; they simply stand elegantly at the back of the battlefield, adjusting their massive rigging to perform carpet-bombing strikes on distant coordinates."
  #  Bruh無畏艦娘
  gts_bruh_shipgirl_ship_sizes_3: "Bruh Dreadnought Shipgirl"
  #  §M(Bruh系列艦娘)§!\n真正的星海霸主，體型之大以至於恆星在她們身旁都顯得黯淡，普通的恆星在她面前都如同暖手寶一般。她們是唯一擁有足夠蠻力揮舞那把數萬公里長"斬艦刀"的存在。她們的存在本身就是一種天災，不僅能用物理手段切開敵人的主力艦隊，更擁有處理行星的恐怖能力。當無畏艦娘出現在雷達上時，撤退往往已經太遲了
  SHIP_GRAPHICS_GTS_BRUH_SHIPGIRL_SHIP_SIZES_3_DESC: "§M(Bruh Series Shipgirls)§!\nTrue star-sea overlords, so large that stars seem dim beside them; ordinary stars are like hand-warmers in their presence. They are the only ones with the raw strength to wield that tens-of-thousands-of-kilometers-long 'Ship-Slayer Blade'. Their very existence is a natural disaster, capable of physically slicing through enemy main fleets and possessing the terrifying ability to process planets. When a Dreadnought Shipgirl appears on radar, retreat is usually too late."
  #  敵人的艦隊已經灰飛煙滅，剩下的只有這顆赤裸裸暴露在無畏艦娘面前的§Y[From.GetName]§!。面對地面上那些絕望發射的、如同灰塵般的防禦導彈，無畏艦娘只覺得一陣好笑，那種程度的爆炸，連給她除毛都嫌力道不足。她輕笑著，無視了通訊頻道裡敵人撕心裂肺的求饒，將這顆敵人的家園像塞入一顆情趣跳蛋般，強行推入了她那濕滑的深淵。對於星球上的敵軍來說，這是超越了所有噩夢的場景。它們引以為傲的要塞、繁華的都市，在接觸到粉色肉壁的瞬間便被粉碎。緊接著，愛液如海嘯般灌入大陸的每一個裂縫。無畏艦娘刻意控制著力道，沒有立刻夾碎它，而是利用陰道的褶皺反覆套弄、研磨，將星球表面的所有文明痕跡「舔舐」乾淨。當這顆星球再次重見天日時，它已經變成了一顆晶瑩的濕潤球體。原本的仇恨與抵抗都已被溶化在濃稠的愛液中，在星空中無聲地訴說著無畏艦娘的恐怖。
  gts_event_bruh_shipgirl.0002.desc: "The enemy fleet has turned to ash, leaving only §Y[From.GetName]§! exposed nakedly before the Dreadnought Shipgirl. Facing the desperate defense missiles launched from the ground like dust, the Dreadnought only feels a sense of amusement; such explosions wouldn't even have enough strength for her hair removal. She chuckles, ignoring the heart-wrenching pleas for mercy from the enemy in the communication channel, and shoves this enemy home into her moist abyss like inserting a vibrating egg. For the enemy forces on the planet, this is a scene beyond all nightmares. Their proud fortresses and bustling cities are crushed the moment they touch the pink fleshy walls. Next, love juices pour into every crack of the continent like a tsunami. The Dreadnought deliberately controls her strength, not crushing it immediately, but using her vaginal folds to repeatedly manipulate and grind, 'licking' clean all traces of civilization from the planet's surface. When the planet sees daylight again, it has become a glistening, moist sphere. The original hatred and resistance have all been dissolved in the thick love juices, silently telling of the Dreadnought Shipgirl's terror in the starry sky."
  #  這是一場處刑，也是一場狂歡。無畏艦娘早已對這群頑固的小蟲子失去了耐心。她抓起§Y[From.GetName]§!，就像抓起一顆準備捏爆的葡萄。敵人的反擊打在她嬌嫩的肌膚上，只引起了一陣輕微的搔癢，反而更加激發了她的暴虐慾望。「去死吧，小蟲子們。」伴隨著這句輕描淡寫的判詞，她將整顆星球粗暴地捅進了小穴。星球在她的體內燃燒，她興奮地夾緊雙腿，陰道的億萬噸肌肉同時發力。在星球核心承受不住壓力而爆炸的前一秒，地表上的所有生命都已在絕望中被壓成了肉泥。緊接著，一場星系級的劇烈高潮席捲了無畏全身。她發出一聲嬌喘，穴內的星球在這股毀滅性的收縮下徹底崩解。當一切平息，她意猶未盡地用手指從穴內摳出幾塊大陸板塊的碎片，隨手彈向深空。§Y[From.GetName]§!已經不復存在。
  gts_event_bruh_shipgirl.0003.desc: "This is an execution, and a carnival. The Dreadnought has long since lost patience with these stubborn little bugs. She grabs §Y[From.GetName]§!, like grabbing a grape ready to be burst. The enemy's counterattacks hitting her delicate skin only cause a slight itch, which instead further excites her tyrannical desires. 'Die, little bugs.' With this nonchalant sentence, she crudely thrusts the entire planet into her aperture. The planet burns inside her; she excitedly tightens her legs, while billions of tons of vaginal muscle exert force simultaneously. A second before the planet's core can no longer withstand the pressure and explodes, all life on the surface has already been crushed into pulp in despair. Next, a galaxy-level intense orgasm sweeps through her entire body. She lets out a soft moan as the planet within her aperture completely disintegrates under this destructive contraction. When everything settles, she unsatisfiedly digs out several fragments of continental plates from her aperture with her fingers and casually flicks them into deep space. §Y[From.GetName]§! no longer exists."
  #  接到指揮部關於"§R重塑[From.GetName]§!"的指令後，無畏艦娘緩緩移向了這顆屬於帝國的星球。在她那足以遮蔽恆星光芒的宏偉身軀面前，這顆居住了數十億人口的行星，不過是一顆色澤稍微黯淡的跳蛋罷了。她伸出玉指，輕巧地將這顆星球從軌道上摘下，無視了大氣層內傳來的、對她而言連蚊吶都不如的通訊請求。隨後，她將內褲拉開了一角，露出了濕潤而貪婪的秘境。伴隨著一聲輕柔的嘆息，這顆星球被她緩緩推入了溫暖的小穴之中。對於星球上的居民而言，世界末日是粉紅色的。天空被柔軟的肉壁取代，緊接著是無窮無盡的愛液洪流。瞬間摧毀了地表所有的城市與建築，將文明的痕跡抹除殆盡。無畏艦娘並沒有急著粉碎它，而是輕柔地「按摩」著這顆小球，讓它在充滿費洛蒙的愛液中浸泡、醃製。數小時後，伴隨著一聲滿足的呻吟，這顆星球被「排出」體外。此時的它已不再是那顆岩石行星，原本的地殼結構已被滲透的愛液徹底改變，地表覆蓋著厚厚的、散發著甜膩香氣的粘液海洋。雖然原本的居民已全部溺斃，但對於帝國而言，這是一顆新生的、充滿資源的愛液星球。
  gts_event_bruh_shipgirl.0004.desc: "After receiving the command regarding '§RReshaping [From.GetName]§!', the Dreadnought Shipgirl slowly moved toward this Imperial planet. Before her magnificent body - large enough to block out starlight - this planet inhabited by billions was but a slightly dim vibrating egg. She stretched out her jade-like finger, gracefully plucking the planet from orbit, ignoring the communication requests from within the atmosphere that were less than mosquito buzzes to her. Then, she pulled back a corner of her panties, revealing a moist and greedy secret realm. With a gentle sigh, the planet was slowly pushed into her warm aperture. For the planet's residents, doomsday was pink. The sky was replaced by soft fleshy walls, followed by an endless torrent of love juices. In an instant, all cities and buildings on the surface were destroyed, erasing all traces of civilization. The Dreadnought didn't rush to crush it, but gently 'massaged' the little sphere, letting it soak and marinate in pheromone-filled love juices. Hours later, with a satisfied moan, the planet was 'excreted'. By this time, it was no longer that rocky planet; the original crust structure had been completely changed by the permeated love juices, its surface covered by a thick sea of sticky, sweet-smelling mucus. Although the original residents had all drowned, for the Empire, this was a newborn, resource-rich Juice Planet."
  #  無畏艦娘收到了新的指令。她並沒有像往常那樣直接動手摧毀§Y[From.GetName]§!，而是帶著一絲羞澀與興奮，緩紓解開了腰間的繫帶。對於§Y[From.GetName]§!上的居民來說，這是一場香豔而絕望的災難。天空被巨大的陰影遮蔽，那不是烏雲，而是帶著藍白條紋的巨大織物。隨著艦娘將那條還帶著體溫的胖次褪下，濃烈的雌性氣息瞬間衝垮了大氣循環。她雙手撐開那條足以容納世界的內褲，像捕捉螢火蟲一樣，將整顆星球溫柔而堅定地兜了進去。星球表面的通訊在那一刻被徹底切斷，最後傳回的畫面只有白色的棉質穹頂和艦娘那因為羞恥而微微泛紅的巨臉。
  gts_event_bruh_shipgirl.0021.desc: "The Dreadnought Shipgirl received new orders. She didn't directly move to destroy §Y[From.GetName]§! as usual, but instead, with a hint of shyness and excitement, slowly unfastened the tie at her waist. For the residents of §Y[From.GetName]§!, this was an erotic and desperate disaster. The sky was covered by a massive shadow, which was not clouds, but a giant blue and white striped fabric. As the shipgirl removed her panties, still carrying her body heat, the intense female aura instantly collapsed the atmospheric circulation. She held open the panties - large enough to hold a world - and like catching a firefly, gently yet firmly scooped the entire planet inside. All surface communications were completely cut off at that moment, with the last transmitted image being the white cotton dome and the shipgirl's massive face slightly flushed with shame."
