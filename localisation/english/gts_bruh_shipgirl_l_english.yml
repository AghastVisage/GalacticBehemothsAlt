  GTS_BRUH_ARMOR_2: "Officer Dress Uniform"
  GTS_BRUH_ARMOR_2_DESC: "§M(Bruh series weapon)§!\nFormal wear for shipgirls at victory banquets, adorned with enemy wreckage representing their combat achievements."
