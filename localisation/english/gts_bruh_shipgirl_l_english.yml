  #  原味胖次包覆
  tech_gts_bruh_shipgirl_planet_killer_panties: "Original Scent Panty Envelopment"
  #  §M(Bruh系列科技)§!\n鵝將軍的瘋狂計劃終於實現了。經過對七種不同星球環境的詳細數據分析，我們終於掌握了將艦娘貼身衣物武器化的技術。這些剛從少女胯下褪去、還殘留著體溫與氣味的巨大胖次，能輕易包覆行星，其上的愛液與陰垢也將永久改變星球生態。\n§R"雖然有點羞恥，但看著敵人在我的胖次下掙扎...還挺有成就感的"§!
  tech_gts_bruh_shipgirl_planet_killer_panties_desc: "§M(Bruh Series Technology)§!\\nGeneral Goose's crazy plan has finally been realized. After detailed data analysis of seven different planetary environments, we have finally mastered the technology to weaponize the shipgirls' personal clothing. These massive panties, just removed from a girl's crotch with residual body heat and scent, can easily envelop a planet. Their 'love juices' and crotch residue will permanently change the planetary ecology. \\n§R\"It's a bit embarrassing, but seeing the enemy struggle under my panties... it's quite a sense of achievement.\"§!"
  #  套上胖次
  gts_bruh_shipgirl_planet_killer_panties: "Equip Panties"
  #  §M(Bruh系列武器)§!\n這條剛剛從艦娘身上脫下的、甚至還拉絲著愛液的胖次，其纖維空隙間填滿了乾燥的皮屑、濃縮的尿酸結晶以及黏稠的愛液。對於星球上的居民來說，世界末日是伴隨著令人窒息的少女體味降臨的，而倖存者只能在少女私處的濃烈氣味中絕望度日。
  gts_bruh_shipgirl_planet_killer_panties_component_set_1_DESC: "§M(Bruh Series Weapons)§!\\nThese panties, just taken off the shipgirl and even trailing with love juices, have their fiber gaps filled with dried skin flakes, concentrated uric acid crystals, and viscous love juices. For the planet's residents, doomsday arrives with a suffocating girl's body scent, and survivors can only spend their days in despair amidst the intense aroma of the girl's private parts."
