  #  廢棄處分
  gts_event_bruh_shipgirl.0005.name: "Scrap Disposal"
  #  指揮部的命令是§R廢棄處分§!。對於無畏艦娘來說，這意味著她可以毫無顧忌地處理掉這顆礙眼的「過期糖果」。§Y[From.GetName]§!在她的掌心中顯得如此脆弱，她甚至懶得去聽星球總督最後的哀嚎，便將這顆直徑數萬公里的行星塞進了她早已渴望填滿的陰道深處。不同於溫柔的愛撫，這一次，她渴望的是更為暴力的刺激。剛一進入，緊緻的肉壁便如同液壓鉗般從四面八方擠壓而來。星球的地殼在瞬間崩裂，岩漿從地底噴湧而出，卻又立刻被更加滾燙的愛液澆熄。無畏艦娘微微仰頭，雙腿在虛空中無意識地抽搐著，她享受著這顆粗糙的「彈珠」摩擦過的快感。隨著快感的堆疊，「喀嚓」雖然在太空中聽不到聲音，但那種崩碎的觸感清晰地傳遞到了。這顆星球在她的高潮中被硬生生夾碎成了齏粉。當她最終鬆開肌肉，隨著一股濁白的洪流噴湧而出的，只有無數細碎的小行星殘骸。這顆星球徹底成為了歷史，以及她一次高潮的祭品。
  gts_event_bruh_shipgirl.0005.desc: "The order from headquarters is §RScrap Disposal§!. For a Dreadnought Shipgirl, this means she can without hesitation dispose of this eyesore - \"expired candy\". §Y[From.GetName]§! looks so fragile in her palm... she didn't even bother to listen to the final wails of the planetary governor before stuffing this planet, tens of thousands of kilometers in diameter, deep into her vagina that she had long yearned to fill. Unlike a gentle caress, this time, she craved more violent stimulation. As soon as it entered, the tight walls of flesh squeezed from all sides like hydraulic pincers. The planet's crust shattered instantly, lava erupted from underground only to be immediately extinguished by even hotter juices. The Dreadnought shipgirl tilted her head back slightly, her legs twitching unconsciously in the void, enjoying the pleasure of this rough \"marble\" rubbing against her. As the pleasure stacked, \"CRACK\" - though no sound could be heard in space, the sensation of crumbling was clearly transmitted. This planet was literally crushed into powder during her orgasm. When she finally relaxed her muscles, what gushed out with a surge of cloudy white torrent were only countless tiny fragments of asteroid remains. This planet has completely become history, a sacrifice to one of her orgasms."
  #  反正這顆星球也沒什麼用了
  gts_event_bruh_shipgirl.0005.a: "This planet was useless anyway."
  #  旅途消遣
  gts_event_bruh_shipgirl.0006.name: "Travel Pastime"
  #  這是一顆未經開發的原始星球，但在無畏艦娘眼中，這不過是一顆質地不錯的「玩具球」。指揮部發來了許可訊號，允許她將這顆星球作為娛樂。無畏艦娘帶著一絲好奇，用指尖輕輕撥弄了一下這顆藍綠相間的「彈珠」，引發了地表上的超級地震。隨後，她不再猶豫，為了紓解旅途的空虛，她將這顆星球緩緩納入小穴。對於星球上的原始生物來說，這是神罰，也是神蹟。天空被巨大的肉色穹頂遮蔽，溫暖而黏稠的「聖水」從天而降，淹沒了森林與山脈。無畏艦娘閉著眼睛，感受著這顆小球在敏感點附近的滾動，原本粗糙的地表在愛液的浸泡下逐漸變得光滑。她並沒有打算毀掉它，只是想把它「醃製」得更有風味。經過長時間的浸泡，星球原本的生態系統被徹底置換。當她玩膩了將其排出時，這顆星球已經變成了一個被愛液包裹的星球，原本的原始文明已化作養分，成為了行星海洋的一部分。
  gts_event_bruh_shipgirl.0006.desc: "This is an undeveloped primitive planet, but in the eyes of the Dreadnought Shipgirl, it is just a \"toy ball\" of good texture. Headquarters sent a permission signal, allowing her to use this planet for entertainment. With a hint of curiosity, the Dreadnought Shipgirl flicked this blue-green \"marble\" with her fingertip, triggering a super-earthquake on the surface. Then, without hesitation, to relieve the emptiness of her journey, she slowly took this planet into her pussy. For the primitive creatures on the planet, this was divine punishment and a miracle. The sky was obscured by a massive flesh-colored dome, and warm, viscous \"holy water\" fell from the heavens, submerging forests and mountains. The Dreadnought Shipgirl closed her eyes, feeling the small ball rolling near her sensitive spot; the originally rough surface gradually became smooth under the soaking of her juices. She didn't intend to destroy it, just wanted to \"marinate\" it for better flavor. After a long period of soaking, the planet's original ecosystem was completely replaced. When she got tired of playing and discharged it, the planet had turned into a world encased in juices, its original primitive civilization transformed into nutrients, becoming part of the planetary ocean."
  #  看起來醃製得很入味
  gts_event_bruh_shipgirl.0006.a: "Looks like it's been marinated well."
  #  脆弱玩具
  gts_event_bruh_shipgirl.0007.name: "Fragile Toy"
  #  "只是一顆無關緊要的石頭罷了"無畏艦娘在收到指揮部「自由處置」的命令後，百無聊賴地打量著這顆行星。長期的航行讓她感到些許無聊，而這顆星球的大小剛好適合用來解悶。她沒有任何前戲，直接將這顆星球當作免洗用品塞入了體內。也許是因為這顆星球的地質結構太過脆弱，又或者是無畏艦娘今天的興致太過高昂，意外發生得很快。當她試圖用肉壁去感受星球表面的紋理時，僅僅是一次無意識的收縮測試，這顆脆弱的「彈珠」就在她體內發出了不堪重負的悲鳴。地殼像蛋殼一樣破碎，地核的熱量在她體內擴散，帶來一陣酥麻的暖意"啊...壞掉了？"無畏艦娘困惑地眨了眨眼，她感覺到體內的那個硬物已經變成了一堆碎渣。隨著她失望地嘆氣，無數的岩石碎片混合著愛液被排入太空。這顆星球的命運就這樣在她的無心之失中畫上了句號，連同上面可能存在的生命一起，變成了一堆無意義的宇宙垃圾。
  gts_event_bruh_shipgirl.0007.desc: "\"It's just an insignificant stone,\" the Dreadnought Shipgirl thought listlessly as she sized up the planet after receiving the \"dispose at will\" order. The long voyage had made her a bit bored, and this planet's size was just right for relieving it. Without any foreplay, she stuffed the planet directly into her body as a disposable item. Perhaps because the planet's geological structure was too fragile, or because the Dreadnought Shipgirl's spirits were too high today, the accident happened quickly. When she tried to feel the texture of the planet's surface with her flesh walls, with just one unconscious contraction test, this fragile \"marble\" let out an overwhelmed wail from inside her. The crust shattered like an eggshell, and the heat from the planet's core spread within her, bringing a numbing warmth. \"Ah... is it broken?\" The Dreadnought Shipgirl blinked in confusion; she felt the hard object inside her had turned into a pile of debris. As she sighed in disappointment, countless rock fragments mixed with her juices were discharged into space. The fate of this planet ended in her unintentional mistake, along with any life that might have existed on it, turning into a pile of meaningless space junk."
  #  下次記得找個結實點的...如果有的話
  gts_event_bruh_shipgirl.0007.a: "Remember to find a sturdier one next time... if there is one."
  #  藍白色的末日天幕
  gts_event_bruh_shipgirl.0021.name: "Blue-and-White Doomsday Sky"
  #  經典款式的經典毀滅
  gts_event_bruh_shipgirl.0021.a: "Classic Destruction in Classic Style."
  #  條紋天空的審判
  gts_event_bruh_shipgirl.0022.name: "Judgment of the Striped Sky"
  #  §Y[From.GetName]§!的居民們驚恐地看著天空變成了藍白相間的顏色。那不是雲層，而是無畏艦娘剛剛從胯下褪去的貼身衣物。她將那條還散發著騰騰熱氣的藍白條紋胖次撐開，無情地套在了這顆星球上。隨著鬆緊帶在星球赤道附近猛烈回彈，巨大的勒緊力量粉碎了赤道周圍的所有山脈。緊接著，胖次襠部那吸滿了液體的部分沉重地壓在了星球的北半球。對於地面上的小人來說，世界末日是黏稠且腥甜的。巨量的愛液與汗水從巨大的棉質織物縫隙中被擠壓出來，形成了高達數千公尺的黃白色海嘯。城市在瞬間被這股液體沖垮，所有建築與生命都在這股源自 maiden私處的洪流中淹沒、窒息。
  gts_event_bruh_shipgirl.0022.desc: "The residents of §Y[From.GetName]§! watched in horror as the sky turned a blue-and-white pattern. It wasn't clouds, but the tight-fitting undergarments the Dreadnought Shipgirl had just shed. She stretched that blue-and-white striped pantsu, still radiating heat, and ruthlessly encapsulated the planet with it. As the waistband snapped violently back near the planet's equator, the massive tightening force crushed all mountain ranges around the equator. Directly after, the crotch of the pantsu, saturated with fluid, pressed heavily onto the planet's northern hemisphere. For the tiny humans on the ground, doomsday was viscous and sickly sweet. Massive amounts of juices and sweat were squeezed out from the gaps of the huge cotton fabric, forming a yellow-white tsunami thousands of meters high. Cities were instantly washed away by this liquid; all structures and lives were submerged and suffocated in this torrent stemming from the girl's private area."
  #  這是神明的恩賜...雖然有點臭
  gts_event_bruh_shipgirl.0022.a: "This is a gift from the gods... though it smells a bit."
  #  狂熱粉絲的末路
  gts_event_bruh_shipgirl.0023.name: "End of a Fanatic"
  #  §Y[From.GetName]§!上的居民曾是艦娘最狂熱的粉絲群體，它們日夜祈禱能得到女神的「恩賜」。於是，無畏艦娘回應了他們，她將剛脫下的藍白條紋胖次作為「獎勵」，直接丟在了行星上空。居民們最初還在為天空中降下的巨大聖物而歡呼，直到那沉重的布料真的砸在頭頂。數公里厚的棉層瞬間壓垮了城市護盾，而胖次襠部積累的巨量愛液像決堤的江河一樣傾瀉而下。狂熱的歡呼聲瞬間變成了絕望的氣泡聲，這座繁華的都市連同上面的所有粉絲，都被那過於沉重且濕潤的「愛意」徹底淹沒，化作了織物紋理間的一抹紅斑。
  gts_event_bruh_shipgirl.0023.desc: "The residents of §Y[From.GetName]§! were once the most fanatical group of shipgirl fans, praying day and night for the Goddess's \"grace.\" Thus, the Dreadnought Shipgirl responded to them, throwing her recently shed blue-and-white striped pantsu directly over the planet as a \"reward.\" The residents were initially cheering for the massive holy relic descending from the sky, until the heavy fabric actually slammed onto their heads. The mile-thick cotton layer instantly crushed the city shields, and the vast amount of juices accumulated in the crotch poured down like a bursting river. The fanatical cheers instantly turned into desperate bubbling sounds; this bustling city, along with all the fans upon it, was completely submerged by that overly heavy and moist \"love,\" turning into a smear of red between the textures of the fabric."
  #  求仁得仁...大概？
  gts_event_bruh_shipgirl.0023.a: "They got what they wanted... probably?"
  #  無處安放的衣物
  gts_event_bruh_shipgirl.0024.name: "Nowhere to Put Clothes"
  #  一場災難性的「誤操作」！無畏艦娘在我們的殖民地§Y[From.GetName]§!附近進行換裝時，隨手將剛脫下的藍白條紋胖次丟向了這顆星球。這條巨大的內褲依然保持著她身體的溫度，不偏不倚地將整顆星球罩住。對於上面的殖民者來說，天空突然塌陷了，隨之而來的是一場帶有強烈 maiden體味的風暴。整個殖民地在幾分鐘內就被淹沒在黏稠的液體中。通訊中最後傳來的聲音是人們在齊腰深的愛液中絕望的呼救，以及對那遮蔽天空的藍白條紋的恐懼。當艦娘意識到這一點時，星球上的文明火種已經熄滅了。
  gts_event_bruh_shipgirl.0024.desc: "A catastrophic \"misoperation\"! While performing an outfit change near our colony §Y[From.GetName]§!, the Dreadnought Shipgirl casually tossed her recently shed blue-and-white striped pantsu toward the planet. These massive panties, still retaining her body heat, happened to perfectly shroud the entire planet. For the colonists there, the sky suddenly collapsed, followed by a storm carrying a strong girlish body odor. The entire colony was submerged in viscous liquid within minutes. The last sounds from the communication were desperate cries for help in waist-deep juices and the fear of the blue-and-white stripes obscuring the sky. By the time the shipgirl realized this, the spark of civilization on the planet had already been extinguished."
  #  下次請看清楚再扔
  gts_event_bruh_shipgirl.0024.a: "Please look clearly before throwing next time."
  #  土著的聖物
  gts_event_bruh_shipgirl.0025.name: "Native's Sacred Relic"
  #  這顆原始星球上的土著曾以為神蹟降臨。當無畏艦娘將她那條穿了很久、吸滿了愛液的藍白條紋胖次賜予這顆星球時，土著們對著那遮天蔽日的藍白條紋跪拜。然而，神蹟很快變成了天災。隨著胖次完全覆蓋地表，其中心部位積累的黏稠液體開始在重力的作用下大量滲出。這不是滋潤萬物的雨露，而是毀滅性的洪水。原始的森林被愛液沖垮，簡陋的部落被淹沒在帶有甜腥味的浪潮中。數以億計的原始生物被困在濕潤的棉布與地表之間，最終全部溺死在艦娘的愛液裡。這顆星球現在看起來就像是一個包著藍白條紋包裝紙的濕潤泥球。
  gts_event_bruh_shipgirl.0025.desc: "The natives on this primitive planet once thought a miracle had descended. When the Dreadnought Shipgirl bestowed her long-worn, juice-soaked blue-and-white striped pantsu upon the planet, the natives knelt before the blue-and-white stripes that blotted out the sun. However, the miracle soon turned into a disaster. As the panties completely covered the surface, the thick liquid accumulated in its center began to seep out in large quantities under the influence of gravity. This was not the rain that nourishes all things, but a devastating flood. Primitive forests were washed away by the juices, and simple tribes were submerged in a tide with a sweet and fishy smell. Billions of primitive creatures were trapped between the moist cotton and the surface, eventually all drowning in the shipgirl's juices. The planet now looks like a moist mud ball wrapped in blue-and-white striped wrapping paper."
  #  有些禮物太過沉重了
  gts_event_bruh_shipgirl.0025.a: "Some gifts are just too heavy."
  #  意外的「加餐」
  gts_event_bruh_shipgirl.0101.name: "Unexpected \"Extra Meal\""
  #  一場可怕的悲劇！艦娘§H[[event_target:gts_bruh_get_event_shipgirl.GetName]§!在享用小行星帶的礦石零食時，不小心將§Y[event_target:gts_bruh_get_event_target.GetName]§!一併抓了起來。儘管§Y[event_target:gts_bruh_get_event_target.GetName]§!發出了全頻段的求救信號，但在她看來那不過是食物上的一點雜質。§Y[event_target:gts_bruh_get_event_target.GetName]§!被拋入了那濕潤、溫熱的粉色深淵中。巨大的舌頭像紅色的海嘯一樣翻湧，將§Y[event_target:gts_bruh_get_event_target.GetName]§!卷向了潔白的臼齒山脈。工作人員在被嚼碎前，最後看到的景象是那緩緩烙下的白色天花板......
  gts_event_bruh_shipgirl.0101.desc: "A terrible tragedy! The shipgirl §H[event_target:gts_bruh_get_event_shipgirl.GetName]§! while enjoying ore snacks in an asteroid belt, accidentally scooped up §Y[event_target:gts_bruh_get_event_target.GetName]§! as well. Despite §Y[event_target:gts_bruh_get_event_target.GetName]§! emitting distress signals on all frequencies, to her it was just a speck of grit on her food. §Y[event_target:gts_bruh_get_event_target.GetName]§! was tossed into that moist, warm pink abyss. A massive tongue rolled like a red tsunami, sweeping §Y[event_target:gts_bruh_get_event_target.GetName]§! toward the pearly white molar mountain range. Before being chewed up, the last sight the personnel saw was that slowly descending white ceiling..."
  #  至少...它們成為了她的一部分
  gts_event_bruh_shipgirl.0101.a: "At least... they've become a part of her."
  #  §R[event_target:gts_bruh_get_event_target.GetName]被嚼碎了§!
  gts_event_bruh_shipgirl.0101.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName] was chewed up§!"
  #  晨間的洪水
  gts_event_bruh_shipgirl.0102.name: "Morning Flood"
  #  這是一個糟糕的早晨。剛睡醒的艦娘§H[event_target:gts_bruh_get_event_shipgirl.GetName]§!顯然處於迷糊狀態，她似乎把我們美麗的海洋行星[Root.GetName]當成了她的私人馬桶。當巨大的陰影籠罩天空，兩瓣潔白的巨臀像天蓋一樣遮住了恆星時，全球的警報都響了。沒有任何商量的餘地，伴隨著令人絕望的瀑布聲，滾燙的黃色洪流從天而降。這股帶有強烈氨氣味和巨娘體溫的液體瞬間擊穿了大氣層，引發了全球性的海嘯。原本蔚藍的海洋在幾分鐘內就被染成了渾濁的淡黃色，海平面上升了數公里。
  gts_event_bruh_shipgirl.0102.desc: "It's a terrible morning. The recently awakened shipgirl §H[event_target:gts_bruh_get_event_shipgirl.GetName]§! was clearly in a daze, and she seems to have mistaken our beautiful ocean planet [Root.GetName] for her private toilet. When massive shadows loomed over the sky and two pearly white buttocks covered the star like a canopy, global sirens rang out. There was no room for negotiation; with an overwhelming sound of a waterfall, a scalding yellow torrent descended from the sky. This liquid, carrying a strong ammonia smell and giantess body heat, instantly pierced through the atmosphere, triggering a global tsunami. The originally blue ocean was dyed a murky pale yellow within minutes, and the sea level rose by several kilometers."
  #  "這顆星球的海洋現在由90%的巨娘晨尿構成，散發著獨特的氣味"
  gts_event_bruh_shipgirl.0102.a: "\"The ocean of this planet now consists of 90% giantess morning urine, emitting a unique odor.\""
  #  航道上的零食
  gts_event_bruh_shipgirl.0103.name: "Snack on the Fairway"
  #  我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!失聯了。最後傳回的影像顯示，巨大的艦娘§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!正在該星系進行補給，具體來說，她正在抓取小行星往嘴裡塞。很不幸，我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!當時正隱蔽在那片小行星帶中執行任務。艦娘顯然沒有注意到混在「爆米花」裡的幾粒「灰塵」。通訊記錄的最後是巨大的潔白牙齒合攏的畫面，以及隨後陷入黑暗的潮濕咀嚼聲。我們探測到她滿足地嚥下去了，而現在§Y[event_target:gts_bruh_get_event_target.GetName]§!正在她的胃酸海洋中隨波逐流。
  gts_event_bruh_shipgirl.0103.desc: "Our §Y[event_target:gts_bruh_get_event_target.GetName]§! has lost contact. The last transmitted imagery shows the massive shipgirl §Y[event_target:gts_bruh_get_event_shipgirl.GetName]§! taking on supplies in that system - specifically, she was grabbing asteroids and stuffing them into her mouth. Unfortunately, our §Y[event_target:gts_bruh_get_event_target.GetName]§! was concealed in that asteroid belt on a mission at the time. The shipgirl clearly didn't notice a few specks of \"dust\" mixed in with the \"popcorn.\" The end of the communication record shows the closing of massive pearly teeth, followed by the sound of moist chewing in the dark. We detected that she satisfiedly swallowed, and now §Y[event_target:gts_bruh_get_event_target.GetName]§! is drifting through her ocean of gastric acid."
  #  願它們能在被胃酸消化前發回一些生物學數據
  gts_event_bruh_shipgirl.0103.a: "May they send back some biological data before being digested by stomach acid."
  #  發送信號讓她催吐！快！
  gts_event_bruh_shipgirl.0103.b: "Send a signal to make her vomit! Quick!"
  #  幸好她的消化系統沒那麼強......
  gts_event_bruh_shipgirl.0103.c: "Fortunately her digestive system isn't that strong..."
  #  §R[event_target:gts_bruh_get_event_target.GetName]將會被消化§!
  gts_event_bruh_shipgirl.0103.a.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName] will be digested§!"
  #  §Y25%的機率[event_target:gts_bruh_get_event_target.GetName]能夠倖存§!
  gts_event_bruh_shipgirl.0103.b.custom_tooltip: "§Y25% chance that [event_target:gts_bruh_get_event_target.GetName] can survive§!"
  #  §G[event_target:gts_bruh_get_event_target.GetName]倖存下來了......§!
  gts_event_bruh_shipgirl.0103.c.custom_tooltip: "§G[event_target:gts_bruh_get_event_target.GetName] survived...§!"
  #  貼身收藏
  gts_event_bruh_shipgirl.0104.name: "Cleavage Collection"
  #  我們的§Y[event_target:gts_bruh_get_event_target.GetName]§!在執行掃描任務時，被艦娘§H[event_target:gts_bruh_get_event_shipgirl.GetName]§!發現了。這位好奇的艦娘並沒有摧毀飛船，而是將其視為一個精緻的會發光的小玩具。"好可愛的小東西，還在動呢！"通訊頻道裡傳來她驚喜的聲音。隨後，她不顧船員們的尖叫，將整艘科研船塞進了她那深邃、溫暖且充滿乳香的乳溝深處，以此作為貼身的裝飾品。目前§Y[event_target:gts_bruh_get_event_target.GetName]§!雖然結構完好，但被兩座巨大的肉山死死夾住，船體外殼溫度急劇升高，且感測器被乳汗和皮膚完全遮蔽，除了白花花的一片什麼也看不到。
  gts_event_bruh_shipgirl.0104.desc: "Our §Y[event_target:gts_bruh_get_event_target.GetName]§! was discovered by the shipgirl §H[event_target:gts_bruh_get_event_shipgirl.GetName]§! while executing a scanning mission. This curious shipgirl did not destroy the ship, but rather saw it as an exquisite, glowing little toy. \"What a cute little thing, it's still moving!\" her delighted voice came through the communication channel. Then, ignoring the crew's screams, she stuffed the entire science ship deep into her deep, warm, and milk-scented cleavage as personal decoration. Currently, although §Y[event_target:gts_bruh_get_event_target.GetName]§! is structurally intact, it is tightly wedged between two massive mounds of flesh. The hull temperature is rising rapidly, and the sensors are completely obscured by milk-sweat and skin, showing nothing but a blur of white."
  #  立刻請求她歸還飛船！
  gts_event_bruh_shipgirl.0104.a: "Immediately request her to return the ship!"
  #  就讓它們在那待著吧
  gts_event_bruh_shipgirl.0104.b: "Just let them stay there."
  #  §R有機率導致§R[event_target:gts_bruh_get_event_target.GetName]§!被捏碎§!
  gts_event_bruh_shipgirl.0104.a.custom_tooltip: "§RChance of [event_target:gts_bruh_get_event_target.GetName] being crushed§!"
  #  §R[event_target:gts_bruh_get_event_target.GetName]將永遠困在乳溝之間§!
  gts_event_bruh_shipgirl.0104.b.custom_tooltip: "§R[event_target:gts_bruh_get_event_target.GetName] will be trapped between cleavage forever§!"
  #  夾縫求生
  gts_event_bruh_shipgirl.0105.name: "Survival in the Crack"
  #  一支隸屬於海盜的艦隊試圖從我們的§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!前溜過去，它們天真地以為飛到胸口前就能躲避她的視線。然而它們低估了那兩座宏偉山峰的危險性。當§Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!雙臂併攏擠壓胸部時，那道深邃的乳溝瞬間變成了死亡陷阱。兩側柔軟卻充滿韌性的乳肉向中間合攏，空間被極速壓縮。無數戰艦被擠壓在兩團巨大的脂肪之間，就像夾心餅乾裡的餡料一樣動彈不得。這些戰艦在混合著汗水與乳香的熱浪中慢慢變形、粉碎。
  gts_event_bruh_shipgirl.0105.desc: "A pirate fleet tried to slip past our §Y[event_target:gts_bruh_get_event_shipgirl.GetName]§!, naively thinking they could avoid her gaze by flying in front of her chest. However, they underestimated the danger of those two grand peaks. When §Y[event_target:gts_bruh_get_event_shipgirl.GetName]§! brought her arms together to squeeze her chest, that deep cleavage instantly became a death trap. The soft yet resilient flesh from both sides closed in, compressing the space at high speed. Countless warships were squeezed between the two massive masses of fat, immobile like the filling in a sandwich. These warships slowly deformed and shattered in a heatwave mixed with sweat and the scent of milk."
  #  多麼幸福的死法......
  gts_event_bruh_shipgirl.0105.a: "What a blissful way to die..."
  #  記得提醒她洗澡時清理一下
  gts_event_bruh_shipgirl.0105.b: "Remember to remind her to clean up when she's bathing."
