  gts_event_bruh_shipgirl.0201.desc: "§Y[FromFrom.GetName]§! is a planet completely covered in ice, with surface temperatures as low as minus 200 degrees. When the Dreadnought Shipgirl §H[From.GetName]§! grabbed it in her hand, she could even feel a hint of chill.\\n\\n§R\"So cold... but it's perfect for cooling down.\"§!\\n\\nShe had just gone through an intense battle, and sweat still lingered on her body. Without hesitation, she stuffed this ice ball into her moist, warm pussy. A collision of ice and fire erupted instantly. The minus 200-degree ice layer contacted the 40-degree flesh walls, melting violently at once. Large amounts of ice water mixed with her already abundant juices and gushed out from the opening, condensing into crystalline ice beads in space and scattering everywhere.\\n\\n§R\"Hiss... so cold!\"§!\\n\\nThe Dreadnought Shipgirl gasped, her legs instinctively clamping shut. The frozen planet rapidly warmed up inside her pussy; the ice shell on the surface peeled away layer by layer, revealing the equally cold rocky core beneath. But this icy stimulation actually made the shipgirl more excited; she began to actively wiggle her waist, using her body heat to melt the ice ball. Ten minutes later, the entire planet had completely melted, turning into a mass of ice-water mixed with juices. The shipgirl spread her legs, and the liquid flowed out with a splash, forming a shimmering ice belt in space.\\n\\n§R\"Ah... refreshing! Just like drinking an ice-cold cola.\"§!\\n\\n§M(General Goose's Record: Frozen planets provide a refreshing stimulation for shipgirls, and the melted ice water acts as a natural lubricant.)§!"
