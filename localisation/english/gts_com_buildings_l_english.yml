l_english:
  # 巨娘体液精炼厂
  building_giantess_fluid_factory: "Giantess Fluid Refinery"
  # 巨娘体液的用途十分广泛，我们可以从巨娘在星球上留下的神迹中提取并精炼获得
  building_giantess_fluid_factory_desc: "Giantess fluids have wide applications. We can extract and refine them from the miracles giantesses leave on planets"
  # 巨娘体液精炼员
  job_gts_giantess_fluid_worker: "Giantess Fluid Refiner"
  # $job_gts_giantess_fluid_worker$
  job_gts_giantess_fluid_worker_plural: "$job_gts_giantess_fluid_worker$"
  # 体液精炼员将巨娘的体液进行蒸馏分离，随后制作为用途不同的工业原料。拥有大批次有经验的体液精炼员是一个国家巨娘工业体系的重要基础\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_giantess_fluid_worker_desc: "Fluid refiners distill and separate giantess fluids into different industrial materials. Having大批量 experienced fluid refiners is crucial for a nation's giantess industrial system.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_giantess_fluid_worker$岗位
  mod_job_gts_giantess_fluid_worker_add: "$job_gts_giantess_fluid_worker$ Jobs"
  # $job_gts_giantess_fluid_worker$是小人岗位，消耗§Y$r_consumer_goods$§!、§Y$r_energy$§!产出£gts_giantess_fluid£§Y$gts_giantess_fluid$§!
  job_gts_giantess_fluid_worker_effect_desc: "$job_gts_giantess_fluid_worker$ is a tiny person job, consumes £consumer_goods£§Y$consumer_goods$§! and £energy£§Y$energy$§! (or £minerals£§Y$minerals$§! or £food£§Y$food$§!) produces £gts_giantess_fluid£§Y$gts_giantess_fluid$§!."
  # 巨娘内衣回收站
  building_giantess_underwear_factory: "Giantess Underwear Recycling Station"
  # 巨娘在星球上寻欢作乐的时候往往会留下大量的废弃衣物，而我们可以回收利用这些巨大的资源
  building_giantess_underwear_factory_desc: "Giantesses often leave mass discarded clothing when having fun on planets, which we can recycle as giantess resources"
  # 巨娘内衣质检员
  job_gts_giantess_underwear_worker: "Giantess Underwear Quality Inspector"
  # $job_gts_giantess_underwear_worker$
  job_gts_giantess_underwear_worker_plural: "$job_gts_giantess_underwear_worker$"
  # 质检员负责将帝国从巨娘星域收集来的内衣进行质量检测并分级，有些内衣上和我们等大的细菌将会被高温净化，如果内衣里有尘螨或攻击性强的原生文明，则需要联系驻地内的安防部队来协同清理\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_giantess_underwear_worker_desc: "Inspectors quality check and grade underwear collected from giantess domains. Bacteria our size will be purified with high heat. If there are dust mites or aggressive primitive civilizations, security forces are called for协同清理.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_giantess_underwear_worker$岗位
  mod_job_gts_giantess_underwear_worker_add: "$job_gts_giantess_underwear_worker$ Jobs"
  # $job_gts_giantess_underwear_worker$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、§Y$r_minerals$§!、§Y$r_alloys$§!产出£gts_giantess_underwear£§Y$gts_giantess_underwear$§!
  job_gts_giantess_underwear_worker_effect_desc: "$job_gts_giantess_underwear_worker$ is a tiny person job, consumes £minerals£§Y$minerals$§!, £alloys£§Y$alloys$§! and £gts_giantess_fluid£§Y$gts_giantess_fluid$§! produces £gts_giantess_underwear£§Y$gts_giantess_underwear$§!."
  # 对巨娘外交对策处
  building_giantess_human_factory: "Giantess Diplomatic Countermeasures Office"
  # 精湛的外交技术在这里十分管用，我们可以用一些资源在宇宙中招聘巨娘来为我们服务
  building_giantess_human_factory_desc: "Expert diplomatic skills are highly effective here. We can recruit giantesses from across the universe to serve us using some resources"
  # 巨娘对策外交官
  job_gts_giantess_human_worker: "Giantess Countermeasures Diplomat"
  # $job_gts_giantess_human_worker$
  job_gts_giantess_human_worker_plural: "$job_gts_giantess_human_worker$"
  # 这些层层选拔的单身外交官负责与外星巨娘文明的外交工作，展现我们种族的良好风貌。不过相当多的外交官往往在成功攻略一位巨娘后便会在巨娘入境后\"自行\"离职，因此这一职位每年都会有大量出缺，外交对策处也被戏称为巨娘婚介所\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_giantess_human_worker_desc: "These层层选拔 single diplomats handle diplomacy with alien giantess civilizations, showcasing our species' good风貌. However, many diplomats often \"voluntarily\" resign after successfully courting a giantess, leading to大量出缺 annually. The office is jokingly called the Giantess Matchmaking Agency.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_giantess_human_worker$岗位
  mod_job_gts_giantess_human_worker_add: "$job_gts_giantess_human_worker$ Jobs"
  # $job_gts_giantess_human_worker$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、£gts_giantess_underwear£§Y$gts_giantess_underwear$§!、§Y$r_food$§!、§Y$r_consumer_goods$§!产出£gts_giantess_human£§Y$gts_giantess_human$§!
  job_gts_giantess_human_worker_effect_desc: "$job_gts_giantess_human_worker$ is a tiny person job, consumes £minerals£§Y$minerals$§! and £gts_giantess_underwear£§Y$gts_giantess_underwear$§! produces £gts_giantess_human£§Y$gts_giantess_human$§!."
  # 资源采集站
  building_gts_collect_station: "Resource Collection Station"
  # 在很久以前，我们的祖先就依赖于巨娘留下的大量资源维生，即使到了太空时代，这些巨娘留下的资源依旧可以满足大量小人的生活生产所需
  building_gts_collect_station_desc: "Long ago, our ancestors relied on the vast resources left by giantesses for survival. Even in the space age, these resources can still meet the needs of many tiny people's life and production"
  # 采集者
  job_gts_tiny_beggar: "Collector"
  # $job_gts_tiny_beggar$
  job_gts_tiny_beggar_plural: "$job_gts_tiny_beggar$"
  # 
  job_gts_tiny_beggar_desc: """"
  # $job_gts_tiny_beggar$岗位
  mod_job_gts_tiny_beggar_add: "$job_gts_tiny_beggar$ Jobs"
  # $job_gts_tiny_beggar$是小人岗位，收集巨娘留下的资源勉强生存，产出§Y$r_energy$§!、§Y$r_minerals$§!和§Y$r_food$§!和£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、£gts_giantess_underwear£§Y$gts_giantess_underwear$§!
  job_gts_tiny_beggar_effect_desc: "$job_gts_tiny_beggar$ is a tiny person job, collects resources left by giantesses to barely survive, produces £energy£§Y$energy$§!, £minerals£§Y$minerals$§!, £food£§Y$food$§! and £gts_giantess_fluid£§Y$gts_giantess_fluid$§!, £gts_giantess_underwear£§Y$gts_giantess_underwear$§!"
  # 拾荒者
  job_gts_wastedlander: "Scavenger"
  # 拾荒者
  job_gts_wastedlander_plural: "Scavengers"
  # 拾荒者岗位增加
  job_gts_wastedlander_add: "Scavenger Jobs Increased"
  # 这些小小的拾荒者冒险在被踩碎的废墟中游荡，从那些开露的电线、碎成颗粒的砖石、压平的食物中收集有用的资源
  job_gts_wastedlander_desc: "These tiny scavengers冒险 wander through crushed ruins, collecting useful resources from exposed wires, crumbled bricks, and flattened food."
  # 爱液精炼厂
  building_energy_gts_trans: "Love Fluid Refinery"
  # 此设施可以高效地将£job_technician£§Y$job_technician$§!所生产的§Y$r_energy$§!转化为£gts_giantess_fluid£§Y$gts_giantess_fluid$§!
  building_energy_gts_trans_desc: ""This facility can efficiently convert the §Y$r_energy$§! produced by the £job_technician£§Y$job_technician$§! into £gts_giantess_fluid£§Y$gts_giantess_fluid$§!""
  # 汗液精炼厂
  building_food_gts_trans: "Sweat Refinery"
  # 此设施可以高效地将£job_farmer£§Y$job_farmer$§!所生产的§Y$r_food$§!转化为£gts_giantess_fluid£§Y$gts_giantess_fluid$§!
  building_food_gts_trans_desc: "This facility can efficiently convert the §Y$r_food$§! produced by the £job_farmer£§Y$job_farmer$§! into £gts_giantess_fluid£§Y$gts_giantess_fluid$§!"
  # 消化液精炼厂
  building_mineral_gts_trans: "Digestive Fluid Refinery"
  # 此设施可以高效地将£job_miner£§Y$job_miner$§!所生产的§Y$r_minerals$§!转化为£gts_giantess_fluid£§Y$gts_giantess_fluid$§!
  building_mineral_gts_trans_desc: ""This facility can efficiently convert the §Y$r_minerals$§! produced by the £job_miner£§Y$job_miner$§! into £gts_giantess_fluid£§Y$gts_giantess_fluid$§!""
  # 爱液体验馆" #钱
  building_gts_bathhouse: "Love Fluid Experience Spa" # Energy"
  # 为顾客提供舒适的巨娘爱液浸泡服务的特殊建筑，此外也有一些提供浓度过量爱液的地下爱液体验馆
  building_gts_bathhouse_desc: "Special facility offering comfortable giantess love fluid immersion services. Some underground spas also offer excessively concentrated love fluid."
  # 爱液池维护员
  job_gts_bathhouse_worker: "Love Fluid Pool Maintainer"
  # $job_gts_bathhouse_worker$
  job_gts_bathhouse_worker_plural: "$job_gts_bathhouse_worker$"
  # 这些维护员负责向泳池内注入温暖新鲜的巨娘爱液，并时刻准备着打捞那些沉迷爱液到昏迷的新人顾客们\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_bathhouse_worker_desc: "These maintainers inject warm, fresh giantess love fluid into the pools and are always ready to rescue customers who昏迷 from沉迷爱液.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_bathhouse_worker$岗位
  mod_job_gts_bathhouse_worker_add: "$job_gts_bathhouse_worker$ Jobs"
  # $job_gts_bathhouse_worker$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、§Y$r_food$§!产出§Y$r_energy$§!、§Y$r_trade$§!
  job_gts_bathhouse_worker_effect_desc: "$job_gts_bathhouse_worker$ is a tiny person job, consumes £food£§Y$food$§! and £gts_giantess_fluid£§Y$gts_giantess_fluid$§! produces £energy£§Y$energy$§!."
  # 汗液农业园" #食物
  building_gts_food_factory: "Sweat Agriculture Park" # Food"
  # 巨娘的汗液被证明富含充满生命力的有机物质，稍加改良就可以为农作物的增产大放光彩
  building_gts_food_factory_desc: "Giantess sweat is proven rich in life-giving organic matter. Slight modifications can significantly enhance crop yields."
  # 汗液食品加工员
  job_gts_food_worker: "Sweat Food Processor"
  # $job_gts_food_worker$
  job_gts_food_worker_plural: "$job_gts_food_worker$"
  # 将巨娘汗液调配为适量浓度后进行农作物催化的技术农民，这种作物在拥有更高营养的同时，还会伴随着若隐若现的催情汗味\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_food_worker_desc: "Technical farmers who dilute giantess sweat to appropriate concentrations for crop catalysis. These crops are more nutritious and carry faint aphrodisiac sweat scents.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_food_worker$岗位
  mod_job_gts_food_worker_add: "$job_gts_food_worker$ Jobs"
  # $job_gts_food_worker$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、§Y$r_minerals$§!产出§Y$r_food$§!
  job_gts_food_worker_effect_desc: "$job_gts_food_worker$ is a tiny person job, consumes £energy£§Y$energy$§! and £gts_giantess_fluid£§Y$gts_giantess_fluid$§! produces £food£§Y$food$§!."
  # 消化液矿区" #矿
  building_gts_mineral_factory: "Digestive Fluid Mining Zone" # Minerals"
  # 巨娘的胃液、肠液能轻松消融岩石，将高品位矿物暴露出来。在谨慎使用一下，矿区可以依此降低事故风险并提高产能
  building_gts_mineral_factory_desc: "Giantess gastric and intestinal fluids easily dissolve rock, exposing high-grade minerals. With careful use, mines can reduce accidents and increase output."
  # 消化液矿物加工员
  job_gts_miner: "Digestive Fluid Mineral Processor"
  # $job_gts_miner$
  job_gts_miner_plural: "$job_gts_miner$"
  # 在简单钻开孔洞后，这些身着全套保护的加工员会将巨娘消化液一点点注入其中，待消化液失活排净后再进行开采\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_miner_desc: "After simple drilling, these fully protected processors inject giantess digestive fluid bit by bit, mining only after deactivation and drainage.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_miner$岗位
  mod_job_gts_miner_add: "$job_gts_miner$ Jobs"
  # $job_gts_miner$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、§Y$r_energy$§!产出§Y$r_minerals$§!
  job_gts_miner_effect_desc: "$job_gts_miner$ is a tiny person job, consumes £minerals£§Y$minerals$§! and £gts_giantess_fluid£§Y$gts_giantess_fluid$§! produces £minerals£§Y$minerals$§!."
  # 极限体验点" #凝聚力
  building_gts_extreme_park: "Extreme Experience Point" # Unity"
  # 一些...呃...常人不太能接受的巨娘体液，会运输到这些体验点储存。那些好奇心重或口味奇重的顾客会在签署一系列文件后获准购买或现场体验这些体液
  building_gts_extreme_park_desc: "Some... uh... bodily fluids of sensitive nature are stored here. Curious or adventurous customers can purchase or experience them after signing numerous waivers."
  # 特殊泉管理员
  job_gts_extreme_worker: "Special Spring Administrator"
  # $job_gts_extreme_worker$
  job_gts_extreme_worker_plural: "$job_gts_extreme_worker$"
  # 这些管理员负责整理并封存从帝国四处运来的废液，其中一些危险性较低的体液也会被出售给那些猎奇的小人\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_extreme_worker_desc: "These administrators organize and seal waste fluids from across the empire. Less dangerous fluids are sold to curious tiny people.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_extreme_worker$岗位
  mod_job_gts_extreme_worker_add: "$job_gts_extreme_worker$ Jobs"
  # $job_gts_extreme_worker$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、§Y$r_energy$§!、§Y$r_consumer_goods$§!产出\n£unity£§Y$unity$§!、£amenities£§Y$amenity$§!\n每100§Y$job_gts_extreme_worker$§!提升1%星球§Y$mod_BIOLOGICAL_logistic_growth_mult$§!及§Y$mod_BIOLOGICAL_bonus_pop_growth_mult$§!
  job_gts_extreme_worker_effect_desc: "$job_gts_extreme_worker$ is a tiny person job, consumes £consumer_goods£§Y$consumer_goods$§! and £gts_giantess_fluid£ Giantess Fluid produces £unity£§Y$unity$§!."
  # 胖次艺术学院" #消费品
  building_gts_art_college: "Panties Art Academy" # Consumer Goods/Trade Value"
  # 整个学院在一个巨大的胖次穹顶下建成，致力于培养深刻理解巨大娘美学，并能为社会创造优秀GTS向ACGN作品的人才
  building_gts_art_college_desc: "\"The entire college is built under a dome formed of a single pair of giant panties, dedicated to cultivating talent that deeply understands giantess aesthetics and can create excellent GTS-themed ACGN works for society.\"
  # 巨娘艺术画师
  job_gts_art_college_worker: "Giantess Art Illustrator"
  # $job_gts_art_college_worker$
  job_gts_art_college_worker_plural: "$job_gts_art_college_worker$"
  # 这些画师大多来自于知名的业内网站，在教育的同时也会维持其创作工作，它们力求继承并发展古重樱国和古东煌国的巨娘艺术画风\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_art_college_worker_desc: "Most illustrators are active on certain well-known art forums, maintaining their creative work while educating. They strive to inherit and develop ancient Sakurain and Jadearli giantess art styles.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_art_college_worker$岗位
  mod_job_gts_art_college_worker_add: "$job_gts_art_college_worker$ Jobs"
  # $job_gts_art_college_worker$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、£gts_giantess_underwear£§Y$gts_giantess_underwear$§!、§Y$r_minerals$§!产出§Y$r_consumer_goods$§!
  job_gts_art_college_worker_effect_desc: "$job_gts_art_college_worker$ is a tiny person job, consumes £consumer_goods£§Y$consumer_goods$§!, £gts_giantess_fluid£§Y$gts_giantess_fluid$§! and £gts_giantess_underwear£§Y$gts_giantess_underwear$§! produces £consumer_goods£§Y$consumer_goods$§! and £trade_value£§YTrade Value§!."
  # 柔性内衣处理站" #合金
  building_gts_transmutation_workshop: "Flexible Underwear Processing Station" # Alloys/Consumer Goods"
  # 味道较轻的鞋袜、胖次会在这里进行处理，其主人多是注重卫生的 maiden或年幼的萝莉，经过仔细冲洗后，工作人员会从中收集到经巨娘长期无意识挤压下从尘土变成的优质合金，而这些布料本身就是极受欢迎的消费品原料
  building_gts_transmutation_workshop_desc: "Lightly scented shoes, socks, and panties are processed here. Their owners are usually hygiene-conscious girls or young lolis. After careful washing, workers collect优质合金 formed from long-term unconscious compression of dust. The fabrics themselves are highly popular consumer good materials."
  # 内衣清洗员
  job_gts_transmutation_worker: "Underwear Cleaner"
  # $job_gts_transmutation_worker$
  job_gts_transmutation_worker_plural: "$job_gts_transmutation_worker$"
  # 尽管这些内衣对巨娘来说味道很小，但对小人来说依然是相当有危险，清洗员在工作中往往需要穿上防护服进行作业。作为高危险的回报，在这些内衣中找到的足垢、乳垢矿石被默许可以被清洗员收集出售\n\n该岗位仅限§Y正常§!及以下特质的人口就职，§Y矮小§!及以下特质的人口会有更高的就职权重
  job_gts_transmutation_worker_desc: "Though barely scented to giantesses, these undergarments are quite dangerous to tiny people. Cleaners often need protective suits. As high-risk compensation, foot垢 and breast垢 minerals found are默许 for cleaners to collect and sell.\n\nThis job is limited to §YNormal§! sized and smaller pops, with §YSmall§! and smaller pops having higher job weight."
  # $job_gts_transmutation_worker$岗位
  mod_job_gts_transmutation_worker_add: "$job_gts_transmutation_worker$ Jobs"
  # $job_gts_transmutation_worker$是小人岗位，消耗£gts_giantess_fluid£§Y$gts_giantess_fluid$§!、£gts_giantess_underwear£§Y$gts_giantess_underwear$§!、§Y$r_minerals$§!产出§Y$r_alloys$§!
