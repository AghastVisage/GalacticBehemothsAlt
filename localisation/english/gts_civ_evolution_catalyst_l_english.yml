l_english:
  # 进化触媒
  civic_evolution_catalyst: "Evolutionary Catalyst"
  # 这个国家的主体物种是一种特殊基因病毒的携带者\n这让它们不受病毒影响的同时，不断将当地动物感染并在短时间内转化为拥有初等智能的巨大兽娘\n尽管他们还没有意识到这一点，但这无疑会在它们探索新世界时带来一些额外的麻烦
  civic_evolution_catalyst_desc: "The main species of this country is a carrier of a special genetic virus\nThis allows them to be unaffected by the virus while constantly infecting local animals and transforming them into giant beast girls with rudimentary intelligence in a short time\nAlthough they haven't realized this yet, it will undoubtedly bring some extra trouble when they explore new worlds"
  # 提升未开化物种会获得大量凝聚力和社会学点数
  civic_evolution_catalyst_effect: "Uplifting pre-sapient species grants significant Unity and Society Research points."
  # 对开化兽娘的态度
  policy_gts_evolution_catalyst_enlightenment_policy: "Attitude Towards Enlightened Beast-Girls"
  # 这些巨大兽娘一经开智，我们就不可能再像对待野生动物一样应对她们了，合适的政策可以让这群懵懂无知的兽娘更好的为我们服务。
  policy_gts_evolution_catalyst_enlightenment_policy_desc: "Once these giant beast-girls become sentient, we cannot treat them as wild animals. Appropriate policies would enable these naive beast-girls to serve us better."
  # 文明开化
  gts_evolution_catalyst_civilization_enlightenment: "Civilization Enlightenment"
  # 既然是我们将她们卷入到群星间的大博弈中，那我们就得承担起相应责任，通过科学知识教育和本国文化熏陶让她们成为和我们一样有智慧，有尊严的文明公民。
  gts_evolution_catalyst_civilization_enlightenment_desc: "Having involved them in the cosmic game, we must take responsibility. Through science and cultural indoctrination, we can turn them into wise and dignified citizens."
  # 公共星怒
  gts_evolution_catalyst_public_RBQ: "Public Star Fury"
  # 是我们将她们从艰难求生的荒野带入到文明社会，作为回报，她们就应该全身心服侍她们的主人。忠诚教育和基因改良会将这些野蛮的兽娘逐步调教成只会傻乎乎地露出肚皮，任凭我们享用的RBQ。
  gts_evolution_catalyst_public_RBQ_desc: "Bringing them from harsh wilderness into civilized society, in return, they should wholeheartedly serve their masters. Loyalty training and genetic modification gradually train these savage beast-girls into docile beings eager to serve."
  # 陆军先锋
  gts_evolution_catalyst_army_vanguard: "Army Vanguard"
  # 一群身手矫捷、强又有力，而又只靠几吨宠物罐头就肯听话的巨娘？还有谁比她们更适合我们的军队！如果能将她们集体划归帝国陆军，我们在地面战场就能和我们的传统宿敌甚至巨娘帝国掰手腕。
  gts_evolution_catalyst_army_vanguard_desc: "A giant girl group agile, strong, and obedient for just a few tonnes of pet food. Who better suits our army? With them in our Imperial Army, we could challenge our traditional foes and even the giantess empire on the battlefield."
  # 温和野化
  gts_evolution_catalyst_gentle_rewilding: "Gentle Rewilding"
  # 巨娘给我们带来的灾祸已经不少了，我们不需要再给自己招来新的麻烦。对现有的兽娘进行集中管理，温和地控制并逐步减少开化兽娘的数量，让这些过早开智的生命慢慢退化并放回她们生活的地方，这个过程或许会相当漫长，但这就是我们偿还自身罪孽的方式。
  gts_evolution_catalyst_gentle_rewilding_desc: "The disasters brought by giantesses are enough; we shouldn't invite more trouble. Manage existing beast-girls, gently control their numbers, and let them revert to uncivilized states over time, paying our penitence slowly."
  # 触媒
  trait_tiny_catalyst: "Catalyst"
  # 那些被开化的巨大兽娘对这一物种有点过分亲近了。我们尚不清楚这种依存性是基于驯化物种对饲主的服从，还是基于野兽对小猎物的狩猎本能。
  trait_tiny_catalyst_desc: "Enlightened giant beast-girls have an excessive affinity for this species. It's unclear if this reliance is due to domesticated animal obedience or a predator's instinct towards small prey."
  # 宜居下限+20%\n与拥有该特质的人口处于同一星球会使§G巨娘人口+10%幸福度，+10%主流思潮吸引§!
  trait_tiny_catalyst_tooltip: "Habitable Limit +20%\nSharing the planet with this trait population increases§G giantess population happiness by 10%, +10% mainstream ideology appeal§!"
  # 强制进化
  trait_gts_force_evolution: "Forced Evolution"
  # 这个物种提前了千万年进化为了智慧生命，这对整个物种的长期影响尚不明确，但她们在适应我们的社会的过程中绝对会惹出麻烦。
  trait_gts_force_evolution_desc: "This species evolved into sentient form millions of years early, with long-term effects unknown. They will undoubtedly cause trouble integrating into our society."
  # 人口增速+50% 舒适度使用+20% 主流思潮吸引-20%
  trait_gts_force_evolution_tooltip: "Population Growth +50%, Comfort Use +20%, Mainstream Ideology Appeal -20%"
  # 赛马娘
  trait_gts_UMA_MUSUME: "Horse Girl"
  # 一群受到三女神赐福的巨大马娘，难道她们并不是因为感染才变大的？
  trait_gts_UMA_MUSUME_desc: "A group of giant horse-girls blessed by three goddesses. Were they enlarged not from infection?"
  # 劳工产出+20%、舒适度产出+20%、人口增速+20%、人口维护费+25%
  trait_gts_UMA_MUSUME_tooltip: "Labor Output +20%, Comfort Output +20%, Population Growth +20%, Population Maintenance +25%"
  # 需要文案  提升未开化物种会获得大量凝聚力和社会学点数（效果同原版创世向导）
  gts_evolution_catalyst_event.1.name: "Literature Required: Evolving uncivilized species provides substantial cohesion and socialogy points (similar effect to Origin Guide)"
  # 需要文案
  gts_evolution_catalyst_event.1.desc: "Literature Required"
  # 需要文案
  gts_evolution_catalyst_event.1.a: "Literature Required"
  # 殖民地遇袭!
  gts_evolution_catalyst_event.3.name: "Colony Attacked!"
  # 我们在§Y[Root.GetName]§!新建的殖民地在今早被巨娘袭击了！\n一群长着兽耳、赤身裸体的巨大 maiden毫无预兆地出现在殖民船登陆点附近。在轻易击溃了毫无防备的卫戍部队后，她们撕开了殖民船船舱，将我们储存的粮食和燃料抢掠一空，酒足饭饱之后，她们甚至就地拿我们刚刚建好的城市玩了起来。\n临时集结的民兵完全拿她们没办法，直到恒星基地驻军的增援抵达才将她们驱离。通过对现场残留的毛发和体液进行分析，我们确信这是§Y[Root.GetName]§!上一种野生动物的近亲。她们很可能在我们刚登陆时进入了人员生活区，随后因感染迅速进化成了巨大兽娘，急剧成长带来的饥饿感让她们吃光了其他动物后，将目光投向了我们。\n看来我们不得不认真处理这些巨娘了。
  gts_evolution_catalyst_event.3.desc: "Our newly established colony on §Y[Root.GetName]§! was attacked by giantesses this morning!\nHuge, nude girls with beastly ears appeared near the landing site without warning. After easily overcoming unprepared guards, they tore open the colony ship and pilfered our stockpiled food and fuel, ravaging our freshly built city with full bellies.\nMilitia could only remove them when reinforcements arrived from the starbase. Analyzing the remaining hair and fluids confirmed they were local wildlife, likely entering the settlement area shortly before rapidly evolving into giant beast-girls. A surge of hunger drove them to exhaust all prey and eventually target us.\nWe must address these giantesses seriously."
  # 这群贱畜！
  gts_evolution_catalyst_event.3.a: "Those beasts!"
  # 如此强大的力量...
  gts_evolution_catalyst_event.3.b: "Such formidable power..."
  # 殖民地来客！
  gts_evolution_catalyst_event.4.name: "Colony Visitors!"
  # 我们在§Y[Root.GetName]§!新建的殖民地在今早迎来了特殊的客人。\n 一群长着兽耳、赤身裸体的巨大 maiden出现在我们殖民地首府附近。\n 她们手脚并用，小心翼翼地沿着公路前进，直到遇到了前来拦截的卫戍部队。出乎我们意料的是，她们没有对我们发起攻击，而是躺倒在地，用肚皮对着我们，然后又起身，向我们比划着什么。最后，兽娘们肚子里的肠鸣揭开了谜底 - 她们饿了。我们打开库存，让她们饱餐了一顿。\n 饭后，她们没有离去，而是留在原地任我们摸摸，在动物学家的帮助下，我们勉强理解了她们的意图。她们本是§Y[Root.GetName]§!上的一种野生动物，在遭遇到我国殖民先遣队后，在极短的时间内进化成了这个样子，急剧成长带来的饥饿感让她们吃掉了能找到了所有猎物，最终在难以忍受的饥饿下，她们铤而走险，来到我们的营地求援。\n 我们得好好想想怎么对待她们了。 
  gts_evolution_catalyst_event.4.desc: "This morning our new colony on §Y[Root.GetName]§! welcomed special guests.\nEnormous nude girls with beast ears appeared near the capital.\nThey cautiously approached along roads until intercepted by guards. Surprisingly, instead of attacking, they lay on their backs, showing bellies before gesturing something.\nEventually, their growling stomachs revealed they were hungry. We fed them from reserves.\nPost-meal, they stayed, allowing themselves to be touched. With the help of zoologists, we barely understood that they were once local wildlife. After encountering our colony vanguard, they quickly evolved, hunger driving them to us in desperation.\nWe must carefully consider our approach to them."
  # 可爱！
  gts_evolution_catalyst_event.4.a: "Adorable!"
  # 或许是可以成为我主人的女人...
  gts_evolution_catalyst_event.4.b: "Perhaps a woman suitable to be my master..."
  # 驯服荒野
  gts_evolution_catalyst_event.11.name: "Taming the Wilderness"
  # 随着我们在§Y[Root.GetName]§!的殖民逐步趋于稳定，我们的殖民者重新将目光投向那群惹是生非的巨大兽娘，不厌其烦的殖民者不断向殖民地政府控诉这些巨大兽娘的罪行又碍于其巨大的体型与非人的力量无法阻止而向我们的殖民地官员要求解决方案，而因为星球殖民地刚刚建立没有多余资源的殖民地政府无力处理这些事件，最终这一系列因为巨大兽娘所引发的案件摆到了我们议会的桌前。\n\n我们的科学家提议在星球当地建立兽娘保留地将这些巨大的生物能对殖民地造成的损失降到最低并顺带以巨大兽娘为蓝本研究巨娘生理，而军方成员宣称一只不受控的爱闹腾的巨大动物是完美的战争武器他们已经开始研究在巨大兽娘上贴爆反的可行性，而在议会的角落一个刚刚兴起的神秘派系的成员向其他议员慷慨陈词道:"既然是动物那便能驯服，我们应当给这些蛮荒的生物带来智慧以便让他们在日后成为我们伟大国家的一员。
  gts_evolution_catalyst_event.11.desc: "As colony stabilized... colonists complained about giant beast girls... local government helpless... sent to council... scientists proposed reservation... military proposed weapons... mysterious faction proposed giving them wisdom..."
  # 划分保留地，让巨娘的大手离我们远点！
  gts_evolution_catalyst_event.11.a: "Establish reservations, keep giantesses away from us!"
  # 让巨娘的裸足成为我们敌人最后看到的东西！
  gts_evolution_catalyst_event.11.b: "Let the giantess's barefoot be the last thing our enemies see!"
  # 驯服巨娘？有趣的尝试。
  gts_evolution_catalyst_event.11.c: "Taming giantesses? An interesting attempt."
  # 收容失效
  gts_evolution_catalyst_event.12.name: "Containment Breach"
  # 我们建立巨娘保留地的尝试失败了，在建设初期那群长着兽耳的巨娘还饶有兴趣的看着我们的工人忙碌，随着工程的推进他们仿佛看腻了一般再次开始袭击我们的殖民地并洗劫我们的粮仓，在施工队强顶着巨娘的骚扰完工时，我们才发现我们的尝试是多么可笑，我们用于搭建保留地所铺设的隔离墙与电网不是被巨娘一脚踢烂就是被她们连根拔起充当玩具。\n\n但我们的尝试并非完全失败，我们的生物行为学家发现这群巨大兽娘更喜欢玩弄以加固墙为主的隔离设施，似乎她们更喜欢结实不易坏的玩具，随即他们建议我们将保留地建设作为常态化工程以用于源源不断的给巨大兽娘提供玩具换取她们减少袭击我们脆弱殖民地的次数。
  gts_evolution_catalyst_event.12.desc: "Reservation attempt failed... Beast girls destroyed fences... preferred sturdy toys... suggested building sturdy reservations..."
  # 批准，顺便把想出保留地方案的人扔给兽娘。
  gts_evolution_catalyst_event.12.a: "Approved, throw the proposer to beast girls."
  # 或许把整个星球作为保留地也可行？
  gts_evolution_catalyst_event.12.b: "Maybe we should stay away from them."
  # 通知各机动特遣队提防其他势力介入。
  gts_evolution_catalyst_event.12.c: "Establish a Giantess Planet Defense Force!"
  # 断箭
  gts_evolution_catalyst_event.13.name: "Broken Arrow"
  # 以巨大兽娘为基础所组建的巨娘星球保卫军的计划十分成功，但似乎有些过于成功了，原本我们计划将敌人与罪犯作为战利品献给那群加入我们军队巨娘让她们的注意力从迫害我们的殖民地转移到玩弄她的战利品上，但当我们拥有巨娘作为武器的传闻不胫而走后，迫于巨娘巨大的破坏力他国已经不敢展现敌意。\n\n而在星球上\"不学好就会被巨大猫娘抓走当玩具，最后吃掉。\"的传闻也让殖民地的犯罪率达到了最低点，虽然这些传闻也吸引来了帝国各地的志愿者自愿成为兽娘的\"战利品\"但数量完全不能满足那群兽娘的需求，最终欲求不满的兽娘们冲出驻地再次开始玩弄起我们的殖民地，正当我们无计可施时一名从兽娘粗暴玩弄中幸存下来的前叛军告诉我们比起小人她们更喜欢玩弄装甲车等金属制品，或许我们可以额外生产一批装备来满足她们日益增长的需求？
  gts_evolution_catalyst_event.13.desc: "The plan to form a Giantess Planet Defense Force based on giant beast girls was very successful, but it seems a bit too successful. Originally, we planned to offer enemies and criminals as trophies to the group of giantesses who joined our army, shifting their attention from persecuting our colonies to playing with their trophies. But after rumors spread that we possessed giantesses as weapons, other countries dared not show hostility due to the immense destructive power of giantesses.\n\nAnd the rumors on the planet that \"if you don't behave, you will be caught by giant cat girls as toys and finally eaten\" also brought the crime rate in the colony to a minimum. Although these rumors attracted volunteers from all over the empire willing to become \"trophies\" for beast girls, the quantity completely failed to meet the needs of those beast girls. Finally, the unsatisfied beast girls rushed out of the station and started playing with our colonies again. Just when we were at our wits' end, a former rebel who survived the rough play of beast girls told us that compared to tiny people, they prefer playing with metal products like armored vehicles. Perhaps we can produce an extra batch of equipment to meet their growing needs?"
  # 批准，顺便把提议给巨娘装爆反的人扔给兽娘。
  gts_evolution_catalyst_event.13.a: "Approved, by the way throw those who proposed ERA for giantesses to the beast girls."
  # 我们的巨娘将武装到牙齿无论她们有几颗牙！
  gts_evolution_catalyst_event.13.b: "Our giantesses will be armed to the teeth, regardless of how many they have!"
  # 或许我们的神主能规劝她们？
  gts_evolution_catalyst_event.13.c: "Maybe our Goddess can persuade them?"
  # 共生关系？
  gts_evolution_catalyst_event.14.name: "Symbiotic Relationship?"
  # 驯服巨娘是所有方案中成功率最低的尤其是在面对一群动不动就对着小人哈气或直接掠走当玩具的巨大兽娘，但我们惊讶的发现，随着方案的推进我们殖民地被兽娘袭击率正在降低，而根据调查我们发现了一种堪称诡异的现象：\n\n鉴于我们并没有限制兽娘的迁徙，为了寻找更多的食物与玩具她们已经\"理所应当\"的在我们殖民地周围筑巢，起初兽娘们以犁庭扫穴之势掠夺我们的粮仓并玩弄我们的殖民者但当她们兴致满满准备袭击下一个殖民地时，不知是出于同情还是想等待殖民地重建好以便继续玩弄，部分兽娘选择留在单一的殖民地并饶有兴致的看着我们殖民者重建，似乎是嘲笑我们重建效率的低下的她们开始成规模的将自己挖到的大片砂土与被轻易折断的木头摆放到殖民地边缘，如此往复我们大部分殖民地免受了巨大兽娘的侵害的同时这群兽娘也部分融入了我们的社会中。
  gts_evolution_catalyst_event.14.desc: "Taming giantesses was the plan with the lowest success rate - especially when facing a group of giant beast girls who would breathe on tiny people or snatch them as toys at a whim. But to our surprise, as the plan progressed, the rate of beast girl attacks on our colonies decreased. Investigation revealed a bizarre phenomenon:\n\nSince we didn't restrict the beast girls' migration, and seeing as they were looking for more food and toys, they had \"naturally\" built nests around our colonies. Initially, they violently raided our granaries and played with our colonists like plowing through fields. But just as they were excitedly preparing to attack the next colony, perhaps out of sympathy or waiting for the colony to rebuild so they could play again, some chose to stay at a single colony and watch us reconstruct with great interest. Seemingly mocking our slow rebuilding efficiency, they began to move large patches of sand and trees they easily snapped, placing them at the colony's edge in scale. Repeating this, most of our colonies were spared from giant beast girl attacks, and this group of beast girls partially integrated into our society."
  # 我们驯服了巨娘？
  gts_evolution_catalyst_event.14.a: "We tamed the giantesses?"
  # 或许更进一步我们可以完全驯服她们？
  gts_evolution_catalyst_event.14.b: "Maybe we can completely tame them if we go a step further?"
  # 我们在§Y[Root.GetName]§!上的殖民地发现了当地进化完成的巨大兽娘
  gts_evolution_catalyst_event.300.name: "Evolution Complete: Giant Beast-Girls Found on §Y[Root.GetName]§!"
  # 这些兽娘由当地一种四足行走的哺乳类动物进化而成，长有马耳和马尾。因此，殖民地工作人员按照家乡的传说将这一物种命名为马娘。\n 尽管我们对兽娘的天生怪力已经有所了解，但这些马娘的身体素质依然令人印象深刻。她们的力量和速度比我们见过的其他兽娘还要强大，她们可以成为我们最优质的战士，也可以作为田径运动员大放光彩。\n 不过无论前途如何，她们都得先得到正规训练才行。一个关于组建马娘训练与繁育中心 - 特雷森学园的计划已经在政府授权下展开了。
  gts_evolution_catalyst_event.300.desc: "These beast-girls evolved from local quadrupedal mammals with horse ears and tails. Colony staff named them after mythical creatures from home.\nDespite knowing the beast-girls' natural strength, these horse-girls' attributes are remarkably impressive. Their power and speed surpass other beast-girls, making them exceptional warriors or athletes.\nHowever, they require formal training first. Plans for establishing a horse-girl training and breeding center - Tresten Academy - are underway with government approval."
  # 好大的马娘！
  gts_evolution_catalyst_event.300.a: "Such majestic horse girls!"
  # 兽娘远征军团
  gts_evolution_catalyst_kemono: "Beast-Girl Expedition Corps"
  # 兽娘远征军团
  gts_evolution_catalyst_kemono_plural: "Beast Girl Expeditionary Army"
  # 来自不同星球、不同生态区的兽娘军团，生来的使命就是在无尽的星海间征战、毁灭世界和涩涩。
  gts_evolution_catalyst_kemono_desc: "A corps of beast-girls from different planets and biomes, destined for cosmic warfare, world destruction, and pleasures."
  # 兽娘安置委员
  councilor_gts_kemono_placement: "Beast-Girl Placement Councilor"
  # 这个棘手的岗位需要接触性情各异的巨大兽娘，并负责她们的寄养家庭分配工作。
  councilor_gts_kemono_placement_desc: "This challenging role involves managing giant beast-girls with various temperaments and overseeing their foster family assignments."
  # 未开化兽娘
  GTS_PRE_TROUBLESOME: "Unenlightened Beast-Girls"
  # 兽娘
  GTS_KEMONO: "Beast-Girls"
  # 赛马娘
  GTS_UMA_MUSUME: "Horse-Girls"
  # 特雷森学园
  gts_Umamusume_school: "Tresten Academy"
  # 管理银河系顶级体育赛事URA和赛马娘繁育工作的组织坐落于此，繁荣的经济和每年大量的训练员招募空缺吸引着无数年轻人前来碰碰运气。
