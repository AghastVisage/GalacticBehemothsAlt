  # 作为神明最虔诚的信徒之一，她唯一的愿望就是做神明身上的小小寄生虫，世俗的权力对她来说只是为神明服务的工具
  gts_prescripted_countries_4_custom_biography: "As one of the deity's most devout followers, her only wish is to be a tiny parasite on the deity; to her, worldly power is merely a tool for serving the deity."
  # 巨娘踩踏了我们的星球，却创造了我们，生存很困难，但我们总算是熬出头了，不仅仅是爬出了靴底，更是飞向了太空。所以，你是支持白丝党，还是支持黑丝党，还是支持裸足党，还是支持棉袜党.....
  gts_prescripted_countries_4_species_bio: "The Giantess trampled our planet, yet she created us. Survival was tough, but we finally made it through - not only did we crawl out from under her boot, but we also flew into space. So, are you Team White Silk Stockings, Team Black Stockings, Team Bare Feet, or Team Cotton Socks..."
