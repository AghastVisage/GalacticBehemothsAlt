  gts_prescripted_countries_3_species_bio: "Have you ever seen that perfect deity? Her divine form, flawless skin, and peerless beauty—just one glance is enough to make you fall in love. Ah! O sacred deity, we thank you for your blessings. We will press onward, striving only to draw closer to you—not seeking your favor once more, but simply longing to behold your face again."
