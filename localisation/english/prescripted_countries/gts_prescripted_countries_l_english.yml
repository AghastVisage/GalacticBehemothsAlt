  gts_prescripted_countries_5_custom_biography: "As the Grand Administrator of the Contracted Nations, she acts swiftly and efficiently, effectively managing and directing the operations of the various colonies located within the Giantesses’ private areas. At the same time, she handles the personnel allocation issues arising from the new care contracts."
  gts_prescripted_countries_5_species_bio: "On the endless, vast white plain, hundreds of massive colonial ships stood ready to set sail, and dense crowds boarded the starships, about to embark on a journey to a new world. \n“Noble Goddess, in accordance with the agreement between our two nations, the treaty has taken effect. We thank you for your generosity and grace. For countless ages to come, the people of our nation will dwell, generation after generation, within your sacred and serene world of caves, and will tirelessly cleanse and tend to your beautiful sanctuary at all times.”"
