  gts_prescripted_countries_5_custom_biography: "The grand director of the contract nation, she is swift and capable in her work and in practice controls and directs the affairs of the colonies within each giantess's private parts. At the same time, she handles manpower allocation issues brought about by new care contracts."
#  无尽苍茫的白色平原上，数百艘巨大的殖民舰整装待发，密密麻麻的人群登上星舰即将踏上前往新世界的旅程。\n“高贵的女神，根据两国间的协议，契约已经生效。感谢您的包容与恩赐往后无尽的岁月中我国国民将世世代代居住在您圣洁温润的穴道世界之中并无时无刻清洁护理您美丽的圣域。”
  gts_prescripted_countries_5_species_bio: "On the endless, vast white plain, hundreds of enormous colony ships stand ready to depart, and densely packed crowds board the starships, about to set out on the journey to a new world.\\n\"Noble goddess, according to the agreement between our two nations, the contract has now taken effect. Thank you for your tolerance and grace. Through the endless years to come, our citizens shall live for generations within your holy and warm vaginal world, constantly cleaning and caring for your beautiful sanctuary.\""
