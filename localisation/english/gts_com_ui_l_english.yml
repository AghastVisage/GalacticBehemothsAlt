  # 每一位装备$gts_leader_item_p_transform$的巨娘领袖将给帝国提供:\n§G+20%§!装备者经验获取\n§G+30§!活体金属产出\n§G+0.5§!影响力产出
  gts_leader_item_p_transform_active: "Each giantess leader equipped with the $gts_leader_item_p_transform$ will provide the empire with:\n§G+20%§! Carrier Experience Gain\n§G+30§! Living Metal Output\n§G+0.5§! Influence Output"
  # §Y小小灰§!
  gts_leader_item_p_graygoo: "§YLittle Gray§!"
  # 自小灰加入我们后，纳米机器人方面的科技突飞猛进，如今我们的科学家已经可以创造简单的纳米机器聚合体，为领袖提供各项服务\n\n小小灰拥有良好的适应性，能够在领袖身体上任何部位生存并完成侍奉，满足领袖的各种特殊需求，服务经验丰富，无任何喂食需要，24小时全天在线服务，无需担心不小心损坏，纳米机器的强大复原力可以支持超长期使用，可爱的外表更是领袖间互赠礼物的最好选择\n\n以下由知名星域领袖为您带来注意事项：小小灰可以为几乎全部体型的巨娘服务，只需购买后为其投喂相应的合金或食物便可使用（根据购买类型，可在包装盒侧面查看）请勿过量投喂！\n\n若保管不善造成丢失，请尽快向总督汇报，以防止其过量进食造成损害！\n\n祝各位使用愉快，最后强调切忌过量投......*重物落地的声音 投喂小灰喵，投喂小小灰谢谢喵！
  gts_leader_item_p_graygoo_desc: "Since Little Gray joined us, our nanotechnology has advanced by leaps and bounds. Our scientists can now create simple nanobot aggregates to provide various services for leaders.\n\nLittle Gray has good adaptability, being able to survive and serve on any part of the leader's body, fulfilling various special needs. Little Gray has extensive service experience, requires no feeding, is available 24/7, requires no worry about accidental damage, and nanobot regeneration allows for super long-term use. Its cute appearance is also the best choice for a gift between leaders.\n\nThe following are some tips from a well-known star sector leader: Little Gray can serve almost all sizes of giantesses, and can be used once purchased and appropriately fed with alloys or food (depending on the purchase type, see the side of the box). Please do not overfeed!\n\nIf lost due to improper storage, please report to the governor as soon as possible, to prevent damage caused by overeating!\n\nEnjoy using, and finally, remember not to overfe... *Sound of heavy object falling* Feed Little Gray meow, feed Little Gray thank you meow!"
