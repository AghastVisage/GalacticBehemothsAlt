  # 一批来自缩小城市的女仆团管理着这位领袖肠胃里的微观宇宙\n\n经过抗酸基因强化的女仆团可以在做好防护的情况下进入消化液拖拽出的确难以消化的特种合金进行专门处理，她们也会根据主人今日的饮食发布酸液警戒线和预计退潮时间来帮助缩小星球进行开采\n\n当胃袋里收集的合金数量足够多时，女仆长会全副武装地携带这些合金潜入幽门，经过漫长又危险的旅途后抵达大肠，向回收部门提交这段时间的收集品
