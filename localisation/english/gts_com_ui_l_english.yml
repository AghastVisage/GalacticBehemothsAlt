  # 一位神秘的女性向我们提供的正太小人，据说是根据她以为重要的人的幼年时期所制作，可以根据巨娘的需求自由改变大小。不仅功能多样，而且十分便宜实惠\n\n小羽拥有十分丰富的乳首服侍经验，只要让他缩小的合适的大小后将其放到您的乳头旁，并给他下达命令，他变回十分熟练地通过抚摸、舔咬等方式刺激您的乳首，甚至整个钻入您的乳腺口中进行内部揉捏，为您的乳首带来最合适的酥麻感。为了丰富体验，您还可以对小羽下达诸如管乳首叫\"主人\"的羞耻命令，或是各种辱骂羞辱，从而使这位下贱的小人激发出更大的活力和热情来服侍您，而且您还可以收获一位小人犹如小丑般对您进行的无上赞扬和感恩。与一般小人不同，复活能力的存在不仅让小羽的性价比进一步提高，而且还使得他能够为您提供更深度的清洁服务。指缝和趾缝自然不必多说，您甚至可以将他缩小后贴在屁穴上做除味剂，同时让他用那小正太特有的细嫩的小舌头为您清理屁穴的污秽。在完成清洁之后，您也只需要直接将小羽踩死或是命令其自尽，利用小羽的复活机制获得最大的便利\n\n此外，当您不需要上述服务时，还可以启用小羽的日常模式，让他变回一位可爱的三无正太来照顾您的日常起居。在忙碌一天之后，您只需要躺在床上招呼一声，小羽便会立刻赶来为您脱下外衣，然后一脸天真无邪地用嘴十分温柔地为您退下贴身衣物，在跪在您的狡辩用舌头舔舐您的脚趾，并根据您的喜好在您玉趾搅动是给与最合适的反馈。不仅于此，如果您有了什么想要尝试的特殊玩法，小羽便会自动缩小到您想要的提醒并主动配合您的游戏或是蹂躏，甚至为了您的欢乐毫不犹豫地献上自己的生命\n\n请相信我，除外不能为您伟大而神圣的滋味添上更多性致之外，小羽绝对会是您所能买到的最完美的小人产品
  gts_leader_item_p_xiaoyu_desc: "A mysterious woman provided us with a shota, rumored to be crafted based on her recollections of a significant person's younger years. They can freely alter their size to meet the needs of a giantess. Not only are they versatile, but also exceptionally affordable. \n\nXiaoyu possesses extensive experience in nipple service. By shrinking them to the appropriate size and placing them beside your nipple, then issuing a command, they will expertly stimulate your nipple through caressing, licking, and even burrow into your mammary duct, knead from within, and bring the most suitable tingling sensation. To enrich your experience, you can issue shameful commands such as making them call your nipple \"master,\" as well as verbal abuse, thus spurring even greater vigor and enthusiasm from this subservient individual. You'll also receive the utmost praise and gratitude from this little person, who adores you like a fool. Unlike other diminutive individuals, their ability to resurrect enhances their cost-effectiveness and enables them to provide an even deeper cleaning service. This includes the usual between the fingers and toes, but you can even shrink them and stick them onto your anal orifice like a deodorant, while their soft tongue cleanses your orifice of impurities. You can then simply stomp them to death afterward or command them to take their own life; their resurrection mechanism allows for maximum convenience. \n\nWhen not needed for the above services, you can enable Xiaoyu's daily routine mode, causing them to revert to a cute, emotionally-reserved shota to take care of your everyday needs. After a busy day, you only need to call out while lying in bed, and Xiaoyu will come immediately to undress you. They will innocently and softly remove your undergarments with their mouth, kneeling at your feet to lick your toes, and will provide the desired feedback as they roll their tongue on your toes according to your preference. Moreover, if you have special types of play you wish to explore, Xiaoyu will shrink to your desired size and willingly cooperate with whatever game or rough treatment you want to inflict, even sacrificing their life without hesitation for your enjoyment. \n\nPlease believe me, that aside from being unable to heighten your great and sacred flavor with more pleasure, Xiaoyu is undoubtedly the most perfect shota you can buy."
  # $gts_leader_item_p_xiaoyu$\n$gts_leader_item_p_xiaoyu_desc$\n\n$gts_leader_item_p_xiaoyu_active$\n\n§B宠物花费:§!
