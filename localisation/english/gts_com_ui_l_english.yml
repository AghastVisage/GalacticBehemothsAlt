  # 一批来自缩小城市的女仆团管理着这位领袖乳腺内的微观宇宙\n\n这些经过水下活动特训的女仆团甚至可以在她们的主人喷乳时保持前进，她们要对每次喷乳后乳腺内的通道走向、出乳泉眼和幸存缩小文明进行调查整理，以便向乳腺里安置新的缩小星球，不过由于§Y[Root.GetName]§!愈发频繁的自慰活动，女仆团的工作也变得愈发繁忙了\n\n对帝国公民来说，§Y[Root.GetName]§!乳腺内奇妙多变的景象无疑是个旅游的好地方，因此女仆团经常也会在抹胸中载着帝国各地的旅客前来参观，赚取不少观光收入
