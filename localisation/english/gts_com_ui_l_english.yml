  # §Y安露§!
  gts_leader_item_p_tensi: "§YAnlu§!"
  # 一位侍奉于恶魔的天使，在请求了千海之后获得了一个同样可以在小小宇宙中自由活动的身体。\n\n但在安露来到微缩宇宙中之后，第一时间是重回令她最感到安全的地方 -  -  - 千海的体内。现在她每日工作就是在魅魔 maiden的肠道内游走，为千海清理着并不会存在的代谢废物。\n\n但毕竟千海的耐心是有限的，安露没法在她的体内一直摸鱼下去\n\n§r\"要么被我消化，要么出来干活！\"§!
  gts_leader_item_p_tensi_desc: "An angel who serves a demon, after requesting Qianhai, obtained a body that could also move freely in a miniature universe.\n\nBut after Anlu arrived in the micro-universe, the first thing she did was return to the place where she felt the safest - inside Qianhai's body. Now she works daily wandering in the succubus girl's intestines, cleaning non-existent metabolic waste for Qianhai.\n\nHowever, after all, Qianhai's patience is limited, and Anlu cannot keep slacking off in her body.\n§r\"Either be digested by me, or come out and work!\"§!"
