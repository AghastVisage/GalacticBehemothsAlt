  # 一批来自缩小城市的女仆团管理着这位领袖阴毛丛和蜜穴里的微观宇宙\n\n这些经过粘性体液抗性训练的女仆团可以在黏滑的阴道内壁上健步如飞，她们需要每天对§Y[Root.GetName]§!的阴道进行巡查，以避免某些不长眼的文明意外飘入它们不该进来的地方，作为奖赏，这些星球往往会被二次缩小后奖励给女仆玩弄\n\n甜腻的阴部环境在刺激性欲的同时，也会让人的思维更加敏捷，在互扣后的贤者时间里，女仆们最大的爱好就是聚在阴道里研究最前沿的数学难题，这为我们的科学研究提供了不少帮助
  gts_ui.242.desc: "A maid corps from a shrunken city manages the microcosm within this leader's pubic hair and honey cave.\n\nThese maid corps, trained for resistance to viscous liquids, can walk nimbly on the slick walls of the vagina. Their daily tasks include inspecting §Y[Root.GetName]§!'s vagina in order to prevent random civilizations accidentally floating to places they shouldn't be and as a reward these planets will be shrunken a second time and given to the maids to play with.\n\nThe sweet, feminine environment of the genital area stimulates sexual desire, while also making their minds more sharp. During the post-nut clarity phase, the maids most enjoy gathering inside the vagina to study the cutting edge mathematical problems which aids in our scientific research quite a bit."
