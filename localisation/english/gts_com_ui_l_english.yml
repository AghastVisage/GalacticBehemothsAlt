  # [current_gts_leader.GetName]的腋下世界
  gts_ui.211.name: "[current_gts_leader.GetName]'s Armpit World"
  # 一些被赐予女神之力的小人统治着这位领袖腋下的微观宇宙\n\n根据其神力的来源，这些女神会在用腋下夹扁或磨碎星球时获得大量的快感和巨娘赐福，因此她们每天的工作就是在舔干§Y[Root.GetName]§!腋下大块污渍的同时，寻找那些大型星球给自己擦汗\n\n§Y[Root.GetName]§!腋下丰沛的出汗量让当地的能量币产出稳居体表世界第一，这些体型适中的女神们因此有了新的职能 -  - 作为体外世界和腋下微世界的中介，进行能量币和§Y[Root.GetName]§!私密写真交易
  gts_ui.211.desc: "Some small people, blessed with goddess power, rule over the microcosm within this leader's armpit.\n\nDepending on the source of their divine power, these goddesses experience great pleasure and giantess blessings when they crush or grind planets using their armpits. Therefore, their daily work involves licking away large stains from §Y[Root.GetName]§!'s armpit while searching for large planets to wipe sweat on.\n\n§Y[Root.GetName]§!'s abundant armpit sweat production keeps the area's energy coin production at the top among all body surface worlds. These moderately sized goddesses have thus taken on a new role - as intermediaries between the external world and the armpit microcosm, trading energy coins and §Y[Root.GetName]§!'s private photographs."
  # \n\n\n£gts_leader_body_1_1_trait_picture£ \n\n\n\n
  gts_leader_body_1_1_trait_picture: "\n\n\n£gts_leader_body_1_1_trait_picture£ \n\n\n\n"
