  # 一些被赐予女神之力的小人统治着这位领袖肠胃里的微观宇宙\n\n根据其神力的来源，这些女神会在吞食和消化星球的过程中获得大量的快感和巨娘赐福，因此她们每天的工作就是在协助§Y[Root.GetName]§!消化的同时，寻找来满足自己无尽的吞食欲\n\n在巨娘的胃袋里发现什么也不奇怪，这些女神会加速各种矿石合金制品的融化分解，以减轻帝国回收人员在肠道里回收资源时的难度
