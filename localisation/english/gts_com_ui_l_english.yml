  gts_leader_item_p_115_desc: "115 is a shrunken person used to solve the physiological needs of giantesses. They possess a high degree of intelligence and can react normally to the giantess's behavior. The surface of their body has been specially treated to be able to withstand general interaction with giantesses. The special texture of the flesh provides a better taste and brings you a unique swallowing experience.\n\nPrecautions:\nThis product is designed for 10-100x giantesses and is not suitable for giga giantesses.\nDuring interaction, do not let 115 come into contact with weapons.\nIf lost accidentally, please use the self-destruct button on the included controller to prevent 115 from developing a highly aggressive small person civilization and accidentally harming the giantess."
