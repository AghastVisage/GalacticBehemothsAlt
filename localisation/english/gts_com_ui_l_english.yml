  # [current_gts_leader.GetName]的腋下世界
  gts_ui.213.name: "[current_gts_leader.GetName]'s Armpit World"
  # 数百万个缩小星球分布在这位领袖腋下的微观宇宙中，其上的微缩文明构成了这位领袖体表生态圈的基本单位\n\n这些星球通常围绕腋毛公转，而旺盛的汗液蒸腾沿着腋毛上升又最终使得这些星球呈南北方向自转，这迫使这些文明将自己的星球拆解为空岛群或干脆集体搬迁至腋毛上\n\n腋底因其高热潮湿的环境而完全不适宜居住，这对于那些注重个人卫生而剪短腋毛的领袖身上的文明尤为明显，不过尽管生存环境恶劣，通过蒸腾时强劲的风能和地热，这些文明借此发展出强大的能源工业
  gts_ui.213.desc: "Millions of shrunken planets are scattered within the microcosm of this leader's armpit. The miniature civilizations on them form the basic units of this leader's body surface ecosystem.\n\nThese planets typically orbit around the armpit hairs. Vigorous sweat evaporation rises along the armpit hairs and ultimately causes these planets to rotate on a north-south axis. This has forced these civilizations to dismantle their planets into sky islands or simply relocate collectively to the armpit hairs.\n\nThe armpit pit, due to its hot and humid environment, is completely unsuitable for habitation. This is especially noticeable in civilizations belonging to leaders who value personal hygiene and trim their armpit hair short. However despite the harsh living conditions these civilizations have developed a strong energy industry using the powerful wind energy and geothermal activity generated by the evaporation."
