  # §Y神秘堡垒§!
  gts_leader_item_p_fortress: "§YMysterious Fortress§!"
  # 不管是谁，他们一定十分热衷于字谜和隐语，曾有人在排列出了装置的满意解之后，从堡垒中成功取出一些用于其中奇妙装置装置的金属部件，成功从堡垒中死里逃生，但是很多人则并未办到\n[Root.GetName]喜欢把抓到的小人扔进这个小金属盒子里，和其他领袖赌有几个能活着出来的
  gts_leader_item_p_fortress_desc: "Whoever they are, they must be very fond of puzzles and idioms. Someone, after arranging the device to a satisfactory solution, successfully extracted some metal parts used in its wonderful device from the fortress, and successfully escaped from the fortress, but many people did not.\n[Root.GetName] likes to throw the captured little people into this small metal box and bet with other leaders on how many will come out alive."
