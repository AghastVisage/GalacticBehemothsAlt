  # [current_gts_leader.GetName]的腋下世界
  gts_ui.212.name: "[current_gts_leader.GetName]'s Armpit World"
  # 一批来自缩小城市的女仆团管理着这位领袖腋下的微观宇宙\n\n这些经过高温体液抗性训练的女仆团可以安全的在汗液海中行动，并清理分泌过多的汗液以保证§Y[Root.GetName]§!腋下的清爽，她们也会在各个巨大腋毛中巡视，向空岛文明收取能量币，运输生存物资，一定程度上充当了快递员的角色\n\n这些善良勤劳的巨娘女仆的辛勤工作是腋下世界这种恶劣环境得以长期运行的重要支柱，对帝国宣传部门是非常宝贵的素材
  gts_ui.212.desc: "A maid corps from a shrunken city manages the microcosm within this leader's armpit.\n\nThese maid corps, trained for high-temperature bodily fluid resistance, can safely move in the sea of sweat and clean up excessive secretions to ensure §Y[Root.GetName]§!'s armpits are refreshed. They also patrol between the giant armpit hairs, collecting energy coins, transporting supplies to the sky island civilizations, and acting as couriers to some extent.\n\nThe diligent work of these kind and hardworking giantess maids is an important pillar for maintaining the long-term operation of the armpit world despite its harsh environment, making them invaluable material for the empire's propaganda department."
