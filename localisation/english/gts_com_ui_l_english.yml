  # 一批来自缩小城市的女仆团管理着这位领袖足底的微观宇宙\n\n这些经过足臭抗性特训的女仆团负责在§Y[Root.GetName]§!的打扫足纹和趾缝间的死皮、油脂和汗垢，有时，当那些缩小星球无法完成自己的工作时，女仆们会抓阄选人去趾缝中进行\"辅助清洁\"工作\n\n在清理的时候女仆们经常能在这些垃圾中找到不少古老文明的城市，战舰和星球碎片\n\n§Y[Root.GetName]§!自然是不可能回忆起这些螳臂挡车的微小文明是什么时候毁灭在自己的足下的，但其中一些好看的文物在清洗后可以送到我们的帝国博物馆进行展览
  gts_ui.252.desc: "A maid corps from a shrunken city manages the microcosm within this leader's soles.\n\nThese maid corps, specially trained for foot odor resistance, are responsible for cleaning §Y[Root.GetName]§!'s foot wrinkles and the dead cells, oil, and sweat stains in between her toes. Sometimes, when the shrunken planets cannot complete their tasks, the maids will draw lots and chose someone to perform \"assisted cleaning\" work inside the toe crevices.\n\nDuring the cleaning process the maids often discover the cities, warships and planet fragments of many ancient civilizations within this debris.\n\n§Y[Root.GetName]§! naturally has no recollection of when these tiny civilizations were destroyed under her feet, but some of the more elegant artefacts, after cleaning, can be sent to our imperial museums for display."
