  # §Y小花田§!
  gts_leader_item_p_huatian: "§YLittle Huatian§!"
  # 小花田是帝国科研人员研制出的新一代消耗品缩小人，具有基本智慧功能，相较于历代缩小人消耗品上调了服从度，能够听从巨娘的一切命令，身体经过特殊改造后可以在10cm至10nm范围内调节大小，满足巨娘的多种偏好。此外，随包装附赠的控制器允许巨娘调整小花田的身体指数，以防消耗品被无意识碾碎，同时，特制的身体成分在小花田被吃掉后可以为巨娘补充各种微量元素，保障身体安全！\n\n注意事项：\n适合多种体型巨娘使用，通过控制器即可控制小花田缩小人体型。\n如果不慎将小花田遗失在身体某处，建议将其体型调节至十纳米大小，她会自生自灭的。\n\n*本品生产的全部小花田缩小人均为无自我意识的克隆体，如果在使用过程中发现存在自我意识、声称自己来自于终末地星系的小花田，请立即稳定其情绪并送至星域总督处，以免发生意外！*
  gts_leader_item_p_huatian_desc: "Little Huatian is a new generation of consumable shrunken humans developed by the Empire's researchers. They have basic intelligence functions and have an increased degree of obedience compared to previous generations of consumable shrunken people. They are able to obey all orders of the giantess .Their bodies have been specially modified to adjust their size within the range of 10cm to 10nm to meet the various preferences of giantesses. In addition, the controller included with the package allows the giantess to adjust the physical parameters of Little Huatian to prevent the consumable from being crushed unintentionally. At the same time, special body composition can supplement various trace elements for the giantess after Little Huatian is eaten, ensuring her physical safety!\n\nPrecautions:\nSuitable for use by giantesses of various body types, use the controller to adjust the shrunken human body size of Little Huatian.\nIf you accidentally lose Little Huatian somewhere on the body, it is recommended to adjust her body size to ten nanometers, and she will fend for herself.\n\n*All Little Huatian shrunken people produced by this product are mindless clones. If you find that any of them have self-awareness or claim to be from the End of the World star system, please immediately stabilize their emotions and send them to the Sector Governor to avoid accidents!*"
