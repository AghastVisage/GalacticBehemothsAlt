  # 一些被赐予女神之力的小人统治着这位领袖趾间与足纹里的微观宇宙\n\n依据其神力的来源，这些女神会在用脚摧毁城市时获得大量的快感和巨娘赐福，因此她们每天的工作就是在服侍§Y[Root.GetName]§!的足底的同时，寻找满意的目标去乱踩一通，§Y[Root.GetName]§!脚底丰富的出汗量和足味为她脚下女神的灵能开发起到了很大帮助，这让她们能在神力充足时进入异域星界，顺便为我们的探索工作提供些便利
  gts_ui.251.desc: "Some small people, blessed with goddess power, rule over the microcosm within this leader's toes and foot wrinkles.\n\nDepending on the source of their divine power, these goddesses gain great pleasure and giantess blessings when they destroy cities with their feet. Therefore, their daily work involves serving §Y[Root.GetName]§!'s soles and searching for suitable targets to stomp on randomly. The abundant sweat and foot odor of §Y[Root.GetName]§!'s feet greatly aids the psionic development of the goddesses under her feet, allowing them to enter otherworldly astral planes and provide some convenience to our exploration missions when their divine power is ample."
