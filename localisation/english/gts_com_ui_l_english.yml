  # 一些被赐予女神之力的小人统治着这位领袖乳腺内的微观宇宙\n\n根据其神力的来源，这些女神会在双乳夹碎星球或乳吞星球时获得大量的快感和巨娘赐福，因此她们每天的工作就是在刺激§Y[Root.GetName]§!的乳首的同时，寻找合适的星球塞进乳头自慰\n\n这些女神的日常工作经常会产生一些副产品 -  - §Y[Root.GetName]§!分泌的大量乳汁，收集装罐之后，这笔资源能为帝国提供更多样的食物来源
