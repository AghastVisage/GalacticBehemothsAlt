  gts_ui.223.desc: "Millions of shrunken planets are scattered within the microcosm of this leader's mammary glands. The miniature civilizations on them form the basic units of this leader's internal ecosystem.\n\nThe evaporation of breast milk has dyed both the sky and seas of all the planets milky white, providing the inhabitants with endless food and energy. However all beauty comes at a price, when §Y[Root.GetName]§! begins to self-stimulate the massive waves in the milky seas completely pulverize most of the planets.\n\nFortunately, the inhabitants of the mammary glands completely rely on breast milk for survival and their souls are bound to the nipples of their mistress, when §Y[Root.GetName]§! finishes stimulating herself, and is satisfied and asleep, they are reborn on new planets with the help of the maids and continue their lives."
