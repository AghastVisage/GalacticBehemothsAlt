  # 数百万个缩小星球遍布这位领袖肠胃内的微观宇宙中，其上的微缩文明构成了这位领袖体内生态圈的基本单位\n\n这些星球通常分布在肠胃的边缘，依靠星球自身的光源，其上的文明心惊胆战地看着无数比它们的星系都要大个无数倍的食物或其他物质被胃液在十几分钟内消化，而它们则会在消化反应渐弱时冒险降落到食物残骸附近收集可用的资源，§Y[Root.GetName]§!的行走或睡梦中的翻身就会让数个星域被酸液淹没，为数不多的幸运儿或许会被消化液的气泡中裹挟到大肠，最后被菊穴排出\n\n数百万个星球的营养，或许能够为§Y[Root.GetName]§!提供出一滴汗的能量
  gts_ui.233.desc: "Millions of shrunken planets are scattered throughout the microcosm within this leader's stomach. The miniature civilizations on them form the basic units of this leader's internal ecosystem.\n\nThese planets are typically located at the edges of the stomach. Relying on their own planet's light sources, the civilizations watch in terror as foods and other materials many times larger than their star systems get dissolved by stomach acid within the span of a dozen minutes, they then risk landing near the food scraps once the digestion reactions have weakened in order to gather available resources. §Y[Root.GetName]§!'s movements while walking or during sleep will have several sectors of star systems submerged by acid. The few lucky ones can possibly be carried to the large intestines encapsulated by the digestive acid bubbles and lastly discharged via the \"Chrysanthemum Gate\".\n\nThe nutrients from millions of planets may provide enough energy for §Y[Root.GetName]§! to excrete one drop of sweat."
