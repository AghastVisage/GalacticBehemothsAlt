  # 一些被赐予女神之力的小人统治着这位领袖阴毛丛和蜜穴里的微观宇宙\n\n根据其神力的来源，这些女神会在用小穴吞没星球时获得大量的快感和巨娘赐福，因此她们每天的工作就是在刺激§Y[Root.GetName]§!阴核和敏感带的同时，寻找合适的星球扣进下体自慰\n\n巨娘领袖的蜜穴长期以来一直是帝国海军部的武器实验场，而在蜜穴内寄居的女神们通过对§Y[Root.GetName]§!的高潮管理，可以协助帝国海军部更好的进行测试
  gts_ui.241.desc: "Some small people, blessed with goddess power, rule over the microcosm within this leader's pubic hair and honey cave.\n\nDepending on the source of their divine power, these goddesses gain a great deal of pleasure and giantess blessings when they swallow planets via their *yoni*, therefore, their daily task involves stimulating §Y[Root.GetName]§!'s clitoris and erogenous zones while seeking suitable planets to insert into their nether regions for self-gratification.\n\nThe giantess leader's honey cave has long been a weapons test site for the Imperial Navy. The goddesses residing inside the honey cave, through their control of §Y[Root.GetName]§!'s orgasms, aid the Imperial Navy in better conducting their tests."
