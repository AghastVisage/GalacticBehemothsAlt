  # 在了解了其他领袖的需求后，林凤\"勉为其难\"的制作了一批拥有部分独立意识的她的分身，并将这批分身交给我们调配。和林凤本人完全没有区别，除了没有林凤本人耐用之外，完全就是完美的玩具
  gts_leader_item_p_linfeng_desc: "After understanding other leaders' needs, Lin Feng 'reluctantly' made a batch of her clones with partial independent consciousness and handed them to us for allocation. Completely identical to Lin Feng herself, except not as durable, they are perfect toys."
