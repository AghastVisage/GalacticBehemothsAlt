  # 数百万个缩小星球分布在这位领袖阴毛丛与蜜穴内的微观宇宙中，其上的微缩文明构成了这位领袖穴内生态圈的基本单位\n\n这些星球分为两大集群，一部分围绕在阴毛森林底部，一部分散布在阴唇和阴道里，但无论如何，星球都被禁止越过子宫口，违者会被女仆甚至女神亲自毁灭，只不过能在一位巨大 maiden的蜜穴内长期生活，谁会忍得住继续深入的诱惑呢？\n\n长期处在充满催情气体的宇宙中让全体居民都保持着高涨的体力和精神状态，这让它们可以使用相对较少的爱液生产出媲美体外发电区划的能量币
  gts_ui.243.desc: "Millions of shrunken planets are scattered throughout the microcosm within this leader's pubic hair and honey cave. The miniature civilizations on them form the basic units of this leader's inner ecosystem.\n\nThese planets are divided into two major clusters. One is located at the base of the pubic hair forest. The other is scattered around the labia and vagina. But in any case, the planets are forbidden to go beyond the cervix. Those who violate that will be personally destroyed by the maids or even the goddesses themselves. However, being able to live in the honey cave of a giant girl for extended periods of time, who could resist the lure of continuing to go even deeper?\n\nThe residents' bodies and mental state, kept at a high level, due to living in a universe filled with aphrodisiac gases, allows them to produce as much energy coins in the love fluid production sector as external power production sectors with comparatively less effort."
