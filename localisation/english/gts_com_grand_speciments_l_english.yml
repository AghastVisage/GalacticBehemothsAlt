  # 千海的文明展柜
  gts_specimens_display_cabinet: "Qianhai's Civilization Display Cabinet"
  # 一款富有少女风格的白色多层展柜，多层独立密封的空间中银色光华流转，奇异的力量影响掌控着其中文明发展的一丝一毫。
  gts_specimens_display_cabinet_desc_short: "A white multi-layer display cabinet rich in girlish style. In the multi-layer independent sealed space, silver brilliance flows, and strange power influences and controls every bit of civilization development within."
  # 千海女神的造物，多层独立分隔的设计使每一层储柜不管是星云状结构宇宙还是地平世界都能被有效收容，并可肆意调控位面状态。
  gts_specimens_display_cabinet_desc_details: "Creation of Goddess Qianhai. Multi-layer independent separation design enables every storage cabinet to effectively contain whether nebula-like structure universe or flat world, and can wantonly adjust the plane state."
  # 超密度爱液结晶(暂无图)
  #  超密度爱液结晶
  gts_specimens_love_fluid_crystallization: "Super Dense Love Fluid Crystallization"
  gts_specimens_love_fluid_crystallization_desc_short: ""
  # 原本是一颗行星，被一位天体级巨娘塞入下体后奇迹般地没有被完全粉碎，在这位天体级巨娘把体型调整到普通大小后，它和包裹着它的爱液也一同被浓缩成了现在的模样
  gts_specimens_love_fluid_crystallization_desc_details: "Originally a planet, miraculously not completely crushed after being stuffed into the lower body by a Celestial Giantess. After this Celestial Giantess adjusted her body size to normal size, it and the love juice wrapping it were also concentrated into current appearance."
  # 烁瑄的光环
  gts_specimens_halo: "Shuoxuan's Halo"
  # 一个淡蓝色的环状物，无时无刻不在发着温暖的光，宛若流动的水流一般。
  gts_specimens_halo_desc_short: "A light blue ring object, emitting warm light all the time, like flowing water."
  # 烁瑄搓出来的一个与自己头顶的光环一样的小光环，毕竟她那个大小的可塞不进博物天枢，也拿不下来。
  gts_specimens_halo_desc_details: "A small halo rubbed out by Shuoxuan that is the same as the halo on her head. After all, her size cannot fit into the Museum Pivot, nor can it be taken down."
  # 爱的液体(暂无图)
  #  爱的液体
  gts_specimens_love_fluid_qhai: "Love Liquid"
  gts_specimens_love_fluid_qhai_desc_short: "A drop of white liquid"
  # 见证我们的领袖第二次诞生之地的无边汪洋
  gts_specimens_love_fluid_qhai_desc_details: "Boundless ocean witnessing the place of our leader's second birth"
  # 猫砂(暂无图)
  #  猫砂
  gts_specimens_litter_box: "Cat Litter"
  gts_specimens_litter_box_desc_short: "Sand in a transparent bottle-like container"
  # 超出我们理解的是这些沙子可以自动清洁其中的污秽之物
  gts_specimens_litter_box_desc_details: "Beyond our understanding is that these sands can automatically clean the filth within"
  #  希诺的奶牛猫
  gts_specimens_xeno_cat: "Xino's Tuxedo Cat"
  #  一只黑白相间的猫，我们一般称其为奶牛猫，会发出可爱的声音。
  gts_specimens_xeno_cat_desc_short: "A black and white cat, typically called a tuxedo cat, that makes cute sounds."
  #  希诺饲养的猫咪，居家时经常搂抱在怀中当作毛球揉捏。作为一只神奇奶牛猫，可爱的同时自然也拥有拆家的本领，总是在意想不到的地方出现。
  gts_specimens_xeno_cat_desc_details: "A cat raised by Xino, often held in her arms and kneaded like a fur ball when at home. As a magical tuxedo cat, while cute, it naturally possesses the ability to destroy the house, and always appears in unexpected places."
  #  小人履
  gts_specimens_Villains_conduct: "Villain's Shoe"
  #  一只精巧的乐福鞋，只有拇指大小，却内藏乾坤
  gts_specimens_Villains_conduct_desc_short: "A delicate loafer, only thumb-sized, but containing a world within."
  #  鞋底和鞋子内侧均有磨损，鞋跟里低外高证明原主人可能稍有内八，鞋子的鞋垫上寄生有数个更加微小的小人文明，我们得到这只鞋子时，内部的小人文明还在相互攻伐，我们呼出的口气吹散了“云层”，让这个呼吸小人少女体香的文明第一次见到天空。
  gts_specimens_Villains_conduct_desc_details: "There is wear on both the sole and the inside of the shoe. The heel is lower on the inside and higher on the outside, proving the original owner might have been slightly pigeon-toed. Several even more microscopic 'little people' civilizations are parasitic on the shoe's insole. When we obtained this shoe, the internal civilizations were still attacking each other. Our exhaled breath blew away the 'clouds,' letting this civilization, which breathes the body fragrance of a little person girl, see the sky for the first time."
