l_english:
  # 从艾雅法拉的足部获取
  EYJAFJALLA_PROJECT: "Acquire from Eyjafjalla's Foot"
  # 金羊毛
  eyjafjalla_hair: "Golden Fleece"
  # 艾雅法拉身上的一根毛发
  eyjafjalla_hair_desc_short: "A single hair from Eyjafjalla"
  # 在阳光照射下散发出金色的光泽。在艾雅法拉的毁天灭地的巨足下，小人的一切工程奇迹都不如她自己的一根发丝耐用。
  eyjafjalla_hair_desc_details: "Shimmers golden in the sunlight.  Under Eyjafjalla's devastatingly huge feet, all the engineering marvels of the small people are less durable than a single strand of her hair."
  # 陆行舰残骸
  landcarrier_wreck: "Landcarrier Wreckage"
  # 用铁板简单拼接，功能极度简化的粗糙载具，上面纹有西洋棋标志。
  landcarrier_wreck_desc_short: "A crude vehicle, simply pieced together from iron plates with extremely simplified functions, bearing a chessboard symbol."
  # 我们本以为这是某种模型，却意外地在舰上发现智慧生命的活动痕迹。解密舰艇记录仪可知，这艘船在某次“城市区划管理演习”时被错误模拟生成，并在演习后的报废处理时卷入艾雅法拉足掌里。看起来这艘船在足内峡谷里游荡了相当长时间直到整艘舰艇彻底损坏。
  landcarrier_wreck_desc_details: "We thought it was some kind of model, but unexpectedly found traces of intelligent life activity on board. Decrypting the ship's recorder reveals that this vessel was mistakenly generated during a 'City District Management Exercise' and was caught in Eyjafjalla's foot during post-exercise disposal. It seems the ship wandered in the valleys of her foot for a considerable time until it was completely destroyed."
  # 摘星塔残骸
  startower_wreck: "Startower Wreckage"
  # 一座几百米高...现在是几百米长的大厦，其尖顶似乎因挤压而支离破碎。
  startower_wreck_desc_short: "A building several hundred meters tall... now several hundred meters long, its spire seemingly shattered by compression."
  # 对建造它的工业时代土著来说，这是他们挑战自然的伟大尝试，但对于生成他们进行“城市管理”的艾雅法拉来说，这只不过是众多预设破坏点位的一个罢了。
  startower_wreck_desc_details: "For the industrial-age natives who built it, this was their grand attempt to challenge nature, but for Eyjafjalla, who generated them for 'City Management,' it was just one of many preset destruction points."
  # 艾雅沼泽淤泥
  eyjafjalla_silt: "Eyja Swamp Silt"
  # 在艾雅法拉足弓沼泽里收集的淤泥
  eyjafjalla_silt_desc_short: "Silt collected from the swamp in Eyjafjalla's arch."
  # 在进行断代分析后，我们可以大致分析出巨娘的饮食、睡眠和心情对内分泌的影响。至于剩下的标本，则被收藏进艾雅法拉博物馆里作纪念了。
  eyjafjalla_silt_desc_details: "Through dating analysis, we can roughly analyze the impact of the giantess's diet, sleep, and mood on her endocrine system.  The remaining samples have been collected and commemorated in the Eyjafjalla Museum."
  # 艾雅河水样
  eyjafjalla_water: "Eyja River Water Sample"
  # 在艾雅法拉脚心河采集的水样
  eyjafjalla_water_desc_short: "Water sample collected from the river in Eyjafjalla's sole."
  # 其中富含各种矿物质和微生物，如果她的足汗能幸运的在某个荒芜星球上保存下来，那么从足汗下的第一个生命开始，艾雅法拉或许能用脚创造出一个新的文明。
  eyjafjalla_water_desc_details: "Rich in various minerals and microorganisms.  If her foot sweat were luckily preserved on a barren planet, starting from the first life beneath it, Eyjafjalla might create a new civilization with her foot."
  # 艾雅林场菌苗
  eyjafjalla_vaccine: "Eyja Woodland Fungus Vaccine"
  # 在艾雅法拉脚底一处隐蔽山谷收集到的真菌菌种
  eyjafjalla_vaccine_desc_short: "Fungal strain collected from a hidden valley on Eyjafjalla's foot."
  # 在太空辐射和巨娘之力的多重影响下，这种菌类极易繁殖，加工后不仅能保留艾雅法拉玉足的香气，营养还是蚁牛肉的八倍。
  eyjafjalla_vaccine_desc_details: "Under the combined influence of space radiation and the giantess's power, this fungus reproduces easily. After processing, it not only retains the fragrance of Eyjafjalla's jade foot but is also eight times more nutritious than ant beef."
  # 汐斯塔石板
  siesta_flagstone: "Siesta Flagstone"
  # 某个古代文明的记事板
  siesta_flagstone_desc_short: "Record tablet from an ancient civilization."
  # 记录了他们繁荣的城邦文明被一个穿着泳装的人形天灾登陆海滨，使用她的双子火山喷出炙热的岩浆冲毁城市，最后用她的丰臀将城市残骸完全摧毁。不过这块石板存在很多疑点，真实性并不可靠，有观点认为或许这只是该文明的某个后人对火山喷发摧毁城市的历史事件进行的毫无依据的夸张演绎。
  siesta_flagstone_desc_details: "Records how their prosperous city-state civilization was destroyed by a humanoid natural disaster in a swimsuit who landed on the coast, used her twin volcanoes to spew scorching lava to flood the city, and finally used her ample buttocks to completely crush the city ruins. However, there are many questionable points about this tablet, and its authenticity is not reliable. Some believe that it may just be a baseless, exaggerated interpretation of a historical volcanic eruption that destroyed the city by a descendant of this civilization."
  # 艾雅法拉金刚石
  eyjafjalla_diamond: "Eyjafjalla Diamond"
  # 宇宙花费亿万年塑成的行星在艾雅法拉的两只足趾挤压下瞬间形成的金刚石
  eyjafjalla_diamond_desc_short: "Diamond instantly formed when planets, shaped by the universe over billions of years, were compressed between Eyjafjalla's two toes."
  # 撇去表面的黏液与浮土，在这颗艾雅法拉亲自制造的钻石内，指数爆表的灵能能量在嗡鸣。
  eyjafjalla_diamond_desc_details: "Aside from the surface mucus and dust, within this diamond created by Eyjafjalla herself, psionic energy of explosive proportions hums."
  # 足尖角质
  foottip_keratin: "Foot Tip Keratin"
  # 在艾雅法拉的大脚趾趾甲内侧刮下的角质
  foottip_keratin_desc_short: "Keratin scraped from the inside of Eyjafjalla's big toenail."
  # 科考队员们使尽浑身解数也只采下些许碎片，通过对其材料、分子分布形态甚至蕴含的灵能能量进行模仿，可以用于强化我们的军事防护。
  foottip_keratin_desc_details: "The expedition members managed to collect only a few fragments. By imitating its material, molecular distribution, and even the contained psionic energy, it can be used to strengthen our military defenses."
  # 艾雅法拉足部粗略地图
  eyjafjalla_footmap1: "Rough Map of Eyjafjalla's Foot"
  # 根据以前的医学扫描记录和如今探险队的成员们的实际考察结果制作的地图，对艾雅法拉脚底的地势地貌做了粗略介绍
  eyjafjalla_footmap1_desc_short: "A map created based on previous medical scans and the current exploration team's findings, providing a rough overview of the terrain of Eyjafjalla's foot."
  # 随地图附带了几十小时的探险员采访记录和足内生存经验分享。
  eyjafjalla_footmap1_desc_details: "Includes dozens of hours of recorded explorer interviews and foot survival experience sharing."
  # 艾雅法拉足部详细地图
  eyjafjalla_footmap2: "Detailed Map of Eyjafjalla's Foot"
  # 综合医学扫描记录和探险队的成员们的考察成果绘制的地图，对艾雅法拉脚底的生态环境和地理风貌做了详细的标识
  eyjafjalla_footmap2_desc_short: "A map combining medical scans and the exploration team's findings, detailing the ecological environment and geographical features of Eyjafjalla's foot."
  # 随地图附带了几百小时的探险经历实录和足内生存经验分享。
  eyjafjalla_footmap2_desc_details: "Includes hundreds of hours of recorded exploration experiences and foot survival tips."
  # 艾雅法拉足部精密地图
  eyjafjalla_footmap3: "Precise Map of Eyjafjalla's Foot"
  # 根据探险队数次冒险的考察结果重新绘制的地图，对艾雅法拉脚底的生态、地理与资源情况做了细致而精密的说明，几个资源区和宜居点都被标识出来
  eyjafjalla_footmap3_desc_short: "A redraw map based on several expeditions, providing detailed and precise information on the ecology, geography, and resources of Eyjafjalla's foot. Several resource areas and habitable locations are marked."
  # 随地图附带了几千小时精剪的足内探险经历和足内生存经验分享。
  eyjafjalla_footmap3_desc_details: "Includes thousands of hours of edited in-foot exploration experiences and survival tips."
  # 乐g城市建材
  gts_random_lg: "Lego City Building Materials"
  # 对裸足巨娘特攻的建筑
  gts_random_lg_desc_short: "Architecture specifically against barefoot Giantess"
  # 在研究了巨娘们的行动之后，我们为建筑更新了一个全新的材料，在预想中，这个材料能完美抵抗巨娘们的踩踏，并且被动的反击，受害者似乎比我们预想中更快出现了…
  gts_random_lg_desc_details: ""After studying the Giantesses’ movements, we updated the building with a brand-new material. We had anticipated that this material would perfectly withstand the Giantesses’ trampling and even passively counterattack them, but it seems the first victims appeared sooner than we expected…""
  # 巨娘meme
  gts_random_audio_tape: "Giantess Meme"
  # 踩到乐g城市后巨娘发出的尖叫片段,已经像精神污染般传播开
  gts_random_audio_tape_desc_short: "Scream fragments emitted by Giantess after stepping on Lego city, has spread like mental pollution"
  # 在我们投放对巨娘特攻建筑后不久便有巨娘成为了受害者，而正巧这一幕还被好事者所记录了下来，现在这样的录音在小人们的网络上成为了鬼畜素材的一部分，为了保证原始录音，我们在博物天枢中收录了这一录音。
  gts_random_audio_tape_desc_details: ""Shortly after we deployed our special attack structure against the Giantesses, one of them fell victim to it, and as it happened, this scene was captured by a prankster. Now, this recording has become part of the \"gichiku\" content circulating on the internet among Tiny persons. To preserve the original recording, we have included it in the \"Museum of the Celestial Pivot.\"""
  # 小人游行处理报告
  gts_random_report_a: "Small Folk Parade Handling Report"
  # 小人游行处理报告__残忍系
  gts_random_report_a_desc_short: "Small Folk Parade Handling Report__Cruel Type"
  # 本报告详细记录了我们的总督如何处理游行事件，脚碾，乳压，甚至抓起地上的人们丢入自己的私处中，享受着那小人们一点点爆裂的感觉，在最后，我们的总督恶趣味的附上了自己对每种玩法的评价……
  gts_random_report_a_desc_details: ""This report provides a detailed account of how our Governor handled the protest: trampling, crushing with her breasts, and even picking up people from the ground and thrusting them into her private parts, relishing the sensation of those Tiny people bursting bit by bit. In the end, our Governor, with her twisted sense of humor, included her own evaluation of each method…""
  # 小人游行处理报告
  gts_random_report_b: "Small Folk Parade Handling Report"
  # 小人游行处理报告__和谐共处
  gts_random_report_b_desc_short: "Small Folk Parade Handling Report__Harmonious Coexistence"
  # 本报告详细记录了我们的总督如何处理游行事件，为了安抚游行的群众，总督甚至能够让如同虫子一般的生物爬上她的身体，这在其他领袖看来是难以接受的，不过总督似乎乐在其中，报告中特别提及总督如何温柔的与小人互动……
  gts_random_report_b_desc_details: ""This report provides a detailed account of how our governor handled the protest. In an effort to appease the protesters, the governor even allowed creatures resembling insects to crawl onto her body—a gesture that other leaders found unacceptable, though the governor seemed to enjoy it. The report specifically mentions how gently the governor interacted with the Tiny persons…""
  # 舰娘的奶
  gts_random_milk: "Ship Girl's Milk"
  # 好喝的
  gts_random_milk_desc_short: ""Delicious""
  # 经过工程部的努力，我们终于完成了城市中乳汁的清理，这些乳汁似乎有着神奇的用处，因此，我们将一部分放入博物天枢中以供参观学习。
  gts_random_milk_desc_details: ""Thanks to the efforts of the Engineering Department, we have finally completed the cleanup of the \"milk\" in the city. Since this \"milk\" appears to have miraculous properties, we have placed a portion of it in the Museum of the Celestial Pivot for visitors to view and study.""
  # 邮寄的胖次
  gts_random_pants: "Mailed Panties"
  # 错误被寄给小人的泰坦巨娘的胖次
  gts_random_pants_desc_short: "Titan Giantess's panties mailed to small folk by mistake"
  # 遮天蔽日的胖次压垮了星球表面众多的城市，这样巨大的伤亡即使是我们的帝国也是难以承受的，不过我们也没有反击的手段，只能将这样巨大的胖次收集起来让人们直观感受巨娘的力量。
  gts_random_pants_desc_details: ""The sky-obscuring Panties crushed countless cities on the planet’s surface. Even our empire would find such massive casualties difficult to bear, but since we have no means to fight back, we can only collect these enormous Panties so that people can witness the power of the Giantess firsthand.""
  # 巨娘受灾报告
  gts_random_record: "Giantess Disaster Report"
  # 
  gts_random_record_desc_short: """"
  # 当我们的军队抵达时，那位巨娘已经离开了这个地方，只留下了一个个深深的脚印与断壁残垣，在进行灾害评估后，我们确定了数万人的死亡与无数的失踪，执法部门已经在调查这件事，但我们依然需要将灾害评估公布以让国民注意这样的人为灾害
  gts_random_record_desc_details: ""By the time our troops arrived, the Giantess had already left the area, leaving behind only deep footprints and ruins. After conducting a disaster assessment, we confirmed that tens of thousands had died and countless others were missing. Law enforcement agencies are already investigating the incident, but we still need to release the disaster assessment to raise public awareness of such man-made disasters.""
  # 修女的高跟鞋
  gts_random_high_heels: "Nun's High Heels"
  # 象征圣洁的鞋子
  gts_random_high_heels_desc_short: ""Shoes Symbolizing Purity""
  #  修女们脱下的高跟鞋成为了城市中一大奇观，周围数个城市的人们慕名而来朝拜着这象征圣洁的鞋子，街道常常被围的水泄不通，甚至有人为了那冒着热气的鞋口而攀爬着高耸的鞋面，而在收录入博物天枢后，这件藏品依然是数一数二的火热……
  gts_random_high_heels_desc_details: "" The High Heels removed by the nuns became a major spectacle in the city; people from several surrounding cities flocked to pay homage to these shoes, symbols of holiness, and the streets were often packed to capacity. with some people even climbing the towering uppers just to get a whiff of the steam rising from the shoe openings. Even after being added to the Museum of the Celestial Pivot, this exhibit remains one of the most popular attractions…""
  # 体内的失落帝国
  gts_random_mini_lostempire: "Lost Empire Inside Body (No Image Yet)"
  # 
  gts_random_mini_lostempire_desc_short: """"
  # 
  gts_random_mini_lostempire_desc_details: """"
  # 特"小"药
  gts_random_medicine: "Medicine Leader Takes (Temporary Name) (No Image Yet)"
  # 
  gts_random_medicine_desc_short: """"
  # 
  gts_random_medicine_desc_details: """"
  # 大富翁规则书
  gts_random_monopoly: "Monopoly Rulebook (No Image Yet)"
  # 
  gts_random_monopoly_desc_short: """"
  # 
  gts_random_monopoly_desc_details: """"
  # 竞技场的荣耀
  gts_random_medal: "Arena Glory"
  # 
  gts_random_medal_desc_short: """"
  # 
  gts_random_medal_desc_details: """"
  # 千海的文明展柜
  gts_specimens_display_cabinet: "Qianhai's Civilization Display Cabinet"
  # 一款富有少女风格的白色多层展柜，多层独立密封的空间中银色光华流转，奇异的力量影响掌控着其中文明发展的一丝一毫。
  gts_specimens_display_cabinet_desc_short: "A white multi-layer display cabinet rich in girlish style. In the multi-layer independent sealed space, silver brilliance flows, and strange power influences and controls every bit of civilization development within."
  # 千海女神的造物，多层独立分隔的设计使每一层储柜不管是星云状结构宇宙还是地平世界都能被有效收容，并可肆意调控位面状态。
  gts_specimens_display_cabinet_desc_details: "Creation of Goddess Qianhai. Multi-layer independent separation design enables every storage cabinet to effectively contain whether nebula-like structure universe or flat world, and can wantonly adjust the plane state."
  # 超密度爱液结晶
  gts_specimens_love_fluid_crystallization: "Super Dense Love Juice Crystallization (No Image Yet)"
  # 
  gts_specimens_love_fluid_crystallization_desc_short: """"
  # 原本是一颗行星，被一位天体级巨娘塞入下体后奇迹般地没有被完全粉碎，在这位天体级巨娘把体型调整到普通大小后，它和包裹着它的爱液也一同被浓缩成了现在的模样
  gts_specimens_love_fluid_crystallization_desc_details: "Originally a planet, miraculously not completely crushed after being stuffed into the lower body by a Celestial Giantess. After this Celestial Giantess adjusted her body size to normal size, it and the love juice wrapping it were also concentrated into current appearance."
  # 烁瑄的光环
  gts_specimens_halo: "Shuoxuan's Halo"
  # 一个淡蓝色的环状物，无时无刻不在发着温暖的光，宛若流动的水流一般。
  gts_specimens_halo_desc_short: "A light blue ring object, emitting warm light all the time, like flowing water."
  # 烁瑄搓出来的一个与自己头顶的光环一样的小光环，毕竟她那个大小的可塞不进博物天枢，也拿不下来。
  gts_specimens_halo_desc_details: "A small halo rubbed out by Shuoxuan that is the same as the halo on her head. After all, her size cannot fit into the Museum Pivot, nor can it be taken down."
  # 爱的液体
  gts_specimens_love_fluid_qhai: "Love Liquid (No Image Yet)"
  # 一滴白色的液体
  gts_specimens_love_fluid_qhai_desc_short: "A drop of white liquid"
  # 见证我们的领袖第二次诞生之地的无边汪洋
  gts_specimens_love_fluid_qhai_desc_details: "Boundless ocean witnessing the place of our leader's second birth"
  # 猫砂
  gts_specimens_litter_box: "Cat Litter (No Image Yet)"
  # 一个装在透明瓶状容器中的沙子
  gts_specimens_litter_box_desc_short: "Sand in a transparent bottle-like container"
  # 超出我们理解的是这些沙子可以自动清洁其中的污秽之物
  gts_specimens_litter_box_desc_details: "Beyond our understanding is that these sands can automatically clean the filth within"
  # 希诺的奶牛猫
  gts_specimens_xeno_cat: "Xino's Tuxedo Cat"
  # 一只黑白相间的猫，我们一般称其为奶牛猫，会发出可爱的声音。
  gts_specimens_xeno_cat_desc_short: "A black and white cat, typically called a tuxedo cat, that makes cute sounds."
  # 希诺饲养的猫咪，居家时经常搂抱在怀中当作毛球揉捏。作为一只神奇奶牛猫，可爱的同时自然也拥有拆家的本领，总是在意想不到的地方出现。
  gts_specimens_xeno_cat_desc_details: "A cat raised by Xino, often held in her arms and kneaded like a fur ball when at home. As a magical tuxedo cat, while cute, it naturally possesses the ability to destroy the house, and always appears in unexpected places."
  # 小人履
  gts_specimens_Villains_conduct: "Villain's Shoe"
  # 一只精巧的乐福鞋，只有拇指大小，却内藏乾坤
  gts_specimens_Villains_conduct_desc_short: "A delicate loafer, only thumb-sized, but containing a world within."
  # 鞋底和鞋子内侧均有磨损，鞋跟里低外高证明原主人可能稍有内八，鞋子的鞋垫上寄生有数个更加微小的小人文明，我们得到这只鞋子时，内部的小人文明还在相互攻伐，我们呼出的口气吹散了“云层”，让这个呼吸小人少女体香的文明第一次见到天空。
  gts_specimens_Villains_conduct_desc_details: "There is wear on both the sole and the inside of the shoe. The heel is lower on the inside and higher on the outside, proving the original owner might have been slightly pigeon-toed. Several even more microscopic 'little people' civilizations are parasitic on the shoe's insole. When we obtained this shoe, the internal civilizations were still attacking each other. Our exhaled breath blew away the 'clouds,' letting this civilization, which breathes the body fragrance of a little person girl, see the sky for the first time."
