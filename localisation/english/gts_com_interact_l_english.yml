  # 污秽的炼狱
  gts_leader_interact.2006.name: "Filthy Purgatory"
  # 在接到我们的请求之后，对于这种处刑方式还抱有些许羞涩的[event_target:current_gts_leader.GetName]犹豫再三，最终还是接受了我们的委托、整理好装束之后穿过了早已充能完毕的万界编织机，进一步巨大化到了足以吞没星系的体型之后传送到了目标星系附近。\n\n§H唔......有点难为情呢。§!\n\n§H但毕竟是领袖大人的愿望、所以......只能委屈一下你们啦～§!\n\n安静地漂浮在虚空之中、全然不顾许许多多的行星已经被自己的引力吸附到了星系级的娇躯上被撞碎，[event_target:current_gts_leader.GetName]只是"温柔"地摊开白皙宏伟的手掌托举着即将遭受灭顶之灾的星系，带着些许好奇探望着这座恒星系之内的各个行星。\n\n§H不知道这里面住着几百亿只小家伙呢......要是倒霉的话、这些小星球上面还有几只可爱的小巨娘也说不定哦～§!\n\n\n§H已经聊的够多了呢，你们应该也享受完生命中最后的时光了吧？那、接下来......§!\n\n[event_target:current_gts_leader.GetName]伸出一只手掀起了巨构级别的裙摆、轻柔地褪下了散发着体香的胖次，另一只手则借助磅礴的灵能力量、慢慢地牵引着[event_target:gts_leader_system.GetName]飞向了自己的胯下 -  - 更确切地说、是身后的胯下。\n\n§H......失礼了。§!\n\n在 maiden手中有如玩具般渺小的恒星系就这样被送到了[event_target:current_gts_leader.GetName]的菊穴前方。吞吐着淡淡气息的粉嫩菊穴覆盖了这座星系各个方向的全部视野、温热的气息笼罩了整座星系，没有任何人可以侥幸逃离，就连唯一有可能远离[event_target:current_gts_leader.GetName]此时光年级宏伟身躯的FTL引擎，在 maiden身体所形成的庞大重力井之下也完全无法运行。
  gts_leader_interact.2006.desc: "Upon receiving our request, [event_target:current_gts_leader.GetName], still feeling bashful about such a form of execution, hesitated repeatedly. In the end, she accepted our commission, adjusted her attire, and stepped through the fully charged Realm Weaver. Growing to a galaxy-devouring scale, she teleported near the target star system.\n\n§HMmh... this is rather embarrassing.§!\n\n§HStill, since it's the Leader's wish... you'll just have to bear with it for a moment~§!\n\nFloating serenely in the cosmic void, utterly unconcerned as numerous stray planets were pulled into her galaxy-sized body by gravity and shattered upon impact, [event_target:current_gts_leader.GetName] \"gently\" cupped her porcelain, colossal palms beneath the doomed star system, gazing curiously upon its worlds.\n\n§HI wonder how many tens of billions of tiny creatures live in here... If they're unlucky, there might even be a few cute little giantesses on those tiny worlds too~§!\n\n§HWell, that's enough chit-chat. You must have enjoyed your final moments, right? Now then...§!\n\n[event_target:current_gts_leader.GetName] lifted the hem of her megastructure-scale skirt with one hand and gently slipped off her fragrant panties. With her other hand, using immense psionic energy, she drew [event_target:gts_leader_system.GetName] slowly toward her lower body - more specifically, behind her.\n\n§H...Excuse me.§!\n\nThe star system, resembling a minuscule toy in her grip, was brought directly before [event_target:current_gts_leader.GetName]'s rear aperture. The tender passage occupied the entire horizon in all directions, radiating sultry warmth that bathed the whole star system. None could escape; even FTL drives, the only hope of fleeing [event_target:current_gts_leader.GetName]'s light-year-spanning physique, were rendered utterly useless inside her immense gravity well."
