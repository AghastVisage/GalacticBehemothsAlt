  gts_leader_interact.2006.a: "Continue"
  # 污秽的炼狱
  gts_leader_interact.2007.name: "Filthy Purgatory"
  # 深邃的菊穴被缓缓掀开、更加浓郁的气息从 maiden体内喷薄而出，席卷了[event_target:gts_leader_system.GetName]的各个角落。尽管还没有直接放入体内，仅仅只是湿热的直肠内部空气就已经杀死了上百万只小人。\n\n§H......唔呜......§!\n\n[event_target:gts_leader_system.GetName]在灵力的牵引下，最终深入了 maiden的体内。瞬间，浓郁到几乎凝成实质的污浊气息淹没了星系的每一处角落，数不尽的生命在这样的侵蚀下、甚至都不配被 maiden亲自降下神罚、就已经在极度的痛苦与绝望中被溶解在了直肠内部的酸涩空气之中。\n\n好在，这样的折磨与蹂躏并没有持续太久。[event_target:current_gts_leader.GetName]收回了双手、红着脸颊重新穿好胖次之间，猛然合拢的肉壁就已经紧紧地贴合了微小的[event_target:gts_leader_system.GetName]将整颗恒星、附着的所有行星连带着寄居其上的小人们在一瞬间之内压碎、碾平在了暗粉色的褶皱之间。或许还有亿分之一的幸存者能够侥幸苟活在[event_target:current_gts_leader.GetName]菊穴深处的肉壁褶皱与粘稠肠液之间，但[event_target:gts_leader_system.GetName]以及其中§G[root.gts_event_kills_logs]§!亿£pops£人口，§G[root.gts_event_city_kills_logs]§!座£building£城市和§G[root.gts_event_planet_kills_logs]§!颗£planet£星球已然彻底消失在了宇宙之内，沦为了[event_target:current_gts_leader.GetName]体内连拉珠都不配称为的一摊烂泥。
  gts_leader_interact.2007.desc: "The maiden's rear aperture parted slowly as an overwhelming, stifling miasma burst from within, sweeping across every corner of [event_target:gts_leader_system.GetName]. Even before full entry, the sheer heat and foul air from the intestinal cavity had already killed millions of tiny people.\n\n§H...Mmnh...§!\n\nGuided by psionic power, [event_target:gts_leader_system.GetName] sank deep into the maiden's body. In an instant, noxious fumes thick enough to nearly materialize drowned every corner of the star system. Under such vile erosion, countless lives - unworthy of receiving divine punishment by her own hands - were dissolved in agony and despair by the acidic air of her rectum.\n\nFortunately, such torment did not last long. As [event_target:current_gts_leader.GetName] withdrew her hands, blushing as she pulled her panties back on, the clamping walls of flesh constricted firmly around the miniature [event_target:gts_leader_system.GetName]. In a single instant, the central star, every accompanying planet, and all inhabiting tinies were crushed flat between dark pink folds. Perhaps one in a hundred million survivors might still cling to wretched life amid the folds and thick intestinal fluids of [event_target:current_gts_leader.GetName]'s depths, but [event_target:gts_leader_system.GetName], along with its §G[root.gts_event_kills_logs]§! billion £pops£ population, §G[root.gts_event_city_kills_logs]§! £building£ cities, and §G[root.gts_event_planet_kills_logs]§! £planet£ planets, had vanished entirely from the cosmos - reduced to a smear of worthless filth inside [event_target:current_gts_leader.GetName]'s body, undeserving of even being called anal beads."
  # 理所当然的结局，希望那座星系里的敌人们得到了惩罚。
  gts_leader_interact.2007.a: "A predictable end. Hopefully the enemies in that star system received their due punishment."
