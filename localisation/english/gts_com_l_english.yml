  gts_update.3.1.0: "3.1.0 Update\\nNew Content\\n——Added a new ordinary shoe (No specific district yet)\\n——Added Army follow-up events and special landing events for Seele and Bronya\\n——Added several habitability technologies for specialized planets, and modified landscape generation for specialized planets\\n——Added follow-up events for Leader Huatian, obtain Huatian Leader Armed Science Ship\\n——Added Yarong's clothes changing option edict\\n——Added Leader Affinity options (Currently only Leader Huatian has special events)\\n——Added two Interstellar Actions\\n——Added an Anomaly\\n——Added three leaders: Seele, Bronya, Firefly\\n——Added a new Civic\\n——Added several Shipgirl names\\n——Added follow-up events for Leader Saratoga\\n\\nAdjustments:\\n——Added penalty for not clearing landscape for a long time on Vibrator Planet\\n——Modified buffs, acquisition conditions and several new technologies for Giantess Accessories\\n——Reduced the weight of Giantess Landscape Pioneer\\n——Modified the weight of Planet's Fate events\\n\\nBUG Fixes:\\n——Fixed the issue of wrong original ship names\\n——Fixed the issue of being able to build h-star person branch buildings without meeting conditions\\n——Fixed the issue that Micro-Civilization Incubation Chamber cannot assemble pops\\n——Fixed the issue that Celestial Giantess can be shrunk to microorganism by Shrink Ray Colossus\\n——Fixed the issue of misplaced recruitment marker after recruiting Komeiji Satori\\n\\nUniversal Sea Extreme Universe Origin:\\n——Added three danger types and three new buildings\\n——Added surrender events for Giantess Foot Trample Insurance and Giantess Breast Press Insurance\\n——Added a new espionage against primitive civilizations, requires Extraterrestrial Prank Civic\\n——Added two surrender events, probability to trigger several years after establishing Giantess Vore Insurance or Futa Insurance\\n——Added textures for Insurance Contract Countries\\n——Universal Sea Extreme Universe Origin now can only have one Insurance Salesman per planet, excess Celestial Pops will be shrunk\\n——Slightly increased the penalty for completing Insurance Branch Buildings\\n——Now Vassal Tiny Person Side and Giantess Side resources are no longer hidden\\n——Fixed the issue that enabling scat switch unlocks all related buildings\\n——Fixed the issue that Celestial Giantess Scientists cannot be added to Science Ships\\n——Fixed the issue that enabling M event ends the game immediately\\n——Fixed the issue that Insurance Project buildings disappear\\n——Fixed some text errors"
  gts_update.3.1.1: "3.1.1 Update\nNew Content:\n——Follow-up plot for Luo Ying Xue Xi\n——Follow-up plot for Huatian\n——Traptrix Endfield plot\n\nAdjustments:\n——Corrected the description of Giantess Art Painter job\n——Fixed the issue of multiple body sizes appearing in Insurance Start Pops\n——Insurance Start no longer reduces pops at the start\n——Body size now affects job upkeep"
