  #  4.4.0更新\n 新内容:\n ——更新了一位新的领袖   橘子长--追逐明日的拾星者\n ——三月希瞳更新(兑换希瞳后会自己找上你,内容较少)\n ——白丝盒事件(需要有一只天体级领袖且拥有度假星球)\n ——白丝覆盖决议(需要有一只天体级领袖,对拥有的行星使用来改变星系天空盒,缺少事件图)\n  ——一个超级大的小皮鞋(暂未完成)\n  ——可以找林凤要鞋子\n\n   内容调整:\n  ——靴底人现在在袜足星球上不再需要建造圣象，并且可以享受到额外增益。\n\n   问题修复：\n  ——修复了咕丫可以重复获取多个的问题\n  ——修复了领袖无法正常复活的问题# ——修复了斯卡蒂口人事件无法复活的问题\n  ——修复了人皇起源的若干问题\n  ——修复了事件获取凝聚力的倍数问题\n  ——修复了出现复数体型特质的问题
  gts_update.4.4.0: "4.4.0 Update\\n New Content:\\n ——Updated with a new leader   Orange Chief--Star Picker Chasing Tomorrow\\n ——March Xitong update (after exchanging for Xitong, she will come find you herself; content is limited)\\n ——White Silk Box event (requires a celestial-class leader and a resort planet)\\n ——White Silk Covering decision (requires a celestial-class leader; use on owned planets to change the system skybox; event image missing)\\n  ——One super-large little leather shoe (not yet complete)\\n  ——You can ask Lin Feng for shoes\\n\\n   Content Adjustments:\\n  ——Sole People no longer need to build holy statues on Sock-Foot Planets, and can enjoy additional bonuses.\\n\\n   Bug Fixes:\\n  ——Fixed an issue where multiple Guya could be obtained repeatedly\\n  ——Fixed an issue where leaders could not revive properly# ——Fixed an issue where the Skadi mouth-person event could not revive\\n  ——Fixed several issues with the Human Emperor origin\\n  ——Fixed the multiplier issue for cohesion gained from events\\n  ——Fixed the issue where multiple size traits appeared"
  #  4.5.0更新\n 新内容:\n ——更新以为新的领袖鸟音山水 \n ——添加了埃罗芒阿老师的年度随机事件\n ——增加了火山星球的背景\n ——增加了一个随机扶她天体级领袖的事件 \n内容调整:\n  ——将领袖饰品维护费调整至国家域，以防止过高的维护费产生。\n——更新了欧若拉随机口人的事件的文本，并降低了概率 \n——更新了部分加载图\n——更新了部分星球的图标\n\n   问题修复：\n  ——修改了AI对于MOD资源的使用和部分逻辑\n  ——优化了橘子长的UI \n  ——将原本的繁体字全部改为了简体字 
  gts_update.4.5.0: "4.5.0 Update\\n New Content:\\n ——Updated with a new leader, Torine Sansui \\n ——Added Teacher Eromanga's yearly random event\\n ——Added a background for volcanic planets\\n ——Added an event for a random futa celestial-class leader \\nContent Adjustments:\\n  ——Adjusted leader accessory upkeep to the country scope to prevent excessively high upkeep costs.\\n——Updated the text for Aurora's random mouth-person event and reduced its probability \\n——Updated some loading images\\n——Updated some planet icons\\n\\n   Bug Fixes:\\n  ——Modified the AI's use of MOD resources and part of its logic\\n  ——Optimized Orange Chief's UI \\n  ——Changed all original Traditional Chinese text to Simplified Chinese "
