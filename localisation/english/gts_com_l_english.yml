  gts_setting.0.name: "Miniature Universe Controller"
  gts_setting.0.desc: "Welcome to Miniature Universe! This mod is a §Y completely free §! GTS-oriented mod. You can get the §Y latest version §! of the mod through the following three ways!\ngw forum: §Sgtswaltz.org§!\ngn forum: §Sgiantessnight.com§!\nQQ group: §S636280246§! (Joining requires a gw or gn account)\n\nHere you can adjust the internal settings of the Miniature Universe, including game difficulty, event types, etc."
  gts_setting.0.a: "§R Special §! Event Related"
  gts_setting.0.b: "Set §YGiantess Empire§! Strength"
  gts_setting.0.c: "The game encountered a §RBUG§!"
  gts_setting.0.d: "§B MOD Settings §! Related Q&A"
  gts_setting.1.name: "Extreme Zone Events"
  gts_setting.1.desc: "Press the §G green §! enable button to trigger related content\nPressing the §R red §! disable button will prohibit related events from triggering"
