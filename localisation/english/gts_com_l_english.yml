  # Original: 棉袜包裹的星球
  pc_wazi_cracked_adj: "Cotton Sock Wrapped Planet"
  # Original: 一只厚重的棉袜包裹了整颗星球，听说是为了惩罚淘气的小家伙们而准备的。得益于精湛的编织工艺与高超的材料学，这只棉袜成功阻断了其中星球与外界的绝大多数物理联系；虽然隔绝了恒星，但也能够保障他们不受到外界的侵扰。不过棉袜的主人好心地提供了足够的能源与矿产甚至于热源，让这些小家伙们反省的同时不至于冻毙而亡。
  pc_wazi_cracked_desc: "A thick cotton sock wraps the entire planet, heard to be prepared to punish naughty little guys. Thanks to exquisite knitting technology and superb materials science, this cotton sock successfully blocked most physical connections between the planet inside and the outside world; although it isolated the star, it can also protect them from outside intrusion. However, the owner of the cotton sock kindly provided enough energy and minerals and even heat sources, so that these little guys would not freeze to death while reflecting."
  # Original: 棉袜宜居度
  mod_pc_wazi_cracked_habitability: "Cotton Sock Habitability"
  # Original: 棉袜偏好
  trait_pc_wazi_cracked_preference: "Cotton Sock Preference"
  # Original: 这个物种被迫适应了棉袜内温暖潮湿而且散发着足臭的棉袜星球环境。
  trait_pc_wazi_cracked_preference_desc: "This species was forced to adapt to the warm, humid and foot-smelling cotton sock planet environment inside the cotton sock."
  # Original: 巨娘旗帜
  FLAG_CATAGORY_gts_flag: "Giantess Flags"
  # Original: §H港区邦联§!
  auth_azur_lane_0: "§HPort Confederation§!"
  # Original: 港区邦联是一种权利十分松散的制度，其是由各个KANSEN派系在港区政府的表面联合之下形成的一种特殊政体。虽然港区政府仍然维系着这个庞大而又松散的结构体系，港区邦联内部依旧存在一定的派系冲突，不过同时这种结构使得港区邦联倾向任何一种思潮都十分正常。\n\n§G此政体允许组装机器人与KANSEN§!\n§Y允许无条件地在其他国家的行星上开设企业。§!
  auth_azur_lane_0_desc: "The Port Confederation is a system with very loose power. It is a special regime formed by various KANSEN factions under the superficial union of the Port Government. Although the Port Government still maintains this huge and loose structural system, there are still certain faction conflicts within the Port Confederation, but at the same time, this structure makes it very normal for the Port Confederation to incline towards any ethos.\n\n§GThis regime allows assembling Robots and KANSEN§!\n§YAllows unconditional opening of Branch Offices on planets of other countries.§!"
  # Original: 27.紫宸\n简介：先驱者们的母神与送葬者，文明兴起的辉光与灭世的黑炎都萦绕在她的冠冕上，她现在为你效力，称你为父——你当真承担的起这个称呼么？\n体型：天体\n属性：懵懂，区别对待\n特殊机制：无\n\n该角色包含的事件：\n*招募考古事件(犽戎成年礼5年后触发)\n*玩弄事件(拥有紫宸后1800天随机360天触发)\n*向父亲举起叛逆之剑(每年判定一次，19年后触发)
  #  27.紫宸\n简介：先驱者们的母神与送葬者，文明兴起的辉光与灭世的黑炎都萦绕在她的冠冕上，她现在为你效力，称你为父——你当真承担的起这个称呼么？\n体型：天体\n属性：懵懂，区别对待\n特殊机制：无\n\n该角色包含的事件：\n*招聘考古事件(犽戎成年礼5年后触发)\n*玩弄事件(拥有紫宸后1800天随机360天触发)\n*向父亲举起叛逆之剑(每年判定一次，19年后触发)
  gts_setting.103.3a: "27. Zichen\\nIntroduction: The mother goddess and undertaker of the pioneers, the glow of civilization's rise and the black flame of world destruction haunt her crown. She now works for you and calls you father - can you really afford this title?\\nBody Size: Celestial\\nAttributes: Ignorant, Differential Treatment\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Archaeology Event (Triggered 5 years after Yarong's Coming of Age Ceremony)\\n*Toying Event (Triggered randomly 360 days after 1800 days of owning Zichen)\\n*Raising the Sword of Rebellion against Father (Judged once a year, triggered after 19 years)"
  #  28.古明地觉\n简介：拥有读心能力妖怪觉，地灵殿的主人，拥有泰坦体型的她为了寻找更加巨大的妹妹来到我们帝国\n体型：泰坦\n属性：少女、妖怪\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链
  gts_setting.103.4a: "28. Komeiji Satori\\nIntroduction: The Youkai Satori with mind-reading ability, the master of the Palace of Earth Spirits. Possessing a Titan body size, she came to our empire to find her even more huge sister\\nBody Size: Titan\\nAttributes: Girl, Youkai\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain"
  #  29.天条\n简介：一位巨大的宇宙航务警察娘，似乎携带着某种失落科技\n体型：天体\n属性：女警、身体囚禁\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)
  gts_setting.103.5a: "29. Tentijou\\nIntroduction: A huge space traffic police girl, seems to carry some lost technology\\nBody Size: Celestial\\nAttributes: Policewoman, Body Imprisonment\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Post-Recruitment Daily Events (Timed Trigger)"
  #  30.博士\n简介：一位天体级futa博士，致力于观察宇宙中的众多文明\n体型：天体\n属性：futa、足控\n特殊机制：特殊的飞机杯巨构\n\n该角色包含的事件：\n*招聘事件链\n*原石事件(定时触发)\n*飞机杯事件(定时触发)
  gts_setting.103.6a: "30. Doctor\\nIntroduction: A celestial-level futa doctor, dedicated to observing many civilizations in the universe\\nBody Size: Celestial\\nAttributes: Futa, Foot Control\\nSpecial Mechanism: Special Airplane Cup Megastructure\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Originium Event (Timed Trigger)\\n*Airplane Cup Event (Timed Trigger)"
  #  31.玛丽\n简介：从另一个世界到来的修女，正在为了和平与你而祈祷\n体型：巨大\n属性：BA、兽耳娘、恋爱\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)
  gts_setting.103.7a: "31. Mari\\nIntroduction: A nun from another world, praying for peace and you\\nBody Size: Giant\\nAttributes: BA, Beast Ear Girl, Romance\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Post-Recruitment Daily Events (Timed Trigger)"
  #  32.咕呀\n简介：一只可以长大的幼女虫娘\n体型：巨大/泰坦/天体\n属性：虫娘、幼女、养成\n特殊机制：可以进行角色养成，不同体型的咕呀拥有不同的技能\n\n该角色包含的事件：\n*招聘事件链\n*养成事件(定时触发)\n*陆军占领星球事件(6km级)\n*太空战胜利事件(60km级)\n*总督事件(1200km级)\n*咕呀舰娘(24000km级)
  gts_setting.103.8a: "32. Guya\\nIntroduction: A young insect girl who can grow up\\nBody Size: Giant/Titan/Celestial\\nAttributes: Insect Girl, Young Girl, Cultivation\\nSpecial Mechanism: Character cultivation can be performed, Guya of different sizes has different skills\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Cultivation Event (Timed Trigger)\\n*Army Occupation Planet Event (6km Level)\\n*Space Battle Victory Event (60km Level)\\n*Governor Event (1200km Level)\\n*Guya Shipgirl (24000km Level)"
  #  33.水月\n简介：自另一个世界中被澄闪携带穿越而来的海嗣，虽然体型并不能像我们的其他领袖一样被称为巨娘，但水月仍然在同体型甚至对体型高大个体的作战中有着出色的表现，她作为海嗣所拥有的多维视角更能够在指挥舰队作战方面表现出绝佳的成绩\n体型：正常\n属性：海嗣生物、缩小少女、温柔系、多重大小\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链(招聘澄闪后两年出现)
  gts_setting.103.9a: "33. Mizuki\\nIntroduction: The Seaborn brought from another world by Goldenglow. Although her body size cannot be called a Giantess like our other leaders, Mizuki still performs well in battles of the same size or even against tall individuals. Her multi-dimensional perspective as a Seaborn can show excellent results in commanding fleet battles\\nBody Size: Normal\\nAttributes: Seaborn Creature, Shrink Girl, Gentle Type, Multiple Sizes\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain (Appears two years after recruiting Goldenglow)"
  #  34.塞拉\n简介：被虫惑之森选为代表的虫惑魔之一，虽然体型看着还是幼女，但是原本在虫惑之森中便是她来主持人员调动以及事务安排等多个方面的决策\n体型：巨大/天体\n属性：虫惑魔、穴内\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*终末地事件(让两位虫惑魔领袖进入终末地黑洞)
  gts_setting.103.10a: "34. Sera\\nIntroduction: One of the Traptrix chosen as a representative by the Traptrix Forest. Although her body size still looks like a young girl, she was originally the one who presided over personnel transfers and affair arrangements in the Traptrix Forest\\nBody Size: Giant/Celestial\\nAttributes: Traptrix, Inside Hole\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Endfield Event (Let two Traptrix leaders enter Endfield Black Hole)"
  #  35.阿洛美勒丝\n简介：被虫惑之森选为代表的虫惑魔之一，体态比起其他虫惑魔来说更成熟一些，似乎很擅长于指挥军团战斗以及将战场变得更为混乱\n体型：巨大/天体\n属性：虫惑魔、穴内\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*终末地事件(让两位虫惑魔领袖进入终末地黑洞)\n*陆军占领星球事件
  gts_setting.103.11a: "35. Allomerus\\nIntroduction: One of the Traptrix chosen as a representative by the Traptrix Forest. Her body shape is more mature than other Traptrix, and she seems to be very good at commanding legion battles and making the battlefield more chaotic\\nBody Size: Giant/Celestial\\nAttributes: Traptrix, Inside Hole\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Endfield Event (Let two Traptrix leaders enter Endfield Black Hole)\\n*Army Occupation Planet Event"
  #  36.泡泡\n简介：泡泡真可爱吧(大橘说的)\n体型：天体\n属性：没有属性(大橘说的)\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件(紫宸加入一年后触发)
  gts_setting.103.12a: "36. Paopao\\nIntroduction: Paopao is really cute (Big Orange said)\\nBody Size: Celestial\\nAttributes: No Attributes (Big Orange said)\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event (Triggered one year after Zichen joins)"
  gts_setting.104.name: "Leader Gallery - Page 4"
  # Original: 37.萨拉托加\n简介：名对你忠心耿耿的舰娘，以与你同样的大小伴随左右，平时非常正经，偶尔也会玩心大发(玩完后会好好收拾\n体型：泰坦\n属性：舰娘\n特殊机制：可以获得萨拉托加舰娘\n\n该角色包含的事件：\n*招募事件链\n*招募后日常事件(定时触发)\n*演习事件(完成萨拉演习提议事件)
  #  37.萨拉托加\n简介：名对你忠心耿耿的舰娘，以与你同样的大小伴随左右，平时非常正经，偶尔也会玩心大发(玩完后会好好收拾\n体型：泰坦\n属性：舰娘\n特殊机制：可以获得萨拉托加舰娘\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)\n*演习事件(完成萨拉演习提议事件)
  gts_setting.104.1a: "37. Saratoga\\nIntroduction: A shipgirl who is loyal to you, accompanies you with the same size as you, usually very serious, occasionally gets playful (will clean up properly after playing)\\nBody Size: Titan\\nAttributes: Shipgirl\\nSpecial Mechanism: Can obtain Saratoga Shipgirl\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Post-Recruitment Daily Events (Timed Trigger)\\n*Exercise Event (Complete Sara Exercise Proposal Event)"
  #  38.特莉波卡\n简介：强大，但是社畜，无需睡眠，7x24小时在岗的优秀员工，但是摸鱼\n体型：天体\n属性：小死神\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后事件(定时触发)\n*特莉波卡的年度事件\n-血红之夜(消耗帝国境内的3个人口为帝国增加强大的战力buff)\n-夜星之祈(随机抽取神谕以获得不同的帝国buff或debuff)\n-绽心之祀(与夜星之祈类似，只是通过自家的死亡仪式抽取)\n*舰队战事件(随机触发)
  gts_setting.104.2a: "38. Tezcatlipoca\\nIntroduction: Powerful, but a corporate slave, no sleep needed, excellent employee on duty 7x24 hours, but slacking off\\nBody Size: Celestial\\nAttributes: Little Death God\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Post-Recruitment Events (Timed Trigger)\\n*Tezcatlipoca's Annual Events\\n-Red Night (Consume 3 Pops in the empire to add powerful combat power buff to the empire)\\n-Prayer of the Night Star (Randomly draw oracles to obtain different empire buffs or debuffs)\\n-Sacrifice of Blooming Heart (Similar to Prayer of the Night Star, but drawn through own death ritual)\\n*Fleet Battle Event (Randomly Triggered)"
  #  39.板鸭\n简介：全名布洛妮娅·扎伊切克，圣芙蕾雅学园学生(模组中不涉及)，后成为理之律者，腿部因X-10实验致残，成为理之律者后恢复，使用重装小兔19C战斗，与希儿有深厚姐妹(恋人)羁绊(绀海组)\n体型：天体级\n属性：冷静、理性、三无、成熟、内向、外冷内热、带点坏坏的那种感觉(?\n特殊机制：无  \n建筑内阁特化加成，可更换职位，好感度达到后白送舰船及星球\n\n该角色包含的事件：本身招聘的星界裂隙事件\n招聘一定时间后小兔从事内容选项(根据不同选择提供不同加成)\n招聘一定时间后游戏开发事件(根据满足条件数量(1是否赞助2陆军事件是否触发3海军事件是否触发4小兔事件选项)决定结果)\n陆军，海军事件
  gts_setting.104.3a: "39. Bronya\\nIntroduction: Full name Bronya Zaychik, St. Freya Academy student (not involved in the mod), later became the Herrscher of Reason, legs disabled due to X-10 experiment, recovered after becoming Herrscher of Reason, uses Project Bunny 19C to fight, has deep sister (lover) bond with Seele (Seele x Bronya pair)\\nBody Size: Celestial Level\\nAttributes: Calm, Rational, Emotionless, Mature, Introverted, Cold outside and hot inside, A bit bad feeling (?\\nSpecial Mechanism: None  \\nBuilding Cabinet Specialization Bonus, position can be changed, give free ships and planets after reaching affinity\\n\\nEvents included: Astral Rift Event recruited by itself\\nProject Bunny engagement content options after recruiting for a certain time (Provide different bonuses according to different choices)\\nGame Development Event after recruiting for a certain time (Decide result based on number of conditions met (1 whether sponsored 2 whether army event triggered 3 whether navy event triggered 4 Project Bunny event option))\\nArmy, Navy Events"
  #  40.希儿\n简介：全名希儿·芙乐艾(白希)，可可利亚孤儿院长大(模组中不涉及)，温柔胆小、爱哭的少女，拥有强大圣痕，与布洛妮娅有深厚姐妹(恋人)羁绊(绀海组)\n 体型：天体级\n属性：温柔、善良、单纯、细腻、软弱却倔强，善于共情、胆小(后期去掉)\n特殊机制：无  \n人口内阁特化加成，可更换职位，好感度达到后白送舰船及星球\n\n该角色包含的事件：本身招聘的局势事件\n招聘过程的中随机事件(随局势进程触发)\n招聘一年后送书的事件(与她们详细的互动在这个遗珍中操作)\n陆军，海军事件
  gts_setting.104.4a: "40. Seele\\nIntroduction: Full name Seele Vollerei (White Seele), grew up in Cocolia Orphanage (not involved in the mod), gentle, timid, crybaby girl, possesses powerful stigmata, has deep sister (lover) bond with Bronya (Seele x Bronya pair)\\n Body Size: Celestial Level\\nAttributes: Gentle, Kind, Simple, Delicate, Weak but stubborn, Good at empathy, Timid (Removed later)\\nSpecial Mechanism: None  \\nPop Cabinet Specialization Bonus, position can be changed, give free ships and planets after reaching affinity\\n\\nEvents included: Situation Event recruited by itself\\nRandom events during recruitment process (Triggered with Situation progress)\\nBook Giving Event one year after recruitment (Detailed interaction with them operates in this relic)\\nArmy, Navy Events"
  #  41.黑希\n简介：希儿·芙乐艾的里人格(黑希儿)，强势侵略、保护欲强，源自圣痕分裂，守护白希儿\n体型：天体级\n属性：强势、傲娇、侵略性、保护欲强、冷酷残忍，占有欲重\n特殊机制：无\n军事舰船特化加成，可更换职位，好感度达到后白送舰船及星球\n\n该角色包含的事件：招聘白希时附赠\n陆军，海军事件
  gts_setting.104.5a: "41. Dark Seele\\nIntroduction: Seele Vollerei's inner personality (Dark Seele), aggressive, strong protective desire, derived from stigmata split, protects White Seele\\nBody Size: Celestial Level\\nAttributes: Strong, Tsundere, Aggressive, Strong Protective Desire, Cold and Cruel, Heavy Possessiveness\\nSpecial Mechanism: None\\nMilitary Ship Specialization Bonus, position can be changed, give free ships and planets after reaching affinity\\n\\nEvents included: Given when recruiting White Seele\\nArmy, Navy Events"
  #  42.流萤\n简介：来自格拉默帝国最后的守护者，拥有超乎寻常的力量\n体型：泰坦\n属性：温柔系、少女\n特色：能通过交流以较低消耗获得强大的陆军与海军\n\n该角色包含的事件：\n*招聘事件链\n*与流萤通讯
  gts_setting.104.6a: "42. Firefly\\nIntroduction: The last guardian from the Glamoth Empire, possessing extraordinary power\\nBody Size: Titan\\nAttributes: Gentle Type, Girl\\nFeature: Can obtain powerful army and navy with lower consumption through communication\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Communication with Firefly"
  #  43.希诺\n简介：基因工程的产物，现在将为你的帝国而战\n体型：天体\n属性：帝国骑士，vore，碾压，腹黑，认真，天然呆，贪欲\n特殊机制：吞噬星球人口降低维护费\n运营和战斗\n\n该角色包含的事件：\n*招聘事件链\n*星球吞噬
  gts_setting.104.7a: "43. Xino\\nIntroduction: Product of genetic engineering, now fighting for your empire\\nBody Size: Celestial\\nAttributes: Imperial Knight, Vore, Crushing, Black-bellied, Serious, Airhead, Greed\\nSpecial Mechanism: Devouring planet pops reduces upkeep\\nOperation and Combat\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Planet Devouring"
  #  44.珂莱塔\n简介：莫塔里家族的二小姐，常为家族处理这不可明说的麻烦\n体型：天体\n属性：千金小姐，残忍系/冷漠无情\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(招聘后5年触发)
  gts_setting.104.8a: "44. Colette\\nIntroduction: The second miss of the Mortari family, often handling unspeakable troubles for the family\\nBody Size: Celestial\\nAttributes: Rich Miss, Cruel Type/Indifferent and Ruthless\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Post-Recruitment Daily Events (Triggered 5 years after recruitment)"
  #  45.法拉尔达\n简介：穿着穗群原学园小学部的制服，赤发红瞳，充满活力就像火焰一样，看上去只是个普通的女孩子，据说来自某个小贵族家庭，好像并没有什么特别的地方\n体型：天体\n属性：萝莉\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链(人皇起源专属)
  gts_setting.104.9a: "45. Faralda\\nIntroduction: Wearing the uniform of the elementary school department of Homurahara Academy, red hair and red eyes, full of vitality like fire, looks like just an ordinary girl, said to come from a small noble family, seems to have nothing special\\nBody Size: Celestial\\nAttributes: Loli\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain (Human Emperor Origin Exclusive)"
  #  46.伊莉雅斯菲尔\n简介：就读于穗群原学园小学部的普通女孩子，银发赤眼，名字很有贵族的风格，常不在家的双亲从事神秘的工作\n体型：天体\n属性：萝莉\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链(人皇起源专属)
  gts_setting.104.10a: "46. Illyasviel\\nIntroduction: An ordinary girl studying in the elementary school department of Homurahara Academy, silver hair and red eyes, name has a very noble style, parents who are often away from home engage in mysterious work\\nBody Size: Celestial\\nAttributes: Loli\\nSpecial Mechanism: None\\n\\nEvents included:\\n*Recruitment Event Chain (Human Emperor Origin Exclusive)"
  #  47.鹅\n简介：如你所见，这是一只鹅\n体型：正常\n属性：动物\n特殊机制：可以兑换Bruh舰娘以及解锁提速选项\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)
  gts_setting.104.11a: "47. Goose\\nIntroduction: As you can see, this is a goose\\nBody Size: Normal\\nAttributes: Animal\\nSpecial Mechanism: Can exchange for Bruh Shipgirl and unlock speed boost options\\n\\nEvents included:\\n*Recruitment Event Chain\\n*Post-Recruitment Daily Events (Timed Trigger)"
  #  48.林凤\n简介：自称是来自异世界的旅者，她想在我们的宇宙里进行一次“短暂”的旅行\n体型：天体级\n属性：狐娘、血腥残忍系\n特色：福祸相依的事件、暂时没什么用的好感度\n\n该角色包含的事件：\n招聘事件(点击就送，但有一点代价)\n索要资源/人口事件(随机触发)\n联动事件1(当同时拥有林凤和艾普露时触发)\n联动事件2(当同时拥有林凤和千海时触发)
  gts_setting.104.12a: "48. Linfeng\\nIntroduction: Claims to be a traveler from another world, wanting to take a \"short\" trip in our universe\\nBody Size: Celestial Level\\nAttributes: Fox Girl, Bloody Cruel Type\\nFeature: Events of mixed blessing, currently rather useless Favorability\\n\\nEvents included:\\nRecruitment Event (Get it by clicking, but there is a price)\\nDemand Resource/Pop Event (Random Trigger)\\nLinkage Event 1 (Triggered when owning both Linfeng and Aplog)\\nLinkage Event 2 (Triggered when owning both Linfeng and Qianhai)"
  gts_setting.105.name: "Leader Gallery - Page 5"
  # Original: 3.1.0更新\n新内容\n——加入了一只新的普通鞋子（还没有具体区划\n——新增了希尔、板鸭的陆军后续事件及特殊登陆事件\n——新增了数项特殊星球的适宜度科技，以及改造特殊星球的地貌生成\n——新增了花田领袖的后续事件，可获得花田领袖武装科研船\n——新增了犽戎的换衣选项法令\n——新增了领袖的好感度选项（目前只有花田领袖有特殊事件\n——新增两项星际行动\n——新增了一个异常现象\n——新增了三名领袖：希尔、板鸭、流萤\n——新增了一个新的国民理念\n——新增了数个舰娘的名字\n——新增了萨拉托加领袖的后续事件\n\n调整：\n——增加了跳蛋星球长时间未清除地貌的惩罚\n——修改了巨娘饰品的增益、获取条件与数项新科技\n——降低了巨娘地貌开拓者的权重\n——修改了星球的命运事件的权重\n\nBUG修复:\n——修复了原版舰船名字出错的问题\n——修复了不满足条件就能建造h星人分部建筑的问题\n——修复了微文明培育室不能组装人口的问题\n——修复了天体级巨娘能够被缩小射线巨像缩小到微生物的问题\n——修复了招募古明地觉后招募标记错位的问题\n\n寰海极宇起源：\n——新增了三个险种和三个新建筑\n——新增了巨娘足踏险和巨娘乳压险的退保事件\n——增加了一项针对土著文明的新谍报，需要天外恶作剧国民理念\n——新增了二个退保事件，建立巨娘阴吞险或扶她险后有一定概率数年后触发\n——增加了保险合约国的贴图\n——寰海极宇起源现在每颗星球只能存在一个保险销售员，多余的天体级人口将会被缩小\n——略微增加保险分部建筑建造完成的惩罚\n——现在附庸小人侧和巨娘侧资源不再隐藏\n——修复了开启scat开关能解锁所有有关建筑的问题\n——修复了天体级巨娘科学家无法添加到科研船上的问题\n——修复了开启抖m事件直接当场游戏结束的问题\n——修复了保险项目建筑会消失的问题\n——修复了部分文案的错误
