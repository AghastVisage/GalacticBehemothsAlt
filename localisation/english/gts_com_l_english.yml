  # 领袖图鉴-第一页
  gts_setting.101.name: "Leader Gallery - Page 1"
  # 你想要了解哪位领袖的事情呢？
  gts_setting.101.desc: "Which leader do you want to know about?"
  # 1-1 洛蒂
  gts_setting.101.1: "1-1 Lottie"
  # 1.洛蒂\n简介：猫娘女仆，十分热情温柔，但有些粗心\n体型：巨大\n属性：女仆猫娘、丝足、鞋控、温柔系、无意识\n特殊机制：建造可升级鞋子居住站\n\n该角色包含的事件：\n*招聘考古事件链(拥有多个分支剧情)\n*周年庆典事件(定期触发，最多到20周年)\n*制作鞋子太空站(完成十周年庆典)
  gts_setting.101.1a: "1. Lottie\nIntroduction: Cat girl maid, very enthusiastic and gentle, but a bit careless\nBody Size: Giant\nAttributes: Maid Cat Girl, Silk Feet, Shoe Control, Gentle Type, Unconscious\nSpecial Mechanism: Build upgradable Shoe Habitat\n\nEvents included:\n*Recruitment Archaeology Event Chain (Multiple branch plots)\n*Anniversary Celebration Event (Triggered regularly, up to 20th anniversary)\n*Making Shoe Space Station (Complete 10th Anniversary Celebration)"
  # 1-2 欧若拉
  gts_setting.101.2: "1-2 Aurora"
  # 2.欧若拉\n简介：一位从沉睡中苏醒的天体级萝莉\n体型：天体\n属性：萝莉、温柔系、无意识、角色养成、虐待角色\n特殊机制：角色本身就是一颗宜居星球，可以喂养星球变大\n\n该角色包含的事件：\n*招聘局势事件链(拥有正常招聘线和击败俘虏线)\n*角色背景考古事件链(定时触发)\n*行星投喂事件(星球决议)\n*击败俘虏线的灭星与反抗剧情(定时触发)\n*粪便星球改造差分事件
  gts_setting.101.2a: "2. Aurora\nIntroduction: A celestial-level loli awakened from slumber\nBody Size: Celestial\nAttributes: Loli, Gentle Type, Unconscious, Character Cultivation, Abuse Character\nSpecial Mechanism: The character itself is a habitable planet, can feed the planet to grow bigger\n\nEvents included:\n*Recruitment Situation Event Chain (Has Normal Recruitment Line and Defeat Captive Line)\n*Character Background Archaeology Event Chain (Timed Trigger)\n*Planet Feeding Event (Planet Resolution)\n*Planet Destruction and Resistance Plot of Defeat Captive Line (Timed Trigger)\n*Feces Planet Modification Difference Event"
  # 1-3 矶风
  gts_setting.101.3: "1-3 Isokaze"
  # 3.矶风\n简介：矶风级宇宙驱逐舰改-矶风型科研舰\n体型：巨大\n属性：萝莉、腹黑\n特殊机制：无\n\n该角色包含的事件：\n*拍拍耳朵(喵哒呦 -  - )\n*腋下清理(定时触发)
  gts_setting.101.3a: "3. Isokaze\nIntroduction: Isokaze-class Space Destroyer Modified - Isokaze-type Science Ship\nBody Size: Giant\nAttributes: Loli, Black-bellied\nSpecial Mechanism: None\n\nEvents included:\n*Pat Ears (Meow~)\n*Armpit Cleaning (Timed Trigger)"
  # 1-4 亿盐
  gts_setting.101.4: "1-4 Yiyan"
  # 4.亿盐\n简介：一位是神秘出现的天体级巨娘，对小西红柿有特殊的执念\n体型：天体\n属性：白狐、反差、多重大小\n特殊机制：无\n\n该角色包含的事件：\n*招聘考古事件链\n*招聘后日常事件(招聘5年后触发)\n*寰海极宇起源联动事件(完成保险项目精液内陆湖后小概率触发)
  gts_setting.101.4a: "4. Yiyan\nIntroduction: A celestial-level Giantess who appeared mysteriously, has a special obsession with cherry tomatoes\nBody Size: Celestial\nAttributes: White Fox, Contrast, Multiple Sizes\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Archaeology Event Chain\n*Post-Recruitment Daily Events (Triggered 5 years after recruitment)\n*Universal Sea Extreme Universe Origin Linkage Event (Small probability to trigger after completing Insurance Project Semen Inland Lake)"
  # 2-1 艾普露
  gts_setting.101.5: "2-1 Erika"
  # 5.艾普露\n简介：一位猫娘战士，对小人奴隶十分感兴趣\n体型：高大\n属性：黑皮猫娘、残忍系、多重大小\n特殊机制：随机劫掠其他帝国\n陆战特化领袖，不擅长内阁工作\n\n该角色包含的事件：\n*招聘考古事件链\n*招聘后日常事件(随机触发)\n*劫掠事件(定期重复触发)\n*生日事件(需要开启SCAT)\n*与其他领袖互动事件(随机触发)\n*篡权事件(仅限小人帝国无巨娘统治者)\n*终末地事件(让艾普露进入终末地黑洞)
  gts_setting.101.5a: "5. April\nIntroduction: A cat girl warrior, very interested in small person slaves\nBody Size: Tall\nAttributes: Dark Skin Cat Girl, Cruel Type, Multiple Sizes\nSpecial Mechanism: Randomly raid other empires\nLand Warfare Specialized Leader, not good at cabinet work\n\nEvents included:\n*Recruitment Archaeology Event Chain\n*Post-Recruitment Daily Events (Triggered randomly)\n*Raid Event (Triggered repeatedly regularly)\n*Birthday Event (Requires enabling SCAT)\n*Interaction Events with other Leaders (Triggered randomly)\n*Usurpation Event (Only for small person empires without Giantess Ruler)\n*Endfield Event (Let April enter Endfield Black Hole)"
  # 2-2 艾雅法拉
  gts_setting.101.6: "2-2 Doctor"
  # 6.艾雅法拉\n简介：一位沉睡多年的火山学者，尽管重病缠身，但她仍愿意为科学发展贡献自己的力量\n体型：泰坦/天体\n属性：软糯后辈、温柔系/无意识系、多重大小、体表探索\n特殊机制：丰富的剧情事件\n\n该角色包含的事件：\n*招聘考古事件链(开启需要在该星球上清除火山之母障碍)\n*治愈源石病事件链(定时触发)\n*涨奶事件(定期重复触发)\n*天体级成长事件(治愈后定时触发)\n*足底测绘事件(治愈后定时触发)\n*与小花田的联动事件(同时拥有两位领袖，每五年检测一次)
  gts_setting.101.6a: "6. Eyjafjalla\nIntroduction: A volcanologist who has been asleep for many years. Despite being riddled with serious illness, she is still willing to contribute her strength to scientific development\nBody Size: Titan/Celestial\nAttributes: Soft Junior, Gentle Type/Unconscious Type, Multiple Sizes, Body Surface Exploration\nSpecial Mechanism: Rich plot events\n\nEvents included:\n*Recruitment Archaeology Event Chain (Requires clearing Mother of Volcanoes obstacle on the planet to open)\n*Cure Oripathy Event Chain (Timed Trigger)\n*Milk Engorgement Event (Triggered repeatedly regularly)\n*Celestial Level Growth Event (Timed Trigger after cure)\n*Sole Mapping Event (Timed Trigger after cure)\n*Linkage Event with HuaTian (Own both leaders at the same time, checked every five years)"
  # 2-3 斯卡蒂
  gts_setting.101.7: "2-3 Skadi"
  # 7.斯卡蒂\n简介：斯卡蒂，一位来自宇宙外的 maiden，这一次，她有足够的力量与自信保护好\"博士\"了\n体型：天体\n属性：冰冷美人、masterlove、清冷笨拙\n特殊机制：丰富的剧情事件与特殊机制机制\n\n该角色包含的事件：\n*招聘考古事件链\n*各种各样的斯卡蒂事件(随机触发)\n*斯卡蒂的虚境事件(同上，随机触发)\n*虎鲸诱捕器(巨像武器，有futa差分)\n*爱液星球改造差分事件\n*寰海极宇起源联动事件(抗保)
  gts_setting.101.7a: "7. Skadi\nIntroduction: Skadi, a girl from outside the universe. This time, she has enough power and confidence to protect \\\"Doctor\\\" well\nBody Size: Celestial\nAttributes: Ice Beauty, Masterlove, Cold and Clumsy\nSpecial Mechanism: Rich plot events and special mechanisms\n\nEvents included:\n*Recruitment Archaeology Event Chain\n*Various Skadi Events (Triggered randomly)\n*Skadi's Shroud Event (Same as above, triggered randomly)\n*Orca Trap (Colossus Weapon, has futa difference)\n*Love Fluid Planet Modification Difference Event\n*Universal Sea Extreme Universe Origin Linkage Event (Resistance)"
  # 2-4 颂汐
  gts_setting.101.8: "2-4 Sonxi"
  # 8.颂汐\n简介：一位资深小人学家，热衷于品尝自己的实验对象，无论是从口感上还是使用手感上\n体型：天体\n属性：无意识、Vore\n特殊机制：在你的星系内召唤一只睡觉蓝色小熊\n\n该角色包含的事件：\n*招聘事件链\n*招聘后事件(随机触发)
  gts_setting.101.8a: "8. Songxi\nIntroduction: A senior small personologist, keen on tasting her experimental subjects, whether in terms of taste or handling feel\nBody Size: Celestial\nAttributes: Unconscious, Vore\nSpecial Mechanism: Summon a sleeping blue bear in your system\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Events (Triggered randomly)"
  # 3-1 铃鹿
  gts_setting.101.9: "3-9"
  # 9.无声铃鹿\n简介：无声铃鹿，与鞋内小人训练员游历星海200余年，现作为国家科研顾问，(请按时提供缩小城市与星球)\n体型：天体\n属性：马娘、残忍系、压路机\n特殊机制：可以建造特殊地貌\n\n该角色包含的事件：\n*招聘事件链\n*招聘后事件(定时触发)\n*铃鹿科研事件(定时触发)
  gts_setting.101.9a: "9. Silence Suzuka\nIntroduction: Silence Suzuka, traveled the star sea for more than 200 years with the in-shoe small person trainer, now serves as a national scientific consultant, (Please provide shrunken cities and planets on time)\nBody Size: Celestial\nAttributes: Horse Girl, Cruel Type, Road Roller\nSpecial Mechanism: Can build special landforms\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Events (Timed Trigger)\n*Suzuka Research Events (Timed Trigger)"
  # 3-2 丸山彩
  gts_setting.101.10: "3-10"
  # 10.丸山彩\n简介：丸之山上缤纷彩，这里是因为不明原因变成巨大娘的丸山彩，目前在做着偶像兼国家元首的工作，今后也会用歌声鼓舞大家的！\n体型：巨大\n属性： maiden偶像、温柔系、缩小寄居\n特殊机制：起源专属领袖，有配套的政策法令\n\n该角色包含的事件：\n*起源事件\n*体型变化事件
  gts_setting.101.10a: "10. Maruyama Aya\nIntroduction: Colorful Aya on the Round Mountain. This is Maruyama Aya who became a Giantess for unknown reasons. Currently doing the job of an idol and head of state, and will continue to inspire everyone with singing in the future!\nBody Size: Giant\nAttributes: Girl Idol, Gentle Type, Shrink Parasitism\nSpecial Mechanism: Origin Exclusive Leader, has matching policies and edicts\n\nEvents included:\n*Origin Events\n*Body Size Change Event"
  # 3-3 空弦
  gts_setting.101.11: "3-3 Archetto"
  # 11.空弦\n简介：无论是因为她的灵能气场还是她极强的人格魅力，空弦的布道演出总能做到座无虚席，此外她长期历练出的财政管理能力也能为我们薄弱的贸易事务提供很大帮助，\n体型：巨大\n属性：兽耳娘\n特殊机制：无\n\n该角色包含的事件：\n*虔心崇圣国策解锁(星球决议-布道巡回演出)
  gts_setting.101.11a: "11. Archetto\nIntroduction: Whether it is because of her psionic aura or her strong personality charm, Archetto's preaching performances can always achieve full attendance. In addition, her financial management ability honed over a long period of time can also provide great help for our weak trade affairs,\nBody Size: Giant\nAttributes: Beast Ear Girl\nSpecial Mechanism: None\n\nEvents included:\n*Devout Worship Civic Unlock (Planet Resolution - Preaching Tour)"
  # 3-4 瑕光
  gts_setting.101.12: "3-4 Archetto"
  # 12.瑕光\n简介：瑕光拥有不逊于其姐，现任家族领袖玛嘉烈的战斗潜力，也有这远胜于其他领主的巨大体型，如果我们能争取到临光家的同意，那拥有这样一位青年将才无疑会是我国军队的幸运\n体型：巨大\n属性：兽耳娘\n特殊机制：无\n\n该角色包含的事件：\n*巨娘封邑国策解锁(星球决议-游猎封邑)
  gts_setting.101.12a: "12. Blemishine\nIntroduction: Blemishine possesses combat potential no less than her sister, the current family leader Nearl, and also has a huge body size far superior to other lords. If we can win the consent of the Nearl family, having such a young talent will undoubtedly be the luck of our army\nBody Size: Giant\nAttributes: Beast Ear Girl\nSpecial Mechanism: None\n\nEvents included:\n*Giantess Fiefdom Civic Unlock (Planetary Decision - Hunting Fiefdom)"
  # 领袖图鉴-第二页
  gts_setting.102.name: "Leader Gallery - Page 2"
  # 你想要了解哪位领袖的事情呢？
  gts_setting.102.desc: "Which leader do you want to know about?"
  # 1-1 伊莱莎
  gts_setting.102.1: "1-1 Eliza"
  # 13.伊莱莎\n简介：虽然我们对她严重老化的动力系统已经进行了修复和改造，但她依然习惯称自己为蒸汽智械女仆伊莱莎，她拒绝再次做屠杀生灵的刽子手，而是将工作重点投入到保护人民健康安乐，实现社会繁荣稳定上，此外她还意外的对人口增殖抱有很大热情，大概是其对物种灭绝的悲惨记忆所致\n体型：巨大\n属性：机械女仆、一战\n特殊机制：无\n\n该角色包含的事件：\n*遍地堑壕异常事件研究完成后招聘
  gts_setting.102.1a: "13. Eliza\nIntroduction: Although we have repaired and modified her severely aging power system, she is still used to calling herself the Steam Automaton Maid Eliza. She refuses to be an executioner slaughtering living beings again, but instead devotes her work to protecting the health and peace of the people and realizing social prosperity and stability. In addition, she surprisingly has great enthusiasm for population proliferation, probably due to her tragic memory of species extinction\nBody Size: Giant\nAttributes: Mechanical Maid, WW1\nSpecial Mechanism: None\n\nEvents included:\n*Recruit after researching Trenches Everywhere Anomaly Event"
  # 1-2 成惠
  gts_setting.102.2: "2-2"
  # 14.成惠\n简介：巨大化的成惠能轻松处理掉对我们来说难以清理的障碍物，她也能高效的帮我们采集和搬运造物主身上的各类资源\n体型：天体\n属性：缩小学院、体内寄生、vore\n特殊机制：自助餐厅起源领袖\n\n该角色包含的事件：\n*领袖招聘事件(开局后触发)\n*身体殖民事件(通讯界面选择)\n*脚底调查事件(通讯界面选择殖民右足后触发)\n*填饱肚子事件(每十年触发一次)
  gts_setting.102.2a: "14. Narue\nIntroduction: Giantified Narue can easily deal with obstacles that are difficult for us to clear, and she can also efficiently help us collect and transport various resources on the creator's body\nBody Size: Celestial\nAttributes: Shrink Academy, Internal Parasitism, Vore\nSpecial Mechanism: Cafeteria Origin Leader\n\nEvents included:\n*Leader Recruitment Event (Triggered after start)\n*Body Colonization Event (Communication Interface Selection)\n*Sole Investigation Event (Triggered after Communication Interface Select Colonize Right Foot)\n*Filling Stomach Event (Triggered once every ten years)"
  # 1-3 花子
  gts_setting.102.3: "2-3"
  # 15.花子\n简介：起来颇为优雅，但实际上满口黄段子，曾经一手掀起合欢派之乱的天才 maiden\n体型：泰坦\n属性：BA、巨乳\n特殊机制：无\n\n该角色包含的事件：\n*合欢派事件中招聘花子
  gts_setting.102.3a: "15. Hanako\nIntroduction: Looks quite elegant, but actually full of dirty jokes, the genius girl who once single-handedly set off the chaos of the Acacia Sect\nBody Size: Titan\nAttributes: BA, Big Breasts\nSpecial Mechanism: None\n\nEvents included:\n*Recruit Hanako in Acacia Sect Event"
  # 1-4 小春
  gts_setting.102.4: "1-4 Xiaochun"
  # 16.小春\n简介：正义实现委员会的成员，为了维护纯洁的社会风气而不断努力着，(实际上是沉迷妄想和私藏色情杂志的行星总督，尽管拒绝承认自己的性欲，但只要看到一点点相关元素就会满脑情色妄想，自顾自地害羞起来)\n体型：泰坦\n属性：BA、萝莉\n特殊机制：无\n\n该角色包含的事件：\n*合欢派事件中招聘小春
  gts_setting.102.4a: "16. Koharu\nIntroduction: A member of the Justice Realization Committee, constantly working hard to maintain a pure social atmosphere, (Actually a planetary governor addicted to delusions and hiding pornographic magazines. Although she refuses to admit her sexual desire, as long as she sees a little bit of related elements, her mind will be full of erotic delusions and she will become shy on her own)\nBody Size: Titan\nAttributes: BA, Loli\nSpecial Mechanism: None\n\nEvents included:\n*Recruit Koharu in Acacia Sect Event"
  # 2-1 绘里香
  gts_setting.102.5: "2-5"
  # 17.绘里香\n简介：喜欢享用小虫子的先科研干部\n体型：泰坦\n属性：缩小学院、vore、排泄\n特殊机制：无\n\n该角色包含的事件：\n*招聘考古事件链\n*招聘后日常事件(定时触发)\n*特殊的陆军占领星球事件(scat)
  gts_setting.102.5a: "17. Erika\nIntroduction: Former scientific research cadre who likes to enjoy small bugs\nBody Size: Titan\nAttributes: Shrink Academy, Vore, Excretion\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Archaeology Event Chain\n*Post-Recruitment Daily Events (Timed Trigger)\n*Special Army Occupation Planet Event (SCAT)"
  # 2-2 澄闪
  gts_setting.102.6: "2-2 Goldenglow"
  # 18.澄闪\n简介：天真懵懂的巨娘 maiden\n体型：天体\n属性：温柔坚定、区别对待、多重大小\n特殊机制：无\n该角色包含的事件：\n*招聘考古事件链
  gts_setting.102.6a: "18. Goldenglow\nIntroduction: Innocent and ignorant Giantess girl\nBody Size: Celestial\nAttributes: Gentle and Firm, Differential Treatment, Multiple Sizes\nSpecial Mechanism: None\nEvents included:\n*Recruitment Archaeology Event Chain"
  # 2-3 花田
  gts_setting.102.7: "2-3 Huatian"
  # 19.花田\n简介：这位领袖来自于一个远古文明最后的计划，由于过去的经历，她对于星海中的小人种族有着天然的好感，获得批准之后移居在她躯体上的小人个体也为我们提供了可观的岗位与资源\n体型：天体\n属性：元气 maiden、温柔系/无意识系\n特殊机制：丰富的剧情事件与好感度机制，可招聘特殊舰娘\n\n该角色包含的事件：\n*招聘考古事件链(两条线路有剧情差分)\n*招聘后日常事件(随机触发)\n*小花田好感度事件(招聘后三年触发)\n*小花田舰娘改造(好感度大于50与花田对话)\n*巨像事件(使用舰娘花田配备的巨像武器)\n*领袖起源考古(好感度大于75)\n*领袖体型改造事件(使用花田遗珍)\n*终末地事件(让花田进入终末地黑洞)\n*终末地日常事件(进入终末地后一年触发)\n*与千海的联动事件(同时拥有两位领袖，星系行动选择天体盛宴)
  gts_setting.102.7a: "19. Huatian\nIntroduction: This leader comes from the final plan of an ancient civilization. Due to past experiences, she has a natural affection for the tiny person races in the star sea. After obtaining approval, the tiny person individuals who immigrated to her body also provided us with considerable jobs and resources\nBody Size: Celestial\nAttributes: Energetic Girl, Gentle Type/Unconscious Type\nSpecial Mechanism: Rich plot events and affinity mechanism, can recruit special Shipgirls\n\nEvents included:\n*Recruitment Archaeology Event Chain (Two lines have plot differences)\n*Post-Recruitment Daily Events (Triggered randomly)\n*HuaTian Affinity Event (Triggered three years after recruitment)\n*HuaTian Shipgirl Modification (Affinity greater than 50 and talk to Huatian)\n*Colossus Event (Use Colossus weapon equipped by Shipgirl Huatian)\n*Leader Origin Archaeology (Affinity greater than 75)\n*Leader Body Size Modification Event (Use Huatian Relic)\n*Endfield Event (Let Huatian enter Endfield Black Hole)\n*Endfield Daily Event (Triggered one year after entering Endfield)\n*Linkage Event with Qianhai (Own both leaders at the same time, Galaxy Action choose Celestial Feast)"
  # 2-4 晓淼
  gts_setting.102.8: "2-4 Xiaomiao"
  # 20.晓淼\n简介：失散多年的妹妹，如今对我来说就如同微生物一样\n体型：微小\n属性：缩小女\n特殊机制：mod唯一的小人领袖，设定上是玩家的妹妹\n\n该角色包含的事件：\n*招聘考古事件链(选择拒绝可以把晓淼变成玩具)\n*招聘后巨大化尝试事件(定时触发)
  gts_setting.102.8a: "20. Xiaomiao\nIntroduction: Long-lost sister, now like a microorganism to me\nBody Size: Micro\nAttributes: Shrink Girl\nSpecial Mechanism: The only tiny person leader in the mod, set as the player's sister\n\nEvents included:\n*Recruitment Archaeology Event Chain (Choosing to refuse can turn Xiaomiao into a toy)\n*Post-Recruitment Giantification Attempt Event (Timed Trigger)"
  # 3-1 水晶兰
  gts_setting.102.9: "3-1 Monotropa"
  # 21.水晶兰\n简介：在上古恶魔面前，世间的虚妄与诡计都如同蹒跚学步的幼童般可笑，当然，任何时候都不缺乏无知且鲁莽的愚者\n体型：天体\n属性：\n特殊机制：无\n\n该角色包含的事件：\n*招聘考古事件链(天体级起源限定领袖，目前暂时无法招聘)
  gts_setting.102.9a: "21. Monotropa Uniflora\nIntroduction: In front of the ancient demons, the falsehoods and tricks of the world are as ridiculous as toddlers learning to walk. Of course, there is no shortage of ignorant and reckless fools at any time\nBody Size: Celestial\nAttributes:\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Archaeology Event Chain (Celestial Origin Limited Leader, currently temporarily unable to recruit)"
  # 3-2 蒂法妮娅
  gts_setting.102.10: "3-2 Tiffania"
  # 22.蒂法妮娅\n简介：不同于其他树精灵，是一位对外面世界充满好奇心的巨娘\n体型：泰坦\n属性：精灵、王女\n特殊机制：无\n\n该角色包含的事件：\n*精灵帝国相关事件(该领袖通过随机出现的秘密访问事件招聘)
  gts_setting.102.10a: "22. Tiffania\nIntroduction: Unlike other tree elves, she is a Giantess full of curiosity about the outside world\nBody Size: Titan\nAttributes: Elf, Princess\nSpecial Mechanism: None\n\nEvents included:\n*Elf Empire Related Events (This leader is recruited through randomly appearing secret visit events)"
  # 3-3 先科研
  gts_setting.102.11: "3-3 Xiankeyan"
  # 23.先科研\n简介：缩小学院联动事件链，该事件链没有可招聘领袖\n体型：无\n属性：无\n特殊机制：无\n\n该角色包含的事件：\n*先科研调查相关事件
  gts_setting.102.11a: "23. Xiankeyan\nIntroduction: Shrink Academy Linkage Event Chain, this event chain has no recuitable leader\nBody Size: None\nAttributes: None\nSpecial Mechanism: None\n\nEvents included:\n*Xiankeyan Investigation Related Events"
  # 3-4 千海
  gts_setting.102.12: "3-4 Qianhai"
  # 24.千海\n简介：一位紫发魅魔 maiden，希望在这里能度过一段轻松愉快的时光\n体型：天体\n属性：魅魔 maiden、无意识、穴内、百合\n特殊机制：丰富的剧情事件与特殊机制机制\n\n该角色包含的事件：\n*招聘事件链\n*招聘后事件(定时触发/随机触发)\n*与泰坦巨娘互动(不能是通讯面板内的泰坦领袖)\n*特殊的改造爱液星球事件\n*穿鞋事件(探索\"鞋柜\"星系触发天体级制服鞋事件中选择让千海来)\n*与花田的联动事件(同时拥有两位领袖，星系行动选择天体盛宴)\n*与犽戎的联动事件(犽戎成年后与千海聊天)\n*寰海极宇起源联动事件(完成保险项目足汗丝袜后小概率触发)
  gts_setting.102.12a: "24. Qianhai\nIntroduction: A purple-haired succubus girl, hoping to spend a relaxed and happy time here\nBody Size: Celestial\nAttributes: Succubus Girl, Unconscious, Inside Hole, Yuri\nSpecial Mechanism: Rich plot events and special mechanisms\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Events (Timed Trigger/Random Trigger)\n*Interaction with Titan Giantess (Cannot be Titan Leader in Communication Panel)\n*Special Modify Love Fluid Planet Event\n*Wear Shoes Event (Explore \\\"Shoe Cabinet\\\" system trigger Celestial Uniform Shoe Event choose let Qianhai come)\n*Linkage Event with Huatian (Own both leaders at the same time, Galaxy Action choose Celestial Feast)\n*Linkage Event with Yarong (Chat with Qianhai after Yarong comes of age)\n*Universal Sea Extreme Universe Origin Linkage Event (Small probability to trigger after completing Insurance Project Foot Sweat Stockings)"
  # 领袖图鉴-第三页
  gts_setting.103.name: "Leader Gallery - Page 3"
  # 你想要了解哪位领袖的事情呢？
  gts_setting.103.desc: "Which leader do you want to know about?"
  # 1-1 安露
  gts_setting.103.1: "1-1 Anlu"
  # 25.安露\n简介：一位侍奉着恶魔的天使，也许曾经有过许多曲折的故事，但至少现在她听从你命令\n体型：天体\n属性：天使、主仆\n特殊机制：无\n\n该角色包含的事件：\n*招聘领袖(完成特定招聘后事件，选项有提示)\n*特殊的陆军占领星球事件
  gts_setting.103.1a: "25. Anlucia\nIntroduction: An angel serving a demon. Maybe there were many twists and turns in the past, but at least now she obeys your orders\nBody Size: Celestial\nAttributes: Angel, Master-Servant\nSpecial Mechanism: None\n\nEvents included:\n*Recruit Leader (Complete specific post-recruitment event, options have hints)\n*Special Army Occupation Planet Event"
  # 1-2 犽戎
  gts_setting.103.2: "1-2"
  # 26.犽戎\n简介：于旧日理想城废墟里破壳而出的 maiden，她是昔日神明也是如今帝国的公主，她拥有着堪比恒星般伟岸的身躯，却又会露出独属于 maiden的稚嫩一面 -  - 回应她的期许吧\n体型：天体\n属性：龙娘、女儿、傲娇，犬系\n特殊机制：丰富的剧情事件与特殊机制机制\n\n该角色包含的事件：\n*主线按照触发顺序包含：\n-孵化事件链\n-铸甲为裙(将理想城废墟升级为神主雕像)\n-犽戎领袖招聘/成年礼(5-10年后触发)\n-嬉闹、穿衣(定时触发)\n-逼宫(同时存在紫宸和犽戎，每五年判定一次)\n-体外殖民(逼宫1800天后触发)\n-附庸事件(加冕后拥有非巨娘起源的附庸国，泰坦帝国有差分)\n*支线包含：\n-换牙(孵化后720天触发)\n-体内殖民事件链(完成化龙国策)\n-威胁傲慢与愤怒(全面战争时，太空战胜利时触发)\n-羞辱战争(太空战胜利时触发，唯心国家且拥有爱液星球改造科技有差分)\n-附庸战争(轨道轰炸敌人首都时触发)\n-克扣事件(年份小于2260且战争胜利)\n-吃醋事件(成年礼到逼宫之间 殖民地每三年判定一次随机触发)\n*犽戎好感度事件
  gts_setting.103.2a: "26. Yarong\nIntroduction: The girl who hatched from the ruins of the old Ecumenopolis. She is the god of the past and the princess of the empire today. She has a magnificent body comparable to a star, but also shows the immature side unique to a girl - respond to her expectations\nBody Size: Celestial\nAttributes: Dragon Girl, Daughter, Tsundere, Dog-like\nSpecial Mechanism: Rich plot events and special mechanisms\n\nEvents included:\n*Main Line includes in trigger order:\n-Incubation Event Chain\n-Forging Armor into Skirt (Upgrade Ecumenopolis Ruins to God Statue)\n-Yarong Leader Recruitment/Coming of Age Ceremony (Triggered 5-10 years later)\n-Frolic, Dressing (Timed Trigger)\n-Forced Palace (Exist Zichen and Yarong at the same time, judged every five years)\n-External Colonization (Triggered 1800 days after Forced Palace)\n-Vassal Event (After Coronation, own non-Giantess Origin Vassal State, Titan Empire has difference)\n*Branch Line includes:\n-Change Teeth (Triggered 720 days after Incubation)\n-Internal Colonization Event Chain (Complete Dragon Transformation Civic)\n-Threat Arrogance and Anger (Triggered when Space Battle Victory during Total War)\n-Humiliation War (Triggered when Space Battle Victory, Spiritualist Country and own Love Fluid Planet Modification Tech has difference)\n-Vassal War (Triggered when Orbital Bombardment Enemy Capital)\n-Deduction Event (Year less than 2260 and War Victory)\n-Jealousy Event (Between Coming of Age Ceremony and Forced Palace, Colony judged every three years randomly triggered)\n*Yarong Affinity Event"
  # 1-3 紫宸
  gts_setting.103.3: "3-3"
  # 27.紫宸\n简介：先驱者们的母神与送葬者，文明兴起的辉光与灭世的黑炎都萦绕在她的冠冕上，她现在为你效力，称你为父 -  - 你当真承担的起这个称呼么？\n体型：天体\n属性：懵懂，区别对待\n特殊机制：无\n\n该角色包含的事件：\n*招聘考古事件(犽戎成年礼5年后触发)\n*玩弄事件(拥有紫宸后1800天随机360天触发)\n*向父亲举起叛逆之剑(每年判定一次，19年后触发)
  gts_setting.103.3a: "27. Zichen\nIntroduction: The mother goddess and undertaker of the pioneers, the glow of civilization's rise and the black flame of world destruction haunt her crown. She now works for you and calls you father - can you really afford this title?\nBody Size: Celestial\nAttributes: Ignorant, Differential Treatment\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Archaeology Event (Triggered 5 years after Yarong's Coming of Age Ceremony)\n*Toying Event (Triggered randomly 360 days after 1800 days of owning Zichen)\n*Raising the Sword of Rebellion against Father (Judged once a year, triggered after 19 years)"
  # 1-4 古明地觉
  gts_setting.103.4: "1-4 Komeiji Satori"
  # 28.古明地觉\n简介：拥有读心能力妖怪觉，地灵殿的主人，拥有泰坦体型的她为了寻找更加巨大的妹妹来到我们帝国\n体型：泰坦\n属性： maiden、妖怪\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链
  gts_setting.103.4a: "28. Komeiji Satori\nIntroduction: The Youkai Satori with mind-reading ability, the master of the Palace of Earth Spirits. Possessing a Titan body size, she came to our empire to find her even more huge sister\nBody Size: Titan\nAttributes: Girl, Youkai\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain"
  # 2-1 天条
  gts_setting.103.5: "2-1 Tiantiao"
  # 29.天条\n简介：一位巨大的宇宙航务警察娘，似乎携带着某种失落科技\n体型：天体\n属性：女警、身体囚禁\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)
  gts_setting.103.5a: "29. Tentijou\nIntroduction: A huge space traffic police girl, seems to carry some lost technology\nBody Size: Celestial\nAttributes: Policewoman, Body Imprisonment\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Daily Events (Timed Trigger)"
  # 2-2 博士
  gts_setting.103.6: "2-2 Huatian"
  # 30.博士\n简介：一位天体级futa博士，致力于观察宇宙中的众多文明\n体型：天体\n属性：futa、足控\n特殊机制：特殊的飞机杯巨构\n\n该角色包含的事件：\n*招聘事件链\n*原石事件(定时触发)\n*飞机杯事件(定时触发)
  gts_setting.103.6a: "30. Doctor\nIntroduction: A celestial-level futa doctor, dedicated to observing many civilizations in the universe\nBody Size: Celestial\nAttributes: Futa, Foot Control\nSpecial Mechanism: Special Airplane Cup Megastructure\n\nEvents included:\n*Recruitment Event Chain\n*Originium Event (Timed Trigger)\n*Airplane Cup Event (Timed Trigger)"
  # 2-3 玛丽
  gts_setting.103.7: "2-3 Aya"
  # 31.玛丽\n简介：从另一个世界到来的修女，正在为了和平与你而祈祷\n体型：巨大\n属性：BA、兽耳娘、恋爱\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)
  gts_setting.103.7a: "31. Mari\nIntroduction: A nun from another world, praying for peace and you\nBody Size: Giant\nAttributes: BA, Beast Ear Girl, Romance\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Daily Events (Timed Trigger)"
  # 2-4 咕呀
  gts_setting.103.8: "2-4 Guya"
  # 32.咕呀\n简介：一只可以长大的幼女虫娘\n体型：巨大/泰坦/天体\n属性：虫娘、幼女、养成\n特殊机制：可以进行角色养成，不同体型的咕呀拥有不同的技能\n\n该角色包含的事件：\n*招聘事件链\n*养成事件(定时触发)\n*陆军占领星球事件(6km级)\n*太空战胜利事件(60km级)\n*总督事件(1200km级)\n*咕呀舰娘(24000km级)
  gts_setting.103.8a: "32. Guya\nIntroduction: A young insect girl who can grow up\nBody Size: Giant/Titan/Celestial\nAttributes: Insect Girl, Young Girl, Cultivation\nSpecial Mechanism: Character cultivation can be performed, Guya of different sizes has different skills\n\nEvents included:\n*Recruitment Event Chain\n*Cultivation Event (Timed Trigger)\n*Army Occupation Planet Event (6km Level)\n*Space Battle Victory Event (60km Level)\n*Governor Event (1200km Level)\n*Guya Shipgirl (24000km Level)"
  # 3-1 水月
  gts_setting.103.9: "3-1 Mari"
  # 33.水月\n简介：自另一个世界中被澄闪携带穿越而来的海嗣，虽然体型并不能像我们的其他领袖一样被称为巨娘，但水月仍然在同体型甚至对体型高大个体的作战中有着出色的表现，她作为海嗣所拥有的多维视角更能够在指挥舰队作战方面表现出绝佳的成绩\n体型：正常\n属性：海嗣生物、缩小 maiden、温柔系、多重大小\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链(招聘澄闪后两年出现)
  gts_setting.103.9a: "33. Mizuki\nIntroduction: The Seaborn brought from another world by Goldenglow. Although her body size cannot be called a Giantess like our other leaders, Mizuki still performs well in battles of the same size or even against tall individuals. Her multi-dimensional perspective as a Seaborn can show excellent results in commanding fleet battles\nBody Size: Normal\nAttributes: Seaborn Creature, Shrink Girl, Gentle Type, Multiple Sizes\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain (Appears two years after recruiting Goldenglow)"
  # 3-2 塞拉
  gts_setting.103.10: "3-2 Sera"
  # 34.塞拉\n简介：被虫惑之森选为代表的虫惑魔之一，虽然体型看着还是幼女，但是原本在虫惑之森中便是她来主持人员调动以及事务安排等多个方面的决策\n体型：巨大/天体\n属性：虫惑魔、穴内\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*终末地事件(让两位虫惑魔领袖进入终末地黑洞)
  gts_setting.103.10a: "34. Sera\nIntroduction: One of the Traptrix chosen as a representative by the Traptrix Forest. Although her body size still looks like a young girl, she was originally the one who presided over personnel transfers and affair arrangements in the Traptrix Forest\nBody Size: Giant/Celestial\nAttributes: Traptrix, Inside Hole\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain\n*Endfield Event (Let two Traptrix leaders enter Endfield Black Hole)"
  # 3-3 阿洛美勒丝
  gts_setting.103.11: "3-3 Alice"
  # 35.阿洛美勒丝\n简介：被虫惑之森选为代表的虫惑魔之一，体态比起其他虫惑魔来说更成熟一些，似乎很擅长于指挥军团战斗以及将战场变得更为混乱\n体型：巨大/天体\n属性：虫惑魔、穴内\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*终末地事件(让两位虫惑魔领袖进入终末地黑洞)\n*陆军占领星球事件
  gts_setting.103.11a: "35. Allomerus\nIntroduction: One of the Traptrix chosen as a representative by the Traptrix Forest. Her body shape is more mature than other Traptrix, and she seems to be very good at commanding legion battles and making the battlefield more chaotic\nBody Size: Giant/Celestial\nAttributes: Traptrix, Inside Hole\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain\n*Endfield Event (Let two Traptrix leaders enter Endfield Black Hole)\n*Army Occupation Planet Event"
  # 3-4 泡泡
  gts_setting.103.12: "3-4 Paopao"
  # 36.泡泡\n简介：泡泡真可爱吧(大橘说的)\n体型：天体\n属性：没有属性(大橘说的)\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件(紫宸加入一年后触发)
  gts_setting.103.12a: "36. Paopao\nIntroduction: Paopao is really cute (Big Orange said)\nBody Size: Celestial\nAttributes: No Attributes (Big Orange said)\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event (Triggered one year after Zichen joins)"
  # 领袖图鉴-第四页
  gts_setting.104.name: "Leader Gallery - Page 4"
  # 你想要了解哪位领袖的事情呢？
  gts_setting.104.desc: "Which leader do you want to know about?"
  # 1-1 萨拉托加
  gts_setting.104.1: "1-1 Seele"
  # 37.萨拉托加\n简介：名对你忠心耿耿的舰娘，以与你同样的大小伴随左右，平时非常正经，偶尔也会玩心大发(玩完后会好好收拾\n体型：泰坦\n属性：舰娘\n特殊机制：可以获得萨拉托加舰娘\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)\n*演习事件(完成萨拉演习提议事件)
  gts_setting.104.1a: "37. Saratoga\nIntroduction: A shipgirl who is loyal to you, accompanies you with the same size as you, usually very serious, occasionally gets playful (will clean up properly after playing)\nBody Size: Titan\nAttributes: Shipgirl\nSpecial Mechanism: Can obtain Saratoga Shipgirl\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Daily Events (Timed Trigger)\n*Exercise Event (Complete Sara Exercise Proposal Event)"
  # 1-2 特莉波卡
  gts_setting.104.2: "1-2 Bronya"
  # 38.特莉波卡\n简介：强大，但是社畜，无需睡眠，7x24小时在岗的优秀员工，但是摸鱼\n体型：天体\n属性：小死神\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后事件(定时触发)\n*特莉波卡的年度事件\n-血红之夜(消耗帝国境内的3个人口为帝国增加强大的战力buff)\n-夜星之祈(随机抽取神谕以获得不同的帝国buff或debuff)\n-绽心之祀(与夜星之祈类似，只是通过自家的死亡仪式抽取)\n*舰队战事件(随机触发)
  gts_setting.104.2a: "38. Tezcatlipoca\nIntroduction: Powerful, but a corporate slave, no sleep needed, excellent employee on duty 7x24 hours, but slacking off\nBody Size: Celestial\nAttributes: Little Death God\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Events (Timed Trigger)\n*Tezcatlipoca's Annual Events\n-Red Night (Consume 3 Pops in the empire to add powerful combat power buff to the empire)\n-Prayer of the Night Star (Randomly draw oracles to obtain different empire buffs or debuffs)\n-Sacrifice of Blooming Heart (Similar to Prayer of the Night Star, but drawn through own death ritual)\n*Fleet Battle Event (Randomly Triggered)"
  # 1-3 板鸭
  gts_setting.104.3: "1-3 Bronya"
  # 39.板鸭\n简介：全名布洛妮娅·扎伊切克，圣芙蕾雅学园学生(模组中不涉及)，后成为理之律者，腿部因X-10实验致残，成为理之律者后恢复，使用重装小兔19C战斗，与希儿有深厚姐妹(恋人)羁绊(绀海组)\n体型：天体级\n属性：冷静、理性、三无、成熟、内向、外冷内热、带点坏坏的那种感觉(?\n特殊机制：无  \n建筑内阁特化加成，可更换职位，好感度达到后白送舰船及星球\n\n该角色包含的事件：本身招聘的星界裂隙事件\n招聘一定时间后小兔从事内容选项(根据不同选择提供不同加成)\n招聘一定时间后游戏开发事件(根据满足条件数量(1是否赞助2陆军事件是否触发3海军事件是否触发4小兔事件选项)决定结果)\n陆军，海军事件
  gts_setting.104.3a: "39. Bronya\nIntroduction: Full name Bronya Zaychik, St. Freya Academy student (not involved in the mod), later became the Herrscher of Reason, legs disabled due to X-10 experiment, recovered after becoming Herrscher of Reason, uses Project Bunny 19C to fight, has deep sister (lover) bond with Seele (Seele x Bronya pair)\nBody Size: Celestial Level\nAttributes: Calm, Rational, Emotionless, Mature, Introverted, Cold outside and hot inside, A bit bad feeling (?\nSpecial Mechanism: None  \nBuilding Cabinet Specialization Bonus, position can be changed, give free ships and planets after reaching affinity\n\nEvents included: Astral Rift Event recruited by itself\nProject Bunny engagement content options after recruiting for a certain time (Provide different bonuses according to different choices)\nGame Development Event after recruiting for a certain time (Decide result based on number of conditions met (1 whether sponsored 2 whether army event triggered 3 whether navy event triggered 4 Project Bunny event option))\nArmy, Navy Events"
  # 1-4 希儿
  gts_setting.104.4: "1-4 Kiana"
  # 40.希儿\n简介：全名希儿·芙乐艾(白希)，可可利亚孤儿院长大(模组中不涉及)，温柔胆小、爱哭的 maiden，拥有强大圣痕，与布洛妮娅有深厚姐妹(恋人)羁绊(绀海组)\n 体型：天体级\n属性：温柔、善良、单纯、细腻、软弱却倔强，善于共情、胆小(后期去掉)\n特殊机制：无  \n人口内阁特化加成，可更换职位，好感度达到后白送舰船及星球\n\n该角色包含的事件：本身招聘的局势事件\n招聘过程的中随机事件(随局势进程触发)\n招聘一年后送书的事件(与她们详细的互动在这个遗珍中操作)\n陆军，海军事件
  gts_setting.104.4a: "40. Seele\nIntroduction: Full name Seele Vollerei (White Seele), grew up in Cocolia Orphanage (not involved in the mod), gentle, timid, crybaby girl, possesses powerful stigmata, has deep sister (lover) bond with Bronya (Seele x Bronya pair)\n Body Size: Celestial Level\nAttributes: Gentle, Kind, Simple, Delicate, Weak but stubborn, Good at empathy, Timid (Removed later)\nSpecial Mechanism: None  \nPop Cabinet Specialization Bonus, position can be changed, give free ships and planets after reaching affinity\n\nEvents included: Situation Event recruited by itself\nRandom events during recruitment process (Triggered with Situation progress)\nBook Giving Event one year after recruitment (Detailed interaction with them operates in this relic)\nArmy, Navy Events"
  # 2-1 黑希
  gts_setting.104.5: "2-1 Tiantiao"
  # 41.黑希\n简介：希儿·芙乐艾的里人格(黑希儿)，强势侵略、保护欲强，源自圣痕分裂，守护白希儿\n体型：天体级\n属性：强势、傲娇、侵略性、保护欲强、冷酷残忍，占有欲重\n特殊机制：无\n军事舰船特化加成，可更换职位，好感度达到后白送舰船及星球\n\n该角色包含的事件：招聘白希时附赠\n陆军，海军事件
  gts_setting.104.5a: "41. Dark Seele\nIntroduction: Seele Vollerei's inner personality (Dark Seele), aggressive, strong protective desire, derived from stigmata split, protects White Seele\nBody Size: Celestial Level\nAttributes: Strong, Tsundere, Aggressive, Strong Protective Desire, Cold and Cruel, Heavy Possessiveness\nSpecial Mechanism: None\nMilitary Ship Specialization Bonus, position can be changed, give free ships and planets after reaching affinity\n\nEvents included: Given when recruiting White Seele\nArmy, Navy Events"
  # 2-2 流萤
  gts_setting.104.6: "2-2 Firefly"
  # 42.流萤\n简介：来自格拉默帝国最后的守护者，拥有超乎寻常的力量\n体型：泰坦\n属性：温柔系、 maiden\n特色：能通过交流以较低消耗获得强大的陆军与海军\n\n该角色包含的事件：\n*招聘事件链\n*与流萤通讯
  gts_setting.104.6a: "42. Firefly\nIntroduction: The last guardian from the Glamoth Empire, possessing extraordinary power\nBody Size: Titan\nAttributes: Gentle Type, Girl\nFeature: Can obtain powerful army and navy with lower consumption through communication\n\nEvents included:\n*Recruitment Event Chain\n*Communication with Firefly"
  # 2-3 蕾恩娜
  gts_setting.104.7: "2-3 Xinuo"
  # 43.蕾恩娜\n简介：沉眠于黑洞彼端的神秘巨娘，全称\"伟大的蕾恩娜\"。她对文明的兴趣可能带来馈赠，也可能酿成灾难。\n体型：可变化，真身远超天体尺度。\n属性：神秘来客、体型差互动、福祸并存。\n接触方式：在情报界面开启专属黑洞星系，探索相关异常与考古遗址，推进初次相遇。\n特殊机制：随时再次来访；帝国体型与对话选择影响事件分支；可解锁蕾恩娜银行，进行存取款、货币兑换和资源贷款。\n\n该角色包含的事件：\n*黑洞探索与考古事件链\n*初次相遇的多分支互动\n*兴趣值触发的随机来访与日常事件\n*银行开户、交易与贷款事件
  gts_setting.104.7a: "43. Xino\nIntroduction: Product of genetic engineering, now fighting for your empire\nBody Size: Celestial\nAttributes: Imperial Knight, Vore, Crushing, Black-bellied, Serious, Airhead, Greed\nSpecial Mechanism: Devouring planet pops reduces upkeep\nOperation and Combat\n\nEvents included:\n*Recruitment Event Chain\n*Planet Devouring"
  # 2-4 珂莱塔
  gts_setting.104.8: "2-4 Carlotta"
  # 44.珂莱塔\n简介：莫塔里家族的二小姐，常为家族处理这不可明说的麻烦\n体型：天体\n属性：千金小姐，残忍系/冷漠无情\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(招聘后5年触发)
  gts_setting.104.8a: "44. Colette\nIntroduction: The second miss of the Mortari family, often handling unspeakable troubles for the family\nBody Size: Celestial\nAttributes: Rich Miss, Cruel Type/Indifferent and Ruthless\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Daily Events (Triggered 5 years after recruitment)"
  # 3-1 法拉尔达
  gts_setting.104.9: "3-1 Faralda"
  # 45.法拉尔达\n简介：穿着穗群原学园小学部的制服，赤发红瞳，充满活力就像火焰一样，看上去只是个普通的女孩子，据说来自某个小贵族家庭，好像并没有什么特别的地方\n体型：天体\n属性：萝莉\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链(人皇起源专属)
  gts_setting.104.9a: "45. Faralda\nIntroduction: Wearing the uniform of the elementary school department of Homurahara Academy, red hair and red eyes, full of vitality like fire, looks like just an ordinary girl, said to come from a small noble family, seems to have nothing special\nBody Size: Celestial\nAttributes: Loli\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain (Human Emperor Origin Exclusive)"
  # 3-2 伊莉雅斯菲尔
  gts_setting.104.10: "3-2 Illyasviel"
  # 46.伊莉雅斯菲尔\n简介：就读于穗群原学园小学部的普通女孩子，银发赤眼，名字很有贵族的风格，常不在家的双亲从事神秘的工作\n体型：天体\n属性：萝莉\n特殊机制：无\n\n该角色包含的事件：\n*招聘事件链(人皇起源专属)
  gts_setting.104.10a: "46. Illyasviel\nIntroduction: An ordinary girl studying in the elementary school department of Homurahara Academy, silver hair and red eyes, name has a very noble style, parents who are often away from home engage in mysterious work\nBody Size: Celestial\nAttributes: Loli\nSpecial Mechanism: None\n\nEvents included:\n*Recruitment Event Chain (Human Emperor Origin Exclusive)"
  # 3-3 鹅
  gts_setting.104.11: "3-3 Goose"
  # 47.鹅\n简介：如你所见，这是一只鹅\n体型：正常\n属性：动物\n特殊机制：可以兑换Bruh舰娘以及解锁提速选项\n\n该角色包含的事件：\n*招聘事件链\n*招聘后日常事件(定时触发)
  gts_setting.104.11a: "47. Goose\nIntroduction: As you can see, this is a goose\nBody Size: Normal\nAttributes: Animal\nSpecial Mechanism: Can exchange for Bruh Shipgirl and unlock speed boost options\n\nEvents included:\n*Recruitment Event Chain\n*Post-Recruitment Daily Events (Timed Trigger)"
  # 3-4 林凤
  gts_setting.104.12: "3-4 Linfeng"
  # 48.林凤\n简介：自称是来自异世界的旅者，她想在我们的宇宙里进行一次\"短暂\"的旅行\n体型：天体级\n属性：狐娘、血腥残忍系\n特色：福祸相依的事件、暂时没什么用的好感度\n\n该角色包含的事件：\n招聘事件(点击就送，但有一点代价)\n索要资源/人口事件(随机触发)\n联动事件1(当同时拥有林凤和艾普露时触发)\n联动事件2(当同时拥有林凤和千海时触发)
  gts_setting.104.12a: "48. Linfeng\nIntroduction: Claims to be a traveler from another world, wanting to take a \"short\" trip in our universe\nBody Size: Celestial Level\nAttributes: Fox Girl, Bloody Cruel Type\nFeature: Events of mixed blessing, currently rather useless Favorability\n\nEvents included:\nRecruitment Event (Get it by clicking, but there is a price)\nDemand Resource/Pop Event (Random Trigger)\nLinkage Event 1 (Triggered when owning both Linfeng and Aplog)\nLinkage Event 2 (Triggered when owning both Linfeng and Qianhai)"
  # 领袖图鉴-第五页
  gts_setting.105.name: "Leader Gallery - Page 5"
  # 你想要了解哪位领袖的事情呢？
  gts_setting.105.desc: "Which leader would you like to know about?"
  # 1-1 苏小白
  gts_setting.105.1: ""1-1 Su Xiaobai""
  # 49.苏小白\n简介：一位穿越无数宇宙自称为狐神的九尾狐，拥有的智慧和神秘力量确实证明了其强大的实力，据说我们的宇宙太小甚至根本无法让其恢复原本大小\n体型:天体级\n属性:一只银白色的九尾狐娘  纯粹的混沌系\n特色:喜爱UB，认真，很会涩涩\n\n包含的事件\n招聘事件:在拥有5颗殖民星球时点击会刷新在随机一颗人口大于400的殖民地星球（此星球会变爱液星）\n战斗胜利（海战/陆战）事件:胜利后概率触发\n小彩蛋:（当同时拥有林凤和苏小白时触发）
  gts_setting.105.1a: ""49. Su Xiaobai\nProfile: A nine-tailed fox who has traveled through countless universes and calls herself the Fox Goddess. Her wisdom and mysterious powers truly attest to her immense strength. It is said that our universe is so small it cannot even allow her to return to her original size.\nSize: Celestial-level\nAttributes: A silvery-white nine-tailed fox girl - pure Chaos-element\nTraits: Loves UB, serious, and very good at being naughty\n\\ nIncluded Events\nRecruitment Event: When you have 5 colony planets, clicking this will refresh the event to a random colony planet with a population greater than 400 (this planet will become a \"Love fluid planet\")\nBattle Victory (Naval/Land) Event: Triggered with a certain probability after victory\nMini Easter Egg: (Triggered when you own both Linfeng and Su Xiaobai)""
  # 1-2 双月希瞳
  gts_setting.105.2: ""1-2 Double-Moon Hitomi""
  # 50.双月希瞳\n简介：前文明的高科技造物，想和你一起创造我的未来\n体型：高大\n属性：女仆，舰娘，轻微气味，区别对待，\n特殊机制：可以领导舰队的强力领袖以及可以变身为舰娘的超级战力\n\n该角色包含的事件：招聘考古事件链（原文较长游戏内为精简版）  舰娘形态的战斗相关事件  女仆形态的日常相关事件  和别的领袖的贴贴（吃瘪）
  gts_setting.105.2a: ""50. Double-Moon Hitomi\nProfile: A high-tech creation from a past civilization, eager to build my future with you\nBuild: Tall\nAttributes: Maid, Ship Girl, Slight Odor, Preferential Treatment,\nSpecial Mechanics: A powerful leader capable of commanding a fleet and a super combatant who can transform into a Ship Girl\n\\ nEvents included for this character: Archaeology Recruitment Event Chain (the original text is lengthy; the in-game version is condensed)  Battle-related events in Kanmusu form  Daily life-related events in maid form  Interactions with other leaders (getting the short end of the stick)""
  # 1-3 橘子长
  gts_setting.105.3: ""1-3 Ora""
  # 51.橘子长\n简介：群星中学二年生，孤星监狱与谜之城的持有者，梦界摆渡人，Xeon信息部干员，\"空间\"的神明......\n这些故事，被橘子长一点点记录在册，她循着过去与未来的脚步，去找寻\"自我\"，追逐\"明天\"。\n体型：天体级？\n属性：人类，会根据经历获得对应的力量\n特色：喜好vore，对吃没有抵抗力。对裸足接触感到反感（但是会把星球塞进鞋子里）拥有4cm（自身单位）的厚底帆布鞋。\n\n对于眼前的 maiden来说，你的出现或许能在她的笔下留下几个字符。只不过......在这样捉摸不透的 maiden面前，每一个字眼似乎都有可能引起她对文明的存护......亦或是覆灭。\n她在等你，在等你做出你想要做出的回应......你们的时间有很多，她也愿意在此停留一刻 -  - 在她的旅程中留下一个双方都会感到愉悦的\"记忆\"。
  gts_setting.105.3a: ""51. Ora\nProfile: A second-year student at Stars Middle School; holder of Lone Star Prison and the City of Mystery; a ferryman of the Dream Realm; an agent of the Xeon Intelligence Division; a deity of \"Space\"......\\ nThese stories have been meticulously recorded by Ora. Following the footsteps of the past and the future, she searches for her \"true self\" and pursues \"tomorrow.\" \nBuild: Celestial-class?\nAttributes: Human; gains powers corresponding to her experiences\nTraits: Loves vore; has no resistance to eating. Dislikes bare-foot contact (but will stuff planets into her shoes); wears canvas sneakers with 4 cm (her own unit of measurement) thick soles. \n\nFor the young girl before you, your appearance might inspire her to jot down a few characters. However... in the presence of such an elusive girl, every single word seems capable of triggering either her preservation of civilization... or its destruction.\nShe's waiting for you, waiting for you to give the response you wish to give... You have plenty of time, and she is willing to linger here for a moment - to leave a \"memory\" on her journey that will bring joy to both of you.""
  # 1-4 鸟音山水
  gts_setting.105.4: ""1-4 Qinwen""
  # 鸟音山水\n一名\"普通\"的收藏家，在封闭已久的寒岭经营着一家古董店一杯清茶，一座古钟，一挺笔杆，一座山庄，一名 maiden，为这茫茫星海书写出独属于\"鸟音山水\"的一笔\n体型：天体级\n属性：人类，考古特化，产生文物及稀有资源，星球改造\n特色：以手指玩弄居多，喜欢喝酒，酒后可能会对小人做些不符合人设的玩弄，多仿古文对话，大量联动事件
  gts_setting.105.4a: ""Qinwen\nAn \"ordinary\" collector runs an antique shop in Hanling, a place that has long been cut off from the outside world. A cup of clear tea, an ancient bell, a writing brush, a mountain villa, and a young girl - together, they paint a stroke unique to \"Qinwen\" in this vast sea of stars\\ n Size: Celestial-class\n Attributes: Human, Archaeology Specialization, Generates artifacts and rare resources, Planetary terraforming\n Traits: Tends to play with things using her fingers; enjoys drinking; after drinking, she may engage in behavior toward Tiny persons that doesn't fit her character; frequently uses archaic literary dialogue; features numerous crossover events""
