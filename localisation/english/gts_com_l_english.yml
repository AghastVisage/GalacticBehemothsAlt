  # 反抗巨娘
  casus_belli_cb_tiny_end_threat: "Revolt Against the Giantesses"
  # 消灭敌意巨娘
  war_goal_wg_tiny_end_threat: "Eliminate Hostile Giantesses"
  # 战争的目的是清除来自邪恶巨娘的威胁
  war_goal_wg_tiny_end_threat_desc: "The goal of the war is to eliminate the threat from evil giantesses"
  # 末日审判
  gts_utility.106.name: "Doomsday Judgment"
  # 在我们对巨娘星球发射毁灭性武器之际，巨娘被来自亚空间的神秘力量带走，取而代之留下一个普通星球承受巨像的炮火。\n\n§M\"真是畜生啊......我要把你们从这个宇宙中抹去\"§!\n\n
  gts_utility.106.desc: "As we fired destructive weapons at the Giantess planet, the Giantess was taken away by a mysterious force from subspace, and replaced by a normal planet to bear the brunt of the colossus's firepower.\n\n§M \"What a beast... I'm going to erase you from this universe\" §!\n\n"
  # 完了！
  gts_utility.106.a: "It's over!"
  # 干涉
  gts_utility.107.name: "Intervention"
  # 在对巨娘星球使用巨像武器之际，巨娘被来自亚空间的神秘力量带走，取而代之留下一个普通星球承受巨像的炮火。\n\n目前的情报十分混乱，唯一肯定的是发射巨像的帝国已经不复存在了......
  gts_utility.107.desc: "When using colossus weapons against the Giantess planet, the Giantess was taken away by a mysterious force from subspace, and replaced by a normal planet to bear the brunt of the colossus's firepower.\n\nThe current information is very chaotic. The only thing for certain is that the empire that launched the colossus has ceased to exist...."
  # 可怕！
  gts_utility.107.a: "Terrifying!"
  # 巨娘领袖归来
  gts_utility.304.name: "Giantess Leader Returns"
  # 我们[Root.GetName]的一名巨娘领袖最近因为某种原因离开了我们，但不知何时她已经回到了她的岗位上，不愧是巨娘！
  gts_utility.304.desc: "One of our [Root.GetName] giantess leaders left us recently for some reason, but at some point she returned to her post. Truly a giantess!"
  # 太好了
  gts_utility.304.option: "Excellent"
  # 巨娘统治者归来
  gts_utility.305.name: "Giantess Ruler Returns"
  # 我们[Root.GetName]的统治者最近受到了一次严重的打击，但巨娘的强大体魄让她很快挺了过来，回到了她忠实的指挥中心！
  gts_utility.305.desc: "Our [Root.GetName] ruler recently suffered a severe blow, but her powerful giantess physique allowed her to recover quickly. She has returned to her loyal command center!"
  # 太好了
  gts_utility.305.option: "Excellent"
