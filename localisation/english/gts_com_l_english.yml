  # 这个物种能够适应跳蛋表面山峰般硅胶突起间的阴暗生活，并利用巨娘的分泌物发展壮大自身。
  trait_pc_gts_oscillator_preference_desc: "This species is able to adapt to the shadowy life between the mountain-like silicone protrusions on the surface of the vibrator, and develop and thrive by utilizing the giantess' secretions."
  # 众星环抱之屣
  NAME_gts_cyrene_shoes_system: "Star-Embraced Shoes"
  # §B水晶高跟鞋§!
  NAME_gts_cyrene_shoes: "§BCrystal High Heels§!"
  # §B水晶高跟鞋§!
  pc_gts_cyrene_shoes_1: "§BCrystal High Heels§!"
  # 一双闪耀晶莹的高跟鞋，做工精湛质地未知。恒星光芒透过其上被折射出粉与蓝色的光辉，其庞大的质量与该系恒星形成类似双星的系统。虽然其主人已不知去向，但足趾区域内气候依旧适宜，巨娘脚掌脚趾造成的轻微凹陷足以承载等同多颗殖民星的人口规模。
  pc_gts_cyrene_shoes_1_desc: "A pair of sparkling and crystal-clear high heels, with exquisite craftsmanship and unknown texture. Starlight refracts pink and blue brilliance through them. Their massive mass forms a binary-like system with the star. Although their owner is missing, the climate in the toe area remains suitable. The slight depression caused by the Giantess's sole and toes is enough to support a population equivalent to multiple colony stars."
  # 鞋子
  pc_gts_cyrene_shoes_1_adj: "Shoes"
  # §B水晶高跟鞋§!内宜居度
  mod_pc_gts_cyrene_shoes_1_habitability: "Habitability in §BCrystal High Heels§!"
  # §B水晶高跟鞋§!内偏好
  trait_pc_gts_cyrene_shoes_1_preference: "Preference in §BCrystal High Heels§!"
  # 鞋内因长时间踩踏产生的足印十分明显，这位巨娘残留的体温与香甜汗液使我们得以在脚掌平原或五个趾痕盆地中更高效的完成城市建设。特殊的晶体状鞋面使鞋中更易受到阳光的照射将温度
  trait_pc_gts_cyrene_shoes_1_preference_desc: ""The footprints left inside the shoes from prolonged walking are very distinct; the residual body heat and sweet-smelling sweat left by the Giantess allow us to carry out urban construction more efficiently across the \"plain of the soles\" or the \"basins of the five toes.\" The unique crystalline upper of the shoes makes the interior more susceptible to sunlight, causing the temperature to""
  # §B水晶高跟鞋§!
  pc_gts_cyrene_shoes_2: "§BCrystal High Heels§!"
  # 一双闪耀晶莹的高跟鞋，做工精湛质地未知。恒星光芒透过其上被折射出粉与蓝色的光辉，其庞大的质量与该系恒星形成类似双星的系统。虽然其主人已不知去向，但足趾区域内气候依旧适宜，巨娘脚掌脚趾造成的轻微凹陷足以承载等同多颗殖民星的人口规模。
  pc_gts_cyrene_shoes_2_desc: "A pair of sparkling and crystal-clear high heels, with exquisite craftsmanship and unknown texture. Starlight refracts pink and blue brilliance through them. Their massive mass forms a binary-like system with the star. Although their owner is missing, the climate in the toe area remains suitable. The slight depression caused by the Giantess's sole and toes is enough to support a population equivalent to multiple colony stars."
  # 鞋子
  pc_gts_cyrene_shoes_2_adj: "Shoes"
  # §B水晶高跟鞋§!内宜居度
  mod_pc_gts_cyrene_shoes_2_habitability: "Habitability in §BCrystal High Heels§!"
  # §B水晶高跟鞋§!内偏好
  trait_pc_gts_cyrene_shoes_2_preference: "Preference in §BCrystal High Heels§!"
  # 鞋内因长时间踩踏产生的足印十分明显，这位巨娘残留的体温与香甜汗液使我们得以在脚掌平原或五个趾痕盆地中更高效的完成城市建设。特殊的晶体状鞋面使鞋中更易受到阳光的照射将温度
  trait_pc_gts_cyrene_shoes_2_preference_desc: "The footprints left by the long-term trampling inside the shoes are very obvious. The Giantess's residual body warmth and sweet sweat allow us to complete urban construction more efficiently in the sole plains or five toe-print basins. The special crystal-like shoe upper makes the inside of the shoe more susceptible to sunlight increasing the temperature"
