  # 新版本更新了什么？
  gts_setting.5.name: "What's new in the latest version?"
  # 2.4.0更新：\n新功能：\n -  - 增加了一个新的起源-灭世扈奴\n -  - 新增一项新飞升-先端科学研究所\n -  - 增加了数项新科技\n\n功能与平衡调整：\n -  - 现在轨道轰炸占领也能触发巨娘专属陆军登陆事件\n\nBUG修复：\n -  - 修复了部分特质不生效的问题\n -  - 修复了颂汐技能无法升级的问题\n -  - 修复了联系颂汐事件后哨站无法重新建立，以及会摧毁巨娘星球的问题
  gts_update.2.4.0: "2.4.0 Update:\nNew Features:\n--Added a new origin - World-Ender Thrall\n--Added a new ascension - Advanced Scientific Research Institute\n--Added several new technologies\n\nFunctionality and Balance Adjustments:\n--Orbital bombardment occupation can now also trigger giantess-exclusive army landing events\n\nBug Fixes:\n--Fixed the issue that some traits were not working\n--Fixed the issue that Songxi's skills could not be upgraded\n--Fixed the issue that after contacting Songxi, the outpost could not be re-established and the Giantess planet would be destroyed"
  # 2.5.0更新：\n新功能：\n -  - 以下两个国策可以正常游玩\n -  -  -  - 小人清除者\n -  -  -  - 小人保护者\n -  - 新增XP引导事件（感谢文案提供：电子）\n -  - 新增了一项星球决议，且现在星球决议在事件结束后依然可以保留\n -  - 新增了一个扶她事件，由轨道轰炸四分之一概率触发\n -  - 新增了巨娘传奇领袖的复活事件\n文案调整：\n -  - 鲸口脱险特质新增描述\n -  - 腐化之心特质使领袖获得灵能现在有消息提示了\n -  - 修改了虚境契约部分文本字体颜色\n游戏性调整：\n -  - 修改了舰娘飞升和舰娘科技的获取方式\n -  - 欧若拉星球营养物质地貌由增加区划上限改为增加矿物产出\n -  - 将部分事件的触发条件修正\n -  - 部分国策和起源需要相应的体型特质，这些特质会在游戏开始后删除\n -  - 修改了部分特质的体型限制\n -  - 艾雅法拉星系现在会刷新在玩家附近\n -  - 降低了斯卡蒂和伊莎玛拉事件的频率
  gts_update.2.5.0: "2.5.0 Update:\nNew Features:\n--The following two civics can now be played normally\n----Small Person Purger\n----Small Person Protector\n--Added XP guidance event (Thanks to the text provider: Electronics)\n--Added a planetary decision, and now the planetary decision can still be retained after the event ends\n--Added a futa event, triggered by orbital bombardment with a 1/4 probability\n--Added resurrection events for Legendary Giantess Leaders\nText Adjustments:\n--Added a description to the 'Escaped from Orca' trait\n--The 'Heart of Corruption' trait now has a message notification when the leader gains psionics\n--Modified the text font color of parts of the Shroud Pact\nGameplay Adjustments:\n--Modified the way to obtain Shipgirl Ascension and Shipgirl technologies\n--Aurora Planet's nutrient terrain now increases mineral production instead of increasing district limit\n--Corrected the trigger conditions for some events\n--Some civics and origins require corresponding body type traits, these traits will be deleted after the game starts\n--Modified the body type restrictions for some traits\n--The Eyjafjalla system will now spawn near the player\n--Reduced the frequency of Skadi and Ishamara events"
  # 2.5.1更新：\n新内容：\n -  - 新增三种特殊巨娘国策对应的政体名/性格，女仆之国也适配了一个政体名\n -  - 丰富了巨娘第一次接触时，绑架飞船的事件\n\nBUG修复：\n -  - 修复了部分舰船部件能在普通舰船上安装的问题\n -  - 修复了巨娘护理长部分产出不生效的问题\n -  - 修复了一些极端条件下不期而遇不生效的问题\n -  - 修复部分本地化缺失的问题\n -  - 修复了特殊国策的好感加成对非默认国家生效的问题
  gts_update.2.5.1: "2.5.1 Update:\nNew Content:\n--Added government names/personalities corresponding to three special Giantess civics, and also adapted a government name for Maid Country\n--Enriched the event of kidnapping ships during the first contact with Giantesses\n\nBug Fixes:\n--Fixed the issue that some ship components could be installed on regular ships\n--Fixed the issue that part of the Giantess Nursing Manager's output was not working\n--Fixed some issues with 'Unexpected Encounter' not working under extreme conditions\n--Fixed some missing localization issues\n--Fixed the issue that the special civic's favor bonus was applied to non-default countries"
  # 2.6.0更新：\n\n新内容：\n -  - 一个新的开局遗珍，用于获取GTS领袖以及与她们互动\n -  - 现在开局有一半概率在旁边生成有一系列事件链的精灵帝国\n -  - 新增数项国民理念（虽然部分小人或巨娘限定国民理念描述进游戏后不可删改，但实际在游戏中途是可以删改的）\n -  - 重做第一次接触星球绑架事件，现在有三组随机事件链可以触发，包括了双向事件和文案差分\n -  - 新增少量外交文案\n -  - 新增一个异常现象（感谢文案：舵机）\n -  - 新增一个特殊事件，拥有50人口以上殖民地及天体级领袖触发（感谢文案：Duce）\n -  - 新增一个事件（由巨娘国家或三角贸易国策小人国家掠夺人口低概率触发）\n\n游戏性调整：\n -  - 绝大多数GTS领袖不会随机生成了\n -  - 小人同化者和小人保护者现在共享战争借口\n -  - 修改了部分宣战理由的判定，不再由目前主体人口类型来判定，而是由国家初始人口类型来判定\n -  - 由于蠢驴问题，ai同化会出现将自己主体民族同化掉的bug，暂时将小人同化者的随机权重调0\n -  - 调整巨娘第一次接触方式，现在只看到对方的船，也可以登陆星球绑架了
  gts_update.2.6.0: "2.6.0 Update:\n\nNew Content:\n--A new starting relic for acquiring GTS leaders and interacting with them\n--Now there is a 50% chance of an Elf Empire with a series of event chains spawning nearby at the start\n--Added several civics (although some civics limited to small or giantess may not be modifiable in-game, but they can actually be modified during the game)\n--Reworked the first contact planet kidnapping event, now there are three sets of random event chains that can be triggered, including two-way events and text differentiation\n--Added a small amount of diplomacy text\n--Added an anomaly (Thanks to text writer: Rudder)\n--Added a special event that triggers with a colony of more than 50 pop and a Celestial-level leader (Thanks to text writer: Duce)\n--Added an event (triggered with low probability by a Giantess country or a small country with the Triangular Trade civic when they plunder pops)\n\nGameplay Adjustments:\n--Most GTS leaders no longer spawn randomly\n--Small Person Assimilators and Small Person Protectors now share war justifications\n--Modified the judgment of some war reasons, it is no longer judged by the current main population type, but by the country's initial population type\n--Due to the stupidity of the developers, AI assimilation will have a bug that assimilates their own main ethnicity, temporarily set the random weight of Small Person Assimilators to 0\n--Adjusted the Giantess first contact method, now you only see the other party's ship, and you can also land on the planet to kidnap"
  # 2.6.1更新：\nBUG修复：\n -  - 修复了小人开局和巨娘开局不适配机械特质的问题\n -  - 修复了小人开局和巨娘开局能同时存在的问题\n -  - 修复了巨娘领袖没有解锁就触发相关事件的问题\n -  - 修复了小人文明对小人清除者宣战借口错误的问题\n -  - 修复了斯卡蒂数值不显示的问题\n -  - 修复了招聘事件出现多个领袖的问题\n -  - 修复了黎凪在情报交流区UI显示错误的问题\n说明：\n -  - 更新后的巨娘领袖只有在情报交流区使用影响力解锁情报后才会触发有关事件来进行招聘\n -  - 精灵帝国的相关事件需要信任度大于1才能触发
  gts_update.2.6.1: "2.6.1 Update:\nBug Fixes:\n--Fixed the issue that Small Person Start and Giantess Start were not compatible with mechanical traits\n--Fixed the issue that Small Person Start and Giantess Start can exist at the same time\n--Fixed the issue that Giantess leader-related events were triggered before the leader was unlocked\n--Fixed the issue of the Small Person civilization's war justification for Small Person Purger being incorrect\n--Fixed the issue that Skadi's value was not displayed\n--Fixed the issue that multiple leaders appeared in the recruitment event\n--Fixed the UI display error of Li Na in the Intelligence Exchange Area\nExplanation:\n--The updated Giantess leaders will only trigger recruitment-related events after using influence to unlock information in the Intelligence Exchange Area\n--The related events of the Elf Empire need a trust level greater than 1 to trigger"
  # 2.6.2更新：\n\n新内容：\n -  - 新增两名新领袖和合欢派事件链（由巨娘国家境内有文艺复兴以上科技土著触发）\n -  - 添加了一个新的情报页面动图（需要开启极限区事件）\n\n游戏性调整：\n -  - 调高了伊莱莎事件的刷新概率\n\nBUG修复：\n -  - 修复了无声铃鹿和欧若拉异常异常的问题\n -  - 修复了部分领袖获得后无法进行交流的bug\n -  - 修复了欧若拉星球不生成的问题\n -  - 修复了灭世天罚起源重复的问题\n -  - 修复了精灵事件吞并导致本国领导人变化的问题\n -  - 修复了瑕光被ai获取到的bug\n -  - 修复了刺雷导弹可被常规舰船使用的bug\n -  - 修复了雪风无法点击的bug\n -  - 修复了击败AI玩家会获得通讯面板的BUG
  gts_update.2.6.2: "2.6.2 Update:\n\nNew Content:\n--Added two new leaders and the Hehuan Sect event chain (triggered by Giantess countries with Renaissance or higher technology natives)\n--Added a new animated GIF for the intelligence page (requires enabling Extreme Zone events)\n\nGameplay Adjustments:\n--Increased the refresh rate of Eliza events\n\nBug Fixes:\n--Fixed the Aurora and Silence Suzuka anomaly issues\n--Fixed the bug that it was not possible to communicate with some leaders after they were acquired\n--Fixed the issue that the Aurora planet did not generate\n--Fixed the repeated World-Ending Scourge origin issue\n--Fixed the issue that the Elf event's annexation caused the country's leader to change\n--Fixed the bug that Xia Guang was acquired by the AI\n--Fixed the bug that Thunder Missile could be used by regular ships\n--Fixed the bug that Snow Wind was unclickable\n--Fixed the BUG that defeated AI players would gain communication pane"
  # 2.6.3更新：\n\n新内容：\n -  - 可以在情报界面与两位新领袖交流了\n -  - 加入了3个新宠物\n\nBUG修复：\n -  - 修复了环世界道具的文本错误以及增加影响力的BUG\n -  - 修复了合欢派相关的BUG\n -  - 修复了斯卡蒂0次也可以出好结局的BUG\n -  - 修复小人清除者和女仆之国的冲突
  gts_update.2.6.3: "2.6.3 Update:\n\nNew Content:\n--Can now communicate with the two new leaders in the Intelligence Interface\n--Added 3 new pets\n\nBug Fixes:\n--Fixed the text error of the ringworld item and the bug of increasing influence\n--Fixed the BUG related to the Hehuan Sect\n--Fixed the BUG that Skadi could also have a good ending even with 0 times\n--Fixed the conflict between Small Person Purger and Maid Country"
  # 2.6.4更新：\n\n\n -  - 按照作者要求删除了雪风领袖的相关内容\n\n新内容：\n -  - 增加了几个随机事件，并给部分gts建筑增加专属事件\n -  - 修改了第一次使用缩小激素巨像的文本（感谢文案：夏雪化合物）\n\n游戏性调整：\n -  - 提高了精灵帝国事件链接束后选择和平共处的好感度奖励\n -  - 合欢派事件链现在可以通过特殊项目同时拿到两个领袖了\n -  - 新增合欢派领袖的复活事件\n -  - 缩小激素巨像现在可以清空星球陆军了\n -  - 领袖身体殖民地花费-60%，领袖道具的花费-50%\n -  - 降低了巨娘领袖的维护花费\n -  - 降低了先科研事件失败的概率\n -  - 调整了部分科技权重\n -  - 调整了部分种族特质的效果
  gts_update.2.6.4: "2.6.4 Update:\n\n\n--Removed the content related to the Snow Wind leader as requested by the author\n\nNew Content:\n--Added some random events, and added exclusive events for some gts buildings\n--Modified the text of the first use of the Shrinking Hormone Colossus (Thanks to Text Writer: Xia Xue Compound)\n\nGameplay Adjustments:\n--Increased the favorability reward for choosing peaceful coexistence at the end of the Elf Empire event chain\n--The Hehuan Sect event chain can now get two leaders at the same time through a special project\n--Added a resurrection event for the Hehuan Sect leader\n--The Shrinking Hormone Colossus can now clear planetary armies\n--Leader body colonies cost -60%, and leader item costs -50%\n--Reduced the maintenance cost of Giantess leaders\n--Reduced the probability of failing the first research event\n--Adjusted the weight of some technologies\n--Adjusted the effects of some species traits"
  #  -  - 五种新的星球类型以及相关时间，通过飞升解锁\n -  - 新领袖：一位由伟大之作化身的天体级巨娘，温柔系\n -  - 新领袖：一位来自失落文明的天体级巨娘，拥有特殊的主线考古黑洞事件\n -  - 新领袖：一位因意外事故而失散多年的妹妹，本mod第一位小人领袖\n -  - 新领袖：一位大家都很熟悉的绿毛，vore系与scat系的限定领袖\n -  - 艾普露的剧情进行了大规模的重置，会根据不同体型遇到不同的内容（还有scat限定内容）\n -  - 残骸回收系列事件由巨娘领袖舰队胜利触发（写在随机事件文档里面\n -  - 靴居者起源增强并添加了新内容\n -  - 铃鹿后续事件的更新\n -  - 艾雅法拉后续事件的更新\n -  - GTS建筑将有新的建成事件\n -  - 领袖的身体殖民地完成后将有新的完成事件
  gts_update.2.7.0: "--Five new planet types and related events, unlocked through ascension\n--New Leader: A Celestial-level Giantess transformed from a Great Work, gentle type\n--New Leader: A Celestial-level Giantess from a lost civilization, with a special main archaeological black hole event\n--New Leader: A younger sister who was lost for many years due to an accident, the first small person leader in this mod\n--New Leader: A green-haired character that everyone is very familiar with, limited leader for vore and scat\n--Apro's storyline has been massively reset, and meeting different content depending on body type (also scat limited content)\n--The remnant recovery series of events is triggered by a Giantess leader's fleet victory (written in the random event document)\n--Boot-Dweller origin has been enhanced and new content has been added\n--Update of the Suzuka follow-up event\n--Update of the Eyjafjalla follow-up event\n--GTS buildings will have new construction completed events\n--The completion of the leader's body colony will have a completion event"
  # 2.7.1更新：\n\n新内容：\n -  - 整合了Foo的扩展mod，新加入了四位新的领袖\n -  - 1.在某颗前超光速文明的星球上，被另一位比现在的她还大得多的巨娘在各种方面推动成长起来的\"大\"巫女\n -  - 2.与上一位相关的角色，随剧情解锁\n -  - 3.一只比我们整个银河系都要大的大狐狸的眷属\n -  - 4.与上一位相关的角色，随剧情解锁
  gts_update.2.7.1: "2.7.1 Update:\n\nNew Content:\n--Integrated Foo's expansion mod, four new leaders have been added\n--1. On a planet of a former superluminal civilization, a 'big' witch who was pushed to grow in all aspects by another giantess who was much larger than her current self\n--2. A character related to the previous one, unlocked with the storyline\n--3. A subordinate of a big fox that is larger than our entire galaxy\n--4. A character related to the previous one, unlocked with the storyline"
  # 2.7.2更新：\n\n新内容：\n -  - 增加了足垢星球的改造后续\n -  - 增加了爱液星球的规划\n\n游戏性调整：\n -  - 取消了虎鲸诱捕器和缩小激素舰载机巨像武器的巨像舰船限制\n -  - 现在非格式塔也能使用自助餐厅起源了\n -  - 现在格式塔也可以修改内阁了（请注意格式塔内阁领袖到8级时会改头像,且在内阁时巨娘领袖无法获得特质）\n -  - 现在所有政体都可以选择净化国策了\n -  - 现在合成人、义体人也能使用mod的机械特质了\n -  - 对标原版强度，加强了部分特质的数值\n -  - 优化体内殖民系统，不会再超上限了\n\nBUG修复：\n -  - 修复了采纳传统不能正确开启局势的问题\n -  - 修复了开局主体种族权利为奴隶的问题\n -  - 修复了普通舰船能使用舰娘部件的问题\n -  - 修复了点出舰娘飞升会刷新出舰娘部件科技的问题\n -  - 修复了小人第一次接触事件没有正常触发的问题\n -  - 修复了虎鲸诱捕器未生效的问题
  gts_update.2.7.2: "2.7.2 Update:\n\nNew Content:\n--Added the transformation follow-ups for 'Foot Soil' planets\n--Added the planning of 'Love Elixir' planets\n\nGameplay Adjustments:\n--Removed the colossus ship restrictions of the Killer Whale Trap and Shrinking Hormone Carrier-borne Colossus weapons\n--Now non-gestalts can also use the Cafeteria origin\n--Now Gestalts can also modify the council (Please note that Gestalt council leaders will change their portrait at level 8, and giantess leaders cannot gain traits during the council)\n--Now all governments can choose the purification civic\n--Now synths and cyborgs can also use the mod's mechanical traits\n--Matching the original strength, strengthened the numerical values of some traits\n--Optimized the body colony system, it will no longer exceed the limit\n\nBug Fixes:\n--Fixed the issue that adopting a tradition cannot correctly start a situation\n--Fixed the issue that the main species rights at the start of the game was set to slavery\n--Fixed the issue that regular ships could use shipgirl components\n--Fixed the issue that pointing out shipgirl ascension would refresh shipgirl component techs\n--Fixed the issue that small people's first contact event did not trigger normally\n--Fixed the issue that the killer whale trap was not working"
  # 2.7.3更新：\n\n新内容：\n -  - 新起源：豢养神明\n -  -  -  - 在一场恐怖的灾难中，文明的守护者，昔日的伟大神明为了庇护她脚下的信徒们选择了自我牺牲\n -  -  -  - 但位格极高的她即便是死亡也无法将她彻底从这个宇宙中彻底放逐\n -  -  -  - 曾经万人敬仰的神明此刻正缱绻在一颗蛋中，等待着她的信徒再度将她唤醒\n -  -  -  - 豢养她，是当成女儿？还是征服寰宇的兵器？\n -  - 新领袖：一位豢养神明起源的专属龙娘领袖\n -  - 新领袖：一位拥有读心能力妖怪觉，地灵殿的主人，正在寻找更加巨大的妹妹的泰坦巨娘\n\n游戏性调整：\n -  - 取消了部分特质的合成人、义体人的限制\n -  - 重置了scat星球的名称与背景图片\n\nBUG修复：\n -  - 修复了普政机器文明无法正常生成领袖的问题\n -  - 修复了靴居者部分文本错误的问题\n -  - 修复了人口组装异常的问题\n -  - 修复了残骸回收系列随机事件不能触发的问题\n -  - 修复了部分异常类领袖无法正确添加异常的问题
  gts_update.2.7.3: "2.7.3 Update:\n\nNew Content:\n--New Origin: Taming Gods\n----In a terrible disaster, the protector of civilization, the former great god chose self-sacrifice in order to protect the believers at her feet\n----But even death cannot completely banish her from this universe\n----The god who was once worshiped by thousands is now curled up in an egg, waiting for her believers to awaken her again\n----Tame her, as a daughter? Or as a weapon to conquer the universe?\n--New Leader: A dragon girl leader exclusive to the Taming Gods origin\n--New Leader: A titan giantess with a mind-reading youkai awareness, the master of the Earth Spirit Palace, looking for a larger sister.\n\nGameplay Adjustments:\n--Removed the restrictions of synthetic and cyborgs for some traits\n--Reset the name and background picture of the scat planet\n\nBug Fixes:\n--Fixed the issue that a normal-powered machine civilization could not generate leaders normally\n--Fixed the issue of some text errors for the Boot-Dweller\n--Fixed the issue of abnormal pop construction\n--Fixed the issue that the random event series of remnant recovery could not be triggered\n--Fixed the issue of some anomalous leaders not being able to correctly add anomalies"
  # 2.7.4更新：\n新内容：\n -  - 新增了数个小人领袖的老兵特质和命定特质\n#  -  - 新增小人国策-巨兽猎手\n\n游戏性调整：\n -  - 调整了部分异常事件的难度等级\n -  - 降低了残骸回收事件的触发频率\n -  - 腔内银河特质现在同时也增加机器人口的特质点数\n -  - 召唤颂汐不再会摧毁星球\n -  - 伊莎玛拉鲨掉领袖事件不再以传奇领袖与杰出领袖为目标\n -  - 修改了舰娘飞升特殊项目的研究方式，以避免无法获得舰娘战列舰的问题\n\n关于情报交流区：\n -  - 修复了部分领袖特质文本错误的问题\n -  - 修复了某些领袖配件价格错误的问题\n -  - 修复了未获得花田领袖时能使用花田宠物的问题\n -  - 修复了小人侧巨娘领袖体内殖民地10次事件没有限制的问题\n -  - 现在领袖的数据刷新改为每年增长一次\n -  - 现在打开情报页面会自动进入最后退出的那一页\n\n关于豢养神明起源：\n -  - 新增一名领袖，在犽戎成年礼事件后5年左右随机触发相关事件，旧存档可通过event gts_god_keeper.1000手动触发\n -  - 新增一个征服附庸战争事件:轰炸敌方首都触发，每局只能触发一次\n -  - 新增两个羞辱战争事件：首次分别使用犽戎攻击唯心或非唯心国家触发，每局只能触发一次\n -  - 新增了一个国民理念：王权至上\n -  - 新增一个逼宫事件：在获得犽戎和新领袖且年份大于2260年时触发\n -  - 新增一个体表殖民事件：在逼宫事件结束后5年左右触发\n -  - 犽戎和新领袖现在能得到巨娘帝国强度的修正补强\n\nBUG修复：\n -  - 修复了颂汐项目刷新在土著星球上的问题\n -  - 修复了自适配特质未生效的问题\n -  - 修复了颂汐领袖特质无法升级的问题\n -  - 修复了契约劳工不能上专家岗位的问题\n -  - 修复了部分文案和贴图错误\n -  - 修复了寄生起源灵能和基因飞升后未开启局势的问题\n -  - 修复了舰队胜利触发未完成事件的bug
  gts_update.2.7.4: "2.7.4 Update:\nNew Content:\n--Added several veteran traits and destined traits for Small Person leaders\n# --Added Small Person civic - Beast Hunter\n\nGameplay Adjustments:\n--Adjusted the difficulty level of some anomaly events\n--Reduced the frequency of debris recovery events\n--Intra-cavity Galaxy trait now also increases the trait points of mechanical pops\n--Summoning Songxi will no longer destroy the planet\n--Ishamara's leader sharking event no longer targets legendary and distinguished leaders\n--Modified the research method for Shipgirl ascension's special project to avoid the problem of not being able to obtain shipgirl battleships\n\nAbout the Intelligence Exchange Area:\n--Fixed the text error of some leader traits\n--Fixed the price error of certain leader accessories\n--Fixed the issue that the Huatian pet could be used when the Huatian leader was not acquired\n--Fixed the issue that there was no limit to the 10 times internal colony event for Giantess leaders on the small person side\n--The leader data update is now changed to once a year\n--Now opening the intelligence page will automatically go to the last page exited\n\nAbout the Taming Gods Origin:\n--Added a new leader, randomly triggered about 5 years after Yaorong's coming-of-age event. Old archive can be triggered manually by event gts_god_keeper.1000\n--Added a conquest vassal war event: bombarding the enemy capital will trigger it, can be triggered only once per game\n--Added two humiliation war events: triggered by using Yaorong to attack a non-materialist/materialist country the first time respectively, can be triggered only once per game\n--Added a new civic: Primacy of the Throne\n--Added a coup event: triggered after gaining Yaorong and new leader, and the year greater than 2260\n--Added a body surface colony event: triggered about 5 years after the coup event\n--Yaorong and new leaders now gain a strength boost from the Giantess Empire strength modifiers\n\nBug Fixes:\n--Fixed the issue that the Songxi project was refreshed on primitive planets\n--Fixed the issue that self-adaptive traits did not work\n--Fixed the issue that the Songxi leader trait could not be upgraded\n--Fixed the issue that contract laborers cannot take expert jobs\n--Fixed some text and image errors\n--Fixed the issue that the situation is not started after the psionic and gene ascension of the parasite origin\n--Fixed the bug that fleet victory triggered unfinished events"
  # 新内容：\n -  - 四位新领袖：\n -  - 新起源：H星人\n -  - 新的天灾：女神信徒\n -  - 新的国民理念-进化触媒\n -  - 花田领袖选择烧花之后会有更多剧情\n -  - 终末地剧情完成后，与宇宙创生灾飞的联动剧情\n--新的人口派系：巫女狐娘贴贴（也有可能是其它的随机名称）\n -  - 巨娘和小人侧各添加一个新的传统，可以用于解锁相关科技的研究选项\n -  - 豢养神明起源追加了新事件\n -  - 新增两个天体级艾雅法拉事件\n -  - 新增了艾普露终末地事件\n -  - 新的抖M模式开关，可以触发更多羞辱性内容\n -  - 增加了更多的随机事件\n\n游戏性调整：\n -  - 重新平衡了部分法令的效果\n -  - 舰娘的建造成本会和她们的强度相匹配\n - -- - 提高了舰娘的建造维护成本\n - -- - 舰娘飞升需要建造大师飞升作为前置\n--Foo 和 神乐的招聘事件加入了事件链来帮助跟踪进度。起始事件改为建造完观测站后就会触发
  gts_update.2.8.0: "New Content:\n--Four new leaders:\n--New Origin: H-People\n--New Crisis: Goddess Followers\n--New civic - Evolutionary Catalyst\n--There will be more plot after Huatian leader chooses to burn flowers\n--After the end of the End of Cycle plot, the linkage plot with the Cosmic Creation disaster ascension\n--New pop faction: Miko Kitsune girls (or other random names)\n--Added a new tradition for both the Giantess and Small Person sides, which can be used to unlock the research options for related technologies\n--Added new events for the Taming Gods origin\n--Added two new Celestial-level Eyjafjalla events\n--Added the Apple End of Cycle event\n--New DouM mode switch, can trigger more humiliating content\n--Added more random events\n\nGameplay Adjustments:\n--Rebalanced the effect of some edicts\n--The construction cost of ship girls will be matched to their strength\n--Increased the construction and maintenance costs of ship girls\n--Shipgirl Ascension requires the Master Builder ascension as a prerequisite\n--Foo and Kagura's recruitment events have added event chains to help track progress. The starting event will now be triggered after the construction of the observatory"
  # # 新内容：\n -  - 情报交流区：\n -  -  -  - 星际行动功能已经可以使用（测试版）\n -  - 小灰事件扩展\n -  -  -  - 一只新的宠物以及一个考古事件(需要拥有小灰并占领L星系)\n -  -  -  - 占领星球事件(陆军小灰)舰队胜利事件(战舰小灰)星球事件(总督小灰)\n -  - 虫惑魔事件链(前置+后续任务)\n -  -  -  - 两位新的领袖\n -  -  -  - 其中一位有特殊的星球占领事件\n -  - 新飞升\n -  -  -  - 小人文明专属天灾飞升 -  - 除神之路，拥有全新的舰船、科技、建造巨构神力提纯器、完成独特的天灾项目来获得游戏胜利\n -  -  -  - 舰娘飞升可以解锁新的轰炸姿态\n -  - 豢养神明起源：\n -  -  -  - 新增犽戎的复活事件\n -  -  -  - 降低了体表殖民地的数值，防止数据溢出\n -  -  -  - 新增拥有除神之路飞升的特殊剧情\n -  -  -  - 犽戎所停驻的星球会获得特殊增益\n -  - 新事件\n -  -  -  - 考古-远古文明留下的痕迹\n -  -  -  - 花田与艾雅法拉的互动事件\n -  -  -  - 艾普露与体型更大领袖的互动事件\n -  - 传统：重置了原版的传统文案，并且对新传统做了适配\n -  - 原版事件GTS化：气态生命达斯纳克\n -  - 新的鞋子星球（测试版）
  gts_update.2.9.0: "# New content:\n--Intelligence Exchange Area:\n----Starbase Operation function is now usable (beta)\n--Little Grey Event Expansion\n----A new pet and an archaeological event (requires owning Little Grey and occupying the L-Cluster)\n----Occupy planet event (Army Little Grey), Fleet victory event (Warship Little Grey), planet event (Governor Little Grey)\n--Worm Enchantress event chain (prequel + follow-up missions)\n----Two new leaders\n----One of them has a special planet occupation event\n--New Ascensions\n----Small Person Civilization's exclusive disaster ascension - Path of God Removal, with all-new ships, technologies, and a unique megastructure 'Divine Power Purifier,' completed with a unique disaster project to achieve victory\n----Shipgirl Ascension can unlock new bombing stances\n--Taming Gods Origin:\n----Added Yaorong's resurrection event\n----Reduced the value of the body surface colony to prevent data overflow\n----Added a special story event for having the Path of God Removal ascension\n----The planet where Yaorong stops will receive special bonuses\n--New events\n----Archaeology - traces of ancient civilizations\n----Huatian and Eyjafjalla Interaction Event\n----Apro and larger leader interaction event\n--Traditions: Reset the original tradition text, and adapted it to new traditions\n--Vanilla event GTS-ification: Gaseous Life Dasnak\n--New Shoe Planet (beta)"
  # 2.9.1更新\n新内容：\n -  - 新加了一位领袖，启用舰娘飞升后即可获得\n -  - 洛蒂相关:\n -  -  -  - 添加科技：私人玩具 -  - 净化免除外交惩罚\n -  -  -  - 添加科技：足垢星球宜居，洛蒂鞋子宜居\n -  -  -  - 添加洛蒂鞋子修正移除决策\n -  -  -  - 修正丝足碾碎岗位\n -  - 足垢星球:\n -  -  -  - 修改足垢星球、洛蒂鞋子部分岗位数值\n -  -  -  - 足垢星球城市区划能够增加建筑槽位\n -  - 修正政体类型权重\n -  - 添加女仆之国的AI和外交对话\n -  - 添加单独的星球住房尺寸决策\n\nBUG修复：\n -  - 豢养神明部分由于国民理念冲突导致理想城废墟无法正常在首都上生成，因此将理想城废墟改成可建造\n -  - 修复了进入游戏后种族特质\"小人开局\"和\"巨娘开局\"仍然存在的问题\n -  - 修复了开局如果没有选择体型特质，随机分配的体型特质与种族特质\"小人开局\"和\"巨娘开局\"冲突的问题\n -  - 修复了开局如果没有选择体型特质，进入游戏的领袖特质随机的问题\n -  - 修复了艾雅法拉异常事件缺失的bug\n -  - 补全了所有领袖的复活事件
  gts_update.2.9.1: "2.9.1 Update\nNew content:\n--Added a new leader, which can be obtained after enabling Shipgirl Ascension\n--Lottie related:\n----Added tech: Private Toy - purification exempts diplomatic penalties\n----Added tech: Foot Soil planet habitable, Lottie shoes habitable\n----Added a decision to remove the Lottie's Shoes modifier\n----Corrected Silk Foot Crush job\n--Foot Soil planet:\n----Modified the values of some jobs on Foot Soil planets and Lottie shoes\n----Foot Soil planet city districts can increase building slots\n--Corrected government type weighting\n--Added AI and diplomatic dialogue for Maid Country\n--Added a separate planet housing size decision\n\nBug Fixes:\n--Taming Gods' idealism ruins cannot be created in the capital due to civic conflicts. Therefore, the Ideal City Ruins have been changed to buildable.\n--Fixed the issue that the race traits 'Small Person Start' and 'Giantess Start' still existed after entering the game\n--Fixed that, if no body type trait was selected at the start, the randomly assigned body type traits conflicted with the race traits 'Small Person Start' and 'Giantess Start'\n--Fixed that, if no body trait was selected at the start, the leader traits that entered the game was random\n--Fixed the missing bug from Eyjafjalla's anomaly events\n--Completed the resurrection events for all leaders"
  # 2.9.2更新\n已适配最新版3.14，如有bug请反馈\n新内容\n -  - 新增了两位领袖，需满足特殊星系要求才可获取（完成度较低）\n -  - 新增了一个起源：寰海极宇\n -  - 现在领袖体型特质会有少许加成\n -  - 豢养神明起源相关:\n -  -  -  - 修复了开局事件不触发的问题\n -  -  -  - 起始母星现在改为30格海洋星球\n -  -  -  - 新增了犽戎的局势事件（目前仅为单纯的数值加成）\n -  -  -  - 新增了犽戎的巨像处决方式（需要在完成歼星武装后，并在法令中进行调整，属于极限版块）\n -  -  -  - 扩展了犽戎歼星武装事件的触发方式，在所有灾飞开启时即可触发\n -  -  -  - 新增了一个泡泡获取后的事件（半完成）\n -  -  -  - 调整了部分事件的触发时间\n -  - 特殊星球相关:\n -  -  -  - 新增了尿液星球及其附属岗位（目前仅可通过犽戎的处决获得）\nBUG修复:\n -  - 修复了点击开始新游戏会导致游戏崩溃的问题\n -  - 修复了部分已发现的错别字和语病\n -  - 修复了部分事件出现的文本缺失和错位\n -  - 修复了部分领袖特质效果未全部生效的问题\n -  - 修复了足垢星球的星球调整未全部生效的问题
  gts_update.2.9.2: "2.9.2 Update\nAdapted to the latest version 3.14, please give feedback if there are bugs\nNew content\n--Added two new leaders, need to meet special system requirements to get them (low completion)\n--Added a new origin: Vast Ocean Extreme Universe\n--Now the leader body type traits will have a slight bonus\n--Taming Gods origin related:\n----Fixed issue with the initial event not triggering\n----Starting home world is now changed to a 30-square ocean planet\n----Added Yaorong's situation event (currently only a pure numerical bonus)\n----Added Yaorong's Colossus execution method (needs to be adjusted in the edict after completing the planet killer weapon, belonging to the extreme module)\n----Extended the trigger method of Yaorong's planet killer weapon event, can be triggered whenever all disasters are enabled\n----Added an event after obtaining the bubble (half completed)\n----Adjusted the trigger time of some events\n--Special planet related:\n----Added the urine planet and its subordinate jobs (currently only available through Yaorong's execution)\nBug Fixes:\n--Fixed an issue where clicking to start a new game would cause the game to crash\n--Fixed some discovered typos and grammatical errors\n--Fixed the missing and misaligned text in some events\n--Fixed the issue that some leader trait effects were not fully effective\n--Fixed the issue that planetary adjustments on the Foot Soil planet were not fully effective"
  # 3.0.0更新新内容\n -  - 新增了一位领袖千海，需要先拥有一个天体级科学官才可触发\n -  - 新增了一位领袖咕呀\n -  - 新增了制服鞋获取事件，现在制服鞋一开始将不能够殖民\n -  - 新增了小死神的后续事件\n -  - 新增了艾雅法拉的天体级后续事件\n -  - 新增了星球陆军胜利后巨娘国对小人的事件\n -  - 新增两项星际行动\n -  - 新增了一个异常现象\n -  - 新增了三名领袖：希尔、板鸭、流萤\n -  - 新增了一个新的国民理念\n -  - 新增了数个舰娘的名字\n -  - 新增了萨拉托加领袖的后续事件\n -  - 豢养神明起源相关:\n -  -  -  - 新增了犽戎的独有传统和一系列事件\n -  -  -  - 新增了犽戎的一系列新立绘\n -  -  -  - 修复了犽戎一直求婚的问题\n -  -  -  - 修复了犽戎不索敌的问题\n -  -  -  - 修复了犽戎开局拆家的问题\n -  -  -  - 调整了部分事件的触发时间\n -  - 寰海极宇起源：\n -  -  -  - 现在附庸小人侧和巨娘侧资源不再隐藏\n -  -  -  - 修复了部分文案的错误\n -  -  -  - 修复了开启scat开关能解锁所有有关建筑的问题\n -  -  -  - 修复了天体级巨娘科学家无法添加到科研船上的问题\n -  -  -  - 修复了开启抖m事件直接当场游戏结束的问题\n -  -  -  - 修复了保险项目建筑会消失的问题\n -  -  -  - 略微增加保险分部建筑建造完成的惩罚\n -  -  -  - 增加了保险合约国的贴图\n -  -  -  - 新增了三个险种和三个新建筑\n -  -  -  - 增加了一项针对土著文明的新谍报，需要天外恶作剧国民理念\n -  -  -  - 新增了二个退保事件，建立巨娘阴吞险或扶她险后有一定概率数年后触发\n\n调整：\n -  - 降低了艾雅法拉涨奶事件的触发频率\n -  - 修改了大量岗位的消耗和产出\n -  - 修改了星球的命运事件的权重\n -  - 调整了几位领袖的立绘\n\nBUG修复:\n -  - 修复了部分事件的图片缺失\n -  - 修复了部分事件的文本错误\n -  - 修复了部分事件AI能够触发的问题\n -  - 修复了部分障碍物的文本错误 -  - 修复了可以随时戴上小花田饰品和花田可以戴上自己的bug\n -  - 修复了部分饰品装配消耗使用合金时反而增加的错误\n -  - 修复了第一次接触卡死的问题\n -  - 修复了同调传统缺失文本的问题\n -  - 修复了机械智能政体部分事件中领袖会被替代岗位的问题\n -  - 修复了不满足条件就能建造h星人分部建筑的问题\n -  - 修复了微文明培育室不能组装人口的问题\n -  - 修复了天体级巨娘能够被缩小射线巨像缩小到微生物的问题\n -  - 修复了招聘古明地觉后招聘标记错位的问题
  gts_update.3.0.0: "3.0.0 Update\nNew Content\n--Added a new leader, Qianhai, must have a Celestial-level scientific officer to trigger\n--Added a new leader, Guya\n--Added an event for obtaining uniform shoes, now they cannot be colonized initially\n--Added a sequel to the event of Little Grim Reaper\n--Added Eyjafjalla's Celestial-level follow-up events\n--Added the Giantess country events to small people after the planet army victory\n--Added two star base operations\n--Added an anomaly\n--Added three leaders: Hill, Board Duck (nickname), Liuying\n--Added a new civic\n--Added several shipgirl names\n--Added a sequel to the Saratoga leader event\n--Taming Gods origin related:\n----Added Yaorong's unique traditions and a series of events\n----Added a new series of portraits for Yaorong\n----Fixed the issue that Yaorong was always proposing marriage\n----Fixed the issue that Yaorong would not lock enemies\n----Fixed the issue that Yaorong was dismantling structures at game start\n----Adjusted the trigger time of some events\n--Vast Ocean Extreme Universe origin:\n----Now the resources of vassal small people side and giantess side are no longer hidden\n----Fixed some text errors\n----Fixed that opening the scat switch can unlock all related buildings\n----Fixed the issue that Celestial-level Giantess scientists cannot be added to research ships\n----Fixed the issue that opening the masochism event directly ends the game on the spot\n----Fixed the issue that insurance project buildings disappear\n----Slightly increased the penalty for the completion of insurance branch buildings\n----Added graphics for insurance contract countries\n----Added three new types of insurance and three new buildings\n----Added a new espionage operation targeting primitive civilizations, requiring the 'Outer Space Pranks' civic\n----Added two insurance cancellation events, a certain percentage of triggering after a few years after establishing Giantess Yin Snatch or Futa insurance\n\nAdjustments:\n--Reduced the trigger frequency of the Eyjafjalla breast growth event\n--Modified the consumption and output of a large number of jobs\n--Modified the weight of the Planet's Fate events\n--Adjusted the portraits of several leaders\n\nBug Fixes:\n--Fixed the issue of missing images in some events\n--Fixed the text errors in some events\n--Fixed the problem that some events can be triggered by AI\n--Fixed the text errors of some obstacles\n--Fixed the bug that the Small Flower Field accessory can be equipped at any time and that the Flower Field can equip itself\n--Fixed the error that some accessory equipment consumption, when using alloys, was sometimes increasing instead\n--Fixed the first contact freeze issue\n--Fixed the issue of missing text for the Synchronization tradition\n--Fixed the issue that the leader would be replaced in some events of the Machine Intelligence government\n--Fixed the issue that H-People branch buildings could be built without meeting the requirements\n--Fixed the issue that the Micro-civilization breeding room cannot assemble population\n--Fixed the issue that a celestial-level giantess could be reduced to a microorganism by the shrinking ray colossus\n--Fixed the issue of misaligned recruitment markers after recruiting Komeiji Satori"
  # 3.1.0更新\n新内容\n -  - 加入了一只新的普通鞋子（还没有具体区划\n -  - 新增了希尔、板鸭的陆军后续事件及特殊登陆事件\n -  - 新增了数项特殊星球的适宜度科技，以及改造特殊星球的地貌生成\n -  - 新增了花田领袖的后续事件，可获得花田领袖武装科研船\n -  - 新增了犽戎的换衣选项法令\n -  - 新增了领袖的好感度选项（目前只有花田领袖有特殊事件\n -  - 新增两项星际行动\n -  - 新增了一个异常现象\n -  - 新增了三名领袖：希尔、板鸭、流萤\n -  - 新增了一个新的国民理念\n -  - 新增了数个舰娘的名字\n -  - 新增了萨拉托加领袖的后续事件\n\n调整：\n -  - 增加了跳蛋星球长时间未清除地貌的惩罚\n -  - 修改了巨娘饰品的增益、获取条件与数项新科技\n -  - 降低了巨娘地貌开拓者的权重\n -  - 修改了星球的命运事件的权重\n\nBUG修复:\n -  - 修复了原版舰船名字出错的问题\n -  - 修复了不满足条件就能建造h星人分部建筑的问题\n -  - 修复了微文明培育室不能组装人口的问题\n -  - 修复了天体级巨娘能够被缩小射线巨像缩小到微生物的问题\n -  - 修复了招聘古明地觉后招聘标记错位的问题\n\n寰海极宇起源：\n -  - 新增了三个险种和三个新建筑\n -  - 新增了巨娘足踏险和巨娘乳压险的退保事件\n -  - 增加了一项针对土著文明的新谍报，需要天外恶作剧国民理念\n -  - 新增了二个退保事件，建立巨娘阴吞险或扶她险后有一定概率数年后触发\n -  - 增加了保险合约国的贴图\n -  - 寰海极宇起源现在每颗星球只能存在一个保险销售员，多余的天体级人口将会被缩小\n -  - 略微增加保险分部建筑建造完成的惩罚\n -  - 现在附庸小人侧和巨娘侧资源不再隐藏\n -  - 修复了开启scat开关能解锁所有有关建筑的问题\n -  - 修复了天体级巨娘科学家无法添加到科研船上的问题\n -  - 修复了开启抖m事件直接当场游戏结束的问题\n -  - 修复了保险项目建筑会消失的问题\n -  - 修复了部分文案的错误
  gts_update.3.1.0: "3.1.0 Update\nNew Content\n -  - Added a new ordinary shoe (No specific district yet)\n -  - Added Army follow-up events and special landing events for Seele and Bronya\n -  - Added several habitability technologies for specialized planets, and modified landscape generation for specialized planets\n -  - Added follow-up events for Leader Huatian, obtain Huatian Leader Armed Science Ship\n -  - Added Yarong's clothes changing option edict\n -  - Added Leader Affinity options (Currently only Leader Huatian has special events)\n -  - Added two Interstellar Actions\n -  - Added an Anomaly\n -  - Added three leaders: Seele, Bronya, Firefly\n -  - Added a new Civic\n -  - Added several Shipgirl names\n -  - Added follow-up events for Leader Saratoga\n\nAdjustments:\n -  - Added penalty for not clearing landscape for a long time on Vibrator Planet\n -  - Modified buffs, acquisition conditions and several new technologies for Giantess Accessories\n -  - Reduced the weight of Giantess Landscape Pioneer\n -  - Modified the weight of Planet's Fate events\n\nBUG Fixes:\n -  - Fixed the issue of wrong original ship names\n -  - Fixed the issue of being able to build h-star person branch buildings without meeting conditions\n -  - Fixed the issue that Micro-Civilization Incubation Chamber cannot assemble pops\n -  - Fixed the issue that Celestial Giantess can be shrunk to microorganism by Shrink Ray Colossus\n -  - Fixed the issue of misplaced recruitment marker after recruiting Komeiji Satori\n\nUniversal Sea Extreme Universe Origin:\n -  - Added three danger types and three new buildings\n -  - Added surrender events for Giantess Foot Trample Insurance and Giantess Breast Press Insurance\n -  - Added a new espionage against primitive civilizations, requires Extraterrestrial Prank Civic\n -  - Added two surrender events, probability to trigger several years after establishing Giantess Vore Insurance or Futa Insurance\n -  - Added textures for Insurance Contract Countries\n -  - Universal Sea Extreme Universe Origin now can only have one Insurance Salesman per planet, excess Celestial Pops will be shrunk\n -  - Slightly increased the penalty for completing Insurance Branch Buildings\n -  - Now Vassal Tiny Person Side and Giantess Side resources are no longer hidden\n -  - Fixed the issue that enabling scat switch unlocks all related buildings\n -  - Fixed the issue that Celestial Giantess Scientists cannot be added to Science Ships\n -  - Fixed the issue that enabling M event ends the game immediately\n -  - Fixed the issue that Insurance Project buildings disappear\n -  - Fixed some text errors"
  # 3.1.1更新\n新内容:\n -  - 落樱雪曦的后续剧情\n -  - 花田的后续剧情\n -  - 虫惑魔终末地剧情\n\n调整：\n -  - 更正了巨娘艺术画师岗位的描述\n -  - 修复了保险开人口出现多种体型的问题\n -  - 保险开现在开局不再减少人口\n -  - 体型现在会影响岗位维护费
  gts_update.3.1.1: "3.1.1 Update\nNew Content:\n -  - Follow-up plot for Luo Ying Xue Xi\n -  - Follow-up plot for Huatian\n -  - Traptrix Endfield plot\n\nAdjustments:\n -  - Corrected the description of Giantess Art Painter job\n -  - Fixed the issue of multiple body sizes appearing in Insurance Start Pops\n -  - Insurance Start no longer reduces pops at the start\n -  - Body size now affects job upkeep"
  # 3.1.2更新\n§Y新内容:§!\n#通用事件调整：\n -  - 修复了寰海巨宇开局人口减少的问题\n -  - 寰海巨宇保险项目现在会添加星球地貌\n -  - 削弱了天体级巨娘的陆军加成\n -  - 残骸回收事件激进的选项失败时会根据摧毁的舰船数量给予资源\n -  - 新增了三大特殊巨娘国策（小人清除者、小人保护者、小人同化者）的统治者背景\n -  - 修改了跳蛋星球的背景图片\n -  - 新增了跳蛋星球修复完成的后续事件\n -  - 修复了巨娘崇拜国策第一次接触无法触发温柔系特使的问题\n -  - 新增了巨娘崇拜国策完成第一次接触的奖励\n§Y领袖相关调整：§!\n -  - 新增了一个星际行动：安乐天使\n -  - 新增了一位新领袖：希诺\n -  - 仍在抵抗的星球随机事件各个领袖的特殊事件权重降低，且现在会增加领袖的击杀计数\n -  - 各类型领袖登陆星球事件改成可多次触发，并修复了会将居住站转换为特殊星球的问题\n流萤：\n -  - 新增了流萤舰船的模型\n -  - 新增了一项流萤特殊的道具\n -  - 修复了流萤雇佣无法续费的问题\n -  - 修复了流萤舰船无法复活的问题\n犽戎：\n -  - 修复了犽戎\"特殊的军事演习\"在领袖招聘前触发的问题\n -  - 新增了4张犽戎的加载图片\n -  - 修复了招聘泡泡舰队领袖没有安置的问题\n欧若拉\n -  - 修改了欧若拉眼部模型（失去高光的萝莉.jpg）\n -  - 欧若拉出生线挣脱后触碰到殖民地会直接将其吞噬\n艾雅法拉\n -  - 艾雅法拉涨奶事件会将黑洞替换成白洞星球\n斯卡蒂\n -  - 巨像武器虎鲸诱捕器现在可以为领袖斯卡蒂增加摧毁的星球、城市、人员数量，以及直接摧毁居住站\n -  - 伊莎玛拉清算事件现在会生成不可殖民的爱液星球，但对特殊的巨娘星球无效\n -  - 如果境内存在前光速文明，斯卡蒂的波涛福音事件会消灭它们\n萨拉托加\n -  - 新增了萨拉托加的演习事件\n -  - 萨拉托加的后续事件触发时间延长\n -  - 萨拉托加的登陆事件不同的选项现在有不同的效果\n博士\n -  - 新增了招聘博士的后续事件
  gts_update.3.1.2: "3.1.2 Update\n§YNew Content:§!\n#General Events Adjustment:\n -  - Fixed the issue of pop decrease at the start of Universal Sea Giant Universe\n -  - Universal Sea Giant Universe Insurance Project now adds planet landscape\n -  - Weakened Celestial Giantess Army bonus\n -  - Debris Recovery Event Aggressive Option failure now gives resources based on number of destroyed ships\n -  - Added Ruler Backgrounds for three special Giantess Civics (Little People Eliminators, Tiny Protector, Diminutive Assimilator)\n -  - Modified Vibrator Planet background image\n -  - Added follow-up events for completion of Vibrator Planet repair\n -  - Fixed the issue that Giantess Worship Civic First Contact cannot trigger Gentle Type Envoy\n -  - Added First Contact rewards for Giantess Worship Civic\n§YLeader Related Adjustments:§!\n -  - Added an Interstellar Action: Angel of Euthanasia\n -  - Added a new leader: Xino\n -  - Reduced the weight of special events for each leader in random events of planets still resisting, and now adds to leader kill count\n -  - Landing Planet Events for each type of leader changed to be triggerable multiple times, and fixed the issue of converting habitats into special planets\nFirefly:\n -  - Added Firefly Ship Model\n -  - Added a special item for Firefly\n -  - Fixed the issue that Firefly Employment cannot be renewed\n -  - Fixed the issue that Firefly Ship cannot be resurrected\nYarong:\n -  - Fixed the issue that Yarong's \\\"Special Military Exercise\\\" triggers before leader recruitment\n -  - Added 4 loading images for Yarong\n -  - Fixed the issue of no placement for recruiting Paopao Fleet Leader\nAurora\n -  - Modified Aurora Eye Model (Loli loosing highlights.jpg)\n -  - Aurora Birth Line breaking free touching a colony will directly devour it\nEyjafjalla\n -  - Eyjafjalla Milk Engorgement Event will replace Black Hole with White Hole Planet\nSkadi\n -  - Colossus Weapon Orca Trap can now increase the number of destroyed planets, cities, and personnel for Leader Skadi, and directly destroy habitats\n -  - Ishar-mla Liquidation Event now generates uninhabitable Love Fluid Planet, but invalid for special Giantess Planets\n -  - If pre-FTL civilizations exist in the territory, Skadi's Gospel of Waves event will eliminate them\nSaratoga\n -  - Added Saratoga Exercise Event\n -  - Extended trigger time for Saratoga follow-up events\n -  - Different options for Saratoga Landing Event now have different effects\nDoctor\n -  - Added follow-up events for recruiting Doctor"
  # 4.0.0更新\n§Y新内容:§!\n -  - 新增了两位巨娘领袖，选择新起源：人皇之嗣，并推动局势解锁。\n -  - 新增了数个可解锁的舰娘和....一只鹅（？\n -  - 新增了紫宸领袖舰船的模型\n -  - 新增了希诺领袖的\"仍在抵抗的星球\"事件\n§H问题修复:§!\n -  - 修复了女仆长岗位产出异常的问题\n -  - 修复了部分局势会直接完成的问题\n -  - 修复了领袖事件中消灭人口和计数错误的问题\n -  - 修复了女仆岗位权重错误的问题\n -  - 修复了珂莱塔事件缺少贴图的问题\n -  - 修复了异尘余生开局游戏直接结束的问题\n -  - 修复了舰娘模型缺失的问题\n -  - 修复了体型正常可以选择巨娘特质的问题\n -  - 修复了部分特殊舰船的维护费过高的问题\n§B#游戏内容调整：§!\n -  - 适配了新版本的区划、建筑、地貌（需要更多区划或建筑槽位请自行寻找相关mod）\n -  - 修改了体型特质的增益与负面效果\n -  - 寰海极宇起源现在天体级人口不会再缩小\n -  - 修改了希诺领袖的考古文本\n -  - 艾雅法拉飞升天体级巨娘事件现在会破坏星球\n -  - 伊莎玛拉的清算事件现在可以选择是否让斯卡蒂上位统治者
  gts_update.4.0.0: "4.0.0 Update\n§YNew Content:§!\n -  - Added two Giantess Leaders, select new Origin: Heir of the Human Emperor, and advance the situation to unlock.\n -  - Added several unlockable Shipgirls and.... a goose (? \n -  - Added Zichen Leader Ship Model\n -  - Added \"Planet Still Resisting\" Event for Xino Leader\n§HBug Fixes:§!\n -  - Fixed Head Maid Job output anomaly\n -  - Fixed the issue that some situations complete directly\n -  - Fixed the issue of population elimination and counting errors in Leader Events\n -  - Fixed Maid Job weight error\n -  - Fixed missing texture for Colette Event\n -  - Fixed the issue that Fallout game start ends immediately\n -  - Fixed missing Shipgirl models\n -  - Fixed the issue that Normal Body Size can select Giantess Traits\n -  - Fixed excessive upkeep for some special ships\n§B#Game Content Adjustment:§!\n -  - Adapted to new version districts, buildings, landscapes (Please find related mods yourself for more districts or building slots)\n -  - Modified buffs and negative effects of Body Size Traits\n -  - Universal Sea Extreme Universe Origin Celestial Pops will no longer shrink\n -  - Modified Xino Leader Archaeology Text\n -  - Eyjafjalla Ascended Celestial Giantess Event will now destroy the planet\n -  - Ishar-mla Liquidation Event can now choose whether to let Skadi become the ruler"
  # 4.1.0更新\n新内容：\n -  - 新增加一位残忍系天体级狐娘领袖\n -  - 新增加领袖图鉴功能\n -  - 新增了亿盐的日常事件\n -  - 新增了珂莱塔的日常事件\n\n问题修复：\n -  - 修复了获得犽戎舰船时犽戎领袖错误生成的问题\n -  - 修复了地貌上限增加效果不生效的问题\n -  - 修复了计划外的演习事件触发过早的问题\n -  - 修复了部分事件分辨率错误的问题\n -  - 修复了斯卡蒂搅动潮汐事件导致游戏崩溃的问题\n -  - 修复了PD星球图错误的问题\n -  - 修复了空弦在情报界面消失的bug\n\n图片调整：\n -  - 增加了千海和希诺的载入界面图\n -  - 更换了情报界面部分领袖的头像\n\n平衡性调整：\n -  - 调整了部分领袖特质\n -  - 调整了体型特质的数值\n -  - 调整了各体型开局的人数设置
  gts_update.4.1.0: "4.1.0 Update\nNew Content:\n -  - Added a Cruel Type Celestial Fox Girl Leader\n -  - Added Leader Gallery Function\n -  - Added Daily Events for Yiyan\n -  - Added Daily Events for Colette\n\nBug Fixes:\n -  - Fixed the error of generating Yharon Leader when obtaining Yharon Ship\n -  - Fixed the issue that Landscape Limit Increase effect does not work\n -  - Fixed the issue that Unplanned Exercise Event triggers too early\n -  - Fixed resolution error for some events\n -  - Fixed the issue that Skadi Stirring Tides Event causes game crash\n -  - Fixed PD Planet Image error\n -  - Fixed the bug that Archetto disappears in Intel Interface\n\nImage Adjustments:\n -  - Added loading interface images for Thousand Seas and Xino\n -  - Replaced avatars of some leaders in Intel Interface\n\nBalance Adjustments:\n -  - Adjusted some Leader Traits\n -  - Adjusted values of Body Size Traits\n -  - Adjusted initial population settings for each body size"
  # 4.1.1更新\n新内容：\n -  - 新增了玩具星球的传统和议程,用于便捷获取相关科技\n\n内容调整:\n -  - 删除了殖民地玩具化选择时增加的「爱液星球」与「玩具殖民星球改良计划」科技.而是会自动选择传统\n -  - 删除了「缩小激素散布」飞升,将科技改为选择「巨像计划」飞升后随机刷新\n -  - 特莉波卡招聘时的不再获得夜之主，年度事件需要手动开启\n -  - 花田的舰娘选项只限招聘一位\n -  - 萨拉托加的特质中添加-100%军用舰船维护费\n -  - 绀海组特质微调\n\n问题修复：\n -  - 修正了特莉波卡在血红之夜事件中变成温柔系的问题\n -  - 修正了某些情况下林凤无法招聘的问题\n -  - 修正了洛蒂鞋子建造图片缺失的问题\n -  - 修正了犽戎和花田舰船的问题\n -  - 修正了犽戎神主雕像无法升级的问题
  gts_update.4.1.1: "4.1.1 Update\nNew Content:\n -  - Added Toy Planet tradition and agenda for convenient acquisition of related technologies\n\nContent Adjustments:\n -  - Removed \"Love Fluid Planet\" and \"Toy Colony Planet Improvement Plan\" technologies added when choosing colony toyification, automatically selecting tradition instead\n -  - Removed \"Shrinking Hormone Dispersal\" Ascension Perk, changed technology to randomly appear after selecting \"Colossus Project\" Ascension Perk\n -  - Recruiting Tezcatlipoca no longer grants Lord of the Night; annual events now require manual activation\n -  - Huatian's Shipgirl option is limited to recruiting only one\n -  - Added -100% Military Ship Upkeep to Saratoga's trait\n -  - Minor tweaks to Azure Sea Group traits\n\nBug Fixes:\n -  - Fixed issue where Tezcatlipoca turned into Gentle Type during the Red Night event\n -  - Fixed issue where Linfeng could not be recruited in certain circumstances\n -  - Fixed missing construction image for Lottie's shoe\n -  - Fixed issue with Yarong and Huatian's ships\n -  - Fixed issue where Yarong's God Statue could not be upgraded"
  # 4.2.0更新\n\n新内容：\n -  - 增加了新的领袖苏小白\n -  - 增加了千海与林凤的联动事件\n -  - 增加了几个新的通用政策\n\n内容调整:\n -  - 更新超巨型精子的叙述\n -  - 增加mod建筑的可建筑数量\n -  - 群mod的区域特化现在能建自动化建筑\n -  - 优化了部分旧版本的体型比较方式\n -  - 修改了星球占领事事件的选项\n -  - 林凤不再会抓走天体级领袖\n -  - 修改了女皇出游事件的触发条件,必须要小人国家+领袖体型大于高大\n -  - 删除了体型特质描述里过时的人口换算比例\n\n问题修复：\n -  - 修复了犽戎重复领袖的问题，优化了领袖招聘的方法\n -  - 修复特殊船领袖在事件中被卸下的问题\n -  - 修复了寰海极宇读取存档会导致分部消失的问题\n -  - 修复了第一次接触的问题\n -  - 修复了小人和巨娘在特殊星球上无法使用的问题\n -  - 修复了空弦立绘显示的问题\n -  - 修复了进化触媒效果显示错误的问题\n -  - 修复了艾雅法拉坐碎星球无法触发的问题\n -  - 修复了某些事件会摧毁突出熔炼机的bug\n -  - 修复了洛蒂部分事件不能正常触发的bug\n -  - 修复了aplog考古事件里，会玩弄大体型巨娘的BUG
  gts_update.4.2.0: "4.2.0 Update\n\nNew Content:\n -  - Added new leader Su Xiaobai\n -  - Added linkage events between Qianhai and Lin Feng\n -  - Added several new general policies\n\nContent Adjustments:\n -  - Updated description of Super Giant Sperm\n -  - Increased buildable count of mod buildings\n -  - District specialization in group mods can now build automated buildings\n -  - Optimized size comparison methods for some old versions\n -  - Modified options for planet occupation events\n -  - Lin Feng will no longer capture celestial-level leaders\n -  - Modified trigger conditions for Empress Outing event, must be Tiny Country + Leader size greater than Tall\n -  - Removed outdated population conversion ratios in size trait descriptions\n\nBug Fixes:\n -  - Fixed issue with Yarong duplicating leaders, optimized leader recruitment method\n -  - Fixed issue where special ship leaders were unequipped in events\n -  - Fixed issue where Huanhai Jiyu save loading caused branch disappearance\n -  - Fixed issue with First Contact\n -  - Fixed issue where Tiny and Giantess could not use special planets\n -  - Fixed issue with Archetto portrait display\n -  - Fixed issue with Evolutionary Catalyst effect display error\n -  - Fixed issue where Eyjafjalla sitting on planet could not trigger\n -  - Fixed bug where certain events would destroy outstanding smelters\n -  - Fixed bug where some of Lottie's events could not trigger normally\n -  - Fixed BUG in aplog archaeology event where large size Giantess would be toyed with"
  # 4.3.0更新\n 新版本对底层代码进行大幅度改动，所以在游玩中可能会遇到一些意外情况，欢迎在群里反馈\n\n 新内容：\n  -  - 新增一位领袖--希瞳\n  -  - 新增林凤的舰娘内容(无事件图)\n  -  - 增加了希瞳与林凤的联动招聘的事件(需要招聘希瞳并完成舰娘改造研究)\n  -  - 新增了好感度特质以及配套的系统，整合了领袖和舰船的招聘的方法\n  -  - 新增了主线事件的开头，晚上了部分千海通讯的内容\n  -  - 领袖界面添加快捷按钮，可以更换领袖衣服以及接入通讯\n  -  - 给艾普露、欧若拉、艾雅法拉、澄闪、水月增加新衣服\n  -  - 可以设定开局最少有几个巨娘帝国\n  -  - 添加了寰海极宇从分部获得人口的事件\n  -  - 附动画的新胖次星球\n  -  - 添加殖民地类型的叙述\n  -  - 绀海组领袖增加了换抱枕图的功能，新增了希儿和希儿的一个随机事件(需要有一颗陆地星球\n\n 内容调整:\n  -  - 昔涟鞋子模型优化\n  -  - 基本款舰娘的更新格式与数值\n  -  - 修改了犽戎的好感度和花田的好感度事件\n  -  - 所有国家都会有起码一个gts国策，以下极端思潮的巨娘国家会获得固定的国策\n  -  -  - 亲外、和平：小人保护者\n  -  -  - 威权、唯心：女仆之国\n  -  -  - 排外、军国：小人灭绝者\n  -  -  - 平等、唯物：小人同化者\n\n 问题修复：\n  -  - 修复了苏小白战队事件异常触发的bug\n  -  - 修复了高大帝国的文案错误,补充进化国策的文本缺失\n  -  - 修正了咕丫的特质加成错误\n  -  - 修复模型的错误\n\n Bruh舰娘：\n  -  - 添加了Bruh舰娘事件的任务追踪\n  -  - 添加了Bruh舰娘歼星级武器的发射事件\n  -  - 重做了Bruh舰娘的各种东西(几乎所有东西)(1个任务)(7个随机事件)\n\n 人皇起源：\n  -  - 优化了零花钱选项，改成国家修正，一产资源每月400，二产资源每月200，通过零花钱界面切换修正\n  -  - 优化了法拉尔达的贴图\n  -  - 为起源相关建筑增加了贴图\n  -  - 修复了法拉和伊莉雅对话返回主菜单选项无法生效的问题。\n  -  - 英灵召唤系统优化，修复了指定召唤无法触发宝具升级事件的bug。\n  -  - 美游的领袖类型改为科学家，阿尔托莉雅的领袖类型改为行政官\n  -  - 优化和完善了部分文本\n  -  - 增加了新的分部建筑：铅笔盒铸造厂，提供合金产出\n  -  - 增加了三个新的科技\n  -  - 增加新的特化区划：破坏自适应城区，以及三个区划独特建筑：抵抗军堡垒，小人摄影棚，大型地标\n  -  - 人皇信仰特质的效果调整为：全部岗位效率+20%\n  -  - 新增两位从者：希洛 冯 爱因兹贝伦，加拉哈德 杜 拉克\n  -  - 增加了角色个人CG事件\n  -  - 增加了新的星球决议
  gts_update.4.3.0: "# 4.3.0 Update\\n This new version makes significant changes to the underlying code, so you may encounter unexpected situations during gameplay. Feedback in the group is welcome.\\n\\n New Content:\\n  -  - Added a new leader: Hitomi\\n  -  - Added shipgirl content for Lin Feng (no event images)\\n  -  - Added combined recruitment events for Hitomi and Lin Feng (requires recruiting Hitomi and completing shipgirl modification research)\\n  -  - Added Favorability traits and matching systems, integrating recruitment methods for leaders and ships\\n  -  - Added the start of the main questline and completed some parts of Qhai's communications\\n  -  - Added shortcut buttons to the leader interface for changing outfits and accessing communications\\n  -  - Added new outfits for Aplog, Aurora, Eyjafjalla, Goldenglow, and Mizuki\\n  -  - Added a setting to specify the minimum number of Giantess Empires at start\\n  -  - Added population acquisition events from branches for Huanhai Jiyu\\n  -  - New Panty Planet with animations\\n  -  - Added colony type descriptions\\n  -  - Azure Sea Group leaders can now change body pillow images, added a random event for Seele (requires a terrestrial planet)\\n\\n Adjustments:\\n  -  - Optimized Xilian's shoe model\\n  -  - Updated format and values for basic shipgirls\\n  -  - Modified Favorability events for Yarong and Huatian\\n  -  - All countries will have at least one GTS civic; countries with extreme ethics will receive fixed civics:\\n  -  -  -  Xenophile, Pacifist: Protector of the Little People\\n  -  -  -  Authoritarian, Spiritualist: Nation of Maids\\n  -  -  -  Xenophobe, Militarist: Exterminator of the Little People\\n  -  -  -  Egalitarian, Materialist: Assimilator of the Little People\\n\\n Bug Fixes:\\n  -  - Fixed a bug where Su Xiaobai's team events triggered abnormally\\n  -  - Fixed text errors in Gao-Da Empire and added missing evolution civic text\\n  -  - Corrected Gu-Ya's trait bonus errors\\n  -  - Fixed model errors\\n\\n Bruh Shipgirls:\\n  -  - Added task tracking for Bruh Shipgirl events\\n  -  - Added launch events for Bruh Shipgirl planet-killing weapons\\n  -  - Reworked various aspects of Bruh Shipgirls (almost everything) (1 task, 7 random events)\\n\\n Human Sovereign Origin:\\n  -  - Optimized allowance options, changed to country modifiers: +400 primary resources and +200 secondary resources monthly, switchable via the allowance interface\\n  -  - Optimized textures for Faralda\\n  -  - Added textures for origin-related buildings\\n  -  - Fixed issues with returning to the main menu in dialogues for Fara and Illya\\n  -  - Optimized Heroic Spirit Summoning system, fixed bugs where specific summons wouldn't trigger Noble Phantasm upgrade events\\n  -  - Miyu's leader type changed to Scientist, Artoria's leader type changed to Administrator\\n  -  - Optimized and perfected some texts\\n  -  - Added new branch building: Pencil Case Foundry, providing Alloy output\\n  -  - Added three new technologies\\n  -  - Added new specialized district: Destructive Adaptive Urban Area, and three unique district buildings: Resistance Fortress, Tiny Person Studio, Large Landmark\\n  -  - Adjusted Human Sovereign Faith trait effect to: All Job Efficiency +20%\\n  -  - Added two new servants: Shiro von Einzbern, Galahad du Lac\\n  -  - Added character personal CG events\\n  -  - Added new planetary decisions"
  # 4.4.0更新\n 新内容:\n  -  - 更新了一位新的领袖   橘子长--追逐明日的拾星者\n  -  - 三月希瞳更新(兑换希瞳后会自己找上你,内容较少)\n  -  - 白丝盒事件(需要有一只天体级领袖且拥有度假星球)\n  -  - 白丝覆盖决议(需要有一只天体级领袖,对拥有的行星使用来改变星系天空盒,缺少事件图)\n   -  - 一个超级大的小皮鞋(暂未完成)\n   -  - 可以找林凤要鞋子\n\n   内容调整:\n   -  - 靴底人现在在袜足星球上不再需要建造圣象，并且可以享受到额外增益。\n\n   问题修复：\n   -  - 修复了咕丫可以重复获取多个的问题\n   -  - 修复了领袖无法正常复活的问题#  -  - 修复了斯卡蒂口人事件无法复活的问题\n   -  - 修复了人皇起源的若干问题\n   -  - 修复了事件获取凝聚力的倍数问题\n   -  - 修复了出现复数体型特质的问题
  gts_update.4.4.0: "Update 4.4.0\n New Content:\n  -  - Added a new leader: Ora - The Star-Gatherer Chasing Tomorrow\n  -  - Hitomi Mitsuki Update (After redeeming Hitomi Mitsuki, she'll find you on her own; minimal content)\n  -  White Silk Box Event (Requires one Celestial-tier Leader and ownership of a Vacation Planet)\n  -  White Silk Overlay Resolution (Requires one Celestial-tier Leader; use on owned planets to change the galaxy skybox; event image missing)\n   -  A Super-Sized Little Shoe (Not yet completed)\n   -  You can ask Linfeng for shoes\n\n   Content Adjustments:\n   -  Boot-Soled People on Sockfoot Planet no longer need to build Sacred Icons and can now enjoy additional bonuses.\n\n   Bug Fixes:\n   -  Fixed an issue where Guya could be obtained multiple times\n   -   - Fixed an issue where Leaders could not be properly resurrected#  -  - Fixed an issue where the Skati-Mouth People event could not be resurrected\n   -  - Fixed several issues with the Human Emperor's Origin\n   -  - Fixed an issue with the multiplier for gaining Cohesion from events\n   -  - Fixed an issue where multiple body type traits appeared"
  # 4.5.0更新\n 新内容:\n  -  - 更新以为新的领袖鸟音山水 \n  -  - 添加了埃罗芒阿老师的年度随机事件\n  -  - 增加了火山星球的背景\n  -  - 增加了一个随机扶她天体级领袖的事件 \n内容调整:\n   -  - 将领袖饰品维护费调整至国家域，以防止过高的维护费产生。\n -  - 更新了欧若拉随机口人的事件的文本，并降低了概率 \n -  - 更新了部分加载图\n -  - 更新了部分星球的图标\n\n   问题修复：\n   -  - 修改了AI对于MOD资源的使用和部分逻辑\n   -  - 优化了橘子长的UI \n   -  - 将原本的繁体字全部改为了简体字 
  gts_update.4.5.0: "Update 4.5.0\n New Content:\n  -  - Updated the leader to the new character, Qinwen\n  -  - Added a random annual event for Teacher Eromanga\n  -  - Added a background for the volcanic planet\n  -  - Added an event featuring a random \"Futa\" celestial-tier leader \nContent Adjustments:\n   -  - Adjusted leader accessory maintenance fees to the national level to prevent excessively high costs.\n -  - Updated the text for Aurora's random \"Koujin\" event and reduced its probability \n  -  Updated some loading screens\n -  Updated icons for some planets\n\n   Bug Fixes:\n   -  Modified the AI's use of MOD resources and certain logic\n   -  Optimized the Ora's UI\n   -  Replaced all traditional Chinese characters with simplified Chinese characters"
  # 4.7.1更新\n\n新内容：\n -  - 添加了新领袖蕾恩娜\n -  - 添加了新的加载图和主界面、欧若拉事件贴图更新\n -  - 添加了艦娘UB的文本與CG\n -  - 添加了殖民地玩具化的初始事件\n -  - 苏小白领袖剧情重置\n -  - 添加了成就系统（制作中）\n -  - 添加了橘子长的后续剧情\n\n内容调整：\n -  - 可以指定某个星球作为林凤改球事件的目标，指定也对部分随机事件生效\n -  - 岗位和资源等数值调整，mod内容适配格式塔\n -  - 艾普露立绘更新并增加了新的衣服\n -  - 移除了万界编织者的局势惩罚\n -  - 将mod里的飞升归到一类了\n -  - 天体级特质现在的岗位效率加成对专家阶级也生效了\n -  - 移除了希诺\n\n问题修复：\n -  - 修复了第一次接触事件失效的bug\n -  - 现在游牧文明也可以使用万界编织者了\n -  - 修复了欧若拉和卵子星球吞噬星球决议缺失的问题\n -  - 修复了领袖星系生成过远和错误的问题\n -  - 仍在抵抗的世界事件未生效的问题未修复\n -  - 修复了领袖宠物特质未生效的问题\n -  - 修复了领袖饰品便携式艺术巨构缺失的问题\n -  - 修復了和諧共處的人口數量問題\n -  - 修復了政策中關於any_system_colony的錯誤\n -  - 修復領袖情報無法兌換的bug\n -  - 修復改造星球時有兩個首都建築\n -  - 修復無法使用給卵子星球提供營養決議\n -  - 修復無法使用給蘿莉星球營養決議\n -  - 修復了通用資源建築建造後不會出事件的問題\n -  - 修復了特質敘述中的+-錯誤\n -  - 修復了讓她自行處理?無法選擇的bug\n -  - 修复了游牧帝国招募博士导致游戏崩溃的问题
  gts_update.4.7.1: ""Update 4.7.1\n\nNew Content:\n -  Added a new leader, Reina\n -  Added new loading screens and main menu graphics; updated Aurora event textures\n  -  Added text and CG for Shipgirl UB\n -  Added the initial event for the \"Colony Toyification\" event\n -  Reset Su Xiaobai's leader storyline\n -  Added an achievement system (in development)\n -  Added follow-up storylines for Ora\n\nContent Adjustments:\n  -  - You can now designate a specific planet as the target for the Linfeng Modified Planet event; this designation also applies to certain random events\n -  - Adjusted values for positions, resources, etc., and adapted mod content to fit Gestalt\n  -  - Updated Apro's character art and added new outfits\n -  - Removed the \"Weaver of All Worlds\" situation penalty\n -  - Reclassified \"Ascension\" events in the mod into a single category\n  -  Celestial-tier traits' role efficiency bonuses now apply to the Expert class as well\n -  Removed Xino\n\nBug Fixes:\n -  Fixed a bug where the First Contact event would fail to trigger\n -  Nomadic civilizations can now use the Weaver of All Worlds\n  -  - Fixed the issue where Aurora and Egg Planet lacked the \"Devour Planet\" resolution\n -  - Fixed issues with leader galaxies spawning too far away or in incorrect locations\n -  - The issue where the \"Still Resisting\" world event does not trigger remains unfixed\n  -  Fixed an issue where leader pet traits were not taking effect\n -  Fixed an issue where the \"Portable Artistic Masterpiece\" leader accessory was missing\n -  Fixed a population count issue with \"Harmonious Coexistence\"\n -  Fixed an error regarding \"any_system_colony\" in policies\n  -  Fixed a bug where Leader Intelligence could not be redeemed\n -  Fixed an issue where two capital buildings appeared when modifying a planet\n -  Fixed an issue where the resolution to provide nutrition to an \"Egg\" planet could not be used\n -  Fixed an issue where the resolution to provide nutrition to a \"Loli\" planet could not be used\n  -  Fixed an issue where events did not trigger after constructing universal resource buildings\n -  Fixed +- errors in trait descriptions\n -  Fixed a bug where the \"Let her handle it?\" option was unselectable\n -  Fixed a crash caused by the Nomadic Empire recruiting a Doctor""
