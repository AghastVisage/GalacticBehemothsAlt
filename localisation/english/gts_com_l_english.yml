  #  4.2.0更新\n\n新内容：\n——增加了新的领袖苏小白\n——增加了千海与林凤的联动事件\n——增加了几个新的通用政策\n\n内容调整:\n——更新超巨型精子的敘述\n——增加mod建築的可建築數量\n——群mod的區域特化現在能建自動化建築\n——优化了部分旧版本的体型比较方式\n——修改了星球占领事事件的选项\n——林凤不再会抓走天体级领袖\n——修改了女皇出游事件的触发条件,必须要小人国家+领袖体型大于高大\n——删除了体型特质描述里过时的人口换算比例\n\n问题修复：\n——修复了犽戎重复领袖的问题，优化了领袖招募的方法\n——修復特殊船領袖在事件中被卸下的問題\n——修复了寰海极宇读取存档会导致分部消失的问题\n——修复了第一次接触的问题\n——修复了小人和巨娘在特殊星球上无法使用的问题\n——修复了空弦立绘显示的问题\n——修复了进化触媒效果显示错误的问题\n——修复了艾雅法拉坐碎星球无法触发的问题\n——修复了某些事件会摧毁突出熔炼机的bug\n——修复了洛蒂部分事件不能正常触发的bug\n——修复了aplog考古事件里，会玩弄大体型巨娘的BUG
  #  4.2.0更新\n\n新内容：\n——增加了新的领袖苏小白\n——增加了千海与林凤的联动事件\n——增加了几个新的通用政策\n\n内容调整:\n——更新超巨型精子的叙述\n——增加mod建筑的可建筑数量\n——群mod的区域特化现在能建自动化建筑\n——优化了部分旧版本的体型比较方式\n——修改了星球占领事事件的选项\n——林凤不再会抓走天体级领袖\n——修改了女皇出游事件的触发条件,必须要小人国家+领袖体型大于高大\n——删除了体型特质描述里过时的人口换算比例\n\n问题修复：\n——修复了犽戎重复领袖的问题，优化了领袖招聘的方法\n——修复特殊船领袖在事件中被卸下的问题\n——修复了寰海极宇读取存档会导致分部消失的问题\n——修复了第一次接触的问题\n——修复了小人和巨娘在特殊星球上无法使用的问题\n——修复了空弦立绘显示的问题\n——修复了进化触媒效果显示错误的问题\n——修复了艾雅法拉坐碎星球无法触发的问题\n——修复了某些事件会摧毁突出熔炼机的bug\n——修复了洛蒂部分事件不能正常触发的bug\n——修复了aplog考古事件里，会玩弄大体型巨娘的BUG
  gts_update.4.2.0: "4.2.0 Update\\n\\nNew Content:\\n——Added new leader Su Xiaobai\\n——Added linkage events between Qianhai and Lin Feng\\n——Added several new general policies\\n\\nContent Adjustments:\\n——Updated description of Super Giant Sperm\\n——Increased buildable count of mod buildings\\n——District specialization in group mods can now build automated buildings\\n——Optimized size comparison methods for some old versions\\n——Modified options for planet occupation events\\n——Lin Feng will no longer capture celestial-level leaders\\n——Modified trigger conditions for Empress Outing event, must be Tiny Country + Leader size greater than Tall\\n——Removed outdated population conversion ratios in size trait descriptions\\n\\nBug Fixes:\\n——Fixed issue with Yarong duplicating leaders, optimized leader recruitment method\\n——Fixed issue where special ship leaders were unequipped in events\\n——Fixed issue where Huanhai Jiyu save loading caused branch disappearance\\n——Fixed issue with First Contact\\n——Fixed issue where Tiny and Giantess could not use special planets\\n——Fixed issue with Archetto portrait display\\n——Fixed issue with Evolutionary Catalyst effect display error\\n——Fixed issue where Eyjafjalla sitting on planet could not trigger\\n——Fixed bug where certain events would destroy outstanding smelters\\n——Fixed bug where some of Lottie's events could not trigger normally\\n——Fixed BUG in aplog archaeology event where large size Giantess would be toyed with"
