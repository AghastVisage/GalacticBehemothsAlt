  # 扫描仪探测到一场裹挟着海量巨娘尿液的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n这场风暴移速极快，就算忽略其直接冲击的危险，这些温热尿液中的腐蚀性成分也会对舰船和空间站造成毁灭性的影响，使其护盾完全失效。无法及时撤离的舰队应立刻调整至防风姿态，并给船员发放防化装备。\n一些科学家无法相信巨娘的尿液能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.20.desc: "Scanners have detected a cosmic storm carrying massive amounts of Giantess Urine approaching our border. We have now named it <STORM Name>.\nSuch storms cause damage to all colonies and prevent our fleet from using emergency hyperspace travel. It is strongly recommended that all colonies in its path take immediate precautionary measures.\nThis storm is moving at an extremely high speed; even setting aside the danger of a direct hit, the corrosive components in this warm urine will have a devastating effect on ships and space stations, rendering their shields completely ineffective. Fleets unable to evacuate in time should immediately assume a storm-proof posture and issue chemical protection gear to their crews.\nSome scientists cannot believe that the Giantess's urine could form a storm of astronomical proportions, and they are strongly demanding an investigation into the storm's origin."
