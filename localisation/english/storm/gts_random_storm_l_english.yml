  #  扫描仪探测到一场裹挟着海量巨娘爱液的宇宙风暴正逼近我方边境。\n满溢着巨娘荷尔蒙的爱液潮对我们来说极为危险，除了训练有素的灵能使，巨娘爱液会让每个接触到的人瞬间发情，这将显著降低我们殖民地的稳定度。但对于装备了灵能导航设备的我国舰队来说，爱液覆膜反而能大幅提高我们舰队的战斗力，唯一需要防备的只有这飘忽不定的风暴本身了。\n一些科学家无法相信巨娘的潮吹能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.77.desc: "Scanners have detected a cosmic storm carrying massive quantities of giantess arousal fluid approaching our borders.\nAn arousal-fluid tide brimming with giantess hormones is extremely dangerous to us. Apart from trained psionics, anyone who comes into contact with giantess arousal fluid will be instantly thrown into heat, which will significantly reduce the stability of our colonies. For our fleets equipped with psionic navigation equipment, however, a film of arousal fluid can instead greatly improve their combat strength. The only thing we need to guard against is the erratic storm itself.\nSome scientists cannot believe that a giantess's ejaculation could form an astronomical storm, and they are insisting on investigating the storm's source."
  #  虚境正在搅动着……我们必须做好一切准备。
