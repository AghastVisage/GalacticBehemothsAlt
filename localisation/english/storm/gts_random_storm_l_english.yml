  # 侦测到汗液潮！
  gts_random_storm.10.name: "Sweat detected!"
  # 扫描仪探测到一场裹挟着海量巨娘汗液的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n蔓延数个星系的汗液潮会轻易瘫痪任何舰队的护盾系统。但另一方面，巨娘汗液所蕴含的丰沛能量可以让风暴波及星区的殖民地产出和舰船机动速度显著提升。\n一些科学家无法相信巨娘的汗液能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.10.desc: "Scanners have detected a cosmic storm carrying massive amounts of Giantess Sweat approaching our border. We have now named it <STORM Name>.\nSuch storms cause damage to all colonies and prevent our fleets from using emergency hyperspace. It is strongly recommended that all colonies in its path take immediate precautionary measures.\nThe sweat tide, which spans several star systems, can easily cripple any fleet's shield systems. On the other hand, the abundant energy contained in the Giantess's sweat can significantly boost production and ship maneuverability for colonies within the storm's path. \nSome scientists find it hard to believe that the Giantess's sweat could form a storm of astronomical proportions, and they are strongly demanding an investigation into the storm's origin."
  # 好的
  gts_random_storm.10.a: "Okay"
  # 去查查风暴的来源
  gts_random_storm.10.b: "Find out where the storm came from"
  # 风暴源调查成功
  gts_random_storm.11.name: "Investigation into the Source of the Storm Successful"
  # 对汗液潮来源的调查成功了！\n我们的科学家在风暴中心发现了一个不稳定的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙并不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，换句话说，那些正在被汗液风暴席卷的星系，此刻也栖居在某位巨娘的腋下。\n我们的科研船成功定位了裂隙另一端的坐标，看起来裂隙入口生成在来了我国一个殖民地的体校学生身上。\n当我们的科研船进入调查时，这个女生正在休息，\n此前为了应对汗液潮，我们将天灾管制限制在室外体育项目，所以她们转入室内继续训练\n显然她不知道那场影响数个星系的宏大风暴，竟然是来自自己运动时的汗水\n眼看她即将结束休息继续训练，科研船连忙加速离开了腋下世界，几分钟后，又一阵新鲜的汗液潮从空间裂隙中涌了出来。\n为了减少她出汗的可能，帝国行政部将天灾管制范围扩大到全部体育赛事，让这个姑娘和其同学的体育训练量控制在基础水平，闲下来的她们可以重心放在理论学习上。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.11.desc: "The investigation into the source of the sweat storm has been a success!\nOur scientists discovered an unstable spatial rift at the center of the storm - a rift that connects two distant points in space. Since the two ends of the rift are not the same size, the flow of matter passing through it is magnified or shrunk by hundreds of thousands of times due to spatial distortion. In other words, the galaxies currently being swept up by the sweat storm are, at this very moment, nestled in the armpit of a Giantess. \nOur research vessel has successfully pinpointed the coordinates of the other end of the rift; it appears the rift's entrance has materialized on the body of a student from a sports academy who has come to one of our colonies. \nWhen our research vessel entered to investigate, this female student was resting. \nPreviously, to cope with the sweat tide, we had restricted natural disaster controls to outdoor sports, so they had moved indoors to continue training\nClearly, she had no idea that the massive storm affecting several galaxies actually originated from her own sweat during exercise. \nAs she was about to finish her rest and resume training, the research vessel quickly accelerated away from the armpit world. A few minutes later, another wave of fresh sweat surged out of the spatial rift. \nTo reduce the likelihood of her sweating, the Imperial Administration expanded the natural disaster restrictions to cover all athletic events, limiting the physical training of this girl and her classmates to a basic level so that, with their free time, they could focus on theoretical studies. \nOur scientists predict that this rift is unstable and will close completely within a few months to a few years. However, the sweat storms that have already been poured into the Milky Way through the portal can only be left to time to resolve."
  # 令人震惊
  gts_random_storm.11.a: "Shocking"
  # 风暴源调查成功
  gts_random_storm.12.name: "Investigation into the Source of the Storm Successful"
  # 对汗液潮来源的调查成功了！\n我们的科学家在汗液潮中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的汗液潮的由来。换句话说，那些正在被汗液风暴席卷的星系，此刻也栖居在某位巨娘的腋下。\n冒险通过空间裂隙后，我们的科研船发现自己身处一位十一二岁的萝莉的腋窝下，尚在发育期的 maiden那若有若无的香汗味在几秒钟内就会把我们这些缩小了数十万倍的科研员们迷晕，为了安全，我们不得不关闭空气交换器，完全使用舰内循环。通过定位，科研船得以确定自己正位于我国一个殖民地的居民区内。\n她此刻正躺在床上睡觉，只是被子已经被不安分的手脚踢开，背心松松垮垮地，露出了她的小肚子和蓝色的儿童胸罩，腋窝大开着，温暖的汗液源源不断地从皮肤深层涌出，与外界空气接触后又慢慢地蒸发升腾，将腋下的皮肤淡淡地濡湿了一层，不过对我们来说，这\"薄薄的一层\"就已经比母星大洋还要深了。\n看起来，这个姑娘天生就是容易怕热出汗的体质，而在当地的夏季，汗液的分泌就更加旺盛了。\n帝国行政部已经命令殖民地政府给整个居民区进行制冷系统升级，同时，几艘装有冷凝弹的隐形军舰将暂时寄居在她的腋下，对她的汗液分泌情况实时监视，逐步压缩通过空间裂隙的汗雾量。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.12.desc: "The investigation into the source of the Sweat Tide was a success! \nOur scientists have discovered a twisted spatial rift at the center of the sweat tide. This type of rift connects two distant points in space. Since the two ends of the rift are not the same size, the flow of matter passing through it is magnified or shrunk by hundreds of thousands of times due to the spatial distortion - which explains the origin of this vast sweat tide. In other words, the galaxies currently being swept up by the Sweat storm are, at this very moment, nestled in the armpit of a Giantess. \nAfter venturing through the spatial rift, our research vessel found itself beneath the armpit of an 11- or 12-year-old Loli. The faint, alluring scent of a developing young girl's sweat was enough to render us researchers - now shrunk hundreds of thousands of times smaller - unconscious within seconds. For safety's sake, we had no choice but to shut down the air exchangers and rely entirely on the ship's internal circulation. Through positioning, the research vessel determined that it was located in a residential area of one of our country's colonies. \nShe was currently asleep in bed, though the covers had been kicked off by her restless limbs. Her tank top hung loosely, revealing her little belly and a blue children's bra, her armpits wide open. Warm sweat was continuously welling up from deep within her skin; upon contact with the outside air, it slowly evaporated and rose, leaving a faint layer of moisture on the skin beneath her armpits. To us, however, this \"thin layer\" was already deeper than the oceans of our homeworld. \nIt seemed this young woman was naturally prone to heat and sweating, and during the local summer, her sweat became even more profuse. \nThe Imperial Administrative Department has already ordered the colonial government to upgrade the cooling systems throughout the residential area. At the same time, several stealth warships equipped with condensation bombs will temporarily station themselves under her armpits to monitor her sweat secretion in real time and gradually reduce the volume of sweat mist passing through the spatial fissure. \nOur scientists predict that this rift is unstable and will close completely within a few months to a few years. However, the sweat storms that have already poured into the Milky Way through the portal can only be left to time to resolve."
  # 令人震惊
  gts_random_storm.12.a: "Shocking"
  # 风暴源调查成功
  gts_random_storm.13.name: "Investigation into the Source of the Storm Successful"
  # 对汗液潮来源的调查成功了！\n我们的科学家在汗液潮中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的汗液潮的由来。换句话说，那些正在被汗液风暴席卷的星系，此刻也栖居在某位女性的腋下。\n然而穿过空间裂隙，科研船发现定位信号显示它们正在我们帝国的母星，准确的说是母星的巨娘领袖宅邸里。\n进一步确认的结果是...[event_target:gts_random_storm_leader_target.GetName]，波及数个星系的风暴正是源自她身上泌出的汗液。\n看着这位巨大女神悠哉悠哉地伸着懒腰，倚在沙发上浏览文件的样子，我们实在不敢确定这究竟只是一场意外，还是她利用自己的神力戏弄人间的新点子。幸好我们现在足够小，她还没发现我们。\n回到主世界，我们旁敲侧击地向[event_target:gts_random_storm_leader_target.GetName]提及了此事，她看起来颇为惊讶，大概是自己也没想到还能以这种方式摧毁银河，让无数生灵雌伏在她身体的分泌物下，希望这次经历不要让她觉醒一些不妙的爱好。\n至少她还算配合工作，行政部将派遣大量人员机械在她的体表建设引水渠，以将她身上出的汗引导到其他地方。她也会在这段时间内减少外出活动，安静地等待自己制造的这场风暴结束。宣传部门也会进行新闻管制，避免诸如\"[event_target:gts_random_storm_leader_target.GetName]大人靠出汗熄灭恒星\"之类虽然事实如此但会损害其个人形象的言论传播。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.13.desc: "The investigation into the source of the Sweat Tide was a success! \nOur scientists discovered a twisted spatial rift at the center of the sweat tide - a rift that connects two distant regions of space. Since the two ends of the rift are not the same size, the flow of matter passing through it is magnified or shrunk by hundreds of thousands of times due to the spatial distortion, which explains the origin of this vast sweat tide. In other words, the galaxies currently being swept up by the Sweat storm are, at this very moment, nestled in a certain woman's armpit. \nHowever, upon passing through the spatial rift, the research vessel's location signals indicated they were on our Empire's homeworld - more precisely, within the residence of the homeworld's Giantess leader. \nFurther verification revealed that... [event_target:gts_random_storm_leader_target.GetName] - the storm affecting several galaxies originated from the Sweat secreted by her body. \nWatching this gigantic goddess leisurely stretch and browse through documents while reclining on the sofa, we couldn't be sure whether this was merely a coincidence or a new way for her to use her divine power to play tricks on the mortal world. Fortunately, we're small enough right now that she hasn't spotted us yet.\nBack in the main world, we broached the subject with [event_target:gts_random_storm_leader_target.GetName] in a roundabout way. She seemed quite surprised - perhaps she hadn't expected that she could destroy the galaxy in this manner, forcing countless living beings to submit to her bodily secretions. Let's hope this experience doesn't awaken any unsavory interests in her.\nAt least she's cooperating with the work; the Administrative Department will dispatch a large number of personnel and machines to construct water channels on her skin, diverting the sweat from her body to other locations. She will also reduce her outdoor activities during this time, quietly waiting for the storm she created to subside. The Public Relations Department will also impose news restrictions to prevent the spread of statements such as \"[event_target:gts_random_storm_leader_target.GetName] extinguishes stars with her sweat\" - statements that, while factually accurate, would damage her personal image. \nOur scientists predict that this fissure is unstable and will close completely within a few months to a few years. However, the sweat storm that has already been channeled into the Milky Way through the portal can only be left to time to resolve."
  # 令人震惊
  gts_random_storm.13.a: "Shocking"
  # 
  gts_random_storm.13.b: """"
