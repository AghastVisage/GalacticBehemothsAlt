  #  调查失败
  gts_random_storm.27.name: "Investigation Failed"
  #  对尿液潮来源的调查最终无功而返，我方科学家的几次抵近考察都没能发现什么引人注意的异常现象，当然，这场吞星蔽日的尿液潮本就是一团巨大的异常现象了。\n我们只能接受这样一个结论，或许确实是某位巨娘的些许尿液从一个未探测到的方向飞入我们所在的这片星系，造成了这次太空风暴。\n只是按这规模推算，这世上总不能真的有银河般巨大的少女存在吧？
  gts_random_storm.27.desc: "The investigation into the source of the urine tide ultimately yielded nothing. Our scientists' several close-range surveys failed to discover any noteworthy anomalies, though of course, this star-swallowing, sun-blocking urine tide is itself one enormous anomaly.\nWe can only accept this conclusion: perhaps a small amount of urine from some giantess truly flew into this star system from an undetected direction, causing this space storm.\nBut judging from this scale, surely there cannot really be a girl as enormous as a galaxy in this world, right?"
  #  还是做好行星防护吧
  gts_random_storm.27.a: "We should prepare planetary defenses anyway"
