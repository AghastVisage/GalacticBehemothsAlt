  # 对爱液潮来源的调查最终无功而返，我方科学家的几次抵近考察都没能发现什么引人注意的异常现象，当然，这场吞星蔽日的爱液潮本就是一团巨大的异常现象了。\n我们只能接受这样一个结论，或许确实是某位巨娘的些许爱液飞入我们的国境内，造成了这次太空风暴。\n只是按这规模推算，这世上总不能真的有银河般巨大的 maiden存在吧？
  gts_random_storm.76.desc: "The investigation into the source of the Love fluid tide ultimately came to nothing; several close-range surveys by our scientists failed to uncover any notable anomalies - though, of course, this Love fluid tide, which swallowed stars and eclipsed the sun, was itself a massive anomaly. \nWe can only accept the conclusion that perhaps a small amount of Love fluid from some Giantess did indeed drift into our national territory, causing this space storm.\nBut judging by the scale of this event, surely there can't really be a girl as massive as the Milky Way out there, can there?"
