  gts_random_storm.60.desc: "Scanners have detected a cosmic storm carrying a strong scent of a Giantess’s fart approaching our border. We have now named it <STORM Name>.\nSuch storms cause damage to all colonies and prevent our fleet from using emergency hyperspace. It is strongly recommended that all colonies in its path take immediate precautionary measures.\nThese storms interfere with our sensors, preventing us from detecting other fleets within these star systems and slowing down space travel. However, despite these risks, we should also actively take advantage of these conditions to boost production in specific roles while the storm passes through. \nSome scientists cannot believe that the stench of a Giantess’s farts could form a storm on the scale of an astronomical phenomenon, and they are strongly demanding an investigation into the storm’s origin."
