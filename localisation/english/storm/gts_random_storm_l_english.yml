  # 调查失败
  gts_random_storm.27.name: "Failed Investigation"
  # 对尿液潮来源的调查最终无功而返，我方科学家的几次抵近考察都没能发现什么引人注意的异常现象，当然，这场吞星蔽日的尿液潮本就是一团巨大的异常现象了。\n我们只能接受这样一个结论，或许确实是某位巨娘的些许尿液从一个未探测到的方向飞入我们所在的这片星系，造成了这次太空风暴。\n只是按这规模推算，这世上总不能真的有银河般巨大的 maiden存在吧？
  gts_random_storm.27.desc: "The investigation into the source of the urine tide ultimately came to nothing; several close-range surveys by our scientists failed to uncover any notable anomalies - though, of course, this urine tide, which swallowed stars and eclipsed the sun, was itself a massive anomaly. \nWe can only accept the conclusion that perhaps a small amount of urine from some Giantess flew into our galaxy from an undetected direction, causing this space storm.\nBut judging by the scale of the event, surely there can't really be a girl as massive as the Milky Way out there, can there?"
  # 还是做好行星防护吧
  gts_random_storm.27.a: "We'd better focus on planetary protection."
