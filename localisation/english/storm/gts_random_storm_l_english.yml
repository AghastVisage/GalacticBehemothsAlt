  gts_random_storm.76.name: "Failed Investigation"
  gts_random_storm.16.desc: "The investigation into the source of the sweat tide ultimately came to nothing; several close-range surveys by our scientists failed to uncover any notable anomalies—though, of course, this sweat tide, which swallowed stars and eclipsed the sun, was in itself a massive anomaly. \nWe can only accept the conclusion that perhaps a small amount of sweat from some Giantess did indeed fly into our galaxy from an undetected direction, causing this space storm.\nBut judging by the scale of this event, surely there can’t really be a girl as massive as the Milky Way out there, can there?"
  gts_random_storm.16.a: "We'd better focus on planetary protection."
  gts_random_storm.27.a: "We'd better focus on planetary protection."
