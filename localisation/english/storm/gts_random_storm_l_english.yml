  #  扫描仪探测到一场裹挟着虚空低语的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n该风暴无色无形，但其波及范围内的所有智慧生命都会听到来自天外巨娘的絮絮低语，其间散发的沉重而哀伤之情让整个星系的重力都发生了异变，建筑和舰队因自重塌陷失能，就连恒星也散发着比平时更强大的引力，就好像不愿让行星们和上面的小人离开她的掌控。\n一些科学家无法相信巨娘的低语能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.30.desc: "Scanners have detected a cosmic storm carrying void whispers approaching our border. We have now named it <风暴名>.\nStorms of this kind will damage all colonies and interfere with our fleets' use of emergency FTL. It is strongly recommended that all colonies along its path take preventive measures immediately.\nThis storm is colorless and formless, but all intelligent life within its range will hear the murmuring whispers of a giantess from beyond the heavens. The heavy and sorrowful emotions within them cause the gravity of the entire system to mutate. Buildings and fleets collapse and become disabled under their own weight, and even stars emit stronger gravity than usual, as if unwilling to let the planets and the tiny people upon them leave her control.\nSome scientists cannot believe that a giantess's whispers can form a storm on the scale of an astronomical phenomenon, and they strongly demand an investigation into the storm's source."
