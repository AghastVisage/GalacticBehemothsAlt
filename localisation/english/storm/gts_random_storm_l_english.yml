  #  侦测到足臭风暴！
  gts_random_storm.50.name: "Foot-Odor Storm Detected!"
  #  扫描仪探测到一场带着浓郁巨娘足臭的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n身处浓郁的巨娘足臭中会轻易迷乱我们船员的心智，因此为了保证航行安全，处于风暴内的所有舰队都必须将能源优先供给主动通讯系统，隐形力场也因此失去了意义。不过，对开采站上的劳工来说，经过滤的足臭是它们最好的工作兴奋剂。我们的观测站也能借此机会观测那些土著文明在全球都陷入巨娘足臭天灾时会做出什么有趣表现。\n一些科学家无法相信巨娘的足臭能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.50.desc: "Scanners have detected a cosmic storm bearing the dense foot odor of a giantess approaching our borders. We have now named it <Storm Name>.\nStorms of this kind will damage all colonies and prevent our fleets from using emergency FTL. All colonies in its path are strongly advised to take immediate precautions.\nBeing immersed in dense giantess foot odor can easily cloud our crews' minds. Therefore, to ensure navigational safety, all fleets within the storm must prioritize power to active communications systems, rendering cloaking fields meaningless. However, for laborers on mining stations, filtered foot odor is the finest work stimulant. Our observation posts can also use this opportunity to observe what interesting behavior those primitive civilizations exhibit when their entire worlds are plunged into a giantess foot-odor disaster.\nSome scientists cannot believe that a giantess's foot odor could form an astronomical storm, and they are insisting on investigating the storm's source."
  #  好的
  gts_random_storm.50.a: "All right"
  #  去查查风暴的来源
  gts_random_storm.50.b: "Investigate the storm's source"
  #  风暴源调查成功
  gts_random_storm.51.name: "Storm Source Investigation Successful"
  #  对足臭风暴来源的调查成功了！\n我们的科学家在风暴中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这汹涌的足臭风暴的由来。换句话说，那些正在被足臭风暴席卷的星系，此刻也栖居在某位女性的鞋袜里。
  gts_random_storm.51.desc: "The investigation into the source of the foot-odor storm has succeeded!\nOur scientists discovered a warped spatial rift at the center of the storm. This kind of rift links two distant regions of space together. Because the two ends of the rift are not the same size, any matter passing through it is enlarged or reduced by hundreds of thousands of times due to spatial distortion. This explains the origin of this surging foot-odor storm. In other words, the star systems now being swept by the foot-odor storm are, at this very moment, also residing inside some woman's shoes and socks."
