  #  风暴源调查成功
  gts_random_storm.53.name: "Storm Source Investigation Successful"
  #  对足臭风暴来源的调查成功了！\n我们的科学家在风暴中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这汹涌的足臭风暴的由来。换句话说，那些正在被足臭风暴席卷的星系，此刻也栖居在某位女性的鞋袜里。\n然而穿过空间裂隙，科研船发现定位信号显示它们正在我们帝国的母星，准确的说是母星的巨娘领袖宅邸里。\n进一步确认的结果是...[event_target:gts_random_storm_leader_target.GetName]，波及数个星系的风暴正是源自她鞋袜里的足臭味。\n这位巨大女神此刻正悠哉悠哉地伸着懒腰，倚在沙发上浏览文件。穿着白色棉袜的双足耷拉着拖鞋，足趾自在地舒张着。\n只是棉袜内的景色就不那么美好了，[event_target:gts_random_storm_leader_target.GetName]这一天间分泌的足汗被袜子纤维充分吸收硬化，阻止了袜内空气的正常流通，整个袜内世界便在[event_target:gts_random_storm_leader_target.GetName]的体温温暖与足汗蒸腾下变成一个满是足臭的暖炉。最终，脚掌的下意识晃动将袜子里热气源源不断地送进空间裂隙，在宇宙间四散开来。而这一切的罪魁祸首还在舒展着自己的双脚，足趾翘起再落下，将那些被空间裂隙卷入的飞船与卫星碾成碎片，再被黏在脚上，成为她脚上无法察觉的装点。我们实在不敢确定这究竟只是一场意外，还是她利用自己的神力戏弄人间的新点子。幸好我们现在足够小，她还没发现我们。\n回到主世界，我们旁敲侧击地向[event_target:gts_random_storm_leader_target.GetName]提及了此事，她看起来颇为惊讶，大概是自己也没想到还能以这种方式摧毁银河，让无数生灵雌伏在她身体的分泌物下，希望这次经历不要让她觉醒一些不妙的爱好。\n至少她还算配合工作，行政部将派遣大量人员机械进入她的袜子里仔细清理棉袜间的缝隙，保证通风。她也会在这段时间内减少外出活动，安静地等待自己制造的这场风暴结束。宣传部门也会进行新闻管制，避免诸如“[event_target:gts_random_storm_leader_target.GetName]大人用白丝玉足熄灭恒星”之类虽然事实如此但会损害其个人形象的言论传播。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了
  gts_random_storm.53.desc: "The investigation into the source of the foot-odor storm has succeeded!\nOur scientists discovered a warped spatial rift at the center of the storm. This kind of rift links two distant regions of space together. Because the two ends of the rift are not the same size, any matter passing through it is enlarged or reduced by hundreds of thousands of times due to spatial distortion. This explains the origin of this surging foot-odor storm. In other words, the star systems now being swept by the foot-odor storm are, at this very moment, also residing inside some woman's shoes and socks.\nHowever, after passing through the spatial rift, the science ships found that their positioning signals placed them on our empire's homeworld, or more precisely, inside the giantess leader's mansion on the homeworld.\nFurther confirmation revealed...[event_target:gts_random_storm_leader_target.GetName]. The storm affecting several star systems is indeed coming from the odor inside her shoes and socks.\nAt this moment, this gigantic goddess is leisurely stretching, leaning back on a sofa as she browses through documents. Her feet, clad in white cotton socks, rest loosely in her slippers, her toes stretching at ease.\nThe scene inside the cotton socks, however, is far less pleasant. The foot sweat [event_target:gts_random_storm_leader_target.GetName] secreted over the course of the day has been fully absorbed and hardened by the sock fibers, blocking normal airflow inside the socks. Under the warmth of [event_target:gts_random_storm_leader_target.GetName]'s body temperature and the steaming of her foot sweat, the entire world within the socks has become a warm furnace filled with foot odor. In the end, unconscious movements of her soles continuously send the hot air inside the socks into the spatial rift, scattering it throughout the cosmos. And the culprit behind all this is still stretching her own feet, raising and lowering her toes, crushing the ships and satellites drawn into the spatial rift into fragments that then stick to her feet, becoming decorations she cannot even notice. We truly cannot tell whether this is only an accident, or some new idea she has devised to toy with the mortal world using her divine power. Fortunately, we are now small enough that she has not noticed us.\nAfter returning to the main world, we indirectly mentioned the matter to [event_target:gts_random_storm_leader_target.GetName]. She seemed quite surprised, probably because even she had not expected that she could destroy the galaxy in this manner, forcing countless living beings to submit beneath her bodily secretions. We can only hope this experience does not awaken any troubling interests in her.\nAt least she is cooperating with the work. The Administration will dispatch large numbers of personnel and machines into her socks to carefully clean the gaps between the cotton fibers and ensure ventilation. She will also reduce her outside activities during this period and wait quietly for the storm she created to end. The propaganda department will also impose news controls to prevent the spread of statements such as \"Lady [event_target:gts_random_storm_leader_target.GetName] extinguished a star with her white-stockinged feet,\" which, although factual, would damage her personal image.\nOur scientists predict that this rift is unstable and will close completely within several months to several years. But the sweat storms that have already poured into the galaxy through the portal can only be left for time to resolve."
