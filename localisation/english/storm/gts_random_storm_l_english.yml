  #  侦测到汗液潮！
  gts_random_storm.10.name: "Sweat Tide Detected!"
  #  扫描仪探测到一场裹挟着海量巨娘汗液的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n蔓延数个星系的汗液潮会轻易瘫痪任何舰队的护盾系统。但另一方面，巨娘汗液所蕴含的丰沛能量可以让风暴波及星区的殖民地产出和舰船机动速度显著提升。\n一些科学家无法相信巨娘的汗液能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.10.desc: "Scanners have detected a cosmic storm carrying vast quantities of giantess sweat approaching our border. We have now named it <风暴名>.\nStorms of this kind will damage all colonies and interfere with our fleets' use of emergency FTL. It is strongly recommended that all colonies along its path take preventive measures immediately.\nA sweat tide spreading across several systems can easily paralyze the shield systems of any fleet. On the other hand, the abundant energy contained in giantess sweat can significantly increase colony output and ship sublight speed in the sectors affected by the storm.\nSome scientists cannot believe that giantess sweat can form a storm on the scale of an astronomical phenomenon, and they strongly demand an investigation into the storm's source."
  #  好的
  gts_random_storm.10.a: "All right"
  #  去查查风暴的来源
  gts_random_storm.10.b: "Investigate the storm's source"
  #  风暴源调查成功
  gts_random_storm.11.name: "Storm Source Investigation Successful"
  #  对汗液潮来源的调查成功了！\n我们的科学家在风暴中心发现了一个不稳定的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙并不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，换句话说，那些正在被汗液风暴席卷的星系，此刻也栖居在某位巨娘的腋下。\n我们的科研船成功定位了裂隙另一端的坐标，看起来裂隙入口生成在来了我国一个殖民地的体校学生身上。\n当我们的科研船进入调查时，这个女生正在休息，\n此前为了应对汗液潮，我们将天灾管制限制在室外体育项目，所以她们转入室内继续训练\n显然她不知道那场影响数个星系的宏大风暴，竟然是来自自己运动时的汗水\n眼看她即将结束休息继续训练，科研船连忙加速离开了腋下世界，几分钟后，又一阵新鲜的汗液潮从空间裂隙中涌了出来。\n为了减少她出汗的可能，帝国行政部将天灾管制范围扩大到全部体育赛事，让这个姑娘和其同学的体育训练量控制在基础水平，闲下来的她们可以重心放在理论学习上。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.11.desc: "The investigation into the source of the sweat tide has succeeded!\nOur scientists discovered an unstable spatial rift at the center of the storm. This kind of rift links two distant spaces together. Because the rifts at the two ends are not the same size, any matter flowing through the rift is enlarged or reduced hundreds of thousands of times by spatial distortion. In other words, the systems currently being swept by the sweat storm are also residing beneath a certain giantess's armpit at this very moment.\nOur science ship successfully located the coordinates of the other end of the rift. It appears that the rift entrance formed on the body of a sports-school student from one of our colonies.\nWhen our science ship entered to investigate, this girl was resting.\nPreviously, in order to respond to the sweat tide, we limited disaster controls to outdoor sports, so they moved indoors and continued training.\nClearly, she did not know that the grand storm affecting several systems actually came from the sweat she produced while exercising.\nSeeing that she was about to finish resting and resume training, the science ship hurriedly accelerated away from the armpit world. A few minutes later, another fresh sweat tide surged out from the spatial rift.\nTo reduce the possibility of her sweating, the Imperial Administration has expanded the scope of disaster controls to all sporting events, keeping this girl's and her classmates' physical training volume at a basic level. With more free time, they can focus on theoretical study.\nOur scientists predict that this rift is unstable and will close completely within months to years. But the sweat storms that have already poured into the galaxy through the portal can only be left for time to resolve."
  #  令人震惊
  gts_random_storm.11.a: "Shocking"
  #  风暴源调查成功
  gts_random_storm.12.name: "Storm Source Investigation Successful"
  #  对汗液潮来源的调查成功了！\n我们的科学家在汗液潮中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的汗液潮的由来。换句话说，那些正在被汗液风暴席卷的星系，此刻也栖居在某位巨娘的腋下。\n冒险通过空间裂隙后，我们的科研船发现自己身处一位十一二岁的萝莉的腋窝下，尚在发育期的少女那若有若无的香汗味在几秒钟内就会把我们这些缩小了数十万倍的科研员们迷晕，为了安全，我们不得不关闭空气交换器，完全使用舰内循环。通过定位，科研船得以确定自己正位于我国一个殖民地的居民区内。\n她此刻正躺在床上睡觉，只是被子已经被不安分的手脚踢开，背心松松垮垮地，露出了她的小肚子和蓝色的儿童胸罩，腋窝大开着，温暖的汗液源源不断地从皮肤深层涌出，与外界空气接触后又慢慢地蒸发升腾，将腋下的皮肤淡淡地濡湿了一层，不过对我们来说，这“薄薄的一层”就已经比母星大洋还要深了。\n看起来，这个姑娘天生就是容易怕热出汗的体质，而在当地的夏季，汗液的分泌就更加旺盛了。\n帝国行政部已经命令殖民地政府给整个居民区进行制冷系统升级，同时，几艘装有冷凝弹的隐形军舰将暂时寄居在她的腋下，对她的汗液分泌情况实时监视，逐步压缩通过空间裂隙的汗雾量。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.12.desc: "The investigation into the source of the sweat tide has succeeded!\nOur scientists discovered a distorted spatial rift at the center of the sweat tide. This kind of rift links two distant spaces together. Because the rifts at the two ends are not the same size, any matter flowing through the rift is enlarged or reduced hundreds of thousands of times by spatial distortion, explaining the origin of this vast sweat tide. In other words, the systems currently being swept by the sweat storm are also residing beneath a certain giantess's armpit at this very moment.\nAfter taking the risk of passing through the spatial rift, our science ship found itself beneath the armpit of an eleven- or twelve-year-old girl. The faint scent of sweat from this still-developing girl could make us researchers, shrunk hundreds of thousands of times, faint within seconds. For safety, we had to shut down the air exchangers and rely entirely on internal ship circulation. Through positioning, the science ship determined that it was located in a residential district of one of our colonies.\nShe is currently sleeping in bed, but the blanket has been kicked aside by her restless hands and feet. Her loose tank top reveals her small belly and blue children's bra, and her armpit is wide open. Warm sweat continuously wells up from deep beneath the skin, and after contacting the outside air, slowly evaporates and rises, lightly dampening the skin beneath her armpit. But to us, this \"thin layer\" is already deeper than the oceans of our homeworld.\nIt appears that this girl naturally has a constitution that easily overheats and sweats, and in the local summer, her sweat secretion becomes even more abundant.\nThe Imperial Administration has already ordered the colonial government to upgrade the cooling system for the entire residential district. At the same time, several stealth warships equipped with condensation bombs will temporarily reside beneath her armpit, monitoring her sweat secretion in real time and gradually reducing the amount of sweat mist passing through the spatial rift.\nOur scientists predict that this rift is unstable and will close completely within months to years. But the sweat storms that have already poured into the galaxy through the portal can only be left for time to resolve."
  #  令人震惊
  gts_random_storm.12.a: "Shocking"
  #  风暴源调查成功
  gts_random_storm.13.name: "Storm Source Investigation Successful"
  #  对汗液潮来源的调查成功了！\n我们的科学家在汗液潮中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的汗液潮的由来。换句话说，那些正在被汗液风暴席卷的星系，此刻也栖居在某位女性的腋下。\n然而穿过空间裂隙，科研船发现定位信号显示它们正在我们帝国的母星，准确的说是母星的巨娘领袖宅邸里。\n进一步确认的结果是...[event_target:gts_random_storm_leader_target.GetName]，波及数个星系的风暴正是源自她身上泌出的汗液。\n看着这位巨大女神悠哉悠哉地伸着懒腰，倚在沙发上浏览文件的样子，我们实在不敢确定这究竟只是一场意外，还是她利用自己的神力戏弄人间的新点子。幸好我们现在足够小，她还没发现我们。\n回到主世界，我们旁敲侧击地向[event_target:gts_random_storm_leader_target.GetName]提及了此事，她看起来颇为惊讶，大概是自己也没想到还能以这种方式摧毁银河，让无数生灵雌伏在她身体的分泌物下，希望这次经历不要让她觉醒一些不妙的爱好。\n至少她还算配合工作，行政部将派遣大量人员机械在她的体表建设引水渠，以将她身上出的汗引导到其他地方。她也会在这段时间内减少外出活动，安静地等待自己制造的这场风暴结束。宣传部门也会进行新闻管制，避免诸如“[event_target:gts_random_storm_leader_target.GetName]大人靠出汗熄灭恒星”之类虽然事实如此但会损害其个人形象的言论传播。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.13.desc: "The investigation into the source of the sweat tide has succeeded!\nOur scientists discovered a distorted spatial rift at the center of the sweat tide. This kind of rift links two distant spaces together. Because the rifts at the two ends are not the same size, any matter flowing through the rift is enlarged or reduced hundreds of thousands of times by spatial distortion, explaining the origin of this vast sweat tide. In other words, the systems currently being swept by the sweat storm are also residing beneath a certain woman's armpit at this very moment.\nHowever, after passing through the spatial rift, the science ship found that its positioning signal indicated it was on our empire's homeworld, or more precisely, inside the giantess leader's residence on the homeworld.\nFurther confirmation showed that it was... [event_target:gts_random_storm_leader_target.GetName]. The storm affecting several systems originated from the sweat secreted by her body.\nWatching this enormous goddess leisurely stretch, lean on the sofa, and browse documents, we truly cannot be sure whether this is merely an accident or a new idea she devised to tease the mortal world with her divine power. Fortunately, we are now small enough that she has not discovered us.\nAfter returning to the main world, we indirectly mentioned this matter to [event_target:gts_random_storm_leader_target.GetName]. She looked rather surprised, probably because even she had not expected that she could destroy the galaxy in this way and make countless living beings submit beneath her bodily secretions. We hope this experience does not awaken any unfortunate tastes in her.\nAt least she is reasonably cooperative. The Administration will dispatch large numbers of personnel and machines to build drainage channels on the surface of her body, guiding the sweat she produces elsewhere. During this period, she will also reduce her outings and quietly wait for this storm she created to end. The Propaganda Department will also impose news controls to prevent the spread of statements such as \"Lady [event_target:gts_random_storm_leader_target.GetName] extinguished stars by sweating,\" which, though factual, would damage her personal image.\nOur scientists predict that this rift is unstable and will close completely within months to years. But the sweat storms that have already poured into the galaxy through the portal can only be left for time to resolve."
  #  令人震惊
  gts_random_storm.13.a: "Shocking"
  #  
  gts_random_storm.13.b: ""
  #  风暴源调查成功
  gts_random_storm.14.name: "Storm Source Investigation Successful"
  #  对汗液潮来源的调查成功了！\n我们的科学家在汗液潮中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的汗液潮的由来。换句话说，那些正在被汗液风暴席卷的星系，此刻也栖居在某位巨娘的腋下。\n\n竟然是我国的一个奴隶，\n我们已经将她转移到安全的地方，并\n已经有一些得知真相的人开始，甚至尝试接触这个女奴隶\n我们可不能让更多人知道这件事
  gts_random_storm.14.desc: "The investigation into the source of the sweat tide has succeeded!\nOur scientists discovered a distorted spatial rift at the center of the sweat tide. This kind of rift links two distant spaces together. Because the rifts at the two ends are not the same size, any matter flowing through the rift is enlarged or reduced hundreds of thousands of times by spatial distortion, explaining the origin of this vast sweat tide. In other words, the systems currently being swept by the sweat storm are also residing beneath a certain giantess's armpit at this very moment.\n\nIt turned out to be one of our country's slaves.\nWe have already moved her to a safe place, and\nsome people who have learned the truth have already begun, even attempting to contact this female slave.\nWe cannot let any more people know about this."
  #  令人震惊
  gts_random_storm.14.a: "Shocking"
  #  
  gts_random_storm.14.b: ""
  #  风暴源调查成功
  gts_random_storm.15.name: "Storm Source Investigation Successful"
  #  修车\n为她调整了工作班次\n这场风暴不会再恶化下去了，但那些已经随传送门灌入星系的汗液风暴只能留给时间去解决了。
  gts_random_storm.15.desc: "Repair the car\nAdjusted her work shifts\nThis storm will not worsen any further, but the sweat storms that have already poured into the star system through the portal can only be left for time to resolve."
  #  令人震惊
  gts_random_storm.15.a: "Shocking"
  #  
  gts_random_storm.15.b: ""
  #  调查失败
  gts_random_storm.16.name: "Investigation Failed"
  #  对汗液潮来源的调查最终无功而返，我方科学家的几次抵近考察都没能发现什么引人注意的异常现象，当然，这场吞星蔽日的汗液潮本就是一团巨大的异常现象了。\n我们只能接受这样一个结论，或许确实是某位巨娘的些许汗液从一个未探测到的方向飞入我们所在的这片星系，造成了这次太空风暴。\n只是按这规模推算，这世上总不能真的有银河般巨大的少女存在吧？
  gts_random_storm.16.desc: "The investigation into the source of the sweat tide ultimately yielded nothing. Our scientists' several close-range surveys failed to discover any noteworthy anomalies, though of course, this star-swallowing, sun-blocking sweat tide is itself one enormous anomaly.\nWe can only accept this conclusion: perhaps a small amount of sweat from some giantess truly flew into this star system from an undetected direction, causing this space storm.\nBut judging from this scale, surely there cannot really be a girl as enormous as a galaxy in this world, right?"
  #  还是做好行星防护吧
  gts_random_storm.16.a: "We should prepare planetary defenses anyway"
