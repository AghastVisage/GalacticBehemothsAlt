  gts_random_storm.66.desc: "The investigation into the source of the rear-orifice storm ultimately came to nothing. Several close-range surveys by our scientists failed to discover any noteworthy anomalies, though of course this star-concealing, sun-shrouding rear-orifice storm is itself one enormous anomaly.\nWe can only accept one conclusion: perhaps the odor accidentally released by some distant giantess truly traveled for a long time before reaching our region of space, and the smell it emitted caused this space storm.\nBut judging by its scale, surely there cannot really be a girl as vast as the galaxy, can there?"
