  #  侦测到尿液潮！
  gts_random_storm.20.name: "Urine Tide Detected!"
  #  扫描仪探测到一场裹挟着海量巨娘尿液的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n这场风暴移速极快，就算忽略其直接冲击的危险，这些温热尿液中的腐蚀性成分也会对舰船和空间站造成毁灭性的影响，使其护盾完全失效。无法及时撤离的舰队应立刻调整至防风姿态，并给船员发放防化装备。\n一些科学家无法相信巨娘的尿液能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.20.desc: "Scanners have detected a cosmic storm carrying vast quantities of giantess urine approaching our border. We have now named it <风暴名>.\nStorms of this kind will damage all colonies and interfere with our fleets' use of emergency FTL. It is strongly recommended that all colonies along its path take preventive measures immediately.\nThis storm is moving extremely quickly. Even ignoring the danger of its direct impact, the corrosive components in this warm urine will have a devastating effect on ships and space stations, completely disabling their shields. Fleets unable to withdraw in time should immediately shift to a wind-resistant posture and issue chemical-protection equipment to their crews.\nSome scientists cannot believe that giantess urine can form a storm on the scale of an astronomical phenomenon, and they strongly demand an investigation into the storm's source."
