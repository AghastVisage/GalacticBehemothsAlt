  #  对屁穴风暴来源的调查成功了！\n我们的科学家在风暴中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这汹涌的屁穴风暴的由来。换句话说，那些正在被屁穴风暴席卷的星系，此刻也栖居在某位女性的后庭里。\n然而穿过空间裂隙，科研船发现定位信号显示它们正在我们帝国的母星，准确的说是母星的巨娘领袖宅邸里。\n进一步确认的结果是...[event_target:gts_random_storm_leader_target.GetName]，波及数个星系的风暴正是来自她的后庭。\n这位巨大女神此刻正伸着懒腰，悠哉悠哉地倚在沙发上浏览文件。[event_target:gts_random_storm_leader_target.GetName]懒洋洋地享受饭后的清闲时光，感受着自己身体消化食物发出的肠鸣，在她的肠道内，我们的科研船则在黄褐色的浓雾中穿行，巨娘领袖强大的灵能力量允许她们自由控制身体大小，其代价便是餐后转化的许多营养无处吸收，便以气态的形式游荡在她们的肠胃里。肠道内菌群将它们染上了气味，空间裂隙则给了这些废气新的出口。这倒是缓解了[event_target:gts_random_storm_leader_target.GetName]的胀气，但那些笼罩在[event_target:gts_random_storm_leader_target.GetName]屁味里的星球们则倒了大霉。\n我们实在不敢确定这究竟只是一场意外，还是她利用自己的神力戏弄人间的新点子。幸好我们现在足够小，她还没发现我们。\n回到主世界，我们旁敲侧击地向[event_target:gts_random_storm_leader_target.GetName]提及了此事，她看起来颇为惊讶，大概是自己也没想到还能以这种方式摧毁银河，让无数生灵雌伏在她身体的分泌物下，希望这次经历不要让她觉醒一些不妙的爱好。\n至少她还算配合工作，行政部将派遣大量人员机械进入她的肠道里进行空气净化和降温，逐步减少肠道气体的进入量。她也会在这段时间内减少外出活动，安静地等待自己制造的这场风暴结束。宣传部门也会进行新闻管制，避免诸如“[event_target:gts_random_storm_leader_target.GetName]大人用屁穴熄灭恒星”之类虽然事实如此但会损害其个人形象的言论传播。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.63.desc: "The investigation into the source of the rear-orifice storm has succeeded!\nOur scientists discovered a warped spatial rift at the center of the storm. This kind of rift links two distant regions of space together. Because the two ends of the rift are not the same size, any matter passing through it is enlarged or reduced by hundreds of thousands of times due to spatial distortion. This explains the origin of this surging rear-orifice storm. In other words, the star systems now being swept by the rear-orifice storm are, at this very moment, also residing in some woman's rear passage.\nHowever, after passing through the spatial rift, the science ships found that their positioning signals placed them on our empire's homeworld, or more precisely, inside the giantess leader's mansion on the homeworld.\nFurther confirmation revealed...[event_target:gts_random_storm_leader_target.GetName]. The storm affecting several star systems is indeed coming from her rear passage.\nAt this moment, this gigantic goddess is stretching, leisurely leaning back on a sofa as she browses through documents. [event_target:gts_random_storm_leader_target.GetName] lazily enjoys her free time after a meal, feeling the intestinal sounds produced as her body digests its food. Inside her intestines, our science ships travel through a yellow-brown fog. The giantess leaders' powerful psionic abilities allow them to freely control their body size, but the price is that much of the nutrition transformed after meals has nowhere to be absorbed, and so wanders through their stomachs and intestines in gaseous form. Intestinal flora gives these gases their odor, while the spatial rift gives this waste gas a new outlet. This does relieve [event_target:gts_random_storm_leader_target.GetName]'s bloating, but the planets shrouded in [event_target:gts_random_storm_leader_target.GetName]'s fart odor are suffering terribly.\nWe truly cannot tell whether this is only an accident, or some new idea she has devised to toy with the mortal world using her divine power. Fortunately, we are now small enough that she has not noticed us.\nAfter returning to the main world, we indirectly mentioned the matter to [event_target:gts_random_storm_leader_target.GetName]. She seemed quite surprised, probably because even she had not expected that she could destroy the galaxy in this manner, forcing countless living beings to submit beneath her bodily secretions. We can only hope this experience does not awaken any troubling interests in her.\nAt least she is cooperating with the work. The Administration will dispatch large numbers of personnel and machines into her intestines to purify and cool the air, gradually reducing the amount of intestinal gas entering the rift. She will also reduce her outside activities during this period and wait quietly for the storm she created to end. The propaganda department will also impose news controls to prevent the spread of statements such as \"Lady [event_target:gts_random_storm_leader_target.GetName] extinguished a star with her rear orifice,\" which, although factual, would damage her personal image.\nOur scientists predict that this rift is unstable and will close completely within several months to several years. But the sweat storms that have already poured into the galaxy through the portal can only be left for time to resolve."
