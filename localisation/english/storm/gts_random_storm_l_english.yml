  #  对乳汁潮来源的调查最终无功而返，我方科学家的几次抵近考察都没能发现什么引人注意的异常现象，当然，这场吞星蔽日的乳汁潮本就是一团巨大的异常现象了。\n我们只能接受这样一个结论，或许确实是某位巨娘的些许乳汁从一个未探测到的方向飞入我们所在的这片星系，造成了这次太空风暴。\n只是按这规模推算，这世上总不能真的有银河般巨大的少女存在吧？
  gts_random_storm.47.desc: "The investigation into the source of the milk tide ultimately came to nothing. Several close-range surveys by our scientists failed to discover any noteworthy anomalies, though of course this star-devouring, sun-shrouding milk tide is itself one enormous anomaly.\nWe can only accept one conclusion: perhaps a small amount of milk from some giantess truly did fly into our region of space from an undetected direction, causing this space storm.\nBut judging by its scale, surely there cannot really be a girl as vast as the galaxy, can there?"
