  gts_random_storm.20.name: "Urine detected!"
  gts_random_storm.20.desc: "Scanners have detected a cosmic storm carrying massive amounts of Giantess Urine approaching our border. We have now named it <STORM Name>.\nSuch storms cause damage to all colonies and prevent our fleet from using emergency hyperspace travel. It is strongly recommended that all colonies in its path take immediate precautionary measures.\nThis storm is moving at an extremely high speed; even setting aside the danger of a direct hit, the corrosive components in this warm urine will have a devastating effect on ships and space stations, rendering their shields completely ineffective. Fleets unable to evacuate in time should immediately assume a storm-proof posture and issue chemical protection gear to their crews.\nSome scientists cannot believe that the Giantess’s urine could form a storm of astronomical proportions, and they are strongly demanding an investigation into the storm’s origin."
  gts_random_storm.21.name: "Still in the bladder"
  gts_random_storm.22.name: "Already peed"
  gts_random_storm.23.name: "Holding in urine"
  gts_random_storm.24.name: "Yu Zhu"
  gts_random_storm.25.desc: "The investigation into the source of the Urine Tide was a success! \nOur scientists discovered a twisted spatial rift at the center of the urine tide—a rift that connects two distant points in space. Since the two ends of the rift are not the same size, the flow of matter passing through it is magnified or shrunk by hundreds of thousands of times due to the spatial distortion, which explains the origin of this vast urine tide. In other words, the galaxies currently being swept up by the urine storm are, at this very moment, residing within a woman’s genitalia. \nHowever, upon passing through the spatial rift, the research vessel detected a location signal indicating they were on our Empire’s homeworld—more precisely, within the residence of the homeworld’s Giantess leader. \nFurther confirmation revealed that... [event_target:gts_random_storm_leader_target.GetName]—the storm affecting several galaxies originated from the remaining droplets of urine in her urethra. \nThis giant goddess was currently stretching lazily, leaning back on the sofa and perusing documents. Meanwhile, seeping through her short skirt and panties, the droplets of urine in her urethra flowed erratically with her slightest body movement, Our spacecraft, having taken off in a hurry, witnessed the moment these residual droplets merged into a spatial rift. One can imagine that soon another wave of urine will surge forth, engulfing several unfortunate planets. We really couldn’t be sure whether this was merely an accident or a new idea she’d come up with to toy with the human world using her divine powers. Fortunately, we’re small enough right now that she hasn’t spotted us yet. \nBack in the main world, we broached the subject with [event_target:gts_random_storm_leader_target.GetName] in a roundabout way, She seemed quite surprised—perhaps she hadn’t expected to be able to destroy the Milky Way in this way, forcing countless living beings to submit to her bodily secretions. We hope this experience doesn’t awaken any unsavory hobbies in her. \nAt least she’s cooperating with the effort. The Administrative Department will dispatch a large number of mechanical units into her urethra to construct flood barriers and drying devices, in order to prevent more urine from flowing into the Milky Way. She will also limit her outings during this period, quietly waiting for the storm she created to subside. The Public Relations Department will also impose news restrictions to prevent the spread of statements such as “[event_target:gts_random_storm_leader_target.GetName] extinguished a star while urinating”—statements that, while factually accurate, would damage her personal image. \nOur scientists predict that this rift is unstable and will close completely within a few months to a few years. However, the sweat storm that has already been poured into the Milky Way through the portal can only be left to time to resolve."
  gts_random_storm.26.desc: "Office Lady Going to the Bathroom"
  gts_random_storm.27.desc: "The investigation into the source of the urine tide ultimately came to nothing; several close-range surveys by our scientists failed to uncover any notable anomalies—though, of course, this urine tide, which swallowed stars and eclipsed the sun, was itself a massive anomaly. \nWe can only accept the conclusion that perhaps a small amount of urine from some Giantess flew into our galaxy from an undetected direction, causing this space storm.\nBut judging by the scale of the event, surely there can’t really be a girl as massive as the Milky Way out there, can there?"
  gts_random_storm.30.name: "A Whisper Storm has been detected!"
  gts_random_storm.30.desc: "Scanners have detected a cosmic storm carrying whispers from the Void approaching our borders. We have now named it <Storm Name>.\nSuch storms cause devastation to all colonies and prevent our fleet from using emergency hyperspace. It is strongly recommended that all colonies in its path take immediate precautionary measures.\nThe storm is colorless and formless, but all sentient beings within its reach will hear the murmuring whispers of a Giantess from beyond the heavens. The heavy, sorrowful emotions emanating from her cause the gravity of the entire galaxy to shift, causing buildings and fleets to collapse and become inoperable under their own weight, while even stars emit a stronger gravitational pull than usual, as if unwilling to let the planets and the Tiny persons on them escape her control. \nSome scientists could not believe that the Giantess’s murmurs could create a storm on the scale of an astronomical phenomenon, and they strongly demanded an investigation into the storm’s origin."
  gts_random_storm.30.b: "Investigate the Source of the Storm"
  gts_random_storm.31.name: "High School Girls' Takamatsu Lantern Festival"
  gts_random_storm.32.name: "Mahiru Ruzaki"
  gts_random_storm.33.name: "Princess Chong"
  gts_random_storm.40.name: "Milk surge detected!"
  gts_random_storm.40.desc: "Scanners have detected a cosmic storm carrying Giantess’s milk approaching our border. We have now named it <STORM Name>.\nSuch storms cause damage to all colonies and prevent our fleet from using emergency hyperspace. It is strongly recommended that all colonies in its path take immediate precautionary measures.\nThe rich milk can cause communication and self-maintenance systems on our fleet and structures to experience pressure overloads. However, we have unexpectedly discovered that this milk can serve as a rare industrial catalyst; at least for the time being, we can produce this milky-scented alloy at an extremely low cost.\nSome scientists cannot believe that a Giantess’s milk ejection could form a storm of astronomical proportions, and they are strongly demanding to investigate the source of this storm."
  gts_random_storm.41.desc: "Milk Secretary"
  gts_random_storm.42.desc: "It seems this mother's lactation period was a little longer than usual."
  gts_random_storm.43.desc: "Adolescence"
  gts_random_storm.44.desc: "The investigation into the origin of the Milk Tide has been a success! \nOur scientists have discovered a twisted spatial rift at the center of the Milky Way Tidal Wave—a rift that connects two distant regions of space. Because the two ends of the rift are of different sizes, the flow of matter passing through it is amplified or Shrinked by hundreds of thousands of times due to the spatial distortion, which explains the origin of this vast Milky Way Tidal Wave. In other words, the galaxies currently being swept up by the Milk Storm are, at this very moment, residing within the mammary glands of a certain woman. \nHowever, upon passing through the spatial rift, the research vessel detected a location signal indicating they were on our Empire’s homeworld—more precisely, within the residence of our homeworld’s Giantess Leader. \nFurther confirmation revealed that... [event_target:gts_random_storm_leader_target.GetName]—the storm affecting several galaxies originated from the milk within her soft breasts. \nThis giant goddess was currently stretching lazily, leaning back on the sofa and perusing documents. What she does not know is that with every breath she takes—or every slight sway of her chest—the tranquil sea of milk within her mammary glands instantly erupts into a raging storm, and a new tide of milk surges forth from a rift in space, flooding the surrounding galaxies. Separated by tens of thousands of kilometers of fat as thick as the Earth’s crust, as well as her bra and blouse, we quietly listened to [event_target:gts_random_storm_leader_target.GetName]’s gentle murmur. If it weren’t for the raging milk inside that could engulf our research vessel at any moment, we would almost wish to treat this place as the perfect refuge to welcome the end of the world. We really couldn’t be sure whether this was merely an accident or a new idea she’d come up with to tease the mortal world using her divine power. Fortunately, we’re small enough right now that she hasn’t spotted us yet. \nBack in the main world, we broached the subject with [event_target:gts_random_storm_leader_target.GetName] in a roundabout way. She seemed quite surprised—perhaps she hadn’t expected that she could destroy the galaxy in this manner, forcing countless living beings to submit to her bodily secretions. Let’s hope this experience doesn’t awaken any unsavory interests in her. \nAt least she’s been cooperative. The administrative department will dispatch a large number of personnel and machines into her mammary glands to install water level monitoring and storage devices, in order to prevent more milk from flooding into the Milky Way uncontrollably. She will also limit her outings during this period, quietly waiting for the storm she created to subside. The Public Relations Department will also impose news restrictions to prevent the spread of statements such as “[event_target:gts_random_storm_leader_target.GetName] extinguishes stars with her milk,” which, though factually accurate, would damage her personal image. \nOur scientists predict that this rift is unstable and will close completely within a few months to a few years. However, the sweat storm that has already been poured into the Milky Way through the portal can only be left to time to resolve."
  gts_random_storm.45.desc: "Ma Niang, a student studying abroad"
  gts_random_storm.46.desc: "Ship Girls Lactating"
  gts_random_storm.47.desc: "The investigation into the source of the milk tide ultimately came to nothing; several close-range surveys by our scientists failed to uncover any notable anomalies—though, of course, this star-swallowing, sun-obscuring milk tide was, in itself, a massive anomaly. \nWe can only accept the conclusion that perhaps a small amount of milk from some Giantess did indeed fly into our galaxy from an undetected direction, causing this space storm.\nBut judging by the scale of the event, surely there can’t really be a girl as massive as the Milky Way out there, can there?"
  gts_random_storm.50.name: "Foot Odor Storm Detected!"
  gts_random_storm.50.desc: "Scanners have detected a cosmic storm carrying a strong odor of Giantess’s foot odor approaching our border. We have now named it <STORM Name>.\nSuch storms cause damage to all colonies and prevent our fleet from using emergency hyperspace. It is strongly recommended that all colonies in its path take immediate precautionary measures. \nExposure to the intense odor of a Giantess’s feet can easily cloud the minds of our crew; therefore, to ensure safe navigation, all fleets within the storm must prioritize power allocation to active communication systems, rendering cloaking fields ineffective. However, for workers at mining stations, filtered foot odor serves as their best work stimulant. Our observation stations can also use this opportunity to observe the interesting behaviors of indigenous civilizations as the entire globe is engulfed by this Giantess foot odor disaster. \nSome scientists find it hard to believe that the foot odor of Giantesses could generate a storm on the scale of an astronomical phenomenon, and they are strongly demanding an investigation into the storm’s origin."
  gts_random_storm.51.desc: "The investigation into the source of the foot odor storm was a success! \nOur scientists discovered a distorted spatial rift at the center of the storm. This type of rift connects two distant regions of space. Since the two ends of the rift are not the same size, the flow of matter passing through it is amplified or shrunk by hundreds of thousands of times due to the spatial distortion—which explains the origin of this raging foot odor storm. In other words, the galaxies currently being swept up by the foot odor storm are, at this very moment, residing inside the shoes and socks of a certain woman."
  gts_random_storm.52.desc: "The investigation into the source of the foot odor storm was a success! \nOur scientists discovered a distorted spatial rift at the center of the storm. This type of rift connects two distant regions of space. Since the two ends of the rift are not the same size, the flow of matter passing through it is amplified or shrunk by hundreds of thousands of times due to the spatial distortion—which explains the origin of this raging foot odor storm. In other words, the galaxies currently being swept up by the foot odor storm are, at this very moment, residing inside the shoes and socks of a certain woman."
  gts_random_storm.54.desc: "The investigation into the source of the foot odor storm was a success! \nOur scientists discovered a distorted spatial rift at the center of the storm. This type of rift connects two distant regions of space. Since the two ends of the rift are not the same size, the flow of matter passing through it is amplified or shrunk by hundreds of thousands of times due to the spatial distortion—which explains the origin of this raging foot odor storm. In other words, the galaxies currently being swept up by the foot odor storm are, at this very moment, residing inside the shoes and socks of a certain woman."
  gts_random_storm.55.desc: "The investigation into the source of the foot odor storm was a success! \nOur scientists discovered a distorted spatial rift at the center of the storm. This type of rift connects two distant regions of space. Since the two ends of the rift are not the same size, the flow of matter passing through it is amplified or shrunk by hundreds of thousands of times due to the spatial distortion—which explains the origin of this raging foot odor storm. In other words, the galaxies currently being swept up by the foot odor storm are, at this very moment, residing inside the shoes and socks of a certain woman."
  gts_random_storm.53.desc: "The investigation into the source of the foot odor storm was a success! \nOur scientists discovered a distorted spatial rift at the center of the storm. This type of rift connects two distant regions of space. Since the two ends of the rift are not the same size, the flow of matter passing through it is amplified or shrunk by hundreds of thousands of times due to the spatial distortion—which explains the origin of this raging foot odor storm. In other words, the galaxies currently being swept up by the foot odor storm are, at this very moment, residing inside the shoes and socks of a certain woman. \nHowever, upon passing through the spatial rift, the research vessel detected a location signal indicating they were on our Empire’s homeworld—more precisely, within the residence of the homeworld’s Giantess Leader. \nFurther confirmation revealed that... [event_target:gts_random_storm_leader_target.GetName]—the storm affecting several galaxies originated from the foot odor inside her shoes and socks. \nThis giant goddess is currently stretching lazily, leaning back on the sofa and browsing through documents. Her feet, clad in white cotton socks, dangle from her slippers, her toes spreading out at ease. \nHowever, the scene inside her cotton socks is not quite so pleasant. [event_target:gts_random_storm_leader_target.GetName] The foot sweat secreted throughout the day had been fully absorbed and hardened by the sock fibers, blocking normal air circulation inside the socks. As a result, the entire world inside the socks had turned into a stinking furnace, warmed by [event_target:gts_random_storm_leader_target.GetName]’s body heat and the evaporating sweat. Eventually, the unconscious wiggling of the soles of the feet sent a steady stream of hot air from inside the socks into the spatial rift, where it scattered throughout the cosmos. Meanwhile, the culprit behind it all continues to stretch her feet, curling and uncurling her toes—crushing the spaceships and satellites swept into the spatial fissures into fragments, which then stick to her feet, becoming imperceptible adornments. We really can’t be sure if this was just an accident or a new way for her to use her divine power to play tricks on the mortal world. Fortunately, we’re small enough right now that she hasn’t spotted us yet. \nBack in the main world, we broached the subject with [event_target:gts_random_storm_leader_target.GetName] in a roundabout way. She seemed quite surprised—perhaps she hadn’t expected to be able to destroy the galaxy in this manner, forcing countless living beings to cower beneath her bodily secretions. Let’s hope this experience doesn’t awaken any unsavory hobbies in her.\nAt least she’s cooperating with the investigation. The administrative department will dispatch a large number of mechanical units to enter her socks and thoroughly clean the crevices between the cotton socks to ensure proper ventilation. She will also reduce her outdoor activities during this time, quietly waiting for the storm she created to subside. The Public Relations Department will also impose news restrictions to prevent the spread of statements such as “[event_target:gts_random_storm_leader_target.GetName] extinguishes stars with her jade-like feet clad in white silk stockings”—statements that, while factual, would damage her personal image. \nOur scientists predict that this fissure is unstable and will close completely within a few months to a few years. However, the sweat storm that has already poured into the Milky Way through the portal can only be left to time to resolve."
  gts_random_storm.56.desc: "The investigation into the source of the foot odor storm was a success! \nOur scientists discovered a distorted spatial rift at the storm’s center—a rift that connects two distant regions of space. Since the two ends of the rift are not the same size, the flow of matter passing through it is amplified or shrunk by hundreds of thousands of times due to the spatial distortion, which explains the origin of this raging foot odor storm. In other words, the galaxies currently being swept up by the foot odor storm are, at this very moment, residing inside the shoes and socks of a certain young woman. \nThe business specialist traveling with us recognized this young woman—she is the heiress to one of our branch companies."
  gts_random_storm.57.desc: "The investigation into the source of the foot odor storm ultimately came to nothing. Several close-range surveys by our scientists failed to uncover any notable anomalies—though, of course, this foot odor storm, which obscured the stars and blocked out the sun, was itself a massive anomaly. \nWe can only accept the conclusion that perhaps a Giantess’s shoes and socks are indeed somewhere near our galaxy, and the odor they emit caused this space storm.\nBut judging by the scale of this phenomenon, surely there can’t really be a girl as massive as the Milky Way out there, can there?"
