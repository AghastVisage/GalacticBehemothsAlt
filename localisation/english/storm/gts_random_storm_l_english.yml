  # 扫描仪探测到一场裹挟着海量巨娘爱液的宇宙风暴正逼近我方边境。\n满溢着巨娘荷尔蒙的爱液潮对我们来说极为危险，除了训练有素的灵能使，巨娘爱液会让每个接触到的人瞬间发情，这将显著降低我们殖民地的稳定度。但对于装备了灵能导航设备的我国舰队来说，爱液覆膜反而能大幅提高我们舰队的战斗力，唯一需要防备的只有这飘忽不定的风暴本身了。\n一些科学家无法相信巨娘的潮吹能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.77.desc: "Our scanners have detected a cosmic storm carrying massive amounts of Giantess love fluid approaching our border. \nThis tide of love fluid, overflowing with Giantess hormones, poses an extreme danger to us. Except for highly trained Psionic Energy users, the Giantess love fluid will instantly arouse anyone who comes into contact with it, which will significantly undermine the stability of our colony. However, for our fleet equipped with psionic energy navigation devices, this coating of Love fluid actually greatly enhances our combat effectiveness. The only thing we need to guard against is the unpredictable storm itself. \nSome scientists cannot believe that a Giantess's squirting could form a storm of astronomical proportions, and they are strongly demanding to investigate the source of this storm."
