  #  扫描仪探测到一场裹挟着巨娘乳汁的宇宙风暴正逼近我方边境。我们现已将其命名为<风暴名>。\n这类风暴会对所有殖民地造成破坏，并妨碍我们的舰队使用紧急超光速。强烈建议所有在其行进路线上的殖民地立即采取预防措施。\n浓郁的乳汁会让我们的舰队和建筑的通讯与自维护系统压力过载。不过，我们意外发现这种乳液可以充当某种稀有的工业催化剂，至少在这段时间内，我们可以以极低的成本生产这种带着奶香味的合金。\n一些科学家无法相信巨娘的喷乳能够形成天文现象级别的风暴，她们强烈要求去调查这场风暴的来源。
  gts_random_storm.40.desc: "Scanners have detected a cosmic storm carrying giantess milk approaching our borders. We have now named it <Storm Name>.\nStorms of this kind will damage all colonies and prevent our fleets from using emergency FTL. All colonies in its path are strongly advised to take immediate precautions.\nThe dense milk will overload the communications and self-maintenance systems of our fleets and structures. However, we have unexpectedly discovered that this fluid can serve as a rare industrial catalyst of sorts. At least for the duration, we can produce this milk-scented alloy at extremely low cost.\nSome scientists cannot believe that a giantess's lactation could form an astronomical storm, and they are insisting on investigating the storm's source."
