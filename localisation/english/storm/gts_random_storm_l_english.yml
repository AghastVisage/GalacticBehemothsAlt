  #  风暴源调查成功
  gts_random_storm.25.name: "Storm Source Investigation Successful"
  #  对尿液潮来源的调查成功了！\n我们的科学家在尿液潮中心发现了一个扭曲的空间裂隙，这种裂隙会将两个遥远的空间链接起来，由于两头的裂隙不一样大，通过该裂隙的物质流动都会因空间扭曲而被放大或缩小数十万倍，这就解释了这浩瀚的尿液潮的由来。换句话说，那些正在被尿液风暴席卷的星系，此刻也栖居在某位女性的下体里。\n然而穿过空间裂隙，科研船发现定位信号显示它们正在我们帝国的母星，准确的说是母星的巨娘领袖宅邸里。\n进一步确认的结果是...[event_target:gts_random_storm_leader_target.GetName]，波及数个星系的风暴正是源自她尿道里余下的点点尿滴。\n这位巨大女神此刻正悠哉悠哉地伸着懒腰，倚在沙发上浏览文件。与此同时，穿过她的短裙和内裤，她尿道里的尿珠因为她最轻微的身体动作无规则地流淌着，我们紧急起飞的飞船目睹了这些余尿汇入空间裂隙的时刻，可以想象很快又一批新的尿液潮将会汹涌而出，吞没几颗倒霉的星球。我们实在不敢确定这究竟只是一场意外，还是她利用自己的神力戏弄人间的新点子。幸好我们现在足够小，她还没发现我们。\n回到主世界，我们旁敲侧击地向[event_target:gts_random_storm_leader_target.GetName]提及了此事，她看起来颇为惊讶，大概是自己也没想到还能以这种方式摧毁银河，让无数生灵雌伏在她身体的分泌物下，希望这次经历不要让她觉醒一些不妙的爱好。\n至少她还算配合工作，行政部将派遣大量人员机械进入她的尿道内建立拦洪坝和烘干装置，以阻止更多尿液流进银河中。她也会在这段时间内减少外出活动，安静地等待自己制造的这场风暴结束。宣传部门也会进行新闻管制，避免诸如“[event_target:gts_random_storm_leader_target.GetName]大人在尿尿时熄灭恒星”之类虽然事实如此但会损害其个人形象的言论传播。\n我们的科学家预测这种裂隙的存在并不稳定，它会在数月到数年内彻底关闭。但那些已经由传送门灌入银河系的汗液风暴只能留给时间去解决了。
  gts_random_storm.25.desc: "The investigation into the source of the urine tide has succeeded!\nOur scientists discovered a distorted spatial rift at the center of the urine tide. This kind of rift links two distant spaces together. Because the rifts at the two ends are not the same size, any matter flowing through the rift is enlarged or reduced hundreds of thousands of times by spatial distortion, explaining the origin of this vast urine tide. In other words, the systems currently being swept by the urine storm are also residing inside a certain woman's lower body at this very moment.\nHowever, after passing through the spatial rift, the science ship found that its positioning signal indicated it was on our empire's homeworld, or more precisely, inside the giantess leader's residence on the homeworld.\nFurther confirmation showed that it was... [event_target:gts_random_storm_leader_target.GetName]. The storm affecting several systems originated from the remaining tiny droplets of urine in her urethra.\nThis enormous goddess is currently leisurely stretching, leaning on the sofa, and browsing documents. Meanwhile, through her short skirt and underwear, the droplets of urine in her urethra flow irregularly with even the slightest movement of her body. Our ship, taking off in emergency, witnessed the moment these remaining drops of urine flowed into the spatial rift. It is easy to imagine that another new batch of urine tide will soon surge out and engulf several unlucky planets. We truly cannot be sure whether this is merely an accident or a new idea she devised to tease the mortal world with her divine power. Fortunately, we are now small enough that she has not discovered us.\nAfter returning to the main world, we indirectly mentioned this matter to [event_target:gts_random_storm_leader_target.GetName]. She looked rather surprised, probably because even she had not expected that she could destroy the galaxy in this way and make countless living beings submit beneath her bodily secretions. We hope this experience does not awaken any unfortunate tastes in her.\nAt least she is reasonably cooperative. The Administration will dispatch large numbers of personnel and machines into her urethra to build flood-control dams and drying devices, preventing more urine from flowing into the galaxy. During this period, she will also reduce her outings and quietly wait for this storm she created to end. The Propaganda Department will also impose news controls to prevent the spread of statements such as \"Lady [event_target:gts_random_storm_leader_target.GetName] extinguished stars while urinating,\" which, though factual, would damage her personal image.\nOur scientists predict that this rift is unstable and will close completely within months to years. But the sweat storms that have already poured into the galaxy through the portal can only be left for time to resolve."
