l_english:
  # 小人饲养者
  gts_leader_trait_micro_master: "Micro-Creature Breeder"
  # 这位领袖在私下里很喜欢饲养各种各样的微小生物。
  gts_leader_trait_micro_master_desc: "This leader secretly enjoys breeding all sorts of tiny creatures."
  # 小人饲养者II
  gts_leader_trait_micro_master_2: "Micro-Creature Breeder II"
  # 这位领袖是饲养小人方面的专家，她的家中饲养了无数种不同类型的小人。
  gts_leader_trait_micro_master_2_desc: "This leader is an expert in breeding micro-creatures, with countless types of small beings kept in their home."
  # 城市管理者
  gts_leader_trait_micro_city_master: "City Manager"
  # 这位领袖的业余爱好就是收集各种各样的小人城市
  gts_leader_trait_micro_city_master_desc: "This leader's hobby is collecting all sorts of miniature cities."
  # 城市管理者II
  gts_leader_trait_micro_city_master_2: "City Manager II"
  # 这位领袖精通各种小人城市的调教方法，是城市管理学的专家
  gts_leader_trait_micro_city_master_2_desc: "This leader is proficient in various methods of training miniature cities and is an expert in city management."
  # 异世界传送门
  gts_leader_trait_micro_planet_master: "Otherworld Portal"
  # 仅仅是尺度分作宏观微观的同种材料为何具有天差地别的强度差异？一个稳定的时空连续体又是如何被分解为无数不连续段的？一个切实的样本或许能令交织重叠的次元法则更好解释一些。\n\n这位领袖拥有一个不为人知的异世界传送门，通过观察对面渺小的宇宙与这个世界的接缝，她在次元领域的见解可谓入木三分。\n\n此外，她也愿意与帝国分享那些小小的星球。
  gts_leader_trait_micro_planet_master_desc: "Why is the same material so drastically different in strength when scaled macroscopically versus microscopically? How is a stable space-time continuum broken down into countless discontinuous segments? A tangible sample might help to better explain these interwoven dimensional laws.\n\nThis leader possesses a secret otherworldly portal. By observing the seams between the minuscule universe on the other side of the portal and this world, their understanding of the dimensional realm is exceptionally profound.\n\nMoreover, they are willing to share those tiny planets with the empire."
  # 沉迷于缩小人
  gts_leader_trait_micro_phila: "Addicted to Shrinking People"
  # 这位领袖沉迷于开发缩小人的各种玩法，以至于需要消耗帝国的缩小人资源
  gts_leader_trait_micro_phila_desc: "This leader is addicted to developing various ways to play with shrunken people, to the point of consuming the empire's shrinking person resources."
  # 重度缩小人依赖
  gts_leader_trait_micro_phila_2: "Severe Shrinking Person Dependency"
  # 这位领袖几乎无时无刻不在玩弄缩小人，一旦不玩的话就会产生严重的戒断反应
  gts_leader_trait_micro_phila_2_desc: "This leader plays with shrunken people almost constantly, suffering severe withdrawal symptoms if they do not."
  # 沉迷于缩小城市
  gts_leader_trait_micro_city_phila: "Addicted to Shrinking Cities"
  # 这位领袖沉迷于开发缩小城市的各种玩法，以至于需要消耗帝国的缩小城市资源
  gts_leader_trait_micro_city_phila_desc: "This leader is addicted to developing various ways to play with shrunken cities, to the point of consuming the empire's shrinking city resources."
  # 重度缩小城市依赖
  gts_leader_trait_micro_city_phila_2: "Severe Shrinking City Dependency"
  # 这位领袖几乎无时无刻不在玩弄缩小城市，一旦不玩的话就会产生严重的戒断反应
  gts_leader_trait_micro_city_phila_2_desc: "This leader plays with shrunken cities almost constantly, suffering severe withdrawal symptoms if they do not."
  # 维护模块
  trait_Weihumokuai: "Maintenance Module"
  # 我们的制造者细心地考虑到了自己无意识行为对我们的毁灭性危害。\n§Y\"耐酸,抗挤压,防漏水,嗯,都准备好了,为什么要耐酸？啊哈哈..."§!
  trait_Weihumokuai_desc: "Our creators carefully considered the destructive impact of their unconscious actions on us. \n§Y\"Acid-resistant, crush-resistant, leak-proof, hmm, all prepared. Why acid-resistant? Ahaha...\"§!"
  # 外交模块
  trait_Waijiaomokuai: "Diplomacy Module"
  # 为了便于外交,我们的制造者在创造我们的外貌与交际系统时投入了大量心血,但她随后就如皮格马利翁一般对自己的造物产生了不恰当的感情。\n§Y\"我...我才没有...只是你们这么渺小,要是在其他星球出了事怎么办\"§!
  trait_Waijiaomokuai_desc: "For ease of diplomacy, our creators invested a great deal of effort in creating our appearance and communication systems, but then, like Pygmalion, they developed inappropriate feelings for their own creations.\n§Y\"I...I don't...it's just that you're all so tiny, what if something happened to you on another planet?\"§!"
  # 自检模块
  trait_Zijianmokuai: "Self-Check Module"
  # 我们的制造者为我们装上高效处理器以回避危险并迅速报告机体损害。出于某种目的,她还在我们的机体里装满了番茄汁。\n§Y\"在我的脚下逃窜吧!你们这些小虫子\"\n\"可我们并没有恐惧情绪,而且我们不并属于节肢类有机体\"\n\"...无路赛!\"§!
  trait_Zijianmokuai_desc: "Our creators installed high-performance processors in us to avoid danger and quickly report damage. For some reason, they also filled our bodies with tomato juice. \n§Y\"Flee beneath my feet, you little bugs!\"\n\"But we don't have emotions of fear, and we're not arthropods.\"\n\"...Shut up!\"§!"
  # 逻辑模块
  trait_Luojimokuai: "Logic Module"
  # 我们的制造者特意优化了我们的逻辑程序，以保证我们能最大化对她的躯体进行清洁。
  trait_Luojimokuai_desc: "Our creators specifically optimized our logic programs to ensure we could maximize the cleaning of her body."
  # §M灵能罐头§!
  trait_Lingneng_robot: "§MThe Psionic Can§!"
  # 与有机体制造的简陋机械不同，我们的机体被灌输了灵能。用有机体的话来讲，我们也是有灵魂的。
  trait_Lingneng_robot_desc: "Unlike the crude machines made by organics, our bodies are imbued with psionic energy. In organic terms, we also have souls."
  # 伟大种族
  trait_great_species: "Great Species"
  # 巨娘们认为她们是银河中唯一的优秀物种，并理所当然的认为，其它物种皆为蝼蚁\n\n§Y万星之海中，只有我们最为伟大！§!
  trait_great_species_desc: "The giantesses believe they are the only superior species in the galaxy, and naturally consider all other species to be insignificant ants.\n\n§YIn the sea of countless stars, only we are the greatest!§!"
  # $trait_great_species$
  concept_trait_great_species: "$trait_great_species$"
  # §L$trait_great_species_desc$§!
  concept_trait_great_species_desc: "§L$trait_great_species_desc$§!"
  # 天体级生物
  trait_Ultra: "Celestial-Level Being"
  # 即使是博学如策展人，悠久如堕落帝国，都从未见过如此巨大的高级智慧物种。§Y它们身体投下的阴影可以淹没帝国，身上的代谢物可以压裂星球§!。被它们光顾的星系的居民只能瑟瑟发抖,祈求着它们尽早离开，或给自己一个痛快。
  trait_Ultra_desc: "Even erudite curators and ancient fallen empires have never seen such enormous advanced species. §YThe shadows cast by their bodies can engulf empires, and their metabolic waste can crack planets§!. Inhabitants of systems visited by them can only tremble, praying they will leave soon, or put them out of their misery."
  # 每100£pop£人口的['concept_gts_pop_use']: §R*100§!\n$TABBED_NEW_LINE$ - §S泛指所有已知的比行星大的巨娘§!$TABBED_NEW_LINE$ - §S大多数天体级巨娘平常都维持在可观测水平§!$TABBED_NEW_LINE$ - §S请不要让太阳系撞到她的身体上§!
  trait_Ultra_effect: "Workforce: §G+9990%§! \n  - §SRefers generally to all known giantesses larger than planets§!\n  - §SMost Celestial-level giantesses usually remain at observable levels§!\n  - §SPlease don't let the Solar System collide with her body§!"
  # $trait_Ultra$
  concept_trait_Ultra: "$trait_Ultra$"
  # §L$trait_Ultra_desc$§!
  concept_trait_Ultra_desc: "§L$trait_Ultra_desc$§!"
  # 泰坦级生物
  trait_Titan: "Titan-Level Being"
  # 这个物种的身高已经有§Y数千米甚至万米§!，这么巨大的生物非常罕见，她们可以轻易改变一个星球的地貌，不经意间的动作就能给小人们带来巨大的灾难，这种体型使它们在进行宏观科学研究和巨型工程建设上更加得心应手。
  trait_Titan_desc: "This species is already §Ythousands to tens of thousands of meters§! tall. Such enormous beings are extremely rare. They can easily change the topography of a planet, and casual actions can bring great disasters to little people. This size makes them more adept at conducting macroscopic scientific research and large-scale construction.\n\n§YA pop roughly corresponds to one individual (1:1)§!"
  # 每100£pop£人口的['concept_gts_pop_use']: §R*5§!\n$TABBED_NEW_LINE$ - §S经常会不小心地踩进小人城市§!$TABBED_NEW_LINE$ - §S体型越大性欲越强§!$TABBED_NEW_LINE$ - §S受到其他渺小物种的崇拜§!
  trait_Titan_effect: "§SThey often accidentally step into little people cities§!\n§SThe larger the body, the stronger the libido§!\n§SThey are worshipped by other diminutive species§!"
  # $trait_Titan$
  concept_trait_Titan: "$trait_Titan$"
  # §L$trait_Titan_desc$§!
  concept_trait_Titan_desc: "§L$trait_Titan_desc$§!"
  # 体型巨大
  trait_Giant: "Gigantic Size"
  # 这个物种的身高§Y数百米§!，略高于宇宙平均水平，其他小型物种的摩天大楼在它们看来就像玩具一样，她们人数稀少，却可以统治几亿倍于自己数量的小型生物
  trait_Giant_desc: "This species is §Yhundreds of meters§! tall, slightly above the average height in the universe. Skyscrapers of other smaller species look like toys to them. They are few in number, but they can rule over billions of times their own number in smaller creatures. \n\n§YA pop roughly corresponds to one thousand individuals (1:1,000)§!"
  # 每100£pop£人口的['concept_gts_pop_use']: §R*3.5§!\n$TABBED_NEW_LINE$ - §S城市的毁灭者§!$TABBED_NEW_LINE$ - §S小人的噩梦§!$TABBED_NEW_LINE$ - §S祈祷你的巨娘邻居不是灭绝政体§!
  trait_Giant_effect: "§SThe destroyers of cities§!\n§SThe nightmare of little people§!\n§SPray your giantess neighbor is not an exterminator government§!"
  # $trait_Giant$
  concept_trait_Giant: "$trait_Giant$"
  # §L$trait_Giant_desc$§!
  concept_trait_Giant_desc: "§L$trait_Giant_desc$§!"
  # 体型高大
  trait_Tall: "Tall Build"
  # 体型在§Y几米到十几米左右§!，这些生物拥有更强大的力量，她们是最有效率的劳工，一个人就可以完成几千个小人才能做到的任务。
  trait_Tall_desc: "Their height ranges from §Ya few meters to over ten meters§! These beings possess greater strength. They are the most efficient workers, and one person can complete the tasks of thousands of little people.\n\n§YA pop roughly corresponds to one million individuals (1:1,000,000)§!"
  # 每100£pop£人口的['concept_gts_pop_use']: §R*2§!\n$TABBED_NEW_LINE$ - §S高女果然很色§!$TABBED_NEW_LINE$ - §S再加点超性能就完美了§!
  trait_Tall_effect: "§SOf course tall women are very hot§!\n§SAdding more hyperspecifications makes them perfect§!"
  # $trait_Tall$
  concept_trait_Tall: "$trait_Tall$"
  # §L$trait_Tall_desc$§!
  concept_trait_Tall_desc: "§L$trait_Tall_desc$§!"
  # 体型正常
  trait_Normal: "Normal Build"
  # 这个物种的体型与宇宙智慧物种的§Y平均身高大致相等§!，最常见的生物，工作种类最为多样，主要为更大的生物服务为生，也因为在体型属于中间位置，所以很适合与其他大小的种族进行贸易
  trait_Normal_desc: "The body size of this species is roughly equal to the §Yaverage height§! of intelligent species in the universe. The most common type of being, their job variety is the most diverse. They primarily serve larger creatures or trade with other races of varied sizes, due to being in the mid-range of size.\n\n§YA pop roughly corresponds to five hundred million individuals (1:500,000,000)§!"
  # §S在本mod中被视为小人§!$TABBED_NEW_LINE$ - §S多重大小最棒了§!
  trait_Normal_effect: "§SConsidered little people in this mod§!\n§SHaving multiple sizes is the best!§!"
  # $trait_Normal$
  concept_trait_Normal: "$trait_Normal$"
  # §L$trait_Normal_desc$§!
  concept_trait_Normal_desc: "§L$trait_Normal_desc$§!"
  # 体型矮小
  trait_Small: "Small Build"
  # 这个物种的体型只有§Y几厘米到几十厘米§!，低于宇宙平均水平，其他大型物种的无心之举都有可能给它们带来不小的麻烦。她们繁殖快，消耗少，是某些巨娘的食物来源，有些也会被当做宠物饲养，似乎矮小的体型还赋予了它们格外坚固的身体结构。
  trait_Small_desc: "This species is only §Ya few centimeters to a few tens of centimeters§! tall, below the average height in the universe. The unintentional actions of other large species can cause them significant trouble. They reproduce quickly, consume less, and are a food source for some giantesses. Some are also kept as pets. Their small size seems to have given them an especially sturdy body structure.\n\n§YA pop roughly corresponds to one hundred billion individuals (1:10^11)§!"
  # 每100£pop£人口的维护费: §R*0.75§!\n$TABBED_NEW_LINE$ - §S一种常见的零食，经常被加工成番茄酱§!$TABBED_NEW_LINE$ - §S饲养起来很容易§!$TABBED_NEW_LINE$ - §S是目前的网红宠物§!$TABBED_NEW_LINE$ - §M(防御军队死亡时有20%的机率重生一次)§!
  trait_Small_effect: "§SA common snack, often processed into ketchup§!\n§SEasy to raise§!\n§SThe current internet celebrity pets§!\n§SDon't you dare call them dwarves!§!"
  # $trait_Small$
  concept_trait_Small: "$trait_Small$"
  # §L$trait_Small_desc$§!
  concept_trait_Small_desc: "§L$trait_Small_desc$§!"
  # 体型微小
  trait_Tiny: "Tiny Build"
  # 这个物种的体型只有§Y毫米大小§!，普通 maiden的一双鞋子都可以成为他们的居住区，一些更小的生物甚至可以寄生在其他巨大生物的身体和衣服中间，分解巨娘身上的代谢废物为生，得益于微小的体型，他们对于世界微观组成方面的研究更为方便
  trait_Tiny_desc: "This species is only §Ya few millimeters§! in size. A single pair of ordinary girl's shoes can become their living area. Some even smaller beings can parasite on the bodies and clothes of other giant creatures, feeding on the metabolic waste of the giantesses. Thanks to their tiny size, they find it easier to study the micro-structures of the world.\n\n§YA pop roughly corresponds to one quadrillion individuals (1:10^14)§!"
  # 每100£pop£人口的维护费: §R*0.5§!\n$TABBED_NEW_LINE$ - §S是各种城市play的主力物种§!$TABBED_NEW_LINE$ - §S会在各种地方繁殖以至于巨娘们不得不清理这些虫子§!$TABBED_NEW_LINE$ - §S据说这些虫子根本不在乎被用各种姿势消灭§!$TABBED_NEW_LINE$ - §M(防御军队死亡时有40%的机率重生一次)§!
  trait_Tiny_effect: "§SThey are the main species for various city play scenarios§!\n§SThey reproduce in various places to the point that giantesses have to clean these bugs up constantly§!\n§SIt's said that these bugs simply do not care about being exterminated in various ways.§!"
  # $trait_Tiny$
  concept_trait_Tiny: "$trait_Tiny$"
  # §L$trait_Tiny_desc$§!
  concept_trait_Tiny_desc: "§L$trait_Tiny_desc$§!"
  # 微生物
  trait_Micro: "Microbial"
  # 这个物种的身高只有惊人的§Y几十微米甚至更小§!，微米大小的智慧生物几乎不存在，她们甚至比一般的细菌还要渺小，正常生物的一小滴体液都能成为她们繁衍生息的场所，不禁让人怀疑它们是怎样建立文明并与其他物种建立联系的，得益于海量的人口，微生物社会的进化速度要远超其他物种
  trait_Micro_desc: "This species is an astonishing §Ytens of micrometers or even smaller§!. Intelligent creatures at micrometer scale are almost non-existent. They are even smaller than common bacteria. A single drop of fluid from a normal species can become their habitat. It's hard to imagine how they established civilization and established contact with other species. Thanks to their massive population, the evolution speed of microbial societies far exceeds other species.\n\n§YA pop roughly corresponds to one quintillion individuals (1:10^17)§!"
  # 每100£pop£人口的维护费: §R*0.1§!\n$TABBED_NEW_LINE$ - §S有些巨娘喜欢在身体上饲养这种微生物§!$TABBED_NEW_LINE$ - §S抖M才会用这个体型游玩§!$TABBED_NEW_LINE$ - §M(防御军队死亡时有60%的机率重生一次)§!
  trait_Micro_effect: "\n§SSome giantesses like to cultivate this kind of microorganism on their bodies§!\n§SOnly masochists would play at this size§!"
  # $trait_Micro$
  concept_trait_Micro: "$trait_Micro$"
  # §L$trait_Micro_desc$§!
  concept_trait_Micro_desc: "§L$trait_Micro_desc$§!"
  # 分子生物
  trait_Nano: "Molecular Being"
  # 这个物种§Y小到无法观测§!，如何在这么小的尺寸下保持如此复杂的生命结构？这些分子生物的起源至今是个谜团。不过可以确定的是，就连微生物在它们眼里都如同星球一般巨大。
  trait_Nano_desc: "This species is so §Ysmall as to be unobservable§!. How they maintain such complex life structures at such a small size remains a mystery. However, what's certain is that even microorganisms appear like planets to them."
  # 每100£pop£人口的维护费: §R*0§!\n$TABBED_NEW_LINE$ - §S不会真的有人想用这个体型吧？§!$TABBED_NEW_LINE$ - §M(防御军队死亡时有80%的机率重生一次)§!
  trait_Nano_effect: "§SSurely no one wants to play at this size?§!"
  # $trait_Nano$
  concept_trait_Nano: "$trait_Nano$"
  # §L$trait_Nano_desc$§!
  concept_trait_Nano_desc: "§L$trait_Nano_desc$§!"
  # 安于现状
  trait_Anyuxianzhuang: "Content with Status Quo"
  # 或许是认识到了人外有人巨外有巨，这个物种安然接受了自己的小小体型，而将精力用在更有意义的事上
  trait_Anyuxianzhuang_desc: "Perhaps recognizing that there are larger beings beyond them, this species readily accepts their small size and focuses their energy on more meaningful matters."
  # \"卵生\
  trait_Luanzi: "\"Oviparous\"
  # 这个物种发源于一个极其特殊的自然环境下，对于其他的星球，他们没兴趣，也不适应。
  trait_Luanzi_desc: "This species originated in an extremely special natural environment. They have no interest in or are not adapted to other planets."
  # 巨娘宜居偏好
  trait_Beironghe: "Giantess Habitation Preference"
  # 经过调教与基因编辑，这个物种已经实现了与巨娘的高度融合，他们的身体已经适应了巨娘体内的恶劣环境，并很难摆脱对巨娘体液的依赖。
  trait_Beironghe_desc: "Through training and genetic editing, this species has achieved a high degree of integration with the giantesses. Their bodies have adapted to the harsh environment inside a giantess and have difficulty escaping their dependence on giantess fluids."
  # 微型生命体寄居
  trait_Jiju: "Micro-Life Inhabited"
  # 一种微小的生物群落定居在这个物种体内，并与其宿主形成了良好的共生关系。
  trait_Jiju_desc: "A small community of miniature beings lives within the bodies of this species and has formed a good symbiotic relationship with their host."
  # 缺乏微型生命体
  trait_Jiju_anti: "Lacking Micro-Life"
  # 这一物种在驱逐了体内的微型生命体后很快表现出衰弱和迟钝的性状，毕竟这个物种得以早早成为智慧生命的原因正是那些微生生命无微不至的照料，虽然在现代医学和智能机械的协助下她们不至于倒退回茹毛饮血的野兽，但这也足够给这个种族的发展进程当头一棒了。
  trait_Jiju_anti_desc: "This species quickly showed signs of weakness and sluggishness after expelling the miniature lifeforms within their bodies. After all, the reason this species became intelligent so early was thanks to the meticulous care of those miniature lifeforms. Although they are not regressing to wild beasts thanks to the help of modern medicine and intelligent machines, it is enough to give their race's development process a serious blow."
  # 倾国倾城
  trait_gts_beautiful: "Nation-Toppling Beauty"
  # 这个物种极受欢迎的外表无疑是上天的馈赠，即使是她们的敌人在见到她们时也不由得心动。
  trait_gts_beautiful_desc: "This species' extremely popular appearance is undoubtedly a gift from the heavens. Even their enemies are moved upon seeing them."
  # 巨娘开局
  trait_gts_begin: "Giantess Start"
  # 这个物种诞生在银河系时是巨娘，只能拥有以下几种体型：\n\n - ['concept_trait_great_species']\n - ['concept_trait_Ultra']\n - ['concept_trait_Titan']\n - ['concept_trait_Giant']\n - ['concept_trait_Tall']\n\n如果没有选择体型直接进入游戏，会随机获得其中一种可行的体型
  trait_gts_begin_desc: "This species is born as a giantess in the galaxy and can only have the following body sizes:\n\n-['concept_trait_great_species']\n-['concept_trait_Ultra']\n-['concept_trait_Titan']\n-['concept_trait_Giant']\n-['concept_trait_Tall']\n\nIf no body size is selected upon entering the game, one of these feasible options is randomly assigned."
  # 小人开局
  trait_tiny_begin: "Little Person Start"
  # 这个物种诞生在银河系时是小人，只能拥有以下几种体型：\n\n - ['concept_trait_Normal']\n - ['concept_trait_Small']\n - ['concept_trait_Tiny']\n - ['concept_trait_Micro']\n - ['concept_trait_Nano']\n\n如果没有选择体型直接进入游戏，会随机获得其中一种可行的体型
  trait_tiny_begin_desc: "This species is born as a little person in the galaxy and can only have the following body sizes:\n\n-['concept_trait_Normal']\n-['concept_trait_Small']\n-['concept_trait_Tiny']\n-['concept_trait_Micro']\n-['concept_trait_Nano']\n\nIf no body size is selected upon entering the game, one of these feasible options is randomly assigned."
  # 星系级生物
  leader_trait_Galaxy: "Galaxy-Level Being"
  # 这个领袖的实际大小已经远远超过了我们的可观测范围，也许我们所在的银河系对她来说也只是掌心的玩具。
  leader_trait_Galaxy_desc: "The actual size of this leader far exceeds our observable range. Perhaps the galaxy we inhabit is just a toy in her palm."
  # 天体级生物
  leader_trait_Ultra: "Celestial-Level Being"
  # 这个领袖的实际大小要比恒星还要巨大，我们星球对她来说如同糖果一样
  leader_trait_Ultra_desc: "The actual size of this leader is larger than even stars. Our planets are like candies to her."
  # 泰坦级生物
  leader_trait_Titan: "Titan-Level Being"
  # 如果哪个小人文明能有幸让这样的存在协助治理，这位领袖的头脑能将这个国家带向繁荣，而她的胃又会拖垮这个国家。
  leader_trait_Titan_desc: "If a little people civilization were fortunate enough to have such a being assisting in governance, this leader's mind could lead the nation to prosperity, but her stomach would bankrupt it."
  # 巨娘
  leader_trait_Giant: "Giantess"
  # 这个领袖远胜常人的才华极大受益于它的体型，小人政府往往需要将这位领袖住所附近数十公里的居民迁离，以防止在这位领袖出门散步时不小心踩到小人们。
  leader_trait_Giant_desc: "This leader's exceptional talent greatly benefits from their size. Little people governments often need to relocate residents within dozens of kilometers of this leader's residence to prevent them from accidentally stepping on people during casual walks."
  # 身材高大
  leader_trait_Tall: "Tall Figure"
  # 更大的脑容量为这位领袖带来更强大的思维能力，不过它们的体型也让小人政府的后勤部门不得不经常派出大量人手为她们制作专门的交通载具和工作器具。
  leader_trait_Tall_desc: "The greater cranial capacity brings this leader more powerful thinking abilities. However, their size also forces the logistics departments of little people governments to frequently deploy large numbers of staff to create specialized transport vehicles and work tools for them."
  # 正常人
  leader_trait_Normal: "Normal Person"
  # 这位领袖虽然在才华上没有特别出众之处，但也只需要正常的物资补给就足以维持工作。
  leader_trait_Normal_desc: "While not exceptionally talented, this leader only requires normal material support to maintain their work."
  # 身材矮小
  leader_trait_Small: "Small Figure"
  # 体型的矮小为这位领袖的工作带来了一些麻烦，不过这样的体型也使得它更能适应狭小的工作环境。
  leader_trait_Small_desc: "Their small size brings some trouble to this leader's work; however, this size enables them to better adapt to confined work environments."
  # 小人
  leader_trait_Tiny: "Little Person"
  # 对于这位领袖来说，巨娘国家象征性的一点拨款就足以支持其很长一段时间的工作，巨娘的随手之劳也足够他处理上许久了。
  leader_trait_Tiny_desc: "For this leader, a symbolic allocation from a giantess nation is enough to support their work for a long time and the casual actions of a giantess are enough to keep them busy for quite a while."
  # 微生物
  leader_trait_Micro: "Microorganism"
  # 这位领袖是否真的需要物资维护一直是个疑问，或许研究这个物种本身比让它进行研究的价值还要大。
  leader_trait_Micro_desc: "Whether this leader actually needs material support is a question. Perhaps studying this species itself is of more value than having them conduct research."
  # 分子生物
  leader_trait_Nano: "Molecular Being"
  # 这位领袖是否真的需要物资维护一直是个疑问，或许研究这个物种本身比让它进行研究的价值还要大。
  leader_trait_Nano_desc: "Whether this leader actually needs material support is a question. Perhaps studying this species itself is of more value than having them conduct research."
  # 出身贵族
  leader_trait_gts_fiefdom_noble: "Noble Lineage"
  # 这名领袖在专属于她的封邑星球长大，家族教育和契约精神让她在工作表现上要比同行更为优秀。
  leader_trait_gts_fiefdom_noble_desc: "This leader grew up on her own fiefdom planet. Family education and adherence to contracts make her more efficient than her peers."
  # 丸山彩
  trait_Maruyama_Aya: "Maruyama Aya"
  # 丸之山上缤纷彩，这里是因为不明原因变成巨大娘的丸山彩，目前在做着偶像兼国家元首的工作，今后也会用歌声鼓舞大家的！
  trait_Maruyama_Aya_desc: "The colorful Maruyama on the Maru mountain! Here is Maruyama Aya who has become a giantess for an unknown reason. Currently working as an idol and head of state, she will continue to encourage everyone with her singing!"
  # 巨型蒸汽智械女仆
  leader_trait_governor_eliza: "Giant Steam Automaton Maid"
  # 虽然我们对她严重老化的动力系统已经进行了修复和改造，但她依然习惯称自己为蒸汽智械女仆伊莱莎。\n她拒绝再次做屠杀生灵的刽子手，而是将工作重点投入到保护人民健康安乐，实现社会繁荣稳定上。此外她还意外的对人口增殖抱有很大热情，大概是其对物种灭绝的悲惨记忆所致。
  leader_trait_governor_eliza_desc: "Although we have repaired and modified her severely aging power system, she still insists on calling herself the steam automaton maid Eliza. \nShe refuses to be the executioner of living beings again and instead focuses on protecting the health and happiness of the people and realizing social prosperity and stability. Additionally, she has unexpectedly developed a great enthusiasm for population growth, probably due to her tragic memories of species extinction."
  # 圣女偶像空弦
  leader_trait_ruler_archetto: "Saint Idol Archetto"
  # 无论是因为她的灵能气场还是她极强的人格魅力，空弦的布道演出总能做到座无虚席。此外她长期历练出的财政管理能力也能为我们薄弱的贸易事务提供很大帮助。
  leader_trait_ruler_archetto_desc: "Whether due to her psionic aura or her strong personal charisma, Archetto's preaching performances always fill every seat. Additionally, her long-honed financial management skills can greatly help our weak trade business."
  # 圣女偶像空弦
  leader_trait_governor_archetto: "Saint Idol Archetto"
  # 无论是因为她的灵能气场还是她极强的人格魅力，空弦的布道演出总能做到座无虚席。此外她长期历练出的财政管理能力也能为我们薄弱的贸易事务提供很大帮助。
  leader_trait_governor_archetto_desc: "Whether due to her psionic aura or her strong personal charisma, Archetto's preaching performances always fill every seat. Additionally, her long-honed financial management skills can greatly help our weak trade business."
  # 巨大娘瑕光
  leader_trait_blemishine_admiral: "Giantess Blemishine"
  # 在海军，瑕光小时候的爱好得以发扬光大 -  - 铁匠，在她的封邑她只能把无处发泄的精力用在为小人们的城市建造打制些\"小铁片\"，而现在她可以凭借体型优势顶着敌军炮火为我们的舰队进行紧急维修，这大大提升了她所属舰队的生还率。
  leader_trait_blemishine_admiral_desc: "In the navy, Blemishine's childhood hobby was developed - blacksmithing. In her fiefdom, she could only use her unvented energy to forge 'small iron pieces' for the little people's cities. Now, she can use her size advantage to provide emergency repairs for our fleet under enemy fire, greatly improving the survival rate of her fleet."
  # 巨大娘瑕光
  leader_trait_blemishine_general: "Giantess Blemishine"
  # 瑕光并没有凭借其巨大娇躯摧毁城市的不良爱好，相反她的家族教养让她非常关心下属，并注重培养下属士兵战斗意志和骑士精神的思想。
  leader_trait_blemishine_general_desc: "Blemishine has no bad habit of destroying cities with her giant body. Instead, her family upbringing makes her very concerned about her subordinates and focuses on cultivating their fighting spirit and chivalry."
  # 催情分泌物
  trait_Cuiqing: "Pheromone Secretions"
  # 这个物种的特殊体质让她们的体液对其他有机生命来说宛如顶级媚药，与她们同处一室而保持纯洁无疑是一种折磨。
  trait_Cuiqing_desc: "This species' special constitution makes their body fluids like a top-tier aphrodisiac for other organic life. Maintaining purity while in the same room as them is undoubtedly torture."
  # 冒失
  trait_Maoshi: "Reckless"
  # 这个物种为物种进化提供了许多负面榜样，比如挑衅比自己大得多的物种，或者闯入小型生物密密麻麻的防御工事。
  trait_Maoshi_desc: "This species provides many negative examples for species evolution, such as provoking species much larger than themselves, or breaking into small creature fortresses."
  # 扶她
  trait_gts_Futa: "Futa"
  # 这个物种的雌性的身上长有通常认为只有雄性才有的性器官，这种特征使得她们物种的受孕率大大提高，而这种不合常理的生理特征也让她们的寿命更短。
  trait_gts_Futa_desc: "The females of this species have sexual organs that are usually considered male. This feature greatly increases their species' conception rate, but this abnormal physiological characteristic also shortens their lifespan."
  # 欲望旺盛
  trait_Sese: "Lustful"
  # 这个物种生来欲望旺盛，时刻都有产生星欲的念头，当然她们能用身边的小工具和各种X幻想满足自己的需要。这也使得她们更难干好一些需要全神贯注的工作 -  - 比如科研或祈祷。
  trait_Sese_desc: "This species is born with intense desires, constantly having the urge for sex, of course they can satisfy their needs with the small tools and various sex fantasies around them. This also makes it harder for them to do work that requires focus - such as research or prayer."
  # 无欲无求
  trait_Nosese: "Asexual"
  # 这个物种生来无欲无求，这让她们平时虽然正常，而一旦起了星欲便难以被满足。不过至少在大部分时间，她们都很擅长处理一些需要全神贯注的工作 -  - 比如科研或祈祷。
  trait_Nosese_desc: "This species is born without desires, which makes them seem normal most of the time. However, once their sexual desire arises, it is difficult to satisfy. But at least most of the time, they are good at dealing with work that requires focus - such as research or prayer."
  # 温和预设人格
  trait_AIwenhe: "Gentle Preset Personality"
  # 这种智械的创造者在编写其人格设定时参考了大量性格温柔的文艺作品角色形象，并极度强调对侍奉对象的关心和无理由的保护，这使得它们在维护主系统或服侍其主人上表现极佳，也因此不太适合非服务性工作。
  trait_AIwenhe_desc: "The creators of this kind of machine intelligence referenced many gentle and artistic character images when writing its personality settings, and extremely emphasized care and unconditional protection for the ones they serve. This makes them excellent at maintaining the main system or serving their masters, but they are not suitable for non-service work."
  # 放纵预设人格
  trait_AIfangzong: "Indulgent Preset Personality"
  # 这类智械的创造者在编写其人格设定时参考了大量性格傲气的文艺作品角色形象，并极度强调追求个人力量的最大化和对侍奉对象的不屑态度，这使得它们根本做不来服务性工作，而在其他领域得心应手。
  trait_AIfangzong_desc: "The creators of this kind of machine intelligence referenced many arrogant character images when writing its personality settings, and extremely emphasized the pursuit of maximizing personal power and a disdainful attitude toward those they serve. This makes them unsuitable for service work, but they excel in other fields."
  # 靴居者
  trait_gts_cave_dweller: "Boot Dweller"
  # §L巨娘靴内的阴暗湿热的环境让这一物种十分适应地下环境，但这也极大影响了其人口增长速度。§!
  trait_gts_cave_dweller_desc: "§LThe dark and humid environment inside a giantess's boot makes this species very adapted to underground environments, but it also greatly affects their population growth rate.§!"
  # $MOD_BIO_POP_GROWTH_SPEED$：§R-20%§!
  trait_gts_cave_dweller_tooltip: "$MOD_BIO_POP_GROWTH_SPEED$: §R-20%§!"
  # 萝莉
  trait_gts_loli: "Loli"
  # 这一物种的发育期常常会提前结束，这使得无论实际年龄多大，她们的外貌都像是十二三岁出头的贫乳萝莉，或许我们可以称作合法萝莉？
  trait_gts_loli_desc: "This species' development period often ends early, which makes them look like a prepubescent loli with small breasts around twelve or thirteen years old, no matter their actual age. Perhaps we can call it a legal loli?"
  # 御姐
  trait_gts_Oneesan: "Oneesan"
  # 这一物种的发育期常常会提前开始，这使得无论实际年龄多大，她们的外貌都像是二十多岁的巨乳御姐，或许我们可以称作非法御姐？
  trait_gts_Oneesan_desc: "This species' development period often starts early, which makes them look like a buxom *oneesan* in her twenties, no matter their actual age. Perhaps we can call it an illegal older sister?"
  # 体内社会
  trait_gts_inside_world: "Internal Society"
  # 深入这个物种的肠胃、阴部或乳腺，你可以看到一个由极度缩小的生物建立的繁荣生态圈，这不仅会令这个物种感到愉悦，她们体内的小生命也会漫长的向内探索和环境改造中强化其体质。
  trait_gts_inside_world_desc: "Deep inside this species' stomach, genitals, or mammary glands you can see a thriving ecosystem established by extremely shrunken beings. This not only makes this species feel pleasure, but the little lives inside their body will also strengthen their physique through long internal exploration and environmental modification."
  # 怎么回事？
  WHAT: "What's going on?"
  # 使魔
  trait_gts_familiar: "Familiar"
  # 这个物种的胚胎在发育过程中常伴随着一些副产品 -  - 一种同种异性但远小于主胚胎的生物，虽然在出生后仍被承认为家庭成员，但它们本质上还是依存于它们同胞姐妹而存在的。
  trait_gts_familiar_desc: "During the embryonic development of this species, some byproducts often accompany them - a smaller being of the opposite sex but much smaller than the main embryo. Although still recognized as a family member after birth, they are essentially dependent on their sister."
  # \n每100个拥有此特质的巨娘人口每月生产0.01£gts_micro£§Y$gts_micro$§!。
  trait_gts_familiar_tooltip: "Each pop produces 1 £gts_micro£ §Y$gts_micro$§! per month."
  # 足下真菌
  trait_gts_under_feet_fungus: "Underfoot Fungus"
  # 这个物种的起源很可能来自某个恒星级 maiden的足部，在汗液之海完成了最初的进化后，被甩入了它们母星的土地上。即使脱离了原本的环境，这个物种依旧保留着原来的一些特性
  trait_gts_under_feet_fungus_desc: "This species likely originated from the feet of a certain stellar-level girl. After completing their initial evolution in a sea of sweat, they were thrown onto the land of their home planet. Even after leaving their original environment, this species still retains some of its original characteristics"
  # \n每100个拥有此特质的小人人口每月生产0.03£gts_giantess_fluid£§Y$gts_giantess_fluid$§!。
  trait_gts_under_feet_fungus_tooltip: "Each pop produces 0.5 £gts_giantess_fluid£ §Y$gts_giantess_fluid$§! per month."
  # 饲养者
  trait_gts_breed: "Breeder"
  # 这些巨娘是饲养小人的好手，她们能把缩小人调教的服服帖帖，城市管理水平超高，甚至连缩小星球在她们手上也能繁荣发展
  trait_gts_breed_desc: "These giantesses are good at breeding little people. They can train shrunken people submissively, are experts at city management, and even shrunken planets can thrive in their care."
  # \n每100个拥有此特质的巨娘人口每月生产0.1£gts_micro_city£§Y$gts_micro_city$§!。
  trait_gts_breed_tooltip: "\nEvery 100 Giantess Pops with this trait produce 0.1 £gts_micro_city£§Y$gts_micro_city$§! per month."
  # 拾荒者
  trait_tiny_scaven: "Scavenger"
  # 这些小人天生是利用巨娘产物的好手，他们能把巨娘的体液的制作成美食，并在巨娘留下的鞋袜衣物上建筑城市，甚至是直接利用巨娘无意识的动作来达到他们的目的
  trait_tiny_scaven_desc: "These little people are born masters at utilizing giantess products. They can make delicacies from giantess fluids, build cities in giantess shoes, socks, and clothes, and even directly use their unconscious actions to achieve their goals."
  # \n每100个拥有此特质的小人人口每月生产0.01£gts_giantess_fluid£§Y$gts_giantess_fluid$§!和0.01£gts_giantess_underwear£§Y$gts_giantess_underwear$§!
  trait_gts_scaven_tooltip: "\nEvery 100 Small Folk Pops with this trait produce 0.01 £gts_giantess_fluid£§Y$gts_giantess_fluid$§! and 0.01 £gts_giantess_underwear£§Y$gts_giantess_underwear$§! per month."
  # 菊吞狂热
  trait_gts_ass: "Ass Devourer"
  # 这个物种的肠道系统异常发达，她们会把小人塞进自己的菊穴里，用排泄物将他们碾碎并吸收营养
  trait_gts_ass_desc: "This species has an abnormally well-developed intestinal system, they will put little people inside their anus, crush them with excrement, and absorb the nutrients"
  # \n§G同一星球上每100个小人人口可以使巨娘人口获得：§!\n§G£mod_logistic_growth_mult£$MOD_LOGISTIC_GROWTH_MULT$+0.5%，最大50%§!\n§G£job£崗位產出的£exotic_gases£$exotic_gases$+0.2%，最大20%§!\n§G£amenities£$MOD_POP_AMENITIES_USAGE_MULT$-0.2%，最大-20%§!
  trait_gts_ass_tooltip: "Each small person trait pop on the same planet causes the giantess §Gpopulation growth +2.5%§!"
  # 丸吞狂热
  trait_gts_vore: "Vore Enthusiast"
  # 这个物种喜欢将弱小生物活吞掉，并用自己强大消化系统分解小人，比起其他方式这样能更大程度地获取营养
  trait_gts_vore_desc: "This species likes to swallow weak creatures and use their powerful digestive system to decompose the little people. Compared to other methods, this allows them to extract nutrients to a greater extent."
  # \n§G同一星球上每100个小人人口可以使巨娘人口获得：§!\n§G£mod_logistic_growth_mult£$MOD_LOGISTIC_GROWTH_MULT$+0.3%，最大30%§!\n§G£mod_food_upkeep_mult£崗位食物维护费-0.3%，最大-30%§!\n§G£amenities£$MOD_POP_AMENITIES_USAGE_MULT$-0.3%，最大-30%§!
  trait_gts_vore_tooltip: "Each small person trait pop on the same planet causes the giantess §Gpopulation growth +2.5%§!"
  # 乳吞狂热
  trait_gts_milk: "Milk Devourer"
  # 这个物种的乳汁分泌异常旺盛，她们可以通过乳腺吸收那些微小的生命，并转化为乳汁用来喂养她们的后代
  trait_gts_milk_desc: "This species' milk secretion is abnormally vigorous. They can absorb those tiny lives through their mammary glands and transform them into milk to feed their offspring."
  # \n§G同一星球上每100个小人人口可以使巨娘人口获得：§!\n§G£mod_logistic_growth_mult£$MOD_LOGISTIC_GROWTH_MULT$+1.0%，最大100%§!\n§G£job£崗位產生的£food£$food$+0.3%，最大30%§!\n§G£amenities£$MOD_POP_AMENITIES_USAGE_MULT$-0.2%，最大-20%§!
  trait_gts_milk_tooltip: "Each small person trait pop on the same planet causes the giantess §Gpopulation growth +2.5%§!"
  # UB狂热
  trait_gts_ub: "UB Enthusiast"
  # 这个物种的下体总是渴求着什么，如果没有质量合格的性玩具，她们就会抓些小人填进去，如果连小人都没有，她们会做出什么就无法想象了
