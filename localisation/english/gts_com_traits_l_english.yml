  # $leader_trait_gtsruler_picture$这位统治者享受被蝼蚁们崇拜的感觉，无数的缩小文明向她俯首称臣，把她奉为神明
  leader_trait_gtsruler_desc: ""$leader_trait_gtsruler_picture$This ruler relishes the feeling of being worshipped by the ants; countless miniature civilizations bow down before her and revere her as a deity.""
  # \n\n\n\n£leader_trait_gtsruler_picture£ \n\n\n\n\n
  leader_trait_gtsruler_picture: ""\n\n\n\n£leader_trait_gtsruler_picture£ \n\n\n\n\n""
  # 私人养殖业
  leader_trait_gtsfoster: ""Private Aquaculture""
  # 这位领袖的体表遍布小人，或供清理，或供娱乐，或供消耗
  leader_trait_gtsfoster_desc: ""This leader's body is covered with tiny persons, some for cleaning, some for entertainment, and some for consumption.""
  # 移动殖民地
  leader_trait_selfcolony: ""Mobile Colony""
  # 这位领袖就是一个人形的小人殖民地，渺小到肉眼不可见的微生物足迹遍布她的全身，对于这些微生物的观察洞见能够大大促进我们的相关研究
  leader_trait_selfcolony_desc: ""This leader is a human-shaped tiny person colony; her entire body is covered with traces of microorganisms so tiny they are invisible to the naked eye, and insights gained from observing these microorganisms can greatly advance our research in this field.""
  # 腟内星系
  leader_trait_galaxyinside: ""Intra-vaginal Galaxy""
  # 这位领袖的腟道中有着无数的微观文明存在，其中不乏控制区横跨几条皱褶的庞大帝国，而这位领袖本人也乐于养殖以观察这些文明
  leader_trait_galaxyinside_desc: ""The leader's vagina is home to countless microscopic civilizations, including vast empires whose territories span several folds, and the leader herself takes pleasure in cultivating these civilizations for observation.""
  # 体液收集者
  leader_trait_fluidcollector: ""Body Fluid Collector""
  # 这位领袖很擅长从各种地方收集出巨娘无意或有意留下的体液，无论是在巨娘蹂躏过的星球之上还是如同巨构般漂浮于太空种的鞋袜胖次之内。副作用则是这位领袖常常会被挥之不去的巨娘体香迷昏在工作岗位之上
  leader_trait_fluidcollector_desc: ""This leader is highly skilled at collecting bodily fluids that the Giantess has left behind - whether intentionally or unintentionally - from all sorts of places, ranging from planets she has ravaged to shoes, socks, and Panties floating in space like gigantic structures. The side effect is that this leader is often overcome by the lingering scent of Giantess and falls asleep on the job.""
  # 内衣清洗员
  leader_trait_underwearwasher: ""Lingerie Washer""
  # 这位领袖时常被多位巨娘强行要求清洗她们的随身衣物，包括但不限于山峦一般的鞋子、丝线交错的丝袜与常常湿润着的胖次。虽然这使得这位领袖经常在工作与巨娘的内衣间疲于奔命，但即使是这位领袖在清洗时悄悄留下的几缕丝线也足以满足我们的一部分消耗
  leader_trait_underwearwasher_desc: ""This leader is frequently forced by several Giantesses to wash their personal clothing, including but not limited to mountain-sized shoes, lace-patterned stockings, and Panties that are often damp. Although this often leaves the leader scrambling between work and the Giantesses' underwear, even the few strands of thread he secretly leaves behind while doing the laundry are enough to satisfy part of our consumption.""
  # 趾缝探索者
  leader_trait_toegapprobe: ""Toe-Crevice Explorer""
  # 多次被巨娘饲养在趾纹或鞋袜里的经历让这位领袖深谙于巨娘的足底构造，甚至能够在巨娘的脚下独自一人提取出数量可观的污垢、汗液等资源。
  leader_trait_toegapprobe_desc: ""Having been kept by the Giantess in her toe creases or shoes and socks on numerous occasions, this leader has gained a deep understanding of the structure of her soles - so much so that he is even able to single-handedly extract a considerable amount of dirt, Sweat, and other resources from beneath her feet.""
  # 巨娘控
  leader_trait_gtskeen: ""Giantess Fan""
  # 出于某些奇怪的原因，这位领袖是一位不折不扣的巨娘爱好者，经常在工作之余幻想起被巨娘踩在脚下或塞进穴中的快感。并且，如果这位领袖真的遇见了某位巨娘的话，大概会立刻扑上去原地发电的吧
  leader_trait_gtskeen_desc: ""For some strange reason, this leader is a die-hard Giantess fan who often fantasizes, in his spare time, about the thrill of being trampled under a Giantess's feet or penetrated by her. And if this leader ever actually encountered a Giantess, he'd probably pounce on her right then and there and start getting busy.""
  # 微尘抗争者
  leader_trait_dirtfighter: ""The Dust-Sized Resister""
  # $leader_trait_dirtfighter_picture$在多次合理或被迫地与巨娘进行了\"演习\"之后，这位领袖已经对体型差距之间的战斗形式了如指掌。凭藉自身与舰队微小的优势，这位领袖能够渗透进入舰娘们的私处或脚心扰乱她们的作战意志，同时灵活地躲避巨足的践踏或呼啸而来的手掌，直至敌方的舰娘单位在忍无可忍之后一气之下离开
  leader_trait_dirtfighter_desc: ""$leader_trait_dirtfighter_picture$After numerous \"drills\" - whether voluntary or forced - against the Giantesses, this leader has become thoroughly familiar with combat tactics involving such a vast size disparity. Capitalizing on his own slight advantage - and that of his fleet - this leader is able to infiltrate the shipgirls' private parts or the soles of their feet to disrupt their combat resolve, all while nimbly dodging the trampling of giant feet or the whirling palms, until the enemy shipgirls, having reached their limit, storm off in a fit of rage.""
  # \n\n\n\n£leader_trait_dirtfighter_picture£ \n\n\n\n\n
  leader_trait_dirtfighter_picture: ""\n\n\n\n£leader_trait_dirtfighter_picture£ \n\n\n\n\n""
  # 巨娘潜力
  leader_trait_gtspotential: ""Giantess Potential""
  # $leader_trait_gtspotential_picture$这位领袖极其幸运地获得了某位灵能巨娘 maiden的赐福，使得她也可以在任意的一小段时间中化为与巨娘同等体型的伟岸存在。这不仅仅意味着她能够完成一些平常难以完成的工作，甚至还在这片星域里建立了效果显著的压迫感，尤其是在这位领袖决定变身巨娘的那一刻
  leader_trait_gtspotential_desc: ""$leader_trait_gtspotential_picture$This leader was extremely fortunate to receive the blessing of a certain Psionic Energy Giantess, allowing her to transform into a towering being the same size as a Giantess for brief moments. This not only means she can accomplish tasks that would otherwise be difficult, but she has also established a significant sense of intimidation throughout this star system - especially the moment this leader decides to transform into a Giantess.""
  # \n\n\n\n£leader_trait_gtspotential_picture£ \n\n\n\n\n
  leader_trait_gtspotential_picture: ""\n\n\n\n£leader_trait_gtspotential_picture£ \n\n\n\n\n""
  # 巨娘至交
  leader_trait_gtsconfidant: ""Giantess's Best Friend""
  # $leader_trait_gtsconfidant_picture$这位领袖与一位温柔的巨娘成为了十分亲密的好友，她所乘坐的科研船旁边时常会跟随着一位体型远远大于科研船本身的巨娘 maiden，并及时体贴地为这位领袖用小行星一般的丝足扫清障碍。不过，如果遇到巨娘 maiden性欲大发的时候，这位领袖与科研船本身也难以逃过被整个塞进穴中搅弄一番的下场
  leader_trait_gtsconfidant_desc: ""$leader_trait_gtsconfidant_picture$This leader has become very close friends with a gentle Giantess. A Giantess girl - whose size far exceeds that of the research vessel itself - often follows alongside the ship, promptly and thoughtfully clearing obstacles for the leader with her silken legs, which are as thick as asteroids. However, whenever the Giantess's sexual urges run high, neither the leader nor the research vessel itself can escape the fate of being shoved whole into her orifice and thoroughly stirred up.""
  # \n\n\n\n£leader_trait_gtsconfidant_picture£ \n\n\n\n\n
  leader_trait_gtsconfidant_picture: ""\n\n\n\n£leader_trait_gtsconfidant_picture£ \n\n\n\n\n""
  # 蜉蝣探索者
  leader_trait_mayflyprobe: ""Mayfly Explorer""
  # $leader_trait_mayflyprobe_picture$这位领袖在历经多次探索与遇险之后，已经精通于如何利用微小的体型更安全地探索这个并不安全的宇宙。无论是被巨娘蹂躏到一塌糊涂的星球还是横挡在科研船前方的天体级鞋袜，这位领袖都能够近乎完美地妥善脱身
  leader_trait_mayflyprobe_desc: ""$leader_trait_mayflyprobe_picture$After numerous explorations and perilous encounters, this leader has mastered the art of using their tiny size to explore this dangerous universe more safely. Whether it's a planet ravaged beyond recognition by a Giantess or celestial-scale shoes and socks blocking the path of a research vessel, this leader is able to extricate themselves from such situations with near-perfect skill.""
  # \n\n\n\n£leader_trait_mayflyprobe_picture£ \n\n\n\n\n
  leader_trait_mayflyprobe_picture: ""\n\n\n\n£leader_trait_mayflyprobe_picture£ \n\n\n\n\n""
  # 胖次行星
  leader_trait_pantyplanet: ""Planet Panties""
  # $leader_trait_pantyplanet_picture$这位领袖曾经将一整颗行星塞进了她那天体级的胖次深处，并迫使数百亿可怜的微生物们成为了她胯下私处的阴虱，终日奔忙于 maiden横跨数片大陆的阴道褶皱中。
  leader_trait_pantyplanet_desc: ""$leader_trait_pantyplanet_picture$This leader once stuffed an entire planet deep into her celestial-sized Panties and forced tens of billions of poor microorganisms to become pubic lice in her crotch, where they spent their days scurrying through the vaginal folds of a young girl that spanned several continents.""
  # \n\n\n\n£leader_trait_pantyplanet_picture£ \n\n\n\n\n
  leader_trait_pantyplanet_picture: ""\n\n\n\n£leader_trait_pantyplanet_picture£ \n\n\n\n\n""
  # 足下星系
  leader_trait_system_underfoot: ""The Galaxies at Our Feet""
  # $leader_trait_system_underfoot_picture$这位领袖曾经在一次巨大化时碾碎了一整座恒星系，直至如今她的趾窝深处还残留着那颗凄惨的恒星与行星们的残骸。这将为我们的敌人们带去无与伦比的威慑力、也使我们的国民完全团结在了 maiden那遮天蔽日的足趾之下。
  leader_trait_system_underfoot_desc: ""$leader_trait_system_underfoot_picture$This leader once crushed an entire star system while in her giant form, and to this day, the remains of that wretched star and its planets still linger deep within the crevices of her toes. This will serve as an unparalleled deterrent to our enemies and will unite our people completely beneath the young woman's sky-obscuring toes.""
  # \n\n\n\n£leader_trait_system_underfoot_picture£ \n\n\n\n\n
  leader_trait_system_underfoot_picture: ""\n\n\n\n£leader_trait_system_underfoot_picture£ \n\n\n\n\n""
  # 神明降临
  leader_trait_avatar_back: ""The Descent of the Gods""
  # $leader_trait_avatar_back_picture$这位领袖在成为宇宙级巨娘之后又一次降临了这片宇宙，并以数百颗恒星为陪葬的代价将我们的一个目标恒星系完全蹂躏在了足下。毫无疑问，这对于星系中其他帝国的威慑力和对我们的公民的团结力是难以想象的。尤其是、无论是我们还是其他帝国都很清楚：她很有可能再次回应我们的祈求与召唤、重新降临而来......
  leader_trait_avatar_back_desc: ""$leader_trait_avatar_back_picture$This leader has once again descended upon this universe after becoming a cosmic-level Giantess, and at the cost of hundreds of stars as her funeral offerings, she has completely trampled one of our target star systems underfoot. Undoubtedly, this has had an unimaginable deterrent effect on other empires in the galaxy and has strengthened the unity of our citizens. Above all, both we and the other empires are well aware that she will most likely answer our prayers and summons once again and return...""
  # \n\n\n\n£leader_trait_avatar_back_picture£ \n\n\n\n\n
  leader_trait_avatar_back_picture: ""\n\n\n\n£leader_trait_avatar_back_picture£ \n\n\n\n\n""
  # 靴中舰队
  leader_trait_battleship_inshoe: ""The Fleet in the Boots""
  # $leader_trait_battleship_inshoe_picture$这位领袖曾经将一支遮天蔽日的舰队捕捉到了她的靴子深处，就像是饲养着一群微生物足虫一般饲养着那支舰队。直至如今，那些破破烂烂的小船们还在这位领袖的丝足之下辛勤地在足垢大陆与丝线交错的袜尖中清理着每时每刻都在分泌着的足垢与汗液 
  leader_trait_battleship_inshoe_desc: ""$leader_trait_battleship_inshoe_picture$This leader once trapped a fleet so vast it could obscure the sky deep within her boot, raising that fleet as if it were a colony of microscopic footworms. To this day, those tattered little ships still toil beneath this leader's silky feet, diligently cleaning away the foot grime and sweat that are constantly secreted on the continent of foot grime and within the silk-thread-woven tips of her socks. ""
  # \n\n\n\n£leader_trait_battleship_inshoe_picture£ \n\n\n\n\n
  leader_trait_battleship_inshoe_picture: ""\n\n\n\n£leader_trait_battleship_inshoe_picture£ \n\n\n\n\n""
