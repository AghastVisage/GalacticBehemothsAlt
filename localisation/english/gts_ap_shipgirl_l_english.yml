#  刚刚从海军学校毕业的舰娘们所穿的学校制服，从里到外都透着少女的芬芳。
  GTS_ARKSHIP_A_BARRIER_GTS_DESC: "The school uniform worn by Shipgirls who have just graduated from naval academy, exuding the fragrance of youth from head to toe."
#  军官礼服
  GTS_ARKSHIP_B_BARRIER_GTS: "Officer Dress Uniform"
#  舰娘们在庆功晚宴上所穿的礼服，在胸前挂着（或粘着）代表其战功的敌舰残骸。
  GTS_ARKSHIP_B_BARRIER_GTS_DESC: "The dress uniform worn by Shipgirls at victory banquets, with enemy ship wreckage representing their achievements hanging (or stuck) on their chests."
#  誓约婚纱
  GTS_ARKSHIP_C_BARRIER_GTS: "Vow Wedding Dress"
#  舰娘们在与她们心仪之人誓约时所穿的婚纱，体型和种族的差距不是阻拦爱情的理由，在这一刻她们与普通的少女无异。
  GTS_ARKSHIP_C_BARRIER_GTS_DESC: "The wedding dress worn by Shipgirls when vowing with their beloved. Differences in size and species are not reasons to stop love; in this moment, they are no different from ordinary maidens."
#  蓝白胖次
  GTS_ARKSHIP_ARMOR_GTS: "Blue and White Panties"
#  大部分舰娘所选择的最为经典的内裤类型，在出击时舰娘们常常会准备多条以在战斗结束后及时更换变脏或破损的胖次。
  GTS_ARKSHIP_ARMOR_GTS_DESC: "The most classic type of underwear chosen by most Shipgirls. When sortieing, they often prepare multiple pairs to replace soiled or damaged panties after battle."
#  安全裤
  GTS_ARKSHIP_DRAGON_ARMOR_GTS: "Safety Shorts"
#  一些害羞或重视礼节的舰娘们会准备安全裤替代胖次以避免在海战中走光（虽然理论上小人的舰船可以钻进她们身体的任何地方就是了）。
  GTS_ARKSHIP_DRAGON_ARMOR_GTS_DESC: "Some shy or etiquette-conscious Shipgirls will prepare safety shorts instead of panties to avoid revealing too much during naval battles (although in theory, tiny people's ships can enter anywhere in their bodies)."
#  蕾丝内裤
  GTS_ARKSHIP_CRYSTAL_ARMOR_GTS: "Lace Panties"
#  一些欲望旺盛或心大的舰娘会选择更加激进的方案，比如蕾丝胖次，传说会有舰娘会把自己俘获的敌舰和船员塞进胖次里寻求刺激。
  GTS_ARKSHIP_CRYSTAL_ARMOR_GTS_DESC: "Some Shipgirls with high desires or bold personalities choose more radical options, such as lace panties. Legend has it that some Shipgirls stuff captured enemy ships and crew into their panties for thrills."
