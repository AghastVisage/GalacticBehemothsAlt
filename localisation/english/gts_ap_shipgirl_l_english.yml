  SPECIAL_GTS_REACTOR: "\"Enhanced Biological Reactor\""
  # Original: 该个体通过自体分泌的胃酸就可以轻松消化掉绝大多数吞入的物质并将其转化为能量，巨娘身边途径的白矮星也只是比较顶饱的小零食。
  SPECIAL_GTS_REACTOR_DESC: "This individual can easily digest most ingested matter and convert it into energy through self-secreted stomach acid. Even a white dwarf passing by a Giantess is just a filling snack."
  # Original: 自恢复舰体
  AUTO_REPAIR_GTS_SPECIAL: "Self-Repairing Hull"
  # Original: 也许在舔一舔伤口的想法出现前，伤口就愈合了。
  AUTO_REPAIR_GTS_SPECIAL_DESC: "Perhaps the wound heals before the thought of licking it even appears."
  #  驅逐艦艦娘可以有效攔截敵方的小型艦艇，有著這個體型下不可思議的機動性。
  #  驱逐舰舰娘可以有效拦截敌方的小型舰艇，有着这个体型下不可思议的机动性。
  SHIP_GRAPHICS_GTS_DESTROYER_SHIP_DESC: "Destroyer Shipgirls can effectively intercept small enemy vessels, possessing incredible maneuverability for their size."
  #  战列舰舰娘火力强大，是舰队的中坚力量，据说一次主炮的齐射就能轻易毁灭一片通常舰队。
  SHIP_GRAPHICS_GTS_BATTLESHIP_SHIP_DESC: "Battleship Shipgirls possess powerful firepower and are the core of the fleet. It is said that a single main battery salvo can easily destroy an entire conventional fleet."
  #  泰坦舰娘是移动的堡垒，拥有最强的火力，但是移动缓慢，行星在她们的面前与纸糊也无区别。
  SHIP_GRAPHICS_GTS_TITAN_SHIP_DESC: "Titan Shipgirls are mobile fortresses possessing the strongest firepower, but they move slowly. In their presence, planets are no different from paper."
