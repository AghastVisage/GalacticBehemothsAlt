#  虽然毫无关系，但这个舰载机常常被飞行员们简称为海轰，希望这个在工业时代象征着无敌的名字能为他们的战斗带来祝福。
  sm_gts_arkship_strike_craft_1_DESC: "Although unrelated, pilots often refer to this strike craft as the 'Sea Bomber' (海轰), hoping that this name, which symbolized invincibility in the industrial age, will bring blessings to their battles."
