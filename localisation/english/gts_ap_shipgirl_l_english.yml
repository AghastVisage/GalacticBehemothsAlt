#  这一防空武器的制作理念据说来源于数万年前的失传科技，单发伤害奇高，但极其容易过载，因此能灵活使用这门武器的操作员都被认为是极度虔诚而蒙受上天庇护之人。
  sm_gts_arkship_pd_battery_DESC: "The design concept of this anti-aircraft weapon is said to originate from a long-lost technology from tens of thousands of years ago. Its single-shot damage is extremely high, but it is prone to overloading. Therefore, operators who can skillfully wield this weapon are considered extremely devout and blessed by the heavens."
